commonTitle: Commun de la Dédicace en dehors de l’église consacrée

celebration:
  color: white

firstVespers:
  hymn:
    - voici-la-demeure-de-dieu
    - urbs-jerusalem-beata
  psalmody:
    - psalm: PSALM_146
      antiphon:
        - |-
          Les portes de Jérusalem retentiront de chants de joie ! Et ses demeures diront : Gloire à toi !
    - psalm: PSALM_147
      antiphon:
        - Dieu a consolidé les barres de tes portes, dans tes murs il a béni tes enfants.
    - psalm: NT_2
      antiphon:
        - Exultent les élus dans la maison de Dieu, alléluia ! Et chantent les anges devant son trône, alléluia !
  reading:
    biblicalReference: Ep 2, 19-22
    content: Vous n’êtes plus des étrangers ni des gens de passage, vous êtes citoyens du peuple  saint, membres de la famille de Dieu, car vous avez été intégrés dans la construction  qui a pour fondations les Apôtres et les prophètes ; et la pierre angulaire, c’est  le Christ Jésus lui-même. En lui, toute la construction s’élève harmonieusement pour  devenir un temple saint dans le Seigneur. En lui, vous êtes, vous aussi, des éléments  de la construction pour devenir par l’Esprit Saint la demeure de Dieu.
  responsory: |-
    R/ Vous êtes le temple de Dieu :
    * L’Esprit de Dieu habite en vous.
    V/ Tout vous appartient, la vie et la mort,
    le présent et l’avenir. *
    V/ Vous êtes au Christ,
    et le Christ est à Dieu. R/
  evangelicAntiphon:
    common: Réjouis-toi, Jérusalem ! Vous qui l’aimez, rassemblez-vous ! Exultez de sa joie !
  intercession:
    content: |-
      Tu as donné ta vie, Seigneur Jésus, pour rassembler en un seul peuple tous les enfants de Dieu dispersés ;
      aujourd’hui nous te prions pour ton Église que défigurent nos divisions :

      R/ Seigneur, rassemble-nous dans la paix de ton amour !

      Tu as bâti ton Église sur le Roc ;
      — donne-lui de demeurer inébranlable dans la foi pour proclamer ton nom.

      L’eau et le sang ont coulé de ton côté ouvert par la lance ;
      — renouvelle ton Église à la fontaine du baptême et par la coupe du salut.

      Tu as promis d’être au milieu de ceux qui sont réunis en ton nom ;
      — exauce la prière de ta famille.

      En ceux qui t’aiment, tu choisis d’établir ta demeure :
      — que l’Esprit de charité fasse grandir ton Église.

      Jamais tu ne rejettes celui qui vient vers toi ;
      — reçois tous les défunts dans la maison du Père.

invitatory:
  antiphon:
    - Dans la maison de Dieu, adorons le Christ, époux de l’Église.

readings:
  hymn:
    - jesus-christ-pierre-angulaire
    - urbs-jerusalem-beata
  psalmody:
    - psalm: PSALM_23
      antiphon:
        - |-
          Portes, levez vos frontons, élevez-les, portes éternelles : qu’il entre, le Roi de gloire !
    - psalm: PSALM_83
      antiphon:
        - Heureux les habitants de ta maison, ils pourront te chanter encore.
    - psalm: PSALM_86
      antiphon:
        - Cité sainte, notre Mère, tu descends du ciel et d’auprès de Dieu.
  verse: |-
    V/ Vers ton temple saint, je me prosterne,
    je crains et j’adore.
  biblicalReading:
    - title: LECTURE DE LA 1^ère LETTRE DE PIERRE
      subtitle: La pierre vivante et la nation sainte
      ref: 1P 2, 1-17
      content: |-
        Approchez-vous de lui : il est %la pierre vivante rejetée par les hommes,% mais choisie et précieuse devant Dieu. Vous aussi, comme pierres vivantes, entrez dans la construction de la demeure spirituelle, pour devenir le sacerdoce saint et présenter des sacrifices spirituels, agréables à Dieu, par Jésus Christ. En effet, il y a ceci dans l’Écriture : %Je vais poser en Sion une pierre angulaire, une pierre choisie, précieuse ; celui qui met en elle sa foi ne saurait connaître la honte.%
        Ainsi donc, honneur à vous les croyants, mais, pour ceux qui refusent de croire, il est écrit : %La pierre qu’ont rejetée les bâtisseurs est devenue la pierre d’angle, une pierre d’achoppement, un rocher sur lequel on trébuche.% Ils achoppent, ceux qui refusent d’obéir à la Parole, et c’est bien ce qui devait leur arriver. Mais vous, vous êtes une descendance choisie, un sacerdoce royal, une nation sainte, un peuple destiné au salut, pour que vous annonciez les merveilles de celui qui vous a appelés des ténèbres à son admirable lumière. Autrefois %vous n’étiez pas un peuple,% mais maintenant vous êtes le peuple de Dieu ; %vous n’aviez pas obtenu miséricorde,% mais maintenant vous avez obtenu miséricorde.
        Bien-aimés, puisque vous êtes comme des étrangers résidents ou de passage, je vous exhorte à vous abstenir des convoitises nées de la chair, qui combattent contre l’âme. Ayez une belle conduite parmi les gens des nations ; ainsi, sur le point même où ils disent du mal de vous en vous traitant de malfaiteurs, ils ouvriront les yeux devant vos belles actions et rendront gloire à Dieu, %le jour de sa visite.%
        Soyez soumis à toute institution humaine à cause du Seigneur, soit à l’empereur, qui est le souverain, soit aux gouverneurs, qui sont ses délégués pour punir les malfaiteurs et reconnaître les mérites des gens de bien. Car la volonté de Dieu, c’est qu’en faisant le bien, vous fermiez la bouche aux insensés qui parlent sans savoir. Soyez des hommes libres, sans toutefois utiliser la liberté pour voiler votre méchanceté : mais soyez plutôt les esclaves de Dieu. Honorez tout le monde, aimez la communauté des frères, craignez Dieu, honorez l’empereur.
      responsory: |-
        Vous êtes un peuple acquis pour annoncer les louanges
        de celui qui vous a appelés des ténèbres
        à son admirable lumière.
  patristicReading:
    - title: HOMÉLIE D’ORIGÈNE SUR LE NOM DE JOSUÉ
      subtitle: Les chrétiens, pierres vivantes
      content: |-
        Nous tous qui croyons en Jésus Christ, nous sommes appelés des %pierres vivantes%, selon les paroles de l’Écriture : %Vous aussi, soyez les pierres vivantes qui servent à construire le Temple spirituel, et vous serez le sacerdoce saint présentant des offrandes spirituelles que Dieu pourra accepter à cause du Christ Jésus%.
        Quand il s’agit de pierres de construction, nous savons qu’on veille à placer en premier dans les fondations les pierres les plus solides et les plus résistantes pour qu’on puisse leur confier et leur superposer le poids de l’édifice entier. ~ S’il s’agit de pierres vivantes, quelles sont les pierres placées dans les fondations ? Ce sont les Apôtres et les prophètes, suivant l’enseignement de saint Paul : %Vous avez été intégrés dans la construction qui a pour fondations les Apôtres et les prophètes ; et la pierre angulaire, c’est le Christ Jésus%, notre Seigneur.
        Pour vous préparer plus activement, vous qui m’écoutez, à la construction de cet édifice, pour être une des pierres les plus voisines du fondement, vous devez savoir que c’est le Christ lui-même qui est le fondement de cet édifice que nous décrivons. Ainsi l’affirme l’Apôtre Paul : %Les fondations, personne ne peut en poser d’autre que celles qui existent déjà : ces fondations, c’est Jésus Christ%. Heureux donc, ceux qui ont bâti des édifices saints sur un fondement aussi noble !
        Mais, dans cet édifice qu’est l’Église, il faut aussi un autel. Aussi, je crois que tous ceux qui parmi vous, comme des %pierres vivantes%, sont capables de le devenir et sont résolus à vaquer à la prière, à offrir à Dieu nuit et jour leurs implorations et à immoler les victimes de leurs supplications, c’est avec eux que Jésus bâtit son autel.
        Considérez pourtant quel genre d’éloges on décerne aux pierres de l’autel. %Comme l’avait prescrit Moïse%, le législateur, dit l’Écriture, %on construisit l’autel de pierres intactes que le fer n’avait pas touchées%. Que représentent ces %pierres intactes% ? ~ Ces pierres intactes et sans souillures pourraient être les saints Apôtres, qui ne forment tous qu’un seul autel, à cause de l’union de leurs âmes et de leurs cœurs. On nous rapporte, en effet, que %d’un seul cœur ils participaient à la prière%, et qu’en prenant la parole, ils disaient : %Toi, Seigneur, tu connais le cœur de tous les hommes%.
        Eux donc, qui pouvaient prier d’un seul cœur, d’une seule voix et d’un seul esprit, sont bien dignes d’avoir à construire ensemble un autel unique, sur lequel Jésus offre le sacrifice à son Père.
        Mais nous aussi, de notre côté, devons nous efforcer %d’avoir tous un même langage, le même amour, les mêmes sentiments, de n’être jamais intrigants ni vantards, d’être en parfaite harmonie de pensées et de sentiments%, afin d’essayer, nous aussi, de devenir des pierres pour l’autel.
      responsory: |-
        Mon cœur et ma chair sont un cri
        vers le Dieu vivant !

        Voici la demeure de Dieu avec les hommes :
        il demeurera avec eux.

        De quel amour j’aime ta demeure,
        Dieu de l’univers !
    - title: SERMON DE SAINT AUGUSTIN POUR UNE DÉDICACE
      subtitle: « Le temple de Dieu, c’est vous »
      content: |-
        La solennité qui nous réunit est la dédicace d’une maison de prière. La maison de nos prières, nous y sommes ; la maison de Dieu, c’est nous-mêmes. Si la maison de Dieu, c’est nous-mêmes, nous sommes construits en ce monde, pour être consacrés à la fin du monde. L’édifice, ou plutôt sa construction, se fait dans la peine ; la dédicace se fait dans la joie.
        Ce qui se passait, quand s’élevait cet édifice, c’est ce qui se passe maintenant quand se réunissent ceux qui croient au Christ. Lorsque l’on croit, c’est comme lorsque l’on coupe du bois dans la forêt et que l’on taille des pierres dans la montagne ; lorsque les croyants sont catéchisés, baptisés, formés, c’est comme s’ils étaient sciés, ajustés, rabotés par le travail des charpentiers et des bâtisseurs.
        Cependant, on ne fait la maison de Dieu que lorsque la charité vient tout assembler. Si ce bois et cette pierre n’étaient pas réunis selon un certain plan, s’ils ne s’entrelaçaient pas de façon pacifique, s’ils ne s’aimaient pas, en quelque sorte, par cet assemblage, personne ne pourrait entrer ici. Enfin, quand tu vois dans un édifice les pierres et le bois bien assemblés, tu entres sans crainte, tu ne redoutes pas qu’il s’écroule.
        Le Christ Seigneur, parce qu’il voulait entrer et habiter en nous, disait, comme pour former son édifice : %Je vous donne un commandement nouveau, c’est que vous vous aimiez les uns les autres. C’est un commandement%, dit-il, %que je vous donne%. Vous étiez vieux, vous n’étiez pas une maison pour moi, vous étiez gisants, écroulés. Donc, pour sortir de votre ancien état, de votre ruine, aimez-vous les uns les autres.
        Que votre charité considère encore ceci : cette maison est édifiée, comme il a été prédit et promis, dans le monde entier. En effet, quand on construisait la maison de Dieu après la captivité, on disait dans un psaume : %Chantez au Seigneur un chant nouveau ; chantez au Seigneur, terre entière%. On disait alors : %un chant nouveau% ; le Seigneur a dit : %un commandement nouveau%. Qu’est-ce qui caractérise le chant nouveau, sinon un amour nouveau ? Chantez est le fait de celui qui aime. Ce qui permet de chanter, c’est la ferveur d’un saint amour.
        Ce que nous voyons réalisé ici physiquement avec les murs doit se réaliser spirituellement avec les âmes ; ce que nous regardons ici accompli avec des pierres et du bois, doit s’accomplir dans vos corps, avec la grâce de Dieu.
        Rendons grâce avant tout au Seigneur notre Dieu : les dons les meilleurs, les présents merveilleux viennent de lui. Célébrons sa bonté de tout élan de notre cœur. Pour que soit construite cette maison de prière, il a éclairé les âmes de ses fidèles, il a éveillé leur ardeur, il leur a procuré de l’aide ; à ceux qui n’étaient pas encore décidés, il a inspiré la décision ; il a secondé les efforts de bonne volonté pour les faire aboutir. Et ainsi Dieu, %qui produit% chez les siens %la volonté et l’achèvement parce qu’il veut notre bien%, c’est lui qui a commencé tout cela, et c’est lui qui l’a achevé.
      responsory: |-
        R/ Approchons-nous de la pierre vivante,
        rejetée par les hommes, mais choisie par Dieu.

        Montez à la montagne et rebâtissez ma maison,
        dit le Seigneur,
        j’y trouverai ma joie et ma gloire.

        La gloire future de ce temple dépassera l’ancienne,
        et dans ce lieu je donnerai la paix.

        Vous-mêmes, comme pierres vivantes,
        entrez dans la construction de l’édifice spirituel.

morning:
  hymn:
    - dieu-s-est-prepare-une-demeure
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - Ma maison, dit le Seigneur, est la maison de la prière.
    - psalm: OT_41
      antiphon:
        - Béni sois-tu, Seigneur, dans ton saint temple de gloire.
    - psalm: PSALM_149
      antiphon:
        - Louez Dieu dans l’assemblée de ses fidèles.
  reading:
    biblicalReference: Is 56, 7
    content: Je les conduirai à ma montagne sainte. Je les rendrai heureux dans ma maison de  prière, je ferai bon accueil, sur mon autel, à leurs holocaustes et à leurs sacrifices,  car ma maison s’appellera « Maison de prière pour tous les peuples ».
  responsory: |-
    R/ Heureux les habitants de ta maison, Seigneur !
    V/ Des chemins s’ouvrent dans leur cœur. R/
    V/ Ils vont de hauteur en hauteur
    vers les demeures du Très-Haut. R/
  evangelicAntiphon:
    common:
      - Aujourd’hui le Seigneur veut demeurer chez toi ; avec lui le salut est entré dans cette maison.
  intercession:
    content: |-
      Confions-nous aux promesses du Christ et prions pour l’Église :

      Temple fondé sur le Christ, la pierre angulaire,
      Peuple qui met en lui sa foi :

      R/ Voici la demeure de Dieu chez les hommes !

      Vigne plantée et protégée par le Père,
      Peuple qui porte un fruit de vie :

      Troupeau rassemblé par l’unique Pasteur,
      Peuple qui écoute sa voix :

      Terre ensemencée par la Parole,
      Peuple que moissonne le Père :

      Cité de Dieu, Jérusalem d’en-haut,
      Peuple invité au festin des noces :

middleOfDay:
  tierce:
    antiphon: Vous êtes le temple de Dieu, la maison qu’il construit.
    reading:
      biblicalReference: 1 Co 3, 16-17
      content: N’oubliez pas que vous êtes le temple de Dieu et que l’Esprit de Dieu habite en  vous. Si quelqu’un détruit le temple de Dieu, Dieu le détruira ; car le temple de  Dieu est sacré, et ce temple, c’est vous.
    responsory: |-
      V/ Seigneur, j’aime la maison que tu habites,
      le lieu où demeure ta gloire.
  sexte:
    antiphon: La sainteté emplit ta maison, ô Seigneur, pour la suite des temps.
    reading:
      biblicalReference: 2 Co 6, 16b
      content: |-
        Nous sommes, nous, le temple du Dieu vivant, comme Dieu l’a dit : Au milieu d’eux, j’habiterai et je marcherai, je serai leur Dieu et ils seront mon peuple.
    responsory: |-
      V/ Appelez le bonheur sur Jérusalem :
      paix à ceux qui t’aiment !
  none:
    antiphon: |-
      Voici la demeure de Dieu, voici l’Église du Seigneur : elle est bâtie sur le roc.
    reading:
      biblicalReference: Jr 7, 2b.4-5a.7a
      content: |-
        Ecoutez la parole du Seigneur, vous tous qui entrez par ces portes pour adorer le Seigneur. Ne vous fiez pas à des paroles trompeuses comme celles-ci : « C’est ici  le temple du Seigneur, le temple du Seigneur, le temple du Seigneur ! » Si vous suivez  vraiment la bonne route, si vous vous conduisez bien, alors j’habiterai avec vous  dans ce lieu.
    responsory: |-
      V/ Venez dans sa maison lui rendre grâce,
      dans sa demeure chanter ses louanges.

vespers:
  hymn:
    - voici-la-demeure-de-dieu
    - urbs-jerusalem-beata
  psalmody:
    - psalm: PSALM_45
      antiphon:
        - Sainte est la demeure du Très-Haut, la maison de Dieu chez les hommes.
    - psalm: PSALM_121
      antiphon:
        - Nous irons, pleins de joie, à la maison du Seigneur.
    - psalm: NT_12
      antiphon:
        - Église de Dieu, Épouse de l’Agneau, célèbre ton Seigneur, alléluia.
  reading:
    biblicalReference: Ap 21, 2-3.22-27
    content: |-
      J’ai vu descendre du ciel, d’auprès de Dieu, la cité sainte, la Jérusalem nouvelle,  toute prête, comme une fiancée parée pour son époux. Et j’ai entendu la voix puissante  qui venait du Trône divin ; elle disait : « Voici la demeure de Dieu avec les hommes ; il demeurera avec eux, et ils seront son peuple, Dieu lui-même sera avec eux. Dans  la cité, je n’ai pas vu de temple, car son Temple, c’est le Seigneur, le Dieu tout-puissant,  et l’Agneau. La cité n’a pas besoin de la lumière du soleil ni de la lune, car la  gloire de Dieu l’illumine, et sa source de lumière, c’est l’Agneau. Les nations marcheront  à sa lumière, et les rois de la terre apporteront ce qui fait leur gloire. Les portes  ne se fermeront pas tant qu’il fera jour ; or il n’y fera plus jamais nuit. On apportera  dans la cité ce qui fait la gloire et le prestige des nations. Il n’y entrera jamais  rien de souillé, ni personne qui commette abomination ou mensonge, mais seulement  ceux qui sont inscrits dans le livre de vie de l’Agneau.
  responsory: |-
    R/ Ton Dieu sera ta beauté, ta lumière éternelle !
    V/ Ta splendeur illuminera
    toutes les contrées de la terre. R/
    V/ Les peuples viendront de loin adorer le Seigneur. R/
  evangelicAntiphon:
    common:
      - Voici le séjour que Dieu s’est choisi pour y faire sa demeure ; voici le temple que Dieu a consacré pour que son nom y soit invoqué.
  intercession:
    content: |-
      Tu as donné ta vie, Seigneur Jésus, pour rassembler en un seul peuple tous les enfants de Dieu dispersés ;
      aujourd’hui nous te prions pour ton Église que défigurent nos divisions :

      R/ Seigneur, rassemble-nous dans la paix de ton amour !

      Tu as bâti ton Église sur le Roc ;
      — donne-lui de demeurer inébranlable dans la foi pour proclamer ton nom.

      L’eau et le sang ont coulé de ton côté ouvert par la lance ;
      — renouvelle ton Église à la fontaine du baptême et par la coupe du salut.

      Tu as promis d’être au milieu de ceux qui sont réunis en ton nom ;
      — exauce la prière de ta famille.

      En ceux qui t’aiment, tu choisis d’établir ta demeure :
      — que l’Esprit de charité fasse grandir ton Église.

      Jamais tu ne rejettes celui qui vient vers toi ;
      — reçois tous les défunts dans la maison du Père.

mass:
  readingParts:
    - partType: READING_1
      partContents:
        - biblicalRef: 1R 8, 22-23.27-30
          headline: |-
            « Que tes yeux soient ouverts sur cette Maison »
          content: |-
            En ces joubrs-là,
            lors de la consécration du Temple,
            Salomon se plaça devant l’autel du Seigneur,
            >en face de toute l’assemblée d’Israël ;
            il étendit les mains vers le ciel
            et fit cette prière :
            >« Seigneur, Dieu d’Israël,
            >il n’y a pas de Dieu comme toi,
            >ni là-haut dans les cieux,
            >ni sur la terre ici-bas ;
            >car tu gardes ton Alliance et ta fidélité envers tes serviteurs,
            >quand ils marchent devant toi de tout leur cœur.
            Est-ce que, vraiment, Dieu habiterait sur la terre ?
            Les cieux et les hauteurs des cieux ne peuvent te contenir :
            >encore moins cette Maison que j’ai bâtie !
            Sois attentif à la prière et à la supplication de ton serviteur.
            Écoute, Seigneur mon Dieu, la prière et le cri
            >qu’il lance aujourd’hui vers toi.
            Que tes yeux soient ouverts nuit et jour sur cette Maison,
            >sur ce lieu dont tu as dit :
            >« C’est ici que sera mon nom. »
            >Écoute donc la prière que ton serviteur fera en ce lieu.
            Écoute la supplication de ton serviteur et de ton peuple Israël,
            >lorsqu’ils prieront en ce lieu.
            Toi, dans les cieux où tu habites,
            >écoute et pardonne. »
            >Parole du Seigneur.
        - biblicalRef: 2 Ch 5, 6-8.10.13 - 6, 2
          headline: |-
            « Je t’ai construit une maison, un lieu où tu habiteras éternellement »
          content: |-
            En ces jours-là,
            le roi Salomon, et toute la communauté d’Israël
            >qu’il avait convoquée devant l’Arche,
            offrirent en sacrifice des moutons et des bœufs :
            >il y en avait tant qu’on ne pouvait les compter.
            Puis les prêtres transportèrent l’arche de l’Alliance du Seigneur à sa place,
            >dans la chambre sacrée que l’on appelle le Saint des Saints,
            >sous les ailes des kéroubim.
            Ceux-ci étendaient leurs ailes
            >au-dessus de l’emplacement de l’Arche :
            >ils abritaient l’Arche et ses barres.
            Dans l’Arche, il n’y avait rien,
            >sinon les deux tables de la Loi que Moïse y avait placées,
            >au mont Horeb,
            quand le Seigneur avait conclu alliance avec les fils d’Israël
            >à leur sortie d’Égypte.
            Tous ensemble, ceux qui jouaient de la trompette
            >et ceux qui chantaient
            >louaient et célébraient le Seigneur d’une seule voix.
            Élevant la voix au son des trompettes,
            >des cymbales et des instruments de musique,
            ils louaient le Seigneur :
            >« Car il est bon, éternel est son amour. »
            Alors la Maison, la maison du Seigneur, fut remplie par une nuée,
            et, à cause d’elle, les prêtres durent interrompre le service divin :
            >la gloire du Seigneur remplissait la Maison de Dieu.
            Alors Salomon s’écria :
            >« Le Seigneur déclare demeurer dans la nuée obscure.
            Et maintenant, je t’ai construit, Seigneur,
            >une maison somptueuse,
            >un lieu où tu habiteras éternellement. »
        - biblicalRef: Is 56, 1.6-7
          headline: |-
            « Ma maison s’appellera "Maison de prière pour tous les peuples" »
          content: |-
            Ainsi parle le Seigneur :
            Observez le droit,
            >pratiquez la justice,
            car mon salut approche, il vient,
            >et ma justice va se révéler.
            Les étrangers qui se sont attachés au Seigneur
            >pour l’honorer, pour aimer son nom,
            >pour devenir ses serviteurs,
            tous ceux qui observent le sabbat sans le profaner
            >et tiennent ferme à mon alliance,
            je les conduirai à ma montagne sainte,
            >je les comblerai de joie dans ma maison de prière,
            leurs holocaustes et leurs sacrifices
            >seront agréés sur mon autel,
            car ma maison s’appellera
            >« Maison de prière pour tous les peuples ».
        - biblicalRef: Ez 43, 1-2.4-7a
          headline: |-
            « La gloire du Seigneur remplissait la Maison »
          content: |-
            L’homme me conduisit vers la porte,
            >celle qui fait face à l’orient ;
            et voici que la gloire du Dieu d’Israël
            >arrivait de l’orient.
            Le bruit qu’elle faisait
            >ressemblait au bruit des grandes eaux,
            et la terre resplendissait de cette gloire.
            La gloire du Seigneur entra dans la Maison
            >par la porte qui fait face à l’orient.
            L’esprit m’enleva
            >et me transporta dans la cour intérieure :
            voici que la gloire du Seigneur remplissait la Maison.
            Et j’entendis une voix qui venait de la Maison,
            >tandis que l’homme se tenait près de moi.
            Cette voix me disait :
            >« Fils d’homme, c’est ici le lieu de mon trône,
            >le lieu sur lequel je pose les pieds,
            >et là je demeurerai au milieu des fils d’Israël, pour toujours. »
        - biblicalRef: Ez 47, 1-2.8-9.12
          headline: |-
            « J’ai vu l’eau qui jaillissait du Temple, et tous ceux que cette eau atteignait étaient sauvés » (Antienne Vidi aquam)
          content: |-
            En ces jours-là,
            au cours d’une vision reçue du Seigneur,
            l’homme me fit revenir à l’entrée de la Maison,
            et voici : sous le seuil de la Maison,
            >de l’eau jaillissait vers l’orient,
            >puisque la façade de la Maison était du côté de l’orient.
            L’eau descendait de dessous le côté droit de la Maison,
            >au sud de l’autel.
            L’homme me fit sortir par la porte du nord
            et me fit faire le tour par l’extérieur,
            >jusqu’à la porte qui fait face à l’orient,
            et là encore l’eau coulait du côté droit.
            Il me dit :
            >« Cette eau coule vers la région de l’orient,
            >elle descend dans la vallée du Jourdain,
            >et se déverse dans la mer Morte,
            >dont elle assainit les eaux.
            En tout lieu où parviendra le torrent,
            >tous les animaux pourront vivre et foisonner.
            Le poisson sera très abondant,
            >car cette eau assainit tout ce qu’elle pénètre,
            >et la vie apparaît en tout lieu où arrive le torrent.
            Au bord du torrent, sur les deux rives,
            >toutes sortes d’arbres fruitiers pousseront ;
            >leur feuillage ne se flétrira pas
            >et leurs fruits ne manqueront pas.
            Chaque mois ils porteront des fruits nouveaux,
            >car cette eau vient du sanctuaire.
            Les fruits seront une nourriture,
            >et les feuilles un remède. »
            >Parole du Seigneur.

    - partType: PSALM
      partContents:
        - biblicalRef: 1 Ch 29, 10, 11abc, 11de-12a, 12bcd
          label: Cantique de David
          refAbbr: 1 Ch 29, 13bc
          chorus:
            - chorusRef: 1 Ch 29, 13bc
              chorus: |-
                Nous voici pour te rendre grâce,
                pour célébrer l’éclat de ton nom.
          content: |-
            Béni sois-tu, Seigneur,
            Dieu de notre père Israël,
            depuis les siècles et pour les siècles !

            À toi, Seigneur, force et grandeur,
            éclat, victoire, majesté,
            tout, dans les cieux et sur la terre !

            À toi, Seigneur, le règne,
            la primauté sur l’univers :
            la richesse et la gloire viennent de ta face !

            C’est toi, le Maître de tout :
            dans ta main, force et puissance ;
            tout, par ta main, grandit et s’affermit.
        - biblicalRef: Ps 45 (46), 2-3, 5-6, 8-9a.10a
          label: null
          refAbbr: 45, 5
          chorus:
            - chorusRef: 45, 5
              chorus: |-
                Le Fleuve, ses bras réjouissent la ville de Dieu,
                la plus sainte des demeures du Très-Haut.
          content: |-
            Dieu est pour nous refuge et force,
            secours dans la détresse, toujours offert.
            Nous serons sans crainte si la terre est secouée,
            si les montagnes s’effondrent au creux de la mer.

            Le Fleuve, ses bras réjouissent la ville de Dieu,
            la plus sainte des demeures du Très-Haut.
            Dieu s’y tient : elle est inébranlable ;
            quand renaît le matin, Dieu la secourt.

            Il est avec nous, le Seigneur de l’univers ;
            citadelle pour nous, le Dieu de Jacob !
            Venez et voyez les actes du Seigneur,
            il détruit la guerre jusqu’au bout du monde.
        - biblicalRef: Ps 83 (84), 3, 4, 5.10, 11abcd
          label: null
          refAbbr: 83, 2
          chorus:
            - chorusRef: 83, 2
              chorus: |-
                De quel amour sont aimées tes demeures,
                Seigneur, Dieu de l’univers !
            - chorusRef: Ap 21, 3b
              chorus: |-
                ou : Voici la demeure de Dieu avec les hommes.
          content: |-
            Mon âme s’épuise à désirer
            les parvis du Seigneur ;
            mon cœur et ma chair sont un cri
            vers le Dieu vivant !

            L’oiseau lui-même s’est trouvé une maison,
            et l’hirondelle, un nid pour abriter sa couvée :
            tes autels, Seigneur de l’univers,
            mon Roi et mon Dieu !

            Heureux les habitants de ta maison :
            ils pourront te chanter encore !
            Dieu, vois notre bouclier,
            regarde le visage de ton messie.

            Oui, un jour dans tes parvis
            en vaut plus que mille.
            J’ai choisi de me tenir sur le seuil,
            dans la maison de mon Dieu.
        - biblicalRef: Ps 94 (95), 1-2, 3-5, 6-7
          label: null
          refAbbr: cf. 94, 2a
          chorus:
            - chorusRef: cf. 94, 2a
              chorus: |-
                Allons vers le Seigneur en rendant grâce.
          content: |-
            Venez, crions de joie pour le Seigneur,
            acclamons notre Rocher, notre salut !
            Allons jusqu’à lui en rendant grâce,
            par nos hymnes de fête acclamons-le !

            Oui, le grand Dieu, c’est le Seigneur,
            le grand roi au-dessus de tous les dieux :
            il tient en main les profondeurs de la terre,
            et les sommets des montagnes sont à lui ;
            à lui la mer, c’est lui qui l’a faite,
            et les terres, car ses mains les ont pétries.

            Entrez, inclinez-vous, prosternez-vous,
            adorons le Seigneur qui nous a faits.
            Oui, il est notre Dieu ;
            nous sommes le peuple qu’il conduit,
            le troupeau guidé par sa main.
        - biblicalRef: Ps 121 (122), 1-2, 3-4ab, 4cd-5, 8-9
          label: null
          refAbbr: cf. 121, 1
          chorus:
            - chorusRef: cf. 121, 1
              chorus: |-
                Dans la joie, nous irons
                à la maison du Seigneur.
          content: |-
            Quelle joie quand on m’a dit :
            « Nous irons à la maison du Seigneur ! »
            Maintenant notre marche prend fin
            devant tes portes, Jérusalem !

            Jérusalem, te voici dans tes murs :
            ville où tout ensemble ne fait qu’un !
            C’est là que montent les tribus,
            les tribus du Seigneur.

            C’est là qu’Israël doit rendre grâce
            au nom du Seigneur ;
            c’est là le siège du droit,
            le siège de la maison de David.

            À cause de mes frères et de mes proches,
            je dirai : « Paix sur toi ! »
            À cause de la maison du Seigneur notre Dieu,
            je désire ton bien.

    - partType: READING_2
      partContents:
        - biblicalRef: 1Co 3, 9c-11.16-17
          headline: |-
            « Vous êtes un sanctuaire de Dieu »
          content: |-
            Frères,
            vous êtes une maison que Dieu construit.
            Selon la grâce que Dieu m’a donnée,
            moi, comme un bon architecte,
            >j’ai posé la pierre de fondation.
            Un autre construit dessus.
            Mais que chacun prenne garde
            >à la façon dont il contribue à la construction.
            La pierre de fondation, personne ne peut en poser d’autre
            >que celle qui s’y trouve : Jésus Christ.
            Ne savez-vous pas que vous êtes un sanctuaire de Dieu,
            >et que l’Esprit de Dieu habite en vous ?
            Si quelqu’un détruit le sanctuaire de Dieu,
            >cet homme, Dieu le détruira,
            car le sanctuaire de Dieu est saint,
            >et ce sanctuaire, c’est vous.
        - biblicalRef: Ep 2, 19-22
          headline: |-
            « En lui, toute la construction s’élève harmonieusement pour devenir un temple saint dans le Seigneur »
          content: |-
            Frères,
            vous n’êtes plus des étrangers ni des gens de passage,
            vous êtes concitoyens des saints,
            >vous êtes membres de la famille de Dieu,
            car vous avez été intégrés dans la construction
            >qui a pour fondations les Apôtres et les prophètes ;
            et la pierre angulaire, c’est le Christ Jésus lui-même.
            En lui, toute la construction s’élève harmonieusement
            >pour devenir un temple saint dans le Seigneur.
            En lui, vous êtes, vous aussi, les éléments d’une même construction
            >pour devenir une demeure de Dieu par l’Esprit Saint.
        - biblicalRef: He 12, 18-19.22-24
          headline: |-
            « Vous êtes venus vers la montagne de Sion et vers la ville du Dieu vivant »
          content: |-
            Frères,
            quand vous êtes venus vers Dieu,
            vous n’êtes pas venus vers une réalité palpable,
            >embrasée par le feu, comme la montagne du Sinaï :
            pas d’obscurité, de ténèbres ni d’ouragan,
            >pas de son de trompettes
            ni de paroles prononcées par cette voix
            >que les fils d’Israël demandèrent à ne plus entendre.
            Mais vous êtes venus vers la montagne de Sion
            >et vers la ville du Dieu vivant, la Jérusalem céleste,
            vers des myriades d’anges en fête
            >et vers l’assemblée des premiers-nés
            >dont les noms sont inscrits dans les cieux.
            Vous êtes venus vers Dieu, le juge de tous,
            >et vers les esprits des justes amenés à la perfection.
            Vous êtes venus vers Jésus,
            >le médiateur d’une alliance nouvelle,
            et vers le sang de l’aspersion,
            >son sang qui parle plus fort que celui d’Abel.
        - biblicalRef: 1 P 2, 4-9
          headline: |-
            « Comme pierres vivantes, entrez dans la construction de la demeure spirituelle »
          content: |-
            Frères,
            approchez-vous du Seigneur Jésus :
            >il est la pierre vivante
            >rejetée par les hommes,
            mais choisie et précieuse devant Dieu.
            Vous aussi, comme pierres vivantes,
            >entrez dans la construction de la demeure spirituelle,
            pour devenir le sacerdoce saint
            et présenter des sacrifices spirituels,
            >agréables à Dieu, par Jésus Christ.
            En effet, il y a ceci dans l’Écriture :
            >Je vais poser en Sion une pierre angulaire,
            >une pierre choisie, précieuse ;
            >celui qui met en elle sa foi
            >ne saurait connaître la honte.
            Ainsi donc, honneur à vous les croyants,
            mais, pour ceux qui refusent de croire, il est écrit :
            >La pierre qu’ont rejetée les bâtisseurs
            >est devenue la pierre d’angle,
            >une pierre d’achoppement,
            >un rocher sur lequel on trébuche.
            Ils achoppent, ceux qui refusent d’obéir à la Parole,
            >et c’est bien ce qui devait leur arriver.
            Mais vous, vous êtes une descendance choisie,
            >un sacerdoce royal,
            >une nation sainte,
            >un peuple destiné au salut,
            pour que vous annonciez les merveilles
            >de celui qui vous a appelés des ténèbres
            >à son admirable lumière.

    - partType: ALLELUIA
      partContents:
        - biblicalRef: 2Ch 7, 16
          content: |-
            J’ai choisi et consacré cette Maison, dit le Seigneur,
            afin que mon Nom y soit à jamais.
        - biblicalRef: Is 66, 1
          content: |-
            Le ciel est mon trône, et la terre, l’escabeau de mes pieds, dit le Seigneur.
            Où donc me bâtiriez-vous une maison ?
        - biblicalRef: Ez 37, 27
          content: |-
            Ma demeure sera chez eux, dit le Seigneur,
            je serai leur Dieu et ils seront mon peuple.
        - biblicalRef: cf. Mt 7, 8
          content: |-
            Dans ma maison, quiconque demande reçoit, dit le Seigneur ;
            qui cherche trouve ; à qui frappe, on ouvrira.
        - biblicalRef: Mt 16, 18
          content: |-
            Tu es Pierre,
            et sur cette pierre, je bâtirai mon Église,
            et la puissance de la Mort ne l’emportera pas sur elle.

    - partType: GOSPEL
      partContents:
        - biblicalRef: Mt 16, 13-19
          headline: |-
            « Tu es Pierre, et je te donnerai les clés du royaume des Cieux »
          acclamationAntiphon: |-
            Tu es Pierre,
            et sur cette pierre je bâtirai mon Église ;
            et la puissance de la Mort ne l’emportera pas sur elle.
          content: |-
            En ce temps-là,
            Jésus, arrivé dans la région de Césarée-de-Philippe,
            demandait à ses disciples :
            >« Au dire des gens,
            >qui est le Fils de l’homme ? »
            Ils répondirent :
            >« Pour les uns, Jean le Baptiste ;
            >pour d’autres, Élie ;
            >pour d’autres encore, Jérémie ou l’un des prophètes. »
            Jésus leur demanda :
            >« Et vous, que dites-vous ? Pour vous, qui suis-je ? »
            Alors Simon-Pierre prit la parole et dit :
            >« Tu es le Christ,
            >le Fils du Dieu vivant ! »
            Prenant la parole à son tour, Jésus lui dit :
            >« Heureux es-tu, Simon fils de Yonas :
            >ce n’est pas la chair et le sang qui t’ont révélé cela,
            >mais mon Père qui est aux cieux.
            Et moi, je te le déclare :
            >Tu es Pierre,
            >et sur cette pierre je bâtirai mon Église ;
            >et la puissance de la Mort ne l’emportera pas sur elle.
            Je te donnerai les clés du royaume des Cieux :
            tout ce que tu auras lié sur la terre
            >sera lié dans les cieux,
            et tout ce que tu auras délié sur la terre
            >sera délié dans les cieux. »
        - biblicalRef: Lc 19, 1-10
          headline: |-
            « Aujourd’hui, le salut est arrivé pour cette maison »
          acclamationAntiphon: |-
            Le Seigneur a choisi cette maison
            et il l’a consacrée
            pour que son nom y demeure à jamais.
          content: |-
            En ce temps-là,
            entré dans la ville de Jéricho, Jésus la traversait.
            Or, il y avait un homme du nom de Zachée ;
            >il était le chef des collecteurs d’impôts,
            >et c’était quelqu’un de riche.
            Il cherchait à voir qui était Jésus,
            mais il ne le pouvait pas à cause de la foule,
            >car il était de petite taille.
            Il courut donc en avant
            >et grimpa sur un sycomore
            >pour voir Jésus qui allait passer par là.
            Arrivé à cet endroit,
            Jésus leva les yeux et lui dit :
            >« Zachée, descends vite :
            >aujourd’hui il faut que j’aille demeurer dans ta maison. »
            Vite, il descendit
            >et reçut Jésus avec joie.
            Voyant cela, tous récriminaient :
            >« Il est allé loger chez un homme qui est un pécheur. »
            Zachée, debout, s’adressa au Seigneur :
            >« Voici, Seigneur :
            >je fais don aux pauvres de la moitié de mes biens,
            >et si j’ai fait du tort à quelqu’un,
            >je vais lui rendre quatre fois plus. »
            Alors Jésus dit à son sujet :
            >« Aujourd’hui, le salut est arrivé pour cette maison,
            >car lui aussi est un fils d’Abraham.
            En effet, le Fils de l’homme est venu chercher et sauver
            >ce qui était perdu. »
        - biblicalRef: Jn 2, 13-22
          headline: |-
            « Il parlait du sanctuaire de son corps »
          acclamationAntiphon: |-
            J’ai choisi et consacré cette Maison, dit le Seigneur,
            afin que mon Nom y soit à jamais.
          content: |-
            Comme la Pâque juive était proche,
            Jésus monta à Jérusalem.
            Dans le Temple, il trouva installés
            >les marchands de bœufs, de brebis et de colombes,
            >et les changeurs.
            Il fit un fouet avec des cordes,
            >et les chassa tous du Temple,
            >ainsi que les brebis et les bœufs ;
            il jeta par terre la monnaie des changeurs,
            renversa leurs comptoirs,
            et dit aux marchands de colombes :
            >« Enlevez cela d’ici.
            Cessez de faire de la maison de mon Père
            >une maison de commerce. »
            Ses disciples se rappelèrent qu’il est écrit :
            >L’amour de ta maison fera mon tourment.
            Des Juifs l’interpellèrent :
            >« Quel signe peux-tu nous donner
            >pour agir ainsi ? »
            Jésus leur répondit :
            >« Détruisez ce sanctuaire,
            >et en trois jours je le relèverai. »
            Les Juifs lui répliquèrent :
            >« Il a fallu quarante-six ans pour bâtir ce sanctuaire,
            >et toi, en trois jours tu le relèverais ! »
            Mais lui parlait du sanctuaire de son corps.
            Aussi, quand il se réveilla d’entre les morts,
            >ses disciples se rappelèrent qu’il avait dit cela ;
            ils crurent à l’Écriture
            >et à la parole que Jésus avait dite.
        - biblicalRef: Jn 4, 19-24
          headline: |-
            « Les vrais adorateurs adoreront le Père en esprit et vérité »
          acclamationAntiphon: |-
            Envoie ta lumière et ta vérité, Seigneur :
            qu’elles me conduisent à ta montagne sainte,
            jusqu’en ta demeure.
          content: |-
            En ce temps-là,
            une femme de Samarie dit à Jésus :
            >« Seigneur, je vois que tu es un prophète !...
            Eh bien ! Nos pères ont adoré sur la montagne qui est là,
            >et vous, les Juifs, vous dites
            >que le lieu où il faut adorer est à Jérusalem. »
            Jésus lui dit :
            >« Femme, crois-moi :
            >l’heure vient
            >où vous n’irez plus ni sur cette montagne ni à Jérusalem
            >pour adorer le Père.
            Vous, vous adorez ce que vous ne connaissez pas ;
            >nous, nous adorons ce que nous connaissons,
            >car le salut vient des Juifs.
            Mais l’heure vient - et c’est maintenant -
            >où les vrais adorateurs
            >adoreront le Père en esprit et vérité :
            >tels sont les adorateurs que recherche le Père.
            Dieu est esprit,
            >et ceux qui l’adorent,
            >c’est en esprit et vérité qu’ils doivent l’adorer. »
