commonTitle: Commun de la Dédicace à l’intérieur de l’église consacrée

celebration:
  color: white

oration:
  - |-
    Chaque année, tu fais revivre pour nous, Seigneur, le jour où cette église a été consacrée ; de grâce, écoute les prières de ton peuple : donne-nous de toujours accomplir ici un culte qui te rende gloire et nous sanctifie pleinement.

mass:
  entranceAntiphon:
    - biblicalReference: cf. Ps 67,36
      content: |-
        Dieu est admirable dans son temple saint,
        >le Dieu d’Israël,
        c’est lui qui donne à son peuple force et puissance.
        >Béni soit Dieu !
  collect:
    - |-
      Seigneur Dieu, +
      chaque année tu fais revivre pour nous
      >le jour où cette église a été consacrée ;
      écoute les prières de ton peuple :
      fais que l’on te serve toujours en ce lieu
      >dans la pureté du cœur /
      >et que nous obtenions ici la plénitude de la rédemption.
      Par Jésus Christ, ton Fils, notre Seigneur, +
      >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
      >Dieu, pour les siècles des siècles.
  offeringPrayer:
    - |-
      Alors que nous rappelons devant toi, Seigneur,
      le jour où tu as rempli ta maison
      >de gloire et de sainteté, +
      nous te prions de nous transformer nous-mêmes /
      >en offrandes qui te soient toujours agréables.
      Par le Christ, notre Seigneur.
  prefaceList:
    - dedicace_1
  communionAntiphon:
    - biblicalReference: cf. 1Co 3, 16-17
      content: |-
        Vous êtes un sanctuaire de Dieu,
        >et l’Esprit de Dieu habite en vous.
        Le sanctuaire de Dieu est saint,
        >et ce sanctuaire, c’est vous.
  prayerAfterCommunion:
    - |-
      Accorde au peuple qui t’est consacré, Seigneur,
      >de recueillir les fruits et la joie de ta bénédiction, *
      afin qu’ayant pris part à la liturgie de cette fête, /
      >il sache en vivre spirituellement.
      Par le Christ, notre Seigneur.
