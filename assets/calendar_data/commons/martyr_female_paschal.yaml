commonTitle: Commun d’une sainte femme martyre

oration:
  - |-
    Dieu qui déploies ta puissance dans la faiblesse, écoute ceux qui célèbrent la gloire de sainte N. : elle a reçu de toi la force de vaincre, qu’elle nous obtienne la grâce de la victoire.

firstVespers:
  evangelicAntiphon:
    common: |-
      Sa force était la force de Dieu : sa clarté jamais ne s’éteindra.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Le royaume des Cieux appartient
      >à celles qui ont méprisé la vie de ce monde,
      elles sont parvenues aux récompenses du Royaume,
      >elles ont lavé leurs robes dans le sang de l’Agneau, alléluia.
  collect:
  - |-  
    Seigneur Dieu,
    par toi, la puissance se déploie dans la faiblesse; + 
    écoute tous ceux qui célèbrent la gloire de sainte N.: *
    >de toi, elle reçut la force de vaincre, /
    >de toi aussi, qu’elle nous obtienne toujours la grâce de la victoire.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    En rappelant la victoire qui ouvrit le ciel à sainte N.,
    nous t’offrons avec joie, Seigneur, le sacrifice de ce jour; *
    par lui, nous proclamons tes merveilles, /
    >heureux de pouvoir compter sur son intercession dans la gloire.
    Par le Christ, notre Seigneur.

  communionAntiphon:
  - biblicalReference: cf. Ap 12, 11-12
    content: |-
      Détachées de leur propre vie,
      >elles sont allées jusqu’à mourir.
      Cieux, soyez donc dans la joie,
      >et vous qui avez aux cieux votre demeure, alléluia.
  prayerAfterCommunion:
  - |-
    Alors que nous faisons mémoire de sainte N,
    >nous te supplions humblement, Seigneur: +
    en prenant part à ce sacrement,
    >nous avons goûté aux joies éternelles; *
    ce que nous accomplissons par ta grâce en notre service fidèle, /
    >puissions-nous l’accueillir
    >dans un esprit accordé à tes propres dons.
    Par le Christ, notre Seigneur.
