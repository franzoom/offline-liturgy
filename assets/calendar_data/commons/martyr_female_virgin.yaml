commonTitle: Commun d’une vierge martyre

oration:
  - Tu nous réjouis chaque année, Seigneur, par la fête de sainte N. qui fut un modèle de pureté et de courage ; accorde-nous aujourd’hui l’appui de ses mérites.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici qu’elle suit l’Agneau, crucifié pour nous,
      >la vierge fidèle, victime pure, offrande immaculée.
  - biblicalReference: null
    content: |-
      Bienheureuse vierge,
      >renonçant à elle-même et portant sa croix,
      elle a imité le Seigneur, époux des vierges
      >et prince des martyrs.
  collect:
  - |-  
    Seigneur Dieu, +
    tu nous réjouis en ce jour anniversaire
    >où nous commémorons sainte N.; *
    accorde-nous l’appui de ses mérites, /
    >puisqu’elle est pour nous un modèle rayonnant
    >de chasteté et de force d’âme.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Seigneur, nous te présentons ces offrandes
    >en célébrant sainte N.:
    accepte-les avec bienveillance, nous t’en prions, /
    >comme tu as accueilli le combat de son martyre.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: null
    content: |-
      L’Agneau qui se tient au milieu du Trône
      >les conduira aux sources des eaux de la vie.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    tu as donné à sainte N.
    >d’être couronnée parmi les saints,
    >au double titre de vierge et de martyre;
    par la force de ce sacrement,
    >rends-nous forts pour surmonter le mal /
    >et obtenir ainsi la gloire du ciel.
    Par le Christ, notre Seigneur.