commonTitle: Commun d'un martyr missionnaire en temps pascal

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ph 2, 30
    content: |-
      C’est pour l’œuvre du Christ que saint N. est mort;
      >il a risqué sa vie pour l’accomplir, alléluia.
  communionAntiphon:
  - biblicalReference: cf. Mc 8, 35
    content: |-
      Celui qui perdra sa vie à cause de moi et de l’Évangile
      >la sauvera, dit le Seigneur, alléluia.
