commonTitle: Commun d’un martyr au Temps Pascal

celebration:
  color: red

oration:
  - Pour le rayonnement de ton Église, tu as permis, Seigneur, que saint N. connaisse la gloire du martyre ; donne-nous de marcher sur ses traces en imitant comme lui la passion du Sauveur, afin de parvenir aux joies éternelles.

firstVespers:
  reading:
    biblicalReference: Ap 3, 10-12
    content: Parce que tu as gardé ma parole avec persévérance, moi aussi je te garderai de l’heure de l’épreuve, qui va venir sur l’humanité entière, et mettre à l’épreuve les habitants de la terre. Je viens bientôt. Tiens ferme ce que tu as, pour que nul ne te prenne ta couronne. Le vainqueur, j’en ferai une colonne dans le temple de mon Dieu, il n’en sortira jamais plus, et j’inscrirai sur lui le nom de mon Dieu, et le nom de la cité de mon Dieu, la Jérusalem nouvelle qui descend du ciel d’auprès de mon Dieu, et mon nom nouveau.
  responsory: |-
    R/ Ils allaient, tout joyeux d’avoir souffert
    pour le nom de Jésus.
    * Alléluia, alléluia !
    V/ Qui sème dans les larmes, moissonne dans la joie.
    * Alléluia.
    Gloire au Père. R\ Ils allaient.

  evangelicAntiphon:
    common: La lumière du Seigneur brillera pour eux, une lumière éternelle.

readings:
  biblicalReading:
    - title: LECTURE DU LIVRE DE L’APOCALPYSE
      subtitle: La foule des élus
      ref: Ap 7, 9-17
      content: |-
        Moi, Jean, je vis : C’était une foule immense que nul ne pouvait dénombrer, de toutes nations, tribus, peuples et langues. Ils se tenaient debout devant le trône et devant l’Agneau, vêtus de robes blanches et des palmes à la main. Ils proclamaient à haute voix : Le salut est à notre Dieu qui siège sur le trône et à l’Agneau.
        Et tous les anges rassemblés autour du trône, des anciens et des quatre animaux, tombèrent devant le trône, face contre terre, et adorèrent Dieu. Ils disaient : Amen ! Louange, gloire, sagesse, action de grâce, honneur, puissance et force à notre Dieu pour les siècles des siècles ! Amen ! 
        L’un des anciens prit alors la parole et me dit : Ces gens vêtus de robes blanches, qui sont-ils et d’où sont-ils venus ? Je lui répondis : Mon Seigneur, tu le sais ! Il me dit : Ils viennent de la grande épreuve. Ils ont lavé leurs robes et les ont blanchies dans le sang de l’Agneau. C’est pourquoi ils se tiennent devant le trône de Dieu, et lui rendent un culte jour et nuit dans son temple. Et celui qui siège sur le trône les abritera sous sa tente. Ils n’auront plus faim, ils n’auront plus soif, le soleil et ses feux ne les frapperont plus, car l’Agneau qui se tient au milieu du trône sera leur berger, il les conduira vers des sources d’eaux vives. Et Dieu essuiera toute larme de leurs yeux.

      responsory: |-
        [rubric](Stance)[/rubric]
        De la détresse des prisons
        monte le cri des fils de Dieu
        persécutés ;
        mais le Royaume est proche :
        bientôt se lèvera
        le Fils de l’homme qu’ils acclament :

        R/ Dieu vivant, Seigneur ressuscité,
        nous croyons en toi, alléluia.

        Un moment vous souffrirez,
        mais j’ai vaincu le monde,
        gardez courage.

        En vérité, je vous le dis,
        si quelqu’un garde ma parole,
        il ne verra jamais la mort.

        Je suis la résurrection,
        celui qui me donne sa foi
        vivra même dans la mort.

morning:
  reading:
    biblicalReference: 1Jn 5, 3-5
    content: |-
      L’amour de Dieu, c’est cela : garder ses commandements. Ses commandements ne sont pas un fardeau, puisque tout être qui est né de Dieu est vainqueur du monde. Et ce qui nous a fait vaincre le monde, c’est notre foi. Qui donc est vainqueur du monde ? N’est-ce pas celui qui croit que Jésus est le Fils de Dieu ?
  responsory: |-
    R/ Un bonheur sans fin illuminera leur visage.
    * Alléluia, alléluia !
    V/ Plus de mort ni de pleur,
    plus de cri ni de peine. * Alléluia.
    V/ Allégresse et joie dans leur cœur. R/ Un bonheur.
  evangelicAntiphon:
    common: |-
      Réjouissez-vous, saints de Dieu, soyez dans l’allégresse : votre récompense est grande dans les cieux, alléluia.

middleOfDay:
  tierce:
    antiphon: Dieu lui a donné la palme des vainqueurs, car la Sagesse est plus forte que tout.
    reading:
      biblicalReference: Ap 2, 10
      content: Sois sans aucune crainte pour ce que tu vas souffrir. Voici que le démon va jeter en prison certains des vôtres pour vous mettre à l’épreuve, et vous serez en détresse pendant dix jours. Sois fidèle jusqu’à la mort, et je te donnerai la couronne de vie.
    responsory: |-
      V/ Le Seigneur l’a revêtu de la robe d’allégresse, alléluia,
      il a posé sur sa tête une couronne de beauté, alléluia.
  sexte:
    antiphon: |-
      Dieu lui a donné la couronne des justes : il a reçu de lui un nom de gloire.
    reading:
      biblicalReference: Ap 3, 21
      content: Le vainqueur, je le ferai siéger près de moi sur mon Trône, comme moi-même, après ma victoire, je suis allé siéger près de mon Père sur son Trône.
    responsory: |-
      V/ Sur Dieu, je prends appui, alléluia,
      plus rien ne me fait peur, alléluia.
  none:
    antiphon: |-
      Il s’en va en pleurant : il jette la semence ; il s’en vient en chantant : il rapporte les gerbes.
    reading:
      biblicalReference: Ap 19, 7.9
      content: Soypons dans la joie, exultons, rendons-lui gloire, car voici les noces de l’Agneau. Heureux les invités au repas des noces de l’Agneau !
    responsory: |-
      V/ Il s’en vient, il s’en vient dans la joie, alléluia,
      il rapporte les gerbes, alléluia.

vespers:
  reading:
    biblicalReference: Ap 7, 14b-17
    content: Ils viennent de la grande épreuve ; ils ont lavé leurs vêtements, ils les ont purifiés dans le sang de l’Agneau. C’est pourquoi ils se tiennent devant le trône de Dieu, et le servent jour et nuit dans son temple. Celui qui siège sur le Trône habitera parmi eux. Ils n’auront plus faim, ils n’auront plus soif, la brûlure du soleil ne les accablera plus, puisque l’Agneau qui se tient au milieu du Trône sera leur Pasteur pour les conduire vers les eaux de la source de vie. Et Dieu essuiera toute larme de leurs yeux.
  responsory: |-
    R/ Les justes resplendiront comme le soleil
    dans le Royaume de leur Père.
    * Alléluia, alléluia !
    V/ Les hommes droits chanteront d’allégresse,
    * Alléluia.
    Gloire au Père. R/ Les justes.

  evangelicAntiphon:
    common: Si le grain ne tombe en terre, il reste seul ; mais s’il meurt, il porte beaucoup de fruit.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: ccf. 4 Esd 2, 35
    content: |-
      Une lumière sans déclin brillera pour tes martyrs, Seigneur;
      >ils vivront éternellement, alléluia.
  - biblicalReference: null
    content: |-
      Voici l’homme qui n’a pas été abandonné par Dieu
      >au jour du combat;
      il est maintenant couronné,
      >victorieux par sa fidélité aux commandements du Seigneur, alléluia.
  collect:
  - |-
    Seigneur Dieu, +
    pour le rayonnement de ton Église,
    >tu as bien voulu honorer le bienheureux N.
    >de la victoire du martyre: *
    dans ta bienveillance, donne-nous de marcher sur ses traces
    >en imitant comme lui la passion du Seigneur, /
    >afin de parvenir aux joies éternelles.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ac 7, 55-60
      headline: |-
        « Seigneur Jésus, reçois mon esprit »
      content: |-
        En ces jours-là,
        Étienne était en face de ses accusateurs.
        Rempli de l’Esprit Saint,
        >il fixait le ciel du regard :
        il vit la gloire de Dieu,
        >et Jésus debout à la droite de Dieu.
        Il déclara :
        >« Voici que je contemple les cieux ouverts
        >et le Fils de l’homme debout à la droite de Dieu. »
        Alors ils poussèrent de grands cris
        >et se bouchèrent les oreilles.
        Tous ensemble, ils se précipitèrent sur lui,
        >l’entraînèrent hors de la ville
        >et se mirent à le lapider.
        Les témoins avaient déposé leurs vêtements
        >aux pieds d’un jeune homme appelé Saul.
        Étienne, pendant qu’on le lapidait, priait ainsi :
        >« Seigneur Jésus, reçois mon esprit. »
        Puis, se mettant à genoux, il s’écria d’une voix forte :
        >« Seigneur, ne leur compte pas ce péché. »
        Et, après cette parole, il s’endormit dans la mort.
    - biblicalRef: Ap 7, 9-17
      headline: |-
        « Ceux-là viennent de la grande épreuve »
      content: |-
        Moi, Jean,
        j’ai vu :
        et voici une foule immense,
        >que nul ne pouvait dénombrer,
        une foule de toutes nations, tribus, peuples et langues.
        Ils se tenaient debout devant le Trône et devant l’Agneau,
        >vêtus de robes blanches, avec des palmes à la main.
        Et ils s’écriaient d’une voix forte :
        >« Le salut appartient à notre Dieu
        >qui siège sur le Trône
        >et à l’Agneau ! »
        Tous les anges se tenaient debout autour du Trône,
        >autour des Anciens et des quatre Vivants ;
        se jetant devant le Trône, face contre terre,
        >ils se prosternèrent devant Dieu.
        Et ils disaient :
        >« Amen !
        Louange, gloire, sagesse et action de grâce,
        >honneur, puissance et force
        >à notre Dieu, pour les siècles des siècles ! Amen ! »
        L’un des Anciens prit alors la parole et me dit :
        >« Ces gens vêtus de robes blanches,
        >qui sont-ils, et d’où viennent-ils ? »
        Je lui répondis :
        >« Mon seigneur, toi, tu le sais. »
        Il me dit :
        >« Ceux-là viennent de la grande épreuve ;
        >ils ont lavé leurs robes,
        >ils les ont blanchies par le sang de l’Agneau.
        C’est pourquoi ils sont devant le trône de Dieu,
        >et le servent, jour et nuit, dans son sanctuaire.
        Celui qui siège sur le Trône
        >établira sa demeure chez eux.
        Ils n’auront plus faim, ils n’auront plus soif,
        >ni le soleil ni la chaleur ne les accablera,
        >puisque l’Agneau qui se tient au milieu du Trône
        >sera leur pasteur
        >pour les conduire aux sources des eaux de la vie.
        Et Dieu essuiera toute larme de leurs yeux. »
    - biblicalRef: Ap 12, 10-12a
      headline: |-
        « Détachés de leur propre vie, ils sont allés jusqu’à mourir »
      content: |-
        Moi, Jean,
        j’ai entendu dans le ciel une voix forte,
        qui proclamait :
        >« Maintenant voici le salut,
        >la puissance et le règne de notre Dieu,
        >voici le pouvoir de son Christ !
        Car il est rejeté, l’accusateur de nos frères,
        >lui qui les accusait, jour et nuit,
        >devant notre Dieu.
        Eux-mêmes l’ont vaincu par le sang de l’Agneau,
        >par la parole dont ils furent les témoins ;
        >détachés de leur propre vie,
        >ils sont allés jusqu’à mourir.
        Cieux, soyez donc dans la joie,
        >et vous qui avez aux cieux votre demeure ! »
    - biblicalRef: Ap 21, 5-7
      headline: |-
        « Tel sera l’héritage du vainqueur »
      content: |-
        Celui qui siégeait sur le Trône déclara :
        >« Voici que je fais toutes choses nouvelles. »
        Et il dit :
        >« Écris,
        >car ces paroles sont dignes de foi et vraies. »
        Puis il me dit :
        >« C’est fait.
        Moi, je suis l’alpha et l’oméga,
        >le commencement et la fin.
        À celui qui a soif,
        >moi, je donnerai l’eau de la source de vie,
        >gratuitement.
        Tel sera l’héritage du vainqueur ;
        >je serai son Dieu,
        >et lui sera mon fils. »
  offeringPrayer:
  - |-
    Accueille,Seigneur, ce sacrifice de réconciliation et de louange
    en la mémoire du saint martyr N.; *
    nous te le présentons, Dieu de majesté,
    >pour qu’il nous obtienne le pardon, /
    >et nous garde toujours dans l’action de grâce.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jn 12, 24
    content: |-
      Vraiment, dit le Seigneur,
      si le grain de blé tombé en terre ne meurt pas,
      il reste seul;
      mais s’il meurt,
      il donne beaucoup de fruit, alléluia.
  - biblicalReference: cf. Ps 115, 15
    content: |-
      Il en coûte au Seigneur
      >de voir mourir les siens, alléluia.
      Elle a du prix aux yeux du Seigneur,
      >la mort de ses amis les saints, alléluia.
  prayerAfterCommunion:
  - |-
    Dans la joie de ce jour de fête,
    nous avons reçu de toi, Seigneur, le don du ciel
    >et nous te supplions: *
    puisque, dans ce banquet divin,
    >nous annonçons la mort de ton Fils, /
    fais-nous participer avec les saints martyrs
    >à sa résurrection et à sa gloire.
    Lui qui vit et règne pour les siècles des siècles.


