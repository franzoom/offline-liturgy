commonTitle: Commun de plusieurs martyrs massionnaires

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Ga 6, 14; 1 Co 1, 18
    content: |-
      Que la croix de notre Seigneur Jésus Christ 
      >soit notre seule fierté.
      Le langage de la croix est puissance de Dieu 
      >pour nous qui avons été sauvés.
  collect:
  - |-
    Dieu de puissance et de miséricorde,
    >nous supplions ton infinie bonté: +
    par la prédication des saints N. et N.,
    >tu as répandu au cœur des peuples
    >la connaissance de ton Fils unique;
    de même, par l’intercession de tes martyrs, /
    >affermis-les dans une foi inébranlable.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Tandis que nous célébrons avec vénération
    >la passion de tes martyrs N. et N., +
    accorde-nous, Seigneur, d’annoncer dignement par ce sacrifice
    >la mort de ton Fils unique, *
    qui non seulement exhorta les martyrs par sa parole, /
    >mais les affermit par son exemple.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: cf. Mt 5, 10
    content: |-
      Heureux ceux qui sont persécutés pour la justice,
      >car le royaume des Cieux est à eux.
  - biblicalReference: Mt 10, 32
    content: |-
      Celui qui se déclarera pour moi devant les hommes, 
      >dit le Seigneur,
      moi aussi, je me déclarerai pour lui 
      >devant mon Père qui est aux cieux.
  prayerAfterCommunion:
  - |-
    Tu nous as rassasiés, Seigneur, des joies du ciel,
    >et nous te supplions encore:
    comme pour les saints N. et N.,
    >imprime en nos cœurs la marque de ton Fils
    >qui nous a aimés et a souffert la passion; /
    et nous goûterons pour toujours
    >le fruit de la paix.
    Par le Christ, notre Seigneur.

