commun: dedicace
sections:
- sectionType: READING_OLD_TESTAMENT_OUTSIDE_EASTER
  items:
  - number: 1
    biblicalRef: 1 R 8, 22-23.27-30
    headline: |-
      « Que tes yeux soient ouverts sur cette Maison »
    content: |-
      En ces joubrs-là,
      lors de la consécration du Temple,
      Salomon se plaça devant l’autel du Seigneur,
      >en face de toute l’assemblée d’Israël ;
      il étendit les mains vers le ciel
      et fit cette prière :
      >« Seigneur, Dieu d’Israël,
      >il n’y a pas de Dieu comme toi,
      >ni là-haut dans les cieux,
      >ni sur la terre ici-bas ;
      >car tu gardes ton Alliance et ta fidélité envers tes serviteurs,
      >quand ils marchent devant toi de tout leur cœur.
      Est-ce que, vraiment, Dieu habiterait sur la terre ?
      Les cieux et les hauteurs des cieux ne peuvent te contenir :
      >encore moins cette Maison que j’ai bâtie !
      Sois attentif à la prière et à la supplication de ton serviteur.
      Écoute, Seigneur mon Dieu, la prière et le cri
      >qu’il lance aujourd’hui vers toi.
      Que tes yeux soient ouverts nuit et jour sur cette Maison,
      >sur ce lieu dont tu as dit :
      >« C’est ici que sera mon nom. »
      >Écoute donc la prière que ton serviteur fera en ce lieu.
      Écoute la supplication de ton serviteur et de ton peuple Israël,
      >lorsqu’ils prieront en ce lieu.
      Toi, dans les cieux où tu habites,
      >écoute et pardonne. »
      >Parole du Seigneur.
  - number: 2
    biblicalRef: 2 Ch 5, 6-8.10.13 - 6, 2
    headline: |-
      « Je t’ai construit une maison, un lieu où tu habiteras éternellement »
    content: |-
      En ces jours-là,
      le roi Salomon, et toute la communauté d’Israël
      >qu’il avait convoquée devant l’Arche,
      offrirent en sacrifice des moutons et des bœufs :
      >il y en avait tant qu’on ne pouvait les compter.
      Puis les prêtres transportèrent l’arche de l’Alliance du Seigneur à sa place,
      >dans la chambre sacrée que l’on appelle le Saint des Saints,
      >sous les ailes des kéroubim.
      Ceux-ci étendaient leurs ailes
      >au-dessus de l’emplacement de l’Arche :
      >ils abritaient l’Arche et ses barres.
      Dans l’Arche, il n’y avait rien,
      >sinon les deux tables de la Loi que Moïse y avait placées,
      >au mont Horeb,
      quand le Seigneur avait conclu alliance avec les fils d’Israël
      >à leur sortie d’Égypte.
      Tous ensemble, ceux qui jouaient de la trompette
      >et ceux qui chantaient
      >louaient et célébraient le Seigneur d’une seule voix.
      Élevant la voix au son des trompettes,
      >des cymbales et des instruments de musique,
      ils louaient le Seigneur :
      >« Car il est bon, éternel est son amour. »
      Alors la Maison, la maison du Seigneur, fut remplie par une nuée,
      et, à cause d’elle, les prêtres durent interrompre le service divin :
      >la gloire du Seigneur remplissait la Maison de Dieu.
      Alors Salomon s’écria :
      >« Le Seigneur déclare demeurer dans la nuée obscure.
      Et maintenant, je t’ai construit, Seigneur,
      >une maison somptueuse,
      >un lieu où tu habiteras éternellement. »
      .
  - number: 3
    biblicalRef: Is 56, 1.6-7
    headline: |-
      « Ma maison s’appellera "Maison de prière pour tous les peuples" »
    content: |-
      Ainsi parle le Seigneur :
      Observez le droit,
      >pratiquez la justice,
      car mon salut approche, il vient,
      >et ma justice va se révéler.
      Les étrangers qui se sont attachés au Seigneur
      >pour l’honorer, pour aimer son nom,
      >pour devenir ses serviteurs,
      tous ceux qui observent le sabbat sans le profaner
      >et tiennent ferme à mon alliance,
      je les conduirai à ma montagne sainte,
      >je les comblerai de joie dans ma maison de prière,
      leurs holocaustes et leurs sacrifices
      >seront agréés sur mon autel,
      car ma maison s’appellera
      >« Maison de prière pour tous les peuples ».
      
  - number: 4
    biblicalRef: Ez 43, 1-2.4-7a
    headline: |-
      « La gloire du Seigneur remplissait la Maison »
    content: |-
      L’homme me conduisit vers la porte,
      >celle qui fait face à l’orient ;
      et voici que la gloire du Dieu d’Israël
      >arrivait de l’orient.
      Le bruit qu’elle faisait
      >ressemblait au bruit des grandes eaux,
      et la terre resplendissait de cette gloire.
      La gloire du Seigneur entra dans la Maison
      >par la porte qui fait face à l’orient.
      L’esprit m’enleva
      >et me transporta dans la cour intérieure :
      voici que la gloire du Seigneur remplissait la Maison.
      Et j’entendis une voix qui venait de la Maison,
      >tandis que l’homme se tenait près de moi.
      Cette voix me disait :
      >« Fils d’homme, c’est ici le lieu de mon trône,
      >le lieu sur lequel je pose les pieds,
      >et là je demeurerai au milieu des fils d’Israël, pour toujours. »
      .
  - number: 5
    biblicalRef: Ez 47, 1-2.8-9.12
    headline: |-
      « J’ai vu l’eau qui jaillissait du Temple, et tous ceux que cette eau atteignait étaient sauvés » (Antienne Vidi aquam)
    content: |-
      En ces jours-là,
      au cours d’une vision reçue du Seigneur,
      l’homme me fit revenir à l’entrée de la Maison,
      et voici : sous le seuil de la Maison,
      >de l’eau jaillissait vers l’orient,
      >puisque la façade de la Maison était du côté de l’orient.
      L’eau descendait de dessous le côté droit de la Maison,
      >au sud de l’autel.
      L’homme me fit sortir par la porte du nord
      et me fit faire le tour par l’extérieur,
      >jusqu’à la porte qui fait face à l’orient,
      et là encore l’eau coulait du côté droit.
      Il me dit :
      >« Cette eau coule vers la région de l’orient,
      >elle descend dans la vallée du Jourdain,
      >et se déverse dans la mer Morte,
      >dont elle assainit les eaux.
      En tout lieu où parviendra le torrent,
      >tous les animaux pourront vivre et foisonner.
      Le poisson sera très abondant,
      >car cette eau assainit tout ce qu’elle pénètre,
      >et la vie apparaît en tout lieu où arrive le torrent.
      Au bord du torrent, sur les deux rives,
      >toutes sortes d’arbres fruitiers pousseront ;
      >leur feuillage ne se flétrira pas
      >et leurs fruits ne manqueront pas.
      Chaque mois ils porteront des fruits nouveaux,
      >car cette eau vient du sanctuaire.
      Les fruits seront une nourriture,
      >et les feuilles un remède. »
      >Parole du Seigneur.
- sectionType: READING_NEW_TESTAMENT_EASTER_SEASON
  items:
  - number: 1
    biblicalRef: Ac 7, 44-50
    headline: |-
      « Le Très-Haut n’habite pas dans ce qui est fait de main d’homme »
    content: |-
      En ces jours-là,
      Étienne disait au peuple, aux anciens et aux scribes :
      >« Nos pères, dans le désert,
      >avaient la tente du Témoignage.
      Elle avait été faite d’après les ordres
      >de Celui qui parlait à Moïse
      >et qui lui en avait montré le modèle.
      Après avoir reçu cette tente,
      >nos pères, avec Josué, la firent entrer dans le pays
      >que les nations possédaient
      >avant que Dieu les chasse loin du visage de nos pères.
      Cela dura jusqu’au temps de David.
      Celui-ci trouva grâce devant Dieu
      >et il pria afin de trouver une demeure au Dieu de Jacob.
      Mais ce fut Salomon qui lui construisit une maison.
      Pourtant, le Très-Haut n’habite pas
      >dans ce qui est fait de main d’homme,
      >comme le dit le prophète :
      >Le ciel est mon trône,
      >et la terre, l’escabeau de mes pieds.
      Quelle maison me bâtirez-vous, dit le Seigneur,
      >quel sera le lieu de mon repos ?
      N’est-ce pas ma main qui a fait tout cela ? »
      >Parole du Seigneur.
  - number: 2
    biblicalRef: Ap 21, 1-5a
    headline: |-
      « Voici la demeure de Dieu avec les hommes »
    content: |-
      Moi, Jean,
      j’ai vu un ciel nouveau et une terre nouvelle,
      >car le premier ciel et la première terre s’en étaient allés
      >et, de mer, il n’y en a plus.
      Et la Ville sainte, la Jérusalem nouvelle,
      je l’ai vue qui descendait du ciel, d’auprès de Dieu,
      >prête pour les noces, comme une épouse parée pour son mari.
      Et j’entendis une voix forte qui venait du Trône.
      Elle disait :
      >« Voici la demeure de Dieu avec les hommes ;
      >il demeurera avec eux,
      >et ils seront ses peuples,
      >et lui-même, Dieu avec eux, sera leur Dieu.
      Il essuiera toute larme de leurs yeux,
      >et la mort ne sera plus,
      >et il n’y aura plus ni deuil, ni cri, ni douleur :
      >ce qui était en premier s’en est allé. »
      Alors celui qui siégeait sur le Trône déclara :
      >« Voici que je fais toutes choses nouvelles. »
      .
  - number: 3
    biblicalRef: Ap 21, 9b-14
    headline: |-
      « Viens, je te montrerai la Femme, l’Épouse de l’Agneau »
    content: |-
      Moi, Jean,
      j’ai vu un ange qui me disait :
      >« Viens, je te montrerai
      >la Femme, l’Épouse de l’Agneau. »
      En esprit, il m’emporta
      >sur une grande et haute montagne ;
      il me montra la Ville sainte, Jérusalem,
      >qui descendait du ciel, d’auprès de Dieu :
      elle avait en elle la gloire de Dieu ;
      >son éclat était celui d’une pierre très précieuse,
      >comme le jaspe cristallin.
      Elle avait une grande et haute muraille,
      >avec douze portes et, sur ces portes, douze anges ;
      des noms y étaient inscrits :
      >ceux des douze tribus des fils d’Israël.
      Il y avait trois portes à l’orient,
      >trois au nord,
      >trois au midi,
      >et trois à l’occident.
      La muraille de la ville reposait sur douze fondations
      >portant les douze noms des douze Apôtres de l’Agneau.
      
- sectionType: PSALM
  items:
  - number: 1
    biblicalRef: 1 Ch 29, 10, 11abc, 11de-12a, 12bcd
    label: Cantique de David
    refAbbr: 1 Ch 29, 13bc
    chorus:
    - chorusRef: 1 Ch 29, 13bc
      chorus: |-
        Nous voici pour te rendre grâce,
        pour célébrer l’éclat de ton nom.
    content: |-
      Béni sois-tu, Seigneur,
      Dieu de notre père Israël,
      depuis les siècles et pour les siècles !

      À toi, Seigneur, force et grandeur,
      éclat, victoire, majesté,
      tout, dans les cieux et sur la terre !

      À toi, Seigneur, le règne,
      la primauté sur l’univers :
      la richesse et la gloire viennent de ta face !

      C’est toi, le Maître de tout :
      dans ta main, force et puissance ;
      tout, par ta main, grandit et s’affermit.
  - number: 2
    biblicalRef: Ps 45 (46), 2-3, 5-6, 8-9a.10a
    label: null
    refAbbr: 45, 5
    chorus:
    - chorusRef: 45, 5
      chorus: |-
        Le Fleuve, ses bras réjouissent la ville de Dieu,
        la plus sainte des demeures du Très-Haut.
    content: |-
      Dieu est pour nous refuge et force,
      secours dans la détresse, toujours offert.
      Nous serons sans crainte si la terre est secouée,
      si les montagnes s’effondrent au creux de la mer.

      Le Fleuve, ses bras réjouissent la ville de Dieu,
      la plus sainte des demeures du Très-Haut.
      Dieu s’y tient : elle est inébranlable ;
      quand renaît le matin, Dieu la secourt.

      Il est avec nous, le Seigneur de l’univers ;
      citadelle pour nous, le Dieu de Jacob !
      Venez et voyez les actes du Seigneur,
      il détruit la guerre jusqu’au bout du monde.
  - number: 3
    biblicalRef: Ps 83 (84), 3, 4, 5.10, 11abcd
    label: null
    refAbbr: 83, 2
    chorus:
    - chorusRef: 83, 2
      chorus: |-
        De quel amour sont aimées tes demeures,
        Seigneur, Dieu de l’univers !
    - chorusRef: Ap 21, 3b
      chorus: |-
        ou : Voici la demeure de Dieu avec les hommes.
    content: |-
      Mon âme s’épuise à désirer
      les parvis du Seigneur ;
      mon cœur et ma chair sont un cri
      vers le Dieu vivant !

      L’oiseau lui-même s’est trouvé une maison,
      et l’hirondelle, un nid pour abriter sa couvée :
      tes autels, Seigneur de l’univers,
      mon Roi et mon Dieu !

      Heureux les habitants de ta maison :
      ils pourront te chanter encore !
      Dieu, vois notre bouclier,
      regarde le visage de ton messie.

      Oui, un jour dans tes parvis
      en vaut plus que mille.
      J’ai choisi de me tenir sur le seuil,
      dans la maison de mon Dieu.
  - number: 4
    biblicalRef: Ps 94 (95), 1-2, 3-5, 6-7
    label: null
    refAbbr: cf. 94, 2a
    chorus:
    - chorusRef: cf. 94, 2a
      chorus: |-
        Allons vers le Seigneur en rendant grâce.
    content: |-
      Venez, crions de joie pour le Seigneur,
      acclamons notre Rocher, notre salut !
      Allons jusqu’à lui en rendant grâce,
      par nos hymnes de fête acclamons-le !

      Oui, le grand Dieu, c’est le Seigneur,
      le grand roi au-dessus de tous les dieux :
      il tient en main les profondeurs de la terre,
      et les sommets des montagnes sont à lui ;
      à lui la mer, c’est lui qui l’a faite,
      et les terres, car ses mains les ont pétries.

      Entrez, inclinez-vous, prosternez-vous,
      adorons le Seigneur qui nous a faits.
      Oui, il est notre Dieu ;
      nous sommes le peuple qu’il conduit,
      le troupeau guidé par sa main.
  - number: 5
    biblicalRef: Ps 121 (122), 1-2, 3-4ab, 4cd-5, 8-9
    label: null
    refAbbr: cf. 121, 1
    chorus:
    - chorusRef: cf. 121, 1
      chorus: |-
        Dans la joie, nous irons
        à la maison du Seigneur.
    content: |-
      Quelle joie quand on m’a dit :
      « Nous irons à la maison du Seigneur ! »
      Maintenant notre marche prend fin
      devant tes portes, Jérusalem !

      Jérusalem, te voici dans tes murs :
      ville où tout ensemble ne fait qu’un !
      C’est là que montent les tribus,
      les tribus du Seigneur.

      C’est là qu’Israël doit rendre grâce
      au nom du Seigneur ;
      c’est là le siège du droit,
      le siège de la maison de David.

      À cause de mes frères et de mes proches,
      je dirai : « Paix sur toi ! »
      À cause de la maison du Seigneur notre Dieu,
      je désire ton bien.
- sectionType: SECOND_READING_NEW_TESTAMENT
  items:
  - number: 1
    biblicalRef: 1 Co 3, 9c-11.16-17
    headline: |-
      « Vous êtes un sanctuaire de Dieu »
    content: |-
      Frères,
      vous êtes une maison que Dieu construit.
      Selon la grâce que Dieu m’a donnée,
      moi, comme un bon architecte,
      >j’ai posé la pierre de fondation.
      Un autre construit dessus.
      Mais que chacun prenne garde
      >à la façon dont il contribue à la construction.
      La pierre de fondation, personne ne peut en poser d’autre
      >que celle qui s’y trouve : Jésus Christ.
      Ne savez-vous pas que vous êtes un sanctuaire de Dieu,
      >et que l’Esprit de Dieu habite en vous ?
      Si quelqu’un détruit le sanctuaire de Dieu,
      >cet homme, Dieu le détruira,
      car le sanctuaire de Dieu est saint,
      >et ce sanctuaire, c’est vous.
      
  - number: 2
    biblicalRef: Ep 2, 19-22
    headline: |-
      « En lui, toute la construction s’élève harmonieusement pour devenir un temple saint dans le Seigneur »
    content: |-
      Frères,
      vous n’êtes plus des étrangers ni des gens de passage,
      vous êtes concitoyens des saints,
      >vous êtes membres de la famille de Dieu,
      car vous avez été intégrés dans la construction
      >qui a pour fondations les Apôtres et les prophètes ;
      et la pierre angulaire, c’est le Christ Jésus lui-même.
      En lui, toute la construction s’élève harmonieusement
      >pour devenir un temple saint dans le Seigneur.
      En lui, vous êtes, vous aussi, les éléments d’une même construction
      >pour devenir une demeure de Dieu par l’Esprit Saint.
      
  - number: 3
    biblicalRef: He 12, 18-19.22-24
    headline: |-
      « Vous êtes venus vers la montagne de Sion et vers la ville du Dieu vivant »
    content: |-
      Frères,
      quand vous êtes venus vers Dieu,
      vous n’êtes pas venus vers une réalité palpable,
      >embrasée par le feu, comme la montagne du Sinaï :
      pas d’obscurité, de ténèbres ni d’ouragan,
      >pas de son de trompettes
      ni de paroles prononcées par cette voix
      >que les fils d’Israël demandèrent à ne plus entendre.
      Mais vous êtes venus vers la montagne de Sion
      >et vers la ville du Dieu vivant, la Jérusalem céleste,
      vers des myriades d’anges en fête
      >et vers l’assemblée des premiers-nés
      >dont les noms sont inscrits dans les cieux.
      Vous êtes venus vers Dieu, le juge de tous,
      >et vers les esprits des justes amenés à la perfection.
      Vous êtes venus vers Jésus,
      >le médiateur d’une alliance nouvelle,
      et vers le sang de l’aspersion,
      >son sang qui parle plus fort que celui d’Abel.
      
  - number: 4
    biblicalRef: 1 P 2, 4-9
    headline: |-
      « Comme pierres vivantes, entrez dans la construction de la demeure spirituelle »
    content: |-
      Frères,
      approchez-vous du Seigneur Jésus :
      >il est la pierre vivante
      >rejetée par les hommes,
      mais choisie et précieuse devant Dieu.
      Vous aussi, comme pierres vivantes,
      >entrez dans la construction de la demeure spirituelle,
      pour devenir le sacerdoce saint
      et présenter des sacrifices spirituels,
      >agréables à Dieu, par Jésus Christ.
      En effet, il y a ceci dans l’Écriture :
      >Je vais poser en Sion une pierre angulaire,
      >une pierre choisie, précieuse ;
      >celui qui met en elle sa foi
      >ne saurait connaître la honte.
      Ainsi donc, honneur à vous les croyants,
      mais, pour ceux qui refusent de croire, il est écrit :
      >La pierre qu’ont rejetée les bâtisseurs
      >est devenue la pierre d’angle,
      >une pierre d’achoppement,
      >un rocher sur lequel on trébuche.
      Ils achoppent, ceux qui refusent d’obéir à la Parole,
      >et c’est bien ce qui devait leur arriver.
      Mais vous, vous êtes une descendance choisie,
      >un sacerdoce royal,
      >une nation sainte,
      >un peuple destiné au salut,
      pour que vous annonciez les merveilles
      >de celui qui vous a appelés des ténèbres
      >à son admirable lumière.
      
- sectionType: ALLELUIA
  items:
  - number: 1
    biblicalRef: 2 Ch 7, 16
    content: |-
      J’ai choisi et consacré cette Maison, dit le Seigneur,
      afin que mon Nom y soit à jamais.
  - number: 2
    biblicalRef: Is 66, 1
    content: |-
      Le ciel est mon trône, et la terre, l’escabeau de mes pieds, dit le Seigneur.
      Où donc me bâtiriez-vous une maison ?
  - number: 3
    biblicalRef: Ez 37, 27
    content: |-
      Ma demeure sera chez eux, dit le Seigneur,
      je serai leur Dieu et ils seront mon peuple.
  - number: 4
    biblicalRef: cf. Mt 7, 8
    content: |-
      Dans ma maison, quiconque demande reçoit, dit le Seigneur ;
      qui cherche trouve ; à qui frappe, on ouvrira.
  - number: 5
    biblicalRef: Mt 16, 18
    content: |-
      Tu es Pierre,
      et sur cette pierre, je bâtirai mon Église,
      et la puissance de la Mort ne l’emportera pas sur elle.
- sectionType: GOSPEL
  items:
  - number: 1
    biblicalRef: Mt 16, 13-19
    headline: |-
      « Tu es Pierre, et je te donnerai les clés du royaume des Cieux »
    acclamationAntiphon: |-
      Tu es Pierre,
      et sur cette pierre je bâtirai mon Église ;
      et la puissance de la Mort ne l’emportera pas sur elle.
    content: |-
      En ce temps-là,
      Jésus, arrivé dans la région de Césarée-de-Philippe,
      demandait à ses disciples :
      >« Au dire des gens,
      >qui est le Fils de l’homme ? »
      Ils répondirent :
      >« Pour les uns, Jean le Baptiste ;
      >pour d’autres, Élie ;
      >pour d’autres encore, Jérémie ou l’un des prophètes. »
      Jésus leur demanda :
      >« Et vous, que dites-vous ? Pour vous, qui suis-je ? »
      Alors Simon-Pierre prit la parole et dit :
      >« Tu es le Christ,
      >le Fils du Dieu vivant ! »
      Prenant la parole à son tour, Jésus lui dit :
      >« Heureux es-tu, Simon fils de Yonas :
      >ce n’est pas la chair et le sang qui t’ont révélé cela,
      >mais mon Père qui est aux cieux.
      Et moi, je te le déclare :
      >Tu es Pierre,
      >et sur cette pierre je bâtirai mon Église ;
      >et la puissance de la Mort ne l’emportera pas sur elle.
      Je te donnerai les clés du royaume des Cieux :
      tout ce que tu auras lié sur la terre
      >sera lié dans les cieux,
      et tout ce que tu auras délié sur la terre
      >sera délié dans les cieux. »
      .
  - number: 2
    biblicalRef: Lc 19, 1-10
    headline: |-
      « Aujourd’hui, le salut est arrivé pour cette maison »
    acclamationAntiphon: |-
      Le Seigneur a choisi cette maison
      et il l’a consacrée
      pour que son nom y demeure à jamais.
    content: |-
      En ce temps-là,
      entré dans la ville de Jéricho, Jésus la traversait.
      Or, il y avait un homme du nom de Zachée ;
      >il était le chef des collecteurs d’impôts,
      >et c’était quelqu’un de riche.
      Il cherchait à voir qui était Jésus,
      mais il ne le pouvait pas à cause de la foule,
      >car il était de petite taille.
      Il courut donc en avant
      >et grimpa sur un sycomore
      >pour voir Jésus qui allait passer par là.
      Arrivé à cet endroit,
      Jésus leva les yeux et lui dit :
      >« Zachée, descends vite :
      >aujourd’hui il faut que j’aille demeurer dans ta maison. »
      Vite, il descendit
      >et reçut Jésus avec joie.
      Voyant cela, tous récriminaient :
      >« Il est allé loger chez un homme qui est un pécheur. »
      Zachée, debout, s’adressa au Seigneur :
      >« Voici, Seigneur :
      >je fais don aux pauvres de la moitié de mes biens,
      >et si j’ai fait du tort à quelqu’un,
      >je vais lui rendre quatre fois plus. »
      Alors Jésus dit à son sujet :
      >« Aujourd’hui, le salut est arrivé pour cette maison,
      >car lui aussi est un fils d’Abraham.
      En effet, le Fils de l’homme est venu chercher et sauver
      >ce qui était perdu. »
      >.
  - number: 3
    biblicalRef: Jn 2, 13-22
    headline: |-
      « Il parlait du sanctuaire de son corps »
    acclamationAntiphon: |-
      J’ai choisi et consacré cette Maison, dit le Seigneur,
      afin que mon Nom y soit à jamais.
    content: |-
      Comme la Pâque juive était proche,
      Jésus monta à Jérusalem.
      Dans le Temple, il trouva installés
      >les marchands de bœufs, de brebis et de colombes,
      >et les changeurs.
      Il fit un fouet avec des cordes,
      >et les chassa tous du Temple,
      >ainsi que les brebis et les bœufs ;
      il jeta par terre la monnaie des changeurs,
      renversa leurs comptoirs,
      et dit aux marchands de colombes :
      >« Enlevez cela d’ici.
      Cessez de faire de la maison de mon Père
      >une maison de commerce. »
      Ses disciples se rappelèrent qu’il est écrit :
      >L’amour de ta maison fera mon tourment.
      Des Juifs l’interpellèrent :
      >« Quel signe peux-tu nous donner
      >pour agir ainsi ? »
      Jésus leur répondit :
      >« Détruisez ce sanctuaire,
      >et en trois jours je le relèverai. »
      Les Juifs lui répliquèrent :
      >« Il a fallu quarante-six ans pour bâtir ce sanctuaire,
      >et toi, en trois jours tu le relèverais ! »
      Mais lui parlait du sanctuaire de son corps.
      Aussi, quand il se réveilla d’entre les morts,
      >ses disciples se rappelèrent qu’il avait dit cela ;
      ils crurent à l’Écriture
      >et à la parole que Jésus avait dite.
      .
  - number: 4
    biblicalRef: Jn 4, 19-24
    headline: |-
      « Les vrais adorateurs adoreront le Père en esprit et vérité »
    acclamationAntiphon: |-
      Envoie ta lumière et ta vérité, Seigneur :
      qu’elles me conduisent à ta montagne sainte,
      jusqu’en ta demeure.
    content: |-
      En ce temps-là,
      une femme de Samarie dit à Jésus :
      >« Seigneur, je vois que tu es un prophète !...
      Eh bien ! Nos pères ont adoré sur la montagne qui est là,
      >et vous, les Juifs, vous dites
      >que le lieu où il faut adorer est à Jérusalem. »
      Jésus lui dit :
      >« Femme, crois-moi :
      >l’heure vient
      >où vous n’irez plus ni sur cette montagne ni à Jérusalem
      >pour adorer le Père.
      Vous, vous adorez ce que vous ne connaissez pas ;
      >nous, nous adorons ce que nous connaissons,
      >car le salut vient des Juifs.
      Mais l’heure vient - et c’est maintenant -
      >où les vrais adorateurs
      >adoreront le Père en esprit et vérité :
      >tels sont les adorateurs que recherche le Père.
      Dieu est esprit,
      >et ceux qui l’adorent,
      >c’est en esprit et vérité qu’ils doivent l’adorer. »
      >.
