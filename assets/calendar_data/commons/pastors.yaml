commonTitle: Commun des Pasteurs

celebration:
  color: white

oration:
- Lumière des fidèles et pasteur des âmes, Dieu qui as mis saint N. à la tête de ton peuple, pour le nourrir de sa parole et le guider par son exemple, accorde-nous, par son intercession, de garder la foi qu’il sut transmettre et de suivre le chemin qu’il a tracé.

firstVespers:
  hymn:
  - nul-n-est-disciple
  psalmody:
  - psalm: PSALM_112
    antiphon:
    - Je vous donnerai des pasteurs selon mon cœur, ils vous conduiront avec intelligence et sagesse.
  - psalm: PSALM_145
    antiphon:
    - |-
      Je suis votre berger, dit le Seigneur : la brebis perdu, je la rechercherai ; celle qui s’égare, je la ramènerai.
  - psalm: NT_4
    antiphon:
    - Le bon berger donne sa vie pour ses brebis.
  reading:
    biblicalReference: 1 P 5,1-4
    content: Je m’adresse à ceux qui exercent parmi vous la fonction d’Anciens, car moi aussi je fais partie des Anciens, je suis témoin de la passion du Christ, et je communierai à la gloire qui va se révéler. Soyez les bergers du troupeau de Dieu qui vous est confié ; veillez sur lui, non par contrainte mais de bon cœur, comme Dieu le veut ; non par une misérable cupidité mais par dévouement ; non pas en commandant en maîtres à ceux dont vous avez reçu la charge, mais en devenant les modèles du troupeau. Et, quand se manifestera le berger suprême, vous remporterez la couronne de gloire qui ne se flétrit pas.
  responsory: |-
    R/ Vous, les prêtres,
    * bénissez le Seigneur !
       Vous, ses serviteurs,
    * bénissez le Seigneur !
       Les saints et les humbles de cœur,
    * bénissez le Seigneur !
  evangelicAntiphon:
    common: Libre à l’égard de tous, je me suis fait l’esclave de tous pour que chacun puisse être sauvé.
  intercession:
    content: |-
      Louons le Christ, le Grand Prêtre pris parmi les hommes pour intervenir en notre faveur, et prions-le :

      R/ auve ton peuple, bénis ton héritage.

      Tu as donné à ton Église des pasteurs animés de l’esprit de l’Évangile,
      – accorde à ton peuple la même connaissance et le même courage.

      À la prière de Moïse et de tes saints pasteurs, tu as pardonné les péchés de ton peuple,
      – à leur intercession, purifie l’Église aujourd’hui.

      Tu t’es choisi des saints parmi ton peuple, et tu les as conduits par ton Esprit,
      – donne ce même Esprit à tous les pasteurs de ton Église.

      Toi, l’unique richesse des saints,
      – ne permets pas qu’aucun homme, sauvé par ton sang, demeure loin de toi.

      Toi qui donnes la vie au troupeau par la main de ses pasteurs,
      – ne permets pas qu’aucun défunt se perde ; tu t’es livré pour eux, sauve-les.

invitatory:
  antiphon:
  - Louange à toi, Seigneur Jésus, notre pasteur et notre guide.

readings:
  hymn:
  - eglise-de-toujours
  psalmody:
  - psalm: PSALM_20
    antiphon:
    - Celui qui voudra être le premier parmi vous, qu’il soit votre esclave.
  - psalm: PSALM_91_1
    antiphon:
    - C’est la gloire de mon Père que vous portiez beaucoup de fruit, vous serez alors mes disciples.
  - psalm: PSALM_91_2
    antiphon:
    - Serviteur bon et fidèle, entre dans la joie de ton maître.
  verse: |-
    V/ Je mets mes paroles dans ta bouche,
    tu diras tout ce que je t’ai ordonné.
  biblicalReading:
  - title: LECTURE DE LA 1^ère LETTRE DE PIERRE
    subtitle: Exhortation aux responsables et aux fidèles
    ref: 1P 5, 1-11
    content: |-
      Quant aux anciens en fonction parmi vous, je les exhorte, moi qui suis ancien comme eux et témoin des souffrances du Christ, communiant à la gloire qui va se révéler : soyez les pasteurs du troupeau de Dieu qui se trouve chez vous ; veillez sur lui, non par contrainte mais de plein gré, selon Dieu ; non par cupidité mais par dévouement ; non pas en commandant en maîtres à ceux qui vous sont confiés, mais en devenant les modèles du troupeau. Et, quand se manifestera le Chef des pasteurs, vous recevrez la couronne de gloire qui ne se flétrit pas.
      De même, vous les jeunes gens, soyez soumis aux anciens.
      Et vous tous, les uns envers les autres, prenez l’humilité comme tenue de service. En effet, Dieu %s’oppose aux orgueilleux, aux humbles il accorde sa grâce%.
      Abaissez-vous donc sous la main puissante de Dieu, pour qu’il vous élève en temps voulu. Déchargez-vous sur lui de tous vos soucis, puisqu’il prend soin de vous.
      Soyez sobres, veillez : votre adversaire, le diable, comme un lion rugissant, rôde, cherchant qui dévorer. Résistez-lui avec la force de la foi, car vous savez que tous vos frères, de par le monde, sont en butte aux mêmes souffrances.
      Après que vous aurez souffert un peu de temps, le Dieu de toute grâce, lui qui, dans le Christ Jésus, vous a appelés à sa gloire éternelle, vous rétablira lui-même, vous affermira, vous fortifiera, vous rendra inébranlables. À lui la souveraineté pour les siècles. Amen.
    responsory: |-
      R/ Soyez donc attentifs au troupeau
      dont l’Esprit vous a confié la charge.

      Vous serez les intendants fidèles
      des mystères de sa grâce.

      Livrés en spectacle au monde,
      vous serez les modèles du troupeau.
  patristicReading:
  - title: ACTES DU II^ème CONCILE DU VATICAN
    subtitle: Le ministère et la vie des prêtres
    content: |-
      Le sacrement de l’Ordre configure les prêtres au Christ, Prêtre suprême, pour en faire les ministres de celui qui est la Tête, chargés d’élever et de construire son Corps tout entier, qui est l’Église ; et ils deviennent ainsi les coopérateurs de l’ordre épiscopal. Déjà, ils ont reçu dans la consécration baptismale, comme tous les chrétiens, le signe et le don d’une vocation et d’une grâce telles qu’en dépit de la faiblesse humaine, ils ont le pouvoir et le devoir de tendre à la perfection, selon la parole du Seigneur : %Vous donc, soyez parfaits comme votre Père céleste est parfait%.
      Mais les prêtres sont tenus d’acquérir cette perfection pour un motif particulier : par le sacrement de l’Ordre, ils ont été consacrés à Dieu d’une manière nouvelle pour devenir les instruments vivants du Christ, Prêtre éternel ; ils sont habilités à poursuivre au long du temps l’action admirable par laquelle, dans sa puissance souveraine, il a rassemblé la communauté humaine tout entière.
      Puisque tout prêtre, à sa manière, tient la place du Christ en personne, il est doté aussi d’une grâce particulière ; cette grâce le rend plus capable de tendre, par le service des hommes qui lui ont été confiés et du peuple de Dieu tout entier, vers la perfection de celui qu’il représente ; c’est encore au moyen de cette grâce que sa faiblesse d’homme charnel se trouve guérie par la sainteté de celui qui est devenu pour nous le Grand Prêtre %saint, sans tache, sans aucune faute, séparé des pécheurs%.
      Le Christ que le Père %a sanctifié% (c’est-à-dire consacré) %et envoyé dans le monde, s’est donné pour nous afin de nous racheter de toutes nos fautes, et de nous purifier pour faire de nous son peuple, un peuple ardent à faire le bien%. C’est ainsi que, %par la souffrance, il est entré dans sa gloire.% Semblablement, les prêtres, consacrés par l’action du Saint-Esprit et envoyés par le Christ, font mourir leur comportement charnel et se doivent tout entiers au service des hommes : telle est la sainteté dont ils sont dotés dans le Christ et qui leur permet de s’approcher de %l’Homme parfait%.
      Ainsi donc, en exerçant %le ministère de l’Esprit et de la justice%, pourvu qu’ils soient dociles à l’Esprit du Christ, qui leur donne la vie et les conduit, ils s’enracinent dans la vie spirituelle. Ce qui ordonne leur vie à la perfection, ce sont leurs actes liturgiques de chaque jour. C’est aussi leur ministère tout entier qu’ils exercent en communion avec les évêques et les autres prêtres.
      La sainteté des prêtres est d’un apport essentiel pour rendre fructueux le ministère qu’ils accomplissent ; sans doute, la grâce de Dieu peut réaliser l’œuvre du salut même par des ministres indignes ; cependant, en règle ordinaire, Dieu préfère manifester ses merveilles par des hommes vraiment dociles à l’impulsion et à la conduite du Saint-Esprit, par des hommes à qui leur union intime avec le Christ et la sainteté de leur vie permet de dire, avec l’Apôtre : %Je vis, mais ce n’est plus moi, c’est le Christ qui vit en moi%.
    responsory: |-
      [rubric](Stance)[/rubric]
      Ne viens pas seul au festin du Royaume ;
      sur tes chemins, crie la nouvelle :
      « La promesse set un pain donné pour le partage :
      Dieu vous presse d’entrer dans l’unique demeure
      et vous rassemble dans l’amour ».

      R/ Jésus, espérance des hommes,
      fais de nous les témoins de ton salut.

      Je suis venu apporter le feu sur la terre,
      je veux qu’il se répande et qu’il brûle.

      Je suis venu pour que tous aient la vie
      et la reçoivent en plénitude.

      Je suis venu chercher ce qui était perdu,
      non pas en Juge mais en Sauveur.

morning:
  hymn:
  - heureux-ceux-que-dieu-a-choisis
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - Vous êtes la lumière du monde ; vous êtes le sel de la terre.
  - psalm: OT_41
    antiphon:
    - Que brille votre lumière aux yeux des hommes ! Ils verront le bien que vous faites, et rendront gloire à votre Père.
  - psalm: PSALM_149
    antiphon:
    - Vivante est la Parole de Dieu, plus tranchante que le glaive.
  reading:
    biblicalReference: He 13,7-9a
    content: |-
      Souvenez-vous de ceux qui vous ont dirigés : ils vous ont annoncé la parole de Dieu. Méditez sur l’aboutissement de la vie qu’ils ont menée, et imitez leur foi. Jésus Christ, hier et aujourd’hui, est le même, il l’est pour l’éternité. Ne vous laissez pas égarer par toutes sortes de doctrines étrangères.
  responsory: |-
    R/ Sur tes remparts, Jérusalem
    J’ai placé des veilleurs :
    V/ Ni de jour ni de nuit,
    ils ne doivent se taire. R/
    V/ Tenez en éveil
    la mémoire du Seigneur. R/
  evangelicAntiphon:
    common:
    - |-
      Ce n’est pas vous qui parlerez : mais l’Esprit de votre Père parlera en vous.
  intercession:
    content: |-
      Louons le Christ, le bon Pasteur, qui a donné sa vie pour ses brebis, et supplions-le :

      R/ Conduis-nous, Seigneur, aux sources de la vie !

      Par tes saints pasteurs, tu as manifesté la force de ton amour et de ton pardon,
      – ne cesse pas de nous montrer ta miséricorde.

      Tu as confié à des hommes la charge de mener ton peuple,
      – guide-nous toi-même par leurs paroles et leurs exemples.

      Par les saints pasteurs de ton peuple, tu t’es révélé le médecin des corps et des âmes,
      – assure-nous toujours leur ministère de vie et de sainteté.

      Tu as instruit ton peuple par des chefs pleins de sagesse,
      – par nos pasteurs, montre-nous, jour après jour, le chemin de la sainteté.

middleOfDay:
  tierce:
    antiphon: Père, comme tu m’as envoyé, je les envoie dans le monde.
    reading:
      biblicalReference: 1 Tm 4,16
      content: Sois attentif à ta conduite et à ton enseignement ; mets-y de la persévérance. En agissant ainsi, tu obtiendras le salut, pour toi-même et pour ceux qui t’écoutent.
    responsory: |-
      V/ Le Seigneur a choisi son serviteur,
      pour en faire le berger de son peuple.
  sexte:
    antiphon: Qui vous accueille, m’accueille, dit le Seigneur ; et qui m’accueille, accueille celui qui m’a envoyé.
    reading:
      biblicalReference: 1 Tm 1,12
      content: Je suis plein de reconnaissance pour celui qui me donne la force, Jésus Christ, notre Seigneur, car il m’a fait confiance en me chargeant du ministère.
    responsory: |-
      V/ Je n’ai pas honte d’être au service de l’Évangile,
      il est puissance de Dieu pour le salut.
  none:
    antiphon: |-
      Nous travaillons à l’œuvre de Dieu : vous êtes son champ et sa vigne, vous êtes la maison qu’il construit.
    reading:
      biblicalReference: cf. 1 Tm 3,13
      content: Ceux qui remplissent bien leur ministère sont très estimables et peuvent avoir beaucoup d’assurance grâce à leur foi au Christ Jésus.
    responsory: |-
      V/ Si le Seigneur ne bâtit la maison,
      les bâtisseurs travaillent en vain.

vespers:
  hymn:
  - unique-berger-o-jesus
  psalmody:
  - psalm: PSALM_14
    antiphon:
    - Grâce au don que Dieu m’a fait, je suis le serviteur de l’Évangile.
  - psalm: PSALM_111
    antiphon:
    - Serviteur fidèle, le Maître t’a confié les gens de sa maison.
  - psalm: NT_11
    antiphon:
    - |-
      Mes brebis écouteront ma voix : il y aura un seul troupeau, un seul pasteur.
  reading:
    biblicalReference: 1 P 5,1-4
    content: Je m’adresse à ceux qui exercent parmi vous la fonction d’Anciens, car moi aussi je fais partie des Anciens, je suis témoin de la passion du Christ, et je communierai à la gloire qui va se révéler. Soyez les bergers du troupeau de Dieu qui vous est confié ; veillez sur lui, non par contrainte mais de bon cœur, comme Dieu le veut ; non par une misérable cupidité mais par dévouement ; non pas en commandant en maîtres à ceux dont vous avez reçu la charge, mais en devenant les modèles du troupeau. Et, quand se manifestera le berger suprême, vous remporterez la couronne de gloire qui ne se flétrit pas.
  responsory: |-
    R/ Heureux le serviteur vigilant :
    il entrera dans la joie de son Maître.
    V/ Prenez garde à vous-mêmes
    et à tout le troupeau. R/
    V/ Conduisez l’Église de Dieu
    acquise par le sang de son Fils. R/
  evangelicAntiphon:
    common:
    - Heureux le serviteur fidèle et vigilant que le maître a établi sur sa maison pour donner à chacun en temps voulu sa mesure de froment.
  intercession:
    content: |-
      Louons le Christ, le Grand Prêtre pris parmi les hommes pour intervenir en notre faveur, et prions-le :

      R/ Sauve ton peuple, bénis ton héritage.

      Tu as donné à ton Église des pasteurs animés de l’esprit de l’Évangile,
      – accorde à ton peuple la même connaissance et le même courage.

      À la prière de Moïse et de tes saints pasteurs, tu as pardonné les péchés de ton peuple,
      – à leur intercession, purifie l’Église aujourd’hui.

      Tu t’es choisi des saints parmi ton peuple, et tu les as conduits par ton Esprit,
      – donne ce même Esprit à tous les pasteurs de ton Église.

      Toi, l’unique richesse des saints,
      – ne permets pas qu’aucun homme, sauvé par ton sang, demeure loin de toi.

      Toi qui donnes la vie au troupeau par la main de ses pasteurs,
      – ne permets pas qu’aucun défunt se perde ; tu t’es livré pour eux, sauve-les.


mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ps 131, 9
    content: |-
      Que tes prêtres soient vêtus de justice,
      >que tes fidèles crient de joie.
  - biblicalReference: cf. Dn 3, 84.87
    content: |-
      Prêtres du Seigneur, bénissez le Seigneur !
      Saints et humbles de cœur, louez Dieu.
  collect:
  - |-
    Nous t’en supplions, Dieu tout-puissant : *
    par l’intercession de (l’évêque) saint N.,
    >multiplie en nous les dons de ta grâce, /
    >et dirige le cours de notre vie dans la paix.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ex 32, 7-14
      headline: |-
        « Dieu a décidé de les détruire. C’est alors que Moïse, son élu, surgit sur la brèche, devant Lui, pour empêcher que sa fureur les extermine » (Ps 105 (106), 23)
      content: |-
        En ces jours-là,
        le Seigneur parla à Moïse :
        >« Va, descends,
        >car ton peuple s’est corrompu,
        >lui que tu as fait monter du pays d’Égypte.
        Ils n’auront pas mis longtemps
        >à s’écarter du chemin que je leur avais ordonné de suivre !
        Ils se sont fait un veau en métal fondu
        >et se sont prosternés devant lui.
        Ils lui ont offert des sacrifices en proclamant :
        >"Israël, voici tes dieux,
        >qui t’ont fait monter du pays d’Égypte." »
        Le Seigneur dit encore à Moïse :
        >« Je vois que ce peuple est un peuple à la nuque raide.
        Maintenant, laisse-moi faire ;
        >ma colère va s’enflammer contre eux
        >et je vais les exterminer !
        Mais, de toi, je ferai une grande nation. »
        Moïse apaisa le visage du Seigneur son Dieu
        en disant :
        >« Pourquoi, Seigneur,
        >ta colère s’enflammerait-elle contre ton peuple,
        >que tu as fait sortir du pays d’Égypte
        >par ta grande force et ta main puissante ?
        Pourquoi donner aux Égyptiens l’occasion de dire :
        >"C’est par méchanceté qu’il les a fait sortir ;
        >il voulait les tuer dans les montagnes
        >et les exterminer à la surface de la terre" ?
        Reviens de l’ardeur de ta colère,
        >renonce au mal que tu veux faire à ton peuple.
        Souviens-toi de tes serviteurs,
        >Abraham, Isaac et Israël,
        >à qui tu as juré par toi-même :
        >"Je multiplierai votre descendance
        >comme les étoiles du ciel ;
        >je donnerai, comme je l’ai dit,
        >tout ce pays à vos descendants,
        >et il sera pour toujours leur héritage." »
        Le Seigneur renonça au mal
        >qu’il avait voulu faire à son peuple.
    - biblicalRef: Dt 10, 8-9
      headline: |-
        « C’est le Seigneur qui est son héritage »
      content: |-
        Moïse dit au peuple :
        « Parmi les tribus d’Israël,
        le Seigneur mit à part les descendants de Lévi,
        pour porter l’arche de son Alliance,
        >se tenir en sa présence,
        >assurer le service divin,
        >et bénir le peuple au nom du Seigneur,
        >comme ils l’ont fait jusqu’à ce jour.
        C’est pourquoi Lévi n’a pas reçu sa part d’héritage
        >comme ses frères.
        C’est le Seigneur qui est son héritage,
        >comme l’a dit le Seigneur notre Dieu. »
    - biblicalRef: 1 S 16, 1b.6-13a
      headline: |-
        « Lève-toi, donne-lui l’onction : c’est lui ! »
      content: |-
        En ces jours-là,
        le Seigneur dit à Samuel :
        >« Prends une corne que tu rempliras d’huile, et pars !
        Je t’envoie auprès de Jessé de Bethléem,
        >car j’ai vu parmi ses fils mon roi. »
        Lorsqu’ils arrivèrent et que Samuel aperçut Éliab,
        il se dit :
        >« Sûrement, c’est lui le messie,
        >lui qui recevra l’onction du Seigneur ! »
        Mais le Seigneur dit à Samuel :
        >« Ne considère pas son apparence ni sa haute taille,
        >car je l’ai écarté.
        Dieu ne regarde pas comme les hommes :
        >les hommes regardent l’apparence,
        >mais le Seigneur regarde le cœur. »
        Jessé appela Abinadab et le présenta à Samuel,
        qui dit :
        >« Ce n’est pas lui non plus que le Seigneur a choisi. »
        Jessé présenta Shamma,
        mais Samuel dit :
        >« Ce n’est pas lui non plus que le Seigneur a choisi. »
        Jessé présenta ainsi à Samuel ses sept fils,
        et Samuel lui dit :
        >« Le Seigneur n’a choisi aucun de ceux-là. »
        Alors Samuel dit à Jessé :
        >« N’as-tu pas d’autres garçons ? »
        Jessé répondit :
        >« Il reste encore le plus jeune,
        >il est en train de garder le troupeau. »
        Alors Samuel dit à Jessé :
        >« Envoie-le chercher :
        >nous ne nous mettrons pas à table
        >tant qu’il ne sera pas arrivé. »
        Jessé le fit donc venir :
        >le garçon était roux, il avait de beaux yeux, il était beau.
        Le Seigneur dit alors :
        >« Lève-toi, donne-lui l’onction : c’est lui ! »
        Samuel prit la corne pleine d’huile,
        >et lui donna l’onction au milieu de ses frères.
        L’Esprit du Seigneur s’empara de David à partir de ce jour-là.
    - biblicalRef: Is 6, 1-8
      headline: |-
        « Qui enverrai-je ? qui sera notre messager ? »
      content: |-
        L’année de la mort du roi Ozias,
        je vis le Seigneur qui siégeait sur un trône très élevé ;
        >les pans de son manteau remplissaient le Temple.
        Des séraphins se tenaient au-dessus de lui.
        Ils avaient chacun six ailes :
        >deux pour se couvrir le visage,
        >deux pour se couvrir les pieds,
        >et deux pour voler.
        Ils se criaient l’un à l’autre :
        >« Saint ! Saint ! Saint, le Seigneur de l’univers !
        Toute la terre est remplie de sa gloire. »
        Les pivots des portes se mirent à trembler
        >à la voix de celui qui criait,
        et le Temple se remplissait de fumée.
        Je dis alors :
        >« Malheur à moi ! je suis perdu,
        >car je suis un homme aux lèvres impures,
        >j’habite au milieu d’un peuple aux lèvres impures :
        >et mes yeux ont vu le Roi, le Seigneur de l’univers ! »
        L’un des séraphins vola vers moi,
        tenant un charbon brûlant
        >qu’il avait pris avec des pinces sur l’autel.
        Il l’approcha de ma bouche et dit :
        >« Ceci a touché tes lèvres,
        >et maintenant ta faute est enlevée,
        >ton péché est pardonné. »
        J’entendis alors la voix du Seigneur qui disait :
        >« Qui enverrai-je ?
        qui sera notre messager ? »
        Et j’ai répondu :
        >« Me voici : envoie-moi ! »
    - biblicalRef: Is 61, 1-3a
      headline: |-
        « Le Seigneur m’a consacré par l’onction. Il m’a envoyé porter la Bonne Nouvelle aux pauvres »
      content: |-
        L’esprit du Seigneur Dieu est sur moi
        >parce que le Seigneur m’a consacré par l’onction.
        Il m’a envoyé annoncer la bonne nouvelle aux humbles,
        >guérir ceux qui ont le cœur brisé,
        proclamer aux captifs leur délivrance,
        >aux prisonniers leur libération,
        proclamer une année de bienfaits accordée par le Seigneur,
        >et un jour de vengeance pour notre Dieu,
        consoler tous ceux qui sont en deuil,
        >ceux qui sont en deuil dans Sion,
        mettre le diadème sur leur tête au lieu de la cendre,
        >l’huile de joie au lieu du deuil,
        >un habit de fête au lieu d’un esprit abattu.
    - biblicalRef: Jr 1, 4-9
      headline: |-
        « Tu iras vers tous ceux à qui je t’enverrai »
      content: |-
        La parole du Seigneur me fut adressée :
        >« Avant même de te façonner dans le sein de ta mère,
        >je te connaissais ;
        >avant que tu viennes au jour,
        >je t’ai consacré ;
        >je fais de toi un prophète pour les nations. »
        Et je dis :
        >« Ah ! Seigneur mon Dieu !
        Vois donc : je ne sais pas parler,
        >je suis un enfant ! »
        Le Seigneur reprit :
        >« Ne dis pas : "Je suis un enfant !"
        >Tu iras vers tous ceux à qui je t’enverrai ;
        >tout ce que je t’ordonnerai, tu le diras.
        Ne les crains pas,
        >car je suis avec toi pour te délivrer
        >- oracle du Seigneur. »
        Puis le Seigneur étendit la main et me toucha la bouche.
        Il me dit :
        >« Voici, je mets dans ta bouche mes paroles ! »
    - biblicalRef: Ez 3, 16-21
      headline: |-
        « Je fais de toi un guetteur pour la maison d’Israël »
      content: |-
        En ces jours-là,
        la parole du Seigneur me fut adressée :
        >« Fils d’homme, je fais de toi un guetteur
        >pour la maison d’Israël.
        Lorsque tu entendras une parole de ma bouche,
        >tu les avertiras de ma part.
        Si je dis au méchant : "Tu vas mourir",
        >et que tu ne l’avertisses pas,
        >si tu ne lui dis pas d’abandonner sa conduite mauvaise
        >afin qu’il vive,
        >lui, le méchant, mourra de son péché,
        >mais à toi, je demanderai compte de son sang.
        Au contraire, si tu avertis le méchant,
        >et qu’il ne se détourne pas
        >de sa méchanceté et de sa conduite mauvaise,
        >lui mourra de son péché,
        >mais toi, tu auras sauvé ta vie.
        Si le juste se détourne de sa justice
        >et fait le mal,
        >je le ferai trébucher :
        >il mourra.
        Parce que tu ne l’auras pas averti,
        >il mourra de son péché,
        >et l’on ne se souviendra plus
        >de la justice qu’il avait pratiquée ;
        >mais à toi je demanderai compte de son sang.
        Au contraire, si tu avertis le juste de ne pas pécher,
        >et qu’en effet il ne pèche pas,
        >c’est certain, il vivra parce qu’il aura été averti,
        >et toi, tu auras sauvé ta vie. »
    - biblicalRef: Ez 34, 11-16
      headline: |-
        « Comme un berger veille sur son troupeau, ainsi je veillerai sur mes brebis »
      content: |-
        Ainsi parle le Seigneur Dieu :
        Voici que moi-même, je m’occuperai de mes brebis,
        >et je veillerai sur elles.
        Comme un berger veille sur les brebis de son troupeau
        >quand elles sont dispersées,
        ainsi je veillerai sur mes brebis,
        et j’irai les délivrer dans tous les endroits où elles ont été dispersées
        >un jour de nuages et de sombres nuées.
        Je les ferai sortir d’entre les peuples,
        >je les rassemblerai des différents pays
        >et je les ramènerai sur leur terre ;
        je les ferai paître sur les montagnes d’Israël,
        >dans les vallées, dans les endroits les meilleurs.
        Je les ferai paître dans un bon pâturage,
        >et leurs prairies seront sur les hauteurs d’Israël.
        Là, mes brebis se reposeront dans de belles prairies,
        >elles brouteront dans de gras pâturages, sur les monts d’Israël.
        C’est moi qui ferai paître mon troupeau,
        >et c’est moi qui le ferai reposer,
        >- oracle du Seigneur Dieu.
        La brebis perdue, je la chercherai ;
        >l’égarée, je la ramènerai.
        Celle qui est blessée, je la panserai.
        Celle qui est malade, je lui rendrai des forces.
        Celle qui est grasse et vigoureuse,
        >je la garderai, je la ferai paître selon le droit.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      label: null
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      label: null
      refAbbr: cf. 22, 1
      chorus:
      - chorusRef: cf. 22, 1
        chorus: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi :
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      label: null
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        « Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
    - biblicalRef: Ps 88 (89), 2-3, 4-5, 21-22, 25.27
      label: null
      refAbbr: cf. 88, 2a
      chorus:
      - chorusRef: cf. 88, 2a
        chorus: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : C’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        « Avec mon élu, j’ai fait une alliance,
        j’ai juré à David, mon serviteur :
        j’établirai ta dynastie pour toujours,
        je te bâtis un trône pour la suite des âges.

        « J’ai trouvé David, mon serviteur,
        je l’ai sacré avec mon huile sainte ;
        et ma main sera pour toujours avec lui,
        mon bras fortifiera son courage.

        « Mon amour et ma fidélité sont avec lui,
        mon nom accroît sa vigueur ;
        il me dira : “Tu es mon Père,
        mon Dieu, mon roc et mon salut !” »
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      label: null
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
    - biblicalRef: Ps 105 (106), 19-20, 21-22, 23
      label: null
      refAbbr: cf. 105, 4
      chorus:
      - chorusRef: cf. 105, 4
        chorus: |-
          Souviens-toi de nous, Seigneur,
          dans ta bienveillance pour ton peuple.
      content: |-
        À l’Horeb ils fabriquent un veau,
        ils adorent un objet en métal :
        ils échangeaient ce qui était leur gloire
        pour l’image d’un taureau, d’un ruminant.

        Ils oublient le Dieu qui les sauve,
        qui a fait des prodiges en Égypte,
        des miracles au pays de Cham,
        des actions terrifiantes sur la mer Rouge.

        Dieu a décidé de les détruire.
        C’est alors que Moïse, son élu,
        surgit sur la brèche, devant lui,
        pour empêcher que sa fureur les extermine.
    - biblicalRef: Ps 109 (110), 1, 2, 3, 4
      label: null
      refAbbr: cf. 109, 4
      chorus:
      - chorusRef: cf. 109, 4
        chorus: |-
          Tu es prêtre à jamais
          selon l’ordre de Melkisédek.
      content: |-
        Oracle du Seigneur à mon seigneur :
        « Siège à ma droite,
        et je ferai de tes ennemis
        le marchepied de ton trône. »

        De Sion, le Seigneur te présente
        le sceptre de ta force :
        « Domine jusqu’au cœur de l’ennemi. »

        Le jour où paraît ta puissance,
        tu es prince, éblouissant de sainteté :
        « Comme la rosée qui naît de l’aurore,
        je t’ai engendré. »

        Le Seigneur l’a juré
        dans un serment irrévocable :
        « Tu es prêtre à jamais
        selon l’ordre du roi Melkisédek. »
    - biblicalRef: Ps 116 (117), 1, 2
      label: null
      refAbbr: Mc 16, 15
      chorus:
      - chorusRef: Mc 16, 15
        chorus: |-
          Allez dans le monde entier.
          Proclamez l’Évangile.
      content: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !

        Son amour envers nous s’est montré le plus fort ;
        éternelle est la fidélité du Seigneur !
  - partType: READING_2
    partContents:
    - biblicalRef: Rm 12, 3-13
      headline: |-
        « Selon la grâce que Dieu nous a accordée, nous avons reçu des dons qui sont différents »
      content: |-
        Frères,
        par la grâce qui m’a été accordée,
        >je dis à chacun d’entre vous :
        n’ayez pas de prétentions déraisonnables,
        >mais pensez à être raisonnables,
        >chacun dans la mesure de la mission que Dieu lui a confiée.
        Prenons une comparaison :
        en un corps unique,
        nous avons plusieurs membres,
        >qui n’ont pas tous la même fonction ;
        de même, nous qui sommes plusieurs,
        nous sommes un seul corps dans le Christ,
        >et membres les uns des autres, chacun pour sa part.
        Et selon la grâce que Dieu nous a accordée,
        >nous avons reçu des dons qui sont différents.
        Si c’est le don de prophétie, que ce soit à proportion du message confié ;
        >si c’est le don de servir, que l’on serve ;
        >si l’on est fait pour enseigner, que l’on enseigne ;
        >pour réconforter, que l’on réconforte.
        Celui qui donne, qu’il soit généreux ;
        >celui qui dirige, qu’il soit empressé ;
        >celui qui pratique la miséricorde, qu’il ait le sourire.
        Que votre amour soit sans hypocrisie.
        Fuyez le mal avec horreur,
        >attachez-vous au bien.
        Soyez unis les uns aux autres par l’affection fraternelle,
        >rivalisez de respect les uns pour les autres.
        Ne ralentissez pas votre élan,
        >restez dans la ferveur de l’Esprit,
        >servez le Seigneur,
        ayez la joie de l’espérance,
        >tenez bon dans l’épreuve,
        >soyez assidus à la prière.
        Partagez avec les fidèles qui sont dans le besoin,
        >pratiquez l’hospitalité avec empressement.
    - biblicalRef: 1 Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
    - biblicalRef: 1 Co 4, 1-5
      headline: |-
        « Auxiliaires du Christ et intendants des mystères de Dieu »
      content: |-
        Frères,
        que l’on nous regarde
        >comme des auxiliaires du Christ
        >et des intendants des mystères de Dieu.
        Or, tout ce que l’on demande aux intendants,
        >c’est d’être trouvés dignes de confiance.
        Pour ma part, je me soucie fort peu d’être soumis à votre jugement,
        >ou à celui d’une autorité humaine ;
        d’ailleurs, je ne me juge même pas moi-même.
        Ma conscience ne me reproche rien,
        >mais ce n’est pas pour cela que je suis juste :
        celui qui me soumet au jugement,
        c’est le Seigneur.
        Ainsi, ne portez pas de jugement prématuré,
        >mais attendez la venue du Seigneur,
        car il mettra en lumière ce qui est caché dans les ténèbres,
        >et il rendra manifestes les intentions des cœurs.
        Alors, la louange qui revient à chacun
        >lui sera donnée par Dieu.
    - biblicalRef: 1 Co 9, 16-19.22-23
      headline: |-
        « Malheur à moi si je n’annonçais pas l’Évangile ! »
      content: |-
        Frères,
        annoncer l’Évangile,
        >ce n’est pas là pour moi un motif de fierté,
        >c’est une nécessité qui s’impose à moi.
        Malheur à moi si je n’annonçais pas l’Évangile !
        Certes, si je le fais de moi-même,
        >je mérite une récompense.
        Mais je ne le fais pas de moi-même,
        >c’est une mission qui m’est confiée.
        Alors quel est mon mérite ?
        C’est d’annoncer l’Évangile
        >sans rechercher aucun avantage matériel,
        >et sans faire valoir mes droits de prédicateur de l’Évangile.
        Oui, libre à l’égard de tous,
        je me suis fait l’esclave de tous
        >afin d’en gagner le plus grand nombre possible.
        Avec les faibles, j’ai été faible,
        >pour gagner les faibles.
        Je me suis fait tout à tous
        >pour en sauver à tout prix quelques-uns.
        Et tout cela, je le fais à cause de l’Évangile,
        >pour y avoir part, moi aussi.
    - biblicalRef: 2 Co 3, 1-6a
      headline: |-
        « Il nous a rendus capables d’être les ministres d’une Alliance nouvelle »
      content: |-
        Frères,
        allons-nous, une fois de plus, nous recommander nous-mêmes ?
        Ou alors avons-nous besoin, comme certains,
        >de lettres de recommandation
        >qu’il faudrait vous présenter,
        >ou obtenir de vous ?
        Notre lettre de recommandation, c’est vous,
        >elle est écrite dans nos cœurs,
        >et tout le monde peut en avoir connaissance et la lire.
        De toute évidence, vous êtes cette lettre du Christ,
        >produite par notre ministère,
        écrite non pas avec de l’encre,
        >mais avec l’Esprit du Dieu vivant,
        non pas, comme la Loi, sur des tables de pierre,
        >mais sur des tables de chair, sur vos cœurs.
        Et si nous avons une telle confiance en Dieu
        >par le Christ,
        ce n’est pas à cause d’une capacité personnelle
        >que nous pourrions nous attribuer :
        notre capacité vient de Dieu.
        Lui nous a rendus capables
        >d’être les ministres d’une Alliance nouvelle.
    - biblicalRef: 2 Co 4, 1-2.5-7
      headline: |-
        « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
      content: |-
        Frères,
        nous, les Apôtres,
        ayant reçu ce ministère par la miséricorde de Dieu,
        >nous ne perdons pas courage :
        nous avons rejeté toute dissimulation honteuse,
        >nous n’agissons pas avec ruse,
        >et nous ne falsifions pas la parole de Dieu.
        Au contraire, nous manifestons la vérité,
        >et ainsi nous nous recommandons nous-mêmes
        >à toute conscience humaine devant Dieu.
        Ce que nous proclamons,
        >ce n’est pas nous-mêmes ;
        c’est ceci : Jésus Christ est le Seigneur ;
        >et nous sommes vos serviteurs, à cause de Jésus.
        Car Dieu qui a dit :
        >Du milieu des ténèbres brillera la lumière,
        a lui-même brillé dans nos cœurs
        >pour faire resplendir la connaissance de sa gloire
        >qui rayonne sur le visage du Christ.
        Mais ce trésor, nous le portons
        >comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        >appartient à Dieu et ne vient pas de nous.
    - biblicalRef: 2 Co 5, 14-20
      headline: |-
        « Dieu nous a donné le ministère de la réconciliation »
      content: |-
        Frères,
        l’amour du Christ nous saisit
        quand nous pensons qu’un seul est mort pour tous,
        >et qu’ainsi tous ont passé par la mort.
        Car le Christ est mort pour tous,
        afin que les vivants n’aient plus leur vie centrée sur eux-mêmes,
        >mais sur lui, qui est mort et ressuscité pour eux.
        Désormais nous ne regardons plus personne
        >d’une manière simplement humaine :
        si nous avons connu le Christ de cette manière,
        >maintenant nous ne le connaissons plus ainsi.
        Si donc quelqu’un est dans le Christ,
        >il est une créature nouvelle.
        Le monde ancien s’en est allé,
        >un monde nouveau est déjà né.
        Tout cela vient de Dieu :
        il nous a réconciliés avec lui par le Christ,
        >et il nous a donné le ministère de la réconciliation.
        Car c’est bien Dieu
        >qui, dans le Christ, réconciliait le monde avec lui :
        il n’a pas tenu compte des fautes,
        >et il a déposé en nous la parole de la réconciliation.
        Nous sommes donc les ambassadeurs du Christ,
        >et par nous c’est Dieu lui-même qui lance un appel :
        nous le demandons au nom du Christ,
        >laissez-vous réconcilier avec Dieu.
    - biblicalRef: Ep 4, 1-7.11-13
      headline: |-
        « Pour que les tâches du ministère soient accomplies et que se construise le corps du Christ »
      content: |-
        Frères,
        >moi qui suis en prison à cause du Seigneur,
        >je vous exhorte à vous conduire
        >d’une manière digne de votre vocation :
        >ayez beaucoup d’humilité, de douceur et de patience,
        >supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.
        Et les dons qu’il a faits,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
    - biblicalRef: Col 1, 24-29
      headline: |-
        « De cette Église, je suis devenu ministre, et Dieu m’a confié une mission »
      content: |-
        Frères,
        maintenant je trouve la joie dans les souffrances
        >que je supporte pour vous ;
        ce qui reste à souffrir des épreuves du Christ
        >dans ma propre chair,
        je l’accomplis pour son corps qui est l’Église.
        De cette Église, je suis devenu ministre,
        et la mission que Dieu m’a confiée,
        >c’est de mener à bien pour vous l’annonce de sa parole,
        le mystère qui était caché depuis toujours
        >à toutes les générations,
        mais qui maintenant a été manifesté
        >à ceux qu’il a sanctifiés.
        Car Dieu a bien voulu leur faire connaître
        >en quoi consiste la gloire sans prix de ce mystère
        >parmi toutes les nations :
        le Christ est parmi vous,
        >lui, l’espérance de la gloire !
        Ce Christ, nous l’annonçons :
        >nous avertissons tout homme,
        >nous instruisons chacun en toute sagesse,
        >afin de l’amener à sa perfection dans le Christ.
        C’est pour cela que je m’épuise à combattre,
        >avec la force du Christ
        >dont la puissance agit en moi.
    - biblicalRef: 1 Th 2, 2b-8
      headline: |-
        « Nous aurions voulu vous donner non seulement l’Évangile de Dieu, mais jusqu’à nos propres vies »
      content: |-
        Frères,
        nous avons trouvé en notre Dieu pleine assurance
        >pour vous annoncer, au prix de grandes luttes,
        >l’Évangile de Dieu.
        Et quand nous vous exhortions,
        ce n’était pas avec des doctrines fausses,
        >ni des motifs impurs, ni par ruse.
        En effet, pour nous confier l’Évangile,
        >Dieu a éprouvé notre valeur,
        de sorte que nous parlons,
        >non pas pour plaire aux hommes, mais à Dieu,
        >lui qui met nos cœurs à l’épreuve.
        Jamais, nous n’avons eu un mot de flatterie, vous le savez,
        >jamais de motifs intéressés, Dieu en est témoin ;
        jamais nous n’avons recherché la gloire qui vient des hommes,
        >ni auprès de vous ni auprès d’autres personnes.
        Alors que nous aurions pu nous imposer
        >en qualité d’apôtres du Christ,
        au contraire, nous avons été pleins de douceur avec vous,
        >comme une mère qui entoure de soins ses nourrissons.
        Ayant pour vous une telle affection,
        nous aurions voulu vous donner non seulement l’Évangile de Dieu,
        >mais jusqu’à nos propres vies,
        car vous nous étiez devenus très chers.
    - biblicalRef: 2 Tm 1, 13-14 ; 2, 1-3
      headline: |-
        « Garde le dépôt de la foi avec l’aide de l’Esprit Saint »
      content: |-
        Bien-aimé,
        tiens-toi au modèle donné par les paroles solides
        >que tu m’as entendu prononcer dans la foi
        >et dans l’amour qui est dans le Christ Jésus.
        Garde le dépôt de la foi dans toute sa beauté,
        >avec l’aide de l’Esprit Saint qui habite en nous.
        Toi donc, mon enfant, trouve ta force
        >dans la grâce qui est en Jésus Christ.
        Ce que tu m’as entendu dire en présence de nombreux témoins,
        confie-le à des hommes dignes de foi
        >qui seront capables de l’enseigner aux autres, à leur tour.
        Prends ta part de souffrance
        >comme un bon soldat du Christ Jésus.
    - biblicalRef: 2 Tm 4, 1-5
      headline: |-
        « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        je t’en conjure,
        >au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        interviens à temps et à contretemps,
        dénonce le mal,
        fais des reproches, encourage,
        >toujours avec patience et souci d’instruire.
        Un temps viendra
        >où les gens ne supporteront plus l’enseignement de la saine doctrine ;
        mais, au gré de leurs caprices,
        >ils iront se chercher une foule de maîtres
        >pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        >pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        >supporte la souffrance,
        fais ton travail d’évangélisateur,
        >accomplis jusqu’au bout ton ministère.
    - biblicalRef: 1 P 5, 1-4
      headline: |-
        « Soyez les bergers du troupeau de Dieu »
      content: |-
        Bien-aimés,
        les anciens en fonction parmi vous, je les exhorte,
        moi qui suis ancien comme eux
        >et témoin des souffrances du Christ,
        >communiant à la gloire qui va se révéler :
        >soyez les pasteurs du troupeau de Dieu qui se trouve chez vous ;
        veillez sur lui, non par contrainte mais de plein gré,
        >selon Dieu ;
        non par cupidité mais par dévouement ;
        non pas en commandant en maîtres à ceux qui vous sont confiés,
        >mais en devenant les modèles du troupeau.
        Et, quand se manifestera le Chef des pasteurs,
        >vous recevrez la couronne de gloire qui ne se flétrit pas.
  - partType: ALLELUIA
    partContents:
    - biblicalRef: cf. Mt 23, 9b.10b
      content: |-
        Vous n’avez qu’un seul Père,
        >celui qui est aux cieux ;
        vous n’avez qu’un seul maître, le Christ.
    - biblicalRef: Mt 28, 19a.20b
      content: |-
        Allez ! De toutes les nations faites des disciples,
        >dit le Seigneur.
        Moi, je suis avec vous tous les jours
        >jusqu’à la fin du monde.
    - biblicalRef: Mc 1, 17
      content: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
    - biblicalRef: Lc 4, 18cd
      content: |-
        Le Seigneur m’a envoyé
        >porter la Bonne Nouvelle aux pauvres,
        >annoncer aux captifs leur libération.
    - biblicalRef: Jn 10, 14
      content: |-
        Je suis le bon pasteur, dit le Seigneur ;
        >je connais mes brebis
        et mes brebis me connaissent.
    - biblicalRef: Jn 15, 5
      content: |-
        Moi, je suis la vigne, et vous les sarments,
        >dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        >celui-là porte beaucoup de fruit.
    - biblicalRef: Jn 15, 15b
      content: |-
        Je vous appelle mes amis, dit le Seigneur,
        >car tout ce que j’ai entendu de mon Père,
        >je vous l’ai fait connaître.
    - biblicalRef: 2 Co 5, 19
      content: |-
        Dieu, dans le Christ, réconciliait le monde avec lui :
        il a déposé en nous la parole de la réconciliation.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 9, 35-38
      headline: |-
        « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        En ce temps-là,
        Jésus parcourait toutes les villes et tous les villages,
        >enseignant dans leurs synagogues,
        >proclamant l’Évangile du Royaume
        >et guérissant toute maladie et toute infirmité.
        Voyant les foules, Jésus fut saisi de compassion envers elles
        >parce qu’elles étaient désemparées et abattues
        >comme des brebis sans berger.
        Il dit alors à ses disciples :
        >« La moisson est abondante,
        >mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        >d’envoyer des ouvriers pour sa moisson. »
    - biblicalRef: Mt 23, 8-12
      headline: |-
        « Le plus grand parmi vous sera votre serviteur »
      acclamationAntiphon: |-
        Vous n’avez qu’un seul Père,
        celui qui est aux cieux ;
        vous n’avez qu’un seul maître, le Christ.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Ne vous faites pas donner le titre de Rabbi,
        >car vous n’avez qu’un seul maître pour vous enseigner,
        >et vous êtes tous frères.
        Ne donnez à personne sur terre le nom de père,
        >car vous n’avez qu’un seul Père, celui qui est aux cieux.
        Ne vous faites pas non plus donner le titre de maîtres,
        >car vous n’avez qu’un seul maître, le Christ.
        Le plus grand parmi vous sera votre serviteur.
        Qui s’élèvera sera abaissé,
        >qui s’abaissera sera élevé. »
    - biblicalRef: Mt 28, 16-20
      headline: |-
        « De toutes les nations faites des disciples »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        >apprenez-leur à observer
        >tout ce que je vous ai commandé.
        Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »
    - biblicalRef: Mc 1, 14-20
      headline: |-
        « Je vous ferai devenir pêcheurs d’hommes »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        Après l’arrestation de Jean le Baptiste,
        Jésus partit pour la Galilée
        >proclamer l’Évangile de Dieu ;
        il disait :
        >« Les temps sont accomplis :
        >le règne de Dieu est tout proche.
        Convertissez-vous et croyez à l’Évangile. »
        Passant le long de la mer de Galilée,
        Jésus vit Simon et André, le frère de Simon,
        >en train de jeter les filets dans la mer,
        >car c’étaient des pêcheurs.
        Il leur dit :
        >« Venez à ma suite.
        Je vous ferai devenir pêcheurs d’hommes. »
        Aussitôt, laissant leurs filets,
        >ils le suivirent.
        Jésus avança un peu
        et il vit Jacques, fils de Zébédée, et son frère Jean,
        >qui étaient dans la barque et réparaient les filets.
        Aussitôt, Jésus les appela.
        Alors, laissant dans la barque leur père Zébédée avec ses ouvriers,
        >ils partirent à sa suite.
    - biblicalRef: Lc 10, 1-9
      headline: |-
        « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        parmi les disciples,
        le Seigneur en désigna encore 72,
        et il les envoya deux par deux, en avant de lui,
        >en toute ville et localité où lui-même allait se rendre.
        Il leur dit :
        >« La moisson est abondante,
        >mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        >d’envoyer des ouvriers pour sa moisson.
        Allez ! Voici que je vous envoie
        >comme des agneaux au milieu des loups.
        Ne portez ni bourse, ni sac, ni sandales,
        >et ne saluez personne en chemin.
        Mais dans toute maison où vous entrerez,
        >dites d’abord :
        >"Paix à cette maison."
        >S’il y a là un ami de la paix,
        >votre paix ira reposer sur lui ;
        >sinon, elle reviendra sur vous.
        Restez dans cette maison,
        >mangeant et buvant ce que l’on vous sert ;
        >car l’ouvrier mérite son salaire.
        Ne passez pas de maison en maison.
        Dans toute ville où vous entrerez
        >et où vous serez accueillis,
        >mangez ce qui vous est présenté.
        Guérissez les malades qui s’y trouvent
        >et dites-leur :
        >"Le règne de Dieu s’est approché de vous." »
    - biblicalRef: Lc 22, 24-30
      headline: |-
        « Je dispose pour vous du Royaume, comme mon Père en a disposé pour moi »
      acclamationAntiphon: |-
        Je vous appelle mes amis, dit le Seigneur,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
      content: |-
        En ce temps-là,
        les Apôtres en arrivèrent à se quereller :
        >lequel d’entre eux, à leur avis, était le plus grand ?
        Mais Jésus leur dit :
        >« Les rois des nations
        >les commandent en maîtres,
        >et ceux qui exercent le pouvoir sur elles
        >se font appeler bienfaiteurs.
        Pour vous, rien de tel !
        Au contraire, que le plus grand d’entre vous
        >devienne comme le plus jeune,
        >et le chef, comme celui qui sert.
        Quel est en effet le plus grand :
        >celui qui est à table, ou celui qui sert ?
        N’est-ce pas celui qui est à table ?
        Eh bien moi, je suis au milieu de vous
        >comme celui qui sert.
        Vous, vous avez tenu bon avec moi dans mes épreuves.
        Et moi, je dispose pour vous du Royaume,
        >comme mon Père en a disposé pour moi.
        Ainsi vous mangerez et boirez à ma table
        >dans mon Royaume,
        >et vous siégerez sur des trônes
        >pour juger les douze tribus d’Israël. »
    - biblicalRef: Jn 10, 11-16
      headline: |-
        « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: null
      content: |-
        En ce temps-là, Jésus disait :
        >« Moi, je suis le bon pasteur, le vrai berger,
        >qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        >les brebis ne sont pas à lui :
        >s’il voit venir le loup,
        >il abandonne les brebis et s’enfuit ;
        >le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        >et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        >je connais mes brebis,
        >et mes brebis me connaissent,
        >comme le Père me connaît,
        >et que je connais le Père ;
        >et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        >qui ne sont pas de cet enclos :
        >celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        >il y aura un seul troupeau
        >et un seul pasteur. »
    - biblicalRef: Jn 15, 9-17
      headline: |-
        « Je ne vous appelle plus serviteurs, je vous appelle mes amis »
      acclamationAntiphon: null
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Comme le Père m’a aimé,
        >moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        >vous demeurerez dans mon amour,
        >comme moi, j’ai gardé les commandements de mon Père,
        >et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        >et que votre joie soit parfaite.
        Mon commandement, le voici :
        >Aimez-vous les uns les autres
        >comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        >que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        >si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        >car le serviteur ne sait pas ce que fait son maître ;
        >je vous appelle mes amis,
        >car tout ce que j’ai entendu de mon Père,
        >je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        >c’est moi qui vous ai choisis et établis
        >afin que vous alliez,
        >que vous portiez du fruit,
        >et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        >il vous le donnera.
        Voici ce que je vous commande :
        >c’est de vous aimer les uns les autres. »
    - biblicalRef: Jn 21, 15-17 (pour un pape)
      headline: |-
        « Sois le berger de mes brebis »
      acclamationAntiphon: null
      content: |-
        Jésus se manifesta à ses disciples au bord du lac.
        Quand ils eurent mangé, il dit à Simon-Pierre :
        >« Simon, fils de Jean,
        >m’aimes-tu vraiment, plus que ceux-ci ? »
        Il lui répond :
        >« Oui, Seigneur ! Toi, tu le sais : je t’aime. »
        Jésus lui dit :
        >« Sois le berger de mes agneaux. »
        Il lui dit une deuxième fois :
        >« Simon, fils de Jean, m’aimes-tu vraiment ? »
        Il lui répond :
        >« Oui, Seigneur ! Toi, tu le sais : je t’aime. »
        Jésus lui dit :
        >« Sois le pasteur de mes brebis. »
        Il lui dit, pour la troisième fois :
        >« Simon, fils de Jean, m’aimes-tu ? »
        Pierre fut peiné
        parce que, la troisième fois, Jésus lui demandait :
        >« M’aimes-tu ? »
        Il lui répond :
        >« Seigneur, toi, tu sais tout :
        >tu sais bien que je t’aime. »
        Jésus lui dit :
        >« Sois le berger de mes brebis. »

  offeringPrayer:
  - |-
    Regarde, Seigneur,
    >les offrandes déposées sur ton autel
    >en l’honneur de saint N. ; *
    et, comme tu lui as donné la gloire
    >par ces saints mystères, /
    >accorde-nous largement ton pardon.
    Par le Christ, notre Seigneur.
  prefaceList:
  - holy_pastors
  communionAntiphon:
  - biblicalReference: cf. Mt 24, 46-47
    content: |-
      Heureux le serviteur que son maître, en arrivant,
      >trouvera vigilant !
      Amen, je vous le déclare :
      >il l’établira sur tous ses biens.
  - biblicalReference: cf. Lc 12, 42
    content: |-
      Voici le serviteur fidèle et avisé
      >que le maître a établi sur sa maison,
      >pour donner à chacun, en temps voulu, sa part de blé.
  prayerAfterCommunion:
  - |-
    Par cette communion à la table du ciel, Dieu tout-puissant, +
    >raffermis et augmente les forces d’en haut 
    >en tous ceux qui célèbrent la fête de saint N. ; *
    aide-nous à garder dans son intégrité le don de la foi, /
    >et à marcher sur le chemin du salut qui nous est proposé. 
    Par le Christ, notre Seigneur.

