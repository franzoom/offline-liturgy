readings:
  biblicalReading:
    - title: LECTURE DU LIVRE DE LA SAGESSE
      subtitle: Bonheur du juste
      ref: Sg 7, 7-16.22-30
      content: |-
        J’ai prié et le discernement m’a été donné, j’ai imploré et l’esprit de la Sagesse est venu en moi. Je l’ai préférée aux sceptres et aux trônes, auprès d’elle ; j’ai estimé néant la richesse ; je ne l’ai pas comparée à la pierre inestimable car tout l’or du monde, face à elle, ne serait qu’un peu de sable et l’argent, devant elle, paraîtrait de la boue. Plus que la santé et la beauté je l’ai aimée, et je décidai de l’avoir pour lumière, car sa clarté ne connaît pas de déclin.
        Mais avec elle, elle m’a apporté tous les biens à la fois, elle tenait dans ses mains une richesse incalculable. J’ai profité de tous ces biens, les sachant dirigés par la Sagesse ; j’ignorais pourtant qu’elle-même en était l’auteur. Ce que j’avais appris avec simplicité, j’en fais part sans réserve, je ne tairai pas sa richesse. Car elle est pour les hommes un trésor inépuisable. Ceux qui l’ont exploité se sont concilié l’amitié de Dieu, recommandés à lui par les dons provenant de l’éducation.
        Que Dieu m’accorde de parler avec intelligence et de concevoir des pensées dignes des dons reçus, car c’est lui qui guide la Sagesse et dirige les sages. Il tient en son pouvoir et nous-mêmes et nos paroles, tout savoir et toute science des techniques. L’artisane de l’univers, la Sagesse, m’a instruit.
        Car il y a en elle un esprit intelligent, saint, unique, multiple, subtil, mobile, distinct, sans tache, clair, inaltérable, aimant le bien, diligent, indépendant, bienfaisant, ami de l’homme, ferme, assuré, tranquille, qui peut tout, surveille tout, et pénètre tous les esprits, les intelligents, les purs, les plus subtils. Aussi la Sagesse est-elle plus mobile qu’aucun mouvement, à cause de sa pureté, elle passe et pénètre à travers tout. Elle est un effluve de la puissance de Dieu, une pure irradiation de la gloire du Tout-Puissant ; c’est pourquoi nulle souillure ne se glisse en elle. Elle est un reflet de la lumière éternelle, un miroir sans tache de l’activité de Dieu et une image de sa bonté.
        Comme elle est unique, elle peut tout ; demeurant en elle-même, elle renouvelle l’univers et, au long des âges, elle passe dans les âmes saintes pour former des amis de Dieu et des prophètes. Car seuls sont aimés de Dieu ceux qui partagent l’intimité de la Sagesse. Elle est plus radieuse que le soleil et surpasse toute constellation. Comparée à la lumière, sa supériorité éclate : la nuit succède à la lumière, mais le mal ne prévaut pas sur la Sagesse.

      responsory: |-
        [rubric](Stance)[/rubric]
        Comme à l’aube du premier jour
        la Parole de Dieu créait l’univers,
        comme à l’heure de midi
        la Lumière épousait notre chair de souffrance
        pour la transfigurer,
        aujourd’hui encore, et par-delà le temps,
        le Verbe de vie consacre le monde
        en son Eucharistie.
        
        R/ Qu’il nous soit fait, Seigneur,
        selon ta Parole.
        
        L’heure vient, où les morts
        entendront la voix du Fils de Dieu,
        ceux qui l’entendent vivent !
        
        Celui qui garde ma Parole,
        mon Père l’aimera,
        et nous viendrons en lui !
        
        Demeurez dans ma Parole :
        vous connaîtrez la Vérité,
        et la Vérité vous fera libres !

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Si 15, 5 (Vg)
    content: |-
      Au milieu de son Église, le Seigneur a donné la parole à saint N.;
      il l’a rempli de l’esprit de sagesse et d’intelligence,
      >et lui a donné un vêtement de gloire, alléluia.
  - biblicalReference: cf. Ps 36, 30-31
    content: |-
      Les lèvres du juste méditent la sagesse
      >et sa bouche énonce le droit.
      La loi de son Dieu est dans son cœur, alléluia.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ac 2, 14a.22-24.32-36
      headline: |-
        « Dieu l’a fait Seigneur et Christ »
      content: |-
        Le jour de la Pentecôte,
        Pierre, debout avec les onze autres Apôtres,
        éleva la voix et leur fit cette déclaration :
        >« Hommes d’Israël, écoutez les paroles que voici.
        Il s’agit de Jésus le Nazaréen,
        >homme que Dieu a accrédité auprès de vous
        >en accomplissant par lui des miracles,
        >des prodiges et des signes au milieu de vous,
        >comme vous le savez vous-mêmes.
        Cet homme, livré selon le dessein bien arrêté et la prescience de Dieu,
        >vous l’avez supprimé
        >en le clouant sur le bois par la main des impies.
        Mais Dieu l’a ressuscité
        >en le délivrant des douleurs de la mort,
        >car il n’était pas possible qu’elle le retienne en son pouvoir.
        Ce Jésus, Dieu l’a ressuscité ;
        >nous tous, nous en sommes témoins.
        Élevé par la droite de Dieu,
        >il a reçu du Père l’Esprit Saint qui était promis,
        >et il l’a répandu sur nous,
        >ainsi que vous le voyez et l’entendez.
        David, en effet, n’est pas monté au ciel,
        >bien qu’il dise lui-même :
        >Le Seigneur a dit à mon Seigneur :
        >"Siège à ma droite,
        >jusqu’à ce que j’aie placé tes ennemis
        >comme un escabeau sous tes pieds."
        >Que toute la maison d’Israël le sache donc avec certitude :
        >Dieu l’a fait Seigneur et Christ,
        >ce Jésus que vous aviez crucifié. »
    - biblicalRef: Ac 13, 26-33
      headline: |-
        « La promesse, Dieu l’a pleinement accomplie en ressuscitant Jésus »
      content: |-
        En ces jours-là, Paul vint à Antioche de Pisidie.
        Dans la synagogue, il disait :
        >« Vous, frères, les fils de la lignée d’Abraham
        >et ceux parmi vous qui craignent Dieu,
        >c’est à nous que la parole du salut a été envoyée.
        En effet, les habitants de Jérusalem et leurs chefs
        >ont méconnu Jésus,
        >ainsi que les paroles des prophètes
        >qu’on lit chaque sabbat ;
        >or, en le jugeant, ils les ont accomplies.
        Sans avoir trouvé en lui aucun motif de condamnation à mort,
        >ils ont demandé à Pilate qu’il soit supprimé.
        Et, après avoir accompli tout ce qui était écrit de lui,
        >ils l’ont descendu du bois de la croix et mis au tombeau.
        Mais Dieu l’a ressuscité d’entre les morts.
        Il est apparu pendant bien des jours
        >à ceux qui étaient montés avec lui de Galilée à Jérusalem,
        >et qui sont maintenant ses témoins devant le peuple.
        Et nous, nous vous annonçons cette Bonne Nouvelle :
        >la promesse faite à nos pères,
        >Dieu l’a pleinement accomplie pour nous, leurs enfants,
        >en ressuscitant Jésus,
        >comme il est écrit au psaume deux :
        >Tu es mon fils ;
        >moi, aujourd’hui, je t’ai engendré. »
  communionAntiphon:
  - biblicalReference: cf. Lc 12, 42
    content: |-
      Voici le serviteur fidèle et avisé 
      que le maître a établi sur sa maison,
      >pour donner à chacun, en temps voulu, sa part de blé, alléluia.
  - biblicalReference: cf. Ps 1, 2-3
    content: |-
      Qui médite la loi du Seigneur jour et nuit
      >donne du fruit en son temps, alléluia.