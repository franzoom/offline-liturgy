commonTitle: Commun des Pasteurs missionaires

oration:
  - Dieu qui as donné aux peuples païens de passer des ténèbres à la lumière de la vérité grâce au ministère de (l’évêque) saint N., accorde-nous par son intercession, de rester fermes dans la foi et de persévérer dans l’espérance selon l’Évangile qu’il a prêché.

readings:
  patristicReading:
    - title: ACTES DU II^ème CONCILE DU VATICAN
      subtitle: L’activité missionnaire de l’Église
      content: |-
        Le Christ Jésus lui-même, avant de donner librement sa vie pour le monde, a de telle sorte organisé le ministère apostolique et promis d’envoyer le Saint-Esprit, que ce ministère et cette mission sont tous deux associés pour mener à bien, toujours et partout, l’œuvre du salut. À travers toutes les époques, c’est le Saint-Esprit qui « unifie l’Église tout entière dans la communion et le ministère, qui la munit des divers dons hiérarchiques et charismatiques », vivifiant à la façon d’une âme les institutions ecclésiastiques et insufflant dans le cœur des fidèles le même esprit missionnaire, qui avait poussé le Christ lui-même. Parfois même il devance visiblement l’action apostolique, tout comme il ne cesse de l’accompagner et de la diriger de diverses manières.
        Dès le début de son ministère, le Seigneur Jésus %appela à lui ceux qu’il voulut, et en institua douze pour être ses compagnons et pour les envoyer prêcher%. Les Apôtres furent ainsi les germes du Nouvel Israël et en même temps l’origine de la hiérarchie sacrée. Puis, une fois qu’il eut par sa mort et sa résurrection accompli en lui-même les mystères de notre salut et de la rénovation de toutes choses, le Seigneur, qui avait reçu tout pouvoir au ciel et sur la terre, fonda son Église comme sacrement du salut, avant d’être enlevé au ciel. De même qu’il avait été envoyé lui-même par le Père, il envoya ses Apôtres dans le monde entier en leur donnant cet ordre : %Allez donc, de toutes les nations faites des disciples, les baptisant au nom du Père et du Fils et du Saint-Esprit, et apprenez-leur à garder tous les commandements que je vous ai donnés.%
        C’est ainsi que l’Église a le devoir de propager la foi et le salut apportés par le Christ : en vertu du mandat exprès que les Apôtres ont laissé en héritage à l’ordre des évêques, assisté par les prêtres et uni au successeur de Pierre, pasteur suprême de l’Église ; et aussi en vertu de l’influx vital que le Christ communique à ses membres. ~
        Voici par quelle activité l’Église accomplit sa mission. Elle obéit à l’ordre du Christ en étant mue par la grâce de l’Esprit Saint et par la charité. Effectivement présente à tous les hommes et à tous les peuples, elle les conduit à la foi, à la liberté et à la paix du Christ par l’exemple de sa vie, par la prédication, par les sacrements et les autres moyens de grâce. C’est ainsi qu’elle se manifeste à eux comme une route libre et sûre pour les faire participer en plénitude au mystère du Christ.
      responsory: |-
        [rubric](Stance)[/rubric]
        Tu révèles ta présence :
        devant son pur éclat
        notre vide nous saisit ;
        nous confessons notre péché.
        Mais toi, Dieu fort,
        tu apaises la crainte
        et nous envoies porter aux hommes
        la confiance des sauvés.

        R/ Sur ton ordre, Seigneur,
        nous dirons ta parole.

        Avance au large et ne crains pas ;
        je suis avec vous tous les jours
        jusqu’à la fin du monde.

        Je vous donne ma paix :
        comme mon Père m’a envoyé,
        moi aussi je vous envoie.

        Je vous baptiserai dans l’Esprit et le feu ;
        vous serez mes témoins
        jusqu’aux limites du monde.

        Dans le monde vous aurez à souffrir,
        mais gardez courage,
        j’ai vaincu le monde.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici les saints N.et N.:
      >ils sont les amis de Dieu,
      dont la gloire fut de proclamer
      >la vérité reçue du Seigneur.
  - biblicalReference: cf. Ps 17, 50; 21, 23
    content: |-
      Je te rendrai grâce parmi les peuples, Seigneur;
      >je proclamerai ton nom devant mes frères.

  collect:
  - |-
    Seigneur Dieu,+
    >tu as donné aux peuples qui ne te connaissaient pas
    >de passer des ténèbres à la lumière de la vérité
    >grâce à (l’évêque) saint N.; *
    accorde-nous, par son intercession,
    >de rester fermes dans la foi, /
    >et de persévérer fidèlement
    >dans l’espérance de l’Évangile qu’il a prêché.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  - |-
    Dieu éternel et tout-puissant, +
    >toi qui as consacré ce jour de joie
    >en glorifiant saint N., *
    accorde-nous dans ta bonté
    >de nous appliquer à garder intacte
    >la foi dont il fut l’infatigable témoin, /
    >et à y conformer toute notre vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
    - partType: READING
      partContents: 
      - biblicalRef: Is 52, 7-10
        headline: |-
          « Tous les lointains de la terre ont vu le salut de notre Dieu »
        content: |-
          Comme ils sont beaux sur les montagnes,
          >les pas du messager,
          celui qui annonce la paix,
          >qui porte la bonne nouvelle,
          >qui annonce le salut,
          et vient dire à Sion :
          >« Il règne, ton Dieu ! »
          Écoutez la voix des guetteurs :
          >ils élèvent la voix,
          >tous ensemble ils crient de joie
          car, de leurs propres yeux,
          >ils voient le Seigneur qui revient à Sion.
          Éclatez en cris de joie,
          >vous, ruines de Jérusalem,
          car le Seigneur console son peuple,
          >il rachète Jérusalem !
          Le Seigneur a montré la sainteté de son bras
          >aux yeux de toutes les nations.
          Tous les lointains de la terre
          >ont vu le salut de notre Dieu.
    - partType: GOSPEL
      partContents:
      - biblicalRef: Mc 16, 15-20
        headline: |-
          « Proclamez la Bonne Nouvelle à toutes les nations »
        acclamationAntiphon: |-
          Nous proclamons un Messie crucifié,
          il est puissance de Dieu et sagesse de Dieu.
        content: |-
          En ce temps-là,
          Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
          >« Allez dans le monde entier.
          Proclamez l’Évangile à toute la création.
          Celui qui croira et sera baptisé
          >sera sauvé ;
          >celui qui refusera de croire
          >sera condamné.
          Voici les signes qui accompagneront
          >ceux qui deviendront croyants :
          >en mon nom, ils expulseront les démons ;
          >ils parleront en langues nouvelles ;
          >ils prendront des serpents dans leurs mains
          >et, s’ils boivent un poison mortel,
          >il ne leur fera pas de mal ;
          >ils imposeront les mains aux malades,
          >et les malades s’en trouveront bien. »
          Le Seigneur Jésus,
          >après leur avoir parlé,
          fut enlevé au ciel
          >et s’assit à la droite de Dieu.
          Quant à eux,
          >ils s’en allèrent proclamer partout l’Évangile.
          Le Seigneur travaillait avec eux
          >et confirmait la Parole par les signes qui l’accompagnaient.
      - biblicalRef: Lc 5, 1-11
        headline: |-
          « Sur ta parole, je vais jeter les filets »
        acclamationAntiphon: null
        content: |-
          En ce temps-là,
          la foule se pressait autour de Jésus
          >pour écouter la parole de Dieu,
          >tandis qu’il se tenait au bord du lac de Génésareth.
          Il vit deux barques qui se trouvaient au bord du lac ;
          >les pêcheurs en étaient descendus
          >et lavaient leurs filets.
          Jésus monta dans une des barques qui appartenait à Simon,
          >et lui demanda de s’écarter un peu du rivage.
          Puis il s’assit et, de la barque, il enseignait les foules.
          Quand il eut fini de parler,
          il dit à Simon :
          >« Avance au large,
          >et jetez vos filets pour la pêche. »
          Simon lui répondit :
          >« Maître, nous avons peiné toute la nuit sans rien prendre ;
          >mais, sur ta parole, je vais jeter les filets. »
          Et l’ayant fait,
          ils capturèrent une telle quantité de poissons
          >que leurs filets allaient se déchirer.
          Ils firent signe à leurs compagnons de l’autre barque
          >de venir les aider.
          Ceux-ci vinrent,
          et ils remplirent les deux barques,
          >à tel point qu’elles enfonçaient.
          À cette vue,
          Simon-Pierre tomba aux genoux de Jésus, en disant :
          >« Éloigne-toi de moi, Seigneur,
          >car je suis un homme pécheur. »
          En effet, un grand effroi l’avait saisi,
          >lui et tous ceux qui étaient avec lui,
          >devant la quantité de poissons qu’ils avaient pêchés ;
          et de même Jacques et Jean, fils de Zébédée,
          >les associés de Simon.
          Jésus dit à Simon :
          >« Sois sans crainte,
          >désormais ce sont des hommes que tu prendras. »
          Alors ils ramenèrent les barques au rivage
          >et, laissant tout, ils le suivirent.
  offeringPrayer:
  - |-
    Dieu tout-puissant, +
    >regarde le sacrifice que nous offrons
    >en la fête de saint N.: *
    donne-nous d’imiter dans notre vie /
    >les mystères de la passion du Seigneur que nous célébrons.
    Lui qui vit et règne pour les siècles des siècles.
  prefaceList:
  - holy_pastors
  communionAntiphon:
  - biblicalReference: cf. Ez 34, 15
    content: |-
      C’est moi qui ferai paître mon troupeau,
      >et c’est moi qui le ferai reposer, dit le Seigneur.
  - biblicalReference: cf. Mt 10, 27
    content: |-
      Ce que je vous dis dans les ténèbres,
      >dites-le en pleine lumière, dit le Seigneur;
      ce que vous entendez au creux de l’oreille,
      >proclamez-le sur les toits.
  prayerAfterCommunion:
  - |-
    Seigneur, par la puissance du mystère que nous célébrons,
    >affermis tes serviteurs dans la vraie foi: *
    donne-leur de la proclamer partout,
    >en parole et en acte, /
    >à l’exemple de saint N. qui lui consacra toute sa vie
    >dans un labeur infatigable.
    Par le Christ, notre Seigneur.