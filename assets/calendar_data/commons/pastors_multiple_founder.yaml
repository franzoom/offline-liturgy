commonTitle: Commun des Pasteurs (plusieurs fondateurs)

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici les saints N. et N.:
      >le Seigneur les a vraiment aimés,
      il les a choisis et leur a donné une gloire éternelle,
      >l’Église est éclairée par leur enseignement.
  collect:
  - |-
    Regarde, Seigneur, ton Église (qui est à N.): +
    tu lui as donné de recevoir la première annonce de la foi,
    >grâce au dévouement apostolique des saints N. et N.; *
    par leur intercession, accorde-lui /
    >de rester fidèlement attachée à la vie chrétienne.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  - |-
    Seigneur Dieu,+
    >par la prédication des saints (évêques) N. et N.,
    >tu as appelé nos pères à l’admirable lumière de l’Évangile; *
    accorde-nous, à leur intercession, /
    >de grandir dans la grâce et la connaissance
    >de Jésus Christ, ton Fils, notre Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Nous t’en prions, Seigneur, +
    >accueille les offrandes que ton peuple te présente
    >en la fête des saints N. et N.; *
    et, dans ta bonté, donne-nous un cœur pur / 
    >qui te soit agréable.
    Par le Christ, notre Seigneur.
  prefaceList:
  - holy_pastors
  communionAntiphon:
  - biblicalReference: cf. Jn 15, 15
    content: |-
      Je ne vous appelle plus serviteurs, dit le Seigneur,
      >car le serviteur ne sait pas ce que fait son maitre;
      je vous appelle mes amis,
      >car tout ce que j’ai entendu de mon Père,
      >je vous l’ai fait connaître.
  - biblicalReference: cf. 1P 2, 9
    content: |-
      Peuple racheté par Dieu,
      >vous tous, annoncez les merveilles
      >de celui qui vous a appelés des ténèbres
      >à son admirable lumière.
  prayerAfterCommunion:
  - |-
    En la fête des saints N. et N.,
    >que le sacrement du salut reçu à ton autel, Seigneur,
    >nous remplisse de joie; *
    attentifs à tes bienfaits,
    >nous évoquons avec respect
    >les magnifiques origines de notre foi, /
    >et nous proclamons que tu es admirable en tes saints.
    Par le Christ, notre Seigneur.


