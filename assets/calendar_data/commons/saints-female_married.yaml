commonTitle: Commun des Saintes mariées

readings:
  biblicalReading:
    - title: LECTURE DU LIVRE DES PROVERBES
      subtitle: La femme vaillante
      ref: Pr 31, 10-31
      content: |-
        Elle sait choisir la laine et le lin, et ses mains travaillent volontiers. Elle est comme les navires marchands, faisant venir ses vivres de très loin. Elle est debout quand il fait encore nuit pour préparer les repas de sa maison et donner ses ordres aux servantes.
        A-t-elle des visées sur un champ ? Elle l’acquiert. Avec le produit de son travail, elle plante une vigne. Elle rayonne de force et retrousse ses manches ! Elle s’assure de la bonne marche des affaires, sa lampe ne s’éteint pas de la nuit.
        Elle tend la main vers la quenouille, ses doigts dirigent le fuseau. Ses doigts s’ouvrent en faveur du pauvre, elle tend la main au malheureux. Elle ne craint pas la neige pour sa maisonnée, car tous les siens ont des vêtements doublés.
        Elle s’est fait des couvertures, des vêtements de pourpre et de lin fin. Aux portes de la ville, on reconnaît son mari siégeant parmi les anciens du pays. Elle fabrique de l’étoffe pour la vendre, elle propose des ceintures au marchand.
        Revêtue de force et de splendeur, elle sourit à l’avenir. Sa bouche s’exprime avec sagesse et sa langue enseigne la bonté. Attentive à la marche de sa maison, elle ne mange pas le pain de l’oisiveté.
        Ses fils, debout, la disent bienheureuse et son mari fait sa louange : « Bien des femmes ont fait leurs preuves, mais toi, tu les surpasses toutes ! » Le charme est trompeur et la beauté s’évanouit ; seule, la femme qui craint le SEIGNEUR mérite la louange. Célébrez-la pour les fruits de son travail : et qu’aux portes de la ville, ses œuvres disent sa louange !
      responsory: |-
        Elle fait le bonheur des siens
        tous les jours de sa vie.

        Elle étend ses mains sur le pauvre
        et tend les bras à l’indigent.

        Force et dignité la revêtent,
        elle rit au jour qui vient.

        Vous les femmes, soyez soumises à votre mari, pour que, même si certains refusent d’obéir à la parole de Dieu, ils soient gagnés par la conduite de leur femme et non par des paroles, en ouvrant les yeux devant votre attitude pure et pleine de respect. Que votre parure ne soit pas extérieure — coiffure élaborée, bijoux d’or, vêtements recherchés — mais qu’elle soit une qualité d’humanité au plus intime de votre cœur, parure impérissable d’un esprit doux et paisible : voilà ce qui a grande valeur devant Dieu. C’est cela qui faisait la parure des saintes femmes de jadis, elles qui espéraient en Dieu, soumises chacune à leur mari, comme Sara qui obéissait à Abraham, en l’appelant seigneur. Vous êtes devenues les filles de Sara en faisant le bien, sans vous laisser troubler par aucune crainte.
        Vous tous, enfin, vivez en parfait accord, dans la sympathie, l’amour fraternel, la compassion et l’esprit d’humilité. Ne rendez pas le mal pour le mal, ni l’insulte pour l’insulte ; au contraire, invoquez sur les autres la bénédiction, car c’est à cela que vous avez été appelés, afin de recevoir en héritage cette bénédiction.
        En effet, comme il est écrit : %Celui qui veut aimer la vie et connaître des jours heureux, qu’il garde sa langue du mal et ses lèvres des paroles perfides ; qu’il se détourne du mal et qu’il fasse le bien, qu’il recherche la paix, et qu’il la poursuive. Car le Seigneur regarde les justes, il écoute, attentif à leur demande. Mais le Seigneur affronte les méchants.%
        Qui donc vous fera du mal, si vous cherchez le bien avec ardeur ? Mais s’il vous arrivait de souffrir pour la justice, heureux seriez-vous ! Comme dit l’Écriture : %N’ayez aucune crainte de ces gens-là, ne vous laissez pas troubler. Honorez% dans vos cœurs %la sainteté du Seigneur%, le Christ. Soyez prêts à tout moment à présenter une défense devant quiconque vous demande de rendre raison de l’espérance qui est en vous ; mais faites-le avec douceur et respect. Ayez une conscience droite, afin que vos adversaires soient pris de honte sur le point même où ils disent du mal de vous pour la bonne conduite que vous avez dans le Christ. Car mieux vaudrait souffrir en faisant le bien, si c’était la volonté de Dieu, plutôt qu’en faisant le mal.

        R/ Vivons dans la charité,
        au service les uns des autres !

        Toute la loi s’accomplit
        en cette parole unique :
        Tu aimeras ton prochain comme toi-même.

        Je vous donne un commandement nouveau :
        Aimez-vous les uns les autres,
        comme je vous ai aimés.
