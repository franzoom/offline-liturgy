mass:
- massType: DAY_MASS
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 26, 1-4.13-16
      headline: |-
        « L’épouse parfaite, lumière de sa maison »
      content: |-
        Heureux l’homme qui a une bonne épouse :
        >le nombre de ses jours sera doublé.
        La femme courageuse fait la joie de son mari :
        >il possédera le bonheur tout au long de sa vie.
        Une femme de valeur, voilà le bon parti,
        >la part que le Seigneur donne à ceux qui le craignent ;
        riches ou pauvres, ils ont le cœur joyeux,
        >en toute circonstance leur visage est souriant.
        La grâce de la femme enchante son mari,
        >et ses talents lui donnent le bien-être.
        Une femme qui sait se taire est un don du Seigneur.
        Rien ne vaut une femme préparée à sa tâche.
        C’est la grâce des grâces qu’une femme discrète.
        Une âme qui se maîtrise est un trésor sans prix.
        Un lever de soleil sur les montagnes du Seigneur :
        >ainsi, la beauté d’une épouse parfaite est la lumière de sa maison.
  - partType: READING_2
    partContents:
    - biblicalRef: 1P 3, 1-9 (pour une sainte qui a été mariée)
      headline: |-
        « Les saintes femmes de jadis espéraient en Dieu »
      content: |-
        Bien-aimés,
        je m’adresse à vous les femmes :
        soyez soumises à votre mari,
        pour que, même si certains refusent d’obéir à la parole de Dieu,
        ils soient gagnés par la conduite de leur femme et non par des paroles,
        >en ouvrant les yeux devant votre attitude pure et pleine de respect.
        Que votre parure ne soit pas extérieure
        >- coiffure élaborée, bijoux d’or, vêtements recherchés -
        mais qu’elle soit une qualité d’humanité au plus intime de votre cœur,
        >parure impérissable d’un esprit doux et paisible :
        voilà ce qui a grande valeur devant Dieu.
        C’est cela qui faisait la parure des saintes femmes de jadis,
        >elles qui espéraient en Dieu, soumises chacune à leur mari,
        comme Sara qui obéissait à Abraham,
        >en l’appelant seigneur.
        Vous êtes devenues les filles de Sara en faisant le bien,
        >sans vous laisser troubler par aucune crainte.
        De même, vous les maris,
        sachez comprendre, dans la vie commune,
        >que la femme est un être plus délicat ;
        accordez-lui l’honneur qui lui revient,
        puisqu’elle hérite, au même titre que vous,
        >de la grâce de la vie.
        Ainsi, rien ne fera obstacle à vos prières.
        Vous tous, enfin, vivez en parfait accord,
        >dans la sympathie, l’amour fraternel,
        >la compassion et l’esprit d’humilité.
        Ne rendez pas le mal pour le mal,
        >ni l’insulte pour l’insulte ;
        au contraire, invoquez sur les autres la bénédiction,
        >car c’est à cela que vous avez été appelées,
        afin de recevoir en héritage cette bénédiction.
    - biblicalRef: 1P 4, 7b-11
      headline: |-
        « Ce que chacun de vous a reçu comme don de la grâce, mettez-le au service des autres »
      content: |-
        Bien-aimés,
        soyez raisonnables et sobres
        >en vue de la prière.
        Avant tout, ayez entre vous une charité intense,
        >car la charité couvre une multitude de péchés.
        Pratiquez l’hospitalité les uns envers les autres
        >sans récriminer.
        Ce que chacun de vous a reçu comme don de la grâce,
        >mettez-le au service des autres,
        en bons gérants de la grâce de Dieu
        >qui est si diverse :
        si quelqu’un parle,
        >qu’il le fasse comme pour des paroles de Dieu ;
        celui qui assure le service,
        >qu’il s’en acquitte comme avec la force procurée par Dieu.
        Ainsi, en tout, Dieu sera glorifié par Jésus Christ,
        >à qui appartiennent la gloire et la souveraineté
        >pour les siècles des siècles. Amen.