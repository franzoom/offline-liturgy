commonTitle: Commun de plusieurs Saintes

oration:
  - |-
    Nous t’en prions, Dieu tout-puissant : que l’intercession des saintes N. et N. nous obtienne la grâce d’imiter ce que nous admirons en elles, puisque la sainteté de leur vie peut servir d’exemple à chacun de nous.


firstVespers:
  evangelicAntiphon:
    common: |-
      Glorifiez-vous de son nom très saint : joie pour les cœurs qui cherchent Dieu.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Nous t’en prions, Dieu tout-puissant : *
    >accorde-nous le secours du ciel
    >par l’intercession des saintes N. et N.,
    dont la vie admirable est pour tous
    >un exemple utile au salut.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.