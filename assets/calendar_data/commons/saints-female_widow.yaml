commonTitle: Commun des Saintes (veuves)

mass:
- massType: DAY_MASS
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Jdt 8, 2-8
      headline: |-
        « Elle craignait Dieu profondément »
      content: |-
        Judith avait pour mari Manassé,
        >de la même tribu qu’elle et du même clan ;
        il mourut à l’époque de la moisson de l’orge.
        Il surveillait les moissonneurs dans les champs
        >quand il fut frappé d’insolation.
        Il s’alita et mourut dans sa ville de Béthulie.
        On l’ensevelit avec ses pères
        >dans le champ situé entre Dothaïn et Balamone.
        Judith vécut chez elle dans le veuvage trois ans et quatre mois.
        Elle s’était fait une tente sur sa terrasse.
        Elle avait mis sur ses reins une toile à sac
        >et elle portait des vêtements de veuve par-dessus.
        Elle jeûnait tous les jours de son veuvage,
        >excepté la veille et le jour du sabbat,
        >la veille et le jour de la nouvelle lune,
        >et les jours de fête et de réjouissance de la maison d’Israël.
        Elle était belle et très séduisante.
        Manassé, son mari, lui avait laissé de l’or et de l’argent,
        >des esclaves, garçons et filles,
        >des troupeaux et des champs,
        >dont elle gardait la disposition.
        Elle ne donnait prise à aucune critique,
        >car elle craignait Dieu profondément.
        
    - biblicalRef: Est 4, 17b-17e.17h
      headline: |-
        « Ne pas mettre la gloire d’un homme plus haut que la gloire de Dieu »
      content: |-
        En ces jours-là,
        Mardochée dit :
        >« Seigneur, Seigneur, Roi souverain de l’univers,
        >tout est soumis à ton pouvoir,
        >personne ne peut s’opposer à toi,
        >quand tu veux sauver Israël.
        C’est toi qui as fait le ciel et la terre
        >et toutes les merveilles qui sont sous le ciel.
        Tu es le Seigneur de l’univers,
        >et il n’est personne qui puisse te résister, Seigneur.
        Tu le sais, ô Seigneur, toi qui connais tout :
        >ce n’est pas insolence, orgueil ou vanité,
        >si j’ai refusé de me prosterner devant l’orgueilleux Amane.
        - Volontiers je lui baiserais les pieds pour le salut d’Israël.
        Mais j’ai refusé pour ne pas mettre la gloire d’un homme
        >plus haut que la gloire de Dieu :
        je ne me prosternerai devant personne,
        >sauf devant toi, mon Seigneur,
        et ce n’est pas là de l’orgueil.
        Exauce ma prière,
        >sois favorable à ceux qui sont ta part d’héritage ;
        >change notre deuil en joie,
        >afin que nous vivions
        >pour chanter ton nom, Seigneur.
        Ne laisse pas disparaître
        >ceux dont la bouche te célèbre. »
  - partType: READING_2
    partContents:
    - biblicalRef: 1Tm 5, 3-10
      headline: |-
        « La véritable veuve a mis son espérance en Dieu »
      content: |-
        Bien-aimé,
        honore et assiste les veuves qui sont vraiment seules.
        Si une veuve a des enfants ou des petits-enfants,
        ils doivent apprendre que c’est à eux d’abord
        >de s’acquitter de leurs devoirs filiaux
        >et de rendre à leurs parents ce qu’ils ont reçu d’eux.
        Voilà une conduite agréable à Dieu.
        Mais la véritable veuve, celle qui reste seule,
        >a mis son espérance en Dieu :
        >elle ne cesse de faire des demandes et des prières nuit et jour.
        Quant à celle qui se livre aux plaisirs,
        >elle a beau vivre,
        >elle est morte.
        Insiste sur tout cela,
        >pour qu’elles soient irréprochables.
        Si quelqu’un ne s’occupe pas des siens,
        >surtout des plus proches,
        il a renié la foi,
        >il est pire qu’un incroyant.
        Pour être inscrite comme veuve,
        >une femme doit avoir au moins soixante ans,
        >n’avoir eu qu’un seul mari,
        >être connue pour le bien qu’elle a fait,
        >avoir élevé des enfants,
        >donné l’hospitalité aux voyageurs,
        >rendu aux fidèles les plus humbles services,
        >secouru les malheureux.
        Bref, il faut que, dans tous les domaines, elle se soit dévouée.
    - biblicalRef: Jc 2, 14-17
      headline: |-
        « La foi, si elle n’est pas mise en œuvre, est bel et bien morte »
      content: |-
        Mes frères,
        si quelqu’un prétend avoir la foi,
        >sans la mettre en œuvre,
        à quoi cela sert-il ?
        Sa foi peut-elle le sauver ?
        Supposons qu’un frère ou une sœur
        >n’ait pas de quoi s’habiller,
        >ni de quoi manger tous les jours ;
        si l’un de vous leur dit :
        >« Allez en paix !
        Mettez-vous au chaud,
        >et mangez à votre faim ! »
        sans leur donner le nécessaire pour vivre,
        >à quoi cela sert-il ?
        Ainsi donc, la foi, si elle n’est pas mise en œuvre,
        >est bel et bien morte.