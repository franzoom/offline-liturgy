commonTitle: Commun des Saints ayant exercé une activité caritative

oration:
- Tu as voulu, Seigneur, que ton peuple observe tous tes commandements en t’aimant et en aimant son prochain ; accorde-nous de toujours agir avec charité, à l’exemple de saint N., pour être comptés parmis les bénis de ton Royaume.

readings:
  biblicalReading:
  - title: LECTURE DE LA 1^ère LETTRE AUX CORINTHIENS
    subtitle: Amour fraternel
    ref: 1Co 12, 31 – 13, 13
    content: Les prophéties seront dépassées, le don des langues cessera, la connaissance actuelle sera dépassée. En effet, notre connaissance est partielle, nos prophéties sont partielles. Quand viendra l’achèvement, ce qui est partiel sera dépassé. Quand j’étais petit enfant, je parlais comme un enfant, je pensais comme un enfant, je raisonnais comme un enfant. Maintenant que je suis un homme, j’ai dépassé ce qui était propre à l’enfant. Nous voyons actuellement de manière confuse, comme dans un miroir ; ce jour-là, nous verrons face à face. Actuellement, ma connaissance est partielle ; ce jour-là, je connaîtrai parfaitement, comme j’ai été connu. Ce qui demeure aujourd’hui, c’est la foi, l’espérance et la charité ; mais la plus grande des trois, c’est la charité.
    responsory: |-
      Toute la loi s’accomplit
      en cette parole unique :
      tu aimeras ton prochain comme toi-même.

      Je vous donne un commandement nouveau,
      aimez-vous les uns les autres,
      comme je vous ai aimés.
  patristicReading:
  - title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME SUR LA LETTRE AUX ROMAINS
    subtitle: « Celui qui aime Dieu, qu’il aime son frère »
    content: |-
      Dieu a livré son Fils, et toi, tu ne donnes pas même un morceau de pain à celui qui a été livré et mis à mort pour toi ! Le Père, à cause de toi, n’a pas refusé celui qui était son vrai Fils, et toi, alors qu’il meurt de faim, tu passes sans le voir, lorsque tu vas dépenser les richesses qui sont à lui, et les dépenser pour toi. Est-il quelque chose de pire que cette injustice ? Il a été livré pour toi, il a été mis à mort pour toi, pour toi il a mené une vie d’affamé. Donne-lui de ces biens qui lui appartiennent, afin que cela te profite ; et pourtant, tu ne lui donnes rien. Ne sont-ils pas plus insensibles que les pierres, ceux qui persévèrent dans cette dureté diabolique parce que tant d’affaires les appelles ? Car le Christ ne s’est pas contenté de subir la croix et la mort, mais il a voulu devenir pauvre, étranger, errant et nu, être jeté en prison, souffrir l’épuisement, afin de te provoquer par là. Si tu ne m’accordes rien parce que j’ai souffert pour toi, dit-il, aie pitié de ma pauvreté. Et si tu ne veux pas avoir de pitié pour la pauvreté, laisse-toi fléchir par la maladie ou par la captivité ; si rien de tout cela ne suscite ta bonté, réponds favorablement à la modestie de ma demande. Car je ne demande rien de bien coûteux : du pain, un abri, des paroles réconfortantes. Laisse-toi au moins émouvoir selon la nature en voyant que je suis nu, et souviens-toi de ma nudité sur la croix, subie pour toi. Si la première ne te touche pas, laisse-toi toucher par la seconde, que j’ai soufferte à cause de la nudité des pauvres. Alors, j’ai été chargé de liens à cause de toi, mais maintenant c’est encore à cause de toi, afin que tu te laisses émouvoir par liens d’autrefois ou par ceux d’aujourd’hui, et consentes à t’apitoyer. J’ai jeûné à cause de toi ; encore maintenant j’ai faim à cause de toi. J’ai eu soif quand j’étais cloué à la croix ; j’ai encore soif par l’intermédiaire des pauvres afin de t’attirer à moi, par ceux-ci ou par ceux-là, et de te rendre miséricordieux en vue de ton salut. C’est pourquoi je te demande, puisque tu es mon débiteur pour une multitude de bienfaits, de me payer de retour. Je ne le réclame pas comme un débiteur ; je veux te couronner comme un bienfaiteur et te donner le Royaume en échange de si peu de chose. Je ne dis pas : « Supprime ma pauvreté » ni : « Donne-moi la richesse », bien que je mendie à cause de toi. Je demande seulement du pain, un vêtement, un modeste apaisement pour ma faim.
    responsory: |-
      Ouvre ton cœur au pauvre : c’est ton frère.
      Et si tu cries, le Seigneur répondra ;
      à tes appels, il dira : Me voici !

      Ouvre ton cœur au pauvre : c’est ton frère.
      Et quand le Fils de l’homme viendra, il te dira :
      J’avais faim et m’as donné à manger.

morning:
  evangelicAntiphon:
    common:

    - À l’amour que vous aurez les uns pour les autres, on reconnaîtra que vous êtes mes disciples.
vespers:
  evangelicAntiphon:
    common:
    - |-
      Venez les bénis de mon Père : ce que vous avez fait à l’un de ces petits, c’est à moi que vous l’avez fait.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Mt 25, 34.36.40
    content: |-
      Venez, les bénis de mon Père, dit le Seigneur.
      >J’étais malade, et vous m’avez visité.
      Amen, je vous le dis :
      >chaque fois que vous l’avez fait
      >à l’un de ces plus petits de mes frères,
      >c’est à moi que vous l’avez fait.
  - biblicalReference: cf. Ps 111, 9
    content: |-
      À pleines mains, il donne au pauvre ;
      >à jamais se maintiendra sa justice,
      >sa puissance grandira, et sa gloire.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as enseigné à ton Église
    >que tous les commandements divins 
    >trouvent leur accomplissement 
    >dans l’amour de Dieu et du prochain ; *
    accorde-nous de mettre en œuvre cette charité
    >à l’exemple de saint N., /
    >pour que nous méritions d’être comptés 
    >parmi les bénis de ton royaume. 
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Accueille, Seigneur, les dons offerts par ton peuple ; +
    >et puisque nous rappelons l’œuvre d’amour infini 
    >accomplie par ton Fils, *
    donne-nous, à l’exemple de saint N., /
    >d’être affermis dans notre amour pour toi et pour le prochain. 
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jn 15, 13
    content: |-
      Il n’y a pas de plus grand amour 
      >que de donner sa vie pour ses amis, dit le Seigneur.
  - biblicalReference: cf. Jn 15, 13
    content: |-
      À ceci, tous reconnaîtront que vous êtes mes disciples : 
      >si vous avez de l’amour les uns pour les autres, 
      >dit le Seigneur.
  prayerAfterCommunion:
  - |-
    Tu as refait nos forces, Seigneur, 
    >par tes saints mystères, 
    >et nous te prions : *
    donne-nous de suivre les exemples de saint N., 
    >qui te manifesta un attachement indéfectible, /
    >et servit ton peuple avec une charité sans limite. 
    Par le Christ, notre Seigneur.
  - |-
    Nourris et comblés de ce sacrement du salut,
    >nous implorons ta bonté, Seigneur : *
    fais qu’en pratiquant la charité
    >à l’imitation de saint N., /
    >nous ayons aussi part à sa gloire.
    Par le Christ, notre Seigneur.

  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Tb 12, 6-13 (pour les saints ayant exercé une activité caritative)
      headline: |-
        « Mieux vaut prier avec vérité et faire l’aumône avec justice, qu’être riche avec injustice »
      content: |-
        L’ange Raphaël prit à part Tobit et son fils Tobie
        et leur dit :
        >« Bénissez Dieu
        >et célébrez-le devant tous les vivants
        >pour le bien qu’il vous a fait.
        Bénissez-le et chantez son nom.
        Annoncez à tous les hommes les actions de Dieu
        >comme elles le méritent,
        >et n’hésitez pas à le célébrer.
        S’il est bon de tenir cachés les secrets d’un roi,
        >il faut révéler les œuvres de Dieu
        >et les célébrer comme elles le méritent.
        Faites le bien,
        >et le mal ne vous atteindra pas.
        Mieux vaut prier avec vérité
        >et faire l’aumône avec justice,
        >qu’être riche avec injustice.
        Mieux vaut faire l’aumône
        >qu’amasser de l’or.
        L’aumône délivre de la mort et purifie de tout péché.
        Ceux qui font l’aumône seront rassasiés de vie,
        >tandis que le pécheur et l’homme injuste
        >sont leurs propres ennemis.
        Je veux vous révéler toute la vérité,
        >sans rien vous cacher.
        Je viens de vous dire que,
        >s’il est bon de tenir cachés les secrets d’un roi,
        >il faut révéler les œuvres de Dieu comme elles le méritent.
        Eh bien ! Quand tu priais en même temps que Sarra,
        >c’était moi qui présentais votre prière devant la gloire de Dieu,
        >pour qu’il la garde en mémoire,
        >et je faisais de même lorsque tu enterrais les morts.
        Quand tu n’as pas hésité à te lever,
        >à laisser ton repas et à partir enterrer un mort,
        >c’est alors que j’ai été envoyé vers toi
        >pour te mettre à l’épreuve. »
  - partType: READING_2
    partContents:
    - biblicalRef: 1 Jn 3, 14-18 (pour les saints qui ont exercé une activité caritative)
      headline: |-
        « Nous aussi, nous devons donner notre vie pour nos frères »
      content: |-
        Bien-aimés,
        nous savons que nous sommes passés de la mort à la vie,
        >parce que nous aimons nos frères.
        Celui qui n’aime pas
        >demeure dans la mort.
        Quiconque a de la haine contre son frère
        >est un meurtrier,
        et vous savez que pas un meurtrier
        >n’a la vie éternelle demeurant en lui.
        Voici comment nous avons reconnu l’amour :
        >lui, Jésus, a donné sa vie pour nous.
        Nous aussi, nous devons donner notre vie pour nos frères.
        Celui qui a de quoi vivre en ce monde,
        >s’il voit son frère dans le besoin
        >sans faire preuve de compassion,
        comment l’amour de Dieu pourrait-il demeurer en lui ?
        Petits enfants,
        n’aimons pas en paroles ni par des discours,
        >mais par des actes et en vérité.
        
    - biblicalRef: 1 Jn 4, 7-16
      headline: |-
        « Si nous nous aimons les uns les autres, Dieu demeure en nous »
      content: |-
        Bien-aimés,
        aimons-nous les uns les autres,
        >puisque l’amour vient de Dieu.
        Celui qui aime est né de Dieu
        >et connaît Dieu.
        Celui qui n’aime pas n’a pas connu Dieu,
        >car Dieu est amour.
        Voici comment l’amour de Dieu
        >s’est manifesté parmi nous :
        Dieu a envoyé son Fils unique dans le monde
        >pour que nous vivions par lui.
        Voici en quoi consiste l’amour :
        ce n’est pas nous qui avons aimé Dieu,
        >mais c’est lui qui nous a aimés,
        et il a envoyé son Fils
        >en sacrifice de pardon pour nos péchés.
        Bien-aimés,
        puisque Dieu nous a tellement aimés,
        >nous devons, nous aussi, nous aimer les uns les autres.
        Dieu, personne ne l’a jamais vu.
        Mais si nous nous aimons les uns les autres,
        Dieu demeure en nous,
        >et, en nous, son amour atteint la perfection.
        Voici comment nous reconnaissons
        >que nous demeurons en lui
        >et lui en nous :
        il nous a donné part à son Esprit.
        Quant à nous, nous avons vu et nous attestons
        >que le Père a envoyé son Fils
        >comme Sauveur du monde.
        Celui qui proclame que Jésus est le Fils de Dieu,
        >Dieu demeure en lui,
        >et lui en Dieu.
        Et nous, nous avons reconnu l’amour que Dieu a pour nous,
        >et nous y avons cru.
        Dieu est amour :
        qui demeure dans l’amour demeure en Dieu,
        >et Dieu demeure en lui.
        
    - biblicalRef: 1 Jn 5, 1-5
      headline: |-
        « La victoire remportée sur le monde, c’est notre foi »
      content: |-
        Bien-aimés,
        celui qui croit que Jésus est le Christ,
        >celui-là est né de Dieu ;
        celui qui aime le Père qui a engendré
        >aime aussi le Fils qui est né de lui.
        Voici comment nous reconnaissons
        >que nous aimons les enfants de Dieu :
        lorsque nous aimons Dieu
        >et que nous accomplissons ses commandements.
        Car tel est l’amour de Dieu :
        >garder ses commandements ;
        et ses commandements ne sont pas un fardeau,
        puisque tout être qui est né de Dieu
        >est vainqueur du monde.
        Or la victoire remportée sur le monde,
        >c’est notre foi.
        Qui donc est vainqueur du monde ?
        N’est-ce pas celui qui croit
        >que Jésus est le Fils de Dieu ?