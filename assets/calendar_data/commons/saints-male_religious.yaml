commonTitle: Commun des Saints religieux

oration:
- Tu as donné, Seigneur, à saint N. la grâce d’imiter le Christ humble et pauvre ; accorde-nous, par son intercession, de suivre fidèlement l’appel que nous avons reçu et d’atteindre à la perfection dont tu nous as donné l’exemple dans la personne de Jésus ton Fils. Lui qui règne.

firstVespers:
  evangelicAntiphon:
    common: |-
      Voici le peuple de ceux qui cherchent Dieu : ils obtiendront de la justice et bénédiction.

readings:
  biblicalReading:
  - title: LECTURE DE LA LETTRE AUX PHILIPPIENS
    subtitle: Soyez toujours dans la joie
    ref: Ph 3,7 - 4,1.4-9
    content: |-
      tous ces avantages que j’avais, je les ai considérés, à cause du Christ, comme une perte. Oui, je considère tout cela comme une perte à cause de ce bien qui dépasse tout : la connaissance du Christ Jésus, mon Seigneur. À cause de lui, j’ai tout perdu ; je considère tout comme des ordures, afin de gagner un seul avantage, le Christ, et, en lui, d’être reconnu juste, non pas de la justice venant de la loi de Moïse mais de celle qui vient de la foi au Christ, la justice venant de Dieu, qui est fondée sur la foi. Il s’agit pour moi de connaître le Christ, d’éprouver la puissance de sa résurrection et de communier aux souffrances de sa passion, en devenant semblable à lui dans sa mort, avec l’espoir de parvenir à la résurrection d’entre les morts. Certes, je n’ai pas encore obtenu cela, je n’ai pas encore atteint la perfection, mais je poursuis ma course pour tâcher de saisir, puisque j’ai moi-même été saisi par le Christ Jésus. Frères, quant à moi, je ne pense pas avoir déjà saisi cela. Une seule chose compte : oubliant ce qui est en arrière, et lancé vers l’avant, je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus. Nous tous qui sommes adultes dans la foi, nous devons avoir ces dispositions-là ; et, si vous en avez d’autres, là-dessus encore Dieu vous éclairera. En tout cas, du point où nous sommes arrivés, marchons dans la même direction.
      Frères, ensemble imitez-moi, et regardez bien ceux qui se conduisent selon l’exemple que nous vous donnons. Car je vous l’ai souvent dit, et maintenant je le redis en pleurant : beaucoup de gens se conduisent en ennemis de la croix du Christ. Ils vont à leur perte. Leur dieu, c’est leur ventre, et ils mettent leur gloire dans ce qui fait leur honte ; ils ne pensent qu’aux choses de la terre. Mais nous, nous avons notre citoyenneté dans les cieux, d’où nous attendons comme sauveur le Seigneur Jésus Christ, lui qui transformera nos pauvres corps à l’image de son corps glorieux, avec la puissance active qui le rend même capable de tout mettre sous son pouvoir.
      Ainsi, mes frères bien-aimés pour qui j’ai tant d’affection, vous, ma joie et ma couronne, tenez bon dans le Seigneur, mes bien-aimés.
      Soyez toujours dans la joie du Seigneur ; je le redis : soyez dans la joie. Que votre bienveillance soit connue de tous les hommes. Le Seigneur est proche. Ne soyez inquiets de rien, mais, en toute circonstance, priez et suppliez, tout en rendant grâce, pour faire connaître à Dieu vos demandes. Et la paix de Dieu, qui dépasse tout ce qu’on peut concevoir, gardera vos cœurs et vos pensées dans le Christ Jésus.
      Enfin, mes frères, tout ce qui est vrai et noble, tout ce qui est juste et pur, tout ce qui est digne d’être aimé et honoré, tout ce qui s’appelle vertu et qui mérite des éloges, tout cela, prenez-le en compte. Ce que vous avez appris et reçu, ce que vous avez vu et entendu de moi, mettez-le en pratique. Et le Dieu de la paix sera avec vous.
    responsory: |-
      N’attache pas ton cœur
      à ce qui passe.

      Ne dis pas : j’ai réussi,
      je suis payé de ma peine.

      Ne te repose pas dans tes œuvres :
      elles vont te juger.

      Garde en ton cœur la Parole :
      voilà ton trésor.
  patristicReading:
  - title: HOMÉLIE DE SAINT GRÉGOIRE LE GRAND SUR L’ÉVANGILE
    subtitle: Recherchez les réalités d’en-haut
    content: |-
      Je veux vous inviter à tout abandonner, sans vous y obliger. Si vous ne pouvez pas abandonner entièrement le monde, retenez les biens de ce monde, mais de telle façon qu’ils ne vous retiennent pas dans le monde. Possédez, mais ne vous laissez pas posséder. Il faut que votre esprit domine ce que vous avez ; autrement, si votre esprit est vaincu par l’amour des biens terrestres, c’est plutôt lui qui sera possédé par les biens qui lui appartiennent.
      Sachez donc user des biens terrestres, et désirez les biens éternels ; servez-vous des biens de la terre dans le cours de votre vie, et désirez trouver les biens du ciel à l’arrivée. Tout ce qui se passe dans ce monde, regardez-le comme à la dérobée. Que votre regard intérieur se dirige en avant et considère avant tout les réalités qui sont votre but.
      Il faut extirper radicalement les vices, non seulement en éliminant leurs pratiques, mais encore en les arrachant de votre esprit. Ni les jouissances de la chair, ni la démangeaison de la curiosité, ni la fièvre de l’ambition ne doivent nous écarter de la Cène du Seigneur ; mais les activités honnêtes elles-mêmes que nous menons dans le monde ne doivent toucher notre esprit qu’à la dérobée, afin que les activités terrestres qui nous plaisent rendent service à notre corps sans créer aucun obstacle à notre cœur.
      Donc, mes frères, je n’ose pas vous dire de tout abandonner ; mais si vous le voulez, vous abandonnerez toute chose même en les gardant, si vous vous conduisez dans le temps en aspirant de tout votre esprit à l’éternité. On use du monde, mais comme n’en usant pas, si l’on réduit tous les biens extérieurs à servir notre vie sans leur permettre de dominer l’esprit ; dans cette subordination, ils sont utiles au-dehors sans jamais briser l’élan de l’âme qui se porte vers les hauteurs. Ceux qui agissent ainsi ont tous les biens du monde à leur disposition pour en user, non pour les désirer. De la sorte, qu’il n’y ait rien pour freiner le désir de votre esprit, aucune jouissance pour vous lier aux embarras du monde.
      Si c’est le bien qu’on aime, l’esprit trouve son plaisir dans les biens les meilleurs, qui sont les biens célestes. Si c’est le mal qu’on redoute, le malheur éternel se présente à l’âme ; elle voit alors que ce qu’elle aime le plus et ce qu’elle redoute le plus et au-delà, et elle ne doit s’attacher à rien ici-bas.
      Pour nous comporter ainsi, nous avons un médiateur entre Dieu et l’homme, un protecteur, par qui nous obtiendrons bientôt toute chose, si nous l’aimons d’un amour sincère, lui qui vit et règne avec le Père et le Saint-Esprit, car il est Dieu pour les siècles des siècles. Amen.
    responsory: |-
      Ouvre ton cœur au pauvre : c’est ton frère.
      Et si tu cries, le Seigneur répondra ;
      à tes appels, il dira : Me voici !

      Ouvre ton cœur au pauvre : c’est ton frère.
      Et quand le Fils de l’homme viendra, il te dira :
      J’avais faim et m’as donné à manger.

morning:
  evangelicAntiphon:
    common:

    - Qui fait la volonté de mon Père, dit le Seigneur, sera mon frère ma sœur et ma mère.
vespers:
  evangelicAntiphon:
    common:
    - |-
      Vous avez tout quitté pour me suivre : recevez le centuple et la vie éternelle.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Ps 15, 5
    content: |-
      Seigneur, mon partage et ma coupe:
      >de toi dépend mon sort.
  - biblicalReference: cf. Os 2, 21
    content: |-
      Le Seigneur l’a fiancée à lui pour toujours,
      >dans la fidélité et la miséricorde 
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné à saint N.
    >d’imiter avec persévérance le Christ humble et pauvre; *
    accorde-nous, par son intercession,
    >de marcher dans la fidélité à l’appel que nous avons reçu, /
    et de parvenir ainsi à la perfection
    >que tu nous as montrée en ton Fils.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Dt 10, 8-9
      headline: |-
        « C’est le Seigneur qui est son héritage »
      content: |-
        Moïse dit au peuple :
        « Parmi les tribus d’Israël,
        le Seigneur mit à part les descendants de Lévi,
        pour porter l’arche de son Alliance,
        >se tenir en sa présence,
        >assurer le service divin,
        >et bénir le peuple au nom du Seigneur,
        >comme ils l’ont fait jusqu’à ce jour.
        C’est pourquoi Lévi n’a pas reçu sa part d’héritage
        >comme ses frères.
        C’est le Seigneur qui est son héritage,
        >comme l’a dit le Seigneur notre Dieu. »
    - biblicalRef: 1R 19, 4-9a.11-15a 
      headline: |-
        « Sors et tiens-toi sur la montagne devant le Seigneur »
      content: |-
        En ces jours-là,
        le prophète Élie, fuyant l’hostilité de la reine Jézabel,
        >marcha toute une journée dans le désert.
        Il vint s’asseoir à l’ombre d’un buisson,
        et demanda la mort en disant :
        >« Maintenant, Seigneur, c’en est trop !
        Reprends ma vie :
        >je ne vaux pas mieux
        >que mes pères. »
        Puis il s’étendit sous le buisson, et s’endormit.
        Mais voici qu’un ange le toucha et lui dit :
        >« Lève-toi, et mange ! »
        Il regarda, et il y avait près de sa tête
        >une galette cuite sur des pierres brûlantes
        >et une cruche d’eau.
        Il mangea, il but, et se rendormit.
        Une seconde fois, l’ange du Seigneur le toucha et lui dit :
        >« Lève-toi, et mange,
        >car il est long, le chemin qui te reste. »
        Élie se leva, mangea et but.
        Puis, fortifié par cette nourriture,
        il marcha quarante jours et quarante nuits
        >jusqu’à l’Horeb, la montagne de Dieu.
        Là, il entra dans une caverne.
        Le Seigneur dit :
        >« Sors et tiens-toi sur la montagne devant le Seigneur,
        >car il va passer. »
        À l’approche du Seigneur,
        il y eut un ouragan, si fort et si violent
        >qu’il fendait les montagnes et brisait les rochers,
        >mais le Seigneur n’était pas dans l’ouragan ;
        et après l’ouragan, il y eut un tremblement de terre,
        >mais le Seigneur n’était pas dans le tremblement de terre ;
        et après ce tremblement de terre, un feu,
        >mais le Seigneur n’était pas dans ce feu ;
        et après ce feu, le murmure d’une brise légère.
        Aussitôt qu’il l’entendit,
        >Élie se couvrit le visage avec son manteau.
        Il sortit et se tint à l’entrée de la caverne.
        Alors il entendit une voix qui disait :
        >« Que fais-tu là, Élie ? »
        Il répondit :
        >« J’éprouve une ardeur jalouse pour toi,
        >Seigneur, Dieu de l’univers.
        Les fils d’Israël ont abandonné ton Alliance,
        >renversé tes autels, et tué tes prophètes par l’épée ;
        >moi, je suis le seul à être resté et ils cherchent à prendre ma vie. »
        Le Seigneur lui dit :
        >« Repars vers Damas. »
    - biblicalRef: 1 R 19, 16b.19-21 (pour les religieux)
      headline: |-
        « Élisée partit à la suite d’Élie et se mit à son service »
      content: |-
        En ces jours-là,
        le Seigneur avait dit au prophète Élie :
        >« Tu consacreras Élisée, fils de Shafath,
        >comme prophète pour te succéder. »
        Élie s’en alla.
        Il trouva Élisée, fils de Shafath, en train de labourer.
        Il avait à labourer douze arpents,
        >et il en était au douzième.
        Élie passa près de lui et jeta vers lui son manteau.
        Alors Élisée quitta ses bœufs, courut derrière Élie,
        et lui dit :
        >« Laisse-moi embrasser mon père et ma mère,
        >puis je te suivrai. »
        Élie répondit :
        >« Va-t’en, retourne là-bas !
        Je n’ai rien fait. »
        Alors Élisée s’en retourna ;
        mais il prit la paire de bœufs pour les immoler,
        les fit cuire avec le bois de l’attelage,
        >et les donna à manger aux gens.
        Puis il se leva, partit à la suite d’Élie
        >et se mit à son service.
        
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 27-29 (pour les religieux)
      headline: |-
        « Vous qui m’avez suivi, vous recevrez le centuple »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Pierre prit la parole et dit à Jésus :
        >« Voici que nous avons tout quitté pour te suivre :
        >quelle sera donc notre part ? »
        Jésus leur déclara :
        >« Amen, je vous le dis :
        >lors du renouvellement du monde,
        >lorsque le Fils de l’homme siégera sur son trône de gloire,
        >vous qui m’avez suivi,
        >vous siégerez vous aussi sur douze trônes
        >pour juger les douze tribus d’Israël.
        Et celui qui aura quitté, à cause de mon nom,
        >des maisons, des frères, des sœurs,
        >un père, une mère, des enfants,
        >ou une terre,
        >recevra le centuple,
        >et il aura en héritage la vie éternelle. »
    - biblicalRef: Mt 25, 1-13
      headline: |-
        « Voici l’époux ! Sortez à sa rencontre »
      acclamationAntiphon: |-
        Voici la jeune fille prévoyante,
        que le Seigneur a trouvée en train de veiller.
        Quand le Seigneur arriva, elle entra avec lui pour les noces.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples cette parabole :
        >« Le royaume des Cieux sera comparable
        >à dix jeunes filles invitées à des noces,
        >qui prirent leur lampe
        >pour sortir à la rencontre de l’époux.
        Cinq d’entre elles étaient insouciantes,
        >et cinq étaient prévoyantes :
        >les insouciantes avaient pris leur lampe sans emporter d’huile,
        >tandis que les prévoyantes avaient pris, avec leurs lampes,
        >des flacons d’huile.
        Comme l’époux tardait,
        >elles s’assoupirent toutes et s’endormirent.
        Au milieu de la nuit, il y eut un cri :
        >"Voici l’époux ! Sortez à sa rencontre."
        >Alors toutes ces jeunes filles se réveillèrent
        >et se mirent à préparer leur lampe.
        Les insouciantes demandèrent aux prévoyantes :
        >"Donnez-nous de votre huile,
        >car nos lampes s’éteignent."
        >Les prévoyantes leur répondirent :
        >"Jamais cela ne suffira pour nous et pour vous,
        >allez plutôt chez les marchands vous en acheter."
        >Pendant qu’elles allaient en acheter,
        >l’époux arriva.
        Celles qui étaient prêtes entrèrent avec lui dans la salle des noces,
        >et la porte fut fermée.
        Plus tard, les autres jeunes filles arrivèrent à leur tour et dirent :
        >"Seigneur, Seigneur, ouvre-nous !"
        >Il leur répondit :
        >"Amen, je vous le dis :
        >Je ne vous connais pas.
        Veillez donc,
        >car vous ne savez ni le jour ni l’heure. »
    - biblicalRef: 'Mt 25, 14-30 (lecture brève : Mt 25, 14-23)'
      headline: |-
        « Tu as été fidèle pour peu de choses, je t’en confierai beaucoup »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples cette parabole :
        >« C’est comme un homme qui partait en voyage :
        >il appela ses serviteurs et leur confia ses biens.
        À l’un il remit une somme de cinq talents,
        >à un autre deux talents,
        >au troisième un seul talent,
        >à chacun selon ses capacités.
        Puis il partit.
        Aussitôt, celui qui avait reçu les cinq talents
        >s’en alla pour les faire valoir
        >et en gagna cinq autres.
        De même, celui qui avait reçu deux talents
        >en gagna deux autres.
        Mais celui qui n’en avait reçu qu’un
        >alla creuser la terre et cacha l’argent de son maître.
        Longtemps après, le maître de ces serviteurs revint
        >et il leur demanda des comptes.
        Celui qui avait reçu cinq talents s’approcha,
        présenta cinq autres talents
        et dit :
        >"Seigneur,
        >tu m’as confié cinq talents ;
        >voilà, j’en ai gagné cinq autres."
        Son maître lui déclara :
        >"Très bien, serviteur bon et fidèle,
        >tu as été fidèle pour peu de choses,
        >je t’en confierai beaucoup ;
        >entre dans la joie de ton seigneur."
        Celui qui avait reçu deux talents s’approcha aussi
        et dit :
        >"Seigneur,
        >tu m’as confié deux talents ;
        >voilà, j’en ai gagné deux autres."
        Son maître lui déclara :
        >"Très bien, serviteur bon et fidèle,
        >tu as été fidèle pour peu de choses,
        >je t’en confierai beaucoup ;
        >entre dans la joie de ton seigneur."
        >Celui qui avait reçu un seul talent s’approcha aussi
        >et dit :
        >"Seigneur,
        >je savais que tu es un homme dur :
        >tu moissonnes là où tu n’as pas semé,
        >tu ramasses là où tu n’as pas répandu le grain.
        J’ai eu peur, et je suis allé cacher ton talent dans la terre.
        Le voici. Tu as ce qui t’appartient."
        >Son maître lui répliqua :
        >"Serviteur mauvais et paresseux,
        >tu savais que je moissonne là où je n’ai pas semé,
        >que je ramasse le grain là où je ne l’ai pas répandu.
        Alors, il fallait placer mon argent à la banque ;
        >et, à mon retour, je l’aurais retrouvé avec les intérêts.
        Enlevez-lui donc son talent
        >et donnez-le à celui qui en a dix.
        À celui qui a, on donnera encore,
        >et il sera dans l’abondance ;
        >mais celui qui n’a rien
        >se verra enlever même ce qu’il a.
        Quant à ce serviteur bon à rien,
        >jetez-le dans les ténèbres extérieures ;
        >là, il y aura des pleurs et des grincements de dents !" »
    - biblicalRef: 'Mt 25, 31-46 (lecture brève : Mt 25, 31-40)'
      headline: |-
        « Chaque fois que vous l’avez fait à l’un de ces plus petits de mes frères, c’est à moi que vous l’avez fait »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres, comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Quand le Fils de l’homme viendra dans sa gloire,
        >et tous les anges avec lui,
        alors il siégera sur son trône de gloire.
        Toutes les nations seront rassemblées devant lui ;
        il séparera les hommes les uns des autres,
        >comme le berger sépare les brebis des boucs :
        il placera les brebis à sa droite, et les boucs à gauche.
        Alors le Roi dira à ceux qui seront à sa droite :
        >"Venez, les bénis de mon Père,
        >recevez en héritage le Royaume
        >préparé pour vous depuis la fondation du monde.
        Car j’avais faim, et vous m’avez donné à manger ;
        >j’avais soif, et vous m’avez donné à boire ;
        >j’étais un étranger, et vous m’avez accueilli ;
        >j’étais nu, et vous m’avez habillé ;
        >j’étais malade, et vous m’avez visité ;
        >j’étais en prison, et vous êtes venus jusqu’à moi !"
        Alors les justes lui répondront :
        >"Seigneur,
        >quand est-ce que nous t’avons vu :
        >tu avais donc faim, et nous t’avons nourri ?
        tu avais soif, et nous t’avons donné à boire ?
        tu étais un étranger, et nous t’avons accueilli ?
        tu étais nu, et nous t’avons habillé ?
        tu étais malade ou en prison...
        Quand sommes-nous venus jusqu’à toi ?"
        Et le Roi leur répondra :
        >"Amen, je vous le dis :
        >chaque fois que vous l’avez fait
        >à l’un de ces plus petits de mes frères,
        >c’est à moi que vous l’avez fait."
        Alors il dira à ceux qui seront à sa gauche :
        >"Allez-vous-en loin de moi, vous les maudits,
        >dans le feu éternel préparé pour le diable et ses anges.
        Car j’avais faim, et vous ne m’avez pas donné à manger ;
        >j’avais soif, et vous ne m’avez pas donné à boire ;
        >j’étais un étranger, et vous ne m’avez pas accueilli ;
        >j’étais nu, et vous ne m’avez pas habillé ;
        >j’étais malade et en prison, et vous ne m’avez pas visité."
        Alors ils répondront, eux aussi :
        >"Seigneur, quand t’avons-nous vu
        >avoir faim, avoir soif, être nu, étranger, malade ou en prison,
        >sans nous mettre à ton service ?"
        Il leur répondra :
        >"Amen, je vous le dis :
        >chaque fois que vous ne l’avez pas fait
        >à l’un de ces plus petits,
        >c’est à moi que vous ne l’avez pas fait."
        Et ils s’en iront, ceux-ci au châtiment éternel,
        >et les justes, à la vie éternelle. »
    - biblicalRef: Mc 3, 31-35
      headline: |-
        « Celui qui fait la volonté de Dieu, celui-là est pour moi un frère, une sœur, une mère »
      acclamationAntiphon: |-
        Si vous demeurez fidèles à ma parole,
        vous êtes vraiment mes disciples ;
        alors vous connaîtrez la vérité, dit le Seigneur.
      content: |-
        En ce temps-là,
        comme Jésus était dans une maison,
        >arrivent sa mère et ses frères.
        Restant au-dehors, ils le font appeler.
        Une foule était assise autour de lui ;
        et on lui dit :
        >« Voici que ta mère et tes frères sont là dehors :
        >ils te cherchent. »
        Mais il leur répond :
        >« Qui est ma mère ? qui sont mes frères ? »
        Et parcourant du regard
        ceux qui étaient assis en cercle autour de lui,
        il dit :
        >« Voici ma mère et mes frères.
        Celui qui fait la volonté de Dieu,
        >celui-là est pour moi un frère, une sœur, une mère. »
    - biblicalRef: 'Mc 10, 17-30 (lecture brève : Mc 10, 17-27)'
      headline: |-
        « Va, vends ce que tu as et donne-le aux pauvres. Puis viens, suis-moi »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus se mettait en route
        quand un homme accourut
        et, tombant à ses genoux, lui demanda :
        >« Bon Maître, que dois-je faire
        >pour avoir la vie éternelle en héritage ? »
        Jésus lui dit :
        >« Pourquoi dire que je suis bon ?
        Personne n’est bon, sinon Dieu seul.
        Tu connais les commandements :
        >Ne commets pas de meurtre,
        >ne commets pas d’adultère,
        >ne commets pas de vol,
        >ne porte pas de faux témoignage,
        >ne fais de tort à personne,
        >honore ton père et ta mère. »
        L’homme répondit :
        >« Maître, tout cela, je l’ai observé
        >depuis ma jeunesse. »
        Jésus posa son regard sur lui, et il l’aima.
        Il lui dit :
        >« Une seule chose te manque :
        >va, vends ce que tu as
        >et donne-le aux pauvres ;
        >alors tu auras un trésor au ciel.
        Puis viens, suis-moi. »
        Mais lui, à ces mots, devint sombre
        >et s’en alla tout triste,
        >car il avait de grands biens.
        Alors Jésus regarda autour de lui
        et dit à ses disciples :
        >« Comme il sera difficile
        >à ceux qui possèdent des richesses
        >d’entrer dans le royaume de Dieu ! »
        Les disciples étaient stupéfaits de ces paroles.
        Jésus reprenant la parole leur dit :
        >« Mes enfants, comme il est difficile
        >d’entrer dans le royaume de Dieu !
        Il est plus facile à un chameau
        >de passer par le trou d’une aiguille
        >qu’à un riche d’entrer dans le royaume de Dieu. »
        De plus en plus déconcertés,
        les disciples se demandaient entre eux :
        >« Mais alors, qui peut être sauvé ? »
        Jésus les regarde et dit :
        >« Pour les hommes, c’est impossible,
        >mais pas pour Dieu ;
        >car tout est possible à Dieu. »
        Pierre se mit à dire à Jésus :
        >« Voici que nous avons tout quitté
        >pour te suivre. »
        Jésus déclara :
        >« Amen, je vous le dis :
        >nul n’aura quitté,
        >à cause de moi et de l’Évangile,
        >une maison, des frères, des sœurs,
        >une mère, un père, des enfants ou une terre
        >sans qu’il reçoive, en ce temps déjà, le centuple :
        >maisons, frères, sœurs, mères, enfants et terres,
        >avec des persécutions,
        >et, dans le monde à venir,
        >la vie éternelle. »
    - biblicalRef: Lc 9, 57-62 (pour les religieux)
      headline: |-
        « Je te suivrai partout où tu iras »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        en cours de route, un homme dit à Jésus :
        >« Je te suivrai partout où tu iras. »
        Jésus lui déclara :
        >« Les renards ont des terriers,
        >les oiseaux du ciel ont des nids ;
        >mais le Fils de l’homme n’a pas d’endroit où reposer la tête. »
        Il dit à un autre :
        >« Suis-moi. »
        L’homme répondit :
        >« Seigneur, permets-moi d’aller d’abord enterrer mon père. »
        Mais Jésus répliqua :
        >« Laisse les morts enterrer leurs morts.
        Toi, pars, et annonce le règne de Dieu. »
        Un autre encore lui dit :
        >« Je te suivrai, Seigneur ;
        >mais laisse-moi d’abord faire mes adieux
        >aux gens de ma maison. »
        Jésus lui répondit :
        >« Quiconque met la main à la charrue,
        >puis regarde en arrière,
        >n’est pas fait pour le royaume de Dieu. »
    - biblicalRef: Lc 12, 32-34 (pour les religieux)
      headline: |-
        « Votre Père a trouvé bon de vous donner le Royaume »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Sois sans crainte, petit troupeau :
        >votre Père a trouvé bon de vous donner le Royaume.
        Vendez ce que vous possédez
        >et donnez-le en aumône.
        Faites-vous des bourses qui ne s’usent pas,
        >un trésor inépuisable dans les cieux,
        >là où le voleur n’approche pas,
        >où la mite ne détruit pas.
        Car là où est votre trésor,
        >là aussi sera votre cœur. »
        >Acclamons la Parole de Dieu.
    - biblicalRef: Lc 14, 25-33 (pour les religieux)
      headline: |-
        « Celui qui ne renonce pas à tout ce qui lui appartient ne peut pas être mon disciple »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        de grandes foules faisaient route avec Jésus ;
        il se retourna et leur dit :
        >« Si quelqu’un vient à moi
        >sans me préférer à son père, sa mère, sa femme,
        >ses enfants, ses frères et sœurs,
        >et même à sa propre vie,
        >il ne peut pas être mon disciple.
        Celui qui ne porte pas sa croix
        >pour marcher à ma suite
        ne peut pas être mon disciple.
        Quel est celui d’entre vous
        qui, voulant bâtir une tour,
        ne commence par s’asseoir
        >pour calculer la dépense
        >et voir s’il a de quoi aller jusqu’au bout ?
        Car, si jamais il pose les fondations
        >et n’est pas capable d’achever,
        tous ceux qui le verront vont se moquer de lui :
        >"Voilà un homme qui a commencé à bâtir
        >et n’a pas été capable d’achever !"
        Et quel est le roi
        qui, partant en guerre contre un autre roi,
        ne commence par s’asseoir
        >pour voir s’il peut, avec dix mille hommes,
        >affronter l’autre qui marche contre lui avec vingt mille ?
        S’il ne le peut pas,
        il envoie, pendant que l’autre est encore loin,
        une délégation pour demander les conditions de paix.
        Ainsi donc, celui d’entre vous qui ne renonce pas
        à tout ce qui lui appartient
        >ne peut pas être mon disciple. »
  offeringPrayer:
  - |-   
    Dieu de grande bonté, +
    >en saint N., tu as détruit l’homme ancien
    >pour créer un homme nouveau à ton image; *
    accorde-nous d’être renouvelés comme lui (elle), /
    >afin que nous puissions te plaire
    >en t’offrant ce sacrifice qui nous réconcilie avec toi.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Mt 19, 27-29
    content: |-
      Amen, je vous le dis:
      >vous qui avez tout quitté pour me suivre,
      vous recevrez le centuple,
      >et vous aurez en héritage la vie éternelle.
  prayerAfterCommunion:
  - |-   
    Par la puissance de ce sacrement,
    >Seigneur, nous te prions: +
    conduis-nous sans cesse dans la voie de ton amour,
    >comme tu fis pour saint N.; *
    l’œuvre de bonté que tu as entreprise en nous, /
    >poursuis-la jusqu’au jour du Christ Jésus.
    Lui qui vit et règne pour les siècles des siècles.
