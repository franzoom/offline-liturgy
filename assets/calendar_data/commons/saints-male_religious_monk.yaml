commonTitle: Commun des Saints religieux (moine)

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Là où des frères, tous ensemble, glorifient Dieu,
      >le Seigneur donnera sa bénédiction.
  - biblicalReference: cf. Ps 70, 8.23 (Vg)
    content: |-
      Je n’avais que ta louange à la bouche,
      >pour te chanter.
      Joie sur mes lèvres qui chantent pour toi.
  collect:
  - |-
    Seigneur Dieu, +
    >dans ta bonté, tu as appelé ton serviteur, saint N.,
    >à marcher à la suite du Christ ; *
    accorde-nous, par son intercession,
    >la force de renoncer à nous-mêmes, /
    >et de nous attacher à toi de tout notre cœur.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-   
    Reçois, nous t’en prions, Seigneur,
    >le sacrifice offert pour le salut de ton peuple : *
    qu’il nous obtienne, par l’intercession de saint N.,
    >d’éviter les séductions du péché /
    >et de nous rapprocher de la vie du ciel.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Lc 8, 15
    content: |-
      Ceux qui ont entendu la Parole dans un cœur bon et généreux 
      >portent du fruit par leur persévérance.
  - biblicalReference: cf. Ps 83, 5
    content: |-
      Heureux les habitants de ta maison, Seigneur : 
      >ils pourront te chanter à jamais 
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Seigneur notre Dieu, *
    >forts du soutien de saint N.,
    puissions-nous garder un juste équilibre de vie /
    >grâce au sacrement que nous offre ta sagesse.
    Par le Christ, notre Seigneur.