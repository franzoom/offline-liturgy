readings:
  biblicalReading:
    - title: LECTURE DU LIVRE DE LA SAGESSE
      subtitle: Bonheur du juste
      ref: Sg 7, 7-16.22-30
      content: |-
        J’ai prié et le discernement m’a été donné, j’ai imploré et l’esprit de la Sagesse est venu en moi. Je l’ai préférée aux sceptres et aux trônes, auprès d’elle ; j’ai estimé néant la richesse ; je ne l’ai pas comparée à la pierre inestimable car tout l’or du monde, face à elle, ne serait qu’un peu de sable et l’argent, devant elle, paraîtrait de la boue. Plus que la santé et la beauté je l’ai aimée, et je décidai de l’avoir pour lumière, car sa clarté ne connaît pas de déclin.
        Mais avec elle, elle m’a apporté tous les biens à la fois, elle tenait dans ses mains une richesse incalculable. J’ai profité de tous ces biens, les sachant dirigés par la Sagesse ; j’ignorais pourtant qu’elle-même en était l’auteur. Ce que j’avais appris avec simplicité, j’en fais part sans réserve, je ne tairai pas sa richesse. Car elle est pour les hommes un trésor inépuisable. Ceux qui l’ont exploité se sont concilié l’amitié de Dieu, recommandés à lui par les dons provenant de l’éducation.
        Que Dieu m’accorde de parler avec intelligence et de concevoir des pensées dignes des dons reçus, car c’est lui qui guide la Sagesse et dirige les sages. Il tient en son pouvoir et nous-mêmes et nos paroles, tout savoir et toute science des techniques. L’artisane de l’univers, la Sagesse, m’a instruit.
        Car il y a en elle un esprit intelligent, saint, unique, multiple, subtil, mobile, distinct, sans tache, clair, inaltérable, aimant le bien, diligent, indépendant, bienfaisant, ami de l’homme, ferme, assuré, tranquille, qui peut tout, surveille tout, et pénètre tous les esprits, les intelligents, les purs, les plus subtils. Aussi la Sagesse est-elle plus mobile qu’aucun mouvement, à cause de sa pureté, elle passe et pénètre à travers tout. Elle est un effluve de la puissance de Dieu, une pure irradiation de la gloire du Tout-Puissant ; c’est pourquoi nulle souillure ne se glisse en elle. Elle est un reflet de la lumière éternelle, un miroir sans tache de l’activité de Dieu et une image de sa bonté.
        Comme elle est unique, elle peut tout ; demeurant en elle-même, elle renouvelle l’univers et, au long des âges, elle passe dans les âmes saintes pour former des amis de Dieu et des prophètes. Car seuls sont aimés de Dieu ceux qui partagent l’intimité de la Sagesse. Elle est plus radieuse que le soleil et surpasse toute constellation. Comparée à la lumière, sa supériorité éclate : la nuit succède à la lumière, mais le mal ne prévaut pas sur la Sagesse.

      responsory: |-
        [rubric](Stance)[/rubric]
        Comme à l’aube du premier jour
        la Parole de Dieu créait l’univers,
        comme à l’heure de midi
        la Lumière épousait notre chair de souffrance
        pour la transfigurer,
        aujourd’hui encore, et par-delà le temps,
        le Verbe de vie consacre le monde
        en son Eucharistie.
        
        R/ Qu’il nous soit fait, Seigneur,
        selon ta Parole.
        
        L’heure vient, où les morts
        entendront la voix du Fils de Dieu,
        ceux qui l’entendent vivent !
        
        Celui qui garde ma Parole,
        mon Père l’aimera,
        et nous viendrons en lui !
        
        Demeurez dans ma Parole :
        vous connaîtrez la Vérité,
        et la Vérité vous fera libres !

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Si 15, 5 (Vg)
    content: |-
      Au milieu de son Église, le Seigneur a donné la parole à saint N.;
      il l’a rempli de l’esprit de sagesse et d’intelligence,
      >et lui a donné un vêtement de gloire, alléluia.
  - biblicalReference: cf. Ps 36, 30-31
    content: |-
      Les lèvres du juste méditent la sagesse
      >et sa bouche énonce le droit.
      La loi de son Dieu est dans son cœur, alléluia.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as donné (l’évêque) saint N.
    >comme docteur à ton Église; *
    fais que s’enracine à jamais en nos cœurs
    >ce qu’il a enseigné sous ton inspiration divine; /
    >et puisque, par ta grâce,
    >nous l’avons reçu comme protecteur,
    qu’il soit aussi notre défenseur
    >auprès de ta miséricorde.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ac 2, 14a.22-24.32-36
      headline: |-
        « Dieu l’a fait Seigneur et Christ »
      content: |-
        Le jour de la Pentecôte,
        Pierre, debout avec les onze autres Apôtres,
        éleva la voix et leur fit cette déclaration :
        >« Hommes d’Israël, écoutez les paroles que voici.
        Il s’agit de Jésus le Nazaréen,
        >homme que Dieu a accrédité auprès de vous
        >en accomplissant par lui des miracles,
        >des prodiges et des signes au milieu de vous,
        >comme vous le savez vous-mêmes.
        Cet homme, livré selon le dessein bien arrêté et la prescience de Dieu,
        >vous l’avez supprimé
        >en le clouant sur le bois par la main des impies.
        Mais Dieu l’a ressuscité
        >en le délivrant des douleurs de la mort,
        >car il n’était pas possible qu’elle le retienne en son pouvoir.
        Ce Jésus, Dieu l’a ressuscité ;
        >nous tous, nous en sommes témoins.
        Élevé par la droite de Dieu,
        >il a reçu du Père l’Esprit Saint qui était promis,
        >et il l’a répandu sur nous,
        >ainsi que vous le voyez et l’entendez.
        David, en effet, n’est pas monté au ciel,
        >bien qu’il dise lui-même :
        >Le Seigneur a dit à mon Seigneur :
        >"Siège à ma droite,
        >jusqu’à ce que j’aie placé tes ennemis
        >comme un escabeau sous tes pieds."
        >Que toute la maison d’Israël le sache donc avec certitude :
        >Dieu l’a fait Seigneur et Christ,
        >ce Jésus que vous aviez crucifié. »
    - biblicalRef: Ac 13, 26-33
      headline: |-
        « La promesse, Dieu l’a pleinement accomplie en ressuscitant Jésus »
      content: |-
        En ces jours-là, Paul vint à Antioche de Pisidie.
        Dans la synagogue, il disait :
        >« Vous, frères, les fils de la lignée d’Abraham
        >et ceux parmi vous qui craignent Dieu,
        >c’est à nous que la parole du salut a été envoyée.
        En effet, les habitants de Jérusalem et leurs chefs
        >ont méconnu Jésus,
        >ainsi que les paroles des prophètes
        >qu’on lit chaque sabbat ;
        >or, en le jugeant, ils les ont accomplies.
        Sans avoir trouvé en lui aucun motif de condamnation à mort,
        >ils ont demandé à Pilate qu’il soit supprimé.
        Et, après avoir accompli tout ce qui était écrit de lui,
        >ils l’ont descendu du bois de la croix et mis au tombeau.
        Mais Dieu l’a ressuscité d’entre les morts.
        Il est apparu pendant bien des jours
        >à ceux qui étaient montés avec lui de Galilée à Jérusalem,
        >et qui sont maintenant ses témoins devant le peuple.
        Et nous, nous vous annonçons cette Bonne Nouvelle :
        >la promesse faite à nos pères,
        >Dieu l’a pleinement accomplie pour nous, leurs enfants,
        >en ressuscitant Jésus,
        >comme il est écrit au psaume deux :
        >Tu es mon fils ;
        >moi, aujourd’hui, je t’ai engendré. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 18B (19), 8, 9, 10, 11
      label: null
      refAbbr: 18B, 10cd
      chorus:
      - chorusRef: 18B, 10cd
        chorus: |-
          Les décisions du Seigneur sont justes
          et vraiment équitables.
      - chorusRef: cf. Jn 6, 63c
        chorus: |-
          ou : Tes paroles, Seigneur, sont esprit
          et elles sont vie.
      content: |-
        La loi du Seigneur est parfaite,
        qui redonne vie ;
        la charte du Seigneur est sûre,
        qui rend sages les simples.

        Les préceptes du Seigneur sont droits,
        ils réjouissent le cœur ;
        le commandement du Seigneur est limpide,
        il clarifie le regard.

        La crainte qu’il inspire est pure,
        elle est là pour toujours ;
        les décisions du Seigneur sont justes
        et vraiment équitables :

        plus désirables que l’or,
        qu’une masse d’or fin,
        plus savoureuses que le miel
        qui coule des rayons.
    - biblicalRef: Ps 36 (37), 3-4, 5-6, 30-31
      label: null
      refAbbr: 36, 30a
      chorus:
      - chorusRef: 36, 30a
        chorus: |-
          Les lèvres du juste redisent la sagesse.
      content: |-
        Fais confiance au Seigneur, agis bien,
        habite la terre et reste fidèle ;
        mets ta joie dans le Seigneur :
        il comblera les désirs de ton cœur.

        Dirige ton chemin vers le Seigneur,
        fais-lui confiance, et lui, il agira.
        Il fera lever comme le jour ta justice,
        et ton droit comme le plein midi.

        Les lèvres du juste redisent la sagesse
        et sa bouche énonce le droit.
        La loi de son Dieu est dans son cœur ;
        il va, sans craindre les faux pas.
    - biblicalRef: Ps 118 (119), 9-10, 11-12, 13-14
      label: null
      refAbbr: 118, 12b
      chorus:
      - chorusRef: 118, 12b
        chorus: |-
          Apprends-moi, Seigneur, tes commandements.
      content: |-
        Comment, jeune, garder pur son chemin ?
        En observant ta parole.
        De tout mon cœur, je te cherche ;
        garde-moi de fuir tes volontés.

        Dans mon cœur, je conserve tes promesses
        pour ne pas faillir envers toi.
        Toi, Seigneur, tu es béni :
        apprends-moi tes commandements.

        Je fais repasser sur mes lèvres
        chaque décision de ta bouche.
        Je trouve dans la voie de tes exigences
        plus de joie que dans toutes les richesses.
  - partType: READING
    partContents: 
    - biblicalRef: 1 Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
    - biblicalRef: 1 Co 2, 1-10a
      headline: |-
        « Nous proclamons la sagesse du mystère de Dieu »
      content: |-
        Frères,
        quand je suis venu chez vous,
        je ne suis pas venu vous annoncer le mystère de Dieu
        >avec le prestige du langage ou de la sagesse.
        Parmi vous, je n’ai rien voulu connaître d’autre que Jésus Christ,
        >ce Messie crucifié.
        Et c’est dans la faiblesse, craintif et tout tremblant,
        >que je me suis présenté à vous.
        Mon langage, ma proclamation de l’Évangile,
        >n’avaient rien d’un langage de sagesse qui veut convaincre ;
        mais c’est l’Esprit et sa puissance qui se manifestaient,
        pour que votre foi repose, non pas sur la sagesse des hommes,
        >mais sur la puissance de Dieu.
        Pourtant, c’est bien de sagesse que nous parlons
        >devant ceux qui sont adultes dans la foi,
        mais ce n’est pas la sagesse de ce monde,
        >la sagesse de ceux qui dirigent ce monde
        >et qui vont à leur destruction.
        Au contraire, ce dont nous parlons,
        >c’est de la sagesse du mystère de Dieu,
        >sagesse tenue cachée, établie par lui dès avant les siècles,
        >pour nous donner la gloire.
        Aucun de ceux qui dirigent ce monde ne l’a connue,
        car, s’ils l’avaient connue,
        >ils n’auraient jamais crucifié le Seigneur de gloire.
        Mais ce que nous proclamons, c’est, comme dit l’Écriture :
        >ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu,
        >ce qui n’est pas venu à l’esprit de l’homme,
        >ce que Dieu a préparé pour ceux dont il est aimé.
        Et c’est à nous que Dieu, par l’Esprit, en a fait la révélation.
    - biblicalRef: 1 Co 2, 10b-16
      headline: |-
        « Nous, nous avons la pensée du Christ »
      content: |-
        Frères,
        l’Esprit scrute le fond de toutes choses,
        >même les profondeurs de Dieu.
        Qui donc, parmi les hommes, sait ce qu’il y a dans l’homme,
        >sinon l’esprit de l’homme qui est en lui ?
        De même, personne ne connaît ce qu’il y a en Dieu,
        >sinon l’Esprit de Dieu.
        Or nous, ce n’est pas l’esprit du monde que nous avons reçu,
        >mais l’Esprit qui vient de Dieu,
        et ainsi nous avons conscience
        >des dons que Dieu nous a accordés.
        Nous disons cela avec un langage
        >que nous n’apprenons pas de la sagesse humaine,
        >mais que nous apprenons de l’Esprit ;
        nous comparons entre elles les réalités spirituelles.
        L’homme, par ses seules capacités,
        >n’accueille pas ce qui vient de l’Esprit de Dieu ;
        pour lui ce n’est que folie,
        >et il ne peut pas comprendre,
        car c’est par l’Esprit qu’on examine toute chose.
        Celui qui est animé par l’Esprit soumet tout à examen,
        >mais lui, personne ne peut l’y soumettre.
        Car il est écrit :
        >Qui a connu la pensée du Seigneur
        >et qui pourra l’instruire ?
        Eh bien nous, nous avons la pensée du Christ !
    - biblicalRef: Ep 3, 8-12
      headline: |-
        « Annoncer aux nations l’insondable richesse du Christ »
      content: |-
        Frères,
        à moi qui suis vraiment le plus petit de tous les fidèles,
        la grâce a été donnée d’annoncer aux nations
        >l’insondable richesse du Christ,
        et de mettre en lumière pour tous le contenu du mystère
        >qui était caché depuis toujours en Dieu,
        >le créateur de toutes choses ;
        ainsi, désormais, les Puissances célestes elles-mêmes
        >connaissent, grâce à l’Église,
        >les multiples aspects de la Sagesse de Dieu.
        C’est le projet éternel que Dieu a réalisé
        >dans le Christ Jésus notre Seigneur.
        Et notre foi au Christ nous donne l’assurance nécessaire
        >pour accéder auprès de Dieu en toute confiance.
    - biblicalRef: Ep 4, 1-7.11-13
      headline: |-
        « Pour que les tâches du ministère soient accomplies et que se construise le corps du Christ »
      content: |-
        Frères,
        >moi qui suis en prison à cause du Seigneur,
        >je vous exhorte à vous conduire
        >d’une manière digne de votre vocation :
        >ayez beaucoup d’humilité, de douceur et de patience,
        >supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.
        Et les dons qu’il a faits,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
    - biblicalRef: 2 Tm 1, 13-14; 2, 1-3
      headline: |-
        « Garde le dépôt de la foi avec l’aide de l’Esprit Saint »
      content: |-
        Bien-aimé,
        tiens-toi au modèle donné par les paroles solides
        >que tu m’as entendu prononcer dans la foi
        >et dans l’amour qui est dans le Christ Jésus.
        Garde le dépôt de la foi dans toute sa beauté,
        >avec l’aide de l’Esprit Saint qui habite en nous.
        Toi donc, mon enfant, trouve ta force
        >dans la grâce qui est en Jésus Christ.
        Ce que tu m’as entendu dire en présence de nombreux témoins,
        confie-le à des hommes dignes de foi
        >qui seront capables de l’enseigner aux autres, à leur tour.
        Prends ta part de souffrance
        >comme un bon soldat du Christ Jésus.
    - biblicalRef: 2 Tm 4, 1-5
      headline: |-
        « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        je t’en conjure,
        >au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        interviens à temps et à contretemps,
        dénonce le mal,
        fais des reproches, encourage,
        >toujours avec patience et souci d’instruire.
        Un temps viendra
        >où les gens ne supporteront plus l’enseignement de la saine doctrine ;
        mais, au gré de leurs caprices,
        >ils iront se chercher une foule de maîtres
        >pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        >pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        >supporte la souffrance,
        fais ton travail d’évangélisateur,
        >accomplis jusqu’au bout ton ministère.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 13-19
      headline: |-
        « Vous êtes la lumière du monde »
      acclamationAntiphon: |-
        Que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Vous êtes le sel de la terre.
        Mais si le sel devient fade,
        >comment lui rendre de la saveur ?
        Il ne vaut plus rien :
        >on le jette dehors et il est piétiné par les gens.
        Vous êtes la lumière du monde.
        Une ville située sur une montagne
        >ne peut être cachée.
        Et l’on n’allume pas une lampe
        >pour la mettre sous le boisseau ;
        >on la met sur le lampadaire,
        >et elle brille pour tous ceux qui sont dans la maison.
        De même, que votre lumière brille devant les hommes :
        >alors, voyant ce que vous faites de bien,
        >ils rendront gloire à votre Père qui est aux cieux.
        Ne pensez pas que je sois venu abolir la Loi ou les Prophètes :
        >je ne suis pas venu abolir, mais accomplir.
        Amen, je vous le dis :
        >Avant que le ciel et la terre disparaissent,
        >pas un seul iota, pas un seul trait ne disparaîtra de la Loi
        >jusqu’à ce que tout se réalise.
        Donc, celui qui rejettera
        >un seul de ces plus petits commandements,
        >et qui enseignera aux hommes à faire ainsi,
        >sera déclaré le plus petit dans le royaume des Cieux.
        Mais celui qui les observera et les enseignera,
        >celui-là sera déclaré grand dans le royaume des Cieux. »
    - biblicalRef: Mt 7, 21-29
      headline: |-
        « Jésus les enseignait en homme qui a autorité »
      acclamationAntiphon: |-
        Tes paroles, Seigneur,
        sont esprit et elles sont vie.
        Tu as les paroles de la vie éternelle.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Ce n’est pas en me disant : "Seigneur, Seigneur !"
        >qu’on entrera dans le royaume des Cieux,
        mais c’est en faisant la volonté de mon Père qui est aux cieux.
        Ce jour-là, beaucoup me diront :
        >"Seigneur, Seigneur,
        >n’est-ce pas en ton nom que nous avons prophétisé,
        >en ton nom que nous avons expulsé les démons,
        >en ton nom que nous avons fait beaucoup de miracles ?"
        Alors je leur déclarerai :
        >"Je ne vous ai jamais connus.
        Écartez-vous de moi, vous qui commettez le mal !"
        Ainsi, celui qui entend les paroles que je dis là
        >et les met en pratique
        est comparable à un homme prévoyant
        >qui a construit sa maison sur le roc.
        La pluie est tombée, les torrents ont dévalé,
        >les vents ont soufflé et se sont abattus sur cette maison ;
        la maison ne s’est pas écroulée,
        >car elle était fondée sur le roc.
        Et celui qui entend de moi ces paroles
        >sans les mettre en pratique
        est comparable à un homme insensé
        >qui a construit sa maison sur le sable.
        La pluie est tombée, les torrents ont dévalé,
        >les vents ont soufflé, ils sont venus battre cette maison ;
        >la maison s’est écroulée, et son écroulement a été complet. »
        Lorsque Jésus eut terminé ce discours,
        >les foules restèrent frappées de son enseignement,
        car il les enseignait en homme qui a autorité,
        >et non pas comme leurs scribes.
    - biblicalRef: Mt 13, 47-52
      headline: |-
        « Il tire de son trésor du neuf et de l’ancien »
      acclamationAntiphon: |-
        Seigneur, ouvre notre cœur
        pour nous rendre attentifs aux paroles de ton Fils.
      content: |-
        En ce temps-là,
        Jésus disait aux foules :
        >« Le royaume des Cieux est encore comparable
        >à un filet que l’on jette dans la mer,
        >et qui ramène toutes sortes de poissons.
        Quand il est plein, on le tire sur le rivage,
        >on s’assied,
        >on ramasse dans des paniers ce qui est bon,
        >et on rejette ce qui ne vaut rien.
        Ainsi en sera-t-il à la fin du monde :
        >les anges sortiront pour séparer les méchants du milieu des justes
        >et les jetteront dans la fournaise :
        >là, il y aura des pleurs et des grincements de dents. »
        « Avez-vous compris tout cela ? »
        Ils lui répondent : « Oui. »
        Jésus ajouta :
        >« C’est pourquoi tout scribe
        >devenu disciple du royaume des Cieux
        >est comparable à un maître de maison
        >qui tire de son trésor du neuf et de l’ancien. »
    - biblicalRef: Mt 23, 8-12
      headline: |-
        « Ne vous faites pas donner le titre de maîtres, car vous n’avez qu’un seul maître, le Christ »
      acclamationAntiphon: |-
        Vous n’avez qu’un seul Père,
        celui qui est aux cieux ;
        vous n’avez qu’un seul maître, le Christ.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Ne vous faites pas donner le titre de Rabbi,
        >car vous n’avez qu’un seul maître pour vous enseigner,
        >et vous êtes tous frères.
        Ne donnez à personne sur terre le nom de père,
        >car vous n’avez qu’un seul Père, celui qui est aux cieux.
        Ne vous faites pas non plus donner le titre de maîtres,
        >car vous n’avez qu’un seul maître, le Christ.
        Le plus grand parmi vous sera votre serviteur.
        Qui s’élèvera sera abaissé,
        >qui s’abaissera sera élevé. »
    - biblicalRef: 'Mc 4, 1-10.13-20 (lecture brève : Mc 4, 1-9)'
      headline: |-
        « Voici que le semeur sortit pour semer »
      acclamationAntiphon: |-
        La semence est la parole de Dieu ;
        le semeur est le Christ ;
        celui qui le trouve demeure pour toujours.
      content: |-
        En ce temps-là,
        Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
        Une foule très nombreuse se rassembla auprès de lui,
        >si bien qu’il monta dans une barque où il s’assit.
        Il était sur la mer,
        >et toute la foule était près de la mer, sur le rivage.
        Il leur enseignait beaucoup de choses en paraboles,
        et dans son enseignement il leur disait :
        >« Écoutez ! Voici que le semeur sortit pour semer.
        Comme il semait,
        >du grain est tombé au bord du chemin ;
        >les oiseaux sont venus et ils ont tout mangé.
        Du grain est tombé aussi sur du sol pierreux,
        >où il n’avait pas beaucoup de terre ;
        >il a levé aussitôt,
        >parce que la terre était peu profonde ;
        >et lorsque le soleil s’est levé, ce grain a brûlé
        >et, faute de racines, il a séché.
        Du grain est tombé aussi dans les ronces,
        >les ronces ont poussé, l’ont étouffé,
        >et il n’a pas donné de fruit.
        Mais d’autres grains sont tombés dans la bonne terre ;
        >ils ont donné du fruit
        >en poussant et en se développant,
        >et ils ont produit
        >trente, soixante, cent, pour un. »
        Et Jésus disait :
        >« Celui qui a des oreilles pour entendre,
        >qu’il entende ! »
        Quand il resta seul,
        ceux qui étaient autour de lui avec les Douze
        >l’interrogeaient sur les paraboles.
        Il leur dit encore :
        >« Vous ne saisissez pas cette parabole ?
        Alors, comment comprendrez-vous toutes les paraboles ?
        Le semeur sème la Parole.
        Il y a ceux qui sont au bord du chemin
        >où la Parole est semée :
        >quand ils l’entendent,
        >Satan vient aussitôt
        >et enlève la Parole semée en eux.
        Et de même, il y a ceux qui ont reçu la semence
        >dans les endroits pierreux :
        >ceux-là, quand ils entendent la Parole,
        >ils la reçoivent aussitôt avec joie ;
        >mais ils n’ont pas en eux de racine,
        >ce sont les gens d’un moment ;
        >que vienne la détresse ou la persécution à cause de la Parole,
        >ils trébuchent aussitôt.
        Et il y en a d’autres qui ont reçu la semence dans les ronces :
        >ceux-ci entendent la Parole,
        >mais les soucis du monde, la séduction de la richesse
        >et toutes les autres convoitises
        >les envahissent et étouffent la Parole,
        >qui ne donne pas de fruit.
        Et il y a ceux qui ont reçu la semence dans la bonne terre :
        >ceux-là entendent la Parole, ils l’accueillent,
        >et ils portent du fruit :
        >trente, soixante, cent, pour un. »
    - biblicalRef: Lc 6, 43-45
      headline: |-
        « Ce que dit la bouche, c’est ce qui déborde du cœur »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Un bon arbre ne donne pas de fruit pourri ;
        >jamais non plus un arbre qui pourrit ne donne de bon fruit.
        Chaque arbre, en effet, se reconnaît à son fruit :
        >on ne cueille pas des figues sur des épines ;
        >on ne vendange pas non plus du raisin sur des ronces.
        L’homme bon tire le bien
        >du trésor de son cœur qui est bon ;
        >et l’homme mauvais tire le mal
        >de son cœur qui est mauvais :
        >car ce que dit la bouche,
        >c’est ce qui déborde du cœur. »
  offeringPrayer:
  - |-
    Daigne accepter, Seigneur Dieu,
    >ce sacrifice que nous t’offrons de grand cœur,
    >en la fête de saint N.: *
    fidèles à son enseignement,
    >nous voulons nous offrir tout entiers /
    >en célébrant ta louange.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Lc 12, 42
    content: |-
      Voici le serviteur fidèle et avisé 
      que le maître a établi sur sa maison,
      >pour donner à chacun, en temps voulu, sa part de blé, alléluia.
  - biblicalReference: cf. Ps 1, 2-3
    content: |-
      Qui médite la loi du Seigneur jour et nuit
      >donne du fruit en son temps, alléluia.
  prayerAfterCommunion:
  - |-
    Ceux que tu fortifies, Seigneur, par le Christ, pain vivant,
    >forme-les aussi par le Christ, le seul maitre, *
    pour qu’en la fête de saint N.,
    >ils soient instruits de ta vérité /
    >et la mettent en œuvre dans la charité.
    Par le Christ, notre Seigneur.