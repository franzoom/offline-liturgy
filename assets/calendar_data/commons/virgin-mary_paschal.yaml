oration:
  - Dieu qui as donné la joie au monde en ressuscitant Jésus ton Fils, accorde-nous, par sa Mère, la Vierge Marie, de parvenir au bonheur de la vie éternelle.
  - Dieu qui as envoyé l’Esprit Saint sur tes Apôtres quand ils étaient en prière avec Marie, la Mère de Jésus, donne-nous, par son intercession, de savoir te servir avec fidélité et de travailler par la parole et l’exemple au rayonnement de ta gloire.

invitatory:
  antiphon:
    - Le Christ est né de la Vierge Marie ; venez, adorons-le, alléluia.
    - Béni sois-tu, Seigneur, en l’honneur de la Vierge Marie.

readings:
  biblicalReading:
    - title: LECTURE DU LIVRE DE L’APOCALYPSE
      subtitle: Un grand signe dans le ciel
      ref: Ap 11,19 - 12,17
      content: |-
        Le temple de Dieu dans le ciel s’ouvrit, et l’arche de l’alliance apparut dans son temple. Alors il y eut des éclairs, des voix, des tonnerres, un tremblement de terre et une forte grêle.
        Un grand signe apparut dans le ciel : une femme, vêtue du soleil, la lune sous les pieds, et sur la tête une couronne de douze étoiles. Elle était enceinte et criait dans le travail et les douleurs de l’enfantement. Alors un autre signe apparut dans le ciel : C’était un grand dragon rouge-feu. II avait sept têtes et dix cornes, et sur ses têtes, sept diadèmes. Sa queue, qui balayait le tiers des étoiles du ciel, les précipita sur la terre. Le dragon se posta devant la femme qui allait enfanter, afin de dévorer l’enfant dès sa naissance. Elle mit au monde un fils, un enfant mâle ; c’est lui qui doit mener paître toutes les nations avec une verge de fer. Et son enfant fut enlevé auprès de Dieu et de son trône. Alors la femme s’enfuit au désert, où Dieu lui a fait préparer une place, pour qu’elle y soit nourrie mille deux cent soixante jours. Il y eut alors un combat dans le ciel :
        Michaël et ses anges combattirent contre le dragon. Et le dragon lui aussi combattait avec ses anges, mais il n’eut pas le dessus : il ne se trouva plus de place pour eux dans le ciel. Il fut précipité, le grand dragon, l’antique serpent, celui qu’on nomme Diable et Satan, le séducteur du monde entier, il fut précipité sur la terre et ses anges avec lui.
        Et j’entendis une voix forte qui, dans le ciel, disait : Voici le temps du salut, de la puissance et du règne de notre Dieu, et de l’autorité de son Christ ; car il a été précipité, l’accusateur de nos frères, celui qui les accusait devant notre Dieu, jour et nuit. Mais eux, ils l’ont vaincu par le sang de l’Agneau, et par la parole dont ils ont rendu témoignage : Ils n’ont pas aimé leur vie jusqu’à craindre la mort. C’est pourquoi soyez dans la joie, vous, les cieux, et vous qui y avez votre demeure ! Malheur à vous, la terre et la mer, car le diable est descendu vers vous, emporté de fureur, sachant que peu de temps lui reste.
        Quand le dragon se vit précipité sur la terre, il se lança à la poursuite de la femme qui avait mis au monde l’enfant mâle. Mais les deux ailes du grand aigle furent données à la femme, pour qu’elle s’envole au désert, au lieu qui lui est réservé pour y être nourrie, loin du serpent, un temps, des temps et la moitié d’un temps. Alors le serpent vomit comme un fleuve d’eau derrière la femme pour la faire emporter par les flots. Mais la terre vint au secours de la femme : la terre s’ouvrit et engloutit le fleuve vomi par le dragon. Dans sa fureur contre la femme, le dragon porta le combat contre le reste de sa descendance, ceux qui observent les commandements de Dieu et gardent le témoignage de Jésus.

      responsory: |-
        R/ Ton Dieu sera ta beauté,
        ta lumière éternelle, alléluia !

        Jérusalem, tes portes seront de cristal
        et tes murs, de rubis,
        et l’on chantera sur tes places :
        Alléluia, alléluia !

        Ta splendeur illuminera
        toutes les contrées de la terre ;
        les peuples viendront de loin
        adorer le Seigneur dans tes murs.

middleOfDay:
  tierce:
    responsory: |-
      V/ Vierge Mère de Dieu, glorieuse Reine du monde, alléluia,
      intercède pour nous auprès du Seigeur, alléluia.
  sexte:
    responsory: |-
      V/ Heureuse la Vierge Marie, alléluia :
      elle a mis au monde le roi du ciel, alléluia.
  none:
    responsory: |-
      V/ Marie retenait tous ces événements, alléluia,
      elle les méditait dans son cœur, alléluia.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - biblicalReference: cf. Ps 29, 12
        content: |-
          Tu as changé mon deuil en une danse ; 
          >Seigneur, tu m’as comblée de joie, alléluia.
    collect:
      - |-
        Seigneur Dieu, +
        par la résurrection de ton Fils, notre Seigneur Jésus, le Christ, 
        >tu as voulu donner la joie au monde : *
        accorde-nous, par sa Mère, la Vierge Marie, /
        >d’obtenir le bonheur de la vie éternelle. 
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Ac 1, 12-14
            headline: |-
              « Tous, d’un même cœur, étaient assidus à la prière, avec Marie la mère de Jésus »
            content: |-
              Les Apôtres, après avoir vu Jésus s’en aller vers le ciel,
              >retournèrent à Jérusalem
              >depuis le lieu-dit « mont des Oliviers » qui en est proche,
              >- la distance de marche ne dépasse pas ce qui est permis le jour
              >du sabbat.
              À leur arrivée, ils montèrent dans la chambre haute
              >où ils se tenaient habituellement ;
              c’était Pierre, Jean, Jacques et André,
              >Philippe et Thomas,
              >Barthélemy et Matthieu,
              >Jacques fils d’Alphée, Simon le Zélote, et Jude fils de Jacques.
              Tous, d’un même cœur, étaient assidus à la prière,
              avec des femmes, avec Marie la mère de Jésus,
              >et avec ses frères.
          - biblicalRef: Ap 11, 19a ; 12, 1-6a.10ab
            headline: |-
              « Un grand signe apparut dans le ciel »
            content: |-
              Le sanctuaire de Dieu, qui est dans le ciel, s’ouvrit,
              >et l’arche de son Alliance apparut dans le Sanctuaire.
              Un grand signe apparut dans le ciel :
              une Femme,
              >ayant le soleil pour manteau,
              >la lune sous les pieds,
              >et sur la tête une couronne de douze étoiles.
              Elle est enceinte, elle crie,
              >dans les douleurs et la torture d’un enfantement.
              Un autre signe apparut dans le ciel :
              un grand Dragon, rouge feu,
              >avec sept têtes et dix cornes,
              >et, sur chacune des sept têtes, un diadème.
              Sa queue, entraînant le tiers des étoiles du ciel,
              >les précipita sur la terre.
              Le Dragon vint se poster devant la Femme qui allait enfanter,
              >afin de dévorer l’enfant dès sa naissance.
              Or, elle mit au monde un fils, un enfant mâle,
              >celui qui sera le berger de toutes les nations,
              >les conduisant avec un sceptre de fer.
              L’enfant fut enlevé jusqu’auprès de Dieu et de son Trône,
              et la Femme s’enfuit au désert,
              >où Dieu lui a préparé une place.
              Alors j’entendis dans le ciel une voix forte,
              qui proclamait :
              >« Maintenant voici le salut,
              >la puissance et le règne de notre Dieu,
              >voici le pouvoir de son Christ ! »
          - biblicalRef: Ap 21, 1-5a
            headline: |-
              « J’ai vu la Jérusalem nouvelle, prête pour les noces, comme une épouse parée pour son mari »
            content: |-
              Moi, Jean,
              j’ai vu un ciel nouveau et une terre nouvelle,
              >car le premier ciel et la première terre s’en étaient allés
              >et, de mer, il n’y en a plus.
              Et la Ville sainte, la Jérusalem nouvelle,
              je l’ai vue qui descendait du ciel, d’auprès de Dieu,
              >prête pour les noces, comme une épouse parée pour son mari.
              Et j’entendis une voix forte qui venait du Trône.
              Elle disait :
              >« Voici la demeure de Dieu avec les hommes ;
              >il demeurera avec eux,
              >et ils seront ses peuples,
              >et lui-même, Dieu avec eux, sera leur Dieu.
              Il essuiera toute larme de leurs yeux,
              >et la mort ne sera plus,
              >et il n’y aura plus ni deuil, ni cri, ni douleur :
              >ce qui était en premier s’en est allé. »
              Alors celui qui siégeait sur le Trône déclara :
              >« Voici que je fais toutes choses nouvelles. »
    offeringPrayer:
      - |-
        Reçois, Père très saint, l’humble offrande 
        >que nous te présentons dans la joie, 
        en célébrant la mémoire de la bienheureuse Vierge Marie ; *
        fais qu’en nous unissant au sacrifice du Christ, 
        >nous recevions la consolation dès maintenant /
        >t le salut pour l’éternité. 
        Par le Christ, notre Seigneur.
    prefaceList:
      - the_blessed_virgin_mary_1
      - the_blessed_virgin_mary_2
    communionAntiphon:
      - biblicalReference: null
        content: |-
          Réjouis-toi, Vierge Mère, 
          >car le Christ s’est relevé du tombeau, alléluia.
    prayerAfterCommunion:
      - |-
        Réconfortés par les sacrements de Paques,
        nous t’en prions, Seigneur, *
        fais que, célébrant la mémoire de la Mère de ton Fils, /
        >nous manifestions dans notre chair vouée à la mort 
        >la vie de Jésus.
        Lui qui vit et règne pour les siècles des siècles.
