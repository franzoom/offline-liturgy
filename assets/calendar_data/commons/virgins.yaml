commonTitle: Commun des Vierges

celebration:
  color: white

oration:
- Dieu qui veux habiter les cœurs droits et sincères, donne-nous, par l’intercession de sainte N. de vivre selon ta grâce ; alors tu pourras venir en nous pour y faire ta demeure.
- |-
  Exauce nos prières, Seigneur, en ce jour où nous rappelons les vertus de sainte N. : accorde-nous de persévérer dans ton amour et d’y progresser jusqu’au terme de notre vie.

firstVespers:
  hymn:
  - pour-toi-fils-de-dieu
  psalmody:
  - psalm: PSALM_112
    antiphon:
    - Venez, filles de Dieu, approchez du Seigneur, et vous serez dans la lumière !
  - psalm: PSALM_147
    antiphon:
    - |-
      Oui, de tout notre cœur, nous te suivons : remplis de crainte, nous cherchons ton visage.
  - psalm: NT_4
    antiphon:
    - |-
      Réjouissez-vous, vierges du Christ : vous êtes à lui pour toujours.
  reading:
    biblicalReference: 1Co 7, 32b.34a
    content: Celui qui n’est pas marié a le souci des affaires du Seigneur, il cherche comment plaire au Seigneur. La femme sans mari, ou celle qui reste vierge, a le souci des affaires du Seigneur ; elle veut lui consacrer son corps et son esprit.
  responsory: |-
    R/ Ma part, c’est Dieu pour toujours :
    * le Seigneur est bon pour qui se tourne vers lui.
    V/ En silence j’attends son secours. *
    Gloire au Père. R/
  evangelicAntiphon:
    common: Vierge prévoyante et sage, quand vient l’Époux, tu entres avec lui dans la salle des noces.
  intercession:
    content: |-
      Le Christ a loué ceux qui se consacraient de corps et d’âme au royaume des cieux ;
      bénissons-le de tout notre cœur :

      R/ Ô Christ, notre salut, Jésus, notre lumière !

      Tu as voulu pour épouse une Église vierge et pure,
      – rends-la irréprochable et sainte.

      Les vierges sages ont couru au-devant de toi avec leurs lampes,
      – donne aux femmes qui te sont consacrées de te rester fidèles.

      Tu donnes à ton Église de garder sa foi intègre et pure,
      – accorde cette même grâce à tous les chrétiens.

      Nous célébrons aujourd’hui la fête de sainte N,
      – que son intercession soit notre joie.

      Tu accueilles les vierges sages au festin des noces,
      – reçois avec bonté ceux que tu as appelés dans ta demeure du ciel.

invitatory:
  antiphon:
  - Jésus Christ, le Roi des vierges, venez, adorons-le.
  - Venez, adorons l’Agneau de Dieu, lui que suivent les vierges.

readings:
  hymn:
  - voici-l-epoux
  psalmody:
  - psalm: PSALM_18A
    antiphon:
    - |-
      Voici l’Époux qui vient : allez à la rencontre du Christ, alléluia.
  - psalm: PSALM_44_1
    antiphon:
    - Voici le Christ, l’Église est sa fiancée comme une vierge pure, alléluia.
  - psalm: PSALM_44_2
    antiphon:
    - Soyons dans l’allégresse et dans la joie, car voici les noces de l’Agneau, alléluia.
  verse: |-
    V/ Tu m’enseignes la route de la vie,
    en ta présence la joie ne finit pas.
  biblicalReading:
  - title: LECTURE DE LA 1^ère LETTRE AUX CORINTHIENS
    subtitle: La virginité pour le Seigneur
    ref: 1Co 7, 25-40
    content: |-
      Au sujet des vierges, je n’ai pas d’ordre du Seigneur ; c’est un avis que je donne, celui d’un homme qui, par la miséricorde du Seigneur, est digne de confiance. Je pense que cet état est bon, à cause des angoisses présentes, oui, je pense qu’il est bon pour l’homme de rester ainsi. Es-tu lié à une femme ? Ne cherche pas à rompre. N’es-tu pas lié à une femme ? Ne cherche pas de femme. Si cependant tu te maries, tu ne pèches pas ; et si une vierge se marie, elle ne pèche pas. Mais les gens mariés auront de lourdes épreuves a supporter et mol, je voudrais vous les épargner.
      Voici ce que je dis, frères : le temps est écourté. Désormais, que ceux qui ont une femme soient comme s’ils n’en avaient pas, ceux qui pleurent comme s’ils ne pleuraient pas, ceux qui se réjouissent comme s’ils ne se réjouissaient pas, ceux qui achètent comme s’ils ne possédaient pas, ceux qui tirent profit de ce monde comme s’ils n’en profitaient pas vraiment. Car la figure de ce monde passe. Je voudrais que vous soyez exempts de soucis. Celui qui n’est pas marié a souci des affaires du Seigneur : il cherche comment plaire au Seigneur. Mais celui qui est marié a souci des affaires du monde : il cherche comment plaire à sa femme, et il est partagé. De même la femme sans mari et la jeune fille ont souci des affaires du Seigneur, afin d’être saintes de corps et d’esprit. Mais la femme mariée a souci des affaires du monde : elle cherche comment plaire à son mari. Je vous dis cela dans votre propre intérêt, non pour vous tendre un piège mais pour que vous fassiez ce qui convient le mieux et que vous soyez attachés au Seigneur sans partage.
      Si quelqu’un, débordant d’ardeur, pense qu’il ne pourra pas respecter sa fiancée et que les choses doivent suivre leur cours, qu’il fasse selon son idée. Il ne pèche pas : qu’ils se marient. Mais celui qui a pris dans son cœur une ferme résolution, hors de toute contrainte et qui, en pleine possession de sa volonté, a pris en son for intérieur la décision de respecter sa fiancée, celui-là fera bien. Ainsi celui qui épouse sa fiancée fait bien, et celui qui ne l’épouse pas fera encore mieux.
      La femme est liée à son mari aussi longtemps qu’il vit. Si le mari meurt, elle est libre d’épouser qui elle veut, mais un chrétien seulement. Cependant elle sera plus heureuse, à mon avis, si elle reste comme elle est ; et je crois, moi aussi, avoir l’Esprit de Dieu.

    responsory: |-
      [rubric](Stance)[/rubric]
      Pourquoi garder toute la nuit
      vos lampes allumées ?
      Pourquoi donner à votre vie
      le sens d’une attente infinie ?
      Quelle espérance vous tient éveillées,
      vierges sages,
      et quelle promesse de joie ?

      Vers la ténèbre lumineuse vos regards sont levés,
      et Dieu qui vous attend comblera seul votre quête.

      Pour une perle sans prix, vous avez tout quitté,
      les mains ouvertes et libres en offrande.

      À votre humble fierté, l’Église, joyeuse,
      reconnaît son visage, sa grâce de fiancée.

      À travers l’amour qui brûle en vous,
      servantes du Seigneur,
      le cœur de Dieu nous presse de l’aimer sans partage.
  patristicReading:
  - title: TRAITÉ DE SAINT CYPRIEN, DE CARTHAGE
    subtitle: « Fiancés à un époux unique », le Christ
    content: |-
      Maintenant, c’est aux vierges que je m’adresse. Plus leur dignité est élevée, plus nous devons en prendre soin. Elles sont la fleur de cette plantation qu’est l’Église, la gloire et la beauté de la grâce donnée par l’Esprit, notre joie vivante, un chef-d’œuvre intact et incorruptible de réussite et de dignité, une image de Dieu reflétant la sainteté du Seigneur, elles sont la partie la plus illustre du troupeau du Christ. L’Église trouve en elles sa joie et c’est en elles que s’épanouit sa glorieuse fécondité maternelle. Aussi, plus le nombre des vierges augmente, plus la joie de la mère s’accroît. C’est à elles que je parle, c’est elles que j’exhorte en vertu de mon affection plus que de mon autorité. Conscient d’être le dernier et le plus petit, je ne prétends pas censurer le désordre, mais par sollicitude vous inciter à la plus grande prudence pour échapper aux assauts du démon.
      Ce n’est pas là une prudence inutile, une crainte sans fondement : elle montre le chemin du salut, elle aide à garder les préceptes de vie donnés par le Seigneur. Elle permet à celles qui se sont consacrées au Christ et qui renoncent aux désirs de la chair pour se vouer à Dieu corps et âme, d’accomplir parfaitement leur œuvre, destinée à une grande récompense. Elles ne doivent plus chercher à se parer pour plaire, sinon à leur Seigneur, dont elles attendent le salaire de leur virginité.
      Gardez votre état de virginité, gardez-vous telles que vous devez être. Une grande récompense vous attend, la précieuse couronne de la vertu qui est le don parfait de la chasteté. ~ Ce que nous serons un jour, vous avez déjà commencé à l’être. Dès ici-bas, vous possédez la gloire de la résurrection, vous traversez ce monde sans que la contagion du monde vous atteigne : en persévérant dans la chasteté et la virginité, vous égalez les anges de Dieu. Mais, pour que cette virginité demeure intacte et solide, il faut qu’elle persévère sur le chemin où elle est courageusement entrée ; il faut donc qu’elle ne recherche pas la beauté des bijoux et des vêtements, mais celle de la vie.
      Écoutez la voix de l’Apôtre, que le Seingeur appelait son %instrument de choix% et qu’il a envoyé pour faire connaître des commandements célestes. %Le premier homme%, dit-il, %était pétri de terre ; le deuxième homme vient du ciel. Puisque le premier était pétri de terre, comme lui les hommes appartiennent à la terre. Puisque le deuxième appartient au ciel, comme lui les hommes appartiennent au ciel. De même que nous portons l’image de celui qui est pétri de terre, de même portons l’image de celui qui vient du ciel%. Telle est l’image que porte la virginité, que porte l’intégrité, la sainteté, la vérité.
    responsory: |-
      R/ Ma part, le roc de mpon cœur,
      c’est Dieu pour toujours.

      Laissez l’amour poursuivre en vous son œuvre
      jusqu’au jour de Jésus Christ.

      Ouvrez les yeux à la lumière de l’amour,
      vous serez purs et sans reproche
      au jour de Jésus Christ.
  - title: ACTES DU II^ème CONCILE DU VATICAN
    subtitle: La rénovation de la vie religieuse
    content: |-
      Dès les origines de l’Église, il y eut des hommes et des femmes qui voulurent, par la pratique des conseils évangéliques, suivre le Christ avec une plus grande liberté et l’imiter plus exactement et qui, chacun à sa manière, menèrent une vie consacrée à Dieu. Beaucoup parmi eux, sous l’impulsion de l’Esprit Saint, vécurent dans la solitude, ou bien donèrent des familles religieuses que l’Église accueillit volontiers et approuva de son autorité. À partir de là se multiplia providentiellement une admirable variété de sociétés religieuses. Elles ont beaucoup contribué non seulement à ce que l’Église soit %bien armée pour toute bonne action% et prêtre pour que %les tâches du ministère soient accomplis et que se construise le corps du Christ%, mais encore à ce que l’Église se montre embellie des dons variés de ses enfants, %comme une fiancée parée pour son époux% et fasse connaître %les multiples aspects de la Sagesse de Dieu%.
      Dans une telle variété de dons, tous ceux que Dieu appelle à la pratique des conseils évangéliques, et qui en font fidèlement profession, se consacrent au Seigneur de façon spéciale, en suivant le Christ chaste et pauvre, qui, par son obéissance %jusqu’à la mort de la croix%, a racheté les hommes et les a sanctifiés. Poussés par cet amour que l’Esprit Saint répand dans leurs cœurs, ils vivent toujours davantage pour le Christ et %pour son corps qui est l’Église%. Plus ils s’unissent avec ferveur au Christ par cette donation d’eux-mêmes qui embrasse toute leur existence, plus la vie de l’Église est abondante et plus son apostolat devient vigoureux et fécond. ~
      Les membres de tout institut religieux se rappelleront avant tout que, par la profession des conseils évangéliques, ils ont répondu à une vocation divine. Ainsi, non seulement %morts au péché%, mais encore ayant renoncé au monde, ils ne doivent plus vivre que pour Dieu seul. En effet, ils ont consacré toute leur vie à son service. Ceci constitue une consécration particulière qui s’enracine intimement dans la consécration baptismale et l’exprime avec la plus grande plénitude. ~
      Ceux qui professent les conseils évangéliques doivent rechercher et aimer Dieu avant tout, lui %qui nous a aimes le premier% ; ils doivent, en toutes circonstances, s’appliquer à développer leur %vie cachée en Dieu avec le Christ%, car c’est à partir d’elle que découle et que s’impose l’amour du prochain pour le salut du monde et la construction de l’Église. C’est encore dans cette charité que la pratique des conseils évangéliques trouve son inspiration et son orientation. ~ La chasteté à cause du %Royaume des cieux% dont les religieux font profession, doit être regardée comme un grand don de la grâce. En effet, elle libère singulièrement le cœur de l’homme, pour qu’il brûle d’amour envers Dieu et envers tous les hommes. C’est pourquoi elle est un signe particulier des biens célestes, ainsi qu’un moyen très efficace pour les religieux de se dévouer allègrement au service divin et aux activités de l’apostolat. ~ C’est ainsi qu’ils évoquent aux yeux de tous les chrétiens cette admirable union fondée par Dieu et qui doit se manifester clairement dans le siècle futur, union par laquelle l’Église reconnaît le Christ pour son unique époux.
    responsory: |-
      R/ Voix de mon Bien-aimé qui frappe à la porte :
      « Ouvre-moi ! »

      Si quelqu’un entend ma voix,
      ensemble, nous prendrons notre repas,
      moi près de lui, lui près de moi.

      Si quelqu’un garde ma parole,
      mon Père l’aimera,
      et nous viendrons à lui.

morning:
  hymn:
  - vous-qui-passiez-jadis
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - Librement, je t’ai donné ma foi, ô Jésus Christ, mon âme a soif de toi et mon cœur te désire.
  - psalm: OT_41
    antiphon:
    - |-
      Vierges du Seigneur, bénissez-le : le Dieu qui vous donna de vous offrir à lui, couronne en vous ses dons.
  - psalm: PSALM_149
    antiphon:
    - Pour avoir triomphé de la chair et du sang, elle exultera dans la gloire de Dieu.
  reading:
    biblicalReference: Ct 8,7
    content: Les torrents ne peuvent éteindre l’amour, les fleuves ne l’emporteront pas. Si quelqu’un offrait toutes les richesses de sa maison pour acheter l’amour, tout ce qu’il obtiendrait, c’est un profond mépris.
  responsory: |-
    R/ Si quelqu’un garde ma Parole,
    * mon Père l’aimera.
    V/ Nous viendrons demeurer en lui. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common:
    - La vierge sage est allée vers le Christ, resplendissante parmi ses compagnes.
  intercession:
    content: |-
      R/ Jésus, gloire des vierges, écoute-nous.
      
      Ô Christ, toi que les saintes vierges ont aimé d’un unique amour,
      – fais que rien ne nous sépare de toi.

      Tu as couronné Reine des vierges, Marie, ta mère,
      – par son intercession, purifie nos cœurs.

      À la prière des saintes femmes qui t’ont suivi de tout leur cœur,
      – accorde-nous de marcher le cœur libre à travers ce monde qui passe.

      Toi, l’Époux que les vierges sages ont su attendre,
      – donne-nous un cœur vigilant, prompt à te reconnaître.

      Par l’intercession de sainte N,
      – fais-nous brûler d’amour en ta présence.

middleOfDay:
  tierce:
    antiphon: Rester proche de Dieu fait tout mon bonheur.
    reading:
      biblicalReference: Sg 8, 21a
      content: Je savais que je n’obtiendrais pas la Sagesse autrement que par un don de Dieu – et reconnaître de qui dépens un bienfait, c’était encore une preuve de discernement.
    responsory: |-
      V/ Tenez dans vos mains votre lampe allumée.
      l’Époux vous introduira dans la salle des noces.
  sexte:
    antiphon: Que ta promesse me soutienne et je vivrai ; ne déçois pas mon attente.
    reading:
      biblicalReference: 1 Co 7, 25-26
      content: Au sujet du célibat, je n’ai pas reçu d’ordre spécial du Seigneur, mais je donne mon avis, moi qui suis devenu digne de confiance grâce au pardon du Seigneur. Je pense que le célibat est une chose bonne, étant donné les événements redoutables qui nous attendent ; oui, c’est une chose bonne de vivre ainsi.
    responsory: |-
      V/ J’ai rencontré celui que j’aime,
      je l’ai saisi, je ne le lâcherai pas.
  none:
    antiphon: |-
      Heureux les cœurs purs que Dieu s’est choisis : ils resplendiront de sa lumière.
    reading:
      biblicalReference: Ap 19, 6b-7
      content: Le Seigneur notre Dieu a pris possession de sa royauté, lui le Tout-Puissant. Soyons dans la joie, exultons, rendons-lui gloire, car voici les noces de l’Agneau. Son épouse a revêtu ses parures.
    responsory: |-
      V/ Voici l’Époux ! Sortez à sa rencontre !
      Veillez donc, car vous ne savez ni le jour, ni l’heure.

vespers:
  hymn:
  - dieu-ma-joie
  psalmody:
  - psalm: PSALM_121
    antiphon:
    - Je me garde pure pour toi, ô Jésus, et la lampe à la main, j’accours vers toi.
  - psalm: PSALM_126
    antiphon:
    - |-
      Heureux les cœurs purs : ils verront Dieu.
  - psalm: NT_4
    antiphon:
    - Mon cœur est ferme, ô Dieu, il est fondé sur le Christ.
  reading:
    biblicalReference: 1Co 7, 32b-34a
    content: Celui qui n’est pas marié a le souci des affaires du Seigneur, il cherche comment plaire au Seigneur. La femme sans mari, ou celle qui reste vierge, a le souci des affaires du Seigneur ; elle veut lui consacrer son corps et son esprit.
  responsory: |-
    R/ Heureux les invités
    au festin de noces de l’Agneau !
    V/ Je te fiancerai à moi pour toujours
    dans l’amour et la fidélité. R/
    V/ Tu sauras que je suis le Seigneur :
    ouvre ton cœur à l’allégresse. R/
  evangelicAntiphon:
    common:
    - Viens, épouse du Chrsit, reçois la couronne que Dieu t’a préparée.
  intercession:
    content: |-
      Le Christ a loué ceux qui se consacraient de corps et d’âme au royaume des cieux ;
      bénissons-le de tout notre cœur :

      R/ Ô Christ, notre salut, Jésus, notre lumière !

      Tu as voulu pour épouse une Église vierge et pure,
      – rends-la irréprochable et sainte.

      Les vierges sages ont couru au-devant de toi avec leurs lampes,
      – donne aux femmes qui te sont consacrées de te rester fidèles.

      Tu donnes à ton Église de garder sa foi intègre et pure,
      – accorde cette même grâce à tous les chrétiens.

      Nous célébrons aujourd’hui la fête de sainte N,
      – que son intercession soit notre joie.

      Tu accueilles les vierges sages au festin des noces,
      – reçois avec bonté ceux que tu as appelés dans ta demeure du ciel.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici la vierge sage,
      >elle est au nombre des jeunes filles prévoyantes ;
      sa lampe allumée,
      >elle est sortie à la rencontre du Christ.
  - biblicalReference: null
    content: |-
      Que tu es belle, vierge du Christ !
      Tu as mérité de recevoir la couronne du Seigneur,
        la couronne de la virginité à jamais.
  collect:
  - |-
    Exauce nos prières, Dieu notre Sauveur, *
    afin qu’en célébrant dans la joie
    >la mémoire de la vierge sainte N., /
    nous apprenions à te servir
    >avec un amour sincère.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ct 8, 6-7
      headline: |-
        « L’amour est fort comme la Mort »
      content: |-
        Pose-moi comme un sceau sur ton cœur,
        >comme un sceau sur ton bras.
        Car l’amour est fort comme la Mort,
        >la passion, implacable comme l’Abîme :
        ses flammes sont des flammes de feu,
        >fournaise divine.
        Les grandes eaux ne pourront éteindre l’amour,
        >ni les fleuves l’emporter.
    - biblicalRef: Os 2, 16b.17b.21-22
      headline: |-
        « Je ferai de toi mon épouse pour toujours »
      content: |-
        Ainsi parle le Seigneur :
        Mon épouse infidèle,
        je vais l’entraîner jusqu’au désert,
        >et je lui parlerai cœur à cœur.
        Là, elle me répondra
        >comme au temps de sa jeunesse,
        >au jour où elle est sortie du pays d’Égypte.
        Je ferai de toi mon épouse pour toujours,
        >je ferai de toi mon épouse
        dans la justice et le droit,
        >dans la fidélité et la tendresse ;
        je ferai de toi mon épouse dans la loyauté,
        >et tu connaîtras le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 44 (45), 11-12, 14-15, 16-17
      label: null
      refAbbr: 44, 11a
      chorus:
      - chorusRef: 44, 11a
        chorus: |-
          Écoute, ma fille, regarde et tends l’oreille.
      - chorusRef: cf. Mt 25, 6
        chorus: |-
          ou : Voici l’Époux qui vient,
          allez à la rencontre du Christ, le Seigneur !
      content: |-
        Écoute, ma fille, regarde et tends l’oreille ;
        oublie ton peuple et la maison de ton père :
        le roi sera séduit par ta beauté.
        Il est ton Seigneur : prosterne-toi devant lui.

        Fille de roi, elle est là, dans sa gloire,
        vêtue d’étoffes d’or ;
        on la conduit, toute parée, vers le roi.
        Des jeunes filles, ses compagnes, lui font cortège.

        On les conduit parmi les chants de fête :
        elles entrent au palais du roi.
        À la place de tes pères se lèveront tes fils ;
        sur toute la terre tu feras d’eux des princes.
    - biblicalRef: Ps 148, 1-2, 7a.11a.12, 13-14a
      label: null
      refAbbr: null
      chorus:
      - chorusRef: null
        chorus: |-
          Alléluia !
      - chorusRef: cf. 148, 12a.13a
        chorus: |-
          ou : Jeunes gens et jeunes filles,
          louez le nom du Seigneur.
      content: |-
        Louez le Seigneur du haut des cieux,
        louez-le dans les hauteurs.
        Vous, tous ses anges, louez-le,
        louez-le, tous ses univers.

        Louez le Seigneur depuis la terre,
        les rois de la terre et tous les peuples,
        tous les jeunes gens et jeunes filles,
        les vieillards comme les enfants.

        Qu’ils louent le nom du Seigneur,
        le seul au-dessus de tout nom ;
        sur le ciel et sur la terre, sa splendeur :
        il accroît la vigueur de son peuple.
  - partType: READING_2
    partContents:
    - biblicalRef: 1Co 7, 25-35
      headline: |-
        « La femme qui reste vierge a le souci des affaires du Seigneur »
      content: |-
        Frères,
        au sujet du célibat, je n’ai pas un ordre du Seigneur,
        mais je donne mon avis,
        >moi qui suis devenu digne de confiance
        >grâce à la miséricorde du Seigneur.
        Je pense que le célibat est une chose bonne,
        >étant donné les nécessités présentes ;
        oui, c’est une chose bonne de vivre ainsi.
        Tu es marié ?
        ne cherche pas à te séparer de ta femme.
        Tu n’as pas de femme ?
        ne cherche pas à te marier.
        Si cependant tu te maries, ce n’est pas un péché ;
        >et si une jeune fille se marie, ce n’est pas un péché.
        Mais ceux qui font ce choix y trouveront les épreuves correspondantes,
        >et c’est cela que moi, je voudrais vous éviter.
        Frères,
        je dois vous le dire : le temps est limité.
        Dès lors,
        que ceux qui ont une femme
        >soient comme s’ils n’avaient pas de femme,
        ceux qui pleurent,
        >comme s’ils ne pleuraient pas,
        ceux qui ont de la joie,
        >comme s’ils n’en avaient pas,
        ceux qui font des achats,
        >comme s’ils ne possédaient rien,
        ceux qui profitent de ce monde,
        >comme s’ils n’en profitaient pas vraiment.
        Car il passe,
        >ce monde tel que nous le voyons.
        J’aimerais vous voir libres de tout souci.
        Celui qui n’est pas marié a le souci des affaires du Seigneur,
        >il cherche comment plaire au Seigneur.
        Celui qui est marié a le souci des affaires de ce monde,
        >il cherche comment plaire à sa femme,
        >et il se trouve divisé.
        La femme sans mari,
        >ou celle qui reste vierge,
        a le souci des affaires du Seigneur,
        >afin d’être sanctifiée dans son corps et son esprit.
        Celle qui est mariée a le souci des affaires de ce monde,
        >elle cherche comment plaire à son mari.
        C’est dans votre intérêt que je dis cela ;
        ce n’est pas pour vous tendre un piège,
        >mais pour vous proposer ce qui est bien,
        afin que vous soyez attachés au Seigneur sans partage.
    - biblicalRef: 2 Co 10, 17 - 11, 2
      headline: |-
        « Vous êtes l’épouse vierge et pure que j’ai présentée au Christ »
      content: |-
        Frères,
        >celui qui veut être fier,
        >qu’il mette sa fierté dans le Seigneur.
        Celui dont on reconnaît la valeur
        n’est pas celui qui se recommande lui-même,
        >c’est celui que le Seigneur recommande.
        Pourriez-vous supporter de ma part un peu de folie ?
        Oui, de ma part, vous allez le supporter,
        >à cause de mon amour jaloux
        >qui est l’amour même de Dieu pour vous.
        Car je vous ai unis au seul Époux :
        vous êtes la vierge pure que j’ai présentée au Christ.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 3-12
      headline: |-
        « À cause du royaume des Cieux »
      acclamationAntiphon: |-
        Soyez dans la joie pour l’Alliance nouvelle :
        heureux les invités aux noces de l’Agneau !
      content: |-
        En ce temps-là,
        des pharisiens s’approchèrent de Jésus pour le mettre à l’épreuve ;
        ils lui demandèrent :
        >« Est-il permis à un homme de renvoyer sa femme
        >pour n’importe quel motif ? »
        Il répondit :
        >« N’avez-vous pas lu ceci ?
        Dès le commencement, le Créateur les fit homme et femme,
        >et dit :
        >« À cause de cela, l’homme quittera son père et sa mère,
        >il s’attachera à sa femme,
        >et tous deux deviendront une seule chair. "
        >Ainsi, ils ne sont plus deux, mais une seule chair.
        Donc, ce que Dieu a uni,
        >que l’homme ne le sépare pas ! »
        Les pharisiens lui répliquent :
        >« Pourquoi donc Moïse a-t-il prescrit
        >la remise d’un acte de divorce avant la répudiation ? »
        Jésus leur répond :
        >« C’est en raison de la dureté de votre cœur
        >que Moïse vous a permis de renvoyer vos femmes.
        Mais au commencement, il n’en était pas ainsi.
        Or je vous le dis :
        >si quelqu’un renvoie sa femme
        >- sauf en cas d’union illégitime -
        >et qu’il en épouse une autre,
        >il est adultère. »
        Ses disciples lui disent :
        >« Si telle est la situation de l’homme
        >par rapport à sa femme,
        >mieux vaut ne pas se marier. »
        Il leur répondit :
        >« Tous ne comprennent pas cette parole,
        >mais seulement ceux à qui cela est donné.
        Il y a des gens qui ne se marient pas
        >car, de naissance, ils en sont incapables ;
        >il y en a qui ne peuvent pas se marier
        >car ils ont été mutilés par les hommes ;
        >il y en a qui ont choisi de ne pas se marier
        >à cause du royaume des Cieux.
        Celui qui peut comprendre, qu’il comprenne ! »
    - biblicalRef: Mt 25, 1-13
      headline: |-
        « Voici l’époux ! Sortez à sa rencontre »
      acclamationAntiphon: |-
        Voici la jeune fille prévoyante,
        que le Seigneur a trouvée en train de veiller.
        Quand le Seigneur arriva, elle entra avec lui pour les noces.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples cette parabole :
        >« Le royaume des Cieux sera comparable
        >à dix jeunes filles invitées à des noces,
        >qui prirent leur lampe
        >pour sortir à la rencontre de l’époux.
        Cinq d’entre elles étaient insouciantes,
        >et cinq étaient prévoyantes :
        >les insouciantes avaient pris leur lampe sans emporter d’huile,
        >tandis que les prévoyantes avaient pris, avec leurs lampes,
        >des flacons d’huile.
        Comme l’époux tardait,
        >elles s’assoupirent toutes et s’endormirent.
        Au milieu de la nuit, il y eut un cri :
        >"Voici l’époux ! Sortez à sa rencontre."
        >Alors toutes ces jeunes filles se réveillèrent
        >et se mirent à préparer leur lampe.
        Les insouciantes demandèrent aux prévoyantes :
        >"Donnez-nous de votre huile,
        >car nos lampes s’éteignent."
        >Les prévoyantes leur répondirent :
        >"Jamais cela ne suffira pour nous et pour vous,
        >allez plutôt chez les marchands vous en acheter."
        >Pendant qu’elles allaient en acheter,
        >l’époux arriva.
        Celles qui étaient prêtes entrèrent avec lui dans la salle des noces,
        >et la porte fut fermée.
        Plus tard, les autres jeunes filles arrivèrent à leur tour et dirent :
        >"Seigneur, Seigneur, ouvre-nous !"
        >Il leur répondit :
        >"Amen, je vous le dis :
        >Je ne vous connais pas.
        Veillez donc,
        >car vous ne savez ni le jour ni l’heure. »
    - biblicalRef: Lc 10, 38-42
      headline: |-
        « Marthe reçut Jésus. Marie a choisi la meilleure part »
      acclamationAntiphon: |-
        Si quelqu’un m’aime, il gardera ma parole,
        dit le Seigneur ;
        mon Père l’aimera, et nous viendrons vers lui.
      content: |-
        En ce temps-là,
        Jésus entra dans un village.
        Une femme nommée Marthe le reçut.
        Elle avait une sœur appelée Marie
        >qui, s’étant assise aux pieds du Seigneur,
        >écoutait sa parole.
        Quant à Marthe, elle était accaparée
        >par les multiples occupations du service.
        Elle intervint et dit :
        >« Seigneur, cela ne te fait rien
        >que ma sœur m’ait laissé faire seule le service ?
        Dis-lui donc de m’aider. »
        Le Seigneur lui répondit :
        >« Marthe, Marthe, tu te donnes du souci
        >et tu t’agites pour bien des choses.
        Une seule est nécessaire.
        Marie a choisi la meilleure part,
        >elle ne lui sera pas enlevée. »
  offeringPrayer:
  - |-
    Nous proclamons tes merveilles,
    >accomplies en la bienheureuse vierge, sainte N.,
    >Seigneur, Dieu de majesté, +
    et nous te supplions humblement :
    toi qui appréciais les mérites de sa vie, /
    >accepte l’hommage de notre service.
    Par le Christ, notre Seigneur.
  prefaceList:
  - saints_1
  - saints_2
  communionAntiphon:
  - biblicalReference: cf. Mt 25, 6
    content: |-
      Voici l’Époux qui vient !
      Sortez à la rencontre du Christ, le Seigneur.
  - biblicalReference: cf. Ps 26, 4
    content: |-
      J’ai demandé une chose au Seigneur,
      >la seule que je cherche :
      habiter la maison du Seigneur
      >tous les jours de ma vie.
  prayerAfterCommunion:
  - |-
    En participant au don que tu nous as fait,
    >Seigneur notre Dieu,
    nous avons renouvelé nos forces,
    >et nous te supplions encore : *
    qu’à l’exemple de sainte N.,
    >portant dans notre corps la mort de Jésus, /
    >nous cherchions à nous attacher à toi seul.
    Par le Christ, notre Seigneur.