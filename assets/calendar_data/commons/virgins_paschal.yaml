commonTitle: Commun des Vierges au Temps Paschal

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici la vierge sage,
      >elle est au nombre des jeunes filles prévoyantes;
      sa lampe allumée,
      >elle est sortie à la rencontre du Christ, alléluia
  - biblicalReference: null
    content: |-
      Que tu es belle, vierge du Christ!
      Tu as mérité de recevoir la couronne du Seigneur,
        la couronne de la virginité à jamais, alléluia.
  
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ap 19, 1.5-9a
      headline: |-
        « Heureux les invités au repas des noces de l’Agneau »
      content: |-
        Moi, Jean,
        j’ai entendu comme la voix forte
        d’une foule immense dans le ciel,
        qui proclamait :
        >« Alléluia !
        Le salut, la gloire,
        >la puissance à notre Dieu. »
        Et du Trône sortit une voix qui disait :
        >« Louez notre Dieu,
        >vous tous qui le servez,
        >vous tous qui le craignez,
        >les petits et les grands. »
        Alors j’entendis comme la voix d’une foule immense,
        >comme la voix des grandes eaux,
        >ou celle de violents coups de tonnerre.
        Elle proclamait :
        >« Alléluia !
        Il règne, le Seigneur notre Dieu,
        >le Souverain de l’univers.
        Soyons dans la joie, exultons,
        >et rendons gloire à Dieu !
        Car elles sont venues,
        >les Noces de l’Agneau,
        >et pour lui son épouse
        >a revêtu sa parure.
        Un vêtement de lin fin lui a été donné,
        >splendide et pur. »
        Car le lin, ce sont les actions justes des saints.
        Puis l’ange me dit :
        >« Écris :
        >Heureux les invités
        >au repas des noces de l’Agneau ! »
    - biblicalRef: Ap 21, 1-5a
      headline: |-
        « J’ai vu la Jérusalem nouvelle, prête pour les noces, comme une épouse parée pour son époux »
      content: |-
        Moi, Jean,
        j’ai vu un ciel nouveau et une terre nouvelle,
        >car le premier ciel et la première terre s’en étaient allés
        >et, de mer, il n’y en a plus.
        Et la Ville sainte, la Jérusalem nouvelle,
        je l’ai vue qui descendait du ciel, d’auprès de Dieu,
        >prête pour les noces, comme une épouse parée pour son mari.
        Et j’entendis une voix forte qui venait du Trône.
        Elle disait :
        >« Voici la demeure de Dieu avec les hommes ;
        >il demeurera avec eux,
        >et ils seront ses peuples,
        >et lui-même, Dieu avec eux, sera leur Dieu.
        Il essuiera toute larme de leurs yeux,
        >et la mort ne sera plus,
        >et il n’y aura plus ni deuil, ni cri, ni douleur :
        >ce qui était en premier s’en est allé. »
        Alors celui qui siégeait sur le Trône déclara :
        >« Voici que je fais toutes choses nouvelles. »

  communionAntiphon:
  - biblicalReference: cf. Mt 25, 6
    content: |-
      Voici l’Époux qui vient!
      Sortez à la rencontre du Christ, le Seigneur, alléluia.
  - biblicalReference: cf. Ps 26, 4
    content: |-
      J’ai demandé une chose au Seigneur,
      >la seule que je cherche:
      habiter la maison du Seigneur
      >tous les jours de ma vie, alléluia.