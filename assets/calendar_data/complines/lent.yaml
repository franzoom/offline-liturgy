marialHymns:
- sub-tuum-praesidium
- sous-l-abri-de-ta-misericorde
- salut-reine-des-cieux
- ave-regina-caelorum

saturday:
  psalmody:
  - psalm: PSALM_4
    antiphon:
    - Pitié pour moi, Seigneur, écoute ma prière.
  - psalm: PSALM_133
    antiphon:
    - La nuit est avancée, le jour est proche.
  evangelicAntiphon:
    common:
    - Dieu saint, Dieu fort, Dieu immortel, ta pitié soit sur nous.

sunday:
  psalmody:
  - psalm: PSALM_90
    antiphon:
    - À l’ombre de ses ailes, n’aie plus peur de la nuit.
  evangelicAntiphon:
    common:
    - Dieu saint, Dieu fort, Dieu immortel, ta pitié soit sur nous.

monday:
  psalmody:
  - psalm: PSALM_85
    antiphon:
    - Rassemble mon cœur pour qu’il te craigne.

tuesday:
  hymns:
  - vienne-la-nuit-de-dieu-lent
  - te-lucis-ante-terminum
  psalmody:
  - psalm: PSALM_142
    antiphon:
    - Ne me cache pas ton visage, car je compte sur toi.

wednesday:
  psalmody:
  - psalm: PSALM_30_1
    antiphon:
    - Auprès du Seigneur est la grâce, la pleine délivrance.
  - psalm: PSALM_129
    antiphon:
    - Près de toi se trouve le pardon.
    - J’espère le Seigneur de tout mon âme.

thursday:
  psalmody:
  - psalm: PSALM_15
    antiphon:
    - Mon Dieu, tu ne peux m’abandonner à la mort.

friday:
  psalmody:
  - psalm: PSALM_87
    antiphon:
    - Pourquoi me rejeter, Seigneur ? Pourquoi cacher ta face ?

holy_thursday:
  hymns:
  - avant-la-fin-de-la-lumiere
  psalmody:
  - psalm: PSALM_90
    antiphon:
    - À l’ombre de ses ailes, n’aie plus peur de la nuit.
  reading:
    biblicalReference: Ap 22, 4-5
    content: |-
      Les serviteurs de Dieu verront son visage, et son nom sera écrit sur leur front. La nuit n’existera plus, ils n’auront plus besoin de la lumière d’une lampe ni de la lumière du soleil, parce que le Seigneur Dieu les illuminera, et ils régneront pour les siècles des siècles.
  responsory: |-
    R/ Le Christ s’est fait pour nous obéissant
    >jusqu’à la mort.
    V/ Voici l’heure où le Fils de l’homme a été livré,
    voici le pouvoir des ténèbres. R/
  evangelicAntiphon:
    common:
    - Dieu saint, Dieu fort, Dieu immortel, ta pitié soit sur nous.
  oration:
  - |-
    Notre Seigneur et notre Dieu, tu nous as fait entendre ton amour au matin de la Résurrection ; quand viendra pour nous le moment de mourir, que ton souffle de vie nous conduise en ta présence. Par Jésus, le Christ, notre Seigneur. Amen.
  - |-
    Seigneur Dieu, notre maître souverain, tu as illuminé nos yeux par la lumière de ton Verbe éternel ; alors qu’il fait nuit maintenant, garde nos âmes dans ta paix, et quand notre vie s’éteindra, laisse-nous aller dans ton paradis avec ton Fils, Jésus-Christ notre Seigneur. Amen.

