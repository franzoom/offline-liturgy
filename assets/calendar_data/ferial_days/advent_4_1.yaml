celebration:
  title: Lundi de la quatrième semaine de l’Avent
invitatory:
  antiphon:
    - Le Roi qui va venir, venez, adorons-le.
    - Allons au-devant de celui qui vient.
    - Réjouissez-vous dans le Seigneur, réjouissez-vous, car il est proche.

readings:
  psalmody:
    - psalm: PSALM_72_1
      antiphon:
        - Où est ton trésor, là aussi sera ton cœur.
    - psalm: PSALM_72_2
      antiphon:
        - Où est ton trésor, là aussi sera ton cœur.
    - psalm: PSALM_72_3
      antiphon:
        - Où est ton trésor, là aussi sera ton cœur.
  verse: |-
    V/ Montre-nous, Seigneur, ta bonté,
    donne-nous enfin le Sauveur.

morning:
  psalmody:
    - psalm: PSALM_89
    - psalm: OT_26
    - psalm: PSALM_134_1

middleOfDay:
  psalmody:
    - psalm: PSALM_118_17
      antiphon:
        - |-
          Les prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.
    - psalm: PSALM_81
      antiphon:
        - |-
          Les prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.
    - psalm: PSALM_119
      antiphon:
        - |-
          Les prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.

vespers:
  psalmody:
    - psalm: PSALM_135_1B
    - psalm: PSALM_135_2B
    - psalm: NT_4
