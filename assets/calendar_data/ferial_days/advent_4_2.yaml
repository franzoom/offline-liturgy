celebration:
  title: Mardi de la quatrième semaine de l’Avent
invitatory:
  antiphon:
    - Le Roi qui va venir, venez, adorons-le.
    - Allons au-devant de celui qui vient.
    - Réjouissez-vous dans le Seigneur, réjouissez-vous, car il est proche.

readings:
  psalmody:
    - psalm: PSALM_101_1
      antiphon:
        - |-
          Tu te lèveras, attendri, pour Sion : il est temps de la prendre en pitié.
    - psalm: PSALM_101_2
      antiphon:
        - |-
          Tu te lèveras, attendri, pour Sion : il est temps de la prendre en pitié.
    - psalm: PSALM_101_3
      antiphon:
        - |-
          Tu te lèveras, attendri, pour Sion : il est temps de la prendre en pitié.
  verse: |-
    V/ Préparez les chemins du Seigneur,
    aplanissez la route.

morning:
  psalmody:
    - psalm: PSALM_100
    - psalm: OT_39
    - psalm: PSALM_143a

middleOfDay:
  psalmody:
    - psalm: PSALM_118_18
      antiphon:
        - |-
          L’Ange dit à Marie : je te salue, comblée de grâce ! Le Seigneur est avec toi !
    - psalm: PSALM_87_1
      antiphon:
        - |-
          L’Ange dit à Marie : je te salue, comblée de grâce ! Le Seigneur est avec toi !
    - psalm: PSALM_87_2
      antiphon:
        - |-
          L’Ange dit à Marie : je te salue, comblée de grâce ! Le Seigneur est avec toi !

vespers:
