celebration:
  title: Mercredi de la quatrième semaine de l’Avent
invitatory:
  antiphon:
    - Le Roi qui va venir, venez, adorons-le.
    - Allons au-devant de celui qui vient.
    - Réjouissez-vous dans le Seigneur, réjouissez-vous, car il est proche.

readings:
  psalmody:
    - psalm: PSALM_102_1
      antiphon:
        - Le Fils de l’homme a pouvoir sur la terre de remettre les péchés.
    - psalm: PSALM_102_2
      antiphon:
        - Le Fils de l’homme a pouvoir sur la terre de remettre les péchés.
    - psalm: PSALM_102_3
      antiphon:
        - Le Fils de l’homme a pouvoir sur la terre de remettre les péchés.
  verse: |-
    V/ Viens, Seigneur, montre-nous ton visage,
    et nous serons sauvés.

morning:
  psalmody:
    - psalm: PSALM_107
    - psalm: OT_30
    - psalm: PSALM_145

middleOfDay:
  psalmody:
    - psalm: PSALM_118_19
      antiphon:
        - Vierge bénie entre toutes les femmes, Jésus, ton Enfant, est béni !
    - psalm: PSALM_93_1
      antiphon:
        - Vierge bénie entre toutes les femmes, Jésus, ton Enfant, est béni !
    - psalm: PSALM_93_2
      antiphon:
        - Vierge bénie entre toutes les femmes, Jésus, ton Enfant, est béni !

vespers:
  psalmody:
    - psalm: PSALM_138_1
    - psalm: PSALM_138_2
    - psalm: NT_6
