celebration:
  title: Jeudi de la quatrième semaine de l’Avent
invitatory:
  antiphon:
    - Le Roi qui va venir, venez, adorons-le.
    - Allons au-devant de celui qui vient.
    - Réjouissez-vous dans le Seigneur, réjouissez-vous, car il est proche.

readings:
  psalmody:
    - psalm: PSALM_43_1
      antiphon:
        - Debout ! Viens à notre aide, rachète-nous en raison de ton amour !
    - psalm: PSALM_43_2
      antiphon:
        - Debout ! Viens à notre aide, rachète-nous en raison de ton amour !
    - psalm: PSALM_43_3
      antiphon:
        - Debout ! Viens à notre aide, rachète-nous en raison de ton amour !
  verse: |-
    V/ Écoutez, tous les peuples, la parole du Seigneur,
    annoncez-la aux îles lointaines.

morning:
  psalmody:
    - psalm: PSALM_142
    - psalm: OT_32
    - psalm: PSALM_146

middleOfDay:
  psalmody:
    - psalm: PSALM_118_20
      antiphon:
        - |-
          Les Prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.
    - psalm: PSALM_127
      antiphon:
        - |-
          Les Prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.
    - psalm: PSALM_128
      antiphon:
        - |-
          Les Prophètes l’ont dit : le Sauveur naîtra de la Vierge Marie.

vespers:
  psalmody:
    - psalm: PSALM_143_1
    - psalm: PSALM_143_2
    - psalm: NT_10
