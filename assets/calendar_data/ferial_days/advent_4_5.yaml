celebration:
  title: Vendredi de la quatrième semaine de l’Avent
invitatory:
  antiphon:
    - Le Roi qui va venir, venez, adorons-le.
    - Allons au-devant de celui qui vient.
    - Réjouissez-vous dans le Seigneur, réjouissez-vous, car il est proche.

readings:
  psalmody:
    - psalm: PSALM_77_1
      antiphon:
        - Quand nous sommes infidèles, le Seigneur reste fidèle ; pourrait-il se renier lui-même ?
    - psalm: PSALM_77_2
      antiphon:
        - Quand nous sommes infidèles, le Seigneur reste fidèle ; pourrait-il se renier lui-même ?
    - psalm: PSALM_77_3
      antiphon:
        - Quand nous sommes infidèles, le Seigneur reste fidèle ; pourrait-il se renier lui-même ?
  verse: |-
    V/ Que vienne à moi, Seigneur, ton amour,
    et son salut, selon ta promesse.

morning:
  psalmody:
    - psalm: PSALM_50
    - psalm: OT_6
    - psalm: PSALM_147

middleOfDay:
  psalmody:
    - psalm: PSALM_118_21
      antiphon:
        - |-
          L’ange dit à Marie : Je te salue, comblée de grâce, le Seigneur est avec toi !
    - psalm: PSALM_132
      antiphon:
        - |-
          L’ange dit à Marie : Je te salue, comblée de grâce, le Seigneur est avec toi !
    - psalm: PSALM_139
      antiphon:
        - |-
          L’ange dit à Marie : Je te salue, comblée de grâce, le Seigneur est avec toi !

vespers:
  psalmody:
    - psalm: PSALM_144_1
    - psalm: PSALM_144_2
    - psalm: NT_11
