morning:
  psalmody:
    - antiphon:
        - Quand viendra le Fils de l’homme, trouvera-t-il la foi sur la terre ?
    - antiphon:
        - |-
          Ne craignez pas : vous verrez que le Seigneur est avec vous.
    - antiphon:
        - Ciel, répands ta rosée, nuée, fais pleuvoir le Juste ; terre, enfante un Sauveur !

vespers:
  psalmody:
    - antiphon:
        - Que vienne à moi, Seigneur, ton amour, et ton salut selon ta promesse.
    - antiphon:
        - |-
          Ne craignez pas : vous verrez que le Seigneur est avec vous.
    - antiphon:
        - Ton chemin sera connu sur la terre, ton salut parmi toutes les nations.
