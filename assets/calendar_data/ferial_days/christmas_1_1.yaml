celebration:
  title: Lundi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - Puisqu’en ce jour, Seigneur, les saints Innocents ont annoncé ta gloire, non point par la parole, mais par leur seule mort ; fais que notre vie tout entière témoigne de la foi que notre bouche proclame.

readings:
  psalmody:
    - psalm: PSALM_9A_1
      antiphon:
        - |-
          (à la fin du psaume seulement) Plus de peur, prenons courage : notre Dieu vient nous sauver.
    - psalm: PSALM_9A_2
      antiphon:
        - Les héritiers du Royaume à venir, ce sont les pauvres.
    - psalm: PSALM_6
      antiphon:
        - Les héritiers du Royaume à venir, ce sont les pauvres.

morning:
  psalmody:
    - psalm: PSALM_5
      antiphon:
        - Jésus est venu dans le monde pour être témoin de la vérité.
    - psalm: OT_4
      antiphon:
        - Nous acclamons, Seigneur, la splendeur de ta gloire éternelle.
        - Tout vient de toi, ô Seigneur, et nous t’offrons ce que nous donne ta main.
    - psalm: PSALM_28
      antiphon:
        - Dieu bénit son peuple et lui donne la paix.

middleOfDay:
  psalmody:
    - psalm: PSALM_18B
      antiphon:
        - |-
          Voici l’Enfant : Signe dressé pour les nations, justice de Dieu parmi les hommes.
    - psalm: PSALM_7_1
      antiphon:
        - |-
          Voici l’Enfant : Signe dressé pour les nations, justice de Dieu parmi les hommes.
    - psalm: PSALM_7_2
      antiphon:
        - |-
          Voici l’Enfant : Signe dressé pour les nations, justice de Dieu parmi les hommes.

vespers:
  psalmody:
    - psalm: PSALM_10
      antiphon:
        - Dieu nous destinait à devenir ses fils en Jésus, son Fils bien-aimé.
    - psalm: PSALM_14
      antiphon:
        - Celui qui fait la vérité vient à la lumière.
    - psalm: NT_4
      antiphon:
        - Béni sois-tu, notre Père, qui nous as bénis dans le Christ !
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Un jour très saint a brillé à nos yeux :
      nations, venez toutes adorer le Seigneur,
      >car une grande lumière est descendue sur la terre.
  collect:
  - |-
    Donne à ton peuple, Seigneur,
    >une foi inébranlable : *
    >nous confessons que ton Fils unique,
    éternel avec toi dans ta gloire,
    >est né de la Vierge Mère dans un véritable corps humain ; /
    délivre-nous des épreuves d’ici-bas,
    >introduis-nous dans les joies qui demeurent.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Accueille, Seigneur,
    >ce que nous présentons pour cette eucharistie
    >où s’accomplit un admirable échange : *
    en offrant ce que tu nous as donné, /
    >puissions-nous te recevoir toi-même.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: cf. Jn 1,14
    content: |-
      Nous avons vu la gloire du Verbe fait chair,
      >gloire qu’il tient de son Père comme Fils unique,
      >plein de grâce et de vérité.
  prayerAfterCommunion:
  - |-
    Dieu tout-puissant, nous t’en prions : *
    fais que la force de tes saints mystères /
    soutienne constamment notre vie.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
