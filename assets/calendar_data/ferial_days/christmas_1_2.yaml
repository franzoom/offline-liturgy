celebration:
  title: Mardi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - Dieu que nul œil ne peut voir, tu as dissipé les ténèbres du monde en lui envoyant ta lumière ; tourne vers nous ton visage de paix, et nos louanges proclameront l’incroyable largesse que tu nous fais dans la naissance de ton Fils unique. Lui qui règne.

readings:
  psalmody:
    - psalm: PSALM_9B_1
      antiphon:
        - Le mal et la souffrance, tu les prends dans ta main.
    - psalm: PSALM_9B_2
      antiphon:
        - Dresse-toi, Seigneur ! Dieu, étends la main.
    - psalm: PSALM_11
      antiphon:
        - Un Sauveur nous est né, Christ et Seigneur.

morning:
  psalmody:
    - psalm: PSALM_23
      antiphon:
        - |-
          Criez de joie pour le Seigneur : la terre est remplie de son amour.
    - psalm: OT_5
      antiphon:
        - |-
          Regardez ce que Dieu a fait pour vous : fêtez-le, rendez-lui grâce.
    - psalm: PSALM_32
      antiphon:
        - La joie de notre cœur vient de toi.

middleOfDay:
  psalmody:
    - psalm: PSALM_118_1
      antiphon:
        - |-
          Je prends appui sur ton amour : que mon cœur se réjouisse en ton salut.
    - psalm: PSALM_12
      antiphon:
        - |-
          Je prends appui sur ton amour : que mon cœur se réjouisse en ton salut.
    - psalm: PSALM_13
      antiphon:
        - |-
          Je prends appui sur ton amour : que mon cœur se réjouisse en ton salut.

vespers:
  psalmody:
    - psalm: PSALM_19
      antiphon:
        - Seigneur, donne au Roi la victoire.
    - psalm: PSALM_20
      antiphon:
        - Tu le revêts de splendeur et de gloire.
    - psalm: NT_9
      antiphon:
        - R/ Gloire à l’Agneau immolé !
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: Ps 117,26-27
    content: |-
      Béni soit celui qui vient au nom du Seigneur :
      >le Seigneur est Dieu, et il nous illumine.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as voulu que ton Fils,
    >par sa bienheureuse naissance de la Vierge sainte,
    >ne soit pas soumis dans sa chair
    >à la condamnation qui pesait sur le genre humain ; *
    accorde-nous d’échapper à la dégradation du péché, /
    >puisque nous avons part à la nouvelle création.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Reçois favorablement, Seigneur,
    >les dons présentés par ton peuple, *
    que tous obtiennent par tes sacrements /
    >ce qu’ils proclament dans la ferveur de la foi.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: Ep 2,4 ; Rm 8,3
    content: |-
      À cause du grand amour dont il nous a aimés,
      >Dieu a envoyé son propre Fils
      >dans une condition charnelle
      >semblable à celle des pécheurs.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >toi qui viens jusqu’à nous
    >quand nous participons à ce sacrement, *
    produis en nos cœurs les fruits de ce mystère,
    >pour que tes propres dons nous préparent
    >à recevoir ce que tu nous donnes.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
