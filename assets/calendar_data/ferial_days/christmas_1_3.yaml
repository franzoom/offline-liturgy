celebration:
  title: Mercredi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - Nous t’en prions, Dieu tout-puissant, alors que le péché nous retient encore sous sa loi, donne-nous la délivrance par la prodigieuse et nouvelle naissance en notre chair de ton Fils unique, Jésus Christ. Lui qui règne.

readings:
  psalmody:
    - psalm: PSALM_17_1
      antiphon:
        - Qui invoquera le nom de Jésus sera sauvé.
    - psalm: PSALM_17_2
      antiphon:
        - Qui invoquera le nom de Jésus sera sauvé.
    - psalm: PSALM_17_3
      antiphon:
        - Qui invoquera le nom de Jésus sera sauvé.

morning:
  psalmody:
    - psalm: PSALM_35
      antiphon:
        - Le Verbe était la vraie lumière qui éclaire tout homme.
    - psalm: OT_7
      antiphon:
        - Je chanterai pour mon Dieu un chant nouveau.
    - psalm: PSALM_46
      antiphon:
        - Acclamez Dieu par vos cris de joie.

middleOfDay:
  psalmody:
    - psalm: PSALM_118_2
      antiphon:
        - Nous avons vu la gloire de Dieu sur la face de son Christ.
    - psalm: PSALM_16_1
      antiphon:
        - Nous avons vu la gloire de Dieu sur la face de son Christ.
    - psalm: PSALM_16_2
      antiphon:
        - Nous avons vu la gloire de Dieu sur la face de son Christ.

vespers:
  psalmody:
    - psalm: PSALM_26_1
      antiphon:
        - Tu es la vraie lumière, le Sauveur du monde.
    - psalm: PSALM_26_2
      antiphon:
        - Tu es la vraie lumière, le Sauveur du monde.
    - psalm: NT_6
      antiphon:
        - Tu es l’image du Dieu invisible, le premier-né avant toute créature.
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: Is 9,2
    content: |-
      Le peuple qui marchait dans les ténèbres
      >a vu se lever une grande lumière ;
      et sur les habitants du pays de l’ombre de la mort
      >une lumière a resplendi.
  collect:
  - |-
    Dieu tout-puissant, nous t’en prions : +
    >puisque ton salut s’est manifesté pour la rédemption du monde
    >par une lumière nouvelle dans les cieux, /
    qu’il se lève en nos cœurs
    >pour les renouveler toujours.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Seigneur Dieu,
    >source de la piété véritable et de la paix, +
    >nous t’en prions, accorde-nous
    d’honorer dignement ta gloire par cette offrande, *
    >que, dans la participation fidèle aux saints mystères,
    >nous prenions davantage conscience de notre unité.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: 1Jn 1,2
    content: |-
      La vie, qui était auprès du Père, s’est manifestée
      >et nous est apparue.
  prayerAfterCommunion:
  - |-
    Ton peuple, Seigneur, a besoin de multiples secours
    >pour sa traversée d’ici-bas ; +
    que ta tendresse lui accorde ceux de la vie présente
    >comme ceux de la vie future : *
    trouvant alors le réconfort nécessaire dans les choses qui passent, /
    >il recherchera les biens éternels avec plus de confiance.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
