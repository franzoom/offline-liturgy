celebration:
  title: Jeudi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - Dieu éternel et tout-puissant, tu as voulu que tout effort de l’homme vers toi trouve son origine et son achèvement dans l’incarnation de ton Fils ; accorde-nous d’être comptés dans la part du Christ qui résume en lui le salut du genre humain. Lui qui règne.

readings:
  psalmody:
    - psalm: PSALM_17_4
      antiphon:
        - Je te rendrai grâce parmi les peuples, Seigneur, mon Dieu.
    - psalm: PSALM_17_5
      antiphon:
        - Je te rendrai grâce parmi les peuples, Seigneur, mon Dieu.
    - psalm: PSALM_17_6
      antiphon:
        - Je te rendrai grâce parmi les peuples, Seigneur, mon Dieu.

morning:
  psalmody:
    - psalm: PSALM_56
      antiphon:
        - Ton amour est plus grand que les cieux.
    - psalm: OT_36
      antiphon:
        - Il est venu nous rassembler comme un berger son troupeau.
    - psalm: PSALM_47
      antiphon:
        - Dieu est notre Dieu pour toujours.

middleOfDay:
  psalmody:
    - psalm: PSALM_118_3
      antiphon:
        - Dieu enseigne aux humbles son chemin, il leur fait connaître son alliance.
    - psalm: PSALM_24_1
      antiphon:
        - Dieu enseigne aux humbles son chemin, il leur fait connaître son alliance.
    - psalm: PSALM_24_2
      antiphon:
        - Dieu enseigne aux humbles son chemin, il leur fait connaître son alliance.

vespers:
  psalmody:
    - psalm: PSALM_29
      antiphon:
        - Fêtez le Seigneur, vous, ses fidèles !
    - psalm: PSALM_31
      antiphon:
        - |-
          Aujourd’hui est arrivé notre salut : le Fils de l’homme est venu sauver ce qui était perdu.
    - psalm: NT_10
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: cf. Jn 1,1
    content: |-
      Au commencement et avant le temps,
      >le Verbe était Dieu :
      lui-même a daigné naître dans le temps des hommes
      >comme Sauveur du monde.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as merveilleusement inauguré la rédemption de ton peuple
    >par la naissance de ton Fils unique ; *
    accorde à tes serviteurs une foi solide
    >pour qu’ils se laissent conduire par lui, /
    >et parviennent ainsi à la gloire que tu leur promets.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Accueille, Seigneur,
    >ce que nous présentons pour cette eucharistie
    >où s’accomplit un admirable échange : *
    en offrant ce que tu nous as donné, /
    >puissions-nous te recevoir toi-même.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: Jn 3,16
    content: |-
      Dieu a tellement aimé le monde
      >qu’il a donné son Fils unique,
      afin que quiconque croit en lui ne se perde pas,
      >mais obtienne la vie éternelle.
  prayerAfterCommunion:
  - |-
    Dieu tout-puissant, nous t’en prions : *
    fais que la force de tes saints mystères /
    >soutienne constamment notre vie.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
