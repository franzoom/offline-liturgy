celebration:
  title: Vendredi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - |-
      Dieu tout-puissant, en ton Verbe fait chair une lumière nouvelle nous envahit : puisqu’elle éclaire déjà nos cœurs par la foi, fais qu’elle resplendisse dans notre vie.

readings:
  psalmody:
    - psalm: PSALM_34_1
      antiphon:
        - Le Seigneur console son peuple, il prend pitié de ceux qui pleurent.
    - psalm: PSALM_34_2
      antiphon:
        - Le Seigneur console son peuple, il prend pitié de ceux qui pleurent.
    - psalm: PSALM_34_3
      antiphon:
        - Le Seigneur console son peuple, il prend pitié de ceux qui pleurent.

morning:
  psalmody:
    - psalm: PSALM_50
      antiphon:
        - Il est né d’une race de pécheurs, pour sauver l’homme pécheur.
    - psalm: OT_27
      antiphon:
        - Tu es un Dieu caché, Jésus, Sauveur des hommes.
    - psalm: PSALM_99
      antiphon:
        - Reconnaissez que le Seigneur est Dieu.

middleOfDay:
  psalmody:
    - psalm: PSALM_118_4
      antiphon:
        - Seigneur, j’aime la maison que tu habites, le lieu où demeure ta gloire.
    - psalm: PSALM_25
      antiphon:
        - Seigneur, j’aime la maison que tu habites, le lieu où demeure ta gloire.
    - psalm: PSALM_27
      antiphon:
        - Seigneur, j’aime la maison que tu habites, le lieu où demeure ta gloire.

vespers:
  psalmody:
    - psalm: PSALM_40
      antiphon:
        - Le Juste, mon serviteur, justifiera les multitudes.
    - psalm: PSALM_45
      antiphon:
        - |-
          La Vierge a mis au monde un fils : Emmanuel, Dieu avec nous.
    - psalm: NT_11
      antiphon:
        - Toi seul est saint, toi seul es le Seigneur !
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: cf. Ps 111,4
    content: |-
      Lumière des cœurs droits, il s’est levé dans les ténèbres,
      >le Seigneur de justice, de tendresse et de pitié.
  collect:
  - |-
    Dans ta bonté, Seigneur, +
    >sois la lumière de tes fidèles ; *
    >éclaire toujours leurs cœurs par la splendeur de ta gloire,
    pour qu’ils ne cessent de reconnaître leur Sauveur /
    >et s’attachent à lui en toute vérité.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Reçois favorablement, Seigneur,
    >les dons présentés par ton peuple, *
    que tous obtiennent par tes sacrements /
    >ce qu’ils proclament dans la ferveur de la foi.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: 1Jn 4,9
    content: |-
      Voici comment l’amour de Dieu s’est manifesté parmi nous :
      >Dieu a envoyé son Fils unique dans le monde
      >pour que nous vivions par lui.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >toi qui viens jusqu’à nous
    >quand nous participons à ce sacrement, *
    produis en nos cœurs les fruits de ce mystère,
    >pour que tes propres dons nous préparent
    >à recevoir ce que tu nous donnes.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
