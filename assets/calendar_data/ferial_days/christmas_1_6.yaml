celebration:
  title: Samedi de la première semaine de la férie de Noël
  subtitle: (avant l’Épiphanie)
invitatory:
  antiphon:
    - Le Christ est né pour nous, alléluia ! Venez, adorons-le.

oration:
    - Apprends-nous, Seigneur, l’amour de nos ennemis, à l’exemple de saint Étienne, le premier de tes martyrs, lui qui sut implorer le pardon pour ses propres bourreaux.

readings:
  psalmody:
    - psalm: PSALM_104_1
      antiphon:
        - |-
          Le Verbe s’est fait chair : Dieu se rappelle à jamais son alliance.
    - psalm: PSALM_104_2
      antiphon:
        - |-
          Le Verbe s’est fait chair : Dieu se rappelle à jamais son alliance.
    - psalm: PSALM_104_3
      antiphon:
        - |-
          Le Verbe s’est fait chair : Dieu se rappelle à jamais son alliance.

morning:
  psalmody:
    - psalm: PSALM_118_19
      antiphon:
        - Toi, Seigneur, tu es proche !
    - psalm: OT_1
      antiphon:
        - Qui est comme toi, magnifique en sainteté ?
    - psalm: PSALM_116
      antiphon:
        - Alléluia !

middleOfDay:
  psalmody:
    - psalm: PSALM_118_5
      antiphon:
        - Qui regarde vers lui resplendira.
    - psalm: PSALM_33_1
      antiphon:
        - Qui regarde vers lui resplendira.
    - psalm: PSALM_33_2
      antiphon:
        - Qui regarde vers lui resplendira.

vespers:
  psalmody:
    - psalm: PSALM_140
      antiphon:
        - Lève-toi, Jérusalem, car la gloire du Seigneur s’est levée sur toi.
    - psalm: PSALM_141
      antiphon:
        - Il ne dort pas, ton gardien, le Seigneur.
    - psalm: NT_5
      antiphon:
        - R/ Grandes sont tes œuvres, Seigneur !
mass:
- massType: day_mass
  name: Messe du jour
  note: null
  entranceAntiphon:
  - biblicalReference: cf. Ga 4,4-5
    content: |-
      Dieu a envoyé son Fils, né d’une femme,
      >pour que nous soyons adoptés comme fils.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >par l’avènement de ton Fils unique,
    >tu as bien voulu rayonner d’une lumière nouvelle ; *
    puisque nous l’avons vu prendre un corps comme le nôtre,
    >en devenant l’enfant de la Vierge, /
    accorde-nous d’avoir part à la grâce dans son Royaume.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: null
  offeringPrayer:
  - |-
    Seigneur Dieu,
    >source de la piété véritable et de la paix, +
    >nous t’en prions, accorde-nous
    >d’honorer dignement ta gloire par cette offrande, *
    que, dans la participation fidèle aux saints mystères,
    >nous prenions davantage conscience de notre unité.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: Jn 1,16
    content: |-
      Tous, nous avons eu part à la plénitude du Christ,
      >et reçu grâce sur grâce.
  prayerAfterCommunion:
  - |-
    Ton peuple, Seigneur, a besoin de multiples secours
    >pour sa traversée d’ici-bas ; +
    >que ta tendresse lui accorde ceux de la vie présente
    >comme ceux de la vie future : *
    trouvant alors le réconfort nécessaire dans les choses qui passent, /
    >il recherchera les biens éternels avec plus de confiance.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
