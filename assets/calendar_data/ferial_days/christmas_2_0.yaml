celebration:
  title: Deuxième dimanche après la Nativité
mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: Sg 18,14-15
    content: |-
      Un silence paisible enveloppait toutes choses,
      >et la nuit en était au milieu de son cours ;
      alors, ta Parole toute-puissante, Seigneur,
      >vint du ciel, de ton trône royal.
  collect:
  - |-
    Dieu éternel et tout-puissant,
    >splendeur de ceux qui croient en toi, +
    dans ta bonté daigne remplir le monde de ta gloire *
    >et te manifester à tous les peuples /
    >dans l’éclat de ta lumière.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Sanctifie, Seigneur, nos offrandes
    >par la naissance de ton Fils unique, *
    elle qui nous montre le chemin de la vérité /
    >et nous promet la vie du royaume des Cieux.
    Lui qui vit et règne pour les siècles des siècles.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  communionAntiphon:
  - biblicalReference: Jn 1,12
    content: |-
      À tous ceux qui l’ont reçu,
      >le Fils unique a donné de pouvoir devenir enfants de Dieu.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >nous te le demandons humblement : *
    que ce mystère agisse en nous
    >pour corriger nos penchants mauvais /
    >et combler nos justes désirs.
    Par le Christ, notre Seigneur.
  solemnBlessingList: null
