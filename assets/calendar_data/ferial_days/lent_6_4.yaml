celebration:
  title: Jeudi Saint
  subtitle:
  color: white
invitatory:
  antiphon:
  - Aujourd’hui, ne fermons pas notre cœur, mais écoutons la voix du Seigneur.
  - Les yeux fixés sur Jésus Christ, entrons dans le combat de Dieu.

oration:
- Dieu qu’il est juste d’aimer par-dessus tout, multiplie en nous les dons de ta grâce ; dans la mort de ton Fils, tu nous fais espérer ce que nous croyons, accorde-nous, par sa résurrection, d’atteindre ce que nous espérons.

readings:
  psalmody:
  - psalm: PSALM_43_1
    antiphon:
    - Tu nous rejettes au dernier rang, tu nous livres en spectacle aux hommes et aux anges.
  - psalm: PSALM_43_2
    antiphon:
    - Tu nous rejettes au dernier rang, tu nous livres en spectacle aux hommes et aux anges.
  - psalm: PSALM_43_3
    antiphon:
    - Tu nous rejettes au dernier rang, tu nous livres en spectacle aux hommes et aux anges.
  biblicalReading:
  - title: LECTURE DE LA LETTRE AUX HÉBREUX
    subtitle: Jésus Christ, grand prêtre
    ref: He 4, 14 – 5, 10
    content: |-
      En Jésus, le Fils de Dieu, nous avons le grand prêtre par excellence, celui qui a traversé les cieux ; tenons donc ferme l’affirmation de notre foi. En effet, nous n’avons pas un grand prêtre incapable de compatir à nos faiblesses, mais un grand prêtre éprouvé en toutes choses, à notre ressemblance, excepté le péché. Avançons-nous donc avec assurance vers le Trône de la grâce, pour obtenir miséricorde et recevoir, en temps voulu, la grâce de son secours. 
      Tout grand prêtre, en effet, est pris parmi les hommes ; il est établi pour intervenir en faveur des hommes dans leurs relations avec Dieu ; il doit offrir des dons et des sacrifices pour les péchés. Il est capable de compréhension envers ceux qui commettent des fautes par ignorance ou par égarement, car il est, lui aussi, rempli de faiblesse ; et, à cause de cette faiblesse, il doit offrir des sacrifices pour ses propres péchés comme pour ceux du peuple. On ne s’attribue pas cet honneur à soi-même, on est appelé par Dieu, comme Aaron. 
      Il en est bien ainsi pour le Christ : il ne s’est pas donné à lui-même la gloire de devenir grand prêtre ; il l’a reçue de Dieu, qui lui a dit : %Tu es mon Fils, moi, aujourd’hui, je t’ai engendré , \* car il lui dit aussi dans un autre psaume : %Tu es prêtre de l’ordre de Melkisédek pour l’éternité%.
      Pendant les jours de sa vie dans la chair, il offrit, avec un grand cri et dans les larmes, des prières et des supplications à Dieu qui pouvait le sauver de la mort, et il fut exaucé en raison de son grand respect. Bien qu’il soit le Fils, il apprit par ses souffrances l’obéissance et, conduit à sa perfection, il est devenu pour tous ceux qui lui obéissent la cause du salut éternel, car Dieu l’a proclamé %grand prêtre de l’ordre de Melkisédek.%
    responsory: |-
      R/ Avançons-nous avec pleine assurance
      vers le trône de la grâce !

      Notre grand prêtre a été éprouvé en tous points,
      à notre ressemblance, mais sans péché.

      Christ a prié avec grand cri et larmes
      et il fut exaucé en raison de sa soumission.

      Tout Fils qu’il était,
      Jésus apprit par ses souffrances l’obéissance.

      Ainsi le Fils de Dieu est devenu pour ses fidèles
      cause de salut éternel.
  patristicReading:
  - title: HOMÉLIE DE MÉLITON DE SARDES SUR LA PÂQUE
    subtitle: L’Agneau sans défaut et sans tache
    content: |-
      Bien des choses ont été annoncées par de nombreux prophètes en vue du mystère de Pâques qui est le Christ : % à lui la gloire pour les siècles des siècles%.% Amen%. C’est lui qui est venu des cieux sur la terre en faveur de l’homme qui souffre ; il a revêtu cette nature dans le sein de la Vierge et, quand il en est sorti, il était devenu homme ; il a pris sur lui les souffrances de l’homme qui souffre, avec un corps capable de souffrir, et il a détruit les souffrances de la chair ; par l’esprit incapable de mourir, il a tué la mort homicide. Conduit comme un agneau et immolé comme une brebis, il nous a délivrés de l’idolâtrie du monde comme de la terre d’Égypte ; il nous a libérés de l’esclavage du démon comme de la puissance de Pharaon ; il a marqué nos âmes de son propre Esprit, et de son sang les membres de notre corps. C’est lui qui a plongé la mort dans la honte et qui a mis le démon dans le deuil, comme Moïse a vaincu Pharaon. C’est lui qui a frappé le péché et a condamné l’injustice à la stérilité, comme Moïse a condamné l’Égypte. C’est lui qui nous a fait passer de l’esclavage à la liberté, des ténèbres à la lumière, de la mort à la vie, de la tyrannie à la royauté éternelle, lui qui a fait de nous un sacerdoce nouveau, un peuple choisi, pour toujours. C’est lui qui est la Pâque de notre salut. C’est lui qui endura bien des épreuves en un grand nombre de personnages qui le préfiguraient en Abel il a été tué ; en Isaac il a été lié sur le bois ; en Jacob il a été exilé ; en Joseph il a été vendu ; en Moïse il a été exposé à la mort ; dans l’agneau il a été égorgé ; en David il a été en butte aux persécutions ; dans les prophètes il a été méprisé. C’est lui qui s’est incarné dans une vierge, a été suspendu au bois, enseveli dans la terre, ressuscité d’entre les morts, élevé dans les hauteurs des cieux. C’est lui, l’agneau muet ; c’est lui, l’agneau égorgé ; c’est lui qui est né de Marie, la brebis sans tache ; c’est lui qui a été pris du troupeau, traîné à la boucherie, immolé sur le soir, mis au tombeau vers la nuit. Sur le bois, ses os n’ont pas été brisés ; dans la terre, il n’a pas connu la corruption ; il est ressuscité d’entre les morts et il a ressuscité humanité gisant au fond du tombeau.
    responsory: |-
      R/ Voici l’Agneau de Dieu
      qui enlève le péché du monde.

      Jésus a enduré la croix
      et renoncé à la joie qui lui revenait.

      Il s’est abaissé jusqu’à la mort,
      et la mort de la croix.
  verse: |-
    V/ Quand j’aurai été élevé de terre,
    j’attirerai à moi tous les hommes.

morning:
  psalmody:
  - psalm: PSALM_79
    antiphon:
    - Regarde-moi, Seigneur, vois mon malheur. Vite, réponds-moi !
  - psalm: OT_19
    antiphon:
    - |-
      Voici le Dieu qui me sauve : j’ai confiance, je n’ai plus de crainte.
  - psalm: PSALM_80
    antiphon:
    - Le Seigneur nous rassasiera avec le miel du rocher et la fleur du froment.
  reading:
    biblicalReference: He 2, 9b-10
    content: Nous voyons Jésus couronné de gloire et d’honneur à cause de sa passion et de sa mort. S’il a fait l’expérience de la mort, c’est, par grâce de Dieu, pour le salut de tous. En effet, puisque le créateur et maître de tout voulait avoir une multitude de fils à conduire jusqu’à la gloire, il était normal qu’il mène à sa perfection, par la souffrance, celui qui est à l’origine du salut de tous.
  responsory: |-
    R/ Souviens-toi de Jésus Christ
    ressuscité d’entre les morts :
    * Il est notre salut, notre gloire éternelle.
    V/ Si nous mourons avec lui,
    avec lui nous vivrons. *
    V/ Si nous souffrons avec lui,
    avec lui nous régnerons. *
    R/ Souviens-toi.
  evangelicAntiphon:
    common:
    - J’ai désiré d’un grand désir manger cette Pâque avec vous avant de souffrir.
  intercession:
    content: |-
      Unis à Jésus qui entre dans sa passion, supplions le Père des hommes :

      Rappelle-toi l’homme que les siens ont trahi.

      R/ Seigneur, rappelle-toi.

      L’abandonné qui redoute les heures de la nuit.

      L’innocent que l’on arrête comme un malfaiteur.

      L’accusé injustement condamné.

      Le prisonnier frappé, humilié.

      Le juste que l’on mène à la mort.

      Celui qui jusqu’au bout te fait confiance.

middleOfDay:
  psalmody:
  - psalm: PSALM_118_9
    antiphon:
    - Je donne ma vie pour mes brebis, car le Père me connaît comme je connais le Père.
  - psalm: PSALM_55
    antiphon:
    - Je donne ma vie pour mes brebis, car le Père me connaît comme je connais le Père.
  - psalm: PSALM_56
    antiphon:
    - Je donne ma vie pour mes brebis, car le Père me connaît comme je connais le Père.

  tierce:
    reading:
      biblicalReference: He 4, 14-15
      content: En Jésus, le Fils de Dieu, nous avons le grand prêtre par excellence, celui qui a pénétré au-delà des cieux ; tenons donc ferme l’affirmation de notre foi. En effet, le grand prêtre que nous avons n’est pas incapable, lui, de partager nos faiblesses ; en toutes choses, il a connu l’épreuve comme nous, et il n’a pas péché.
    responsory: |-
      V/ Maltraité, il s’humilie,
      il n’ouvre pas la bouche.
  sexte:
    reading:
      biblicalReference: He 7, 26-27
      content: |-
        Jésus était bien le grand prêtre qu’il nous fallait : saint, sans tache, sans aucune faute ; séparé maintenant des pécheurs, il est désormais plus haut que les cieux. Il n’a pas besoin, comme les autres grands prêtres, d’offrir chaque jour des sacrifices, d’abord pour ses péchés personnels, puis pour ceux du peuple ; cela, il l’a fait une fois pour toutes en s’offrant lui-même.
    responsory: |-
      V/ Ce sont nos souffrances qu’il a portées,
      nos douleurs qu’il a supportées.
  none:
    reading:
      biblicalReference: He 9, 11-12
      content: |-
        Le Christ est le grand prêtre du bonheur qui vient. Le temple de son corps est plus grand et plus parfait que celui de l’ancienne Alliance ; il n’a pas été construite par l’homme, et n’appartient donc pas à ce monde. C’est par ce temple qu’il est entré une fois pour toutes dans le sanctuaire du ciel en répandant, non pas le sang des animaux, mais son propre sang : il a obtenu ainsi une libération définitive.
    responsory: |-
      V/ Nous te célébrons, croix de Jésus Christ :
      par toi nous est donnée la vie.

vespers:
  hymn:
  - la-nuit-qu-il-fut-livre
  psalmody:
  - psalm: PSALM_71_1
    antiphon:
    - Le Premier-né d’entre les morts, le Souverain des rois de la terre, a fait de nous le Royaume de Dieu son Père.
  - psalm: PSALM_71_2
    antiphon:
    - Le Seigneur délivrera le pauvre qui appelle et le malheureux sans recours.
  - psalm: NT_10
    antiphon:
    - Les saints ont vaincu par le sang de l’Agneau, par la parole dont ils furent témoins.
  reading:
    biblicalReference: He 13, 12-15
    content: |-
      Jésus, voulant sanctifier le peuple par son propre sang, a souffert sa Passion en dehors de l’enceinte de la ville. Eh bien ! pour aller à sa rencontre, sortons en dehors de l’enceinte, en portant la même humiliation que lui. Car la cité que nous avons ici-bas n’est pas définitive : nous attendons la cité future. En toute circonstance, offrons à Dieu, par Jésus, un sacrifice de louange, c’est-à-dire l’acte de foi qui sort de nos lèvres en l’honneur de son nom.
  responsory: |-
    R/ Le Christ s’est fait pour nous obéissant jusqu’à la mort.
    V/ S’étant levé de table,
    Jésus lava les pieds de ses disciples. R/
    V/ Père, s’il est possible,
    que cette coupe s’éloigne de moi,
    mais que ta volonté soit faite. R/
  evangelicAntiphon:
    common:
    - Jésus prit le pain, le rompit, et le donna à ses disciples.
  intercession:
    content: |-
      En communion avec les disciples que le Seigneur invite ce soir à son dernier repas, prions :

      R/ Béni sois-tu, Seigneur, pour ton corps et ton sang !

      Prêtre du Dieu Très-Haut,
      tu t’es offert toi-même une fois pour toutes en sacrifice ;
      — apprends-nous à nous offrir avec toi.

      Jésus Sauveur,
      tu as accepté la coupe amère de la passion ;
      — enseigne-nous à faire la volonté du Père.

      Rédempteur des hommes,
      tu invites ton Église à célébrer l’eucharistie en mémoire de toi ;
      — garde toujours unis ceux qui partagent le même pain.

      Bon Pasteur, ceux que tu nourris de toi,
      — transforme-les en toi.

      Agneau de Dieu,
      immolé, toujours vivant,
      — conduis au terme du passage ceux qui ont franchi la mort.
  oration:
  - Pour ta gloire, Seigneur, et le salut du genre humain, tu as fait du Christ ton Prêtre éternel et souverain ; accorde au peuple qui t’appartient au prix de son sang et qui célèbre aujourd’hui son mémorial d’obtenir les richesse de vie venues de sa croix et de sa résurrection. Lui qui règne.

mass:
- massType: CAENA_DOMINI
  note: null
  entranceAntiphon:
  - biblicalReference: cf. Ga 6, 14
    content: |-
      Que notre seule fierté 
      >soit la croix de notre Seigneur Jésus Christ. 
      En lui, nous avons le salut, la vie et la résurrection, 
      >par lui, nous sommes sauvés et délivrés.
  collect:
  - |-
    Seigneur Dieu, +
    >tu nous appelles à célébrer 
    >la très sainte Cène où ton Fils unique, 
    >avant de se livrer lui-même à la mort, 
    >a remis pour toujours à son Église le sacrifice nouveau, 
    >le repas qui est le sacrement de son amour ; *
    donne-nous de puiser à ce grand mystère /
    >la charité et la vie en plénitude. 
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ex 12, 1-8.11-14
      headline: |-
        Prescriptions concernant le repas pascal
      content: |-
        En ces jours-là, dans le pays d’Égypte,
        le Seigneur dit à Moïse et à son frère Aaron :
        « Ce mois-ci
        sera pour vous le premier des mois,
        il marquera pour vous le commencement de l’année.
        Parlez ainsi à toute la communauté d’Israël :
        le dix de ce mois,
        que l’on prenne un agneau par famille,
        un agneau par maison.
        Si la maisonnée est trop peu nombreuse pour un agneau,
        elle le prendra avec son voisin le plus proche,
        selon le nombre des personnes.
        Vous choisirez l’agneau d’après ce que chacun peut manger.
        Ce sera une bête sans défaut, un mâle, de l’année.
        Vous prendrez un agneau ou un chevreau.
        Vous le garderez jusqu’au quatorzième jour du mois.
        Dans toute l’assemblée de la communauté d’Israël,
        on l’immolera au coucher du soleil.
        On prendra du sang,
        que l’on mettra sur les deux montants et sur le linteau
        des maisons où on le mangera.
        On mangera sa chair cette nuit-là,
        on la mangera rôtie au feu,
        avec des pains sans levain et des herbes amères.
        Vous mangerez ainsi : la ceinture aux reins,
        les sandales aux pieds,
        le bâton à la main.
        Vous mangerez en toute hâte :
        c’est la Pâque du Seigneur.
        Je traverserai le pays d’Égypte, cette nuit-là ;
        je frapperai tout premier-né au pays d’Égypte,
        depuis les hommes jusqu’au bétail.
        Contre tous les dieux de l’Égypte j’exercerai mes jugements :
        Je suis le Seigneur.
        Le sang sera pour vous un signe,
        sur les maisons où vous serez.
        Je verrai le sang, et je passerai :
        vous ne serez pas atteints par le fléau
        dont je frapperai le pays d’Égypte.

        Ce jour-là
        sera pour vous un mémorial.
        Vous en ferez pour le Seigneur une fête de pèlerinage.
        C’est un décret perpétuel : d’âge en âge vous la fêterez. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 115 (116b), 12-13, 15-16ac, 17-18
      refAbbr: 115, 12…
      chorus:
      - chorusRef: 1 Co 10, 16
        chorus: |-
          La coupe de bénédiction
          est communion au sang du Christ.
      content: |-
        Comment rendrai-je au Seigneur
        tout le bien qu’il m’a fait ?
        J’élèverai la coupe du salut,
        j’invoquerai le nom du Seigneur.

        Il en coûte au Seigneur
        de voir mourir les siens !
        Ne suis-je pas, Seigneur, ton serviteur,
        moi, dont tu brisas les chaînes ?

        Je t’offrirai le sacrifice d’action de grâce,
        j’invoquerai le nom du Seigneur.
        Je tiendrai mes promesses au Seigneur,
        oui, devant tout son peuple.
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 11, 23-26
      headline: |-
        « Chaque fois que vous mangez ce pain et que vous buvez cette coupe, vous proclamez la mort du Seigneur »
      content: |-
        Frères,
        moi, Paul, j’ai moi-même reçu ce qui vient du Seigneur,
        et je vous l’ai transmis :
        la nuit où il était livré,
        le Seigneur Jésus prit du pain,
        puis, ayant rendu grâce,
        il le rompit, et dit :
        « Ceci est mon corps, qui est pour vous.
        Faites cela en mémoire de moi. »
        Après le repas, il fit de même avec la coupe,
        en disant :
        « Cette coupe est la nouvelle Alliance en mon sang.
        Chaque fois que vous en boirez,
        faites cela en mémoire de moi. »

        Ainsi donc, chaque fois que vous mangez ce pain
        et que vous buvez cette coupe,
        vous proclamez la mort du Seigneur,
        jusqu’à ce qu’il vienne.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 13, 1-15
      headline: |-
        « Il les aima jusqu’au bout »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau,
        dit le Seigneur :
        « Aimez-vous les uns les autres
        comme je vous ai aimés. »
      content: |-
        Avant la fête de la Pâque,
        sachant que l’heure était venue pour lui
        de passer de ce monde à son Père,
        Jésus, ayant aimé les siens qui étaient dans le monde,
        les aima jusqu’au bout.

        Au cours du repas,
        alors que le diable
        a déjà mis dans le cœur de Judas, fils de Simon l’Iscariote,
        l’intention de le livrer,
        Jésus, sachant que le Père a tout remis entre ses mains,
        qu’il est sorti de Dieu et qu’il s’en va vers Dieu,
        se lève de table, dépose son vêtement,
        et prend un linge qu’il se noue à la ceinture ;
        puis il verse de l’eau dans un bassin.
        Alors il se mit à laver les pieds des disciples
        et à les essuyer avec le linge qu’il avait à la ceinture.
        Il arrive donc à Simon-Pierre,
        qui lui dit :
        « C’est toi, Seigneur, qui me laves les pieds ? »
        Jésus lui répondit :
        « Ce que je veux faire, tu ne le sais pas maintenant ;
        plus tard tu comprendras. »
        Pierre lui dit :
        « Tu ne me laveras pas les pieds ; non, jamais ! »
        Jésus lui répondit :
        « Si je ne te lave pas,
        tu n’auras pas de part avec moi. »
        Simon-Pierre
        lui dit :
        « Alors, Seigneur, pas seulement les pieds,
        mais aussi les mains et la tête ! »
        Jésus lui dit :
        « Quand on vient de prendre un bain,
        on n’a pas besoin de se laver, sinon les pieds :
        on est pur tout entier.
        Vous-mêmes,
        vous êtes purs,
        mais non pas tous. »
        Il savait bien qui allait le livrer ;
        et c’est pourquoi il disait :
        « Vous n’êtes pas tous purs. »

        Quand il leur eut lavé les pieds,
        il reprit son vêtement, se remit à table
        et leur dit :
        « Comprenez-vous
        ce que je viens de faire pour vous ?
        Vous m’appelez “Maître” et “Seigneur”,
        et vous avez raison, car vraiment je le suis.
        Si donc moi, le Seigneur et le Maître,
        je vous ai lavé les pieds,
        vous aussi, vous devez vous laver les pieds les uns aux autres.
        C’est un exemple que je vous ai donné
        afin que vous fassiez, vous aussi,
        comme j’ai fait pour vous. »
  offeringPrayer:
  - |-
    Accorde-nous, Seigneur, nous t’en prions, 
    >de participer dignement à ces mystères, *
    car chaque fois qu’est célébré ce sacrifice en mémorial, /
    c’est l’œuvre de notre rédemption qui s’accomplit. 
    Par le Christ, notre Seigneur.
  prefaceList:
  - the_lords_supper
  communionAntiphon:
  - condition: null
    biblicalReference: 1Co 11, 24-25
    content: |-
      « Ceci est mon corps, livré pour vous, dit le Seigneur. 
      >Faites cela en mémoire de moi. 
      Cette coupe est la nouvelle Alliance en mon sang. 
      >Chaque fois que vous en boirez 
      >faites cela en mémoire de moi. »
  prayerAfterCommunion:
  - |-
    Nous avons repris des forces, Dieu tout-puissant, 
    >en célébrant aujourd’hui la Cène de ton Fils ; *
    accorde-nous d’être rassasiés /
    >au banquet de l’éternité. 
    Par le Christ, notre Seigneur.
  solemnBlessingList: null

- massType: CHRISM_MASS
  note: Selon une tradition très ancienne, en ce jour, toutes les messes en l’absence du peuple sont interdites.
  entranceAntiphon:
  - biblicalReference: Ap 1, 6
    content: |-
      Jésus Christ a fait de nous 
      >un royaume et des prêtres pour Dieu son Père : 
      à lui, la gloire et la souveraineté 
      >pour les siècles des siècles. Amen.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné l’onction de l’Esprit Saint à ton Fils unique 
    >et tu l’as établi Christ et Seigneur ;
    >nous t’en prions : *
    puisque tu nous fais participer à sa consécration, /
    >accorde-nous d’être dans le monde 
    >les témoins de la rédemption. 
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Is 61,1-3a.6a.8b-9
      headline: |-
        « Le Seigneur m’a consacré par l’onction,
        il m’a envoyé annoncer la bonne nouvelle aux humbles,
        et leur donner l’huile de joie »
      content: |-
        L’esprit du Seigneur Dieu est sur moi
        >parce que le Seigneur m’a consacré par l’onction.
        Il m’a envoyé annoncer la bonne nouvelle aux humbles,
        >guérir ceux qui ont le cœur brisé,
        proclamer aux captifs leur délivrance,
        >aux prisonniers leur libération,
        proclamer une année de bienfaits accordée par le Seigneur,
        >et un jour de vengeance pour notre Dieu,
        consoler tous ceux qui sont en deuil,
        >ceux qui sont en deuil dans Sion,
        mettre le diadème sur leur tête au lieu de la cendre,
        >l’huile de joie au lieu du deuil,
        >un habit de fête au lieu d’un esprit abattu.
        Vous serez appelés « Prêtres du Seigneur » ;
        >on vous dira « Servants de notre Dieu ».
        Loyalement, je vous donnerai la récompense,
        >je conclurai avec vous une alliance éternelle.
        Vos descendants seront connus parmi les nations,
        >et votre postérité, au milieu des peuples.
        Qui les verra pourra reconnaître
        >la descendance bénie du Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88 (89), 20ab.21, 22.25, 27.29
      refAbbr: Ps 88
      chorus:
      - chorusRef: cf. Ps 88,2a
        chorus: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        Autrefois, tu as parlé à tes amis,
        dans une vision tu leur as dit :
        « J’ai trouvé David, mon serviteur,
        je l’ai sacré avec mon huile sainte.

        « Ma main sera pour toujoyrs avec lui,
        mon bras fortifiera son courage.
        Mon amour et ma fidélité sont avec lui,
        mon nom accroît sa vigueur.

        « Il me dira : "Tu es mon Père,
        mon Dieu, mon roc et mon salut !"
        Sans fin je lui garderai mon amour,
        mon alliance avec lui sera fidèle. »
  - partType: READING_2
    partContents:
    - biblicalRef: Ap 1,5-8
      headline: |-
        « Il a fait de nous un royaume et des prêtres pour son Dieu et Pèr »
      content: |-
        Que la grâce et la paix vous soient données
        de la part de Jésus Christ, le témoin fidèle,
        >le premier-né des morts,
        >le prince des rois de la terre.

        À lui qui nous aime,
        >qui nous a délivrés de nos péchés par son sang,
        qui a fait de nous un royaume
        >et des prêtres pour son Dieu et Père,
        à lui, la gloire et la souveraineté
        >pour les siècles des siècles. Amen.
        Voici qu’il vient avec les nuées,
        >tout œil le verra,
        ils le verront, ceux qui l’ont transpercé ;
        >et sur lui se lamenteront toutes les tribus de la terre.
        Oui ! Amen !

        Moi, je suis l’Alpha et l’Oméga,
        >dit le Seigneur Dieu,
        Celui qui est, qui était et qui vient,
        >le Souverain de l’univers.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 4,16-21
      headline: |-
        « L ’Esprit du Seigneur est sur moi ; il ma consacré par l’onction »
      acclamationAntiphon: |-
        L’Esprit du Seigneur est sur moi :
        il m’a envoyé porter la Bonne Nouvelle aux pauvres.
      content: |-
        En ce temps-là,
        Jésus vint à Nazareth, où il avait été élevé.
        Selon son habitude,
        il entra dans la synagogue le jour du sabbat,
        >et il se leva pour faire la lecture.
        On lui remit le livre du prophète Isaïe.
        Il ouvrit le livre et trouva le passage où il est écrit :
        >%L’Esprit du Seigneur est sur moi
        >parce que le Seigneur m’a consacré par l’onction.
        >Il m’a envoyé porter la Bonne Nouvelle aux pauvres,
        >annoncer aux captifs leur libération,
        >et aux aveugles qu’ils retrouveront la vue,
        >remettre en liberté les opprimés,
        >annoncer une année favorable accordée par le Seigneur.%

        Jésus referma le livre, le rendit au servant et s’assit.
        Tous, dans la synagogue, avaient les yeux fixés sur lui.
        Alors il se mit à leur dire :
        >« Aujourd’hui s’accomplit ce passage de l’Écriture
        >que vous venez d’entendre. »
  offeringPrayer:
  - |-
    Dans ta bienveillance, Seigneur, +
    >fais que la puissance de ce sacrifice
    >purifie tout ce qui vieillit en nous : *
    qu’elle fasse grandir le vie nouvelle /
    >et nous apporte le salut. +
    Par le Christ, notre Seigneur.
