celebration:
  title: Saint Amand
  subtitle: évêque
  description: Amand, était, pense-t-on, originaire d’Aquitaine. L’évangélisateur de la Gaule Belgique fut essentiellement un missionnaire en perpétuelle pérégrination. Ordonné évêque, il n’occupa que trois ans le siège de Maestricht (646-649). Il fonda plusieurs monastères, entre autres ceux de Gand, de Nivelles et d’Elnone (Saint-Amand-les-Eaux), où il mourut vers 679.
  commons:
    - pastors
  color: white

oration:
  - Seigneur, tu as appelé nos pères à la lumière de l’Évangile par la prédication de l’évêque saint Amand ; accorde-nous, à son intercession, de croître en sainteté et de connaître toujours mieux ton Fils, Jésus, le Christ, notre Seigneur.

readings:
  patristicReading:
    - title: LETTRE DU PAPE MARTIN I^er À SAINT AMAND
      content: |-
        Frère, en recevant ta lettre, composée avec tant de zèle pour la piété, notre âme a éprouvé du réconfort. Oui, lorsque l’on méprise les attraits incertains et passagers de ce siècle, on peut désirer en toute assurance les biens éternels et sublimes que nous vaudra le service de Dieu notre Seigneur. Nous avons donc pris connaissance, par le porteur de ta lettre, et par son texte, des combats que tu souffres actuellement. C’est ainsi qu’avec des esprits humiliés et des corps broyés vous monterez vers la patrie céleste où vous seront accordées les joies futures. Les récompenses par lesquelles le Créateur rétribuera nos services sont au-delà de toute comparaison, puisque les peines que nous subissons pour l’amour de lui seront terminées après un court espace de temps. Il nous faut donc supporter de bon cœur, en considération du bonheur qui nous attend, les épreuves de la vie présente. ~
        Et c’est pourquoi nous exhortons encore ta charité, en lui proposant l’exemple de celui qui a voulu souffrir et mourir pour nous : soyez prêts à persévérer dans toutes les formes de son service. Ne craignons pas de souffrir des tourments éphémères pour le nom du Christ. Comprenons que les vexations de ce siècle, bien supportées, nous feront bénéficier de la récompense future. Car il est écrit : %Que rendrai-je au Seigneur pour tous ses bienfaits ? J’élèverai la coupe du salut en invoquant le nom du Seigneur%. En effet, il est exigé de nous que nous accomplissions de tout notre pouvoir nos tâches de serviteurs.
        Nous avons prévu de vous adresser personnellement le recueil des actes du Concile, avec notre lettre d’envoi. Par tout cet ensemble vous pourrez vous informer de façon précise pour nous aider à dissiper les ténèbres de l’erreur, comme il convient à des fils de lumière.
      responsory: |-
        R/ Il n’est pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.

        Vous serez mes amis,
        si vous faites ma volonté.

        Moi, le Maître et Seigneur,
        je vous ai donné l’exemple.

        Heureux serez-vous, sachant cela,
        si vous donnez votre vie.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >par la prédication de l’évêque saint Amand,
    >tu as appelé nos pères
    >à l’admirable lumière de l’Évangile ; *
    accorde-nous, à son intercession,
    >de grandir dans la grâce et la connaissance /
    >de Jésus Christ, ton Fils, notre Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: 95, 3
      chorus:
      - chorusRef: 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 28, 16-20
      headline: |-
        « De toutes les nations faites des disciples »
      acclamationAntiphon: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !
      acclamationAntiphonReference: Ps 116, 1
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        apprenez-leur à observer
        >tout ce que je vous ai commandé.
        Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »
