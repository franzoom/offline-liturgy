celebration:
  title: Saint Damien De Veuster
  subtitle: prêtre
  description: |-
    Vers la fin de sa vie, l’apôtre des lépreux, Damien De Veuster, en religion le père Damien, ayant lui-même contracté la lèpre, se disait « le missionnaire le plus heureux du monde ». Né à Tremelo, au diocèse de Malines, le 3 janvier 1840, il travailla d’abord à la ferme familiale, puis entra dans la congrégation des Sacrés-Cœurs de Jésus et de Marie, dite de Picpus, où son frère Auguste l’avait précédé. Après une formation à Louvain et à Paris, il se sentit appelé à la mission en Océanie. Il fut ordonné prêtre le 21 mai 1864 à Honolulu, la capitale des îles Hawaï, et y exerça son ministère durant neuf ans. Puis il s’offrit à son évêque pour consacrer entièrement sa vie aux lépreux qui peuplaient la petite île de Molokai, où il vécut de 1873 à sa mort, le 15 avril 1889. Il soigna les malades, partagea leurs conditions de vie et leurs souffrances, leur annonça l’Évangile et fit de cette île ­laissée en marge de la société une communauté fraternelle. En 1936, son corps fut ramené en Belgique, où il eut des funérailles nationales. Il repose depuis lors à Louvain. Béatifié par saint Jean-Paul II, il fut canonisé par Benoît XVI le 11 octobre 2009.
  commons:
    - pastors_missionary
    - saints-male_caritative
  color: white

oration: |-
  Dieu, Père de miséricorde, tu as donné à saint Damien la grâce de se faire le serviteur des plus pauvres et des exclus, jusqu’à partager leur propre souffrance.
  Accorde-nous, par son intercession, de savoir porter un regard d’amour sur nos frères rejetés, et de mettre toute notre vie à leur service pour témoigner de ton immense tendresse.
  Par Jésus-Christ, ton Fils, notre Seigneur, qui vit et règne avec toi dans l’unité du Saint-Esprit, Dieu, pour les siècles des siècles. Amen.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Réjouissons-nous dans le Seigneur en l’honneur de saint Damien,
      >serviteur de Dieu et serviteur de l’homme.
      Son amour et son dévouement sans réserve
      >pour les éprouvés et les rejetés
      lui ont mérité de prendre place parmi les saints.
  collect:
  - |-
    Dieu, Père de miséricorde, +
    >tu nous as donné en saint Damien
    >un merveilleux témoin d’amour
    >pour les pauvres et les délaissés ; *
    accorde-nous, par son intercession,
    >de nous mettre aussi au service des nécessiteux et des exclus /
    >en fidèles témoins du Cœur de ton Fils.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 5, 1-8
      headline: |-
        « Nous mettons notre fierté dans la détresse elle-même »
      content: |-
        Frères,
        nous qui sommes devenus justes par la foi,
        nous voici en paix avec Dieu
        >par notre Seigneur Jésus Christ,
        lui qui nous a donné, par la foi,
        >l’accès à cette grâce
        >dans laquelle nous sommes établis ;
        et nous mettons notre fierté
        >dans l’espérance d’avoir part à la gloire de Dieu.
        Bien plus, nous mettons notre fierté
        >dans la détresse elle-même,
        puisque la détresse, nous le savons, produit la persévérance ;
        >la persévérance produit la vertu éprouvée ;
        >la vertu éprouvée produit l’espérance ;
        et l’espérance ne déçoit pas,
        puisque l’amour de Dieu a été répandu dans nos cœurs
        >par l’Esprit Saint qui nous a été donné.
        Alors que nous n’étions encore capables de rien,
        le Christ, au temps fixé par Dieu,
        >est mort pour les impies que nous étions.
        Accepter de mourir pour un homme juste,
        >c’est déjà difficile ;
        peut-être quelqu’un s’exposerait-il à mourir pour un homme de bien.
        Or, la preuve que Dieu nous aime,
        c’est que le Christ est mort pour nous,
        >alors que nous étions encore pécheurs.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 6-7, 8-9, 20-21
      refAbbr: cf. 33, 9a
      chorus:
      - chorusRef: cf. 33, 9a
        content: |-
          Goûtez et voyez
          comme est bon le Seigneur !
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        L’ange du Seigneur campe à l’entour
        pour libérer ceux qui le craignent.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Malheur sur malheur pour le juste,
        mais le Seigneur chaque fois le délivre.
        Il veille sur chacun de ses os :
        pas un ne sera brisé.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 13, 1-5.12-17
      headline: |-
        « C’est un exemple que je vous ai donné afin que vous fassiez, vous aussi, comme j’ai fait pour vous »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur,
        qui donne sa vie pour ses brebis.
      acclamationAntiphonReference: Jn 10, 11
      content: |-
        Avant la fête de la Pâque,
        sachant que l’heure était venue pour lui
        >de passer de ce monde à son Père,
        Jésus, ayant aimé les siens qui étaient dans le monde,
        >les aima jusqu’au bout.
        Au cours du repas,
        alors que le diable
        a déjà mis au cœur de Judas, fils de Simon l’Iscariote,
        >l’intention de le livrer,
        Jésus, sachant que le Père a tout remis entre ses mains,
        >qu’il est sorti de Dieu et qu’il s’en va vers Dieu,
        se lève de table, dépose son vêtement,
        >et prend un linge qu’il se noue à la ceinture ;
        puis il verse de l’eau dans un bassin.
        Alors il se mit à laver les pieds des disciples
        >et à les essuyer avec le linge qu’il avait à la ceinture.
        Quand il leur eut lavé les pieds,
        il reprit son vêtement, se remit à table
        et leur dit :
        >« Comprenez-vous ce que je viens de faire pour vous ?
        Vous m’appelez “Maître” et “Seigneur”,
        >et vous avez raison, car vraiment je le suis.
        Si donc moi, le Seigneur et le Maître,
        >je vous ai lavé les pieds,
        vous aussi, vous devez vous laver les pieds les uns aux autres.
        C’est un exemple que je vous ai donné
        >afin que vous fassiez, vous aussi,
        >comme j’ai fait pour vous.
        Amen, amen, je vous le dis :
        un serviteur n’est pas plus grand que son maître,
        >ni un envoyé plus grand que celui qui l’envoie.
        Sachant cela, heureux êtes-vous,
        >si vous le faites. »
  offeringPrayer:
  - |-
    Accueille, Seigneur, les présents de ton peuple ; *
    >et tandis que nous rappelons l’amour infini de ton Fils,
    fais que nous sachions, à l’exemple des saints, /
    >t’aimer et aimer notre prochain d’un cœur plus généreux.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jn 15,13
    content: |-
      Il n’y a pas de plus grand amour
      >que de donner sa vie pour ses amis, dit le Seigneur (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Nous te rendons grâce, Dieu de miséricorde,
    >pour le Pain de Vie que tu nous as donné
    >en ton Fils Jésus ; *
    par lui, donne-nous la grâce de te connaître
    >et le courage d’annoncer ton amour en toute notre vie, /
    >à l’exemple de saint Damien.
    Par le Christ, notre Seigneur.
