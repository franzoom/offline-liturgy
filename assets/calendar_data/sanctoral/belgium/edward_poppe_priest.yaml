celebration:
  title: Bienheureux Édouard Poppe
  subtitle: prêtre
  description: |-
    Édouard Poppe est né à Tamise (Temse), au diocèse de Gand, le 18 décembre 1890. Après son ordination sacerdotale, il fut vicaire à la paroisse Sainte-Colette de Gand, mais, pour raison de santé, il devint aumônier d’une communauté religieuse à Moerzeke. En 1922, il fut nommé accompagnateur spirituel des séminaristes qui faisaient leur service militaire à Bourg-Léopold. Il mourut quinze mois plus tard, le 10 juin 1924, à Moerzeke. Il avait manifesté un grand amour envers les pauvres et beaucoup de zèle pour former les enfants à la foi. Il est à l’origine de la croisade eucharistique.
  commons:
  - pastors
  color: white

oration:
- |-
  Seigneur Dieu, le bienheureux Édouard, ton prêtre, s’est totalement donné à toi ; de toutes ses forces, il a cherché à répondre, jusque dans les plus petites choses, à ta sainte volonté, qui lui était si chère ; nous t’en prions : allume en nous le feu de ton amour, afin que nous aussi annoncions l’Évangile avec enthousiasme en ce temps qui est le nôtre, et, confiants dans le secours de la Vierge Marie, que nous prenions à cœur de travailler à l’éducation de la foi de ton peuple.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >le bienheureux Édouard, ton prêtre,
    >s’est totalement donné à toi ;
    de toutes ses forces, il a cherché à répondre,
    >jusque dans les plus petites choses,
    >à ta sainte volonté, qui lui était si chère ; *
    nous t’en prions : allume en nous le feu de ton amour,
    afin que nous aussi annoncions l’Évangile avec enthousiasme
    >en ce temps qui est le nôtre, /
    et, confiants dans le secours de la Vierge Marie,
    >que nous prenions à cœur de travailler
    >à l’éducation de la foi de ton peuple.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
