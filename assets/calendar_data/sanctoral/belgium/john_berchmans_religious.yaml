celebration:
  title: Saint Jean Berchmans
  subtitle: religieux
  description: 26 novembre. SAINT Jean Berchmans, religieux Jean Berchmans (1599-1621), né en Brabant, entra chez les Jésuites de Louvain, d’où il fut envoyé à Rome pour y étudier (1618). Soucieux d’imiter les saints de la Compagnie de Jésus, surtout Louis de Gonzague et Stanislas Kostka, il joignait au travail une vie de pénitence et de prière. Il mourut de la dysenterie rayonnant de joie, à vingt-deux ans.
  commons:
  - saints-male_religious
  color: white

oration:
  - |-
    Accorde-nous, Seigneur, de te servir dans la droiture et dans la foi, à l’exemple de saint Jean Berchmans qui te consacra la pureté de sa jeunesse.

readings:
  patristicReading:
    - title: LETTRE À SES PARENTS (1616)
      content: |-
        %À l’âge de 17 ans, saint Jean Berchmans, désirant se consacrer à Dieu le plus tôt possible et éviter que ses parents ne fassent obstacle à ses désirs, décida de révéler à ces derniers la résolution qu’il avait prise au fond du cœur ; aussi leur écrivit-il de Malines la lettre suivante : %
        
        Vénéré père et très chère mère,
        Il y a déjà trois ou quatre mois que Dieu frappe à la porte de mon cœur ; et, jusqu’à un certain point, je la lui ai tenue fermée jusqu’ici. Mais ayant ensuite réfléchi que, soit pendant que j’étudiais, soit quand je prenais quelque délassement, que j’allais à la promenade ou que je faisais n’importe quoi, aucune chose ne me venait plus souvent à l’esprit que la pensée de me fixer fermement dans un état de vie, je me décidai à la fin, et même, après beaucoup de communions et de bonnes œuvres préparatoires, je fis vœu de servir, avec sa grâce, Dieu notre Maître, en religion.
        Il est vrai que les amis et les parents éprouvent une certaine répugnance à se détacher des leurs enfants.
        Mais, en moi-même, je considère autre chose : si je voyais, devant moi, d’un côté mon père, ma mère, ma sœur, etc... et de l’autre côté Dieu notre Maître avec sa Mère qui est aussi, je l’espère, ma Mère bénie : et que les premiers me diraient : « Ne nous abandonne pas, cher enfant, nous t’en prions par les peines et les fatigues que nous avons endurées pour toi » tandis que, d’autre part, Jésus me dirait : « Suis-moi plutôt, je naquis pour toi, pour toi je fus flagellé, couronné d’épines et enfin crucifié. Vois-tu ces cinq plaies sacrées, n’est-ce pas pour toi que je les ai reçues ? Et ne sais-tu pas que jusqu’à présent j’ai nourri ton âme de ma chair sainte et l’ai vivifiée par mon sang sacré ? Et maintenant tu te montrerais si ingrat ? » Ah ! mes très chers parents, quand je considère tout cela, je m’enflamme de telle manière que, s’il m’était possible, je volerais tout de suite en religion, et mon âme et mon cœur ne se donneraient de repos avant qu’ils n’eussent trouvé mon Bien-Aimé.
        Ainsi donc, je m’offre de tout cœur à Jésus Christ et je désire combattre ses combats dans la Compagnie. J’espère que vous ne serez pas à ce point ingrats pour vous opposer à Jésus Christ
        Je me recommande à vos saintes prières et supplie Dieu, notre Maître, qu’il veuille me donner persévérance jusqu’à la fin de ma vie et qu’il nous accorde, à vous et à moi, la vie éternelle. Le fils obéissant de Jésus Christ et le vôtre. Jean Berchmans.

      responsory: |-
        R/ Connaître le Christ,
        la puissance de sa résurrection,
        et la communion à ses souffrances.
        
        Pour lui, j’ai tout perdu,
        et je cours vers le seul but :
        
        De tout mon élan, je veux le saisir,
        car lui, le premier, m’a saisi.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Accorde-nous, Seigneur,
    >de te servir dans la droiture et dans la foi, *
    à l’exemple de saint Jean Berchmans /
    >qui te consacra la pureté de sa jeunesse.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 51, 12c-19a.20.27
      headline: |-
        « Depuis ma jeunesse, je marchais sur les traces de la Sagesse »
      content: |-
        Mon Dieu,
        je veux te rendre grâce et te louer,
        >je bénirai le nom du Seigneur.
        Quand j’étais encore jeune
        >et que je n’avais pas erré çà et là,
        >aux yeux de tous j’ai cherché la Sagesse dans ma prière.
        Devant le Temple, je priais pour la recevoir,
        >et jusqu’au bout je la rechercherai.
        Depuis la fleur jusqu’à la maturité de la grappe,
        >elle a été la joie de mon cœur.
        Mon pied s’est avancé sur le droit chemin ;
        >depuis ma jeunesse, je marchais sur ses traces.
        Il m’a suffi de tendre un peu l’oreille pour la recevoir,
        >et j’y ai trouvé de grandes leçons.
        Grâce à elle, j’ai progressé ;
        >je rendrai gloire à celui qui me donne la Sagesse.
        J’ai résolu de la mettre en pratique,
        >ardemment j’ai désiré le bien,
        >et jamais je n’aurai à le regretter.
        Pour elle, j’ai vaillamment combattu,
        >j’ai mis, à pratiquer la Loi, beaucoup d’exactitude.
        J’ai dirigé mon âme vers elle,
        >c’est dans la pureté que je l’ai trouvée.
        Avec elle, dès le commencement, j’ai trouvé l’intelligence,
        >c’est pourquoi je ne serai jamais abandonné.
        Constatez-le de vos yeux :
        >en prenant peu de peine,
        >j’ai trouvé beaucoup de repos.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      chorus:
      - chorusRef: null
        content: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 16-21
      headline: |-
        « Si tu veux être parfait, va, vends ce que tu possèdes »
      acclamationAntiphon: |-
        Si vous demeurez fidèles à ma parole,
        vous êtes vraiment mes disciples ;
        alors vous connaîtrez la vérité, dit le Seigneur.
      acclamationAntiphonReference: Jn 8, 31b-32
      content: |-
        En ce temps-là,
        voici que quelqu’un s’approcha de Jésus et lui dit :
        >« Maître, que dois-je faire de bon
        >pour avoir la vie éternelle ? »
        Jésus lui dit :
        >« Pourquoi m’interroges-tu sur ce qui est bon ?
        Celui qui est bon, c’est Dieu, et lui seul !
        >Si tu veux entrer dans la vie,
        >observe les commandements. »
        Il lui dit :
        >« Lesquels ? »
        Jésus reprit :
        >« Tu ne commettras pas de meurtre.
        Tu ne commettras pas d’adultère.
        >Tu ne commettras pas de vol.
        Tu ne porteras pas de faux témoignage.
        >Honore ton père et ta mère.
        Et aussi :
        >Tu aimeras ton prochain comme toi-même. »
        Le jeune homme lui dit :
        >« Tout cela, je l’ai observé :
        que me manque-t-il encore ? »
        Jésus lui répondit :
        >« Si tu veux être parfait,
        va, vends ce que tu possèdes,
        >donne-le aux pauvres,
        >et tu auras un trésor dans les cieux.
        Puis viens, suis-moi. »
