celebration:
  title: Sainte Julienne du Mont-Cornillon
  subtitle: vierge
  description: Julienne (1191/92-1258), moniale du Mont-Cornillon, est à l’origine de la fête du Corps et du Sang du Christ. Elle sollicita son institution vers 1225, à la suite d’une vision qu’elle avait eue en 1209. La fête fut célébrée à Liège dès 1229. Julienne mourut en 1258, persécutée par ceux que condamnait la sainteté silencieuse de sa vie.
  commons:
    - virgins
    - saints-female_religious
  color: white

oration: |-
  Dieu qui as mis au cœur de sainte Julienne un zèle admirable pour promouvoir l’amour de l’eucharistie, permets que nous puissions contempler face à face dans le ciel celui que nous adorons ici-bas sous le voile du sacrement, Jésus Christ, ton Fils, notre Seigneur. Lui qui vit et règne.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >tu as mis au cœur de sainte Julienne un zèle admirable
    >pour promouvoir l’amour de l’eucharistie ; *
    fais que nous puissions contempler face à face dans le ciel /
    >celui que nous adorons ici-bas sous le signe du sacrement,
    >Jésus Christ, ton Fils, notre Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 26-31
      headline: |-
        « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        >ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        >voilà ce que Dieu a choisi,
        >pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        >lui qui est devenu pour nous sagesse venant de Dieu,
        >justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        >Celui qui veut être fier,
        >qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 6-7, 10-11
      refAbbr: cf. 33, 9a
      chorus:
      - chorusRef: cf. 33, 9a
        content: |-
          Goûtez et voyez
          comme est bon le Seigneur !
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 6, 51-58
      headline: |-
        « Celui qui mange ma chair et boit mon sang a la vie éternelle »
      acclamationAntiphon: |-
        Moi, je suis le pain de la vie, dit le Seigneur,
        celui qui vient à moi n’aura jamais faim.
      acclamationAntiphonReference: Jn 6, 35
      content: |-
        En ce temps-là,
        après avoir nourri la foule avec cinq pains et deux poissons,
        Jésus disait :
        >« Moi, je suis le pain vivant,
        qui est descendu du ciel :
        >si quelqu’un mange de ce pain,
        il vivra éternellement.
        Le pain que je donnerai, c’est ma chair,
        >donnée pour la vie du monde. »
        Les Juifs se querellaient entre eux :
        >« Comment celui-là
        peut-il nous donner sa chair à manger ? »
        Jésus leur dit alors :
        >« Amen, amen, je vous le dis :
        si vous ne mangez pas la chair du Fils de l’homme,
        >et si vous ne buvez pas son sang,
        vous n’avez pas la vie en vous.
        Celui qui mange ma chair et boit mon sang
        >a la vie éternelle ;
        et moi, je le ressusciterai au dernier jour.
        En effet, ma chair est la vraie nourriture,
        >et mon sang est la vraie boisson.
        Celui qui mange ma chair et boit mon sang
        >demeure en moi,
        >et moi, je demeure en lui.
        De même que le Père, qui est vivant, m’a envoyé,
        >et que moi je vis par le Père,
        de même celui qui me mange,
        >lui aussi vivra par moi.
        Tel est le pain qui est descendu du ciel :
        >il n’est pas comme celui que les pères ont mangé.
        Eux, ils sont morts ;
        >celui qui mange ce pain
        >vivra éternellement. »
