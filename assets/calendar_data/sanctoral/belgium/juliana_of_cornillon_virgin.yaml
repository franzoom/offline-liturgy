celebration:
  title: Sainte Julienne du Mont-Cornillon
  subtitle: vierge
  description: Julienne (1191/92-1258), moniale du Mont-Cornillon, est à l’origine de la fête du Corps et du Sang du Christ. Elle sollicita son institution vers 1225, à la suite d’une vision qu’elle avait eue en 1209. La fête fut célébrée à Liège dès 1229. Julienne mourut en 1258, persécutée par ceux que condamnait la sainteté silencieuse de sa vie.
  commons:
    - virgins
    - saints-female_religious
  color: white

oration: |-
  Dieu qui as mis au cœur de sainte Julienne un zèle admirable pour promouvoir l’amour de l’eucharistie, permets que nous puissions contempler face à face dans le ciel celui que nous adorons ici-bas sous le voile du sacrement, Jésus Christ, ton Fils, notre Seigneur. Lui qui vit et règne.
