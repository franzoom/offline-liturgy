celebration:
  title: Saint Lambert
  subtitle: évêque et martyr
  description: Lambert, évêque de Maestricht (vers 671), vécut dans un temps de violences. Écarté de son siège par Hébroïn, il partagea pendant sept ans la vie des moines de Stavelot, vie de pénitence et d’austérité qu’il devait conserver par la suite, en y joignant le zèle apostolique. Il fut assassiné près de Liège (avant 705).
  commons:
  - martyr
  - pastors_bishop
  color: red

oration:
  - |-
    Seigneur, tu nous as fait connaître ton Fils grâce à la prédication de saint Lambert, évêque et martyr ; rends-nous maintenant, à sa prière, fermes et constants dans la foi.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >tu nous as fait connaître ton Fils
    >grâce à la prédication de saint Lambert, évêque et martyr ; *
    rends-nous maintenant, à sa prière, /
    >fermes et constants dans la foi.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 32 (33), 1-2, 4-5, 10, 11
      refAbbr: cf. 32, 5b
      chorus:
      - chorusRef: cf. 32, 5b
        content: |-
          Toute la terre, Seigneur,
          est remplie de ton amour.
      content: |-
        Criez de joie pour le Seigneur, hommes justes !
        Hommes droits, à vous la louange !
        Rendez grâce au Seigneur sur la cithare,
        jouez pour lui sur la harpe à dix cordes.

        Oui, elle est droite, la parole du Seigneur ;
        il est fidèle en tout ce qu’il fait.
        Il aime le bon droit et la justice ;
        la terre est remplie de son amour.

        Le Seigneur a déjoué les plans des nations,
        anéanti les projets des peuples.
        Le plan du Seigneur demeure pour toujours,
        les projets de son cœur subsistent d’âge en âge.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      headline: |-
        « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      acclamationAntiphonReference: Jn 10, 14
      content: |-
        En ce temps-là, Jésus disait :
        >« Moi, je suis le bon pasteur, le vrai berger,
        >qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        >les brebis ne sont pas à lui :
        >s’il voit venir le loup,
        >il abandonne les brebis et s’enfuit ;
        >le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        >et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        >je connais mes brebis,
        >et mes brebis me connaissent,
        >comme le Père me connaît,
        >et que je connais le Père ;
        >et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        >qui ne sont pas de cet enclos :
        >celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        >il y aura un seul troupeau
        >et un seul pasteur. »
