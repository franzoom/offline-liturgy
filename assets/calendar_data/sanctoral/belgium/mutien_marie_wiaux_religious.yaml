celebration:
  title: Saint Mutien-Marie
  subtitle: religieux
  description: 
  commons:
    - saints-male_religious
  color: white

oration: |-
  Seigneur Dieu, tu as donné à saint Mutien-Marie la grâce de s’unir à toi par une prière continuelle et de chercher en tout ta sainte volonté. Conduits par son exemple et soutenus par son intercession, fais que nous sachions, nous aussi, te servir d’un cœur pur dans l’accomplissement quotidien de nos devoirs, et témoigner fidèlement de ton amour auprès de nos frères. Par Jésus Christ, ton Fils, notre Seigneur. Amen.
