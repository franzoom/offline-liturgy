celebration:
  title: La Vierge Marie Médiatrice
  description: Le culte de Marie Médiatrice de toutes grâces a pris son origine en Belgique sous l’impulsion du cardinal Mercier (1921). Le Il^e Concile du Vatican a reconnu la légitimité de l’expression « entendue de telle sorte que nulle dérogation, nulle addition, n’en résulte quant à la dignité et l’efficacité de l’unique Médiateur, le Christ ».
  commons:
  - virgin-mary
  color: white

oration:
  - |-
    Par son libre consentement à ta volonté, Seigneur, la Vierge Marie est devenue la mère de ton Fils et s’est totalement associée à son œuvre de rédemption ; accorde-nous, à sa prière, de progresser dans la foi, l’espérance et la charité, et de collaborer généreusement à la mission de l’Église.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT BERNARD SUR LES GLOIRES DE LA VIERGE MÈRE
      content: |-
        %Le nom de la Vierge était Marie%. Parlons un peu de ce nom qui signifie : étoile de la mer et qui convient admirablement à la Vierge Mère. ~ Elle est bien cette noble étoile née de Jacob, dont les rayons illuminent le monde entier, dont l’éclat resplendit au plus haut des cieux et pénètre jusqu’aux abîmes. Elle illumine toute la terre, embrase les esprits encore plus que les corps, fait croître les vertus et dessèche les vices.
        Elle est cette splendide étoile qui se lève sur l’immensité de la mer, brillant par ses mérites, éclairant par ses exemples. Ô toi qui te sens, loin de la terre ferme, emporté sur les flots de ce monde au milieu des orages et des tempêtes, ne quitte pas des yeux la lumière de cet astre si tu ne veux pas sombrer.
        Si les vents des tentations s’élèvent, si tu viens heurter les rochers des tribulations, regarde l’étoile, invoque Marie.
        Si tu es ballotté par les flots de l’orgueil, de l’ambition, de la trahison, de la jalousie, regarde l’étoile, invoque Marie.
        Si la colère ou l’avarice ou les désirs impurs secouent la petite barque de ton âme, regarde Marie.
        Si, troublé par l’énormité de tes crimes, confondu par la malpropreté de ta conscience, glacé d’effroi à la pensée du jugement, tu commences à être englouti par le gouffre de la tristesse, par l’abîme du désespoir, pense à Marie.
        Dans les périls, dans les angoisses, dans le doute, pense à Marie, invoque Marie. Qu’elle ne s’éloigne pas de ta bouche, qu’elle ne s’éloigne pas de ton cœur et, pour obtenir le secours de sa prière, ne néglige pas l’exemple de sa vie.
        Si tu la suis, tu ne dévies pas. Si tu la pries, tu ne désespères pas. Si tu la consultes, tu ne te trompes pas. Si elle te protège, tu ne crains rien. Si elle te conduit, tu ne te fatigues pas. Si elle t’est favorable, tu parviens au but.
        Et ainsi tu éprouves par toi-même à quel juste titre il a été dit : %Et le nom de la Vierge était Marie%.

      responsory: |-
        R/ Réjouis-toi, Marie,
        tu donneras le Sauveur au monde !
        
        Il sera grand,
        on l’appellera Fils du Très-Haut !
        
        Il vient chercher
        ce qui était perdu.
        
        Il rassemblera
        les enfants de Dieu dispersés.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Par son libre consentement à ta volonté, Seigneur, +
    >la Vierge Marie est devenue la Mère de ton Fils,
    >et fut totalement associée à son œuvre de rédemption ; *
    accorde-nous, à sa prière,
    >de progresser dans la foi, l’espérance et la charité, /
    >et de collaborer généreusement à la mission de l’Église.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 1, 12-14
      headline: |-
        « Tous étaient assidus à la prière, avec Marie la mère de Jésus »
      content: |-
        En ces jours-là,
        les Apôtres, après avoir vu Jésus s’en aller vers le ciel,
        retournèrent à Jérusalem
        >depuis le lieu-dit « mont des Oliviers » qui en est proche
        >– la distance de marche ne dépasse pas
        >ce qui est permis le jour du sabbat.
        À leur arrivée, ils montèrent dans la chambre haute
        >où ils se tenaient habituellement ;
        c’était Pierre, Jean, Jacques et André,
        >Philippe et Thomas, Barthélemy et Matthieu,
        >Jacques fils d’Alphée, Simon le Zélote, et Jude fils de Jacques.
        Tous, d’un même cœur, étaient assidus à la prière,
        >avec des femmes, avec Marie la mère de Jésus,
        >et avec ses frères.
  - partType: PSALM
    partContents:
    - biblicalRef: Jdt 13, 18bcde, 18fg-19ab, 20abef
      refAbbr: cf. Jdt 15, 9
      chorus:
      - chorusRef: cf. Jdt 15, 9
        content: |-
          Tu es la joie, tu es l’honneur
          de notre peuple, Vierge Marie.
      content: |-
        Bénie sois-tu, ma fille, par le Dieu Très-Haut
        plus que toutes les femmes de la terre ;
        et béni soit le Seigneur Dieu,
        Créateur du ciel et de la terre.

        Car le Seigneur t’a dirigée
        pour frapper à la tête le chef de nos ennemis.
        Jamais l’espérance dont tu as fait preuve
        ne s’éloignera du cœur des hommes.

        Oui, Dieu fasse que tu sois exaltée à jamais,
        qu’il te visite de ses bienfaits,
        tu es sortie pour empêcher notre ruine,
        marchant avec droiture devant notre Dieu.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 19, 25-27
      headline: |-
        « Voici ton fils »
      acclamationAntiphon: |-
        Tu es bénie, Mère de miséricorde,
        Mère de l’espérance et de la grâce,
        Vierge Marie.
      content: |-
        Près de la croix de Jésus se tenaient sa mère
        et la sœur de sa mère, Marie, femme de Cléophas,
        et Marie Madeleine.
        Jésus, voyant sa mère,
        et près d’elle le disciple qu’il aimait,
        dit à sa mère :
        >« Femme, voici ton fils. »
        Puis il dit au disciple :
        >« Voici ta mère. »
        Et à partir de cette heure-là,
        >le disciple la prit chez lui.
