celebration:
  title: Saint André Bessette
  subtitle: patron des aidantes et aidants naturels au Canada
  description: André Bessette (1845-1937), né à Saint-Grégoire d’Iberville (Québec), entre à 25 ans dans la Congrégation de Sainte-Croix, à Montréal, où il prend le nom de frère André. Homme de prière, il occupe pendant quarante ans le poste de portier au collège Notre-Dame, accueillant et encourageant les malades. Sa dévotion envers saint Joseph l’a amené à construire une chapelle qui est devenue aujourd’hui l’oratoire Saint-Joseph du Mont-Royal.
  color: white
  commons: 
    - saints-male_religious

oration:
  - Seigneur Dieu, tu as choisi saint André Bessette pour témoigner de ta compassion auprès des pauvres et des affligés, et tu l’as embrasé d’une dévotion sans borne envers saint Joseph. Accorde-nous, à son exemple et par son intercession, la grâce de te chercher fidèlement dans nos frères et sœurs, afin d’entrer avec lui dans le royaume de ta gloire.

readings:
  patristicReading:
  - title: Extrait des écrits et des témoignages sur la vie spirituelle de saint André Bessette
    subtitle: |-
      Dieu est amour et il nous aime : voilà le cœur de la foi chrétienne
    content: |-
      Le frère André fut avant tout un homme de prière et un pauvre parmi les pauvres. Sa vie entière s’est écoulée dans l’obscurité d’une loge de portier, mais son cœur était sans cesse fixé en Dieu. Il disait souvent à ceux qui venaient le voir : « Quand je prie, je ne me parle pas à moi-même, je parle à Dieu. Dieu est amour et il nous aime : voilà le cœur de la foi chrétienne. »

      C’est cette foi absolue dans la bonté du Père qui l’a poussé à se faire l’ami et le protecteur des affligés. Dépourvu de talents humains exceptionnels ou d’une santé solide, il puisait sa force dans l’Eucharistie et dans une confiance filiale et inébranlable envers saint Joseph. À tous les malades et désespérés qui se pressaient à sa porte, il répétait inlassablement : « Allez à saint Joseph, priez-le, il ne vous abandonnera pas. Mettez-vous à genoux, remerciez le bon Dieu de ce que vous souffrez, et demandez la grâce de bien porter votre croix. »

      Sa mission n’était pas d’attirer l’attention sur lui-même, mais de conduire les âmes à la miséricorde divine par l’intercession de celui qu’il aimait tant. Par ses gestes simples, par l’onction d’huile de la lampe de saint Joseph, il manifestait la compassion du Christ pour l’humanité blessée. Le frère André rappelait au monde que les plus humbles instruments sont ceux que Dieu choisit pour accomplir ses plus grandes merveilles.
    responsory: |-
      R/ Quiconque s’élève sera abaissé,
      * et qui s’abaisse sera élevé.
      V/ Le Seigneur soutient les humbles,
      il glorifie les petits qui mettent en lui leur espoir. *

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Mt 25,34.36.40
    content: |-
      À ceux qui l’ont servi dans leurs frères, le Seigneur dit :
      « Venez, les bénis de mon Père.
      >J’étais malade, et vous m’avez visité…
      Vraiment, je vous le dis :
      chaque fois que vous l’avez fait
      >à l’un de ces plus petits de mes frères,
      c’est à moi que vous l’avez fait. »
  collect:
  - |-
    Seigneur Dieu, ami des humbles, +
    >tu as suscité en ton serviteur, saint André Bessette,
    >une grande dévotion envers saint Joseph
    >et un dévouement remarquable
    >envers les pauvres et les affligés ; *
    accorde-nous, à son intercession,
    >de suivre ses exemples de prière et de charité, /
    afin de parvenir avec lui
    >jusqu’à la splendeur de ta gloire.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1P 4, 8-11
      headline: |-
        « Ce que chacun de vous a reçu comme don de la grâce, mettez-le au service des autres »
      content: |-
        Bien-aimés,
        soyez raisonnables et sobres
        >en vue de la prière.
        Avant tout, ayez entre vous une charité intense,
        >car la charité couvre une multitude de péchés.
        Pratiquez l’hospitalité les uns envers les autres
        >sans récriminer.
        Ce que chacun de vous a reçu comme don de la grâce,
        >mettez-le au service des autres,
        en bons gérants de la grâce de Dieu
        >qui est si diverse :
        si quelqu’un parle,
        >qu’il le fasse comme pour des paroles de Dieu ;
        celui qui assure le service,
        >qu’il s’en acquitte comme avec la force procurée par Dieu.
        Ainsi, en tout, Dieu sera glorifié par Jésus Christ,
        >à qui appartiennent la gloire et la souveraineté
        >pour les siècles des siècles. Amen.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 102 (103), 1-2, 3-4, 8-9, 13-14, 17-18a
      refAbbr: 102, 1a
      chorus:
      - chorusRef: 102, 1a
        content: |-
          Bénis le Seigneur, ô mon âme !
      content: |-
        Bénis le Seigneur, ô mon âme,
        bénis son nom très saint, tout mon être !
        Bénis le Seigneur, ô mon âme,
        n’oublie aucun de ses bienfaits !

        Car il pardonne toutes tes offenses
        et te guérit de toute maladie ;
        il réclame ta vie à la tombe
        et te couronne d’amour et de tendresse.

        Le Seigneur est tendresse et pitié,
        lent à la colère et plein d’amour ;
        il n’est pas pour toujours en procès,
        ne maintient pas sans fin ses reproches.

        Comme la tendresse du père pour ses fils,
        la tendresse du Seigneur pour qui le craint !
        Il sait de quoi nous sommes pétris,
        il se souvient que nous sommes poussière.

        L’amour du Seigneur, sur ceux qui le craignent,
        est de toujours à toujours,
        et sa justice pour les enfants de leurs enfants,
        pour ceux qui gardent son alliance.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: |-
        « Ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits »
      acclamationAntiphon: |-
        Tu es béni, Père,
        Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits
        les mystères du Royaume !
      acclamationAntiphonReference: cf. Mt 11, 25
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        >« Père, Seigneur du ciel et de la terre,
        je proclame ta louange :
        >ce que tu as caché aux sages et aux savants,
        >tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        personne ne connaît le Fils, sinon le Père,
        >et personne ne connaît le Père, sinon le Fils,
        >et celui à qui le Fils veut le révéler.
        Venez à moi,
        >vous tous qui peinez sous le poids du fardeau,
        et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        >devenez mes disciples,
        car je suis doux et humble de cœur,
        >et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        >et mon fardeau, léger. »
  offeringPrayer:
  - |-
    Accueille, Seigneur, les présents de ton peuple ; *
    >et tandis que nous rappelons
    >l’amour infini de ton Fils,
    fais que nous sachions,
    >à l’exemple du saint frère André, /
    >t’aimer et aimer notre prochain
    >d’un cœur plus généreux.
    Par le Christ, notre Seigneur.
  prefaceList:
    - saints_1
    - saints_2
  communionAntiphon:
  - biblicalReference: Jn 15,13
    content: |-
      « Il n’y a pas de plus grand amour
      >que de donner sa vie pour ceux qu’on aime »,
      >dit le Seigneur.
  prayerAfterCommunion:
  - |-
    Toi qui nous as fortifiés
    >par cette communion, Seigneur, +
    aide-nous à suivre l’exemple du saint frère André,
    >dans l’amour qu’il sut te témoigner, /
    >et la charité dont il fit preuve envers ton peuple.
    Par le Christ, notre Seigneur.
