celebration:
  title: Sainte Anne, mère de la Vierge Marie
  subtitle: patronne de la province de Québec
  description: |-
    Le culte de sainte Anne prit un nouvel essor au 17^e siècle à la suite des apparitions de la Mère de la Vierge Marie à Yves Nicolazic sur la lande d’Auray en Bretagne (1623). Ce culte fut accueilli avec faveur au Canada, où sainte Anne est spécialement vénérée dans son sanctuaire de Beaupré.
  color: white
  commons:
  - saints

oration:
- Seigneur, toi qui es le Dieu de nos Pères, tu as donné à sainte Anne et à saint Joachim de mettre au monde celle qui deviendrait la mère de ton Fils ; accorde-nous, à leur commune prière, le salut que tu as promis à ton peuple.

readings:
  patristicReading:
  - title: HOMÉLIE DE S JEAN DE DAMAS POUR LA NATIVITÉ DE LA VIERGE MARIE
    content: |-
      Puisque la Vierge Mère de Dieu devait naître de sainte Anne, la nature n’a pas osé anticiper sur la grâce : la nature demeura stérile jusqu’à ce que la grâce eût porté son fruit. Il fallait qu’elle naisse la première, celle qui devait enfanter %le premier-né antérieur à toute créature, en qui tout subsiste%.
      Joachim et Anne, heureux votre couple ! Toute la création est votre débitrice. C’est par vous, en effet, qu’elle a offert au Créateur le don supérieur à tous les dons, une mère toute sainte, seule digne de celui qui l’a créée. ~
      %Réjouis-toi%, Anne, %la stérile, toi qui n’enfantais pas ; éclate en cris de joie, toi qui n’as pas connu les douleurs%. Réjouis-toi, Joachim : par ta fille %un enfant nous est né, un fils nous a été donné%. %On proclame son nom : Messager du grand dessein de Dieu%, qui est le salut de tout l’univers, %Dieu fort%. ~ Oui, cet enfant est Dieu. ~
      Joachim et Anne, heureux votre couple, et parfaitement pur ! On vous a reconnus grâce à votre fruit, selon cette parole du Seigneur : %Vous les reconnaîtrez à leurs fruits%. Vous avez eu une conduite agréable à Dieu et digne de celle que vous avez engendrée. À cause de votre vie chaste et sainte, vous avez produit le joyau de la virginité, celle qui devait être vierge avant l’enfantement, vierge en mettant au monde, vierge après la naissance ; la seule toujours Vierge d’esprit, d’âme et de corps. ~
      Joachim et Anne, couple très chaste ! ~ En observant la chasteté, cette loi de la nature, vous avez mérité ce qui dépasse la nature : vous avez engendré pour le monde celle qui sera, sans connaître d’époux, la Mère de Dieu. En menant une vie pieuse et sainte dans la nature humaine, vous avez engendré une fille supérieure aux anges, qui est maintenant la Souveraine des anges. Enfant très gracieuse et très douce ! ~ Fille d’Adam et Mère de Dieu ! Heureux ton père et ta mère ! Heureux les bras qui t’ont portée ! Heureuses les lèvres qui, seules, ont reçu tes chastes baisers pour que tu demeures toujours parfaitement vierge. ~ %Acclamez Dieu, terre entière, sonnez, dansez, jouez. Élevez la voix, élevez-la, ne craignez pas%.
    responsory: |-
      R/ Heureux ceux qui écoutent la Parole de Dieu
      et qui la gardent.

      Que le Seigneur vous fasse croître
      et abonder dans l’amour mutuel.

      Que le Seigneur affermisse vos cœurs
      dans une sainteté sans reproche devant lui.

      Que Dieu notre Père vous garde vigilants
      pour l’avènement de notre Seigneur Jésus Christ
      avec tous ses saints.

morning:
  hymn:
  - dieu-s-approchait-comme-le-fruit
  reading:
    biblicalReference: Is 55, 3
    content: Prêtez l’oreille ! Venez à moi ! Écoutez et vous vivrez. Je ferai avec vous une Alliance éternelle, qui confirmera ma bienveillance envers David.
  responsory: |-
    R/ Le Seigneur est fidèle :
    * Il rachète son peuple.
    V/ C’est lui notre Sauveur. *
    Gloire au Père.
    R/ Le Seigneur.
  evangelicAntiphon:
    common:
    - |-
      Béni soit le Seigneur, le Dieu d’Israël : dans la maison de David, il fait surgir la force qui nous sauve.
vespers:
  hymn:
  - dieu-s-approchait-comme-le-fruit
  reading:
    biblicalReference: Rm 9, 4-5
    content: Les fils d’Israël ont pour eux l’adoption, la gloire, les alliances, la Loi, le culte, les promesses de Dieu ; ils ont les patriarches, et c’est de leur race que le Christ est né, lui qui est au-dessus de tout, Dieu béni éternellement. Amen.
  responsory: |-
    R/ Il relève Israël son serviteur,
    * il se souvient de son amour.
    V/ Comme il l’a promis à nos pères. *
    V/ Béni soit Dieu éternellement.
    R/ Il relève.
  evangelicAntiphon:
    common:
    - De la racine de Jessé une plante s’est levée, elle a donné sa fleur, d’un merveilleux parfum.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Réjouissons-nous tous dans le Seigneur,
      >en célébrant ce jour de fête en l’honneur de sainte Anne.
      De cette solennité les anges se réjouissent
      >et glorifient le Fils de Dieu.
      Aux messes votives :
      Célébrons sainte Anne, la mère de la Vierge Marie :
      >par elle nous est venue la bénédiction promise à tous les peuples.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as choisi sainte Anne
    >pour mettre au monde la Mère de ton Fils ; *
    accorde-nous, en ce jour de sa fête, /
    >l’appui de son intercession auprès de toi.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 44, 1.10-15
      headline: |-
        « Leur nom reste vivant pour toutes les générations »
      content: |-
        Faisons l’éloge de ces hommes glorieux
        >qui sont nos ancêtres.
        Ceux-là sont des hommes de miséricorde,
        >leurs œuvres de justice n’ont pas été oubliées.
        Avec leur postérité se maintiendra
        >le bel héritage que sont leurs descendants.
        Leur postérité a persévéré dans les lois de l’Alliance,
        >leurs enfants y sont restés fidèles grâce à eux.
        Leur descendance subsistera toujours,
        >jamais leur gloire ne sera effacée.
        Leurs corps ont été ensevelis dans la paix,
        >et leur nom reste vivant pour toutes les générations.
        Les peuples raconteront leur sagesse,
        >l’assemblée proclamera leurs louanges.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 131 (132), 11, 13-14, 17-18
      refAbbr: 131, 11…
      chorus:
      - chorusRef: Lc 1, 32a
        content: |-
          Le Seigneur Dieu lui donnera le trône
          de David son père.
      content: |-
        Le Seigneur l’a juré à David,
        et jamais il ne reprendra sa parole :
        « C’est un homme issu de toi
        que je placerai sur ton trône. »

        Car le Seigneur a fait choix de Sion ;
        elle est le séjour qu’il désire :
        « Voilà mon repos à tout jamais,
        c’est le séjour que j’avais désiré.

        « Là, je ferai germer la force de David ;
        pour mon messie, j’ai allumé une lampe.
        Je vêtirai ses ennemis de honte,
        mais, sur lui, la couronne fleurira. »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 13, 16-17
      headline: |-
        « Beaucoup de prophètes et de justes ont désiré voir ce que vous voyez »
      acclamationAntiphon: |-
        Ils attendaient la consolation d’Israël
        et l’Esprit Saint était sur eux.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Heureux vos yeux puisqu’ils voient,
        >et vos oreilles puisqu’elles entendent !
        Amen, je vous le dis :
        >beaucoup de prophètes et de justes
        >ont désiré voir ce que vous voyez,
        >et ne l’ont pas vu,
        >entendre ce que vous entendez,
        >et ne l’ont pas entendu. »
  offeringPrayer:
  - |-
    Seigneur, nous t’en prions : +
    >accepte ce que nous t’offrons de grand cœur
    >en la fête de sainte Anne ; *
    fais que nous ayons part à la bénédiction /
    >promise à Abraham et à sa descendance.
    Par le Christ, notre Seigneur.
  prefaceList:
  - saints_1
  - saints_2
  communionAntiphon:
  - biblicalReference: cf. Ps 23,5
    content: |-
      Heureuse celle qui obtient, du Seigneur, la bénédiction :
      >elle a trouvé grâce devant Dieu son Sauveur.
  prayerAfterCommunion:
  - |-
    Tu as voulu, Seigneur Dieu, +
    >que ton Fils unique naisse de la famille humaine,
    >pour que celle-ci, par un admirable mystère,
    >renaisse de ta propre vie ; *
    dans ta bonté, accorde
    >à ceux que tu as nourris du pain de tes enfants /
    >d’être sanctifiés par ton esprit d’adoption.
    Par le Christ, notre Seigneur.
