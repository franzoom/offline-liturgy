celebration:
  title: Bienheureuse Dina Bélanger
  subtitle: vierge
  description: |-
    Née à Québec le 30 avril 1897, Dina Bélanger a connu les plus hauts degrés de la vie mystique. De 1916 à 1918, elle poursuit des études musicales à New York. De retour dans sa ville natale, elle donne des concerts au profit d’œuvres de charité. En 1921, elle entre dans la communauté des Religieuses de Jésus-Marie, à Sillery, où elle porte le nom de Marie Sainte-Cécile-de-Rome et travaille à l’enseignement de la musique. Décédée le 4 septembre 1929, elle a été béatifiée par le pape saint Jean-Paul II le 20 mars 1993.
  color: white
  commons:
  - virgins

oration: Seigneur Dieu, source de toute sainteté, tu as attiré la bienheureuse Dina Bélanger vers les sommets de l’amour divin, et tu lui as inspiré de t’offrir les richesses du Cœur de Jésus pour le monde entier ; fais qu’à sa prière et à son exemple nous soyons fidèles à accomplir ta volonté en toutes choses.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, source de toute sainteté, +
    tu as attiré la bienheureuse Dina Bélanger
    >vers les sommets de l’amour divin,
    et tu lui as inspiré de t’offrir les richesses du Cœur de Jésus
    >pour le monde entier ; *
    fais qu’à sa prière et à son exemple /
    >nous soyons fidèles à accomplir ta volonté en toutes choses.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.