celebration:
  title: Bienheureuse Émilie Tavernier-Gamelin
  subtitle: religieuse
  description: Née à Montréal en 1800, Émilie Tavernier apprend de sa mère la confiance en Dieu Providence. Les itinérants, les orphelins, les sans-travail, les prisonniers, les sourds, les isolés, les malades, voilà sa famille. Émilie gagne des parentes et amies à ses gestes de dévouement. À la demande de Mgr Bourget, la Congrégation des Sœurs de la Providence est fondée en 1843. Engagée comme laïque, puis comme religieuse, Émilie Tavernier-Gamelin demeure un modèle pour notre temps.
  color: white
  commons: 
    - saints-female_religious

oration:
  -  Seigneur Jésus, nous te rendons grâce d’avoir donné la bienheureuse Émilie Tavernier-Gamelin comme fille de l’Église, au service du peuple de Dieu, spécialement pour les plus démunis ; allume en nos cœurs une charité toujours en éveil, pour qu’à son exemple, nous soyons de plus en plus la providence du pauvre ; apprends-nous à marcher en ta présence, et à trouver, comme elle, en la Vierge des Douleurs, la source de notre compassion.

mass:
- massType: DAY_MASS
