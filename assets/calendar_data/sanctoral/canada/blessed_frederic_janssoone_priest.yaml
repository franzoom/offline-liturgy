celebration:
  title: Bienheureux Frédéric Janssoone
  subtitle: prêtre
  description: |-
    Né le 19 novembre 1838 à Ghyvelde, dans le nord de la France, Frédéric Janssoone est ordonné prêtre chez les Franciscains à l’âge de 32 ans après avoir travaillé six ans comme commis voyageur afin d’aider sa mère devenue veuve. De 1876 à 1888, il œuvre en Terre sainte où il renouvelle les pèlerinages. Accueilli à Trois-Rivières, au Québec, en 1888, il est animateur au sanctuaire Notre-Dame-du-Cap durant quatorze ans. À partir de 1902, le bon père Frédéric est missionnaire itinérant de l’Évangile, organise des pèlerinages, institue la collecte pour les Lieux saints. Décédé à Montréal le 4 août 1916, il a été béatifié par le pape saint Jean-Paul II le 25 septembre 1988.
  color: white
  commons:
  - pastors

oration: Seigneur notre Dieu, tu as accordé au bienheureux Frédéric Janssoone de vivre en Terre sainte sur les traces de ton Fils et de faire mieux connaître aux fidèles les mystères de sa vie ; accorde-nous, par son intercession, de vénérer ces mystères avec amour et de recevoir en abondance les fruits de la rédemption. 

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur notre Dieu, +
    tu as accordé au bienheureux Frédéric Janssoone
    >de vivre en Terre sainte sur les traces de ton Fils
    >et de faire mieux connaître aux fidèles les mystères de sa vie ; *
    accorde-nous, par son intercession,
    >de vénérer ces mystères avec amour /
    et de recevoir en abondance
    >les fruits de la rédemption.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.