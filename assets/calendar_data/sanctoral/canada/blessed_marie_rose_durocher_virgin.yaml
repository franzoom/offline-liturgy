celebration:
  title: Bienheureuse Marie-Rose Durocher
  subtitle: vierge
  description: Mère Marie-Rose (Eulalie Durocher) est née le 6 octobre 1811 à Saint-Antoine-sur-Richelieu, au Québec. Au presbytère de Belœil, elle s’empresse auprès des pauvres, des malades, des personnes âgées, tout en nourrissant une intense vie de prière. Elle fonde à Longueuil, en 1843, la congrégation des Sœurs des Saints Noms de Jésus et de Marie, vouée à la formation intellectuelle, sociale et religieuse des jeunes filles. Elle meurt le 6 octobre 1849.
  commons:
    - virgins
  color: white

oration: |-
  Seigneur Dieu, tu as allumé au cœur de la bienheureuse Marie-Rose Durocher la flamme d’une ardente charité et un grand désir de collaborer, comme éducatrice, à la mission de l’Église ; accorde-nous cette même charité, afin qu’en répondant aux besoins du monde d’aujourd’hui, nous puissions conduire nos frères au bonheur de la vie éternelle.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >tu as allumé au cœur de la bienheureuse Marie-Rose Durocher
    >la flamme d’une ardente charité
    et un grand désir de collaborer, comme éducatrice,
    >à la mission de l’Église ; *
    accorde-nous cette même charité,
    >afin qu’en répondant aux besoins du monde d’aujourd’hui, /
    >nous puissions conduire nos frères au bonheur de la vie éternelle.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
