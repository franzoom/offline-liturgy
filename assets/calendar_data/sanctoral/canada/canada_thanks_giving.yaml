celebration:
  title: Jour de l’action de grâce
  description: null
  color: white

oration: |-
  Seigneur Dieu, tes dons sont innombrables et ta bonté est sans limite ; nous t’en prions : apprends-nous à utiliser sagement les abondantes bénédictions de la terre et de la mer, à être attentifs aux besoins des autres, et à donner aussi largement que nous avons reçu, afin que nous puissions goûter un jour les récompenses éternelles dans la joie de ta maison.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 146,7-8b
    content: |-
      Entonnez pour le Seigneur l’action de grâce,
      >jouez pour notre Dieu sur la cithare.
      Il couvre le ciel de nuages,
      >il prépare la pluie pour la terre,
      >il fait germer l’herbe sur les montagnes.
  collect:
  - |-
    Seigneur Dieu, +
    >tes dons sont innombrables et ta bonté est sans limite ; *
    nous t’en prions : apprends-nous à utiliser sagement
    >les abondantes bénédictions de la terre et de la mer,
    >à être attentifs aux besoins des autres,
    >et à donner aussi largement que nous avons reçu, /
    afin que nous puissions goûter un jour
    >les récompenses éternelles dans la joie de ta maison.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Innombrables sont tes dons, Seigneur : +
    >parmi eux, le pain et le vin
    >que ton peuple t’offre avec reconnaissance ; *
    nous t’en prions : par la grâce de ce sacrifice,
    >fais-nous apprécier tout ce que tu nous donnes,
    partager avec les autres ce que nous recevons de toi /
    >et l’utiliser pour ta gloire.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Ps 99,4-5
    content: |-
      Rendez-lui grâce et bénissez son nom.
      Oui, le Seigneur est bon, éternel est son amour.
  prayerAfterCommunion:
  - |-
    Seigneur, dans cette Eucharistie,
    >tu nous révèles les profondeurs de ton amour ; *
    accorde-nous de partager avec les autres
    >ce que tu nous as confié /
    et de vivre comme ton peuple
    >dans la vraie gratitude du cœur.
    Par le Christ, notre Seigneur.
