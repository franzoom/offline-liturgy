celebration:
  title: Saint François de Laval
  subtitle: évêque
  description: François de Laval (1623-1708), né à Montigny-sur-Avre dans le diocèse de Chartres, étudie chez les jésuites au collège de La Flèche, où éclot son intérêt pour les missions du Canada. Consacré évêque à Paris pour la Nouvelle-France, il fonde le séminaire de Québec, et s’occupe de ses tâches pastorales avec une grande générosité, spécialement envers les pauvres et les malades. Il s’est désapproprié de tous ses biens et de ses titres pour répondre à l’appel de Dieu. 
  commons:
    - pastors_bishop
  color: white

oration: |-
  Seigneur Dieu, tu as envoyé le saint évêque François de Laval pour étendre le règne du Christ au Canada ; accorde-nous, à son intercession, d’accomplir l’œuvre missionnaire à laquelle nous sommes appelés comme disciples de ton Fils, Jésus Christ, notre Seigneur.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Fêtons saint François de Laval,
      >et tous les amis de Dieu,
      dont la gloire fut de proclamer
      >la vérité reçue du Seigneur (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as envoyé le saint évêque François de Laval
    >pour étendre le règne du Christ au Canada ; *
    accorde-nous, à son intercession,
    >d’accomplir l’œuvre missionnaire /
    >à laquelle nous sommes appelés
    >comme disciples de ton Fils, Jésus Christ, notre Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Tm 4, 1-5
      headline: |-
        « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        >je t’en conjure,
        >au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        interviens à temps et à contretemps,
        >dénonce le mal,
        >fais des reproches, encourage,
        >toujours avec patience et souci d’instruire.
        Un temps viendra
        >où les gens ne supporteront plus l’enseignement
        >de la saine doctrine ;
        mais, au gré de leurs caprices,
        >ils iront se chercher une foule de maîtres
        >pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        >pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        >supporte la souffrance,
        fais ton travail d’évangélisateur,
        >accomplis jusqu’au bout ton ministère.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 10
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Allez dire aux nations : « Le Seigneur est roi ! »
        Le monde, inébranlable, tient bon.
        Il gouverne les peuples avec droiture.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      headline: |-
        « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis :
        pour elles je donne ma vie.
      acclamationAntiphonReference: cf. Jn 10, 14-15
      content: |-
        En ce temps-là, Jésus disait :
        >« Moi, je suis le bon pasteur, le vrai berger,
        >qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        >les brebis ne sont pas à lui :
        >s’il voit venir le loup,
        >il abandonne les brebis et s’enfuit ;
        >le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        >et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        >je connais mes brebis,
        >et mes brebis me connaissent,
        >comme le Père me connaît,
        >et que je connais le Père ;
        >et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        >qui ne sont pas de cet enclos :
        >celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        >il y aura un seul troupeau
        >et un seul pasteur. »
  offeringPrayer:
  - |-
    Regarde, Seigneur tout-puissant,
    >le sacrifice que nous offrons
    >en la fête de saint François de Laval, *
    et donne-nous d’exprimer dans notre vie
    >les mystères de la passion du Sauveur /
    >que nous célébrons dans ces rites sacrés.
    Lui qui vit et règne pour les siècles des siècles.
  prefaceList:
    - holy_pastors
  communionAntiphon:
  - biblicalReference: Ez 34,15
    content: |-
      Parole du Seigneur Dieu :
      « C’est moi qui ferai paître mon troupeau,
      >et c’est moi qui le ferai reposer » (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Par la grâce de cette eucharistie, Seigneur, +
    >affermis tes serviteurs dans la vérité de la foi : *
    qu’ils en témoignent partout, de bouche et de cœur,
    >à l’exemple de saint François de Laval /
    >qui consacra toute sa vie à faire connaître l’Évangile.
    Par le Christ, notre Seigneur.
