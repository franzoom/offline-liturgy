celebration:
  title: Sainte Kateri Tekakwitha
  subtitle: vierge
  description: Kateri Tekakwitha (1656-1680), née à Auriesville, dans l’État de New York, découvre la foi chrétienne au contact des missionnaires jésuites. Baptisée le jour de Pâques 1676, elle mène une vie modeste et pleine de douceur. Elle se consacre à Dieu, malgré l’opposition de sa famille, et va demeurer à la mission Saint-François-Xavier, dans un village appelé aujourd’hui Kahnawake, en face de Montréal (Québec).
  commons:
    - virgins
  color: white

oration: |-
  Seigneur Dieu, tu as appelé sainte Kateri Tekakwitha à vivre la virginité consacrée au milieu de son peuple ; fais que, par l’intercession de celle que l’on a appelée le Lys des Agniers, les gens de toute tribu, langue, peuple ou nation, rassemblés dans ton Église, te glorifient par un chant unanime de louange.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Célébrons dans la joie la fête de sainte Kateri Tekakwitha,
      >car le Seigneur de l’univers l’a aimée,
      et il a fait d’elle une vierge sainte et glorieuse (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as appelé sainte Kateri Tekakwitha
    >à vivre la virginité consacrée au milieu de son peuple ; *
    fais que, par l’intercession
    >de celle que l’on a appelée le Lys des Agniers,
    les gens de toute tribu, langue, peuple ou nation,
    >rassemblés dans ton Église, /
    >te glorifient par un chant unanime de louange.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 12, 1-2
      headline: |-
        « Présentez votre corps en sacrifice vivant, saint, capable de plaire à Dieu »
      content: |-
        Je vous exhorte, frères, par la tendresse de Dieu,
        >à lui présenter votre corps – votre personne tout entière –,
        en sacrifice vivant, saint, capable de plaire à Dieu :
        >c’est là, pour vous, la juste manière de lui rendre un culte.
        Ne prenez pas pour modèle le monde présent,
        >mais transformez-vous en renouvelant votre façon de penser
        pour discerner quelle est la volonté de Dieu :
        >ce qui est bon, ce qui est capable de lui plaire,
        >ce qui est parfait.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 118 (119), 57.72, 76-77, 127-128, 129-130
      refAbbr: 118, 97a
      chorus:
      - chorusRef: 118, 97a
        content: |-
          De quel amour j’aime ta loi, Seigneur !
      content: |-
        Mon partage, Seigneur, je l’ai dit,
        c’est d’observer tes paroles.
        Mon bonheur, c’est la loi de ta bouche,
        plus qu’un monceau d’or ou d’argent.

        Que j’aie pour consolation ton amour
        selon tes promesses à ton serviteur !
        Que vienne à moi ta tendresse, et je vivrai :
        ta loi fait mon plaisir.

        Aussi j’aime tes volontés,
        plus que l’or le plus précieux.
        Je me règle sur chacun de tes préceptes,
        je hais tout chemin de mensonge.

        Quelle merveille, tes exigences,
        aussi mon âme les garde !
        Déchiffrer ta parole illumine,
        et les simples comprennent.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 12, 46-50
      headline: |-
        « Étendant la main vers ses disciples, il dit : “Voici ma mère et mes frères” »
      acclamationAntiphon: |-
        Celui qui fait la volonté de Dieu,
        celui-là est pour moi un frère, une sœur, une mère.
      acclamationAntiphonReference: Mc 3, 35
      content: |-
        En ce temps-là,
        comme Jésus parlait encore aux foules,
        voici que sa mère et ses frères se tenaient au-dehors,
        >cherchant à lui parler.
        Quelqu’un lui dit :
        >« Ta mère et tes frères sont là, dehors,
        qui cherchent à te parler. »
        Jésus lui répondit :
        >« Qui est ma mère,
        et qui sont mes frères ? »
        Puis, étendant la main vers ses disciples, il dit :
        >« Voici ma mère et mes frères.
        Car celui qui fait la volonté de mon Père qui est aux cieux,
        >celui-là est pour moi un frère, une sœur, une mère. »
  offeringPrayer:
  - |-
    Fais-nous recueillir, Seigneur,
    >les fruits de l’offrande que nous te dédions, *
    afin qu’à l’exemple de sainte Kateri Tekakwitha,
    nous soyons libres de ce qui vient de la terre /
    >et vivions plus intensément selon l’esprit.
    Par le Christ, notre Seigneur.
  prefaceList:
    - saints_1
    - saints_2
  communionAntiphon:
  - biblicalReference: cf. Lc 10,42
    content: |-
      Sainte Kateri Tekakwitha, vigilante et fidèle,
      >a choisi la meilleure part :
      elle ne lui sera pas enlevée (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >que la communion au Corps et au Sang de ton Fils
    >nous détourne de toute chose périssable ; *
    ainsi pourrons-nous,
    >à l’exemple de sainte Kateri Tekakwitha,
    progresser sur terre dans un sincère amour pour toi, /
    >et connaître au ciel la joie de te contempler sans fin.
    Par le Christ, notre Seigneur.
