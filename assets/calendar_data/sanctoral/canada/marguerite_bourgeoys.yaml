celebration:
  title: Sainte Marguerite Bourgeoys
  subtitle: vierge
  description: Marguerite Bourgeoys (1620-1700), née à Troyes, avait vingt-trois ans quand elle arriva à Montréal comme institutrice. Après des débuts difficiles, elle put fonder une petite communauté, appelée à devenir la Congrégation des Sœurs de Notre-Dame (1698). Une intrigante lui suscita de vives oppositions, qu’elle supporta avec abnégation.
  commons:
    - virgins
  color: white

oration:
  - Seigneur Dieu, tu as appelé sainte Marguerite Bourgeoys à quitter son pays, au nom de sa foi, pour former la jeunesse à la vie chrétienne ; fais qu’à son exemple et à sa prière, nous puissions, par nos paroles et notre conduite, proclamer, sur toutes les routes qui mènent à toi, la présence et l’amour du Verbe incarné.

readings:
  patristicReading:
    - title: TESTAMENT SPIRITUEL DE MARGUERITE BOURGEOYS
      content: |-
        Je fais comparaison du collège des Apôtres avec la Congrégation, à une étoile qui est au firmament et un brin de neige qui tombe en forme d’étoile et qui se fond à la moindre chaleur, et je dis que Notre Seigneur, voulant instruire tout le monde de sa doctrine et de son Évangile, a choisi des hommes grossiers et peu estimés des gens du monde. La Sainte Vierge, ayant reçu de Dieu le domaine de la Nouvelle-France, par les prières qui lui ont été faites par les personnes qui ont été les premières, par sa divine bonté, elle a eu dessein de faire instruire des petites filles en bonnes chrétiennes, pour en faire ensuite de bonnes mères de famille et, pour cela, a choisi de pauvres filles sans esprit, sans conduite, sans talent et sans biens.
        Les Apôtres ont été envoyés, au nom de Notre Seigneur, et ils ont fait des merveilles. Les filles de la Congrégation sont envoyées faire école, sous la protection de la sainte Vierge, et elles apprennent aux filles comme si elles étaient bien savantes.
        Les Apôtres vont sans bourse ni double robe. Les filles de la Congrégation vont faire l’école sans aucune assurance de leur vie et le moins de hardes qu’elles peuvent.
        Les apôtres se sont confiés en Dieu (qui) les a nourris où il n’y avait point de vivres. Les filles de la Congrégation laissent le soin de leurs besoins entre les mains de la Très Sainte Vierge et elles ne manquent jamais du nécessaire.
        Les apôtres ont été infidèles en quittant Notre Seigneur, au temps de sa passion, et ont eu besoin du Saint-Esprit pour les fortifier. Les filles de la Congrégation sont timides et lentes à se perfectionner, et elles ont besoin du secours de la très Sainte Vierge pour obtenir le divin Esprit, pour les encourager.
        Les apôtres ont été dans tous les quartiers du monde. Les filles de la Congrégation sont prêtes d’aller dans tous les lieux de ce pays où elles seront envoyées.
        Les apôtres ont donné leur vie, leurs travaux et tout ce qu’ils pouvaient prétendre au monde, pour faire connaître Dieu. Les filles de la Congrégation abandonnent leur santé, leur satisfaction et leur repos, pour l’instruction des filles à la vie chrétienne et aux bonnes mœurs.
        Les apôtres ont attendu le Saint-Esprit en prière et retraite. Les filles de la Congrégation doivent aimer leur chambre après leurs instructions, pour obtenir les grâces du Saint-Esprit.
        Les apôtres travaillaient même les nuits pour gagner leur vie et n’être à charge de personne. Les filles de la Congrégation travaillent pour les mêmes fins.
        Les apôtres n’ont jamais repris ce qu’ils ont une fois quitté. Les filles de la Congrégation ne retournent jamais à leurs biens quand elles les ont quittés et en laissent la disposition à leur Supérieure.
        On demande aux apôtres s’ils boiraient bien le calice. On demande aux filles de la Congrégation si elles peuvent embrasser la pauvreté et le mépris.
        Les apôtres instruisaient gratis et, pour cela, ils se contentaient de peu et se privaient de tout. Les filles de la Congrégation sont pauvrement partout.
        Les apôtres ont prêché l’Évangile. Les filles de la Congrégation le doivent enseigner en suivant ses maximes et montrer bon exemple de modestie, de prudence et humilité.
      responsory: |-
        R/ Ta parole, Seigneur, est lumière dans la nuit.

        Vers qui pouvons-nous aller, Seigneur ?
        Toi seul nous conduis au Royaume.

        Heureux qui suit jusqu’au bout
        le chemin que tu lui traces.

        Heureux qui médite en son cœur
        les voies mystérieuses de l’amour.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 15,5a.6a
    content: |-
      Tu es, Seigneur, mon partage et ma coupe :
      >la part qui me revient fait mes délices.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as appelé sainte Marguerite Bourgeoys
    >à quitter son pays, au nom de sa foi,
    >pour former la jeunesse à la vie chrétienne ; *
    fais qu’à son exemple et à sa prière,
    >nous puissions, par nos paroles et notre conduite, /
    >proclamer, sur toutes les routes qui mènent à toi,
    >la présence et l’amour du Verbe incarné.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 2, 1-11
      headline: |-
        « Prépare-toi à subir l’épreuve »
      content: |-
        Mon fils,
        si tu viens te mettre au service du Seigneur,
        >prépare-toi à subir l’épreuve ;
        fais-toi un cœur droit, et tiens bon ;
        >ne t’agite pas à l’heure de l’adversité.
        Attache-toi au Seigneur, ne l’abandonne pas,
        >afin d’être comblé dans tes derniers jours.
        Toutes les adversités, accepte-les ;
        >dans les revers de ta pauvre vie, sois patient ;
        car l’or est vérifié par le feu,
        >et les hommes agréables à Dieu, par le creuset de l’humiliation.
        Dans les maladies comme dans le dénuement, aie foi en lui.
        Mets ta confiance en lui, et il te viendra en aide ;
        >rends tes chemins droits, et mets en lui ton espérance.
        Vous qui craignez le Seigneur, comptez sur sa miséricorde,
        >ne vous écartez pas du chemin, de peur de tomber.
        Vous qui craignez le Seigneur, ayez confiance en lui,
        >et votre récompense ne saurait vous échapper.
        Vous qui craignez le Seigneur, espérez le bonheur,
        >la joie éternelle et la miséricorde :
        >ce qu’il donne en retour est un don éternel, pour la joie.
        Considérez les générations passées et voyez :
        Celui qui a mis sa confiance dans le Seigneur,
        >a-t-il été déçu ?
        Celui qui a persévéré dans la crainte du Seigneur,
        >a-t-il été abandonné ?
        Celui qui l’a invoqué,
        >a-t-il été méprisé ?
        Car le Seigneur est tendre et miséricordieux,
        >il pardonne les péchés,
        >et il sauve au moment de la détresse.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5a.9
      refAbbr: cf. 111, 1
      chorus:
      - chorusRef: cf. 111, 1
        content: |-
          Heureux celui qui aime la volonté de Dieu !
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        à pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira, et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: |-
        « Ce n’est pas vous qui m’avez choisi, c’est moi qui vous ai choisis »
      acclamationAntiphon: |-
        C’est moi qui vous ai choisis du milieu du monde,
        afin que vous alliez, que vous portiez du fruit,
        et que votre fruit demeure, dit le Seigneur.
      acclamationAntiphonReference: cf. Jn 15, 16
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Comme le Père m’a aimé,
        >moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        >vous demeurerez dans mon amour,
        >comme moi, j’ai gardé les commandements de mon Père,
        >et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        >et que votre joie soit parfaite.
        Mon commandement, le voici :
        >Aimez-vous les uns les autres
        >comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        >que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        >si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        >car le serviteur ne sait pas ce que fait son maître ;
        >je vous appelle mes amis,
        >car tout ce que j’ai entendu de mon Père,
        >je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        >c’est moi qui vous ai choisis et établis
        >afin que vous alliez,
        >que vous portiez du fruit,
        >et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        >il vous le donnera.
        Voici ce que je vous commande :
        >c’est de vous aimer les uns les autres. »
  offeringPrayer:
  - |-
    Accepte, Seigneur,
    >l’humble hommage que nous te présentons
    >en la fête de sainte Marguerite Bourgeoys ; *
    et par ce sacrifice pur et parfait, /
    >fais-nous brûler d’amour en ta présence.
    Par le Christ, notre Seigneur.
  prefaceList:
    - saints_1
    - saints_2
  communionAntiphon:
  - biblicalReference: Lc 1,46b-48
    content: |-
      Mon âme exalte le Seigneur,
      >exulte mon esprit en Dieu, mon Sauveur !
      Il s’est penché sur son humble servante ;
      >désormais tous les âges me diront bienheureuse.
  prayerAfterCommunion:
  - |-
    Nourris et comblés de ce sacrement du salut,
    >nous implorons ta bonté, Seigneur ; *
    fais qu’en pratiquant la charité
    >à l’imitation de sainte Marguerite Bourgeoys, /
    >nous ayons part à sa gloire.
    Par le Christ, notre Seigneur.
