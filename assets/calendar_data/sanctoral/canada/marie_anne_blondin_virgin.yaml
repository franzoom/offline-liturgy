celebration:
  title: Bienheureuse Marie-Anne Blondin
  subtitle: vierge
  description: Née le 18 avril 1809 à Terrebonne (Québec), Esther Blondin (mère Marie-Anne) apprend à lire et à écrire à 22 ans. Pour remédier à l’analphabétisme, elle fonde à Vaudreuil, en 1850, la Congrégation des Sœurs de Sainte-Anne pour l’éducation chrétienne des enfants pauvres. En 1854, pour mettre fin au conflit qui oppose le nouvel aumônier à la supérieure, Mgr Bourget destitue mère Marie-Anne. Commence alors pour elle une période de 36 ans d’exclusion et d’obscurs labeurs, vécus dans l’humilité, le pardon et une paix intérieure. Décédée le 2 janvier 1890, elle a été béatifiée par saint Jean-Paul II le 29 avril 2001.
  commons:
    - virgins
  color: white

oration: |-
  Seigneur, la bienheureuse Marie-Anne Blondin a trouvé, dans la contemplation du mystère de la Croix, la force de te suivre sur le chemin des tribulations et d’accomplir mystérieusement la mission d’éducation que tu lui avais confiée ; accorde-nous, par son intercession, la grâce de trouver, dans ton mystère pascal, le véritable sens de notre existence, et la grâce de te faire connaître aux personnes vers qui tu nous envoies.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur, la bienheureuse Marie-Anne Blondin
    >a trouvé, dans la contemplation du mystère de la Croix,
    >la force de te suivre sur le chemin des tribulations
    et d’accomplir mystérieusement
    >la mission d’éducation que tu lui avais confiée ; *
    accorde-nous, par son intercession,
    >la grâce de trouver, dans ton mystère pascal,
    >le véritable sens de notre existence, /
    et la grâce de te faire connaître
    >aux personnes vers qui tu nous envoies.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
