celebration:
  title: Sainte Marie de l’Incarnation
  subtitle: religieuse
  description: |-
    Marie Guyart (1599-1672), née à Tours, entre au monastère des Ursulines après avoir été mariée et avoir confié à sa sœur l’éducation de son fils. Arrivée à Québec en 1639, elle bâtit un monastère et entreprend d’écrire des manuels scolaires en langue indigène. Elle rédige une relation autobiographique pour son fils : ses états d’oraison et de grâce la placent parmi les grands maîtres de la vie spirituelle. 
  commons:
    - saints-female_religious
  color: white

oration: |-
  Seigneur Dieu, tu as conduit sainte Marie de l’Incarnation jusqu’à la contemplation du mystère de la Trinité, et tu as fait d’elle un apôtre au cœur de feu ; accorde-nous, à son intercession et suivant son exemple, de vivre en témoins de ton amour, pour que soient toujours plus nombreux ceux qui parviennent à te connaître, t’aimer et te servir.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Mt 5,19
    content: |-
      Celui qui enseignera aux hommes les commandements
      >et les observera,
      celui-là sera déclaré grand
      >dans le Royaume (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as conduit sainte Marie de l’Incarnation
    >jusqu’à la contemplation du mystère de la Trinité,
    >et tu as fait d’elle un apôtre au cœur de feu ; *
    accorde-nous, à son intercession
    >et suivant son exemple,
    >de vivre en témoins de ton amour, /
    pour que soient toujours plus nombreux
    >ceux qui parviennent à te connaître,
    >t’aimer et te servir.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 3, 14-19
      headline: |-
        « Vous connaîtrez ce qui surpasse toute connaissance : l’amour du Christ »
      content: |-
        Frères,
        je tombe à genoux devant le Père,
        >de qui toute paternité au ciel et sur la terre tient son nom.
        Lui qui est si riche en gloire,
        >qu’il vous donne la puissance de son Esprit,
        >pour que se fortifie en vous l’homme intérieur.
        Que le Christ habite en vos cœurs par la foi ;
        >restez enracinés dans l’amour, établis dans l’amour.
        Ainsi vous serez capables de comprendre avec tous les fidèles
        >quelle est la largeur, la longueur, la hauteur, la profondeur…
        Vous connaîtrez ce qui dépasse toute connaissance :
        >l’amour du Christ.
        Alors vous serez comblés
        >jusqu’à entrer dans toute la plénitude de Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6.9, 10-11
      refAbbr: cf. 33, 2
      chorus:
      - chorusRef: cf. 33, 2
        content: |-
          Je bénirai le Seigneur toujours et partout.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 1-12a
      headline: |-
        « Réjouissez-vous, soyez dans l’allégresse, car votre récompense est grande dans les cieux ! »
      acclamationAntiphon: |-
        Venez à moi,
        vous tous qui peinez sous le poids du fardeau,
        dit le Seigneur,
        et moi, je vous procurerai le repos.
      acclamationAntiphonReference: Mt 11, 28
      content: |-
        En ce temps-là,
        voyant les foules, Jésus gravit la montagne.
        Il s’assit, et ses disciples s’approchèrent de lui.
        Alors, ouvrant la bouche, il les enseignait.
        Il disait :
        >« Heureux les pauvres de cœur,
        >car le royaume des Cieux est à eux.
        Heureux ceux qui pleurent,
        >car ils seront consolés.
        Heureux les doux,
        >car ils recevront la terre en héritage.
        Heureux ceux qui ont faim et soif de la justice,
        >car ils seront rassasiés.
        Heureux les miséricordieux,
        >car ils obtiendront miséricorde.
        Heureux les cœurs purs,
        >car ils verront Dieu.
        Heureux les artisans de paix,
        >car ils seront appelés fils de Dieu.
        Heureux ceux qui sont persécutés pour la justice,
        >car le royaume des Cieux est à eux.
        Heureux êtes-vous si l’on vous insulte,
        >si l’on vous persécute
        >et si l’on dit faussement toute sorte de mal contre vous,
        >à cause de moi.
        Réjouissez-vous, soyez dans l’allégresse,
        >car votre récompense est grande dans les cieux ! »
  offeringPrayer:
  - |-
    Accepte, Seigneur, le sacrifice
    >que ton peuple consacré t’offre aujourd’hui
    >en l’honneur de sainte Marie de l’Incarnation ; *
    que notre participation à ce mystère /
    >fasse de nous les témoins de ta charité.
    Par le Christ, notre Seigneur.
  prefaceList:
    - saints_1
    - saints_2
  communionAntiphon:
  - biblicalReference: Jn 8,12
    content: |-
      Je suis la lumière du monde, dit le Seigneur.
      Celui qui me suit ne marchera pas dans les ténèbres,
      >il aura la lumière de la vie (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Dieu tout-puissant, +
    >fais que nous trouvions un soutien
    >dans ce repas sacré, *
    pour qu’à l’exemple de sainte Marie de l’Incarnation,
    >notre cœur et toute notre vie
    >témoignent de notre charité fraternelle /
    >et du rayonnement de la vérité.
    Par le Christ, notre Seigneur.
