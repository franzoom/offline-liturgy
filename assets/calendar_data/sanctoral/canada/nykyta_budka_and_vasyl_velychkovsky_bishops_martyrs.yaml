    Dieu éternel et tout-puissant, +
    >transforme en force notre faiblesse ; *
    comme tu as donné à tes martyrs Nykyta, Vasyl et leurs compagnons
    >le courage de témoigner de l’Évangile du Christ
    >au point de donner leur vie, /
    donne-nous le courage de vivre
    >en fidèles témoins de ton amour.
    Par Jésus Christ, ton Fils, notre Seigneur, +
