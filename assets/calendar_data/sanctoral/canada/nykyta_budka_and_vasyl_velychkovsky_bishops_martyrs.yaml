celebration:
  title: Bienheureux Nykyta Budka et Vasyl Velychkovsky
  subtitle: évêques et martyrs
  description: |-
    Né en 1877 en Galicie, Nykyta Budka deviendra en 1912 le premier évêque de l’Église grecque catholique ukrainienne au Canada. Il servira avec zèle la population immigrante ukrainienne du Cap-Breton jusqu’à Vancouver jusqu’en 1927, année où il ­rentrera en Europe pour des raisons de santé. En 1945, il sera arrêté à Lviv par les bolchéviques et exilé en Sibérie. Il mourra en martyr de la foi au Kazakhstan en 1949.
    Vasyl Velychkovsky verra le jour en 1903 à Stanislav, en Galicie. Il commence son ministère presbytéral comme rédemptoriste dans l’Église grecque catholique ukrainienne. Incarcéré en 1945 pour propagande antisoviétique, il refuse de renier sa foi et est condamné à mort. Quelques minutes avant son exécution, la sentence est commuée. Il passera alors dix ans dans un camp de travaux forcés dans le nord de la Russie. À son retour en Ukraine, clandestinement, il assistera la communauté catholique jusqu’à son ordination épiscopale en 1959. Arrêté de nouveau dix ans plus tard, il sera torturé et croupira en prison avant de quitter l’Europe pour Winnipeg, en 1972. Il mourra un an plus tard.
    Nykyta Budka et Vasyl Velychkovsky, ainsi que vingt-cinq autres martyrs du régime soviétique, ont été béatifiés par le pape saint Jean-Paul II en 2001. Le bienheureux Vasyl Velychkovsky a été proclamé patron des aumôniers de prison.
  commons:
    - martyrs
    - pastors_bishop
  color: red

oration: |-
  Dieu éternel et tout-puissant, transforme en force notre faiblesse ; comme tu as donné à tes martyrs Nykyta, Vasyl et leurs compagnons le courage de témoigner de l’Évangile du Christ au point de donner leur vie, donne-nous le courage de vivre en fidèles témoins de ton amour.

mass:
