celebration:
  title: Fête du travail
  description: null
  commons:
    - null
  color: white

oration: |-
  Seigneur Dieu, par le travail humain, tu mènes à son achèvement l’œuvre immense de la création et tu ne cesses de la diriger ; écoute la prière du peuple qui te supplie : accorde à tous les hommes d’avoir un travail qui respecte leur dignité ; qu’en s’efforçant d’améliorer leur propre sort, ils soient plus solidaires dans le service de leurs frères. 

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Gn 1,1.27.31
    content: |-
      Au commencement, Dieu créa le ciel et la terre.
      Dieu créa l’homme à son image.
      Dieu vit tout ce qu’il avait fait :
      >cela était très bon.
      Ou bien : cf. Ps 89, 17
      Que vienne sur nous ta douceur, Seigneur !
      Consolide pour nous l’ouvrage de nos mains.
  collect:
  - |-
    Dieu, Créateur de l’univers, +
    >tu as voulu associer l’être humain à ton ouvrage ; *
    regarde le travail que nous avons à faire :
    >qu’il nous permette de gagner notre vie, /
    >et serve, par ta grâce, à l’avènement du royaume du Christ.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
    Ou bien :
    S eigneur Dieu, +
    >par le travail humain, tu mènes à son achèvement
    >l’œuvre immense de la création
    >et tu ne cesses de la diriger ; *
    écoute la prière du peuple qui te supplie :
    accorde à tous les hommes
    >d’avoir un travail qui respecte leur dignité ; /
    qu’en s’efforçant d’améliorer leur propre sort,
    >ils soient plus solidaires dans le service de leurs frères.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Seigneur Dieu, +
    >dans les offrandes qui te sont présentées,
    >tu donnes au genre humain les nourritures de cette vie
    >et le sacrement d’une vie nouvelle ; *
    nous t’en prions :
    fais que nos corps et nos esprits /
    >ne soient jamais privés de leur soutien.
    Par le Christ, notre Seigneur.
  prefaceList:
  - sundays_in_ordinary_time_5
  communionAntiphon:
  - biblicalReference: Col 3,17
    content: |-
      Tout ce que vous dites, tout ce que vous faites,
      que ce soit toujours au nom du Seigneur Jésus Christ,
      >en offrant par lui votre action de grâce à Dieu le Père.
  prayerAfterCommunion:
  - |-
    Nous avons pris part, Seigneur,
    >à la table de l’unité et de la charité ; *
    nous t’en supplions :
    dans ta bienveillance, donne-nous d’accomplir
    >les tâches que tu nous as confiées, /
    >pour subvenir à notre vie sur la terre
    >et travailler avec confiance
    >à la construction de ton royaume.
    Par le Christ, notre Seigneur.
