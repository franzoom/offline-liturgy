celebration:
  title: Sainte Bernadette Soubirous
  subtitle: vierge
  description: |-
    Bernadette Soubirous (1844-1879), l’humble voyante de Lourdes, est aussi la religieuse qui vécut à Nevers les treize dernières années de sa vie, effacée et silencieuse, persuadée de n’être « bonne à rien », toute recueillie dans le souvenir de la parole que Marie lui avait dite : « Je ne vous promets pas de vous rendre heureuse en ce monde, mais dans l’autre. »
  commons:
  - virgins
  color: white

oration:
- Tu prends la défense des humbles, Seigneur, tu les aimes et les glorifies, et tu as donné à sainte Bernadette d’étonnantes grâces de patience et de charité ; fais qu’à sa prière et à son exemple, en suivant simplement les chemins de la foi, nous puissions te contempler dans le royaume des Cieux.

readings:
  patristicReading:
  - title: RÉCIT DE BERNADETTE À SON INFIRMIÈRE
    subtitle: (6 octobre 1874)
    content: |-
      J’entendis un grand coup de vent derrière moi ; je tourna la tête, mais je ne vis rien. J’étais occupée à quitter mes bas pour passer un petit ruisseau et aller avec mes compagnes qui étaient déjà passées. J’entendis un autre coup de vent, enfin un troisième. Je me tourne et je vois une grande Dame vêtue de blanc, ayant une ceinture bleue et un chapelet à la main, la chaîne en or, les grains blancs. Elle était à cinq ou six pas de moi, élevée à deux mètres au-dessus de la terre. Je me mis à me frotter les yeux, car j’avais bien peur. Le lendemain, je pris de l’eau bénite et je lui en jetai, ce qui la faisait sourire. Elle ne me parla que le troisième jour. Je lui jetai encore de l’eau bénite. Je croyais que c’était le diable. La frayeur m’empêchait de faire le signe de la croix. Monsieur le Curé m’avait dit de lui demander qui elle était. Elle me dit : « Va dire aux prêtres : Quessiou l’Immaculée Conceptioun » (je ne comprenais pas bien le français). Crainte de l’oublier, je le répétai tout le chemin.
      Le troisième jour, elle me dit de venir pendant quinze jours a la grotte. J’y allai, mais elle ne me parlait pas tous les jours. Elle me dit : « Qual pregata pecadous ». Quand elle me dit cela, sa figure devint triste. Je ne l’ai cependant pas vue pleurer. Elle me dit aussi de boire. J’allai à la rivière. Elle me fit signe de gratter la terre avec mes doigts. Je le fis. C’était comme de la boue. Elle me dit den boire. J’en pris dans le creux de la main, mais je la jetai et lui dis qu’elle était sale. Enfin à la quatrième fois, j’en bus ; et tous les jours quand j’allai à la grotte, l’eau était plus claire et plus abondante. Quand elle me dit : « Ques-siou l’Immaculée Conceptioun », elle avait d’abord les mains jointes et son chapelet entre les doigts, comme si elle avait voulu le dire. Tout d’un coup, elle ouvrit les bras, le chapelet glissa jusqu’au coude ; elle étendit ses mains l’une contre l’autre ; elle leva les yeux au ciel. Elle était jolie, sa peau était blanche, une petite rougeur sur chaque joue, et les yeux bleus.
    responsory: |-
      R/ Mon âme exalte le Seigneur :
      éternel est son amour !
      V/ Chante et réjouis-toi, fille de Sion,
      ton Dieu est au milieu de toi. R/
      V/ Dieu pour toi exulte de joie,
      il te renouvelle par son amour. R/

morning:
  evangelicAntiphon:
    common:

    - Béni sois-tu, Seigneur du ciel et de la terre, d’avoir révélé aux tout-petits les mystères du Royaume.
vespers:
  evangelicAntiphon:
    common:
    - Béni sois-tu, Seigneur du ciel et de la terre, d’avoir révélé aux tout-petits les mystères du Royaume.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Tu prends la défense des humbles, Seigneur, +
    >tu les aimes et les glorifies,
    et tu as donné à sainte Bernadette
    >d’étonnantes grâces de patience et de charité ; *
    fais qu’à sa prière et à son exemple,
    >en suivant simplement les chemins de la foi, /
    >nous puissions te contempler dans le royaume des Cieux.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 26-31
      headline: |-
        « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        >ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        >voilà ce que Dieu a choisi,
        >pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        >lui qui est devenu pour nous sagesse venant de Dieu,
        >justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        >Celui qui veut être fier,
        >qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      refAbbr: null
      chorus:
      - chorusRef: null
        content: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 12, 24-26
      headline: |-
        « Si le grain meurt, il porte beaucoup de fruit »
      acclamationAntiphon: |-
        En toi, Seigneur, est la source de vie ;
        par ta lumière, nous voyons la lumière.
      acclamationAntiphonReference: Ps 35, 10
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Amen, amen, je vous le dis :
        >si le grain de blé tombé en terre ne meurt pas,
        >il reste seul ;
        >mais s’il meurt,
        >il porte beaucoup de fruit.
        Qui aime sa vie
        >la perd ;
        >qui s’en détache en ce monde
        >la gardera pour la vie éternelle.
        Si quelqu’un veut me servir,
        >qu’il me suive ;
        >et là où moi je suis,
        >là aussi sera mon serviteur.
        Si quelqu’un me sert,
        >mon Père l’honorera. »
