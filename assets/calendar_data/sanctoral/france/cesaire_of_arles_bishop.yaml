celebration:
  title: Saint Césaire d’Arles
  subtitle: évêque
  description: Moine de Lérins, puis évêque d’Arles pendant quarante ans (503-543), Césaire s’affirma comme un chef, dont l’influence s’exerça sur la Gaule méridionale et l’Espagne. Il sut à la fois protéger son peuple contre les exactions des Barbares et l’enseigner par des homélies simples et vivantes. Mais il parla aussi en docteur dans les conciles qu’il présida.
  commons:
  - pastors_bishop
  color: white

oration:
- Tu as donné, Seigneur, à saint Césaire d’Arles une grande aptitude pour enseigner au peuple ta Parole ; daigne ouvrir nos esprits et nos cœurs au message qu’il nous a transmis avec fidélité et conviction.

readings:
  patristicReading:
  - title: MONITION DE SAINT CÉSAIRE SUR LA MÉDITATION DE LA PAROLE DE DIEU
    content: |-
      Que le Christ vous aide, frères très chers, à toujours accueillir la lecture de la parole de Dieu avec un cœur avide et assoiffé : ainsi votre obéissance très fidèle vous remplira de joie spirituelle. Mais si vous voulez que les saintes Écritures aient pour vous de la douceur et que les préceptes divins vous profitent autant qu’il le faut, soustrayez-vous pendant quelques heures à vos préoccupations profanes. Relisez dans vos maisons les paroles de Dieu, consacrez-vous entièrement à sa miséricorde. Ainsi vous réussirez à réaliser en vous ce qui est écrit de l’homme bienheureux : %Il méditera jour et nuit la loi du Seigneur%. Et aussi : %Heureux ceux qui scrutent ses commandements, ils le recherchent de tout leur cœur%. Et enfin : %J’ai mis tes paroles au fond de mon cœur, pour ne pas pécher contre toi%. En effet, comme vous venez de l’entendre, celui qui met les paroles de Dieu au fond de son cœur ne pèche pas ; de même, celui qui n’agit pas ainsi ne cesse pas de pécher.
      En effet, les commerçants ne se contentent pas de chercher à faire des bénéfices sur une seule marchandise ; ils s’en procurent un grand nombre pour augmenter leur fortune. Les cultivateurs s’efforcent de semer différentes sortes de semences afin de pouvoir se préparer une nourriture suffisante pour eux-mêmes et les leurs. Combien plus, lorsqu’il s’agit de bénéfices spirituels, ne devez-vous pas vous contenter d’entendre lire la parole de Dieu à l’église ; vous devez prolonger la lecture sacrée dans vos maisons, au cours de vos repas ; et quand les jours sont courts, y consacrer encore quelques heures de la nuit. C’est ainsi que vous pourrez amasser un froment spirituel dans le grenier de votre cœur et ranger dans le trésor de vos âmes les perles précieuses des Écritures ; ainsi, au jour du jugement, lorsque nous comparaîtrons devant le tribunal du Juge éternel, selon la parole de l’Apôtre, nous serons trouvés vêtus et non pas nus.

    responsory: |-
      R/ J’ouvre mon cœur, Seigneur,
      à ta parole de lumière.
      
      Cantique pour moi que tes volontés
      en ma demeure d’étranger.
      
      Heureux les humbles, heureux les pauvres :
      tu leur découvres le secret du Royaume !

mass:
- massType: DAY_MASS
  collect:
  - |-
    Tu as donné, Seigneur, au bienheureux Césaire d’Arles
    >une grande aptitude pour enseigner au peuple ta Parole ; *
    daigne ouvrir nos cœurs
    >au message qu’il nous a transmis /
    >avec fidélité et conviction.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 20, 17-18a.28-32.36
      headline: |-
        « Veillez sur vous-mêmes, et sur tout le troupeau dont l’Esprit Saint vous a établis responsables pour être les pasteurs de l’Église de Dieu »
      content: |-
        En ces jours-là,
        depuis Milet, Paul envoya un message à Éphèse
        >pour convoquer les Anciens de cette Église.
        Quand ils furent arrivés auprès de lui, il leur adressa la parole :
        >« Veillez sur vous-mêmes, et sur tout le troupeau
        >dont l’Esprit Saint vous a établis responsables,
        >pour être les pasteurs de l’Église de Dieu,
        >qu’il s’est acquise par son propre sang.
        Moi, je sais qu’après mon départ,
        >des loups redoutables s’introduiront chez vous
        >et n’épargneront pas le troupeau.
        Même du milieu de vous surgiront des hommes
        >qui tiendront des discours pervers
        >pour entraîner les disciples à leur suite.
        Soyez donc vigilants,
        >et souvenez-vous que, durant trois ans,
        >nuit et jour,
        >je n’ai cessé, dans les larmes,
        >de reprendre chacun d’entre vous.
        Et maintenant, je vous confie à Dieu
        >et à la parole de sa grâce,
        >lui qui a le pouvoir de construire l’édifice
        >et de donner à chacun l’héritage
        >en compagnie de tous ceux qui ont été sanctifiés. »
        Quand Paul eut ainsi parlé,
        il s’agenouilla et pria avec eux tous.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 109 (110), 1, 2, 3, 4
      refAbbr: cf. 109, 4
      chorus:
      - chorusRef: cf. 109, 4
        content: |-
          Tu es prêtre à jamais
          selon l’ordre de Melkisédek.
      content: |-
        Oracle du Seigneur à mon seigneur :
        « Siège à ma droite,
        et je ferai de tes ennemis
        le marchepied de ton trône. »

        De Sion, le Seigneur te présente
        le sceptre de ta force :
        « Domine jusqu’au cœur de l’ennemi. »

        Le jour où paraît ta puissance,
        tu es prince, éblouissant de sainteté :
        « Comme la rosée qui naît de l’aurore,
        je t’ai engendré. »

        Le Seigneur l’a juré
        dans un serment irrévocable :
        « Tu es prêtre à jamais
        selon l’ordre du roi Melkisédek. »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 4, 1-9
      headline: |-
        « Voici que le semeur sortit pour semer »
      acclamationAntiphon: |-
        La parole de Dieu est semée en nos cœurs.
        Heureux qui la reçoit et la fait fructifier !
      content: |-
        En ce temps-là,
        Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
        Une foule très nombreuse se rassembla auprès de lui,
        >si bien qu’il monta dans une barque où il s’assit.
        Il était sur la mer,
        >et toute la foule était près de la mer, sur le rivage.
        Il leur enseignait beaucoup de choses en paraboles,
        et dans son enseignement il leur disait :
        >« Écoutez ! Voici que le semeur sortit pour semer.
        Comme il semait,
        >du grain est tombé au bord du chemin ;
        les oiseaux sont venus et ils ont tout mangé.
        Du grain est tombé aussi sur du sol pierreux,
        >où il n’avait pas beaucoup de terre ;
        il a levé aussitôt,
        >parce que la terre était peu profonde ;
        et lorsque le soleil s’est levé, ce grain a brûlé
        >et, faute de racines, il a séché.
        Du grain est tombé aussi dans les ronces,
        >les ronces ont poussé, l’ont étouffé,
        >et il n’a pas donné de fruit.
        Mais d’autres grains sont tombés dans la bonne terre ;
        >ils ont donné du fruit
        >en poussant et en se développant,
        et ils ont produit
        >trente, soixante, cent, pour un. »
        Et Jésus disait :
        >« Celui qui a des oreilles pour entendre,
        qu’il entende ! »
