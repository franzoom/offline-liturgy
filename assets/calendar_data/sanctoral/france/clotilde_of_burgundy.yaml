celebration:
  title: Sainte Clotilde
  commons:
    - saints-female_married
  description: Le nom de Clotilde apparaît dans tous les récits relatifs à la conversion de Clovis. On sait moins que l’épouse du roi franc, à qui elle donna cinq enfants, traversa les épreuves les plus tragiques. Devenue veuve (511), elle vit l’un de ses fils égorger les enfants de son frère. Brisée dans son affection, elle se retira à Tours, où elle mourut en 545.
  locative: en France
  color: white

readings:
  patristicReading:
    - title: DE L’HISTOIRE DES FRANCS PAR GRÉGOIRE DE TOURS
      subtitle: Jésus Christ, toi que Clotilde proclame le Fils du Dieu vivant
      content: |-
        Le roi Clovis eut de la reine Clotilde son fils premier-né. Comme cette femme voulait le consacrer par le baptême, elle prêchait assidûment son mari en lui disant : « Les dieux que vous adorez ne sont rien. Ils n’ont pu être d’aucun secours ni pour eux-mêmes ni pour les autres. »
        Cette reine pleine de foi présente son fils au baptême. Elle fait orner l’église de rideaux et de tentures, afin que cette célébration attire plus facilement à la foi celui qui n’avait pu être influencé par la prédication. Mais une fois baptisé, l’enfant, qu’on avait appelé Ingomer, mourut encore revêtu des vêtements blancs de sa nouvelle naissance. Le roi fut saisi de colère et il accablait la reine de ses reproches : « Si l’enfant avait été consacré à mes dieux, certainement il vivrait. Mais maintenant, parce qu’il a été baptisé au nom de ton Dieu, il devait mourir. » La reine répondait : « Je rends grâce à Dieu tout-puissant, Créateur de toute chose, de ce qu’il ne m’a pas jugée complètement indigne, puisqu’il a daigné accueillir dans son Royaume l’enfant sorti de mon sein. Cela ne fait pas souffrir mon cœur, car je sais que les nouveaux baptisés appelés hors de ce monde sont destinés à vivre dans la vision de Dieu. »
        Elle eut un autre fils après celui-là ; à son baptême elle l’appela Clodomir. Et comme il était tombé malade, le roi disait : « Il ne peut pas avoir un autre sort que son frère puisqu’il a été baptisé au nom de ton Christ, il va bientôt mourir. » Mais, à la prière de sa mère, il guérit sur l’ordre de Dieu.
        La reine ne cessait de prêcher au roi pour qu’il reconnaisse le vrai Dieu et abandonne ses idoles, mais elle ne parvenait par aucun moyen à l’ébranler en faveur de sa croyance, jusqu’à ce qu’un jour enfin, on fit la guerre contre les Alamans. Au cours de celle-ci, Clovis fut contraint par la nécessité de confesser ce que sa volonté avait précédemment refusé. Il arriva en effet que le conflit des deux armées aboutit à un grand massacre et que l’armée de Clovis fut exposée à une complète extermination. Voyant cela, il leva les yeux vers le ciel et, le cœur transpercé, ému jusqu’aux larmes, il dit : « Jésus Christ, toi que Clotilde proclame le Fils du Dieu vivant, toi dont on affirme que tu viens au secours de ceux qui souffrent, et que tu donnes la victoire à ceux qui espèrent en toi, je sollicite ardemment ta glorieuse assistance. Si tu m’accordes la victoire sur mes ennemis, si j’expérimente cette puissance dont le peuple consacré à ton nom proclame avoir bénéficié, je croirai en toi et je me ferai baptiser en ton nom. En effet, j’ai invoqué mes dieux, mais je constate qu’ils ont refusé de me secourir. Je crois donc qu’ils ne possèdent aucune puissance, puisqu’ils ne répondent pas à ceux qui leur obéissent. C’est toi que j’invoque maintenant, c’est en toi que je désire croire, pourvu que je sois délivré de mes adversaires. » Comme il parlait ainsi, les Alamans, tournant le dos, commencèrent à s’enfuir. Et, lorsqu’ils virent que leur roi avait été tué, ils firent leur soumission à Clovis, en disant : « De grâce, ne laisse plus périr le peuple : nous sommes à toi désormais. » Quant à lui, il arrêta le combat, obtint la soumission du peuple et, ayant rétabli la paix, rentra chez lui. Il raconta à la reine comment l’invocation du nom du Christ lui avait fait obtenir la victoire.
        Alors la reine convoqua en secret saint Rémi, évêque de Reims, en le priant d’inculquer au roi la parole du salut.
      responsory: |-
        R/ Ta parole, Seigneur, est lumière dans la nuit.

        Vers pouvons-nous aller, Seigneur ?
        Toi seul nous conduis au Royaume.

        Heureux qui suit jusqu’au bout
        le chemin que tu lui traces.

        Heureux qui médite en son cœur
        les voies mystérieuses de l’amour.
oration:
  - Regarde avec bonté, Seigneur, le peuple de France ; toi qui lui as fait don de la foi sur les instances de sainte Clotilde, accorde-lui maintenant, par son intercession, de s’attacher pleinement à ton service.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Regarde avec bonté, Seigneur,
    >le peuple de France ; *
    toi qui lui as fait le don de la foi
    >sur les instances de sainte Clotilde, /
    accorde-lui maintenant, par son intercession,
    >un attachement sincère à ton service.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1P 3, 1-6.9
      headline: |-
        La femme qui gagne son mari à la parole de Dieu
      content: |-
        Frères,
        je m’adresse aux femmes parmi vous :
        >soyez soumises à votre mari,
        pour que, même si certains refusent d’obéir à la parole de Dieu,
        >ils soient gagnés par la conduite de leur femme et non par des paroles,
        >en ouvrant les yeux devant votre attitude pure et pleine de respect.
        Que votre parure ne soit pas extérieure
        >– coiffure élaborée, bijoux d’or, vêtements recherchés –
        mais qu’elle soit une qualité d’humanité au plus intime de votre cœur,
        >parure impérissable d’un esprit doux et paisible :
        voilà ce qui a grande valeur devant Dieu.
        C’est cela qui faisait la parure des saintes femmes de jadis,
        >elles qui espéraient en Dieu, soumises chacune à leur mari,
        comme Sara qui obéissait à Abraham,
        >en l’appelant seigneur.
        Vous êtes devenues les filles de Sara en faisant le bien,
        >sans vous laisser troubler par aucune crainte.
        Je m’adresse maintenant à vous tous :
        Ne rendez pas le mal pour le mal,
        >ni l’insulte pour l’insulte ;
        au contraire, invoquez sur les autres la bénédiction,
        >car c’est à cela que vous avez été appelés,
        afin de recevoir en héritage cette bénédiction.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 65 (66), 13-14, 16-17, 18-19
      refAbbr: 65, 20ab
      chorus:
      - chorusRef: 65, 20ab
        content: |-
          Béni soit Dieu
          qui n’a pas écarté ma prière.
      content: |-
        Je viens dans ta maison avec des holocaustes,
        je tiendrai mes promesses envers toi,
        les promesses qui m’ouvrirent les lèvres,
        que ma bouche a prononcées dans ma détresse.

        Venez, écoutez, vous tous qui craignez Dieu :
        je vous dirai ce qu’il a fait pour mon âme ;
        quand je poussai vers lui mon cri,
        ma bouche faisait déjà son éloge.

        Si mon cœur avait regardé vers le mal,
        le Seigneur n’aurait pas écouté.
        Et pourtant, Dieu a écouté,
        il entend le cri de ma prière.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 7, 21-27
      headline: |-
        « La maison construite sur le roc et la maison construite sur le sable »
      acclamationAntiphon: |-
        Si quelqu’un m’aime, il gardera ma parole, dit le Seigneur ;
        mon Père l’aimera, et nous viendrons vers lui.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Ce n’est pas en me disant : “Seigneur, Seigneur !” qu’on entrera dans le royaume des Cieux,
        >mais c’est en faisant la volonté de mon Père qui est aux cieux.
        Ce jour-là, beaucoup me diront :
        >“Seigneur, Seigneur, n’est-ce pas en ton nom que nous avons prophétisé,
        en ton nom que nous avons expulsé les démons,
        >en ton nom que nous avons fait beaucoup de miracles ?”
        Alors je leur déclarerai :
        >“Je ne vous ai jamais connus.
        Écartez-vous de moi, vous qui commettez le mal !”
        Ainsi, celui qui entend les paroles que je dis là et les met en pratique
        >est comparable à un homme prévoyant
        >qui a construit sa maison sur le roc.
        La pluie est tombée, les torrents ont dévalé,
        >les vents ont soufflé et se sont abattus sur cette maison ;
        la maison ne s’est pas écroulée,
        >car elle était fondée sur le roc.
        Et celui qui entend de moi ces paroles sans les mettre en pratique
        >est comparable à un homme insensé
        >qui a construit sa maison sur le sable.
        La pluie est tombée, les torrents ont dévalé, les vents ont soufflé,
        >ils sont venus battre cette maison ;
        la maison s’est écroulée, et son écroulement a été complet. »
