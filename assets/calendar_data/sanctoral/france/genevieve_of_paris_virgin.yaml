celebration:
  title: Sainte Geneviève
  subtitle: vierge
  description: Née à Nanterre vers 420, Geneviève menait à Paris la vie retirée des vierges consacrées, dans le jeûne, la prière et le silence. En 451, elle réconforta les Parisiens effrayés par l’avance d’Attila. Plus tard, elle devait ravitailler Paris menacé de famine. À sa mort, vers 500, on l’inhuma sur la colline devenue depuis lors la Montagne‑Sainte‑Geneviève.
  commons:
    - virgins
  color: white
  locative: en France

oration:
  - Répands sur nous, Seigneur, l’esprit d’intelligence et d’amour dont tu as rempli sainte Geneviève, pour qu’attentifs à te servir et cherchant à lui ressembler, nous sachions te plaire par notre foi et toute notre vie.

readings:

mass:
- massType: DAY_MASS
  collect:
  - |-
    Répands sur nous, Seigneur,
    >l’esprit d’intelligence et d’amour
    >dont tu as rempli sainte Geneviève, ta servante ; *
    fais que nous imitions avec empressement
    >sa fidélité et son obéissance, /
    et que nous sachions te plaire
    >par notre foi et toute notre vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Jdt 13, 18a.19-20
      headline: |-
        La protectrice de la cité
      content: |-
        Bénie sois-tu, ma fille, par le Dieu Très-Haut
        plus que toutes les femmes de la terre ;
        Jamais l’espérance dont tu as fait preuve
        >ne s’éloignera du cœur des hommes,
        mais ils se rappelleront éternellement
        >la puissance de Dieu.
        Oui, Dieu fasse que tu sois exaltée à jamais,
        >qu’il te visite de ses bienfaits,
        car tu n’as pas épargné
        >ta propre vie
        >pour la cause de notre race humiliée,
        tu es sortie pour empêcher notre ruine,
        >marchant avec droiture devant notre Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 148, 1-2, 7a.11a.12, 13-14a
      refAbbr: cf. 148, 12a.13a
      chorus:
      - chorusRef: null
        content: |-
          Alléluia !
      - chorusRef: cf. 148, 12a.13a
        content: |-
          ou : Jeunes gens et jeunes filles,
          louez le nom du Seigneur.
      content: |-
        Louez le Seigneur du haut des cieux,
        louez-le dans les hauteurs.
        Vous, tous ses anges, louez-le,
        louez-le, tous les univers.

        Louez le Seigneur depuis la terre,
        les rois de la terre et tous les peuples,
        tous les jeunes gens et jeunes filles,
        les vieillards comme les enfants.

        Qu’ils louent le nom du Seigneur,
        le seul au-dessus de tout nom ;
        sur le ciel et sur la terre, sa splendeur :
        il accroît la vigueur de son peuple.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 38-42
      headline: |-
        Contemplation et action
      acclamationAntiphon: |-
        Geneviève a choisi la meilleure part :
        le Seigneur est à jamais son bonheur et sa joie.
      acclamationAntiphonReference: cf. Lc 10, 42
      content: |-
        En ce temps-là,
        Jésus entra dans un village.
        Une femme nommée Marthe le reçut.
        Elle avait une sœur appelée Marie
        >qui, s’étant assise aux pieds du Seigneur,
        >écoutait sa parole.
        Quant à Marthe, elle était accaparée
        >par les multiples occupations du service.
        Elle intervint et dit :
        >« Seigneur, cela ne te fait rien
        que ma sœur m’ait laissé faire seule le service ?
        >Dis-lui donc de m’aider. »
        Le Seigneur lui répondit :
        >« Marthe, Marthe, tu te donnes du souci
        et tu t’agites pour bien des choses.
        >Une seule est nécessaire.
        Marie a choisi la meilleure part,
        >elle ne lui sera pas enlevée. »
