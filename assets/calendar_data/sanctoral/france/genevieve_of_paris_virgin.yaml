celebration:
  title: Sainte Geneviève
  subtitle: vierge
  description: Née à Nanterre vers 420, Geneviève menait à Paris la vie retirée des vierges consacrées, dans le jeûne, la prière et le silence. En 451, elle réconforta les Parisiens effrayés par l’avance d’Attila. Plus tard, elle devait ravitailler Paris menacé de famine. À sa mort, vers 500, on l’inhuma sur la colline devenue depuis lors la Montagne‑Sainte‑Geneviève.
  commons:
    - virgins
  color: white
  locative: en France

oration:
  - Répands sur nous, Seigneur, l’esprit d’intelligence et d’amour dont tu as rempli sainte Geneviève, pour qu’attentifs à te servir et cherchant à lui ressembler, nous sachions te plaire par notre foi et toute notre vie.

readings:

mass:
- massType: DAY_MASS
  collect:
  - |-
    Répands sur nous, Seigneur,
    >l’esprit d’intelligence et d’amour
    >dont tu as rempli sainte Geneviève, ta servante ; *
    fais que nous imitions avec empressement
    >sa fidélité et son obéissance, /
    et que nous sachions te plaire
    >par notre foi et toute notre vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
