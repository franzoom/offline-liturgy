mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Jdt 13,17-18
    content: |-
      Louons le Seigneur notre Dieu,
      >il n’a pas abandonné
      >ceux qui comptent sur lui :
      il a tenu envers nous
      >ses promesses de miséricorde.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as choisi sainte Jeanne d’Arc
    >pour venir au secours de son pays ; *
    accorde-nous, à son intercession,
    >de travailler pour la justice /
    >et de vivre dans la paix.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Sg 8, 9-15
      headline: |-
        Une existence illuminée par la Sagesse de Dieu
      content: |-
        J’ai résolu d’amener la Sagesse à partager ma vie,
        >car je savais qu’elle serait ma conseillère pour bien agir,
        >mon réconfort dans les soucis et la tristesse.
        Grâce à elle, j’aurai la gloire auprès des foules,
        >et l’honneur auprès des anciens, malgré ma jeunesse.
        Au tribunal, on reconnaîtra ma perspicacité ;
        >devant moi les puissants seront dans l’admiration.
        Si je me tais, ils attendront ;
        >si je parle, ils prêteront l’oreille ;
        si je prolonge mon discours,
        >ils se garderont de m’interrompre.
        Grâce à la Sagesse, j’aurai l’immortalité,
        >je laisserai à la postérité un souvenir éternel.
        Je dirigerai des peuples,
        >et des nations me seront soumises.
        S’ils entendent parler de moi,
        >des souverains redoutables prendront peur.
        Je montrerai ma valeur dans l’assemblée du peuple,
        >et ma bravoure à la guerre.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 26 (27), 1, 2, 3, 5
      chorus:
      - chorusRef: null
        content: |-
          Le Seigneur est ma force et mon salut,
          il est ma délivrance.
      content: |-
        Le Seigneur est ma lumière et mon salut ;
        de qui aurais-je crainte ?
        Le Seigneur est le rempart de ma vie ;
        devant qui tremblerais-je ?

        Si des méchants s’avancent contre moi
        pour me déchirer,
        ce sont eux, mes ennemis, mes adversaires,
        qui perdent pied et succombent.

        Qu’une armée se déploie devant moi,
        mon cœur est sans crainte ;
        que la bataille s’engage contre moi,
        je garde confiance.

        Oui, il me réserve un lieu sûr
        au jour du malheur ;
        il me cache au plus secret de sa tente,
        il m’élève sur le roc.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 16, 24-27
      headline: |-
        « Qui perd sa vie à cause de moi la trouvera »
      acclamationAntiphon: |-
        Seigneur, mon roc, ma forteresse,
        Dieu mon libérateur, le rocher qui m’abrite,
        mon bouclier, mon fort, mon arme de victoire !
      acclamationAntiphonReference: Ps 17, 2b-3
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Si quelqu’un veut marcher à ma suite,
        qu’il renonce à lui-même,
        >qu’il prenne sa croix
        >et qu’il me suive.
        Car celui qui veut sauver sa vie
        >la perdra,
        mais qui perd sa vie à cause de moi
        >la trouvera.
        Quel avantage, en effet, un homme aura-t-il
        >à gagner le monde entier,
        >si c’est au prix de sa vie ?
        Et que pourra-t-il donner en échange de sa vie ?
        Car le Fils de l’homme va venir avec ses anges
        >dans la gloire de son Père ;
        alors il rendra à chacun selon sa conduite. »
  offeringPrayer:
  - |-
    Accueille, Seigneur,
    >en la fête de sainte Jeanne d’Arc,
    >l’offrande pure de ton Fils, victime qui nous sauve ; *
    accorde-nous de t’aimer en tout et plus que tout, /
    >afin de vivre pour la louange de ta gloire.
    Par le Christ, notre Seigneur.
  prefaceList:
  - saints_1
  - saints_2
  communionAntiphon:
  - biblicalReference: Ps 22,4
    content: |-
      Si je traverse les ravins de la mort,
      >je ne crains aucun mal,
      car tu es avec moi :
      >ton bâton me guide et me rassure.
  prayerAfterCommunion:
  - |-
    Tu nous as fortifiés, Seigneur, par le pain du ciel
    >où sainte Jeanne trouva tant de fois
    >lumière et réconfort ; *
    fais que cet aliment du salut /
    >nous soutienne dans le service de nos frères.
    Par le Christ, notre Seigneur.
