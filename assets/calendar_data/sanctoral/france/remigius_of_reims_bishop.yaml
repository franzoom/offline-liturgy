celebration:
  title: Saint Rémi
  subtitle: évêque
  description: Rémi fut évêque de Reims pendant soixante-dix ans († vers 530). Son nom est attaché au baptême de Clovis et à l’entrée des Francs dans l’Église catholique. Mais l’événement ne fut pas fortuit. En effet, Rémi avait exercé de longue date une influence déterminante dans le cheminement du roi franc vers la foi.
  commons:
    - pastors_bishop
  color: white
  locative: en France

oration:
  - |-
    Tu as voulu, Seigneur, que les travaux apostoliques de saint Remi et sa générosité à te servir fassent grandir ton Église : accorde-nous, par son intercession, de garder la foi qu’il a transmise et de suivre ses exemples.

readings:
  patristicReading:
    - title: DE L’HISTOIRE DES FRANCS PAR GRÉGOIRE DE TOURS
      subtitle: Saint Rémi Baptise Clovis, le peuple franc devient chrétien
      content: |-
        L’évêque de Reims, saint Rémi, fut appelé par sainte Clotilde auprès du Roi Clovis qui venait de se convertir. L’évêque commença à lui faire comprendre qu’il devait croire au vrai Dieu, créateur du ciel et de la terre, et abandonner les idoles qui ne peuvent être utiles ni à elles-mêmes ni aux autres. Mais le roi lui dit : « Je t’écouterai volontiers, père très saint, mais il reste une chose : c’est que le peuple qui me suit n’accepte pas de renoncer à ses dieux. Mais j’y vais, et je leur dirai ce que tu m’as dit ». Il alla trouver les siens, mais la puissance de Dieu avait devancé son discours et tout le peuple s’écria en même temps : « Nous rejetons les dieux immortels, ô pieux roi, et nous sommes prêts à suivre le Dieu immortel que prêche Rémi ».
        On porte cette nouvelle à l’évêque qui, rempli d’une grande joie, ordonne de préparer le baptême. Les galeries de l’église sont couvertes de peintures, décorées de courtines blanches ; la piscine est aménagée, on répand des parfums, on fait brûler des cierges et de l’encens, toute la chapelle du baptistère est embaumée d’une odeur céleste, et Dieu accorda aux assistants une telle grâce qu’ils se croyaient transportés dans les parfums du paradis.
        Ce fut le roi qui, le premier, demanda à être baptisé par le pontife. Ce nouveau Constantin s’avance vers le baptême pour guérir de la lèpre originelle et pour effacer par une eau nouvelle les souillures de son passé. Lorsqu’il fut entré dans l’eau pour recevoir le baptême, le saint de Dieu lui adresse cette interpellation éloquente : « Incline humblement la tête, Sicambre ; adore ce que tu as brûlé, brûle ce que tu as adoré ».
        Saint Rémi était un évêque d’une science remarquable qui avait étudié profondément la rhétorique ; mais il était aussi éminent en sainteté, au point qu’il égalait saint Sylvestre par ses miracles. Il existe de nos jours un livre de sa vie qui raconte qu’il a ressuscité un mort.
        Donc, le roi ayant confessé la Trinité du Dieu tout-puissant, fut baptisé au nom du Père, du Fils et du Saint-Esprit, puis il reçut l’onction de saint-chrême avec la marque de la croix du Christ. Plus de trois mille hommes de son armée furent baptisés. On baptisa encore sa sœur Alboflède qui, peu de temps après, émigra auprès du Seigneur. Comme le roi en était attristé, saint Rémi lui envoya une lettre de consolation, qui commençait ainsi : « J’ai moi-même le cœur serré, et profondément, par ce qui cause ta tristesse : le trépas de ta sœur Alboflède, de vertueuse mémoire. Mais nous pouvons nous en consoler, car elle a quitté ce monde dans de telles dispositions que l’on doit la vénérer plutôt que la pleurer ».
      responsory: |-
        R/ Gloire au Seigneur, c’est lui notre Dieu !
        Il nous a délivrés de la servitude,
        avec autorité et puissance.
        
        Jadis vous n’étiez pas un peuple,
        vous êtes maintenant le peuple de Dieu.
        
        Vous êtes la race élue, la nation sainte,
        le peuple que Dieu s’est acquis.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >tu as voulu que l’œuvre apostolique de saint Remi
    >et sa générosité à te servir
    >fassent grandir ton Église ; *
    accorde-nous, à son intercession,
    >de garder la foi qu’il a transmise /
    >et de suivre ses exemples.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 15, 14-19a
      headline: |-
        « Ministre du Christ Jésus pour les nations »
      content: |-
        Je suis convaincu, mes frères,
        que vous êtes pleins de bonnes qualités,
        >remplis de toute connaissance de Dieu,
        >et capables aussi de vous reprendre les uns les autres.
        Mais je vous ai écrit avec un peu d’audace,
        >comme pour raviver votre mémoire sur certains points,
        et c’est en raison de la grâce que Dieu m’a donnée.
        Cette grâce, c’est d’être ministre du Christ Jésus pour les nations,
        >avec la fonction sacrée d’annoncer l’Évangile de Dieu,
        afin que l’offrande des nations soit acceptée par Dieu,
        >sanctifiée dans l’Esprit Saint.
        Je mets donc ma fierté dans le Christ Jésus,
        >pour ce qui est du service de Dieu.
        Car je n’oserais rien dire
        >s’il ne s’agissait de ce que le Christ a mis en œuvre par moi
        afin d’amener les nations à l’obéissance de la foi,
        >par la parole et l’action,
        >la puissance des signes et des prodiges,
        >la puissance de l’Esprit de Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        content: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,

        alors j’ai dit : « Voici, je viens.
        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 14, 11-14
      headline: |-
        « Celui qui croit en moi accomplira de grandes œuvres »
      acclamationAntiphon: |-
        Le Seigneur a choisi Remi, son serviteur,
        comme berger de son peuple,
        pour le conduire aux eaux du salut.
      acclamationAntiphonReference: cf. Ps 77, 70-72
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Croyez-moi :
        je suis dans le Père,
        >et le Père est en moi ;
        si vous ne me croyez pas,
        >croyez du moins à cause des œuvres elles-mêmes.
        Amen, amen, je vous le dis :
        celui qui croit en moi
        >fera les œuvres que je fais.
        Il en fera même de plus grandes,
        >parce que je pars vers le Père,
        et tout ce que vous demanderez en mon nom,
        >je le ferai,
        >afin que le Père soit glorifié dans le Fils.
        Quand vous me demanderez quelque chose en mon nom,
        >moi, je le ferai. »
