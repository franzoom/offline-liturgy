celebration:
  title: Tous les saints du diocèse de Fréjus-Toulon
  commons:
    - saints
  color: white

oration:
  - |-
    Dieu, notre Père, source de toute sainteté, nous proclamons tes merveilles en fêtant aujourd’hui les saints de notre Église : tu leur as donné sur terre les grâces les plus diverses et tu les rassembles au ciel dans une même gloire ; par leur intercession, accorde à chacun d’entre nous de répondre fidèlement à sa vocation. Par Jésus Christ.

readings:
  patristicReading:
    - title: SERMON DE SAINT CÉSAIRE D’ARLES SUR LA VIE CHRÉTIENNE (Sermon 20)
      subtitle: Suivre le Christ
      content: |-
        Les Apôtres, modèles de piété, nous invitent à les suivre et à les imiter ; ils nous invitent à régner avec eux dans les cieux, à condition de souffrir avec eux sur la terre. Laissons donc tout ce qui est étranger, hostile, contraire et qui nous sépare du Christ Si nous vivons par l’Esprit, restons attachés aux pas du Christ. Si nous suivons le Christ, cela doit se manifester dans nos actes ; car tout arbre se reconnaît à son fruit. Donc, si nous faisons ce qui relève de l’Esprit, nous plaisons à Dieu ; au contraire, si nous recherchons ce qui relève de la chair, nous ne pouvons plaire à Dieu.
        Pourquoi ne sommes-nous pas si bons qu’il n’y ait en nous rien de mauvais ? Pourquoi ne sommes-nous pas si beaux qu’il n’y ait en nous rien de laid ? Pourquoi ne sommes-nous pas si bien portants qu’il n’y ait en nous aucune infirmité ? Est-ce que par hasard celui qui a donné la vie ne peut donner de quoi vivre dans le présent ? Ne peut-il fournir la tunique, celui qui a fait le corps ? Mais nous, nous manquons d’obéissance envers Dieu plus que lui-même de bonté à notre égard, il a plus à me reprocher que je n’ai à me plaindre de lui.
        On dit : je suis jeune, ma vie est devant moi ; lorsque j’aurai atteint l’âge mûr, il me faudra bien songer à craindre mon Seigneur. Bien sûr, c’est mon intention de revenir un jour à mon Seigneur. Ma vie n’est pas la vie ; la vie que j’avais reçue, je l’ai perdue ; elle a été rachetée par le sang de mon Seigneur. Acheté à un grand prix, je ne peux faire ma volonté.
        Comment se fait-il que nos pères furent si pleins d’anxiété, et nous tellement pleins de sécurité. Eux étaient dans les larmes pour parvenir à la joie ; nous, au contraire, nous vivons dans la joie, pour parvenir aux larmes. Mais je ne sais de quelle façon nous ressemblerons dans le ciel à ceux dont nous différons apparemment à tous égards sur terre ; autre est notre façon d’agir, de vivre, de nous vêtir, autre notre façon de penser. Ils vivaient dans la faim, nous dans le confort ; eux dans le froid, nous dans la chaleur ; eux sur des cilices, nous sur de la plume. Cependant, ils sont nos maîtres, eux et tous ceux qui ont prouvé leur foi par des actions saintes.
        Auprès du Seigneur, il n’y a rien d’innocent que celui qui a également le cœur pur. Devant lui est seul juste celui qui a observé ses commandements, qui non seulement aime son prochain, mais aussi de tout cœur son ennemi.
        Dieu désire trouver en l’homme, à l’intérieur et à l’extérieur, une innocence et une justice totales. Viens avec ton cœur vers ton Seigneur, viens aussi avec ton corps. Que le respect de Dieu t’appelle à son service. Il est facile de dire en effet : je connais Dieu, je crois en Dieu, j’aime Dieu, je crains Dieu, je sers Dieu. Mais il ne le connaît pas celui qui ne croit pas ; il ne croit pas, celui qui n’aime pas ; il n’aime pas, celui qui ne craint pas ; il ne craint pas, celui qui ne sert pas. %Le Royaume de Dieu est en vous%, crie le Seigneur. Les armes de l’Évangile ne sont pas lourdes mais légères à ceux qui sont de bonne volonté.
      responsory: |-
        R/ Enveloppés d’une telle nuée de témoins,
        fixons nos regards sur le Christ.

        Ils aspiraient à une patrie meilleure ;
        aussi Dieu leur a proposé une ville,
        et lui, est leur Dieu.

        Allons vers la cité du Dieu vivant,
        vers la Jérusalem céleste,
        vers l’assemblée des rachetés.
