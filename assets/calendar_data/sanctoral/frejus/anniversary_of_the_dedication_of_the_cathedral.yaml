celebration:
  title: Dédicace de la cathédrale de Toulon
  commons:
    - dedicace
  color: white

oration:
  - |-
    Au jour où notre église cathédrale te fut consacrée sous le vocable de la sainte Vierge Marie, écoute, Seigneur, la prière de tes fidèles : Donne-nous, par son intercession, de constituer un peuple saint dont le culte te rende gloire.

readings:
  patristicReading:
    - title: SERMON DE SAINT CÉSAIRE D’ARLES POUR L’ANNIVERSAIRE D’UNE DÉDICACE
      subtitle: Nous devons être le temple de Dieu.
      content: |-
        Frères très chers, nous célébrons aujourd’hui l’anniversaire de ce temple, grâce à la bonté du Christ, dans la joie et l’allégresse, mais le temple de Dieu, vivant et vrai, c’est nous qui devons l’être.
        Le peuple chrétien a cependant bien raison d’honorer fidèlement la solennité de la Mère Église, car il sait que c’est par elle qu’il est rené de l’Esprit. Car si notre première naissance nous conduit à la mort, la seconde nous appelle à la vie. Bien-aimés, avant le baptême nous étions tous des sanctuaires du diable ; après le baptême nous sommes des temples du Christ. Et si nous portons davantage d’attention au salut de notre âme, nous reconnaissons que nous sommes le temple de Dieu, vivant et vrai. Car Dieu n’habite pas seulement dans les temples faits de main d’homme, ni dans une maison construite de bois et de pierre, mais avant tout dans l’âme créée à l’image de Dieu et formée de sa propre main. C’est ainsi que le bienheureux Apôtre Paul dit : %Le temple de Dieu est saint, et ce temple, c’est vous.%
        Ces temples faits de bois et de pierre existent pour que s’y rassemblent les temples vivants, et qu’ils forment ainsi le temple de Dieu : un chrétien est un temple de Dieu ; beaucoup de chrétiens sont autant de temples de Dieu. Voyez encore, mes frères, comme il est beau, ce temple unique fait de temples nombreux. Ces temples du Christ, c’est-à-dire les chrétiens, sont dispersés à travers le monde entier : lorsque viendra le jour du jugement, ils seront tous rassemblés et formeront un seul temple pour la vie éternelle.
        Réjouissons-nous d’être le temple de Dieu, mais craignons de détruire le temple de Dieu par nos mauvaises actions. Craignons ce que dit l’Apôtre : si quelqu’un détruit le temple de Dieu, Dieu le détruira. Dieu, qui a pu créer le ciel et la terre par la puissance de sa parole sans la moindre peine, daigne habiter en toi. Tu dois donc agir de manière à ne pas offenser un tel habitant. Que Dieu ne trouve donc en toi, c’est-à-dire dans son temple, rien de souillé, rien de ténébreux, rien d’orgueilleux.
        Chaque fois que nous venons à l’église, nous devons nous préparer pour être tels que nous voulons la trouver. Tu veux trouver une église propre : ne souille pas ton âme par la fange des péchés. Si tu veux que la basilique soit lumineuse, Dieu aussi veut que ton âme ne soit pas ténébreuse, mais qu’elle soit comme le Seigneur le dit : %Que votre lumière brille devant les hommes ; alors, en voyant ce que vous faires de bien, ils rendront gloire à votre Père qui est aux cieux.% De même que tu entres dans cette église, Dieu veut entrer dans ton âme, comme il l’a promis : %J’habiterai et je marcherai au milieu d’eux.%
      responsory: |-
        R/ Voici la demeure de Dieu parmi les hommes,
        ils seront son peuple
        et Dieu-avec-eux sera leur Dieu.

        Serait-il possible que Dieu habite sur la terre,
        lui que les cieux ne peuvent contenir ?

        J’ai vu la cité sainte, la Jérusalem nouvelle
        qui descendait du ciel d’auprès de Dieu.

        Mystère redoutable : ce lieu, est saint,
        c’est la maison de Dieu, c’est la porte du ciel.
