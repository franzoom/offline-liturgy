celebration:
  title: Saint Césaire d’Arles
  subtitle: évêque
  description: Moine de Lérins, puis évêque d’Arles pendant quarante ans (503-543), Césaire s’affirma comme un chef, dont l’influence s’exerça sur la Gaule méridionale et l’Espagne. Il sut à la fois protéger son peuple contre les exactions des Barbares et l’enseigner par des homélies simples et vivantes. Mais il parla aussi en docteur dans les conciles qu’il présida.
  commons:
    - pastors_bishop
  color: white

oration:
  - Tu as donné, Seigneur, à saint Césaire d’Arles une grande aptitude pour enseigner au peuple ta Parole ; daigne ouvrir nos esprits et nos cœurs au message qu’il nous a transmis avec fidélité et conviction.

readings:
  patristicReading:
    - title: DE LA VIE DE SAINT CÉSAIRE PAR SAINT CYPRIEN DE TOULON
      subtitle: Le séjour de saint Césaire à Lérins
      content: |-
        À l’âge d’environ vingt ans, sous l’inspiration de la grâce divine, Césaire décide de se consacrer plus étroitement et plus totalement au service de Dieu selon l’Évangile, au point de se rendre étranger non seulement à ses parents, mais même à sa patrie (Chalon-sur-Saône), pour l’amour du royaume des cieux. Pour son salut, il saisit la liberté de fuir les entraves du monde et, saint novice, il gagne le monastère de Lérins (…).
        Accueilli par le saint abbé Porcaire et par tous les anciens, il se met aussitôt à se tenir prêt pour les veilles, attentif à la discipline ; prompt à obéir, courageux au travail, devançant les autres en humilité, exceptionnel en douceur, bref ceux qui l’avaient accueilli pour le former aux commencements de l’observance régulière se réjouissaient de le trouver parfait dans les progrès de la formation toute entière.
        Après peu de temps, il est choisi comme cellérier de la communauté. Il entreprend donc, avec attention et réflexion, de décider de donner à ceux qui avaient besoin de quelque chose, même s’ils ne demandaient rien par amour de l’abstinence ; mais il ne donnait rien à ceux dont il savait bien qu’ils n’avaient nul besoin, alors qu’ils voulaient recevoir quelque chose. Il en résulta que ceux qui étaient opposés à cette sainte circonspection supplièrent l’abbé de le décharger de sa fonction, ce qu’il fit.
        Ce souci bientôt de côté, Césaire se mortifia en se livrant assidûment à la lecture, à la récitation des psaumes, à l’oraison, aux veilles. Son corps de jeune homme, qu’il aurait fallu ménager plutôt qu’affaiblir, en arrivait à être courbé et brisé par un excès de souffrance : les légumes ou la bouillie qu’il se cuisait pour le dimanche lui servaient de nourriture jusqu’au dimanche suivant. (…) Il épuisa sa vigueur physique pour affermir la force de son esprit par la solidité de la foi et de l’espérance. (…)
        Après cela cependant, l’estomac délabré, il tomba dans une fièvre quarte. Le saint abbé s’inquiéta fort de sa faiblesse. Entre le maître et le disciple, le malaise était partagé ; l’un soufrait dans son cœur, l’autre dans son corps. Le vénérable père voyait bien que dans le monastère il n’avait aucun remède à sa portée. Même si un médecin était là, l’ardeur habituelle du jeune homme à se porter aux réalités spirituelles ne lui aurait pas du tout permis de réfréner son abstinence ou de modérer ses veilles. Le très saint abbé lui ordonna donc, l’obligea même à se rendre à Arles pour y refaire sa santé.
      responsory: |-
        R/ Heureux qui se plaît dans la loi du Seigneur
        et murmure sa loi jour et nuit.

        Puissent mes chemins s’affermir
        à observer tes commandements.

        Je trouve mon plaisir en tes exigences :
        ce sont elles qui me conseillent.

morning:
  evangelicAntiphon:
    common:
      - Béni soit Dieu qui a établi saint Césaire comme la lampe qui brûle et qui éclaire toute la maison.

vespers:
  evangelicAntiphon:
    common:
      - Par sa parole et son exemple, Césaire a édifié l’Église du Dieu vivant, le rempart de la vérité.
