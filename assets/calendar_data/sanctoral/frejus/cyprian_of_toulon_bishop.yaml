celebration:
  title: Saint Cyprien
  subtitle: évêque
  commons:
    - pastors_bishop
  color: white

oration:
  - Tu as voulu, Seigneur, que le zèle apostolique de l’évêque saint Cyprien et son amour de la vérité fassent grandir ton Église ; accorde au peuple qui t’est consacré une foi et une sainteté toujours en progrès. Par Jésus Christ.

readings:
  patristicReading:
    - title: MONITION DE SAINT CÉSAIRE AUX ÉVÊQUES (Sermon VII, 1)
      subtitle: Sur la méditation de la Parole de Dieu
      content: |-
        Que le Christ vous aide, frères très chers, à toujours accueillir la lecture de la Parole de Dieu avec un cœur avide et assoiffé : ainsi votre obéissance très fidèle vous remplira de joie spirituelle. Mais si vous voulez que les Saintes Écritures aient pour vous de la douceur et que les préceptes divins vous profitent autant qu’il le faut, soustrayez-vous pendant quelques heures à vos préoccupations profanes. Relisez dans vos maisons les paroles de Dieu, consacrez-vous entièrement à sa miséricorde. Ainsi vous réussirez à réaliser en vous ce qui est écrit de l’homme bienheureux : %il méditera jour et nuit la loi du Seigneur%. Et aussi : %Heureux ceux qui scrutent ses commandements, ils le recherchent de tout leur cœur%. Et enfin : %J’ai mis tes paroles au fond de mon cœur, pour ne pas pécher contre toi%. En effet, comme vous venez de l’entendre, celui qui n’agit pas ainsi ne cesse pas de pécher.
        En effet, les commerçants ne se contentent pas de chercher à faire des bénéfices sur une seule marchandise ; ils s’en procurent un grand nombre pour augmenter leur fortune. Les cultivateurs s’efforcent de semer différentes sortes de semences afin de pouvoir se préparer une nourriture suffisante pour eux-mêmes et les leurs. Combien plus, lorsqu’il s’agit de bénéfices spirituels, ne devez-vous pas vous contenter d’entendre lire la Parole de Dieu à l’église ; vous devez prolonger la lecture sacrée dans vos maisons, au cours de vos repas ; et quand les jours sont courts, y consacrer encore quelques heures de la nuit. C’est ainsi que vous pourrez amasser un froment spirituel dans le grenier de votre cœur et ranger dans le trésor de vos âmes les perles précieuses des Écritures ; ainsi, au jour du jugement, lorsque nous comparaîtrons devant le tribunal du Juge éternel, selon la parole de l’Apôtre, %nous serons trouvés vêtus et non pas nus%.
      responsory: |-
        R/ J’ouvre mon cœur, Seigneur,
        à ta parole de lumière.

        Cantique pour moi que tes volontés,
        en ma demeure d’étranger.

        Heureux les humbles, heureux les pauvres :
        tu leur découvres le secret du Royaume !

morning:
  evangelicAntiphon:
    common:
      - |-
        Dans le chœur des évêques, saint Cyprien a montré sa grandeur et sa valeur : tout ce qu’il enseignait, il l’affirmait par les saintes écritures et le prouvait par la tradition des Pères.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Saint Cyprien, tu as conduit dans la vérité le troupeau que Dieu t’avait confié : à l’image du Christ, tu fus le serviteur.
