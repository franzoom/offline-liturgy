celebration:
  title: Saint Honorat
  subtitle: évêque
  commons:
    - pastors_bishop
  color: white

oration:
  - Tu as réuni, Seigneur, en l’évêque saint Honorat le zèle du pasteur et la vie de prière du moine ; accorde-nous de savoir comme lui te chercher dans le recueillement et te rencontrer dans le service de nos frères.

readings:
  patristicReading:
    - title: DES CONFÉRENCES DE SAINT JEAN CASSIEN
      subtitle: La fondation de Lérins.
      content: |-
        Le désir du désert avait appelé Honorat hors de son pays, le Christ le convie à pénétrer dans un désert proche de notre cité.
        Il est une île inhabitée en raison de son aspect excessivement rebutant, inabordable du fait de la crainte inspirée par ses bêtes venimeuses, située au pied de la chaîne des Alpes : il s’y rend. Sa situation isolée lui convenait ; de plus il était charmé par le voisinage d’un homme saint et bienheureux dans le Christ, l’évêque Léonce, et lié à lui par une profonde affection ; pourtant, bien des gens s’efforçaient de le détourner d’un coup d’audace si nouveau. En effet, les habitants des alentours prétendaient ce désert redoutable et s’efforçaient, dans l’intérêt de leur foi, de fixer Honorat sur leur territoire.
        Mais lui, qui supportait mal le genre de vie des hommes et désirait être retranché du monde même par la barrière d’un détroit, redisait ces paroles dans son cœur et de ses lèvres, les exprimant tantôt pour lui, tantôt pour les siens : Tu marcheras sur la vipère et le scorpion, tu écraseras le lion et le dragon, ainsi que la promesse du Christ à ses disciples rapportée dans les Évangiles : Je vous ai donné pouvoir d’écraser serpents et scorpions. C’est pourquoi il y pénètre sans le moindre effroi et dissipe la frayeur des siens par sa propre assurance. L’horreur de la solitude s’évanouit, les serpents innombrables cèdent la place.
        Là, par ses soins, s’élève le sanctuaire d’une église susceptible de contenir les élus de Dieu ; des constructions appropriées à l’habitat des moines surgissent ; les eaux refusées aux profanes coulent en abondance.
        Là, dès lors, accouraient à l’envie toutes gens à la recherche de Dieu. Quiconque avait le désir du Christ recherchait Honorat, et en vérité, quiconque recherchait Honorat trouvait le Christ.
        On ne saurait croire à quel point il eut le souci de ne laisser personne accablé de tristesse ou obsédé par le souci du monde ; avec quelle facilité il discerna ce qui blessait chacun, comme s’il portait en son âme l’âme de chacun ; de plus, avec quel miséricordieux discernement il sut pourvoir à ce que personne ne fût accablé par un excès de travaux, personne engourdi dans un excès de repos. Il mesura, si l’on peut dire, le temps même de sommeil de chacun avec bienveillance : arrachant toujours à leur oisiveté ceux qui étaient de santé robuste, il contraignait au repos ceux qu’animait la ferveur spirituelle. Il connaissait les forces de tous, les dispositions de tous, le tempérament de tous, par une intuition qui, je le crois, lui venait de Dieu, s’étant fait vraiment le serviteur de tous, à cause du Christ Jésus.
        Il est prodigieux de voir comment un seul homme s’est acquitté en même temps d’un si grand nombre de devoirs, bien que tourmenté par tant d’infirmités diverses. Les plus courageux et ceux qui, encore au début de leur conversion, étaient en plein vigueur le virent leur tenir compagnie dans les jeûnes et les veilles, en se soumettant à un égal régime malgré ses forces inégales. Il visitait les malades, lui-même plus malade qu’eux ; il se préoccupa de soulager en même temps les âmes et les corps ; et de peur que chacun n’eût pas reçu sa part, ces pensées lui revenaient sans cesse à l’esprit :
        « Celui-ci souffre du froid, cet autre est malade ; pour celui-là, ce travail est pénible ; pour cet autre, cette nourriture ne convient pas ; celui-là a été blessé par un autre : il est grave que le second ait commis une injustice et il n’est pas moins grave que le premier l’ait ressentie. Il faut veiller instamment à ce que le second obtienne le pardon de son offense, que le premier estime légère ou nulle l’injustice commise à son égard, mais que l’autre exprime sa souffrance d’en avoir commis une aussi grave ».
        Tel était, quant à lui, l’effet, le but du joug qu’il imposait : rendre léger pour tous le joug du Christ.
      responsory: |-
        R/ Heureux es-tu, saint Honorat, serviteur du Christ :
        en toi le don de Dieu a porté son fruit.

        Heureux qui craint le Seigneur,
        qui aime entièrement ses volontés.

        Sa lignée sera puissante sur la terre,
        la race des justes est bénie.

morning:
  evangelicAntiphon:
    common:
      - Bénit soit Dieu, qui a choisit saint Honorat pour faire fleurir sur l’île de Lérins la vie monastique et guider ses frères sur le chemin de la perfection.

vespers:
  evangelicAntiphon:
    common:
      - Tous ceux qui avaient le désir du Christ recherchaient Honorat, et quiconque recherchait Honorat trouvait le Christ.
