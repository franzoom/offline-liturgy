celebration:
  title: Saint Léonce
  subtitle: évêque, patron secondaire du diocèse
  commons:
    - pastors_bishop
  color: white

oration:
  - Seigneur, tu as mis l’évêque saint Léonce à la tête de l’Église de Fréjus et il l’a guidée, avec un zèle d’apôtre, dans l’amour et la vérité ; puisque nous célébrons aujourd’hui sa fête, mets en nos cœurs son élan apostolique et son esprit de charité. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE SAINT JEAN CASSIEN
      subtitle: Dédicace de ses conférences à l’évêque Saint Léonce
      content: |-
        La préface de mes précédents volumes contenait une promesse au bienheureux évêque Castor qui me faisait son débiteur.
        Le même pontife, dans la flamme de son zèle incomparable pour la sainteté, m’avait aussi prié de rédiger du même style ces dix conférences des plus grands parmi les Pères du désert, je veux dire des anachorètes qui demeuraient au désert de Scété ; sa surabondante charité l’empêchait d’avoir égard au fardeau dont il chargeait de trop faibles épaules. Aujourd’hui qu’il nous a laissés pour aller vers le Christ, c’est à vous, bienheureux évêque Léonce et vénérable frère Helladius, que j’ai pensé devoir les dédier. L’un de vous lui est uni par la fraternité du sang, la dignité du sacerdoce et, ce qui est plus grand, par la ferveur d’un saint propos ; le bien dû à son frère lui revient par droit d’héritage. L’autre s’est porté à imiter la vie sublime des anachorètes, intérieurement conseillé par l’Esprit Saint.
        Pour moi, établi maintenant au port du silence, je vois s’ouvrir à mes yeux un océan sans fin, si j’ose écrire, pour la postérité, de la vie et de la doctrine de si grands hommes… Votre devoir est de seconder mes efforts de vos ferventes prières, afin qu’un sujet si saint ne périclite point par mon fait.
        Du côté extérieur et visible de la vie des moines, dont s’occupaient mes premiers écrits, passons aux dispositions de l’homme intérieur, qui sont invisibles au regard ! Que notre discours s’élève de la description des heures canoniques à cette prière sans interruption dont l’apôtre nous fait un commandement !
        Puissent vos prières m’obtenir de Celui qui m’a jugé digne de voir ces grands solitaires, de les avoir pour maîtres et de partager leur vie, une mémoire sans défaillance et l’expression aisée ! Je voudrais vous rapporter leur doctrine avec le même cachet de sainteté qu’elle avait sur les lèvres, et sans rien en diminuer ; en sorte qu’ils revivent devant vous, incarnés dans leurs saintes leçons et, qui plus est, parlant latin.
      responsory: |-
        R/ Heureux l’homme qui met sa foi
        dans le Seigneur.

        Sois fort et tiens bon :
        que le livre de la Loi
        soit toujours sur tes lèvres.

        Sois sans crainte ni frayeur :
        le Seigneur ton Dieu est avec toi
        partout où tu iras.

        Vous tous, disciples du Seigneur,
        fortifiez-vous
        dans la grâce du Seigneur Jésus.

morning:
  evangelicAntiphon:
    common:
      - |-
        Nous travaillons à l’œuvre de Dieu : vous êtes son champ et sa vigne, vous êtes la maison qu’il construit.

vespers:
  evangelicAntiphon:
    common:
      - Le Seigneur a aimé saint Léonce, il l’a revêtu de gloire, il a posé sur sa tête la couronne de justice.
