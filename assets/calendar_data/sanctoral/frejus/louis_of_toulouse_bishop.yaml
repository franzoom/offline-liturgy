celebration:
  title: Saint Louis de Brignoles
  subtitle: évêque
  commons:
    - pastors_bishop
  color: white

oration:
  - Tu as inspiré Seigneur, à l’évêque saint Louis de préférer le Royaume de ciel à celui de la terre et d’avoir pour les pauvres un amour de prédilection ; donne-nous, à son exemple, de partager sans compter avec nos frères ce que nous avons reçu de ta bonté. Par Jésus Christ.

readings:
  patristicReading:
    - title: LETTRE DE SAINT BERNARD SUR LA VIE ET LES DEVOIRS DE L’ÉVÊQUE
      subtitle: Racheter par les vertus le défaut d’âge.
      content: |-
        %Dieu résiste aux orgueilleux ; aux humbles il accorde sa grâce% (…) Dieu (je ne sais comment cela se fait) se rapproche toujours de l’humilité et entretient avec elle des relations d’une intimité croissante. Il a fini par s’en revêtir pour se montrer aux hommes. Il a pris la nature, la forme et l’aspect d’un être d’humble condition, faisant ainsi valoir à nos yeux l’excellence d’une vertu qu’il a voulu honorer par un mode spécial de sa présence.
        Or, c’est à vous, très cher Seigneur, à vous surtout que cette vertu, me semble-t-il, est nécessaire ; d’autant plus nécessaire que vous avez, comme on sait, sujet de vous enorgueillir. La naissance, l’âge, la science, la chaire et, qui plus est, le privilège de la prééminence : qui ne verrait en tout cela une incitation à l’arrogance, une occasion de se montrer hautain ? Ce pourrait être aussi d’ailleurs autant de motifs d’humilité. Quand on songe aux honneurs, on les trouve pleins de charme ; mais qu’on en soupèse le fardeau : ils n’inspirent que répugnance et frayeur. Il est vrai que %tous ne comprennent pas ce langage%. Beaucoup d’hommes en effet courraient après les honneurs avec moins d’assurance et d’empressement s’ils pensaient que ce sont aussi des fardeaux (…).
        Que voyons-nous à présent ? (…) Des enfants, des écoliers, des adolescents encore imberbes, promus aux dignités ecclésiastiques en raison de la dignité du sang, et qu’on fait passer de la férule du maître à la crosse qui imposera le respect aux prêtres (…).
        Nous ne voulons pas dire qu’il y ait des âges prématurés pour la grâce de Dieu, comme il n’en est pas non plus de trop avancés ; nous voyons au contraire bien des jeunes gens, qui l’emportent sur des vieillards, démentir leur âge par le sérieux de leur conduite, par leurs mérites devancer le temps, racheter enfin par leurs vertus ce qui manque au nombre des années (…). Des jeunes d’un naturel vertueux valent mieux que %des hommes vieillis dans le mal%. Il y a %l’enfant de cent ans%, qui est %maudit et il y a par contre une vieillesse vénérable, qui ne se mesure pas à la longueur du temps ni au nombre des années.% Bon, dès son enfance Samuel l’était, qui, entendant Dieu lui parler, s’empressa de lui répondre : %Parle, Seigneur, ton serviteur écoute%, comme s’il eût dit : %Je suis prêt et je ne me laisse pas troubler, car je veux observer tes commandements%. Bon, Jérémie l’était encore, lui qui, sanctifié avant sa naissance, quoiqu’il s’excusât de n’être qu’un enfant, n’en fut pas moins %établi sur les nations et les royaumes%. Bon, Daniel l’était aussi, dont Dieu suscita l’esprit pour lui permettre de confondre des juges iniques et de sauver un sang innocent. Pour tout dire en un mot, la %sagesse chez l’homme tient lieu de cheveux blancs, et c’est un âge avancé qu’une vie sans tache%. Si vous voulez pouvoir présider et commander en toute sécurité, ne dédaignez pas vous-même d’obéir, le cas échéant, à vos supérieurs. Le refus de la soumission rend indigne de la préséance. Voici le conseil d’un sage : %Plus vous êtes grand, plus vous devez vous abaisser en toutes circonstances%. Et voici le commandement de la Sagesse : %Que le plus âgé parmi vous se comporte comme le plus jeune%. Or s’il est bon de se soumettre même à de plus petits que soi, comment serait-il permis de mépriser l’autorité de plus grands que soi ? Que vos inférieurs voient plutôt en vous l’exemple de la déférence qu’ils vous doivent.
      responsory: |-
        R/ Je considère tous les biens comme une perte,
        à cause de ce bien qui dépasse tout :
        la connaissance du Christ Jésus, mon Seigneur.

        * Les avantages que j’avais,
        je les ai considérés comme une perte à cause du Christ.

        V/ Je comprends mieux que les anciens, car j’ai gardé les préceptes.

        * Les avantages.

morning:
  evangelicAntiphon:
    common:
      - Saint Louis a su plaire à Dieu et Dieu l’a aimé ; il lui a accordé grâce et miséricorde, car il veille sur ses amis.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Devenu parfait en peu de temps, saint Louis a parcouru une longue route : son âme était agréable au Seigneur.
