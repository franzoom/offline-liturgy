celebration:
  title: Sainte Marie Madeleine
  subtitle: patronne principale du diocèse de Fréjus-Toulon
  description: Marie de Magdala, pécheresse pardonnée par Jésus, s’attacha avec amour à son service. Tandis que les Apôtres s’étaient enfuis, elle se trouvait près de la croix du Seigneur avec Marie, Jean et quelques femmes. Jésus voulut récompenser son humble fidélité en se montrant à elle le matin de Pâques et en la chargeant d’annoncer sa résurrection à ses disciples.
  commons:
    - saints-female
  color: white

invitatory:
  antiphon:
    - Dieu qui seul es saint, nous t’adorons !

oration:
  - Seigneur notre Dieu, c’est à Marie Madeleine que ton Fils bien-aimé a confié la première annonce de la joie pascale ; accorde-nous, à sa prière et à son exemple, la grâce d’annoncer le Christ ressuscité et de le contempler un jour dans ta gloire. Lui qui règne.

firstVespers:
  hymn:
    - mes-larmes-nuit-et-jour
  psalmody:
    - psalm: PSALM_112
      antiphon:
        - Le sabbat terminé, Marie Madeleine, Marie, mère de Jacques et Salomé achetèrent des parfums pour embaumer le corps de Jésus.
    - psalm: PSALM_147
      antiphon:
        - |-
          En entrant dans le tombeau, elles virent, assis à droite, un jeune homme qui leur dit : n’ayez pas peur !
    - psalm: NT_4
      antiphon:
        - Vous cherchez Jésus de Nazareth, le crucifié ? Il n’est pas ici, Il est ressuscité, alléluia.
  reading:
    biblicalReference: Lm 3, 21.24-26
    content: |-
      Voici que je rappelle en mon cœur ce qui fait mon espérance. Je me dis : « Le Seigneur est mon partage, c’est pourquoi j’espère en lui. » Le Seigneur est bon pour qui se tourne vers lui, pour celui qui le recherche. C’est une bonne chose d’attendre en silence le secours du Seigneur.
  responsory: |-
    R/ Réjouis-toi, Marie !
    * Christ est ressuscité !
    V/ Va vers mes frères et dis-leur : *
    V/ De mes yeux, je l’ai vu,
    il m’a dit : R/ Réjouis-toi.
  evangelicAntiphon:
    common:
      - |-
        Marie se penche vers l’intérieur du tombeau, toute en larmes ; elle aperçoit deux anges vêtus de blanc, qui lui demandent : « Femme, pourquoi pleures-tu ? »
  intercession:
    content: |-
      Louons et supplions le Christ Jésus, qui a fait de sainte Marie Madeleine la première messagère de sa résurrection :

      R/ Exauce-nous, Seigneur de gloire.

      Ô Christ, tu as choisi une femme pour annoncer ta résurrection aux Apôtres,
      — fais que nous accueillons nous aussi son témoignage.

      Tu as fait découvrir à Marie Madeleine ton tombeau vide,
      — garde-nous de te chercher où tu n’es pas.

      Tu t’es fait reconnaître de Marie qui te cherchait parmi les morts,
      — prononce le nom qui nous retournera vers toi.

      Tu as béni notre terre par la protection de Marie Madeleine,
      — qu’elle intercède pour nous et nous guide vers toi.

      Tu es monté vers ton Père et notre Père,
      — suscite parmi tes frères des témoins de ta présence.

      Tu as vaincu la puissance de la mort,
      — fais entrer dans l’éternelle vie ceux qui nous ont quittés.

readings:
  hymn:
    - comment-es-tu-foyer-de-feu
  biblicalReading:
    - title: LECTURE DE LA LETTRE AUX COLOSSIENS
      subtitle: Votre vie est cachée avec le Christ en Dieu
      ref: Col 3, 1-17
      content: |-
        Si donc vous êtes ressuscités avec le Christ, recherchez les réalités d’en haut : c’est là qu’est le Christ, assis à la droite de Dieu. Pensez aux réalités d’en haut, non à celles de la terre. En effet, vous êtes passés par la mort, et votre vie reste cachée avec le Christ en Dieu. Quand paraîtra le Christ, votre vie, alors vous aussi, vous paraîtrez avec lui dans la gloire.
        Faites donc mourir en vous ce qui n’appartient qu’à la terre : débauche, impureté, passion, désir mauvais, et cette soif de posséder, qui est une idolâtrie. Voilà ce qui provoque la colère de Dieu contre ceux qui lui désobéissent, voilà quelle était votre conduite autrefois lorsque, vous aussi, vous viviez dans ces désordres. Mais maintenant, vous aussi, débarrassez-vous de tout cela : colère, emportement, méchanceté, insultes, propos grossiers sortis de votre bouche. Plus de mensonge entre vous : vous vous êtes débarrassés de l’homme ancien qui était en vous et de ses façons d’agir, et vous vous êtes revêtus de l’homme nouveau qui, pour se conformer à l’image de son Créateur, se renouvelle sans cesse en vue de la pleine connaissance. Ainsi, il n’y a plus le païen et le Juif, le circoncis et l’incirconcis, il n’y a plus le barbare ou le primitif, l’esclave et l’homme libre ; mais il y a le Christ : il est tout, et en tous. Puisque vous avez été choisis par Dieu, que vous êtes sanctifiés, aimés par lui, revêtez-vous de tendresse et de compassion, de bonté, d’humilité, de douceur et de patience. Supportez-vous les uns les autres, et pardonnez-vous mutuellement si vous avez des reproches à vous faire. Le Seigneur vous a pardonné : faites de même. Par-dessus tout cela, ayez l’amour, qui est le lien le plus parfait. Et que, dans vos cœurs, règne la paix du Christ à laquelle vous avez été appelés, vous qui formez un seul corps. Vivez dans l’action de grâce. Que la parole du Christ habite en vous dans toute sa richesse ; instruisez-vous et reprenez-vous les uns les autres en toute sagesse ; par des psaumes, des hymnes et des chants spirituels, chantez à Dieu, dans vos cœurs, votre reconnaissance. Et tout ce que vous dites, tout ce que vous faites, que ce soit toujours au nom du Seigneur Jésus, en offrant par lui votre action de grâce à Dieu le Père.
      responsory: |-
        R/ Tandis que je pleurais au tombeau
        j’ai vu le Seigneur vivant, alléluia.

        Réjouissez-vous avec moi,
        vous tous qui aimez le Seigneur :
        celui que je cherchais m’est apparu.

        Les disciples s’étaient retirés, moi je restais :
        enflammée d’amour pour lui,
        je brûlais du désir de le voir.
  patristicReading:
    - title: HOMÉLIE DE SAINT GRÉGOIRE LE GRAND SUR L’ÉVANGILE DE JEAN
      content: |-
        Marie Madeleine, après être venue au tombeau sans y trouver le corps du Seigneur, crut qu’on l’avait enlevé et porta cette nouvelle aux disciples. Une fois venus, ceux-ci constatèrent et ils crurent qu’il en était comme elle l’avait dit. L’Évangile note aussitôt : %Après cela, les disciples rentrèrent chez eux.%Puis il ajoute : %Mais Marie restait là dehors, à pleurer.%
        À ce sujet, il faut mesurer avec quelle force l’amour avait embrasé l’âme de cette femme qui ne s’éloignait pas du tombeau du Seigneur, même lorsque les disciples l’avaient quitté. Elle recherchait celui qu’elle ne trouvait pas, elle pleurait en le cherchant, et, embrasée par le feu de son amour, elle brûlait du désir de celui qu’elle croyait enlevé. C’est pour cela qu’elle a été la seule à le voir, elle qui était restée pour le chercher, car l’efficacité d’une œuvre bonne tient à la persévérance, et la Vérité dit cette parole : %Celui qui aura persévéré jusqu’à la fin, celui-là sera sauvé.%
        Elle a donc commencé par chercher, et elle n’a rien trouvé ; elle a persévéré dans sa recherche, et c’est pourquoi elle devait trouver ; ce qui s’est produit, c’est que ses désirs ont grandi à cause de son attente, et en grandissant ils ont pu saisir ce qu’ils avaient trouvé. Car l’attente fait grandir les saints désirs. Si l’attente les fait tomber, ce n’était pas de vrais désirs. C’est d’un tel amour qu’ont brûlé tous ceux qui ont pu atteindre la vérité. Aussi David dit-il : %Mon âme a soif du Dieu vivant : quand pourrai-je parvenir devant la face de Dieu ?%Aussi l’Église dit-elle encore dans le Cantique des cantiques : %Je suis blessée d’amour.% Et plus loin : %Mon âme a défailli.%
        %Femme, pourquoi pleures-tu ? Qui cherches-tu ?%On lui demande le motif de sa douleur, afin que son désir s’accroisse, et qu’en nommant celui qu’elle cherchait, elle rende plus ardent son amour pour lui.
        %Jésus lui dit : Marie.%Après qu’il l’eut appelée par le mot banal de « femme », sans être reconnu, il l’appelle par son nom. C’est comme s’il lui disait clairement : « Reconnais celui par qui tu es reconnue. Je ne te connais pas en général, comme les autres, je te connais d’une façon particulière. » Appelée par son nom, Marie reconnaît donc son créateur et elle l’appelle aussitôt %Rabboni, c’est-à-dire maître%, parce que celui qu’elle cherchait extérieurement était celui-là même qui lui enseignait intérieurement à le chercher.
      responsory: |-
        R/ Voix de mon Bien-aimé qui frappe à la porte :
        « Ouvre-moi ! » alléluia !

        Si quelqu’un entend ma voix,
        ensemble, nous prendrons notre repas,
        moi près de lui, lui près de moi.

        Si quelqu’un garde ma parole,
        mon Père l’aimera,
        et nous viendrons à lui.
    - title: D’UNE HYMNE DE ROMANOS LE MÉLODE POUR LE DIMANCHE DE PÂQUES
      content: |-
        %Que ta bouche publie désormais ces merveilles…%
        Les femmes porteuses d’aromates envoyèrent en avant Marie-Madeleine au sépulcre selon le récit de Jean le Théologien. Il faisait noir, mais l’amour l’éclairait : aussi aperçut-elle la grande pierre roulée de devant la porte du tombeau et elle retourna dire : « Disciples, sachez ce que j’ai vu : la pierre ne recouvre plus le tombeau. Auraient-ils enlevé mon Seigneur ? Pas de gardes en vue : serait-il ressuscité, celui qui offre aux hommes déchus la résurrection ? »
        À ces mots Céphas et le fils de Zébédée partirent aussitôt en courant comme s’ils luttaient de vitesse… Or ils ne trouvèrent pas le Seigneur… Marie qui les suivait leur dit : « Mystes du Seigneur, vous qui l’aimez d’amour vraiment brûlant, ne pensez pas ainsi… Car ce qui s’est passé, c’était une disposition divine pour que les femmes, premières dans la chute, fussent les premières à voir le Ressuscité ; c’est nous qu’il veut gratifier de son « Réjouissez-vous », nous qui sommes en deuil, celui qui offre aux hommes déchus la résurrection ».
        Le Seigneur qui voit tout, voyant Madeleine vaincue par les sanglots, accablée de tristesse, en eut le cœur touché et se montra à la jeune fille : il lui dit : « %Femme, pourquoi pleures-tu,% qui cherches-tu dans le tombeau ? ». Alors Marie se retourna et lui dit : « Je pleure car %on a enlevé mon Seigneur% du tombeau et %je ne sais% où il repose… Il est mon maître, il est mon Seigneur, lui qui offre aux hommes déchus la résurrection ».
        Celui qui %sonde les reins et les cœurs,% sachant que Marie reconnaîtrait sa voix, appela la brebis, lui, le pasteur véritable : Marie, dit-il et aussitôt elle le reconnut : « C’est bien lui mon bon pasteur qui m’appelle pour me compter désormais avec les quatre-vingt-dix-neuf brebis. Car je sais bien qui il est, celui qui m’appelle : je l’avais dit, c’est mon Seigneur, c’est celui qui offre aux hommes déchus la résurrection ».
        Le Seigneur dit à Marie : « Que ta bouche désormais publie ces merveilles, femme, et les explique aux fils du Royaume qui attendent que je m’éveille, moi le Vivant ; va, Marie, rassemble mes disciples… éveille-les tous comme du sommeil afin qu’ils viennent à ma rencontre avec des flambeaux allumés. Va dire : l’Époux s’est éveillé… celui qui offre aux hommes déchus la résurrection ».
        « Mon deuil s’est soudain transformé en liesse, tout m’est devenu joie et allégresse », s’écrie Marie. « Je n’hésite pas à le dire : j’ai reçu la même gloire que Moïse ; j’ai vu, oui, j’ai vu, non sur la montagne mais dans le sépulcre… le maître des incorporels et des nuées, celui qui est, qui était et qui vient, me dire : hâte-toi, Marie, va révéler à ceux qui m’aiment que je suis ressuscité… Il est revenu à la vie, celui qui offre aux hommes déchus la résurrection ».
      responsory: |-
        R/ Heureuse Marie qui fus la première
        à voir le Fils de Dieu ressuscité des morts !
        Pour son amour tu as renoncé aux attraits du monde.
        * Que ta prière nous recommande au Christ glorifié.
        Pour qu’avec toi, nous jouissions de sa présence bienheureuse,
        * Que ta prière.
    - title: COMMENTAIRE DU PÈRE LAGRANGE SUR L’ÉVANGILE DE JESUS CHRIST
      content: |-
        %Marie-Madeleine devient « apôtre des Apôtres ».%
        Marie-Madeleine avait précédé les saintes femmes au tombeau puisqu’il était encore presque nuit quand elle s’aperçut que la pierre avait été enlevée, c’est-à-dire roulée de façon que le tombeau était ouvert. Les gardes avaient disparu mais elle ne s’en étonna pas, ignorant qu’on les avait placés là. Un regard furtif lui permit de constater que le corps avait disparu. Elle ne vit aucun ange : Jésus s’était réservé de l’informer lui-même. Aussitôt, dans son inquiétude extrême, craignant une profanation du corps adoré de Jésus, elle prit sa course et alla droit à Simon-Pierre et au disciple que Jésus aimait. Elle était hors d’elle-même, n’hésitant pas à conclure : %On a enlevé le Seigneur du tombeau, et nous ne savons pas où on l’a mis% ; Elle dit : nous, parce qu’elle prête sa conviction à celles qui étaient sorties avec elle, mais qui n’arrivaient au tombeau qu’en ce moment.
        Les deux disciples les plus aimés, Pierre et Jean, étaient retournés chez eux, l’un d’eux l’atteste. Elle ne se retirait pas. Elle avait quitté la croix et le sépulcre la dernière. Elle était venue la première au tombeau, trouvé vide. Elle ne pouvait s’en détacher, demeurait au dehors et pleurait. Puis elle voulut voir encore, entra dans l’antichambre et se pencha comme si ce dernier regard eût pu lui apprendre quelque chose. Elle aperçoit alors deux anges vêtus de blanc, assis l’un à la tête, l’autre aux pieds, sur la banquette où avait été déposé le corps de Jésus. Ils lui dirent : %Femme, pourquoi pleures-tu ?% Elle n’a pas reconnu des anges ; des anges auraient dû savoir pourquoi elle pleurait. Elle répond : %Parce qu’on a pris mon Seigneur ; et je ne sais où on l’a mis.% Elle ne voit même pas les bandelettes, elle ne s’inquiète pas des étrangers, pour elle c’est le vide, le néant.
        Elle se penche encore, cette fois pour sortir et aller chercher ailleurs. Elle aperçoit alors Jésus mais sans le reconnaître, et même sans le regarder, parce qu’elle ne songe qu’à ce cher corps, qu’elle voudrait oindre d’une huile précieuse, et qui est entre les mains de profanateurs. Jésus lui dit : %Femme, pourquoi pleures-tu ? Qui cherches-tu ?% Elle pense que c’est le gardien du jardin, étrange gardien, peut-être infidèle, qui doit être au courant, qui devrait comprendre son inquiétude : %Si vous l’avez emporté, dites-moi où vous l’avez mis, et j’irai le prendre.% Elle était bien venue sans se soucier de la pierre ! Elle ne veut que Lui, mais elle le veut. Alors la voix qui va au cœur et dessille les yeux, le nom familier dans la langue maternelle : %Mariam !% Aussitôt le cri : %Rabbouni, mon maître%, et déjà la Madeleine était aux pieds de Jésus, pleurante encore, mais de joie. Elle est à sa place, elle y veut demeurer, prolonger les effusions de son amour. Mais ce n’est plus le temps des larmes de la pécheresse répandues sur les pieds du Sauveur. Jésus appartient au monde d’en-haut. S’il n’est pas encore remonté vers son Père, il ne tardera pas, et il lui incombe d’en avertir ses disciples. C’est semble-t-il, le sens de cette parole : %Ne me touche pas, car je ne suis pas encore remonté vers le Père, mais va vers mes frères et dis-leur : Je monte vers mon Père et votre Père, vers mon Dieu et votre Dieu.%
        De ce moment Marie-Madeleine était consacrée l’apôtre des Apôtres. Elle obéit comme font ceux qui s’arrachent à la conversation avec leur Maître pour aller porter la bonne nouvelle : J’ai vu le Seigneur !
      responsory: |-
        R/ Marie-Madeleine et l’autre Marie se rendaient au tombeau de grand matin.
        Un ange leur dit :
        « Il n’est pas ici celui que vous cherchez.
        Il est ressuscité comme il l’a dit ».

        * Voici qu’il vous précède en Galilée, c’est là que vous le verrez.
        V/ Si quelqu’un garde ma parole,
        * Voici.

morning:
  hymn:
    - un-nouveau-matin-se-leve
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - De grand matin, le premier jour de la semaine, Marie de Magdala se rendit au tombeau.
    - psalm: OT_41
      antiphon:
        - |-
          Mon cœur est tout brûlant : je cherche mon Seigneur et je ne sais où on l’a mis.
    - psalm: PSALM_149
      antiphon:
        - Toute en pleurs, Marie se penche vers le tombeau et voit deux anges vêtus de blanc, alléluia.
  reading:
    biblicalReference: Sg 1, 1b-2
    content: Cherchez le Seigneur avec un cœur simple, car il se laisse trouver par ceux qui ne veulent pas le mettre à l’épreuve, il se manifeste à ceux qui ne refusent pas de croire en lui.
  responsory: |-
    R/ Tu es mon Dieu, je te cherche dès l’aube.
    * Mon âme a soif de toi !
    V/ Tu es mon Seigneur,
    tu es le Fils du Dieu vivant. *
    Gloire au Père.
    R/ Tu es mon Dieu.
  evangelicAntiphon:
    common:
      - Ressuscité de grand matin, le premier jour de la semaine, Jésus apparut d’abord à Marie Madeleine, et celle-ci partit aussitôt annoncer la nouvelle aux disciples, qui s’affligeait et pleurait, alléluia.
      - Admirable Marie, tu fus la première à voir se relever le Soleil véritable ; fais qu’il nous obtienne la joie de contempler sa gloire avec toi dans le ciel.
  intercession:
    content: |-
      En ce jour où nous fêtons sainte Marie Madeleine, acclamons son maître notre Seigneur, Jésus, le Christ ressuscité :

      R/ Gloire et louange à toi, Seigneur Jésus.

      Sauveur des fils d’Adam perdus,
      tu as libéré Marie Madeleine de l’emprise du démon.

      Messie de Dieu, venu annoncer le royaume des cieux,
      tu as accepté l’humble service plein d’amour de Marie Madeleine.

      Agneau de Dieu, livré en sacrifice, abandonné de tous,
      tu as connu la présence fidèle de Marie Madeleine au pied de la Croix.

      Roi de gloire, lumière qui brille dans nos ténèbres,
      devant ton tombeau vide tu t’es montré vivant à Marie Madeleine.

middleOfDay:
  psalmody:
    - psalm: PSALM_122
    - psalm: PSALM_123
    - psalm: PSALM_124
  tierce:
    antiphon: Les apôtres entendirent Marie Madeleine leur annoncer que Jésus était vivant et qu’elle l’avait vu.
    reading:
      biblicalReference: Dt 4, 29-30
      content: Tu rechercheras le Seigneur ton Dieu et tu le trouveras si tu le cherches de tout ton cœur et de toute ton âme. Dans ta détresse, tu reviendras au Seigneur ton Dieu et tu écouteras sa voix.
    responsory: |-
      V/ Il te consolera Jérusalem,
      celui qui t’a donné ton nom.
  sexte:
    antiphon: Les apôtres entendirent Marie Madeleine leur annoncer que Jésus était vivant et qu’elle l’avait vu.
    reading:
      biblicalReference: Ct 8, 6
      content: Que mon nom soit gravé dans ton cœur, qu’il soit marqué sur ton bras. Car l’amour est fort comme la mort, la passion est implacable comme l’abîme. Ses flammes sont des flammes brûlantes, c’est un feu divin !
    responsory: |-
      V/ J’ai trouvé celui que mon cœur aime.
      Je l’ai saisi et ne le lâcherai point.
  none:
    antiphon: Les apôtres entendirent Marie Madeleine leur annoncer que Jésus était vivant et qu’elle l’avait vu.
    reading:
      biblicalReference: Is 58, 8-9a
      content: |-
        Ta lumière jaillira comme l’aurore, et tes forces reviendront rapidement. Ta justice marchera devant toi, et la gloire du Seigneur t’accompagnera. Alors, si tu appelles, le Seigneur répondra ; si tu cries, il dira : « Me voici. »
    responsory: |-
      V/ Réjouis-toi, Madeleine,
      le Seigneur est ressuscité.

vespers:
  hymn:
    - madeleine-ou-vas-tu
  psalmody:
    - psalm: PSALM_121
      antiphon:
        - |-
          Jésus dit à Marie de Magdala : Pourquoi pleurer ? Qui cherches-tu ?
    - psalm: PSALM_126
      antiphon:
        - Ils ont enlevé mon Seigneur et je ne sais où ils l’ont mis.
    - psalm: NT_4
      antiphon:
        - |-
          Marie se retourna vers Jésus qui l’appelait et lui dit : Mon Maître !
  reading:
    biblicalReference: Rm 8, 28-30
    content: Nous le savons, quand les hommes aiment Dieu, lui-même fait tout contribuer à leur bien, puisqu’ils sont appelés selon le dessein de son amour. Ceux qu’il connaissait par avance, il les a aussi destinés à être l’image de son Fils, Pour faire de ce Fils l’aîné d’une multitude de frères. Ceux qu’il destinait à cette ressemblance, il les a aussi appelés ; ceux qu’il a appelés, il en a fait des justes ; et ceux qu’il a justifiés, il leur a donné sa gloire.
  responsory: |-
    R/ Réjouis-toi, Marie !
    * Christ est ressuscité !
    V/ Va vers mes frères et dis-leur : *
    V/ De mes yeux, je l’ai vu,
    il m’a dit :
    R/ Réjouis-toi.
  evangelicAntiphon:
    common:
      - |-
        Marie de Magdala vint annoncer aux disciples : J’ai vu le Seigneur. Alléluia, alléluia !
  intercession:
    content: |-
      Louons et supplions le Christ Jésus, qui a fait de sainte Marie Madeleine la première messagère de sa résurrection :

      R/ Exauce-nous, Seigneur de gloire.

      Ô Christ, tu as choisi une femme pour annoncer ta résurrection aux Apôtres,
      — fais que nous accueillons nous aussi son témoignage.

      Tu as fait découvrir à Marie Madeleine ton tombeau vide,
      — garde-nous de te chercher où tu n’es pas.

      Tu t’es fait reconnaître de Marie qui te cherchait parmi les morts,
      — prononce le nom qui nous retournera vers toi.

      Tu as béni notre terre par la protection de Marie Madeleine,
      — qu’elle intercède pour nous et nous guide vers toi.

      Tu es monté vers ton Père et notre Père,
      — suscite parmi tes frères des témoins de ta présence.

      Tu as vaincu la puissance de la mort,
      — fais entrer dans l’éternelle vie ceux qui nous ont quittés.

mass:
  - massType: DAY_MASS
    note: L’évangile ci-dessous est obligatoire.
    entranceAntiphon:
      - biblicalReference: Jn 20,17
        content: |-
          Le Seigneur dit à Marie Madeleine :
          « Va trouver mes frères pour leur dire
          >que je monte vers mon Père et votre Père,
          >vers mon Dieu et votre Dieu. »
    collect:
      - |-
        Seigneur Dieu, +
        c’est à Marie Madeleine
        >que ton Fils unique a confié
        >la première annonce de la joie pascale ; *
        accorde-nous, à sa prière et à son exemple,
        >de proclamer que le Christ est vivant /
        >et de le contempler dans la gloire de ton Royaume.
        Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Ct 3, 1-4a
            headline: « J’ai trouvé celui que mon âme désire »
            content: |-
              Paroles de la bien-aimée.
              Sur mon lit, la nuit, j’ai cherché
              celui que mon âme désire ;
              je l’ai cherché ;
              je ne l’ai pas trouvé.
              Oui, je me lèverai, je tournerai dans la ville,
              par les rues et les places :
              je chercherai
              celui que mon âme désire ;
              je l’ai cherché ;
              je ne l’ai pas trouvé.
              Ils m’ont trouvée, les gardes,
              eux qui tournent dans la ville :
              « Celui que mon âme désire,
              l’auriez-vous vu ? »
              À peine les avais-je dépassés,
              j’ai trouvé celui que mon âme désire :
              je l’ai saisi
              et ne le lâcherai pas.
          - biblicalRef: 2Co 5, 14-17
            headline: « Nous ne connaissons plus le Christ d’une manière simplement humaine »
            content: |-
              Frères,
              l’amour du Christ nous saisit
              quand nous pensons qu’un seul est mort pour tous,
              et qu’ainsi tous ont passé par la mort.
              Car le Christ est mort pour tous,
              afin que les vivants n’aient plus leur vie centrée sur eux-mêmes,
              mais sur lui, qui est mort et ressuscité pour eux.
              Désormais nous ne regardons plus personne
              d’une manière simplement humaine :
              si nous avons connu le Christ de cette manière,
              maintenant nous ne le connaissons plus ainsi.
              Si donc quelqu’un est dans le Christ,
              il est une créature nouvelle.
              Le monde ancien s’en est allé,
              un monde nouveau est déjà né.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 62 (63), 2, 3-4, 5-6, 8-9
            refAbbr: cf. 62, 2b
            chorus:
              - chorusRef: cf. 62, 2b
                content: |-
                  Mon âme a soif de toi,
                  Seigneur, mon Dieu !
            content: |-
              Dieu, tu es mon Dieu,
              je te cherche dès l’aube :
              mon âme a soif de toi ;
              après toi languit ma chair,
              terre aride, altérée, sans eau.

              Je t’ai contemplé au sanctuaire,
              j’ai vu ta force et ta gloire.
              Ton amour vaut mieux que la vie :
              tu seras la louange de mes lèvres !

              Toute ma vie je vais te bénir,
              lever les mains en invoquant ton nom.
              Comme par un festin je serai rassasié ;
              la joie sur les lèvres, je dirai ta louange.

              Oui, tu es venu à mon secours :
              je crie de joie à l’ombre de tes ailes.
              Mon âme s’attache à toi,
              ta main droite me soutient.
      - partType: GOSPEL
        partContents:
          - biblicalRef: Jn 20, 1.11-18
            headline: « Femme, pourquoi pleures-tu ? Qui cherches-tu ? »
            acclamationAntiphon: |-
              « Dis-nous, Marie Madeleine,
              qu’as-tu vu en chemin ?
              - J’ai vu le tombeau du Christ vivant,
              j’ai vu la gloire du Ressuscité. »
            content: |-
              Le premier jour de la semaine,
              Marie Madeleine se rend au tombeau de grand matin ;
              c’était encore les ténèbres.
              Elle s’aperçoit que la pierre a été enlevée du tombeau.
              Elle se tenait près du tombeau,
              au-dehors, tout en pleurs.
              Et en pleurant,
              elle se pencha vers le tombeau.
              Elle aperçoit deux anges vêtus de blanc,
              assis l’un à la tête et l’autre aux pieds,
              à l’endroit où avait reposé le corps de Jésus.
              Ils lui demandent :
              « Femme, pourquoi pleures-tu ? »
              Elle leur répond :
              « On a enlevé mon Seigneur,
              et je ne sais pas où on l’a déposé. »
              Ayant dit cela, elle se retourna ;
              elle aperçoit Jésus qui se tenait là,
              mais elle ne savait pas que c’était Jésus.
              Jésus lui dit :
              « Femme, pourquoi pleures-tu ?
              Qui cherches-tu ? »
              Le prenant pour le jardinier, elle lui répond :
              « Si c’est toi qui l’as emporté,
              dis-moi où tu l’as déposé,
              et moi, j’irai le prendre. »
              Jésus lui dit alors :
              « Marie ! »
              S’étant retournée, elle lui dit en hébreu :
              « Rabbouni ! »,
              c’est-à-dire : Maître.
              Jésus reprend :
              « Ne me retiens pas,
              car je ne suis pas encore monté vers le Père.
              Va trouver mes frères pour leur dire
              que je monte vers mon Père et votre Père,
              vers mon Dieu et votre Dieu. »
    offeringPrayer:
      - |-
        Accepte, Seigneur, les offrandes que nous te présentons
        >en faisant mémoire de la bienheureuse Marie Madeleine, *
        >puisque ton Fils unique voulut bien accepter /
        >le témoignage empressé de son amour.
        Lui qui vit et règne pour les siècles des siècles.
    prefaceList:
      - mary_magdalene
    communionAntiphon:
      - biblicalReference: 2Co 5,14.15
        content: |-
          L’amour du Christ nous saisit,
          >afin que les vivants n’aient plus leur vie centrée sur eux-mêmes,
          >mais sur lui, qui est mort et ressuscité pour eux.
    prayerAfterCommunion:
      - |-
        Que la communion à tes mystères, Seigneur,
        >nous remplisse de cet amour sans défaillance /
        qui a lié pour toujours la bienheureuse Marie Madeleine
        >à son Maître, le Christ.
        Lui qui vit et règne pour les siècles des siècles.
