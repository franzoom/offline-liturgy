celebration:
  title: Sainte Roseline
  subtitle: vierge
  commons:
    - virgins
  color: white

oration:
  - Par ton amour, Seigneur, sainte Roseline s’est consacrée à toi dans la vie religieuse afin de t’appartenir entièrement. Accorde-nous, à son exemple, de savoir contempler ton visage en le découvrant dans la prière et le service des pauvres.

readings:
  patristicReading:
    - title: DES CONFÉRENCES DE SAINT JEAN CASSIEN
      subtitle: Le but de la vie monastique.
      content: |-
        C’est la pureté du cœur qui doit être le but de toutes nos actions et de tous nos désirs, c’est pour elle que nous devons rechercher la solitude, c’est pour elle que nous devons vouloir les jeûnes, les veilles, le travail, la nudité, la lecture des Écritures et toutes les autres vertus. Ce sont là des moyens pour arriver à rendre et à conserver notre cœur hors d’atteinte de toute passion coupable, comme les marches d’un escalier permettant de monter jusqu’à la perfection de l’amour.
        Les observances n’ont pas leur but en elles-mêmes. Si par hasard nous n’avons pas pu en accomplir les obligations avec toute la rigueur que nous nous étions proposés, parce que quelque obligation louable et pressante nous en a empêchés, ne tombons pas dans la tristesse, la colère ou l’indignation. C’est cela justement que nous voulions chasser par ces actes auxquels nous avons dû renoncer. Ce qu’on gagne par le jeûne ne vaut pas ce qu’on perd par un mouvement de colère et le fruit qu’on retire de la lecture n’égale pas le dommage encouru par le mépris d’un frère. Par conséquent, les choses secondaires que sont le jeûne, les veilles, la solitude, la méditation des Écritures, sont à rapporter au but principal, c’est-à-dire à la pureté du cœur, qui est l’amour.
        Il ne s’agit pas de compromettre au nom de ces observances l’essentiel qu’elles visent : garder et préserver la charité c’est s’affranchir de tout mal, même si les circonstances nous obligent à omettre quelque pratique accessoire. Il ne nous servira de rien d’avoir accompli toutes les observances si cela nous prive de la chose qui passe avant toutes les autres et qui est à obtenir par toutes nos actions.
        Pour exercer un métier quel qu’il soit, on s’emploie à se procurer les outils nécessaires, mais ce n’est pas le plaisir de les avoir sans les utiliser, car le service qu’on en attend ne réside pas dans leur possession pure et simple, mais dans l’aide qu’ils procurent pour la réalisation efficace du métier ; ils sont des moyens pour atteindre ce but. De même les jeûnes, les veilles, la méditation des Écritures, le dépouillement, la privation de toutes les ressources ne sont pas la perfection, mais les outils pour obtenir la perfection ; ils ne renferment pas en eux-mêmes le but de ce sublime métier, ils n’en sont que les moyens. C’est en vain qu’on s’adonnerait à ces exercices si on s’en contentait comme du bien suprême en y fixant les aspirations de son cœur, au lieu de mettre tout son soin et toutes ses forces à atteindre le but qui donne son sens à cette recherche. Ce serait comme si l’on avait les outils d’un métier, sans savoir à quoi ils servent. Il faut donc éviter comme nuisible tout ce qui peut troubler la pureté et la paix de notre âme, si utile ou nécessaire que cela puisse paraître.
      responsory: |-
        R/ Qui me donnera des ailes de colombe ?
        Je volerais en lieu sûr.

        Loin, très loin, je m’enfuirais pour chercher asile au désert.

        Je crie de joie à l’ombre de tes ailes.
        Mon âme s’attache à toi, ta main droite me soutient.

        Loin, très loin, je m’enfuirais pour chercher asile au désert.
