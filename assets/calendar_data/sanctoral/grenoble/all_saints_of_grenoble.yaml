celebration:
  title: Tous les saints de l’Église de Grenoble-Vienne
  subtitle: 
  description: De nombreux saints, évêques ou abbés, sont originaires du diocèse de Grenoble. Certains sont fêtés au lieu de leur naissance lorsque ce lieu est connu. D’autres sont originaires du diocèse, mais le lieu de leur naissance ne peut être précisé, tel saint Aignan, saint Aimé. D’autres ont été moines à l’abbaye de Bonnevaux (commune de Châtonnay), de Léoncel… Cette fête les rassemble les et les autres et nous offre l’occasion de les invoquer auprès de Dieu.
  commons:
    - saints
  color: white

oration:
- |-
  Dieu notre Père, source de toute sainteté, nous proclamons tes merveilles en fêtant aujourd’hui tous les saints de notre Église de Grenoble-Vienne : tu leur as donné sur terre les grâces les plus diverses et tu les rassembles au ciel dans une même gloire. Par leur intercession, accorde à chacun d’entre nous de répondre fidèlement à sa vocation.


readings:
  patristicReading:
    - title: DES ACTES DU II^e CONCILE DU VATICAN
      subtitle: Constitution %Lumen gentium% sur l’Église, n^os 49-50
      content: |-
        Les habitants du ciel contribuent à affermir plus solidement toute l’Église en sainteté, ils ajoutent à la grandeur du culte que l’Église rend à Dieu sur la terre et l’aident de multiples façons à se construire plus largement. Car, admis dans la patrie et présents au Seigneur, par lui, avec lui et en lui, ils ne cessent d’intercéder pour nous auprès du Père, offrant les mérites qu’ils ont acquis sur terre par l’unique Médiateur de Dieu et des hommes, le Christ Jésus, servant le Seigneur en toutes choses et complétant en leur chair ce qui manque aux souffrances du Christ en faveur de son Corps qui est l’Église. Ainsi leur sollicitude fraternelle est du plus grand secours pour notre faiblesse.
        Contempler la vie des hommes qui ont suivi fidèlement le Christ est un nouveau stimulant à rechercher la Cité à venir, et en même temps nous apprenons par là à connaître le chemin très sûr par lequel, à travers les vicissitudes du monde et selon l’état et la condition propres à chacun, il nous sera possible de parvenir à l’union parfaite avec le Christ, c’est-à-dire la sainteté. Dans la vie de nos compagnons d’humanité plus parfaitement transformés à l’image du Christ, Dieu manifeste aux hommes dans une vive lumière sa présence et son visage. En eux, Dieu lui-même nous parle, il nous donne un signe de son royaume et nous y attire puissamment, tant est grande la nuée de témoins qui nous enveloppe et tant la vérité de l’Évangile se trouve attestée.
        Mais nous ne vénérons pas seulement au titre de leur exemple la mémoire des habitants du ciel ; nous cherchons bien davantage par là à renforcer l’union de toute l’Église dans l’Esprit grâce à l’exercice de la charité fraternelle. Car tout comme la communion entre les chrétiens de la terre nous approche de plus près du Christ, ainsi la communauté avec les saints nous unit au Christ, de qui découlent, comme de leur source et de leur tête, toute grâce et la vie du peuple de Dieu lui-même. Il est donc au plus haut point convenable que nous aimions ces amis et cohéritiers de Jésus Christ, nos frères aussi et nos insignes bienfaiteurs, que nous rendions à Dieu pour eux l’action de grâce qui lui est due, « que nous les invoquions avec ardeur, recourant à leurs prières, à leur secours et à leur aide pour obtenir de Dieu par son Fils Jésus Christ, notre seul Rédempteur et Sauveur, les bienfaits dont nous avons besoin ».Car, par sa nature même, tout témoignage authentique d’amour que nous présentons aux habitants du ciel, tend, comme vers son terme, au Christ « couronne de tous les saints » et par lui à Dieu qui est admirable en ses saints et glorifié en eux.
        C’est surtout dans la sainte liturgie que se réalise de la façon la plus haute notre union avec l’Église du ciel : là en effet, la vertu de l’Esprit Saint s’exerce sur nous par les signes sacramentels ; là nous proclamons, dans une joie commune, la louange de la divine Majesté ; tous, rachetés dans le sang du Christ, de toute tribu, langue, peuple ou nation et rassemblés en l’unique Église, nous glorifions le Dieu un en trois Personnes dans un chant unanime de louange.

      responsory: |-
        R/ Enveloppés d’une si grande nuée
        de témoins, fixons nos regards sur le Christ.

        Ils aspiraient à une patrie meilleure ;
        c’est pourquoi Dieu n’a pas honte de s’appeler leur Dieu,
        car il leur a préparé une ville.

        En mourant ils ont salué de loin la promesse,
        car Dieu prévoyait pour nous un sort meilleur ;
        aussi ne devaient-ils pas atteindre sans nous la perfection.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. He 12, 1-2
    content: |-
      Approchons-nous de Dieu avec pleine assurance,
      entourés d’une foule immense de témoins,
      les yeux fixés sur Jésus,
      qui est à l’origine et au terme de notre foi.
  collect:
  - |-
    Dieu notre Père, source de toute sainteté,
    nous proclamons tes merveilles
    en fêtant aujourd’hui tous les saints de notre Église de Grenoble-Vienne :
    tu leur as donné sur terre les grâces les plus diverses
    et tu les rassembles au ciel dans une même gloire.
    Par leur intercession, accorde à chacun d’entre nous
    de répondre fidèlement à sa vocation.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 4, 11-16
      content: |-
        Frères,
        le Christ a fait des dons aux hommes :
        et les dons qu’il a faits,
        ce sont les Apôtres,
        et aussi les prophètes, les évangélisateurs,
        les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        pour que les tâches du ministère soient accomplies
        et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        à l’état de l’Homme parfait,
        à la stature du Christ dans sa plénitude.
        Alors, nous ne serons plus comme des petits enfants,
        nous laissant secouer et mener à la dérive
        par tous les courants d’idées,
        au gré des hommes qui emploient la ruse
        pour nous entraîner dans l’erreur.
        Au contraire, en vivant dans la vérité de l’amour,
        nous grandirons pour nous élever en tout
        jusqu’à celui qui est la Tête, le Christ.
        Et par lui, dans l’harmonie et la cohésion,
        tout le corps poursuit sa croissance,
        grâce aux articulations qui le maintiennent,
        selon l’énergie qui est à la mesure de chaque membre.
        Ainsi le corps se construit dans l’amour.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88, 2-3.6-7.16-17
      chorus:
      - content: Sans fin, Seigneur, nous chanterons ton amour !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : c’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        Que les cieux rendent grâce pour ta merveille, Seigneur,
        et l’assemblée des saints, pour ta fidélité !
        Qui donc, là-haut, est comparable au Seigneur ?
        Qui d’entre les dieux est semblable au Seigneur ?

        Heureux le peuple qui connaît l’ovation !
        Seigneur, il marche à la lumière de ta face ;
        tout le jour, à ton nom il danse de joie,
        fier de ton juste pouvoir.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      acclamationAntiphon: |-
        Heureux ceux que Dieu a choisis
        pour être les témoins du Christ ressuscité.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis,
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres.
  offeringPrayer:
  - |-
    Accueille avec bonté, Seigneur,
    l’offrande que nous te présentons
    pour fêter les saints de notre Église ;
    Fais que nous sachions, à leur exemple,
    t’aimer et aimer notre prochain
    d’un cœur plus généreux.
    Par Jésus.
  communionAntiphon:
  - biblicalReference: Ps 67, 4
    content: |-
      Au banquet du Seigneur les justes sont en fête,
      en sa présence ils débordent d’allégresse.
  prayerAfterCommunion:
  - |-
    Dieu, qui nous réconfortes par un même pain
    et nous soutiens d’une même espérance,
    resserre chaque jour les liens de notre unité,
    afin que, formant avec tous les saints de notre Église
    un seul corps et un seul esprit dans le Christ,
    nous ressuscitions avec lui dans la gloire.
    Lui qui règne.
        


