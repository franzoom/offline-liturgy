celebration:
  title: Anniversaire de la dédicace de la Cathédrale
  subtitle: |-
    fête (à la cathédrale : Solennité)
  description: En 1913, saint Pie X prescrit que toutes les cathédrales fêtent l’anniversaire de leur dédicace à une date distincte de la dédicace des autres églises. En 1915, Mgr Louis-Joseph Maurin, évêque de Grenoble, fixe au 22 juin la dédicace de son église cathédrale connue sous le vocable de Notre-Dame dès le VII^e siècle. Le 22 juin 2008, Mgr Guy de Kerimel consacre le nouvel autel majeur. L’église cathédrale est l’église-mère de toutes les églises du diocèse et le siège de l’évêque représentant le Christ pour diriger le peuple de Dieu.
  commons:
    - dedicace_outside
    - dedicace_inside
  color: white

oration:
- |-
  Au jour où notre église cathédrale te fut consacrée, sous le vocable de la sainte Vierge Marie, écoute, Seigneur, la prière de ton peuple : donne-lui de ne faire qu’un avec son évêque dans le service du Christ et de son Église, sous la protection de Notre-Dame.

mass:
- massType: DAY_MASS
  note: |-
    À la cathédrale, la fête devient solennité : deux lectures propres (Is 56, 1.6-7 puis Ap 21, 1-5a), Gloria, Credo, et la préface propre "dedication_of_grenoble_cathedral" au lieu de la préface n°2 de la Dédicace (Missel romain) donnée ici pour le reste du diocèse.
  entranceAntiphon:
  - biblicalReference: Ap 21, 2
    content: |-
      J’ai vu la cité sainte, la Jérusalem nouvelle,
      qui descendait du ciel, d’auprès de Dieu,
      toute prête, comme une fiancée parée pour son époux.
  collect:
  - |-
    Au jour où notre église cathédrale te fut consacrée,
    sous le vocable de la sainte Vierge Marie,
    écoute, Seigneur, la prière de ton peuple :
    donne-lui de ne faire qu’un avec son évêque
    dans le service du Christ et de son Église,
    sous la protection de Notre-Dame.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 83, 3.4.5-6.11cd
      chorus:
      - content: De quel amour j’aime ta demeure, Dieu de l’univers !
      content: |-
        Mon âme s’épuise à désirer
        les parvis du Seigneur ;
        mon cœur et ma chair sont un cri
        vers le Dieu vivant !

        L’oiseau lui-même s’est trouvé une maison,
        et l’hirondelle, un nid pour abriter sa couvée :
        tes autels, Seigneur de l’univers,
        mon Roi et mon Dieu !

        Heureux les habitants de ta maison :
        ils pourront te chanter encore !
        Heureux les hommes dont tu es la force :
        des chemins s’ouvrent dans leur cœur !

        J’ai choisi de me tenir sur le seuil,
        dans la maison de mon Dieu,
        plutôt que d’habiter
        parmi les infidèles.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 19, 1-10
      acclamationAntiphon: |-
        Le Seigneur a choisi cette maison et il l’a consacrée
        pour que son nom y demeure à jamais.
      content: |-
        En ce temps-là,
        entré dans la ville de Jéricho, Jésus la traversait.
        Or, il y avait un homme du nom de Zachée ;
        il était le chef des collecteurs d’impôts,
        et c’était quelqu’un de riche.
        Il cherchait à voir qui était Jésus,
        mais il ne le pouvait pas à cause de la foule,
        car il était de petite taille.
        Il courut donc en avant
        et grimpa sur un sycomore
        pour voir Jésus qui allait passer par là.
        Arrivé à cet endroit,
        Jésus leva les yeux et lui dit :
        « Zachée, descends vite :
        aujourd’hui il faut que j’aille demeurer dans ta maison. »
        Vite, il descendit
        et reçut Jésus avec joie.
        Voyant cela, tous récriminaient :
        « Il est allé loger chez un homme qui est un pécheur. »
        Zachée, debout, s’adressa au Seigneur :
        « Voici, Seigneur :
        je fais don aux pauvres de la moitié de mes biens,
        et si j’ai fait du tort à quelqu’un,
        je vais lui rendre quatre fois plus. »
        Alors Jésus dit à son sujet :
        « Aujourd’hui, le salut est arrivé pour cette maison,
        car lui aussi est un fils d’Abraham.
        En effet, le Fils de l’homme est venu chercher et sauver
        ce qui était perdu. »
  offeringPrayer:
  - |-
    Accueille, Seigneur, le sacrifice que nous t’offrons,
    et donne à ceux qui te supplient dans ton Église
    d’être fortifiés par tes sacrements
    et de voir leurs prières exaucées.
    Par Jésus.
  prefaceList:
  - dedicace_2
  - dedication_of_grenoble_cathedral
  communionAntiphon:
  - biblicalReference: cf. 1 P 2, 5
    content: |-
      Nous sommes des pierres vivantes,
      qui servent à construire le Temple spirituel,
      le peuple sacerdotal qui appartient à Dieu.
  prayerAfterCommunion:
  - |-
    Tu as voulu, Seigneur, que ton Église de la terre
    soit pour nous l’annonce de la Jérusalem céleste ;
    accorde-nous, par cette communion,
    d’être ici-bas le temple de ta grâce
    et d’entrer un jour dans la demeure de ta gloire.
    Par Jésus.
