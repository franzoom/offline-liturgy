celebration:
  title: Saint Domnin
  subtitle: premier évêque de Grenoble
  description: Premier évêque de Grenoble, ville que l’empereur Gratien, ami d’Ambroise, évêque de Milan, venait d’élever au rang de cité, Domnin participe en 381 au Concile d’Aquilée qui termine la querelle arienne.
  commons:
    - pastors_bishop
  color: white

oration:
- |-
  Dieu éternel et tout-puissant, tu as donné à l’évêque saint Domnin la charge de guider ton peuple : puisqu’il intercède en notre faveur, accorde-nous les largesses de ton amour.

readings:
  patristicReading:
    - title: COMMENTAIRE DE SAINT HILAIRE SUR LE PSAUME 126
      subtitle: Si le Seigneur ne bâtit la maison...
      content: |-
        %Si le Seigneur ne bâtit la maison, en vain travaillent les bâtisseurs%. %Vous êtes le temple de Dieu, et l’Esprit de Dieu habite en vous%. Cette maison et ce temple de Dieu, rempli des enseignements et des grâces de Dieu, cette résidence qui contient la sainteté du cœur de Dieu, le même prophète lui a rendu ce témoignage : Ton temple est saint, merveilleux de justice. La sainteté, la justice, la chasteté de l’homme est un temple pour Dieu.
        Cette maison doit donc être bâtie par Dieu. Une construction élevée par le travail des hommes ne dure pas, ce qui est institué selon les doctrines du monde ne tient pas, nos vains travaux et nos soins attentifs sont des gardiens inutiles.
        Il faudra donc bâtir autrement, garder autrement cette maison. Il ne faut pas la fonder sur le sol, sur un sable fluide et fuyant ; il faut poser son fondement sur les prophètes et les Apôtres.
        Il faut l’élever avec des pierres vivantes, la faire tenir par la pierre d’angle, la faire monter par des assemblages progressifs jusqu’à l’homme parfait et à la stature du corps du Christ ; il faut la décorer par l’éclat et la beauté des grâces spirituelles.
        Si elle doit être ainsi bâtie par Dieu, c’est-à-dire selon ses enseignements, elle ne tombera pas. Cette maison se développera en plusieurs autres, par l’édification de toute sorte que les fidèles procurent à chacun de nous, pour l’embellissement et l’accroissement de la cité bienheureuse.
        De cette cité, Dieu est depuis longtemps le gardien vigilant : il protège Abraham dans sa vie nomade, il préserve Isaac de l’immolation, il enrichit Jacob dans sa servitude, il fait de Joseph vendu le chef de l’Égypte, il soutient Moïse devant Pharaon, il choisit Josué comme chef de guerre, il délivre David de tous les dangers, il console Salomon du don de la sagesse, il assiste les prophètes. il ravit Élie au ciel, il choisit Élisée, il nourrit Daniel, il rafraîchit les trois enfants dans la fournaise et s’adjoint à eux. Lorsqu’il est conçu de la Vierge, il instruit Joseph par un ange et il rassure Marie ; il envoie Jean devant lui ; il choisit les Apôtres et il prie le Père en disant : %Père saint, garde-les ; quand j’étais avec eux, je les gardais en ton nom…% Enfin, après la Passion, il promet de veiller sur nous et de nous garder éternellement, lorsqu’il dit : %Voici que je suis avec vous tous les jours jusqu’à la fin des temps%.
        Ce qui garde éternellement cette cité bienheureuse et sainte, c’est qu’elle est une cité pour Dieu, constituée par la réunion d’une multitude dans l’unité, et existant en chacun de nous. C’est donc au Seigneur de bâtir lui-même cette cité, pour qu’elle grandisse jusqu’à atteindre sa consommation. Car Si elle n’est pas parfaite dès le début de la construction, au terme la maison est parfaite.

      responsory: |-
        R/ Approchons-nous de la pierre vivante,
        rejetée par les hommes, mais choisie par Dieu.

        Montez à la montagne et rebâtissez ma maison, dit le Seigneur,
        j’y trouverai ma joie et ma gloire.

        La gloire future de ce temple dépassera l’ancienne,
        et dans ce lieu je donnerai la paix.

        Vous-mêmes, comme pierres vivantes,
        entrez dans la construction de l’édifice spirituel.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ez 34, 11.23.24
    content: |-
      « Je prendrai soin de mon troupeau,
      dit le Seigneur.
      Je lui donnerai moi-même un berger
      pour le conduire.
      Et moi, le Seigneur, je serai leur Dieu »
  collect:
  - |-
    Dieu éternel et Tout-Puissant,
    tu as donné à l’évêque saint Domnin
    la charge de guider ton peuple :
    puisqu’il intercède en notre faveur,
    accorde-nous les largesses de ton amour.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Col 1, 24-29
      content: |-
        Frères,
        maintenant je trouve la joie dans les souffrances
        que je supporte pour vous ;
        ce qui reste à souffrir des épreuves du Christ
        dans ma propre chair,
        je l’accomplis pour son corps qui est l’Église.
        De cette Église, je suis devenu ministre,
        et la mission que Dieu m’a confiée,
        c’est de mener à bien pour vous l’annonce de sa parole,
        le mystère qui était caché depuis toujours
        à toutes les générations,
        mais qui maintenant a été manifesté
        à ceux qu’il a sanctifiés.
        Car Dieu a bien voulu leur faire connaître
        en quoi consiste la gloire sans prix de ce mystère
        parmi toutes les nations :
        le Christ est parmi vous,
        lui, l’espérance de la gloire !
        Ce Christ, nous l’annonçons :
        nous avertissons tout homme,
        nous instruisons chacun en toute sagesse,
        afin de l’amener à sa perfection dans le Christ.

        C’est pour cela que je m’épuise à combattre,
        avec la force du Christ
        dont la puissance agit en moi.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15, 1-2.7-8.10-11ab
      chorus:
      - content: Dieu, mon bonheur et ma joie !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge,
        j’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Tu ne peux m’abandonner à la mort,
        ni laisser ton ami voir la corruption
        tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      acclamationAntiphonReference: cf. Jn 10, 14-15
      acclamationAntiphon: |-
        Jésus, le bon Pasteur, connaît ses brebis et ses brebis le connaissent :
        pour elles il a donné sa vie.
      content: |-
        En ce temps-là,
        Jésus disait :
        « Moi, je suis le bon pasteur, le vrai berger,
        qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        les brebis ne sont pas à lui :
        s’il voit venir le loup,
        il abandonne les brebis et s’enfuit ;
        le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        je connais mes brebis,
        et mes brebis me connaissent,
        comme le Père me connaît,
        et que je connais le Père ;
        et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        qui ne sont pas de cet enclos :
        celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        il y aura un seul troupeau
        et un seul pasteur. »
  offeringPrayer:
  - |-
    En célébrant, Seigneur, la mémoire de saint Domnin,
    nous offrons ce sacrifice à ta louange ;
    c’est en lui que nous mettons notre espoir :
    qu’il nous délivre du mal
    aujourd’hui et demain.
    Par Jésus.
  communionAntiphon:
  - biblicalReference: Mt 25, 21
    content: |-
      « C’est bien, bon et fidèle serviteur, dit le Seigneur,
      tu as été fidèles en de petites choses.
      Je t’établirai sur de plus grandes.
      Entre dans la joie de ton maître. »
  prayerAfterCommunion:
  - |-
    Déjà rénovés par cette Eucharistie,
    nous te supplions humblement, Seigneur :
    puissions-nous, en prenant exemple sur saint Domnin,
    professer ce qu’il a cru
    et pratiquer ce qu’il a enseigné.
    Par Jésus.


