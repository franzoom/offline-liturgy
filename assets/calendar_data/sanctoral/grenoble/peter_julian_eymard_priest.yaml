celebration:
  title: Saint Pierre-Julien Eymard
  subtitle: prêtre
  description: Né à La Mure en 1811, Pierre-Julien Eymard est ordonné prêtre le 20 juillet 1834. Nommé d’abord vicaire à Chatte, puis curé de Monteynard, il entre cinq ans plus tard dans la Société de Marie. Il fut un propagateur merveilleux du culte du mystère eucharistique, ce qui le conduisit à fonder deux nouvelles Congrégations, la société des Prêtres du Saint-Sacrement (1856) et celle des Servantes du Saint-Sacrement (1858). Il meurt à La Mure le 1^er août 1868. Inhumé au cimetière de La Mure, son corps est transporté à Paris en 1877. Le pape Jean XXIII le proclame saint le 9 décembre 1962.
  commons:
    - pastors
  color: white

oration:
- |-
  Seigneur Jésus Christ, Fils du Dieu vivant, qui, pour promouvoir en tous lieux le culte du sacrement de l’Eucharistie, as suscité saint Pierre-Julien Eymard et par lui as donné à ton Église de nouveaux enfants : accorde-nous, par son intercession et à son exemple, de devenir en esprit et vérité les adorateurs et les témoins d’un si grand mystère.

readings: 
  patristicReading:
    - title: DIRECTOIRE DES AGRÉGÉS, PAR SAINT PIERRE JULIEN EYMARD
      subtitle: Le disciple de Jésus Christ peut arriver à la perfection par deux voies
      content: |-
        Le disciple de Jésus Christ peut arriver à la perfection par deux voies.
        La première, c’est la loi du devoir : on va progressivement du travail des vertus à l’amour qui est le lien de la perfection. Cette voie est longue et pénible ; peu arrivent par elle à la perfection : car après avoir gravi pendant quelque temps la montagne de Dieu ils s’arrêtent et se découragent à la vue de ce qui leur reste à gravir, et redescendent ou roulent au fond de l’abîme en disant : c’est trop difficile ; c’est impossible...
        La seconde voie est plus courte et plus noble : c’est celle de l’amour, mais de l’amour royal. Avant d’agir, le disciple de l’amour commence par estimer et aimer ; l’amour suit la connaissance ; et pour cela l’adorateur s’élance jusqu’à la cime de la montagne... où l’amour a sa demeure...
        Et là, comme l’aigle royal, il contemple ce soleil d’amour, pour en bien connaître la beauté et la puissance. Il ose même, comme disciple bien-aimé, se reposer sur la poitrine du Sauveur... pour s’y réchauffer, y fortifier ses forces, et partir de là, comme la foudre de la nue qui l’a formée, comme les rayons du soleil dont ils émanent. Le mouvement suit la puissance de son moteur, et le cœur l’amour qui l’anime.
        L’amour, voilà le premier point de départ de la vie chrétienne ; c’est le point de départ de Dieu vers sa créature, de Jésus Christ vers l’homme : rien de plus juste que ce soit celui de l’homme vers Dieu.
        Mais avant d’être au point de départ, il faut que l’amour de Jésus soit un point de ralliement et de recueillement de toutes les facultés de l’homme ; une école où l’on apprend à connaître Jésus Christ... C’est surtout dans l’oraison que l’âme connaît Jésus Christ, qu’il se révèle à elle.

      responsory: |-
        R/ Souvenons-nous quel amour 
        Jésus nous manifeste : 
        * Il donna sa vie pour nous.

        V/ Il donna son corps
        et répandit son sang en rémission des péchés.
        * Il donna sa vie pour nous.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 65, 4
    content: |-
      Toute la terre se prosterne devant toi, Seigneur,
      elle chante pour toi, elle chante ton Nom.
  collect:
  - |-
    Seigneur Jésus Christ, Fils du Dieu vivant,
    qui, pour promouvoir en tous lieux
    >le culte du sacrement de l’Eucharistie,
    as suscité saint Pierre-Julien Eymard
    et par lui as donné à ton Église de nouveaux enfants :
    accorde-nous, par son intercession et à son exemple,
    de devenir en esprit et vérité les adorateurs
    et les témoins d’un si grand mystère.
    Toi qui vis et règne pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Jn 4, 7-11
      content: |-
        Bien-aimés,
        aimons-nous les uns les autres,
        puisque l’amour vient de Dieu.
        Celui qui aime est né de Dieu
        et connaît Dieu.
        Celui qui n’aime pas n’a pas connu Dieu,
        car Dieu est amour.
        Voici comment l’amour de Dieu
        s’est manifesté parmi nous :
        Dieu a envoyé son Fils unique dans le monde
        pour que nous vivions par lui.
        Voici en quoi consiste l’amour :
        ce n’est pas nous qui avons aimé Dieu,
        mais c’est lui qui nous a aimés,
        et il a envoyé son Fils
        en sacrifice de pardon pour nos péchés.
        Bien-aimés,
        puisque Dieu nous a tellement aimés,
        nous devons, nous aussi, nous aimer les uns les autres.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 83, 3.4.5-6a.8a.11cd
      chorus:
      - content: De quel amour j’aime ta demeure, Dieu de l’univers !
      content: |-
        Mon âme s’épuise à désirer
        les parvis du Seigneur :
        mon cœur et ma chair sont un cri
        vers le Dieu vivant !

        L’oiseau lui-même s’est trouvé une maison,
        et l’hirondelle, un nid pour abriter sa couvée :
        tes autels, Seigneur de l’univers,
        mon Roi et mon Dieu !

        Heureux les habitants de ta maison :
        ils pourront te chanter encore !
        Heureux les hommes dont tu es la force :
        ils vont de hauteur en hauteur.

        J’ai choisi de me tenir sur le seuil,
        dans la maison de mon Dieu,
        plutôt que d’habiter
        parmi les infidèles.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 6, 60-69
      acclamationAntiphonReference: Ps 85, 9
      acclamationAntiphon: |-
        Toutes les nations que tu as faites,
        viendront se prosterner devant toi, Seigneur,
        et rendre gloire à ton nom.
      content: |-
        En ce temps-là,
        Jésus avait donné un enseignement
        dans la synagogue de Capharnaüm.
        Beaucoup de ses disciples, qui avaient entendu, déclarèrent :
        « Cette parole est rude !
        Qui peut l’entendre ? »
        Jésus savait en lui-même
        que ses disciples récriminaient à son sujet.
        Il leur dit :
        « Cela vous scandalise ?
        Et quand vous verrez le Fils de l’homme
        monter là où il était auparavant !...
        C’est l’esprit qui fait vivre,
        la chair n’est capable de rien.
        Les paroles que je vous ai dites sont esprit
        et elles sont vie.
        Mais il y en a parmi vous qui ne croient pas. »
        Jésus savait en effet depuis le commencement
        quels étaient ceux qui ne croyaient pas,
        et qui était celui qui le livrerait.
        Il ajouta :
        « Voilà pourquoi je vous ai dit
        que personne ne peut venir à moi
        si cela ne lui est pas donné par le Père. »
        À partir de ce moment, beaucoup de ses disciples s’en retournèrent
        et cessèrent de l’accompagner.
        Alors Jésus dit aux Douze :
        « Voulez-vous partir, vous aussi ? »
        Simon-Pierre lui répondit :
        « Seigneur, à qui irions-nous ?
        Tu as les paroles de la vie éternelle.
        Quant à nous, nous croyons,
        et nous savons que tu es le Saint de Dieu. »
  offeringPrayer:
  - |-
    Seigneur, tu as mis au cœur de saint Pierre-Julien
    un ardent amour pour célébrer dignement
    le mystère de l’Eucharistie ;
    fais que le même amour embrase nos cœurs.
    Par Jésus.
  communionAntiphon:
  - biblicalReference: Jn 6, 56-57
    content: |-
      « Celui qui mange ma chair et boit mon sang
      demeure en moi et moi je demeure en lui, dit le Seigneur.
      De même que le Père, qui est vivant, m’a envoyé,
      et que moi je vis par le Père,
      de même aussi celui qui me mangera
      vivra par moi. »
  prayerAfterCommunion:
  - |-
    Transformés de jour en jour par la célébration
    du mystère pascal,
    nous te prions, Seigneur :
    que ce mystère ineffable devienne pour nous
    à la suite de saint Pierre-Julien,
    une source permanente de contemplation.
    Par Jésus.
