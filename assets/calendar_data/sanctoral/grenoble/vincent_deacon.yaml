celebration:
  title: Saint Vincent
  subtitle: diacre et martyr, patron secondaire du diocèse
  description: |-
    Vincent, diacre de Saragosse, est mis à mort à Valence (Espagne) avec son évêque Valère en 304-305, après avoir été torturé. Comme saint Laurent de Rome, Vincent offre l’exemple accompli du service dans l’Église : ministre de l’évêque pour l’offrande du sacrifice et le gouvernement de la communauté, le diacre doit l’accompagner aussi à l’heure suprême du témoignage. Dès le X^e siècle Vincent est vénéré à Grenoble.
  commons:
    - martyr
  color: red

oration:
- |-
  Dieu éternel et tout-puissant, daigne répandre en nous ton Esprit : que nos cœurs soient fortifiés par cet amour qui aidait saint Vincent à tenir sous la torture.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AUGUSTIN POUR LA FÊTE DE SAINT VINCENT
      subtitle: 
      content: |-
        Dieu vous a fait la grâce à l’égard du Christ, dit saint Paul, %non seulement de croire en lui, mais encore de souffrir pour lui%.
        Le diacre Vincent avait reçu l’un et l’autre. Car s’il ne les avait pas reçus, qu’aurait-il gardé ? Il gardait confiance en parlant, il gardait patience en souffrant. 
        Que nul ne présume donc de son cœur, quand il prononce la parole ; que nul ne se confie à ses forces quand il subit l’épreuve. En effet, lorsque nous disons sagement de bonnes choses, notre sagesse vient de Dieu, et lorsque nous souffrons courageusement de mauvaises choses, notre patience vient de lui. 
        Rappelez-vous le Christ Seigneur avertissant ses disciples dans l’Évangile ; rappelez-vous le Roi des martyrs munissant ses cohortes d’armes spirituelles, leur annonçant la guerre, leur fournissant des secours, leurs promettant des récompenses, il ajoute aussitôt pour calmer leur terreur : %Mais ayez confiance, j’ai vaincu le monde%.
        Pourquoi donc nous étonner, mes très chers, si Vincent a été vainqueur en celui par qui le monde fut vaincu ? %En ce monde, vous serez opprimés%. Le monde opprime, mais ne supprime pas ; il peut combattre, mais non abattre. Le monde lance deux armées contre les soldats du Christ. Il flatte pour tromper, il terrorise pour briser. Que notre propre plaisir ne nous paralyse pas, que la cruauté d’autrui ne nous terrorise pas, et le monde est vaincu.
        Dans les deux cas le Christ se présente, et le chrétien n’est pas vaincu. Si l’on considère, dans ce martyre, la persévérance de l’homme, on le trouve d’abord incroyable ; Si l’on y reconnaît la puissance de Dieu, il n’est plus invraisemblable.
        Une telle cruauté s’acharnait sur le corps du martyr et une telle tranquillité s’exprimait dans sa voix, un tel raffinement de supplices s’attaquait à ses membres et un tel apaisement résonnait dans ses paroles que nous pensions ; chose étonnante, c’est Vincent qui est la victime, et on en torture un autre qui ne parle pas. 
        Et vraiment, mes frères, c’était cela, c’était tout à fait cela : c’est un autre qui parlait. Car Jésus en a fait la promesse à ses témoins qu’il préparait à de tels combats. Il leur dit, selon l’Évangile : %Ne vous tourmentez pas pour savoir ce que vous direz ni comment vous le direz. Car ce n’est pas vous qui parlerez, c’est l’Esprit de votre Père qui parlera en vous%.
        La chair souffrait, l’Esprit parlait, et la parole de l’Esprit non seulement condamnait l’incroyance, mais encore soutenait l’impuissance.

      responsory: |-
        R/ Connaître le Christ,
        La puissance de sa résurrection,
        Et la communion à ses souffrances.

        Pour lui j’ai tout perdu,
        et je cours vers le seul but.

        Lui, le premier, m’a saisi,
        de tout mon élan, je veux le saisir.

morning:
  evangelicAntiphon:
    common:
    - |-
      Proclamons les louanges du très-haut, qui a donné au diacre Vincent une fermeté invincible pour confesser la foi, et la couronne des vainqueurs.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Saint Vincent, soumis à la torture mais rendu fort par la présence de Dieu, avait le visage joyeux et disait : Voilà ce que j’ai toujours désiré, ce que j’ai cherché de tous mes vœux.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: 1 Jn 5, 4
    content: |-
      Tout ce qui est né de Dieu est vainqueur du monde,
      et la victoire qui a triomphé du monde, c’est notre foi.
  collect:
  - |-
    Dieu éternel et tout-puissant,
    daigne répandre en nous ton Esprit :
    que nos cœurs soient fortifiés par cet amour
    qui aidait saint Vincent à tenir sous la torture.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 4, 12-19
      content: |-
        Bien-aimés,
        ne trouvez pas étrange le brasier allumé parmi vous
        pour vous mettre à l’épreuve ;
        ce qui vous arrive n’a rien d’étrange.
        Dans la mesure où vous communiez aux souffrances du Christ,
        réjouissez-vous,
        afin d’être dans la joie et l’allégresse
        quand sa gloire se révélera.
        Si l’on vous insulte pour le nom du Christ,
        heureux êtes-vous,
        parce que l’Esprit de gloire, l’Esprit de Dieu,
        repose sur vous.
        Que personne d’entre vous, en effet,
        n’ait à souffrir comme meurtrier, voleur, malfaiteur,
        ou comme agitateur.
        Mais si c’est comme chrétien,
        qu’il n’ait pas de honte,
        et qu’il rende gloire à Dieu pour ce nom-là.
        Car voici le temps du jugement :
        il commence par la famille de Dieu.
        Or, s’il vient d’abord sur nous,
        quelle sera la fin de ceux qui refusent d’obéir à l’Évangile de Dieu ?
        Et, si le juste est sauvé à grand-peine,
        l’impie, le pécheur, où va-t-il se montrer ?
        Ainsi, ceux qui souffrent
        en faisant la volonté de Dieu,
        qu’ils confient leurs âmes au Créateur fidèle,
        en faisant le bien.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33, 2-3.16-17.18-19.20-21
      chorus:
      - content: Je bénirai le Seigneur toujours et partout
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Le Seigneur regarde les justes,
        il écoute, attentif à leurs cris.
        Le Seigneur affronte les méchants
        pour effacer de la terre leur mémoire.

        Le Seigneur entend ceux qui l’appellent :
        de toutes leurs angoisses, il les délivre.
        Il est proche du cœur brisé,
        il sauve l’esprit abattu.

        Malheur sur malheur pour le juste,
        mais le Seigneur chaque fois le délivre.
        Il veille sur chacun de ses os,
        pas un ne sera brisé.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 23-26
      acclamationAntiphonReference: Ap 2, 10
      acclamationAntiphon: |-
        Reste fidèle jusqu’à la mort, dit le Seigneur
        et tu recevras de mes mains la couronne de vie.
      content: |-
        En ce temps-là,
        Jésus disait à tous :
        « Celui qui veut marcher à ma suite,
        qu’il renonce à lui-même,
        qu’il prenne sa croix chaque jour
        et qu’il me suive.
        Car celui qui veut sauver sa vie
        la perdra ;
        mais celui qui perdra sa vie à cause de moi
        la sauvera.
        Quel avantage un homme aura-t-il
        à gagner le monde entier,
        s’il se perd ou se ruine lui-même ?
        Celui qui a honte de moi et de mes paroles,
        le Fils de l’homme aura honte de lui,
        quand il viendra dans la gloire,
        la sienne, celle du Père et des saints anges. »
  offeringPrayer:
  - |-
    Nous te présentons avec joie, Seigneur,
    ces offrandes ;
    En célébrant ainsi la victoire de saint Vincent,
    nous proclamons tes merveilles
    et nous bénéficions de son glorieux appui auprès de toi.
    Par Jésus.
  prefaceList:
  - vincent_of_saragossa
  communionAntiphon:
  - biblicalReference: Ap 2, 17
    content: |-
      « Au vainqueur, je donnerai la manne cachée, dit le Seigneur,
      et un nom nouveau que personne ne connaît,
      sinon celui qui le reçoit. »
  prayerAfterCommunion:
  - |-
    Fortifie-nous, Seigneur,
    par cette Eucharistie ;
    Que nous puissions vaincre les attraits du péché
    avec le courage que montra saint Vincent
    quand il subit le martyre,
    pour demeurer fidèle à ton Nom.
    Par Jésus.

