celebration:
  title: Notre-Dame de la Treille
  subtitle: patronne de la ville et du diocèse de Lille, titulaire de la cathédrale
  commons:
    - virgin-mary
  color: white

oration:
  - Dieu de miséricorde, notre Père, ton Fils unique, en mourant sur la croix, a voulu que la Vierge Marie, sa mère, soit aussi notre mère. Accorde à l’Église de Lille, soutenue par son amour, la joie de donner naissance à des enfants toujours plus nombreux, de les voir grandir en sainteté et d’attirer à elle tous ceux qui habitent cette région.

readings:
  biblicalReading:
    - title: |-
        Lecture : L’Emmanuel, Roi de la Paix
      ref: Is 7, 10-14 ; 11, 1-9
      content: |-
        Le Seigneur parla encore ainsi au roi Acaz : « Demande pour toi un signe de la part du Seigneur ton Dieu, au fond du séjour des morts ou sur les sommets, là-haut. ». Acaz répondit : « Non, je n’en demanderai pas, je ne mettrai pas le Seigneur à l’épreuve. ». Isaïe dit alors : « Écoutez, maison de David ! Il ne vous suffit donc pas de fatiguer les hommes : il faut encore que vous fatiguiez mon Dieu ! C’est pourquoi le Seigneur lui-même vous donnera un signe : Voici que la vierge est enceinte, elle enfantera un fils, qu’elle appellera Emmanuel (c’est-à-dire : Dieu-avec-nous).
        Un rameau sortira de la souche de Jessé, père de David, un rejeton jaillira de ses racines. Sur lui reposera l’esprit du Seigneur : esprit de sagesse et de discernement, esprit de conseil et de force, esprit de connaissance et de crainte du Seigneur — qui lui inspirera la crainte du Seigneur. Il ne jugera pas sur l’apparence ; il ne se prononcera pas sur des rumeurs. Il jugera les petits avec justice ; avec droiture, il se prononcera en faveur des humbles du pays. Du bâton de sa parole, il frappera le pays ; du souffle de ses lèvres, il fera mourir le méchant. La justice est la ceinture de ses hanches ; la fidélité est la ceinture de ses reins.
        Le loup habitera avec l’agneau, le léopard se couchera près du chevreau, le veau et le lionceau seront nourris ensemble, un petit garçon les conduira. La vache et l’ourse auront même pâture, leurs petits auront même gîte. Le lion, comme le bœuf, mangera du fourrage. Le nourrisson s’amusera sur le nid du cobra ; sur le trou de la vipère, l’enfant étendra la main. Il n’y aura plus de mal ni de corruption sur toute ma montagne sainte ; car la connaissance du Seigneur remplira le pays comme les eaux recouvrent le fond de la mer.
      responsory: |-
        R/ La vierge enfantera un fils,
        qu’elle appellera Emmanuel.

        Ne crains pas, Marie,
        tu as trouvé grâce auprès de Dieu.
        Voici, tu concevras et enfanteras un fils.

        Cet enfant sera grand,
        on l’appellera : Fils du Très-Haut,
        le Seigneur lui donnera le trône de David son père.
  patristicReading:
    - title: Homélie de Saint Bernard pour le 2e dimanche de l’Avent
      content: |-
        La tige issue de la racine de Jessé c’est la Vierge, Mère de Dieu et la fleur sur qui repose l’Esprit Saint, c’est son Fils.
        Ô Marie, Tige très haute jusqu’à quel sommet de sainteté tu t’élèves !
        Jusqu’à t’asseoir sur le Trône, jusqu’à partager la gloire du Seigneur. Rien d’étonnant à cela, car dans les
        hauteurs tu enfonces les racines de l’humilité… Véritable arbre de la vie qui seul fus digne de porter le fruit du salut !
        La Vierge est donc la voie royale par laquelle est venu le Sauveur, sorti de ses entrailles « %Comme un époux de sa chambre nuptiale% ». Efforçons-nous donc de monter par cette voie par laquelle le Christ est descendu jusqu’à nous, d’aller vers sa grâce par la voie qu’Il a prise pour venir vers notre misère.
        Que par Toi, Mère bénie de la grâce, Mère de la Vie et du Salut, nous ayons accès au Fils et qu’ainsi nous reçoive par toi celui qui par toi nous a été donné. Que ta pureté efface à ses yeux notre corruption que ton humilité si douce auprès de Dieu nous obtienne la miséricorde pour notre orgueil. Que la surabondance de ton amour couvre la multitude de nos fautes et que ton admirable fécondité nous rende féconds pour le Royaume.
        Notre Dame, notre Médiatrice, notre Avocate, réconcilions-nous avec ton Fils. Confie-nous à ton Fils. Offre-nous à ton Fils.
        Au nom de la grâce que tu as acquise, Vierge bénite, au nom du privilège que tu as obtenu de la Miséricorde que tu as enfantée, promets que celui qui par ta médiation est devenu participant de notre faiblesse et de notre misère, nous rende par ton intercession participants de sa gloire et de sa béatitude : Lui, le Christ Jésus, ton Fils, notre Seigneur, béni au-delà de tout dans les siècles des siècles.
      responsory: |-
        R/ Tu es la gloire de ton peuple, Vierge Marie.

        Ton nom sera de par Dieu, pour toujours
        « celle qui a trouvé grâce devant Lui ».

        Lève-toi, tiens-toi sur la hauteur
        debout près de la Croix.

        Vois tes enfants, du levant au couchant rassemblés, car ton Fils attire tout à Lui.

morning:
  evangelicAntiphon:
    common:
      - Comme une vigne, j’ai produit des pousses gracieuses et mes fleurs ont donné des fruits de grâce et de sainteté. Venez à moi, vous tous qui me désirez et rassasiez-vous de mes fruits.

vespers:
  evangelicAntiphon:
    common:
      - Dieu a manifesté sa bonté, et notre terre a donné son fruit.
