celebration:
  title: Saint Piat
  subtitle: martyr, premier missionnaire de la région de Lille
  commons:
    - martyr
    - pastors
  color: red

oration:
  - Dans ton amour, Seigneur, tu as rendu féconde la mort de saint Piat. Donne-nous à sa prière, la force de confirmer par toute notre vie, la Foi que nos lèvres proclament.

readings:
  patristicReading:
    - title: Traité de S. Irénée contre les hérésies
      subtitle: Nos pères, évangélisés par saint Piat, ne connaissent peut-être pas les Écritures mais ils portaient le salut écrit par l’Esprit saint dans leurs cœurs
      content: |-
        Le Seigneur de toutes choses a donné à ses Apôtres le pouvoir d’annoncer l’Évangile, et c’est par eux que nous avons connu la vérité, c’est-à-dire l’enseignement du Fils de Dieu : « %qui vous écoute m’écoute et qui vous méprise me méprise et méprise celui qui m’a envoyé% ». Car ce n’est pas par d’autres que nous avons connu l’économie de notre salut, mais bien par ceux par qui l’Évangile nous est parvenu. Cet Évangile, ils l’ont d’abord prêché ; ensuite par la volonté de Dieu, ils nous l’ont transmis dans les Écritures, pour qu’il soit le fondement et la colonne de notre foi. Ainsi donc la Tradition des Apôtres, qui a été manifestée dans le monde entier, c’est sans doute l’Église qu’elle peut être perçue par tous ceux qui veulent voir la vérité… Car les Apôtres comme dans un riche cellier, ont amassé en elle la plénitude parfaite de la Vérité : quiconque le désire y puise le breuvage de la vie…
        À supposer même que les Apôtres ne nous eussent pas laissé d’Écritures, ne faudrait-il pas alors suivre l’ordre de la Tradition qu’ils ont transmise à ceux à qui ils confiaient ces Églises.
        C’est à cet ordre que donnent leur assentiment beaucoup de peuples barbares qui croient au Christ : ils possèdent le salut, écrit sans papier ni encre par l’Esprit dans leur cœur et ils gardent précieusement l’antique Tradition. Sans avoir de livres, s’ils ont la foi, leur langage peut bien être barbare ; leurs pensées, leurs habitudes, leur vie sont toutes pénétrées de justice, de pureté, de sagesse, car leur foi leur donne la sagesse et ils plaisent à Dieu…
        Cette foi que nous tenons de l’Église et par laquelle l’Esprit la rajeunit sans cesse… cette foi est un don de Dieu confié à l’Église, afin que tous les membres puissent y avoir part et être par là vivifiés. Par là nous sommes en communion avec le Christ par le Saint Esprit qui est le gage de l’incorruptibilité, le soutien de notre foi, l’échelle par où nous montons à Dieu.
        Où est l’Église, là est l’Esprit de Dieu ; et là où est l’Esprit de Dieu là est l’Église et avec elle, toute grâce. Et l’Esprit, c’est la vérité.
      responsory: |-
        R/ Piat portait en lui la flamme des apôtres.

        Il partit très loin : ni les périls de la route, ni la crainte des privations ne pouvaient le retenir.

        Il se réjouissait d’être trouvé digne des souffrances pour le nom de Jésus.

morning:
  evangelicAntiphon:
    common:
      - |-
        Le Bienheureux Piat a semé dans le champ du Seigneur : il en récolta du fruit au centuple.

vespers:
  evangelicAntiphon:
    common:
      - Piat s’est offert généreusement comme victime et le Seigneur a reçu favorablement son sacrifice.
