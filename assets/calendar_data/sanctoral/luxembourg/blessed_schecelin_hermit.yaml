celebration:
  title: Bienheureux Schecelin
  subtitle: ou Schetzel, ermite
  description: Héribert, moine de Clairvaux (en France), raconte que son maître des novices nommé Achard, envoyé par saint Bernard pour diriger la construction du monastère de Himmerod, rencontra dans la forêt de Grünewald, près de Luxembourg, un ermite vivant dans une extrême pauvreté mais dans la joie. Le saint homme mourut le 6 août 1138 ou 1139. Ses restes furent déposés à l’abbaye d’Altmünster, à Luxembourg. Mais ils disparurent lors de la destruction du monastère en 1544.
  color: white
  commons:
    - saints-male_religious

oration:
  - Seigneur Dieu, tu as donné au bienheureux Schecelin de mener dans la solitude une vie héroïque ; accorde-nous, à son intercession, de méditer ta parole dans le silence, pour que ta charité imprègne notre vie.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné au bienheureux Schecelin
    >de mener dans la solitude une vie héroïque ; *
    accorde-nous, à son intercession,
    >de méditer ta parole dans le silence, /
    >pour que ta charité imprègne notre vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
