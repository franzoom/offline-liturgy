celebration:
  title: Saint Lambert
  subtitle: évêque et martyr
  description: Lambert, évêque de Maastricht (vers 671), vécut dans un temps de violences. Écarté de son siège par Ébroïn, il partagea pendant sept ans la vie des moines de Stavelot, vie de pénitence et d’austérité qu’il devait conserver par la suite, en y joignant le zèle apostolique. Il fut assassiné près de Liège (avant 705). Au Luxembourg, bon nombre d’églises portent son nom.
  color: red
  commons:
    - martyr
    - pastors_bishop

oration:
  - Seigneur Dieu, source de toute bonté, tu as donné à saint Lambert, évêque et martyr, de se détacher des biens de la terre et même de t’offrir sa vie ; accorde-nous, à son intercession, la liberté de l’esprit pour que nous soyons toujours capables d’agir comme il te plaît.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, source de toute bonté, +
    >tu as donné à saint Lambert, évêque et martyr,
    >de se détacher des biens de la terre
    >et même de t’offrir sa vie ; *
    accorde-nous, à son intercession,
    >la liberté de l’esprit /
    >pour que nous soyons toujours capables
    >d’agir comme il te plaît.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Co 6, 4-10
      headline: |-
        « On nous croit mourants, et nous sommes bien vivants »
      content: |-
        Frères,
        en tout, nous nous recommandons nous-mêmes
        >comme des ministres de Dieu :
        par beaucoup d’endurance,
        >dans les détresses, les difficultés, les angoisses,
        les coups, la prison, les émeutes,
        >les fatigues, le manque de sommeil et de nourriture,
        par la chasteté, la connaissance,
        >la patience et la bonté,
        >la sainteté de l’esprit et la sincérité de l’amour,
        par une parole de vérité,
        >par une puissance qui vient de Dieu ;
        nous nous présentons avec les armes de la justice
        >pour l’attaque et la défense,
        dans la gloire et le mépris,
        >dans la mauvaise et la bonne réputation.
        On nous traite d’imposteurs, et nous disons la vérité ;
        >on nous prend pour des inconnus, et nous sommes très connus ;
        on nous croit mourants, et nous sommes bien vivants
        >on nous punit, et nous ne sommes pas mis à mort ;
        on nous croit tristes, et nous sommes toujours joyeux ;
        >pauvres, et nous faisons tant de riches ;
        démunis de tout, et nous possédons tout.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        content: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe :
        tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      headline: |-
        « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      acclamationAntiphonReference: Jn 10, 14
      content: |-
        En ce temps-là, Jésus disait :
        >« Moi, je suis le bon pasteur, le vrai berger,
        >qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        >les brebis ne sont pas à lui :
        >s’il voit venir le loup,
        >il abandonne les brebis et s’enfuit ;
        >le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        >et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        >je connais mes brebis,
        >et mes brebis me connaissent,
        >comme le Père me connaît,
        >et que je connais le Père ;
        >et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        >qui ne sont pas de cet enclos :
        >celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        >il y aura un seul troupeau
        >et un seul pasteur. »
