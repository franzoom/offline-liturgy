celebration:
  title: Saint Willibrord
  subtitle: évêque, patron secondaire du Luxembourg
  description: Le moine anglais Willibrord fut envoyé évangéliser la Frise (690). Après avoir été ordonné évêque à Rome, il fixa son siège épiscopal à Utrecht (696). C’est lui qui fonda l’abbaye d’Echternach, où il mourut en 739. Son culte y est demeuré populaire, notamment par la célèbre procession dansante du mardi après la Pentecôte.
  commons:
    - pastors_bishop
  color: white

oration:
  - Seigneur Dieu, tu as choisi l’évêque saint Willibrord pour annoncer ta gloire aux nations et fortifier nos ancêtres dans la foi ; à sa prière, accorde-nous de persévérer dans ta volonté, afin qu’au long des jours, le peuple dévoué à ton service augmente en nombre et grandisse en sainteté.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Si 45, 24
    content: |-
      Le Seigneur a conclu avec saint Willibrord une alliance de paix.
      >Il l’a établi chef du sanctuaire
      pour que lui appartienne à jamais
      >la dignité du sacerdoce.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as choisi l’évêque saint Willibrord
    >pour annoncer ta gloire aux nations
    >et fortifier nos ancêtres dans la foi ; *
    à sa prière, accorde-nous
    >de persévérer dans ta volonté, /
    afin qu’au long des jours,
    >le peuple dévoué à ton service
    >augmente en nombre et grandisse en sainteté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Regarde, Seigneur,
    >les offrandes apportées à ton autel
    >en souvenir de saint Willibrord ; *
    de même que tu as fait de lui
    >un ouvrier infatigable dans ta vigne,
    accorde-nous, par la puissance de ce sacrifice, /
    >de porter des fruits en abondance.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 15, 4-5
    content: |-
      Demeurez en moi comme moi en vous, dit le Seigneur.
      >Celui qui demeure en moi et en qui je demeure,
      celui-là porte beaucoup de fruit.
  prayerAfterCommunion:
  - |-
    Dieu tout-puissant, +
    >grâce au dévouement de l’évêque saint Willibrord,
    >tu nous as introduits dans le bercail de ton Église ; *
    après nous avoir rassasiés de cette nourriture divine,
    >accorde-nous de parvenir, avec notre pasteur, /
    >aux joies de la vie éternelle.
    Par le Christ, notre Seigneur.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 10
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Allez dire aux nations : « Le Seigneur est roi ! »
        Le monde, inébranlable, tient bon.
        Il gouverne les peuples avec droiture.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 16, 15-20
      headline: |-
        « Proclamez l’Évangile à toute la création »
      acclamationAntiphon: |-
        Par toute la terre retentit la Parole
        et la Bonne Nouvelle aux limites du monde.
      acclamationAntiphonReference: cf. Ps 18A, 5
      content: |-
        En ce temps-là,
        Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
        >« Allez dans le monde entier.
        Proclamez l’Évangile à toute la création.
        Celui qui croira et sera baptisé
        >sera sauvé ;
        >celui qui refusera de croire
        >sera condamné.
        Voici les signes qui accompagneront
        >ceux qui deviendront croyants :
        >en mon nom, ils expulseront les démons ;
        >ils parleront en langues nouvelles ;
        >ils prendront des serpents dans leurs mains
        >et, s’ils boivent un poison mortel,
        >il ne leur fera pas de mal ;
        >ils imposeront les mains aux malades,
        >et les malades s’en trouveront bien. »
        Le Seigneur Jésus,
        >après leur avoir parlé,
        fut enlevé au ciel
        >et s’assit à la droite de Dieu.
        Quant à eux,
        >ils s’en allèrent proclamer partout l’Évangile.
