celebration:
  title: Tous les saints évêques du diocèse de Lyon
  description: |-
    En honorant les évêques qui furent nos pasteurs depuis les origines du diocèse de Lyon, nous exprimons notre reconnaissance envers ceux qui firent briller la lumière de l’Évangile dans nos contrées et ceux qui, à leur suite, y propagèrent la foi. Nous attendons d’eux, encore aujourd’hui, soutien, aide et conseil dans l’œuvre d’évangélisation que nous poursuivons sous la conduite de nos nouveaux pasteurs.
  commons:
    - pastors
  locative: à Lyon
  color: white

oration:
  - Dieu tout-puissant, Pasteur éternel de ton peuple, en ce jour où nous fêtons les saints évêques de notre diocèse, nous te rendons grâce pour l’œuvre qu’ils ont accomplie. Fais que, forts de leur enseignement et de leur exemple, et soutenus par leurs prières, nous travaillions à te faire toujours mieux connaître et aimer.

readings:
  patristicReading:
    - title: LETTRE AUX MAGNÉSIENS DE SAINT IGNACE D’ANTIOCHE
      content: |-
        Faites tout en commun dans l’unique Seigneur.
        Je vous en conjure, ayez à cœur de faire toutes choses dans une divine concorde, sous la présidence de l’évêque qui tient la place de Dieu, des presbytres qui tiennent la place du sénat des Apôtres, et des diacres qui me sont si chers, à qui a été confié le service de Jésus-Christ, qui avant les siècles était près de Dieu, et s’est manifesté à la fin. Prenez donc tous les mœurs de Dieu, respectez-vous les uns les autres et que personne ne regarde son prochain selon la chair, mais aimez-vous toujours les uns les autres en Jésus-Christ.
        Qu’il n’y ait rien en vous qui puisse vous séparer, mais unissez-vous à l’évêque et à ceux qui président en image et leçon d’incorruptibilité.
        De même donc que le Seigneur n’a rien fait, ni par lui-même, ni par ses Apôtres, sans son Père (cf. Jn 5, 19, 30 : 8, 28), avec qui Il est un, ainsi vous non plus ne faites rien sans l’évêque et les presbytres ; et n’essayez pas de faire passer pour raisonnable ce que vous faites à part vous, mais faites tout en commun : une seule prière, une seule supplication, un seul esprit, une seule espérance dans la charité (cf. Ep 4, 4-6), dans la joie irréprochable ; cela, c’est Jésus-Christ, à qui rien n’est préférable. Tous accourez pour vous réunir en un seul temple de Dieu, comme autour d’un seul autel, en l’unique Jésus-Christ, qui est sorti du Père un, et qui était en Lui l’unique, et qui est allé vers Lui. […]
        Ne soyons donc pas insensibles à sa bonté. Car s’Il nous imite selon ce que nous faisons, nous n’existons plus. C’est pourquoi faisons-nous ses disciples et apprenons à vivre selon le christianisme. Car celui qui s’appelle d’un autre nom que celui-ci n’est pas à Dieu (cf. Ac 4, 12). Rejetez donc le mauvais levain, vieilli et aigri (cf. 1Co 5, 6) et transformez-vous en un levain nouveau, qui est Jésus-Christ. Qu’Il soit le sel de votre vie, pour que personne parmi vous ne se corrompe, car c’est à l’odeur que vous serez jugés.

      responsory: |-
        R/ Pasteurs de leur peuple
        ils œuvrent le cœur brûlant de charité.

        Ils ont porté la Bonne Nouvelle du salut
        aux hommes de leur temps,
        sans ménager leur peine.

        Ils partagent ce qui les fait vivre
        aux hommes de tout temps,
        dans la joie éternelle.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Accorde-nous, Dieu tout-puissant,
    de célébrer dignement la fête de tous nos saints évêques ;
    Puisque tu leur as donné de se dévouer
    par la parole et par l’exemple
    à ceux dont ils avaient reçu la charge,
    fais que nous ressentions toujours l’appui
    de leur prière auprès de toi.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ez 34, 11-16
      headline: |-
        « Comme un berger veille sur son troupeau, ainsi je veillerai sur mes brebis »
      content: |-
        Ainsi parle le Seigneur Dieu :
        Voici que moi-même, je m’occuperai de mes brebis,
        >et je veillerai sur elles.
        Comme un berger veille sur les brebis de son troupeau
        >quand elles sont dispersées,
        ainsi je veillerai sur mes brebis,
        et j’irai les délivrer dans tous les endroits où elles ont été dispersées
        >un jour de nuages et de sombres nuées.
        Je les ferai sortir d’entre les peuples,
        >je les rassemblerai des différents pays
        >et je les ramènerai sur leur terre ;
        je les ferai paître sur les montagnes d’Israël,
        >dans les vallées, dans les endroits les meilleurs.
        Je les ferai paître dans un bon pâturage,
        >et leurs prairies seront sur les hauteurs d’Israël.
        Là, mes brebis se reposeront dans de belles prairies,
        >elles brouteront dans de gras pâturages, sur les monts d’Israël.
        C’est moi qui ferai paître mon troupeau,
        >et c’est moi qui le ferai reposer,
        >- oracle du Seigneur Dieu.
        La brebis perdue, je la chercherai ;
        >l’égarée, je la ramènerai.
        Celle qui est blessée, je la panserai.
        Celle qui est malade, je lui rendrai des forces.
        Celle qui est grasse et vigoureuse,
        >je la garderai, je la ferai paître selon le droit.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      refAbbr: cf. 22, 1
      chorus:
      - chorusRef: cf. 22, 1
        content: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi :
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: |-
        « Je ne vous appelle plus serviteurs, je vous appelle mes amis »
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Comme le Père m’a aimé,
        >moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        >vous demeurerez dans mon amour,
        >comme moi, j’ai gardé les commandements de mon Père,
        >et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        >et que votre joie soit parfaite.
        Mon commandement, le voici :
        >Aimez-vous les uns les autres
        >comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        >que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        >si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        >car le serviteur ne sait pas ce que fait son maître ;
        >je vous appelle mes amis,
        >car tout ce que j’ai entendu de mon Père,
        >je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        >c’est moi qui vous ai choisis et établis
        >afin que vous alliez,
        >que vous portiez du fruit,
        >et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        >il vous le donnera.
        Voici ce que je vous commande :
        >c’est de vous aimer les uns les autres. »
