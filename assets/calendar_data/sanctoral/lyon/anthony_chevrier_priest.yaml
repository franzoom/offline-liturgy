celebration:
  title: Bienheureux Antoine Chevrier
  subtitle: prêtre
  description: Né le 16 avril 1826 à Lyon, Antoine Chevrier, fut ordonné prêtre en 1850. Envoyé dans une paroisse de la banlieue lyonnaise, Saint-André de la Guillotière, il découvrit la misère ouvrière sous toutes ses formes. Dans la nuit de Noël de l’année 1856, méditant devant la crèche, il comprit que l’Évangile de Dieu fait homme est fondamentalement une Bonne Nouvelle pour les plus pauvres. L’année suivante, il rejoignit Camille Rambaud, qui venait de fonder une « cité ouvrière », puis, en 1860, il acquit une ancienne salle de bal au lieu-dit du Prado, dans l’un des quartiers les plus déshérités de la Guillotière, où il accueillit des enfants et des jeunes, afin d’essayer d’en faire « des hommes et des chrétiens ». En 1866, il fonda au Prado même une « école cléricale », qui devait devenir l’Association des Prêtres du Prado, « pour faire une pépinière de prêtres qui soient élevés avec mes enfants, pour qu’ils les comprennent bien ». Il mourut à Lyon, le 2 octobre 1879.
  commons:
    - pastors
  locative: à Lyon
  color: white

oration:
  - Pour que la Bonne Nouvelle soit annoncée aux pauvres, tu as appelé, Seigneur, Antoine Chevrier à se faire disciple de ton Fils. Accorde-nous de suivre les exemples du Christ pauvre et crucifié, afin que nous puissions ainsi te glorifier.

readings:
  patristicReading:
    - title: DU « VÉRITABLE DISCIPLE »
      subtitle: Ouvrir sa porte
      content: |-
        L’Esprit Saint dit quelque part qu’il se tient à la porte et qu’il frappe. Il dit encore plus : il dit qu’il pousse la porte pour entrer : %Voici que je me tiens à la porte et je frappe% (Ap 3, 20). Notre cœur est donc comme une porte à laquelle le Maître frappe et par laquelle il cherche à entrer.
        Or une porte peut être dans plusieurs positions. Et quand quelqu’un frappe à cette porte et que l’on vient pour ouvrir, on peut la laisser fermée et ne pas laisser entrer du tout ; on peut l’entrouvrir seulement et laisser à la porte ceux qui viennent ; on peut enfin l’ouvrir tout entière et laisser entrer ceux qui frappent. C’est aussi ce que nous pouvons faire à Jésus Christ, notre Maître, par rapport à la porte de notre cœur, quand il cherche à entrer.
        Celui qui n’ouvre pas sa porte est celui qui refuse de laisser entrer le Maître et qui refuse entièrement de recevoir son Maître pour le suivre, qui préfère suivre ses idées, ses passions, le monde.
        Celui qui n’ouvre qu’à moitié est celui qui écoute sans laisser entrer entièrement le Maître chez lui, il reste maître de la porte, il reste maître chez lui, il ne veut recevoir personne, il reste maître de sa maison et de son cœur. Il écoute mais il en prend ce qu’il veut, il en fait ce qu’il veut, il en prend ce qui lui convient et laisse le reste qui ne lui plaît pas. Il reçoit le Maître avec réserve et prudence et écoute plus sa raison, ses petites passions qui son ses maîtres, que le Maître véritable qui veut entrer, il se défie, il a peur, il n’ouvre qu’à moitié son cœur. Et le Maître ne peut entrer pour gouverner comme il devrait le faire.
        Le dernier ouvre sa porte entièrement et laisse entrer chez lui le Maître qui frappe. Il est heureux de le recevoir et de lui donner une place d’honneur, il l’écoute avec bonheur et il n’a qu’un désir, c’est de comprendre ce qu’il dit et de mettre en pratique. Il ne discute pas, mais il cherche comment il pourra pratiquer ce qu’il entend. Il se tient en esprit au pied de son Maître, comme Marie, et il ne se laisse prendre ni par le raisonnement, ni par les passions qui le révoltent. Le Maître parle, il n’a pas d’autres pensées, d’autres désirs que de comprendre ce qu’il entend et de mettre en pratique, d’en nourrir son âme. C’est l’amour qui le guide et rien autre chose. Il veut entrer dans le Royaume des cieux, c’est là tout son désir. Il foule aux pieds tout ce que la raison et les passions peuvent lui dire. Il n’a que Jésus Christ pour Maître et ne veut suivre que lui.

      responsory: |-
        R/ La Bonne Nouvelle est annoncée aux pauvres.

        Heureux les pauvres
        à eux le Royaume de Dieu.

        N’amassez pas de trésor sur la terre,
        mais rendez à Dieu toute grâce.


mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: 2 Co 8, 9
    content: |-
      Jésus Christ notre Seigneur,
      de riche qu’il était, pour nous s’est fait pauvre,
      >afin de nous enrichir par sa pauvreté.
  collect:
  - |-
    Pour que la Bonne Nouvelle soit annoncée aux pauvres,
    tu as appelé, Seigneur, Antoine Chevrier
    >à se faire disciple de ton Fils.
    Accorde-nous de suivre les exemples du Christ pauvre et crucifié,
    >afin que nous puissions ainsi te glorifier.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ph 3, 8-14
      headline: |-
        « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        je les considère comme une perte
        à cause de ce bien qui dépasse tout :
        >la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        je considère tout comme des ordures,
        >afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        >non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        >la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        >d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        >en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        >à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        >je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        >puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        >oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        >auquel Dieu nous appelle là-haut dans le Christ Jésus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      label: null
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        « Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: |-
        « Ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        >« Père, Seigneur du ciel et de la terre,
        >je proclame ta louange :
        >ce que tu as caché aux sages et aux savants,
        >tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        >personne ne connaît le Fils, sinon le Père,
        >et personne ne connaît le Père, sinon le Fils,
        >et celui à qui le Fils veut le révéler.
        Venez à moi,
        >vous tous qui peinez sous le poids du fardeau,
        >et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        >devenez mes disciples,
        >car je suis doux et humble de cœur,
        >et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        >et mon fardeau, léger. »
  offeringPrayer:
  - |-
    Par le sacrifice que nous t’offrons, Seigneur,
    allume en nous le feu de l’Esprit
    qui poussait Antoine Chevrier à s’attacher au Christ
    >et à se donner tout entier pour le salut des hommes.
  communionAntiphon:
  - biblicalReference: Jn 13, 15-17
    content: |-
      Je vous ai donné l’exemple,
      >afin que vous fassiez, vous aussi,
      comme j’ai fait pour vous.
      Heureux êtes-vous, si vous le mettez en pratique.
  prayerAfterCommunion:
  - |-
    Tu veux, Seigneur, que les pauvres
    soient les premiers invités au festin de ton Royaume
    >où nous avons nous-mêmes été rassasiés.
    Fais que nous sachions aller vers eux,
    >comme Antoine Chevrier,
    pour leur révéler les richesses de ton Évangile.
    Par le Christ, notre Seigneur.