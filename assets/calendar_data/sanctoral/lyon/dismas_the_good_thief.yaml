  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Is 1, 16-18
      content: |-
        Lavez-vous, purifiez-vous, ôtez de ma vue vos actions mauvaises, cessez de faire le mal. Apprenez à faire le bien : recherchez la justice, mettez au pas l’oppresseur, faites droit à l’orphelin, prenez la défense de la veuve. Venez donc et discutons, dit le Seigneur. Si vos péchés sont comme l’écarlate, ils deviendront comme la neige. S’ils sont rouges comme le vermillon, ils deviendront blancs comme la laine.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 31 (32), 1-2a, 5, 10b, 11
      refAbbr: cf. 31, 7acd
      chorus:
      - chorusRef: 31, 7acd
        content: |-
          Tu es un refuge pour moi ;
          de chants de délivrance, tu m’as entouré.
      content: |-
        Heureux l’homme dont la faute est enlevée,
        et le péché remis !
        Heureux l’homme dont le Seigneur ne retient pas l’offense,

        Je t’ai fait connaître ma faute,
        je n’ai pas caché mes torts.
        J’ai dit : « Je rendrai grâce au Seigneur
        en confessant mes péchés. »
        Et toi, tu as enlevé
        l’offense de ma faute.

        Mais l’amour du Seigneur entourera
        ceux qui comptent sur lui.

        Que le Seigneur soit votre joie !
        Exultez, hommes justes !
        Hommes droits, chantez votre allégresse !
  - partType: ALLELUIA
    partContents:
    - biblicalRef: Lc 23, 43
      content: |-
        « Jésus, souviens-toi de moi
        quand tu viendras dans ton Royaume. »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 23, 39-43
      headline: |-
        « Jésus, souviens-toi de moi quand tu viendras dans ton Royaume »
      acclamationAntiphon: |-
        « Jésus, souviens-toi de moi
        quand tu viendras dans ton Royaume. »
      content: |-
        En ce temps-là,
        l’un des malfaiteurs suspendus en croix
        >injuriait Jésus :
        >« N’es-tu pas le Christ ?
        Sauve-toi toi-même, et nous aussi ! »
        Mais l’autre lui fit de vifs reproches :
        >« Tu ne crains donc pas Dieu !
        Tu es pourtant un condamné, toi aussi !
        >Et puis, pour nous, c’est juste :
        après ce que nous avons fait,
        >nous avons ce que nous méritons.
        Mais lui, il n’a rien fait de mal. »
        Et il disait :
        >« Jésus, souviens-toi de moi
        >quand tu viendras dans ton Royaume. »
        Jésus lui déclara :
        >« Amen, je te le dis :
        >aujourd’hui, avec moi, tu seras dans le Paradis. »