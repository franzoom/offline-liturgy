celebration:
  title: Saint François de Sales
  subtitle: évêque et docteur de l’Église, patron du clergé de Lyon
  description: François de Sales (1567-1622) fut essentiellement un pasteur. Missionnaire, puis évêque de Genève résidant à Annecy, fondateur de la Visitation avec Jeanne Françoise de Chantal, il se fit tout à tous par la parole et par l’écrit, traitant de théologie avec les Protestants, mettant la vie spirituelle à la portée des laïcs, attentif aux petits comme aux grands.
  commons:
    - pastors_bishop
    - pastors_doctors
  color: white
  locative: à Lyon

oration:
  - Pour le salut des âmes, Seigneur, tu as voulu que l’évêque saint François de Sales  devienne le serviteur de tous en toutes choses ; fais que, soutenus par son  exemple, nous donnions une preuve de ta douce charité en nous dévouant pour nos frères.

readings:
  patristicReading:
    - title: LETTRE À LA PRÉSIDENTE BRULART, 13 OCTOBRE 1604
      content: |-
        Il faut considérer qu’il n’y a nulle vocation qui n’ait ses ennuis, ses amertumes et aversions et, qui plus est - si ce n’est ceux qui sont pleinement résignés en la volonté de Dieu - chacun voudrait volontiers échanger sa condition pour celle des autres : ceux qui sont évêques voudraient ne l’être pas ; ceux qui sont mariés voudraient ne l’être pas, et ceux qui ne le sont le voudraient être.
        D’où vient cette générale inquiétude des esprits, sinon d’un certain déplaisir que nous avons à la contrainte, et une malignité d’esprit qui nous fait penser que chacun est mieux que nous ? Mais c’est tout un : quiconque n’est pleinement résigné, qu’il tourne deçà et delà, il n’aura jamais repos. Ceux qui ont la fièvre ne trouvent nulle place bonne, ils n’ont pas demeuré un quart d’heure en un lit qu’ils voudraient être en un autre ; ce n’est pas la faute du lit, mais c’est la fièvre qui les tourmente partout. Une personne qui n’a pas la fièvre de sa propre volonté se contente de tout ; pourvu que Dieu soit servi, elle ne se soucie pas en quelle qualité Dieu l’emploie : pourvu qu’elle fasse la volonté divine, cela lui est égal.
        Mais ce n’est pas tout. Il faut non seulement vouloir faire la volonté de Dieu, mais pour être dévot, il la faut faire gaiement. Si je n’étais pas évêque, peut- être que, sachant ce que je sais, je ne le voudrais pas être ; mais l’étant, non seulement je suis obligé de faire ce que cette pénible vocation requiert, mais je dois le faire joyeusement, et je dois me plaire en cela et le faire de bon gré. C’est la parole de saint Paul : « Que chacun demeure en sa vocation devant Dieu » (1 Co 7, 24). Il ne faut pas porter la croix des autres, mais la sienne ; et pour porter chacun la sienne, notre Seigneur veut qu’un chacun se renonce soi-même, c’est-à-dire à sa propre volonté.
        Je voudrais bien ceci et cela ; je serais mieux ici et là : ce sont des tentations. Notre Seigneur sait bien ce qu’il fait : faisons ce qu’il veut, demeurons où il nous a mis."
      responsory: |-
        R/ Le fruit de l’Esprit est amour, joie et paix,
        bonté, douceur et patience.

        Si nous vivons par l’Esprit,
        marchons aussi dans l’Esprit.

        Si vous êtes conduits par l’Esprit,
        vous n’êtes plus soumis à la loi.


mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Jr 3, 15
    content: |-
      Ainsi parle le Seigneur Dieu :
      « Je vous donnerai des pasteurs selon mon cœur ;
      ils vous nourriront avec intelligence et sagesse. »
  collect:
  - |-
    Pour le salut des âmes, Seigneur,
    >tu as voulu que l’évêque saint François de Sales
    devienne le serviteur de tous en toutes choses
    Fais que, soutenus par son exemple,
    >nous donnions une preuve de ta douce charité
    >en nous dévouant pour nos frères.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 3, 14-19
      headline: |-
        « Vous connaîtrez ce qui dépasse toute connaissance : l’amour du Christ »
      content: |-
        Frères,
        je tombe à genoux devant le Père,
        >de qui toute paternité au ciel et sur la terre tient son nom.
        Lui qui est si riche en gloire,
        qu’il vous donne la puissance de son Esprit,
        >pour que se fortifie en vous l’homme intérieur.
        Que le Christ habite en vos cœurs par la foi ;
        >restez enracinés dans l’amour, établis dans l’amour.
        Ainsi vous serez capables de comprendre avec tous les fidèles
        >quelle est la largeur, la longueur, la hauteur, la profondeur...
        Vous connaîtrez ce qui dépasse toute connaissance :
        >l’amour du Christ.
        Alors vous serez comblés
        >jusqu’à entrer dans toute la plénitude de Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6.9, 10-11
      refAbbr: cf. 33, 5b
      chorus:
      - chorusRef: cf. 33, 5b
        chorus: |-
          De toutes mes frayeurs,
          le Seigneur me délivre.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: |-
        « Ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits »
      acclamationAntiphon: null
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        >« Père, Seigneur du ciel et de la terre,
        >je proclame ta louange :
        >ce que tu as caché aux sages et aux savants,
        >tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        >personne ne connaît le Fils, sinon le Père,
        >et personne ne connaît le Père, sinon le Fils,
        >et celui à qui le Fils veut le révéler.
        Venez à moi,
        >vous tous qui peinez sous le poids du fardeau,
        >et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        >devenez mes disciples,
        >car je suis doux et humble de cœur,
        >et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        >et mon fardeau, léger. »
  offeringPrayer:
  - |-
    Grâce au sacrifice que nous t’offrons, Seigneur,
    allume en nous le feu de l’Esprit
    >qui brûlait d’amour le cœur de saint François.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 13, 35
    content: |-
      « Tous vous reconnaîtront pour mes disciples,
      >dit le Seigneur,
      à cet amour que vous aurez les uns
      >pour les autres. »
  prayerAfterCommunion:
  - |-
    Accorde-nous par cette communion, Dieu tout-puissant,
    >d’imiter la douceur et la charité de saint François,
    pour obtenir avec lui la gloire du ciel.
    Par le Christ, notre Seigneur.