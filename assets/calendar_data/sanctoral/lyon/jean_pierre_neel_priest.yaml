celebration:
  title: Saint Jean-Pierre Néel
  subtitle: prêtre
  description: Né le 18 octobre 1832 à Sainte-Catherine-sous-Riverie dans le diocèse de Lyon, Jean-Pierre Néel fit ses études de lettres et de philosophie aux séminaires de Montbrison et de l’Argentière. Puis il entra dans la Société des Missions Étrangères de Paris. Ordonné prêtre en 1858, il fut envoyé en Chine en 1859. Les succès de ce prêtre inquiétèrent les autorités locales ; arrêté à Kia-cha-loung, dans le Kong-theou, il fut décapité le 18 février 1862.
  commons:
    - martyr
    - pastors_missionary
  color: red

oration:
  - Aide-nous, Dieu tout puissant, à prendre pour modèle saint Jean-Pierre Néel qui, pour avoir voulu propager la foi, a mérité la victoire du martyre.

readings:
  patristicReading:
    - title: DU 2^e CONCILE DU VATICAN
      subtitle: L’Église envoyée par le Christ
      content: |-
        Le Christ Jésus lui-même, avant de donner librement sa vie pour le monde, a organisé le ministère apostolique et promis d’envoyer le Saint Esprit, afin que ce ministère et cette mission soient tous deux associés pour mener à bien, toujours et partout, l’œuvre du salut. À travers toutes les époques, c’est le Saint Esprit qui « unifie l’Église tout entière dans la communion et le ministère, qui la munit des divers dons hiérarchiques et charismatiques », vivifiant à la façon d’une âme les institutions ecclésiastiques et insufflant dans le cœur des fidèles le même esprit missionnaire, qui avait poussé le Christ lui-même. Parfois même il devance visiblement l’action apostolique, tout comme il ne cesse de l’accompagner et de la diriger de diverses manières.
        Dès le début de son ministère, le Seigneur Jésus « appela à lui ceux qu’il voulut, et en institua douze pour être ses compagnons et pour les envoyer prêcher » (Mc 3, 13 ; cf. Mt 10, 1-42). Les Apôtres furent ainsi les germes du Nouvel Israël et en même temps l’origine de la hiérarchie sacrée. Puis, une fois qu’il eut par sa mort et sa résurrection accompli en lui-même les mystères de notre salut et de la rénovation de toutes choses, le Seigneur, qui avait reçu tout pouvoir au ciel et sur la terre (cf. Mt 28, 18), fonda son Église comme sacrement du salut, avant d’être enlevé au ciel (cf. Ac 1, 11) ; tout comme il avait été lui-même envoyé par le Père (cf. Jn 20, 21), il envoya ses Apôtres dans le monde entier en leur donnant cet ordre : « Allez donc, de toutes les nations faites des disciples, les baptisant au nom du Père et du Fils et du Saint Esprit, et leur apprenant à observer tout ce que je vous ai prescrit » (Mt 28, 19 s.) ; « Allez par le monde entier proclamer la bonne nouvelle à toute la création. Celui qui croira et sera baptisé sera sauvé, celui qui ne croira pas sera condamné » (Mc 16, 15 s.). C’est de là que découle pour l’Église le devoir de propager la foi et le salut apportés par le Christ, d’une part en vertu du mandat exprès qu’a hérité des Apôtres l’ordre des évêques, assisté par les prêtres en union avec le successeur de Pierre, pasteur suprême de l’Église, et d’autre part en vertu de l’influx vital que le Christ communique à ses membres : le Christ « dont le Corps tout entier reçoit concorde et cohésion, par toutes sortes de jointures qui le nourrissent et l’actionnent selon le rôle de chaque partie, opérant ainsi sa croissance et se construisant lui-même dans la charité » (Ep 4, 16). La mission de l’Église s’accomplit donc par l’opération au moyen de laquelle, obéissant à l’ordre du Christ et mue par la grâce de l’Esprit Saint et la charité, elle devient effectivement présente à tous les hommes et à tous les peuples, pour les amener par l’exemple de sa vie, par la prédication, par les sacrements et les autres moyens de grâce, à la foi, à la liberté, à la paix du Christ, de telle sorte qu’elle leur soit ouverte comme la voie libre et sûre pour participer pleinement au mystère du Christ.

      responsory: |-
        R/ À toi seul, Fils du vrai Dieu, 
        la gloire et la louange. 

        Qui se déclarera pour moi devant les hommes,
        je me déclarerai pour lui devant mon Père. 

        Qui aura tenu bon jusqu’à la fin, 
        je lui donnerai la vie éternelle.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Aide-nous, Dieu tout-puissant,
    >à prendre pour modèle saint Jean-Pierre Néel,
    qui, pour avoir voulu propager la foi,
    >a mérité la victoire du martyre.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 1, 18-25
      headline: |-
        « Il a plu à Dieu de sauver les croyants par cette folie qu’est la proclamation de l’Évangile »
      content: |-
        Frères,
        le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88 (89), 2-3, 6-7, 16-17
      refAbbr: cf. 88, 2a
      chorus:
      - chorusRef: cf. 88, 2a
        content: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : C’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        Que les cieux rendent grâce pour ta merveille, Seigneur,
        et l’assemblée des saints, pour ta fidélité.
        Qui donc, là-haut, est comparable au Seigneur ?
        Qui d’entre les dieux est semblable au Seigneur ?

        Heureux le peuple qui connaît l’ovation !
        Seigneur, il marche à la lumière de ta face ;
        tout le jour, à ton nom il danse de joie,
        fier de ton juste pouvoir.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 28, 16-20
      headline: |-
        « De toutes les nations faites des disciples »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        >apprenez-leur à observer
        >tout ce que je vous ai commandé.
        Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »