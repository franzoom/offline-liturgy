celebration:
  title: Saint Jean-François Régis
  subtitle: prêtre
  description: Né en 1597, Jean-François Régis fut au début du XVII^e siècle, une des figures les plus attachantes de la Compagnie de Jésus. Il fut l’apôtre du Vivarais, du Velay et des confins du Forez (en 1637, de Saint-Sauveur-en-Rue à Saint-Appollinard ; en 1638, de Marlhes à Yssingeaux). Il mourut en pleine mission à La Louvesc (Ardèche) le 31 décembre 1640. Son tombeau est un lieu de pèlerinage très fréquenté et son culte est très répandu aujourd’hui encore dans les zones du Pilat et des Monts du Forez.
  commons:
    - pastors
  color: white
  locative: à Lyon

oration:
  - Dieu notre Père, tu as fait grandir en saint François Régis une intense vie de prière où se renouvelait constamment son souci d’annoncer l’Évangile. Fortifiés par son exemple, nous te demandons de nous rendre semblables au Christ qui, avant de rejoindre les foules, veillait auprès de toi sur la montagne. Lui qui vit et règne pour les siècles de siècles.

readings:
  patristicReading:
    - title: LUCIEN CERFAUX - DISCOURS DE MISSION
      content: |-
        Pour ses missionnaires présents et futurs, Jésus a composé un code de la route. Ce sont des conseils pour une toute petite mission en Galilée, une promenade de quelques semaines, dans les villages d’une toute petite province. 
        N’allez point vers les Gentils, n’entrez point dans une ville des Samaritains. Allez plutôt aux brebis de la maison d’Israël. Sur votre chemin, annoncez ceci : Le Royaume des cieux est proche (Mt 10,5-7). 
        Cela comptera-t-il dans l’histoire du monde, ce que ces quelques paysans, dans un coin perdu, diront à d’autres paysans ? 
        Et c’était la fondation de l’Église, le modèle de toutes les missions ; le point de départ, le noyau, la semence de tout ce qui se développera dans la suite. 
        C’est l’habitude de Dieu de faire de grandes choses avec rien. Il aime créer. 
        Les saints l’ont bien compris et ils ont fait de grandes œuvres avec rien du tout, comme Dieu, parce qu’ils travaillaient suivant ses méthodes. Les anachorètes du désert ont consumé leur vie à lutter contre les démons. Saint Benoît, chassé de Subiaco, se borna à fonder le monastère du Mont-Cassin. Saint François d’Assise a formé deux douzaines de disciples, gardiens de sa pensée. Le curé d’Ars entendait les confessions dans une église de village. Mais ce sont ces humbles travaux qui rayonnent ; c’est l’apostolat ainsi compris qui pèse dans la balance divine et les destinées spirituelles du monde. 
        Compteront-ils beaucoup, dans l’histoire de l’Église, les apostolats à grand tapage ? Aucun apostolat, aucune œuvre n’aura plus jamais le retentissement de l’obscure mission de Galilée. Et pourtant, qu’était-ce en kilomètres carrés ? La Galilée est moins qu’un département de France. 
        Ce n’est ni la superficie, ni la longueur ou la largeur qui comptent. C’est la profondeur. On mesure l’apostolat à la sonde et non au cordeau. 
        Rappelons-nous la définition de l’Apôtre dans l’évangile de saint Marc : Jésus choisit les Douze pour qu’ils soient toujours avec Lui, et pour les envoyer prêcher. 
        L’apôtre n’est vraiment apôtre que s’il reste uni à notre Seigneur. La contemplation et l’action ne doivent pas être séparées. Elles sont sœurs, Marie et Marthe. Les deux sœurs se complètent et ne font qu’un. Ainsi l’ont compris les saints. 
        Avec les saints aussi, apostolat et vie intérieure, c’est la même chose. Le saint curé d’Ars trouvait à peine le temps de réciter des prières. Mais quelle prière que sa vie ! Saint François hésita toute sa vie entre la solitude des ermitages et la prédication. Saint Benoît Labre a été apôtre à force de prier. 
        L’apostolat n’est que le rayonnement de la sainteté. Un apôtre doit être deux fois saint, une fois pour lui, une fois pour les autres.

      responsory: |-
        R/ Jésus, tu es venu pour que les brebis aient la vie,
        la vie en abondance.

        Parole du Seigneur :
        J’aurai soin moi-même de mon troupeau
        et je le passerai en revue.

        Je chercherai la brebis perdue,
        avec justice je ferai paître mon troupeau.

        Je les rassemblerai des pays étrangers
        et les ramènerai sur leur terre.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Dieu notre Père,
    tu as fait grandir, en saint Jean-François Régis,
    >une intense vie de prière
    où se renouvelait constamment son souci
    >d’annoncer l’Évangile.
    Fortifiés par son exemple,
    nous te demandons de nous rendre semblables au Christ,
    >qui, avant de rejoindre les foules,
    >veillait auprès de toi sur la montagne.
    Lui qui vit et règne pour les siècles de siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Th 2, 2b-8
      headline: |-
        « Nous aurions voulu vous donner non seulement l’Évangile de Dieu, mais jusqu’à nos propres vies »
      content: |-
        Frères,
        nous avons trouvé en notre Dieu pleine assurance
        >pour vous annoncer, au prix de grandes luttes,
        >l’Évangile de Dieu.
        Et quand nous vous exhortions,
        ce n’était pas avec des doctrines fausses,
        >ni des motifs impurs, ni par ruse.
        En effet, pour nous confier l’Évangile,
        >Dieu a éprouvé notre valeur,
        de sorte que nous parlons,
        >non pas pour plaire aux hommes, mais à Dieu,
        >lui qui met nos cœurs à l’épreuve.
        Jamais, nous n’avons eu un mot de flatterie, vous le savez,
        >jamais de motifs intéressés, Dieu en est témoin ;
        jamais nous n’avons recherché la gloire qui vient des hommes,
        >ni auprès de vous ni auprès d’autres personnes.
        Alors que nous aurions pu nous imposer
        >en qualité d’apôtres du Christ,
        au contraire, nous avons été pleins de douceur avec vous,
        >comme une mère qui entoure de soins ses nourrissons.
        Ayant pour vous une telle affection,
        nous aurions voulu vous donner non seulement l’Évangile de Dieu,
        >mais jusqu’à nos propres vies,
        car vous nous étiez devenus très chers.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        content: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 9, 35-38
      headline: |-
        « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        En ce temps-là,
        Jésus parcourait toutes les villes et tous les villages,
        >enseignant dans leurs synagogues,
        >proclamant l’Évangile du Royaume
        >et guérissant toute maladie et toute infirmité.
        Voyant les foules, Jésus fut saisi de compassion envers elles
        >parce qu’elles étaient désemparées et abattues
        >comme des brebis sans berger.
        Il dit alors à ses disciples :
        >« La moisson est abondante,
        >mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        >d’envoyer des ouvriers pour sa moisson. »
