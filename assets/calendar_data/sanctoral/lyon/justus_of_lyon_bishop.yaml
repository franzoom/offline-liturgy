celebration:
  title: Saint Just
  subtitle: évêque
  description: Diacre de Vienne, il devint évêque de Lyon au IV^ème siècle après Vérissime. Une pénible affaire à laquelle il fut involontairement mêlé, la pendaison d’un fou réfugié dans un sanctuaire, le bouleversa au point qu’il s’enfuit en Égypte. Avec un clerc de son Église, Viateur, il y vécut parmi les solitaires, et il y mourut. Son corps fut ramené d’Égypte et enterré dans l’église des Maccabées, qui devint plus tard le monastère de Saint-Just et aujourd’hui l’église Saint-Just.
  commons:
    - pastors_bishop
  locative: à Lyon
  color: white

oration:
  - Dieu, qui as comblé saint Just de grâces diverses en l’appelant d’abord à recevoir pour nous la charge de pasteur et en lui suggérant ensuite d’y renoncer, accorde-nous, à sa prière, de toujours entendre ta voix au milieu des changements de ce monde afin de ne jamais nous écarter de ta volonté.

readings:
  patristicReading:
    - title: EXTRAIT D’UN SERMON DU CARDINAL NEWMAN
      content: |-
        Tout le long de notre vie le Christ nous appelle. Il nous appela d’abord dans le baptême ; mais plus tard aussi ; que nous obéissions ou non à sa voix, il nous appelle encore miséricordieusement. Si nous manquons aux promesses de notre baptême, il nous appelle au repentir ; si nous faisons effort pour accomplir notre vocation, il nous appelle toujours plus avant de grâce en grâce, et de sainteté en sainteté, tant que la vie nous est laissée. Abraham fut appelé à quitter sa maison, Pierre ses filets, Matthieu son emploi, Élisée sa ferme, Nathanaël sa retraite ; tous nous sommes appelés sans cesse, d’une chose à l’autre, toujours plus loin, n’ayant point de lieu de repos, mais montant vers notre repos éternel, et n’obéissant à un ordre que pour être prêts à en entendre un autre. Il nous appelle sans cesse, afin de nous justifier sans cesse ; et sans cesse, et de plus en plus, nous sanctifier et nous glorifier.
        Il nous serait bon de comprendre cela ; mais nous sommes lents à comprendre cette grande vérité, que le Christ est en quelque sorte marchant parmi nous, et par sa main, ses yeux, sa voix, nous ordonne de le suivre. Nous ne comprenons pas que son appel est une chose qui a lieu en ce moment même. Nous pensons qu’elle eut lieu au temps des apôtres ; mais nous n’y croyons pas, nous ne l’attendons pas pour nous-mêmes. Nous n’avons pas d’yeux pour voir le Seigneur ; très différents de l’apôtre bien-aimé, qui reconnut le Christ même quand les autres disciples ne le reconnaissaient point. Quand il se tint sur le rivage après sa résurrection, et leur ordonna de jeter les filets dans la mer, ce disciple que Jésus aimait dit à Pierre : « C’est le Seigneur ! » (Jn 21, 7). 
        Or voici ce que je veux dire : c’est que ceux qui vivent religieusement voient parfois s’imposer à eux des vérités qu’ils ne connaissaient pas encore, ou dont ils n’avaient pas besoin de s’occuper ; vérités qui impliquent des devoirs, qui sont en fait des préceptes, et réclament l’obéissance. C’est de cette façon, ou d’une façon semblable, que le Christ nous appelle maintenant. Il n’y a rien de miraculeux ou d’extraordinaire dans ses rapports avec nous. Il agit par l’intermédiaire de nos facultés naturelles et des circonstances de notre vie. Pourtant, sa Providence est pour nous, dans tous les points essentiels, ce qu’était sa voix pour ceux qu’il appelait quand il était sur la terre : qu’il commande par une présence visible, ou par une voix, ou par notre conscience, cela importe peu, du moment que nous sentons qu’il y a commandement. S’il y a un commandement on peut y obéir, ou y désobéir ; on peut l’accepter comme l’acceptèrent Samuel ou saint Paul ; ou le repousser comme fit le jeune homme qui avait de grands biens.

      responsory: |-
        R/ Le Seigneur est toujours vrai quand il parle,
        toujours fidèle quand il agit.

        Le Seigneur viendra pour être glorifié dans ses saints
        et admiré en tous ceux qui auront cru.

        Que Dieu vous rende dignes de son appel,
        que sa puissance mène à bonne fin
        le labeur de votre foi.

        Que le nom de notre Seigneur Jésus Christ
        soit glorifié en vous
        et vous en lui, selon la grâce de notre Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu, toi qui as comblé saint Just de grâces diverses,
    >en l’appelant d’abord à recevoir pour nous la charge de pasteur
    >et en lui suggérant ensuite d’y renoncer,
    accorde-nous, à sa prière,
    >de toujours entendre ta voix
    >au milieu des changements de ce monde,
    afin de ne jamais nous écarter de ta volonté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Col 1, 24-29
      headline: |-
        « De cette Église, je suis devenu ministre, et Dieu m’a confié une mission »
      content: |-
        Frères,
        maintenant je trouve la joie dans les souffrances
        >que je supporte pour vous ;
        ce qui reste à souffrir des épreuves du Christ
        >dans ma propre chair,
        je l’accomplis pour son corps qui est l’Église.
        De cette Église, je suis devenu ministre,
        et la mission que Dieu m’a confiée,
        >c’est de mener à bien pour vous l’annonce de sa parole,
        le mystère qui était caché depuis toujours
        >à toutes les générations,
        mais qui maintenant a été manifesté
        >à ceux qu’il a sanctifiés.
        Car Dieu a bien voulu leur faire connaître
        >en quoi consiste la gloire sans prix de ce mystère
        >parmi toutes les nations :
        le Christ est parmi vous,
        >lui, l’espérance de la gloire !
        Ce Christ, nous l’annonçons :
        >nous avertissons tout homme,
        >nous instruisons chacun en toute sagesse,
        >afin de l’amener à sa perfection dans le Christ.
        C’est pour cela que je m’épuise à combattre,
        >avec la force du Christ
        >dont la puissance agit en moi.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      label: null
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 1, 14-20
      headline: |-
        « Je vous ferai devenir pêcheurs d’hommes »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        Après l’arrestation de Jean le Baptiste,
        Jésus partit pour la Galilée
        >proclamer l’Évangile de Dieu ;
        il disait :
        >« Les temps sont accomplis :
        >le règne de Dieu est tout proche.
        Convertissez-vous et croyez à l’Évangile. »
        Passant le long de la mer de Galilée,
        Jésus vit Simon et André, le frère de Simon,
        >en train de jeter les filets dans la mer,
        >car c’étaient des pêcheurs.
        Il leur dit :
        >« Venez à ma suite.
        Je vous ferai devenir pêcheurs d’hommes. »
        Aussitôt, laissant leurs filets,
        >ils le suivirent.
        Jésus avança un peu
        et il vit Jacques, fils de Zébédée, et son frère Jean,
        >qui étaient dans la barque et réparaient les filets.
        Aussitôt, Jésus les appela.
        Alors, laissant dans la barque leur père Zébédée avec ses ouvriers,
        >ils partirent à sa suite.