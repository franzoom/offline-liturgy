celebration:
  title: Saint Marcellin Champagnat
  subtitle: prêtre
  description: Né en 1789 à Marlhes, alors au diocèse de Lyon. Il fit ses études au petit séminaire de Verrière et au grand séminaire de Lyon. Prêtre, il fut nommé vicaire à la Valla-en-Gier, près de Saint-Chamond. C’est là qu’il fonda les Petits Frères de Marie (Frères maristes) en vue de l’éducation des enfants et des jeunes. Il mourut le 6 juin 1840.
  commons:
    - pastors
    - saints-male_educator
  color: white

oration:
  - Dieu, qui as suscité dans ton Église le bienheureux Marcellin Champagnat pour former les jeunes à la vie chrétienne, accorde-nous d’être enthousiasmés par ses exemples et de suivre le Christ notre Maître afin d’arriver jusqu’à toi en compagnie de nos frères.

readings:
  patristicReading:
    - title: MÉDITATIONS POUR ÉDUCATEURS DE SAINT JEAN BAPTISTE DE LA SALLE
      content: |-
        Non seulement %Dieu veut que tous les hommes parviennent à la connaissance de la vérité%, mais %il veut que tous soient sauvés% (1Tm 2,4) ; et il ne peut pas le vouloir véritablement sans leur en donner les moyens et, par conséquent, sans donner aux enfants des maîtres qui contribuent, à leur égard, à l’exécution de ce dessein. C’est là, dit saint Paul, %le champ que Dieu cultive% et %l’édifice qu’il élève% ; et c’est vous qu’il a choisis pour l’aider dans cet ouvrage (cf. 1Co 3,9), en annonçant à ces enfants l’Évangile de son Fils, et les vérités qui y sont contenues. 
        C’est pourquoi vous devez %honorer votre ministère%, tâchant d’en %sauver quelques-uns% (cf. Rm 11,13-14) ; car puisque Dieu, selon l’expression du même apôtre, vous a rendus ses ministres pour les %réconcilier avec lui%, et qu’il vous a confié, pour cet effet, %la parole de réconciliation% à leur égard, exhortez-les comme si Dieu les exhortait par vous (cf. 2Co 5,18.20), vous ayant destinés pour annoncer à ces jeunes les vérités de l’Évangile, et leur procurer des moyens de salut qui soient à leur portée. Enseignez-les-leur, non avec des paroles étudiées, de peur que %la croix de Jésus Christ%, qui est la source de notre sanctification, n’en soit %anéantie% (cf. 1Co 1,17), et que tout ce que vous leur direz ne produise aucun fruit dans leur esprit et dans leur cœur. 
        Tous vos soins à l’égard des enfants qui vous sont confiés seraient inutiles, si Jésus Christ lui-même ne leur donnait la vertu, la force et l’efficacité qui leur est nécessaire pour les rendre utiles. %Comme la branche de la vigne ne peut d’elle-même porter de fruit%, dit notre Seigneur %si elle ne demeure attachée au cep, de même vous ne pouvez en porter si vous ne demeurez en moi% (Jn 15,4). 
        Ce sera %la gloire de mon Père que vous rapportiez beaucoup de fruit et que vous deveniez mes disciples% (Jn 15,8). Ce que Jésus Christ dit à ses saints apôtres, il vous le dit aussi à vous-mêmes, pour vous faire connaître que tout le fruit que vous pouvez faire dans votre emploi, à l’égard de ceux qui vous sont confiés, ne sera ni véritable ni efficace, qu’autant que Jésus Christ y donnera sa bénédiction, et que vous demeurerez en lui ; comme la branche de la vigne ne peut porter de fruit qu’autant qu’elle demeure attachée au cep, et qu’elle en tire sa sève et sa vigueur, et c’est aussi ce qui fait toute la bonté du fruit. Jésus Christ veut vous faire entendre par cette comparaison, que plus ce que vous ferez pour le bien de vos disciples sera animé par lui et tirera sa vertu de lui, plus aussi il produira du fruit en eux.
        C’est pourquoi vous devez beaucoup lui demander que toutes les instructions que vous leur donnerez soient animées de son Esprit, et qu’elles tirent de lui toute leur force : afin que, comme c’est lui qui %éclaire tout homme venant au monde% (Jn 1,9), ce soit lui aussi qui éclaire leur esprit, et les porte à aimer et à pratiquer le bien que vous leur enseignerez.

      responsory: |-
        R/ Apprenons du Maître à devenir disciples.
        Il n’est pas venu juger ses frères mais les sauver.

        Du trésor de, son cœur a débordé la Parole de Vie
        Le Seigneur est venu jusqu’à nous
        pour nous élever jusqu’à lui.

        Parfaite est la loi de l’amour,
        qui a fait du Fils de Dieu notre serviteur.

        Limpide est le regard de l’amour,
        qui, dans le frère, sert le Fils de Dieu.

        Véridique est le fruit de l’amour,
        qui nous rend fils de Dieu.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Dieu qui as suscité dans ton Église
    saint Marcellin Champagnat
    >pour former les jeunes à la vie chrétienne,
    accorde-nous d’être enthousiasmés par ses exemples
    et de suivre le Christ notre Maître,
    >afin d’arriver jusqu’à toi en compagnie de nos frères.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ez 3, 16-21
      headline: |-
        « Je fais de toi un guetteur pour la maison d’Israël »
      content: |-
        En ces jours-là,
        la parole du Seigneur me fut adressée :
        >« Fils d’homme, je fais de toi un guetteur
        >pour la maison d’Israël.
        Lorsque tu entendras une parole de ma bouche,
        >tu les avertiras de ma part.
        Si je dis au méchant : “Tu vas mourir”,
        >et que tu ne l’avertisses pas,
        >si tu ne lui dis pas d’abandonner sa conduite mauvaise
        >afin qu’il vive,
        >lui, le méchant, mourra de son péché,
        >mais à toi, je demanderai compte de son sang.
        Au contraire, si tu avertis le méchant,
        >et qu’il ne se détourne pas
        >de sa méchanceté et de sa conduite mauvaise,
        >lui mourra de son péché,
        >mais toi, tu auras sauvé ta vie.
        Si le juste se détourne de sa justice
        >et fait le mal,
        >je le ferai trébucher :
        >il mourra.
        Parce que tu ne l’auras pas averti,
        >il mourra de son péché,
        >et l’on ne se souviendra plus
        >de la justice qu’il avait pratiquée ;
        >mais à toi je demanderai compte de son sang.
        Au contraire, si tu avertis le juste de ne pas pécher,
        >et qu’en effet il ne pèche pas,
        >c’est certain, il vivra parce qu’il aura été averti,
        >et toi, tu auras sauvé ta vie. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        content: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        « Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 1, 14-20
      headline: |-
        « Je vous ferai devenir pêcheurs d’hommes »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        Après l’arrestation de Jean le Baptiste,
        Jésus partit pour la Galilée
        >proclamer l’Évangile de Dieu ;
        il disait :
        >« Les temps sont accomplis :
        >le règne de Dieu est tout proche.
        Convertissez-vous et croyez à l’Évangile. »
        Passant le long de la mer de Galilée,
        Jésus vit Simon et André, le frère de Simon,
        >en train de jeter les filets dans la mer,
        >car c’étaient des pêcheurs.
        Il leur dit :
        >« Venez à ma suite.
        Je vous ferai devenir pêcheurs d’hommes. »
        Aussitôt, laissant leurs filets,
        >ils le suivirent.
        Jésus avança un peu
        et il vit Jacques, fils de Zébédée, et son frère Jean,
        >qui étaient dans la barque et réparaient les filets.
        Aussitôt, Jésus les appela.
        Alors, laissant dans la barque leur père Zébédée avec ses ouvriers,
        >ils partirent à sa suite.