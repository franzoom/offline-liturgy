celebration:
  title: Sainte Claudine Thévenet
  subtitle: religieuse
  description: |-
    Claudine Thévenet est née en 1774 à Lyon. En 1793, pendant la Terreur, elle assista à l’exécution de deux de ses frères, dont les derniers mots – « Pardonne comme nous pardonnons » - suscitèrent en elle une vocation : consacrer sa vie au don de soi. En 1816, un prêtre lui confia deux orphelines. Les accueils se multiplièrent au rythme des demandes d’aide. Encouragée à constituer une congrégation par un prêtre, elle fonda en 1818 la Congrégation Religieuse de Jésus-Marie. La mission de sainte Claudine, qui fut toujours soucieuse de faire grandir ces enfants dans la foi, entra dans le cadre d’un projet éducatif et spirituel. Celui-ci séduisit les milieux aisés pour lesquels elle fonda des pensionnats. Elle se consacra à ses deux œuvres jusqu’à sa mort, en 1837.
  commons: 
    - saints-female_religious
  locative: à Lyon
  color: white

oration:
  - Dieu notre Père, tu as révélé à sainte Claudine, dans le cœur ouvert de ton Fils, ta miséricordieuse bonté, et tu lui as inspiré le désir de se consacrer totalement à faire aimer Jésus et Marie par l’éducation des jeunes. Accorde-nous d’être, comme elle, des témoins de ta bonté et transforme nos vies au service de nos frères en sacrifice de louange. Par Jésus Christ.

readings:
  patristicReading:
    - title: HISTOIRE DE LA CONGRÉGATION DES RELIGIEUSES DE JÉSUS MARIE
      subtitle: d’après le témoignage de contemporains
      content: |-
        Adolescente, Claudine avait connu les horreurs de 93. Au début de cette sanglante période, si justement désignée dans l’histoire sous le nom de la terreur, la ville de Lyon avait subi toutes les péripéties d’un long siège... Comme pour la plupart des habitants, l’anxiété et les privations furent le partage de la famille Thévenet pendant tout le temps que dura le siège.
        Monsieur Thévenet s’était hâté de mettre les plus jeunes de ses enfants à l’abri du danger dès l’approche des troupes de la Convention. Il ne put être de retour avant le complet investissement de Lyon. Madame Thévenet restait donc dans une ville assiégée avec sa fille Claudie et ses deux fils ainés Louis et François.
        Ces deux jeunes gens [...] s’enrôlèrent à leur tour pour la défense de la vieille ville lyonnaise, et jusqu’à la fin des hostilités, ils firent noblement leur devoir [...]
        Après la reddition de la ville [...] les fils Thévenet furent dénoncés et conduits dans les prisons de l’Hôtel de Ville. Le lieu de leur détention ne pouvait laisser de doute sur leur sort : après les rigueurs de la prison venait la fusillade...
        Quelques heures avant d’être conduits au supplice, ils tracèrent d’une main ferme leurs adieux à la famille. Ces lignes devaient arriver à leur destination par une invention touchante de piété filiale.
        Ignorant que leur sentence fut portée, Claudine se dirigeait encore une fois vers la prison après plusieurs tentatives infructueuses des jours précédents, et avec le vif espoir de voir les chers captifs, ne fut-ce que quelques instants. Elle était accompagnée d’un domestique de confiance. Aux abords de l’Hôtel de Ville, parait un détachement de troupes ; derrière le détachement suivent les condamnés entre une double haie de soldats. Ses frères sont du nombre des victimes. Claudine Thévenet les aperçoit et tressaille. Son regard s’est croisé avec celui de Louis, l’ainé de ses frères. Elle s’approche aussi près que possible du cortège, et s’attache aux pas de cette longue file de patriotes. Ils étaient 209 en tout [...] l’élite de la jeunesse lyonnaise, et marchaient enchainés, deux à deux.
        Louis Thévenet n’a perdu aucun des mouvements de sa sœur. Quand elle et son domestique se sont approchés de plus près, Louis s’adresse au fidèle serviteur et lui dit à demi-voix : « Baisse-toi comme pour ramasser quelque chose et prends dans mon soulier une lettre pour notre mère ». Puis, se tournant vers sa sœur, et lui indiquant des yeux la lettre que lui remettait en pleurant le vieux messager : « Tiens, Claudine, lui dit-il, pardonne comme nous pardonnons ! »
        Éplorée et plus morte que vive, Claudine Thévenet trouve encore la force de suivre le cortège jusqu’aux Brotteaux, lieu ordinaire des exécutions... En ce moment de suprême angoisse, la pensée de Notre-Seigneur expirant en croix avec le mot de pardon sur les lèvres, fut pour son cœur broyé une lumière et un soutien. La dernière prière et l’unique vœu de ses frères chéris à cette heure solennelle : « Tiens, Claudine, pardonne comme nous pardonnons » n’étaient-il pas comme l’écho des paroles du doux Sauveur ? La pauvre enfant joignit les mains et essaya de balbutier à son tour : « Mon Dieu ! pardonnez aux meurtriers, ils ne savent ce qu’ils font ! ».
      responsory: |-
        R/ Vivante est la Parole de Dieu
        plus pénétrante qu’un glaive.

        Fils d’homme, je t’ai fait sentinelle :
        de ma part, tu avertiras mon peuple.

        Fils d’homme, porte-leur mes paroles,
        qu’ils écoutent ou qu’ils n’écoutent pas.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Dieu notre Père, tu as révélé à sainte Claudine,
    dans le cœur ouvert de ton Fils, ta miséricordieuse bonté
    et tu lui as inspiré le désir de se consacrer totalement
    >à faire connaître et aimer Jésus et Marie
    >par l’éducation des jeunes.
    Accorde-nous d’être, comme elle, les témoins de ta bonté
    >et transforme nos vies au service de nos frères
    >en sacrifice de louange.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1R 19, 16b.19-21
      headline: |-
        « Élisée partit à la suite d’Élie et se mit à son service »
      content: |-
        En ces jours-là,
        le Seigneur avait dit au prophète Élie :
        >« Tu consacreras Élisée, fils de Shafath,
        >comme prophète pour te succéder. »
        Élie s’en alla.
        Il trouva Élisée, fils de Shafath, en train de labourer.
        Il avait à labourer douze arpents,
        >et il en était au douzième.
        Élie passa près de lui et jeta vers lui son manteau.
        Alors Élisée quitta ses bœufs, courut derrière Élie,
        et lui dit :
        >« Laisse-moi embrasser mon père et ma mère,
        >puis je te suivrai. »
        Élie répondit :
        >« Va-t’en, retourne là-bas !
        Je n’ai rien fait. »
        Alors Élisée s’en retourna ;
        mais il prit la paire de bœufs pour les immoler,
        les fit cuire avec le bois de l’attelage,
        >et les donna à manger aux gens.
        Puis il se leva, partit à la suite d’Élie
        >et se mit à son service.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        content: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 57-62
      headline: |-
        « Je te suivrai partout où tu iras »
      content: |-
        En ce temps-là,
        en cours de route, un homme dit à Jésus :
        >« Je te suivrai partout où tu iras. »
        Jésus lui déclara :
        >« Les renards ont des terriers,
        >les oiseaux du ciel ont des nids ;
        >mais le Fils de l’homme n’a pas d’endroit où reposer la tête. »
        Il dit à un autre :
        >« Suis-moi. »
        L’homme répondit :
        >« Seigneur, permets-moi d’aller d’abord enterrer mon père. »
        Mais Jésus répliqua :
        >« Laisse les morts enterrer leurs morts.
        Toi, pars, et annonce le règne de Dieu. »
        Un autre encore lui dit :
        >« Je te suivrai, Seigneur ;
        >mais laisse-moi d’abord faire mes adieux
        >aux gens de ma maison. »
        Jésus lui répondit :
        >« Quiconque met la main à la charrue,
        >puis regarde en arrière,
        >n’est pas fait pour le royaume de Dieu. »