celebration:
  title: Saint Maurice et ses compagnons
  subtitle: martyrs
  description: Lors de la persécution de Dioclétien (303-305), des soldats chrétiens furent mis à mort pour leur foi à Agaune dans le Valais. Un siècle et demi plus tard, l’évêque de Lyon Eucher rédigea le récit de leur martyre d’après des traditions orales. C’est à lui qu’on doit de connaître les noms de Maurice et de ses compagnons dont le culte, en peu de temps, devint populaire.
  commons:
    - martyr
  locative: à Lyon
  color: red

oration:
  - Seigneur, la gloire de tes élus est un reflet de ta splendeur, et tu as consacré ce jour par le martyre de saint Maurice et de ses compagnons ; accorde à ton Église, qui fête avec joie leur entrée dans le ciel, de trouver, à leur exemple et par leur prière, le chemin de ta miséricorde.

readings:
  patristicReading:
    - title: LA PASSION DES MARTYRS D’AGAUNE
      content: |-
        Sous Maximien, qui fut empereur de Rome avec Dioclétien pour collègue, en de nombreuses provinces, des martyrs en foule furent torturés ou mis à mort. Il y avait dans l’armée, à cette époque, une légion de soldats appelés Thébéens. Ils étaient venus d’Orient d’où on les avait fait venir au secours de Maximien, car c’étaient d’excellents guerriers, nobles par leur courage, mais plus nobles par leur foi. Aussi, comme on les avait chargés de persécuter une multitude de chrétiens, ils furent les seuls à oser condamner cette mission de cruauté et ils refusèrent d’obéir à des ordres pareils. Maximien, épuisé par le trajet, se trouvait auprès de Martigny (dans le Valais). Là, il fut informé par des messagers que cette légion s’était immobilisée dans le défilé d’Agaune, et son indignation le fit bouillir de fureur. Donc, lorsqu’il connut la réponse des Thébéens, emporté par sa colère aveugle, il ordonna de tuer un homme sur dix, afin que les autres, terrifiés par les ordres du souverain, les acceptent par peur. Il réitère ses décisions et prescrit de forcer les survivants à persécuter les chrétiens. 
        Lorsque les Thébéens reçoivent cette injonction renouvelée, une clameur s’élève dans le camp : ils affirment qu’ils n’accepteront jamais une tâche aussi sacrilège, qu’ils ont toujours détesté l’impiété idolâtre, qu’ils ont reçu l’initiation des mystères chrétiens, qu’ils ont été formés dans la religion du vrai Dieu, et qu’ils préfèrent mourir plutôt que de combattre la foi chrétienne. 
        En apprenant cette réponse, Maximien ordonne que, de nouveau, un homme sur dix soit mis à mort et que les autres n’en soient pas moins forcés d’accomplir la tâche qu’ils rejettent. Ces ordres à leur tour parviennent au camp : on tire au sort un homme sur dix et il est exécuté. Mais le reste de la troupe s’encourageait à persister dans une aussi belle attitude. Cependant, celui qui fut le plus actif à encourager la foi fut saint Maurice, le chef de la légion ; avec ses officiers, Exsupère et Candide, il excitait la ferveur de chacun par ses exhortations et ses avertissements. 
        Les soldats de la légion thébéenne ainsi poussés par leurs chefs et leurs supérieurs envoient à Maximien un message aussi courageux que religieux, ainsi conçu : « Empereur, nous sommes tes soldats, mais aussi les serviteurs de Dieu, ce que nous professons hardiment. À toi nous devons le service militaire, à lui une conscience pure. Nous sommes prêts à porter les mains contre n’importe quel ennemi, mais nous estimons que c’est un crime de les ensanglanter en massacrant des innocents. Nous avons d’abord prêté serment envers Dieu, ensuite nous avons prêté serment envers le souverain. Sois persuadé que le second n’a plus aucune valeur pour nous, si nous avons rompu le premier. Tu nous ordonnes de rechercher les chrétiens pour les conduire au supplice. 
        Désormais tu n’as pas besoin d’en chercher d’autres : nous professons que nous sommes chrétiens, nous ne pouvons pas persécuter les chrétiens ». 
        Maximien, voyant que ces guerriers avaient le cœur fixé dans la foi au Christ et désespérant de pouvoir fléchir leur glorieuse constance, ordonna, par une seule sentence, de les tuer tous, et en chargea les troupes qui les entouraient. 
        Ils se faisaient donc frapper en masse, sans même protester ni résister ; au contraire ils déposaient les armes, présentaient leur tête aux persécuteurs et leur gorge ou leur corps découvert aux bourreaux. 
        Ils ne songeaient pas à autre chose qu’à confesser celui qui a été conduit à la mort sans protester, celui qui, comme l’agneau, n’a pas ouvert la bouche. Eux-mêmes, comme le troupeau des brebis du Seigneur, se laissèrent massacrer par les loups qui se ruaient sur eux.

      responsory: |-
        R/ Sois fidèle jusqu’à la mort,
        le Seigneur combat pour toi, alléluia !

        Ne craignez pas ceux qui tuent le corps
        et ne peuvent rien de plus.

        Le vainqueur, celui qui croit en moi,
        ne connaîtra pas la seconde mort.

        Espère en Dieu, prends cœur et prends courage,
        espère en Dieu !

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur, la gloire de tes élus est un reflet de ta splendeur,
    et tu as consacré ce jour
    par le martyre de saint Maurice et de ses compagnons ;
    Accorde à ton Église,
    qui fête avec joie leur entrée dans le Ciel,
    >de trouver, à leur exemple et par leur prière,
    >le chemin de ta miséricorde.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Sg 3, 1-9
      headline: |-
        « Comme une offrande parfaite, il les accueille »
      content: |-
        Les âmes des justes sont dans la main de Dieu ;
        >aucun tourment n’a de prise sur eux.
        Aux yeux de l’insensé, ils ont paru mourir ;
        leur départ est compris comme un malheur,
        >et leur éloignement, comme une fin :
        mais ils sont dans la paix.
        Au regard des hommes, ils ont subi un châtiment,
        >mais l’espérance de l’immortalité les comblait.
        Après de faibles peines,
        >de grands bienfaits les attendent,
        car Dieu les a mis à l’épreuve
        >et trouvés dignes de lui.
        Comme l’or au creuset, il les a éprouvés ;
        >comme une offrande parfaite, il les accueille.
        Au temps de sa visite, ils resplendiront :
        >comme l’étincelle qui court sur la paille, ils avancent.
        Ils jugeront les nations, ils auront pouvoir sur les peuples,
        >et le Seigneur régnera sur eux pour les siècles.
        Qui met en lui sa foi comprendra la vérité ;
        >ceux qui sont fidèles resteront, dans l’amour, près de lui.
    - biblicalRef: Ap 7, 13-17
      headline: |-
        « Ils ont lavé leurs robes dans le sang de l’Agneau »
      content: |-
        Moi, Jean,
        >j’ai vu une foule immense devant le trône de Dieu.
        L’un des Anciens prit la parole et me dit :
        >« Ces gens vêtus de robes blanches,
        qui sont-ils, et d’où viennent-ils ? »
        Je lui répondis :
        >« Mon seigneur, toi, tu le sais. »
        Il me dit :
        >« Ceux-là viennent de la grande épreuve ;
        ils ont lavé leurs robes,
        >ils les ont blanchies par le sang de l’Agneau.
        C’est pourquoi ils sont devant le trône de Dieu,
        >et le servent, jour et nuit, dans son sanctuaire.
        Celui qui siège sur le Trône
        >établira sa demeure chez eux.
        Ils n’auront plus faim, ils n’auront plus soif,
        >ni le soleil ni la chaleur ne les accablera,
        puisque l’Agneau qui se tient au milieu du Trône
        >sera leur pasteur
        >pour les conduire aux sources des eaux de la vie.
        Et Dieu essuiera toute larme de leurs yeux. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 26 (27), 1, 2, 3
      chorus:
      - chorusRef: null
        content: |-
          Le Seigneur est ma force et mon salut,
          il est ma délivrance.
      content: |-
        Le Seigneur est ma lumière et mon salut ;
        de qui aurais-je crainte ?
        Le Seigneur est le rempart de ma vie ;
        devant qui tremblerais-je ?

        Si des méchants s’avancent contre moi
        pour me déchirer,
        ce sont eux, mes ennemis, mes adversaires,
        qui perdent pied et succombent.

        Qu’une armée se déploie devant moi,
        mon cœur est sans crainte ;
        que la bataille s’engage contre moi,
        je garde confiance.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 28-33
      headline: |-
        « Ne craignez pas ceux qui tuent le corps »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi, dont témoignent les martyrs,
        nous t’acclamons : tu es Seigneur !
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        >« Ne craignez pas ceux qui tuent le corps
        >sans pouvoir tuer l’âme ;
        >craignez plutôt celui qui peut faire périr dans la géhenne
        >l’âme aussi bien que le corps.
        Deux moineaux ne sont-ils pas vendus pour un sou ?
        Or, pas un seul ne tombe à terre
        >sans que votre Père le veuille.
        Quant à vous, même les cheveux de votre tête sont tous comptés.
        Soyez donc sans crainte :
        >vous valez bien plus qu’une multitude de moineaux.
        Quiconque se déclarera pour moi devant les hommes,
        >moi aussi je me déclarerai pour lui
        >devant mon Père qui est aux cieux.
        Mais celui qui me reniera devant les hommes,
        >moi aussi je le renierai
        >devant mon Père qui est aux cieux. »