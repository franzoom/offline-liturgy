celebration:
  title: Saint Pierre Chanel
  subtitle: prêtre et martyr
  description: Pierre-Louis-Marie Chanel, né le 12 juillet 1803 à Cuet dans l’Ain, appartenait au diocèse de Lyon par sa naissance, car le diocèse de Belley avait été supprimé par le Concordat et rattaché au diocèse de Lyon. Il lui appartenait aussi par son travail apostolique, car il fut successivement vicaire à Ambérieu et curé de Crozet. Entré dans la Société de Marie, fondée par le père Colin, originaire du diocèse de Lyon, il partit pour l’Océanie et subit le martyre dans l’île de Futuna, le 28 avril 1841.
  commons:
    - martyr
    - pastors_missionary
  color: red
  locative: à Lyon

oration:
  - Pour annoncer l’Évangile, tu as donné, Seigneur, à saint Pierre Chanel, une douceur admirable, un ardent amour de charité et un courage à toute épreuve ; donne-nous de marcher sur ses traces en persévérant dans la foi jusqu’à la mort.

readings:
  patristicReading:
    - title: LETTRE DE PIERRE CHANEL AU PÈRE COLIN
      subtitle: 16 mai 1839
      content: |-
        C’est avec un plaisir vraiment indicible qu’après un séjour de dix-huit mois à Futuna avec le jeune Frère Marie Nizier, je reçois enfin la visite du premier renfort apostolique, que vous avez la bonté d’envoyer à notre secours. De Valaparaiso ils ont touché aux îles Gambier, puis à Taïti et enfin à Wallis, où ils ont pris à bord de leur petite goélette Notre-Dame-de-Paix, le Père Bataillon, que j’ai la consolation d’embrasser avec eux tous. Ils sont tous bien portants et comptent neuf mois depuis leur départ de France. C’est le 8 mai, veille de la fête de l’Ascension, que ces chers confrères viennent me surprendre d’une manière aussi agréable. Cinq messes ont été célébrées le jour de la fête. J’ai prié le Père Bataillon de dire la dernière, qui a été chantée solennellement dans la maison du roi Niuliki. Les naturels qui y étaient présents s’y tinrent d’une manière respectueuse. Ce roi Niuliki est celui avec lequel Monseigneur Pompallier, notre évêque, a traité pour nous faire rester dans l’île. Il promit à sa Grandeur que nous serions bien dans sa terre. Il n’a rien négligé pour tenir sa promesse. Il a pour nous une tendresse vraiment paternelle… 
        L’île n’est pas encore chrétienne ; outre mon peu de zèle, il y a mille craintes et préventions à dissiper... Le roi et la plupart des plus grands chefs ont la réputation d’avoir des dieux qu’ils disent descendre en eux. Ces dieux font peur aux autres naturels. Ceux-ci n’épargnent pas les présents pour se les rendre favorables. 
        Vingt baptêmes, dont quatre d’adultes, tout le reste d’enfants, et tous en danger de mort, sont toute la moisson recueillie pendant dix-huit mois. Nous avons pourtant la consolation de voir les dispositions des naturels s’améliorer de jour en jour. Monseigneur n’étant point venu au bout de six mois, selon qu’il l’avait dit, nous avons passé le Frère Marie Nizier et moi, pour des menteurs ou comme deux hommes abandonnés. L’arrivée de nos confrères produit le meilleur effet possible dans l’esprit de tout le monde. On nous écoute avec plaisir, tout le monde veut voir les nouveaux venus et on ne cesse de demander leurs noms…
        Nous avons été un peu indisposés pendant notre séjour. Les naturels partagent avec nous leur nourriture. Quand il y a peu, on mange peu ; quand il y a beaucoup, on mange plus. Je n’ai que des choses satisfaisantes à dire au sujet du Frère Marie Nizier. Nous apprécions tous les jours de plus en plus le bonheur d’appartenir à la Société de Marie. 
        Nous désirerions bien que nos cœurs fussent aussi brûlants que le climat sous lequel nous vivons. Mais hélas ! combien il s’en faut qu’il en soit ainsi ! Nous tâchons de faire tous les jours nos exercices de piété ensemble. L’extrait de la règle et la lettre dont vous l’avez accompagné sont entre les mains de Monseigneur Pompallier. Nous avons chacun une copie de votre lettre que nous regardons tous comme un monument de votre tendresse paternelle à notre égard ...

      responsory: |-
        R/ De la détresse des prisons
        monte le cri des fils de Dieu persécutés ;
        mais le Royaume est proche
        bientôt se lèvera le Fils de l’homme qu’ils acclament. 

        Dieu vivant, Seigneur ressuscité,
        nous croyons en toi. 

        Un moment vous souffrirez
        mais j’ai vaincu le monde, gardez courage. 

        En vérité, je vous le dis :
        Si quelqu’un garde ma parole, 
        il ne verra jamais la mort. 

        Je suis la résurrection ; 
        celui qui me donne sa foi,
        vivra même dans la mort.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Pour annoncer l’Évangile,
    tu as donné, Seigneur, à saint Pierre Chanel
    >une douceur admirable, un ardent amour de charité
    >et un courage à toute épreuve ;
    Donne-nous de marcher sur ses traces
    >en persévérant dans la foi jusqu’à la mort.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Co 9, 16-19.22-23
      headline: |-
        « Malheur à moi si je n’annonçais pas l’Évangile ! »
      content: |-
        Frères,
        annoncer l’Évangile,
        >ce n’est pas là pour moi un motif de fierté,
        >c’est une nécessité qui s’impose à moi.
        Malheur à moi si je n’annonçais pas l’Évangile !
        Certes, si je le fais de moi-même,
        >je mérite une récompense.
        Mais je ne le fais pas de moi-même,
        >c’est une mission qui m’est confiée.
        Alors quel est mon mérite ?
        C’est d’annoncer l’Évangile
        >sans rechercher aucun avantage matériel,
        >et sans faire valoir mes droits de prédicateur de l’Évangile.
        Oui, libre à l’égard de tous,
        je me suis fait l’esclave de tous
        >afin d’en gagner le plus grand nombre possible.
        Avec les faibles, j’ai été faible,
        >pour gagner les faibles.
        Je me suis fait tout à tous
        >pour en sauver à tout prix quelques-uns.
        Et tout cela, je le fais à cause de l’Évangile,
        >pour y avoir part, moi aussi.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 28, 16-20
      headline: |-
        « De toutes les nations faites des disciples »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        >apprenez-leur à observer
        >tout ce que je vous ai commandé.
        Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »