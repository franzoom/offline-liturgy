celebration:
  title: Saint Viateur
  description: |-
    Jeune lecteur de l’Église de Lyon, Viateur fut un disciple de prédilection de l’évêque saint Just, qui le prit comme compagnon dans sa retraite en Égypte. Il mourut huit jours après son évêque, et son corps fut ramené à Lyon en même temps que celui de saint Just. Ils furent tous deux inhumés en l’église des Maccabées (aujourd’hui l’église Saint-Just).
  commons:
    - saints-male
  locative: à Lyon
  color: white

oration:
  - Puisque nous honorons la mémoire de saint Viateur que tu as choisi pour servir en ta présence, accorde-nous, Seigneur, de ne jamais nous écarter de la grâce du ministère que tu nous as donnée.

readings:
  patristicReading:
    - title: TEXTE DE YVES DE MONTCHEUIL
      subtitle: Le Royaume et ses exigences
      content: |-
        Le Royaume de Dieu exige notre service, et néanmoins son instauration est tout entière œuvre divine. Nous ne le procurons pas, nous ne le construisons pas. Nous l’accueillons, nous y entrons. Nous travaillons aussi en vue de sa reconnaissance par les autres hommes, nous cherchons à le propager. Mais en lui-même, il n’est aucunement notre œuvre et, sur le plan même où notre action s’exerce, nous avons toujours à nous rappeler la parole de notre Seigneur : %Lorsque vous aurez fait tout ce que vous pouvez, dites : nous sommes des serviteurs inutiles% (Lc 17,10). Donc, d’une part, exigence de service absolu, et, d’autre part affirmation que ce service est hors de proportion avec le but à atteindre. 
        Le Royaume n’est pas d’abord conçu, imposé ou proposé par les hommes : il est annoncé par Dieu et par ses envoyés. Il est l’objet d’une révélation. Les Prophètes l’aperçoivent en leurs visions d’avenir, Jean Baptiste le proclame, Jésus Christ l’instaure. C’est un don de Dieu, dont l’avènement est fixé par Dieu. La grâce est absolument gratuite. L’homme ne peut qu’attendre, dans son activité même, que l’œuvre de Dieu se produise. Ce n’est pas par ses efforts humains qu’il hâtera le Royaume, pas plus que ce n’est par son intelligence humaine qu’il en concevra l’idée. 
        Certes, notre Seigneur réclame la vigilance : %le Fils de l’homme vient comme un voleur, alors qu’on l’attend le moins, et il ne faut pas manquer sa venue% (cf. Mt 24, 42-44) ; il est aussi comme le maître de maison, qui revient tard dans la nuit, et dont le bon serviteur guette le retour pour le servir (cf. Lc 12, 35-46). Mais cette vigilance doit être patiente : souvent le maître tarde, et en tout cas le développement du Royaume est l’œuvre de Dieu ; l’homme y est impuissant : %Il en est du Royaume de Dieu comme d’un homme qui aurait jeté du grain en terre : qu’il dorme ou qu’il se lève, la nuit ou le jour, la semence germe et pousse, il ne sait comment% (Mc 4,26-27). Jésus dit cela contre les zélotes, mais aussi bien contre l’impatience de ses propres apôtres. Il ne sert à rien que l’homme aille s’agiter autour de son champ, Dieu seul instaure le Royaume et le fait progresser. Il nous faut agir, mais notre attitude ne doit pas être, dans la recherche du Royaume, ce qu’elle est dans les œuvres temporelles, où le résultat dépend de notre action.

      responsory: |-
        R/ Ton serviteur
        est devenu ton ami, Seigneur,
        et sa bénédiction passe jusqu’à nous.

        Il n’est plus jamais seul, dans la solitude,
        celui dont le silence est habité par Dieu.

        Il a trouvé la paix pour la répandre,
        celui qui se donne à ses frères.

        Il entraîne vers Dieu un grand nombre de fils,
        celui qui a gravi le chemin de l’humilité.
mass:
- massType: DAY_MASS
  collect:
  - |-
    Puisque nous honorons la mémoire de saint Viateur
    que tu as choisi pour servir en ta présence,
    accorde-nous, Seigneur,
    de ne jamais nous écarter
    de la grâce du ministère que tu nous as donnée.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Col 1, 24-29
      headline: |-
        « De cette Église, je suis devenu ministre, et Dieu m’a confié une mission »
      content: |-
        Frères,
        maintenant je trouve la joie dans les souffrances
        >que je supporte pour vous ;
        ce qui reste à souffrir des épreuves du Christ
        >dans ma propre chair,
        je l’accomplis pour son corps qui est l’Église.
        De cette Église, je suis devenu ministre,
        et la mission que Dieu m’a confiée,
        >c’est de mener à bien pour vous l’annonce de sa parole,
        le mystère qui était caché depuis toujours
        >à toutes les générations,
        mais qui maintenant a été manifesté
        >à ceux qu’il a sanctifiés.
        Car Dieu a bien voulu leur faire connaître
        >en quoi consiste la gloire sans prix de ce mystère
        >parmi toutes les nations :
        le Christ est parmi vous,
        >lui, l’espérance de la gloire !
        Ce Christ, nous l’annonçons :
        >nous avertissons tout homme,
        >nous instruisons chacun en toute sagesse,
        >afin de l’amener à sa perfection dans le Christ.
        C’est pour cela que je m’épuise à combattre,
        >avec la force du Christ
        >dont la puissance agit en moi.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 10
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Allez dire aux nations : « Le Seigneur est roi ! »
        Le monde, inébranlable, tient bon.
        Il gouverne les peuples avec droiture.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 1, 14-20
      headline: |-
        « Je vous ferai devenir pêcheurs d’hommes »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        Après l’arrestation de Jean le Baptiste,
        Jésus partit pour la Galilée
        >proclamer l’Évangile de Dieu ;
        il disait :
        >« Les temps sont accomplis :
        >le règne de Dieu est tout proche.
        Convertissez-vous et croyez à l’Évangile. »
        Passant le long de la mer de Galilée,
        Jésus vit Simon et André, le frère de Simon,
        >en train de jeter les filets dans la mer,
        >car c’étaient des pêcheurs.
        Il leur dit :
        >« Venez à ma suite.
        Je vous ferai devenir pêcheurs d’hommes. »
        Aussitôt, laissant leurs filets,
        >ils le suivirent.
        Jésus avança un peu
        et il vit Jacques, fils de Zébédée, et son frère Jean,
        >qui étaient dans la barque et réparaient les filets.
        Aussitôt, Jésus les appela.
        Alors, laissant dans la barque leur père Zébédée avec ses ouvriers,
        >ils partirent à sa suite.
