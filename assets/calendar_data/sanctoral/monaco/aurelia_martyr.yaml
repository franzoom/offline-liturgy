celebration:
  title: Sainte Aurélie
  subtitle: vierge et martyre
  description: Sainte Aurélie aurait été immolée en raison de sa foi en Jésus Christ sous l’empereur Valérien, vers 260. Aurélie et sa mère, revenant de Grèce, apprirent le martyre d’Adrias et s’installèrent près de son tombeau, sur la voie Appienne, aux portes de Rome. Là, elles veillaient et priaient nuit et jour. Arrêtées par les soldats romains et refusant d’apostasier, elles furent martyrisées. Leurs corps furent déposés dans la catacombe de Saint-Calixte. En 1641, des reliques de sainte Aurélie, conservées par la famille Spinola, sont données à Honoré II de Monaco, à l’occasion du mariage d’Hercule, son fils, avec Aurélie Spinola.
  color: red
  commons:
    - martyr_female_virgin

oration:
  - Seigneur Dieu, tu nous réjouis en ce jour anniversaire où nous commémorons sainte Aurélie ; accorde-nous l’appui de ses mérites, puisqu’elle est pour nous un modèle rayonnant de chasteté et de force d’âme.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Voici qu’elle suit l’Agneau, crucifié pour nous,
      la vierge fidèle,
      >victime pure, offrande immaculée.
  collect:
  - |-
    Seigneur Dieu, +
    >tu nous réjouis en ce jour anniversaire
    >où nous commémorons sainte Aurélie ; *
    accorde-nous l’appui de ses mérites, /
    puisqu’elle est pour nous un modèle rayonnant
    >de chasteté et de force d’âme.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Seigneur, nous te présentons ces offrandes
    >en célébrant sainte Aurélie ; *
    accueille-les avec bienveillance, nous t’en prions, /
    comme tu as accueilli le combat de son martyre.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Ap 7,17
    content: |-
      L’Agneau qui se tient au milieu du Trône
      >les conduira aux sources des eaux de la vie.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >tu as donné à sainte Aurélie
    >d’être couronnée au double titre de vierge et de martyre ; *
    rends-nous forts pour surmonter le mal
    >par la force de ce sacrement, /
    et obtenir ainsi la gloire du ciel.
    Par le Christ, notre Seigneur.
