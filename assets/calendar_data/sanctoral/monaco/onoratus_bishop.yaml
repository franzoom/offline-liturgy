celebration:
  title: Saint Honorat
  subtitle: évêque
  description: C’est par saint Hilaire, son disciple et successeur sur le siège épiscopal d’Arles, que nous connaissons la vie de saint Honorat. Originaire d’une noble famille gallo-romaine, Honorat est devenu chrétien malgré la volonté de son père. Entraînant son frère Venance dans sa conversion, tous deux s’engagent dans la voie de l’ascétisme. C’est au retour d’un court séjour dans les déserts d’Égypte parmi les anachorètes, qu’Honorat arrive sur « Lérina », l’île de Lérins. Des disciples se groupent, Honorat devient chef de communauté. Ordonné prêtre par saint Léonce, évêque de Fréjus, il fonde le monastère de Lérins qui sera bientôt, sous son influence, une pépinière d’évêques, d’apôtres et de saints. En 428, il est appelé à la tête du diocèse d’Arles, où il se révéla un excellent pasteur et un docteur illustre. Mort en 430, ses reliques furent transférées à Lérins.
  color: white
  commons:
    - pastors_bishop

oration:
  - En donnant à saint Honorat le désir de suivre tes appels, Seigneur, tu l’as conduit dans la solitude avant de lui donner la charge de ton peuple ; accorde-nous, par son intercession, d’avancer sur le chemin de la sainteté en te cherchant toujours dans la prière, demeurant fermes dans la foi.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Dans son amour infini,
      le Seigneur a choisi l’évêque saint Honorat
      >pour faire fleurir en son peuple
      la foi et la sainteté.
  collect:
  - |-
    En donnant à saint Honorat
    >le désir de suivre tes appels, Seigneur, +
    tu l’as conduit dans la solitude
    >avant de lui donner la charge de ton peuple ; *
    accorde-nous, par son intercession,
    >d’avancer sur le chemin de la sainteté /
    en te cherchant toujours dans la prière,
    >demeurant fermes dans la foi.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    En cette fête de saint Honorat,
    >Seigneur, nous t'en prions, +
    regarde avec bonté les offrandes
    >que nous déposons sur l'autel qui t'es consacré; *
    en nous procurant ton pardon, /
    >qu'elles servent à la gloire de ton nom.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Lc 22, 28.30
    content: |-
      Vous avez tenu bon avec moi dans les épreuves.
      Et moi, je dispose pour vous du Royaume, dit le Seigneur;
      >ainsi vous mangerez et boirez à ma table dans mon Royaume.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >que le sacrement reçu
    >attise en nous le feu de la charité
    dont l’ardeur enflammait saint Honorat, /
    >et lui donnait de se dépenser sans relâche
    >pour ton Église.
    Par le Christ, notre Seigneur.
