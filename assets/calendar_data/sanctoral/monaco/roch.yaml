celebration:
  title: Saint Roch
  subtitle: pèlerin
  description: Il naquit aux environs de 1300 d’une famille honorable de Montpellier, les Rog, ou Rocch. Élevé pieusement, Roch perdit ses parents entre 15 et 20 ans, et décida de se rendre en pèlerinage au tombeau des Apôtres. Après avoir distribué de larges aumônes aux pauvres et confié à son oncle paternel l’administration de ses biens, il partit à Rome où il prodigua ses soins aux malades atteints de la peste. Atteint du mal à son tour, puis guéri, il regagna sa patrie sur un ordre du Ciel. D’après le Vénitien Diedo, il arriva à Montpellier où le gouverneur de la ville, son oncle, ne le reconnut pas et le fit enfermer dans la prison municipale. Il y fut oublié et mourut au bout de cinq ans. Dès 1629, le culte de saint Roch s’est développé à Monaco à cause d’un vœu fait dans la Principauté.
  color: white
  commons:
    - saints-male

oration:
  - Dans ton amour inépuisable, Seigneur, veille sur tes fidèles ; à la prière de saint Roch, qu’ils soient libérés de tout mal, et, à son exemple, qu’ils te servent en aimant leurs frères.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Mt 25, 34.36.40
    content: |-
      Venez, les bénis de mon Père, dit le Seigneur :
      >j’étais malade, et vous m’avez visité…
      Chaque fois que vous l’avez fait
      >à l’un de ces plus petits de mes frères,
      c’est à moi que vous l’avez fait.
  collect:
  - |-
    Dans ton amour inépuisable, Seigneur, +
    >veille sur tes fidèles ; *
    à la prière de saint Roch,
    >qu’ils soient libérés de tout mal ; /
    à son exemple, qu’ils te servent
    >en aimant leurs frères.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Accueille, Seigneur, les dons offerts par ton peuple ; *
    et puisque nous rappelons par eux
    >l’œuvre d’amour infini accomplie par ton Fils,
    à l’exemple de saint Roch, /
    >donne-nous d’être affermis
    >dans notre amour pour toi et pour le prochain.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 13, 35
    content: |-
      À ceci, tous reconnaîtront que vous êtes mes disciples :
      si vous avez de l’amour les uns pour les autres,
      >dit le Seigneur.
  prayerAfterCommunion:
  - |-
    Tu as refait nos forces, Seigneur, par tes saints mystères ; *
    donne-nous de suivre les exemples de saint Roch, /
    qui te manifesta un attachement indéfectible
    >et servit son peuple avec une charité sans limite.
    Par le Christ, notre Seigneur.
