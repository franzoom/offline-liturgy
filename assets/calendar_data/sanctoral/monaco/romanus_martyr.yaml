celebration:
  title: Saint Roman
  subtitle: martyr, patron de Monaco
  description: |-
    Saint Roman serait né près de la Turbie, pâtre sur les flancs du mont Agel, avant d’être enrôlé et conduit à Rome. Témoin du martyre du diacre saint Laurent, il fut touché par ses souffrances et décida de demander le baptême : il s’approcha secrètement du martyr avec une cruche d’eau et fut aussitôt baptisé. Découvert et violemment battu pour avoir déclaré publiquement sa foi, il fut mis à mort hors des remparts, à la Porta Salaria, décapité le 9 août 258, pendant la persécution de Valérien. En 1746 arrivèrent à Monaco les premières reliques de saint Roman, extraites de la catacombe de Saint-Calixte.
  color: red
  commons:
    - martyr

oration:
  - Dieu éternel et tout-puissant, tu as donné à saint Roman de combattre jusqu’à la mort pour la justice ; à son exemple, accorde-nous de supporter par amour pour toi toutes les adversités, et de mettre toute notre confiance en toi, qui es seul la vie.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Saint Roman est vraiment martyr,
      lui qui a versé son sang pour le nom du Christ ;
      >il n’a pas craint les menaces des juges,
      et il est parvenu au royaume des Cieux.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as donné à saint Roman
    >de combattre jusqu’à la mort pour la justice ; *
    à son exemple, accorde-nous
    >de supporter par amour pour toi toutes les adversités, /
    et de mettre toute notre confiance en toi,
    >qui es seul la vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  prayerAfterCommunion:
  - |-
    Puissions-nous imiter le courage de saint Roman,
    >et obtenir la récompense éternelle
    promise à ceux qui souffrent pour toi.
    Par le Christ, notre Seigneur.
