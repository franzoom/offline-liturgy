celebration:
  title: Bienheureux Daniel Brottier
  subtitle: prêtre
  description: |-
    Né en 1876 et ordonné prêtre en 1899, Daniel Brottier fut missionnaire au Sénégal, puis aumônier militaire à Verdun et sur la Somme durant la Première Guerre mondiale. À partir de 1923, il donna un essor remarquable à l’œuvre des orphelins d’Auteuil, fondée par l’abbé Roussel. Il mourut le 28 février 1936 et fut béatifié par Jean-Paul II en 1984.
  commons:
    - pastors
  color: white

oration:
  - |-
    Seigneur, tu as donné à ton serviteur Daniel un cœur plein de tendresse pour les pauvres ; accorde-nous, à sa prière, d’aimer nos frères comme toi-même nous as aimés.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - biblicalReference: Is 6, 8
        content: |-
          J’entendis la voix du Seigneur qui disait : « Qui enverrai-je ? Qui sera notre messager ? » Et je répondis : « Me voici, envoie-moi. »
    collect:
      - |-
        Seigneur, tu as donné à ton serviteur Daniel un cœur plein de tendresse pour les pauvres ; accorde-nous, à sa prière, d’aimer nos frères comme toi-même nous as aimés.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: 2 Co 4, 1-2.5-7
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 22 (23), 1-2b.2c-6
            content: |-
              Le Seigneur est mon berger :
              je ne manque de rien.
              Sur des prés d’herbe fraîche,
              il me fait reposer.

              Il me mène vers les eaux tranquilles
              et me fait revivre ;
              il me conduit par le juste chemin
              pour l’honneur de son nom.

              Si je traverse les ravins de la mort,
              je ne crains aucun mal,
              car tu es avec moi :
              ton bâton me guide et me rassure.

              Tu prépares la table pour moi
              devant mes ennemis ;
              tu répands le parfum sur ma tête,
              ma coupe est débordante.

              Grâce et bonheur m’accompagnent
              tous les jours de ma vie ;
              j’habiterai la maison du Seigneur
              pour la durée de mes jours.
      - partType: ALLELUIA
        partContents:
          - biblicalRef: Lc 4, 18
            content: |-
              Ainsi parle le Serviteur de Dieu : « Sur moi repose l’Esprit du Seigneur, il m’a envoyé porter aux pauvres la Bonne Nouvelle du salut. »
      - partType: GOSPEL
        partContents:
          - biblicalRef: Jn 15, 9-17
            headline: |-
              « Je ne vous appelle plus serviteurs, je vous appelle mes amis »
            content: |-
              En ce temps-là, Jésus disait à ses disciples :
              « Comme le Père m’a aimé,
              moi aussi je vous ai aimés.
              Demeurez dans mon amour.
              Si vous gardez mes commandements,
              vous demeurerez dans mon amour,
              comme moi, j’ai gardé les commandements de mon Père,
              et je demeure dans son amour.
              Je vous ai dit cela pour que ma joie soit en vous,
              et que votre joie soit parfaite.
              Mon commandement, le voici :
              Aimez-vous les uns les autres
              comme je vous ai aimés.
              Il n’y a pas de plus grand amour
              que de donner sa vie pour ceux qu’on aime.
              Vous êtes mes amis
              si vous faites ce que je vous commande.
              Je ne vous appelle plus serviteurs,
              car le serviteur ne sait pas ce que fait son maître ;
              je vous appelle mes amis,
              car tout ce que j’ai entendu de mon Père,
              je vous l’ai fait connaître.
              Ce n’est pas vous qui m’avez choisi,
              c’est moi qui vous ai choisis et établis
              afin que vous alliez,
              que vous portiez du fruit,
              et que votre fruit demeure.
              Alors, tout ce que vous demanderez au Père en mon nom,
              il vous le donnera.
              Voici ce que je vous commande :
              c’est de vous aimer les uns les autres. »
    offeringPrayer:
      - |-
        Accepte, Seigneur, comme un hommage de tes serviteurs, l’offrande que nous déposons sur ton autel en ce jour où nous faisons mémoire du bienheureux Daniel ; permets qu’en nous détachant des biens de la terre, nous n’ayons d’autres richesses que toi, et que nous nous en remettions à ta seule Providence.
    communionAntiphon:
      - biblicalReference: Mc 9, 37
        content: |-
          Celui qui accueille en mon nom un enfant, c’est moi qu’il accueille. Et celui qui m’accueille, ne m’accueille pas moi, mais Celui qui m’a envoyé.
    prayerAfterCommunion:
      - |-
        Par la grâce de cette eucharistie, Seigneur, affermis tes serviteurs dans la vérité de la foi ; qu’ils en témoignent partout, de bouche et de cœur, à l’exemple du bienheureux Daniel qui consacra toute sa vie à faire connaître l’Évangile.
