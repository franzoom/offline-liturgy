celebration:
  title: Saint Louis
  subtitle: roi de France
  description: |-
    Louis IX (1214-1270) réalisa le type du laïc vivant selon l’Évangile. Époux plein de tendresse, père attentif à élever ses enfants en vrais chrétiens, chef d’État soucieux de justice et de paix, il vivait sa foi humblement, au jour le jour, dans la prière, le service des pauvres et une joie toute franciscaine.
  commons:
    - saints-male_married
  color: white

oration:
  - |-
    Seigneur, tu as appelé saint Louis de la charge d’un royaume terrestre à la gloire du Royaume des cieux ; accorde-nous, par son intercession, de travailler à la venue de ton règne en accomplissant nos tâches temporelles.
