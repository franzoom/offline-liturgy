celebration:
  title: Notre-Dame de Boulogne
  description: |-
    Le village de Menus-les-Saint-Cloud prit au XIVe siècle le nom de Boulogne, en souvenir du sanctuaire fondé par le roi Philippe le Bel à la suite de son pèlerinage à Boulogne-sur-Mer. Le site, au bord d’un large bras de la Seine, fut choisi pour évoquer les rivages de la mer ; la dévotion à Notre-Dame de Boulogne demeure très répandue en France.
  commons:
    - virgin-mary
  color: white

oration:
  - |-
    Seigneur, qui as daigné placer notre littoral sous le patronage et la protection de la Vierge Marie, donne-nous d’être conduits par cette Étoile de la mer au milieu des vagues et des marées de ce monde, et de parvenir avec joie au port de ta gloire.

mass:
  - massType: DAY_MASS
    collect:
      - |-
        Seigneur, qui as daigné placer notre littoral sous le patronage et la protection de la Vierge Marie, donne-nous d’être conduits par cette Étoile de la mer au milieu des vagues et des marées de ce monde, et de parvenir avec joie au port de ta gloire.
    offeringPrayer:
      - |-
        Sanctifie, Seigneur, l’offrande que nous te présentons ; et, par la puissante intercession de Marie, la sainte Mère de Dieu, l’Étoile de la mer, fais que cette offrande nous procure le salut.
    prayerAfterCommunion:
      - |-
        Tu nous as rassasiés, Seigneur Jésus, en nous donnant le pain du Royaume ; permets que la Vierge Marie nous soutienne d’une main maternelle afin que nous puissions, avec son aide, parvenir au port du salut éternel.
