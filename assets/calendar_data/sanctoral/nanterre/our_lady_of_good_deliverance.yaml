celebration:
  title: Notre-Dame de Bonne Délivrance
  description: |-
    Le culte de la Vierge noire Notre-Dame de Bonne Délivrance remonte au Moyen Âge à Paris ; sa statue fut transférée à Neuilly en 1910. Les fidèles l’invoquent pour avancer en sécurité à travers les dangers de ce monde, et le pèlerinage, autrefois fréquenté par saint Dominique, saint François de Sales et saint Jean Bosco, s’y poursuit dans la chapelle des Sœurs de Saint-Thomas de Villeneuve.
  commons:
    - virgin-mary
  color: white
