celebration:
  title: Saints Alype et Possidius
  subtitle: évêques
  description: |-
    Né à Thagaste (Souk-Ahras), entre 360 et 365, Alype fut élève de saint Augustin ; il le suivit à Carthage, où il devint manichéen comme lui, puis à Rome et à Milan, où tous deux se convertirent et furent baptisés ensemble le 25 avril 387. Devenu évêque de sa ville natale, il mena le combat de la foi aux côtés de saint Augustin, son maître et son ami. Il ne lui survécut que de peu et mourut vers 430. Possidius, ami et biographe de saint Augustin, s’était mis à son école comme moine, à Hippone, vers 390. Élu évêque de Calama (Guelma), il lutta activement contre le donatisme. Délégué auprès de l’empereur Honorius par ses collègues dans l’épiscopat, il obtint que se tînt à Carthage une conférence contradictoire avec les donatistes ; il y participa personnellement en 411. Réfugié à Hippone auprès de saint Augustin, il l’assista à sa mort. Retourné à Calama, il en fut chassé en 437 par Genséric. On ignore le lieu de son exil et la date de sa mort.
  commons:
  - pastors_multiple
  color: white

oration:
- Pour le plus grand bien de tes fidèles, Seigneur, tu as voulu qu’une étroite amitié unisse à saint Augustin les saints évêques Alype et Possidius ; ils ont guidé ton peuple par leur vie et leur enseignement ; qu’ils le soutiennent par leur intercession et obtiennent aux pasteurs de ton Église d’être toujours unis par des liens fraternels.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Pour le plus grand bien de tes fidèles, Seigneur,
    >tu as voulu qu’une étroite amitié unisse à saint Augustin
    >les saints évêques Alype et Possidius ; +
    ils ont guidé ton peuple par leur vie et leur enseignement ; *
    qu’ils le soutiennent par leur intercession
    >et obtiennent aux pasteurs de ton Église /
    >d’être toujours unis par des liens fraternels.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
