celebration:
  title: Saint Charles de Foucauld
  subtitle: prêtre
  commons:
    - pastors
  color: white

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur, Père très saint, +
    >tu as appelé le prêtre saint Charles
    >à imiter ton Fils, Jésus de Nazareth ; *
    nous t’en prions, accorde-nous, par son intercession,
    >de progresser chaque jour,
    >nourris de l’Eucharistie,
    vers une charité chrétienne plus profonde /
    >et une fraternité universelle.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
