celebration:
  title: Saint Corneille
  subtitle: pape et martyr
  description: |-
    Le pape Corneille, qui mourut en exil à Civitavecchia au terme d’un bref pontificat (251- 253), avait gagné le respect et l’amitié de saint Cyprien. C’est pourquoi, dès le ive siècle, l’Église romaine fêtait Corneille au jour anniversaire de la mort de saint Cyprien.
  commons:
  - martyr
  - pastors_pope
  color: red

oration:
- Seigneur notre Dieu, tu as constitué saint Corneille successeur de l’apôtre Pierre et tu as bien voulu l’honorer de la victoire du martyre ; par son intercession, garde toujours ton troupeau bien-aimé, afin qu’il avance vers la patrie du ciel par une foi intègre et une charité parfaite.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur notre Dieu, +
    >tu as constitué saint Corneille successeur de l’apôtre Pierre
    >et tu as bien voulu l’honorer de la victoire du martyre ; *
    par son intercession, garde toujours ton troupeau bien-aimé, /
    >afin qu’il avance vers la patrie du ciel
    >par une foi intègre et une charité parfaite.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
