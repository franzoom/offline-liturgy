celebration:
  title: Sainte Crispine
  subtitle: martyre
  description: |-
    Originaire de Thagura (aujourd’hui Taoura, dans l’Est algérien), Crispine était, selon saint Augustin, une noble matrone, riche, de santé délicate. Elle fut martyrisée le 5 décembre 304 à Theveste (Tébessa) pour avoir refusé de se plier au décret impérial prescrivant de sacrifier aux dieux de l’Empire. Elle fut honorée très tôt d’un culte liturgique, comme en témoigne une chapelle tréflée de la région de Tébessa.
  commons:
  - martyr_female
  - saints-female
  color: red

oration:
- Seigneur, notre Dieu, sainte Crispine a mis au-dessus de tout la fidélité à ton Fils et tu lui as donné la gloire du martyre ; que son exemple affermisse en nous l’énergie de la foi et le courage de vivre en chrétiens.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur, notre Dieu, +
    >sainte Crispine a mis au-dessus de tout la fidélité à ton Fils
    >et tu lui as donné la gloire du martyre ; *
    que son exemple affermisse en nous l’énergie de la foi /
    >et le courage de vivre en chrétiens.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
