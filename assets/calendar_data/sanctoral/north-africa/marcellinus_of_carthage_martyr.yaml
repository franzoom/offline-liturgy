celebration:
  title: Saint Marcellin
  subtitle: martyr
  description: |-
    Marcellin, en qualité de légat impérial, devait présider avec autorité et efficacité la conférence de Carthage qui réunit, en 411, les épiscopats catholique et donatiste. Après la déroute de ces derniers, Marcellin fut impliqué dans une affaire politique. En réalité, c’est pour sa foi catholique qu’il fut décapité à Carthage, le 13 septembre 413. Ce fut un coup très dur pour saint Augustin, qui lui vouait une amitié profonde et qui avait essayé de le sauver.
  commons:
  - martyr
  color: red

oration:
- Seigneur, notre Dieu, soutenu par ta grâce et par les conseils de saint Augustin, saint Marcellin s’est efforcé de rétablir la paix dans l’Église déchirée ; accorde-nous, à son exemple, de nous mettre au service de l’unité dans la charité.

mass:
