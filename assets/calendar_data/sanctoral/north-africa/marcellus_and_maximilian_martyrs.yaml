celebration:
  title: Saints Marcel et Maximilien
  subtitle: martyrs
  description: |-
    Deux cas d’objection de conscience, mais pour motif religieux : Marcel, jeune centurion, probablement venu à la foi alors qu’il était déjà militaire, refusa de participer aux cérémonies de l’anniversaire des empereurs Dioclétien et Maximien Hercule, parce qu’elles comportaient des actes idolâtriques. Condamné à mort pour avoir « rejeté publiquement son serment de centurion et les insignes du grade dans lequel il servait », il fut exécuté à Tanger, le 30 septembre 298. Maximilien considérait le service des armes comme incompatible avec le service du Christ, à cause du danger d’idolâtrie qu’il comportait. Lors du conseil de révision, il refusa donc de recevoir la marque au nom de l’empereur, signe de son incorporation. Il fut condamné à périr par le glaive et exécuté à Tébessa, le 12 mars 295.
  commons:
  - martyrs
  color: red

oration:
- Tu as donné, Seigneur, aux saints martyrs Marcel et Maximilien le courage de sacrifier leur vie pour être fidèles à leur foi ; dans un monde qui exalte les moyens de puissance, fais de nous, à leur exemple, les témoins et les artisans de ton royaume de paix.

mass:
- massType: DAY_MASS
  collect:
