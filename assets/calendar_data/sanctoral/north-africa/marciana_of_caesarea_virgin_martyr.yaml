celebration:
  title: Sainte Marcienne
  subtitle: vierge et martyre
  description: |-
    Originaire de Rusuccuru (Taksebt, à 3 km à l’est de Tigzirt), Marcienne se retira à Césarée (Cherchell) pour y consacrer à Dieu sa virginité. Visitant un jour la ville, elle y trouva près de la porte de Tipasa une statue de Diane ; elle la brisa. La foule l’entraîna au prétoire. Après de cruelles tortures, elle fut tuée par un léopard (ive siècle).
  commons:
  - martyr_female_virgin
  - virgins
  color: red

oration:
- Dieu éternel et tout-puissant, tu as donné à sainte Marcienne de se consacrer à toi et de lutter contre les idoles ; que son exemple nous entraîne à te servir avec un cœur sans partage.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as donné à sainte Marcienne de se consacrer à toi
    et de lutter contre les idoles ; *
    que son exemple nous entraîne à te servir /
    >avec un cœur sans partage.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
