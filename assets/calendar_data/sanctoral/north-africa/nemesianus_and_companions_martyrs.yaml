celebration:
  title: Saint Némésianus et ses compagnons
  subtitle: martyrs
  description: |-
    Némésianus était évêque de Thubunae (Tobna dans le Sud constantinois). Parmi ses compagnons se trouvaient d’autres évêques, des prêtres, des diacres et des laïcs. Arrêtés à la suite de l’édit de Valérien (257), ils furent torturés et condamnés aux mines. Saint Cyprien, alors exilé de Carthage par la persécution, leur fit apporter des secours et une lettre. Leur mort se situe dans les années 258-259.
  commons:
  - martyrs
  color: red

oration:
- Dieu éternel et tout-puissant, force de ceux qui souffrent pour la foi, tu as gardé saint Némésianus et ses compagnons intrépides dans les tortures ; donne à notre amour la même fidélité, dans l’épreuve comme dans la joie.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Dieu éternel et tout-puissant,
    >force de ceux qui souffrent pour la foi, +
    tu as gardé saint Némésianus et ses compagnons
    >intrépides dans les tortures ; *
    donne à notre amour la même fidélité, /
    >dans l’épreuve comme dans la joie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
