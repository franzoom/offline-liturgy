celebration:
  title: Saint Optat
  subtitle: évêque
  description: |-
    Optat fut évêque de Milève (Mila, dans le Constantinois) pendant la deuxième moitié du ive siècle. Il ne nous est guère connu aujourd’hui que par son traité contre le donatisme, dont il donna deux éditions, l’une en 366-367, l’autre après 384. Il fut le premier à préciser les « notes » de l’Église et à définir sa « catholicité ». Il fut un des maîtres à penser de l’Afrique chrétienne. Saint Augustin le vénérait et le citait fréquemment ; saint Fulgence le comparait aux grands docteurs saint Ambroise et saint Augustin.
  commons:
  - pastors_bishop
  color: white

oration:
- Tu as mis, Seigneur, au cœur de saint Optat l’esprit de charité qui triomphe de toute division ; ne cesse pas de donner à ton Église de tels pasteurs qui la conduisent sur les chemins de l’unité, afin que le monde croie en toi, le seul vrai Dieu, et en celui que tu as envoyé, Jésus Christ.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Tu as mis, Seigneur, au cœur de saint Optat
    >l’esprit de charité qui triomphe de toute division ; *
    ne cesse pas de donner à ton Église de tels pasteurs
    >qui la conduisent sur les chemins de l’unité, /
    afin que le monde croie en toi, le seul vrai Dieu,
    >et en celui que tu as envoyé, Jésus Christ.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Purifie nos cœurs, Seigneur, par la puissance du sacrifice
    >que nous offrons en la fête de saint Optat ; *
    puissions-nous, fortifiés par ta grâce, /
    >imiter son zèle pour la foi
    >et pour l’unité de ton Église.
    Par le Christ, notre Seigneur.
  prayerAfterCommunion:
  - |-
    Nous avons reçu, Seigneur, le sacrement de l’unité ; *
    >accorde-nous d’être les fidèles serviteurs de ton Église /
    >pour l’avènement du règne de paix et d’amour de ton Fils.
    Lui qui vit et règne pour les siècles des siècles.
