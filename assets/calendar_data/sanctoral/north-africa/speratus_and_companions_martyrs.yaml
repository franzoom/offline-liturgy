celebration:
  title: Saint Spérat et ses compagnons
  subtitle: martyrs
  description: |-
    Les noms de douze martyrs de la province proconsulaire d’Afrique nous sont connus par le plus ancien document de l’hagiographie africaine : leur interrogatoire final, qui est un texte de l’époque. Ce sont les premiers martyrs en Afrique du Nord, les martyrs « scillitains ». Ils furent décapités à Carthage, le 17 juillet 180, pour avoir refusé de diviniser l’empereur.
  commons:
  - martyrs
  color: red

oration:
- Seigneur, notre Dieu, tu as choisi saint Spérat et ses compagnons pour être les premiers à répandre leur sang pour la foi, en Afrique ; accorde à ton Église, fécondée par leur sacrifice, de continuer à porter des fruits abondants de salut.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur, notre Dieu, +
    >tu as choisi saint Spérat et ses compagnons
    >pour être les premiers à répandre leur sang pour la foi, en Afrique ; *
    accorde à ton Église, fécondée par leur sacrifice, /
    >de continuer à porter des fruits abondants de salut.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    En la fête de saint Spérat et de ses compagnons,
    >nous t’offrons, Seigneur, cet unique sacrifice,
    >source et modèle de tout martyre : *
    qu’il nous garde jusqu’à la mort fidèles à te servir /
    >et inébranlables dans la confession de ton nom.
    Par le Christ, notre Seigneur.
  prayerAfterCommunion:
  - |-
    Nourris de ton eucharistie
    >et rassemblés en un seul corps dans le Christ,
    >nous te prions, Seigneur : *
    accorde-nous de n’avoir toujours qu’un cœur et qu’une âme, /
    >à l’exemple des martyrs que nous fêtons en ce jour.
    Par le Christ, notre Seigneur.
