celebration:
  title: Dédicace de la cathédrale Notre-Dame de Paris
  commons:
    - dedicace
  color: white

oration:
  - |-
    Au jour où notre Église Cathédrale te fut consacrée sous le vocable de la Sainte Vierge Marie, écoute, Seigneur, la prière de tes fidèles : donne-nous, par son intercession, de constituer un peuple saint dont le culte te rende gloire.

readings:
  patristicReading:
    - title: Discours sur la vocation de la France prononcé par le Cardinal Eugenio Pacelli à Notre-Dame de Paris le 13 juillet 1937
      subtitle: La voix de Notre-Dame
      content: |-
        Comment dire, mes Frères, tout ce qu’évoque en mon esprit, en mon âme, comme dans l’âme et l’esprit de tout catholique, je dirais même dans toute âme droite et dans tout esprit cultivé, le seul nom de Notre-Dame de Paris ! Car ici c’est l’âme même de la France, l’âme de la fille aînée de l’Église, qui parle à mon âme. Âme de la France d’aujourd’hui qui vient dire ses aspirations, ses angoisses et sa prière ; âme de la France de jadis dont la voix, remontant des profondeurs d’un passé quatorze fois séculaire, évoquant les %Gesta Dei per Francos%, parmi les épreuves aussi bien que parmi les triomphes, sonne aux heures critiques comme un chant de noble fierté et d’imperturbable espérance. Voix de Clovis et de Clotilde, voix de Charlemagne, voix de saint Louis surtout, en cette île où il semble vivre encore et qu’il a parée, en la Sainte-Chapelle, de la plus glorieuse et de la plus sainte des couronnes ; voix aussi des grands docteurs de l’Université de Paris, des maîtres dans la foi et dans la sainteté... Leurs souvenirs, leurs noms inscrits sur vos rues, en même temps qu’ils proclament la vaillance et la vertu de vos aïeux, jalonnent comme une route triomphale l’histoire d’une France qui marche et qui avance en dépit de tout, d’une France qui ne meurt pas !
        Oh ! ces voix ! j’entends leur innombrable harmonie résonner dans cette cathédrale, chef d’œuvre de votre génie et de votre amoureux labeur, qui l’ont dressée comme le monument de cette prière, de cet amour, de cette vigilance, dont je trouve le symbole parlant en cet autel où Dieu descend sous les voiles eucharistiques, en cette voûte qui nous abrite tous ensemble sous le manteau maternel de Marie, en ces tours qui semblent sonder l’horizon serein ou menaçant, gardiennes vigilantes de cette capitale. Prêtons l’oreille à la voix de Notre-Dame de Paris.
        Au milieu de la rumeur incessante de cette immense métropole, parmi l’agitation des affaires et des plaisirs, dans l’âpre tourbillon de la lutte pour la vie, témoin apitoyé des désespoirs stériles et des joies décevantes, Notre-Dame de Paris, toujours sereine en sa calme et pacifiante gravité, semble répéter sans relâche à tous ceux qui passent : %Orate Fratres%, Priez, mes Frères ; elle semble, dirai-je volontiers, être elle-même un %Orate Fratres% de pierre, une invitation perpétuelle à la prière.
      responsory: |-
        R/ Salut, Marie, pleine de grâce,
        tu es la demeure du Très-Haut.

        La splendeur brille dans la maison du Seigneur,
        la puissance et la beauté dans son sanctuaire.

        C’est ici la maison de la prière,
        ouverte à tous les peuples.
