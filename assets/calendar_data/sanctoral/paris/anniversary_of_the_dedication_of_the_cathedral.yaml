celebration:
  title: Dédicace de la cathédrale Notre-Dame de Paris
  commons:
    - dedicace_outside
    - dedicace_inside
  color: white

oration:
  - |-
    Au jour où notre Église Cathédrale te fut consacrée sous le vocable de la Sainte Vierge Marie, écoute, Seigneur, la prière de tes fidèles : donne-nous, par son intercession, de constituer un peuple saint dont le culte te rende gloire.

readings:
  patristicReading:
    - title: Discours sur la vocation de la France prononcé par le Cardinal Eugenio Pacelli à Notre-Dame de Paris le 13 juillet 1937
      subtitle: La voix de Notre-Dame
      content: |-
        Comment dire, mes Frères, tout ce qu’évoque en mon esprit, en mon âme, comme dans l’âme et l’esprit de tout catholique, je dirais même dans toute âme droite et dans tout esprit cultivé, le seul nom de Notre-Dame de Paris ! Car ici c’est l’âme même de la France, l’âme de la fille aînée de l’Église, qui parle à mon âme. Âme de la France d’aujourd’hui qui vient dire ses aspirations, ses angoisses et sa prière ; âme de la France de jadis dont la voix, remontant des profondeurs d’un passé quatorze fois séculaire, évoquant les %Gesta Dei per Francos%, parmi les épreuves aussi bien que parmi les triomphes, sonne aux heures critiques comme un chant de noble fierté et d’imperturbable espérance. Voix de Clovis et de Clotilde, voix de Charlemagne, voix de saint Louis surtout, en cette île où il semble vivre encore et qu’il a parée, en la Sainte-Chapelle, de la plus glorieuse et de la plus sainte des couronnes ; voix aussi des grands docteurs de l’Université de Paris, des maîtres dans la foi et dans la sainteté... Leurs souvenirs, leurs noms inscrits sur vos rues, en même temps qu’ils proclament la vaillance et la vertu de vos aïeux, jalonnent comme une route triomphale l’histoire d’une France qui marche et qui avance en dépit de tout, d’une France qui ne meurt pas !
        Oh ! ces voix ! j’entends leur innombrable harmonie résonner dans cette cathédrale, chef d’œuvre de votre génie et de votre amoureux labeur, qui l’ont dressée comme le monument de cette prière, de cet amour, de cette vigilance, dont je trouve le symbole parlant en cet autel où Dieu descend sous les voiles eucharistiques, en cette voûte qui nous abrite tous ensemble sous le manteau maternel de Marie, en ces tours qui semblent sonder l’horizon serein ou menaçant, gardiennes vigilantes de cette capitale. Prêtons l’oreille à la voix de Notre-Dame de Paris.
        Au milieu de la rumeur incessante de cette immense métropole, parmi l’agitation des affaires et des plaisirs, dans l’âpre tourbillon de la lutte pour la vie, témoin apitoyé des désespoirs stériles et des joies décevantes, Notre-Dame de Paris, toujours sereine en sa calme et pacifiante gravité, semble répéter sans relâche à tous ceux qui passent : %Orate Fratres%, Priez, mes Frères ; elle semble, dirai-je volontiers, être elle-même un %Orate Fratres% de pierre, une invitation perpétuelle à la prière.
      responsory: |-
        R/ Salut, Marie, pleine de grâce,
        tu es la demeure du Très-Haut.

        La splendeur brille dans la maison du Seigneur,
        la puissance et la beauté dans son sanctuaire.

        C’est ici la maison de la prière,
        ouverte à tous les peuples.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Levons les yeux vers la Cité sainte, la demeure de Dieu parmi les hommes ;
      >le Christ l’illumine de sa gloire,
      >ses portes sont ouvertes à tous.
      Vers elle s’achemine le peuple des rachetés.
  collect:
  - |-
    Au jour où notre Église Cathédrale te fut consacrée
    >sous le vocable de la Sainte Vierge Marie,
    écoute, Seigneur, la prière de tes fidèles :
    >donne-nous, par son intercession,
    >de constituer un peuple saint dont le culte te rende gloire.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 2, 4-9
      headline: |-
        « Comme pierres vivantes, entrez dans la construction de la demeure spirituelle »
      content: |-
        Frères,
        approchez-vous du Seigneur Jésus :
        >il est la pierre vivante
        >rejetée par les hommes,
        mais choisie et précieuse devant Dieu.
        Vous aussi, comme pierres vivantes,
        >entrez dans la construction de la demeure spirituelle,
        pour devenir le sacerdoce saint
        et présenter des sacrifices spirituels,
        >agréables à Dieu, par Jésus Christ.
        En effet, il y a ceci dans l’Écriture :
        >Je vais poser en Sion une pierre angulaire,
        >une pierre choisie, précieuse ;
        >celui qui met en elle sa foi
        >ne saurait connaître la honte.
        Ainsi donc, honneur à vous les croyants,
        mais, pour ceux qui refusent de croire, il est écrit :
        >La pierre qu’ont rejetée les bâtisseurs
        >est devenue la pierre d’angle,
        >une pierre d’achoppement,
        >un rocher sur lequel on trébuche.
        Ils achoppent, ceux qui refusent d’obéir à la Parole,
        >et c’est bien ce qui devait leur arriver.
        Mais vous, vous êtes une descendance choisie,
        >un sacerdoce royal,
        >une nation sainte,
        >un peuple destiné au salut,
        pour que vous annonciez les merveilles
        >de celui qui vous a appelés des ténèbres
        >à son admirable lumière.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 83 (84), 3-6a.8a.11c-d
      refAbbr: cf. 83, 5a
      chorus:
      - chorusRef: cf. 83, 5a
        content: |-
          Heureux les habitants de ta maison, Seigneur !
      content: |-
        Mon âme s’épuise à désirer
        les parvis du Seigneur ;
        mon cœur et ma chair sont un cri
        vers le Dieu vivant !

        L’oiseau lui-même s’est trouvé une maison,
        et l’hirondelle, un nid pour abriter sa couvée :
        tes autels, Seigneur de l’univers,
        mon Roi et mon Dieu !

        Heureux les habitants de ta maison :
        ils pourront te chanter encore !
        Heureux les hommes dont tu es la force :
        ils vont de hauteur en hauteur.

        J’ai choisi de me tenir sur le seuil,
        dans la maison de mon Dieu,
        plutôt que d’habiter
        parmi les infidèles.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 22-30
      headline: |-
        « Le Père et moi, nous sommes UN »
      acclamationAntiphon: |-
        Mes brebis écoutent ma voix, dit le Seigneur ;
        moi, je les connais, et elles me suivent.
      content: |-
        On célébrait la fête de la dédicace du Temple à Jérusalem.
        C’était l’hiver.
        Jésus allait et venait dans le Temple,
        sous la colonnade de Salomon.
        Les Juifs firent cercle autour de lui ;
        ils lui disaient :
        « Combien de temps vas-tu nous tenir en haleine ?
        Si c’est toi le Christ, dis-le nous ouvertement ! »
        Jésus leur répondit :
        « Je vous l’ai dit, et vous ne croyez pas.
        Les œuvres que je fais, moi, au nom de mon Père,
        voilà ce qui me rend témoignage.
        Mais vous, vous ne croyez pas,
        parce que vous n’êtes pas de mes brebis.
        Mes brebis écoutent ma voix ;
        moi, je les connais, et elles me suivent.
        Je leur donne la vie éternelle :
        jamais elles ne périront,
        et personne ne les arrachera de ma main.
        Mon Père, qui me les a données, est plus grand que tout,
        et personne ne peut les arracher de la main du Père.
        Le Père et moi, nous sommes UN. »
  offeringPrayer:
  - |-
    Tandis que nous rappelons devant toi, Seigneur,
    le jour où tu as fait de notre église cathédrale
    >le lieu de ta gloire et de ta sainteté,
    nous te prions de nous transformer nous-mêmes
    >en offrandes qui te soient agréables.
  prefaceList:
  - notre_dame_de_paris_dedication
  communionAntiphon:
  - biblicalReference: cf. 1 Co 3, 16-17
    content: |-
      Vous êtes un sanctuaire de Dieu,
      >et l’Esprit de Dieu habite en vous.
      Le sanctuaire de Dieu est saint,
      >et ce sanctuaire, c’est vous.
  prayerAfterCommunion:
  - |-
    Tu as voulu, Seigneur, que ton Église de la terre
    soit pour nous l’annonce de la Jérusalem céleste ;
    >accorde-nous, par cette communion,
    d’être ici-bas le temple de ta grâce
    >et d’entrer un jour, près de la sainte Vierge Marie,
    >dans la demeure de ta gloire.
