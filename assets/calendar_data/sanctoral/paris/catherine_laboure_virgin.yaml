celebration:
  title: Sainte Catherine Labouré
  subtitle: vierge
  commons:
    - virgins
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Sainte Catherine Labouré a vécu cachée aux yeux des hommes,
      >mais elle avait trouvé grâce devant le Seigneur
      >car elle appartenait à la race de ceux qui cherchent Dieu.
  collect:
  - |-
    Dieu, ami des humbles,
    tu as fait cheminer sainte Catherine à la suite de ton Fils,
    >suscitant chez elle un amour intense de la Vierge Marie
    >et un dévouement singulier envers les pauvres :
    à son intercession, fais-nous progresser dans l’esprit des Béatitudes,
    >les yeux fixés sur Marie
    >et attentifs à l’appel des déshérités.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 3, 17-24
      headline: |-
        « Plus tu es grand, plus il faut t’abaisser : tu trouveras grâce devant le Seigneur »
      content: |-
        Mon fils, accomplis toute chose dans l’humilité,
        >et tu seras aimé plus qu’un bienfaiteur.
        Plus tu es grand, plus il faut t’abaisser :
        >tu trouveras grâce devant le Seigneur.
        Beaucoup sont haut placés et glorieux,
        >mais c’est aux humbles que le Seigneur révèle ses secrets.
        Grande est la puissance du Seigneur,
        >et les humbles lui rendent gloire.
        Ne cherche pas ce qui est trop difficile pour toi,
        >ne scrute pas ce qui est au-dessus de tes forces.
        Médite ce qu’on t’a prescrit :
        >tu n’as pas à t’occuper des choses cachées.
        Ne sois pas curieux de ce qui te dépasse :
        >déjà ce qu’on t’a enseigné est au-delà de l’esprit humain.
        Leur présomption a égaré bien des gens,
        >leur manque de jugement a fait dévier leurs pensées.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130, 1-3
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: |-
        « Venez à moi, vous tous qui peinez »
      content: |-
        En ce temps-là, Jésus prit la parole et dit : « Père, Seigneur du ciel et de la terre, je proclame ta louange : ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits. Oui, Père, tu l’as voulu ainsi dans ta bienveillance. Tout m’a été remis par mon Père ; personne ne connaît le Fils, sinon le Père, et personne ne connaît le Père, sinon le Fils, et celui à qui le Fils veut le révéler.
        Venez à moi, vous tous qui peinez sous le poids du fardeau, et moi, je vous procurerai le repos. Prenez sur vous mon joug, devenez mes disciples, car je suis doux et humble de cœur, et vous trouverez le repos pour votre âme. Oui, mon joug est facile à porter, et mon fardeau, léger. »
  offeringPrayer:
  - |-
    En reconnaissant les merveilles que tu as accomplies, Seigneur,
    >dans l’âme de sainte Catherine,
    nous te supplions humblement :
    >toi qui aimais sa vie tout imprégnée de l’Évangile,
    >accepte l’hommage de notre liturgie.
  prayerAfterCommunion:
  - |-
    Que cette eucharistie, Dieu tout-puissant,
    nous apporte lumière et ferveur
    >en cette fête de sainte Catherine.
    Que nos cœurs brûlent toujours du désir de la sainteté
    >et que notre vie se passe à faire le bien.
