celebration:
  title: Saint Denis, évêque, et ses compagnons
  subtitle: évêque et martyr, patron du diocèse de Paris
  description: Denis, le premier évêque de Paris, subit le martyre vers le milieu du III^e siècle. Son corps fut inhumé au nord de la cité. Vers 495, sainte Geneviève fit construire une basilique sur son tombeau. La Passion de saint Denis lui attribue deux compagnons, Éleuthère et Rustique.
  commons:
    - martyrs
  color: red

invitatory:
  antiphon:
    - Le Seigneur, le roi des martyrs, venez adorons-le.

oration:
  - |-
    Dieu de miséricorde, par la prédication de l’évêque saint Denis tu as appelé nos pères à la foi : accorde-nous, à sa prière, de marcher dans la vérité de l’évangile afin de parvenir jusqu’à la splendeur de ta gloire.

firstVespers:
  evangelicAntiphon:
    common:
      - Le Seigneur envoya Denis à un peuple qui n’avait pas entendu parler de lui, à des hommes qui n’avaient pas vu sa gloire.
  intercession:
    content: |-
      Au soir de la fête de saint Denis, présenton au Seigneur la prière de l’Église qu’il a plantée dans son sang.

      R/ Seigneur, nous t’en prions humblement.

      Pour le peuple de Dieu qui chemine en Île-de-France, qu’il soit messager de la Bonne Nouvelle : Jésus Christ, l’espérance de la gloire.

      R/ Seigneur, nous t’en prions humblement.

      Pour notre évêque, pour les prêtres et les diacres, pour tous ceux qui se consacrent au service de leurs frères : qu’ils soient de vrais témoins de l’Esprit.

      R/ Seigneur, nous t’en prions humblement.

      Pour les pères et mères de famille, pour les jeunes : qu’ils vivent de la foi reçue de saint Denis, et qu’ils la transmettent avec joie.

      R/ Seigneur, nous t’en prions humblement.

      Pour les malades, pour tous ceux qui souffrent : qu’ils entrent avec courage dans la Pâque du Seigneur, lumière et vie par-delà la croix.

      R/ Seigneur, nous t’en prions humblement.

readings:
  patristicReading:
    - title: Lettre de Saint Cyprien, évêque et martyr, aux martyrs et confesseurs
      subtitle: Ce combat qui est le sien, le Christ y était présent
      content: |-
        (Epist. 10,2,3 ; éd. Bayard, Paris, 1925, pp. 24-25.)
        Comment proclamer vos louanges, frères pleins de courage ? La vaillance de votre cœur, la constance de votre foi, quel éloge vais-je leur décerner ? Vous avez enduré la plus rude des tortures, jusqu’à ce qu’elle s’achève dans la gloire ; vous n’avez pas reculé devant les supplices : ce sont plutôt les supplices qui ont reculé devant vous. Les tourments ne pouvaient mettre fin à vos souffrances : c’est la couronne qui les a terminées. L’acharnement du bourreau s’est longtemps prolongé, non pas pour abattre une foi qui était inébranlable, mais pour envoyer plus rapidement au Seigneur Ies hommes de Dieu .
        La foule des assistants a vu avec étonnement ce combat divin et spirituel, cette bataille du Christ ; elle a vu les serviteurs de celui-ci tenir bon avec une parole indomptable, une âme intacte, un courage divin ; ils sont démunis des armes du monde, mais ces croyants ont l’armure de la foi. Torturés, ils ont triomphé de ceux qui les torturaient ; leurs membres frappés et déchirés ont vaincu les ongles de fer qui les frappaient et les déchiraient.
        Cette foi inexpugnable, les coups redoublés n’ont pu la dominer, et pourtant ce que l’on torturait chez les serviteurs de Dieu, tant leurs corps étaient disloqués, ce n’étaient plus des membres, mais des blessures. Le sang coulait, ce sang qui devait éteindre l’incendie de la persécution, qui devait apaiser par son ruissellement glorieux les flammes et les feux de l’enfer. Quel beau spectacle donné par notre Seigneur, combien sublime, combien grand, combien agréable aux yeux de Dieu, par la fidélité au serment et la générosité de son soldat Comme il est écrit dans le psaume où le Saint-Esprit nous instruit et nous exhorte tout ensemble : Elle est précieuse aux yeux du Seigneur ; la mort de ses amis. Oui, elle est précieuse, cette mort qui achète l’immortalité au prix de son sang, qui reçoit la couronne, pour la perfection de son courage.
        Combien le Christ, alors, fut heureux, combien il prit plaisir à combattre et à vaincre en la personne de tels serviteurs, lui qui protège leur foi et qui accorde à ceux qui croient dans la mesure même où chacun croit qu’il peut recevoir ! Ce combat qui est le sien, il y était présent : ces lutteurs, ces défenseurs de son nom, il les a soutenus, fortifiés, encouragés. Lui qui, pour nous, a vaincu la mort une fois pour toutes, il continue en nous à la vaincre sans cesse.
      responsory: |-
        R/ L’éclat de la confession du chef rejaillit sur tout le peuple.

        Ce que dit un évêque sous l’inspiration de Dieu,
        lorsqu’il confesse sa foi, il le proclame au nom de tous.

        L’Église est le peuple uni à son évêque,
        le troupeau attaché à son pasteur.
  verse: |-
    V/ Annoncez la gloire du Seigneur aux nations,
    à tous les peuples ses merveilles.
  biblicalReading:
    - title: |-
        Lecture : Comme Paul à Athènes, Denis vint annoncer à Lutèce le Christ ressuscité
      ref: Ac 17, 22-34
      content: |-
        Alors Paul, debout au milieu de l’Aréopage, fit ce discours : « Athéniens, je peux observer que vous êtes, en toutes choses, des hommes particulièrement religieux. En effet, en me promenant et en observant vos monuments sacrés, j’ai même trouvé un autel avec cette inscription : “Au dieu inconnu.” Or, ce que vous vénérez sans le connaître, voilà ce que, moi, je viens vous annoncer. Le Dieu qui a fait le monde et tout ce qu’il contient, lui qui est Seigneur du ciel et de la terre, n’habite pas des sanctuaires faits de main d’homme ; il n’est pas non plus servi par des mains humaines, comme s’il avait besoin de quoi que ce soit, lui qui donne à tous la vie, le souffle et tout le nécessaire.
        À partir d’un seul homme, il a fait tous les peuples pour qu’ils habitent sur toute la surface de la terre, fixant les moments de leur histoire et les limites de leur habitat ; Dieu les a faits pour qu’ils le cherchent et, si possible, l’atteignent et le trouvent, lui qui, en fait, n’est pas loin de chacun de nous. Car c’est en lui que nous avons la vie, le mouvement et l’être. Ainsi l’ont également dit certains de vos poètes :
        %Nous sommes de sa descendance.%
        Si donc nous sommes de la descendance de Dieu, nous ne devons pas penser que la divinité est pareille à une statue d’or, d’argent ou de pierre sculptée par l’art et l’imagination de l’homme. Et voici que Dieu, sans tenir compte des temps où les hommes l’ont ignoré, leur enjoint maintenant de se convertir, tous et partout. En effet, il a fixé le jour où il va juger la terre avec justice, par un homme qu’il a établi pour cela, quand il l’a accrédité auprès de tous en le ressuscitant d’entre les morts. »
        Quand ils entendirent parler de résurrection des morts, les uns se moquaient, et les autres déclarèrent : « Là-dessus nous t’écouterons une autre fois. »
        C’est ainsi que Paul, se retirant du milieu d’eux, s’en alla. Cependant quelques hommes s’attachèrent à lui et devinrent croyants. Parmi eux, il y avait Denys, membre de l’Aréopage, et une femme nommée Damaris, ainsi que d’autres avec eux.
      responsory: |-
        R/ Le Seigneur lui dit :
        « Parle, ne reste pas muet. Je suis avec toi, car dans cette ville j’ai à moi un peuple nombreux. »

        « Ma parole ne me reviendra pas sans résultat,
        mais elle fera ce que je veux et se répandra ».

morning:
  hymn:
    - puissance-et-gloire-de-l-esprit
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - |-
          Denis entendit la voix du Seigneur qui disait : « Qui enverrai-je ? » Il répondit : « Me voici, envoie-moi. »
    - psalm: OT_41
      antiphon:
        - Il obéit avec confiance et se rendit dans la ville qu’il devait recevoir en héritage.
    - psalm: PSALM_149
      antiphon:
        - Denis se leva, alla selon la parole du Seigneur, et pénétra dans la cité des Parisiens.
  reading:
    biblicalReference: He 13,7
    content: |-
      Souvenez-vous de ceux qui vous ont dirigés : ils vous ont annoncé la parole de Dieu. Méditez sur l’aboutissement de la vie qu’ils ont menée, et imitez leur foi.
  responsory: |-
    R/ Ma force et mon chant, c’est le Seigneur.
    * Il s’est fait mon sauveur.
    V/ Non, je ne mourrai pas, je vivrai
    et publierai l’œuvre de Dieu. *
    Gloire au Père. R/
  evangelicAntiphon:
    common:
      - C’est aujourd’hui la fête de saint Denis. Joie pour celui qui planta l’arbre de vie sur les bords de la Seine.
  intercession:
    content: |-
      Bénissons le Seigneur pour la fécondité du martyre de saint Denis, notre père dans la foi.

      R/ Béni sois-tu, Seigneur.

      Béni sois-tu, Seigneur, qui as voulu rendre témoignage au Père dans les souffrances et la mort de l’évêque saint Denis.

      R/ Béni sois-tu, Seigneur.

      Béni sois-tu, toi qui as fait du sang de saint Denis et de ses compagnons une semence de chrétiens.

      R/ Béni sois-tu, Seigneur.

      Béni sois-tu pour toutes les générations qui, depuis lors, nous ont transmis la foi en vivant de ton Évangile.

      R/ Béni sois-tu, Seigneur.

      Béni sois-tu pour les témoins que tu as suscités dans notre Église : messagers de ta parole et serviteurs de leurs frères, chrétiens engagés dans le combat pour la justice et la vérité.

      R/ Béni sois-tu, Seigneur.

middleOfDay:
  tierce:
    antiphon: Vous serez mes témoins, dit le Seigneur, jusqu’aux extrémités de la terre.
    reading:
      biblicalReference: 1Th 1,5
      content: Frères bien-aimés de Dieu, notre annonce de l’Évangile chez vous n’a pas été simple parole, mais puissance, action de l’Esprit-Saint, certitude absolue.
    responsory: |-
      V/ Les justes jubilent devant la face de Dieu.
      Ils exultent de joie.
  sexte:
    antiphon: Vous serez mes témoins, dit le Seigneur, jusqu’aux extrémités de la terre.
    reading:
      biblicalReference: 1Th 4,1-2
      content: Frères, vous avez appris de nous comment il faut vous conduire pour plaire à Dieu ; et c’est ainsi que vous vous conduisez déjà. Faites donc de nouveaux progrès, nous vous en prions, frères, nous vous le demandons dans le Seigneur Jésus.
    responsory: |-
      V/ Les justes jubilent devant la face de Dieu.
      Ils exultent de joie.
  none:
    antiphon: Vous serez mes témoins, dit le Seigneur, jusqu’aux extrémités de la terre.
    reading:
      biblicalReference: 1Co 9,2
      content: Frères, si pour d’autres je ne suis pas apôtre, pour vous du moins je le suis ; car c’est vous qui, dans le Seigneur, êtes le sceau de mon apostolat.
    responsory: |-
      V/ Les justes jubilent devant la face de Dieu.
      Ils exultent de joie.

vespers:
  hymn:
    - puissance-et-gloire-de-l-esprit
  psalmody:
    - psalm: PSALM_114
      antiphon:
        - Vainqueur de la mort, Denis marche devant le Seigneur sur la terre des vivants.
    - psalm: PSALM_115
      antiphon:
        - Pour avoir bu à la coupe des souffrances du Christ, Denis a pris place au festin des noces de l’Agneau.
    - psalm: NT_9
      antiphon:
        - Ferme dans la foi, Denis confessa le nom de Jésus Christ, dont le sang l’avait racheté.
  reading:
    biblicalReference: Ap 7,14-15
    content: Voici ceux qui viennent de la grande épreuve ; ils ont lavé leurs vêtements, ils les ont purifiés dans le sang de l’Agneau. C’est pourquoi ils se tiennent devant le trône de Dieu, et le servent jour et nuit dans son temple.
  responsory: |-
    R/ Une lumière sans déclin, Seigneur, éclairera tes saints,
    * Et tu essuieras toute larme de leurs yeux.
    V/ Ils n’auront plus faim, ils n’auront plus soif,
    la brûlure du soleil ne les accablera plus. *
    Gloire au Père. R/
  evangelicAntiphon:
    common:
      - Aujourd’hui l’évêque Denis a couronné sa vie par le martyre, il possède désormais pour l’éternité le Dieu qu’il aima de tout son cœur.
  intercession:
    content: |-
      Au soir de la fête de saint Denis, présenton au Seigneur la prière de l’Église qu’il a plantée dans son sang.

      R/ Seigneur, nous t’en prions humblement.

      Pour le peuple de Dieu qui chemine en Île-de-France, qu’il soit messager de la Bonne Nouvelle : Jésus Christ, l’espérance de la gloire.

      R/ Seigneur, nous t’en prions humblement.

      Pour notre évêque, pour les prêtres et les diacres, pour tous ceux qui se consacrent au service de leurs frères : qu’ils soient de vrais témoins de l’Esprit.

      R/ Seigneur, nous t’en prions humblement.

      Pour les pères et mères de famille, pour les jeunes : qu’ils vivent de la foi reçue de saint Denis, et qu’ils la transmettent avec joie.

      R/ Seigneur, nous t’en prions humblement.

      Pour les malades, pour tous ceux qui souffrent : qu’ils entrent avec courage dans la Pâque du Seigneur, lumière et vie par-delà la croix.

      R/ Seigneur, nous t’en prions humblement.

mass:
  - massType: DAY_MASS
    entranceAntiphon: null
    collect:
      - |-
        Seigneur Dieu, +
        >tu as envoyé le bienheureux Denis et ses compagnons
        >annoncer aux nations ta gloire,
        >et tu les as gardés inébranlables dans la souffrance ; *
        nous t’en prions, accorde-nous la grâce de les imiter
        >en sachant mépriser la faveur du monde, /
        >sans jamais craindre ses attaques.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit,
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: 2Co 6, 4-10
            headline: « On nous croit mourants, et nous sommes bien vivants »
            content: |-
              Frères,
              en tout, nous nous recommandons nous-mêmes
              comme des ministres de Dieu :
              par beaucoup d’endurance,
              dans les détresses, les difficultés, les angoisses,
              les coups, la prison, les émeutes,
              les fatigues, le manque de sommeil et de nourriture,
              par la chasteté, la connaissance,
              la patience et la bonté,
              la sainteté de l’esprit et la sincérité de l’amour,
              par une parole de vérité,
              par une puissance qui vient de Dieu ;
              nous nous présentons avec les armes de la justice
              pour l’attaque et la défense,
              dans la gloire et le mépris,
              dans la mauvaise et la bonne réputation.
              On nous traite d’imposteurs, et nous disons la vérité ;
              on nous prend pour des inconnus, et nous sommes très connus ;
              on nous croit mourants, et nous sommes bien vivants
              on nous punit, et nous ne sommes pas mis à mort ;
              on nous croit tristes, et nous sommes toujours joyeux ;
              pauvres, et nous faisons tant de riches ;
              démunis de tout, et nous possédons tout.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 125 (126), 1-2ab, 2cd-3, 4-5, 6
            refAbbr: cf. 125, 5
            chorus:
              - chorusRef: cf. 125, 5
                content: |-
                  Ceux qui sèment dans les larmes
                  moissonnent dans la joie.
            content: |-
              Quand le Seigneur ramena les captifs à Sion,
              nous étions comme en rêve !
              Alors notre bouche était pleine de rires,
              nous poussions des cris de joie.

              Alors on disait parmi les nations :
              « Quelles merveilles fait pour eux le Seigneur ! »
              Quelles merveilles le Seigneur fit pour nous :
              nous étions en grande fête !

              Ramène, Seigneur, nos captifs,
              comme les torrents au désert.
              Qui sème dans les larmes
              moissonne dans la joie.

              Il s’en va, il s’en va en pleurant,
              il jette la semence ;
              il s’en vient, il s’en vient dans la joie,
              il rapporte les gerbes.
      - partType: GOSPEL
        partContents:
          - biblicalRef: Mt 5, 13-16
            headline: « Vous êtes la lumière du monde »
            acclamationAntiphon: |-
              Moi, je suis la lumière du monde, dit le Seigneur.
              Celui qui me suit aura la lumière de la vie.
            content: |-
              En ce temps-là,
              Jésus disait à ses disciples :
              « Vous êtes le sel de la terre.
              Mais si le sel devient fade,
              comment lui rendre de la saveur ?
              Il ne vaut plus rien :
              on le jette dehors et il est piétiné par les gens.
              Vous êtes la lumière du monde.
              Une ville située sur une montagne
              ne peut être cachée.
              Et l’on n’allume pas une lampe
              pour la mettre sous le boisseau ;
              on la met sur le lampadaire,
              et elle brille pour tous ceux qui sont dans la maison.
              De même, que votre lumière brille devant les hommes :
              alors, voyant ce que vous faites de bien,
              ils rendront gloire à votre Père qui est aux cieux. »
    offeringPrayer: null
    communionAntiphon: null
    prayerAfterCommunion: null
