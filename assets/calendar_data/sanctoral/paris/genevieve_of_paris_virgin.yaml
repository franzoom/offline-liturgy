celebration:
  title: Sainte Geneviève, patronne du diocèse de Paris
  subtitle: vierge
  description: Née à Nanterre vers 420, Geneviève menait à Paris la vie retirée des vierges consacrées, dans le jeûne, la prière et le silence. En 451, elle réconforta les Parisiens effrayés par l’avance d’Attila. Plus tard, elle devait ravitailler Paris menacé de famine. À sa mort, vers 500, on l’inhuma sur la colline devenue depuis lors la Montagne‑Sainte‑Geneviève.
  commons:
    - virgins
  color: white
  location: paris

invitatory:
  antiphon:
    - Aujourd’hui Geneviève est entrée dans la joie de son Maître, acclamons le Seigneur.

oration:
  - Répands sur nous, Seigneur, l’esprit d’intelligence et d’amour dont tu as rempli sainte Geneviève, pour qu’attentifs à te servir, et cherchant à lui ressembler, nous sachions te plaire par notre foi et toute notre vie.

firstVespers:
  reading:
    biblicalReference: Si 51,13-15
    content: Dès ma jeunesse aux yeux de tous j’ai cherché la Sagesse dans ma prière. Dans le Temple je priais pour la recevoir et jusqu’au bout je la rechercherai. Depuis qu’elle était en fleur comme le raisin qui mûrit, elle a été la joie de mon cœur.
  responsory: |-
    R/ J’ai marché tout droit vers elle.
    * C’est dans la pureté que je l’ai trouvée.
    V/ Mon pied s’est avancé sur le droit chemin ;
    depuis ma jeunesse je marchais sur ses traces. *
    Gloire au Père. R/
  evangelicAntiphon:
    common:
      - Geneviève craignait Dieu, elle faisait d’abondantes aumônes et priait sans cesse.
  hymn:
    - genevieve-attentive-a-la-voix
  psalmody:
    - psalm: PSALM_112
      antiphon:
        - Le Seigneur a mis au cœur de Geneviève la joie d’une mère entourée de ses fils.
    - psalm: PSALM_147
      antiphon:
        - Au nom du Seigneur, Geneviève rassasia le peuple de la fleur du froment.
    - psalm: NT_4
      antiphon:
        - Le Seigneur a comblé sa servante Geneviève des bénédictions de l’Esprit dans le Christ.
  intercession:
    content: |-
      Au soir de la fête de sainte Geneviève, présentons au Seigneur la prière du peuple qu’elle a servi avec tant d’amour.

      R/ Seigneur, écoute-nous ; Seigneur, exauce-nous.

      Nous te prions pour ton Église qui chemine en Île-de-France qu’à la suite de Geneviève elle vive avec courage et porte toujours le souci des malheureux.

      Nous te prions pour cette ville : que la protection de Geneviève continue à l’envelopper aux jours d’épreuve comme dans la prospérité.

      Nous te prions pour notre évêque, pour les prêtres, pour ceux et celles qui, à l’exemple de Geneviève, vivent dans le célibat consacré, pour tous les chrétiens : qu’ils répandent ta lumière et soient des témoins de ta tendresse.

      Nous te prions pour ceux qui connaissent l’angoisse du lendemain, pour ceux qui manquent du nécessaire : que l’amour de leurs frères ne leur fasse jamais défaut.

readings:
  hymn:
    - quand-le-jour-est-obscur
  biblicalReading:
    - title: Lecture du livre de Judith
      ref: Jdt 15, 14 ; 16,1-5.13-14
      content: |-
        Au milieu de tout Israël, Judith entonna cette action de grâce, louange reprise par tout le peuple.
        Chantez pour mon Dieu sur les tambourins. Jouez pour le Seigneur sur les cymbales. Joignez pour lui l’hymne à la louange. Exaltez-le ! Invoquez son nom !
        Le Seigneur est un Dieu briseur de guerres ; son nom est « Le Seigneur ». Il a établi son camp au milieu de son peuple pour m’arracher à la main de mes persécuteurs. Assour est venu des montagnes du nord, son armée est venue par dizaines de milliers ; leur multitude obstruait les torrents, leurs chevaux recouvraient les collines. Il voulait incendier mon territoire, faire périr mes jeunes gens par l’épée, jeter à terre mes nourrissons, livrer au rapt mes tout-petits et m’enlever mes jeunes filles.
        Mais le Seigneur souverain de l’univers les a confondus par la main d’une femme.
        Je chanterai pour mon Dieu un chant nouveau. Seigneur, tu es grand, tu es glorieux, admirable de force, invincible. Que ta création, tout entière, te serve ! Tu dis, et elle existe. Tu envoies ton souffle : elle est créée. Nul ne résiste à ta voix.
      responsory: |-
        R/ Tu es l’honneur de notre peuple.

        Bénie sois-tu, Geneviève, par le Dieu Très-Haut

        Jamais l’espérance dont tu as fait preuve
        ne s’effacera du souvenir des hommes.

        Tous la bénirent d’une seule voix.
  patristicReading:
    - title: De la vie de sainte Geneviève
      subtitle: La gardienne de Paris
      content: |-
        En l’année 451, lorsque les Parisiens apprirent qu’Attila, le roi des Huns, s’approchait, dévastant tout sur son passage, pris de panique, ils voulurent fuir avec leurs richesses en des lieux plus sûrs. Geneviève recommanda à leurs femmes d’imiter plutôt l’exemple de Judith et d’Esther et d’obtenir, à force de jeûnes, de prières et de veilles, l’éloignement du danger. Elles se laissèrent persuader et passèrent des jours et des nuits au Baptistère, dans les veilles, le jeûne et l’oraison. Quant aux maris, Geneviève leur répétait qu’ils ne gagneraient rien à fuir, les lieux où ils comptaient se réfugier devant être sûrement dévastés, tandis que Paris serait, au contraire, préservé.
        Les hommes s’élevèrent contre cette fausse prophétesse qui, disaient-ils, prétendait, avec ses mensonges, les retenir dans une ville promise à la ruine et les empêcher de sauver leurs personnes et leurs biens. Déjà ils s’apprêtaient à la lapider ou à la jeter à l’eau, quand survint l’archidiacre d’Auxerre. Celui-ci avait entendu son défunt évêque rendre témoignage de Geneviève. Se mêlant aux réunions où l’on discutait de la façon dont on se déferait d’elle, il apostropha ces furieux : « Citoyens, leur dit-il, n’allez pas mettre à mort celle dont saint Germain a dit que Dieu l’avait élue dès le sein de sa mère », et il leur montrait les eulogies que le pontife l’avait chargé de lui porter. Les Parisiens craignirent de provoquer la colère de Dieu en faisant mourir l’amie de saint Germain, et ils renoncèrent à leur dessein.
        Ce qui advint ensuite fit voir que la parole de l’Apôtre est toujours vraie : « Le Seigneur est fidèle à ceux qui mettent en lui leur confiance ; il est leur sauvegarde et les préserve de tout mal. »
        On se plaît à célébrer les glorieux exploits d’un saint Martin et d’un saint Aignan ; le premier qui, près de Worms, se présentant sans armes à deux armées prêtes à s’entre-détruire, parvint à imposer la paix ; le second qui, à Orléans, obtint que le général Aétius chassât les Huns de la ville. Mais ne mérite-t-elle pas autant qu’eux d’être glorifiée, celle qui, par ses prières, éloigna de Paris l’armée barbare et sauva la ville d’une destruction certaine ?...
        Plus de trente ans après, pendant les cinq ans que Paris fut assiégée par les Francs, la disette fut telle que les habitants mouraient de faim. Ce fut alors que Geneviève décida d’organiser un convoi fluvial, pour aller chercher des vivres à Arcis-sur-Aube...
        De nombreux dangers se présentèrent au retour, où le vent poussa les embarcations sur des arbres et des récifs. Elles étaient déjà couchées sur le flanc, s’emplissant d’eau, près de couler au fond. Dans ce nouveau péril, Geneviève leva les bras vers le ciel, appelant le Christ à son aide. Notre Seigneur exauça sa prière, et les onze bateaux qu’elle ramenait chargés de vivres furent sauvés...
        Dès sa rentrée à Paris, Geneviève se mit à ravitailler la population. Elle donnait à chacun ce qu’elle pouvait ; mais les meilleures portions allaient à ceux qui avaient le plus souffert de la faim.
        À tel point que, souvent, lorsque les jeunes filles (qui étaient ses filles spirituelles et ses collaboratrices) arrivaient au four, elles s’étonnaient de ne pas y retrouver une partie du pain qu’elles y avaient déposé. La plus grande partie des miches enfournées avait disparu. Mais le mystère s’éclaircissait lorsqu’elles rencontraient, par la ville, de nombreux pauvres emportant leurs miches encore chaudes et célébrant la bonté de sainte Geneviève.
      responsory: |-
        R/ Exauce les prières de tes serviteurs.

        Seigneur, Dieu grand et admirable,
        qui as donné le salut par la main d’une femme,

        Tu es béni, Seigneur,
        toi qui n’abandonnes pas ceux qui comptent sur toi,
        et qui humilies ceux qui se vantent de leur propre force.

morning:
  hymn:
    - quand-le-jour-est-obscur
  reading:
    biblicalReference: Is 61, 10
    content: Je tressaille de joie dans le Seigneur, mon âme exulte en mon Dieu. Car il m’a enveloppée du manteau de l’innocence, et m’a fait revêtir les vêtements du salut, comme une épouse parée de ses bijoux.
  responsory: |-
    R/ Mon cœur bondit de joie pour le Seigneur :
    * Oui, j’exulte en ton salut.
    V/ De la poussière il retire le faible,
    et du fumier il relève le pauvre. *
    Gloire au Père. R/
  evangelicAntiphon:
    common:
      - Le Seigneur a fait de Geneviève une messagère d’espérance pour tous ceux qui l’invoquent.
  intercession:
    content: |-
      Au jour où nous célébrons l’entrée de Geneviève dans la cité des Saints, bénissons le Seigneur.

      R/ Bénis sois-tu, Seigneur.

      Béni sois-tu, Seigneur, pour l’humble service de la vierge Geneviève, pour sa vie de prière, de silence et d’austérité, menée dans la lumière des Béatitudes.

      Béni sois-tu pour le courage de Geneviève, qui a ranimé celui de tout un peuple dans la ferveur de l’espérance.

      Béni sois-tu pour la charité de Geneviève, qui l’a fait communier à la faim des hommes et devenir la mère des pauvres.

      Béni sois-tu pour l’entrée de Geneviève dans ta gloire, pour la protection dont elle a enveloppé sa cité au long des siècles.
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - Dès l’aube Geneviève faisait monter sa prière vers le Seigneur.
    - psalm: OT_41
      antiphon:
        - Saints et humbles de cœur, bénissez le Seigneur.
    - psalm: PSALM_149
      antiphon:
        - Le Seigneur aime son peuple. Par Geneviève il l’a secouru dans la détresse.

middleOfDay:
  tierce:
    reading:
      biblicalReference: Sg 8,9
      content: J’ai résolu de prendre la Sagesse pour compagne de ma vie ; sachant qu’elle serait ma conseillère aux jours heureux, mon réconfort dans les soucis et dans la peine.
    responsory: |-
      V/ Mon Dieu, tu m’as instruit dès ma jeunesse.
      Sur mes lèvres chantera la joie.
    antiphon: Tenant en mains sa lampe allumée, Geneviève cheminait joyeuse à la rencontre du Seigneur.
  sexte:
    reading:
      biblicalReference: Is 58,7-9
      content: Partage ton pain avec celui qui a faim, recueille chez toi le malheureux sans abri, couvre celui que tu verras sans vêtement, ne te dérobe pas à ton semblable. Alors ta lumière jaillira comme l’aurore et la gloire du Seigneur t’accompagnera.
    responsory: |-
      V/ Mon Dieu, tu m’as instruit dès ma jeunesse.
      Sur mes lèvres chantera la joie.
    antiphon: Tenant en mains sa lampe allumée, Geneviève cheminait joyeuse à la rencontre du Seigneur.
  none:
    reading:
      biblicalReference: cf. 2M 15,14
      content: Voici celle qui aime ses frères, qui prie beaucoup pour le peuple et pour la cité toute entière.
    responsory: |-
      V/ Mon Dieu, tu m’as instruit dès ma jeunesse.
      Sur mes lèvres chantera la joie.
    antiphon: Tenant en mains sa lampe allumée, Geneviève cheminait joyeuse à la rencontre du Seigneur.
  psalmody:
    - psalm: PSALM_120
    - psalm: PSALM_122
    - psalm: PSALM_124

vespers:
  hymn:
    - genevieve-attentive-a-la-voix
  reading:
    biblicalReference: Ct 8,6-7
    content: L’amour est fort comme la mort. Ses flammes sont des flammes brûlantes, c’est un feu divin ! Les torrents ne peuvent éteindre l’amour, les fleuves ne l’emporteront pas.
  responsory: |-
    R/ Sa mémoire est immortelle,
    * Elle est en honneur devant Dieu et devant les hommes.
    V/ Geneviève, épouse du Christ, a reçu la couronne que le Seigneur lui a préparée pour l’éternité. *
    Gloire au Père. R/
  evangelicAntiphon:
    common:
      - Étrangère au monde, aimée du peuple, consacrée toute entière au Christ, telle vécut Geneviève. Aussi le Seigneur l’a-t-il reçue au festin de son royaume.
  intercession:
    content: |-
      Au soir de la fête de sainte Geneviève, présentons au Seigneur la prière du peuple qu’elle a servi avec tant d’amour.

      R/ Seigneur, écoute-nous ; Seigneur, exauce-nous.

      Nous te prions pour ton Église qui chemine en Île-de-France qu’à la suite de Geneviève elle vive avec courage et porte toujours le souci des malheureux.

      Nous te prions pour cette ville : que la protection de Geneviève continue à l’envelopper aux jours d’épreuve comme dans la prospérité.

      Nous te prions pour notre évêque, pour les prêtres, pour ceux et celles qui, à l’exemple de Geneviève, vivent dans le célibat consacré, pour tous les chrétiens : qu’ils répandent ta lumière et soient des témoins de ta tendresse.

      Nous te prions pour ceux qui connaissent l’angoisse du lendemain, pour ceux qui manquent du nécessaire : que l’amour de leurs frères ne leur fasse jamais défaut.
  psalmody:
    - psalm: PSALM_121
      antiphon:
        - Fidèle servante du Seigneur, Geneviève marcha courageusement dans la voie qu’il lui avait tracée.
    - psalm: PSALM_126
      antiphon:
        - Elle priait le Seigneur Dieu de la conduire à la délivrance de son peuple.
    - psalm: NT_12
      antiphon:
        - |-
          Voici venir les noces de l’Agneau : son Épouse pour lui s’est faite belle.
