celebration:
  title: Saint Germain
  subtitle: évêque
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu notre Père, splendeur et gloire de tes élus, tu as sanctifié ce jour par la mort de l’évêque saint Germain : accorde à ton Église l’appui de ses exemples et de ses mérites, pour qu’elle trouve miséricorde auprès de toi et qu’elle puisse annoncer à tous les hommes les merveilles de ton amour.

readings:
  patristicReading:
    - title: Commentaire de Saint Augustin, évêque, sur le psaume 126
      subtitle: Nous parlons de l’extérieur ; lui, il travaille à l’intérieur
      content: |-
        %(Enarr in ps. 126, 2-3 ; PL 37, 1668 - 1669)%
        Si le Seigneur ne construit pas lui-même la maison, c’est en vain que travaillent les constructeurs. Quels sont ceux qui peinent à la construction ? Tous ceux qui, dans l’Église, annoncent la parole de Dieu, les serviteurs des mystères de Dieu... Nous, nous parlons de l’extérieur ; lui, il travaille à l’intérieur. Nous remarquons comment vous nous écoutez, ce que vous pensez, il le sait, celui seul qui voit vos pensées. C’est lui qui construit, lui qui conseille, lui qui inspire la crainte, lui qui ouvre l’intelligence, lui qui dispose votre entendement à la foi. Et cependant, nous travaillons, nous aussi, comme des ouvriers. Mais, %si le Seigneur ne construit pas la maison, c’est en vain que travaillent les constructeurs...% L’Église a ses inspecteurs comme elle a ses constructeurs. Ce sont les évêques. C’est pourquoi la place des évêques est élevée, de manière qu’ils voient les choses de haut, et veillent sur le peuple. De cette place élevée, ils auront à rendre un compte plein de danger, si nous n’avons pas à cœur de nous humilier jusque sous vos pieds, de prier pour vous pour que vous garde celui qui connaît vos âmes. Car nous pouvons vous voir entrer et sortir. Mais nous n’allons pas jusqu’à voir ce que vous pensez dans vos cœurs. Et nous ne pouvons pas voir ce que vous faites dans vos maisons. Comment donc vous garder ? Comme des hommes, autant que nous pouvons, autant que nous en avons reçu la force. Et du fait que nous vous gardons comme des hommes, et ne pouvons vous garder parfaitement, restez-vous donc sans gardien ? Loin de là ! En effet, si le Seigneur ne garde la cité, il perd son temps, celui qui la garde. Nous nous donnons de la peine à cette garde, mais notre peine est vaine, s’il ne vous garde pas, celui qui voit vos pensées. Il vous garde cependant aussi bien lorsque vous veillez que lorsque vous dormez. Nous vous gardons selon le devoir de notre charge, mais nous voulons être gardés avec vous. Nous sommes vos pasteurs, mais nous sommes avec vous les brebis de ce pasteur. De notre place, nous sommes pour vous comme des docteurs, mais sous le Maître nous sommes avec vous des condisciples dans cette école.
      responsory: |-
        R/ Soyez donc attentifs au troupeau
        dont l’Esprit vous a confié la charge.

        C’est au prix de son sang
        que le Christ Jésus s’est acquis l’Église.

        Vous serez les intendants fidèles
        des mystères de sa grâce.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      En choisissant saint Germain comme évêque,
      >le Seigneur a pris soin de son peuple,
      >il lui a donné pour le conduire un berger selon son cœur.
  collect:
  - |-
    Dieu notre Père, splendeur et gloire de tes élus,
    tu as sanctifié ce jour par la mort de l’évêque saint Germain :
    >accorde à ton Église l’appui de ses exemples et de ses mérites,
    pour qu’elle trouve miséricorde auprès de toi
    >et qu’elle puisse annoncer à tous les hommes les merveilles de ton amour.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Co 4, 1-2.5-7
      headline: |-
        « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
      content: |-
        Frères,
        nous, les Apôtres,
        ayant reçu ce ministère par la miséricorde de Dieu,
        >nous ne perdons pas courage :
        nous avons rejeté toute dissimulation honteuse,
        >nous n’agissons pas avec ruse,
        >et nous ne falsifions pas la parole de Dieu.
        Au contraire, nous manifestons la vérité,
        >et ainsi nous nous recommandons nous-mêmes
        >à toute conscience humaine devant Dieu.
        Ce que nous proclamons,
        >ce n’est pas nous-mêmes ;
        c’est ceci : Jésus Christ est le Seigneur ;
        >et nous sommes vos serviteurs, à cause de Jésus.
        Car Dieu qui a dit :
        >Du milieu des ténèbres brillera la lumière,
        a lui-même brillé dans nos cœurs
        >pour faire resplendir la connaissance de sa gloire
        >qui rayonne sur le visage du Christ.
        Mais ce trésor, nous le portons
        >comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        >appartient à Dieu et ne vient pas de nous.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-3.7-8a.10
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        content: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 13, 1-9
      headline: |-
        « Ils ont donné du fruit à raison de cent pour un »
      acclamationAntiphon: |-
        La semence est la parole de Dieu, le semeur est le Christ ;
        celui qui le trouve demeure pour toujours.
      content: |-
        Ce jour-là, Jésus était sorti de la maison,
        et il était assis au bord de la mer.
        Auprès de lui se rassemblèrent des foules si grandes
        qu’il monta dans une barque où il s’assit ;
        toute la foule se tenait sur le rivage.
        Il leur dit beaucoup de choses en paraboles :
        « Voici que le semeur sortit pour semer.
        Comme il semait,
        des grains sont tombés au bord du chemin,
        et les oiseaux sont venus tout manger.
        D’autres sont tombés sur le sol pierreux,
        où ils n’avaient pas beaucoup de terre ;
        ils ont levé aussitôt,
        parce que la terre était peu profonde.
        Le soleil s’étant levé, ils ont brûlé
        et, faute de racines, ils ont séché.
        D’autres sont tombés dans les ronces ;
        les ronces ont poussé et les ont étouffés.
        D’autres sont tombés dans la bonne terre,
        et ils ont donné du fruit
        à raison de cent, ou soixante, ou trente pour un.
        Celui qui a des oreilles,
        qu’il entende ! »
  offeringPrayer:
  - |-
    Que notre offrande devant toi, Seigneur,
    soit comme celle que présentait l’évêque saint Germain :
    >qu’elle puisse toucher ton cœur
    >et nous rendre agréables à tes yeux.
  prayerAfterCommunion:
  - |-
    Par cette eucharistie, Seigneur,
    confirme tes serviteurs dans la foi et la vérité,
    >pour lesquelles a travaillé sans relâche l’évêque saint Germain ;
    puissions-nous maintenant proclamer cette foi
    >par nos paroles et par toute notre vie.
