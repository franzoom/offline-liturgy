celebration:
  title: Bienheureux Innocent V
  subtitle: pape
  description: Pierre de Tarentaise naquit vers 1224. Vers l’âge de seize ans il prit l’habit des frères prêcheurs à Lyon. Maître en théologie, il enseigna à Paris en même temps que saint Thomas d’Aquin et saint Albert le Grand. Le pape Grégoire X le nomma archevêque de Lyon en 1272 et, l’année suivante, cardinal évêque d’Ostie. Il dirigea les travaux du second concile général de Lyon en 1274, avec saint Bonaventure, dont il prononça l’oraison funèbre le 15 juillet. À la mort de Grégoire X, il fut élu pape le 21 janvier 1276, mais il mourut cinq mois plus tard le 22 juin 1276 à Rome.
  commons:
    - pastors_pope
  color: white

oration:
  - Dieu, qui as enrichi le bienheureux Innocent V des dons de science et de prudence pour en faire un artisan de paix et d’unité, accorde-nous, par son intercession, d’avoir le goût des choses d’en haut et de rechercher tout ce qui est bon avec un ardent souci de la paix.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT PIERRE CHRYSOLOGUE SUR LA PAIX
      content: |-
        Heureux les artisans de paix, dit l’évangile, mes très chers frères, ils seront appelés fils de Dieu ! C’est à juste titre que les vertus chrétiennes se développent chez celui qui maintient la paix chrétienne entre tous, et l’on n’obtient le titre de fils de Dieu que si l’on mérite le nom d’artisan de paix. 
        La paix, mes très chers, est ce qui débarrasse l’homme de l’esclavage, fait de lui un homme libre, transforme sa condition personnelle aux yeux de Dieu, fait d’un serviteur un fils, d’un esclave un homme libre. La paix entre frères est ce que Dieu veut, ce qui réjouit le Christ, ce qui accomplit la sainteté, ce qui règle la justice, ce qui enseigne la doctrine, ce qui protège les mœurs, bref, c’est en toutes choses une conduite digne d’éloges. La paix fait exaucer nos prières, elle ouvre une route facile et praticable à nos supplications, elle accomplit parfaitement tous nos désirs. La paix est la mère de la charité, le lien de la concorde, le signe évident d’une âme pure, qui peut réclamer à Dieu tout ce qu’elle veut ; car elle demande tout ce qu’elle veut et elle reçoit tout ce qu’elle demande. La paix doit se conserver par l’obéissance aux commandements du Roi. Le Christ lui-même a dit : C’est la paix que je vous laisse, c’est ma paix que je vous donne. Ce qui revient à dire : Je vous ai quittés dans la paix, je vous retrouverai dans la paix ; en partant, il a voulu donner ce qu’il désirait trouver chez tous lorsqu’il reviendrait. 
        C’est un commandement céleste de conserver ce qu’il a donné : je ne veux pas autre chose que retrouver ce que je vous ai laissé en partant. Planter les racines de la paix, c’est l’œuvre de Dieu ; arracher entièrement la paix, c’est le travail de l’ennemi. Car, de même que l’amour fraternel vient de Dieu, ainsi la haine vient du démon ; c’est pourquoi il faut condamner la haine, car il est écrit : Tout homme qui a de la haine contre son frère est un meurtrier. 
        Vous voyez, frères bien-aimés, pourquoi il faut aimer la paix et chérir la concorde : ce sont elles qui engendrent et nourrissent la charité. Vous savez que, selon l’Apôtre, la charité vient de Dieu. Il est donc séparé de Dieu, celui qui n’a pas la charité. 
        Gardons les commandements, mes frères, car ils sont notre vie ; que la fraternité se maintienne unie par les nœuds d’une profonde paix, qu’elle se resserre par le lien salutaire d’un amour mutuel de charité, qui couvre la multitude des pêchés. Il faut donc que tous nos désirs s’attachent à l’amour, car il peut obtenir tous les bienfaits et toutes les récompenses. Il faut garder la paix plus que toutes les autres vertus, parce que Dieu est toujours dans la paix. 
        Aimez la paix, et tout sera dans le calme : afin que vous obteniez pour nous la récompense et pour vous la joie, afin que l’Église de Dieu, fondée sur l’unité de la paix, mène une vie parfaite dans le Christ.
      responsory: |-
        R/ Fais grandir entre nous, Seigneur,
        l’accord et l’harmonie d’un même amour.

        Menez une vie digne de l’Évangile,
        fermes dans un même esprit,
        luttant d’un cœur unanime.

        Sans vous soucier de vos propres affaires,
        ayez à cœur celles de vos frères,
        à l’exemple du Christ Jésus.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - content: |-
          Dans un amour sans repentir le Seigneur a confié au pape Innocent V
          >le ministère de la réconciliation,
          >il en a fait dans son Église un artisan de paix.
    collect:
      - |-
        Dieu qui as enrichi le bienheureux Innocent V
        >des dons de science et de prudence
        pour en faire un artisan de paix et d’unité,
        accorde-nous, par son intercession,
        >d’avoir le goût des choses d’en haut
        et de rechercher tout ce qui est bon
        >avec un ardent souci de la paix.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Is 32, 15-18
            content: |-
              Jusqu’à ce que soit répandu sur nous l’esprit qui vient d’en haut.
              Alors le désert deviendra un verger,
              >et le verger sera pareil à une forêt.
              Le droit habitera le désert,
              >la justice résidera dans le verger.
              L’œuvre de la justice sera la paix,
              >et la pratique de la justice, le calme et la sécurité pour toujours.
              Mon peuple habitera un séjour de paix,
              >des demeures protégées, des lieux sûrs de repos.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 84 (85), 9ab.10-14
            refAbbr: 84, 9…
            chorus:
              - chorusRef: 84, 10b
                content: |-
                  La gloire du Seigneur habitera notre terre.
            content: |-
              J’écoute : que dira le Seigneur Dieu ?
              Ce qu’il dit, c’est la paix pour son peuple et ses fidèles.
              Son salut est proche de ceux qui le craignent,
              et la gloire habitera notre terre.

              Amour et vérité se rencontrent,
              justice et paix s’embrassent ;
              la vérité germera de la terre
              et du ciel se penchera la justice.

              Le Seigneur donnera ses bienfaits,
              et notre terre donnera son fruit.
              La justice marchera devant lui,
              et ses pas traceront le chemin.
      - partType: GOSPEL
        partContents:
          - biblicalRef: Mt 5, 38-48
            headline: |-
              « Aimez vos ennemis »
            acclamationAntiphon: |-
              En celui qui garde la parole du Christ
              l’amour de Dieu atteint vraiment sa perfection.
            content: |-
              En ce temps-là,
              Jésus disait à ses disciples :
              « Vous avez appris qu’il a été dit :
              Œil pour œil, et dent pour dent.
              Eh bien ! moi, je vous dis de ne pas riposter au méchant ;
              mais si quelqu’un te gifle sur la joue droite,
              >tends-lui encore l’autre.
              Et si quelqu’un veut te poursuivre en justice
              >et prendre ta tunique,
              >laisse-lui encore ton manteau.
              Et si quelqu’un te réquisitionne pour faire mille pas,
              >fais-en deux mille avec lui.
              À qui te demande, donne ;
              >à qui veut t’emprunter, ne tourne pas le dos !
              Vous avez appris qu’il a été dit :
              Tu aimeras ton prochain
              >et tu haïras ton ennemi.
              Eh bien ! moi, je vous dis :
              Aimez vos ennemis,
              >et priez pour ceux qui vous persécutent,
              afin d’être vraiment les fils de votre Père qui est aux cieux ;
              >car il fait lever son soleil sur les méchants et sur les bons,
              >il fait tomber la pluie sur les justes et sur les injustes.
              En effet, si vous aimez ceux qui vous aiment,
              >quelle récompense méritez-vous ?
              Les publicains eux-mêmes n’en font-ils pas autant ?
              Et si vous ne saluez que vos frères,
              >que faites-vous d’extraordinaire ?
              Les païens eux-mêmes n’en font-ils pas autant ?
              Vous donc, vous serez parfaits
              >comme votre Père céleste est parfait. »
    offeringPrayer:
      - |-
        Seigneur, tu as voulu que ton Fils donne sa vie pour réunir tes enfants dispersés ;
        >par le sacrifice d’Alliance qui nous rassemble,
        aide les hommes de ce temps à supprimer ce qui les oppose
        >et à se traiter vraiment comme des frères.
    prayerAfterCommunion:
      - |-
        Inspire-nous, Seigneur, toujours plus de charité,
        afin qu’alimentés par le corps et le sang du Christ,
        >nous fassions fructifier en ce monde la paix qu’il a lui-même donnée.
