celebration:
  title: Bienheureuse Isabelle de France
  subtitle: vierge
  commons:
    - virgins
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Pour chercher le Dieu vivant, pour se mettre à l’école du Christ,
      >Isabelle de France a quitté le monde.
      Sa récompense fut le Seigneur lui-même,
      >elle est sans mesure.
  collect:
  - |-
    Tu as appelé, Seigneur, la bienheureuse Isabelle
    >à vivre dans la retraite à l’écoute du Christ ;
    accorde-nous de te découvrir toujours plus dans la prière,
    >pour nous donner aux autres avec un cœur rempli de toi.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ap 19, 1.5-9a
      headline: |-
        « Heureux les invités au repas des noces de l’Agneau »
      content: |-
        Moi, Jean,
        j’ai entendu comme la voix forte
        d’une foule immense dans le ciel,
        qui proclamait :
        >« Alléluia !
        Le salut, la gloire,
        >la puissance à notre Dieu. »
        Et du Trône sortit une voix qui disait :
        >« Louez notre Dieu,
        >vous tous qui le servez,
        >vous tous qui le craignez,
        >les petits et les grands. »
        Alors j’entendis comme la voix d’une foule immense,
        >comme la voix des grandes eaux,
        >ou celle de violents coups de tonnerre.
        Elle proclamait :
        >« Alléluia !
        Il règne, le Seigneur notre Dieu,
        >le Souverain de l’univers.
        Soyons dans la joie, exultons,
        >et rendons gloire à Dieu !
        Car elles sont venues,
        >les Noces de l’Agneau,
        >et pour lui son épouse
        >a revêtu sa parure.
        Un vêtement de lin fin lui a été donné,
        >splendide et pur. »
        Car le lin, ce sont les actions justes des saints.
        Puis l’ange me dit :
        >« Écris :
        >Heureux les invités
        >au repas des noces de l’Agneau ! »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 148, 1-2.11-14
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 1-12a
      headline: |-
        Où se trouve le vrai bonheur
      content: |-
        En ce temps-là, voyant les foules, Jésus gravit la montagne. Il s’assit, et ses disciples s’approchèrent de lui. Alors, ouvrant la bouche, il les enseignait. Il disait :
        « Heureux les pauvres de cœur, car le royaume des Cieux est à eux.
        Heureux ceux qui pleurent, car ils seront consolés.
        Heureux les doux, car ils recevront la terre en héritage.
        Heureux ceux qui ont faim et soif de la justice, car ils seront rassasiés.
        Heureux les miséricordieux, car ils obtiendront miséricorde.
        Heureux les cœurs purs, car ils verront Dieu.
        Heureux les artisans de paix, car ils seront appelés fils de Dieu.
        Heureux ceux qui sont persécutés pour la justice, car le royaume des Cieux est à eux.
        Heureux êtes-vous si l’on vous insulte, si l’on vous persécute et si l’on dit faussement toute sorte de mal contre vous, à cause de moi. Réjouissez-vous, soyez dans l’allégresse, car votre récompense est grande dans les cieux ! »
  offeringPrayer:
  - |-
    Tandis que nous apportons nos présents à ton autel, Seigneur,
    accorde-nous cet amour filial que tu as donné à la bienheureuse Isabelle.
    >Puissions-nous approcher de ce mystère
    >avec une âme pure et un cœur fervent,
    pour offrir un sacrifice qui te plaise et qui nous soit profitable.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu,
    que la communion au Corps et Sang de ton Fils
    >nous détourne de toute chose périssable ;
    ainsi pourrons-nous, à l’exemple de la bienheureuse Isabelle,
    >progresser sur terre dans un sincère amour pour toi,
    et connaître au ciel la joie de te contempler sans fin.
