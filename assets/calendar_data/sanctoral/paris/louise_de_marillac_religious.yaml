celebration:
  title: Sainte Louise de Marillac
  subtitle: religieuse
  description: Parisienne par sa naissance comme par son mariage avec Antoine Le Gras, Louise de Marillac (1591-1660) l’est plus encore par la fondation des Filles de la Charité, entreprise sous la direction de saint Vincent de Paul après qu’elle fut devenue veuve. Ses activités caritatives ne la détournèrent jamais de l’éducation de son fils.
  commons:
    - saints-female_religious
  color: white

oration:
  - Toi qui as mis au cœur de sainte Louise de Marillac un amour inépuisable pour tous les délaissés, Seigneur, nous te prions : donne-nous, à son exemple, de reconnaître et de servir le Christ dans les pauvres.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Toi qui as mis au cœur de sainte Louise de Marillac
    >un amour inépuisable pour tous les délaissés,
    Seigneur, nous te prions :
    >donne-nous, à son exemple,
    >de reconnaître et de servir le Christ dans les pauvres.
  offeringPrayer:
  - |-
    Accueille, Seigneur, les présents de ton peuple.
    Et tandis que nous rappelons l’amour infini de ton Fils,
    >fais que nous sachions, à l’exemple de sainte Louise de Marillac,
    >t’aimer et aimer notre prochain d’un cœur plus généreux.
  prayerAfterCommunion:
  - |-
    Fortifiés par cette communion,
    nous te supplions encore, Seigneur notre Dieu :
    >puissions-nous, à l’exemple de sainte Louise,
    ne jamais rechercher que toi
    >et être témoins de ton amour pour tous les hommes.
