celebration:
  title: Sainte Madeleine Sophie Barat
  subtitle: vierge
  description: Née à Joigny en 1779, Madeleine-Sophie Barat vint à dix-huit ans étudier à Paris sous la direction de son frère, prêtre. C’est en 1800 qu’elle y jeta les bases de l’Institut des Sœurs du Sacré-Cœur, voué à l’éducation des jeunes filles. Après de multiples fondations, elle mourut à Paris en 1865 et fut inhumée à Conflans.
  commons:
    - virgins
  color: white

oration:
  - Seigneur notre Dieu, tu as donné à sainte Madeleine Sophie cet humble et merveilleux amour qui déborde du Cœur de ton Fils ; accorde-nous, à son exemple, de persévérer dans ton amour, et d’y progresser jusqu’au terme de notre vie.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Comme un arbre planté au bord des eaux qui porte du fruit en abondance (Ps 1, 3),
      >ainsi vécut sainte Madeleine Sophie,
      >docile à l’Esprit qui habitait en elle.
  collect:
  - |-
    Seigneur notre Dieu,
    tu as donné à sainte Madeleine Sophie
    >cet humble et merveilleux amour qui déborde du Cœur de ton Fils ;
    accorde-nous, à son exemple,
    >de persévérer dans ton amour,
    >et d’y progresser jusqu’au terme de notre vie.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Col 3, 12-17
      headline: |-
        « Par-dessus tout cela, ayez l’amour, qui est le lien le plus parfait »
      content: |-
        Frères,
        puisque vous avez été choisis par Dieu,
        >que vous êtes sanctifiés, aimés par lui,
        revêtez-vous de tendresse et de compassion,
        >de bonté, d’humilité, de douceur et de patience.
        Supportez-vous les uns les autres,
        et pardonnez-vous mutuellement
        >si vous avez des reproches à vous faire.
        Le Seigneur vous a pardonné :
        >faites de même.
        Par-dessus tout cela, ayez l’amour,
        >qui est le lien le plus parfait.
        Et que, dans vos cœurs, règne la paix du Christ
        >à laquelle vous avez été appelés,
        >vous qui formez un seul corps.
        Vivez dans l’action de grâce.
        Que la parole du Christ habite en vous
        >dans toute sa richesse ;
        instruisez-vous et reprenez-vous les uns les autres
        >en toute sagesse ;
        >par des psaumes, des hymnes et des chants inspirés,
        chantez à Dieu, dans vos cœurs, votre reconnaissance.
        Et tout ce que vous dites, tout ce que vous faites,
        que ce soit toujours au nom du Seigneur Jésus,
        en offrant par lui votre action de grâce à Dieu le Père.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 144, 2-11
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 1-8
      headline: |-
        « Celui qui demeure en moi et en qui je demeure, celui-là porte beaucoup de fruit »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Moi, je suis la vraie vigne,
        >et mon Père est le vigneron.
        Tout sarment qui est en moi,
        >mais qui ne porte pas de fruit,
        >mon Père l’enlève ;
        tout sarment qui porte du fruit,
        >il le purifie en le taillant,
        >pour qu’il en porte davantage.
        Mais vous, déjà vous voici purifiés
        >grâce à la parole que je vous ai dite.
        Demeurez en moi, comme moi en vous.
        De même que le sarment
        ne peut pas porter de fruit par lui-même
        >s’il ne demeure pas sur la vigne,
        de même vous non plus,
        >si vous ne demeurez pas en moi.
        Moi, je suis la vigne,
        >et vous, les sarments.
        Celui qui demeure en moi
        >et en qui je demeure,
        celui-là porte beaucoup de fruit,
        >car, en dehors de moi, vous ne pouvez rien faire.
        Si quelqu’un ne demeure pas en moi,
        >il est, comme le sarment, jeté dehors,
        >et il se dessèche.
        Les sarments secs, on les ramasse,
        >on les jette au feu, et ils brûlent.
        Si vous demeurez en moi,
        >et que mes paroles demeurent en vous,
        demandez tout ce que vous voulez,
        >et cela se réalisera pour vous.
  offeringPrayer:
  - |-
    Accepte, Seigneur, le sacrifice que ton peuple consacré t’offre aujourd’hui
    en l’honneur de sainte Madeleine Sophie :
    >que notre participation à ce mystère
    >fasse de nous les témoins de ta charité.
  prayerAfterCommunion:
  - |-
    Dieu tout-puissant,
    fais que nous trouvions un soutien dans ce repas sacré,
    >pour qu’à l’exemple de sainte Madeleine-Sophie,
    notre cœur et toute notre vie témoignent de notre charité fraternelle
    >et du rayonnement de la vérité.
