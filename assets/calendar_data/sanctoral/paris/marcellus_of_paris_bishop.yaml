celebration:
  title: Saint Marcel
  subtitle: évêque
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu, qui donnas ici-bas à saint Marcel la passion de ta gloire, et qui le glorifies dans le ciel pour toujours : permets que son intercession auprès de toi nous protège, puisque nous croyons qu’il nous aime encore comme notre père et notre pasteur.

readings:
  patristicReading:
    - title: Sermon de Saint Augustin pour l’ordination d’un évêque
      subtitle: L’évêque préside dans la mesure où il sert
      content: |-
        (%Sermo Morin Guelferbytanus 32%, SPL 2, 637-639.)
        Celui qui préside au peuple de Dieu doit avant tout comprendre qu’il est le serviteur d’un grand nombre Que cette fonction de serviteur ne suscite pas chez lui de honte, car le Seigneur des seigneurs n’a pas eu honte, lui, de se faire notre serviteur. En disant cela, je ne fais pas injure à l’évêque… C’est moi, un évêque qui parle de l’évêque ; et ce que je proclame, je me le dis d’abord à moi-même avec crainte, je me remets en mémoire ce que dit l’Apôtre : Je combats, mais sans frapper dans le vide ; de peur qu’après avoir prêché aux autres, je ne sois moi-même disqualifié.
        Oui, nous les évêques, nous sommes vos serviteurs, mais tous, nous n’avons qu’un même Seigneur ; comme le dit l’Apôtre : Nous sommes vos serviteurs par le Christ Jésus, ce même Jésus qui nous a donné la liberté. Hésiterai-je à devenir serviteur par celui qui m’a libéré et sans lequel je serais encore en esclavage ? Nous sommes donc à la tête de l’Église et nous sommes en même temps vos serviteurs : nous présidons, mais seulement si nous servons.
        Voyons en quoi l’évêque qui préside est un serviteur. Il l’est comme l’a été son Seigneur. C’est lui qui a dit à ses apôtres : Celui, parmi vous, qui veut être le plus grand, qu’il se fasse votre serviteur. Comment a-t-il servi ? Si nous regardons les actes matériels de ce service, nous constaterons que ce sont les disciples qui l’ont servi : c’est lui-même qui les envoyait acheter de la nourriture, préparer les repas ; à l’approche de sa Passion, lorsque les disciples lui disent : Seigneur, où veux-tu que nous te préparions le repas de la Pâque ? il donne des ordres pour la préparation : ils suivent ces ordres, ils préparent le repas et le servent. Alors que veut dire le Seigneur : Le Fils de l’Homme n’est pas venu pour être servi, mais pour servir ? Écoutez ce qui suit : Et pour donner sa vie en rançon pour beaucoup. Voilà comment le Seigneur a servi nous devons imiter ce service. Il a donné sa vie en rançon pour beaucoup, il nous a rachetés. Mais qui, parmi nous, peut racheter un autre ? C’est le sang du Christ, c’est sa mort qui nous ont rachetés de la mort ; c’est son abaissement qui nous a redressés. Mais nous aussi nous devons apporter notre petite part aux membres de son corps ; il est la tête, nous le corps. C’est pourquoi l’apôtre Jean écrit, en nous exhortant à suivre l’exemple du Seigneur qui s’est fait notre serviteur : le Christ a donné sa vie pour nous ; nous aussi, nous devons donner notre vie pour nos frères.
        Ainsi doit agir le bon évêque. Sinon, ce n’est pas un véritable évêque.
      responsory: |-
        R/ Éternelle est la mémoire du juste !

        Faisons l’éloge de ces hommes glorieux,
        qui furent nos Pères dans la foi.

        Sa lignée sera puissante sur la terre,
        et la race des cœurs droits sera bénie.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Le Seigneur a établi saint Marcel comme évêque
      >pour annoncer sa Parole, célébrer ses mystères,
      >et guider son peuple vers la terre promise.
      À lui gloire éternelle.
  collect:
  - |-
    Dieu, qui donnas ici-bas à saint Marcel la passion de ta gloire,
    >et qui le glorifies dans le ciel pour toujours :
    permets que son intercession auprès de toi nous protège,
    >puisque nous croyons qu’il nous aime encore
    >comme notre père et notre pasteur.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Col 1, 24-29
      headline: |-
        « De cette Église, je suis devenu ministre, et Dieu m’a confié une mission »
      content: |-
        Frères,
        maintenant je trouve la joie dans les souffrances
        >que je supporte pour vous ;
        ce qui reste à souffrir des épreuves du Christ
        >dans ma propre chair,
        je l’accomplis pour son corps qui est l’Église.
        De cette Église, je suis devenu ministre,
        et la mission que Dieu m’a confiée,
        >c’est de mener à bien pour vous l’annonce de sa parole,
        le mystère qui était caché depuis toujours
        >à toutes les générations,
        mais qui maintenant a été manifesté
        >à ceux qu’il a sanctifiés.
        Car Dieu a bien voulu leur faire connaître
        >en quoi consiste la gloire sans prix de ce mystère
        >parmi toutes les nations :
        le Christ est parmi vous,
        >lui, l’espérance de la gloire !
        Ce Christ, nous l’annonçons :
        >nous avertissons tout homme,
        >nous instruisons chacun en toute sagesse,
        >afin de l’amener à sa perfection dans le Christ.
        C’est pour cela que je m’épuise à combattre,
        >avec la force du Christ
        >dont la puissance agit en moi.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-11
      refAbbr: 33, 2a
      chorus:
      - chorusRef: 33, 2a
        content: |-
          Je bénirai le Seigneur en tout temps.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        L’ange du Seigneur campe alentour
        pour libérer ceux qui le craignent.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 5, 1-11
      headline: |-
        « Sur ta parole, je vais jeter les filets »
      content: |-
        En ce temps-là,
        la foule se pressait autour de Jésus
        >pour écouter la parole de Dieu,
        >tandis qu’il se tenait au bord du lac de Génésareth.
        Il vit deux barques qui se trouvaient au bord du lac ;
        >les pêcheurs en étaient descendus
        >et lavaient leurs filets.
        Jésus monta dans une des barques qui appartenait à Simon,
        >et lui demanda de s’écarter un peu du rivage.
        Puis il s’assit et, de la barque, il enseignait les foules.
        Quand il eut fini de parler,
        il dit à Simon :
        >« Avance au large,
        >et jetez vos filets pour la pêche. »
        Simon lui répondit :
        >« Maître, nous avons peiné toute la nuit sans rien prendre ;
        >mais, sur ta parole, je vais jeter les filets. »
        Et l’ayant fait,
        ils capturèrent une telle quantité de poissons
        >que leurs filets allaient se déchirer.
        Ils firent signe à leurs compagnons de l’autre barque
        >de venir les aider.
        Ceux-ci vinrent,
        et ils remplirent les deux barques,
        >à tel point qu’elles enfonçaient.
        À cette vue,
        Simon-Pierre tomba aux genoux de Jésus, en disant :
        >« Éloigne-toi de moi, Seigneur,
        >car je suis un homme pécheur. »
        En effet, un grand effroi l’avait saisi,
        >lui et tous ceux qui étaient avec lui,
        >devant la quantité de poissons qu’ils avaient pêchés ;
        et de même Jacques et Jean, fils de Zébédée,
        >les associés de Simon.
        Jésus dit à Simon :
        >« Sois sans crainte,
        >désormais ce sont des hommes que tu prendras. »
        Alors ils ramenèrent les barques au rivage
        >et, laissant tout, ils le suivirent.
  offeringPrayer:
  - |-
    En célébrant la fête de saint Marcel nous te prions, Seigneur,
    de bénir les dons que nous te présentons :
    >accorde à tous ceux qui les prendront en nourriture
    >d’être préservés de toute faute
    >et d’en recevoir d’abondants secours.
  prayerAfterCommunion:
  - |-
    Par cette communion, Seigneur notre Dieu,
    entretiens en nous la vraie foi
    >que nous avons reçue de la prédication des Apôtres
    >et que saint Marcel a gardée avec amour.
