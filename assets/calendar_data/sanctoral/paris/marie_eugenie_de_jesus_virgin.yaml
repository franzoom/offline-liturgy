celebration:
  title: Sainte Marie-Eugénie de Jésus
  subtitle: vierge
  commons:
    - virgins
    - saints-female_religious
  color: white

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu,
    par la contemplation du mystère de ton Fils,
    >tu as amené sainte Marie Eugénie
    >à se donner toute à toi
    >et à se vouer à l’éducation des jeunes ;
    accorde-nous, par sa prière et à son exemple,
    >de te servir avec ferveur
    et d’avoir pour nos frères
    >une charité qui les gagne au Christ.
  offeringPrayer:
  - |-
    Regarde avec bonté, Seigneur,
    l’offrande que nous te présentons ;
    >accorde-nous en retour
    l’intelligence de ce qui est juste à tes yeux
    >et le courage d’en parler ouvertement.
  prayerAfterCommunion:
  - |-
    Que cette communion, Dieu de miséricorde,
    nous soutienne dans ta loi d’amour
    >et nous fasse témoigner partout de la vérité.
