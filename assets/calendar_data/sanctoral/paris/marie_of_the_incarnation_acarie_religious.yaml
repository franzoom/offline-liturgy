celebration:
  title: Bienheureuse Marie de l’Incarnation (Barbe Acarie)
  subtitle: religieuse
  commons:
    - saints-female_religious
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Marie de l’Incarnation aima d’un grand amour
      >le Seigneur Jésus, Dieu fait homme pour sauver les hommes.
      C’est pourquoi elle vit maintenant près de lui.
  collect:
  - |-
    Dieu notre Père,
    tu as donné à la bienheureuse Marie de l’Incarnation
    >un zèle ardent pour ta gloire
    >et une rare fermeté dans les malheurs ;
    accorde-nous par ses mérites
    >de supporter courageusement les épreuves
    >et de persévérer dans ton amour.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 26-31
      headline: |-
        « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        >ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        >voilà ce que Dieu a choisi,
        >pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        >lui qui est devenu pour nous sagesse venant de Dieu,
        >justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        >Celui qui veut être fier,
        >qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3.6-7.10-11
      refAbbr: 33, 2a
      chorus:
      - chorusRef: 33, 2a
        content: |-
          Je bénirai le Seigneur en tout temps.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 1-8
      headline: |-
        « Celui qui demeure en moi et en qui je demeure, celui-là porte beaucoup de fruit »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Moi, je suis la vraie vigne,
        >et mon Père est le vigneron.
        Tout sarment qui est en moi,
        >mais qui ne porte pas de fruit,
        >mon Père l’enlève ;
        tout sarment qui porte du fruit,
        >il le purifie en le taillant,
        >pour qu’il en porte davantage.
        Mais vous, déjà vous voici purifiés
        >grâce à la parole que je vous ai dite.
        Demeurez en moi, comme moi en vous.
        De même que le sarment
        ne peut pas porter de fruit par lui-même
        >s’il ne demeure pas sur la vigne,
        de même vous non plus,
        >si vous ne demeurez pas en moi.
        Moi, je suis la vigne,
        >et vous, les sarments.
        Celui qui demeure en moi
        >et en qui je demeure,
        celui-là porte beaucoup de fruit,
        >car, en dehors de moi, vous ne pouvez rien faire.
        Si quelqu’un ne demeure pas en moi,
        >il est, comme le sarment, jeté dehors,
        >et il se dessèche.
        Les sarments secs, on les ramasse,
        >on les jette au feu, et ils brûlent.
        Si vous demeurez en moi,
        >et que mes paroles demeurent en vous,
        demandez tout ce que vous voulez,
        >et cela se réalisera pour vous.
  offeringPrayer:
  - |-
    En te présentant, Seigneur, ce sacrifice
    pour fêter la mémoire de la bienheureuse Marie de l’Incarnation,
    >nous t’adressons notre prière :
    >qu’avec ton pardon il nous apporte le salut.
  communionAntiphon:
  - content: |-
      « Celui qui fait la volonté de mon Père qui est aux cieux, dit le Seigneur,
      >celui-là est mon frère, ma sœur, ma mère. »
  prayerAfterCommunion:
  - |-
    Que cette eucharistie, Dieu tout-puissant,
    nous apporte lumière et ferveur
    >en cette fête de la bienheureuse Marie de l’Incarnation ;
    que nos cœurs brûlent toujours du désir de la sainteté,
    >et que notre vie se passe à faire le bien.
