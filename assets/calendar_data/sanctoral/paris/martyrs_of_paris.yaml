celebration:
  title: Bienheureux martyrs de Paris
  subtitle: martyrs de septembre 1792
  commons:
    - martyrs
  color: red

oration:
  - En appelant, Seigneur, en ce jour un grand nombre de prêtres de Paris au témoignage suprême du martyre, tu as manifesté que tu n’aimes rien tant que la liberté de ton Église ; par leur intercession, accorde à tous les baptisés de témoigner de toi sans entraves devant les hommes.

readings:
  patristicReading:
    - title: Relation de l’un des rescapés, blessé au couvent des Carmes
      subtitle: Je n’ai entendu se plaindre aucun de ceux que j’ai vu massacrer
      content: |-
        %(Relation autographe de l’abbé de La Pannonie, archives du procès de béatification au séminaire Saint-Sulpice, Paris)%
        Le deux septembre… vers les quatre heures, nous entendons de grandes clameurs au voisinage. Peu de temps après nous apercevons un groupe de forcenés qui nous montrent leurs piques au travers des barreaux d’une fenêtre. Nous ne doutâmes plus alors qu’ils ne vinssent pour nous égorger et nous nous empressâmes de nous demander et donner les uns aux autres l’absolution. Je ne quittai point Mgr l’archevêque (d’Arles) ; la force et la tranquillité qu’il conservait à la vue du danger que nous courions, me soutenaient au milieu de mes alarmes. Notre garde ne tarda pas à disparaître. Les assassins entrent dans le jardin armés de fusils à baïonnettes, de piques et de pistolets. Ils massacrent le premier qu’ils rencontrent. Un d’eux devance les autres et vint au devant de M. l’archevêque et de moi. « Es-tu l’archevêque d’Arles ? » me dit-il en frémissant de rage. Je ne lui fis d’autre réponse que de hausser les épaules. « C’est donc toi », reprit le furieux en s’adressant cette fois à M. l’archevêque. « Oui, je le suis », répondit-il aussitôt avec une contenance ferme et modeste. « C’est donc toi, reprit ce monstre, qui as fait répandre tant de sang à Arles. - Moi, répond encore M. l’archevêque, je ne sache pas avoir fait du mal à personne. - Tu n’as fait de mal à personne, scélérat ! répartit encore ce misérable. Eh bien, je vais t’en faire à toi », et aussitôt il fond sur lui comme un tigre furieux et lui décharge un grand coup de sabre sur la tête. À ce premier coup, M. l’archevêque joint ses mains et s’en couvre le visage et, sans faire la moindre plainte, reçoit de ce forcené la mort à laquelle il s’était si bien préparé pendant sa captivité…
        Ce qui étonnera sans doute, c’est que je n’ai entendu se plaindre aucun de ceux que je vis massacrer. Plusieurs de ceux qui avaient été se réfugier dans la chapelle (du jardin) reçurent la mort en offrant à Dieu le sacrifice de leur vie. Après avoir un peu assouvi leur rage, les assassins nous ordonnent de rentrer dans l’église, sans cesser de nous tirer des coups de fusil... Nous restâmes là quelque temps à prier et à gémir de tous les blasphèmes et de toutes les horreurs que vomissaient ces forcenés… On nous ordonne de cesser nos prières et de nous lever, ce que nous fanes aussitôt. Un d’eux nous demande alors d’un ton terrible et menaçant : « Avez-vous prêté le serment ? » Comme je me trouvais le plus près d’eux, je leur répondis que pas un de nous n’avait prêté ni ne prêterait ce serment ; que je devais seulement leur faire observer que la plupart d’entre nous n’y étaient pas obligés et que la loi laissait la liberté aux autres de le prêter ou non. « C’est égal, reprirent-ils alors ; passez, passez, votre compte est fait »…
      responsory: |-
        R/ Dieu vivant, Seigneur ressuscité,
        nous croyons en toi.

        De la détresse des prisons monte
        le cri des fils de Dieu persécutés ;
        mais le Royaume est proche :
        bientôt se lèvera
        le Fils de l’Homme qu’ils acclament.

        En vérité, je vous le dis,
        si quelqu’un garde ma parole,
        il ne verra jamais la mort.
