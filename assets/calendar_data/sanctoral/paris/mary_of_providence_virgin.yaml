celebration:
  title: Bienheureuse Marie de la Providence
  subtitle: vierge
  commons:
    - virgins
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. He 11, 27
    content: |-
      Regardant l’invisible comme si elle le voyait,
      >Marie de la Providence vécut dans l’attente du Seigneur Jésus,
      >joie éternelle des saints.
  collect:
  - |-
    Dieu dont l’amour est inlassable,
    tu as suscité au cœur de la bienheureuse Marie
    >une confiance absolue en ta Providence ;
    accorde-nous, par son intercession,
    >la grâce de ne jamais douter de ta bonté paternelle.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 2, 7-11
      content: |-
        Vous qui craignez le Seigneur, ayez confiance en lui,
        >et votre récompense ne saurait vous échapper.
        Vous qui craignez le Seigneur, espérez le bonheur,
        >la joie éternelle et la miséricorde :
        >ce qu’il donne en retour est un don éternel, pour la joie.
        Considérez les générations passées et voyez :
        Celui qui a mis sa confiance dans le Seigneur,
        >a-t-il été déçu ?
        Celui qui a persévéré dans la crainte du Seigneur,
        >a-t-il été abandonné ?
        Celui qui l’a invoqué,
        >a-t-il été méprisé ?
        Car le Seigneur est tendre et miséricordieux,
        >il pardonne les péchés,
        >et il sauve au moment de la détresse.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 129 (130), 1-4.5-6ab.7bc-8
      refAbbr: cf. 129, 5
      chorus:
      - chorusRef: cf. 129, 5
        content: |-
          Je mets mon espoir dans le Seigneur,
          je suis sûr de sa Parole.
      content: |-
        Des profondeurs je crie vers toi, Seigneur,
        Seigneur, écoute mon appel !
        Que ton oreille se fasse attentive
        au cri de ma prière !

        Si tu retiens les fautes, Seigneur,
        Seigneur, qui subsistera ?
        Mais près de toi se trouve le pardon
        pour que l’homme te craigne.

        J’espère le Seigneur de toute mon âme ;
        je l’espère, et j’attends sa parole.
        Mon âme attend le Seigneur
        plus qu’un veilleur ne guette l’aurore.

        Oui, près du Seigneur, est l’amour ;
        près de lui, abonde le rachat.
        C’est lui qui rachètera Israël
        de toutes ses fautes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 6, 31-34
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Ne vous faites pas tant de souci ;
        ne dites pas : “Qu’allons-nous manger ?”
        >ou bien : “Qu’allons-nous boire ?”
        >ou encore : “Avec quoi nous habiller ?”
        Tout cela, les païens le recherchent.
        Mais votre Père céleste sait que vous en avez besoin.
        Cherchez d’abord le royaume de Dieu et sa justice,
        et tout cela vous sera donné par surcroît.
        Ne vous faites pas de souci pour demain :
        demain aura souci de lui-même ;
        à chaque jour suffit sa peine. »
  offeringPrayer:
  - |-
    En reconnaissant les merveilles que tu as accomplies, Seigneur,
    >dans l’âme de la bienheureuse Marie de la Providence,
    nous te supplions humblement :
    >toi qui aimais sa vie toute imprégnée de l’Évangile,
    >accepte l’hommage de notre liturgie.
  prayerAfterCommunion:
  - |-
    Par la puissance de cette communion, Seigneur,
    conduis-nous toujours dans la voie de ton amour,
    >comme tu fis pour la bienheureuse Marie de la Providence ;
    l’œuvre de salut que tu as entreprise en nous,
    >poursuis-la jusqu’au jour du Christ.
