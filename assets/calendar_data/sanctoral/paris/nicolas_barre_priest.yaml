celebration:
  title: Bienheureux Nicolas Barré
  subtitle: prêtre
  commons:
    - pastors
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      Nicolas Barré ne cessa d’enraciner sa mission
      >dans la contemplation du mystère de l’Incarnation,
      car Dieu étanche la soif de ceux qui vivent en amitié avec lui.
      >Il lui a montré qu’une action faite pour Dieu
      >ne peut qu’unir à Dieu,
      >et que la sanctification passe aussi par l’apostolat.
  collect:
  - |-
    Dieu qui as suscité le bienheureux Nicolas Barré dans ton Église
    >pour qu’il enseigne aux autres le chemin du salut,
    accorde-nous de suivre, comme lui, le Christ notre maître,
    >afin d’arriver vers toi en compagnie de nos frères.
  offeringPrayer:
  - |-
    Permets, Seigneur, que cette eucharistie,
    célébrée en la mémoire du bienheureux Nicolas Barré,
    >nous apporte le salut et soit capable de te plaire.
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Seigneur notre Dieu :
    que le sacrement auquel nous venons de prendre part
    >en ce jour où nous célébrons la mémoire du bienheureux Nicolas Barré
    soit pour nous une source intarissable de salut et de paix.
