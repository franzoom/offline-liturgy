celebration:
  title: Notre-Dame du Refuge
  commons:
    - virgin-mary
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. He 4, 16
    content: |-
      Marie a enfanté le Christ, qui nous sauve de nos péchés ;
      >approchons par elle des sources du pardon.
  collect:
  - |-
    Seigneur, toi qui aimes les hommes,
    >viens au secours de notre faiblesse
    quand nous célébrons la sainte Vierge Marie, Refuge des pécheurs :
    >fais que, par son intercession,
    >nous soyons guéris de toutes nos fautes.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 5, 12.17-19
      content: |-
        Frères,
        nous savons que par un seul homme,
        >le péché est entré dans le monde,
        >et que par le péché est venue la mort ;
        et ainsi, la mort est passée en tous les hommes,
        >étant donné que tous ont péché.
        Si, en effet, à cause d’un seul homme,
        par la faute d’un seul,
        >la mort a établi son règne,
        combien plus, à cause de Jésus Christ et de lui seul,
        >régneront-ils dans la vie,
        >ceux qui reçoivent en abondance
        >le don de la grâce qui les rend justes.
        Bref, de même que la faute commise par un seul
        >a conduit tous les hommes à la condamnation,
        de même l’accomplissement de la justice par un seul
        >a conduit tous les hommes à la justification qui donne la vie.
        En effet, de même que par la désobéissance d’un seul être humain
        >la multitude a été rendue pécheresse,
        de même par l’obéissance d’un seul
        >la multitude sera-t-elle rendue juste.
  - partType: PSALM
    partContents:
    - biblicalRef: 1S 2, 1.4-5ab.6-7.8abcd
      label: Cantique d’Anne
      content: |-
        Mon cœur exulte à cause du Seigneur ;
        mon front s’est relevé grâce à mon Dieu !
        Face à mes ennemis, s’ouvre ma bouche :
        oui, je me réjouis de ton salut !

        L’arc des forts est brisé,
        mais le faible se revêt de vigueur.
        Les plus comblés s’embauchent pour du pain,
        et les affamés se reposent.

        Le Seigneur fait mourir et vivre ;
        il fait descendre à l’abîme et en ramène.
        Le Seigneur rend pauvre et riche ;
        il abaisse et il élève.

        De la poussière il relève le faible,
        il retire le malheureux de la cendre
        pour qu’il siège parmi les princes
        et reçoive un trône de gloire.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 1, 18-23
      content: |-
        Voici comment fut engendré Jésus Christ :
        Marie, sa mère,
        >avait été accordée en mariage à Joseph ;
        avant qu’ils aient habité ensemble,
        >elle fut enceinte
        >par l’action de l’Esprit Saint.
        Joseph, son époux,
        >qui était un homme juste,
        et ne voulait pas la dénoncer publiquement,
        >décida de la renvoyer en secret.
        Comme il avait formé ce projet,
        voici que l’ange du Seigneur
        lui apparut en songe et lui dit :
        >« Joseph, fils de David,
        >ne crains pas de prendre chez toi Marie, ton épouse,
        >puisque l’enfant qui est engendré en elle
        >vient de l’Esprit Saint ;
        >elle enfantera un fils,
        >et tu lui donneras le nom de Jésus
        >(c’est-à-dire : Le-Seigneur-sauve),
        >car c’est lui qui sauvera son peuple de ses péchés. »
        Tout cela est arrivé
        pour que soit accomplie
        la parole du Seigneur prononcée par le prophète :
        >Voici que la Vierge concevra,
        >et elle enfantera un fils ;
        >on lui donnera le nom d’Emmanuel
        >qui se traduit : « Dieu-avec-nous ».
  offeringPrayer:
  - |-
    Exauce notre prière, Seigneur :
    permets qu’au jour où nous célébrons Marie, Refuge des pécheurs,
    >ce sacrifice nous apporte le salut,
    puisque, dans cette immolation, tu as voulu
    >que soient remis les péchés du monde entier.
  communionAntiphon:
  - content: |-
      Jésus, le Fils de Marie, est l’Agneau de Dieu,
      >qui enlève le péché du monde.
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Seigneur notre Dieu,
    toi qui nous as nourris à la table de ton Fils
    >pour affermir notre relèvement :
    par cette communion fais de nous des vivants
    >maintenant et pour l’éternité.
