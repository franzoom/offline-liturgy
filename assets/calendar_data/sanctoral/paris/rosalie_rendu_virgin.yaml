celebration:
  title: Bienheureuse Rosalie Rendu
  subtitle: vierge
  commons:
    - virgins
    - saints-female_caritative
  color: white

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - content: |-
      À une époque troublée par des conflits sociaux,
      >Rosalie Rendu s’est joyeusement faite la servante des plus pauvres,
      pour redonner à chacun sa dignité,
      >par des aides matérielles,
      >par l’éducation et l’enseignement du mystère chrétien.
  collect:
  - |-
    Dieu qui as mis au cœur de la bienheureuse Rosalie Rendu
    >le désir du Royaume et de sa justice
    par la pratique d’une charité sans faille,
    >permets que, soutenus par sa prière,
    >nous ayons la joie d’aimer toujours davantage.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 12, 31 – 13, 13
      content: |-
        Les prophéties seront dépassées, le don des langues cessera,
        la connaissance actuelle sera dépassée.
        En effet, notre connaissance est partielle,
        nos prophéties sont partielles.
        Quand viendra l’achèvement,
        ce qui est partiel sera dépassé.
        Quand j’étais petit enfant,
        je parlais comme un enfant,
        je pensais comme un enfant,
        je raisonnais comme un enfant.
        Maintenant que je suis un homme,
        j’ai dépassé ce qui était propre à l’enfant.
        Nous voyons actuellement de manière confuse, comme dans un miroir ;
        ce jour-là, nous verrons face à face.
        Actuellement, ma connaissance est partielle ;
        ce jour-là, je connaîtrai parfaitement, comme j’ai été connu.
        Ce qui demeure aujourd’hui, c’est la foi, l’espérance et la charité ;
        mais la plus grande des trois, c’est la charité.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-6.9-11
      refAbbr: 33, 2a
      chorus:
      - chorusRef: 33, 2a
        content: |-
          Je bénirai le Seigneur en tout temps.
      - chorusRef: cf. 33, 9a
        content: |-
          ou : Goûtez et voyez
          comme est bon le Seigneur.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        L’ange du Seigneur campe alentour
        pour libérer ceux qui le craignent.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 25-37
      headline: « Qui est mon prochain ? »
      acclamationAntiphon: |-
        Tes paroles, Seigneur,
        sont esprit et elles sont vie.
        Tu as les paroles de la vie éternelle.
      content: |-
        En ce temps-là,
        un docteur de la Loi se leva
        et mit Jésus à l’épreuve en disant :
        « Maître, que dois-je faire
        pour avoir en héritage la vie éternelle ? »
        Jésus lui demanda :
        « Dans la Loi, qu’y a-t-il d’écrit ?
        Et comment lis-tu ? »
        L’autre répondit :
        « Tu aimeras le Seigneur ton Dieu
        de tout ton cœur, de toute ton âme,
        de toute ta force et de toute ton intelligence,
        et ton prochain comme toi-même. »
        Jésus lui dit :
        « Tu as répondu correctement.
        Fais ainsi et tu vivras. »
        Mais lui, voulant se justifier,
        dit à Jésus :
        « Et qui est mon prochain ? »
        Jésus reprit la parole :
        « Un homme descendait de Jérusalem à Jéricho,
        et il tomba sur des bandits ;
        ceux-ci, après l’avoir dépouillé et roué de coups,
        s’en allèrent, le laissant à moitié mort.
        Par hasard, un prêtre descendait par ce chemin ;
        il le vit et passa de l’autre côté.
        De même un lévite arriva à cet endroit ;
        il le vit et passa de l’autre côté.
        Mais un Samaritain, qui était en route, arriva près de lui ;
        il le vit et fut saisi de compassion.
        Il s’approcha, et pansa ses blessures
        en y versant de l’huile et du vin ;
        puis il le chargea sur sa propre monture,
        le conduisit dans une auberge
        et prit soin de lui.
        Le lendemain, il sortit deux pièces d’argent,
        et les donna à l’aubergiste, en lui disant :
        “Prends soin de lui ;
        tout ce que tu auras dépensé en plus,
        je te le rendrai quand je repasserai.”
        Lequel des trois, à ton avis, a été le prochain
        de l’homme tombé aux mains des bandits ? »
        Le docteur de la Loi répondit :
        « Celui qui a fait preuve de pitié envers lui. »
        Jésus lui dit :
        « Va, et toi aussi, fais de même. »
  offeringPrayer:
  - |-
    Accueille, Seigneur, les présents de ton peuple ;
    et tandis que nous rappelons l’amour infini de ton Fils,
    >fais que nous sachions, à l’exemple de Sœur Rosalie,
    >t’aimer et aimer notre prochain d’un cœur plus généreux.
  communionAntiphon:
  - biblicalReference: Jn 13, 35
    content: |-
      Ce qui montrera à tous les hommes que vous êtes mes disciples, dit le Seigneur,
      >c’est l’amour que vous aurez les uns pour les autres.
  prayerAfterCommunion:
  - |-
    Toi qui nous as fortifiés par cette communion, Seigneur,
    aide-nous à suivre l’exemple de la bienheureuse Rosalie,
    >dans l’amour qu’elle sut te témoigner
    >et la charité dont elle fit preuve envers ton peuple.
