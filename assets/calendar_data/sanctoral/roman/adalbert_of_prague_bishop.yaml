celebration:
  title: Saint Adalbert
  subtitle: évêque et martyr
  description: Né en Bohême en 956, Adalbert, après avoir étudié à Magdebourg, est ordonné évêque de Prague où il tente, contre son clergé, de réformer l’Église. Il se retire dans un monastère bénédictin, mais revient à Prague où il est très mal reçu par ses fidèles. Il part alors annoncer l’Évangile dans le nord de la Pologne, où il connaît le martyre en 997.
  color: red
  commons:
    - martyr
    - pastors_bishop

oration:
  - Seigneur Dieu, tu as donné la couronne du martyre à l’évêque saint Adalbert, tout enflammé de zèle pour les âmes ; fais qu’à sa prière, le troupeau ne manque pas d’obéir à ses pasteurs, ni les pasteurs de se dévouer à leur troupeau.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné la couronne du martyre
    >à l’évêque saint Adalbert,
    >tout enflammé de zèle pour les âmes ; *
    fais qu’à sa prière,
    >le troupeau ne manque pas d’obéir à ses pasteurs /
    >ni les pasteurs de se dévouer à leur troupeau.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Co 6, 4-10
      headline: « On nous croit mourants, et nous sommes bien vivants »
      content: |-
        Frères, en tout, nous nous recommandons nous-mêmes
        comme des ministres de Dieu :
        par beaucoup d’endurance, dans les détresses, les difficultés, les angoisses,
        les coups, la prison, les émeutes, les fatigues, le manque de sommeil et de nourriture,
        par la chasteté, la connaissance, la patience et la bonté,
        la sainteté de l’esprit et la sincérité de l’amour,
        par une parole de vérité, par une puissance qui vient de Dieu ;
        nous nous présentons avec les armes de la justice pour l’attaque et la défense,
        dans la gloire et le mépris, dans la mauvaise et la bonne réputation.
        On nous traite d’imposteurs, et nous disons la vérité ;
        on nous prend pour des inconnus, et nous sommes très connus ;
        on nous croit mourants, et nous sommes bien vivants ;
        on nous punit, et nous ne sommes pas mis à mort ;
        on nous croit tristes, et nous sommes toujours joyeux ;
        pauvres, et nous faisons tant de riches ;
        démunis de tout, et nous possédons tout.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 30 (31), 3bc-4, 6.8, 16-17
      refAbbr: 30, 6a
      chorus:
      - chorusRef: 30, 6a
        chorus: |-
          En tes mains, Seigneur,
          je remets mon esprit.
      content: |-
        Sois le rocher qui m’abrite,
        la maison fortifiée qui me sauve.
        Ma forteresse et mon roc, c’est toi :
        pour l’honneur de ton nom, tu me guides et me conduis.

        En tes mains je remets mon esprit ;
        tu me rachètes, Seigneur, Dieu de vérité.
        Ton amour me fait danser de joie :
        tu vois ma misère et tu sais ma détresse.

        Mes jours sont dans ta main : délivre-moi
        des mains hostiles qui s’acharnent.
        Sur ton serviteur, que s’illumine ta face ;
        sauve-moi par ton amour.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      headline: « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: |-
        Pour eux je me sanctifie moi-même,
        afin qu’ils soient, eux aussi, sanctifiés dans la vérité.
      content: |-
        En ce temps-là, Jésus disait :
        « Moi, je suis le bon pasteur, le vrai berger,
        qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        les brebis ne sont pas à lui :
        s’il voit venir le loup,
        il abandonne les brebis et s’enfuit ;
        le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        je connais mes brebis,
        et mes brebis me connaissent,
        comme le Père me connaît,
        et que je connais le Père ;
        et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        qui ne sont pas de cet enclos :
        celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        il y aura un seul troupeau
        et un seul pasteur. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null