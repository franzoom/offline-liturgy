celebration:
  title: Sainte Agathe
  subtitle: vierge et martyre
  description: Agathe est une jeune Sicilienne qui mourut pour le Christ à Catane lors de la persécution de Dèce (251). Ses concitoyens l’ont toujours invoquée avec confiance, spécialement lors des éruptions de l’Etna, et son culte s’est répandu aussi bien en Orient qu’en Occident.
  commons:
  - martyr_female_virgin  
  - virgins
  color: red

oration:
- Que sainte Agathe implore pour nous ton pardon, Seigneur, elle qui sut également te plaire par la consécration de sa virginité et par son courage dans le martyre.

readings:
  patristicReading:
  - title: HOMÉLIE DE SAINT MÉTHODE DE SICILE POUR LA FÊTE DE SAINTE AGATHE
    content: |-
      C’est la commémoration annuelle de la sainte martyre qui nous a tous rassemblés ici, vous le savez, vous qui m’écoutez. Martyre ancienne et même toute première, si l’on considère son magnifique combat ; mais martyre contemporaine, puisqu’elle semble triompher par un combat actuel, si l’on considère les miracles qui chaque jour la couronnent et augmentent son éclat.
      Elle est vierge parce que le Verbe du Dieu immortel (mais qui a connu la mort dans sa chair à cause de moi), parce que le Fils inséparable du Père l’a engendrée selon la parole de Jean le Théologien : %Tous ceux qui l’ont reçu, il leur a donné de pouvoir devenir enfants de Dieu.%
      C’est donc cette vierge qui vous a invités à notre religieux banquet, elle qui a été%fiancée à un époux unique, le Christ%, pour employer les expressions de l’Apôtre Paul, et sa comparaison avec l’union conjugale.
      Par la lumière de la connaissance, par la couleur du sang de l’Agneau véritable et divin, cette vierge embellissait et rougissait ses lèvres, ses joues et sa langue ; bien davantage, par l’attention continuelle de son esprit, elle méditait et contemplait sans cesse la mort de son époux passionné, comme s’il venait tout juste de répandre son sang. Ainsi la robe dont la revêtait son martyre portait la marque ineffaçable du sang du Christ, dont la pourpre l’imprégnait alors profondément ; en outre, elle voulait communiquer à la postérité les trésors de son éloquence virginale avec tout son charme délicat, par un jaillissement intarissable de paroles.
      Comme le dit son nom qui signifie « bonne », Agathe est véritablement bonne, puisqu’elle appartient à Dieu ; c’est par Dieu, la source de toute bonté, qu’elle a été accordée, c’est par sa libéralité qu’elle a été donnée à son Époux et par suite à nous-mêmes, en nous faisant communier au bien.
      Qu’y a-t-il de plus bienfaisant que le souverain bien ? Que peut-on découvrir qui mérite davantage d’être loué que sainte Agathe ?
      La bonté de sainte Agathe correspond à son nom et à sa réalité même ; sainte Agathe, à cause de ses hauts faits, se distingue par son bon renom, et son nom même signale ses exploits ; sainte Agathe, qui déjà par son nom invite tous les hommes à venir à elle, les instruit encore par son exemple : que tous, sans attendre, s’élancent avec elle vers le vrai bien, qui n’est autre que Dieu.
    responsory: |-
      R/ C’est du ciel que vient la force !

      Ma grâce te suffit, dit le Seigneur,
      car ma puissance se déploie dans la faiblesse.

      Je me vanterai surtout de mes faiblesses,
      afin que repose sur moi la puissance du Christ.

      La folie de Dieu est plus sage que les hommes
      et la faiblesse de Dieu, plus forte que les hommes.

morning:
  evangelicAntiphon:
    common:

    - Joyeuse et rayonnante, Agathe marchait vers la prison comme pour une fête.
vespers:
  evangelicAntiphon:
    common:
    - |-
      Grâces te soient rendues, Seigneur Jésus : tu m’as fait triompher de mes bourreaux, conduis-moi jusqu’à ta gloire éternelle.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Nous t’en prions, Seigneur,+
    >que la bienheureuse Agathe, vierge et martyre,
    >implore pour nous le pardon, *
    elle qui sut toujours te plaire
    >par le courage de son martyre/
    >et le mérite de sa chasteté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 26-31
      headline: « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        voilà ce que Dieu a choisi,
        pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        lui qui est devenu pour nous sagesse venant de Dieu,
        justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        Celui qui veut être fier,
        qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 30 (31), 3bc-4, 6.8, 16-17
      refAbbr: 30, 6a
      chorus:
      - chorusRef: 30, 6a
        chorus: |-
          En tes mains, Seigneur,
          je remets mon esprit.
      content: |-
        Sois le rocher qui m’abrite,
        la maison fortifiée qui me sauve.
        Ma forteresse et mon roc, c’est toi :
        pour l’honneur de ton nom, tu me guides et me conduis.

        En tes mains je remets mon esprit ;
        tu me rachètes, Seigneur, Dieu de vérité.
        Ton amour me fait danser de joie :
        tu vois ma misère et tu sais ma détresse.

        Mes jours sont dans ta main : délivre-moi
        des mains hostiles qui s’acharnent.
        Sur ton serviteur, que s’illumine ta face ;
        sauve-moi par ton amour.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 23-26
      headline: « Celui qui perdra sa vie à cause de moi la sauvera »
      acclamationAntiphon: |-
        Si l’on vous insulte pour le nom du Christ,
        heureux êtes-vous :
        l’Esprit de Dieu repose sur vous.
      content: |-
        En ce temps-là,
        Jésus disait à tous :
        « Celui qui veut marcher à ma suite,
        qu’il renonce à lui-même,
        qu’il prenne sa croix chaque jour
        et qu’il me suive.
        Car celui qui veut sauver sa vie
        la perdra ;
        mais celui qui perdra sa vie à cause de moi
        la sauvera.
        Quel avantage un homme aura-t-il
        à gagner le monde entier,
        s’il se perd ou se ruine lui-même ?
        Celui qui a honte de moi et de mes paroles,
        le Fils de l’homme aura honte de lui,
        quand il viendra dans la gloire,
        la sienne, celle du Père et des saints anges. »
