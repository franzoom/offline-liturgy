celebration:
  title: Sainte Agnès
  subtitle: vierge et martyre
  description: La jeune Romaine Agnès devait avoir entre douze et quinze ans, lorsqu’elle s’offrit spontanément à mourir pour sa foi au plus fort de la persécution de Dioclétien (305). Ce fait. que rapporte saint Ambroise, donne la raison de l’affection dont l’Église de Rome a toujours entouré le souvenir d’Agnès.
  commons:
  - virgins_martyrs
  - virgins
  color: red

oration:
- Dieu éternel et tout-puissant, tu choisis les créatures les plus faibles pour confondre les puissances du monde ; tandis que nous célébrons l’anniversaire du martyre de sainte Agnès, accorde-nous d’imiter sa fermeté dans la foi.

readings:
  hymn:
  - comme-sous-la-neige
  patristicReading:
  - title: HOMÉLIE DE SAINT AMBROISE POUR LA FÊTE DE SAINTE AGNÈS
    subtitle: 21 janvier 376
    content: |-
      C’est aujourd’hui l’anniversaire d’une vierge, imitons sa pureté. C’est l’anniversaire d’une martyre, offrons un sacrifice. C’est l’anniversaire de sainte Agnès. ~ Selon la tradition, elle a subi le martyre à douze ans. Qu’elle est détestable, la cruauté qui n’a même pas épargné une si petite fille ! Mais combien la foi est grande pour avoir reçu témoignage d’un âge aussi tendre !
      Ce petit corps offrait donc assez de place aux blessures ! Et celle qui n’avait presque rien à leur offrir a eu de quoi les vaincre. Alors que les petites filles, à cet âge, ne peuvent supporter les visages sévères de leurs parents et, lorsqu’elles se sont piquées avec une aiguille, pleurent comme si elles s’étaient blessées !
      Celle-ci n’éprouve aucune crainte entre les mains sanglantes des bourreaux, elle ne bouge pas en entendant les grincements des lourdes chaînes que l’on tire, et voici qu’elle présente son corps à l’épée d’un soldat furieux. Elle ne sait pas encore ce que c’est que mourir, mais elle y est prête. Et si on l’entraîne de force vers les autels, voilà qu’elle tend les mains vers le Christ à travers les flammes ; jusque dans ce foyer sacrilège, elle fait le signe qui glorifie le Seigneur victorieux. Voici qu’on introduit son cou et ses deux mains dans des liens de fer, mais aucune chaîne ne pouvait serrer des membres aussi menus.
      Est-ce un nouveau genre de martyre ? Elle n’est pas encore capable de souffrir et elle est déjà mûre pour vaincre ; il lui est difficile de combattre, et facile de triompher ; alors qu’elle supportait le handicap de son jeune âge, elle a réalisé un chef-d’œuvre de vaillance. Elle ne se serait pas hâtée vers la chambre nuptiale le jour de son mariage, comme elle s’est avancée d’un pas joyeux, étant vierge, au lieu de son supplice ; c’est le Christ qui était l’ornement de sa tête, et non pas une coiffure compliquée ; elle n’était pas couronnée de fleurs, mais de vertus.
      Tout le monde pleure, elle n’a pas une larme. La plupart s’étonnent de lui voir, si facilement répandre une vie à laquelle elle n’avait pas encore goûté, et la donner comme si elle en avait atteint le terme. Tous sont stupéfaits de ce qu’elle se montre témoin de la divinité alors que, en raison de son âge, elle ne pouvait encore décider d’elle-même. Bref, on l’a crue au sujet de Dieu, alors qu’on ne l’aurait pas encore crue au sujet d’un homme. Car ce qui est au-delà de la nature vient du Créateur de la nature.
      Quelles menaces son bourreau a-t-il employées pour lui faire peur, quelles flatteries pour la fléchir, combien de promesses pour lui faire accepter de l’épouser ! Mais elle : « C’est faire injure à mon époux d’attendre celui qui doit me plaire. Celui qui le premier m’a choisie, c’est lui qui me recevra. Pourquoi traînes-tu, exécuteur ? Qu’il périsse, le corps qui peut être aimé pour avoir charmé les yeux, ce que je refuse ». Elle se leva, pria, tendit le cou.
      Vous auriez vu le bourreau tressaillir comme s’il était le condamné, la main de l’exécuteur trembler et son visage pâlir par la crainte du coup infligé à un autre, alors que la jeune fille ne craignait rien pour elle-même. Vous avez donc, avec une seule victime, un double martyre : celui de la pureté et celui de la foi. Elle a gardé sa virginité et elle a obtenu le martyre.
    responsory: |-
      R/ C’est du ciel que vient la force !

      Ma grâce te suffit, dit le Seigneur,
      car ma puissance se déploie dans la faiblesse.

      Je me vanterai surtout de mes faiblesses,
      afin que repose sur moi la puissance du Christ.

      La folie de Dieu est plus sage que les hommes
      et la faiblesse de Dieu, plus forte que les hommes.

morning:
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - En signe d’alliance, mon Seigneur Jésus Christ m’a donné un anneau ; comme une épouse il m’a couronnée.
  - psalm: OT_41
    antiphon:
    - Je suis fiancée à celui que servent les anges, soleil et lune admirent sa beauté.
  - psalm: PSALM_149
    antiphon:
    - |-
      Réjouissez-vous de ma joie : je suis entrée dans la lumière.
  reading:
    biblicalReference: 2Co 1,3-5
    content: Béni soit Dieu, le Père de notre Seigneur Jésus Christ, le Père plein de tendresse, le Dieu de qui vient tout réconfort. Dans nos détresses, il nous réconforte ; ainsi, nous pouvons réconforter tous ceux qui sont dans la détresse, grâce au réconfort que nous recevons nous-mêmes de Dieu. De même que nous avons largement part aux souffrances du Christ, de même, par le Christ, nous sommes largement réconfortés.
  responsory: |-
    R/ Que notre sacrifice, en ce jour,
    trouve grâce devant toi.
    V/ Nous te suivons et nous cherchons ta face. R/
    V/ À toi, louange et gloire éternellement. R/
  evangelicAntiphon:
    common:

    - Ce que j’ai désiré, je le vois ; ce que j’espérais, je le tiens ; je suis unie dans le ciel à celui que j’aimais sur la terre.
vespers:
  psalmody:
  - psalm: PSALM_114
    antiphon:
    - Agnès s’était donnée au Christ, rien n’ébranlait sa foi, ni les menaces, ni les promesses.
  - psalm: PSALM_115
    antiphon:
    - À lui seul je garde ma foi, à lui j’appartiens sans réserve.
  - psalm: NT_9
    antiphon:
    - |-
      Je te bénis, Père de mon Seigneur Jésus Christ : par lui tu m’as donné la victoire.
  reading:
    biblicalReference: 1 P 4, 13-14
    content: Puisque vous communiez aux souffrances du Christ, réjouissez-vous, afin d’être dans la joie et l’allégresse quand sa gloire se révélera. Si l’on vous insulte à cause du nom du Christ, heureux êtes-vous, puisque l’Esprit de gloire, l’Esprit de Dieu, repose sur vous.
  responsory: |-
    R/ Allégresse pour qui s’abrite en toi,
    joie éternelle !
    V/ Tu les protèges, en toi ils exultent. R/
    V/ Tu bénis ceux qui aiment ton nom. R/
  evangelicAntiphon:
    common:
    - Je viens à toi, Père très saint, à toi que j’ai aimé, que j’ai cherché et toujours désiré.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu choisis ce qui est faible dans le monde
    >pour couvrir de confusion ce qui est fort ;
    alors que nous célébrons la naissance au ciel
    >de la bienheureuse Agnès ta martyre, *
    accorde-nous, dans ta bienveillance,
    >d’imiter sa fermeté de sa foi. /
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 1 Co 1, 26-31
      headline: « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        voilà ce que Dieu a choisi,
        pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        lui qui est devenu pour nous sagesse venant de Dieu,
        justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        Celui qui veut être fier,
        qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      refAbbr: cf. 22, 1
      chorus:
      - chorusRef: cf. 22, 1
        chorus: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi :
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 13, 44-46
      headline: « Il va vendre tout ce qu’il possède, et il achète ce champ »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là,
        Jésus disait aux foules :
        « Le royaume des Cieux est comparable
        à un trésor caché dans un champ ;
        l’homme qui l’a découvert le cache de nouveau.
        Dans sa joie, il va vendre tout ce qu’il possède,
        et il achète ce champ.
        Ou encore :
        Le royaume des Cieux est comparable
        à un négociant qui recherche des perles fines.
        Ayant trouvé une perle de grande valeur,
        il va vendre tout ce qu’il possède,
        et il achète la perle. »
        Acclamons la Parole de Dieu.
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null