celebration:
  title: Saint Louis de Gonzague
  subtitle: religieux
  description: Louis de Gonzague (1568-1591) mourut à vingt-trois ans pour avoir pris un pestiféré sur ses épaules. C’était le couronnement d’une vie qui, du château de Castiglione au noviciat des Jésuites de Rome, s’était déroulée toute droite. Mais cette rectitude avait été acquise au prix d’un effort héroïque de maîtrise de soi par fidélité au plus haut amour.
  commons:
    - saints-male_religious
  color: white

oration:
  - Seigneur, dispensateur des dons spirituels, tu as réuni dans le jeune Louis de Gonzague la pratique de la pénitence et une admirable pureté de vie ; si nous n’avons pas la même innocence, accorde-nous, à sa prière et par ses mérites, d’imiter son renoncement.

readings:
  patristicReading:
    - title: DERNIÈRE LETTRE DE SAINT LOUIS DE GONZAGUE À SA MÈRE
      subtitle: (10 juin 1591)
      content: |-
        J’implore pour vous, Madame, la grâce et la consolation constantes du Saint-Esprit. Sans doute, lorsqu’on m’a remis votre lettre, j’étais encore dans cette région des morts. Mais maintenant, eh bien, il faut aspirer au ciel, pour que nous puissions louer le Dieu éternel sur la terre des vivants. J’espérais depuis longtemps que j’accomplirais ce voyage plus tôt. Si la charité consiste, comme dit saint Paul, à pleurer avec ceux qui pleurent, à être joyeux avec ceux qui sont dans la joie, il est nécessaire, ma mère, que vous puisiez une immense joie dans le fait que, par bonté et par faveur envers vous, le Seigneur m’annonce la véritable allégresse et la paix, puisque je ne crains plus de jamais le perdre.
        Je vous l’avouerai, lorsque je médite sur la bonté divine, comparable à la mer qui est sans fond et sans rivage, mon âme tombe dans un abîme ; engloutie dans une telle immensité, elle me paraît s’égarer et ne savoir que répondre : comment ! le Seigneur, après un travail si bref et si mince, m’invite à l’éternel repos ! Du ciel, il m’appelle à la félicite infinie que j’ai recherchée avec tant de négligence, il veut récompenser les larmes que j’ai versées avec tant de parcimonie.
        Pensez-y toujours, Madame, et prenez garde d’offenser cette bonté infinie de Dieu : c’est ce qui arriverait si vous pleuriez comme un mort celui qui va vivre en présence de Dieu et qui, par sa prière, vous aidera beaucoup plus dans vos affaires qu’il ne le ferait en cette vie. Notre séparation ne durera pas longtemps ; nous nous reverrons au ciel ; nous serons unis ensemble à l’auteur de notre salut ; de tout l’élan de notre âme, nous le louerons et nous chanterons éternellement ses miséricordes, en jouissant d’un bonheur éternel. Le Seigneur nous reprend ce qu’il nous avait prêté sans autre intention que de nous mettre dans un séjour plus tranquille et plus sûr et de nous combler des biens que nous désirions pour nous-mêmes.
        Si je dis tout cela, c’est seulement pour céder à un désir qui me possède : que vous, Madame, et tout le reste de la famille, vous teniez mon départ pour un joyeux bienfait ; et que vous accompagniez de votre bénédiction maternelle celui qui fait cette traversée, jusqu’à ce que vous abordiez vous-même au rivage où résident toutes mes espérances. Je l’ai fait d’autant plus volontiers qu’il ne me restait plus rien à faire que de vous témoigner de la façon la plus évidente l’amour et le respect que je vous dois, comme un fils à sa mère.
      responsory: |-
        R/ Vers toi j’ai les yeux levés,
        Seigneur qui te tiens au ciel.
        
        Le jour du Seigneur arrive
        comme un voleur en pleine nuit.
        
        Vous qui êtes enfants de la lumière,
        enfants du jour, restez éveillés et sobres.
        
        Toujours joyeux, priez sans cesse,
        en toute condition, soyez dans l’action de grâce.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Ps 23,4.3
    content: |-
      L’homme au cœur pur, aux mains innocentes,
      celui-là peut gravir la montagne du Seigneur
      >et se tenir dans le lieu saint.
  collect:
  - |-
    Seigneur Dieu, source de tous les dons spirituels, +
    >tu as uni en saint Louis de Gonzague
    >la pratique de la pénitence
    >et une admirable pureté de vie ; *
    nous n’avons pas la même innocence,
    >mais accorde-nous, à sa prière et par ses mérites, /
    >d’imiter son renoncement.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 1Jn 5, 1-5
      headline: « La victoire remportée sur le monde, c’est notre foi »
      content: |-
        Bien-aimés,
        celui qui croit que Jésus est le Christ,
        celui-là est né de Dieu ;
        celui qui aime le Père qui a engendré
        aime aussi le Fils qui est né de lui.
        Voici comment nous reconnaissons
        que nous aimons les enfants de Dieu :
        lorsque nous aimons Dieu
        et que nous accomplissons ses commandements.
        Car tel est l’amour de Dieu :
        garder ses commandements ;
        et ses commandements ne sont pas un fardeau,
        puisque tout être qui est né de Dieu
        est vainqueur du monde.
        Or la victoire remportée sur le monde,
        c’est notre foi.
        Qui donc est vainqueur du monde ?
        N’est-ce pas celui qui croit
        que Jésus est le Fils de Dieu ?
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 22, 34-40
      headline: « Tu aimeras le Seigneur ton Dieu de tout ton cœur, et ton prochain comme toi-même »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        les pharisiens,
        apprenant que Jésus avait fermé la bouche aux sadducéens,
        se réunirent,
        et l’un d’entre eux, un docteur de la Loi, posa une question à Jésus
        pour le mettre à l’épreuve :
        « Maître, dans la Loi,
        quel est le grand commandement ? »
        Jésus lui répondit :
        « Tu aimeras le Seigneur ton Dieu
        de tout ton cœur,
        de toute ton âme et de tout ton esprit.
        Voilà le grand, le premier commandement.
        Et le second lui est semblable :
        Tu aimeras ton prochain comme toi-même.
        De ces deux commandements dépend toute la Loi,
        ainsi que les Prophètes. »
        
  offeringPrayer:
  - |-
    Fais que nous prenions place à ton banquet, Seigneur,
    portant toujours le vêtement de noce
    comme saint Louis de Gonzague, *
    afin que la participation à cette eucharistie /
    >nous enrichisse de ta grâce.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Ps 77,24-25
    content: |-
      Le Seigneur donne à son peuple le froment du ciel ;
      >chacun se nourrit du pain des Forts.
  prayerAfterCommunion:
  - |-
    Après nous avoir nourris du pain des anges, Seigneur,
    >donne-nous de te servir par une vie très pure ; *
    >à l’exemple de celui que nous fêtons aujourd’hui, /
    puissions-nous rester toujours dans l’action de grâce.
    Par le Christ, notre Seigneur.