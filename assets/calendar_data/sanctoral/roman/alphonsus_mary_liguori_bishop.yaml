celebration:
  title: Saint Alphonse-Marie de Liguori
  subtitle: évêque et docteur de l’Église
  description: |-
    Alphonse Marie de Liguori (1696 1787) était napolitain. Il se fit prêtre et il exerça la charge épiscopale pour annoncer l’amour du Christ. Prédicateur infatigable, confesseur plein de bonté, il fonda la Congrégation du Saint Rédempteur en vue d’évangéliser les campagnes (1732). Son enseignement de moraliste et ses écrits spirituels eurent une large audience.
  color: white
  commons:
    - pastors_bishop
    - pastors_doctors

readings:
  patristicReading:
    - title: TRAITÉ DE L’AMOUR DE JÉSUS CHRIST PAR SAINT ALPHONSE-MARIE
      content: |-
        Toute la sainteté de l’âme et sa perfection réside dans l’amour envers Jésus Christ, notre Dieu, notre souverain bien et notre rédempteur. C’est la charité qui rassemble et protège toutes les vertus qui rendent parfait.
        Est-ce que Dieu ne mérite pas tout notre amour ? Il nous a aimés dès l’éternité. « Considère, nous dit-il, que j’ai été le premier à t’aimer. Tu n’avais pas encore vu le jour, le monde lui-même n’existait pas, et moi je t’aimais déjà. Je t’aime du fait même que je suis ».
        Comme Dieu savait que l’homme se laisse attirer par des bienfaits, il a voulu l’obliger à l’aimer par ses dons : « Ces filets, auxquels les hommes se laissent prendre, je veux les y attirer pour qu’ils m’aiment, car ce sont des liens d’amour. » Il lui a donné une âme dotée, à son image, de mémoire, d’intelligence et de volonté ; il lui a donné un corps pourvu d’organes sensibles ; c’est encore pour lui qu’il a créé le ciel et la terre avec tout ce qu’ils contiennent. C’est par amour de l’homme qu’il a créé tout cela, afin que toutes ces créatures soient au service de l’homme, et que l’homme lui donne son amour à cause de tant de bienfaits.
        Mais il n’a pas voulu nous donner seulement ces belles créatures ; pour obtenir notre amour, il est allé jusqu’à se livrer lui-même tout entier à nous. Le Père éternel est allé jusqu’à nous donner son Fils unique. Nous voyant morts par suite du péché et privés de sa grâce, qu’a-t-il fait ? Emporté par son immense amour, ou plutôt, suivant la parole de l’Apôtre, %par son trop grand amour pour nous%, il a envoyé son Fils bien-aimé, afin qu’il satisfasse pour nous et nous rappelle à la vie que le péché nous avait enlevée.
        En livrant son Fils, qu’il a sacrifié afin de nous pardonner, il nous a prodigué tous les biens ensemble : la grâce, la charité, le paradis ; car tous ces biens sont sans nul doute inférieurs à son Fils : %Celui qui n’a pas refusé même son propre Fils, mais qui l’a livré pour nous tous, comment pourrait-il avec lui ne pas nous donner tout ?%
      responsory: |-
        R/ Dieu a tant aimé le monde,
        qu’il a donné son Fils unique !

        Ce n’est pas nous qui avons aimé Dieu :
        lui, le premier, nous a aimés.

        Son Fils, son unique, il l’a offert
        pour les péchés du monde entier.

        À tous ceux qui croient au Christ,
        il donne la vie éternelle.

oration:
  - Seigneur qui ne cesses d’éveiller dans ton Église de nouveaux modèles de vertu, fais-nous suivre les exemples de saint Alphonse de Liguori, remplis-nous d’ardeur pour le salut de nos frères, et nous obtiendrons comme lui le bonheur du ciel.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu,
    >toi qui toujours suscites en ton Église
    >de nouveaux exemples de vertu, +
    fais-nous marcher avec ardeur pour le salut des âmes
    >sur les traces de l’évêque saint Alphonse-Marie de Liguori, *
    afin que nous obtenions comme lui /
    la récompense du ciel.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 8, 1-4
      headline: |-
        « La loi de l’Esprit qui donne la vie dans le Christ Jésus t’a libéré de la loi du péché et de la mort »
      content: |-
        Frères,
        pour ceux qui sont dans le Christ Jésus,
        >il n’y a plus de condamnation.
        Car la loi de l’Esprit qui donne la vie dans le Christ Jésus
        >t’a libéré de la loi du péché et de la mort.
        En effet, quand Dieu a envoyé son propre Fils
        >dans une condition charnelle semblable à celle des pécheurs
        >pour vaincre le péché,
        il a fait ce que la loi de Moïse
        >ne pouvait pas faire à cause de la faiblesse humaine :
        >il a condamné le péché dans l’homme charnel.
        Il voulait ainsi que l’exigence de la Loi s’accomplisse en nous,
        >dont la conduite n’est pas selon la chair mais selon l’Esprit.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 118 (119), 9-10, 11-12, 13-14
      refAbbr: 118, 9…
      chorus:
      - chorusRef: 118, 12b
        chorus: |-
          Apprends-moi, Seigneur, tes commandements.
      content: |-
        Comment, jeune, garder pur son chemin ?
        En observant ta parole.
        De tout mon cœur, je te cherche ;
        garde-moi de fuir tes volontés.

        Dans mon cœur, je conserve tes promesses
        pour ne pas faillir envers toi.
        Toi, Seigneur, tu es béni :
        apprends-moi tes commandements.

        Je fais repasser sur mes lèvres
        chaque décision de ta bouche.
        Je trouve dans la voie de tes exigences
        plus de joie que dans toutes les richesses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 13-19
      headline: |-
        « Vous êtes la lumière du monde »
      acclamationAntiphon: |-
        Que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Vous êtes le sel de la terre.
        Mais si le sel devient fade,
        >comment lui rendre de la saveur ?
        Il ne vaut plus rien :
        >on le jette dehors et il est piétiné par les gens.
        Vous êtes la lumière du monde.
        Une ville située sur une montagne
        >ne peut être cachée.
        Et l’on n’allume pas une lampe
        >pour la mettre sous le boisseau ;
        on la met sur le lampadaire,
        >et elle brille pour tous ceux qui sont dans la maison.
        De même, que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        >ils rendront gloire à votre Père qui est aux cieux.
        Ne pensez pas que je sois venu abolir la Loi ou les Prophètes :
        >je ne suis pas venu abolir, mais accomplir.
        Amen, je vous le dis :
        Avant que le ciel et la terre disparaissent,
        >pas un seul iota, pas un seul trait ne disparaîtra de la Loi
        >jusqu’à ce que tout se réalise.
        Donc, celui qui rejettera
        >un seul de ces plus petits commandements,
        et qui enseignera aux hommes à faire ainsi,
        >sera déclaré le plus petit dans le royaume des Cieux.
        Mais celui qui les observera et les enseignera,
        >celui-là sera déclaré grand dans le royaume des Cieux. »
  offeringPrayer:
  - |-
    Dans ta bonté, Seigneur, +
    >brûle nos cœurs du feu céleste de l’Esprit, *
    >toi qui as donné à saint Alphonse-Marie
    >la grâce de célébrer ces mystères /
    >et, par eux, de s’offrir lui-même en sacrifice vivant et saint.
    Par le Christ, notre Seigneur.
  communionAntiphon: null
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >tu as fait de saint Alphonse-Marie
    >un intendant fidèle
    >et le prédicateur du grand mystère que nous célébrons ; *
    accorde-nous d’y communier souvent /
    >et, par cette communion, de te bénir à jamais.
    Par le Christ, notre Seigneur.