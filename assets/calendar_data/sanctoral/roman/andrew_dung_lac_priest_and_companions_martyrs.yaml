celebration:
  title: Saints André Dung-Lac, prêtre et ses compagnons
  subtitle: martyrs
  description: Au début du XVI^ème siècle, la première annonce de l’Évangile fut accueillie par le peuple vietnamien et fécondée dans le sang versé et la joie spirituelle des nouveaux baptisés. Durant les siècles suivants, en particulier sous le règne de l’empereur Minh-Mang (1820-1840), de nombreux chrétiens se signalèrent par leur martyre. Au nom de leur foi chrétienne et de leur fidélité à la croix du Seigneur, des évêques, des prêtres, des religieux et religieuses, des catéchistes et aussi des fidèles laïcs durent subir toutes sortes de tourments, devenant ainsi les témoins de l’Église et de la vraie religion. Cent dix-sept d’entre eux sont honorés comme martyrs, dont un évêque et neuf prêtres des Missions Étrangères de Paris, le plus connu étant Saint Jean-Théophane Venard.
  commons:
    - martyrs
  color: red

oration:
  - Seigneur notre Dieu, source et origine de toute paternité, toi qui as donné aux saints martyrs André et ses compagnons la grâce d’être fidèles à la croix de ton Fils jusqu’à l’effusion de leur sang, accorde-nous, par leur intercession, de savoir annoncer aux autres ton amour afin de pouvoir être appelés fils de Dieu et de l’être vraiment. Par Jésus Christ.

readings:
  patristicReading:
    - title: LETTRE DE SAINT PAUL LE-BAO-TINH AUX SÉMINARISTES DE KE-VINH (1843)
      content: |-
        Moi, Paul, lié de chaînes pour le Christ, je veux vous raconter les tribulations dans lesquelles je suis chaque jour enseveli, afin qu’embrasés de l’amour divin, vous bénissiez avec moi le Seigneur, %parce que dans tous les siècles est sa miséricorde%.
        Cette prison est vraiment une vive figure de l’enfer éternel. Aux liens, aux cangues et aux entraves viennent s’ajouter des colères, des vengeances, des malédictions, des conversations impures, des rixes, des actes mauvais, des serments injustes, des médisances, auxquels se joignent aussi l’ennui et la tristesse. Mais celui qui a déjà délivré les trois enfants des flammes ardentes est aussi demeuré avec moi ; il m’a délivré de ces maux et il me les convertit en douceur, parce que %dans tous les siècles est sa miséricorde%.
        Par la grâce de Dieu, au milieu de ces supplices qui ont coutume d’attrister les autres, je suis rempli de gaieté et de joie, parce que je ne suis pas seul, mais le Christ est avec moi. C’est lui, notre Maître, qui supporte tout le poids de cette croix ; pour moi, mes amis, je n’en ai à soutenir que la plus légère extrémité. Car non seulement il est spectateur du combat, mais encore il est combattant et vainqueur, et c’est lui qui consomme la lutte. C’est pourquoi la couronne de gloire est posée sur son chef, mais le membre peut aussi se réjouir de la gloire de la tête.
        Comment puis-je vivre, voyant chaque jour les tyrans et leurs satellites infidèles blasphémer ton saint nom, toi, Seigneur, qui es assis au milieu des Chérubins et des Séraphins ? Vois ta croix foulée aux pieds des mécréants.
        Où est ta gloire ? À cette vue, enflammé de ton amour, j’aime mieux mourir et que mes membres soient coupés en morceaux en témoignage de mon amour pour toi, Seigneur.
        Montre ta puissance, délivre-moi et aide-moi, afin que dans ma faiblesse, ta force se fasse sentir et soit glorifiée devant le monde, pour que tes ennemis ne lèvent pas la tête, si je suis ébranlé.
        En entendant ces choses, vous rendrez, remplis de joie, d’immortelles actions de grâces à Dieu, auteur de tous les dons, et vous le bénirez avec moi, parce que %dans tous les siècles est sa miséricorde%. %Mon âme glorifie le Seigneur et mon esprit a tressailli d’allégresse, parce que Dieu a regardé l’humilité de% son serviteur, désormais toutes les générations futures me diront bienheureux parce que %dans tous les siècles est sa miséricorde%.
        %Louez le Seigneur, toutes les nations : louez-le, tous les peuples%, parce qu’%il a choisi ce qui est faible pour confondre ce qui est fort, il a choisi ce qui est vil pour détruire ce qui est noble%, et par ma bouche, son esprit a confondu les philosophes, parce que %dans tous les siècles est sa miséricorde%.
        Je vous écris ces choses pour que nous unissions votre foi et la mienne : au milieu de ces tempêtes, je jette une ancre qui va jusqu’au trône de Dieu ; c’est l’espérance qui vit toujours en mon cœur. Pour vous, mes bien-aimés, %courez de telle sorte que vous remportiez la couronne%, prenez %l’armure de Dieu à droite et à gauche% ; revêtez-vous de la cuirasse de la foi, comme l’ordonne mon patron, saint Paul ; %il vaut mieux, pour vous, entrer borgnes et infirmes dans le royaume des cieux% que d’être jetés dehors, ayant vos membres entiers.
        Aidez-moi de vos prières pour que je combatte légitimement, que %je combatte le bon combat% et que je combatte jusqu’à la fin, pour achever heureusement ma course, afin que, si dans cette vie nous ne pouvons plus nous voir mutuellement, dans le siècle futur nous ayons ce bonheur à jamais, tout près du trône de l’Agneau immaculé, et qu’ainsi nous le louions dans la joie et l’exaltation dans les siècles. Ainsi soit-il.

      responsory: |-
        R/ Fixons notre regard sur Jésus crucifié !

        C’est Jésus qui nous donne de croire,
        c’est lui qui conduit à son terme la foi.

        Tenons ferme dans l’épreuve,
        puisqu’il est avec nous.

        La Passion du Christ,
        voilà notre force et notre victoire.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ga 6,14a ; 1 Co 1,18
    content: |-
      Que la croix de notre Seigneur Jésus Christ
      >soit notre seule fierté.
      Le langage de la croix est puissance de Dieu
      >pour ceux qui vont vers leur salut.
  collect:
  - |-
    Seigneur Dieu,
    >source et origine de toute paternité, +
    >tu as donné aux saints martyrs André et ses compagnons
    >la grâce d’être fidèles à la croix de ton Fils
    >jusqu’à l’effusion de leur sang ; *
    accorde-nous, par leur intercession,
    >de propager ton amour parmi nos frères, /
    afin de pouvoir être appelés fils de Dieu
    >et de l’être vraiment.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 17-25
      headline: « Nous proclamons un Messie crucifié, folie pour les nations païennes »
      content: |-
        Frères,
        le Christ ne m’a pas envoyé pour baptiser,
        >mais pour annoncer l’Évangile,
        et cela sans avoir recours au langage de la sagesse humaine,
        >ce qui rendrait vaine la croix du Christ.
        Car le langage de la croix est folie
        >pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous,
        >il est puissance de Dieu.
        L’Écriture dit en effet :
        >Je mènerai à sa perte la sagesse des sages,
        >et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ? Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde,
        >Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        >le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        >par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        >et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        >scandale pour les Juifs,
        >folie pour les nations païennes.
        Mais pour ceux que Dieu appelle,
        >qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        >et ce qui est faiblesse de Dieu est plus fort que les hommes.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 123 (124), 2-3, 4-5, 6a.7cd-8
      refAbbr: 123, 7ab
      chorus:
      - chorusRef: 123, 7ab
        chorus: |-
          Comme un oiseau, nous avons échappé
          au filet du chasseur.
      content: |-
        Sans le Seigneur qui était pour nous
        quand des hommes nous assaillirent,
        alors ils nous avalaient tout vivants,
        dans le feu de leur colère.

        Alors le flot passait sur nous,
        le torrent nous submergeait ;
        alors nous étions submergés
        par les flots en furie.

        Béni soit le Seigneur !
        Le filet s’est rompu : nous avons échappé.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 17-22
      headline: '« Vous serez conduits devant des gouverneurs et des rois à cause de moi : il y aura là un témoignage pour eux et pour les païens »'
      acclamationAntiphon: |-
        Si l’on vous insulte pour le nom du Christ,
        heureux êtes-vous :
        l’Esprit de Dieu repose sur vous.
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Méfiez-vous des hommes :
        ils vous livreront aux tribunaux
        et vous flagelleront dans leurs synagogues.
        Vous serez conduits devant des gouverneurs et des rois
        à cause de moi :
        il y aura là un témoignage pour eux et pour les païens.
        Quand on vous livrera,
        ne vous inquiétez pas
        de savoir ce que vous direz ni comment vous le direz :
        ce que vous aurez à dire
        vous sera donné à cette heure-là.
        Car ce n’est pas vous qui parlerez,
        c’est l’Esprit de votre Père qui parlera en vous.
        Le frère livrera son frère à la mort,
        et le père, son enfant ;
        les enfants se dresseront contre leurs parents
        et les feront mettre à mort.
        Vous serez détestés de tous à cause de mon nom ;
        mais celui qui aura persévéré jusqu’à la fin,
        celui-là sera sauvé. »
  offeringPrayer:
  - |-
    Reçois, Père très saint,
    >les offrandes que nous te présentons
    >en célébrant les saints martyrs du Vietnam, *
    pour qu’au milieu des difficultés de notre vie,
    >nous puissions être trouvés toujours fidèles /
    >et nous offrir à toi en sacrifice qui te plaise.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Mt 5,10
    content: |-
      Heureux ceux qui sont persécutés pour la justice,
      >car le royaume des Cieux est à eux !
  prayerAfterCommunion:
  - |-
    Nourris et fortifiés par un même pain
    en la fête de tes saints martyrs,
    >nous te supplions, Seigneur : *
    garde-nous unis dans ton amour, /
    >afin que nous obtenions la récompense éternelle,
    >promise à ceux qui souffrent pour toi.
    Par le Christ, notre Seigneur.