celebration:
  title: Saint André Kim Tae-gon, prêtre, saint Paul Choung Ha-sang et leurs compagnons
  subtitle: martyrs
  description: Au début du XVII^ème siècle, grâce à quelques laïcs, la foi chrétienne s’introduisit en Corée. Une communauté prit naissance, courageuse et fervente, sans pasteurs, conduite seulement par des laïcs jusqu’en 1836 où les premiers missionnaires venus de France purent entrer en cachette dans le pays. Cette communauté connut la persécution en 1839, 1846 et 1866 ; parmi les 103 saints martyrs, il faut compter en premier lieu André Kim Taegon, prêtre et ardent missionnaire, et Paul Chong Hasang, apôtre laïc, ainsi que trois évêques et sept prêtres des Missions Étrangères de Paris. Les autres sont pour la plupart des laïcs, hommes et femmes, mariés ou non, vieillards, jeunes et enfants, qui ont consacré par leur sang les débuts féconds de l’Église coréenne.
  commons:
    - martyrs
  color: red

oration:
  - Dieu, créateur et sauveur de toutes les nations, tu as appelé le peuple de Corée à la foi catholique pour qu’il entre dans le peuple de tes fils, et tu l’as fait grandir par le glorieux témoignage de tes saints martyrs André, Paul et leurs compagnons ; à leur exemple et à leur prière, accorde-nous de persévérer, nous aussi, jusqu’à la mort, dans la fidélité à tes commandements. Par Jésus Christ.

readings:
  patristicReading:
    - title: DERNIÈRE EXHORTATION DE SAINT ANDRÉ KIM TAE-GON
      content: |-
        Frères et amis très chers, pensez et repensez à ceci : depuis le commencement des temps, Dieu a disposé le ciel, la terre et toute chose ; réfléchissez pourquoi et dans quelle intention il a créé l’homme, chaque homme, à son image et à sa ressemblance.
        Si donc en ce monde rempli de dangers et de misère nous ne connaissons pas le Seigneur notre créateur, à quoi bon être nés ! Notre vie est inutile. Grâce à Dieu, nous sommes venus au monde. Grâce à Dieu également, nous avons reçu le baptême, nous sommes entrés dans l’Église, et, devenus disciples du Seigneur, nous portons un nom glorieux. Mais à quoi enfin servirait ce nom s’il ne recouvre pas la réalité ? Sinon, c’est en vain que nous serions venus au monde, que nous serions entrés dans l’Église. Bien plus, cela ne servirait pas le Seigneur et sa grâce. Il serait mieux pour nous de n’être pas nés que de recevoir la grâce du Seigneur et de pécher contre lui.
        Voyez le paysan qui fait les semailles dans son champ : au temps convenable, il laboure la terre, puis il y met de l’engrais, et sans regarder à sa peine sous le soleil il cultive avec soin la semence. Quand le temps de la moisson est arrivé, si les épis sont gonflés, il oublie sa peine et sa sueur, son cœur est dans la joie et il se félicite de la récolte. Mais si le grain est maigre, s’il n’y a rien d’autre que paille et épis vides, le paysan se souvient de son dur travail et de sa sueur et plus il avait travaillé ce champ, plus il le délaisse.
        Il en va ainsi du Seigneur : la terre, c’est son champ ; nous les hommes, la semence ; la grâce, l’engrais. Par l’incarnation et la rédemption, il nous arrose de son sang pour que nous grandissions et que nous parvenions à maturité. Quand viendra le temps de la moisson au jour du jugement, si, par grâce, nous sommes trouvés mûrs, nous connaîtrons la joie du royaume des cieux comme des fils adoptifs de Dieu ; mais si nous ne sommes pas trouvés mûrs, nous serons devenus ennemis de Dieu, de fils adoptifs que nous étions, et nous recevrons la punition éternelle que nous aurons méritée.
        Frères très chers, sachez-le : notre Seigneur Jesus, en venant ici-bas, a supporté lui-même des douleurs sans nombre, par sa passion il a fondé l’Église et par la passion de ses fidèles il la fait grandir. Les puissances de ce monde peuvent bien l’opprimer et l’attaquer, jamais elles ne pourront l’emporter sur elle. Après l’Ascension de Jésus, depuis le temps des Apôtres jusqu’à mainte nant, la sainte Église a grandi partout au milieu des persécutions.
        Voici maintenant cinquante ou soixante ans que la sainte Église est entrée dans notre Corée ; les fidèles ont supporté à plusieurs reprises la persécution. Aujourd’hui encore celle-ci recommence : de nombreux amis dans la foi et moi-même sommes en prison, et vous aussi vous êtes menaces. Puisque nous formons un seul corps, comment ne pas avoir le cœur en peine ? Comment ne pas ressentir humainement la douleur de la séparation ?
        Cependant, l’Écriture nous le dit, Dieu prend soin du moindre cheveu de notre tête, rien n’échappe à sa science infinie. Comment donc regarder cette persécution autrement que comme une permission du Seigneur, soit pour nous récompenser, soit pour nous punir ? Suivez donc la volonté de Dieu, combattez de tout cœur pour notre chef divin, Jésus, et vous vaincrez le démon de ce monde, déjà vaincu par le Christ.
        Je vous en conjure : n’oubliez pas l’amour fraternel, mais secourez-vous mutuellement et persévérez jusqu’à ce que le Seigneur ait pitié de nous et écarte la persécution.
        Nous sommes vingt ici et, grâce à Dieu, nous allons tous bien jusqu’à présent. Si quelqu’un est mis à mort, je vous conjure de ne pas oublier sa famille.
        J’aurais encore bien des choses à vous dire, mais comment m’exprimer par lettre ? Je termine donc. Pour nous d’ici peu nous irons au combat ; je vous supplie de vous garder dans la fidélité de manière à nous retrouver ensemble dans la joie du ciel. Je vous embrasse de tout cœur.

      responsory: |-
        R/ Le sang des martyrs est semence de chrétiens !
        
        Sans craindre les menaces,
        témoins du Christ,
        ils ont glorifié le Seigneur.
        
        Gens obscurs, ils sont dans la gloire,
        morts au monde, ils vivent à Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Sur la terre de Corée,
      >les martyrs ont versé leur sang pour le Christ ;
      aussi ont-ils reçu leur récompense dans le ciel.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as voulu que, par toute la terre,
    >se multiplient tes enfants d’adoption
    >et tu as fait que le sang des saints martyrs
    >André et ses compagnons
    >devienne une magnifique semence de chrétiens ; *
    >accorde-nous d’être fortifiés par leur secours /
    >et de progresser toujours à leur exemple.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Sg 3, 1-9
      headline: |-
        « Comme une offrande parfaite, il les accueille »
      content: |-
        Les âmes des justes sont dans la main de Dieu ;
        >aucun tourment n’a de prise sur eux.
        Aux yeux de l’insensé, ils ont paru mourir ;
        leur départ est compris comme un malheur,
        >et leur éloignement, comme une fin :
        mais ils sont dans la paix.
        Au regard des hommes, ils ont subi un châtiment,
        >mais l’espérance de l’immortalité les comblait.
        Après de faibles peines,
        >de grands bienfaits les attendent,
        car Dieu les a mis à l’épreuve
        >et trouvés dignes de lui.
        Comme l’or au creuset, il les a éprouvés ;
        >comme une offrande parfaite, il les accueille.
        Au temps de sa visite, ils resplendiront :
        >comme l’étincelle qui court sur la paille, ils avancent.
        Ils jugeront les nations, ils auront pouvoir sur les peuples,
        >et le Seigneur régnera sur eux pour les siècles.
        Qui met en lui sa foi comprendra la vérité ;
        >ceux qui sont fidèles resteront, dans l’amour, près de lui.
        Pour ses amis, grâce et miséricorde :
        >il visitera ses élus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 125 (126), 1-2ab, 2cd-3, 4-5, 6
      refAbbr: 125, 1…
      chorus:
      - chorusRef: cf. 125, 5
        chorus: |-
          Ceux qui sèment dans les larmes
          moissonnent dans la joie.
      content: |-
        Quand le Seigneur ramena les captifs à Sion,
        nous étions comme en rêve !
        Alors notre bouche était pleine de rires,
        nous poussions des cris de joie.

        Alors on disait parmi les nations :
        « Quelles merveilles fait pour eux le Seigneur ! »
        Quelles merveilles le Seigneur fit pour nous :
        nous étions en grande fête !

        Ramène, Seigneur, nos captifs,
        comme les torrents au désert.
        Qui sème dans les larmes
        moissonne dans la joie.

        Il s’en va, il s’en va en pleurant,
        il jette la semence ;
        il s’en vient, il s’en vient dans la joie,
        il rapporte les gerbes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 23-26
      headline: |-
        « Celui qui perdra sa vie à cause de moi la sauvera »
      acclamationAntiphon: |-
        Si l’on vous insulte pour le nom du Christ,
        heureux êtes-vous :
        l’Esprit de Dieu repose sur vous.
      content: |-
        En ce temps-là,
        Jésus disait à tous :
        >« Celui qui veut marcher à ma suite,
        >qu’il renonce à lui-même,
        >qu’il prenne sa croix chaque jour
        >et qu’il me suive.
        Car celui qui veut sauver sa vie
        >la perdra ;
        >mais celui qui perdra sa vie à cause de moi
        >la sauvera.
        Quel avantage un homme aura-t-il
        >à gagner le monde entier,
        >s’il se perd ou se ruine lui-même ?
        Celui qui a honte de moi et de mes paroles,
        >le Fils de l’homme aura honte de lui,
        >quand il viendra dans la gloire,
        >la sienne, celle du Père et des saints anges. »
  offeringPrayer:
  - |-
    Regarde avec bonté, Dieu tout-puissant,
    >les offrandes de ton peuple : *
    >à la prière de tes saints martyrs,
    >fais de nous-mêmes, pour le salut du monde entier, /
    >un sacrifice qui te plaise.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Mt 10,32
    content: |-
      Celui qui se prononcera pour moi devant les hommes,
      >dit le Seigneur,
      moi aussi, je me prononcerai pour lui
      >devant mon Père qui est aux cieux.
  prayerAfterCommunion:
  - |-
    Nourris du pain des forts
    >en la célébration de tes saints martyrs,
    >nous te supplions instamment, Seigneur : *
    >accorde-nous de rester fidèlement unis au Christ /
    >pour travailler dans l’Église au salut de tous.
    Par le Christ, notre Seigneur.