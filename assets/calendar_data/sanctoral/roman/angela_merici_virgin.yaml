celebration:
  title: Sainte Angèle Merici
  subtitle: vierge
  description: Angèle Merici (1470-1540) fonda à Brescia (Lombardie) l’ordre des Ursulines pour l’éducation des filles et les missions. Elle dota ses compagnes d’une règle qui ne comportait ni clôture, ni multiplicité de dévotions, mais la recherche des contacts humains dans la prudence et la charité.
  color: white
  commons:
    - virgins
    - saints-female_educator

oration:
  - |-
    Que la prière de sainte Angèle Merici nous recommande sans cesse à ta bonté, Seigneur : dociles à ses exemples de prudence et de charité, nous pourrons être fidèles à ton enseignement et en témoigner dans toute notre vie.

readings:
  patristicReading:
    - title: TESTAMENT SPIRITUEL DE SAINTE ANGÈLE
      content: |-
        Mes très douces mères et sœurs dans le Christ, efforcez-vous d’abord et à tout prix de concevoir de sages résolutions, avec l’aide de Dieu ; ainsi, guidées uniquement par l’amour de Dieu et le zèle du salut des âmes, vous entreprendrez votre tâche d’éducatrices.
        C’est seulement si elle est enracinée et fondée dans la charité qu’elle produira des fruits de salut, car notre Sauveur l’a dit : %Un bon arbre ne peut produire de mauvais fruits%. Un bon arbre, dit-il, c’est-à-dire un cœur bon, animé par la charité, ne peut produire que des œuvres saintes et bonnes. C’est pourquoi saint Augustin disait : « Aime et fais ce que tu veux. » Aie l’amour et la charité, et ensuite fais ce que tu veux, comme s’il disait nettement : « L’amour ne peut pas pécher. »
        Je vous demande encore de tenir compte de chacune de vos filles et de les porter comme gravées dans vos cœurs, non seulement par leurs noms, mais avec toute leur situation et leur état. Cela ne vous sera pas difficile si vous les entourez d’une charité vivante. En effet les mères selon la nature, auraient-elles mille enfants, les gardent tous et chacun fixés dans leur cœur, elles n’en oublient jamais aucun ; c’est l’œuvre en elles d’un très véritable amour. semble même que plus elles ont d’enfants, plus augmentent le souci et l’amour qu’elles ont de chacun. Bien davantage donc, celles qui sont mères selon l’esprit doivent et peuvent se comporter de même, parce que l’amour spirituel est plus puissant que celui qui procède de la communauté de sang.
        Par conséquent, mères qui m’êtes très chères, si vous aimez vos filles d’une charité vivante et sincère, il sera impossible que vous ne les ayez pas, toutes et chacune, gravées dans votre mémoire et votre cœur.
        Je vous demande encore d’essayer de les attirer par l’amour, l’indulgence et la charité, et non par la hauteur et la dureté. Soyez aimables pour toutes, du fond du cœur, comme il se doit, selon cette parole de mon Seigneur : %Apprenez de moi que je suis doux et humble de cœur%. Ainsi vous imiterez Dieu, dont il est écrit : %Il a tout disposé avec douceur%. Et Jésus dit encore : %Oui, mon joug est facile à porter, et mon fardeau léger%.
        Vous de même : avec toutes employez la douceur sous toutes ses formes. Prenez garde surtout qu’elles ne fassent pas par crainte ce que vous ordonnez. Dieu a donné à chacun la liberté, c’est pourquoi il ne force personne. Il se contente de montrer, d’appeler, de persuader. Parfois, il faudra montrer une autorité plus sévère, à bon escient et en tenant compte de l’état et des nécessités des personnes. Cependant, même alors, c’est seulement la charité qui doit nous pousser, ainsi que le zèle des âmes.

      responsory: |-
        R/ Enseigne-nous à bien compter nos jours,
        pour que nos cœurs découvrent la sagesse.

        Mon Dieu, tu m’as instruit dès ma jeunesse,
        jusqu’à présent j’ai redit tes merveilles.

        Tu m’enseignes la route de la vie,
        en ta présence la joie est sans mesure.

        Veille à mon chemin, qu’il ne soit fatal,
        et conduis-moi sur le chemin d’éternité.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Que la prière de sainte Angèle, vierge bienheureuse,
    >nous recommande sans cesse à ta bonté, Seigneur : *
    >pour que dociles à ses exemples de prudence et de charité,
    nous puissions être fidèles à ton enseignement /
    >et en témoigner dans toute notre vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 4, 7b-11
      headline: « Ce que chacun de vous a reçu comme don de la grâce, mettez-le au service des autres »
      content: |-
        Bien-aimés,
        soyez raisonnables et sobres
        >en vue de la prière.
        Avant tout, ayez entre vous une charité intense,
        >car la charité couvre une multitude de péchés.
        Pratiquez l’hospitalité les uns envers les autres
        >sans récriminer.
        Ce que chacun de vous a reçu comme don de la grâce,
        >mettez-le au service des autres,
        en bons gérants de la grâce de Dieu
        >qui est si diverse :
        si quelqu’un parle,
        >qu’il le fasse comme pour des paroles de Dieu ;
        celui qui assure le service,
        >qu’il s’en acquitte comme avec la force procurée par Dieu.
        Ainsi, en tout, Dieu sera glorifié par Jésus Christ,
        >à qui appartiennent la gloire et la souveraineté
        >pour les siècles des siècles. Amen.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 148, 1-2, 7a.11a.12, 13-14a
      refAbbr: cf. 148, 12a.13a
      chorus:
      - chorusRef: cf. 148, 12a.13a
        chorus: |-
          Alléluia !
          ou : Jeunes gens et jeunes filles,
          louez le nom du Seigneur.
      content: |-
        Louez le Seigneur du haut des cieux,
        louez-le dans les hauteurs.
        Vous, tous ses anges, louez-le,
        louez-le, tous les univers.

        Louez le Seigneur depuis la terre,
        les rois de la terre et tous les peuples,
        tous les jeunes gens et jeunes filles,
        les vieillards comme les enfants.

        Qu’ils louent le nom du Seigneur,
        le seul au-dessus de tout nom ;
        sur le ciel et sur la terre, sa splendeur :
        il accroît la vigueur de son peuple.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 9, 34b-37
      headline: « Quiconque accueille un enfant comme celui-ci, c’est moi qu’il accueille »
      acclamationAntiphon: |-
        Tu es béni, Père,
        Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits
        les mystères du Royaume !
      content: |-
        En ce temps-là,
        en chemin, les disciples avaient discuté entre eux
        pour savoir qui était le plus grand.
        S’étant assis, Jésus appela les Douze et leur dit :
        « Si quelqu’un veut être le premier,
        qu’il soit le dernier de tous et le serviteur de tous. »
        Prenant alors un enfant,
        il le plaça au milieu d’eux,
        l’embrassa, et leur dit :
        « Quiconque accueille en mon nom
        un enfant comme celui-ci,
        c’est moi qu’il accueille.
        Et celui qui m’accueille,
        ce n’est pas moi qu’il accueille,
        mais Celui qui m’a envoyé. »
        
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null