celebration:
  title: Saint Anschaire
  subtitle: évêque
  description: Oscar ou Anschaire (801-865), moine de Corbie, fut envoyé vers 826 en Saxe, d’où il organisa la pénétration de l’Évangile au Danemark, en Schleswig et en Suède. Les papes en firent un évêque de Hambourg (821), puis de Brême (847) et leur légat pour tous les Pays scandinaves.
  commons:
    - pastors
  color: white

oration:
  - Dieu, qui a envoyé l’évêque Aschaire évangéliser de nombreux peuples, accorde-nous, par son intercession, de marcher toujours à la lumière de ta vérité.

readings:
  patristicReading:
    - title: ACTES DU II^ème CONCILE VATICAN
      subtitle: L’activité missionnaire de l’Église
      content: |-
        La charge de répandre la foi incombe à tous les disciples du Christ, chacun pour sa part. Cependant, parmi ses disciples, le Christ Seigneur %appelle% toujours %ceux qu’il veut pour qu’ils soient avec lui et pour les envoyer prêcher% aux nations païennes. Aussi, par l’Esprit Saint, %qui partage les charismes comme il veut, pour l’utilité% de l’Église, le Christ inspire-t-il à certains la vocation missionnaire. Et en même temps, il suscite dans l’Église des Instituts qui adoptent comme leur tâche propre cette charge de l’évangélisation qui appartient à toute l’Église.
        En effet, une vocation spéciale distingue ceux qui, par leur tempérament, leurs dons et leurs talents, se trouvent préparés à assumer le travail missionnaire, qu’ils soient autochtones ou étrangers, prêtres, religieux ou laïcs. Envoyés par l’autorité légitime, ils partent, dans la foi et l’obéissance, vers ceux qui sont loin du Christ; ils ont été %mis à part pour la tâche à laquelle ils ont été appelés%, comme serviteurs de l’Evangile, %pour que les païens deviennent une offrande acceptée par Dieu, sanctifiée par l’Esprit Saint%.
        C’est le vrai Dieu qui appelle, mais l’homme doit lui répondre de telle manière qu’%en dehors de tout motif humain% il s’attache tout entier au travail de l’Évangile. Or, cette réponse ne peut être donnée que si l’Esprit Saint y pousse et en donne la force. Car celui qui est envoyé entre dans la vie et la mission de Celui qui %s’est dépouillé lui-même en prenant la condition de serviteur%. Le missionnaire doit donc être prêt à persévérer pour la vie dans sa vocation, à renoncer à lui-même et à tout ce qu’il a possédé jusque-là, et à se faire %tout à tous%.
        Lorsqu’il annonce l’Évangile parmi les nations, il doit %faire connaître avec assurance le mystère du Christ qui l’a chargé d’être son ambassadeur%; en lui il doit parler avec toute l’audace nécessaire, sans rougir du scandale de la Croix. En suivant les traces de son Maître, qui est %doux et humble de cœur%, il manifestera que %le joug de celui-ci est facile à porter, et son fardeau, léger%. En ayant une vie vraiment évangélique, une constance inlassable, de la patience, de la douceur, une charité loyale, il rendra témoignage à son Seigneur; et cela, si c’est nécessaire, jusqu’à répandre son sang. Il obtiendra de Dieu force et courage pour découvrir que, dans toutes les détresses qui le mettent à l’épreuve el dans la plus profonde pauvreté, il y a une joie immense.
      responsory: |-
        [rubric](Stance)[/rubric]
        Ouvriers de la paix,
        la moisson vous attend :
        pour réconcilier le monde,
        n’emportez que l’amour.
        À ceux qui vous accueillent,
        comme à ceux qui vous chassent,
        annoncez la nouvelle :

        R/ Le Royaume de Dieu est là,
        tout près de nous.

        Les sourds entendent,
        les morts ressuscitent,
        la Bonne Nouvelle est annoncée aux pauvres.

        Les aveugles voient, 
        es boiteux marchent,
        les lépreux sont guéris.

        Les prisonniers sont libérés,
        une année de grâce
        est proclamée.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as envoyé saint Anschaire, ton évêque,
    >porter à de nombreux peuples la clarté de l’Évangile ; *
    accorde-nous, par son intercession, /
    >de marcher toujours à la lumière de ta vérité.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Is 52, 7-10
      headline: « Tous les lointains de la terre ont vu le salut de notre Dieu »
      content: |-
        Comme ils sont beaux sur les montagnes,
        les pas du messager,
        celui qui annonce la paix,
        qui porte la bonne nouvelle,
        qui annonce le salut,
        et vient dire à Sion :
        « Il règne, ton Dieu ! »
        Écoutez la voix des guetteurs :
        ils élèvent la voix,
        tous ensemble ils crient de joie
        car, de leurs propres yeux,
        ils voient le Seigneur qui revient à Sion.
        Éclatez en cris de joie,
        vous, ruines de Jérusalem,
        car le Seigneur console son peuple,
        il rachète Jérusalem !
        Le Seigneur a montré la sainteté de son bras
        aux yeux de toutes les nations.
        Tous les lointains de la terre
        ont vu le salut de notre Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur, la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 1, 14-20
      headline: « Je vous ferai devenir pêcheurs d’hommes »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        Après l’arrestation de Jean le Baptiste,
        Jésus partit pour la Galilée
        >proclamer l’Évangile de Dieu ;
        il disait :
        >« Les temps sont accomplis :
        >le règne de Dieu est tout proche.
        Convertissez-vous et croyez à l’Évangile. »
        Passant le long de la mer de Galilée,
        Jésus vit Simon et André, le frère de Simon,
        >en train de jeter les filets dans la mer,
        >car c’étaient des pêcheurs.
        Il leur dit :
        >« Venez à ma suite.
        Je vous ferai devenir pêcheurs d’hommes. »
        Aussitôt, laissant leurs filets,
        >ils le suivirent.
        Jésus avança un peu
        et il vit Jacques, fils de Zébédée, et son frère Jean,
        >qui étaient dans la barque et réparaient les filets.
        Aussitôt, Jésus les appela.
        Alors, laissant dans la barque leur père Zébédée avec ses ouvriers,
        >ils partirent à sa suite.
        
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null