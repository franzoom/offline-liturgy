celebration:
  title: Saint Antoine
  subtitle: abbé
  description: |-
    Antoine, le père des moines d’Égypte, se fixa dans le désert à vingt ans après avoir entendu lire dans l’Évangile : « Si tu veux être parfait, va, vends ce que tu as, donne le aux pauvres et suis moi ». Il allait y vivre durant près d’un siècle († 356). De nombreux disciples le suivirent dans cette vie d’austérité qui donne accès à l’intimité du Dieu vivant.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - Dieu qui a donné à saint Antoine de mener dans la solitude une vie héroïque, accorde-nous, par son intercession, de renoncer à nous-mêmes pour t’aimer sans cesse et plus que tout.

readings:
  patristicReading:
    - title: VIE DE SAINT ANTOINE. PAR SAINT ATHANASE
      subtitle: La vocation d’Antoine
      content: |-
        À la mort de ses parents, Antoine resta seul avec une jeune sœur. Ayant alors entre dix-huit et vingt ans, il prit soin de la maison et de sa sœur.
        Moins de six mois après le décès de ses parents, il se rendait comme d’habitude à l’église en méditant ; il considérait comment les Apôtres avaient tout quitté pour suivre le Sauveur ; quels étaient les hommes qui, dans les Actes des Apôtres, vendaient leurs biens et en déposaient le produit aux pieds des Apôtres pour que ceux-ci les distribuent aux nécessiteux ; et aussi quelle grande espérance leur était ainsi réservée dans le ciel. En pensant à tout cela, il entre dans l’église au moment de la lecture de l’Évangile, et il entend le Seigneur qui disait à un riche : %Si tu veux être parfait, va, vends tout ce que tu possèdes et donne-le aux pauvres ; puis viens, suis-moi, et tu auras un trésor dans les cieux%.
        Antoine eut l’impression que Dieu lui adressait cet évangile et que cette lecture avait été faite pour lui. Il sortit aussitôt de l’église et donna aux gens du village ses propriétés familiales, quinze arpents d’une terre fertile et excellente, pour que lui-même et sa sœur n’en aient plus l’embarras. Après avoir vendu tous ses biens mobiliers, il distribua aux pauvres la grosse somme d’argent qu’il en avait retirée, en ne mettant de côté qu’une petite part pour sa sœur.
        Une autre fois qu’il était entré à l’église, il entendit le Seigneur dire dans l’Évangile : %Ne vous faites pas de souci pour demain%. Ne supportant plus d’avoir gardé quelque chose, il distribua cela aussi aux plus pauvres. Il confia sa sœur à des vierges dont il connaissait la fidélité et la mit dans leur monastère pour qu’elle y fasse son éducation. Quant à lui, il se consacra désormais, près de sa maison, au labeur de la vie ascétique. Vigilant sur soi-même, il persévérait dans une vie austère. ~
        Aussi travaillait-il de ses mains, car il avait entendu cette parole : %Si quelqu’un ne veut pas travailler, qu’il ne mange pas non plus%. Il achetait son pain avec une part de ce qu’il gagnait et il distribuait le reste aux indigents.
        Il priait sans cesse, parce qu’il avait appris qu’il faut %prier sans relâche% en privé. Il était si attentif à la lecture qu’il ne laissait rien perdre des Écritures mais en retenait tout et que, dans la suite, sa mémoire pouvait remplacer les livres. ~
        Tous les habitants du village et les gens de bien qui le fréquentaient habituellement, en le voyant vivre ainsi, l’appelaient ami de Dieu. Les uns l’aimaient comme leur fils, et les autres comme leur frère.
      responsory: |-
        [rubric](Stance)[/rubric]
        Va, pèlerin,
        poursuis ta quête ;
        va ton chemin,
        que rien n’arrête.
        Prends ta part de soleil
        et ta part de poussière ;
        le cœur en éveil
        oublie l’éphémère.

        R/ Tout est néant,
        rien n’est vrai que l’amour.

        N’attache pas ton cœur
        à ce qui passe.

        Ne dis pas : j’ai réussi,
        je suis payé de ma peine.

        Ne te repose pas dans tes œuvres :
        elles vont te juger.

        Garde en ton cœur la Parole :
        voilà ton trésor.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ps 91,13-14
    content: |-
      Le juste grandira comme un palmier
      >il poussera comme un cèdre du Liban ;
      planté dans les parvis du Seigneur
      >il grandira dans la maison de notre Dieu.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné au bienheureux abbé Antoine
    >de te servir au désert
    >par une admirable manière de vivre ; *
    >accorde-nous, par son intercession
    >de renoncer à nous-mêmes
    >pour t’aimer sans cesse et plus que tout.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ép 6, 10-13.18
      headline: « Revêtez l’équipement de combat donné par Dieu »
      content: |-
        Frères,
        puisez votre énergie dans le Seigneur
        >et dans la vigueur de sa force.
        Revêtez l’équipement de combat donné par Dieu,
        >afin de pouvoir tenir contre les manœuvres du diable.
        Car nous ne luttons pas contre des êtres de sang et de chair,
        mais contre les Dominateurs de ce monde de ténèbres,
        >les Principautés, les Souverainetés,
        >les esprits du mal qui sont dans les régions célestes.
        Pour cela, prenez l’équipement de combat donné par Dieu ;
        >ainsi, vous pourrez résister
        quand viendra le jour du malheur,
        >et tout mettre en œuvre pour tenir bon.
        En toute circonstance,
        >que l’Esprit vous donne de prier et de supplier :
        restez éveillés,
        >soyez assidus à la supplication pour tous les fidèles.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu : j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 16-21
      headline: « Si tu veux être parfait, va, vends ce que tu possèdes »
      acclamationAntiphon: |-
        Si vous demeurez fidèles à ma parole,
        vous êtes vraiment mes disciples ;
        alors vous connaîtrez la vérité, dit le Seigneur.
      content: |-
        En ce temps-là,
        voici que quelqu’un s’approcha de Jésus et lui dit :
        « Maître, que dois-je faire de bon
        pour avoir la vie éternelle ? »
        Jésus lui dit :
        « Pourquoi m’interroges-tu sur ce qui est bon ?
        Celui qui est bon, c’est Dieu, et lui seul !
        Si tu veux entrer dans la vie,
        observe les commandements. »
        Il lui dit :
        « Lesquels ? »
        Jésus reprit :
        « Tu ne commettras pas de meurtre.
        Tu ne commettras pas d’adultère.
        Tu ne commettras pas de vol.
        Tu ne porteras pas de faux témoignage.
        Honore ton père et ta mère.
        Et aussi :
        Tu aimeras ton prochain comme toi-même. »
        Le jeune homme lui dit :
        « Tout cela, je l’ai observé :
        que me manque-t-il encore ? »
        Jésus lui répondit :
        « Si tu veux être parfait,
        va, vends ce que tu possèdes,
        donne-le aux pauvres,
        et tu auras un trésor dans les cieux.
        Puis viens, suis-moi. »
        
  offeringPrayer:
  - |-
    Accepte, Seigneur, comme un hommage de tes serviteurs
    >l’offrande que nous déposons sur ton autel
    >en faisant mémoire du bienheureux Antoine ; *
    et permets que libérés des fardeaux d’ici-bas, /
    >nous n’ayons d’autre richesse que toi.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Mt 19,21
    content: |-
      Si tu veux être parfait, dit le Seigneur,
      >va, vends ce que tu possèdes,
      >donne-le aux pauvres, et suis-moi.
  prayerAfterCommunion:
  - |-
    Par ton sacrement, Seigneur,
    >tu nous as procuré la nourriture du salut ; *
    >fais-nous toujours échapper aux embuches de l’Ennemi, /
    toi qui as donné au bienheureux Antoine
    >de remporter sur les puissances des ténèbre
    >d’éclatantes victoires.
    Par le Christ, notre Seigneur.