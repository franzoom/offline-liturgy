celebration:
  title: Saint Antoine de Padoue
  subtitle: prêtre et docteur de l’Église
  description: Antoine naquit à Lisbonne (vers 1195). En 1221, il était à Assise près de saint François, dont le projet de vie évangélique l’avait séduit. Ses dons exceptionnels de prédicateur le firent envoyer en France, où se répandaient les doctrines cathares. Il fonda un couvent à Brive-la-Gaillarde. De retour en Italie, il mourut à Padoue après y avoir prêché le carême (1231).
  commons:
    - pastors
    - pastors_doctors
    - saints-male_religious
  color: white

oration:
  - |-
    Dieu éternel et tout-puissant, tu as voulu que ton peuple trouve en saint Antoine de Padoue un grand prédicateur de l’Évangile et un défenseur des pauvres : permets qu’avec ton aide, et fidèles à ses leçons de vie chrétienne, nous ressentions dans toutes nos épreuves le bienfait de ton secours.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT ANTOINE DE PADOUE
      content: |-
        Celui qui est rempli du Saint-Esprit parle diverses langues. Ces diverses langues sont les divers témoignages rendus au Christ, comme l’humilité, la pauvreté, la patience et l’obéissance. Nous les parlons quand, en les pratiquant nous-mêmes, nous les montrons aux autres. La parole est vivante, lorsque ce sont les actions qui parlent. Je vous en prie, que les paroles se taisent, et que les actions parlent. Nous sommes pleins de paroles mais vides d’actions ; à cause de cela, le Seigneur nous maudit, lui qui a maudit le figuier où il n’a pas trouvé de fruits mais seulement des feuilles. « La loi, dit saint Grégoire, a été présentée au prédicateur pour qu’il pratique ce qu’il prêche. » Il perd son temps à répandre la connaissance de la loi, celui qui détruit son enseignement par ses actions.
        Mais les Apôtres parlaient %selon le don de l’Esprit%. Heureux celui qui parle selon le don de l’Esprit, et non selon son propre sentiment. Car il y en a qui parlent selon leur propre esprit, dérobent les paroles d’autrui, les proposent comme si elles étaient à eux et se les attribuent. C’est de ces gens-là et de leurs pareils que le Seigneur dit en Jérémie : %Je vais m’en prendre aux prophètes – parole du Seigneur – qui se dérobent mutuellement mes paroles. Je vais m’en prendre aux prophètes – parole du Seigneur – qui mettent leur langue en mouvement pour dire : Parole du Seigneur. Je vais m’en prendre aux prophètes qui ont des songes fallacieux – parole du Seigneur –, qui les racontent et qui égarent mon peuple par leurs mensonges et leurs prodiges. Moi, je ne les ai ni envoyés, ni chargés de mes ordres, et ils ne sont d’aucune utilité à ce peuple, parole du Seigneur.%
        Parlons donc selon ce que l’Esprit Saint nous donnera de dire. Demandons-lui humblement et pieusement de répandre en vous sa grâce, pour que nous atteignions le chiffre de la Pentecôte (cinquante) en multipliant la connaissance naturelle des cinq sens par l’observation des Dix Commandements ; pour que nous soyons remplis d’un violent esprit de contrition, que nous soyons embrasés par les langues de feu de la profession de notre foi ; pour qu’enfin, ainsi embrasés et illuminés, nous puissions, %dans les splendeurs des saints%, voir le Dieu unique en trois Personnes.
      responsory: |-
        R/ Ta parole, Seigneur, est lumière dans la nuit.
        
        Vers qui pouvons-nous aller, Seigneur ?
        toi seul nous conduis au Royaume.
        
        Heureux qui suit jusqu’au bout
        le chemin que tu lui traces.
        
        Heureux qui médite en son coeur
        les voies mystérieuses de l’amour.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >en saint Antoine de Padoue,
    >tu as donné à ton peuple
    >un grand prédicateur de l’Évangile
    >et un recours en toute nécessité ; *
    >permets qu’avec son aide,
    >et fidèles à ses leçons de vie chrétienne, /
    nous ressentions dans toutes nos épreuves
    >le bienfait de ton secours.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Is 61, 1-3a
      headline: « Le Seigneur m’a consacré par l’onction. Il m’a envoyé porter la Bonne Nouvelle aux pauvres »
      content: |-
        L’esprit du Seigneur Dieu est sur moi
        parce que le Seigneur m’a consacré par l’onction.
        Il m’a envoyé annoncer la bonne nouvelle aux humbles,
        guérir ceux qui ont le cœur brisé,
        proclamer aux captifs leur délivrance,
        aux prisonniers leur libération,
        proclamer une année de bienfaits accordée par le Seigneur,
        et un jour de vengeance pour notre Dieu,
        consoler tous ceux qui sont en deuil,
        ceux qui sont en deuil dans Sion,
        mettre le diadème sur leur tête au lieu de la cendre,
        l’huile de joie au lieu du deuil,
        un habit de fête au lieu d’un esprit abattu.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88 (89), 2-3, 4-5, 21-22, 25.27
      refAbbr: cf. 88, 2a
      chorus:
      - chorusRef: cf. 88, 2a
        chorus: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : C’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        « Avec mon élu, j’ai fait une alliance,
        j’ai juré à David, mon serviteur :
        j’établirai ta dynastie pour toujours,
        je te bâtis un trône pour la suite des âges.

        « J’ai trouvé David, mon serviteur,
        je l’ai sacré avec mon huile sainte ;
        et ma main sera pour toujours avec lui,
        mon bras fortifiera son courage.

        « Mon amour et ma fidélité sont avec lui,
        mon nom accroît sa vigueur ;
        il me dira : "Tu es mon Père,
        mon Dieu, mon roc et mon salut !" »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 1-9
      headline: « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Le Seigneur m’a envoyé
        porter la Bonne Nouvelle aux pauvres,
        annoncer aux captifs leur libération.
      content: |-
        En ce temps-là,
        parmi les disciples,
        le Seigneur en désigna encore 72,
        et il les envoya deux par deux, en avant de lui,
        en toute ville et localité où lui-même allait se rendre.
        Il leur dit :
        « La moisson est abondante,
        mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        d’envoyer des ouvriers pour sa moisson.
        Allez ! Voici que je vous envoie
        comme des agneaux au milieu des loups.
        Ne portez ni bourse, ni sac, ni sandales,
        et ne saluez personne en chemin.
        Mais dans toute maison où vous entrerez,
        dites d’abord :
        "Paix à cette maison."
        S’il y a là un ami de la paix,
        votre paix ira reposer sur lui ;
        sinon, elle reviendra sur vous.
        Restez dans cette maison,
        mangeant et buvant ce que l’on vous sert ;
        car l’ouvrier mérite son salaire.
        Ne passez pas de maison en maison.
        Dans toute ville où vous entrerez
        et où vous serez accueillis,
        mangez ce qui vous est présenté.
        Guérissez les malades qui s’y trouvent
        et dites-leur :
        "Le règne de Dieu s’est approché de vous." »
        
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null