celebration:
  title: Saint Antoine-Marie Zaccaria
  subtitle: prêtre
  description: Antoine-Marie Zaccaria (1502-1539) était un prêtre de Crémone (Lombardie). Pour suivre le programme apostolique tracé par saint Paul, il groupa autour de lui à Milan des prêtres qui, sans être moines ou frères mendiants, vivraient selon une règle et se lieraient par des vœux. Comme ils desservaient l’église Saint-Barnabé, on les appela plus tard les Barnabites.
  color: white
  commons:
    - pastors_founder
    - saints-male_educator
    - saints-male_religious

oration:
  - |-
    Accorde-nous, Seigneur, comme à l’Apôtre Paul, cette connaissance incomparable de Jésus Christ qui permettait à saint Antoine-Marie Zaccaria d’annoncer à ton Église la Parole du salut.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT ANTOINE-MARIE À SES CONFRÈRES
      content: |-
        %Nous sommes fous à cause du Christ% ; saint Paul, notre guide et notre protecteur, disait cela de lui-même, des autres Apôtres et de tous ceux qui professent la vie chrétienne et apostolique. Mais, frères très chers, cela ne doit pas nous étonner ou nous effrayer, car %le serviteur n’est pas plus grand que son maître, l’esclave n’est pas plus grand que son seigneur%. Ceux qui s’opposent à nous se font tort à eux-mêmes, mais ils nous procurent des mérites, car ils embellissent notre couronne de gloire éternelle, tandis qu’ils attirent sur eux la colère divine; nous devons donc les plaindre et les aimer plutôt que les détester et les haïr. Nous devons même prier pour eux et ne pas nous laisser %vaincre par le mal, mais vaincre le mal par le bien et amasser sur leurs têtes des charbons ardents%, comme nous y exhorte l’Apôtre, c’est-à-dire leur prodiguer des témoignages d’affection. C’est ainsi qu’en voyant notre patience et notre douceur, ils reviendront à une meilleure conduite et seront gagnés par le feu de l’amour envers Dieu.
        Malgré notre indignité, Dieu nous a %choisis en nous tirant du monde%, selon sa miséricorde, pour que nous le servions en progressant de vertu en vertu, pour que nous méritions beaucoup de fruit par la persévérance, en trouvant notre gloire non seulement dans l’espérance de la gloire des fils de Dieu, mais encore dans nos épreuves.
        Voyez bien quelle est votre vocation, frères très chers. Si nous voulons la considérer attentivement, nous verrons facilement ce qu’elle exige. Nous qui avons entrepris de suivre, quoique de loin, les traces des saints Apôtres et des autres soldats du Christ, ne refusons pas de participer à leurs souffrances. %Courons avec endurance l’épreuve qui nous est proposée, les yeux fixés sur Jésus, qui est à l’origine et au terme de la foi%.
        Nous qui avons choisi ce grand Apôtre comme notre guide et notre père, et qui faisons profession de le suivre, essayons d’exprimer par notre conduite son enseignement et sa vie. Il ne faut pas que, sous un tel chef, nous soyons des soldats lâches ou fuyards, ni que nous soyons les fils dégénérés d’un si noble père.

      responsory: |-
        [rubric]stance[/rubric]
        Témoin de l’Agneau immolé,
        il entre dans l’épreuve
        sans craindre la souffrance,
        et, fidèle jusqu’à la mort, il reçoit la couronne de vie ;
        il rejoint pour toujours
        celui qu’en sa détresse il implorait :
        
        R/ Premier-né d’entre les morts,
        donne-moi de marcher à ta suite.
        
        À travers ta propre chair,
        tu ouvres un chemin vivant.
        
        Tu soutiens ceux que tu aimes,
        tu les appelles près de toi.
        
        Tu invites à la patience,
        tu annonces ton retour.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Accorde-nous, Seigneur,
    >de rechercher, selon l’esprit de l’apôtre Paul,
    >la connaissance incomparable de Jésus Christ, *
    elle qui forma saint Antoine-Marie Zaccaria /
    >pour annoncer sans relâche à ton Église la Parole du salut.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Tm 1, 13-14 ; 2, 1-3
      headline: « Garde le dépôt de la foi avec l’aide de l’Esprit Saint »
      content: |-
        Bien-aimé,
        tiens-toi au modèle donné par les paroles solides
        que tu m’as entendu prononcer dans la foi
        et dans l’amour qui est dans le Christ Jésus.
        Garde le dépôt de la foi dans toute sa beauté,
        avec l’aide de l’Esprit Saint qui habite en nous.
        Toi donc, mon enfant, trouve ta force
        dans la grâce qui est en Jésus Christ.
        Ce que tu m’as entendu dire en présence de nombreux témoins,
        confie-le à des hommes dignes de foi
        qui seront capables de l’enseigner aux autres, à leur tour.
        Prends ta part de souffrance
        comme un bon soldat du Christ Jésus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 1, 1-2, 3, 4.6
      refAbbr: 1, 2a
      chorus:
      - chorusRef: 1, 2a
        chorus: |-
          Heureux qui se plaît
          dans la loi du Seigneur.
      content: |-
        Heureux est l’homme
        qui n’entre pas au conseil des méchants,
        qui ne suit pas le chemin des pécheurs,
        ne siège pas avec ceux qui ricanent,
        mais se plaît dans la loi du Seigneur
        et murmure sa loi jour et nuit !

        Il est comme un arbre
        planté près d’un ruisseau,
        qui donne du fruit en son temps,
        et jamais son feuillage ne meurt ;
        tout ce qu’il entreprend réussira.

        Tel n’est pas le sort des méchants.
        Mais ils sont comme la paille
        balayée par le vent.

        Le Seigneur connaît le chemin des justes,
        mais le chemin des méchants se perdra.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 10, 13-16
      headline: « Laissez les enfants venir à moi »
      acclamationAntiphon: |-
        Tu es béni, Père, Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits les mystères du Royaume !
      content: |-
        En ce temps-là,
        des gens présentaient à Jésus des enfants
        pour qu’il pose la main sur eux ;
        mais les disciples les écartèrent vivement.
        Voyant cela, Jésus se fâcha et leur dit :
        « Laissez les enfants venir à moi,
        ne les empêchez pas,
        car le royaume de Dieu est à ceux qui leur ressemblent.
        Amen, je vous le dis :
        celui qui n’accueille pas le royaume de Dieu
        à la manière d’un enfant
        n’y entrera pas. »
        Il les embrassait
        et les bénissait en leur imposant les mains.
        
