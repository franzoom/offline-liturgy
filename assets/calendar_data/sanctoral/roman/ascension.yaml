  communionAntiphon:
  - biblicalReference: Mt 28,20
    content: |-
      Je suis avec vous tous les jours,
      >jusqu’à la fin du monde, alléluia.
  prayerAfterCommunion:
  - |-
    Dieu éternel et tout-puissant, +
    tu nous donnes d’avoir part aux mystères divins
    >alors que nous sommes encore sur la terre ; *
    mets en nos cœurs un grand désir d’être unis au Christ /
    >en qui notre nature humaine est déjà près de toi.
    Lui qui vit et règne pour les siècles des siècles.
