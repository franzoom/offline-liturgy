celebration:
  title: Ascension du Seigneur
  color: white

oration:
  - |-
    Dieu qui élèves le Christ au-dessus de tout, ouvre-nous à la joie et à l’action de grâce, car l’Ascension de ton Fils est déjà notre victoire : nous sommes les membres de son corps, il nous a précédés dans la gloire auprès de toi, et c’est là que nous vivons en espérance.

firstVespers:
  hymn:
    - homme-ne-te-tourmente-pas
  psalmody:
    - psalm: PSALM_112
      antiphon:
        - Nul n’est monté au ciel, sinon le Fils de l’homme, descendu du ciel et vivant au ciel. Alléluia.
    - psalm: PSALM_116
      antiphon:
        - Je monte vers mon Père et votre Père, vers mon Dieu et votre Dieu. Alléluia.
    - psalm: NT_10
      antiphon:
        - Voici maintenant le règne de Dieu, voici la puissance de son Christ, Alléluia.
  reading:
    biblicalReference: Ep 2,4-6
    content: |-
      Dieu est riche en miséricorde ; à cause du grand amour dont il nous a aimés, nous qui étions des morts à cause de nos fautes, il nous a fait revivre avec le Christ : c’est bien par grâce que vous êtes sauvés. Avec lui, il nous a ressuscités ; avec lui, il nous a fait régner aux cieux, dans le Christ Jésus.
  responsory: |-
    R/ Dieu s’élève parmi les ovations.
    * Alléluia, alléluia !
    V/ Le Seigneur, aux éclats du cor. * Alléluia.
    Gloire au Père. R/ Dieu s’élève.
  evangelicAntiphon:
    common:
    - Père, j’ai manifesté ton Nom aux hommes que tu m’as donnés ; c’est pour eux que je te prie, non pour le monde. Alléluia.
  intercession:
    content: |-
      Acclamons le Christ, qui siège à la droite du Père :

      R/ Ô Christ, tu es le Roi de gloire !

      Jésus, notre frère et notre Roi,
      tu as élevé notre condition humaine jusqu’à la gloire du ciel :
      – rétablis en nous la dignité de ton œuvre première.

      Par la puissance de l’Esprit,
      tu es sorti du Père et venu en ce monde :
      – dans la force de ce même Esprit,
      fais-nous passer avec toi de ce monde jusqu’au Père.

      Tu as promis d’attirer à toi tous les hommes :
      – garde dans ton Église ceux que le Père t’a donnés.

      Maintenant que tu es entré dans la gloire du Père,
      – tourne notre désir vers le ciel où tu es glorifié.

      Au dernier jour, tu jugeras le monde :
      – accorde à tous nos frères défunts
      de voir en toi le Seigneur des miséricordes.

invitatory:
  antiphon:
    - Honneur au Fils de l’homme, alléluia, il nous introduit près de Dieu, alléluia.

readings:
  hymn:
    - entre-dans-la-gloire
  psalmody:
    - psalm: PSALM_67_1
      antiphon:
        - Il est sorti vainqueur, le Fils de Dieu, pour vaincre encore, alléluia.
    - psalm: PSALM_67_2
      antiphon:
        - |-
          Il gravit les hauteurs, emmène les captifs : à tous les hommes il fait largesse, alléluia.
    - psalm: PSALM_67_3
      antiphon:
        - Il a pris possession de son règne, le Seigneur Dieu, maître-de-tout, alléluia.
  biblicalReading:
    - title: LECTURE DE LA LETTRE AUX ÉPHÉSIENS
      subtitle: Monté au plus haut des cieux, le Christ comble tout l’univers
      ref: Ep 4, 1-24
      content: |-
        Moi qui suis en prison à cause du Seigneur, je vous exhorte donc à vous conduire d’une manière digne de votre vocation : ayez beaucoup d’humilité, de douceur et de patience, supportez-vous les uns les autres avec amour ; ayez soin de garder l’unité dans l’Esprit par le lien de la paix. Comme votre vocation vous a tous appelés à une seule espérance, de même il y a un seul Corps et un seul Esprit. Il y a un seul Seigneur, une seule foi, un seul baptême, un seul Dieu et Père de tous, au-dessus de tous, par tous, et en tous. À chacun d’entre nous, la grâce a été donnée selon la mesure du don fait par le Christ. C’est pourquoi l’Écriture dit : %Il est monté sur la hauteur, il a capturé des captifs, il a fait des dons aux hommes%. Que veut dire : %Il est monté% ? — Cela veut dire qu’il était d’abord descendu dans les régions inférieures de la terre. Et celui qui était descendu est le même qui est monté au-dessus de tous les cieux pour remplir l’univers. Et les %dons qu’il a faits%, ce sont les Apôtres, et aussi les prophètes, les évangélisateurs, les pasteurs et ceux qui enseignent. De cette manière, les fidèles sont organisés pour que les tâches du ministère soient accomplies et que se construise le corps du Christ, jusqu’à ce que nous parvenions tous ensemble à l’unité dans la foi et la pleine connaissance du Fils de Dieu, à l’état de l’Homme parfait, à la stature du Christ dans sa plénitude. Alors, nous ne serons plus comme des petits enfants, nous laissant secouer et mener à la dérive par tous les courants d’idées, au gré des hommes qui emploient la ruse pour nous entraîner dans l’erreur. Au contraire, en vivant dans la vérité de l’amour, nous grandirons pour nous élever en tout jusqu’à celui qui est la Tête, le Christ. Et par lui, dans l’harmonie et la cohésion, tout le corps poursuit sa croissance, grâce aux articulations qui le maintiennent, selon l’énergie qui est à la mesure de chaque membre. Ainsi le corps se construit dans l’amour.
        Je vous le dis, j’en témoigne dans le Seigneur : vous ne devez plus vous conduire comme les païens qui se laissent guider par le néant de leur pensée. Ils ont l’intelligence remplie de ténèbres, ils sont étrangers à la vie de Dieu, à cause de l’ignorance qui est en eux, à cause de l’endurcissement de leur cœur ; ayant perdu le sens moral, ils se sont livrés à la débauche au point de s’adonner sans retenue à toute sorte d’impureté. Mais vous, ce n’est pas ainsi que l’on vous a appris à connaître le Christ, si du moins l’annonce et l’enseignement que vous avez reçus à son sujet s’accordent à la vérité qui est en Jésus. Il s’agit de vous défaire de votre conduite d’autrefois, c’est-à-dire de l’homme ancien corrompu par les convoitises qui l’entraînent dans l’erreur. Laissez-vous renouveler par la transformation spirituelle de votre pensée. Revêtez-vous de l’homme nouveau, créé, selon Dieu, dans la justice et la sainteté conformes à la vérité.
      responsory: |-
        [rubric](Stance)[/rubric]
        Verbe de Dieu
        venu prendre chair
        dans le sein de la Vierge,
        tu voiles ta splendeur
        pour vivre comme l’un de nous.
        Aujourd’hui
        plus radieux que le soleil,
        tu disparais à nos yeux
        et tu retournes près du Père
        tandis que l’univers t’acclame :

        R/ Tu es Seigneur,
        gloire à toi, Fils de l’homme,
        règne sur la création.

        Dresse-toi, Seigneur,
        montre ta force,
        et nous jouerons une hymne à ta vaillance.

        Ô Seigneur, notre Dieu,
        qu’il est grand ton nom,
        par toute la terre.

        Seigneur notre Dieu,
        tu es si grand,
        drapé de faste et d’éclat.
  verse: |-
    V/ Le Seigneur ouvrit l’esprit de ses disciples, alléluia,
    à l’intelligence des Écritures, alléluia.
  patristicReading:
    - title: SERMON DE SAINT AUGUSTIN POUR L’ASCENSION
      subtitle: « Dieu nous a fait régner aux cieux, dans le Christ Jésus »
      content: |-
        Aujourd’hui notre Seigneur Jésus Christ monte au ciel ; que notre cœur y monte avec lui.
        Écoutons ce que nous dit l’Apôtre : %Vous êtes ressuscités, avec le Christ. Recherchez donc les réalités d’en haut : c’est là qu’est le Christ, assis à la droite de Dieu. Le but de votre vie est en haut, et non pas sur la terre%. De même que lui est monté, mais sans s’éloigner de nous, de même sommes-nous déjà là-haut avec lui, et pourtant ce qu’il nous a promis ne s’est pas encore réalisé dans notre corps.
        Il a déjà été élevé au-dessus des cieux ; cependant il souffre sur la terre toutes les peines que nous ressentons, nous ses membres. Il a rendu témoignage à cette vérité lorsqu’il a crié du haut du ciel : %Saul, Saul, pourquoi me persécuter% ? Et il avait dit aussi : %J’avais faim, et vous avez donné à manger%.
        Pourquoi ne travaillons-nous pas, nous aussi, sur la terre, de telle sorte que par la foi, l’espérance, la charité, grâce auxquelles nous nous relions à lui, nous reposerions déjà maintenant avec lui, dans le ciel ? Lui, alors qu’il est là-bas, est aussi avec nous ; et nous, alors que nous sommes ici, sommes aussi avec lui. Lui fait cela par sa divinité, sa puissance, son amour ; et nous, si nous ne pouvons pas le faire comme lui par la divinité, nous le pouvons cependant par l’amour, mais en lui.
        Lui ne s’est pas éloigné du ciel lorsqu’il en est descendu pour venir vers nous ; et il ne s’est pas éloigné de nous lorsqu’il est monté pour revenir au ciel. Il était là-haut, tout en étant ici-bas ; lui-même en témoigne : %Nul n’est monté au ciel, sinon celui qui est descendu du ciel, le Fils de l’homme, qui est au ciel%. ~
        Il a parlé ainsi en raison de l’unité qui existe entre lui et nous : il est notre tête, et nous sommes son corps. Cela ne s’applique à personne sinon à lui, parce que nous sommes lui, en tant qu’il est Fils de l’homme à cause de nous, et que nous sommes fils de Dieu à cause de lui.
        C’est bien pourquoi saint Paul affirme : %Notre corps forme un tout, il a pourtant plusieurs membres ; et tous les membres, bien qu’étant plusieurs, ne forment qu’un seul corps. De même en est-il pour le Christ%. Il ne dit pas : le Christ est ainsi en lui-même, mais il dit : %De même en est-il pour le Christ% à l’égard de son corps.
        Le Christ, c’est donc beaucoup de membres en un seul corps. Il est descendu du ciel par miséricorde, et lui seul y est monté, mais par la grâce nous aussi sommes montés en sa personne. De ce fait, le Christ seul est descendu, et le Christ seul est monté ; non que la dignité de la tête se répande indifféremment dans le corps, mais l’unité du corps ne lui permet pas de se séparer de la tête.
      responsory: |-
        [rubric](Stance)[/rubric]
        Verbe de Dieu
        venu prendre chair
        dans le sein de la Vierge,
        tu voiles ta splendeur
        pour vivre comme l’un de nous.
        Aujourd’hui
        plus radieux que le soleil,
        tu disparais à nos yeux
        et tu retournes près du Père
        tandis que l’univers t’acclame :

        R/ Tu es Seigneur,
        Gloire à toi, Fils de l’homme !
        Règne sur la création.
morning:
  hymn:
    - nous-te-chantons-ressuscite
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - Hommes de Galilée, pourquoi fixer le ciel ? Vous avez vu Jésus monter au ciel ; c’est ainsi qu’il reviendra, alléluia.
    - psalm: OT_41
      antiphon:
        - Exaltez le Roi des rois, louange à notre Dieu, alléluia.
    - psalm: PSALM_149
      antiphon:
        - Les disciples ont vu Jésus s’élever, alléluia. Une nuée l’emporta dans le ciel, alléluia.
  reading:
    biblicalReference: He 10, 12-14
    content: Jésus Christ, après avoir offert pour les péchés un unique sacrifice, s’est assis pour toujours à la droite de Dieu. Il attend désormais que ses ennemis soient mis sous ses pieds. Par son sacrifice unique, il a mené pour toujours à leur perfection ceux qui reçoivent de lui la sainteté.
  responsory: |-
    R/ Tu es la porte du Royaume, alléluia !
    * Tu es la route vers le Père, alléluia !
    V/ Ouvrez-vous, portes éternelles :
    qu’il entre le roi de gloire. *
    V/ C’est lui, le Seigneur de l’univers,
    c’est lui, le roi de gloire. R/
  evangelicAntiphon:
    common:
      - Je suis sorti du Père et je suis venu dans le monde. Maintenant, je quitte le monde et je retourne au Père. Alléluia.
  intercession:
    content: |-
      Acclamons et louons le Seigneur, élevé au-dessus de tous :

      R/ Loué sois-tu, Seigneur de gloire !

      Seigneur Jésus, une fois pour toutes tu t’es offert sur la croix, aujourd’hui tu es monté victorieux à la droite du Père,
      – achève notre délivrance.

      Pendant quarante jours, tu t’es montré vivant à tes disciples,
      – affermis notre foi.

      Toi qui es entré dans le Saint des saints, Prêtre éternel de l’Alliance nouvelle,
      – intercède pour nous.

      Avant de quitter les tiens, tu leur as promis l’Esprit Saint pour qu’ils annoncent l’Évangile jusqu’aux extrémités de la terre,
      – fortifie notre témoignage.

middleOfDay:
  psalmody:
    - psalm: PSALM_8
    - psalm: PSALM_18A
    - psalm: PSALM_18B
  tierce:
    antiphon: Jusqu’aux cieux, Seigneur, ta splendeur est chantée, alléluia.
    reading:
      biblicalReference: Ap 1, 17c-18
      content: |-
        Je vis comme un fils d’homme qui me disait : « Je suis le Premier et le Dernier, je suis le Vivant ; j’étais mort, mais me voici vivant pour les siècles des siècles, et je détiens les clés de la mort et du séjour des morts. »
    responsory: |-
      V/ Que votre cœur ne se trouble pas, alléluia,
      car je vais au Père, alléluia.
  sexte:
    antiphon: Il paraît où commence le ciel, alléluia. Il s’en va jusqu’où le ciel s’achève, alléluia.
    reading:
      biblicalReference: He 8, 1b-3a
      content: Le grand prêtre que nous avons s’est assis à la droite de Dieu et règne avec lui dans les cieux, après avoir accompli le service du véritable Sanctuaire, et de la véritable Tente dressée par le Seigneur et non par un homme. Le grand prêtre a toujours été chargé d’offrir des dons et des sacrifices.
    responsory: |-
      V/ À ta droite se tient le Seigneur, alléluia.
      Tu es Prêtre à jamais, alléluia.
  none:
    antiphon: Levant les mains, il bénit ses disciples et fut emporté dans le ciel, alléluia.
    reading:
      biblicalReference: Col 3, 1-2
      content: |-
        Vous êtes ressuscités avec le Christ. Recherchez donc les réalités d’en haut : c’est là qu’est le Christ, assis à la droite de Dieu. Tendez vers les réalités d’en haut, et non pas vers celles de la terre.
    responsory: |-
      V/ Glorifiez le Roi des rois, alléluia.
      Chantez un hymne à Dieu, alléluia.

vespers:
  hymn:
    - o-fils-de-dieu-ressuscite
  psalmody:
    - psalm: PSALM_109
      antiphon:
        - Il est monté au ciel, alléluia. Il est assis à la droite du Père, alléluia, alléluia !
    - psalm: PSALM_46
      antiphon:
        - Dieu s’élève parmi les ovations, le Seigneur, aux éclats du cor, alléluia.
    - psalm: NT_10
      antiphon:
        - Maintenant est glorifié le Fils de l’homme, alléluia, en lui Dieu est glorifié, alléluia.
  reading:
    biblicalReference: 1P 3, 18.22
    content: Le Christ est mort pour les péchés, une fois pour toutes ; lui, le juste, il est mort pour les coupables afin de vous introduire devant Dieu. Dans sa chair, il a été mis à mort ; dans l’esprit, il a été rendu à la vie. Il est monté au ciel, au-dessus des anges et de toutes les puissances invisibles, à la droite de Dieu.
  responsory: |-
    R/ Nous acclamons, Seigneur,
    la splendeur de ta gloire éternelle !
    V/ À toi, Seigneur, le règne,
    la primauté sur l’univers ! R/
    V/ C’est toi, le Maître de tout,
    nous voici pour te rendre grâce. R/
  evangelicAntiphon:
    common:
      - Roi de gloire, Dieu de l’univers, toi qui montes au plus haut des cieux, ne nous laisse pas orphelins, envoie-nous celui que le Père a promis, l’Esprit de vérité, alléluia.
  intercession:
    content: |-
      Acclamons et louons le Seigneur, élevé au-dessus de tous :

      R/ Loué sois-tu, Seigneur de gloire !

      Seigneur Jésus, une fois pour toutes tu t’es offert sur la croix, aujourd’hui tu es monté victorieux à la droite du Père,
      – achève notre délivrance.

      Pendant quarante jours, tu t’es montré vivant à tes disciples,
      – affermis notre foi.

      Toi qui es entré dans le Saint des saints, Prêtre éternel de l’Alliance nouvelle,
      – intercède pour nous.

      Avant de quitter les tiens, tu leur as promis l’Esprit Saint pour qu’ils annoncent l’Évangile jusqu’aux extrémités de la terre,
      – fortifie notre témoignage.

      Toi qui reviendras au dernier jour pour nous prendre avec toi,
      – sois la résurrection des morts.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ac 1,11
    content: |-
      Hommes de Galilée, pourquoi restez-vous là à regarder vers le ciel ?
      >Il viendra de la même manière,
      >celui que vous avez vu s’en aller vers le ciel , alléluia.

  collect:
  - |-
    Dieu tout-puissant, +
    >fais-nous exulter d’une joie sainte
    et nous réjouir dans une fervente action de grâce,
    >car l’ascension de ton Fils, le Christ, 
    >nous rapproche déjà de toi ; *
    nous, les membres du corps dont il est la tête,
    >appelés à vivre en espérance /
    >dans la gloire où il nous a précédés.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  - |-
    Nous t’en prions, Dieu tout-puissant : *
    puisque nous croyons que ton Fils unique, notre Rédempteur,
    >est aujourd’hui monté au ciel, /
    accorde-nous de vivre en esprit
    >dans la demeure des cieux.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 1,1-11
      headline: |-
        « Tandis que les Apôtres le regardaient, il s’éleva »
      content: |-
        Cher Théophile,
        dans mon premier livre,
        >j’ai parlé de tout ce que Jésus a fait et enseigné
        >depuis le moment où il commença,
        >jusqu’au jour où il fut enlevé au ciel,
        après avoir, par l’Esprit Saint, donné ses instructions
        >aux Apôtres qu’il avait choisis.
        C’est à eux qu’il s’est présenté vivant après sa Passion ;
        >il leur en a donné bien des preuves,
        puisque, pendant quarante jours, il leur est apparu
        >et leur a parlé du royaume de Dieu.

        Au cours d’un repas qu’il prenait avec eux,
        >il leur donna l’ordre de ne pas quitter Jérusalem,
        >mais d’y attendre que s’accomplisse la promesse du Père.
        Il déclara :
        >« Cette promesse, vous l’avez entendue de ma bouche :
        >alors que Jean a baptisé avec l’eau,
        >vous, c’est dans l’Esprit Saint
        >que vous serez baptisés d’ici peu de jours. »
        Ainsi réunis, les Apôtres l’interrogeaient :
        >« Seigneur, est-ce maintenant le temps
        >où tu vas rétablir le royaume pour Israël ? »
        Jésus leur répondit :
        >« Il ne vous appartient pas de connaître les temps et les moments
        >que le Père a fixés de sa propre autorité.
        >Mais vous allez recevoir une force
        >quand le Saint-Esprit viendra sur vous ;
        >vous serez alors mes témoins
        >à Jérusalem,
        >dans toute la Judée et la Samarie,
        >et jusqu’aux extrémités de la terre. »

        Après ces paroles, tandis que les Apôtres le regardaient,
        >il s’éleva,
        >et une nuée vint le soustraire à leurs yeux.
        Et comme ils fixaient encore le ciel
        >où Jésus s’en allait,
        voici que, devant eux,
        se tenaient deux hommes en vêtements blancs,
        qui leur dirent :
        >« Galiléens,
        >pourquoi restez-vous là à regarder vers le ciel ?
        >Ce Jésus qui a été enlevé au ciel d’auprès de vous,
        >viendra de la même manière
        >que vous l’avez vu s’en aller vers le ciel. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 46 (47), 2-3, 6-7, 8-9
      refAbbr: Ps 46
      chorus:
      - chorusRef: Dn 3, 52
        content: |-
          Dieu s’élève parmi les ovations,
          le Seigneur, aux éclats du cor.
      - chorusRev: null
        content: Alléluia !
      content: |-
        Tous les peuples, battez des mains,
        acclamez Dieu par vos cris de joie !
        Car le Seigneur est le Très-Haut, le redoutable,
        le grand roi sur toyte la terre. 

        Dieu s’élève parmi les ovations,
        le Seigneur, aux éclats du cor.
        Sonnez pour notre Dieu, sonnez,
        sonnez pour notre roi, sonnez !

        Car Dieu est le roi de la terre :
        que vos musiques l’annoncent !
        Il règne, Dien, sur les païens,
        Dieu est assis sur son trône sacré.
  - partType: READING_2
    partContents:
    - biblicalRef: Ep 1, 17-23
      cycle:
      - A
      headline: |-
        « Dieu l’a fait asseoir à sa droite dans les cieux »
      content: |-
        Frères,
        que le Dieu de notre Seigneur Jésus Christ,
        >le Père dans sa gloire,
        vous donne un esprit de sagesse
        >qui vous le révèle et vous le fasse vraiment connaître.
        Qu’il ouvre à sa lumière les yeux de votre cœur,
        pour que vous sachiez quelle espérance vous ouvre son appel,
        >la gloire sans prix de l’héritage que vous partagez avec les fidèles,
        et quelle puissance incomparable
        >il déploie pour nous, les croyants :
        c’est l’énergie, la force, la vigueur
        >qu’il a mise en œuvre dans le Christ
        quand il l’a ressuscité d’entre les morts
        >et qu’il l’a fait asseoir à sa droite dans les cieux.
        Il l’a établi au-dessus de tout être céleste :
        >Principauté, Souveraineté, Puissance et Domination,
        au-dessus de tout nom
        >que l’on puisse nommer,
        >non seulement dans le monde présent
        >mais aussi dans le monde à venir.

        Il a tout mis sous ses pieds
        et, le plaçant plus haut que tout,
        il a fait de lui la tête de l’Église qui est son corps,
        et l’Église, c’est l’accomplissement total du Christ,
        >lui que Dieu comble totalement de sa plénitude.
    - biblicalRef: Ep 4, 1-13
      cycle:
      - B
      headline: |-
        « Parvenir à la stature du Christ dans sa plénitude »
      content: |-
        Frères,
        moi qui suis en prison à cause du Seigneur,
        je vous exhorte donc à vous conduire
        >d’une manière digne de votre vocation :
        ayez beaucoup d’humilité, de douceur et de patience,
        supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.
        C’est pourquoi l’Écriture dit :
        >%Il est monté sur la hauteur, il a capturé des captifs,
        >il a fait des dons aux hommes.%

        Que veut dire : %Il est monté% ?
        - Cela veut dire qu’il était d’abord descendu
        >dans les régions inférieures de la terre.
        Et celui qui était descendu
        >est le même qui est monté au-dessus de tous les cieux
        >pour remplir l’univers.
        Et les %dons qu’il a faits%,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
      shortReadingRef: Ep 4, 1-7. 11-13
      shortReadingContent: |-
        Frères,
        moi qui suis en prison à cause du Seigneur,
        je vous exhorte donc à vous conduire
        >d’une manière digne de votre vocation :
        ayez beaucoup d’humilité, de douceur et de patience,
        supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.

        Et les %dons qu’il a faits%,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
    - biblicalRef: He 9, 24-28 ; 10, 19-23
      cycle:
      - C
      headline: |-
        « Le Christ est entré dans le ciel même »
      content: |-
        Le Christ n’est pas entré
        dans un sanctuaire fait de main d’homme,
        >figure du sanctuaire véritable ;
        il est entré dans le ciel même,
        afin de se tenir maintenant pour nous
        >devant la face de Dieu.
        Il n’a pas à s’offrir lui-même plusieurs fois,
        comme le grand prêtre qui, tous les ans,
        >entrait dans le sanctuaire
        >en offrant un sang qui n’était pas le sien ;
        car alors, le Christ aurait dû plusieurs fois souffrir la Passion
        >depuis la fondation du monde.
        Mais en fait, c’est une fois pour toutes,
        >à la fin des temps,
        qu’il s’est manifesté
        >pour détruire le péché par son sacrifice.
        Et, comme le sort des hommes est de mourir une seule fois
        >et puis d’être jugés,
        ainsi le Christ s’est-il offert une seule fois
        >pour enlever les péchés de la multitude ;
        il apparaîtra une seconde fois,
        >non plus à cause du péché,
        >mais pour le salut de ceux qui l’attendent.

        Frères, c’est avec assurance
        que nous pouvons entrer dans le véritable sanctuaire
        >grâce au sang de Jésus :
        nous avons là un chemin nouveau et vivant
        >qu’il a inauguré en franchissant le rideau du Sanctuaire ;
        >or, ce rideau est sa chair.
        Et nous avons le prêtre par excellence,
        >celui qui est établi sur la maison de Dieu.
        Avançons-nous donc vers Dieu
        >avec un cœur sincere
        >et dans la plénitude de la foi,
        le cœur purifié de ce qui souille notre conscience,
        >le corps lavé par une eau pure.
        Continuons sans fléchir d’affirmer notre espérance,
        >car il est fidèle, celui qui a promis.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 28, 16-20
      cycle:
      - A
      headline: |-
        « Tout pouvoir m a été donné au ciel et sur la terre »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        >Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        >apprenez-leur à observer
        >tout ce que je vous ai commandé.
        >Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »
    - biblicalRef: Mc 16, 15-20
      cycle:
      - B
      headline: |-
        « jésus fut enlevé au ciel et s’assit à la droite de Dieu »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
        >« Allez dans le monde entier.
        >>Proclamez l’Évangile à toute la création.
        >Celui qui croira et sera baptisé
        >>sera sauvé ;
        >celui qui refusera de croire
        >>sera condamné.
        >Voici les signes qui accompagneront
        >>ceux qui deviendront croyants :
        >en mon nom, ils expulseront les démons ;
        >>ils parleront en langues nouvelles ;
        >ils prendront des serpents dans leurs mains
        >>et, s’ils boivent un poison mortel,
        >>il ne leur fera pas de mal ;
        >ils imposeront les mains aux malades,
        >>et les malades s’en trouveront bien. »

        Le Seigneur Jésus,
        >après leur avoir parlé,
        fut enlevé au ciel
        >et s’assit à la droite de Dieu.
        Quant à eux,
        >ils s’en allèrent proclamer partout l’Évangile.
        Le Seigneur travaillait avec eux
        >et confirmait la Parole par les signes qui l’accompagnaient.
    - biblicalRef: Lc 24, 46-53
      cycle:
      - C
      headline: « Tandis qu’il les bénissait, il était emporté au ciel »
      acclamationAntiphon: |-
        De toutes les nations, faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        Jésus ressuscité, apparaissant à ses disciples,
        leur dit :
        >« Il est écrit que le Christ souffrirait,
        >>qu’il ressusciterait d’entre les morts le troisième jour,
        >et que la conversion serait proclamée en son nom,
        >>pour le pardon des péchés,
        >>à toutes les nations,
        >>en commençant par Jérusalem.
        >À vous d’en être les témoins.
        >Et moi, je vais envoyer sur vous
        >>ce que mon Père a promis.
        >Quant à vous, demeurez dans la ville
        >jusqu’à ce que vous soyez revêtus
        >d’une puissance venue d’en haut. »
        Puis Jésus les emmena au-dehors, jusque vers Béthanie ;
        >et, levant les mains, il les bénit.
        Or, tandis qu’il les bénissait,
        >il se sépara d’eux
        >et il était emporté au ciel.
        Ils se prosternèrent devant lui,
        >puis ils retournèrent à Jérusalem, en grande joie.
        Et ils étaient sans cesse dans le Temple
        >à bénir Dieu.
  offeringPrayer:
  - |-
    Seigneur, en ce jour où nous fêtons
    >l’admirable ascension de ton Fils auprès de toi, +
    nous te présentons humblement ce sacrifice ; *
    nous t’en prions, fais que cet échange très saint /
    >élève nos cœurs vers les réalités célestes.
    Par le Christ, notre Seigneur.

  prefaceList:
