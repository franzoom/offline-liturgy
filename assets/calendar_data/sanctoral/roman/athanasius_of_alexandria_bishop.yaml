celebration:
  title: Saint Athanase
  subtitle: évêque et docteur de l’Église
  description: |-
    Évêque d’Alexandrie de 328 à 373, Athanase n’eut qu’un objectif : défendre la foi en la divinité du Christ, qui avait été définie à Nicée, mais se trouvait battue en brèche de partout. Ni la pusillanimité des évêques, ni les tracasseries policières, ni cinq exils ne vinrent à bout de son caractère et surtout de son amour pour le Seigneur Jésus, Dieu fait homme.
  commons:
    - pastors
    - pastors_doctors
  color: white

oration:
  - Dieu éternel et tout-puissant, tu as choisi l’évêque Athanase pour défendre la foi en la divinité de ton Fils ; accorde-nous, grâce à son enseignement et sous sa protection, de te connaître toujours mieux pour t’aimer davantage et te servir avec zèle.

readings:
  patristicReading:
    - title: DISCOURS DE SAINT ATHANASE SUR L’INCARNATION DU VERBE
      content: |-
       Le Verbe de Dieu, incorporel, incorruptible et immatériel, est arrivé dans notre région, bien qu’il n’en ait pas été loin auparavant. En effet, il n’avait laissé aucune partie de la création privée de sa présence, car il remplissait tout, lui qui demeure auprès de son Père. Mais il s’est rendu présent en s’abaissant à cause de son amour pour nous, et il s’est manifesté à nous. ~
       Il a eu pitié de notre race, Il a eu compassion de notre faiblesse ; il a condescendu à notre corruption ; il n’a pas accepté que la mort domine sur nous ; il n’a pas voulu voir périr ce qui avait commencé, ni échouer ce que son Père avait accompli en créant les hommes. Il a donc pris un corps, et un corps qui n’est pas différent du nôtre. Car il ne voulait pas seulement être dans un corps, ou seulement se manifester. S’il avait voulu seulement se manifester, il aurait pu réaliser cette théophanie avec plus de puissance. Mais non : c’est notre corps qu’il a pris. ~
       Dans le sein de la Vierge, il construisit pour lui-même le temple de son corps ; il en fit son instrument adapté, pour se faire connaître et pour y demeurer. Après avoir pris parmi nos corps un corps de même espèce, comme nous sommes tous soumis à la corruption de la mort, il le livra à la mort pour nous tous, et l’offrit à son père. Il a fait cela par amour pour les hommes. Ainsi, puisque tous mourraient en lui, la loi soumettant les hommes à la corruption serait annulée : en effet, elle déploierait toute sa force contre le corps du Seigneur, et elle n’aurait plus désormais le pouvoir de frapper ses pareils, les hommes. Le Verbe rendrait incorruptibles de nouveau les hommes revenus à la corruption ; il leur communiquerait la vie du fait de sa mort : par le corps qu’il s’était approprié et par la grâce de la résurrection, il écarterait la mort loin d’eux, comme une paille consumée par le feu. ~
       Le Verbe prit un corps capable de mourir afin que ce corps, en participant au Verbe qui est au-dessus de tout, devienne capable de mourir pour tous, reste incorruptible grâce au Verbe qui y demeure, et enfin délivre de la corruption tous les hommes par la grâce de la résurrection.
       Le Verbe offrit donc à la mort le corps qu’il avait pris, comme un sacrifice et une victime sans aucune tache, et aussitôt il anéantit la mort en en délivrant tous les hommes ses pareils par l’offrande de ce corps qui leur ressemble.
       Il est juste que le Verbe de Dieu, supérieur à tous, qui offrait son propre temple, son corps, en rançon pour tous, ait payé notre dette par sa mort. Uni à tous les hommes par un corps semblable, il est juste que le Fils incorruptible de Dieu revête tous les hommes d’incorruptibilité, selon la promesse apportée par sa résurrection. Car la corruption elle-même, impliquée dans la mort, n’a plus aucun pouvoir sur les hommes à cause du Verbe qui demeure parmi eux dans un corps unique.
       
      responsory: |-
        R/ Le Verbe s’est fait chair,
        nous avons vu sa gloire, alléluia.
        
        Père j’ai manifesté ton nom
        aux hommes que tu m’as donnés ;
        ils ont vu que tu m’as envoyé !

        Je veux que là où je suis
        ceux que tu m’as donnés
        soient aussi avec moi.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Si 15,5 (Vg)
    content: |-
      Dans son Église, le Seigneur lui a donné la parole ;
      >il l’a rempli de l’esprit de sagesse et d’intelligence,
      >et l’a revêtu de gloire, alléluia.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as appelé le bienheureux évêque Athanase
    >à devenir un défenseur remarquable
    >de la divinité de ton Fils ; *
    Alors que nous nous réjouissons
    >de son enseignement et de sa protection,
    Accorde-nous, dans ta bienveillance,
    >de te connaître toujours mieux /
    Et de t’aimer davantage.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Jn 5, 1-5
      headline: « La victoire remportée sur le monde, c’est notre foi »
      content: |-
        Bien-aimés,
        celui qui croit que Jésus est le Christ,
        celui-là est né de Dieu ;
        celui qui aime le Père qui a engendré
        aime aussi le Fils qui est né de lui.
        Voici comment nous reconnaissons
        que nous aimons les enfants de Dieu :
        lorsque nous aimons Dieu
        et que nous accomplissons ses commandements.
        Car tel est l’amour de Dieu :
        garder ses commandements ;
        et ses commandements ne sont pas un fardeau,
        puisque tout être qui est né de Dieu
        est vainqueur du monde.
        Or la victoire remportée sur le monde,
        c’est notre foi.
        Qui donc est vainqueur du monde ?
        N’est-ce pas celui qui croit
        que Jésus est le Fils de Dieu ?
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 36 (37), 3-4, 5-6, 30-31
      refAbbr: 36, 30a
      chorus:
      - chorusRef: 36, 30a
        chorus: Les lèvres du juste redisent la sagesse.
      content: |-
        Fais confiance au Seigneur, agis bien,
        habite la terre et reste fidèle ;
        mets ta joie dans le Seigneur :
        il comblera les désirs de ton cœur.

        Dirige ton chemin vers le Seigneur,
        fais-lui confiance, et lui, il agira.
        Il fera lever comme le jour ta justice,
        et ton droit comme le plein midi.

        Les lèvres du juste redisent la sagesse
        et sa bouche énonce le droit.
        La loi de son Dieu est dans son cœur ;
        il va, sans craindre les faux pas.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 22-25a
      headline: « Quand on vous persécutera dans une ville, fuyez dans une autre »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Vous serez détestés de tous à cause de mon nom ;
        mais celui qui aura persévéré jusqu’à la fin,
        celui-là sera sauvé.
        Quand on vous persécutera dans une ville,
        fuyez dans une autre.
        Amen, je vous le dis :
        vous n’aurez pas fini de passer dans toutes les villes d’Israël
        quand le Fils de l’homme viendra.
        Le disciple n’est pas au-dessus de son maître,
        ni le serviteur au-dessus de son seigneur.
        Il suffit que le disciple soit comme son maître,
        et le serviteur, comme son seigneur. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Regarde, Seigneur, les offrandes que nous te présentons
    >en faisant mémoire du bienheureux Athanase ; *
    que la confession de ta vérité conduise au salut /
    >ceux qui gardent la foi pure qui fut la sienne.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: 1Co 3,11
    content: |-
      La pierre de fondation, personne ne peut en poser d’autre
      >que celle qui s’y trouve : Jésus Christ, alléluia.
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Dieu tout-puissant : +
    >puisqu’avec le bienheureux Athanase,
    >nous confessons fermement,
    >la divinité de ton Fils unique,*
    lui qui est vraiment Dieu, *
    qu’il nous procure dans ce sacrement
    >vie et force pour toujours.
    Lui qui vit et règne pour les siècles des siècles.