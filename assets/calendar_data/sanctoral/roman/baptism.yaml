celebration:
  title: Baptême du Seigneur
  color: white

oration:
- Dieu éternel et tout-puissant, quand le Christ fut baptisé dans le Jourdain, et que l’Esprit Saint reposa sur lui, tu l’as désigné comme ton Fils bien-aimé ; accorde à tes fils adoptifs, nés de l’eau et de l’Esprit, de se garder toujours dans ta sainte volonté.

firstVespers:
  hymn:
  - jesus-parait
  psalmody:
  - psalm: PSALM_134_1
    antiphon:
    - Jean Baptiste partit dans le désert, proclamant un baptême de conversion pour le pardon des péchés.
  - psalm: PSALM_134_2
    antiphon:
    - Moi, je vous baptise dans l’eau ; lui vous baptisera dans l’Esprit et le feu.
  - psalm: NT_7
    antiphon:
    - Dès qu’il fut baptisé, Jésus sortit de l’eau et les cieux s’ouvrirent pour lui.
  reading:
    biblicalReference: Ac 10, 37-38
    content: |-
      Vous savez ce qui s’est passé à travers tout le pays des juifs, depuis les débuts en Galilée, après le baptême proclamé par Jean : Jésus de Nazareth, Dieu l’a consacré par l’Esprit Saint et rempli de sa force. Là où il passait, il faisait le bien et il guérissait tous ceux qui étaient sous le pouvoir du démon. Car Dieu était avec lui.
  responsory: |-
    R/ Fils bien-aimé de Dieu,
    l’Esprit du Seigneur repose sur toi.
    V/ La voix du Seigneur domine les eaux. R/
    Gloire au Père. R/
  evangelicAntiphon:
    common: Le Sauveur vient au baptême relever notre humanité déchue, nous guérir à travers les eaux et nous vêtir d’immortalité.
  intercession:
    content: |-
      En ce jour où le Christ, notre Rédempteur, a voulu être baptisé par Jean dans le Jourdain, supplions-le :

      R/ Seigneur, envoie sur nous ton Esprit.

      Serviteur de Dieu, en qui le Père met sa joie,
      — envoie sur nous ton Esprit.

      Élu de Dieu, toi qui ne brises pas le roseau froissé,
      — prends pitié des hommes qui te cherchent en vérité.

      Lumière des nations, toi que le Père a choisi pour sceller la nouvelle Alliance,
      — ouvre les yeux des aveugles par l’eau du baptême.

      Sauveur du monde, toi que le Père a consacré dans l’Esprit,
      — consacre-nous dans la vérité.

      Fils de Dieu, notre espérance, toi qui conduis les hommes au salut,
      — reçois nos frères défunts dans ton Royaume.

invitatory:
  antiphon:
  - Adorons le Seigneu Jésus, le Fils bien-aimé de Dieu notre Père.

readings:
  hymn:
  - sauves-des-memes-eaux
  psalmody:
  - psalm: PSALM_28
    antiphon:
    - |-
      Aujourd’hui, une voix venue des cieux nous dit : Celui-ci est mon Fils bien-aimé.
  - psalm: PSALM_65_1
    antiphon:
    - Il vous baptisera dans l’Esprit Saint et le feu.
  - psalm: PSALM_65_2
    antiphon:
    - Peuples, bénissez notre Dieu, c’est lui qui nous donne la vie.
  verse: |-
    V/ Celui-ci est mon Fils bien-aimé,
    Écoutez-le.
  biblicalReading:
  - title: LECTURE DU LIVRE D’ISAÏE
    subtitle: Le « serviteur » de Dieu, lumière des peuples
    ref: Is 42, 1-9; 49, 1-9
    content: |-
      Voici mon serviteur que je soutiens, mon élu qui a toute ma faveur. J’ai fait reposer sur lui mon esprit ; aux nations, il proclamera le droit. Il ne criera pas, il ne haussera pas le ton, il ne fera pas entendre sa voix au-dehors. Il ne brisera pas le roseau qui fléchit, il n’éteindra pas la mèche qui faiblit, il proclamera le droit en vérité. Il ne faiblira pas, il ne fléchira pas, jusqu’à ce qu’il établisse le droit sur la terre, et que les îles lointaines aspirent à recevoir ses lois.
      Ainsi parle Dieu, le SEIGNEUR, qui crée les cieux et les déploie, qui affermit la terre et ce qu’elle produit ; il donne le souffle au peuple qui l’habite, et l’esprit à ceux qui la parcourent :
      Moi, le SEIGNEUR, je t’ai appelé selon la justice ; je te saisis par la main, je te façonne, je fais de toi l’alliance du peuple, la lumière des nations : tu ouvriras les yeux des aveugles, tu feras sortir les captifs de leur prison, et, de leur cachot, ceux qui habitent les ténèbres.
      Je suis le SEIGNEUR, tel est mon nom ; et je ne céderai pas ma gloire à un autre, ni ma louange aux idoles. Les événements passés, voici qu’ils sont arrivés. Les nouveaux, c’est moi qui les annonce ; avant qu’ils ne germent, je vous les fais connaître.
      Écoutez-moi, îles lointaines ! Peuples éloignés, soyez attentifs ! J’étais encore dans le sein maternel quand le SEIGNEUR m’a appelé ; j’étais encore dans les entrailles de ma mère quand il a prononcé mon nom. Il a fait de ma bouche une épée tranchante, il m’a protégé par l’ombre de sa main ; il a fait de moi une flèche acérée, il m’a caché dans son carquois.
      Il m’a dit : « Tu es mon serviteur, Israël, en toi je manifesterai ma splendeur. » Et moi, je disais : « Je me suis fatigué pour rien, c’est pour le néant, c’est en pure perte que j’ai usé mes forces. » Et pourtant, mon droit subsistait auprès du SEIGNEUR, ma récompense, auprès de mon Dieu.
      Maintenant le SEIGNEUR parle, lui qui m’a façonné dès le sein de ma mère pour que je sois son serviteur, que je lui ramène Jacob, que je lui rassemble Israël. Oui, j’ai de la valeur aux yeux du SEIGNEUR, c’est mon Dieu qui est ma force.
      Et il dit : « C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob, ramener les rescapés d’Israël : je fais de toi la lumière des nations, pour que mon salut parvienne jusqu’aux extrémités de la terre. »
      Ainsi parle le SEIGNEUR, rédempteur et saint d’Israël, au serviteur méprisé, détesté par les nations, esclave des puissants : Les rois verront, ils se lèveront, les grands se prosterneront, à cause du SEIGNEUR qui est fidèle, du Saint d’Israël qui t’a choisi.
      Ainsi parle le SEIGNEUR : Au temps favorable, je t’ai exaucé, au jour du salut, je t’ai secouru. Je t’ai façonné, établi, pour que tu sois l’alliance du peuple, pour relever le pays, restituer les héritages dévastés et dire aux prisonniers : « Sortez ! », aux captifs des ténèbres : « Montrez-vous ! » Au long des routes, ils pourront paître ; sur les hauteurs dénudées seront leurs pâturages.
    responsory: R/ Jésus, tu es le Messie, le Fils du Dieu vivant !
  patristicReading:
  - title: SERMON DE SAINT GRÉGOIRE DE NAZIANZE POUR LA FÊTE DES LUMIÈRES
    subtitle: « Ceux qui voient la lumière sont dans la lumière »
    content: |-
      Le Christ est illuminé par le baptême, resplendissons avec lui ; il est plongé dans l’eau, descendons avec lui pour remonter avec lui. ~
      Jean est en train de baptiser, et Jésus s’approche ; peut-être pour sanctifier celui qui va le baptiser ; certainement pour ensevelir tout entier le vieil Adam au fond de l’eau. Mais avant cela et en vue de cela, il sanctifie le Jourdain. Et comme il est esprit et chair, il veut pouvoir initier par l’eau et par l’Esprit.
      Le Baptiste n’accepte pas de le baptiser. Jésus insiste. Mais : %C’est moi qui ai besoin d’être baptisé par toi%. Voilà comment la lampe s’adresse au soleil, la voix à la Parole, l’ami de l’Époux à l’Époux, %le plus grand des enfants des femmes au premier-né de toute la création%; celui qui avait bondi dans le sein de sa mère à celui qui avait été adoré dans le sein de la sienne, le précurseur présent et futur à celui qui vient d’apparaître et qui réapparaîtra.%C’est moi qui ai besoin d’être baptisé par toi%. Que Jean ajoute donc : et en me sacrifiant pour toi. Il savait en effet qu’il recevrait le baptême du martyre ; ou, comme Pierre, que ses pieds ne seraient pas seuls purifiés. ~
      Mais voici Jésus qui remonte hors de l’eau. En effet, il porte le monde. Avec lui, il le fait monter% ;il voit les cieux se déchirer et s’ouvrir%, alors qu’Adam les avait fermés pour lui et sa descendance, quand il fut expulsé du paradis que défendait l’épée de feu.
      Alors l’Esprit atteste sa divinité, car il accourt vers celui qui est de même nature. Une voix descend du ciel, pour rendre témoignage à celui qui en venait ; et, sous l’apparence d’une colombe, elle honore le corps, puisque Dieu, en se montrant sous une apparence corporelle, divinise aussi le corps. C’est ainsi que, bien des siècles auparavant, une colombe est venue annoncer la bonne nouvelle de la fin du déluge. ~
      Pour nous, honorons aujourd’hui le baptême du Christ, et célébrons cette fête de façon irréprochable. ~
      Soyez entièrement purifiés, et purifiez-vous encore. Car rien ne donne à Dieu autant de joie que le redressement et salut de l’homme : c’est à cela que tend tout ce discours, tout ce mystère. Soyez%comme des sources de lumière dans le monde%, une force vitale pour les autres hommes. Comme des lumières parfaites secondant la grande Lumière, soyez initiés à la vie de lumière qui est au ciel ; soyez illuminés avec plus de clarté et d’éclat par la sainte Trinité, dont vous avez reçu maintenant, d’une façon restreinte, un seul rayon, venant de l’unique divinité, en Jésus Christ notre Seigneur, à qui appartiennent la gloire et la puissance pour les siècles des siècles. Amen.
    responsory: R/ Seigneur Jésus, tu es la lumière du monde !

morning:
  hymn:
  - peuples-criez-de-joie
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - |-
      Le soldat baptise son Roi ; le serviteur, son Maître ; Jean, son Sauveur. L’eau du Jourdain s’étonne, la colombe témoigne, et la voix du Père proclame : Celui-ci est mon Fils.
  - psalm: OT_41
    antiphon:
    - Les eaux furent sanctifiées quand la gloire du Christ apparut au monde. Puisez aux sources du Sauveur, car toute créature est sanctifiée par le Christ.
  - psalm: PSALM_149
    antiphon:
    - Toi qui purifies l’humanité dans l’esprit et le feu, toi, notre Sauveur et notre Dieu, nous te glorifions.
  reading:
    biblicalReference: Is 61, 1-2a
    content: L’Esprit du Seigneur est sur moi parce que le Seigneur m’a consacré par l’onction. Il m’a envoyé porter la bonne nouvelle aux pauvres, guérir ceux qui ont le cœur brisé, annoncer aux prisonniers la délivrance, et aux captifs la liberté, annoncer une année de bienfaits accordée par le Seigneur.
  responsory: |-
    R/ Gloire à toi, Messie de Dieu, Fils du Dieu vivant !
    V/ Tu es venu par l’eau et par le sang. R/
    V/ Le ciel s’est ouvert, le Père a parlé. R/
  evangelicAntiphon:
    common:
    - |-
      Marqué du signe de l’Esprit, Jésus remonte des eaux ; le Précurseur le reconnaît et prophétise : Voici l’Agneau qui nous donne la paix et consacre le monde.
  intercession:
    content: |-
      Supplions le Messie qui fut manifesté aux hommes en recevant le baptême de Jean :

      R/ Kyrie, eleison.

      Ô Christ, descendu dans les eaux du Jourdain, tu t’es mis au rang des pécheurs,
      — relève en toi l’homme déchu.

      Par ton baptême, tu as fait de nous les enfants du Père,
      — répands l’Esprit d’adoption sur ceux que tu aimes.

      Par ton baptême, tu nous pénètres de ta lumière,
      — envoie-nous dans le monde porter témoignage de l’Évangile.

      Par ton baptême, tu as sanctifié la création,
      — renouvelle l’esprit d’adoration de tous les baptisés.

      Par ton baptême, tu as ouvert aux croyants la porte de la vie,
      — donne à tous les hommes d’accéder au salut.

middleOfDay:
  tierce:
    antiphon: |-
      Jean se refusait à baptiser Jésus : C’est moi qui ai besoin de ton baptême et c’est toi qui viens à moi !
    reading:
      biblicalReference: Is 11, 1-2
      content: |-
        Un rameau sortira de la souche de Jessé (père de David), un rejeton jaillira de ses racines. Sur lui reposera l’esprit du Seigneur : esprit de sagesse et de discernement, esprit de conseil et de force, esprit de connaissance et de crainte du Seigneur, qui lui inspirera la crainte du Seigneur.
    responsory: |-
      V/ Il faut que lui grandisse,
      et que je diminue.
  sexte:
    antiphon: C’est ainsi qu’il nous convient d’accomplir toute justice.
    reading:
      biblicalReference: Is 42, 1
      content: Voici mon serviteur que je soutiens, mon élu en qui j’ai mis toute ma joie. J’ai fait reposer sur lui mon esprit, devant les nations il fera paraître le jugement que j’ai prononcé.
    responsory: |-
      V/ Voici mon serviteur que je soutiens,
      mon élu en qui j’ai mis toute ma joie.
  none:
    antiphon: J’ai vu l’Esprit, tel une colombe, descendre du ciel et demeurer sur lui.
    reading:
      biblicalReference: Is 49, 6
      content: |-
        Le Seigneur parle ainsi : C’est trop peu que tu sois mon serviteur pour relever les tribus de Jacob et ramener les rescapés d’Israël : je vais faire de toi la lumière des nations, pour que mon salut parvienne jusqu’aux extrémités de la terre.
    responsory: |-
      V/ J’ai fait reposer sur lui mon Esprit,
      il sera la lumière des nations.

vespers:
  hymn:
  - l-esprit-de-dieu-repose-sur-moi
  psalmody:
  - psalm: PSALM_109
    antiphon:
    - |-
      Il y eut une voix venant de la nuée, la voix du Père qui disait : Celui-ci est mon Fils bien-aimé : écoutez-le.
  - psalm: PSALM_111
    antiphon:
    - Au Jourdain, le Sauveur a brisé la tête du dragon, pour que l’homme échappe à son pouvoir.
  - psalm: NT_11
    antiphon:
    - |-
      Aujourd’hui, se dévoile un grand mystère : dans le Jourdain, le Créateur des hommes enlève leurs péchés.
  reading:
    biblicalReference: Ac 10, 37-38
    content: |-
      Vous savez ce qui s’est passé à travers tout le pays des juifs, depuis les débuts en Galilée, après le baptême proclamé par Jean : Jésus de Nazareth, Dieu l’a consacré par l’Esprit Saint et rempli de sa force. Là où il passait, il faisait le bien et il guérissait tous ceux qui étaient sous le pouvoir du démon. Car Dieu était avec lui.
  responsory: |-
    R/ Fils bien-aimé de Dieu,
    l’Esprit du Seigneur repose sur toi.
    V/ La voix du Seigneur domine les eaux. R/
    Gloire au Père. R/
  evangelicAntiphon:
    common:
    - Jésus nous a aimés, il nous a lavés de nos péchés par son sang. Jésus a fait de nous un royaume et des prêtres pour Dieu son Père. À lui gloire et puissance pour toujours !
  intercession:
    content: |-
      En ce jour où le Christ, notre Rédempteur, a voulu être baptisé par Jean dans le Jourdain, supplions-le :

      R/ Seigneur, envoie sur nous ton Esprit.

      Serviteur de Dieu, en qui le Père met sa joie,
      — envoie sur nous ton Esprit.

      Élu de Dieu, toi qui ne brises pas le roseau froissé,
      — prends pitié des hommes qui te cherchent en vérité.

      Lumière des nations, toi que le Père a choisi pour sceller la nouvelle Alliance,
      — ouvre les yeux des aveugles par l’eau du baptême.

      Sauveur du monde, toi que le Père a consacré dans l’Esprit,
      — consacre-nous dans la vérité.

      Fils de Dieu, notre espérance, toi qui conduis les hommes au salut,
      — reçois nos frères défunts dans ton Royaume.
mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Mt 3,16-17
    content: |-
      Dès que Jésus fut baptisé, les cieux s’ouvrirent :
      >l’Esprit, comme une colombe, reposa sur lui.
      Et la voix du Père retentit :
      >Celui-ci est mon Fils bien-aimé
      >en qui je trouve ma joie.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >quand le Christ fut baptisé dans le Jourdain,
    >et que l’Esprit Saint descendit sur lui,
    >tu l’as manifesté solennellement comme ton Fils bien-aimé ; *
    accorde à tes enfants d’adoption,
    >qui ont reçu la nouvelle naissance de l’eau et de l’Esprit, /
    >d’être toujours fidèles à ce qui te plaît.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  - |-
    Seigneur Dieu, +
    >c’est dans la réalité de notre chair
    >que ton Fils unique est apparu ; *
    puisqu’à son aspect extérieur,
    >nous l’avons reconnu semblable à nous, /
    fais que par lui nous soyons intérieurement transformés.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - cycle: A
      biblicalRef: Is 42, 1-4.6-7
      headline: « Voici mon serviteur, qui a toute ma faveur »
      content: |-
        Ainsi parle le Seigneur :
        « Voici mon serviteur que je soutiens,
        >mon élu qui a toute ma faveur.
        J’ai fait reposer sur lui mon esprit ;
        >aux nations, il proclamera le droit.
        Il ne criera pas, il ne haussera pas le ton,
        >il ne fera pas entendre sa voix au-dehors.
        Il ne brisera pas le roseau qui fléchit,
        >il n’éteindra pas la mèche qui faiblit,
        >il proclamera le droit en vérité.
        Il ne faiblira pas, il ne fléchira pas,
        >jusqu’à ce qu’il établisse le droit sur la terre,
        >et que les îles lointaines
        >aspirent à recevoir ses lois.
        Moi, le Seigneur, je t’ai appelé selon la justice ;
        >je te saisis par la main, je te façonne,
        >je fais de toi l’alliance du peuple,
        >la lumière des nations :
        tu ouvriras les yeux des aveugles,
        >tu feras sortir les captifs de leur prison,
        >et, de leur cachot, ceux qui habitent les ténèbres. »
    - cycle: B
      biblicalRef: Is 55, 1-11
      headline: « Venez, voici de l’eau ! Écoutez, et vous vivrez »
      content: |-
        Ainsi parle le Seigneur :
        Vous tous qui avez soif,
        >venez, voici de l’eau !
        Même si vous n’avez pas d’argent,
        >venez acheter et consommer,
        venez acheter du vin et du lait
        >sans argent, sans rien payer.
        Pourquoi dépenser votre argent pour ce qui ne nourrit pas,
        >vous fatiguer pour ce qui ne rassasie pas ?
        Écoutez-moi bien, et vous mangerez de bonnes choses,
        >vous vous régalerez de viandes savoureuses !
        Prêtez l’oreille ! Venez à moi !
        Écoutez, et vous vivrez.
        Je m’engagerai envers vous par une alliance éternelle :
        >ce sont les bienfaits garantis à David.
        Lui, j’en ai fait un témoin pour les peuples,
        >pour les peuples, un guide et un chef.
        Toi, tu appelleras une nation inconnue de toi ;
        >une nation qui ne te connaît pas accourra vers toi,
        à cause du Seigneur ton Dieu,
        >à cause du Saint d’Israël, car il fait ta splendeur.
        Cherchez le Seigneur tant qu’il se laisse trouver ;
        >invoquez-le tant qu’il est proche.
        Que le méchant abandonne son chemin,
        >et l’homme perfide, ses pensées !
        Qu’il revienne vers le Seigneur
        >qui lui montrera sa miséricorde,
        vers notre Dieu
        >qui est riche en pardon.
        Car mes pensées ne sont pas vos pensées,
        >et vos chemins ne sont pas mes chemins,
        - oracle du Seigneur.
        Autant le ciel est élevé au-dessus de la terre,
        >autant mes chemins sont élevés au-dessus de vos chemins,
        >et mes pensées, au-dessus de vos pensées.
        La pluie et la neige qui descendent des cieux
        >n’y retournent pas sans avoir abreuvé la terre,
        >sans l’avoir fécondée et l’avoir fait germer,
        donnant la semence au semeur
        >et le pain à celui qui doit manger ;
        ainsi ma parole, qui sort de ma bouche,
        >ne me reviendra pas sans résultat,
        sans avoir fait ce qui me plaît,
        >sans avoir accompli sa mission.
    - cycle: C
      biblicalRef: Is 40, 1-5.9-11
      headline: « La gloire du Seigneur se révélera, et tout être de chair verra »
      content: |-
        Consolez, consolez mon peuple,
        >- dit votre Dieu -
        >parlez au cœur de Jérusalem.
        Proclamez que son service est accompli,
        >que son crime est expié,
        qu’elle a reçu de la main du Seigneur
        >le double pour toutes ses fautes.
        Une voix proclame :
        >« Dans le désert, préparez le chemin du Seigneur ;
        >tracez droit, dans les terres arides,
        >une route pour notre Dieu.
        Que tout ravin soit comblé,
        >toute montagne et toute colline abaissées !
        que les escarpements se changent en plaine,
        >et les sommets, en large vallée !
        Alors se révélera la gloire du Seigneur,
        >et tout être de chair verra
        >que la bouche du Seigneur a parlé. »
        Monte sur une haute montagne,
        >toi qui portes la bonne nouvelle à Sion.
        Élève la voix avec force,
        >toi qui portes la bonne nouvelle à Jérusalem.
        Élève la voix, ne crains pas.
        Dis aux villes de Juda :
        >« Voici votre Dieu ! »
        Voici le Seigneur Dieu !
        Il vient avec puissance ;
        >son bras lui soumet tout.
        Voici le fruit de son travail avec lui,
        >et devant lui, son ouvrage.
        Comme un berger, il fait paître son troupeau :
        >son bras rassemble les agneaux,
        >il les porte sur son cœur,
        >il mène les brebis qui allaitent.      
  - partType: PSALM
    partContents:
    - cycle: A
      biblicalRef: Ps 28 (29), 1-2, 3ac-4, 3b.9c-10
      refAbbr: 28, 11b
      chorus:
      - chorusRef: 28, 11b
        chorus: |-
          Le Seigneur bénit son peuple
          en lui donnant la paix.
      content: |-
        Rendez au Seigneur, vous, les dieux,
        rendez au Seigneur gloire et puissance.
        Rendez au Seigneur la gloire de son nom,
        adorez le Seigneur, éblouissant de sainteté.

        La voix du Seigneur domine les eaux,
        le Seigneur domine la masse des eaux.
        Voix du Seigneur dans sa force,
        voix du Seigneur qui éblouit.

        Le Dieu de la gloire déchaîne le tonnerre,
        et tous dans son temple s’écrient : « Gloire ! »
        Au déluge le Seigneur a siégé ;
        il siège, le Seigneur, il est roi pour toujours !
    - cycle: B
      label: Cantique
      biblicalRef: Is 12, 2, 4bcd, 5-6
      refAbbr: Is 12, 3
      chorus:
      - chorusRef: Is 12, 3
        chorus: |-
          Exultant de joie, vous puiserez les eaux
          aux sources du salut !
      content: |-
        Voici le Dieu qui me sauve :
        j’ai confiance, je n’ai plus de crainte.
        Ma force et mon chant, c’est le Seigneur ;
        il est pour moi le salut.

        Rendez grâce au Seigneur,
        proclamez son nom,
        annoncez parmi les peuples ses hauts faits !
        Redites-le : « Sublime est son nom ! »

        Jouez pour le Seigneur, il montre sa magnificence,
        et toute la terre le sait.
        Jubilez, criez de joie, habitants de Sion,
        car il est grand au milieu de toi, le Saint d’Israël !
    - cycle: C
      biblicalRef: Ps 103 (104), 1c-3a, 3bc-4, 24-25, 27-28, 29-30
      refAbbr: 103, 1
      chorus:
      - chorusRef: 103, 1
        chorus: |-
          Bénis le Seigneur, ô mon âme ;
          Seigneur mon Dieu, tu es si grand !
      content: |-
        Revêts de magnificence,
        tu as pour manteau la lumière !
        Comme une tenture, tu déploies les cieux,
        tu élèves dans les eaux tes demeures.

        Des nuées, tu te fais un char,
        tu t’avances sur les ailes du vent ;
        tu prends les vents pour messagers,
        pour serviteurs, les flammes des éclairs.

        Quelle profusion dans tes œuvres, Seigneur !
        Tout cela, ta sagesse l’a fait ;
        la terre s’emplit de tes biens.
        Voici l’immensité de la mer,
        son grouillement innombrable d’animaux grands et petits.

        Tous, ils comptent sur toi
        pour recevoir leur nourriture au temps voulu.
        Tu donnes : eux, ils ramassent ;
        tu ouvres la main : ils sont comblés.

        Tu caches ton visage : ils s’épouvantent ;
        tu reprends leur souffle, ils expirent
        et retournent à leur poussière.
        Tu envoies ton souffle : ils sont créés ;
        tu renouvelles la face de la terre.
  - partType: READING_2
    partContents:
    - cycle: A
      biblicalRef: Ac 10, 34-38
      headline: « Dieu lui a donné l’onction d’Esprit Saint »
      content: |-
        En ces jours-là,
        quand Pierre arriva à Césarée,
        >chez un centurion de l’armée romaine,
        il prit la parole et dit :
        >« En vérité, je le comprends,
        >Dieu est impartial :
        >il accueille, quelle que soit la nation,
        >celui qui le craint
        >et dont les œuvres sont justes.
        Telle est la parole qu’il a envoyée aux fils d’Israël,
        >en leur annonçant la bonne nouvelle de la paix par Jésus Christ,
        >lui qui est le Seigneur de tous.
        Vous savez ce qui s’est passé à travers tout le pays des Juifs,
        >depuis les commencements en Galilée,
        >après le baptême proclamé par Jean :
        Jésus de Nazareth,
        >Dieu lui a donné l’onction d’Esprit Saint et de puissance.
        Là où il passait, il faisait le bien
        >et guérissait tous ceux qui étaient sous le pouvoir du diable,
        car Dieu était avec lui. »
    - cycle: B
      biblicalRef: 1Jn 5, 1-9
      headline: « L’Esprit, l’eau et le sang »
      content: |-
        Bien-aimés,
        celui qui croit que Jésus est le Christ,
        >celui-là est né de Dieu ;
        celui qui aime le Père qui a engendré
        >aime aussi le Fils qui est né de lui.
        Voici comment nous reconnaissons
        >que nous aimons les enfants de Dieu :
        lorsque nous aimons Dieu
        >et que nous accomplissons ses commandements.
        Car tel est l’amour de Dieu :
        >garder ses commandements ;
        et ses commandements ne sont pas un fardeau,
        puisque tout être qui est né de Dieu
        >est vainqueur du monde.
        Or la victoire remportée sur le monde,
        >c’est notre foi.
        Qui donc est vainqueur du monde ?
        N’est-ce pas celui qui croit
        >que Jésus est le Fils de Dieu ?
        C’est lui, Jésus Christ,
        >qui est venu par l’eau et par le sang :
        non pas seulement avec l’eau,
        >mais avec l’eau et avec le sang.
        Et celui qui rend témoignage, c’est l’Esprit,
        >car l’Esprit est la vérité.
        En effet, ils sont trois qui rendent témoignage,
        >l’Esprit, l’eau et le sang,
        et les trois n’en font qu’un.
        Nous acceptons bien le témoignage des hommes ;
        >or, le témoignage de Dieu a plus de valeur,
        puisque le témoignage de Dieu,
        >c’est celui qu’il rend à son Fils.
    - cycle: C
      biblicalRef: Tt 2, 11-14 ; 3, 4-7
      headline: « Par le bain du baptême, Dieu nous a fait renaître et nous a renouvelés dans l’Esprit Saint »
      content: |-
        Bien-aimé,
        la grâce de Dieu s’est manifestée
        >pour le salut de tous les hommes.
        Elle nous apprend à renoncer à l’impiété
        >et aux convoitises de ce monde,
        et à vivre dans le temps présent de manière raisonnable,
        >avec justice et piété,
        attendant que se réalise la bienheureuse espérance :
        >la manifestation de la gloire
        >de notre grand Dieu et Sauveur, Jésus Christ.
        Car il s’est donné pour nous
        afin de nous racheter de toutes nos fautes,
        >et de nous purifier
        pour faire de nous son peuple,
        >un peuple ardent à faire le bien.
        Lorsque Dieu, notre Sauveur,
        >a manifesté sa bonté et son amour pour les hommes,
        il nous a sauvés,
        >non pas à cause de la justice de nos propres actes,
        >mais par sa miséricorde.
        Par le bain du baptême, il nous a fait renaître
        >et nous a renouvelés dans l’Esprit Saint.
        Cet Esprit, Dieu l’a répandu sur nous en abondance,
        >par Jésus Christ notre Sauveur,
        afin que, rendus justes par sa grâce,
        >nous devenions en espérance
        >héritiers de la vie éternelle.
  - partType: GOSPEL
    partContents:
    - cycle: A
      biblicalRef: Mt 3, 13-17
      headline: « Dès que Jésus fut baptisé, il vit l’Esprit de Dieu venir sur lui »
      acclamationAntiphon: |-
        Aujourd’hui, le ciel s’est ouvert,
        l’Esprit descend sur Jésus,
        et la voix du Père domine les eaux :
        « Celui-ci est mon Fils bien-aimé ! »
      content: |-
        Alors paraît Jésus.
        Il était venu de Galilée jusqu’au Jourdain
        >auprès de Jean,
        >pour être baptisé par lui.
        Jean voulait l’en empêcher et disait :
        >« C’est moi qui ai besoin d’être baptisé par toi,
        >et c’est toi qui viens à moi ! »
        Mais Jésus lui répondit :
        >« Laisse faire pour le moment,
        >car il convient
        >que nous accomplissions ainsi toute justice. »
        Alors Jean le laisse faire.
        Dès que Jésus fut baptisé,
        >il remonta de l’eau,
        et voici que les cieux s’ouvrirent :
        >il vit l’Esprit de Dieu
        >descendre comme une colombe et venir sur lui.
        Et des cieux, une voix disait :
        >« Celui-ci est mon Fils bien-aimé,
        >en qui je trouve ma joie. »
    - cycle: B
      biblicalRef: Mc 1, 7-11
      headline: « Tu es mon Fils bien-aimé ; en toi, je trouve ma joie »
      acclamationAntiphon: |-
        Voyant Jésus venir à lui, Jean déclara :
        « Voici l’Agneau de Dieu,
        qui enlève le péché du monde. »
      content: |-
        En ce temps-là,
        Jean le Baptiste proclamait :
        >« Voici venir derrière moi
        >celui qui est plus fort que moi ;
        >je ne suis pas digne de m’abaisser
        >pour défaire la courroie de ses sandales.
        Moi, je vous ai baptisés avec de l’eau ;
        >lui vous baptisera dans l’Esprit Saint. »
        En ces jours-là,
        Jésus vint de Nazareth, ville de Galilée,
        >et il fut baptisé par Jean dans le Jourdain.
        Et aussitôt, en remontant de l’eau,
        >il vit les cieux se déchirer
        et l’Esprit descendre sur lui comme une colombe.
        Il y eut une voix venant des cieux :
        >« Tu es mon Fils bien-aimé ;
        >en toi, je trouve ma joie. »
    - cycle: C
      biblicalRef: Lc 3, 15-16.21-22
      headline: « Comme Jésus priait, après avoir été baptisé, le ciel s’ouvrit »
      acclamationAntiphon: |-
        Voici venir un plus fort que moi,
        proclame Jean Baptiste ;
        c’est lui qui vous baptisera
        dans l’Esprit Saint et le feu.
      content: |-
        En ce temps-là,
        le peuple venu auprès de Jean le Baptiste était en attente,
        et tous se demandaient en eux-mêmes
        >si Jean n’était pas le Christ.
        Jean s’adressa alors à tous :
        >« Moi, je vous baptise avec de l’eau ;
        >mais il vient, celui qui est plus fort que moi.
        Je ne suis pas digne de dénouer la courroie de ses sandales.
        Lui vous baptisera dans l’Esprit Saint et le feu. »
        Comme tout le peuple se faisait baptiser
        et qu’après avoir été baptisé lui aussi, Jésus priait,
        >le ciel s’ouvrit.
        L’Esprit Saint, sous une apparence corporelle, comme une colombe,
        >descendit sur Jésus,
        et il y eut une voix venant du ciel :
        >« Toi, tu es mon Fils bien-aimé ;
        >en toi, je trouve ma joie. »
  offeringPrayer:
  - |-
    Accueille, Seigneur, les offrandes que nous te présentons
    >en ce jour où nous est révélé ton Fils bien-aimé : *
    que les dons de tes fidèles deviennent ainsi le sacrifice /
    >de Celui qui, dans sa miséricorde,
    >a voulu laver le monde de ses péchés : Jésus, le Christ.
    Lui qui vit et règne pour les siècles des siècles.
  prefaceList:
  - baptism_of_the_lord
  communionAntiphon:
  - biblicalReference: Jn 1,32. 34
    content: |-
      Voici celui dont Jean Baptiste disait :
      >« Moi, j’ai vu et je rends témoignage :
      >c’est lui le Fils de Dieu. »
  prayerAfterCommunion:
  - |-
    Rassasiés par ce don sacré,
    >nous implorons ta bonté, Seigneur ; *
    >accorde-nous d’écouter fidèlement ton Fils unique,
    >afin de pouvoir être appelés tes fils, /
    >et de l’être vraiment.
    Par le Christ, notre Seigneur.
