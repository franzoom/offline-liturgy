celebration:
  title: Saint Barnabé
  subtitle: apôtre
  description: Barnabé, qui était cypriote, apparaît peu après la Pentecôte dans la communauté de Jérusalem, puis à Antioche où il introduit Saul de Tarse parmi les frères. Ils partent ensemble pour évangéliser l’Asie mineure mais, après un différend, Barnabé devait regagner Chypre. Cet homme aux vues larges a exercé un rôle capital dans l’essor missionnaire de l’Église.
  commons:
    - apostles
  color: red

invitatory:
  antiphon:
  - Exultons de joie, alléluia ! L’Esprit de Dieu nous a donné les paroles des prophètes.

oration:
  - Dieu qui as dit de mettre à part saint Barnabé, cet homme plein de foi et de l’Esprit Saint, pour qu’il porte aux païens le message du salut, fais que l’Évangile du Christ, dont il fut l’Apôtre courageux, soit encore annoncé fidèlement en paroles et en actes.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT CHROMACE D’AQUILÉE
      content: |-
        %Vous êtes la lumière du monde. Une ville située sur une montagne ne peut être cachée. Et l’on n’allume pas une lampe pour la mettre sous le boisseau ; on la met sur le lampadaire, et elle brille pour tous ceux qui sont dans la maison%. Le Seigneur avait appelé ses disciples sel de la terre parce qu’ils ont relevé par la saveur de la sagesse céleste les cœurs humains affadis par le démon. Et maintenant il les appelle %lumière du monde% parce que, éclairés par lui, qui est la lumière éternelle et véritable, ils sont devenus à leur tour une lumière dans les ténèbres.
        Parce qu’il est lui-même le %Soleil de justice% il peut aussi appeler ses disciples %lumière du monde% ; c’est par eux, comme par des rayons étincelants, qu’il déverse la lumière de sa connaissance sur la terre entière ; en effet, ils ont chassé les ténèbres de l’erreur loin du cœur des hommes, en montrant la lumière de la vérité.
        Éclairés par eux, nous-mêmes, de ténèbres que nous étions, sommes devenus lumière, comme dit saint Paul : %Autrefois, vous n’étiez que ténèbres ; maintenant, dans le Seigneur, vous êtes devenus lumière ; vivez comme des fils de la lumière%. Et encore : %Vous n’appartenez pas à la nuit ni aux ténèbres ; vous êtes tous des fils de la lumière, des fils du jour%. Saint Jean a eu raison d’affirmer dans sa lettre : %Dieu est lumière%, et : %Celui qui demeure en Dieu est dans la lumière comme il est lui-même dans la lumière%. Aussi, puisque nous avons la joie d’être délivrés des ténèbres de l’erreur, nous devons vivre dans la lumière, comme des fils de lumière. ~ Ce qui fait dire à l’Apôtre : %Parmi eux, vous apparaissez comme des sources de lumière dans le monde, vous qui portez la parole de vie%.
        Si nous n’agissons pas ainsi, on verra que, pour notre malheur comme pour celui des autres, nous couvrons et nous cachons par notre manque de foi comme par un voile les bienfaits de cette lumière si nécessaire. Aussi savons-nous, pour l’avoir lu dans l’Évangile, que nous encourons le châtiment mérité par celui qui avait reçu un talent pour lui faire gagner le ciel, et qui a mieux aimé le cacher que de le confier à la banque.
        C’est pourquoi cette lampe resplendissante, qui a été allumée pour servir à notre salut, doit toujours briller en nous. Nous avons en effet la lampe du commandement céleste et de la grâce spirituelle, ce dont David a témoigné ainsi : %Ta parole est une lampe pour mes pas, une lumière pour ma route%. Et Salomon a dit : %Le précepte de la loi est une lampe%. ~
        Cette lampe de la loi et de la foi, nous ne devons donc pas la cacher, mais l’installer toujours dans l’Église comme sur le lampadaire, pour le salut d’un grand nombre, afin de jouir nous-mêmes de la lumière de sa vérité, et d’en éclairer tous les croyants.
      responsory: |-
        R/ Christ est notre lumière,
        notre soleil levant !
        
        Qui regarde vers lui resplendira,
        point d’ombre sur son visage.
        
        Il vient nous visiter,
        en lui la joie de notre cœur.

morning:
  evangelicAntiphon:
    common: 
    - Heureux es-tu, Barnabé, compagnon de Paul, tu as vu la grâce de Dieu à l’œuvre chez les païens, alléluia.

vespers:
  evangelicAntiphon:
    common: 
    - Par les mains de Paul et Barnabé, le Seigneur accomplissait des signes chez les païens.

mass:
- massType: DAY_MASS
  note: La première lecture est obligatoire.
  entranceAntiphon:
  - biblicalReference: cf. Ac 11,24
    content: |-
      Heureux, saint Barnabé,
      >qui fut digne d’être compté parmi les Apôtres :
      c’était un homme de bien,
      >rempli de l’Esprit Saint et de foi (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as demandé de mettre à part le bienheureux Barnabé,
    >rempli de foi et d’Esprit Saint,
    >pour la conversion des nations païennes ; *
    fais que l’Évangile du Christ,
    >qu’il a proclamé sans faiblir, /
    >soit annoncé fidèlement en paroles et en actes.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 11, 21b-26 ; 13, 1-3
      headline: « C’était un homme de bien, rempli d’Esprit Saint et de foi »
      content: |-
        En ces jours-là, à Antioche,
        un grand nombre de gens devinrent croyants
        et se tournèrent vers le Seigneur.
        La nouvelle parvint aux oreilles de l’Église de Jérusalem,
        et l’on envoya Barnabé jusqu’à Antioche.
        À son arrivée, voyant la grâce de Dieu à l’œuvre,
        il fut dans la joie.
        Il les exhortait tous
        à rester d’un cœur ferme attachés au Seigneur.
        C’était en effet un homme de bien,
        rempli d’Esprit Saint et de foi.
        Une foule considérable s’attacha au Seigneur.
        Barnabé partit alors à Tarse chercher Saul.
        L’ayant trouvé, il l’amena à Antioche.
        Pendant toute une année,
        ils participèrent aux assemblées de l’Église,
        ils instruisirent une foule considérable.
        Et c’est à Antioche que, pour la première fois,
        les disciples reçurent le nom de « chrétiens ».
        Or il y avait dans l’Église qui était à Antioche
        des prophètes et des hommes chargés d’enseigner :
        Barnabé, Syméon appelé Le Noir, Lucius de Cyrène,
        Manahène, compagnon d’enfance d’Hérode le Tétrarque,
        et Saul.
        Un jour qu’ils célébraient le culte du Seigneur
        et qu’ils jeûnaient,
        l’Esprit Saint leur dit :
        « Mettez à part pour moi Barnabé et Saul
        en vue de l’œuvre à laquelle je les ai appelés. »
        Alors, après avoir jeûné et prié,
        et leur avoir imposé les mains,
        ils les laissèrent partir.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 97 (98), 1, 2-3ab, 3cd-4, 5-6
      refAbbr: 97, 2b
      chorus:
      - chorusRef: 97, 2b
        chorus: Le Seigneur a révélé sa justice aux nations.
      content: |-
        Chantez au Seigneur un chant nouveau,
        car il a fait des merveilles ;
        par son bras très saint, par sa main puissante,
        il s’est assuré la victoire.

        Le Seigneur a fait connaître sa victoire
        et révélé sa justice aux nations ;
        il s’est rappelé sa fidélité, son amour,
        en faveur de la maison d’Israël.

        La terre tout entière a vu
        la victoire de notre Dieu.
        Acclamez le Seigneur, terre entière,
        sonnez, chantez, jouez !

        Jouez pour le Seigneur sur la cithare,
        sur la cithare et tous les instruments ;
        au son de la trompette et du cor,
        acclamez votre roi, le Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 7-13
      headline: '« Vous avez reçu gratuitement : donnez gratuitement »'
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples, dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Sur votre route, proclamez
        que le royaume des Cieux est tout proche.
        Guérissez les malades, ressuscitez les morts,
        purifiez les lépreux, expulsez les démons.
        Vous avez reçu gratuitement :
        donnez gratuitement.
        Ne vous procurez ni or, ni argent, ni monnaie de cuivre
        à mettre dans vos ceintures,
        ni sac pour la route,
        ni tunique de rechange,
        ni sandales, ni bâton.
        L’ouvrier, en effet, mérite sa nourriture.
        Dans chaque ville ou village où vous entrerez,
        informez-vous pour savoir qui est digne de vous accueillir,
        et restez là jusqu’à votre départ.
        En entrant dans la maison,
        saluez ceux qui l’habitent.
        Si cette maison en est digne,
        que votre paix vienne sur elle.
        Si elle n’en est pas digne,
        que votre paix retourne vers vous. »
        
  offeringPrayer:
  - |-
    Par ta bénédiction, Seigneur,
    >sanctifie les dons que nous t’offrons : *
    >qu’ils allument en nous, par ta grâce /
    >le feu de ton amour qui poussait le bienheureux Barnabé
    >à porter aux nations la lumière de l’Évangile.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jn 15,15
    content: |-
      Je ne vous appelle plus serviteurs, dit le Seigneur,
      >car le serviteur ne sait pas ce que fait son maître ;
      je vous appelle mes amis,
      >car tout ce que j’ai entendu de mon Père,
      >je vous l’ai fait connaître (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Ayant reçu de toi, Seigneur,
    >le gage de la vie éternelle,
    >nous te supplions humblement : *
    accorde-nous de saisir un jour en plénitude/
    >ce que nous célébrons sous la forme du sacrement
    >pour faire mémoire du bienheureux apôtre Barnabé.
    Par le Christ, notre Seigneur.