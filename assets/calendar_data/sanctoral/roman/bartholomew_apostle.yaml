celebration:
  title: Saint Barthélemy
  subtitle: apôtre
  description: Barthélemy, appelé aussi Nathanaël, naquit à Cana. C’est Philippe qui le présenta à Jésus sur le Nord du Jourdain. Il entra dans le groupe des premiers appelés. On ne sait rien de certain sur l’activité apostolique de Barthélemy après la Pentecôte.
  commons:
    - apostles
  color: red

oration:
  - Fortifie en nous, Seigneur, la foi sincère qui unissait à ton Fils l’Apôtre saint Barthélemy ; et maintenant qu’il prie pour ton Église, fais qu’elle devienne pour tous les peuples le sacrement du salut.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME SUR LA 1^ère LETTRE AUX CORINTHIENS
      content: |-
        La croix a gagné les esprits au moyen de prédicateurs ignorants, et cela dans le monde entier. Il ne s’agissait pas de questions banales, mais de Dieu et de la vraie foi, de la vie selon l’Évangile, du jugement futur. Elle a donc transformé en philosophes des rustres et des illettrés. Voilà comment %la folie de Dieu est plus sage que l’homme, et sa faiblesse, plus forte%.
        Comment est-elle %plus forte% ? Parce qu’elle s’est répandue dans le monde entier, qu’elle a soumis tous les hommes à son pouvoir et qu’elle a résisté aux innombrables adversaires qui voulaient faire disparaître le nom du Crucifié. Au contraire, ce nom s’est épanoui et propagé ; ses ennemis ont péri, ont disparu ; les vivants qui combattaient un mort ont été réduits à l’impuissance. Aussi, quand un Grec dit que je suis%fou%, il manifeste que lui-même l’est au maximum, puisque moi qu’il juge fou, je me montre plus sage que les sages ; s’il me traite de faible, il se montre lui-même plus faible encore. En effet, ce que des publicains et des pécheurs ont pu réussir par la grâce de Dieu, les philosophes, les rhéteurs, les tyrans, bref la terre entière, dans toute son étendue, n’a même pas été capable de l’imaginer. ~
        C’est en pensant à cela que Paul disait : %La faiblesse de Dieu est plus forte que tous les hommes%. Que la prédication soit l’œuvre de Dieu, c’est évident ici. Comment douze hommes, des ignorants, ont-ils pu avoir l’idée d’une pareille entreprise, eux qui vivaient auprès des lacs et des fleuves, et dans le désert ? Eux qui n’avaient jamais fréquenté les villes et leurs assemblées, comment ont-ils pu songer à se mobiliser contre la terre entière ? Ils étaient craintifs et sans courage : celui qui a écrit sur eux le montre bien, lui qui n’a voulu ni excuser ni cacher leurs défauts. C’est là une preuve très forte de vérité. Que dit-il donc à leur sujet ? Quand le Christ fut arrêté, après avoir fait d’innombrables miracles, la plupart s’enfuirent, et celui qui était leur chef de file ne resta que pour le renier.
        Ces hommes étaient incapables de soutenir l’assaut des Juifs quand le Christ était vivant. Et lorsqu’il fut mort et enseveli, alors qu’il n’était pas ressuscité, qu’il ne leur avait donc pas adressé la parole pour leur rendre courage, d’où croyez-vous qu’ils se seraient mobilisés contre la terre entière ? Est-ce qu’ils n’auraient pas dû se dire : « Qu’est-ce que cela ? Il n’a pas été capable de se sauver lui-même, et il nous protégerait ? Quand il était vivant, il n’a pas pu se défendre, et maintenant qu’il est mort il nous tendrait la main ? Quand il était vivant, il n’a pu se soumettre aucune nation, et nous allons convaincre la terre entière en proclamant son nom ? Comment ne serait-il pas déraisonnable, non pas même de le faire, mais seulement d’y penser ? »
        La chose est donc évidente : s’ils ne l’avaient pas vu ressuscité et s’ils n’avaient pas eu la preuve de sa toute-puissance, ils n’auraient pas pris un risque pareil.
      responsory: |-
        R/ Je peux tout en celui qui me fortifie.

        Dans les faiblesses, les insultes,
        les contraintes, les persécutions et les angoisses,

        Lorsque je suis faible,
        c’est alors que je suis fort.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: Cf. Ps 95,2-3.
    content: |-
      De jour en jour, annoncez le salut de Dieu, annoncez parmi les nations sa gloire,
  collect:
  - |-
    Fortifie en nous, Seigneur,
    >la foi sincère qui unissait à ton Fils
    >le bienheureux apôtre Barthélemy ; *
    et fais qu’à sa prière,
    >ton Église devienne pour tous les peuples /
    >le sacrement du salut.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ap 21, 9b-14
      headline: |-
        « Les fondations portaient les douze noms des douze Apôtres de l’Agneau »
      content: |-
        Moi, Jean,
        j’ai vu un ange qui me disait :
        >« Viens, je te montrerai
        >la Femme, l’Épouse de l’Agneau. »
        En esprit, il m’emporta
        >sur une grande et haute montagne ;
        il me montra la Ville sainte, Jérusalem,
        >qui descendait du ciel, d’auprès de Dieu :
        elle avait en elle la gloire de Dieu ;
        >son éclat était celui d’une pierre très précieuse,
        >comme le jaspe cristallin.
        Elle avait une grande et haute muraille,
        >avec douze portes et, sur ces portes, douze anges ;
        des noms y étaient inscrits :
        >ceux des douze tribus des fils d’Israël.
        Il y avait trois portes à l’orient,
        >trois au nord,
        >trois au midi,
        >et trois à l’occident.
        La muraille de la ville reposait sur douze fondations
        >portant les douze noms des douze Apôtres de l’Agneau.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 144 (145), 10-11, 12-13ab, 17-18
      refAbbr: 144, 12
      chorus:
      - chorusRef: cf. 144, 12
        chorus: |-
          Que tes fidèles, Seigneur,
          disent la gloire de ton règne.
      content: |-
        Que tes œuvres, Seigneur, te rendent grâce
        et que tes fidèles te bénissent !
        Ils diront la gloire de ton règne,
        ils parleront de tes exploits.

        Ils annonceront aux hommes tes exploits,
        la gloire et l’éclat de ton règne :
        ton règne, un règne éternel,
        ton empire, pour les âges des âges.

        Le Seigneur est juste en toutes ses voies,
        fidèle en tout ce qu’il fait.
        Il est proche de ceux qui l’invoquent,
        de tous ceux qui l’invoquent en vérité.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 1, 45-51
      headline: |-
        « Voici vraiment un Israélite : il n’y a pas de ruse en lui »
      acclamationAntiphon: |-
        Rabbi, c’est toi le Fils de Dieu !
        C’est toi le roi d’Israël !
      content: |-
        En ce temps-là,
        Philippe trouve Nathanaël et lui dit :
        >« Celui dont il est écrit dans la loi de Moïse et chez les Prophètes,
        >nous l’avons trouvé :
        >c’est Jésus fils de Joseph,
        >de Nazareth. »
        Nathanaël répliqua :
        >« De Nazareth
        >peut-il sortir quelque chose de bon ? »
        Philippe répond :
        >« Viens, et vois. »
        Lorsque Jésus voit Nathanaël venir à lui,
        il déclare à son sujet :
        >« Voici vraiment un Israélite :
        >il n’y a pas de ruse en lui. »
        Nathanaël lui demande :
        >« D’où me connais-tu ? »
        Jésus lui répond :
        >« Avant que Philippe t’appelle,
        >quand tu étais sous le figuier,
        >je t’ai vu. »
        Nathanaël lui dit :
        >« Rabbi, c’est toi le Fils de Dieu !
        C’est toi le roi d’Israël ! »
        Jésus reprend :
        >« Je te dis que je t’ai vu sous le figuier,
        >et c’est pour cela que tu crois !
        Tu verras des choses plus grandes encore. »
        Et il ajoute :
        >« Amen, amen, je vous le dis :
        >vous verrez le ciel ouvert,
        >et les anges de Dieu monter et descendre
        >au-dessus du Fils de l’homme. »
  offeringPrayer:
  - |-
    En célébrant la fête du bienheureux apôtre Barthélemy,
    >Seigneur, nous te prions : *
    par son intercession, accorde-nous ton secours, /
    >puisque nous t’offrons en son honneur
    >ce sacrifice de louange.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Lc 22,29-30
    content: |-
      Je dispose pour vous du Royaume
      >comme mon Père en a disposé pour moi :
      vous mangerez et boirez à ma table dans mon Royaume,
      >dit le Seigneur.
  prayerAfterCommunion:
  - |-
    Nous avons reçu, Seigneur,
    >le gage du salut éternel
    >en célébrant la fête du bienheureux apôtre Barthélemy ; *
    nous t’en prions :
    >que cette communion nous soit un secours /
    >pour la vie présente et la vie future.
    Par le Christ, notre Seigneur.