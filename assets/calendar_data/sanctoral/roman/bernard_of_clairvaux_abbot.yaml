celebration:
  title: Saint Bernard
  subtitle: abbé et docteur de l’Église
  description: |-
    Bernard (1090-1153), moine de Cîteaux, abbé de Clairvaux, conseiller des papes et des rois, prédicateur de la Croisade, fut avant tout un homme assoiffé de solitude, afin de s’y livrer à la pénitence et à la prière, et de pénétrer ainsi dans le Mystère de Dieu. Homme d’action incomparable, Bernard est un contemplatif pour qui tout se résume dans l’amour.
  color: white
  commons:
  - pastors_doctors
  - saints-male_religious_abbot

oration:
- Seigneur, tu as voulu que saint Bernard, rempli d’amour pour ton Église, soit dans ta maison la lampe qui brûle et qui éclaire ; accorde-nous, par son intercession, la même ferveur de l’Esprit, afin de vivre comme des fils de la lumière.

morning:
  evangelicAntiphon:
    common:
    - |-
      Ô bienheureux Bernard, la splendeur du Verbe a saisi ton âme : tu répands sur l’Église la lumière de la sagesse et de la foi.
readings:
  hymn:
  - reviens-verbe-de-dieu
  patristicReading:
  - title: SERMON DE SAINT BERNARD SUR LE CANTIQUE DES CANTIQUES
    content: |-
      L’amour se suffit à lui-même, il plaît par lui-même et pour lui-même. Il est à lui-même son mérite, il est à lui-même sa récompense. L’amour ne cherche hors de lui-même ni sa raison d’être ni son fruit : son fruit, c’est l’amour même. J’aime parce que j’aime. J’aime pour aimer.
      Quelle grande chose que l’amour, si du moins il remonte à son principe, s’il retourne à son origine, s’il reflue vers sa source pour y puiser un continuel jaillissement ! De tous les mouvements de l’âme, de ses sentiments et de ses affections, l’amour est le seul qui permette à la créature de répondre à son Créateur, sinon d’égal à égal, du moins dans une réciprocité de ressemblance. Car, lorsque Dieu aime, il ne veut rien d’autre que d’être aimé. Il n’aime que pour qu’on l’aime, sachant que ceux qui l’aimeront trouveront dans cet amour même la plénitude de la joie.
      L’amour de l’Époux, ou plutôt l’amour qu’est l’Époux, n’attend qu’un amour réciproque et la fidélité. Qu’il soit donc permis à celle qu’il chérit de l’aimer en retour. Comment l’épouse pourrait-elle ne pas aimer, elle qui est l’épouse de l’Amour ? Comment l’Amour ne serait-il pas aimé ?
      Elle a donc raison de renoncer à tous ses autres mouvements intérieurs, pour s’adonner seulement et tout entière à l’amour, puisqu’elle a la possibilité de répondre à l’amour même par un amour de réciprocité. Car elle pourra bien se répandre tout entière dans son amour, que sera-ce en regard du flot éternel d’amour qui jaillit de la source même ? Les eaux ne sourdent pas avec la même profusion de celle qui aime et de l’Amour, de l’âme et du Verbe, de l’épouse et de l’Époux, du Créateur et de la créature : la différence n’est pas moins grande qu’entre l’être assoiffé et la source.
      Alors quoi ? Faudra-t-il pour autant que périsse et disparaisse complètement chez l’épouse le souhait de voir s’accomplir ses noces ? Le désir qu’expriment ses soupirs, la force de son amour, son attente pleine de confiance ; seront-ils réduits à rien, parce qu’elle ne peut égaler à la course un géant, et qu’elle ne peut rivaliser de douceur avec le miel, de tendresse avec l’agneau, de blancheur avec le lis, de rayonnement avec le soleil, d’amour avec celui qui est l’amour en personne ? Non, car même si la créature aime moins, en raison de ses limites, pourvu qu’elle aime de tout son être, il ne manque rien à son amour, puisqu’il constitue un tout. C’est pourquoi aimer de la sorte équivaut à un mariage, car une affection si forte ne saurait recevoir une réponse de moindre affection, dans cet accord réciproque des deux époux qui fait la solidité et la perfection du mariage. À moins qu’on ne mette en doute que l’amour du Verbe précède et dépasse celui de l’épouse...
    responsory: |-
      R/ Voix de mon Bien-aimé qui frappe à la porte :
      Ouvre-moi ! alléluia !

      Si quelqu’un entend ma voix,
      ensemble nous prendrons notre repas,
      moi près de lui, lui près de moi.

      Si quelqu’un garde ma parole,
      mon Père l’aimera,
      et nous viendrons à lui.

vespers:
  evangelicAntiphon:
    common:
    - Bernard, ami de l’Époux, tu as chanté la Vierge Mère ; pasteur admirable, tu as brillé devant les hommes.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Le Seigneur a comblé de l’esprit d’intelligence saint Bernard
      >dont l’enseignement, tel un fleuve, irrigua le peuple de Dieu.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as voulu que saint Bernard,
    >dévoré par l’amour de ta maison,
    >soit dans ton Église une lampe qui éclaire et qui brûle ; *
    par son intercession, accorde-nous
    >d’avancer toujours en fils de la lumière, /
    >dans la ferveur du même esprit.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 15, 1-6
      headline: |-
        « La Sagesse le nourrit du pain de l’intelligence »
      content: |-
        Il s’exerce à la Sagesse, celui qui craint le Seigneur.
        Celui qui est maître de la Loi atteindra la Sagesse.
        Elle vient à sa rencontre comme une mère ;
        >comme une épouse vierge, elle l’accueillera.
        Elle-même le nourrit du pain de l’intelligence
        >et lui donne à boire l’eau de la sagesse.
        Il s’appuie sur elle et ne chancelle pas ;
        >il s’attache à elle et n’en rougit pas.
        C’est elle qui l’élève au-dessus de ses proches ;
        >au milieu de l’assemblée, il ouvrira la bouche.
        Il trouvera la joie et recevra une couronne d’allégresse,
        >il aura pour héritage une renommée éternelle.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 118 (119), 9-10, 11-12, 13-14
      refAbbr: 118, 9…
      chorus:
      - chorusRef: 118, 12b
        chorus: |-
          Apprends-moi, Seigneur, tes commandements.
      content: |-
        Comment, jeune, garder pur son chemin ?
        En observant ta parole.
        De tout mon cœur, je te cherche ;
        garde-moi de fuir tes volontés.

        Dans mon cœur, je conserve tes promesses
        pour ne pas faillir envers toi.
        Toi, Seigneur, tu es béni :
        apprends-moi tes commandements.

        Je fais repasser sur mes lèvres
        chaque décision de ta bouche.
        Je trouve dans la voie de tes exigences
        plus de joie que dans toutes les richesses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 17, 20-26
      headline: |-
        « Je veux que là où je suis, ils soient eux aussi avec moi »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là,
        les yeux levés au ciel, Jésus priait ainsi :
        >« Père saint,
        >je ne prie pas seulement pour ceux qui sont là,
        >mais encore pour ceux qui, grâce à leur parole, croiront en moi.
        Que tous soient un,
        >comme toi, Père, tu es en moi, et moi en toi.
        Qu’ils soient un en nous, eux aussi,
        >pour que le monde croie que tu m’as envoyé.
        Et moi, je leur ai donné la gloire que tu m’as donnée,
        >pour qu’ils soient un comme nous sommes UN :
        >moi en eux, et toi en moi.
        Qu’ils deviennent ainsi parfaitement un,
        >afin que le monde sache que tu m’as envoyé,
        >et que tu les as aimés comme tu m’as aimé.
        Père,
        >ceux que tu m’as donnés,
        >je veux que là où je suis,
        >ils soient eux aussi avec moi,
        >et qu’ils contemplent ma gloire,
        >celle que tu m’as donnée
        >parce que tu m’as aimé avant la fondation du monde.
        Père juste,
        >le monde ne t’a pas connu,
        >mais moi, je t’ai connu,
        et ceux-ci ont reconnu
        >que tu m’as envoyé.
        Je leur ai fait connaître ton nom,
        >et je le ferai connaître,
        pour que l’amour dont tu m’as aimé soit en eux,
        >et que moi aussi, je sois en eux. »
  offeringPrayer:
  - |-
    Nous te présentons, Dieu de majesté,
    >le sacrement de l’unité et de la paix,
    >en ce jour où nous faisons mémoire de saint Bernard, *
    lui qui travailla de toutes ses forces,
    >par une parole et une action remarquables, /
    >à favoriser la concorde en ton Église.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 15,9
    content: |-
      Comme le Père m’a aimé,
      >moi aussi, je vous ai aimés, dit le Seigneur. Demeurez dans mon amour.
  prayerAfterCommunion:
  - |-
    Que la nourriture reçue en célébrant saint Bernard nous soit profitable, Seigneur, *
    afin que, réconfortés par son exemple
    >et guidés par ses conseils, /
    >nous soyons saisis d’amour pour ton Verbe incarné.
    Lui qui vit et règne pour les siècles des siècles.