celebration:
  title: Saint Blaise
  subtitle: évêque et martyr
  description: Le culte de saint Blaise, évêque de Sébaste en Arménie et martyr (vers 320), se répandit en Occident à partir du 11e siècle en raison des miracles que lui attribuait sa légende. De nombreuses églises ont été mises sous son patronage.
  commons:
    - martyrs
    - pastors
  color: red

oration:
  - Écoute, Seigneur, les supplications de ton peuple que soutiennent les prières de saint Blaise ton martyr ; donne-nous ici-bas une vie de paix et le moyen d’atteindre ta vie éternelle.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AUGUSTIN POUR L’ORDINATION D’UN ÉVÊQUE
      content: |-
        %Le Fils de l’homme n’est pas venu pour être servi, mais pour servir et donner sa vie en rançon pour la multitude.%Voilà comment le Seigneur a servi, voilà quels serviteurs il a voulu avoir en nous. %Il a donné sa vie en rançon pour la multitude: il nous a rachetés.%
        Qui de nous est capable de racheter quelqu’un ? C’est par son sang, c’est par sa mort que nous avons été rachetés de la mort, c’est par son abaissement que nous avons été relevés. Mais nous aussi, nous devons aider ses membres à notre faible mesure, parce que nous sommes devenus ses membres; s’il est le chef, nous sommes le corps.
        Dans sa Lettre, l’Apôtre Jean nous exhorte à imiter l’exemple du Seigneur, qui avait dit: %Celui qui veut être le premier parmi vous sera votre serviteur. C’est ainsi que le Fils de l’homme n’ est pas venu pour être servi, mais pour servir et donner sa vie en rançon pour la multitude%. Donc saint Jean nous dit, en nous exhortant à cette ressemblance: %Le Christ a donné sa vie pour nous; nous aussi, nous devons donner notre vie pour nos frères.%
        C’est encore le Seigneur lui-même qui demande, après la résurrection: %Pierre, m’aimes-tu?% Pierre répondit: %Je t’aime%. Jésus interrogea trois fois. Pierre répondit trois fois, et le Seigneur dit, au bout des trois fois: %Sois le berger de mes brebis%.
        Comment me montres-tu que tu m’aimes, sinon en étant le berger de mes brebis? Que me donneras-tu, en m’aimant, alors que tu attends tout de moi? Ce que tu feras en m’aimant, tu en as la possibilité: %Sois le berger de mes brebis%.
        Une fois, deux fois, trois fois: %M’aimes-tu?% — %Je t’aime%. — %Sois le berger de mes brebis.% Il avait nié trois fois, par peur; il a affirmé trois fois, par amour.
        Ensuite, lorsque le Seigneur à la troisième fois lui eut confié ses brebis, parce qu’il répondait en affirmant son amour, en condamnant et en effaçant sa crainte, le Seigneur ajouta aussitôt: %Lorsque tu étais jeune, tu mettais ta ceinture toi-même, et tu allais où tu voulais; quand tu seras vieux, c’est un autre qui te mettra ta ceinture pour t’emmener là où tu ne voudrais pas aller%. Jésus disait cela pour signifier par quel genre de mort Pierre rendrait gloire à Dieu. Il lui annonçait sa croix, il lui prédisait sa passion.En allant jusque-là, le Seigneur lui dit: %Sois le berger de mes brebis%, c’est-à-dire: Souffre pour mes brebis.
      responsory: |-
        Il n’est pas de plus grand amour,
        que de mourir pour celui qu’on aime.

        R/ Qui perd sa vie la trouvera !

        Christ a donné sa vie pour nous ;
        donnons-la, nous aussi, pour nos frères.

        Nous sommes passés de la mort à la vie,
        puisque nous aimons nos frères.

mass:
- massType: DAY_MASS
  note: Commun des martyrs, p. 739, ou des pasteurs, p. 762.
  entranceAntiphon: null
  collect:
  - |-
    Seigneur, exauce la supplication de ton peuple
    >qui se confie à la protection
    >du bienheureux Blaise ton martyr ; *
    donne-nous la joie de vivre aujourd’hui dans la paix /
    >et de trouver les secours pour atteindre la vie éternelle.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 5, 1-5
      headline: « Nous mettons notre fierté dans la détresse elle-même »
      content: |-
        Frères,
        nous qui sommes devenus justes par la foi,
        nous voici en paix avec Dieu
        >par notre Seigneur Jésus Christ,
        lui qui nous a donné, par la foi,
        >l’accès à cette grâce
        >dans laquelle nous sommes établis ;
        et nous mettons notre fierté
        >dans l’espérance d’avoir part à la gloire de Dieu.
        Bien plus, nous mettons notre fierté
        >dans la détresse elle-même,
        puisque la détresse, nous le savons, produit la persévérance ;
        >la persévérance produit la vertu éprouvée ;
        >la vertu éprouvée produit l’espérance ;
        et l’espérance ne déçoit pas,
        >puisque l’amour de Dieu a été répandu dans nos cœurs
        >par l’Esprit Saint qui nous a été donné.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 116 (117), 1, 2
      refAbbr: Mc 16, 15
      chorus:
      - chorusRef: Mc 16, 15
        chorus: |-
          Allez dans le monde entier.
          Proclamez l’Évangile.
          ou : Alléluia !
      content: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !

        Son amour envers nous s’est montré le plus fort ;
        éternelle est la fidélité du Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 16, 15-20
      headline: « Allez dans le monde entier. Proclamez l’Évangile à toute la création »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples, dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
        >« Allez dans le monde entier.
        Proclamez l’Évangile à toute la création.
        Celui qui croira et sera baptisé sera sauvé ;
        >celui qui refusera de croire sera condamné.
        Voici les signes qui accompagneront
        >ceux qui deviendront croyants :
        >en mon nom, ils expulseront les démons ;
        >ils parleront en langues nouvelles ;
        >ils prendront des serpents dans leurs mains
        >et, s’ils boivent un poison mortel,
        >il ne leur fera pas de mal ;
        >ils imposeront les mains aux malades,
        >et les malades s’en trouveront bien. »
        Le Seigneur Jésus,
        >après leur avoir parlé,
        fut enlevé au ciel
        >et s’assit à la droite de Dieu.
        Quant à eux,
        >ils s’en allèrent proclamer partout l’Évangile.
        Le Seigneur travaillait avec eux
        >et confirmait la Parole par les signes qui l’accompagnaient.
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null