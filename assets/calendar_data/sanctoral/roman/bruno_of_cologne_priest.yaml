celebration:
  title: Saint Bruno
  subtitle: prêtre
  description: Après avoir enseigné à Reims pendant longtemps, Bruno (1035 1101) gagna le massif de la Chartreuse avec quelques disciples pour s’y livrer à la pénitence et à la contemplation. Avec ses frères il adopta un genre de vie qui alliait la solitude des ermites à un minimum de vie commune. Appelé à Rome par Urbain 11, Bruno devait mourir dans un ermitage de Calabre.
  commons:
  - pastors
  - saints-male_religious
  color: white 

oration:
- Dieu qui as appelé saint Bruno à te servir dans la solitude, accorde-nous, par son intercession, qu’au milieu de l’agitation de ce monde nous sachions rester libres pour te suivre.

readings:
  patristicReading:
    - title: LETTRE DE SAINT BRUNO À SES FILS CHARTREUX
      content: |-
        J’ai appris, par les récits détaillés et si consolants de notre bienheureux frère Landuin, avec quelle inflexible rigueur vous suivez une observance sage et vraiment digne d’éloges : il m’a parlé de votre saint amour, de votre zèle infatigable pour tout ce qui touche la pureté du cœur et la vertu : mon esprit en exulte dans le Seigneur. Oui, vraiment j’exulte et je me sens porté à la louange et aux actions de grâce envers le Seigneur, et cependant je soupire amèrement. J’exulte certes → cela est juste — à voir croître les fruits de vos vertus, mais je déplore et je rougis de rester inerte et négligent dans la misère de mes péchés.
        Réjouissez-vous donc, mes frères très chers, pour votre bienheureux sort et pour les largesses de grâce que Dieu répand sur vous. Réjouissez-vous d’avoir échappé aux flots agités de ce monde, où se multiplient les périls et les naufrages. Réjouissez-vous d’avoir gagné le repos tranquille et la sécurité d’un port caché : beaucoup désirent s’y rendre, beaucoup font même un effort pour l’atteindre et n’y parviennent point. Beaucoup même, après en avoir joui, en ont été rejetés, parce qu’aucun d’eux n’en avait reçu la grâce d’en haut.
        Aussi, mes frères, tenez le pour certain et prouvé : personne, après avoir joui d’un bien si désirable, ne vient de quelque manière à le perdre sans en éprouver un regret continuel, s’il prend à cœur le salut de son âme.
        De vous, mes bien-aimés frères convers, je dis : %mon âme glorifie le Seigneur%, car je considère la magnificence de sa miséricorde sur vous, d’après l’exposé de votre prieur et père très aimant, qui est rempli de joie et de fierté à votre sujet. Je me réjouis moi aussi, car bien que vous n’ayez pas la science des lettres, le Dieu tout-puissant grave de son doigt dans vos cœurs non seulement l’amour, mais la connaissance de sa loi sainte : vous montrez en effet par vos œuvres ce que vous aimez et ce que vous connaissez. Car vous pratiquez avec tout le soin et le zèle possibles la véritable obéissance. ~ Il est par là évident que vous recueillez avec sagesse le fruit excellent et vivifiant des divines Écritures.

      responsory: |-
        [rubric]Stance[/rubric]
        Dans un lieu perdu,
        ils ont cherché la source
        où renaît la soif ;
        dans un lieu caché,
        ils suivaient en pauvres
        le Christ pauvre.
        Avec une humble patience,
        ils attendaient l’heure
        où d’autres viendraient
        se joindre à leur quête.
        
        R/ Tes amis te cherchaient, Seigneur :
        ils nous guident vers toi.
        
        À nous maintenant de les suivre
        vers cette obscurité
        où nous guettons le reflet de ta gloire.
        
        Ils ont maintenant rejoint ton visage :
        leur chemin demeure
        celui que tu nous traces.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >toi qui as appelé saint Bruno
    >à te servir dans la solitude, *
    accorde-nous, par son intercession,
    >de savoir rester libres pour toi /
    >au milieu des changements de ce monde.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ph 3, 8-14
      headline: « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        je les considère comme une perte
        à cause de ce bien qui dépasse tout :
        la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        je considère tout comme des ordures,
        afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        auquel Dieu nous appelle là-haut dans le Christ Jésus.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 1, 1-2, 3, 4.6
      refAbbr: 1, 2a
      chorus:
      - chorusRef: 1, 2a
        chorus: |-
          Heureux qui se plaît
          dans la loi du Seigneur.
      content: |-
        Heureux est l’homme
        qui n’entre pas au conseil des méchants,
        qui ne suit pas le chemin des pécheurs,
        ne siège pas avec ceux qui ricanent,
        mais se plaît dans la loi du Seigneur
        et murmure sa loi jour et nuit !

        Il est comme un arbre
        planté près d’un ruisseau,
        qui donne du fruit en son temps,
        et jamais son feuillage ne meurt ;
        tout ce qu’il entreprend réussira.

        Tel n’est pas le sort des méchants.
        Mais ils sont comme la paille
        balayée par le vent.
        Le Seigneur connaît le chemin des justes,
        mais le chemin des méchants se perdra.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 57-62
      headline: « Je te suivrai partout où tu iras »
      acclamationAntiphon: |-
        Moi, je suis la lumière du monde, dit le Seigneur.
        Celui qui me suit aura la lumière de la vie.
      content: |-
        En ce temps-là,
        en cours de route, un homme dit à Jésus :
        « Je te suivrai partout où tu iras. »
        Jésus lui déclara :
        « Les renards ont des terriers,
        les oiseaux du ciel ont des nids ;
        mais le Fils de l’homme n’a pas d’endroit où reposer la tête. »
        Il dit à un autre :
        « Suis-moi. »
        L’homme répondit :
        « Seigneur, permets-moi d’aller d’abord enterrer mon père. »
        Mais Jésus répliqua :
        « Laisse les morts enterrer leurs morts.
        Toi, pars, et annonce le règne de Dieu. »
        Un autre encore lui dit :
        « Je te suivrai, Seigneur ;
        mais laisse-moi d’abord faire mes adieux
        aux gens de ma maison. »
        Jésus lui répondit :
        « Quiconque met la main à la charrue,
        puis regarde en arrière,
        n’est pas fait pour le royaume de Dieu. »
