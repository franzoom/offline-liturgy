celebration:
  title: Saint Camille de Lellis
  subtitle: prêtre
  description: Camille de Lellis (1550-1614) mena d’abord une vie dissolue, qui le conduisit à l’hôpital des Incurables de Rome. Il y fut bouleversé à la vue des malades à l’abandon et il se fit infirmier. Des compagnons se groupèrent sous sa direction (1582). Ce furent les « Serviteurs des malades ». Ordonné prêtre, Camille devait passer sa vie parmi les membres souffrants du Christ.
  commons:
    - saints-male_caritative
  color: white

oration:
  - Tu as donné, Seigneur, à saint Camille la grâce d’une étonnante charité envers les malades ; répands encore en nous ton esprit d’amour, et quand nous t’aurons servi dans nos frères, nous pourrons, à l’heure de quitter ce monde, nous en aller vers toi en toute paix.

readings:
  patristicReading:
    - title: LA VIE DU PÈRE CAMILLE DE LELLIS, PAR SON COMPAGNON SAINT CICATELLI
      content: |-
        Je dois commencer par la charité comme étant la racine de toutes les vertus et un charisme plus familier à Camille que tous les autres. Je dirai donc qu’il a été embrasé par l’ardeur de cette vertu non seulement envers Dieu, mais aussi envers son prochain et spécialement envers les malades. C’est au point qu’il lui suffisait de les apercevoir pour sentir son cœur se fondre de tendresse et oublier entièrement tous les plaisirs, les agréments et les attachements terrestres. Il paraissait, lorsqu’il servait n’importe quel malade, comme s’absorber et se consumer dans son extrême ferveur. Il aurait volontiers pris sur lui leur accablement ou n’importe lequel de leurs maux pour soulager leurs douleurs ou guérir leurs maladies.
        Il voyait en eux la personne du Christ avec une telle vivacité d’imagination que souvent, en servant leur nourriture, il les considérait comme étant ses christs, au point qu’il implorait d’eux la grâce et le pardon de ses péchés. II se tenait devant eux avec autant de respect que s’il avait été réellement et personnellement en présence du Seigneur. Dans ses entretiens, il introduisait le thème de la charité plus fréquemment et avec plus de ferveur qu’aucun autre, et il aurait voulu pouvoir la faire entrer dans le cœur de tous les hommes.
        Pour enflammer chez ses religieux l’amour de cette vertu primordiale, il avait l’habitude de leur répéter ces paroles très douces du Christ : %J’étais malade, et vous m’avez visité%. Il semblait vraiment avoir ces paroles gravées dans son cœur, tant il les prononçait et les répétait.
        La charité de Camille était si vive et si largement ouverte qu’il étreignait dans sa bonté et sa bienveillance non seulement les malades et les moribonds, mais d’une façon générale tous les pauvres et les malheureux. Enfin il y avait dans son cœur une si grande tendresse pour les indigents qu’il avait coutume de dire : « Puisque les pauvres passent inaperçus dans le monde, il faut que des hommes se dépensent à les découvrir et à les faire sortir de terre, pour leur faire du bien et leur montrer de la miséricorde. »

      responsory: |-
        R/ Partager son pain avec l’affamé,
        voilà le jeûne qui plaît à Dieu.
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et si tu cries le Seigneur répondra ;
        tes appels, il dira : Me voici !
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et quand le Fils de l’homme viendra, il te dira :
        J’avais faim et tu m’as donné à manger.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné à saint Camille, ton prêtre,
    >une grâce extraordinaire de charité envers les malades ; *
    répands en nous, par ses mérites, l’esprit de ton amour,
    >pour que nous puissions te servir dans nos frères /
    >et, à l’heure de quitter ce monde,
    >nous en aller vers toi en toute paix.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Jn 3, 14-18
      headline: « Nous aussi, nous devons donner notre vie pour nos frères »
      content: |-
        Bien-aimés,
        nous savons que nous sommes passés de la mort à la vie,
        parce que nous aimons nos frères.
        Celui qui n’aime pas
        demeure dans la mort.
        Quiconque a de la haine contre son frère
        est un meurtrier,
        et vous savez que pas un meurtrier
        n’a la vie éternelle demeurant en lui.
        Voici comment nous avons reconnu l’amour :
        lui, Jésus, a donné sa vie pour nous.
        Nous aussi, nous devons donner notre vie pour nos frères.
        Celui qui a de quoi vivre en ce monde,
        s’il voit son frère dans le besoin
        sans faire preuve de compassion,
        comment l’amour de Dieu pourrait-il demeurer en lui ?
        Petits enfants,
        n’aimons pas en paroles ni par des discours,
        mais par des actes et en vérité.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: Heureux qui craint le Seigneur.
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira, et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: « Vous êtes mes amis si vous faites ce que je vous commande »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null