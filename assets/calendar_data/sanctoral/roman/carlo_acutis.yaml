celebration:
  title: Saint Carlo Acutis
  description: |-
    %(traduction non officielle)%
    Carlo naquit à Londres le 3 mai 1991 de parents italiens, mais il vécut et grandit à Milan, où il fréquenta assidûment, dès son plus jeune âge, la paroisse Santa Maria Segreta. Sa brève existence fut façonnée par une intense spiritualité eucharistique, nourrie par la messe quotidienne, et qu’il manifesta grâce à son talent informatique dans une exposition sur les « miracles eucharistiques ». Il cultiva une dévotion filiale envers la très sainte Vierge Marie et aima saint François d’Assise, dans la ville où il séjournait souvent avec sa famille. Atteint d’une forme de leucémie fulminante, il offrit sa vie au Seigneur, quelques jours avant son hospitalisation à l’hôpital San Gerardo de Monza, pour le pape, pour l’Église et pour aller tout droit au Paradis. Il mourut le 12 octobre 2006, à quinze ans à peine. Sa dépouille mortelle repose à Assise, dans l’église Santa Maria Maggiore, ou sanctuaire de la Spoliation. Cité par le pape François dans l’exhortation apostolique post-synodale Christus Vivit de 2019 comme modèle per les jeunes, il a été béatifié poar lui le 10 octobre 2020. Léon XIV le canonise le 7 septembre 2025.
  commons:
  - saints_male
  color: white

oration:
  - |-
    %(traduction non officielle)%
    Ô Dieu, toi qui a fait de Saint Carlo Acutis
    >un témoin devant les jeunes
    pour son amour de l’Eucharistie
    >et son attachement aux pauvres,
    donne-nous, par son intercession,
    >de vivre toujours unis à toi
    et de reconnaître dans les frères 
    >que nous rencontrons sur notre chemin
    la présence de ton Fils Jésus Christ.
    Lui qui vit et règne avec toi,
    >dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.

readings:
  patristicReading:
    - title: DES ADMONITIONS DE SAINT FRANÇOIS D’ASSISE
      content: |-
        %(traduction non officielle)%

        Le Seigneur Jésus dit à ses disciples : %Je suis le chemin, la vérité et la vie ; personne ne va au Père sans passer par moi. Si vous m’aviez connu, vous connaîtriez aussi mon Père ; dès maintenant vous le connaissez et vous l’avez vu.% Philippe lui dit : %Seigneur, montre-nous le Père, et cela nous suffit%. Jésus lui dit : %Il y a si longtemps que je suis avec vous, et tu ne m’as pas connu ? Philippe, celui qui m’a vu a vu aussi mon Père.%
        Le Père habite une lumière inaccessible, et Dieu est esprit, et personne n’a jamais vu Dieu. C’est pourquoi on ne peut le voir que dans l’Esprit, car c’est l’Esprit qui donne la vie ; la chair ne sert à rien. Mais le Fils lui-même, en ce par quoi il est égal au Père, n’est vu de personne autrement que le Père n’est vu, ni autrement que l’Esprit Saint n’est vu.
        C’est pourquoi tous ceux qui ont vu le Seigneur Jésus selon son humanité, mais qui n’ont pas vu ni cru, selon l’Esprit et la divinité, qu’il est le vrai Fils de Dieu, sont condamnés. Et de même maintenant, tous ceux qui voient le sacrement, sanctifié par les paroles du Seigneur sur l’autel, dans les mains du prêtre, sous les espèces du pain et du vin, et qui ne voient pas ni ne croient, selon l’Esprit et la divinité, que c’est véritablement le très saint Corps et le Sang de notre Seigneur Jésus Christ, sont condamnés, car le Très-Haut lui-même en rend témoignage, lui qui dit : %Ceci est mon corps et mon sang de la nouvelle alliance%, et encore : %Celui qui mange ma chair et boit mon sang a la vie éternelle.% C’est pourquoi l’Esprit du Seigneur, qui habite en ses fidèles, est celui qui reçoit le très saint Corps et le Sang du Seigneur. Tous les autres, qui ont la présomption de le recevoir sans avoir part au même Esprit, mangent et boivent leur condamnation. C’est pourquoi : %Fils des hommes, jusqu’à quand aurez-vous le cœur dur ? Pourquoi ne connaissez-vous pas la vérité et ne croyez-vous pas au Fils de Dieu ?%
        Voici que chaque jour il s’abaisse, comme lorsqu’il descendit de son trône royal dans le sein de la Vierge ; chaque jour il vient lui-même à nous sous une apparence humble ; chaque jour il descend du sein du Père sur l’autel, dans les mains du prêtre. Et comme il se montra aux saints apôtres dans une chair véritable, ainsi se montre-t-il maintenant à nous dans le pain consacré. Et comme eux, avec la vue de leur corps, ne voyaient que sa chair, mais, en le contemplant avec les yeux de l’esprit, croyaient qu’il était Dieu lui-même, ainsi nous aussi, voyant le pain et le vin avec les yeux du corps, nous devons voir et croire fermement que c’est son très saint Corps et Sang, vivant et vrai.
        Et c’est de cette manière que le Seigneur est toujours avec ses fidèles, comme il le dit lui-même : %Voici, je suis avec vous jusqu’à la fin du monde.%
