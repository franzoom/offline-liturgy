celebration:
  title: Saint Casimir
  description: Casimir (1458-1484), dont le père régnait sur la Pologne et la Lituanie, mourut à vingt-six ans, laissant le souvenir d’un jeune prince intelligent et généreux, mais par-dessus tout adonné à la pénitence et à la prière, intimement uni à la Vierge Marie et au Christ présent dans l’Eucharistie.
  commons:
    - saints
  color: white

oration:
  - Dieu tout-puissant, te connaître, c’est vivre, te servir, c’est régner ; accorde-nous, par l’intercession de saint Casimir, de t’obéir en toute chose avec droiture et pureté de cœur.

readings:
  patristicReading:
    - title: VIE DE SAINT CASIMIR PAR UN CONTEMPORAIN
      content: |-
        Casimir avait une charité presque incroyable, non pas artificielle, mais sincere, dont l’Esprit Saint l’avait embrasé envers le Dieu tout-puissant. Elle était répandue si abondamment dans son cœur qu’elle en débordait au-dehors sur le prochain. Rien ne le réjouissait davantage, ne correspondait mieux à ses désirs, que de distribuer tous ses biens et même de se donner totalement aux pauvres du Christ, et aux étrangers, aux malades, aux prisonniers, à tous les malheureux. Il traitait les veuves, les orphelins, les opprimés non seulement comme un protecteur et un intendant, mais comme leur père, leur fils et leur frère.
        Il faudrait certes écrire une longue histoire si l’on voulait rapporter en détail toutes les œuvres de charité et d’amour qu’il réalisa envers Dieu et les hommes.
        On peut difficilement dire ou imaginer combien il a cultive la justice, combien il a montré de prudence, combien il brillait par le courage et la constance, surtout à cet âge où les hommes ont ordinairement plus de facilité et plus de penchant à se précipiter dans le mal.
        Chaque jour il exhortait son père à gouverner avec justice son royaume et les peuples vassaux. Si parfois, par suite de l’incurie ou de la faiblesse humaine, quelque chose était négligé dans le gouvernement, il n’omit jamais de le reprocher à son père en termes mesurés.
        Il soutenalt les proces des pauvres et des malheureux à l’égal des siens, il prenait leur parti, et c’est pourquoi il était appelé le défenseur des pauvres. Car il avait beau être le fils du roi et descendre d’une très noble lignée, il n’était jamais désagréable, dans ses paroles ou dans ses relations, à l’égard de personne, fût-ce le plus modeste et le plus faible.
        Il voulut toujours figurer parmi les doux et les pauvres de cœur, à qui appartient le royaume des cieux, plutôt que parmi les illustres et les puissants de ce monde. Il n’ambi-tionna jamais le pouvoir suprême, et ne voulut rien accepter de ce que son père lui offrait ; il craignait que son âme ne fût blessée par les aiguillons des richesses, que notre Seigneur Jésus Christ appelle des épines, ou qu’elle ne fût souillée par le contact des affaires terrestres.
        Il est resté vierge jusqu’à son dernier jour. C’est ce que tout le monde affirme, et aussi ses camériers et ses secré-taires, dont quelques-uns vivent encore et qui ont partagé intimement sa vie.
      responsory: |-
        Seigneur, qui habitera sur ta montagne sainte?

        Celui qui juge avec justice
        en écoutant le petit comme le grand.

        Celui qui ne craint pas l’homme
        sachant que le jugement relève de Dieu.

        Celui qui refuse d’être racheté
        pour accabler un innocent. [rubric](pas de R/)[/rubric]

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Dieu tout-puissant, +
    >te servir, c’est régner ; *
    >par l’intercession de saint Casimir,
    >accorde-nous de te servir toujours /
    >dans la justice et la sainteté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ph 3, 8-14
      headline: « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        >je les considère comme une perte
        >à cause de ce bien qui dépasse tout :
        >la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        >je considère tout comme des ordures,
        >afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        >non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        >la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        >d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        >en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        >à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        >je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        >puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        >oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        >auquel Dieu nous appelle là-haut dans le Christ Jésus.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 14 (15), 2, 3, 4bcd, 5
      refAbbr: cf. 14, 1b
      chorus:
      - chorusRef: cf. 14, 1b
        chorus: |-
          Le juste habitera ta sainte montagne,
          Seigneur.
      content: |-
        Celui qui se conduit parfaitement,
        qui agit avec justice
        et dit la vérité selon son cœur.

        Il met un frein à sa langue,
        ne fait pas de tort à son frère
        et n’outrage pas son prochain.

        Il honore les fidèles du Seigneur.
        S’il a juré à ses dépens,
        il ne reprend pas sa parole.

        Il prête son argent sans intérêt,
        n’accepte rien qui nuise à l’innocent.
        Qui fait ainsi demeure inébranlable.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: « Vous êtes mes amis si vous faites ce que je vous commande »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null