celebration:
  title: Sainte Catherine de Sienne
  subtitle: Vierge et docteur de l’Église
  description: Catherine de Sienne (1347-138) fut partagée, sa vie durant, entre la soif de contempler le Christ en croix et le service de l’Église, que déchiraient les factions. Pénétrée de l’esprit de saint Dominique, elle puisa dans son amour pour Dieu les énergies qui lui permirent de ramener le pape d’Avignon à Rome et de faire entendre aux pécheurs l’appel du sang rédempteur.
  color: white
  commons:
  - virgins
  - saints_doctors

oration:
- Seigneur, tu as enflammé de ton amour sainte Catherine de Sienne en lui faisant contempler la passion de Jésus et en l’appelant à servir l’Église ; par son intercession, accorde à ton peuple d’être uni au mystère du Christ, pour exulter dans la découverte de sa gloire.

readings:
  patristicReading:
  - title: DES DIALOGUES DE SAINTE CATHERINE DE SIENNE
    content: |-
      Ô Divinité éternelle, ô éternelle Trinité, par l’union de la divine nature tu as donné un si grand prix au sang de ton Fils unique ! Toi, éternelle Trinité, tu es comme un océan profond : plus j’y cherche et plus je te trouve ; plus je trouve et plus je te cherche. Tu rassasies insatiablement notre âme car, dans ton abîme, tu rassasies l’âme de telle sorte qu’elle demeure indigente et affamée, parce qu’elle continue à souhaiter et à désirer te voir dans ta lumière, ô lumière, éternelle Trinité. ~
      J’ai goûté et j’ai vu avec la lumière de mon intelligence et dans ta lumière, éternelle Trinité, et l’immensité de ton abîme et la beauté de ta créature. Alors, j’ai vu qu’en me revêtant de toi, je deviendrais ton image, parce que tu me donnes, Père éternel, quelque chose de ta puissance et de ta sagesse. Cette sagesse est l’attribut de ton Fils unique. Quant au Saint-Esprit, qui procède de toi, Père, et de ton Fils, il m’a donné la volonté qui me rend capable d’aimer. Car toi, éternelle Trinité, tu es le Créateur, et moi la créature ; aussi ai-je connu, éclairée par toi, dans la nouvelle création que tu as faite de moi par le sang de ton Fils unique, que tu as été saisie d’amour pour la beauté de ta créature.
      Abîme ! Éternelle Trinité ! Divinité ! Océan profond ! Et que pourrais-tu me donner de plus grand que toi-même ? Tu es le feu qui brûle toujours et ne s’éteint jamais ; tu consumes par ton ardeur tout amour égoïste de l’âme. Tu es le feu qui dissipe toute froideur, et tu éclaires les esprits de ta lumière, cette lumière par laquelle tu m’as fait connaître ta vérité. ~
      C’est dans la foi, ce miroir de la lumière, que je te connais : tu es le souverain bien, bien qui surpasse tout bien, bien qui donne le bonheur, bien qui dépasse toute idée et tout jugement ; beauté au-dessus de toute beauté, sagesse au-dessus de toute sagesse : car tu es la sagesse elle-même, tu es l’aliment des anges qui, dans l’ardeur de ton amour, s’est donné aux hommes.
      Tu es le vêtement qui couvre ma nudité, tu nourris les affamés de ta douceur, car tu es douce, sans nulle amertume, ô éternelle Trinité.
    responsory: |-
      R/ Ô abîme de la sagesse
      et de la science de Dieu,
      insondables ses décrets,
      incompréhensibles ses voies !

      Mystère de Dieu, mystère du Christ,
      où se trouvent cachés tous les trésors
      de la sagesse et de la connaissance.

      Dieu a voulu nous faire connaître
      la gloire de ce mystère au milieu des nations :
      le Christ parmi nous, l’espérance de la gloire.

morning:
  evangelicAntiphon:
    common:
    - |-
      Sans relâche, Catherine priait le Seigneur de rendre la paix à son Église, alléluia.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Catherine cherchait Dieu et le trouvait : elle était unie à celui qu’elle aimait, alléluia.

mass:
- massType: DAY_MASS
  note: Mémoire (en Europe, Fête).
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Vierge sage et prévoyante,
      Catherine de Sienne a gardé sa lampe allumée
      >pour sortir à la rencontre du Christ, alléluia.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as brûlé du feu de ton amour sainte Catherine de Sienne
    >en lui donnant de contempler la passion de Jésus
    >et en l’appelant à servir l’Église ; *
    par son intercession, accorde à ton peuple,
    >uni au mystère du Christ, /
    >d’exulter sans fin quand sa gloire se révélera
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Jn 1, 5 – 2, 2
      headline: « Le sang de Jésus nous purifie de tout péché »
      content: |-
        Bien-aimés,
        tel est le message que nous avons entendu de Jésus Christ
        >et que nous vous annonçons :
        Dieu est lumière ;
        >en lui, il n’y a pas de ténèbres.
        Si nous disons que nous sommes en communion avec lui,
        >alors que nous marchons dans les ténèbres,
        nous sommes des menteurs,
        >nous ne faisons pas la vérité.
        Mais si nous marchons dans la lumière,
        >comme il est lui-même dans la lumière,
        nous sommes en communion les uns avec les autres,
        >et le sang de Jésus, son Fils, nous purifie de tout péché.
        Si nous disons que nous n’avons pas de péché,
        >nous nous égarons nous-mêmes,
        >et la vérité n’est pas en nous.
        Si nous reconnaissons nos péchés,
        lui qui est fidèle et juste
        >va jusqu’à pardonner nos péchés
        >et nous purifier de toute injustice.
        Si nous disons que nous sommes sans péché,
        >nous faisons de lui un menteur,
        >et sa parole n’est pas en nous.
        Mes petits enfants,
        >je vous écris cela pour que vous évitiez le péché.
        Mais si l’un de nous vient à pécher,
        >nous avons un défenseur devant le Père :
        >Jésus Christ, le Juste.
        C’est lui qui, par son sacrifice,
        >obtient le pardon de nos péchés,
        >non seulement les nôtres,
        >mais encore ceux du monde entier.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 102 (103), 1-2, 3-4, 8-9, 13-14, 17-18a
      refAbbr: 102, 1a
      chorus:
      - chorusRef: 102, 1a
        chorus: Bénis le Seigneur, ô mon âme !
      content: |-
        Bénis le Seigneur, ô mon âme,
        bénis son nom très saint, tout mon être !
        Bénis le Seigneur, ô mon âme,
        n’oublie aucun de ses bienfaits !

        Car il pardonne toutes tes offenses
        et te guérit de toute maladie ;
        il réclame ta vie à la tombe
        et te couronne d’amour et de tendresse.

        Le Seigneur est tendresse et pitié,
        lent à la colère et plein d’amour ;
        il n’est pas pour toujours en procès,
        ne maintient pas sans fin ses reproches.

        Comme la tendresse du père pour ses fils,
        la tendresse du Seigneur pour qui le craint !
        Il sait de quoi nous sommes pétris,
        il se souvient que nous sommes poussière.

        L’amour du Seigneur, sur ceux qui le craignent,
        est de toujours à toujours,
        et sa justice pour les enfants de leurs enfants,
        pour ceux qui gardent son alliance.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: « Ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits »
      acclamationAntiphon: |-
        Tu es béni, Père, Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits les mystères du Royaume !
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        « Père, Seigneur du ciel et de la terre,
        je proclame ta louange :
        ce que tu as caché aux sages et aux savants,
        tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        personne ne connaît le Fils, sinon le Père,
        et personne ne connaît le Père, sinon le Fils,
        et celui à qui le Fils veut le révéler.
        Venez à moi,
        vous tous qui peinez sous le poids du fardeau,
        et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        devenez mes disciples,
        car je suis doux et humble de cœur,
        et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        et mon fardeau, léger. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Accueille, Seigneur, le sacrifice du salut
    >que nous présentons en la fête de sainte Catherine : * instruits par ses conseils,
    >nous pourrons te rendre grâce, Dieu véritable, /
    >avec plus de ferveur.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. 1Jn 1,5. 7
    content: |-
      Dieu est lumière.
      Si nous marchons dans la lumière
      >nous sommes en communion les uns avec les autres,
      et le sang de Jésus Christ, son Fils
      >nous purifie de tout péché, alléluia.
  prayerAfterCommunion:
  - |-
    Que la vie éternelle nous soit donnée, Seigneur, *
    puisque nous communions à la table du ciel /
    où sainte Catherine trouvait aussi
    >un aliment pour la vie de son corps.
    Par le Christ, notre Seigneur.