celebration:
  title: Saint Charles Borromé
  subtitle: évêque
  description: Charles Borromée (1538-1584), archevêque de Milan, réalisa en sa personne le modèle de l’évêque proposé par le Concile de Trente. Il travailla à réformer le clergé en tenant des synodes et en fondant des séminaires. Il voulut restaurer les mœurs chrétiennes dans le peuple par ses visites pastorales, donnant à tous l’exemple d’une vie authentiquement fidèle à l’Évangile.
  commons: 
  - pastors_bishop
  color: white

oration:
  - Maintiens dans ton peuple, Seigneur, l’esprit qui animait saint Charles Borromée ; ainsi ton Église, sans cesse renouvelée et toujours plus fidèle à l’Évangile, pourra montrer au monde le vrai visage du Christ. Lui qui règne.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT CHARLES BORROMÉE PRONONCÉE À SON DERNIER SYNODE
      content: |-
        Nous sommes tous faibles, je le reconnais, mais le Seigneur Dieu nous a donné des moyens où nous pouvons facilement trouver du secours si nous le voulons. Voici un prêtre qui voudrait mener la vie irréprochable à laquelle il se sait obligé, qui voudrait être chaste et avoir la conduite digne des anges qui lui convient ; mais il ne décide pas d’employer les moyens voulus : le jeûne, la prière, la fuite des relations mauvaises, des familiarités nuisibles et dangereuses.
        Cet autre, lorsqu’il entre au chœur pour la psalmodie ou lorsqu’il va célébrer la messe, se plaint de ce que mille pensées se présentent aussitôt à son esprit et le distraient de Dieu. Mais avant d’aller au chœur ou de célébrer la messe, qu’a-t-il fait à la sacristie, comment s’est-il préparé, quels moyens a-t-il pris pour maîtriser son attention ?
        Veux-tu que je t’enseigne comment progresser sans cesse de vertu en vertu et, si déjà tu étais attentif au chœur, comment tu pourras l’être davantage une autre fois pour que tes hommages plaisent à Dieu encore plus ? Écoute-moi bien. Si un petit feu d’amour divin est déjà allumé en toi, ne le montre pas tout de suite, ne l’expose pas au vent ; garde fermée la porte du four, pour ne pas laisser perdre la chaleur. Cela veut dire : fuis, autant que possible, les distractions, demeure recueilli en Dieu, évite les conversations frivoles.
        Tu as la charge de la prédication et de l’enseignement ? Étudie, applique-toi à tout ce qui est nécessaire pour bien exercer cette charge. Soucie-toi d’abord de prêcher par ta vie et tes mœurs ; évite qu’en te voyant dire une chose et en faire une autre, les gens ne se moquent de tes paroles en hochant la tête.
        Tu as charge d’âmes ? Ce n’est pas une raison pour négliger la charge de toi-même et pour te donner si généreusement aux autres qu’il ne reste plus rien de toi-même pour toi. Tu dois te souvenir des âmes dont tu es le supérieur, sans t’oublier toi-même.
        Comprenez, mes frères, que rien n’est aussi nécessaire, pour des hommes d’Église, que l’oraison mentale qui doit précéder toutes nos actions, les accompagner et les suivre. %Je chanterai%, dit le Prophète, %et je serai attentif%. Si tu administres les sacrements, mon frère, pense à ce que tu fais ; si tu célèbres la messe, pense à ce que tu offres ; si tu psalmodies au chœur, réfléchis à qui tu parles et à ce que tu dis ; si tu diriges les âmes, songe au sang qui les a lavées ; ainsi %faites tout avec amour%. C’est ainsi que nous pourrons vaincre facilement les innombrables difficultés que nous rencontrons nécessairement chaque jour, du fait de notre position. C’est ainsi que nous aurons la force d’engendrer le Christ en nous et chez les autres.
      responsory: |-
        R/ Ceux qui sèment dans les larmes,
        moissonnent en chantant.

        Qui sème dans sa chair
        moissonnera de sa chair la destruction.

        Qui sème dans l’Esprit
        moissonnera de l’Esprit la vie éternelle.

        La chair ne sert de rien,
        c’est l’Esprit qui vivifie.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Maintiens dans ton peuple, Seigneur,
    >l’esprit qui animait l’évêque saint Charles Borromée : *
    >que ton Église se renouvelle sans cesse
    >et qu’en se conformant à l’image du Christ, /
    >elle puisse montrer au monde le visage de son Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Rm 12, 3-13
      headline: « Selon la grâce que Dieu nous a accordée, nous avons reçu des dons qui sont différents »
      content: |-
        Frères,
        par la grâce qui m’a été accordée,
        >je dis à chacun d’entre vous :
        n’ayez pas de prétentions déraisonnables,
        >mais pensez à être raisonnables,
        >chacun dans la mesure de la mission que Dieu lui a confiée.
        Prenons une comparaison :
        en un corps unique,
        nous avons plusieurs membres,
        >qui n’ont pas tous la même fonction ;
        de même, nous qui sommes plusieurs,
        nous sommes un seul corps dans le Christ,
        >et membres les uns des autres, chacun pour sa part.
        Et selon la grâce que Dieu nous a accordée,
        >nous avons reçu des dons qui sont différents.
        Si c’est le don de prophétie, que ce soit à proportion du message confié ;
        >si c’est le don de servir, que l’on serve ;
        >si l’on est fait pour enseigner, que l’on enseigne ;
        >pour réconforter, que l’on réconforte.
        Celui qui donne, qu’il soit généreux ;
        >celui qui dirige, qu’il soit empressé ;
        >celui qui pratique la miséricorde, qu’il ait le sourire.
        Que votre amour soit sans hypocrisie.
        Fuyez le mal avec horreur,
        >attachez-vous au bien.
        Soyez unis les uns aux autres par l’affection fraternelle,
        >rivalisez de respect les uns pour les autres.
        Ne ralentissez pas votre élan,
        >restez dans la ferveur de l’Esprit,
        >servez le Seigneur,
        ayez la joie de l’espérance,
        >tenez bon dans l’épreuve,
        >soyez assidus à la prière.
        Partagez avec les fidèles qui sont dans le besoin,
        >pratiquez l’hospitalité avec empressement.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88 (89), 2-3, 4-5, 21-22, 25.27
      refAbbr: cf. 88, 2a
      chorus:
      - chorusRef: cf. 88, 2a
        chorus: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : C’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        « Avec mon élu, j’ai fait une alliance,
        j’ai juré à David, mon serviteur :
        j’établirai ta dynastie pour toujours,
        je te bâtis un trône pour la suite des âges.

        « J’ai trouvé David, mon serviteur,
        je l’ai sacré avec mon huile sainte ;
        et ma main sera pour toujours avec lui,
        mon bras fortifiera son courage.

        « Mon amour et ma fidélité sont avec lui,
        mon nom accroît sa vigueur ;
        il me dira : "Tu es mon Père,
        mon Dieu, mon roc et mon salut !" »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 10, 11-16
      headline: « Le bon pasteur donne sa vie pour ses brebis »
      acclamationAntiphon: |-
        Je suis le bon Pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        En ce temps-là, Jésus disait :
        « Moi, je suis le bon pasteur, le vrai berger,
        qui donne sa vie pour ses brebis.
        Le berger mercenaire n’est pas le pasteur,
        les brebis ne sont pas à lui :
        s’il voit venir le loup,
        il abandonne les brebis et s’enfuit ;
        le loup s’en empare et les disperse.
        Ce berger n’est qu’un mercenaire,
        et les brebis ne comptent pas vraiment pour lui.
        Moi, je suis le bon pasteur ;
        je connais mes brebis,
        et mes brebis me connaissent,
        comme le Père me connaît,
        et que je connais le Père ;
        et je donne ma vie pour mes brebis.
        J’ai encore d’autres brebis,
        qui ne sont pas de cet enclos :
        celles-là aussi, il faut que je les conduise.
        Elles écouteront ma voix :
        il y aura un seul troupeau
        et un seul pasteur. »
  offeringPrayer:
  - |-
    Regarde, Seigneur, les offrandes apportées à ton autel
    >en la mémoire de saint Charles Borromée ; *
    de même que tu l’as glorifié
    >pour sa vigilance pastorale et l’excellence de ses vertus,
    >accorde-nous, par la puissance de ce sacrifice, /
    >de porter dans notre vie des fruits en abondance.
    Par le Christ, notre Seigneur.
  communionAntiphon: null
  prayerAfterCommunion:
  - |-
    Que la participation aux saints mystères,
    >nous t’en prions, Seigneur,
    >nous donne la force d’âme /
    qui rendit saint Charles
    >fidèle à sa mission et débordant de charité.
    Par le Christ, notre Seigneur.