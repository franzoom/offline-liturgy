celebration:
  title: Saint Charles Lwanga et ses compagnons
  subtitle: martyrs
  description: Avec les vingt-deux martyrs de l’Ouganda on revit une page des Actes des Martyrs des premiers siècles. Plusieurs étaient chrétiens depuis peu. Quatre d’entre eux furent baptisés par Charles Lwanga juste avant le supplice. La plupart de ceux qui furent brûlés vifs à Numungongo (1886) avaient entre seize et vingt-quatre ans. Le plus jeune, Kizito, en avait treize.
  color: red
  commons: 
    - martyrs

oration:
  - Seigneur notre Dieu, tu as fait que le sang des martyrs soit une semence de chrétiens ; accorde à l’Église, que saint Charles Lwanga et ses compagnons ont fécondée par leur sang, de te donner une abondante moisson.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT PAUL VI À LA CANONISATION DES MARTYRS DE L’OUGANDA
      subtitle: 18 octobre 1964
      content: |-
        Ces martyrs africains ajoutent au martyrologe, au livre des vainqueurs, une page qui relate des événements à la fois sinistres et magnifiques ; une page vraiment digne de rejoindre ces récits glorieux de l’Afrique ancienne dont nous-mêmes, hommes modernes, avec notre peu de foi, pensions qu’ils ne trouveraient jamais une suite comparable.
        Qui aurait jamais pu supposer, par exemple que les exploits bouleversants des martyrs de Scillium, de Carthage, de la « Massa candida » d’Utique, rappelés par saint Augustin et Prudence, des martyrs d’Égypte dont nous lisons l’ample panégyrique chez saint Jean Chrysostome, des martyrs de la persécution des Vandales, seraient rejoints à notre époque par des récits non moins héroïques et non moins glorieux ?
        Qui pouvait prévoir qu’à ces grands martyrs et confesseurs d’Afrique, ces personnages inoubliables que sont Cyprien, Félicité et Perpétue, et le grand saint Augustin, on ajouterait un jour ces noms qui nous sont chers : Charles Lwanga, Matthias Molumba, Kalemba et leurs vingt compagnons ? Et il est juste de mentionner aussi ceux qui, appartenant à la confession anglicane, ont subi la mort pour le nom du Christ.
        Ces martyrs africains marquent les débuts d’une époque nouvelle. Non pas en ce sens qu’elle s’oriente vers les persécutions et les conflits, mais vers une régénération religieuse et politique.
        En effet, l’Afrique, arrosée du sang de ces martyrs, les premiers de cet âge nouveau — et plaise à Dieu qu’ils soient les derniers, puisque leur holocauste est si noble et si précieux ! — l’Afrique libre et devenue indépendante, est en train de renaître.
        La cruauté qui a broyé ces martyrs est si horrible et si riche de signification qu’elle offre des motifs déterminants et manifestes pour la formation morale d’un peuple nouveau. Une nouvelle tradition spirituelle doit s’affirmer, pour se transmettre aux hommes de l’avenir ; elle doit exprimer symboliquement et porter une évolution. D’un mode de vie simple et naïf, où ne manquaient pas des valeurs humaines remarquables, mais qui était déshonoré et affaibli par l’esclavage dans lequel il était tenu, il s’agit de passer à une condition politique qui aspire aux expressions les plus hautes de l’esprit humain et aux formes supérieures de la vie sociale.
      responsory: |-
        R/ Le Seigneur, c’est l’Esprit,
        l’Esprit du Seigneur est la liberté.

        Nous tous, à visage découvert,
        réfléchissons comme en un miroir la gloire de Dieu.

        Laissons-nous transformer
        en l’image du Seigneur, toujours plus glorieuse.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Sg 3,6-7.9 (Néovg)
    content: |-
      Comme l’or au creuset, le Seigneur a éprouvé ses élus ;
      >comme une offrande parfaite, il les accueille.
      Au temps de sa visite, ils resplendiront.
      Pour ses amis, grâce et miséricorde (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as fait du sang des martyrs
    >une semence de chrétiens ; *
    >accorde à ton Église,
    >terre féconde arrosée par le sang
    >de saint Charles Lwanga et de ses compagnons, /
    >de t’offrir une moisson toujours abondante.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2M 7, 1-2.9-14
      headline: « Nous sommes prêts à mourir plutôt que de transgresser les lois de nos pères »
      content: |-
        En ces jours-là,
        sept frères avaient été arrêtés avec leur mère.
        À coups de fouet et de nerf de bœuf,
        le roi Antiocos voulut les contraindre
        à manger du porc, viande interdite.
        L’un d’eux se fit leur porte-parole et déclara :
        « Que cherches-tu à savoir de nous ?
        Nous sommes prêts à mourir
        plutôt que de transgresser les lois de nos pères. »
        Au moment de rendre le dernier soupir, le deuxième frère dit :
        « Tu es un scélérat, toi qui nous arraches à cette vie présente,
        mais puisque nous mourons par fidélité à ses lois,
        le Roi du monde nous ressuscitera pour une vie éternelle. »
        Après cela, le troisième fut mis à la torture.
        Il tendit la langue aussitôt qu’on le lui ordonna
        et il présenta les mains avec intrépidité,
        en déclarant avec noblesse :
        « C’est du Ciel que je tiens ces membres,
        mais à cause de ses lois je les méprise,
        et c’est par lui que j’espère les retrouver. »
        Le roi et sa suite furent frappés
        de la grandeur d’âme de ce jeune homme
        qui comptait pour rien les souffrances.
        Lorsque celui-ci fut mort,
        le quatrième frère fut soumis aux mêmes sévices.
        Sur le point d’expirer, il parla ainsi :
        « Mieux vaut mourir par la main des hommes,
        quand on attend la résurrection promise par Dieu,
        tandis que toi, tu ne connaîtras pas la résurrection pour la vie. »
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 123 (124), 2-3, 4-5, 6a.7cd-8
      refAbbr: 123, 7ab
      chorus:
      - chorusRef: 123, 7ab
        chorus: |-
          Comme un oiseau, nous avons échappé
          au filet du chasseur.
      content: |-
        Sans le Seigneur qui était pour nous
        quand des hommes nous assaillirent,
        alors ils nous avalaient tout vivants,
        dans le feu de leur colère.

        Alors le flot passait sur nous,
        le torrent nous submergeait ;
        alors nous étions submergés
        par les flots en furie.

        Béni soit le Seigneur
        qui n’a pas fait de nous
        la proie de leurs dents !
        Comme l’oiseau, nous avons échappé
        au filet de l’oiseleur.

        Le filet s’est rompu :
        nous avons échappé.
        Notre secours est dans le nom du Seigneur
        qui a fait le ciel et la terre.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 1-12a
      headline: « Réjouissez-vous, soyez dans l’allégresse, car votre récompense est grande dans les cieux ! »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        voyant les foules, Jésus gravit la montagne.
        Il s’assit, et ses disciples s’approchèrent de lui.
        Alors, ouvrant la bouche, il les enseignait.
        Il disait :
        « Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux.
        Heureux ceux qui pleurent,
        car ils seront consolés.
        Heureux les doux,
        car ils recevront la terre en héritage.
        Heureux ceux qui ont faim et soif de la justice,
        car ils seront rassasiés.
        Heureux les miséricordieux,
        car ils obtiendront miséricorde.
        Heureux les cœurs purs,
        car ils verront Dieu.
        Heureux les artisans de paix,
        car ils seront appelés fils de Dieu.
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux.
        Heureux êtes-vous si l’on vous insulte,
        si l’on vous persécute
        et si l’on dit faussement toute sorte de mal contre vous,
        à cause de moi.
        Réjouissez-vous, soyez dans l’allégresse,
        car votre récompense est grande dans les cieux ! »
        
  offeringPrayer:
  - |-
    Nous te présentons, Seigneur, nos offrandes
    >et nous te supplions humblement : *
    >toi qui as accordé à tes saints martyrs
    >la force de préférer la mort au péché, /
    >fais que nous servions à ton autel
    >en nous donnant à toi sans réserve.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Ps 115,15
    content: |-
      Elle a du prix aux yeux du Seigneur,
      >la mort de ses amis les saints, alléluia.
  prayerAfterCommunion:
  - |-
    Nous avons participé, Seigneur, à ces mystères divins
    >en rappelant la victoire de tes saints martyrs ; *
    >puisque ces mystères leur ont donné
    >le courage d’endurer leurs supplices : /
    fais que nous y trouvions, comme eux,
    >une foi et une charité sans défaillance
    >au milieu des épreuves.
    Par le Christ, notre Seigneur.