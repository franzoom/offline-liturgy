celebration:
  title: Saint Christophe Magallanès, prêtre, et ses compagnons
  subtitle: martyrs
  description: Né en 1869 au Mexique, Christophe Magallanès n’abandonne pas le courageux exercice de son ministère lorsque la persécution frappe son pays entre 1915 et 1937. Il offre d’abriter un séminaire dans sa paroisse afin de maintenir la formation des futurs prêtres. Christophe et ses compagnons acceptent librement le martyre en 1927, pardonnant de façon explicite à leurs persécuteurs
  color: red
  commons:
    - martyrs

oration:
  - Dieu éternel et tout puisant, tu as rendu fidèles au Christ Roi, jusqu’au martyre, le prêtre saint Christophe et ses compagnons ; accorde-nous, par leur intercession, de persévérer dans la confession de la vraie foi et de rester toujours attachés aux commandements de ton amour.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as rendu fidèles au Christ Roi, jusqu’au martyre,
    >le prêtre saint Christophe et ses compagnons ; *
    accorde-nous, par leur intercession,
    >de persévérer dans la confession de la vraie foi /
    et de rester toujours attachés
    >aux commandements de ton amour.
    Par Jésus Christ, ton Fils, notre Seigneur,
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ap 7, 9-17
      headline: « Ceux-là viennent de la grande épreuve »
      content: |-
        Moi, Jean,
        j’ai vu :
        et voici une foule immense,
        que nul ne pouvait dénombrer,
        une foule de toutes nations, tribus, peuples et langues.
        Ils se tenaient debout devant le Trône et devant l’Agneau,
        vêtus de robes blanches, avec des palmes à la main.
        Et ils s’écriaient d’une voix forte :
        « Le salut appartient à notre Dieu
        qui siège sur le Trône
        et à l’Agneau ! »
        Tous les anges se tenaient debout autour du Trône,
        autour des Anciens et des quatre Vivants ;
        se jetant devant le Trône, face contre terre,
        ils se prosternèrent devant Dieu.
        Et ils disaient :
        « Amen !
        Louange, gloire, sagesse et action de grâce,
        honneur, puissance et force
        à notre Dieu, pour les siècles des siècles ! Amen ! »
        L’un des Anciens prit alors la parole et me dit :
        « Ces gens vêtus de robes blanches,
        qui sont-ils, et d’où viennent-ils ? »
        Je lui répondis :
        « Mon seigneur, toi, tu le sais. »
        Il me dit :
        « Ceux-là viennent de la grande épreuve ;
        ils ont lavé leurs robes,
        ils les ont blanchies par le sang de l’Agneau.
        C’est pourquoi ils sont devant le trône de Dieu,
        et le servent, jour et nuit, dans son sanctuaire.
        Celui qui siège sur le Trône
        établira sa demeure chez eux.
        Ils n’auront plus faim, ils n’auront plus soif,
        ni le soleil ni la chaleur ne les accablera,
        puisque l’Agneau qui se tient au milieu du Trône
        sera leur pasteur
        pour les conduire aux sources des eaux de la vie.
        Et Dieu essuiera toute larme de leurs yeux. »
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6-7, 8-9
      refAbbr: cf. 33, 5b
      chorus:
      - chorusRef: cf. 33, 5b
        chorus: |-
          De toutes mes frayeurs,
          le Seigneur me délivre.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        L’ange du Seigneur campe alentour
        pour libérer ceux qui le craignent.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 12, 24-26
      headline: « Si le grain de blé meurt, il porte beaucoup de fruit »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Amen, amen, je vous le dis :
        si le grain de blé tombé en terre ne meurt pas,
        il reste seul ;
        mais s’il meurt,
        il porte beaucoup de fruit.
        Qui aime sa vie
        la perd ;
        qui s’en détache en ce monde
        la gardera pour la vie éternelle.
        Si quelqu’un veut me servir,
        qu’il me suive ;
        et là où moi je suis,
        là aussi sera mon serviteur.
        Si quelqu’un me sert,
        mon Père l’honorera. »
        Acclamons la Parole de Dieu.
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null