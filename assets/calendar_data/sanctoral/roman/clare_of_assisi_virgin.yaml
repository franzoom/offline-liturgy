celebration:
  title: Sainte Claire
  subtitle: vierge
  description: |-
    Claire (1193-1252) avait dix huit ans quand elle pria frère François de lui faire partager sa vie et qu’il l’enferma dans une maison délabrée, près de l’église Saint Damien aux portes d’Assise. Sa sœur Agnès et quelques autres jeunes filles vinrent se joindre à elle pour y vivre dans la pauvreté la plus totale. Ce furent les premières franciscaines.
  color: white
  commons:
    - virgins
    - saints-female_religious

oration:
  - Dans ta miséricorde, Seigneur, tu as conduit sainte Claire à l’amour de la pauvreté ; à sa prière, accorde-nous de suivre le Christ avec la même pauvreté de cœur, afin de pouvoir te contempler dans le royaume des cieux.

morning:
  hymn:
    - flamme-de-charite

readings:
  hymn:
    - pareille-aux-lis-des-champs
  patristicReading:
    - title: LETTRE DE SAINTE CLAIRE À LA BIENHEUREUSE AGNÈS DE PRAGUE
      content: |-
        Heureux celui qui obtient de participer au banquet sacré afin de s’unir du fond de son cœur à celui dont toutes les bienheureuses troupes du ciel admirent continuellement la beauté, dont l’amour est blessure et la contemplation nourriture, dont la bonté nous rassasie, dont la douceur nous enivre, dont le souvenir est une douce lumière, dont le parfum fait revivre les morts, dont la vue dans la gloire rendra bienheureux tous les citoyens de la Jérusalem d’en haut. Puisque cette vue est %un reflet de la lumière éternelle, un miroir sans tache%, regarde chaque jour ce miroir, ô reine, épouse de Jésus Christ, pour y regarder continuellement ton visage ainsi tu pourras t’embellir tout entière, à l’intérieur et à l’extérieur, revêtir des habits brodés, te parer des ornements et des fleurs de toutes les vertus, comme il convient à la fille et à l’épouse très chaste du souverain Roi. Dans ce miroir resplendit la bienheureuse pauvreté, la sainte humilité, l’inexprimable charité, que tu pourras contempler, par la grâce de Dieu, comme dans un miroir parfait.
        Regarde donc comment ce miroir a commencé : la pauvreté de celui qui a été déposé dans une mangeoire, enveloppé de langes. Ô étonnante humilité ! Ô stupéfiante pauvreté ! le Roi des anges, le Seigneur du ciel et de la terre est couché dans une mangeoire. Au centre du miroir, considère l’humilité, ou du moins la bienheureuse pauvreté, les labeurs et les peines innombrables qu’il a supportés pour la rédemption du genre humain. Et à l’extrémité de ce miroir, contemple l’inexprimable charité dont il a voulu mourir sur l’arbre de la croix, et y mourir du genre de mort le plus honteux. Ainsi ce miroir, placé sur le bois de la croix, avertissait les passants de considérer tout cela, en leur disant : %Vous tous qui passez sur le chemin, regardez et voyez, s’il est une douleur comparable à ma douleur%. À celui qui crie et se lamente ainsi, répondons d’une seule voix, d’un seul esprit : %Je m’en souviendrai toujours, et mon âme défaillira en moi%. Consume-moi donc de ce feu d’amour, toujours plus fortement, ô reine, épouse du roi céleste.
        Contemple aussi ses indicibles délices, ses richesses et ses honneurs sans fin ; et en soupirant à cause du désir et de l’amour intenses de ton cœur, proclame : %Entraîne-moi sur tes pas, courons à l’odeur de tes parfums%, époux céleste. Je courrai sans m’arrêter, jusqu’à ce que %tu m’introduises dans le cellier, que ton bras gauche soulève ma tête que ton bras droit m’étreigne pour mon bonheur et que tu me baises du baiser% délicieux %de ta bouche%.
        Lorsque tu seras établie dans cette contemplation, souviens-toi de ta pauvre petite mère. Sache que moi-même j’ai inscrit ton cher souvenir ineffaçablement, sur les tablettes de mon cœur, car personne ne m’est plus cher que toi.
      responsory: |-
        Pareille aux lis des champs
        que Dieu revêt de sa beauté,
        Claire a fleuri au grand Soleil ;
        pure simplicité,
        elle chante et s’émerveille.
    
        R/ Béni sois-tu, Seigneur,
        de m’avoir créée !
    
        Terre de vérité,
        l’Évangile m’a nourrie
        de sagesse profonde.

vespers:
  hymn:
    - flamme-de-charite

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dans ta miséricorde, Seigneur Dieu, +
    tu as conduit sainte Claire à l’amour de la pauvreté ; *
    accorde-nous, par son intercession,
    >de suivre le Christ dans la pauvreté du cœur, /
    >afin de pouvoir te contempler dans le royaume des Cieux.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ph 3, 8-14
      headline: |-
        « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        je les considère comme une perte
        à cause de ce bien qui dépasse tout :
        >la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        je considère tout comme des ordures,
        >afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        >non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        >la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        >d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        >en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        >à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        >je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        >puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        >oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        >auquel Dieu nous appelle là-haut dans le Christ Jésus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 9-11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 27-29
      headline: |-
        « Vous qui m’avez suivi, vous recevrez le centuple »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Pierre prit la parole et dit à Jésus :
        >« Voici que nous avons tout quitté pour te suivre :
        >quelle sera donc notre part ? »
        Jésus leur déclara :
        >« Amen, je vous le dis :
        >lors du renouvellement du monde,
        >lorsque le Fils de l’homme siégera sur son trône de gloire,
        >vous qui m’avez suivi,
        >vous siégerez vous aussi sur douze trônes
        >pour juger les douze tribus d’Israël.
        Et celui qui aura quitté, à cause de mon nom,
        >des maisons, des frères, des sœurs,
        >un père, une mère, des enfants,
        >ou une terre,
        >recevra le centuple,
        >et il aura en héritage la vie éternelle. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null