celebration:
  title: Commémoraison de tous les fidèles défunts
  description: La prière pour les morts appartient à la plus ancienne tradition chrétienne. Il est donc naturel qu’au lendemain de la fête de ceux qui sont entrés dans l’intimité sacrée de Dieu, notre sollicitude se porte vers nos frères qui sont morts dans l’espoir de la résurrection et qu’elle embrasse aussi « tous les morts dont seul le Seigneur connaît la foi ».
  commons:
    - trespassed
  color: violet

oration:
  - |-
    Écoute nos prières avec bonté, Seigneur : fais grandir notre foi en ton Fils ressuscité des morts, pour que soit plus vive aussi notre espérance en la résurrection de tous nos frères défunts.

morning:
  hymn:
  - seigneur-tu-as-vaincu-la-mort

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AMBROISE POUR L’ANNIVERSAIRE DE LA MORT DE SON FRÈRE
      content: |-
        Nous voyons que la mort est un avantage, et la vie un tourment, si bien que Paul a pu dire : %Pour moi, vivre c’est le Christ, et mourir est un avantage%. Qu’est-ce que le Christ ? Rien d’autre que la mort du corps, et l’esprit qui donne la vie. Aussi mourons avec lui pour vivre avec lui. Nous devons chaque jour nous habituer et nous affectionner à la mort afin que notre âme apprenne, par cette séparation, à se détacher des désirs matériels. Notre âme établie dans les hauteurs, où les sensualités terrestres ne peuvent accéder pour l’engluer, accueillera l’image de la mort pour ne pas encourir le châtiment de la mort. En effet%la loi%de la chair%est en lutte contre la loi de l’âme%et cherche à l’entraîner dans l’erreur. ~ Mais quel est le remède ?%Qui me délivrera de ce corps de mort ? — La grâce de Dieu, par Jésus Christ, notre Seigneur.%
        Nous avons le médecin, adoptons le remède. Notre remède, c’est la grâce du Christ, et le%corps de mort%, c’est notre corps. Alors, soyons étrangers au corps pour ne pas être étrangers au Christ. Si nous sommes dans le corps, ne suivons pas ce qui vient du corps ; n’abandonnons pas les droits de la nature, mais préférons les dons de la grâce.
        Qu’ajouter à cela ? Le monde a été racheté par la mort d’un seul. Car le Christ aurait pu ne pas mourir, s’il l’avait voulu. Mais il n’a pas jugé qu’il fallait fuir la mort comme inutile, car il ne pouvait mieux nous sauver que par sa mort. C’est pourquoi sa mort donne la vie à tous. Nous portons la marque de sa mort, nous annonçons sa mort par notre prière, nous proclamons sa mort par notre sacrifice. Sa mort est une victoire, sa mort est un mystère, le monde célèbre sa mort chaque année.
        Que dire encore de cette mort, puisque l’exemple d’un Dieu nous prouve que la mort seule a recherché l’immortalité et que la mort s’est rachetée elle-même ? II ne faut pas s’attrister de la mort, puisqu’elle produit le salut de tous, il ne faut pas fuir la mort que le Fils de Dieu n’a pas dédaignée et n’a pas voulu fuir. ~
        La mort n’était pas naturelle, mais elle l’est devenue ; car, au commencement, %Dieu n’a pas créé la mort% : il nous l’a donnée comme un remède. ~ L’homme, condamné pour sa désobéissance à un travail continuel et à une désolation insupportable, menait une vie devenue misérable. Il fallait mettre fin à ses malheurs, pour que la mort lui rende ce que sa vie avait perdu. L’immortalité serait un fardeau plutôt qu’un profit, sans le souffle de la grâce. ~
        L’âme a donc le pouvoir de quitter le labyrinthe de cette vie et la fange de ce corps, et de tendre vers l’assemblée du ciel, bien qu’il soit réservé aux saints d’y parvenir ; elle peut chanter la louange de Dieu dont le texte prophétique nous apprend qu’elle est chantée par des musiciens : %Grandes et merveilleuses sont tes œuvres. Seigneur, Dieu tout-puissant : justes et véritables sont tes chemins. Roi des nations. Qui ne te craindrait, Seigneur, et ne glorifierait ton nom ? Car toi seul es saint. Toutes les nations viendront se prosterner devant toi%. Et l’âme peut voir tes noces, Jésus, où ton épouse est conduite de la terre jusqu’aux cieux, sous les acclamations joyeuses de tous — %car vers toi vient toute chair%— ton épouse qui n’est plus exposée aux dangers du monde, mais unie à ton Esprit. ~
        C’est ce que le saint roi David a souhaité, plus que toute autre chose, pour lui-même, c’est ce qu’il a voulu voir et contempler : %La seule chose que je demande au Seigneur, la seule que je cherche, c’est d’habiter la maison du Seigneur tous les jours de ma vie, et de découvrir la douceur du Seigneur.%
      responsory: |-
        R/ Grâce et bonheur
        à ceux qui s’endorment dans la foi.

        Pour les morts est offert le sacrifice d’expiation,
        afin qu’ils soient délivrés de leurs péchés.

        Le Christ est mort, puis ressuscité,
        pour être le Seigneur des morts et des vivants.

mass:
- massType: first_mass
  name: Première messe
  note: On choisira les lectures parmi celles qui sont proposées pour les funérailles (Lectionnaire, p. 1467) ; aucune péricope fixe n’est imprimée dans le Missel pour cette messe.
  entranceAntiphon:
  - biblicalReference: cf. 1Th 4,14 ; 1 Co 15,22
    content: |-
      Jésus est mort et ressuscité ;
      de même, ceux qui se sont endormis,
      >Dieu, par Jésus, les emmènera avec lui.
      En effet, de même que tous les hommes meurent en Adam,
      >de même c’est dans le Christ que tous recevront la vie.
  collect:
  - |-
    Écoute nos prières avec bonté, Seigneur, nous t’en prions : *
    >tandis que grandit notre foi
    >en ton Fils ressuscité d’entre les morts, /
    affermis aussi notre espérance,
    >puisque nous attendons la résurrection de ceux qui t’ont servi.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles. (= Funérailles C)
  readingParts: []
  offeringPrayer:
  - |-
    Sois favorable à nos offrandes, Seigneur : *
    >que les fidèles défunts parviennent à la gloire
    >avec ton Fils à qui nous sommes unis /
    >par l’admirable sacrement de son amour.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: cf. Jn 11,25-26
    content: |-
      Je suis la résurrection et la vie, dit le Seigneur.
      Celui qui croit en moi, même s’il meurt, vivra ;
      >et quiconque vit et croit en moi ne mourra jamais.
  prayerAfterCommunion:
  - |-
    Accorde aux fidèles défunts, Seigneur,
    >de passer dans ta demeure de lumière et de paix, *
    car c’est pour eux que nous avons célébré /
    >le sacrement pascal.
    Par le Christ, notre Seigneur.

- massType: second_mass
  name: Deuxième messe
  note: On choisira les lectures parmi celles qui sont proposées pour les funérailles (Lectionnaire, p. 1467) ; aucune péricope fixe n’est imprimée dans le Missel pour cette messe.
  entranceAntiphon:
  - biblicalReference: cf. 4Esd 2,34-35
    content: |-
      Donne-leur le repos éternel, Seigneur,
      et que brille pour eux la lumière sans fin.
  collect:
  - |-
    Seigneur Dieu, +
    >tu es la gloire de tes fidèles, tu es la vie des justes,
    >et ton propre Fils nous a rachetés
    >par sa mort et sa résurrection ; *
    regarde avec bienveillance tes serviteurs défunts : /
    >puisqu’ils ont cru au mystère de notre résurrection,
    >accorde-leur de goûter le bonheur éternel.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: []
  offeringPrayer:
  - |-
    Dieu de puissance et de miséricorde, +
    >dans le sacrifice que nous t’offrons,
    >délivre les âmes de tes serviteurs défunts,
    en effaçant leurs péchés par le sang du Christ ; *
    >que ta douce miséricorde ne cesse de purifier /
    >ceux que tu as lavés dans l’eau du baptême.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. 4Esd 2,35.34
    content: |-
      Que brille sur eux la lumière éternelle
      en compagnie des saints, car tu es bon, Seigneur.
  prayerAfterCommunion:
  - |-
    Après avoir communié, Seigneur,
    >au sacrement de ton Fils unique,
    >immolé pour nous et ressuscité dans la gloire, +
    nous te supplions pour tes serviteurs défunts : *
    >fais que, purifiés par le mystère pascal, /
    >ils obtiennent la gloire que donne la résurrection à venir.
    Par le Christ, notre Seigneur.


- massType: third_mass
  name: 3ème messe
  note: On choisira les lectures parmi celles qui sont proposées pour les funérailles (Lectionnaire, p. 1467) ; aucune péricope fixe n’est imprimée dans le Missel pour cette messe.
  entranceAntiphon:
  - biblicalReference: cf. Rm 8,11
    content: |-
      Dieu qui a ressuscité Jésus d’entre les morts
      >donnera aussi la vie à nos corps mortels
      >par son Esprit qui habite en nous.
  collect:
  - |-
    Seigneur Dieu, +
    >ton Fils unique a triomphé de la mort,
    >et tu l’as fait passer dans le royaume des Cieux ; *
    accorde à tes serviteurs défunts
    >de partager sa victoire sur la mort /
    >pour te contempler éternellement,
    >toi, leur créateur et rédempteur.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts: []
  offeringPrayer:
  - |-
    Accueille avec bonté, Seigneur,
    >l’offrande que nous te présentons
    >pour tous ceux qui reposent dans le Christ : *
    que cet incomparable sacrifice,
    >en les arrachant aux liens de la mort, /
    >leur obtienne la vie éternelle.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Ph 3,20-21
    content: |-
      Nous attendons comme sauveur le Seigneur Jésus Christ,
      >lui qui transformera nos pauvres corps à l’image de son corps glorieux.
  prayerAfterCommunion:
  - |-
    Par ce sacrifice que tu as accueilli, Seigneur, +
    >fais surabonder ta miséricorde sur tes serviteurs défunts : *
    tu leur as donné la grâce du baptême, /
    >donne-leur aussi en plénitude la joie éternelle.
    Par le Christ, notre Seigneur.