celebration:
  title: Conversion de Saint Paul, Apôtre
  description: |-
    Sur la route de Damas Saul de Tarse a fait une double découverte : Jésus de Nazareth est le Béni de Dieu, le Ressuscité de Pâques, et il ne fait qu’un avec ses frères. Toute la vie de Paul devait être marquée par cette illumination.
  commons:
  - apostles
  color: white

oration:
- Dieu qui as instruit le monde entier par la parole de l’Apôtre saint Paul, dont nous célébrons aujourd’hui la conversion. Accorde-nous d’aller vers toi en cherchant à lui ressembler, et d’être, dans le monde, les témoins de ton Évangile.

readings:
  hymn:
  - quel-est-ce-voyageur
  psalmody:
  - psalm: PSALM_18A
    antiphon:
    - Qui es-tu, Seigneur ? — Je suis Jésus, celui que tu persécutes. Il est dur de te rebiffer contre l’aiguillon.
  - psalm: PSALM_63
    antiphon:
    - Paul est l’instrument que le Seigneur a choisi pour faire parvenir son nom auprès des nations païennes, auprès des rois, et des fils d’Israël.
  - psalm: PSALM_96
    antiphon:
    - Paul proclamait Jésus dans les synagogues, affirmant qu’il est le Fils de Dieu.
  verse: |-
    V/ Le Seigneur est tendresse et pitié
    lent à la colère et plein d’amour.
  biblicalReading:
  - title: LECTURE DE L’ÉPITRE AUX GALATES
    subtile: Paul le Juif devient Apôtre du Christ
    ref: Ga 1, 11-24
    content: |-
      Frères, je tiens à ce que vous le sachiez, l’Évangile que j’ai proclamé n’est pas une invention humaine. Ce n’est pas non plus d’un homme que je l’ai reçu ou appris, mais par révélation de Jésus Christ.
      Vous avez entendu parler du comportement que j’avais autrefois dans le judaïsme : je menais une persécution effrénée contre l’Église de Dieu, et je cherchais à la détruire. J’allais plus loin dans le judaïsme que la plupart de mes frères de race qui avaient mon âge, et, plus que les autres, je défendais avec une ardeur jalouse les traditions de mes pères. Mais Dieu m’avait mis à part dès le sein de ma mère ; dans sa grâce, il m’a appelé ; et il a trouvé bon de révéler en moi son Fils, pour que je l’annonce parmi les nations païennes. Aussitôt, sans prendre l’avis de personne, sans même monter à Jérusalem pour y rencontrer ceux qui étaient Apôtres avant moi, je suis parti pour l’Arabie et, de là, je suis retourné à Damas. Puis, trois ans après, je suis monté à Jérusalem pour faire la connaissance de Pierre, et je suis resté quinze jours auprès de lui. Je n’ai vu aucun des autres Apôtres sauf Jacques, le frère du Seigneur. En vous écrivant cela, — je le déclare devant Dieu — je ne mens pas. Ensuite, je me suis rendu dans les régions de Syrie et de Cilicie. Mais pour les Églises de Judée qui sont dans le Christ, mon visage restait inconnu ; elles avaient simplement entendu dire : « Celui qui nous persécutait naguère annonce aujourd’hui la foi qu’il cherchait alors à détruire. » Et l’on rendait gloire à Dieu à mon sujet.
    responsory: |-
      R/ Victoire du Christ en son Apôtre !

      Contre Jésus, il allait à Damas,
      pour Jésus, il sillonnera le monde.

      Dans la justice de la loi, il mettait son orgueil,
      la grâce de l’Esprit fera toute sa fierté.

  patristicReading:
  - title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME À LA LOUANGE DE PAUL
    subtitle: Amour de Paul pour le Christ
    content: |-
      Qu’est-ce que l’homme ? Quelle est la noblesse de notre nature ? De quelle vertu est capable cette créature vivante ? Paul nous l’a montré mieux que n’importe qui. ~
      Chaque jour, il montait plus haut, il était animé d’un nouveau courage contre les dangers qui s’élevaient contre lui. Il le disait clairement : %Oubliant ce qui est en arrière, et tendu vers l’avant%. ~ Alors qu’il s’attendait à la mort, il appelait à partager cette joie : %Soyez joyeux et réjouissez-vous avec moi%. Exposé aux dangers, aux insultes, et à toute sorte d’humiliations, il exulte encore et il écrit aux Corinthiens : %C’est pourquoi j’accepte de grand cœur les faiblesses, les insultes, les persécutions%. Il appelait cela les armes de la justice et montrait qu’il en recueillait le plus grand fruit.
      Il échappait de toutes parts à ses ennemis. Accablé de coups, d’insultes, d’outrages, il célébrait une sorte de triomphe continuel ; partout il érigeait des trophées, il s’en glorifiait et il en rendait grâce à Dieu, en disant : %Rendons grâce à Dieu qui nous emmène en tout temps dans son triomphe%.
      Il recherchait la honte et les insultes que lui valait sa prédication, plus que nous ne recherchons les honneurs ; la mort, plus que nous la vie ; la pauvreté, plus que nous la richesse ; les labeurs, plus que d’autres le repos. ~ Une seule chose lui paraissait à redouter et à fuir : offenser Dieu, et rien d’autre. De même rien ne lui paraissait à désirer que de plaire à Dieu. ~
      Ce qu’il tenait pour supérieur à tout, c’était l’amour du Christ ; avec cela, il estimait qu’il était le plus heureux des hommes. En dehors de cela, il ne souhaitait d’être ni parmi les souverains, ni parmi les chefs, ni parmi les autorités ; mais il préférait être parmi les derniers et même au nombre des condamnés avec cet amour, plutôt que, en dehors de lui, parmi les hommes haut placés et couverts d’honneurs.
      Il n’y avait pour lui qu’un seul supplice : perdre cet amour. Pour lui c’était la géhenne, le châtiment, un malheur infini. En revanche, jouir de cet amour, c’était pour lui posséder la vie, le monde, son bon ange, le présent et l’avenir, la royauté, la promesse, le bonheur infini. Tout ce qui peut nous arriver ici-bas, en dehors de cela, il ne le jugeait ni pénible, ni agréable.
      Il méprisait toutes les choses visibles autant que de l’herbe pourrie. Les tyrans et les peuples pleins de fureur lui semblaient des moucherons ; la mort, les châtiments, tous les supplices : des jeux d’enfants, du moment qu’il avait à souffrir pour le Christ.
    responsory: |-
      Quel est ce voyageur
      que le Seigneur guette sur le chemin
      et qu’il terrasse par sa lumière ?
      Quel est ce violent
      qu’entre tous le Seigneur a choisi
      pour aire connaître à jamais
      la force de sa Parole ?

      R/ Victoire du Christ en son Apôtre !

morning:
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - Je sais en qui j’ai mis ma foi, je sais qu’il me gardera fidèle pour le jour du jugement.
  - psalm: OT_41
    antiphon:
    - Ma grâce te suffit, dit le Seigneur, car ma puissance s’accomplit dans la faiblesse.
  - psalm: PSALM_149
    antiphon:
    - Ce que je suis, je le dois à la grâce de Dieu, et sa grâce est toujours avec moi.
  reading:
    biblicalReference: Ac 26, 16b-18
    content: |-
      Voici pourquoi je te suis apparu : je t’ai destiné à être serviteur et témoin de la vision où tu viens de me voir ainsi que des visions où je t’apparaîtrai encore. Je te délivre déjà du peuple et des nations païennes vers qui je t’envoie pour leur ouvrir les yeux, les détourner des ténèbres vers la lumière, de l’empire de Satan vers Dieu, afin qu’ils reçoivent le pardon des péchés et une part d’héritage avec les sanctifiés, par la foi en moi.
  responsory: |-
    R/ Paul, Apôtre des nations
    * le Seigneur t’a choisi !
    V/ Pour annoncer sa Parole, *
    V/ Pour souffrir en son nom, *
    Gloire au Père, et au Fils, et au Saint-Esprit. R/
  evangelicAntiphon:
    common:

    - Célébrons la conversion de l’Apôtre Paul ; le persécuteur est devenu héraut de l’Évangile.
middleOfDay:
  tierce:
    antiphon: Celui qui t’est apparu en chemin m’a envoyé vers toi pour que tu recouvres la vue et que tu sois rempli de l’Esprit Saint.
    reading:
      biblicalReference: 1 Tm 1, 12-13a
      content: Je suis plein de reconnaissance pour celui qui me donne la force, Jésus Christ notre Seigneur, car il m’a fait confiance en me chargeant du ministère, moi qui autrefois ne savais que blasphémer, persécuter, insulter. Mais le Christ m’a pardonné.
    responsory: |-
      V/ Réjouissez-vous, dit le Seigneur,
      vos noms sont inscrits dans les cieux.
  sexte:
    antiphon: Sur le chemin de Damas, une lumière venue du ciel l’enveloppe soudain de sa clarté.
    reading:
      biblicalReference: 1 Tm 1, 14-15
      content: |-
        La grâce de notre Seigneur a été la plus forte, avec la foi et l’amour dans le Christ Jésus. Voici une parole sûre, et qui mérite d’être accueillie sans réserve : le Christ Jésus est venu dans le monde pour sauver les pécheurs ; et moi, le premier, je suis pécheur.
    responsory: |-
      V/ Tu es la lumière de ma lampe,
      Seigneur mon Dieu, tu éclaires ma nuit.
  none:
    antiphon: Je suis Jésus de Nazareth, c’est moi que tu persécutes.
    reading:
      biblicalReference: 1 Tm 1, 16
      content: Si le Christ Jésus m’a pardonné, c’est pour que je sois le premier en qui toute sa générosité se manifesterait ; je devais être le premier exemple de ceux qui croiraient en lui pour la vie éternelle.
    responsory: |-
      V/ Toujours, je rendrai goire à ton nom, Seigneur :
      il est grand ton amour pour moi.

vespers:
  psalmody:
  - psalm: PSALM_115
    antiphon:
    - Je me glorifierai de ma faiblesse afin qu’habite en moi la puissance du Christ.
  - psalm: PSALM_125
    antiphon:
    - Celui qui plante n’est rien, celui qui arrose n’est rien. Dieu seul compte, qui donne la croissance.
  - psalm: NT_4
    antiphon:
    - |-
      Pour moi, vivre, c’est le Christ, et mourir est un gain : la croix de Jésus Christ est ma seule gloire.
  reading:
    biblicalReference: 1 Co 15, 9-10
    content: |-
      Moi, je suis le plus petit des Apôtres, je ne suis pas digne d’être appelé Apôtre, puisque j’ai persécuté l’Église de Dieu. Mais ce que je suis, je le suis par la grâce de Dieu, et la grâce dont il m’a comblé n’a pas été stérile : je me suis donné de la peine plus que tous les autres ; à vrai dire, ce n’est pas moi, c’est la grâce de Dieu avec moi.
  responsory: |-
    R/ Une grande lumière m’entoure :
    * Seigneur, que veux-tu que je fasse ?
    V/ La voix me dit : Je suis celui que tu persécutes. *
    V/ Tu seras témoin devant tous les hommes. R/
  evangelicAntiphon:
    common:
    - Paul, Apôtre des nations, prédicateur de la vérité, intercède pour nous auprès de Dieu qui t’a choisi.
 
mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. 2Tm 1,12 ; 4,8
    content: |-
      Je sais en qui j’ai cru ;
      et j’ai la conviction qu’il est assez puissant
      >pour sauvegarder, jusqu’au jour de sa venue,
      >le dépôt de la foi qu’il m’a confié,
      >lui, le juste Juge.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as instruit le monde entier
    >par la parole du bienheureux apôtre Paul
    >dont nous célébrons aujourd’hui la conversion ; *
    accorde-nous d’aller vers toi
    >en suivant les exemples qu’il nous donne, /
    >et d’être ainsi pour le monde les témoins de ta vérité.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 22, 3-16
      headline: « Lève-toi et reçois le baptême, sois lavé de tes péchés en invoquant le nom de Jésus »
      content: |-
        En ces jours-là,
        Paul dit au peuple :
        >« Je suis juif,
        >né à Tarse en Cilicie,
        >mais élevé ici dans cette ville,
        >où, à l’école de Gamaliel,
        >j’ai reçu une éducation strictement conforme à la Loi de nos pères ;
        >j’avais pour Dieu une ardeur jalouse,
        >comme vous tous aujourd’hui.
        J’ai persécuté à mort ceux qui suivent le Chemin du Seigneur Jésus ;
        >j’arrêtais hommes et femmes, et les jetais en prison ;
        >le grand prêtre et tout le collège des anciens
        >peuvent en témoigner.
        Ces derniers m’avaient donné des lettres pour nos frères de Damas
        >où je me rendais :
        >je devais ramener à Jérusalem,
        >ceux de là-bas, enchaînés, pour qu’ils subissent leur châtiment.
        Donc, comme j’étais en route et que j’approchais de Damas,
        >soudain vers midi, une grande lumière venant du ciel
        >m’enveloppa de sa clarté.
        Je tombai sur le sol,
        >et j’entendis une voix me dire :
        >"Saul, Saul,
        >pourquoi me persécuter ?"
        Et moi je répondis :
        >"Qui es-tu, Seigneur ?
        - Je suis Jésus le Nazaréen, celui que tu persécutes."
        Ceux qui étaient avec moi virent la lumière,
        >mais n’entendirent pas la voix de celui qui me parlait.
        Alors je dis :
        >"Que dois-je faire, Seigneur ?"
        Le Seigneur me répondit :
        >"Relève-toi, va jusqu’à Damas ;
        >et là on te dira tout ce qu’il t’est prescrit de faire."
        Comme je n’y voyais plus rien,
        >à cause de l’éclat de cette lumière,
        je me rendis à Damas,
        >conduit par la main de mes compagnons.
        Or, Ananie, un homme religieux selon la Loi,
        >à qui tous les Juifs résidant là rendaient un bon témoignage,
        vint se placer près de moi
        >et me dit :
        >"Saul, mon frère,
        >retrouve la vue."
        Et moi, au même instant, je retrouvai la vue,
        >et je le vis.
        Il me dit encore :
        >"Le Dieu de nos pères t’a destiné à connaître sa volonté,
        >à voir celui qui est le Juste
        >et à entendre la voix qui sort de sa bouche.
        Car tu seras pour lui, devant tous les hommes,
        >le témoin de ce que tu as vu et entendu.
        Et maintenant, pourquoi tarder ?
        Lève-toi et reçois le baptême,
        >sois lavé de tes péchés en invoquant son nom." »
        .
    - biblicalRef: Ac 9, 1-22
      headline: « On te dira ce que tu dois faire »
      content: |-
        En ces jours-là,
        Saul était toujours animé d’une rage meurtrière
        >contre les disciples du Seigneur.
        Il alla trouver le grand prêtre
        >et lui demanda des lettres pour les synagogues de Damas,
        afin que, s’il trouvait des hommes et des femmes
        >qui suivaient le Chemin du Seigneur,
        >il les amène enchaînés à Jérusalem.
        Comme il était en route et approchait de Damas,
        >soudain une lumière venant du ciel l’enveloppa de sa clarté.
        Il fut précipité à terre ; il entendit une voix qui lui disait :
        >« Saul, Saul,
        >pourquoi me persécuter ? »
        Il demanda :
        >« Qui es-tu, Seigneur ? »
        La voix répondit :
        >« Je suis Jésus, celui que tu persécutes.
        Relève-toi et entre dans la ville :
        >on te dira ce que tu dois faire. »
        Ses compagnons de route s’étaient arrêtés,
        >muets de stupeur :
        ils entendaient la voix,
        >mais ils ne voyaient personne.
        Saul se releva de terre
        >et, bien qu’il eût les yeux ouverts, il ne voyait rien.
        Ils le prirent par la main
        >pour le faire entrer à Damas.
        Pendant trois jours, il fut privé de la vue
        >et il resta sans manger ni boire.
        Or, il y avait à Damas un disciple nommé Ananie.
        Dans une vision, le Seigneur lui dit :
        >« Ananie ! »
        Il répondit :
        >« Me voici, Seigneur. »
        Le Seigneur reprit :
        >« Lève-toi, va dans la rue appelée rue Droite, chez Jude :
        >tu demanderas un homme de Tarse nommé Saul.
        Il est en prière, et il a eu cette vision :
        >un homme, du nom d’Ananie,
        >entrait et lui imposait les mains
        >pour lui rendre la vue. »
        Ananie répondit :
        >« Seigneur, j’ai beaucoup entendu parler de cet homme,
        >et de tout le mal qu’il a fait subir à tes fidèles à Jérusalem.
        Il est ici, après avoir reçu de la part des grands prêtres
        >le pouvoir d’enchaîner tous ceux qui invoquent ton nom. »
        Mais le Seigneur lui dit :
        >« Va ! car cet homme est l’instrument que j’ai choisi
        >pour faire parvenir mon nom
        >auprès des nations, des rois et des fils d’Israël.
        Et moi, je lui montrerai
        >tout ce qu’il lui faudra souffrir pour mon nom. »
        Ananie partit donc
        >et entra dans la maison.
        Il imposa les mains à Saul, en disant :
        >« Saul, mon frère,
        >celui qui m’a envoyé, c’est le Seigneur,
        >c’est Jésus qui t’est apparu
        >sur le chemin par lequel tu venais.
        Ainsi, tu vas retrouver la vue,
        >et tu seras rempli d’Esprit Saint. »
        Aussitôt tombèrent de ses yeux comme des écailles,
        >et il retrouva la vue.
        Il se leva, puis il fut baptisé.
        Alors il prit de la nourriture et les forces lui revinrent.
        Il passa quelques jours à Damas avec les disciples
        et, sans plus attendre, il proclamait Jésus dans les synagogues,
        >affirmant que celui-ci est le Fils de Dieu.
        Tous ceux qui écoutaient étaient stupéfaits
        >et disaient :
        « N’est-ce pas lui qui, à Jérusalem,
        >s’acharnait contre ceux qui invoquent ce nom-là,
        >et n’est-il pas venu ici
        >afin de les ramener enchaînés chez les grands prêtres ? »
        Mais Saul, avec une force de plus en plus grande,
        réfutait les Juifs qui habitaient Damas,
        >en démontrant que Jésus est le Christ.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 116 (117), 1, 2
      refAbbr: Mc 16, 15
      chorus:
      - chorusRef: Mc 16, 15
        chorus: |-
          Allez dans le monde entier.
          Proclamez l’Évangile.
          ou : Alléluia !
      content: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !

        Son amour envers nous s’est montré le plus fort ;
        éternelle est la fidélité du Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 16, 15-18
      headline: « Allez dans le monde entier, proclamez l’Évangile »
      acclamationAntiphon: |-
        C’est moi qui vous ai choisis du milieu du monde,
        afin que vous alliez, que vous portiez du fruit,
        et que votre fruit demeure, dit le Seigneur.
      content: |-
        En ce temps-là,
        Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
        « Allez dans le monde entier.
        Proclamez l’Évangile à toute la création.
        Celui qui croira et sera baptisé sera sauvé ;
        celui qui refusera de croire sera condamné.
        Voici les signes qui accompagneront
        ceux qui deviendront croyants :
        en mon nom, ils expulseront les démons ;
        ils parleront en langues nouvelles ;
        ils prendront des serpents dans leurs mains
        et, s’ils boivent un poison mortel,
        il ne leur fera pas de mal ;
        ils imposeront les mains aux malades,
        et les malades s’en trouveront bien. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Tandis que nous célébrons tes mystères, Seigneur, +
    que ton Esprit Saint répande sur nous la lumière de la foi, /
    >dont il n’a cessé d’éclairer le bienheureux apôtre Paul,
    >pour que rayonne ta gloire.
    Par le Christ, notre Seigneur
  communionAntiphon:
  - biblicalReference: cf. Ga 2,20
    content: |-
      Je vis dans la foi au Fils de Dieu
      qui m’a aimé et s’est livré lui-même pour moi.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    que le sacrement reçu attise en nous le feu de la charité
    >dont l’ardeur enflammait le bienheureux apôtre Paul, /
    >et lui donnait le souci de toutes les Églises.
    Par le Christ, notre Seigneur.