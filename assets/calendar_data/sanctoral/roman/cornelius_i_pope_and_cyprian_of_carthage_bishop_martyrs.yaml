celebration:
  title: Saint Corneille, pape, et saint Cyprien, évêque
  subtitle: martyrs
  description: |-
    Cyprien, évêque de Carthage, fut décapité le 14 septembre 258. Ses lettres et ses autres écrits, ainsi que sa Passion, révèlent en lui l’âme d’un véritable pasteur, toujours sur la brèche pour soutenir ses frères dans la persécution et sauvegarder l’unité de l’Église, soucieux de donner en tout l’exemple de la fidélité au Seigneur Jésus Christ.
    Le pape Corneille, qui mourut en exil à Civitavecchia au terme d’un bref épiscopat (251-253), s’était attiré le respect et l’amitié de Cyprien. C’est pourquoi, dès le IV^ème siècle, l’Église romaine fêtait Corneille dans sa propre crypte funéraire au jour anniversaire de Cyprien.
  commons: 
  - martyrs
  - pastors_multiple
  color: red

oration:
  - Seigneur, tu as donné à ton peuple, dans les saints Corneille et Cyprien, des pasteurs dévoués et d’invincibles martyrs ; à leur prière, fortifie notre courage et notre foi, et accorde-nous de travailler avec empressement pour l’unité de l’Église.
 
readings:
  patristicReading:
    - title: LETTRE DE SAINT CYPRIEN AU PAPE SAINT CORNEILLE
      content: |-
        Cyprien à Corneille son frère.
        Nous avons appris, frère très cher, les témoignages que vous avez donnés de votre foi et de votre courage et nous avons accueilli la noblesse de votre confession avec un tel enthousiasme que nous nous considérons comme les associés et les compagnons des louanges que vous méritez. Car nous ne formons qu’une seule Église, nos esprits sont unis, notre unanimité est indissoluble ; quel évêque ne se réjouirait donc de la gloire d’un de ses collègues comme d’une gloire qui lui appartient ? Et quel est le groupe de frères, n’importe où, qui ne serait heureux de la joie de ses frères ?
        On ne pourrait assez exprimer toute l’allégresse, toute la joie qui a éclaté ici quand nous avons reçu ces bonnes nouvelles de votre courage : que vous avez été le chef de la confession rendue par les frères, mais aussi que la confession des frères a fait ressortir la confession de leur chef. Car, en marchant le premier vers la gloire, vous avez acquis de nombreux compagnons de gloire vous avez décidé tout le peuple à être confesseur en vous montrant prêt à confesser la foi le premier au nom de tous. Aussi, nous ne savons pas ce que nous devons d’abord célébrer en vous : ou bien votre foi prompte et inébranlable, ou bien cet amour des frères qui ne veulent pas se séparer de vous. Le courage de l’évêque marchant le premier s’est alors manifesté publiquement, et l’union des frères qui vous suivaient s’est montrée en même temps. Du fait qu’il n’y a eu chez vous qu’un seul cœur et une seule voix, c’est toute l’Église de Rome qui a confessé le Christ.
        On a vu éclater chez vous, frère très cher, cette foi dont le bienheureux Apôtre a fait l’éloge. Cette gloire de votre courage, cette constance dans la fermeté, il les voyait d’avance par l’esprit, et en proclamant vos mérites par l’éloge de ce qui arriverait plus tard, il exaltait les pères pour stimuler leurs fils. En étant unanimes, en étant courageux, vous avez donné aux autres frères de grands exemples d’unanimité et de courage. ~
        Nous vous exhortons autant que nous le pouvons, frère très cher, au nom de l’affection mutuelle qui nous unit puisque la providence du Seigneur nous avertit, puisque les avis salutaires de la divine miséricorde nous signalent que le jour approche où nous devrons livrer combat, ne cessons pas de jeûner, de veiller, de prier avec tout notre peuple. ~ Car telles sont les armes célestes à notre disposition, qui nous donnent de tenir bon et de persévérer avec courage ; voilà les fortifications spirituelles, les armes divines qui nous mettent à l’abri.
        Faisons mémoire l’un de l’autre, n’ayons qu’un seul cœur, qu’une seule âme ; chacun de notre côté, prions l’un pour l’autre ; allégeons nos épreuves et nos angoisses par notre amour mutuel.
      responsory: |-
        R/ Tous ceux qui veulent plaire à Dieu
        connaîtront la souffrance.

        Nous nous affirmons en tout
        comme des ministres de Dieu,
        constants dans les tribulations,
        les détresses, les angoisses.

        On nous tient pour affligés,
        et nous sommes toujours joyeux,
        pour gens qui n’ont rien,
        et nous possédons tout.

        Reste fidèle jusqu’à la mort, dit le Seigneur,
        et je te donnerai la couronne de vie.

    - title: ACTES PROCONSULAIRES SUR LE MARTYRE DE SAINT CYPRIEN
      content: |-
        Le 14 Septembre au matin, une grande foule se rassembla au Champ de Sextus, sur l’ordre du proconsul Galère Maxime. Ce proconsul ordonna que Cyprien lui fût présenté le jour même quand il siégerait au Portique des exécutions. Lorsque l’Évêque Cyprien fut amené, le proconsul lui demanda : « C’est toi qui es Thascius Cyprien ? — C’est moi. »
        Le proconsul : « C’est toi qui prétends être le chef d’hommes aux doctrines sacrilèges ? — C’est moi. — Les très saints empereurs ont ordonné que tu sacrifies aux dieux. — Je ne le ferai pas. »
        Galère Maxime lui dit : « Réfléchis. » Cyprien répondit : « Fais ce qu’on t’a commandé. Dans une affaire aussi juste, il n’y a pas à réfléchir. »
        Le proconsul, après avoir délibéré avec son conseil, se décida enfin à prononcer sa sentence. Il parla ainsi : « Tu as longtemps vécu dans une doctrine sacrilège et tu as rassemblé beaucoup de gens autour de toi pour un complot criminel ; tu t’es dressé en ennemi des dieux de Rome et de leurs rites sacrés ; nos religieux et saints souverains, Valérien et Gallien, nos Augustes, et Valérien, notre très noble César, n’ont pu te ramener à la pratique de leur culte. Et c’est pourquoi, parce que tu as été convaincu d’être l’auteur et le propagateur de crimes infâmes, tu serviras de leçon à ceux que tu as associés à ton forfait ; l’ordre public sera consacré par ton sang. » Après ce discours, il lut sa décision sur une tablette : « Nous ordonnons que Tascius Cyprien soit châtié par le glaive. » Cyprien dit : « Je rends grâce à Dieu. »
        Après cette sentence, la foule des frères disait : « Nous aussi, qu’on nous décapite avec lui. » Aussi les frères s’ameutèrent et une grande foule le suivit. C’est ainsi que Cyprien fut amené au Champ de Sextus; il enleva son burnous, s’agenouilla et se prosterna pour prier le Seigneur. Après avoir enlevé sa dalmatique épiscopale, qu’il remit à ses diacres, il demeura en tunique de lin et attendit l’exécuteur.
        Lorsque celui-ci arriva, Cyprien ordonna à ses assistants de lui donner vingt-cinq pièces d’or. Les frères étendaient devant lui des linges et des mouchoirs. Puis le bienheureux Cyprien se banda les yeux de sa propre main. Comme il ne pouvait pas s’attacher les mains, Julien le prêtre et Julien le sous-diacre les lui attachèrent.
        C’est ainsi que le bienheureux Cyprien subit le martyre. Pour éviter la curiosité des païens, on déposa son corps non loin de là. Puis, pendant la nuit, on le transporta avec des cierges et des torches au cimetière du procurateur Macrobe Candidien, sur la route de Mappala, près des citernes. Ce transfert se fit dans la joie d’un véritable triomphe. Peu de jours après, le proconsul Galère Maxime mourut.
        Le bienheureux Cyprien souffrit le martyre le 14 septembre sous les empereurs Valérien et Gallien, mais sous le règne de notre Seigneur Jésus Christ, à qui appartiennent honneur et gloire pour les siècles des siècles. Amen.
      responsory: |-
        R/ Tous ceux qui veulent plaire à Dieu
        connaîtront la souffrance.

        Nous nous affirmons en tout
        comme des ministres de Dieu,
        constants dans les tribulations,
        les détresses, les angoisses.

        On nous tient pour affligés,
