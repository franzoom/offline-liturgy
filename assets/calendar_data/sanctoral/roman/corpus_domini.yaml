celebration:
  title: Le Saint Sacrement du Corps et du Sang du Christ
  color: white

oration:
  - Seigneur Jésus Christ, dans cet admirable sacrement, tu nous as laissé le mémorial de ta passion ; donne-nous de vénérer d’un si grand amour le mystère de ton corps et de ton sang, que nous puissions recueillir sans cesse le fruit de ta rédemption. Toi qui règnes.

firstVespers:
  hymn:
    - la-nuit-qu-il-fut-livre
  psalmody:
    - psalm: PSALM_110
      antiphon:
        - |-
          Le Seigneur est tendresse et pitié : il a donné des vivres à ses fidèles. De ses merveilles, il a laissé un mémorial.
    - psalm: PSALM_147
      antiphon:
        - Le Seigneur fait régner la paix dans son Église, et d’un pain de froment la rassasie.
    - psalm: NT_10
      antiphon:
        - Ce n’est pas Moïse, c’est mon Père qui vous donne le vrai pain venu du ciel. Alléluia.
  reading:
    biblicalReference: 1Co 10, 16-17
    content: La coupe d’action de grâce que nous bénissons, n’est-elle pas communion au sang du Christ ? Le pain que nous rompons, n’est-il pas communion au corps du Christ ? Puisqu’il y a un seul pain, la multitude que nous sommes est un seul corps, car nous avons tous part à un seul pain.
  responsory: |-
    R/ Jésus, tu es le pain de Dieu,
    * Tu nous donnes la vie.
    V/ Tu es la manne des temps nouveaux. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common:
    - Seigneur, que ton Esprit est bon ! Tu montres ta tendresse pour tes fils en leur donnant le pain du ciel ; tu combles de biens les affamés et tu renvoies les riches les mains vides.
  intercession:
    content: |-
      Prions dans la joie le Seigneur Jésus Christ. Pain de notre vie :

      R/ Béni sois-tu, Seigneur, pour ton corps et ton sang !

      O Christ, tu nous as dit de rendre grâce en mémoire de toi,
      — garde-nous fidèles à célébrer ce mystère.

      Prêtre unique du Dieu Très-Haut,
      — donne aux serviteurs de l’Eucharistie d’imiter dans leur vie ce qu’ils célèbrent.

      Tu rassembles en un seul corps ceux qui participent au même pain :
      — préserve l’unité des croyants.

      Tu es le pain envoyé par le Père pour notre guérison :
      — rends la santé aux corps et aux âmes.

      Tu nous as confié l’Eucharistie pour annoncer ta mort et ta résurrection :
      — donne la vie éternelle à ceux qui attendent ton retour.

invitatory:
  antiphon:
    - Pain qui donnes la vie, Christ et Seigneur, louange à toi.

readings:
  hymn:
    - mendiant-du-jour
  psalmody:
    - psalm: PSALM_22
      antiphon:
        - Grâce et bonheur tous les jours de ma vie à la table du Seigneur, alléluia.
    - psalm: PSALM_41
      antiphon:
        - Que l’homme assoiffé s’approche, et reçoive gratuitement l’eau de la vie.
    - psalm: PSALM_80
      antiphon:
        - Dieu les nourrit de la fleur du froment, il les rassasie du miel du rocher.
  verse: |-
    V/ La Sagesse a bâti sa maison, alléluia,
    elle a dressé sa table et mélangé son vin, alléluia.
  biblicalReading:
    - title: LECTURE DE DU LIVRE DE L’EXODE
      subtitle: Voir Dieu, faire alliance avec lui
      ref: Ex 24, 1-11
      content: |-
        Le SEIGNEUR avait dit à Moïse : « Monte vers le SEIGNEUR et prends avec toi Aaron, ses deux fils Nadab et Abihou, et soixante-dix des anciens d’Israël. Vous vous prosternerez à distance. Moïse, seul, s’approchera du SEIGNEUR. Les autres ne s’approcheront pas et le peuple ne montera pas avec lui. »
        Moïse vint rapporter au peuple toutes les paroles du SEIGNEUR et toutes ses ordonnances. Tout le peuple répondit d’une seule voix : « Toutes ces paroles que le SEIGNEUR a dites, nous les mettrons en pratique. »
        Moïse écrivit toutes les paroles du SEIGNEUR. Il se leva de bon matin et il bâtit un autel au pied de la montagne, et il dressa douze pierres pour les douze tribus d’Israël. Puis il chargea quelques jeunes garçons parmi les fils d’Israël d’offrir des holocaustes, et d’immoler au SEIGNEUR des taureaux en sacrifice de paix. Moïse prit la moitié du sang et le mit dans des coupes ; puis il aspergea l’autel avec le reste du sang. Il prit le livre de l’Alliance et en fit la lecture au peuple. Celui-ci répondit : « Tout ce que le SEIGNEUR a dit, nous le mettrons en pratique, nous y obéirons. » Moïse prit le sang, en aspergea le peuple, et dit : « Voici le sang de l’Alliance que, sur la base de toutes ces paroles, le SEIGNEUR a conclue avec vous. »
        Et Moïse gravit la montagne avec Aaron, Nadab et Abihou, et soixante-dix des anciens d’Israël. Ils virent le Dieu d’Israël : il avait sous les pieds comme un pavement de saphir, limpide comme le fond du ciel. Sur ces privilégiés parmi les fils d’Israël, il ne porta pas la main. Ils contemplèrent Dieu, puis ils mangèrent et ils burent.
      responsory: |-
        [rubric](Stance)[/rubric]
        Vers qui, Seigneur, diriger notre marche,
        sinon vers toi ?
        Toi seul nous parles de la vie
        et nous la donnes.
        Rends-nous dignes de la table
        où ton Père aujourd’hui nous invite.

        R/ Vois notre faim, Sauveur du monde
        partage-nous ta parole et ton pain.

        Je suis le Pain de la vie,
        qui vient à moi n’aura jamais faim,
        qui croit en moi n’aura jamais soif.

        Voici la parole de mon Père :
        celui qui croit au Fils
        a la vie éternelle.

        Qui mange ma chair et boit mon sang
        a la vie éternelle,
        et moi, je le ressusciterai au dernier jour.
  patristicReading:
    - title: LECTURE DE SAINT THOMAS D’AQUIN POUR L’OFFICE DU CORPS DU CHRIST
      subtitle: Le mystère de l’Eucharistie
      content: |-
        Le Fils unique de Dieu, voulant nous faire participer à sa divinité, a pris notre nature afin de diviniser les hommes, lui qui s’est fait homme.
        En outre, ce qu’il a pris de nous, il nous l’a entièrement donné pour notre salut. En effet, sur l’autel de la croix il a offert son corps en sacrifice à Dieu le Père afin de nous réconcilier avec lui ; et il a répandu son sang pour qu’il soit en même temps notre rançon et notre baptême : rachetés d’un lamentable esclavage, nous serions purifiés de tous nos péchés.
        Et pour que nous gardions toujours la mémoire d’un si grand bienfait, il a laissé aux fidèles son corps à manger et son sang à boire, sous les dehors du pain et du vin.
        Banquet précieux et stupéfiant, qui apporte le salut et qui est rempli de douceur ! Peut-il y avoir rien de plus précieux que ce banquet où l’on ne nous propose plus, comme dans l’ancienne Loi, de manger la chair des veaux et des boucs, mais le Christ qui est vraiment Dieu ? Y a-t-il rien de plus admirable que ce sacrement ? ~
        Aucun sacrement ne produit des effets plus salutaires que celui-ci : il efface les péchés, accroît les vertus et comble l’âme surabondamment de tous les dons spirituels !
        Il est offert dans l’Église pour les vivants et pour les morts afin de profiter à tous, étant institué pour le salut de tous.
        Enfin, personne n’est capable d’exprimer les délices de ce sacrement, puisqu’on y goûte la douceur spirituelle à sa source et on y célèbre la mémoire de cet amour insurpassable, que le Christ a montré dans sa passion.
        Il voulait que l’immensité de cet amour se grave plus profondément dans le cœur des fidèles. C’est pourquoi à la dernière Cène, après avoir célébré la Pâque avec ses disciples, lorsqu’il allait passer de ce monde à son Père, il institua ce sacrement comme le mémorial perpétuel de sa passion, l’accomplissement des anciennes préfigurations, le plus grand de tous ses miracles ; et à ceux que son absence remplirait de tristesse, il laissa ce sacrement comme réconfort incomparable.
      responsory: |-
        [rubric](Stance)[/rubric]
        Vers qui, Seigneur, diriger notre marche,
        sinon vers toi ?
        Toi seul nous parles de la vie
        et nous la donnes.
        Rends-nous dignes de la table
        où ton Père aujourd’hui nous invite.

        R/ Vois notre faim, Sauveur du monde
        partage-nous ta parole et ton pain.

morning:
  hymn:
    - quand-vint-le-jour
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - Tu as nourri ton peuple du pain des anges ; tu leur as envoyé le pain du ciel, alléluia.
    - psalm: OT_41
      antiphon:
        - Prêtres du Seigneur, bénissez le Seigneur, offrez-lui l’encens et le pain, alléluia.
    - psalm: PSALM_149
      antiphon:
        - Au vainqueur, je donnerai la manne cachée, je donnerai un nom nouveau. Alléluia.
  reading:
    biblicalReference: Ml 1, 11
    content: Du Levant au Couchant, grand est mon nom parmi les nations. En tout lieu un sacrifice d’encens est présenté à mon nom, ainsi qu’une offrande pure, car grand est mon nom parmi les nations, dit le Seigneur, le tout-puissant.
  responsory: |-
    R/ Dieu les a nourris de la fleur du froment,
    * Alléluia, alléluia !
    V/ Du vin de sa vigne, il les abreuve. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common:
      - Je suis le pain vivant qui descend du ciel. Qui mange de ce pain vivra pour toujours. Alléluia.
  intercession:
    content: |-
      Réjouissons-nous dans le Seigneur Jésus, notre Pain de vie :

      R/ Heureux les invités à ton repas, Seigneur !

      Prêtre de l’alliance nouvelle, tu as offert le sacrifice parfait sur l’autel de la croix :
      — fais-nous la grâce de nous offrir avec toi.

      Roi de justice et de paix, tu te livres en donnant le pain et le vin :
      — apprends-nous à te recevoir dans la foi.

      Toi, la manne venue du ciel, tu nourris l’Église par ton corps et ton sang :
      — fortifie-la dans sa marche vers le Père.

      Compagnon caché de nos vies, tu te tiens à la porte et tu frappes :
      — entre et viens t’asseoir à notre table.

      Unique adorateur du Père, tu envoies l’Église par le monde présenter l’offrande de ton corps :
      — rassemble en toi ceux que tu nourris du même pain.

middleOfDay:
  psalmody:
    - psalm: PSALM_117_1
    - psalm: PSALM_117_2
    - psalm: PSALM_117_3
  tierce:
    antiphon: J’ai désiré d’un grand désir manger cette Pâque avec vous, avant de souffrir. Alléluia.
    reading:
      biblicalReference: Sg 16, 20
      content: Tu as distribué, Seigneur, à ton peuple une nourriture d’anges, tu lui as procuré du ciel, sans effort de sa part, un pain tout préparé, ayant la capacité de toute saveur et adapté à tous les goûts.
    responsory: |-
      V/ J’avancerai jusqu’à l’autel de Dieu, alléluia,
      vers Dieu qui est toute ma joie, alléluia.
  sexte:
    antiphon: Pendant le repas, Jésus prit le pain, rendit grâce, le rompit et le donna à ses disciples, alléluia.
    reading:
      biblicalReference: Pr 9, 1-2
      content: La Sagesse a bâti sa maison, elle a sculpté sept colonnes, elle a tué ses bêtes, apprêté son vin et dressé sa table.
    responsory: |-
      V/ Tu envoyais du ciel un pain tout préparé, alléluia,
      un pain qui comblait tous les goûts, alléluia.
  none:
    antiphon: Ils ont reconnu le Seigneur, alléluia, à la fraction du pain, alléluia, alléluia.
    reading:
      biblicalReference: Ac 2, 42.47a
      content: Les frères étaient fidèles à écouter l’enseignement des Apôtres et à vivre en communion fraternelle, à rompre le pain et à participer aux prières. Ils louaient Dieu et trouvaient un bon accueil auprès de tout le peuple.
    responsory: |-
      V/ Reste avec nous, Seigneur, alléluia,
      le soir approche, alléluia.

vespers:
  hymn:
    - tous-les-chemins
  psalmody:
    - psalm: PSALM_109
      antiphon:
        - Prêtre à jamais selon l’ordre du roi Melkisédek, le Christ a offert le pain et le vin.
    - psalm: PSALM_115
      antiphon:
        - J’élèverai la coupe du salut, j’offrirai le sacrifice de louange.
    - psalm: NT_12
      antiphon:
        - Seigneur, tu es le Chemin, tu es la Vérité, tu es la Vie du monde.
  reading:
    biblicalReference: 1Co 11, 23-25
    content: |-
      Je vous ai transmis, moi, Paul, ce que j’ai reçu de la tradition qui vient du Seigneur : la nuit même où il était livré, le Seigneur Jésus prit du pain, puis, ayant rendu grâce, il le rompit, et dit : « Ceci est mon corps, donné pour vous. Faites cela en mémoire de moi ». Après le repas, il fit de même avec la coupe, en disant : « Cette coupe est la nouvelle Alliance établie par mon sang. Chaque fois que vous en boirez, faites cela en mémoire de moi. »
  responsory: |-
    R/ Vois notre faim, Sauveur du monde,
    * Partage-nous ta parole et ton pain.
    V/ Je suis le pain de la vie :
    qui vient à moi n’aura jamais faim,
    qui croit en moi n’aura jamais soif. *
    V/ Qui mange ma chair et boit mon sang a la vie éternelle,
    et moi, je le ressusciterai au dernier jour. R/
  evangelicAntiphon:
    common:
      - |-
        Banquet très saint où le Christ est reçu en nourriture : le mémorial de sa passion est célébré, notre âme est remplie de sa grâce, et la gloire à venir nous est déjà donnée, alléluia.
  intercession:
    content: |-
      Prions dans la joie le Seigneur Jésus Christ, Pain de notre vie :

      R/ Béni sois-tu, Seigneur, pour ton corps et ton sang !

      Ô Christ, tu nous as dit de rendre grâce en mémoire de toi :
      — garde-nous fidèles à célébrer ce mystère.

      Prêtre unique du Dieu Très-Haut,
      — donne aux serviteurs de l’eucharistie d’imiter dans leur vie ce qu’ils célèbrent.

      Tu rassembles en un seul corps ceux qui participent au même pain :
      — préserve l’unité des croyants.

      Tu es le pain envoyé par le Père pour notre guérison :
      — rends la santé aux corps et aux âmes.

      Tu nous as confié l’eucharistie pour annoncer ta mort et ta résurrection :
      — donne la vie éternelle à ceux qui attendent ton retour.

mass:
- massType: DAY_MASS
  note: null
  entranceAntiphon:
  - biblicalReference: cf. Ps 80,17
    content: |-
      Le Seigneur a nourri son peuple de la fleur du froment,
      il l’a rassasié avec le miel du rocher.
  collect:
  - |-
    Seigneur Dieu, +
    >dans cet admirable sacrement,
    >tu nous as laissé le mémorial de ta passion ; *
    donne-nous de vénérer avec une telle ferveur
    >les saints mystères de ton Corps et de ton Sang, /
    >que nous puissions goûter sans cesse en nous
    >le fruit de ta rédemption.
    Toi qui vis et règnes avec le Père dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  sequence:
  - lauda-sion
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Dt 8, 2-3.14b-16a
      cycle:
      - A
      headline: |-
        « Dieu t’a donné cette nourriture que ni toi ni tes pères n’aviez connue »
      content: |-
        Moïse disait au peuple d’Israël :
        « Souviens-toi de la longue marche que tu as faite
        pendant quarante années dans le désert ;
        le Seigneur ton Dieu te l’a imposée
        pour te faire passer par la pauvreté ;
        il voulait t’éprouver et savoir ce que tu as dans le cœur :
        allais-tu garder ses commandements, oui ou non ?
        Il t’a fait passer par la pauvreté, il t’a fait sentir la faim,
        et il t’a donné à manger la manne
        – cette nourriture que ni toi ni tes pères n’aviez connue –
        pour que tu saches que l’homme
        ne vit pas seulement de pain,
        mais de tout ce qui vient de la bouche du Seigneur.
        N’oublie pas le Seigneur ton Dieu
        qui t’a fait sortir du pays d’Égypte,
        de la maison d’esclavage.
        C’est lui qui t’a fait traverser ce désert,
        vaste et terrifiant,
        pays des serpents brûlants et des scorpions,
        pays de la sécheresse et de la soif.
        C’est lui qui, pour toi, a fait jaillir l’eau
        de la roche la plus dure.
        C’est lui qui, dans le désert, t’a donné la manne
        – cette nourriture inconnue de tes pères. »
    - biblicalRef: Ex 24, 3-8
      cycle:
      - B
      headline: |-
        « Voici le sang de l’Alliance que le Seigneur a conclue avec vous »
      content: |-
        En ces jours-là,
        Moïse vint rapporter au peuple
        toutes les paroles du Seigneur et toutes ses ordonnances.
        Tout le peuple répondit d’une seule voix :
        « Toutes ces paroles que le Seigneur a dites,
        nous les mettrons en pratique. »
        Moïse écrivit toutes les paroles du Seigneur.
        Il se leva de bon matin et il bâtit un autel au pied de la montagne,
        et il dressa douze pierres pour les douze tribus d’Israël.
        Puis il chargea quelques jeunes garçons parmi les fils d’Israël
        d’offrir des holocaustes,
        et d’immoler au Seigneur des taureaux en sacrifice de paix.
        Moïse prit la moitié du sang et le mit dans des coupes ;
        puis il aspergea l’autel avec le reste du sang.
        Il prit le livre de l’Alliance et en fit la lecture au peuple.
        Celui-ci répondit :
        « Tout ce que le Seigneur a dit,
        nous le mettrons en pratique, nous y obéirons. »
        Moïse prit le sang, en aspergea le peuple, et dit :
        « Voici le sang de l’Alliance
        que, sur la base de toutes ces paroles,
        le Seigneur a conclue avec vous. »
    - biblicalRef: Gn 14, 18-20
      cycle:
      - C
      headline: |-
        Melkisédek offre le pain et le vin
      content: |-
        En ces jours-là,
        Melkisédek, roi de Salem,
        fit apporter du pain et du vin :
        il était prêtre du Dieu très-haut.
        Il bénit Abram en disant :
        « Béni soit Abram par le Dieu très-haut,
        qui a fait le ciel et la terre ;
        et béni soit le Dieu très-haut,
        qui a livré tes ennemis entre tes mains. »
        Et Abram lui donna le dixième de tout ce qu’il avait pris.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 147 (147 B), 12-13, 14-15, 19-20
      refAbbr: 147, 12…
      cycle:
      - A
      chorus:
      - chorusRef: 147, 12a
        content: |-
          Glorifie le Seigneur, Jérusalem !
      content: |-
        Glorifie le Seigneur, Jérusalem !
        Célèbre ton Dieu, ô Sion !
        Il a consolidé les barres de tes portes,
        dans tes murs il a béni tes enfants.

        Il fait régner la paix à tes frontières,
        et d’un pain de froment te rassasie.
        Il envoie sa parole sur la terre :
        rapide, son verbe la parcourt.

        Il révèle sa parole à Jacob,
        ses volontés et ses lois à Israël.
        Pas un peuple qu’il ait ainsi traité ;
        nul autre n’a connu ses volontés.
    - biblicalRef: Ps 115 (116b), 12-13, 15-16ac, 17-18
      refAbbr: 115, 12…
      cycle:
      - B
      chorus:
      - chorusRef: 115, 13
        content: |-
          J’élèverai la coupe du salut,
          j’invoquerai le nom du Seigneur.
      - chorusRef: null
        content: Alléluia !
      content: |-
        Comment rendrai-je au Seigneur
        tout le bien qu’il m’a fait ?
        J’élèverai la coupe du salut,
        j’invoquerai le nom du Seigneur.

        Il en coûte au Seigneur
        de voir mourir les siens !
        Ne suis-je pas, Seigneur, ton serviteur,
        moi, dont tu brisas les chaînes ?

        Je t’offrirai le sacrifice d’action de grâce,
        j’invoquerai le nom du Seigneur.
        Je tiendrai mes promesses au Seigneur,
        oui, devant tout son peuple.
    - biblicalRef: Ps 109 (110), 1, 2, 3, 4
      refAbbr: 109, 1…
      cycle:
      - C
      chorus:
      - chorusRef: cf. 109, 4
        content: |-
          Tu es prêtre à jamais,
          selon l’ordre de Melkisédek.
      content: |-
        Oracle du Seigneur à mon seigneur :
        « Siège à ma droite,
        et je ferai de tes ennemis
        le marchepied de ton trône. »

        De Sion, le Seigneur te présente
        le sceptre de ta force :
        « Domine jusqu’au cœur de l’ennemi. »

        Le jour où paraît ta puissance,
        tu es prince, éblouissant de sainteté :
        « Comme la rosée qui naît de l’aurore,
        je t’ai engendré. »

        Le Seigneur l’a juré
        dans un serment irrévocable :
        « Tu es prêtre à jamais
        selon l’ordre du roi Melkisédek. »
  - partType: READING_2
    partContents:
    - biblicalRef: 1Co 10, 16-17
      cycle:
      - A
      headline: |-
        « Puisqu’il y a un seul pain, la multitude que nous sommes est un seul corps »
      content: |-
        Frères,
        la coupe de bénédiction que nous bénissons,
        n’est-elle pas communion au sang du Christ ?
        Le pain que nous rompons,
        n’est-il pas communion au corps du Christ ?
        Puisqu’il y a un seul pain,
        la multitude que nous sommes est un seul corps,
        car nous avons tous part à un seul pain.
    - biblicalRef: He 9, 11-15
      cycle:
      - B
      headline: |-
        « Le sang du Christ purifiera notre conscience »
      content: |-
        Frères,
        le Christ est venu, grand prêtre des biens à venir.
        Par la tente plus grande et plus parfaite,
        celle qui n’est pas œuvre de mains humaines
        et n’appartient pas à cette création,
        il est entré une fois pour toutes dans le sanctuaire,
        en répandant, non pas le sang de boucs et de jeunes taureaux,
        mais son propre sang.
        De cette manière, il a obtenu une libération définitive.
        S’il est vrai qu’une simple aspersion
        avec le sang de boucs et de taureaux, et de la cendre de génisse,
        sanctifie ceux qui sont souillés,
        leur rendant la pureté de la chair,
        le sang du Christ fait bien davantage,
        car le Christ, poussé par l’Esprit éternel,
        s’est offert lui-même à Dieu
        comme une victime sans défaut ;
        son sang purifiera donc notre conscience
        des actes qui mènent à la mort,
        pour que nous puissions rendre un culte au Dieu vivant.
        Voilà pourquoi il est le médiateur d’une alliance nouvelle,
        d’un testament nouveau :
        puisque sa mort a permis le rachat des transgressions
        commises sous le premier Testament,
        ceux qui sont appelés
        peuvent recevoir l’héritage éternel jadis promis.
    - biblicalRef: 1Co 11, 23-26
      cycle:
      - C
      headline: |-
        « Chaque fois que vous mangez ce pain et buvez cette coupe, vous proclamez la mort du Seigneur »
      content: |-
        Frères,
        j’ai moi-même reçu ce qui vient du Seigneur,
        et je vous l’ai transmis :
        la nuit où il était livré,
        le Seigneur Jésus prit du pain,
        puis, ayant rendu grâce,
        il le rompit, et dit :
        « Ceci est mon corps, qui est pour vous.
        Faites cela en mémoire de moi. »
        Après le repas, il fit de même avec la coupe,
        en disant :
        « Cette coupe est la nouvelle Alliance en mon sang.
        Chaque fois que vous en boirez,
        faites cela en mémoire de moi. »
        Ainsi donc, chaque fois que vous mangez ce pain
        et que vous buvez cette coupe,
        vous proclamez la mort du Seigneur,
        jusqu’à ce qu’il vienne.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 6, 51-58
      cycle:
      - A
      headline: |-
        « Ma chair est la vraie nourriture, et mon sang est la vraie boisson »
      acclamationAntiphon: |-
        Moi, je suis le pain vivant, qui est descendu du ciel,
        dit le Seigneur ;
        si quelqu’un mange de ce pain,
        il vivra éternellement.
      content: |-
        En ce temps-là,
        Jésus disait aux foules des Juifs :
        « Moi, je suis le pain vivant,
        qui est descendu du ciel :
        si quelqu’un mange de ce pain,
        il vivra éternellement.
        Le pain que je donnerai, c’est ma chair,
        donnée pour la vie du monde. »
        Les Juifs se querellaient entre eux :
        « Comment celui-là
        peut-il nous donner sa chair à manger ? »
        Jésus leur dit alors :
        « Amen, amen, je vous le dis :
        si vous ne mangez pas la chair du Fils de l’homme,
        et si vous ne buvez pas son sang,
        vous n’avez pas la vie en vous.
        Celui qui mange ma chair et boit mon sang
        a la vie éternelle ;
        et moi, je le ressusciterai au dernier jour.
        En effet, ma chair est la vraie nourriture,
        et mon sang est la vraie boisson.
        Celui qui mange ma chair et boit mon sang
        demeure en moi,
        et moi, je demeure en lui.
        De même que le Père, qui est vivant, m’a envoyé,
        et que moi je vis par le Père,
        de même celui qui me mange,
        lui aussi vivra par moi.
        Tel est le pain qui est descendu du ciel :
        il n’est pas comme celui que les pères ont mangé.
        Eux, ils sont morts ;
        celui qui mange ce pain
        vivra éternellement. »
    - biblicalRef: Mc 14, 12-16.22-26
      cycle:
      - B
      headline: |-
        « Ceci est mon corps, ceci est mon sang »
      acclamationAntiphon: |-
        Moi, je suis le pain vivant qui est descendu du ciel,
        dit le Seigneur ;
        si quelqu’un mange de ce pain, il vivra éternellement.
      content: |-
        Le premier jour de la fête des pains sans levain,
        où l’on immolait l’agneau pascal,
        les disciples de Jésus lui disent :
        « Où veux-tu que nous allions faire les préparatifs
        pour que tu manges la Pâque ? »
        Il envoie deux de ses disciples en leur disant :
        « Allez à la ville ;
        un homme portant une cruche d’eau
        viendra à votre rencontre.
        Suivez-le,
        et là où il entrera, dites au propriétaire :
        “Le Maître te fait dire :
        Où est la salle
        où je pourrai manger la Pâque avec mes disciples ?”
        Il vous indiquera, à l’étage,
        une grande pièce aménagée et prête pour un repas.
        Faites-y pour nous les préparatifs. »
        Les disciples partirent, allèrent à la ville ;
        ils trouvèrent tout comme Jésus leur avait dit,
        et ils préparèrent la Pâque.

        Pendant le repas,
        Jésus, ayant pris du pain
        et prononcé la bénédiction,
        le rompit, le leur donna,
        et dit :
        « Prenez, ceci est mon corps. »
        Puis, ayant pris une coupe
        et ayant rendu grâce,
        il la leur donna,
        et ils en burent tous.
        Et il leur dit :
        « Ceci est mon sang,
        le sang de l’Alliance,
        versé pour la multitude.
        Amen, je vous le dis :
        je ne boirai plus du fruit de la vigne,
        jusqu’au jour où je le boirai, nouveau,
        dans le royaume de Dieu. »

        Après avoir chanté les psaumes,
        ils partirent pour le mont des Oliviers.
    - biblicalRef: Lc 9, 11b-17
      cycle:
      - C
      headline: |-
        « Ils mangèrent et ils furent tous rassasiés »
      acclamationAntiphon: |-
        Moi, je suis le pain vivant qui est descendu du ciel, dit le Seigneur ;
        si quelqu’un mange de ce pain, il vivra éternellement.
      content: |-
        En ce temps-là,
        Jésus parlait aux foules du règne de Dieu,
        et guérissait ceux qui en avaient besoin.
        Le jour commençait à baisser.
        Alors les Douze s’approchèrent de lui et lui dirent :
        « Renvoie cette foule :
        qu’ils aillent dans les villages et les campagnes des environs
        afin d’y loger et de trouver des vivres ;
        ici nous sommes dans un endroit désert. »
        Mais il leur dit :
        « Donnez-leur vous-mêmes à manger. »
        Ils répondirent :
        « Nous n’avons pas plus de cinq pains et deux poissons.
        À moins peut-être d’aller nous-mêmes acheter de la nourriture
        pour tout ce peuple. »
        Il y avait environ cinq mille hommes.
        Jésus dit à ses disciples :
        « Faites-les asseoir par groupes de cinquante environ. »
        Ils exécutèrent cette demande
        et firent asseoir tout le monde.
        Jésus prit les cinq pains et les deux poissons,
        et, levant les yeux au ciel,
        il prononça la bénédiction sur eux,
        les rompit
        et les donna à ses disciples
        pour qu’ils les distribuent à la foule.
        Ils mangèrent et ils furent tous rassasiés ;
        puis on ramassa les morceaux qui leur restaient :
        cela faisait douze paniers.
