celebration:
  title: Saint Cyrille, moine et saint Méthode, évêque
  description: Les deux frères Constantin et Méthode furent envoyés en Moravie par le patriarche de Constantinople pour y annoncer le Christ. En 868, ils allèrent à Rome faire le point de leurs travaux avec le pape. Constantin y mourut sous le nom monastique de Cyrille (869). Quant à Méthode, ordonné archevêque de Sirmium, il repartit évangéliser les Slaves († 885). Ils ont été déclarés patrons de l’Europe par le pape saint Jean-Paul II le 31 décembre 1980.
  commons:
  - pastors_multiple
  color: white

oration:
- |-
  Dieu qui as conduit les peuples slaves à la lumière, grâce aux deux frères saints Cyrille et Méthode, ouvre nos cœurs à l’intelligence de ta Parole : fais de nous un peuple de croyants, et que notre unité rende témoignage à l’Évangile.

readings:
  patristicReading:
  - title: VIE SLAVONNE DE CONSTANTIN
    subtitle:
    content: |-
      Constantin, qui allait prendre le nom de Cyrille, accablé par ses travaux, tomba malade ; et comme sa maladie se prolongeait, il eut un jour une vision de Dieu et il se mit à chanter : %Quand on m’a dit : Nous entrerons dans la maison du Seigneur, mon esprit s’est réjoui et mon cœur a exulté.%
      Lorsqu’on l’eut revêtu des ornements sacrés, il demeura ainsi toute la journée ; il était plein de joie et disait : « Désormais, je ne suis plus le serviteur de l’empereur, ni d’aucun homme sur terre, mais seulement du Dieu tout-puissant. Je n’existais pas, puis j’ai existé, et je serai éternellement. Amen. » Le lendemain, il revêtit le saint habit monastique et, ajoutant la lumière à la lumière, il s’attribua le nom de Cyrille (qui appartient au Seigneur). Il vécut cinquante jours sous cet habit.
      Comme l’heure approchait où il devait entrer dans son repos et partir pour les demeures éternelles, il priait, les mains élevées vers Dieu, et il disait en pleurant : « Seigneur mon Dieu, qui as créé toute la hiérarchie des anges et les armées des esprits invisibles, qui as déployé le ciel et fondé solidement la terre, qui as amené tout ce qui existe de la non-existence à l’existence ; toi qui exauces toujours ceux qui font ta volonté, te vénèrent et observent tes commandements, exauce ma prière et garde ce troupeau fidèle qui t’appartient, auquel tu as donné pour chef le serviteur incapable que je suis.
      « Délivre-les de la méchanceté impie et païenne de ceux qui te blasphèment ; développe ton Église en nombre, et rassemble tous ses membres dans l’unité. Fais-en un peuple choisi, unanime dans la vraie foi et la doctrine authentique ; mets dans leur cœur la parole de ton enseignement ; c’est par ta grâce, en effet, que tu nous as chargés de prêcher l’Évangile de ton Christ, en nous incitant à pratiquer les bonnes œuvres et tout ce qui t’est agréable. Ceux que tu m’as donnés, je te les rends comme t’appartenant ; dirige-les par la force de ta main droite et couvre-les de tes ailes, afin que tous louent et glorifient ton nom, celui du Père, et du Fils, et du Saint-Esprit. Amen. »
      Après avoir donné à tous le baiser de paix, il dit : « Béni soit Dieu, qui ne nous a pas livrés à la morsure de nos adversaires invisibles, mais qui a brisé leur piège et nous a ainsi délivrés de la mort. » Alors il s’endormit dans le Seigneur, âgé de quarante-deux ans.
      Le Pape ordonna que tous les Grecs présents à Rome se joindraient aux Romains, en tenant des cierges pour chanter à ses obsèques, qu’ils célébreraient comme pour le Pape lui-même. Et c’est ce que l’on fit.
    responsory: |-
      R/ Un seul troupeau, un seul berger !

      Le Seigneur va rassembler ses enfants dispersés,
      il en fera une seule nation,
      et un seul roi régnera sur eux.

      Le Christ, notre paix, a détruit les séparations :
      en un seul corps,
      il nous rassemble par la croix.

morning:
  evangelicAntiphon:
    common:
    - Ils ont servi le Seigneur toute leur vie, dans la justice et la sainteté.

vespers:
  evangelicAntiphon:
    common:
    - Dieu les appelle ses amis, car ils ont témoigné pour sa vérité.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Fêtons les amis de Dieu, saint Cyrille et saint Méthode :
      >la gloire des deux frères fut de proclamer
      >la vérité reçue du Seigneur.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as conduit les peuples slaves à la lumière,
    >grâce aux deux frères saints Cyrille et Méthode ; *
    ouvre nos cœurs à l’intelligence de ta Parole :
    fais de nous un peuple uni dans la vraie foi /
    et dans un témoignage authentique.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 13, 46-49
      headline: « Nous nous tournons vers les nations païennes »
      content: |-
        En ces jours-là, à Antioche de Pisidie,
        Paul et Barnabé déclarèrent aux Juifs avec assurance :
        >« C’est à vous d’abord
        >qu’il était nécessaire d’adresser la parole de Dieu.
        Puisque vous la rejetez
        >et que vous-mêmes ne vous jugez pas dignes de la vie éternelle,
        >eh bien ! nous nous tournons vers les nations païennes.
        C’est le commandement que le Seigneur nous a donné :
        >J’ai fait de toi la lumière des nations
        >pour que, grâce à toi,
        >le salut parvienne jusqu’aux extrémités de la terre. »
        En entendant cela, les païens étaient dans la joie
        >et rendaient gloire à la parole du Seigneur ;
        tous ceux qui étaient destinés à la vie éternelle
        >devinrent croyants.
        Ainsi la parole du Seigneur se répandait dans toute la région.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 116 (117), 1, 2
      refAbbr: Mc 16, 15
      chorus:
      - chorusRef: Mc 16, 15
        chorus: |-
          Allez dans le monde entier.
          Proclamez l’Évangile.
          ou : Alléluia !
      content: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !

        Son amour envers nous s’est montré le plus fort ;
        éternelle est la fidélité du Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 1-9
      headline: « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Le Seigneur m’a envoyé
        porter la Bonne Nouvelle aux pauvres,
        annoncer aux captifs leur libération.
      content: |-
        En ce temps-là,
        parmi les disciples,
        le Seigneur en désigna encore 72,
        et il les envoya deux par deux, en avant de lui,
        en toute ville et localité où lui-même allait se rendre.
        Il leur dit :
        « La moisson est abondante,
        mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        d’envoyer des ouvriers pour sa moisson.
        Allez ! Voici que je vous envoie
        comme des agneaux au milieu des loups.
        Ne portez ni bourse, ni sac, ni sandales,
        et ne saluez personne en chemin.
        Mais dans toute maison où vous entrerez,
        dites d’abord :
        "Paix à cette maison."
        S’il y a là un ami de la paix,
        votre paix ira reposer sur lui ;
        sinon, elle reviendra sur vous.
        Restez dans cette maison,
        mangeant et buvant ce que l’on vous sert ;
        car l’ouvrier mérite son salaire.
        Ne passez pas de maison en maison.
        Dans toute ville où vous entrerez
        et où vous serez accueillis,
        mangez ce qui vous est présenté.
        Guérissez les malades qui s’y trouvent
        et dites-leur :
        "Le règne de Dieu s’est approché de vous." »
        
  offeringPrayer:
  - |-
    Regarde les offrandes que nous te présentons
    >Seigneur, Dieu de majesté,
    >en mémoire des saints Cyrille et Méthode : *
    fais qu’elles deviennent le signe de l’humanité nouvelle /
    >réconciliée avec toi dans la perfection de l’amour.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Mt 16,20
    content: |-
      Les disciples s’en allèrent proclamer partout l’Évangile.
      Le Seigneur travaillait avec eux et confirmait leur parole
      >par les signes qui l’accompagnaient.
  prayerAfterCommunion:
  - |-
    Dieu, Père de toutes les nations, +
    >tu nous donnes d’avoir part
    >à un seul Pain et à un seul Esprit,
    >et tu fais de nous les héritiers du banquet éternel ; *
    en cette fête des saints Cyrille et Méthode,
    accorde en ta bonté à la multitude de tes enfants
    >de persévérer dans la même foi /
    et de construire ensemble
    >un règne de justice et de paix.
    Par le Christ, notre Seigneur.