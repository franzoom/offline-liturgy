celebration:
  title: Saint Cyrille d’Alexandrie
  subtitle: évêque et docteur de l’Église
  description: Le nom de Cyrille, évêque d’Alexandrie (370‑444), est attaché avant tout au concile d’Éphèse, où il fit condamner Nestorius qui refusait à Marie le titre de Mère de Dieu (431). Cyrille n’était pas un homme facile, mais pour la postérité il demeure « L’invincible défenseur » et le chantre plein de Lyrisme de la maternité divine de Marie.
  commons:
    - pastors_bishop
    - pastors_doctors
  color: white

oration:
  - |-
    Tu as voulu, Seigneur, que la maternité divine de la Vierge trouve en l’évêque saint Cyrille d’Alexandrie un invincible défenseur ; puisque nous croyons qu’elle est vraiment Mère de Dieu, fais que nous soyons sauvés par l’incarnation de ton Fils, Jésus Christ. Lui qui règne.

readings:
  patristicReading:
    - title: LETTRE DE SAINT CYRILLE À TOUS LES MOINES D’ÉGYPTE AVANT LE CONCILE D’ÉPHÈSE (431)
      subtitle: 
      content: |-
        Je trouve très surprenant qu’il y ait des gens pour se demander vraiment si la Sainte Vierge doit être appelée Mère de Dieu. Car si notre Seigneur Jésus est Dieu, comment la Vierge qui l’a engendré ne serait-elle pas la Mère de Dieu ? Telle est la foi que nous ont transmise les saints Apôtres, même s’ils n’ont pas employé cette expression. C’est l’enseignement que nous avons reçu des saints Pères, en particulier notre Père de glorieuse mémoire, Athanase. ~ Au troisième livre de l’ouvrage qu’il a composé sur la Trinité sainte et consubstantielle, il donne constamment à la Sainte Vierge le titre de Mère de Dieu.
        Je dois citer ses propres paroles. Les voici : « La sainte Écriture, nous l’avons fait remarquer bien souvent, se caractérise principalement en ceci, qu’elle présente, au sujet du Sauveur, une double affirmation : d’une part qu’il est le Dieu éternel, le Fils, le Verbe, le Resplendissement et la Sagesse du Père ; d’autre part que dans les derniers temps, pour notre salut, il a pris chair de la Vierge Marie, Mère de Dieu, et s’est fait homme. »
        Et il ajoute un peu plus loin : « Il y a eu beaucoup de saints et des hommes purs de tout péché : Jérémie a été sanctifié dès le sein maternel ; Jean Baptiste, encore dans le sein de sa mère, a tressailli d’allégresse à la voix de Marie, la Mère de Dieu. » Voilà ce que dit cet homme considérable, si digne d’inspirer confiance, car jamais il n’aurait rien dit qui ne fût conforme à la parole de Dieu. ~
        D’ailleurs, l’Écriture divinement inspirée déclare que le Verbe de Dieu s’est fait chair, c’est-à-dire s’est uni à une chair douée d’une âme raisonnable. ~ Le Verbe de Dieu a donc assumé la descendance d’Abraham et, en tirant de la femme son propre corps, s’est uni à la chair et au sang de telle sorte qu’il n’est plus seulement Dieu, mais on comprend que par cette union il est devenu homme comme nous.
        On doit donc confesser que l’Emmanuel est constitué de deux éléments : la divinité et l’humanité. Cependant, il y a un seul Seigneur, Jésus Christ, un seul vrai Fils, qui est tout ensemble Dieu et homme ; non pas un homme divinisé, comme ceux qui le sont par la grâce, mais vrai Dieu qui s’est manifesté dans la forme humaine pour notre salut. C’est ce que nous affirme à ce sujet le bienheureux Paul : %Lorsque les temps furent accomplis, Dieu a envoyé son Fils ; il est né d’une femme, il a été sujet de la Loi juive pour racheter ceux qui étaient sujets de la Loi et pour faire de nous des fils adoptifs%.

      responsory: |-
        R/ Réjouis-toi, Marie,
        tu donneras le Sauveur au monde !
        
        Il sera grand,
        on l’appellera Fils du Très-Haut !
        
        Il vient chercher
        ce qui était perdu.
        
        Il rassemblera
        les enfants de Dieu dispersés.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as fait du bienheureux évêque Cyrille d’Alexandrie
    >l’invincible défenseur de la maternité divine
    >de la bienheureuse Vierge Marie ; *
    puisque nous croyons qu’elle est vraiment la Mère de Dieu,
    >accorde-nous d’être sauvés /
    >par l’incarnation de ton Fils, Jésus Christ.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 2Tm 4, 1-5
      headline: « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        je t’en conjure,
        au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        intervient à temps et à contretemps,
        dénonce le mal,
        fais des reproches, encourage,
        toujours avec patience et souci d’instruire.
        Un temps viendra
        où les gens ne supporteront plus l’enseignement de la saine doctrine ;
        mais, au gré de leurs caprices,
        ils iront se chercher une foule de maîtres
        pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        supporte la souffrance,
        fais ton travail d’évangélisateur,
        accomplis jusqu’au bout ton ministère.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 88 (89), 2-3, 4-5, 21-22, 25.27
      refAbbr: cf. 88, 2a
      chorus:
      - chorusRef: cf. 88, 2a
        chorus: |-
          Ton amour, Seigneur,
          sans fin je le chante !
      content: |-
        L’amour du Seigneur, sans fin je le chante ;
        ta fidélité, je l’annonce d’âge en âge.
        Je le dis : C’est un amour bâti pour toujours ;
        ta fidélité est plus stable que les cieux.

        « Avec mon élu, j’ai fait une alliance,
        j’ai juré à David, mon serviteur :
        j’établirai ta dynastie pour toujours,
        je te bâtis un trône pour la suite des âges.

        « J’ai trouvé David, mon serviteur,
        je l’ai sacré avec mon huile sainte ;
        et ma main sera pour toujours avec lui,
        mon bras fortifiera son courage.

        « Mon amour et ma fidélité sont avec lui,
        mon nom accroît sa vigueur ;
        il me dira : "Tu es mon Père,
        mon Dieu, mon roc et mon salut !" »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 13-19
      headline: « Vous êtes la lumière du monde »
      acclamationAntiphon: |-
        Que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Vous êtes le sel de la terre.
        Mais si le sel devient fade,
        comment lui rendre de la saveur ?
        Il ne vaut plus rien :
        on le jette dehors et il est piétiné par les gens.
        Vous êtes la lumière du monde.
        Une ville située sur une montagne
        ne peut être cachée.
        Et l’on n’allume pas une lampe
        pour la mettre sous le boisseau ;
        on la met sur le lampadaire,
        et elle brille pour tous ceux qui sont dans la maison.
        De même, que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père qui est aux cieux.
        Ne pensez pas que je sois venu abolir la Loi ou les Prophètes :
        je ne suis pas venu abolir, mais accomplir.
        Amen, je vous le dis :
        Avant que le ciel et la terre disparaissent,
        pas un seul iota, pas un seul trait ne disparaîtra de la Loi
        jusqu’à ce que tout se réalise.
        Donc, celui qui rejettera un seul de ces plus petits commandements,
        et qui enseignera aux hommes à faire ainsi,
        sera déclaré le plus petit dans le royaume des Cieux.
        Mais celui qui les observera et les enseignera,
        celui-là sera déclaré grand dans le royaume des Cieux. »
        
