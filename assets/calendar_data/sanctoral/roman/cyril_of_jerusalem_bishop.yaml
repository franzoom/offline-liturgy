celebration:
  title: Saint Cyrille de Jérusalem
  subtitle: évêque et docteur de l’Église
  description: L’évêque Cyrille de Jérusalem († 386 ou 387) connut de multiples tribulations pour défendre la foi en la divinité du Christ. Il fut exilé à trois reprises. Il a laissé des Catéchèses baptismales, qui font connaître comment on préparait les adultes au baptême dans la seconde moitié du 4^ème siècle.
  commons:
  - pastors_bishop
  - saints_doctors
  - pastors_doctors
  color: white

oration:
- Seigneur, tu as permis que ton Église pénètre davantage les mystères du salut grâce à l’enseignement de saint Cyrille, évêque de Jérusalem; accorde-nous, par son intercession, de si bien connaître ton Fils que nous vivions plus intensément de sa vie.

readings:
  patristicReading:
  - title: CATÉCHÈSE PRÉBAPTISMALE DE SAINT CYRILLE
    content: |-
      %Cieux, réjouissez-vous, et que la terre exulte%, à cause de ceux qui vont être aspergés par l’hysope, purifiés par l’hysope mystique, grâce à celui qui, dans sa Passion, reçut à boire au moyen de l’hysope et d’un roseau. Que les puissances du ciel se réjouissent ; les âmes qui vont s’unir à l’Époux mystique, qu’elles se préparent. Car %une voix crie dans le désert: Préparez la route du Seigneur%.
      Obéissez donc, enfants de justice, à Jean qui vous exhorte ainsi: %Rendez droite la route du Seigneur%; enlevez tous les obstacles et les cailloux qui font trébucher, pour marcher droit à la vie éternelle. Par une foi sincère, purifiez le vase de votre âme pour y recevoir le Saint-Esprit. Commencez à laver vos tuniques par la pénitence; vous êtes appelés à la chambre nuptiale, il faut que vous y parveniez avec une pureté certaine.
      Car l’Époux appelle absolument tout le monde, parce que la grâce est généreuse; la voix sonore des hérauts rassemble tout le monde. Mais ensuite, c’est lui, l’Époux, qui fait le tri de ceux qui entrent dans la salle de ces noces qui symbolisent le baptême. Parmi ceux qui se sont inscrits pour le recevoir, que pas un seul n’ait le malheur de s’entendre dire maintenant: %Mon ami, comment es-tu entré ici sans avoir le vêtement de noces ?%
      Au contraire, que tous vous puissiez vous entendre dire : %Bien, serviteur bon et fidèle. Tu as été fidèle en peu de choses, je t’en confierai beaucoup. Entre dans la joie de ton maître.%
      Jusqu’à présent en effet, tu restais à la porte. Puissiez-vous dire tous: %Le Roi m’a introduit dans ses appartements. J’exulte de joie dans le Seigneur, il m’a revêtu des vous-vêtements du salut et de la tunique d’allégresse; comme à un jeune époux, il m’a remis le diadème; comme une jeune épouse, il m’a orné de joyaux%.
      Il faut que votre âme à tous n’ait ni tache ni ride, ni rien de semblable; je ne dis pas avant que vous ayez reçu la grâce: comment serait-ce possible, puisque vous êtes appelés au pardon des péchés? Mais il faut que votre conscience, quand elle sera dotée de la grâce, soit irréprochable pour collaborer avec la grâce.
      C’est là en vérité une grande chose, mes frères, et vous devez y accéder avec beaucoup d’attention. Chacun de vous va se tenir devant Dieu, en présence de l’innombrable armée des anges. L’Esprit Saint va marquer vos âmes de son empreinte et vous allez être enrôlés dans la milice du grand Roi.
      Préparez-vous donc, équipez-vous, en vous enveloppant non pas d’habits resplendissants mais, dans votre âme, d’une piété qui n’ait rien à se reprocher.
    responsory: |-
      R/ Heureux les invités aux noces de l’Agneau!

      Soyez dans la joie et l’allégresse :
      voici les noces de l’Agneau
      et son épouse s’est faite belle.

      Je te fiancerai à moi pour toujours,
      dans l’amour et dans la fidélité.
      Tu sauras que je suis le Seigneur.

morning:
  evangelicAntiphon:
    common:
    - Qui enseigne aux hommes la justice resplendira aux siècles des siècles comme les étoiles dans le ciel.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >par l’enseignement du bienheureux évêque Cyrille de Jérusalem,
    >tu as conduit ton Église d’une manière admirable
    >vers une intelligence plus profonde des mystères du salut ;*
    accorde-nous, par son intercession,
    >de si bien connaître ton Fils /
    >que nous vivions plus intensément de sa vie.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 1 Jn 5, 1-5
      headline: « Ce qui nous fait vaincre le monde, c’est notre foi »
      content: |-
        Bien-aimés,
        celui qui croit que Jésus est le Christ,
        >celui-là est né de Dieu ;
        celui qui aime le Père qui a engendré
        >aime aussi le Fils qui est né de lui.
        Voici comment nous reconnaissons
        >que nous aimons les enfants de Dieu :
        lorsque nous aimons Dieu
        >et que nous accomplissons ses commandements.
        Car tel est l’amour de Dieu :
        >garder ses commandements ;
        et ses commandements ne sont pas un fardeau,
        >puisque tout être qui est né de Dieu
        >est vainqueur du monde.
        Or la victoire remportée sur le monde,
        >c’est notre foi.
        Qui donc est vainqueur du monde ?
        N’est-ce pas celui qui croit
        >que Jésus est le Fils de Dieu ?
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 18B (19), 8, 9, 10, 11
      refAbbr: 18B, 10cd
      chorus:
      - chorusRef: 18B, 10cd
        chorus: |-
          Les décisions du Seigneur sont justes
          et vraiment équitables.
      - chorusRef: cf. Jn 6, 63c
        chorus: |-
          ou : Tes paroles, Seigneur, sont esprit
          et elles sont vie.
      content: |-
        La loi du Seigneur est parfaite,
        qui redonne vie ;
        la charte du Seigneur est sûre,
        qui rend sages les simples.

        Les préceptes du Seigneur sont droits,
        ils réjouissent le cœur ;
        le commandement du Seigneur est limpide,
        il clarifie le regard.

        La crainte qu’il inspire est pure,
        elle est là pour toujours ;
        les décisions du Seigneur sont justes
        et vraiment équitables :

        plus désirables que l’or,
        qu’une masse d’or fin,
        plus savoureuses que le miel
        qui coule des rayons.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 1-8
      headline: « Celui qui demeure en moi et en qui je demeure, celui-là porte beaucoup de fruit »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Moi, je suis la vraie vigne,
        et mon Père est le vigneron.
        Tout sarment qui est en moi,
        mais qui ne porte pas de fruit,
        mon Père l’enlève ;
        tout sarment qui porte du fruit,
        il le purifie en le taillant,
        pour qu’il en porte davantage.
        Mais vous, déjà vous voici purifiés
        grâce à la parole que je vous ai dite.
        Demeurez en moi, comme moi en vous.
        De même que le sarment
        ne peut pas porter de fruit par lui-même
        s’il ne demeure pas sur la vigne,
        de même vous non plus,
        si vous ne demeurez pas en moi.
        Moi, je suis la vigne,
        et vous, les sarments.
        Celui qui demeure en moi
        et en qui je demeure,
        celui-là porte beaucoup de fruit,
        car, en dehors de moi, vous ne pouvez rien faire.
        Si quelqu’un ne demeure pas en moi,
        il est, comme le sarment, jeté dehors,
        et il se dessèche.
        Les sarments secs, on les ramasse,
        on les jette au feu, et ils brûlent.
        Si vous demeurez en moi,
        et que mes paroles demeurent en vous,
        demandez tout ce que vous voulez,
        et cela se réalisera pour vous.
        Ce qui fait la gloire de mon Père,
        c’est que vous portiez beaucoup de fruit
        et que vous soyez pour moi des disciples. »
        Acclamons la Parole de Dieu.
