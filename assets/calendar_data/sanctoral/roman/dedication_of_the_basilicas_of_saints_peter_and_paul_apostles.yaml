celebration:
  title: Dédicace des basiliques de Saint Pierre et de Saint Paul
  description: Le corps de l’apôtre Pierre fut inhumé au Vatican près du cirque de Néron et celui de Paul sur la route d’Ostie. Au IV^ème siècle, l’empereur Constantin entreprit l’érection d’une vaste basilique sur la tombe de Pierre et il construisit un édifice plus modeste sur celle de Paul. On célèbre aujourd’hui leur dédicace par une mémoire des deux Apôtres.
  commons:
    - apostles
  color: white

oration:
  - Garde ton Église, Seigneur, sous la protection des Apôtres Pierre et Paul ; puisqu’elle reçut par eux la première annonce de l’Évangile, qu’elle en reçoive, jusqu’à la fin des temps, la grâce dont elle a besoin pour grandir.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT LÉON LE GRAND POUR LA FÊTE DES APÔTRES PIERRE ET PAUL
      content: |-
        %Aux yeux de Dieu, la mort de ses saints a beaucoup de prix%, et aucun genre de cruauté ne peut détruire la religion fondée par le mystère de la croix du Christ. L’Église n’est pas diminuée, mais agrandie par les persécutions. Et le champ du Seigneur se revêt sans cesse d’une moisson plus riche, lorsque les grains, qui tombent isolés, renaissent multipliés.
        Aussi, ces deux germes magnifiques de la semence divine (saint Pierre et saint Paul), quelle descendance ont-ils fait fructifier : des milliers de saints martyrs ! Rivalisant avec les triomphes des Apôtres, ils sont, dans notre ville, une foule empourprée qui rayonne au loin ; ils la couronnent d’un diadème unique, scintillant de pierreries sans nombre.
        Certes, mes bien-aimés, une telle protection, que Dieu a prévue pour nous donner un modèle de patience et pour fortifier notre foi, doit nous réjouir d’une façon générale lorsque l’on commémore tous les saints. Mais nous avons raison de nous glorifier avec plus d’allégresse d’avoir des pères aussi éminents : la grâce de Dieu leur a donné une place si élevée parmi tous les membres de l’Église qu’elle les a placés comme les deux yeux dans le corps dont le Christ est la tête.
        Lorsqu’il s’agit de leurs mérites et de leurs vertus, qui surpassent tout éloge, nous ne devons mettre entre eux aucune différence, aucune séparation ; car leur vocation les a rendus pareils, leur labeur les a rendus semblables, leur fin les a rendus égaux.
        Comme nous l’avons éprouvé nous-mêmes, et comme nos anciens l’ont montré, nous croyons avec confiance que nous serons toujours aidés par les prières de nos patrons particuliers pour obtenir la miséricorde de Dieu. Autant nos péchés personnels nous accablent, autant les mérites de ces Apôtres nous réconfortent.

      responsory: |-
        [rubric]Stance[/rubric]
        Tu révèles ta présence :
        devant son pur éclat
        notre vide nous saisit ;
        nous confessons notre péché.
        Mais toi, Dieu fort,
        tu apaises la crainte
        et nous envoies porter aux hommes
        la confiance des sauvés.

        R/ Sur ton ordre, Seigneur,
        nous dirons ta parole.

        Avance au large et ne crains pas ;
        je suis avec vous tous les jours
        jusqu’à la fin du monde.

        Je vous donne ma paix :
        comme mon Père m’a envoyé,
        moi aussi je vous envoie.

        Je vous baptiserai dans l’Esprit et le feu ;
        vous serez mes témoins
        jusqu’aux limites du monde.

        Dans le monde vous aurez à souffrir,
        mais gardez courage,
        j’ai vaincu le monde.

morning:
  evangelicAntiphon:
    common:
      - |-
        Bénis soient les Apôtres Pierre et Paul : ils nous ont transmis la Loi du Seigneur.

vespers:
  evangelicAntiphon:
    common:
      - Les corps des Apôtres reposent dans la paix ; leurs noms sont vivants pour les siècles.

mass:
- massType: DAY_MASS
  note: Si on célèbre cette mémoire, les deux lectures ci-dessous sont obligatoires.
  entranceAntiphon:
  - biblicalReference: cf. Ps 44,17-18
    content: |-
      Sur toute la terre tu feras d’eux des princes.
      On se souviendra de ton nom pour les âges des âges :
      >ainsi, les peuples te rendront grâce, toujours et à jamais !
  collect:
  - |-
    Garde ton Église, Seigneur,
    >sous la protection des apôtres Pierre et Paul ; *
    puisqu’ils l’ont initiée à la connaissance des réalités divines, /
    >qu’ils obtiennent pour elle, jusqu’à la fin des temps,
    >une grâce toujours plus abondante.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 28, 11-16.30-31
      headline: « Voici comment nous sommes arrivés à Rome »
      content: |-
        Après une escale de trois mois à Malte, avec Paul,
        nous avons repris la mer
        >à bord d’un navire d’Alexandrie,
        >portant comme emblème les Dioscures,
        >et qui avait passé l’hiver dans l’île.
        Nous avons abordé à Syracuse
        >et nous y sommes restés trois jours.
        Après avoir levé l’ancre, nous avons atteint Reggio.
        Le lendemain, est survenu un vent du sud,
        >et en deux jours nous sommes arrivés à Pouzzoles.
        Nous y avons trouvé des frères
        >qui nous ont invités à passer sept jours chez eux.
        Voici comment nous sommes arrivés à Rome.
        De la ville, les frères, qui avaient entendu parler de nous,
        >sont venus à notre rencontre
        >jusqu’au lieu-dit Forum-d’Appius et à celui des Trois-Tavernes.
        En les voyant, Paul a rendu grâce à Dieu
        >et repris courage.
        À notre arrivée à Rome, il a reçu l’autorisation
        >d’habiter en ville avec le soldat qui le gardait.
        Paul demeura deux années entières
        >dans le logement qu’il avait loué ;
        >il accueillait tous ceux qui venaient chez lui ;
        il annonçait le règne de Dieu
        >et il enseignait ce qui concerne le Seigneur Jésus Christ
        >avec une entière assurance et sans obstacle.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 97 (98), 1, 2-3ab, 3cd-4, 5-6
      refAbbr: 97, 2b
      chorus:
      - chorusRef: 97, 2b
        chorus: Le Seigneur a révélé sa justice aux nations.
      content: |-
        Chantez au Seigneur un chant nouveau,
        car il a fait des merveilles ;
        par son bras très saint, par sa main puissante,
        il s’est assuré la victoire.

        Le Seigneur a fait connaître sa victoire
        et révélé sa justice aux nations ;
        il s’est rappelé sa fidélité, son amour,
        en faveur de la maison d’Israël.

        La terre tout entière a vu
        la victoire de notre Dieu.
        Acclamez le Seigneur, terre entière,
        sonnez, chantez, jouez !

        Jouez pour le Seigneur sur la cithare,
        sur la cithare et tous les instruments ;
        au son de la trompette et du cor,
        acclamez votre roi, le Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 14, 22-33
      headline: « Ordonne-moi de venir vers toi sur les eaux »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi que les Apôtres glorifient,
        nous t’acclamons : tu es Seigneur !
      content: |-
        Aussitôt après avoir nourri la foule dans le désert,
        Jésus obligea les disciples à monter dans la barque
        >et à le précéder sur l’autre rive,
        >pendant qu’il renverrait les foules.
        Quand il les eut renvoyées,
        >il gravit la montagne, à l’écart, pour prier.
        Le soir venu, il était là, seul.
        La barque était déjà à une bonne distance de la terre,
        >elle était battue par les vagues,
        >car le vent était contraire.
        Vers la fin de la nuit, Jésus vint vers eux
        >en marchant sur la mer.
        En le voyant marcher sur la mer,
        >les disciples furent bouleversés.
        Ils dirent :
        >« C’est un fantôme. »
        Pris de peur, ils se mirent à crier.
        Mais aussitôt Jésus leur parla :
        >« Confiance ! c’est moi ; n’ayez plus peur ! »
        Pierre prit alors la parole :
        >« Seigneur, si c’est bien toi,
        >ordonne-moi de venir vers toi sur les eaux. »
        Jésus lui dit :
        >« Viens ! »
        Pierre descendit de la barque
        >et marcha sur les eaux pour aller vers Jésus.
        Mais, voyant la force du vent, il eut peur
        >et, comme il commençait à enfoncer, il cria :
        >« Seigneur, sauve-moi ! »
        Aussitôt, Jésus étendit la main, le saisit
        et lui dit :
        >« Homme de peu de foi,
        >pourquoi as-tu douté ? »
        Et quand ils furent montés dans la barque,
        >le vent tomba.
        Alors ceux qui étaient dans la barque
        >se prosternèrent devant lui, et ils lui dirent :
        >« Vraiment, tu es le Fils de Dieu ! »
        
  offeringPrayer:
  - |-
    En te présentant cette offrande, Seigneur,
    >nous, tes serviteurs, nous en appelons à ta bonté : *
    conserve intacte en nos cœurs
    >la vérité que nous avons reçue /
    >par le ministère des apôtres Pierre et Paul.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jn 6,69.70
    content: |-
      Seigneur, tu as les paroles de la vie éternelle,
      >et nous croyons que tu es le Christ, le Fils de Dieu.
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Seigneur : *
    >que ton peuple, réconforté par le pain du ciel,
    se réjouisse en la mémoire des apôtres Pierre et Paul /
    >que tu lui as donnés comme guides et protecteurs.
    Par le Christ, notre Seigneur.