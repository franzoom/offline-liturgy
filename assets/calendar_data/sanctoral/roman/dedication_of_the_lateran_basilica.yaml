celebration:
  title: Dédicace de la Basilique du Latran
  description : La basilique du Latran est la cathédrale du Pape. Érigée vers 320 par l’empereur Constantin, elle est la première en date et en dignité de toutes les églises d’Occident. La fête de sa dédicace nous rappelle que le ministère du Pape, successeur de Pierre, est de constituer pour le peuple de Dieu le principe et le fondement visible de son unité.
  commons:
    - dedicace
  color: white

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT CÉSAIRE D’ARLES POUR L’ANNIVERSAIRE D’UNE DÉDICACE
      content: |-
        Nous célébrons aujourd’hui dans l’allégresse, frères bien-aimés, l’anniversaire de cette église, avec la grâce du Christ. Mais c’est nous qui devons être le temple de Dieu, son temple véritable et vivant. Les peuples chrétiens ont bien raison de célébrer avec foi cette solennité de la Mère Église, car ils savent qu’ils sont renés spirituellement par elle. Si, par notre première naissance, nous étions pour Dieu des objets de colère, par la seconde naissance, nous sommes devenus les objets de sa miséricorde. La première naissance nous a engendrés à la mort, la seconde nous a rappelés à la vie.
        Tous, frères très chers avant le baptême, nous avons été des temples du diable ; après le baptême, nous sommes devenus des temples de Dieu ; et si nous réfléchissons attentivement au salut de notre âme, nous savons que nous sommes le temple véritable et vivant de Dieu. Dieu%n’habite pas%seulement%dans des temples faits de la main de l’homme%, ni dans une demeure de bois et de pierres, mais principalement dans l’âme créée à l’image de Dieu, par la main du Créateur lui-même. C’est ainsi que saint Paul a dit : %Le temple de Dieu est saint, et ce temple, c’est vous%.
        Et puisque le Christ est venu pour chasser le démon de nos cœurs, afin de se préparer un temple en nous, travaillons autant que nous le pouvons, avec son aide, à ce qu’il ne subisse pas en nous d’outrage, à cause de nos mauvaises actions. Car celui qui agit mal outrage le Christ. Comme je l’ai dit, avant que le Christ nous eût rachetés, nous étions la demeure du démon ; ensuite nous sommes devenus la demeure de Dieu : Dieu a daigné faire de nous sa demeure. Par conséquent, mes très chers, si nous voulons célébrer dans la joie l’anniversaire d’une église, nous ne devons pas détruire en nous, par de mauvaises actions, les temples vivants de Dieu. Et je dis cela pour que tous puissent comprendre : chaque fois que nous venons à l’église, nous devons préparer nos âmes pour qu’elles soient telles que nous voulons trouver cette église.
        Tu veux trouver une basilique brillante ? Ne souille pas ton âme par la saleté des péchés. Si tu veux que la basilique soit éclairée, et Dieu aussi le veut, que la lumière des bonnes œuvres brille en nous, et celui qui est aux cieux sera glorifié. De même que tu entres dans cette église, c’est ainsi que Dieu veut entrer dans ton âme, comme lui-même l’a dit : %J’habiterai et je marcherai au milieu d’eux%.
      responsory: |-
        J’ai vu l’eau vive
        jaillissant du cœur du Christ, alléluia !
        Tous ceux que lave cette eau
        seront sauvés et chanteront : Alléluia !

        R/ Alléluia, Alléluia, Alléluia !

        J’ai vu le Temple
        désormais s’ouvrir à tous, alléluia !
        Le Christ revient victorieux,
        montrant la plaie de son côté, alléluia !

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ap 21,2
    content: |-
      La Ville sainte, la Jérusalem nouvelle,
      >je l’ai vue qui descendait du ciel, d’auprès de Dieu,
      >prête pour les noces, comme une épouse parée pour son époux.
  - biblicalReference: cf. Ap 21,3
    content: |-
      Voici la demeure de Dieu avec les hommes ;
      >il demeurera avec eux,
      et ils seront son peuple,
      >et lui-même, Dieu avec eux, sera leur Dieu.
  collect:
  - |-
    Seigneur Dieu, +
    >tu bâtis la demeure éternelle de ta gloire
    >avec des pierres vivantes et choisies ; *
    répands sur ton Église
    >l’abondance de la grâce que tu lui as donné : /
    que le peuple de tes fidèles ne cesse de grandir
    >pour que s’édifie la Jérusalem céleste.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  - |-
    Seigneur Dieu, +
    >tu as voulu que l’ Église soit appelée ton épouse ; *
    >donne à l’assemblée réunie pour servir ton nom
    >de te rendre hommage, de t’aimer, de te suivre ; /
    qu’elle parvienne, sous ta conduite,
    >aux biens du ciel que tu promets.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ez 47, 1-2.8-9.12
      headline: « J’ai vu l’eau qui jaillissait du Temple, et tous ceux que cette eau atteignait étaient sauvés »
      content: |-
        En ces jours-là,
        au cours d’une vision reçue du Seigneur,
        l’homme me fit revenir à l’entrée de la Maison,
        et voici : sous le seuil de la Maison,
        de l’eau jaillissait vers l’orient,
        puisque la façade de la Maison était du côté de l’orient.
        L’eau descendait de dessous le côté droit de la Maison,
        au sud de l’autel.
        L’homme me fit sortir par la porte du nord
        et me fit faire le tour par l’extérieur,
        jusqu’à la porte qui fait face à l’orient,
        et là encore l’eau coulait du côté droit.
        Il me dit :
        « Cette eau coule vers la région de l’orient,
        elle descend dans la vallée du Jourdain,
        et se déverse dans la mer Morte,
        dont elle assainit les eaux.
        En tout lieu où parviendra le torrent,
        tous les animaux pourront vivre et foisonner.
        Le poisson sera très abondant,
        car cette eau assainit tout ce qu’elle pénètre,
        et la vie apparaît en tout lieu où arrive le torrent.
        Au bord du torrent, sur les deux rives,
        toutes sortes d’arbres fruitiers pousseront ;
        leur feuillage ne se flétrira pas
        et leurs fruits ne manqueront pas.
        Chaque mois ils porteront des fruits nouveaux,
        car cette eau vient du sanctuaire.
        Les fruits seront une nourriture,
        et les feuilles un remède. »
        
    - biblicalRef: 1 Co 3, 9c-11.16-17
      headline: « Vous êtes un sanctuaire de Dieu »
      content: |-
        Frères,
        vous êtes une maison que Dieu construit.
        Selon la grâce que Dieu m’a donnée,
        moi, comme un bon architecte,
        j’ai posé la pierre de fondation.
        Un autre construit dessus.
        Mais que chacun prenne garde
        à la façon dont il contribue à la construction.
        La pierre de fondation, personne ne peut en poser d’autre
        que celle qui s’y trouve : Jésus Christ.
        Ne savez-vous pas que vous êtes un sanctuaire de Dieu,
        et que l’Esprit de Dieu habite en vous ?
        Si quelqu’un détruit le sanctuaire de Dieu,
        cet homme, Dieu le détruira,
        car le sanctuaire de Dieu est saint,
        et ce sanctuaire, c’est vous.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 45 (46), 2-3, 5-6, 8-9a.10a
      refAbbr: 45, 5
      chorus:
      - chorusRef: 45, 5
        chorus: |-
          Le Fleuve, ses bras réjouissent la ville de Dieu,
          la plus sainte des demeures du Très-Haut.
      content: |-
        Dieu est pour nous refuge et force,
        secours dans la détresse, toujours offert.
        Nous serons sans crainte si la terre est secouée,
        si les montagnes s’effondrent au creux de la mer.

        Le Fleuve, ses bras réjouissent la ville de Dieu,
        la plus sainte des demeures du Très-Haut.
        Dieu s’y tient : elle est inébranlable ;
        quand renaît le matin, Dieu la secourt.

        Il est avec nous, le Seigneur de l’univers ;
        citadelle pour nous, le Dieu de Jacob !
        Venez et voyez les actes du Seigneur,
        il détruit la guerre jusqu’au bout du monde.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 2, 13-22
      headline: « Il parlait du sanctuaire de son corps »
      acclamationAntiphon: |-
        J’ai choisi et consacré cette Maison, dit le Seigneur,
        afin que mon Nom y soit à jamais.
      content: |-
        Comme la Pâque juive était proche,
        Jésus monta à Jérusalem.
        Dans le Temple, il trouva installés
        les marchands de bœufs, de brebis et de colombes,
        et les changeurs.
        Il fit un fouet avec des cordes,
        et les chassa tous du Temple,
        ainsi que les brebis et les bœufs ;
        il jeta par terre la monnaie des changeurs,
        renversa leurs comptoirs,
        et dit aux marchands de colombes :
        « Enlevez cela d’ici.
        Cessez de faire de la maison de mon Père
        une maison de commerce. »
        Ses disciples se rappelèrent qu’il est écrit :
        L’amour de ta maison fera mon tourment.
        Des Juifs l’interpellèrent :
        « Quel signe peux-tu nous donner
        pour agir ainsi ? »
        Jésus leur répondit :
        « Détruisez ce sanctuaire,
        et en trois jours je le relèverai. »
        Les Juifs lui répliquèrent :
        « Il a fallu quarante-six ans pour bâtir ce sanctuaire,
        et toi, en trois jours tu le relèverais ! »
        Mais lui parlait du sanctuaire de son corps.
        Aussi, quand il se réveilla d’entre les morts,
        ses disciples se rappelèrent qu’il avait dit cela ;
        ils crurent à l’Écriture
        et à la parole que Jésus avait dite.
        
  offeringPrayer:
  - |-
    Accueille, Seigneur, l’offrande que nous te présentons ; *
    >et donne à ceux qui te prient
    >d’être fortifiés par tes sacrements /
    >et de voir leurs demandes exaucées.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. 1P 2,5
    content: |-
      Comme pierres vivantes,
      entrez dans la construction de la demeure spirituelle,
      >pour devenir le sacerdoce saint.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >tu as voulu que ton Église de la terre
    >préfigure pour nous la Jérusalem d’en haut ; *
    nous t’en prions :
    >puisque nous avons participé à ce sacrement,
    >fais de nous le temple de ta grâce /
    >et accorde-nous d’entrer un jour dans la demeure de ta gloire.
    Par le Christ, notre Seigneur.