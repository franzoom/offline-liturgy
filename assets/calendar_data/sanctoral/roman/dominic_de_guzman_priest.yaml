celebration:
  title: Saint Dominique
  subtitle: prêtre
  description: |-
    Dominique (1170-1221), chanoine espagnol, rassembla d’abord quelques femmes à Prouille sous une règle de vie, puis il fonda à Toulouse l’Ordre des Prêcheurs pour lutter contre l’hérésie cathare. Il voulut que ses fils soient des mendiants et que leur enseignement se nourrisse de contemplation. Il établit le centre de son Ordre à Rome avant de mourir à Bologne.
  color: white
  commons:
    - pastors
    - saints-male_religious
readings:
  patristicReading:
    - title: D’APRÈS LES ACTES DE CANONISATION DE SAINT DOMINIQUE (1234)
      content: |-
        Dominique avait une telle intégrité morale, il était emporté par un tel élan de ferveur qu’on découvrait en lui de façon évidente un chef-d’œuvre de noblesse et de grâce. Il régnait en lui une parfaite égalité d’esprit, sauf quand il était bouleversé de compassion et de miséricorde. Et puisque le cœur en joie se reflète dans la gaieté du visage, il manifestait au-dehors l’équilibre paisible de sa vie intérieure par l’amabilité et la sérénité de ses traits.
        En toute circonstance, par ses paroles et sa conduite, il se montrait un homme évangélique. Pendant la journée, avec ses frères ou ses compagnons, personne n’était plus simple et plus joyeux. Pendant la nuit, personne n’était plus adonné à toutes sortes de veilles et de prières. Il ne parlait guère qu’avec Dieu, dans l’oraison, ou de Dieu, et il exhortait ses frères à en faire autant.
        Il adressa fréquemment à Dieu cette demande particulière : qu’il daigne lui accorder une vraie charité, capable de rechercher et d’obtenir le salut des hommes ; il estimait qu’il serait véritablement un membre du Christ, s’il se dépensait avant tout, totalement et de toutes ses forces, à gagner des âmes, de même que le Seigneur Jésus, le Sauveur de tous, s’est offert sans réserve pour notre salut. Et c’est pour cette œuvre que, selon le profond dessein prémédité par la Providence, il institua l’Ordre des Frères Prêcheurs.
        Il exhortait souvent les frères de cet Ordre, de vive voix et par lettres, à étudier sans cesse le Nouveau et l’Ancien Testament. Il portait toujours sur lui l’évangile de saint Matthieu et les lettres de saint Paul, et il les étudiait tellement qu’il les savait à peu près par cœur.
        Il fut désigné deux ou trois fois pour l’épiscopat et il refusa toujours, préférant vivre dans la pauvreté avec ses frères, plutôt que d’avoir un évêché. Il garda intacte jusqu’à la fin la délicatesse d’une chasteté absolue. Il désirait être flagellé, coupé en morceaux, et mourir pour la foi du Christ. Le pape Grégoire IX a dit de lui : « Je l’ai connu comme un homme qui suivait parfaitement la règle des Apôtres, et je ne doute pas qu’il soit au ciel associé à leur gloire. »
      responsory: |-
        R/ Heureux l’homme qui met sa foi
        dans le Seigneur.

        Sois fort et tiens bon,
        que le livre de la Loi
        soit toujours sur tes lèvres !

        Sois sans crainte ni frayeur :
        le Seigneur ton Dieu
        est avec toi partout où tu iras !

        Vous tous, disciples du Seigneur,
        fortifiez-vous
        dans la grâce du Seigneur Jésus !
oration:
  - |-
    Permets, Seigneur, que ton Église trouve un secours dans les mérites et les enseignements de saint Dominique : qu’il intercède pour nous avec sa tendresse, après avoir été un prédicateur éminent de ta vérité.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Si 15,5 (Vg)
    content: |-
      Dans son Église, le Seigneur lui a donné la parole ;
      >il l’a rempli de l’esprit de sagesse et d’intelligence,
      >et l’a revêtu de gloire.
  collect:
  - |-
    Accorde à ton Église, Seigneur, de trouver un secours
    >dans les mérites et les enseignements de saint Dominique : *
    >que, dans sa bonté, il intercède pour nous, /
    >après avoir été un prédicateur éminent de ta vérité.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 1 Co 2, 1-10a
      headline: |-
        « Nous proclamons la sagesse du mystère de Dieu »
      content: |-
        Frères,
        quand je suis venu chez vous,
        je ne suis pas venu vous annoncer le mystère de Dieu
        >avec le prestige du langage ou de la sagesse.
        Parmi vous, je n’ai rien voulu connaître d’autre que Jésus Christ,
        >ce Messie crucifié.
        Et c’est dans la faiblesse, craintif et tout tremblant,
        >que je me suis présenté à vous.
        Mon langage, ma proclamation de l’Évangile,
        >n’avaient rien d’un langage de sagesse qui veut convaincre ;
        mais c’est l’Esprit et sa puissance qui se manifestaient,
        pour que votre foi repose, non pas sur la sagesse des hommes,
        >mais sur la puissance de Dieu.
        Pourtant, c’est bien de sagesse que nous parlons
        >devant ceux qui sont adultes dans la foi,
        mais ce n’est pas la sagesse de ce monde,
        >la sagesse de ceux qui dirigent ce monde
        >et qui vont à leur destruction.
        Au contraire, ce dont nous parlons,
        >c’est de la sagesse du mystère de Dieu,
        >sagesse tenue cachée, établie par lui dès avant les siècles,
        >pour nous donner la gloire.
        Aucun de ceux qui dirigent ce monde ne l’a connue,
        car, s’ils l’avaient connue,
        >ils n’auraient jamais crucifié le Seigneur de gloire.
        Mais ce que nous proclamons, c’est, comme dit l’Écriture :
        >ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu,
        >ce qui n’est pas venu à l’esprit de l’homme,
        >ce que Dieu a préparé pour ceux dont il est aimé.
        Et c’est à nous que Dieu, par l’Esprit, en a fait la révélation.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 57-62
      headline: |-
        « Je te suivrai partout où tu iras »
      acclamationAntiphon: |-
        Moi, je suis la lumière du monde, dit le Seigneur.
        Celui qui me suit aura la lumière de la vie.
      content: |-
        En ce temps-là,
        en cours de route, un homme dit à Jésus :
        >« Je te suivrai partout où tu iras. »
        Jésus lui déclara :
        >« Les renards ont des terriers,
        >les oiseaux du ciel ont des nids ;
        >mais le Fils de l’homme n’a pas d’endroit où reposer la tête. »
        Il dit à un autre :
        >« Suis-moi. »
        L’homme répondit :
        >« Seigneur, permets-moi d’aller d’abord enterrer mon père. »
        Mais Jésus répliqua :
        >« Laisse les morts enterrer leurs morts.
        Toi, pars, et annonce le règne de Dieu. »
        Un autre encore lui dit :
        >« Je te suivrai, Seigneur ;
        >mais laisse-moi d’abord faire mes adieux
        >aux gens de ma maison. »
        Jésus lui répondit :
        >« Quiconque met la main à la charrue,
        >puis regarde en arrière,
        >n’est pas fait pour le royaume de Dieu. »
  offeringPrayer:
  - |-
    Par l’intercession de saint Dominique, +
    >écoute avec bienveillance, Seigneur,
    >les prières que nous te présentons ; *
    et par la puissance de ce sacrifice,
    >soutiens ceux qui luttent pour la foi, /
    >en leur donnant la protection de ta grâce.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Lc 12,42
    content: |-
      Voici le serviteur fidèle et avisé
      >que le maître a établi sur sa maison,
      >pour donner à chacun, en temps voulu, sa part de blé.
  prayerAfterCommunion:
  - |-
    Seigneur, en ce jour où nous faisons mémoire
    >de saint Dominique,
    >tu nous as donné en nourriture le sacrement du ciel ; *
    fais que ton Église, ardente à te servir,
    >en reçoive toute la force, /
    et soit soutenue par la prière
    >de celui qui l’éclaira de sa prédication.
    Par le Christ, notre Seigneur.