celebration:
  title: Sainte Élisabeth du Portugal
  description: Elisabeth d’Aragon (1271-1336), épouse du roi Denis de Portugal, fut une épouse et une mère douloureuse. Bafouée par un mari jouisseur, elle perdit sa fille et son gendre, et elle vit son fils se révolter contre le roi. Au milieu de ses épreuves, elle priait, jeûnait, tentait de faire la paix. Devenue veuve, elle mourut sous l’habit du tiers-ordre franciscain.
  commons:
    - saints-female_caritative
  color: white

oration:
  - Seigneur, source de paix, ami de la charité, tu as donné à sainte Élisabeth de Portugal une grâce merveilleuse pour réconcilier les hommes désunis ; accorde-nous, par son intercession, de travailler au service de la paix et de pouvoir être appelés fils de Dieu.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT PIERRE CHRYSOLOGUE SUR LA PAIX
      content: |-
        %Heureux les artisans de paix%, dit l’Évangile, mes très chers frères, %ils seront appelés fils de Dieu% ! C’est à juste titre que les vertus chrétiennes se développent chez celui qui maintient la paix chrétienne entre tous ; et l’on n’obtient le titre de fils de Dieu que si l’on mérite le nom d’artisan de paix.
        La paix, mes très chers, est ce qui débarrasse l’homme de l’esclavage, fait de lui un homme libre, transforme sa condition personnelle aux yeux de Dieu, fait d’un serviteur un fils, d’un esclave un homme libre. La paix entre frères est ce que Dieu veut, ce qui réjouit le Christ, ce qui accomplit la sainteté, ce qui règle la justice, ce qui enseigne la doctrine, ce qui protège les mœurs, bref, c’est en toutes choses une conduite digne d’éloges. La paix fait exaucer nos prières, elle ouvre une route facile et praticable à nos supplications, elle accomplit parfaitement tous nos désirs. La paix est la mère de la charité, le lien de la concorde, le signe évident d’une âme pure, qui peut réclamer à Dieu tout ce qu’elle veut ; car elle demande tout ce qu’elle veut et elle reçoit tout ce qu’elle demande. La paix doit se conserver par l’obéissance aux commandements du Roi. Le Christ lui-même a dit : %C’est la paix que je vous laisse, c’est ma paix que je vous donne%. Ce qui revient à dire : Je vous ai quittés dans la paix, je vous retrouverai dans la paix ; en partant, il a voulu donner ce qu’il désirait trouver chez tous lorsqu’il reviendrait.
        C’est un commandement divin de conserver ce qu’il a donné : je ne veux pas autre chose que retrouver ce que je vous ai laissé en partant. Planter les racines de la paix, c’est l’œuvre de Dieu ; arracher entièrement la paix, c’est le travail de l’ennemi. Car, de même que l’amour fraternel vient de Dieu, ainsi la haine vient du démon ; c’est pourquoi il faut condamner la haine, car il est écrit : %Tout homme qui a de la haine contre son frère est un meurtrier%.
        Vous voyez, frères bien-aimés, pourquoi il faut aimer la paix et chérir la concorde : ce sont elles qui engendrent et nourrissent la charité. Vous savez que, selon l’Apôtre, %la charité vient de Dieu%. Il est donc séparé de Dieu, celui qui n’a pas la charité. ~
        Gardons les commandements, mes frères, car ils sont notre vie ; que la fraternité se maintienne unie par les nœuds d’une profonde paix, qu’elle se resserre par le lien salutaire d’un amour mutuel de charité, qui %couvre la multitude des péchés%. Il faut donc que tous nos désirs s’attachent à l’amour, car il peut obtenir tous les bienfaits et toutes les récompenses. Il faut garder la paix plus que toutes les autres vertus, parce que Dieu est toujours dans la paix. ~
        Aimez la paix, et tout sera dans le calme : afin que vous obteniez pour nous la récompense et pour vous la joie, afin que l’Église de Dieu, fondée sur l’unité de la paix, mène une vie parfaite dans le Christ.

      responsory: |-
        R/ Partager son pain avec l’affamé,
        voilà le jeûne qui plaît à Dieu.
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et si tu cries, le Seigneur répondra ;
        à tes appels, il dira : Me voici !
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et quand le Fils de l’homme viendra, il te dira :
        J’avais faim et tu m’as donné à manger.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu, source de la paix, toi qui aimes la charité, +
    >tu as donné à sainte Élisabeth de Portugal
    >une grâce merveilleuse pour réconcilier les adversaires ; *
    accorde-nous, par son intercession,
    >de travailler au service de la paix, /
    >et de pouvoir ainsi être appelés enfants de Dieu.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1Jn 3, 14-18
      headline: « Nous aussi, nous devons donner notre vie pour nos frères »
      content: |-
        Bien-aimés,
        nous savons que nous sommes passés de la mort à la vie,
        parce que nous aimons nos frères.
        Celui qui n’aime pas
        demeure dans la mort.
        Quiconque a de la haine contre son frère
        est un meurtrier,
        et vous savez que pas un meurtrier
        n’a la vie éternelle demeurant en lui.
        Voici comment nous avons reconnu l’amour :
        lui, Jésus, a donné sa vie pour nous.
        Nous aussi, nous devons donner notre vie pour nos frères.
        Celui qui a de quoi vivre en ce monde,
        s’il voit son frère dans le besoin
        sans faire preuve de compassion,
        comment l’amour de Dieu pourrait-il demeurer en lui ?
        Petits enfants,
        n’aimons pas en paroles ni par des discours,
        mais par des actes et en vérité.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: Heureux qui craint le Seigneur.
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira, et sa gloire !
  - partType: GOSPEL
    partContents:
    - number: 1
      biblicalRef: Mt 25, 31-46
      headline: « Chaque fois que vous l’avez fait à l’un de ces plus petits de mes frères, c’est à moi que vous l’avez fait »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Quand le Fils de l’homme viendra dans sa gloire,
        et tous les anges avec lui,
        alors il siégera sur son trône de gloire.
        Toutes les nations seront rassemblées devant lui ;
        il séparera les hommes les uns des autres,
        comme le berger sépare les brebis des boucs :
        il placera les brebis à sa droite, et les boucs à gauche.
        Alors le Roi dira à ceux qui seront à sa droite :
        "Venez, les bénis de mon Père,
        recevez en héritage le Royaume
        préparé pour vous depuis la fondation du monde.
        Car j’avais faim, et vous m’avez donné à manger ;
        j’avais soif, et vous m’avez donné à boire ;
        j’étais un étranger, et vous m’avez accueilli ;
        j’étais nu, et vous m’avez habillé ;
        j’étais malade, et vous m’avez visité ;
        j’étais en prison, et vous êtes venus jusqu’à moi !"
        Alors les justes lui répondront :
        "Seigneur, quand est-ce que nous t’avons vu :
        tu avais donc faim, et nous t’avons nourri ?
        tu avais soif, et nous t’avons donné à boire ?
        tu étais un étranger, et nous t’avons accueilli ?
        tu étais nu, et nous t’avons habillé ?
        tu étais malade ou en prison...
        Quand sommes-nous venus jusqu’à toi ?"
        Et le Roi leur répondra :
        "Amen, je vous le dis :
        chaque fois que vous l’avez fait
        à l’un de ces plus petits de mes frères,
        c’est à moi que vous l’avez fait."
        Alors il dira à ceux qui seront à sa gauche :
        "Allez-vous-en loin de moi, vous les maudits,
        dans le feu éternel préparé pour le diable et ses anges.
        Car j’avais faim, et vous ne m’avez pas donné à manger ;
        j’avais soif, et vous ne m’avez pas donné à boire ;
        j’étais un étranger, et vous ne m’avez pas accueilli ;
        j’étais nu, et vous ne m’avez pas habillé ;
        j’étais malade et en prison, et vous ne m’avez pas visité."
        Alors ils répondront, eux aussi :
        "Seigneur, quand t’avons-nous vu
        avoir faim, avoir soif, être nu, étranger, malade ou en prison,
        sans nous mettre à ton service ?"
        Il leur répondra :
        "Amen, je vous le dis :
        chaque fois que vous ne l’avez pas fait
        à l’un de ces plus petits,
        c’est à moi que vous ne l’avez pas fait."
        Et ils s’en iront, ceux-ci au châtiment éternel,
        et les justes, à la vie éternelle. »
        
