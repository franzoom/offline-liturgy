celebration:
  title: Saint Fabien
  subtitle: pape et martyr
  description: Le pape Fabien gouverna l’Église romaine durant quatorze années (236 250), qui furent des années de paix, d’organisation et d’essor missionnaire. Lorsque éclata la persécution de Dèce, il fut l’une de ses premières victimes.
  commons:
    - martyrs
    - pastors_pope
  color: red

oration:
  - |-
    Seigneur, tu es la gloire de ceux qui tu as choisis pour ton service : permets qu’à la prière de saint Fabien, pape et martyr, nous progressions toujours dans la communion de la foi et le souci de mieux te servir.

readings:
  patristicReading:
    - title: CORRESPONDANCE DE SAINT CYPRIEN ET DE L’ÉGLISE ROMAINE SUR LE MARTYRE DU PAPE SAINT FABIEN
      subtitle: 
      content: |-
        %Lorsque saint Cyprien fut informé de la mort du pape Fabien, il envoya la lettre suivante aux prêtres et aux diacres de Rome : %
        La mort de mon excellent collègue nous avait été annoncée par une vague rumeur, frères très chers, et l’on demeurait dans l’incertitude. J’ai alors reçu de vous les lettres que vous m’avez envoyées par le sous-diacre Crémentius et j’ai été très exactement informé de sa fin glorieuse. J’ai eu beaucoup de joie de ce que son administration irréprochable ait eu en outre un aussi digne couronnement.
        Je vous félicite aussi grandement de ce que vous honoriez sa mémoire par un témoignage aussi unanime et aussi glorieux. Nous avons ainsi appris par vous tout ce qui, par le souvenir de votre chef, vous faisait honneur, et qui nous apportait en même temps un exemple de foi et de courage.
        Autant la défaillance d’un chef est nuisible parce qu’elle peut entraîner la chute de ceux qui le suivent, autant, à l’inverse, il est utile et salutaire qu’un évêque offre à l’imitation de ses frères la solidité de sa foi.

        %Mais avant d’avoir reçu cette lettre, semble-t-il, l’Église romaine envoyait à celle de Carthage le témoignage de sa fidélité dans la persécution% :
        L’Église tient bon, ferme dans la foi. Pourtant, certains poussés par la peur, soit parce qu’ils étaient des personnages en vue, soit parce qu’ils étaient arrêtés, sont tombés, parce qu’ils craignaient les hommes. Ils se sont séparés de nous, mais nous ne les avons pas abandonnés. Nous les avons exhortés et nous les exhortons à faire pénitence: peut-être pourront-ils obtenir leur pardon de Celui qui peut l’accorder. Nous craignons, si nous les abandonnons, qu’ils deviennent pires encore.
        Vous voyez donc, frères, que vous devez agir ainsi, pour que ceux qui sont tombés soient ramenés par vos exhortations et, s’ils sont arrêtés de nouveau, puissent réparer leur première erreur en confessant la foi. Vous avez aussi d’autres devoirs que nous ajoutons: par exemple, si ceux qui ont succombé à cette épreuve tombent malades, font pénitence de leur faute et désirent rentrer dans la communion de l’Église, on doit évidemment venir à leur secours. Les veuves, les indigents qui sont sans ressources, ceux qui ont été incarcérés ou chassés de chez eux, il faut qu’ils puissent recourir à des ministres désignés. De même, les catéchumènes qui tombent malades ne doivent pas être abandonnés, on doit leur venir en aide. ~
        Les frères qui sont enchaînés vous saluent, ainsi que les prêtres et toute l’Église, car c’est elle qui monte la garde avec le plus de vigilance envers tous ceux qui invoquent le nom du Seigneur. Nous vous demandons, en retour, de vous souvenir de nous.
      responsory: |-
        R/ Pour moi, vivre, c’est le Christ !

        J’ai le désir de m’en aller
        et d’être avec lui.

        Je demeurerai près de vous tous
        pour la joie de votre foi.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu es la gloire de tes prêtres ; *
    >fais qu’à la prière du bienheureux Fabien, ton martyr,
    nous progressions dans le partage de la même foi /
    >et dans le souci de mieux te servir.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 5, 1-4
      headline: « Soyez les bergers du troupeau de Dieu »
      content: |-
        Bien-aimés,
        les anciens en fonction parmi vous, je les exhorte,
        moi qui suis ancien comme eux
        >et témoin des souffrances du Christ,
        >communiant à la gloire qui va se révéler :
        soyez les pasteurs du troupeau de Dieu qui se trouve chez vous ;
        veillez sur lui, non par contrainte mais de plein gré,
        >selon Dieu ;
        non par cupidité mais par dévouement ;
        non pas en commandant en maîtres à ceux qui vous sont confiés,
        >mais en devenant les modèles du troupeau.
        Et, quand se manifestera le Chef des pasteurs,
        >vous recevrez la couronne de gloire qui ne se flétrit pas.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 21, 15-17
      headline: « Sois le berger de mes brebis »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        Jésus se manifesta à ses disciples au bord du lac.
        Quand ils eurent mangé, il dit à Simon-Pierre :
        « Simon, fils de Jean,
        m’aimes-tu vraiment, plus que ceux-ci ? »
        Il lui répond :
        « Oui, Seigneur ! Toi, tu le sais : je t’aime. »
        Jésus lui dit :
        « Sois le berger de mes agneaux. »
        Il lui dit une deuxième fois :
        « Simon, fils de Jean, m’aimes-tu vraiment ? »
        Il lui répond :
        « Oui, Seigneur ! Toi, tu le sais : je t’aime. »
        Jésus lui dit :
        « Sois le pasteur de mes brebis. »
        Il lui dit, pour la troisième fois :
        « Simon, fils de Jean, m’aimes-tu ? »
        Pierre fut peiné
        parce que, la troisième fois, Jésus lui demandait :
        « M’aimes-tu ? »
        Il lui répond :
        « Seigneur, toi, tu sais tout :
        tu sais bien que je t’aime. »
        Jésus lui dit :
        « Sois le berger de mes brebis. »
