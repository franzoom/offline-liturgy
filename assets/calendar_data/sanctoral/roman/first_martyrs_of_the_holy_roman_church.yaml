celebration:
  title: Les premiers martyrs de l’Église de Rome
  description: |-
    Au lendemain de la solennité des Apôtres Pierre et Paul, on fait mémoire des chrétiens de Rome que l’empereur Néron fit périr d’une manière atroce dans le cirque du Vatican, après les avoir rendus responsables de l’incendie de la Ville en juillet 64. Au dire de Tacite, ils étaient « une multitude immense ». On pense que Pierre fut du nombre des victimes.
  commons:
    - martyrs
  color: red

oration:
  - Dieu qui as consacré par le sang des martyrs les magnifiques débuts de l’Église de Rome, fais que leur courage dans le combat nous obtienne une force inébranlable et la joie de la victoire.

readings:
  patristicReading:
    title: LETTRE DU PAPE SAINT CLÉMENT AUX CORINTHIENS
    content: |-
      %Ce passage est le témoignage le plus ancien que nous ayons du martyre de Pierre (après Jn 21), dans la communauté romaine.%

      Laissons les exemples de l’antiquité pour en venir aux athlètes les plus proches de nous. Prenons de nobles exemples dans notre génération. C’est par jalousie et par envie que les colonnes de l’Église les plus hautes et les plus justes ont été persécutées et ont lutté jusqu’à la mort. Regardons les saints Apôtres. Pierre, à cause d’une jalousie injuste a subi de nombreuses souffrances, et non pas une ou deux ; après avoir ainsi rendu son témoignage, il s’en est allé au séjour de gloire qu’il avait mérité. Par suite de la jalousie et de la discorde, Paul a montré quel prix est réservé à la constance. Chargé sept fois de chaînes, expulsé, lapidé, devenu prédicateur de l’Évangile en Orient et en Occident, il a reçu la renommée qui correspondait à sa foi. Après avoir enseigné la justice au monde entier jusqu’aux limites de l’Occident, il a rendu son témoignage devant les autorités ; c’est ainsi qu’il a quitté ce monde pour s’en aller au séjour de la sainteté, et devenir un illustre modèle de constance.
      À ces hommes qui ont mené une vie sainte est venue se joindre une grande foule d’élus qui, par suite de la jalousie, ont subi toutes sortes de mauvais traitements et de supplices, et qui ont donné parmi nous un magnifique exemple. Par suite de la jalousie, des femmes ont été persécutées : déguisées en victimes mythologiques, elles ont subi des outrages atroces et sacrilèges ; puis elles ont remporté victorieusement la course de la foi, et elles ont reçu une glorieuse récompense, elles dont le corps était si faible. C’est la jalousie qui a rendu des épouses étrangères à leurs maris et qui a fait mentir la parole de notre père Adam : %Voici l’os de mes os et la chair de ma chair%. Jalousie et discorde ont abattu de grandes cités et déraciné de puissantes nations.
      Nous vous écrivons ainsi, mes bien-aimés, non pas seulement pour votre avertissement, mais pour notre propre mise en garde. Car nous sommes dans la même arène, et le même combat nous attend. Laissons donc les préoccupations vaines et inutiles pour nous conformer à la règle glorieuse et vénérable de notre tradition. Voyons ce qui est beau, ce qui est agréable, ce qui est digne d’approbation aux yeux de celui qui nous a faits.
      Fixons nos regards sur le sang du Christ et comprenons combien il a de valeur pour son Père, puisque, répandu pour notre salut, il a offert au monde entier la grâce de la conversion.

    responsory: |-
      R/ Qui perd sa vie, la trouvera !
      Il n’est pas de plus grand amour
      que de mourir pour celui qu’on aime.

      Entourés que nous sommes de témoins,
      marchons les yeux fixés sur le Christ.

morning:
  evangelicAntiphon:
    common:
      - |-
        Une foule immense de martyrs persévérait dans l’amour fraternel : ils étaient unis par la foi.
vespers:
  evangelicAntiphon:
    common:
      - |-
        Tous ceux qui ont aimé le Christ pendant leur vie et l’ont imité dans sa mort régneront pour toujours avec lui.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as consacré par le sang des martyrs
    >les magnifiques débuts de l’Église de Rome ; *
    >fais que leur grand courage dans le combat nous fortifie /
    >et que leur victoire dans la foi nous réjouisse toujours.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 8, 31b-39
      headline: « Ni la mort ni la vie ne pourra nous séparer de l’amour de Dieu »
      content: |-
        Frères,
        si Dieu est pour nous,
        qui sera contre nous ?
        Il n’a pas épargné son propre Fils,
        mais il l’a livré pour nous tous :
        comment pourrait-il, avec lui,
        ne pas nous donner tout ?
        Qui accusera ceux que Dieu a choisis ?
        Dieu est celui qui rend juste :
        alors, qui pourra condamner ?
        Le Christ Jésus est mort ;
        bien plus, il est ressuscité,
        il est à la droite de Dieu,
        il intercède pour nous :
        alors, qui pourra nous séparer de l’amour du Christ ?
        la détresse ? l’angoisse ? la persécution ?
        la faim ? le dénuement ? le danger ? le glaive ?
        En effet, il est écrit :
        C’est pour toi qu’on nous massacre sans arrêt,
        qu’on nous traite en brebis d’abattoir.
        Mais, en tout cela nous sommes les grands vainqueurs
        grâce à celui qui nous a aimés.
        J’en ai la certitude :
        ni la mort ni la vie,
        ni les anges ni les Principautés célestes,
        ni le présent ni l’avenir,
        ni les Puissances, ni les hauteurs, ni les abîmes,
        ni aucune autre créature,
        rien ne pourra nous séparer de l’amour de Dieu
        qui est dans le Christ Jésus notre Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 123 (124), 2-3, 4-5, 6a.7cd-8
      refAbbr: 123, 7ab
      chorus:
      - chorusRef: 123, 7ab
        chorus: |-
          Comme un oiseau, nous avons échappé
          au filet du chasseur.
      content: |-
        Sans le Seigneur qui était pour nous
        quand des hommes nous assaillirent,
        alors ils nous avalaient tout vivants,
        dans le feu de leur colère.

        Alors le flot passait sur nous,
        le torrent nous submergeait ;
        alors nous étions submergés
        par les flots en furie.

        Béni soit le Seigneur
        qui n’a pas fait de nous
        la proie de leurs dents !
        Comme l’oiseau, nous avons échappé
        au filet de l’oiseleur.

        Le filet s’est rompu :
        nous avons échappé.
        Notre secours est dans le nom du Seigneur
        qui a fait le ciel et la terre.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 24, 4-13
      headline: « Vous serez détestés de toutes les nations à cause de mon nom »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus parlait à ses disciples de sa venue.
        Il leur disait :
        « Prenez garde que personne ne vous égare.
        Car beaucoup viendront sous mon nom,
        et diront : "C’est moi le Christ" ;
        alors ils égareront bien des gens.
        Vous allez entendre parler de guerres et de rumeurs de guerre.
        Faites attention ! ne vous laissez pas effrayer,
        car il faut que cela arrive,
        mais ce n’est pas encore la fin.
        On se dressera nation contre nation,
        royaume contre royaume ;
        il y aura, en divers lieux, des famines
        et des tremblements de terre.
        Or tout cela n’est que le commencement
        des douleurs de l’enfantement.
        Alors, vous serez livrés à la détresse,
        on vous tuera,
        vous serez détestés de toutes les nations
        à cause de mon nom.
        Alors ce sera pour beaucoup une occasion de chute ;
        ils se livreront les uns les autres,
        se détesteront les uns les autres.
        Beaucoup de faux prophètes se lèveront,
        et ils égareront bien des gens.
        À cause de l’ampleur du mal,
        la charité de la plupart des hommes se refroidira.
        Mais celui qui aura persévéré jusqu’à la fin,
        celui-là sera sauvé. »
        
