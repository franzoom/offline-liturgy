celebration:
  title: Saint François de Paule
  subtitle: ermite
  description: Né à Paola en Calabre (1416), François entendit très jeune l’appel à la vie d’ermite et il se retira dans une grotte. Mais les foules vinrent à lui et les ermitages se multiplièrent autour du sien. L’Ordre des Minimes devait en naître (1493). François mourut en France, à Plessis‑lez‑Tours, où l’avait appelé la confiance du roi Louis XI (1507).
  commons:
  - saints-male_religious
  color: white

oration:
- Dieu qui relèves les humbles, tu as donné la gloire de tes élus à saint François de Paule ; fais qu’en lui ressemblant, et avec son aide, nous obtenions le bonheurpromis aux humbles.

readings:
  patristicReading:
  - title: LETTRE DE SAINT FRANÇOIS DE PAULE (1486)
    content: |-
      Que notre Seigneur Jésus, lui qui récompense magnifiquement, vous donne le salaire de votre peine.
      Fuyez le mal, repoussez les occasions dangereuses. Nous et tous nos frères, quoique indignes, prions continuellement Dieu le Père, son Fils Jésus Christ et la Vierge Marie, pour qu’ils ne cessent de vous assister dans la recherche du salut de vos âmes et de vos corps.
      Quant à vous, mes frères, je vous exhorte vivement à travailler avec prudence et ardeur au salut de vos âmes. La mort est certaine, la vie est brève: elle s’évanouit comme la fumée.
      Fixez donc votre esprit sur la passion de notre Seigneur Jésus Christ : par amour pour nous, il est descendu du ciel pour nous racheter ; pour nous, il a subi tous les tourments de l’âme et du corps, et n’a évité aucun supplice. Il nous a donné l’exemple de la parfaite patience et de l’amour. Nous devons donc être patients devant tout ce qui s’oppose à nous.
      Abandonnez les haines et les inimitiés; veillez à éviter les paroles dures; si elles se sont échappées de votre bouche, ne répugnez pas à procurer le remède par cette bouche qui a causé les blessures ; ainsi pardonnez-vous mutuellement pour ensuite ne plus vous souvenir de vos torts. Garder le souvenir du mal, c’est un tort, c’est le cher-d’œuvre de la colère, le maintien du péché, la haine de la justice; c’est une flèche à la pointe rouillée, le poison de l’âme, la disparition des vertus, le ver rongeur de l’esprit, le trouble de la prière, l’annulation des demandes que l’on adresse à Dieu, la perte de la charité, l’iniquité toujours en éveil, le péché toujours présent et la mort quotidienne.
      Aimez la paix, le plus précieux trésor que l’on puisse désirer. Vous savez déjà que nos péchés excitent la colère de Dieu: il faut donc que vous les regrettiez pour que Dieu, dans sa miséricorde, vous pardonne. Ce que nous cachons aux hommes, Dieu le connaît@nbstp; il faut donc vous convertir d’un cœur sincère. Vivez de façon à recueillir la bénédiction du Seigneur; et que la paix de Dieu notre Père soit toujours avec vous.
    responsory: |-
      R/ L’abondance de la grâce
      fait abonder l’action de grâce à la gloire de Dieu.

      Nous portons en notre corps la mort de Jésus,
      afin que sa vie
      soit aussi manifestée dans notre corps.

      Celui qui a ressuscité le Seigneur Jésus
      nous ressuscitera, nous aussi,
      et nous placera près de lui.

morning:
  evangelicAntiphon:
    common:
    - Je me tiens à la porte et je frappe. Si quelqu’un entend ma voix et me laisse entrer, je prendrai mon repas avec lui, et lui avec moi.

vespers:
  evangelicAntiphon:
    common:
    - Tous les trésors de la terre ne pourraient acheter l’amour.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >toi qui élèves les humbles,
    >tu as exalté saint François de Paule
    >dans la gloire des saints ; *
    fais qu’en lui ressemblant, et avec son aide, /
    >nous obtenions le bonheur promis aux humbles.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ph 3, 8-14
      headline: « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        je les considère comme une perte
        à cause de ce bien qui dépasse tout :
        la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        je considère tout comme des ordures,
        afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        auquel Dieu nous appelle là-haut dans le Christ Jésus.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 12, 32-34
      headline: « Votre Père a trouvé bon de vous donner le Royaume »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Sois sans crainte, petit troupeau :
        votre Père a trouvé bon de vous donner le Royaume.
        Vendez ce que vous possédez
        et donnez-le en aumône.
        Faites-vous des bourses qui ne s’usent pas,
        un trésor inépuisable dans les cieux,
        là où le voleur n’approche pas,
        où la mite ne détruit pas.
        Car là où est votre trésor,
        là aussi sera votre cœur. »
        Acclamons la Parole de Dieu.
