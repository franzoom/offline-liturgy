celebration:
  title: Saint François de Sales
  subtitle: évêque et docteur de l’Église
  description: François de Sales (1567-1622) fut essentiellement un pasteur. Missionnaire, puis évêque de Genève résidant à Annecy, fondateur de la Visitation avec Jeanne Françoise de Chantal, il se fit tout à tous par la parole et par l’écrit, traitant de théologie avec les Protestants, mettant la vie spirituelle à la portée des laïcs, attentif aux petits comme aux grands.
  commons:
    - pastors
    - pastors_doctors
  color: white

oration:
  - Pour le salut des âmes, Seigneur, tu as voulu que l’évêque saint François de Sales  devienne le serviteur de tous en toutes choses ; fais que, soutenus par son  exemple, nous donnions une preuve de ta douce charité en nous dévouant pour nos frères.

readings:
  patristicReading:
    - title: LETTRE À LA PRÉSIDENTE BRULART
      subtitle: 13 octobre 1604
      content: |-
        Il faut considérer qu’il n’y a nulle vocation qui n’ait ses ennuis, ses amertumes et aversions et, qui plus est - si ce n’est ceux qui sont pleinement résignés en la volonté de Dieu - chacun voudrait volontiers échanger sa condition pour celle des autres : ceux qui sont évêques voudraient ne l’être pas ; ceux qui sont mariés voudraient ne l’être pas, et ceux qui ne le sont le voudraient être.
        D’où vient cette générale inquiétude des esprits, sinon d’un certain déplaisir que nous avons à la contrainte, et une malignité d’esprit qui nous fait penser que chacun est mieux que nous ? Mais c’est tout un : quiconque n’est pleinement résigné, qu’il tourne deçà et delà, il n’aura jamais repos. Ceux qui ont la fièvre ne trouvent nulle place bonne, ils n’ont pas demeuré un quart d’heure en un lit qu’ils voudraient être en un autre ; ce n’est pas la faute du lit, mais c’est la fièvre qui les tourmente partout. Une personne qui n’a pas la fièvre de sa propre volonté se contente de tout ; pourvu que Dieu soit servi, elle ne se soucie pas en quelle qualité Dieu l’emploie : pourvu qu’elle fasse la volonté divine, cela lui est égal.
        Mais ce n’est pas tout. Il faut non seulement vouloir faire la volonté de Dieu, mais pour être dévot, il la faut faire gaiement. Si je n’étais pas évêque, peut- être que, sachant ce que je sais, je ne le voudrais pas être ; mais l’étant, non seulement je suis obligé de faire ce que cette pénible vocation requiert, mais je dois le faire joyeusement, et je dois me plaire en cela et le faire de bon gré. C’est la parole de saint Paul : « Que chacun demeure en sa vocation devant Dieu » (1 Co 7, 24). Il ne faut pas porter la croix des autres, mais la sienne ; et pour porter chacun la sienne, notre Seigneur veut qu’un chacun se renonce soi-même, c’est-à-dire à sa propre volonté.
        Je voudrais bien ceci et cela ; je serais mieux ici et là : ce sont des tentations. Notre Seigneur sait bien ce qu’il fait : faisons ce qu’il veut, demeurons où il nous a mis.
      responsory: |-
        R/ Le fruit de l’Esprit est amour, joie et paix, bonté, douceur et patience.
        Si nous vivons par l’Esprit, marchons aussi dans l’Esprit.
        Si vous êtes conduits par l’Esprit, vous n’êtes plus soumis à la loi.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    pour le salut des âmes,
    >tu as voulu que l’évêque saint François de Sales
    >devienne le serviteur de tous en toutes choses ; *
    dans ta bonté, accorde-nous, à son exemple, /
    >de manifester toujours ta douce charité
    >dans le service fraternel.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ép 3, 8-12
      headline: « Annoncer aux nations l’insondable richesse du Christ »
      content: |-
        Frères,
        à moi qui suis vraiment le plus petit de tous les fidèles,
        >la grâce a été donnée d’annoncer aux nations
        >l’insondable richesse du Christ,
        et de mettre en lumière pour tous le contenu du mystère
        >qui était caché depuis toujours en Dieu,
        >le créateur de toutes choses ;
        ainsi, désormais, les Puissances célestes elles-mêmes
        >connaissent, grâce à l’Église,
        >les multiples aspects de la Sagesse de Dieu.
        C’est le projet éternel que Dieu a réalisé
        >dans le Christ Jésus notre Seigneur.
        Et notre foi au Christ nous donne l’assurance nécessaire
        >pour accéder auprès de Dieu en toute confiance.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 36 (37), 3-4, 5-6, 30-31
      refAbbr: 36, 30a
      chorus:
      - chorusRef: 36, 30a
        chorus: Les lèvres du juste redisent la sagesse.
      content: |-
        Fais confiance au Seigneur, agis bien,
        habite la terre et reste fidèle ;
        mets ta joie dans le Seigneur :
        il comblera les désirs de ton cœur.

        Dirige ton chemin vers le Seigneur,
        fais-lui confiance, et lui, il agira.
        Il fera lever comme le jour ta justice,
        et ton droit comme le plein midi.

        Les lèvres du juste redisent la sagesse
        et sa bouche énonce le droit.
        La loi de son Dieu est dans son cœur ;
        il va, sans craindre les faux pas.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: « Vous êtes mes amis si vous faites ce que je vous commande »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres. »
  offeringPrayer:
  - |-
    Nous t’offrons, Seigneur, le sacrifice qui nous sauve : *
    par lui, embrase-nous du feu de l’Esprit Saint /
    >qui brûlait admirablement
    >le cœur très doux de saint François.
    Par le Christ, notre Seigneur.
  communionAntiphon: null
  prayerAfterCommunion:
  - |-
    Par le sacrement que nous avons reçu, +
    >accorde-nous, Dieu tout-puissant,
    >d’imiter sur la terre la douceur et la charité de saint François, /
    pour obtenir avec lui la gloire du ciel.
    Par le Christ, notre Seigneur.