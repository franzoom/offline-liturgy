celebration:
  title: Saint François Xavier
  subtitle: prêtre
  description: Le Navarrais François-Xavier (1506-1552) fut l’un des premiers compagnons d’Ignace de Loyola. Désigné pour la Mission des Indes portugaises (1541), il annonça le Christ en Inde, à Ceylan, aux Moluques, au Japon. Il mourut aux portes de la Chine, brûlé d’une passion pour la gloire de Dieu et le salut des hommes, qu’il aurait voulu communiquer à tous les chrétiens.
  color: white
  commons:
  - pastors

oration:
  - Tu as voulu, Seigneur, que la prédication de saint François Xavier appelle à toi de nombreux peuples d’Orient ; accorde à tous les baptisés le même zèle pour la foi et fais que ton Église se réjouisse d’avoir, partout dans le monde, de nouveaux enfants.

readings:
  patristicReading:
    - title: LETTRES DE FRANÇOIS XAVIER À SAINT IGNACE (1542 et 1544)
      content: |-
        Nous sommes allés à des villages de néophytes, baptisés voici peu d’années. Cette région n’est absolument pas habitée par les Portugais, car elle est très stérile et très pauvre. Les chrétiens indigènes, privés de prêtres, ne savent rien, sinon qu’ils sont chrétiens. Il n’y a personne pour leur célébrer les sacrements ; personne pour leur enseigner le Symbole, le %Pater%, l’%Ave Maria%, ni les commandements de Dieu.
        Depuis que je suis venu ici, je n’ai pas arrêté : je parcourais activement les villages, je baptisais tous les enfants qui ne l’avaient pas encore été. Aussi ai-je régénéré un nombre immense de bébés qui, comme on dit, ne savaient pas distinguer leur droite de leur gauche. Quant aux enfants, ils ne me laissaient ni réciter l’office divin, ni manger ni me reposer tant que je ne leur avais pas enseigné une prière. Alors j’ai commencé à saisir que le royaume des cieux appartient à ceux qui leur ressemblent.
        Aussi, comme je ne pouvais sans impiété repousser une requête aussi pieuse, en commençant par la confession de foi au Père, au Fils et à l’Esprit Saint, je leur inculquais le Symbole des Apôtres, le %Pater noster% et l’%Ave Maria%. J’ai remarqué qu’ils étaient très doués ; s’il y avait quelqu’un pour les former à la foi chrétienne, je suis sûr qu’ils deviendraient de très bons chrétiens.
        Dans ce pays, quantité de gens ne sont pas chrétiens uniquement parce qu’il n’y a personne aujourd’hui pour en faire des chrétiens. J’ai très souvent eu l’idée de parcourir toutes les universités d’Europe, et d’abord celle de Paris, pour hurler partout d’une manière folle et pousser ceux qui ont plus de doctrine que de charité, en leur disant : « Hélas, quel nombre énorme d’âmes, exclu du ciel par votre faute, s’engouffre dans l’enfer ! »
        De même qu’ils se consacrent aux belles-lettres, s’ils pouvaient seulement se consacrer aussi à cet apostolat, afin de pouvoir rendre compte à Dieu de leur doctrine et des talents qui leur ont été confiés !
        Beaucoup d’entre eux, bouleversés par cette pensée, aidés par la méditation des choses divines, s’entraîneraient à écouter ce que le Seigneur dit en eux et, en rejetant leurs ambitions et leurs affaires humaines, ils se soumettraient tout entiers, définitivement, à la volonté et au décret de Dieu. Oui, ils crieraient du fond du cœur : « %Seigneur, me voici ; que veux-tu que je fasse% ? Envoie-moi n’importe où tu voudras, même jusque dans les Indes. »
      responsory: |-
        [rubric](Stance)[/rubric]
        Ouvriers de la paix
        la moisson vous attend :
        pour réconcilier le monde,
        n’emportez que l’amour.
        À ceux qui vous accueillent,
        comme à ceux qui vous chassent,
        annoncez la nouvelle :

        R/ Le Royaume de Dieu est là,
        tout près de vous.

        Vous allez recevoir une force :
        l’Esprit Saint viendra sur vous.

        Alors vous serez mes témoins
        jusqu’aux extrémités de la terre.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 17,50 ; 21,23
    content: |-
      Je te rendrai grâce parmi les peuples, Seigneur ;
      >je proclamerai ton nom devant mes frères.
  collect:
  - |-
    Seigneur Dieu, +
    >par la prédication de saint François Xavier,
    >tu as acquis pour toi des peuples nombreux ; *
    accorde aux fidèles d’avoir une ardeur aussi vive pour la foi, /
    >et à la sainte Église la joie d’avoir en tout lieu
    >une descendance innombrable.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 9, 16-19.22-23
      headline: « Malheur à moi si je n’annonçais pas l’Évangile ! »
      content: |-
        Frères,
        annoncer l’Évangile,
        >ce n’est pas là pour moi un motif de fierté,
        >c’est une nécessité qui s’impose à moi.
        Malheur à moi si je n’annonçais pas l’Évangile !
        Certes, si je le fais de moi-même,
        >je mérite une récompense.
        Mais je ne le fais pas de moi-même,
        >c’est une mission qui m’est confiée.
        Alors quel est mon mérite ?
        C’est d’annoncer l’Évangile
        >sans rechercher aucun avantage matériel,
        >et sans faire valoir mes droits de prédicateur de l’Évangile.
        Oui, libre à l’égard de tous,
        je me suis fait l’esclave de tous
        >afin d’en gagner le plus grand nombre possible.
        Avec les faibles, j’ai été faible,
        >pour gagner les faibles.
        Je me suis fait tout à tous
        >pour en sauver à tout prix quelques-uns.
        Et tout cela, je le fais à cause de l’Évangile,
        >pour y avoir part, moi aussi.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 116 (117), 1, 2
      refAbbr: null
      chorus:
      - chorusRef: Mc 16, 15
        chorus: |-
          Allez dans le monde entier.
          Proclamez l’Évangile.
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Louez le Seigneur, tous les peuples ;
        fêtez-le, tous les pays !

        Son amour envers nous s’est montré le plus fort ;
        éternelle est la fidélité du Seigneur !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 16, 15-20
      headline: « Allez dans le monde entier. Proclamez l’Évangile »
      acclamationAntiphon: |-
        Allez ! De toutes les nations faites des disciples,
        dit le Seigneur.
        Moi, je suis avec vous tous les jours
        jusqu’à la fin du monde.
      content: |-
        En ce temps-là,
        Jésus ressuscité se manifesta aux onze Apôtres et leur dit :
        >« Allez dans le monde entier.
        Proclamez l’Évangile à toute la création.
        Celui qui croira et sera baptisé
        >sera sauvé ;
        >celui qui refusera de croire
        >sera condamné.
        Voici les signes qui accompagneront
        >ceux qui deviendront croyants :
        >en mon nom, ils expulseront les démons ;
        >ils parleront en langues nouvelles ;
        >ils prendront des serpents dans leurs mains
        >et, s’ils boivent un poison mortel,
        >il ne leur fera pas de mal ;
        >ils imposeront les mains aux malades,
        >et les malades s’en trouveront bien. »
        Le Seigneur Jésus,
        >après leur avoir parlé,
        fut enlevé au ciel
        >et s’assit à la droite de Dieu.
        Quant à eux,
        >ils s’en allèrent proclamer partout l’Évangile.
        Le Seigneur travaillait avec eux
        >et confirmait la Parole par les signes qui l’accompagnaient.
        
  offeringPrayer:
  - |-
    Accepte les offrandes que nous t’apportons, Seigneur,
    >en faisant mémoire de saint François Xavier : +
    passionné pour le salut des hommes,
    >il fut entraîné vers des terres lointaines ; *
    puissions-nous, à notre tour,
    >rendre à l’Évangile un témoignage efficace /
    >et nous hâter, avec nos frères, vers toi.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Mt 10,27
    content: |-
      Ce que je vous dis dans les ténèbres,
      >dites-le en pleine lumière ;
      ce que vous entendez au creux de l’oreille,
      >proclamez-le sur les toits.
  prayerAfterCommunion:
  - |-
    Que tes mystères, Seigneur Dieu,
    >allument en nous cette ardente charité
    >qui brûlait saint François Xavier
    >pour le salut des âmes ; *
    nous marcherons alors
    >dans une plus grande fidélité à notre vocation, /
    et nous pourrons obtenir avec lui
    >le salaire promis aux bons ouvriers.
    Par le Christ, notre Seigneur.