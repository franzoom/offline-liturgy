celebration:
  title: Saint Grégoire le Grand
  subtitle: pape et docteur de l’Église
  description: Grégoire le Grand gouverna l’Église pendant quatorze ans (590-604). Malgré une santé délabrée il accomplit une œuvre considérable. « Serviteur des serviteurs de Dieu », il devait pourvoir au ravitaillement de Rome, tandis qu’il enseignait le peuple et qu’il préparait l’évangélisation de l’Angleterre. Son action se nourrissait d’une contemplation assidue.
  commons:
  - pastors_pope
  - pastors_doctors
  color: white

oration:
  - |-
    Dieu qui prends soin de ton peuple et le gouvernes avec amour, écoute la prière du pape saint Grégoire ; accorde ton Esprit de sagesse aux hommes chargés de conduire l’Église : que les progrès de ton peuple saint fassent la joie éternelle de ses pasteurs.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT GRÉGOIRE SUR ÉZÉKIEL
      content: |-
        %Fils d’homme, je fais de toi un guetteur pour la maison d’Israël%. Il faut noter que le Seigneur désigne comme un « guetteur » celui qu’il envoie prêcher. Le guetteur se tient toujours sur la hauteur pour voir de loin tout ce qui va venir. Et tout homme qui reçoit le poste de guetteur doit se tenir sur la hauteur par sa vie, afin de pouvoir rendre service par sa vigilance.
        Combien il m’est cruel de dire ces paroles ! Car en parlant, je me frappe moi-même : je ne pratique pas la prédication comme je le devrais ; et lorsque cette prédication est suffisante, ma vie ne concorde pas avec ma parole.
        Je ne nie pas ma culpabilité, je vois ma torpeur et ma négligence. Peut-être que de reconnaître ma faute m’obtiendra le pardon auprès du juge miséricordieux ? Sans doute, quand j’étais au monastère, j’étais capable de retenir ma langue des paroles inutiles et de garder presque continuellement mon esprit attentif à la prière. Mais, après avoir endossé le fardeau de la charge pastorale, mon esprit ne peut plus se recueillir assidûment, parce qu’il est divisé par quantité de soucis.
        En effet, je suis obligé d’examiner les affaires tantôt des Églises tantôt des monastères, et tantôt des monastères, et souvent de juger la vie et les actes des personnes privées ; tantôt de m’occuper longuement de certains problèmes civiques, tantôt de gémir devant l’assaut meurtrier des barbares et de redouter les loups qui menacent le troupeau que Dieu m’a confié. Tantôt je suis contraint de prendre des mesures pour que les secours ne manquent pas à ceux-là mêmes qui sont tenus par la règle monastique ; tantôt je dois supporter avec patience certains pillards, et tantôt m’opposer à eux pour sauvegarder la charité.
        Lorsque l’esprit est amené à se disperser et à se déchirer par le souci d’affaires si nombreuses et si importantes, comment peut-il rentrer en lui-même afin de se recueillir entièrement pour la prédication, et ne pas renoncer au ministère de la parole ? Mais, parce que les obligations de ma charge m’obligent souvent à rencontrer des hommes du monde, il m’arrive de relâcher la discipline de ma langue. Car, si je maintiens constamment une sévérité rigoureuse, je sais que je mets en fuite les plus faibles, et je ne les attirerai jamais comme je le voudrais. C’est pourquoi il m’arrive souvent d’écouter leurs paroles inutiles. Mais parce que je suis faible, moi aussi, je me laisse quelque peu entraîner aux discours inutiles, et je me mets à parler volontiers sur des sujets que j’avais d’abord écoutés de mauvais gré : et là où cela m’ennuyait de manquer au silence, je trouve plaisir à m’étendre.
        Quel « guetteur » suis-je donc, qui ne me tiens pas posté sur la montagne de l’efficacité, mais plutôt gisant dans la vallée de la faiblesse ? Mais le créateur et rédempteur du genre humain est assez puissant pour me donner, malgré mon indignité, et la noblesse de la vie et l’efficacité de la prédication, car c’est pour son amour que je me consacre totalement à sa parole.
      responsory: |-
        R/ C’est au prix de son sang
        que le Christ Jésus s’est acquis l’Église.

        Soyez donc attentifs au troupeau
        dont l’Esprit vous a confié la charge.

        Vous serez les intendants fidèles
        des mystères de sa grâce.

        Livrés en spectacle au monde,
        vous serez les modèles du troupeau.

morning:
  evangelicAntiphon:
    common: Béni soit Dieu qui a fait de saint Grégoire un exemple pour tous les pasteurs.

vespers:
  evangelicAntiphon:
    common: Toute la vie de saint Grégoire le Grand illustre ce qu’il disait des mystères de Dieu.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Le bienheureux Grégoire, élevé sur le siège de Pierre,
      >recherchait toujours la face du Seigneur
      >et, sans relâche, célébrait son amour.
  collect:
  - |-
    Seigneur Dieu, +
    >tu veilles sur tes peuples avec bonté,
    >et tu les gouvernes avec amour ; *
    >par l’intercession du pape saint Grégoire,
    >accorde un esprit de sagesse
    >à ceux qui ont reçu de toi la charge de conduire l’Église : /
    >que les progrès du troupeau fidèle
    >fassent la joie éternelle de ses pasteurs.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 2 Co 4, 1-2.5-7
      headline: |-
        « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
      content: |-
        Frères,
        nous, les Apôtres,
        ayant reçu ce ministère par la miséricorde de Dieu,
        >nous ne perdons pas courage :
        nous avons rejeté toute dissimulation honteuse,
        >nous n’agissons pas avec ruse,
        >et nous ne falsifions pas la parole de Dieu.
        Au contraire, nous manifestons la vérité,
        >et ainsi nous nous recommandons nous-mêmes
        >à toute conscience humaine devant Dieu.
        Ce que nous proclamons,
        >ce n’est pas nous-mêmes ;
        c’est ceci : Jésus Christ est le Seigneur ;
        >et nous sommes vos serviteurs, à cause de Jésus.
        Car Dieu qui a dit :
        >Du milieu des ténèbres brillera la lumière,
        a lui-même brillé dans nos cœurs
        >pour faire resplendir la connaissance de sa gloire
        >qui rayonne sur le visage du Christ.
        Mais ce trésor, nous le portons
        >comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        >appartient à Dieu et ne vient pas de nous.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 22, 24-30
      headline: |-
        « Je dispose pour vous du Royaume, comme mon Père en a disposé pour moi »
      acclamationAntiphon: |-
        Je vous appelle mes amis, dit le Seigneur,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
      content: |-
        En ce temps-là,
        les Apôtres en arrivèrent à se quereller :
        >lequel d’entre eux, à leur avis, était le plus grand ?
        Mais Jésus leur dit :
        >« Les rois des nations
        >les commandent en maîtres,
        >et ceux qui exercent le pouvoir sur elles
        >se font appeler bienfaiteurs.
        Pour vous, rien de tel !
        Au contraire, que le plus grand d’entre vous
        >devienne comme le plus jeune,
        >et le chef, comme celui qui sert.
        Quel est en effet le plus grand :
        >celui qui est à table, ou celui qui sert ?
        N’est-ce pas celui qui est à table ?
        Eh bien moi, je suis au milieu de vous
        >comme celui qui sert.
        Vous, vous avez tenu bon avec moi dans mes épreuves.
        Et moi, je dispose pour vous du Royaume,
        >comme mon Père en a disposé pour moi.
        Ainsi vous mangerez et boirez à ma table
        >dans mon Royaume,
        >et vous siégerez sur des trônes
        >pour juger les douze tribus d’Israël. »
  offeringPrayer:
  - |-
    Exauce notre prière, Seigneur : *
    >fais qu’au jour où nous célébrons saint Grégoire,
    >cette offrande nous soit profitable, /
    car tu as voulu que, par l’oblation de ce sacrifice,
    >soient remis les péchés du monde entier.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Lc 12,42
    content: |-
      Voici le serviteur fidèle et avisé
      >que le Maître a établi sur sa maison,
      >pour donner à chacun, en temps voulu, sa part de blé.
  prayerAfterCommunion:
  - |-
    Ceux que tu fortifies, Seigneur,
    >par le Christ, pain vivant,
    >forme-les aussi par le Christ, le seul maître, *
    pour qu’en la fête de saint Grégoire,
    >ils soient instruits de ta vérité /
    >et la mettent en œuvre dans la charité.
    Par le Christ, notre Seigneur.