celebration:
  title: Saint Grégoire VII
  subtitle: pape
  description: |-
    Le moine Hildebrand, devenu le pape Grégoire VII (1073-1085), domine toute l’histoire du moyen âge. Alliant une claire vision des besoins de son temps à un courage intrépide, il n’eut qu’un objectif : arracher l’Église au pouvoir féodal et restaurer la discipline dans le clergé. On vit alors un pape excommunier et déposer l’empereur romain germanique (1077).
  commons:
    - pastors_pope
  color: white

oration: 
  - |-
    Accorde à ton Église, Seigneur, l’esprit de force et la soif de justice que tu as donnés au pape Grégoire VII : qu’elle sache rejeter le mal pour vivre sans entrave en toute droiture et charité.

readings:
  patristicReading:
    title: LETTRE DE SAINT GRÉGOIRE VII À TOUS SES FIDÈLES (1084)
    content: |-
      Nous vous en prions et supplions dans le Seigneur Jesus, qui nous a rachetés par sa mort : comprenez par une recherche attentive pourquoi et comment nous subissons les épreuves et les angoisses que nous font souffrir les ennemis de la religion chrétienne.
      C’est par une disposition divine que l’Église, notre mère, m’a placé sur le trône apostolique, moi qui en suis très indigne et qui, Dieu en est témoin, ne le voulais pas. C’est pourquoi j’ai travaillé de toutes mes forces à ramener la Sainte Église, l’épouse de Dieu, notre souveraine et notre mère, à la beauté qui est la sienne, pour qu’elle demeure libre, chaste et catholique. Mais parce que cela déplaît totalement à l’antique ennemi, celui-ci a mobilisé ses membres contre nous, afin de contrarier toutes nos entreprises.
      C’est pourquoi il a fait contre nous, ou plutôt contre le Siège Apostolique, tout ce qu’il n’avait pu faire depuis le temps de l’empereur Constantin le Grand. Il n’est pas surprenant que, plus le temps avance, plus il s’évertue à détruire la religion chrétienne.
      Maintenant, mes frères très chers, écoutez attentivement ce que je vous dis. Tous ceux qui, dans le monde entier, portent le nom de chrétiens, et connaissent vraiment la foi chrétienne, savent et croient que saint Pierre, le prince des Apôtres, est le père de tous les chrétiens, leur premier pasteur après le Christ, et que l’Église Romaine est la mère et la maîtresse de toutes les Églises.
      Si donc vous croyez cela et en êtes convaincus sans aucune hésitation, je vous le demande et vous l’ordonne, moi qui suis votre humble frère et votre maître indigne : par le Dieu tout-puissant, aidez et secourez ceux que j’ai nommés votre père et votre mère, si vous désirez recevoir par eux l’absolution de tous vos péchés, ainsi que la bénédiction et la grâce en ce monde et dans le monde futur.
      Que le Dieu tout-puissant, de qui viennent toutes choses, éclaire toujours votre âme, et la féconde par la charité envers lui et envers le prochain, pour que vous puissiez, en vertu de votre dévouement inébranlable, faire que ce père et cette mère soient vos débiteurs, et parvenir sans crainte à vivre en leur compagnie. Amen.

    responsory: |-
      R/ Nul ne peut servir deux maîtres.
      
      C’est le Seigneur notre Dieu
      que nous voulons servir,
      c’est à sa voix que nous voulons obéir !

      Il n’y a pour nous qu’un seul Dieu : le Père,
      et un seul Seigneur : Jésus Christ !

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Accorde à ton Église, Seigneur,
    >l’esprit de force et la soif de justice
    >dont tu as voulu que rayonne
    >le pape saint Grégoire VII : *
    qu’elle sache rejeter le mal
    >et faire valoir le droit, /
    >en toute liberté et charité.
    Par Jésus Christ, ton Fils, notre Seigneur,
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ac 20, 17-18a.28-32.36
      headline: « Veillez sur vous-mêmes, et sur tout le troupeau dont l’Esprit Saint vous a établis responsables pour être les pasteurs de l’Église de Dieu »
      content: |-
        En ces jours-là,
        depuis Milet, Paul envoya un message à Éphèse
        pour convoquer les Anciens de cette Église.
        Quand ils furent arrivés auprès de lui, il leur adressa la parole :
        « Veillez sur vous-mêmes, et sur tout le troupeau
        dont l’Esprit Saint vous a établis responsables,
        pour être les pasteurs de l’Église de Dieu,
        qu’il s’est acquise par son propre sang.
        Moi, je sais qu’après mon départ,
        des loups redoutables s’introduiront chez vous
        et n’épargneront pas le troupeau.
        Même du milieu de vous surgiront des hommes
        qui tiendront des discours pervers
        pour entraîner les disciples à leur suite.
        Soyez donc vigilants,
        et souvenez-vous que, durant trois ans,
        nuit et jour,
        je n’ai cessé, dans les larmes,
        de reprendre chacun d’entre vous.
        Et maintenant, je vous confie à Dieu
        et à la parole de sa grâce,
        lui qui a le pouvoir de construire l’édifice
        et de donner à chacun l’héritage
        en compagnie de tous ceux qui ont été sanctifiés. »
        Quand Paul eut ainsi parlé,
        il s’agenouilla et pria avec eux tous.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 109 (110), 1, 2, 3, 4
      refAbbr: cf. 109, 4
      chorus:
      - chorusRef: cf. 109, 4
        chorus: |-
          Tu es prêtre à jamais
          selon l’ordre de Melkisédek.
      content: |-
        Oracle du Seigneur à mon seigneur :
        « Siège à ma droite,
        et je ferai de tes ennemis
        le marchepied de ton trône. »

        De Sion, le Seigneur te présente
        le sceptre de ta force :
        « Domine jusqu’au cœur de l’ennemi. »

        Le jour où paraît ta puissance,
        tu es prince, éblouissant de sainteté :
        « Comme la rosée qui naît de l’aurore,
        je t’ai engendré. »

        Le Seigneur l’a juré
        dans un serment irrévocable :
        « Tu es prêtre à jamais
        selon l’ordre du roi Melkisédek. »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 16, 13-19
      headline: « Tu es Pierre, et sur cette pierre je bâtirai mon Église »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        En ce temps-là,
        Jésus, arrivé dans la région de Césarée-de-Philippe,
        demandait à ses disciples :
        « Au dire des gens,
        qui est le Fils de l’homme ? »
        Ils répondirent :
        « Pour les uns, Jean le Baptiste ;
        pour d’autres, Élie ;
        pour d’autres encore, Jérémie ou l’un des prophètes. »
        Jésus leur demanda :
        « Et vous, que dites-vous ? Pour vous, qui suis-je ? »
        Alors Simon-Pierre prit la parole et dit :
        « Tu es le Christ,
        le Fils du Dieu vivant ! »
        Prenant la parole à son tour, Jésus lui dit :
        « Heureux es-tu, Simon fils de Yonas :
        ce n’est pas la chair et le sang qui t’ont révélé cela,
        mais mon Père qui est aux cieux.
        Et moi, je te le déclare :
        Tu es Pierre,
        et sur cette pierre je bâtirai mon Église ;
        et la puissance de la Mort ne l’emportera pas sur elle.
        Je te donnerai les clés du royaume des Cieux :
        tout ce que tu auras lié sur la terre
        sera lié dans les cieux,
        et tout ce que tu auras délié sur la terre
        sera délié dans les cieux. »
        
