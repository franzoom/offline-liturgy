celebration:
  title: La Sainte Famille
  color: white

oration:
- Tu as voulu, Seigneur, que la Sainte Famille nous soit donnée en exemple ; accorde-nous la grâce de pratiquer, comme elle, les vertus familiales et d’être unis par les liens de ton amour, avant de nous retrouver pour l’éternité dans la joie de ta maison.

firstVespers:
  hymn:
  - qui-peut-me-dire
  psalmody:
  - psalm: PSALM_112
    antiphon:
    - Jacob engendra Joseph, l’époux de Marie, et de Marie est né Jésus, celui qu’on appelle Christ.
  - psalm: PSALM_147
    antiphon:
    - |-
      Joseph, fils de David, ne crains pas de prendre chez toi Marie, ton épouse : l’enfant qu’elle a conçu vient de l’Esprit Saint.
  - psalm: NT_4
    antiphon:
    - Les bergers sont vite accourus, ils ont trouvé Marie et Joseph, avec le nouveau-né couché dans une crèche.
  reading:
    biblicalReference: 2 Co 8, 9
    content: |-
      Vous connaissez la générosité de notre Seigneur Jésus Christ : lui qui est riche, il est devenu pauvre à cause de vous, pour que vous deveniez riches par sa pauvreté.
  responsory: |-
    R/ Le Verbe s’est fait chair.
    * Alléluia, alléluia !
    V/ Il a demeuré parmi nous. *
    V/ Il a révélé le Dieu caché. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common: |-
      Jésus était resté à Jérusalem. Ses parents ne le savaient pas : ils le cherchaient parmi leurs compagnons de route.

invitatory:
  antiphon:
  - Adorons le Fils de Dieu, soumis à Marie et à Joseph.

readings:
  hymn:
  - source-en-attente
  psalmody:
  - psalm: PSALM_23
    antiphon:
    - Béni soit au nom du Seigneur celui qui vient.
  - psalm: PSALM_45
    antiphon:
    - Cet enfant, né de la Vierge, se nommera Emmanuel, Dieu-avec-nous.
  - psalm: PSALM_86
    antiphon:
    - Nous sommes les concitoyens des saints, nous sommes de la famille de Dieu.
  verse: |-
    V/ Tes fils seront tous instruits par le Seigneur,
    ils goûteront un bonheur sans limites.
  biblicalReading:
  - title: LECTURE DE LA LETTRE AUX ÉPHÉSIENS
    subtitle: L’amour chrétien inaugure de nouvelles relations familiales
    ref: Ep 5, 21 – 6, 4
    content: |-
      Par respect pour le Christ, soyez soumis les uns aux autres ; les femmes, à leur mari, comme au Seigneur Jésus ; car, pour la femme, le mari est la tête, tout comme, pour l’Église, le Christ est la tête, lui qui est le Sauveur de son corps. Eh bien ! puisque l’Église se soumet au Christ, qu’il en soit toujours de même pour les femmes à l’égard de leur mari.
      Vous, les hommes, aimez votre femme à l’exemple du Christ : il a aimé l’Église, il s’est livré lui-même pour elle, afin de la rendre sainte en la purifiant par le bain de l’eau baptismale, accompagné d’une parole ; il voulait se la présenter à lui-même, cette Église, resplendissante, sans tache, ni ride, ni rien de tel ; il la voulait sainte et immaculée. C’est de la même façon que les maris doivent aimer leur femme : comme leur propre corps. Celui qui aime sa femme s’aime soi-même. Jamais personne n’a méprisé son propre corps : au contraire, on le nourrit, on en prend soin. C’est ce que fait le Christ pour l’Église, parce que nous sommes les membres de son corps. Comme dit l’Écriture : À cause de cela, l’homme quittera son père et sa mère, il s’attachera à sa femme, et tous deux ne feront plus qu’un. Ce mystère est grand : je le dis en référence au Christ et à l’Église.
      Pour en revenir à vous, chacun doit aimer sa propre femme comme lui-même, et la femme doit avoir du respect pour son mari. Vous, les enfants, obéissez à vos parents dans le Seigneur, car c’est cela qui est juste : Honore ton père et ta mère, c’est le premier commandement qui soit assorti d’une promesse : ainsi tu seras heureux et tu auras longue vie sur la terre. Et vous, les parents, ne poussez pas vos enfants à la colère, mais élevez-les en leur donnant une éducation et des avertissements inspirés par le Seigneur.
    responsory: |-
      R/ Dieu s’est fait l’un de nous,
      pour nous apprendre à aimer !

      Vous qui servez Jésus, le Christ,
      soumettez-vous les uns aux autres.

      Le Christ a aimé l’Église et s’est livré pour elle :
      aimons-nous les uns les autres, en acte et en vérité.
  patristicReading:
  - title: HOMÉLIE DE SAINT PAUL VI À NAZARETH (5 JANVIER 1964)
    subtitle: L’exemple de Nazareth.
    content: |-
      Nazareth est l’école où l’on commence à comprendre la vie de Jésus : l’école de l’Évangile. Ici, on apprend à regarder, à écouter, à méditer et à pénétrer la signification, si profonde et si mystérieuse, de cette très simple, très humble et très belle manifestation du Fils de Dieu. Peut-être apprend-on même insensiblement à imiter. Ici, on apprend la méthode qui nous permettra de comprendre qui est le Christ. Ici, on découvre le besoin d’observer le cadre de son séjour parmi nous : les lieux, les temps, les coutumes, le langage, les pratiques religieuses, tout ce dont s’est servi Jésus pour se révéler au monde. Ici, tout parle, tout a un sens. Ici, à cette école, on comprend la nécessité d’avoir une discipline spirituelle, si l’on veut suivre l’enseignement de l’Évangile et devenir disciple du Christ. Oh, comme nous voudrions redevenir enfant et nous remettre à cette humble et sublime école de Nazareth, comme nous voudrions près de Marie recommencer à acquérir la vraie science de la vie et la sagesse supérieure des vérités divines !
      Mais nous ne faisons que passer. Il nous faut laisser ce désir de poursuivre ici l’éducation, jamais achevée, à l’intelligence de l’Évangile. Nous ne partirons pas cependant sans avoir recueilli à la hâte, et comme à la dérobée, quelques brèves leçons de Nazareth.
      Une leçon de silence d’abord. Que renaisse en nous l’estime du silence, cette admirable et indispensable condition de l’esprit, en nous qui sommes assaillis par tant de clameurs, de fracas et de cris dans notre vie moderne, bruyante et hyper sensibilisée. Ô silence de Nazareth, enseigne-nous le recueillement, l’intériorité, la disposition à écouter les bonnes inspirations et les paroles des vrais maîtres ; enseigne-nous le besoin et la valeur des préparations, de l’étude, de la méditation, de la vie personnelle et intérieure, de la prière que Dieu seul voit dans le secret.
      Une leçon de vie familiale. Que Nazareth nous enseigne ce qu’est la famille, sa communion d’amour, son austère et simple beauté, son caractère sacré et inviolable ; apprenons de Nazareth comment la formation qu’on y reçoit est douce et irremplaçable ; apprenons quel est son rôle primordial sur le plan social.
      Une leçon de travail. Nazareth, maison du%fils du charpentier%, c’est ici que nous voudrions comprendre et célébrer la loi sévère et rédemptrice du labeur humain ; ici, rétablir la conscience de la noblesse du travail ; ici, rappeler que le travail ne peut pas avoir une fin en lui-même, mais que sa liberté et sa noblesse lui viennent, en plus de sa valeur économique, des valeurs qui le finalisent ; comme nous voudrions enfin saluer ici tous les travailleurs du monde entier et leur montrer leur grand modèle, leur frère divin, le prophète de toutes leurs justes causes, le Christ notre Seigneur.
    responsory: |-
      R/ Que règne en nos cœurs la paix du Christ !

      Puisque vous êtes élus, sanctifiés, aimés par Dieu,
      revêtez donc des sentiments de compassion.

      Pardonnez-vous mutuellement,
      comme le Seigneur vous a pardonné.

      Aimez-vous les uns les autres,
      comme il vous a aimés.

      Vous n’êtes qu’un en Jésus Christ,
      revêtez l’amour : c’est le lien parfait.

morning:
  hymn:
  - sainte-marie-et-saint-joseph
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - Chaque année, les parents de Jésus allaient à Jérusalem pour célébrer la Pâque.
  - psalm: OT_41
    antiphon:
    - L’enfant grandissait et se fortifiait, tout rempli de sagesse ; et la faveur de Dieu était sur lui.
  - psalm: PSALM_149
    antiphon:
    - Le père et la mère de l’enfant s’étonnaient de ce qu’on disait de lui.
  reading:
    biblicalReference: Dt 5, 16
    content: Honore ton père et ta mère, comme te l’a commandé le Seigneur ton Dieu, afin d’avoir longue vie et bonheur sur la terre que te donne le Seigneur ton Dieu.
  responsory: |-
    R/ Jésus, fils de Marie,
    * Tu es le Christ, le Fils du Dieu vivant.
    V/ Plein de grâce et de vérité. *
    V/ Tu te soumets à Marie et à Joseph. *
    Gloire au Père. R/ Jésus.
  evangelicAntiphon:
    common:
    - Que ta famille, Seigneur Jésus, nous soit une lumière et conduise nos pas au chemin de la paix.
  intercession:
    content: |-
      Le Fils du Dieu vivant a voulu naître dans une famille humaine ; adorons-le, supplions-le :

      R/ Sanctifie-nous, Jésus, par ton obéissance.

      Verbe éternel du Père, tu t’es soumis à Marie et à Joseph,
      — enseigne-nous l’humilité.

      Maître et Seigneur, ta mère conservait en son cœur tes paroles et tes gestes,
      — apprends-nous à garder ta parole, à la mettre en pratique.

      Créateur de l’univers, tu as été appelé fils du charpentier,
      — donne-nous ton courage et ton amour du travail.

      Toi qui as grandi en âge et en grâce dans ta famille à Nazareth,
      — rends-nous plus semblables à toi, notre chef et notre frère.

middleOfDay:
  psalmody:
  - psalm: PSALM_118-4
  - psalm: PSALM_27
  - psalm: PSALM_25
  tierce:
    antiphon: Le père et la mère de l’enfant s’étonnaient de ce qu’on disait de lui.
    reading:
      biblicalReference: Col 3, 12-13
      content: |-
        Puisque vous avez été choisis par Dieu, que vous êtes ses fidèles et ses bien-aimés, revêtez votre cœur de tendresse et de bonté, d’humilité, de douceur, de patience. Supportez-vous mutuellement et pardonnez, si vous avez des reproches à vous faire. Agissez comme le Seigneur : il vous a pardonné, faites de même.
    responsory: |-
      V/ Le Seigneur nous enseignera ses chemins,
      nous suivrons ses sentiers.
  sexte:
    antiphon: Marie retenait toutes ces paroles et les méditait dans son cœur.
    reading:
      biblicalReference: Col 3, 14-15
      content: |-
        Par-dessus tout, qu’il y ait pour vous l’amour : c’est lui qui fait l’unité dans la perfection. Et que, dans vos cœurs, règne la paix du Christ à laquelle vous avez été appelés pour former en lui un seul corps. Vivez dans l’action de grâce.
    responsory: |-
      V/ Appelez le bonheur sur Jérusalem :
      Paix à ceux qui l’aiment !
  none:
    antiphon: Mes yeux ont vu le salut que tu préparais à la face des peuples.
    reading:
      biblicalReference: Col 3, 17
      content: Tout ce que vous dites, tout ce que vous faites, que ce soit toujours au nom du Seigneur Jésus Christ, en offrant par lui votre action de grâce à Dieu le Père.
    responsory: |-
      V/ Tous tes fils seront disciples du Seigneur,
      grande sera la paix de tes fils.

vespers:
  psalmody:
  - psalm: PSALM_121
    antiphon:
    - |-
      Après trois jours, Joseph et Marie trouvèrent Jésus assis dans le Temple au milieu des docteurs : il écoutait et il interrogeait.
  - psalm: PSALM_126
    antiphon:
    - |-
      Jésus descendit avec eux de Jérusalem : il vint à Nazareth et leur était soumis.
  - psalm: NT_4
    antiphon:
    - Jésus grandissait en sagesse, en taille et en grâce, sous le regard de Dieu et des hommes.
  reading:
    biblicalReference: Ph 2, 6-7
    content: Le Christ Jésus, lui qui était dans la condition de Dieu, n’a pas jugé bon de revendiquer son droit d’être traité à l’égal de Dieu ; mais au contraire, il se dépouilla lui-même en prenant la condition de serviteur. Devenu semblable aux hommes, il a été reconnu comme un homme à son comportement.
  responsory: |-
    R/ Dieu, notre Père, béni soit ton Fils,
    * Jésus, notre Sauveur !
    V/ Il s’est anéanti, prenant la condition de serviteur, *
    V/ Devenu semblable aux hommes,
    il a demeuré parmi nous, *
    R/ Dieu, notre Père.
  evangelicAntiphon:
    common:
    - Pourquoi nous as-tu fait cela ? Nous te cherchions tout angoissés. — Pourquoi me cherchiez-vous ? Il me faut être chez mon Père.
  intercession:
    content: |-
      Adorons le Fils de Dieu, qui a voulu avoir une famille humaine :

      R/ Jésus, notre modèle, Jésus, notre Sauveur !

      Tu as voulu te soumettre à Marie et à Joseph :
      — enseigne-nous la valeur de l’obéissance et du respect.

      Tu as aimé tes parents, et tes parents t’aimaient :
      — établis les familles dans la paix et dans l’amour.

      Tu as accompli en tout les œuvres du Père :
      — donne-nous de reconnaître en toi celui que le Père a envoyé.

      Toi que Marie et Joseph ont retrouvé dans la maison du Père,
      — apprends-nous à chercher d’abord le Royaume de Dieu.

      Tu as fait partager ta gloire éternelle à Marie et à Joseph :
      — fais entrer ceux qui nous ont quittés dans la famille des saints.
mass:
- massType: day_mass
  name: Messe du jour
  note: null
  entranceAntiphon:
  - biblicalReference: Lc 2,16
    content: |-
      Les bergers vinrent en hâte,
      >et ils découvrirent Marie et Joseph,
      avec le nouveau-né couché dans la mangeoire.
  collect:
  - |-
    Tu as voulu, Seigneur Dieu,
    >que la Sainte Famille nous soit donnée en exemple ; *
    accorde-nous, dans ta bonté,
    >de pratiquer, comme elle, les vertus familiales
    >et d’être unis par les liens de ton amour, /
    afin de goûter la récompense éternelle
    >dans la joie de ta maison.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: FIRST_READING
    partContents:
    - cycle: A
      biblicalRef: Si 3, 2-6.12-14
      headline: « Celui qui craint le Seigneur honore ses parents »
      content: |-
        Le Seigneur glorifie le père dans ses enfants,
        >il renforce l’autorité de la mère sur ses fils.
        Celui qui honore son père
        >obtient le pardon de ses péchés,
        celui qui glorifie sa mère
        >est comme celui qui amasse un trésor.
        Celui qui honore son père aura de la joie dans ses enfants,
        >au jour de sa prière il sera exaucé.
        Celui qui glorifie son père verra de longs jours,
        >celui qui obéit au Seigneur donne du réconfort à sa mère.
        Mon fils, soutiens ton père dans sa vieillesse,
        >ne le chagrine pas pendant sa vie.
        Même si son esprit l’abandonne, sois indulgent,
        >ne le méprise pas, toi qui es en pleine force.
        Car ta miséricorde envers ton père ne sera pas oubliée,
        >et elle relèvera ta maison si elle est ruinée par le péché.
    - cycle: B
      biblicalRef: Gn 15, 1-6 ; 21, 1-3
      headline: « Ton héritier sera quelqu’un de ton sang »
      content: |-
        En ces jours-là,
        la parole du Seigneur fut adressée à Abram dans une vision :
        >« Ne crains pas, Abram !
        Je suis un bouclier pour toi.
        Ta récompense sera très grande. »
        Abram répondit :
        >« Mon Seigneur Dieu, que pourrais-tu donc me donner ?
        Je m’en vais sans enfant,
        >et l’héritier de ma maison, c’est Élièzer de Damas. »
        Abram dit encore :
        >« Tu ne m’as pas donné de descendance,
        >et c’est un de mes serviteurs qui sera mon héritier. »
        Alors cette parole du Seigneur fut adressée à Abram :
        >« Ce n’est pas lui qui sera ton héritier,
        >mais quelqu’un de ton sang. »
        Puis il le fit sortir et lui dit :
        >« Regarde le ciel,
        >et compte les étoiles, si tu le peux… »
        Et il déclara :
        >« Telle sera ta descendance ! »
        Abram eut foi dans le Seigneur
        >et le Seigneur estima qu’il était juste.
        Le Seigneur visita Sara
        >comme il l’avait annoncé ;
        il agit pour elle comme il l’avait dit.
        Elle devint enceinte,
        >et elle enfanta un fils pour Abraham dans sa vieillesse,
        >à la date que Dieu avait fixée.
        Et Abraham donna un nom
        >au fils que Sara lui avait enfanté :
        >il l’appela Isaac.
    - cycle: C
      biblicalRef: 1 S 1, 20-22.24-28
      headline: « Samuel demeurera à la disposition du Seigneur tous les jours de sa vie »
      content: |-
        Elcana s’unit à Anne sa femme,
        >et le Seigneur se souvint d’elle.
        Anne conçut
        >et, le temps venu, elle enfanta un fils ;
        elle lui donna le nom de Samuel (c’est-à-dire : Dieu exauce)
        car, disait-elle,
        >« Je l’ai demandé au Seigneur. »
        Elcana, son mari, monta au sanctuaire
        >avec toute sa famille
        pour offrir au Seigneur le sacrifice annuel
        >et s’acquitter du vœu pour la naissance de l’enfant.
        Mais Anne n’y monta pas.
        Elle dit à son mari :
        >« Quand l’enfant sera sevré,
        >je l’emmènerai :
        >il sera présenté au Seigneur,
        >et il restera là pour toujours. »
        Lorsque Samuel fut sevré,
        Anne, sa mère, le conduisit à la maison du Seigneur, à Silo ;
        >l’enfant était encore tout jeune.
        Anne avait pris avec elle un taureau de trois ans,
        >un sac de farine et une outre de vin.
        On offrit le taureau en sacrifice,
        >et on amena l’enfant au prêtre Éli.
        Anne lui dit alors :
        >« Écoute-moi, mon seigneur, je t’en prie !
        Aussi vrai que tu es vivant,
        >je suis cette femme qui se tenait ici près de toi
        >pour prier le Seigneur.
        C’est pour obtenir cet enfant que je priais,
        >et le Seigneur me l’a donné en réponse à ma demande.
        À mon tour je le donne au Seigneur pour qu’il en dispose.
        Il demeurera à la disposition du Seigneur
        >tous les jours de sa vie. »
        Alors ils se prosternèrent devant le Seigneur.
  - partType: PSALM
    partContents:
    - cycle: A
      biblicalRef: Ps 127 (128), 1-2, 3, 4-5
      refAbbr: 127, 1
      chorus:
      - chorusRef: 127, 1
        chorus: |-
          Heureux qui craint le Seigneur
          et marche selon ses voies !
      content: |-
        Heureux qui craint le Seigneur
        et marche selon ses voies !
        Tu te nourriras du travail de tes mains :
        Heureux es-tu ! À toi, le bonheur !

        Ta femme sera dans ta maison
        comme une vigne généreuse,
        et tes fils, autour de la table,
        comme des plants d’olivier.

        Voilà comment sera béni
        l’homme qui craint le Seigneur.
        De Sion, que le Seigneur te bénisse !
        Tu verras le bonheur de Jérusalem tous les jours de ta vie.
    - cycle: B
      biblicalRef: Ps 104 (105), 1-2, 3-4, 5-6, 8-9
      refAbbr: 104, 7a.8a
      chorus:
      - chorusRef: 104, 7a.8a
        chorus: |-
          Le Seigneur, c’est lui notre Dieu ;
          il s’est toujours souvenu de son alliance.
      content: |-
        Rendez grâce au Seigneur, proclamez son nom,
        annoncez parmi les peuples ses hauts faits ;
        chantez et jouez pour lui,
        redites sans fin ses merveilles.

        Glorifiez-vous de son nom très saint :
        joie pour les cœurs qui cherchent Dieu !
        Cherchez le Seigneur et sa puissance,
        recherchez sans trêve sa face.

        Souvenez-vous des merveilles qu’il a faites,
        de ses prodiges, des jugements qu’il prononça,
        vous, la race d’Abraham son serviteur,
        les fils de Jacob, qu’il a choisis.

        Il s’est toujours souvenu de son alliance,
        parole édictée pour mille générations :
        promesse faite à Abraham,
        garantie par serment à Isaac.
    - cycle: C
      biblicalRef: Ps 83 (84), 2-3, 5-6, 9-10
      refAbbr: 83, 5a
      chorus:
      - chorusRef: 83, 5a
        chorus: Heureux les habitants de ta maison, Seigneur !
      content: |-
        De quel amour sont aimées tes demeures,
        Seigneur, Dieu de l’univers.
        Mon âme s’épuise à désirer les parvis du Seigneur ;
        mon cœur et ma chair sont un cri vers le Dieu vivant !

        Heureux les habitants de ta maison :
        ils pourront te chanter encore !
        Heureux les hommes dont tu es la force :
        des chemins s’ouvrent dans leur cœur !

        Seigneur, Dieu de l’univers, entends ma prière ;
        écoute, Dieu de Jacob.
        Dieu, vois notre bouclier,
        regarde le visage de ton messie.
  - partType: SECOND_READING
    partContents:
    - cycle: A
      biblicalRef: Col 3, 12-21
      headline: « Vivre ensemble dans le Seigneur »
      content: |-
        Frères,
        puisque vous avez été choisis par Dieu,
        >que vous êtes sanctifiés, aimés par lui,
        revêtez-vous de tendresse et de compassion,
        >de bonté, d’humilité, de douceur et de patience.
        Supportez-vous les uns les autres,
        et pardonnez-vous mutuellement
        >si vous avez des reproches à vous faire.
        Le Seigneur vous a pardonné :
        >faites de même.
        Par-dessus tout cela, ayez l’amour,
        >qui est le lien le plus parfait.
        Et que, dans vos cœurs, règne la paix du Christ
        >à laquelle vous avez été appelés,
        >vous qui formez un seul corps.
        Vivez dans l’action de grâce.
        Que la parole du Christ habite en vous
        >dans toute sa richesse ;
        instruisez-vous et reprenez-vous les uns les autres
        >en toute sagesse ;
        >par des psaumes, des hymnes et des chants inspirés,
        chantez à Dieu, dans vos cœurs, votre reconnaissance.
        Et tout ce que vous dites, tout ce que vous faites,
        >que ce soit toujours au nom du Seigneur Jésus,
        >en offrant par lui votre action de grâce à Dieu le Père.
        Vous les femmes, soyez soumises à votre mari ;
        >dans le Seigneur, c’est ce qui convient.
        Et vous les hommes, aimez votre femme,
        >ne soyez pas désagréables avec elle.
        Vous les enfants, obéissez en toute chose à vos parents ;
        >cela est beau dans le Seigneur.
        Et vous les parents, n’exaspérez pas vos enfants ;
        >vous risqueriez de les décourager.
    - cycle: B
      biblicalRef: He 11, 8.11-12.17-19
      headline: « La foi d’Abraham, de Sara et d’Isaac »
      content: |-
        Frères,
        grâce à la foi, Abraham obéit à l’appel de Dieu :
        >il partit vers un pays
        >qu’il devait recevoir en héritage,
        et il partit sans savoir où il allait.
        Grâce à la foi, Sara, elle aussi, malgré son âge,
        fut rendue capable d’être à l’origine d’une descendance
        >parce qu’elle pensait que Dieu est fidèle à ses promesses.
        C’est pourquoi, d’un seul homme, déjà marqué par la mort,
        a pu naître une descendance aussi nombreuse
        >que les étoiles du ciel
        >et que le sable au bord de la mer,
        >une multitude innombrable.
        Grâce à la foi, quand il fut soumis à l’épreuve,
        >Abraham offrit Isaac en sacrifice.
        Et il offrait le fils unique,
        >alors qu’il avait reçu les promesses
        >et entendu cette parole :
        >C’est par Isaac qu’une descendance portera ton nom.
        Il pensait en effet
        >que Dieu est capable même de ressusciter les morts ;
        c’est pourquoi son fils lui fut rendu :
        >il y a là une préfiguration.
    - cycle: C
      biblicalRef: 1 Jn 3, 1-2.21-24
      headline: « Nous sommes appelés enfants de Dieu — et nous le sommes »
      content: |-
        Bien-aimés,
        voyez quel grand amour nous a donné le Père
        >pour que nous soyons appelés enfants de Dieu
        >- et nous le sommes.
        Voici pourquoi le monde ne nous connaît pas :
        >c’est qu’il n’a pas connu Dieu.
        Bien-aimés,
        dès maintenant, nous sommes enfants de Dieu,
        >mais ce que nous serons n’a pas encore été manifesté.
        Nous le savons : quand cela sera manifesté,
        >nous lui serons semblables
        >car nous le verrons tel qu’il est.
        Bien-aimés,
        si notre cœur ne nous accuse pas,
        >nous avons de l’assurance devant Dieu.
        Quoi que nous demandions à Dieu,
        >nous le recevons de lui,
        parce que nous gardons ses commandements,
        >et que nous faisons ce qui est agréable à ses yeux.
        Or, voici son commandement :
        >mettre notre foi
        >dans le nom de son Fils Jésus Christ,
        et nous aimer les uns les autres
        >comme il nous l’a commandé.
        Celui qui garde ses commandements demeure en Dieu,
        >et Dieu en lui ;
        et voilà comment nous reconnaissons qu’il demeure en nous,
        >puisqu’il nous a donné part à son Esprit.
  - partType: GOSPEL
    partContents:
    - cycle: A
      biblicalRef: Mt 2, 13-15.19-23
      headline: « Prends l’enfant et sa mère, et fuis en Égypte »
      acclamationAntiphon: |-
        Que, dans vos cœurs, règne la paix du Christ ;
        que la parole du Christ habite en vous
        dans toute sa richesse !
      content: |-
        Après le départ des mages,
        voici que l’ange du Seigneur apparaît en songe à Joseph
        et lui dit :
        >« Lève-toi ; prends l’enfant et sa mère,
        >et fuis en Égypte.
        Reste là-bas jusqu’à ce que je t’avertisse,
        >car Hérode va rechercher l’enfant
        >pour le faire périr. »
        Joseph se leva ;
        >dans la nuit, il prit l’enfant et sa mère,
        >et se retira en Égypte,
        >où il resta jusqu’à la mort d’Hérode,
        pour que soit accomplie
        la parole du Seigneur prononcée par le prophète :
        >D’Égypte, j’ai appelé mon fils.
        Après la mort d’Hérode,
        voici que l’ange du Seigneur apparaît en songe à Joseph en Égypte
        et lui dit :
        >« Lève-toi ; prends l’enfant et sa mère,
        >et pars pour le pays d’Israël,
        >car ils sont morts,
        >ceux qui en voulaient à la vie de l’enfant. »
        Joseph se leva,
        >prit l’enfant et sa mère,
        >et il entra dans le pays d’Israël.
        Mais, apprenant qu’Arkélaüs régnait sur la Judée
        >à la place de son père Hérode,
        il eut peur de s’y rendre.
        Averti en songe,
        >il se retira dans la région de Galilée
        >et vint habiter dans une ville appelée Nazareth,
        >pour que soit accomplie
        >la parole dite par les prophètes :
        >Il sera appelé Nazaréen.
        
    - cycle: B
    - biblicalRef: Lc 2, 22-40
      headline: « L’enfant grandissait et se fortifiait, rempli de sagesse »
      acclamationAntiphon: |-
        À bien des reprises, Dieu, dans le passé,
        a parlé à nos pères par les prophètes ;
        à la fin, en ces jours où nous sommes,
        il nous a parlé par son Fils.
      content: |-
        Quand fut accompli le temps prescrit par la loi de Moïse
        >pour la purification,
        les parents de Jésus l’amenèrent à Jérusalem
        >pour le présenter au Seigneur,
        selon ce qui est écrit dans la Loi :
        >Tout premier-né de sexe masculin
        >sera consacré au Seigneur.
        Ils venaient aussi offrir
        >le sacrifice prescrit par la loi du Seigneur :
        >un couple de tourterelles
        >ou deux petites colombes.
        Or, il y avait à Jérusalem un homme appelé Syméon.
        C’était un homme juste et religieux,
        >qui attendait la Consolation d’Israël,
        >et l’Esprit Saint était sur lui.
        Il avait reçu de l’Esprit Saint l’annonce
        >qu’il ne verrait pas la mort
        >avant d’avoir vu le Christ, le Messie du Seigneur.
        Sous l’action de l’Esprit, Syméon vint au Temple.
        Au moment où les parents présentaient l’enfant Jésus
        >pour se conformer au rite de la Loi qui le concernait,
        Syméon reçut l’enfant dans ses bras,
        et il bénit Dieu en disant :
        >« Maintenant, ô Maître souverain,
        >tu peux laisser ton serviteur s’en aller
        >en paix, selon ta parole.
        Car mes yeux ont vu le salut
        >que tu préparais à la face des peuples :
        >lumière qui se révèle aux nations
        >et donne gloire à ton peuple Israël. »
        Le père et la mère de l’enfant
        >s’étonnaient de ce qui était dit de lui.
        Syméon les bénit,
        puis il dit à Marie sa mère :
        >« Voici que cet enfant
        >provoquera la chute et le relèvement de beaucoup en Israël.
        Il sera un signe de contradiction
        >- et toi, ton âme sera traversée d’un glaive - :
        >ainsi seront dévoilées
        >les pensées qui viennent du cœur d’un grand nombre. »
        Il y avait aussi une femme prophète,
        >Anne, fille de Phanuel, de la tribu d’Aser.
        Elle était très avancée en âge ;
        >après sept ans de mariage,
        >demeurée veuve,
        >elle était arrivée à l’âge de 84 ans.
        Elle ne s’éloignait pas du Temple,
        >servant Dieu jour et nuit dans le jeûne et la prière.
        Survenant à cette heure même,
        >elle proclamait les louanges de Dieu
        >et parlait de l’enfant
        >à tous ceux qui attendaient la délivrance de Jérusalem.
        Lorsqu’ils eurent achevé
        >tout ce que prescrivait la loi du Seigneur,
        >ils retournèrent en Galilée, dans leur ville de Nazareth.
        L’enfant, lui, grandissait et se fortifiait,
        >rempli de sagesse,
        >et la grâce de Dieu était sur lui.
        
    - biblicalRef: Lc 2, 22.39-40
      headline: « L’enfant grandissait et se fortifiait, rempli de sagesse »
      acclamationAntiphon: |-
        À bien des reprises, Dieu, dans le passé,
        a parlé à nos pères par les prophètes ;
        à la fin, en ces jours où nous sommes,
        il nous a parlé par son Fils.
      content: |-
        Quand fut accompli le temps prescrit par la loi de Moïse
        >pour la purification,
        les parents de Jésus l’amenèrent à Jérusalem
        >pour le présenter au Seigneur.
        Lorsqu’ils eurent achevé tout ce que prescrivait la loi du Seigneur,
        >ils retournèrent en Galilée, dans leur ville de Nazareth.
        L’enfant, lui, grandissait et se fortifiait,
        >rempli de sagesse,
        >et la grâce de Dieu était sur lui.
        
    - cycle: C
      biblicalRef: Lc 2, 41-52
      headline: « Les parents de Jésus le trouvèrent au milieu des docteurs de la Loi »
      acclamationAntiphon: |-
        Seigneur, ouvre notre cœur
        pour nous rendre attentifs aux paroles de ton Fils.
      content: |-
        Chaque année, les parents de Jésus se rendaient à Jérusalem
        >pour la fête de la Pâque.
        Quand il eut douze ans,
        >ils montèrent en pèlerinage suivant la coutume.
        À la fin de la fête, comme ils s’en retournaient,
        le jeune Jésus resta à Jérusalem
        >à l’insu de ses parents.
        Pensant qu’il était dans le convoi des pèlerins,
        ils firent une journée de chemin
        >avant de le chercher parmi leurs parents et connaissances.
        Ne le trouvant pas, ils retournèrent à Jérusalem,
        >en continuant à le chercher.
        C’est au bout de trois jours qu’ils le trouvèrent dans le Temple,
        >assis au milieu des docteurs de la Loi :
        il les écoutait et leur posait des questions,
        et tous ceux qui l’entendaient
        >s’extasiaient sur son intelligence et sur ses réponses.
        En le voyant, ses parents furent frappés d’étonnement,
        et sa mère lui dit :
        >« Mon enfant, pourquoi nous as-tu fait cela ?
        Vois comme ton père et moi,
        >nous avons souffert en te cherchant ! »
        Il leur dit :
        >« Comment se fait-il que vous m’ayez cherché ?
        Ne saviez-vous pas qu’il me faut être chez mon Père ? »
        Mais ils ne comprirent pas ce qu’il leur disait.
        Il descendit avec eux pour se rendre à Nazareth,
        >et il leur était soumis.
        Sa mère gardait dans son cœur tous ces événements.
        Quant à Jésus, il grandissait en sagesse, en taille et en grâce,
        >devant Dieu et devant les hommes.
        
  offeringPrayer:
  - |-
    En t’offrant, Seigneur,
    >le sacrifice qui nous réconcilie avec toi,
    >nous te supplions humblement : *
    à la prière de la Vierge, la Mère de Dieu,
    >et à la prière de saint Joseph, /
    >affermis nos familles dans ta grâce et dans ta paix.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
  - nativity_of_the_lord_2
  - nativity_of_the_lord_3
  eucharisticPrayers:
  - PE1: |-
      Unis dans une même communion,
      >nous célébrons le jour très saint
      >où Marie, dans la gloire de sa virginité,
      >enfanta le Sauveur du monde;
      et, vénérant d'abord la mémoire
      >de cette Vierge bienheureuse,
      >la Mère de notre Dieu et Seigneur, Jésus Christ,
  - PE2: |-
      Toi qui es vraiment saint,
      >toi qui es la source de toute sainteté, Dieu notre Père,
      >nous voici rassemblés devant toi,
      et, dans la communion de toute l’Église,
      >nous célébrons le jour très saint
      où Marie, dans la gloire de sa virginité,
      >enfant le Sauveur du Monde.
      Par lui, notre Rédemtpeur et notre Seigneur,
      >nous te prions:
  - PE3: |-
      C’est pourquoi nous voici rassemblés devant toi, Dieu notre Père,
      et, dans la communion de toute l’Église,
      >nous célébrons le jour très saint
      où Marie, dans la gloire de sa virginité,
      >enfanta le Sauveur du monde.
      Par lui, notre Rédempteur et notre Seigneur,
      >nous te supplions de consacrer toi-même
      >les offrandes que nous apportons :
  communionAntiphon:
  - biblicalReference: Ba 3,38
    content: |-
      Notre Dieu est apparu sur la terre
      >et il a vécu parmi les hommes.
  prayerAfterCommunion:
  - |-
    Tu refais nos forces, Père très aimant,
    >par le sacrement du ciel : *
    donne-nous de toujours imiter
    >les vertus de la sainte Famille /
    et, après les épreuves de cette vie,
    >d’obtenir avec elle le bonheur sans fin.
    Par le Christ, notre Seigneur.
