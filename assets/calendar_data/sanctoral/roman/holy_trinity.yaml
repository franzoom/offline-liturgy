celebration:
  title: La Sainte Trinité
  color: white

oration:
  - Dieu notre Père, tu as envoyé dans le monde ta Parole de vérité et ton Esprit de sainteté pour révéler aux hommes ton admirable mystère ; donne-nous de professer la vrai foi en reconnaissant la gloire de l’éternelle Trinité, en adorant son Unité toute-puissante.

invitatory:
  antiphon:
  - Adorons notre Dieu, alléluia ! Adorons le Père, le Fils et l’Esprit Saint, alléluia !

firstVespers:
  hymn:
    - nous-t-adorons-seigneur
  psalmody:
    - psalm: PSALM_112
      antiphon:
        - |-
          Béni soit le nom du Seigneur : tout est de lui, tout est par lui, tout est pour lui, alléluia !
    - psalm: PSALM_147
      antiphon:
        - Gloire à toi, Dieu Très-Haut, qui envoies ta Parole et répands ton Souffle pour que se lève un peuple nouveau, alléluia !
    - psalm: NT_4
  reading:
    biblicalReference: Rm 11, 33-36
    content: Quelle profondeur dans la richesse, la sagesse et la science de Dieu ! Ses décisions sont insondables, ses chemins sont impénétrables ! Qui a connu la pensée du Seigneur ? Qui a été son conseiller ? Qui lui a donné en premier et mériterait de recevoir en retour ? Car tout est de lui, et par lui, et pour lui. À lui la gloire pour l’éternité ! Amen.
  responsory: |-
    R/ Bénis soient le Père et le Fils et le Saint-Esprit,
    * Louange et gloire éternellement !
    V/ Pas d’autre Dieu que Dieu. * Louange.
    V/ Dieu est amour : Père, Fils, Esprit Saint. * Louange.
  evangelicAntiphon:
    common:
    - |-
      Mystère du Dieu vivant et de son amour pour les hommes : le Très-Haut nous envoie son Fils et se révèle notre Père ; le Christ exalté dans la gloire nous donne son Esprit en qui nous te louons, Dieu qui es, qui étais et qui viens !
  intercession:
    content: |-
      Bénis sois-tu, Père tout-puissant :
      ta sainteté est infinie et tu nous l’offres en partage.

      R/ Nous te bénissons, alléluia,
      éternel est ton amour, alléluia.

      Béni sois-tu, Jésus, Fils bien-aimé du Père :
      Tu nous as donné de devenir enfants de Dieu.

      Béni sois-tu, Esprit du Père et du Fils :
      tu demeures en nous pour que nous vivions de Dieu.

      Béni sois-tu, Dieu l’Unique, le Saint :
      tu es la vie des vivants et des morts.

readings:
  hymn:
    - dieu-inconnu
  psalmody:
    - psalm: PSALM_8
      antiphon:
        - Gloire au Père, au Fils, au Saint Esprit. Gloire à celui qui est, qui était et qui vient.
    - psalm: PSALM_32_1
      antiphon:
        - Amour de Dieu le Père, grâce de Jésus notre Seigneur, communion de l’Esprit Saint ! Bienheureuse Trinité !
    - psalm: PSALM_32_2
      antiphon:
        - Dieu saint, Dieu juste et saint, Dieu libre et saint ! Bienheureuse Trinité !
  verse: |-
    V/ Le Seigneur a fait les cieux par sa parole
    et l’univers par le souffle de sa bouche.
  biblicalReading:
    - title: LECTURE DE LA PREMIÈRE LETTRE AUX CORINTHIENS
      subtitle: Le mystère de Dieu
      ref: 1Co 2, 1-16
      content: |-
        Frères, quand je suis venu chez vous, je ne suis pas venu vous annoncer le mystère de Dieu avec le prestige du langage ou de la sagesse. Parmi vous, je n’ai rien voulu connaître d’autre que Jésus Christ, ce Messie crucifié. Et c’est dans la faiblesse, craintif et tout tremblant, que je me suis présenté à vous. Mon langage, ma proclamation de l’Évangile, n’avaient rien d’un langage de sagesse qui veut convaincre ; mais c’est l’Esprit et sa puissance qui se manifestaient, pour que votre foi repose, non pas sur la sagesse des hommes, mais sur la puissance de Dieu.
        Pourtant, c’est bien de sagesse que nous parlons devant ceux qui sont adultes dans la foi, mais ce n’est pas la sagesse de ce monde, la sagesse de ceux qui dirigent ce monde et qui vont à leur destruction. Au contraire, ce dont nous parlons, c’est de la sagesse du mystère de Dieu, sagesse tenue cachée, établie par lui dès avant les siècles, pour nous donner la gloire. Aucun de ceux qui dirigent ce monde ne l’a connue, car, s’ils l’avaient connue, ils n’auraient jamais crucifié le Seigneur de gloire. Mais ce que nous proclamons, c’est, comme dit l’Écriture : %ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu, ce qui n’est pas venu à l’esprit de l’homme, ce que Dieu a préparé pour ceux dont il est aimé.%
        Et c’est à nous que Dieu, par l’Esprit, en a fait la révélation. Car l’Esprit scrute le fond de toutes choses, même les profondeurs de Dieu. Qui donc, parmi les hommes, sait ce qu’il y a dans l’homme, sinon l’esprit de l’homme qui est en lui ? De même, personne ne connaît ce qu’il y a en Dieu, sinon l’Esprit de Dieu. Or nous, ce n’est pas l’esprit du monde que nous avons reçu, mais l’Esprit qui vient de Dieu, et ainsi nous avons conscience des dons que Dieu nous a accordés. Nous disons cela avec un langage que nous n’apprenons pas de la sagesse humaine, mais que nous apprenons de l’Esprit ; nous comparons entre elles les réalités spirituelles. L’homme, par ses seules capacités, n’accueille pas ce qui vient de l’Esprit de Dieu ; pour lui ce n’est que folie, et il ne peut pas comprendre, car c’est par l’Esprit qu’on examine toute chose. Celui qui est animé par l’Esprit soumet tout à examen, mais lui, personne ne peut l’y soumettre. Car il est écrit : %Qui a connu la pensée du Seigneur et qui pourra l’instruire ?% Eh bien nous, nous avons la pensée du Christ !
      responsory: |-
        Nul n’a jamais vu Dieu,
        nul ne sait qu’il est Père,
        mais Jésus nous l’a révélé.

        R/ Joie de l’homme sauvé,
        monte jusqu’à nos lèvres !

        Nul ne connaît le Fils,
        nul n’en sait le mystère,
        mais les pauvres seront comblés.

        Nul ne connaît son cœur,
        nul n’en sait la misère,
        mais l’Esprit vient pour l’habiter.

        Nul ne saurait unir
        les enfants de la terre,
        mais l’amour veut tout rassembler.
  patristicReading:
    - title: LETTRE DE SAINT ATHANASE À SÉRAPION, ÉVÊQUE DE THMUIS
      subtitle: Bienheureuse Trinité, un seul Dieu !
      content: |-
        Étudions la tradition antique, la doctrine et la foi de l’Église catholique. Le Seigneur l’a donnée, les Apôtres l’ont annoncée, les Pères l’ont gardée. C’est sur elle, en effet, que l’Église a été fondée et, si quelqu’un s’en écarte, il ne peut plus être chrétien ni en porter le nom.
        Il y a donc une Trinité sainte et parfaite, reconnue comme Dieu dans le Père, le Fils et le Saint-Esprit ; elle ne comporte rien d’étranger, rien qui lui soit mêlé de l’extérieur ; elle n’est pas constituée du Créateur et du créé, mais elle est tout entière puissance créatrice et productrice. Elle est semblable à elle-même, indivisible par sa nature, et son activité est unique. En effet, le Père fait toutes choses par le Verbe dans l’Esprit Saint, et c’est ainsi que l’unité de la sainte Trinité est sauvegardée. C’est ainsi que dans l’Église est annoncé un seul Dieu, %qui règne au-dessus de tous, par tous et en tous. Au-dessus de tous%, comme Père, comme principe et source ; %par tous%, par le Verbe ; %en tous%, dans l’Esprit Saint. ~
        Saint Paul, ~ écrivant aux Corinthiens, à propos des dons spirituels, rapporte toutes choses à un seul Dieu, le Père, comme à un seul chef, lorsqu’il dit : %Les dons de la grâce sont variés, mais c’est toujours le même Esprit ; les ministères dans l’Église sont variés, mais c’est toujours le même Seigneur, les activités sont variées, mais c’est toujours le même Dieu, qui fait tout en tous%. Car les dons que l’Esprit distribue à chacun sont donnés de la part du Père par le Verbe. En effet, tout ce qui est au Père est au Fils ; c’est pourquoi les biens donnés par le Fils dans l’Esprit sont les dons spirituels du Père. Quand l’Esprit est en nous, le Verbe qui nous le donne est en nous, et dans le Verbe se trouve le Père. Et c’est ainsi que s’accomplit la parole : %Nous viendrons chez lui et nous irons demeurer auprès de lui%. Là où est la lumière, là aussi est son éclat ; là où est son éclat, là aussi est son activité et sa grâce resplendissante.
        C’est cela encore que Paul enseignait dans la seconde lettre aux Corinthiens : %Que la grâce de Jésus Christ notre Seigneur, l’amour de Dieu et la communion de l’Esprit Saint soient avec vous tous%. En effet, la grâce et le don accordés dans la Trinité sont donnés de la part du Père, par le Fils, dans l’Esprit Saint. De même que la grâce accordée vient du Père par le Fils, ainsi la communion au don ne peut se faire en nous sinon dans l’Esprit Saint. C’est en participant à lui que nous avons l’amour du Père, la grâce du Fils et la communion de l’Esprit Saint.
      responsory: |-
        Nul ne saurait unir
        les enfants de la terre,
        mais l’amour veut tout rassembler.

        R/ Joie de l’homme sauvé,
        monte jusqu’à nos lèvres !

morning:
  hymn:
    - nous-te-louons-seigneur
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - |-
          Esprit de Jésus, sois la source qui murmure en nos cœurs assoiffés : Viens vers le Père !
    - psalm: OT_41
      antiphon:
        - À lui, haute gloire, louange éternelle !
    - psalm: PSALM_149
      antiphon:
        - De toutes les nations, faites des disciples ; baptisez-les au nom du Père, du Fils et de l’Esprit.
  reading:
    biblicalReference: 1Co 12, 4-6
    content: Les dons de la grâce sont variés, mais c’est toujours le même Esprit. Les fonctions dans l’Église sont variées, mais c’est toujours le même Seigneur. Les activités sont variées, mais c’est toujours le même Dieu qui agit en tous.
  responsory: |-
    R/ Un seul Seigneur, une seule foi,
    un seul baptême, un seul Dieu et Père !
    V/ Appelés à garder l’unité de l’Esprit
    par le lien de la paix,
    nous chantons et nous proclamons :R/
    V/ Appelés à former un seul corps
    dans un seul Esprit,
    nous chantons et nous proclamons :R/
  evangelicAntiphon:
    common:
      - Bénie soit la Trinité sainte et une, qui crée et gouverne toutes choses maintenant et dans les siècles sans fin.
  intercession:
    content: |-
      Adorons le Père, le Fils et l’Esprit Saint, rendons gloire à Dieu, l’Unique :

      R/ Gloire et louange à notre Dieu !

      Père très saint, nous ne savons pas comment prier, accorde-nous ton Saint-Esprit :
      — qu’il vienne en aide à notre faiblesse.

      Père tout-puissant, tu as envoyé l’Esprit de ton Fils en nos cœurs pour dire : Abba !
      — nous qui t’appelons Père, fais-nous tes héritiers dans le Christ.

      Jésus, Fils de Dieu, tu as demandé au Père le Défenseur pour ton Église :
      — laisse-nous conduire par l’Esprit de vérité.

      Jésus, ressuscité d’entre les morts, tu as envoyé l’Esprit consolateur à tes disciples :
      — qu’il nous rende prêts à témoigner pour toi.

      Esprit du Père et du Fils, fais mûrir tes fruits en nos cœurs :
      — patience et douceur, charité, joie et paix.

middleOfDay:
  psalmody:
    - psalm: PSALM_117_1
    - psalm: PSALM_117_2
    - psalm: PSALM_117_3
  tierce:
    antiphon: Vers la troisième heure, l’Esprit qui procède du Père se répandit sur les disciples du Christ.
    reading:
      biblicalReference: 2Co 1, 21-22
      content: |-
        Celui qui nous rend solides pour le Christ dans nos relations avec vous, celui qui nous a consacrés, c’est Dieu ; il a mis sa marque sur nous, et il nous a fait une première avance sur ses dons : l’Esprit qui habite nos cœurs.
    responsory: |-
      V/ Venez dans la maison de Dieu lui rendre grâce.
      Rendons gloire au Père et au Fils et au Saint Esprit.
  sexte:
    antiphon: Dans un grand cri, Jésus remit à son Père son Esprit.
    reading:
      biblicalReference: Ga 4, 4.5-6
      content: |-
        Dieu a envoyé son Fils pour faire de nous des fils. Et voici la preuve que vous êtes des fils : envoyé de Dieu, l’Esprit de son Fils est dans nos cœurs, et il crie vers le Père en l’appelant « Abba ! ».
    responsory: |-
      V/ Ô bienheureuse Trinité, glorieuse et bénie,
      Père, Fils et Saint-Esprit.
  none:
    antiphon: |-
      Jésus exulta dans l’Esprit : Je te bénis, Père, Seigneur du ciel et de la terre, toi qui révèles aux petits les mystères du Royaume.
    reading:
      biblicalReference: Ap 7, 12
      content: Amen ! Louange, gloire, sagesse et action de grâce, honneur, puissance et force à notre Dieu, pour les siècles des siècles ! Amen !
    responsory: |-
      V/ Béni sois-tu, Seigneur, au firmament du ciel :
      À toi, louange et gloire, éternellement.

vespers:
  hymn:
    - nous-t-acclamons-seigneur
  psalmody:
    - psalm: PSALM_109
      antiphon:
        - Jésus notre Sauveur, poussé par l’Esprit éternel, s’offrit lui-même à Dieu son Père.
    - psalm: PSALM_113A
      antiphon:
        - |-
          L’Esprit rend ce témoignage : Dieu nous a donné la vie, qui est son Fils.
    - psalm: NT_12
      antiphon:
        - Alléluia, alléluia, alléluia !
  reading:
    biblicalReference: Ep 4, 3-6
    content: Ayez à cœur de garder l’unité dans l’Esprit par le lien de la paix. Comme votre vocation vous a tous appelés à une seule espérance, de même, il n’y a qu’un seul Corps et un seul Esprit. Il n’y a qu’un seul Seigneur, une seule foi, un seul baptême, un seul Dieu et Père de tous, qui règne au-dessus de tous, par tous, et en tous.
  responsory: |-
    R/ Un seul Seigneur, une seule foi,
    un seul baptême, un seul Dieu et Père !
    V/ Appelés à former un seul Corps dans un seul Esprit,
    nous chantons et nous proclamons :R/
    V/ Appelés à partager une seule espérance dans le Christ,
    nous chantons et nous proclamons :R/
  evangelicAntiphon:
    common:
      - |-
        Mystère du Dieu vivant et de son amour pour les hommes : le Très-Haut nous envoie son Fils et se révèle notre Père ; le Christ exalté dans la gloire nous donne son Esprit en qui nous te louons, Dieu qui es, qui étais et qui viens !
  intercession:
    content: |-
      Bénis sois-tu, Père tout-puissant :
      ta sainteté est infinie et tu nous l’offres en partage.

      R/ Nous te bénissons, alléluia,
      éternel est ton amour, alléluia.

      Béni sois-tu, Jésus, Fils bien-aimé du Père :
      Tu nous as donné de devenir enfants de Dieu.

      Béni sois-tu, Esprit du Père et du Fils :
      tu demeures en nous pour que nous vivions de Dieu.

      Béni sois-tu, Dieu l’Unique, le Saint :
      tu es la vie des vivants et des morts.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Béni soit Dieu le Père, et le Fils unique de Dieu,
      >ainsi que le Saint-Esprit,
      >car il nous a montré sa miséricorde.
  collect:
  - |-
    Dieu notre Père, +
    >tu as envoyé dans le monde
    >le Verbe de vérité et l’Esprit qui sanctifie
    >pour révéler aux hommes ton admirable mystère ; *
    donne-nous de professer la vraie foi
    >en reconnaissant la gloire de l’éternelle Trinité, /
    >en adorant son Unité dans sa toute-puissance.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ex 34, 46-6.8-9
      cycle:
      - A
      headline: |-
        « Le Seigneur, le Seigneur, Dieu tendre et miséricordieux »
      content: |-
        En ces jours-là,
        Moïse se leva de bon matin, et il gravit la montagne du Sinaï
        >comme le Seigneur le lui avait ordonné.
        Il emportait les deux tables de pierre.
        Le Seigneur descendit dans la nuée
        >et vint se placer là, auprès de Moïse.
        Il proclama son nom qui est : LE SEIGNEUR.
        Il passa devant Moïse et proclama :
        >LE SEIGNEUR, LE SEIGNEUR,
        >Dieu tendre et miséricordieux,
        >lent à la colère, plein d’amour et de vérité. »
        Aussitôt Moïse s’inclina jusqu’à terre et se prosterna .
        Il dit :
        >« S’il est vrai, mon Seigneur , que j’ai trouvé grâce à tes yeux,
        >daigne marcher au milieu de nous.
        >Oui, c’est un peuple à la nuque raide ;
        >mais tu pardonneras nos fautes et nos péchés,
        >et tu feras de nous ton héritage. »
    - biblicalRef: Dt 4, 32-34.39-40
      cycle:
      - B
      headline: |-
        « C’est le Seigneur qui est Dieu, qui est là-haut dans le ciel comme ici-bas sur la terre ; il n y en a pas d’autre. »
      content: |-
        Moïse disait au peuple :
        >« Interroge donc les temps anciens qui t’ont précédé,
        >>depuis le jour où Dieu créa l’homme sur la terre :
        >d’un bout du monde à l’autre ,
        >>est-il arrivé quelque chose d’aussi grand,
        >>a-t-on jamais connu rien de pareil ?
        >Est-il un peuple qui ait entendu comme toi
        >>la voix de Dieu parlant du milieu du feu,
        >>et qui soit resté en vie ?
        >Est-il un dieu qui ait entrepris de se choisir une nation,
        >>de venir la prendre au milieu d’une autre,
        à travers des épreuves, des signes, des prodiges et des combats,
        >>à main forte et à bras étendu,
        >>et par des exploits terrifiants
        >>comme tu as vu le Seigneur ton Dieu
        >>le faire pour toi en Égypte ?
        >Sache donc aujourd’hui, et médite cela en ton cœur :
        >c’est le Seigneur qui est Dieu,
        >>là-haut dans le ciel comme ici-bas sur la terre ;
        >il n’y en a pas d’autre .
        >Tu garderas les décrets et les commandements du Seigneur
        >>que je te donne aujourd’hui,
        >afin d’avoir , toi et tes flls, bonheur et longue vie
        >>sur la terre que te donne le Seigneur ton Dieu, tous les jours. »
    - biblicalRef: Pr 8, 22-31
      cycle:
      - C
      headline: |-
        La Sagesse a été conçue avant l’apparition de la terre.
      content: |-
        Écoutez ce que déclare la Sagesse de Dieu :
        >« Le Seigneur m’a faite pour lui,
        >>principe de son action,
        >>première de ses œuvres, depuis toujours.
        >Avant les siècles j’ai été formée,
        >>dès le commencement, avant l’apparition de la terre.

        >Quand les abîmes n’existaient pas encore, je fus enfantée,
        >>quand n’étaient pas les sources jaillissantes.
        >Avant que les montagnes ne soient fixées,
        >>avant les collines, je fus enfantée,
        >avant que le Seigneur n’ait fait la terre et l’espace,
        >>les éléments primitifs du monde.

        >Quand il établissait les cieux, j’étais là,
        >>quand il traçait l’horizon à la surface de l’abîme,
        >qu’il amassait les nuages dans les hauteurs
        >>et maîtrisait les sources de l’abîme,
        >quand il imposait à la mer ses limites,
        >>si bien que les eaux ne peuvent enfreindre son ordre,
        >>quand il établissait les fondements de la terre.
        >Et moi, je grandissais à ses côtés.

        >Je faisais ses délices jour après jour,
        >>jouant devant lui à tout moment,
        >jouant dans l’univers, sur sa terre,
        >>et trouvant mes délices avec les ftls des hommes. »
  - partType: PSALM
    partContents:
    - biblicalRef: Dn 3, 52, 53, 54, 55, 56
      cycle:
      - A
      refAbbr: Dn 3
      chorus:
      - chorusRef: Dn 3, 52
        content: À toi, louange et gloire éternellement ! 
      content: |-
        Béni sois-tu, Seigneur, Dieu de nos pères :
        R/ À toi, louange et gloire éternellement !

        Béni soit le nom très saint de ta gloire :
        R/ À toi, louange et gloire éternellement !

        Béni sois-tu dans ton saint temple de gloire :
        R/ À toi, louange et gloire éternellement !

        Béni sois-tu sur le trône de ton règne :
        R/ À toi, louange et gloire éternellement !

        Béni sois-tu, toi qui sondes les abîmes :
        R/ À toi, louange et gloire éternellement !

        Toi qui sièges au-dessus des Kéroubim :
        R/ À toi, louange et gloire éternellement !

        Béni sois-tu au firmament, dans le ciel :
        R/ À toi, louange et gloire éternellement !
    - biblicalRef: Ps 32 (33), 4-5, 6.9, 18-19, 20.22
      cycle:
      - B
      refAbbr: Ps 32
      chorus:
      - chorusRef: Ps 32,12a
        content: |-
          Heureux le peuple
          dont le Seigneur est le Dieu.
      content: |-
        Oui, elle est droite, la parole du Seigneur ;
        il est fidèle en tout ce qu’il fait.
        Il aime le bon droit et la justice ;
        la terre est remplie de son amour.

        Le Seigneur a fait les cieux par sa parole,
        l’univers, par le souffle de sa bouche.
        Il parla, et ce qu’il dit exista ;
        il commanda, et ce qu’il dit survint.

        Dieu veille sur ce.ux qui le craignent,
        qui mettent leur espoir en son amour,
        pour les délivrer de la mort,
        les garder en vie aux jours de famine.

        Nous attendons notre vie du Seigneur :
        il est pour nous un appui, un bouclier.
        Que ton amour, Seigneur, soit sur nous
        comme notre espoir est en toi !
    - biblicalRef: Ps 8, 4-5, 6-7, 8-9
      cycle:
      - C
      refAbbr: Ps 8
      chorus:
      - chorusRef: Ps 8,2
        content: |-
          Ô Seigneur, notre Dieu,
          qu’il est grand, ton nom, par toute la terre !
      content: |-
        À voir ton ciel, ouvrage de tes doigts,
        la lune et les étoiles que tu fixas,
        qu’est-ce que l’homme pour que tu penses à lui ,
        le fils d’un homme, que tu en prennes souci ?

        Tu l’as voulu un peu moindre qu’un dieu,
        le couronnant de gloire et d’honneur ;
        tu l’établis sur les œuvres de tes mains,
        tu mets toute chose à ses pieds.

        Les troupeaux de bœufs et de brebis,
        et même les bêtes sauvages,
        les oiseaux du ciel et les poissons de la mer,
        tout ce qui va son chemin dans les eaux.
  - partType: READING_2
    partContents:
    - biblicalRef: 2Co 13, 11-13
      cycle:
      - A
      headline: |-
        « La grâce de Jésus Christ, l’amour de Dieu et la communion du Saint-Esprit »
      content: |-
        Frères,
        soyez dans la joie,
        cherchez la perfection,
        encouragez-vous,
        soyez d’accord entre vous,
        vivez en paix,
        >et le Dieu d’amour et de paix sera avec vous.
        Saluez-vous les uns les autres
        >par un baiser de paix.
        Tous les fidèles vous saluent.

        Que la grâce du Seigneur Jésus Christ,
        l’amour de Dieu
        et la communion du Saint-Esprit
        >soient avec vous tous.
    - biblicalRef: Rm 8, 14-17
      cycle:
      - B
      headline: |-
        « Vous avez reçu un Esprit qui fait de vous des fils ; en lui nous crions "Abba l’ : Père ! »
      content: |-
        Frères,
        tous ceux qui se laissent conduire par l’Esprit de Dieu,
        >ceux-là sont fils de Dieu.
        Vous n’avez pas reçu un esprit qui fait de vous des esclaves
        >et vous ramène à la peur ;
        mais vous avez reçu un Esprit qui fait de vous des fils ;
        >et c’est en lui que nous crions « %Abba% ! »,
        >c’est-à-dire : Père !
        C’est donc l’Esprit Saint lui-même qui atteste à notre esprit
        >que nous sommes enfants de Dieu.
        Puisque nous sommes ses enfants,
        >nous sommes aussi ses héritiers :
        >héritiers de Dieu,
        >héritiers avec le Christ,
        si du moins nous souffrons avec lui
        >pour être avec lui dans la gloire.
    - biblicalRef: Rm 5, 1-5
      cycle:
      - C
      headline: |-
        Vers Dieu par le Christ dans l’amour répandu par l’Esprit
      content: |-
        Frères,
        nous qui sommes devenus justes par la foi,
        nous voici en paix avec Dieu
        >par notre Seigneur Jésus Christ,
        lui qui nous a donné, par la foi,
        >l’accès à cette grâce
        >dans laquelle nous sommes établis ;
        et nous mettons notre fierté
        >dans l’espérance d’avoir part à la gloire de Dieu.
        Bien plus, nous mettons notre fierté
        >dans la détresse elle-même,
        puisque la détresse, nous le savons, produit la persévérance ;
        >la persévérance produit la vertu éprouvée ;
        >la vertu éprouvée produit l’espérance ;
        et l’espérance ne déçoit pas,
        puisque l’amour de Dieu a été répandu dans nos cœurs
        >par l’Esprit Saint qui nous a été donné.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 3,16-18
      cycle:
      - A
      headline: |-
        « Dieu a envoyé son Fils, pour que, par lui, le monde soit sauvé »
      acclamationAntiphon: |-
        Gloire au Père, et au Fils, et au Saint-Esprit :
        au Dieu qui est, qui était et qui vient !
      content: |-
        Dieu a tellement aimé le monde
        >qu’il a donné son Fils unique,
        afin que quiconque croit en lui ne se perde pas,
        >mais obtienne la vie éternelle.
        Car Dieu a envoyé son Fils dans le monde,
        >non pas pour juger le monde,
        >mais pour que, par lui, le monde soit sauvé.
        Celui qui croit en lui échappe au Jugement ;
        celui qui ne croit pas est déjà jugé,
        >du fait qu’il n’a pas cru au nom du Fils unique de Dieu.
    - biblicalRef: Mt 28, 16-20
      cycle:
      - B
      headline: |-
        « Baptisez-les au nom du Père, et du Fils, et du Saint-Esprit »
      acclamationAntiphon: |-
        Gloire au Père, et au Fils, et au Saint-Esprit :
        au Dieu qui est, qui était et qui vient !
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        >à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        >mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        >« Tout pouvoir m’a été donné au ciel et sur la terre.
        >Allez ! De toutes les nations faites des disciples :
        >baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        >apprenez-leur à observer
        >tout ce que je vous ai commandé.
        >Et moi, je suis avec vous
        >tous les jours jusqu’à la fin du monde. »
    - biblicalRef: Jn 16, 12-15
      cycle:
      - C
      headline: |-
        « Tout ce que possède le Père est à moi ;
        l’Esprit reçoit ce qui vient de moi pour vous le faire connaître »
      acclamationAntiphon: |-
        Gloire au Père, et au Fils, et au Saint-Esprit :
        au Dieu qui est, qui était et qui vient !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« J’ai encore beaucoup de choses à vous dire,
        >>mais pour l’instant vous ne pouvez pas les porter.
        >Quand il viendra, lui, l’Esprit de vérité,
        >>il vous conduira dans la vérité tout entière.
        >En effet, ce qu’il dira ne viendra pas de lui-même :
        >>mais ce qu’il aura entendu, il le dira ;
        >>et ce qui va venir, il vous le fera connaître.
        >Lui me glorifiera,
        >>car il recevra ce qui vient de moi
        >>pour vous le faire connaître.
        >Tout ce que possède le Père est à moi ;
        >voilà pourquoi je vous ai dit :
        >>L’Esprit reçoit ce qui vient de moi
        >>pour vous le faire connaître. »
  offeringPrayer:
  - |-
    Nous t’en prions, Seigneur notre Dieu : +
    >par ton nom que nous invoquons,
    >sanctifie ces présents offerts par ceux qui te servent, *
    et, fais de nous-mêmes, par ces dons, /
    >une éternelle offrande à ta gloire.
    Par le Christ, notre Seigneur.
  prefaceList:
  - holy_trinity
  communionAntiphon:
  - biblicalReference: cf. Ga 4, 6
    content: |-
      Puisque vous êtes des fils,
      >Dieu a envoyé dans vos cœurs
      >l’Esprit de son Fils, qui crie %Abba%, c’est-à-dire : Père !
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >puissions-nous trouver le salut de l’âme et du corps
    >dans notre communion à ce sacrement, *
    et dans la profession de notre foi
    >en la Trinité, éternelle et sainte, /
    >comme en son indivisible Unité.
    Par le Christ, notre Seigneur. 