celebration:
  title: Saint Ignace d’Antioche
  subtitle: évêque et martyr
  description: |-
    L’évêque Ignace d’Antioche fut jeté aux bêtes à Rome vers l’an 110. Au gré des escales du voyage qui le conduisait vers le supplice, il adressa à diverses Églises des lettres d’où monte l’un des plus beaux chants d’amour qui aient jailli d’un cœur chrétien : « Laissez moi recevoir la pure lumière. Il n’y a plus en moi qu’une eau vive qui murmure : Viens vers le Père ».
  commons:
  - martyr
  - pastors_bishop
  color: red

oration:
  - Dieu éternel et tout-puissant, tu veux que le témoignage des saints martyrs soit l’honneur du corps tout entier de l’Église ; fais que la passion de saint Ignace d’Antioche, qui lui valut une gloire éternelle, soit aussi pour nous une source de courage.

readings:
  patristicReading:
    - title: LETTRE DE SAINT IGNACE AUX ROMAINS
      content: |-
        J’écris, moi, à toutes les Églises, et je fais savoir à tous que de grand cœur je mourrai pour Dieu, si vous ne m’en empêchez pas. Je vous en supplie, ne me portez pas une pitié importune. Laissez-moi devenir la pâture des bêtes : elles m’aideront à atteindre Dieu. Je suis son froment : moulu sous la dent des fauves, je deviendrai le pain pur du Christ. ~
        Suppliez le Christ pour que ces animaux fassent de moi une victime offerte à Dieu. ~
        Que me feraient les douceurs de ce monde et les empires de la terre ? II est plus beau de mourir pour le Christ Jésus que de régner jusqu’aux extrémités de l’univers. C’est lui que je cherche, qui est mort pour nous ; c’est lui que je désire, lui qui a ressuscité pour nous. Mon enfantement approche. De grâce, mes frères. Ne m’empêchez pas de vivre, ne complotez pas ma mort. Ne livrez pas au monde ni aux séductions de la terre celui qui veut appartenir à Dieu. Laissez-moi embrasser la lumière toute pure.
        Quand j’y aurai réussi, je serai homme. Acceptez que j’imite la passion de mon Dieu. Si quelqu’un le possède en lui, qu’il se laisse fléchir par mon appel ; il connaît l’angoisse qui m’étreint ; qu’il ait pitié de moi.
        Le Prince de ce monde entend m’arracher à Dieu et abîmer les sentiments que je lui porte. Vous qui serez là, ne volez pas à son secours. Soyez plutôt de mon côté, c’est-à-dire du côté de Dieu. N’ayez pas Jésus Christ sur les lèvres et le monde dans le cœur. Ne vous laissez pas gagner par l’envie. Quand je serai près de vous, restez sourds aux appels que je vous lancerai peut-être. Fiez-vous plutôt à ce que je vous écris. Car c’est en pleine vie que j’affirme ma volonté de mourir. Mes passions ? Crucifiées. En moi, plus de feu qu’attise la matière, mais une eau vive qui murmure et chuchote à mon cœur : « Viens auprès du Père. » Je ne peux plus savourer les nourritures périssables ou les douceurs de cette vie. C’est du pain de Dieu que je suis affamé, de la chair de Jésus Christ, fils de David ; et pour boisson, je veux son sang, qui est l’incorruptible amour.
        Je ne tiens plus à vivre parmi les hommes. Il dépend de vous que mon vœu soit exaucé. Partagez mon désir, afin qu’un jour l’on partage aussi le vôtre. Je vous le demande en peu de mots. Croyez-moi. Jésus Christ témoignera de ma sincérité, par sa bouche sans mensonge en laquelle le Père a parlé en vérité.
        Priez pour ma victoire. Ce n’est pas mon corps qui m’inspire cette requête, c’est l’esprit de Dieu. Ma mort apportera la preuve de votre tendresse. Mais si j’échappe au supplice, c’est que vous m’aurez haï.
      responsory: |-
        R/ Sur nous repose l’Esprit de gloire,
        l’Esprit de Dieu, alléluia !

        Si l’on nous outrage pour le nom du Christ,
        heureux sommes-nous.

        Il rôde, l’adversaire, cherchant qui dévorer,
        mais le Christ est parmi nous,
        et nous sommes appelés de son nom.

        Si nous avons part aux souffrances du Christ,
        réjouissons-nous : quand se révélera sa gloire,
        nous serons dans la joie.

morning:
  evangelicAntiphon:
    common: |-
      C’est lui que je cherche : il est mort pour nous. C’est lui que je désire : il est ressuscité.

vespers:
  evangelicAntiphon:
    common: Je désire le pain de Dieu, le corps de Jésus Christ, fils de David. Je veux boire à la coupe du sang, je veux l’impérissable amour.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Ga 2,19-20
    content: |-
      Avec le Christ, je suis fixé à la croix :
      >je vis, mais ce n’est plus moi, c’est le Christ qui vit en moi.
      Je vis dans la foi au Fils de Dieu
      >qui m’a aimé et s’est livré lui-même pour moi.
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >par le témoignage des saints martyrs,
    >tu embellis ta sainte Église corps de ton Fils ; *
    nous t’en prions :
    de même que la passion du bienheureux Ignace d’Antioche,
    >célébrée en ce jour,
    >lui valut une gloire éternelle ; /
    fais qu’elle nous procure aussi
    >ta protection à jamais.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ph 3, 17 - 4, 1
      headline: « Nous sommes citoyens des cieux »
      content: |-
        Frères,
        ensemble imitez-moi,
        et regardez bien ceux qui se conduisent
        >selon l’exemple que nous vous donnons.
        Car je vous l’ai souvent dit,
        >et maintenant je le redis en pleurant :
        beaucoup de gens se conduisent en ennemis de la croix du Christ.
        Ils vont à leur perte.
        Leur dieu, c’est leur ventre,
        >et ils mettent leur gloire dans ce qui fait leur honte ;
        >ils ne pensent qu’aux choses de la terre.
        Mais nous, nous avons notre citoyenneté dans les cieux,
        >d’où nous attendons comme sauveur
        >le Seigneur Jésus Christ,
        lui qui transformera nos pauvres corps
        >à l’image de son corps glorieux,
        avec la puissance active qui le rend même capable
        >de tout mettre sous son pouvoir.
        Ainsi, mes frères bien-aimés pour qui j’ai tant d’affection,
        >vous, ma joie et ma couronne,
        tenez bon dans le Seigneur, mes bien-aimés.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6-7, 8-9
      refAbbr: cf 33, 5b
      chorus:
      - chorusRef: cf 33, 5b
        chorus: |-
          De toutes mes frayeurs,
          le Seigneur me délivre.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.

        L’ange du Seigneur campe alentour
        pour libérer ceux qui le craignent.
        Goûtez et voyez : le Seigneur est bon !
        Heureux qui trouve en lui son refuge !

        Saints du Seigneur, adorez-le :
        rien ne manque à ceux qui le craignent.
        Des riches ont tout perdu, ils ont faim ;
        qui cherche le Seigneur ne manquera d’aucun bien.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 12, 24-26
      headline: « Si le grain de blé meurt, il porte beaucoup de fruit »
      acclamationAntiphon: |-
        Heureux l’homme
        qui supporte l’épreuve avec persévérance,
        car, sa valeur une fois vérifiée, il recevra la couronne de la vie.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Amen, amen, je vous le dis :
        >si le grain de blé tombé en terre ne meurt pas,
        >il reste seul ;
        >mais s’il meurt,
        >il porte beaucoup de fruit.
        Qui aime sa vie
        >la perd ;
        >qui s’en détache en ce monde
        >la gardera pour la vie éternelle.
        Si quelqu’un veut me servir,
        >qu’il me suive ;
        >et là où moi je suis,
        >là aussi sera mon serviteur.
        Si quelqu’un me sert,
        >mon Père l’honorera. »
        >Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Accepte, Seigneur,
    >l’offrande que nous te présentons de tout cœur, *
    toi qui as accueilli le bienheureux Ignace d’Antioche, /
    >froment du Christ, devenu par son martyre un pain très pur.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: null
    content: |-
      Saint Ignace disait :
      « Je suis le froment de Dieu,
      je dois être moulu sous la dent des bêtes
      >pour devenir le pain très pur du Christ. »
  prayerAfterCommunion:
  - |-
    Seigneur, que le pain du ciel,
    >reçu en la fête du bienheureux Ignace, refasse nos forces *
    >et nous donne d’être chrétiens, /
    >tant par le nom que par nos actes.
    Par le Christ, notre Seigneur.