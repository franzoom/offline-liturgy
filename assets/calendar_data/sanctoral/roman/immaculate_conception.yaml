celebration:
  title: Immaculée Conception
  description: |-
    Dès le premier instant de sa vie, Marie a été préservée de tout péché par une grâce venant déjà de la mort de son Fils. La conception immaculée de Marie est donc fondée sur sa maternité divine. Comme en son assomption, Marie est, en son immaculée conception, l’image anticipée de l’Église, que Dieu a voulue « sans tache, ni ride, mais sainte et immaculée ».
  commons:
  - virgin-mary
  color: white

oration:
- Seigneur, tu as préparé à ton Fils une demeure digne de lui par la conception immaculée de la Vierge ; puisque tu l’as préservée de tout péché par une grâce venant déjà de la mort de ton Fils, accorde-nous, à l’intercession de cette Mère très pure, de parvenir jusqu’à toi, purifiés, nous aussi, de tout mal.

firstVespers:
  psalmody:
  - psalm: PSALM_112
    antiphon:
    - Je mettrai l’hostilité entre toi et la femme, entre ta descendance et sa descendance.
  - psalm: PSALM_147
    antiphon:
    - Le Seigneur m’a vêtue des vêtements du salut, il m’a couverte du manteau de la justice.
  - psalm: NT_4
    antiphon:
    - Réjouis-toi, Marie, comblée de grâce, le Seigneur est avec toi.
  reading:
    biblicalReference: Rm 8, 29a-30
    content: Ceux qu’il connaissait par avance, Dieu les a aussi destinés à être l’image de son Fils. Ceux qu’il destinait à cette ressemblance, il les a aussi appelés ; ceux qu’il a appelés, il en a fait des justes.
  responsory: |-
    R/ Avec toi, Marie, Mère du Sauveur,
    * nous glorifions la puissance de Dieu.
    V/ J’exulte de joie dans le Seigneur,
    et mon esprit tressaille en mon Dieu. *
    V/ Il m’a vêtue des vêtements du salut
    et m’a couverte du manteau de la justice. *
    V/ Le Seigneur fera germer l’action de grâce
    devant toutes les nations. R/
  evangelicAntiphon:
    common:
    - |-
      Le Seigneur a fait pour toi des merveilles : tous les âges te diront bienheureuse.

readings:
  hymn:
  - voici-l-aurore-avant-le-jour
  psalmody:
  - psalm: PSALM_23
    antiphon:
    - Marie obtiendra bénédiction du Seigneur, et justice de Dieu, son Sauveur.
  - psalm: PSALM_45
    antiphon:
    - Dieu la reconnut dès l’aurore, le Très-Haut a sanctifié sa demeure.
  - psalm: PSALM_86
    antiphon:
    - |-
      On chante ta gloire, ô Marie : car le Puissant a fait pour toi des merveilles.
  verse: |-
    V/ Le Seigneur m’a comblée de joie,
    il m’a revêtue de sainteté.
  biblicalReading:
  - title: LECTURE DE LA LETTRE AUX ROMAINS
    subtitle: Là où le péché a proliféré, la grâce a surabondé
    ref: Rm 5, 12-21
    content: |-
      Nous savons que par un seul homme, le péché est entré dans le monde, et que par le péché est venue la mort ; et ainsi, la mort est passée en tous les hommes, étant donné que tous ont péché. Avant la loi de Moïse, le péché était déjà dans le monde, mais le péché ne peut être imputé à personne tant qu’il n’y a pas de loi. Pourtant, depuis Adam jusqu’à Moïse, la mort a établi son règne, même sur ceux qui n’avaient pas péché par une transgression semblable à celle d’Adam. Or, Adam préfigure celui qui devait venir.
      Mais il n’en va pas du don gratuit comme de la faute. En effet, si la mort a frappé la multitude par la faute d’un seul, combien plus la grâce de Dieu s’est-elle répandue en abondance sur la multitude, cette grâce qui est donnée en un seul homme, Jésus Christ. Le don de Dieu et les conséquences du péché d’un seul n’ont pas la même mesure non plus : d’une part, en effet, pour la faute d’un seul, le jugement a conduit à la condamnation ; d’autre part, pour une multitude de fautes, le don gratuit de Dieu conduit à la justification. Si, en effet, à cause d’un seul homme, par la faute d’un seul, la mort a établi son règne, combien plus, à cause de Jésus Christ et de lui seul, régneront-ils dans la vie, ceux qui reçoivent en abondance le don de la grâce qui les rend justes.
      Bref, de même que la faute commise par un seul a conduit tous les hommes à la condamnation, de même l’accomplissement de la justice par un seul a conduit tous les hommes à la justification qui donne la vie. En effet, de même que par la désobéissance d’un seul être humain la multitude a été rendue pécheresse, de même par l’obéissance d’un seul la multitude sera-t-elle rendue juste. Quant à la loi de Moïse, elle est intervenue pour que se multiplie la faute ; mais là où le péché s’est multiplié, la grâce a surabondé. Ainsi donc, de même que le péché a établi son règne de mort, de même la grâce doit établir son règne en rendant juste pour la vie éternelle par Jésus Christ notre Seigneur.
    responsory: |-
      Voici la nouvelle Genèse :
      en toi, Vierge immaculée,
      la grâce originelle refleurit.
      Notre terre n’est plus maudite,
      nous la verrons bientôt
      donner le fruit de vie.

      R/ Avec toi, Marie, Mère du Sauveur,
      nous glorifions la puissance de Dieu.

      J’exulte de joie dans le Seigneur
      et mon esprit tressaille en mon Dieu.

      Il m’a revêtue des vêtements du salut
      et m’a couverte du manteau de la justice.

      Le Seigneur fera germer l’action de grâce
      devant toutes les nations.

  patristicReading:
  - title: PRIÈRE DE SAINT ANSELME À MARIE
    content: |-
      Le ciel et les astres, la terre et les fleuves, le jour et la nuit, et tout ce qui obéit ou sert à l’homme, se félicite d’être par toi, ô notre Dame, rendu en quelque sorte à sa beauté première, et même doté d’une grâce nouvelle et ineffable. Car tous, pour ainsi dire, étaient morts, alors que dépouillés de leur dignité naturelle, qui est d’être au pouvoir et au service de ceux qui louent Dieu — c’est là le motif même de leur création — ils étaient opprimés et dégradés par un culte idolâtrique, étranger au but de leur existence. Ils se réjouissent donc d’être comme ressuscités, puisque désormais les voilà soumis à la domination et embellis par l’usage des adorateurs du vrai Dieu. Ils ont comme exulté lorsque leur fut accordée la faveur, nouvelle et inestimable, non seulement de sentir invisiblement au-dessus d’eux la royauté de Dieu, leur propre Créateur, mais encore de le voir les sanctifier visiblement, dans leur sphère à eux, en en faisant lui-même usage. Tels sont les si grands biens échus à l’univers, par le fruit béni du sein de Marie, la bénie.
      Par la plénitude de ta grâce, Marie, les êtres retenus en enfer se réjouissent d’être libérés, et les créatures au-delà du ciel d’être restaurées. Oui, c’est bien par ce glorieux Fils de ta glorieuse virginité que tous les justes disparus avant sa mort vivifiante exultent de voir la fin de leur captivité, et les anges, le relèvement de leur cité à moitié détruite. Ô femme remplie et plus que remplie de grâce, dont la surabondante plénitude se répand sur toute la création pour la rétablir ! Ô Vierge bénie et plus que bénie, dont la bénédiction est source de bénédictions pour toute la nature, non seulement pour la nature créée, de la part de son Créateur, mais aussi pour le Créateur, de la part de sa création !
      Dieu a donné son Fils, fruit unique de son cœur, qui était son égal et qu’il aimait comme lui-même : il l’a donné à Marie, et, du sein de Marie, il en fait son Fils, non pas quelqu’un d’autre, mais le même en personne, de sorte qu’il est par sa nature le même Fils unique de Dieu et de Marie. Toute la création est l’œuvre de Dieu, et Dieu est né de Marie ! Dieu a tout créé, et Marie a enfanté Dieu ! Dieu qui a tout formé, s’est formé lui-même du sein de Marie, et ainsi il a refait tout ce qu’il avait fait. Lui qui a pu tout faire de rien, n’a pas voulu refaire sans Marie sa création détruite. Dieu est donc le Père de toutes les choses créées, et Marie la mère de toutes les choses recréées. Dieu est le Père de la création universelle, et Marie la mère de la rédemption universelle. Car Dieu a engendré celui par qui tout a été fait, et Marie a enfanté celui par qui tout a été sauvé. Dieu a engendré celui sans qui absolument rien n’existe, et Marie a enfanté celui sans qui absolument rien n’est bon. Oui, %le Seigneur est% vraiment %avec toi% : il t’a fait un don tel que la nature entière t’est grandement redevable, à toi, en même temps qu’à lui.
    responsory: |-
      Voici la nouvelle Genèse :
      en toi, Vierge immaculée,
      la grâce originelle refleurit.
      Notre terre n’est plus maudite,
      nous la verrons bientôt
      donner le fruit de vie.

      R/ Avec toi, Marie, Mère du Sauveur,
      nous glorifions la puissance de Dieu.

morning:
  hymn:
  - voici-l-aurore-avant-le-jour
  psalmody:
  - psalm: PSALM_62
    antiphon:
    - Ô Vierge très pure, mère sans péché, dans ton sein tu as porté le Seigneur ton Dieu !
  - psalm: OT_41
    antiphon:
    - Tu es bénie du Très-Haut, Vierge Marie, tu es bénie entre toutes les femmes.
  - psalm: PSALM_149
    antiphon:
    - |-
      Entraîne-nous, Vierge très pure : que nous courions sur tes pas à l’odeur de tes parfums !
  reading:
    biblicalReference: Is 43, 1
    content: C’est moi qui t’ai créé, Jacob, qui t’ai formé, Israël. Ne crains pas, car je t’ai racheté, je t’ai appelé par ton nom, tu m’appartiens.
  responsory: |-
    R/ Mon âme exalte le Seigneur :
    éternel est son amour !
    V/ Chante et réjouis-toi, fille de Sion,
    ton Dieu est au milieu de toi. R/
    V/ Dieu pour toi exulte de joie,
    il te renouvelle par son amour. R/
  evangelicAntiphon:
    common:
    - |-
      Je mettrai l’hostilité entre toi et la femme, entre ta descendance et sa descendance : elle t’écrasera la tête. Alléluia.

middleOfDay:
  tierce:
    antiphon: |-
      Il est vivant le Seigneur : il m’a comblée de sa miséricorde !
    reading:
      biblicalReference: Ep 1, 4
      content: Dieu il nous a choisis avant la création du monde, pour que nous soyons, dans l’amour, saints et irréprochables sous son regard.
    responsory: |-
      V/ Célébrons la conception immaculée de Marie,
      elle a foulé aux pieds la tête du serpent.
  sexte:
    antiphon: |-
      Le Seigneur a mis en toi son amour : tu seras la joie de ton Dieu !
    reading:
      biblicalReference: Ep 1, 11-12
      content: En Jésus Christ, Dieu nous a d’avance destinés à devenir son peuple ; car lui, qui réalise tout ce qu’il a décidé, il a voulu que nous soyons ceux qui d’avance avaient espéré dans le Christ, à la louange de sa gloire.
    responsory: |-
      V/ Mon cœur et ma chair sont un cri,
      un cri vers le Dieu vivant.
  none:
    antiphon: Le Seigneur m’a créée dans la justice ; il a saisi ma main, il m’a mise à part.
    reading:
      biblicalReference: Ep 5, 25b-27
      content: Le Christ a aimé l’Église, il s’est livré pour elle ; il voulait la rendre sainte en la purifiant par le bain du baptême et la Parole de vie ; il voulait se la présenter à lui-même, cette Église, resplendissante, sans tache, ni ride, ni aucun défaut, il la voulait sainte et irréprochable.
    responsory: |-
      V/ Ta conception immaculée, Vierge, Mère de Dieu,
      fut message de joie pour tout l’univers.

vespers:
  psalmody:
  - psalm: PSALM_121
    antiphon:
    - Tu es belle, ô Marie, et la tache originelle n’est pas en toi.
  - psalm: PSALM_126
    antiphon:
    - Tu es la gloire de Jérusalem, tu es la joie de ton peuple, tu es l’honneur de toute l’Église.
  - psalm: NT_4
    antiphon:
    - Ton vêtement est blanc comme la neige et ton visage est comme le soleil.
  reading:
    biblicalReference: Rm 5, 20b-21
    content: Là où le péché s’était multiplié, la grâce a surabondé. Ainsi donc, de même que le péché a établi son règne de mort, de même la grâce, source de justice, devait établir son règne pour donner la vie éternelle par Jésus Christ notre Seigneur.
  responsory: |-
    R/ Tu es la gloire de notre peuple,
    Vierge Marie !
    V/ Voici ton Sauveur qui vient,
    le fruit de sa victoire l’accompagne. R/
    V/ Comme la fiancée fait la joie de son fiancé,
    tu seras la joie de ton Dieu. R/
  evangelicAntiphon:
    common:
    - |-
      Avec l’Ange, nous te saluons, Marie, comblée de grâce ! Le Seigneur est avec toi : tu es bénie plus que toutes les femmes !

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Is 61, 10
    content: |-
      Je tressaille de joie dans le Seigneur,
      >mon âme exulte en mon Dieu.
      Car il m’a vêtue des vêtements du salut,
      >il m’a couverte du manteau de la justice,
      >comme la fiancée que parent ses joyaux.

  collect:
  - |-
    Seigneur Dieu, +
    >tu as préparé à ton Fils une demeure digne de lui 
    par la Conception immaculée de la Vierge, +
    >que tu as préservée de tout péché
    >par une grâce venant déjà de la mort de ton Fils ; *
    à son intercession,
    >accorde-nous d’être purs, nous aussi, /
    >et de parvenir jusqu’à toi.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.

  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Gn 3,9-15.20
      headline: « je mettrai une hostilité entre ta descendance et la descendance de la femme »
      content: |-
        Quand Adam eut mangé du fruit de l’arbre,
        le Seigneur Dieu l’appela et lui dit :
        >« Où es-tu donc ? »
        L’homme répondit :
        >« J’ai entendu ta voix dans le jardin,
        >j’ai pris peur parce que je suis nu,
        >et je me suis caché. »
        Le Seigneur reprit :
        >« Qui donc t’a dit que tu étais nu ?
        >Aurais-tu mangé de l’arbre
        >dont je t’avais interdit de manger ? »
        L’homme répondit :
        >« La femme que tu m’as donnée,
        >c’est elle qui m’a donné du fruit de l’arbre,
        >et j’en ai mangé. »
        >Le Seigneur Dieu dit à la femme :
        >« Qu’as-tu fait là ? »
        La femme répondit :
        >« Le serpent m’a trompée,
        >et j’ai mangé. »
        Alors le Seigneur Dieu dit au serpent :
        >« Parce que tu as fait cela,
        >tu seras maudit parmi tous les animaux
        >>et toutes les bêtes des champs.
        >Tu ramperas sur le ventre et tu mangeras de la poussière
        >>tous les jours de ta vie.
        Je mettrai une hostilité entre toi et la femme,
        >>entre ta descendance et sa descendance :
        >celle-ci te meurtrira la tête,
        >>et toi, tu lui meurtriras le talon. »
        L’homme appela sa femme Ève (c’est-à-dire : la vivante),
        >parce qu’elle fut la mère de tous les vivants.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 97 (98), 1, 2-3ab, 3cd-4
      refAbbr: Ps 97
      chorus:
      - chorusRef: Ps 97, 1a)
        content: |-
          Chantez au Seigneur un chant nouveau,
          car il a fait des merveilles. 
      content: |-
        Chantez au Seigneur un chant nouveau,
        car il a fait des merveilles ;
        par son bras très saint, par sa main puissante,
        il s’est assuré la victoire.

        Le Seigneur a fait connaître sa victoire
        et révélé sa justice aux nations ;
        il s’est rappelé sa fidélité, son amour,
        en faveur de la maison d’Israël.

        La terre tout entière a vu
        la victoire de notre Dieu.
        Acclamez le Seigneur, terre entière,
        sonnez, chantez, jouez !
  - partType: READING_2
    partContents:
    - biblicalRef: Ep 1, 3-6.11-12
      headline: « Dieu nous a choisis, dans le Christ, avant la formation du monde »
      content: |-
        Béni soit Dieu, le Père
        >de notre Seigneur Jésus Christ !

        Il nous a bénis et comblés
        >des bénédictions de l’Esprit,
        au ciel, dans le Christ.

        Il nous a choisis, dans le Christ,
        >avant la fondation du monde,
        pour que nous soyons saints, immaculés
        >devant lui, dans l’amour.

        Il nous a prédestinés
        >à être, pour lui, des fils adoptifs
        par Jésus, le Christ.

        Ainsi l’a voulu sa bonté,
        à la louange de gloire de sa grâce,
        la grâce qu’il nous donne
        >dans le Fils bien-aimé.

        En lui, nous sommes devenus
        >le domaine particulier de Dieu,
        nous y avons été prédestinés
        >selon le projet de celui qui réalise tout ce qu’il a décidé :
        il a voulu que nous vivions
        >à la louange de sa gloire,
        nous qui avons d’avance espéré dans le Christ.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 1, 26-38
      headline: « Je te salue, Comblée-de-grâce, le Seigneur est avec toi » 
      acclamationAntiphon: |-
        Je te salue, Marie, Comblée-de-grâce :
        le Seigneur est avec toi,
        tu es bénie entre les femmes.
      content: |-
        En ce temps-là,
        l’ange Gabriel fut envoyé par Dieu
        >dans une ville de Galilée, appelée Nazareth,
        à une jeune fille vierge,
        >accordée en mariage à un homme de la maison de David,
        >appelé Joseph ;
        et le nom de la jeune fille était Marie.
        L’ange entra chez elle et dit :
        >« Je te salue, Comblée-de-grâce,
        >>le Seigneur est avec toi. »
        >À cette parole, elle fut toute bouleversée,
        >>et elle se demandait ce que pouvait signifier cette salutation.
        >L’ange lui dit alors :
        >>« Sois sans crainte, Marie,
        >>car tu as trouvé grâce auprès de Dieu.
        >Voici que tu vas concevoir et enfanter un fils ;
        >>tu lui donneras le nom de Jésus.
        >Il sera grand,
        >>il sera appelé Fils du Très-Haut ;
        >le Seigneur Dieu
        >>lui donnera le trône de David son père ;
        >il régnera pour toujours sur la maison de Jacob,
        >>et son règne n’aura pas de fin. »
        Marie dit à l’ange :
        >« Comment cela va-t-il se faire,
        >puisque je ne connais pas d’homme ? »
        L’ange lui répondit :
        >« L’Esprit Saint viendra sur toi,
        >et la puissance du Très-Haut
        >>te prendra sous son ombre ;
        >c’est pourquoi celui qui va naître sera saint,
        >>il sera appelé Fils de Dieu.
        >Or voici que, dans sa vieillesse, Élisabeth, ta parente,
        >>a conçu, elle aussi, un fils
        >et en est à son sixième mois,
        >>alors qu’on l’appelait la femme stérile.
        >Car rien n’est impossible à Dieu. »
        Marie dit alors :
        >« Voici la servante du Seigneur ;
        >que tout m’advienne selon ta parole. »

        Alors l’ange la quitta.
  offeringPrayer:
  - |-
    Accueille avec bienveillance, Seigneur,
    >le sacrifice du salut 
    que nous t’offrons en célébrant 
    >la Conception immaculée de la bienheureuse Vierge Marie ; *
    puisque nous reconnaissons
    >que la prévenance de ta grâce
    >l’a gardée pure de tout péché, /
    >accorde-nous, à son intercession,
    >d’être libérés de toute faute.
    Par le Christ, notre Seigneur.

  prefaceList:
  - immaculate_conception
  eucharisticPrayerCommunicantes: immaculate_conception
  communionAntiphon:
  - biblicalReference: cf. Ps 86, 3
    content: |-
      Pour ta gloire, on parle de toi, Marie : 
      par toi s’est levé le Soleil de justice, 
      >le Christ, notre Dieu.

  prayerAfterCommunion:
  - |-
    Que notre participation à ces sacrements,
    Seigneur notre Dieu,
    guérisse en nous les blessures de la faute originelle *
    dont tu as préservé de manière unique la bienheureuse Marie /
    >en sa conception immaculée.
    Par le Christ, notre Seigneur.
