celebration:
  title: Saint Irénée
  subtitle: évêque et martyr
  description: Irénée (vers 130-200), qui était né à Smyrne, devint évêque de Lyon après la mort de Pothin (177). En vrai pasteur, il fut soucieux de répandre l’Évangile parmi les populations de la Gaule, mais aussi de défendre l’intégrité du dépôt de la foi. Dans ses écrits Irénée révèle une vue profonde du dessein de Dieu, de la vocation de l’homme, du mystère de l’Église.
  commons:
  - martyr
  - pastors_bishop
  color: red

oration:
- Tu as donné, Seigneur, à l’évêque saint Irénée de faire triompher la vraie doctrine et d’affermir la paix dans l’Église ; par son intercession, réveille notre foi et notre charité pour que nous cherchions en toute chose ce qui favorise l’union entre les hommes.

readings:
  patristicReading:
  - title: DU TRAITÉ DE SAINT IRÉNÉE CONTRE LES HÉRÉSIES
    subtitle: La gloire de Dieu, c’est l’homme vivant
    content: |-
      La splendeur de Dieu est vivifiante : ceux qui voient Dieu, reçoivent la vie. C’est pourquoi, lui, l’insaisissable, l’incompréhensible, l’invisible, se donne aux hommes, en se rendant visible, compréhensible et saisissable, pour vivifier ceux qui le reçoivent et ceux qui le voient. ~ Car vivre sans la vie, c’est impossible : la substance de la vie vient de la participation à Dieu ; et participer à Dieu, c’est voir Dieu et jouir de sa bonté.
      Ainsi les hommes verront Dieu pour vivre : par cette vue, ils deviennent immortels et arrivent à Dieu. Je l’ai dit, il était annoncé en image par les prophètes que Dieu serait vu des hommes qui portent son Esprit et sans cesse attendent sa venue. C’est ainsi que Moïse dit dans le Deutéronome : En ce jour-là, nous verrons, car Dieu parlera à l’homme, et l’homme vivra.
      La puissance et la grandeur de celui qui opère tout en tous est invisible et inexprimable pour tous ceux qui ont été faits par lui ; toutefois il ne leur est pas inconnu : tous apprennent de son Verbe qu’il n’y a qu’un seul Dieu Père qui contient tout et donne l’être à toutes choses : ainsi qu’il est écrit dans l’Évangile : %Nul n’a jamais vu Dieu, le Fils unique, qui est dans le sein du Père, qui l’a révélé%.
      Depuis le commencement, le Fils est l’exégète du Père, puisqu’il est depuis le commencement auprès du Père : au temps voulu, il a montré aux hommes pour leur profit les visions prophétiques, la variété des charismes, ses ministères et la glorification du Père, de façon cohérente et claire : Qui dit cohésion dit harmonie, qui dit harmonie dit temps voulu, et qui dit temps voulu dit profit. C’est pourquoi le Verbe s’est fait le dispensateur de la gloire du Père au profit des hommes pour qui il accomplit de telles économies : ainsi il montre Dieu aux hommes, et présente l’homme à Dieu, tout en préservant l’invisibilité du Père, de peur que l’homme n’en vienne à mépriser Dieu, mais, en même temps, pour qu’il ait toujours des progrès en vue, il rend Dieu visible aux hommes en le montrant par de nombreuses économies, de peur que, totalement privé de Dieu, l’homme cesse d’être. Car la gloire de Dieu, c’est l’homme vivant, et la vie de l’homme, c’est la vue de Dieu, Si la révélation de Dieu par la création donne la vie à tout être vivant sur la terre, combien plus la manifestation du Père par le Verbe donne-t-elle la vie à ceux qui voient Dieu !

    responsory: |-
      R/ Christ au milieu de nous,
      espérance de la gloire, alléluia !

      Le Christ est à la gloire du Père :
      c’est là désormais
      que tend notre vie.

      Vous êtes morts
      et votre vie reste cachée
      avec le Christ en Dieu.

      Quand paraîtra le Christ,
      lui qui est votre vie,
      vous paraîtrez avec lui en pleine gloire.

morning:
  evangelicAntiphon:
    common:
    - |-
      Heureux es-tu, Irénée, homme de paix : tu as lutté pour la paix des Églises.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Ml 2,6
    content: |-
      La loi de vérité était dans sa bouche,
      >et rien de mal ne se trouvait sur ses lèvres.
      Dans la paix et la droiture, il marchait avec le Seigneur
      >nombreux furent ceux qu’il détourna de la faute.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné au bienheureux évêque Irénée
    >d’enseigner plus solidement la vérité
    >et d’affermir avec bonheur la paix dans l’Église ; *
    par son intercession, renouvelle notre foi et notre charité, /
    >pour que nous cherchions en toute chose
    >à promouvoir l’unité et la concorde.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 2Tm 2, 22b-26
      headline: « Un serviteur du Seigneur doit reprendre avec douceur les opposants »
      content: |-
        Bien-aimé,
        cherche à vivre dans la justice,
        la foi, la charité et la paix,
        avec ceux qui invoquent le Seigneur d’un cœur pur.
        Évite les discussions folles et simplistes :
        tu sais qu’elles provoquent des querelles.
        Or un serviteur du Seigneur ne doit pas être querelleur ;
        il doit être attentionné envers tous,
        capable d’enseigner
        et de supporter la malveillance ;
        il doit reprendre avec douceur les opposants,
        car Dieu leur donnera peut-être de se convertir,
        de connaître pleinement la vérité :
        ils retrouveront alors leur bon sens
        et se dégageront des pièges du diable
        qui les retient captifs, soumis à sa volonté.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 36 (37), 3-4, 5-6, 30-31
      refAbbr: 36, 30a
      chorus:
      - chorusRef: 36, 30a
        chorus: Les lèvres du juste redisent la sagesse.
      content: |-
        Fais confiance au Seigneur, agis bien,
        habite la terre et reste fidèle ;
        mets ta joie dans le Seigneur :
        il comblera les désirs de ton cœur.

        Dirige ton chemin vers le Seigneur,
        fais-lui confiance, et lui, il agira.
        Il fera lever comme le jour ta justice,
        et ton droit comme le plein midi.

        Les lèvres du juste redisent la sagesse
        et sa bouche énonce le droit.
        La loi de son Dieu est dans son cœur ;
        il va, sans craindre les faux pas.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 17, 20-26
      headline: « Je veux que là où je suis, ils soient eux aussi avec moi »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là,
        les yeux levés au ciel, Jésus priait ainsi :
        « Père saint,
        je ne prie pas seulement pour ceux qui sont là,
        mais encore pour ceux qui, grâce à leur parole, croiront en moi.
        Que tous soient un,
        comme toi, Père, tu es en moi, et moi en toi.
        Qu’ils soient un en nous, eux aussi,
        pour que le monde croie que tu m’as envoyé.
        Et moi, je leur ai donné la gloire que tu m’as donnée,
        pour qu’ils soient un comme nous sommes UN :
        moi en eux, et toi en moi.
        Qu’ils deviennent ainsi parfaitement un,
        afin que le monde sache que tu m’as envoyé,
        et que tu les as aimés comme tu m’as aimé.
        Père,
        ceux que tu m’as donnés,
        je veux que là où je suis,
        ils soient eux aussi avec moi,
        et qu’ils contemplent ma gloire,
        celle que tu m’as donnée
        parce que tu m’as aimé avant la fondation du monde.
        Père juste,
        le monde ne t’a pas connu,
        mais moi, je t’ai connu,
        et ceux-ci ont reconnu
        que tu m’as envoyé,
        je leur ai fait connaître ton nom,
        et je le ferai connaître,
        pour que l’amour dont tu m’as aimé soit en eux,
        et que moi aussi, je sois en eux. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    En célébrant la naissance au ciel du bienheureux Irénée,
    nous t’offrons avec joie, Seigneur, ce sacrifice : *
    qu’il te rende gloire
    >et nous obtienne d’aimer la vérité, /
    >pour garder intacte la foi de l’Église
    >et inébranlable, son unité.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 15,4-5
    content: |-
      Demeurez en moi, comme moi en vous, dit le Seigneur.
      Celui qui demeure en moi,
      >et en qui je demeure,
      celui-là porte beaucoup de fruit.
  prayerAfterCommunion:
  - |-
    Par cette communion à tes mystères,
    nous t’en prions, Seigneur de miséricorde,
    augmente en nous la foi : *
    elle a été la gloire du bienheureux évêque Irénée
    >qui l’a gardée jusqu’à la mort ; /
    que cette même foi sincèrement vécue
    >fasse de nous des justes.
    Par le Christ, notre Seigneur.