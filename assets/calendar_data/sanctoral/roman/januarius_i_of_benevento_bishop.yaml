celebration:
  title: Saint Janvier
  subtitle: évêque et martyr
  description: Janvier, évêque de Bénévent, subit le martyre à Pouzzoles en 305. Au siècle suivant, ses restes furent transférés dans la banlieue de Naples. La cité le choisit pour son protec¬teur. Mais le culte de saint Janvier a passé les mers. Rio de Janeiro a rendu son nom célèbre dans le monde.
  color: red
  commons:
    - martyr
    - pastors_bishop

oration:
  - |-
    Tu nous donnes, Seigneur, de vénérer la mémoire de saint Janvier ton martyr ; accorde-nous d’entrer dans cette éternité de bonheur où nous vivrons avec lui pleins de joie.

readings:
  hymn:
    - voici-l-aurore-avant-le-jour
  patristicReading:
    title: HOMÉLIE DE SAINT AUGUSTIN POUR L’ANNIVERSAIRE DE SON ORDINATION ÉPISCOPALE
    content: |-
      Depuis que Dieu a imposé à mes épaules ce fardeau, qui comporte une responsabilité si difficile, le soin de mon honneur me rend continuellement soucieux. — Qu’est-ce qui nous effraye dans cette charge épiscopale ? C’est de trouver plus de charme à ce qui est dangereux en nous donnant de l’honneur, qu’à ce qui est fructueux en vous procurant le salut. — Ce que je suis pour vous me terrifie, mais ce que je suis avec vous me console : car pour vous je suis évêque, avec vous je suis chrétien. Le premier titre est celui d’une charge, le second, d’une grâce. Celui-là désigne le péril, celui-ci, le salut.
      Bref, nous sommes ballottés par les tempêtes de cette activité comme un vaisseau en pleine mer. Mais lorsque nous nous rappelons celui dont le sang nous a rachetés, la paix que donne une telle pensée nous fait en quelque sorte entrer au port de la sécurité. Et si, personnellement, nous trouvons cette fonction pénible, l’union avec vous nous procure un repos paisible. Si donc j’ai plus de bonheur à être racheté avec vous qu’à être placé au-dessus de vous, alors, comme le Seigneur le prescrit, je serai plus généreusement votre serviteur, pour ne pas être indigne du prix payé pour que je sois votre compagnon de service. Certes, je dois aimer le Rédempteur et je sais ce qu’il a dit à Pierre : %Pierre, m’aimes-tu ? Sois le berger de mes brebis%. Et cela une fois, deux fois, trois fois. C’est l’amour qui était interrogé, le labeur qui était imposé. Car lorsqu’il y a plus d’amour, il y a moins de labeur.
      %Comment rendrai-je au Seigneur tout le bien qu’il m’a fait ?% Dirai-je qu’il m’a fait du bien parce que je suis le berger de ses brebis ? Mais si j’accomplis cette tâche, %ce n’est pas moi, mais la grâce de Dieu qui est avec moi%. Comment pourrai-je lui rendre, alors que je suis devancé de toutes parts ? Et pourtant, alors que nous aimons gratuitement, que nous sommes le berger des brebis, nous cherchons la récompense. Comment cela se fait-il ? Comment accorder : J’aime gratuitement pour être le berger, avec : Je demande la récompense parce que je suis le berger ? Cela serait absolument impossible, on ne demanderait absolument aucune récompense à celui qui est aimé gratuitement, si celui qui est aimé n’était pas lui-même notre récompense.
      Car, si nous lui « rendons » parce qu’il nous a rachetés, alors que nous sommes les bergers de ses brebis, que lui rendrons-nous parce qu’il a fait de nous des bergers ? Car si nous sommes de mauvais bergers – ce qu’à Dieu ne plaise ! – c’est par notre malice. Être de bons bergers – qu’il veuille bien nous l’accorder ! – cela ne peut venir que de sa grâce. Aussi, vous, mes frères, %nous vous invitons à ne pas laisser sans effet la grâce reçue de Dieu%. Rendez notre ministère fructueux.
      %Vous êtes le champ que Dieu cultive%. Recevez au dehors celui qui %plante% et qui %arrose%, mais au-dedans celui qui %donne la croissance%. Secondez-nous par la prière et l’obéissance, afin que nous ayons la joie non pas tant d’être votre supérieur que votre bienfaiteur.
    responsory: |-
        R/ C’est au prix de son sang
        que le Christ Jésus s’est acquis l’Église.

        Soyez donc attentifs au troupeau
        dont l’Esprit vous a confié la charge.

        Livrés en spectacle au monde,
        vous serez les modèles du troupeau.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu nous donnes de vénérer la mémoire
    >de saint Janvier, ton martyr ; *
    accorde-nous de nous réjouir avec lui /
    >dans l’éternité bienheureuse.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: He 10, 32-36
      headline: |-
        « Vous avez soutenu le dur combat. Ne perdez pas votre assurance »
      content: |-
        Frères,
        souvenez-vous de ces premiers jours
        >où vous veniez de recevoir la lumière du Christ :
        vous avez soutenu alors le dur combat des souffrances,
        >tantôt donnés en spectacle sous les insultes et les brimades,
        >tantôt solidaires de ceux qu’on traitait ainsi.
        En effet, vous avez montré de la compassion
        >à ceux qui étaient en prison ;
        vous avez accepté avec joie
        >qu’on vous arrache vos biens,
        car vous étiez sûrs de posséder un bien encore meilleur, et permanent.
        Ne perdez pas votre assurance ;
        >grâce à elle, vous serez largement récompensés.
        Car l’endurance vous est nécessaire
        >pour accomplir la volonté de Dieu
        >et obtenir ainsi la réalisation des promesses.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 125 (126), 1-2ab, 2cd-3, 4-5, 6
      refAbbr: 125, 1…
      chorus:
      - chorusRef: cf. 125, 5
        chorus: |-
          Ceux qui sèment dans les larmes
          moissonnent dans la joie.
      content: |-
        Quand le Seigneur ramena les captifs à Sion,
        nous étions comme en rêve !
        Alors notre bouche était pleine de rires,
        nous poussions des cris de joie.

        Alors on disait parmi les nations :
        « Quelles merveilles fait pour eux le Seigneur ! »
        Quelles merveilles le Seigneur fit pour nous :
        nous étions en grande fête !

        Ramène, Seigneur, nos captifs,
        comme les torrents au désert.
        Qui sème dans les larmes
        moissonne dans la joie.

        Il s’en va, il s’en va en pleurant,
        il jette la semence ;
        il s’en vient, il s’en vient dans la joie,
        il rapporte les gerbes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 12, 24-26
      headline: |-
        « Si le grain de blé meurt, il porte beaucoup de fruit »
      acclamationAntiphon: |-
        Heureux l’homme
        qui supporte l’épreuve avec persévérance,
        car, sa valeur une fois vérifiée, il recevra la couronne de la vie.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Amen, amen, je vous le dis :
        >si le grain de blé tombé en terre ne meurt pas,
        >il reste seul ;
        >mais s’il meurt,
        >il porte beaucoup de fruit.
        Qui aime sa vie
        >la perd ;
        >qui s’en détache en ce monde
        >la gardera pour la vie éternelle.
        Si quelqu’un veut me servir,
        >qu’il me suive ;
        >et là où moi je suis,
        >là aussi sera mon serviteur.
        Si quelqu’un me sert,
        >mon Père l’honorera. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null