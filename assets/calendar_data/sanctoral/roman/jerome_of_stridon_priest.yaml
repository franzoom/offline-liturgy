celebration:
  title: Saint Jérôme
  subtitle: prêtre et docteur de l’Église
  description: Le prêtre Jérôme (340-420) séjourna à plusieurs reprises à Rome, où il fut secrétaire du pape Damase, mais il passa les trente-cinq dernières années de sa vie à Bethléem, près de la grotte où Jésus était né. C’est là que, dans la pénitence et la prière, il se livra à l’étude assidue de la Bible, dont il se fit le traducteur en langue latine et le commentateur.
  commons:
  - pastors_doctors
  color: white
readings:
  patristicReading:
    - title: PROLOGUE DU COMMENTAIRE D’ISAÏE PAR SAINT JÉRÔME
      content: |-
        En accomplissant une promesse faite à Paula, j’obéis aux préceptes du Christ qui dit : %Scrutez les Écritures%, et aussi : %Cherchez, et vous trouverez%. Je ne veux pas qu’il me dise, comme aux Juifs : %Vous êtes dans l’erreur, parce que vous méconnaissez les Écritures et la puissance de Dieu%. Si, selon l’Apôtre Paul, %le Christ est puissance de Dieu et sagesse de Dieu%, et si celui qui méconnaît les Écritures méconnaît la puissance de Dieu et sa sagesse : ignorer les Écritures, c’est ignorer le Christ.
        J’imiterai donc le père de famille qui tire de son trésor du nouveau et de l’ancien, et aussi l’épouse qui dit, dans le Cantique des cantiques : %Les fruits nouveaux, comme les anciens, je les ai gardés pour toi%. Et c’est ainsi que je commenterai Isaïe ; je l’enseignerai comme étant non seulement un prophète, mais un évangéliste et un apôtre. Il a dit de lui-même, en effet, comme des autres évangélistes : %Qu’ils sont beaux, les pieds de ceux qui annoncent de bonnes nouvelles, qui annoncent la paix%. Et Dieu lui parle comme à un apôtre : %Qui enverrai-je vers ce peuple ?% Et Isaïe répond : %Me voici, envoie-moi%.
        Personne ne doit croire que je désire résumer brièvement le contenu de ce livre, car le texte en question embrasse tous les mystères du Seigneur : il annonce I’Emmanuel né de la Vierge ; il prédit qu’il accomplira des œuvres et des signes éclatants ; mort et enseveli, ressuscitant du séjour des morts, il sera le Sauveur de toutes les nations. Vais-je parler de physique, de morale et de logique ? Tout ce qu’il y a dans les saintes Écritures, tout ce que la parole humaine peut exprimer et tout ce que peut assimiler l’intelligence des mortels, est contenu dans ce livre. Celui qui l’a écrit témoigne lui-même de tous ces mystères : %Toute vision est devenue pour vous comme les paroles d’un livre scellé. On le donne à quelqu’un qui sait lire, en lui disant : « Lis cela ». Et il répond : « Je ne peux pas, parce que le livre est scellé. » Ou bien on le donne à quelqu’un qui ne sait pas lire, en lui disant : « Lis cela ». Il répond : «Je ne sais pas lire. »%~
        Écoutez ce que dit saint Paul : %Que deux ou trois prophètes prennent la parole, et que les autres jugent. Si un assistant reçoit une révélation, celui qui parle doit se taire%. Comment pourra-t-il se taire, puisque le Saint-Esprit, qui parle par les prophètes, est libre de se taire ou de parler ? Si donc ils comprenaient ce qu’ils disaient, c’est que tout est plein de sagesse et de raison. Ce n’est pas la vibration de l’air qui parvenait à leurs oreilles, mais c’est Dieu qui parlait dans l’esprit des prophètes, selon ce que dit un autre prophète : %C’est un ange qui me parlait%. Et aussi : Ils crient dans nos cœurs : %Abba, Père%. Et encore : %J’écouterai ce que dira en moi le Seigneur Dieu%.
      responsory: |-
        R/ Vivante est la Parole de Dieu,
        plus pénétrante qu’un glaive.

        Fils d’homme, je t’ai fait sentinelle :
        de ma part, tu avertiras mon peuple.

        Fils d’homme, porte-leur mes paroles,
        qu’ils écoutent ou qu’ils n’écoutent pas.
oration:
  - Dieu qui as donné à saint Jérôme de goûter la sainte Écriture et d’en vivre intensément, fais que ton peuple soit davantage nourri de ta Parole et trouve en elle une source de vie.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ps 1,2-3
    content: |-
      Heureux l’homme qui murmure la loi du Seigneur jour et nuit :
      >il donne du fruit en son temps.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné au bienheureux prêtre Jérôme de goûter la sainte Écriture et d’en vivre ; *
    fais que ton peuple se nourrisse plus abondamment de ta Parole /
    >et trouve en elle la source de la vie.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Tm 3, 14-17
      headline: |-
        « Toute l’Écriture est inspirée par Dieu ; elle est utile pour enseigner »
      content: |-
        Bien-aimé,
        demeure ferme dans ce que tu as appris :
        >de cela tu as acquis la certitude,
        >sachant bien de qui tu l’as appris.
        Depuis ton plus jeune âge, tu connais les Saintes Écritures :
        elles ont le pouvoir de te communiquer la sagesse,
        >en vue du salut par la foi que nous avons en Jésus Christ.
        Toute l’Écriture est inspirée par Dieu ;
        elle est utile pour enseigner, dénoncer le mal,
        >redresser, éduquer dans la justice ;
        grâce à elle, l’homme de Dieu sera accompli,
        >équipé pour faire toute sorte de bien.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 118 (119), 9-10, 11-12, 13-14
      refAbbr: 118, 12b
      chorus:
      - chorusRef: 118, 12b
        chorus: |-
          Apprends-moi, Seigneur, tes commandements.
      content: |-
        Comment, jeune, garder pur son chemin ?
        En observant ta parole.
        De tout mon cœur, je te cherche ;
        garde-moi de fuir tes volontés.

        Dans mon cœur, je conserve tes promesses
        pour ne pas faillir envers toi.
        Toi, Seigneur, tu es béni :
        apprends-moi tes commandements.

        Je fais repasser sur mes lèvres
        chaque décision de ta bouche.
        Je trouve dans la voie de tes exigences
        plus de joie que dans toutes les richesses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 13, 47-52
      headline: |-
        « Il tire de son trésor du neuf et de l’ancien »
      acclamationAntiphon: |-
        Seigneur, ouvre notre cœur
        pour nous rendre attentifs aux paroles de ton Fils.
      content: |-
        En ce temps-là,
        Jésus disait aux foules :
        >« Le royaume des Cieux est encore comparable
        >à un filet que l’on jette dans la mer,
        >et qui ramène toutes sortes de poissons.
        Quand il est plein, on le tire sur le rivage,
        >on s’assied,
        >on ramasse dans des paniers ce qui est bon,
        >et on rejette ce qui ne vaut rien.
        Ainsi en sera-t-il à la fin du monde :
        >les anges sortiront pour séparer les méchants du milieu des justes
        >et les jetteront dans la fournaise :
        >là, il y aura des pleurs et des grincements de dents. »
        « Avez-vous compris tout cela ? »
        Ils lui répondent : « Oui. »
        Jésus ajouta :
        >« C’est pourquoi tout scribe
        >devenu disciple du royaume des Cieux
        >est comparable à un maître de maison
        >qui tire de son trésor du neuf et de l’ancien. »
  offeringPrayer:
  - |-
    Puisque nous venons de méditer ta Parole
    >à l’exemple du bienheureux Jérôme, + accorde-nous, Seigneur, Dieu de majesté,
    >de mettre plus d’empressement *
    >à t’offrir le sacrifice du salut.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Jr 15,16
    content: |-
      Quand je rencontrais tes paroles, Seigneur Dieu,
      >je les dévorais ;
      ta Parole faisait ma joie, les délices de mon cœur.
  prayerAfterCommunion:
  - |-
    NOus célébrons avec joie, Seigneur,
    >le bienheureux Jérôme,
    Que le sacrement reçu réveille le cœur de tes fidèles,*
    pour qu’attentifs aux enseignements de l’Écriture,
    >ils découvrent le chemin à suivre/
    >et qu’en le suivant, ils parviennent à la vie éternelle.
    Par le Christ, notre Seigneur.