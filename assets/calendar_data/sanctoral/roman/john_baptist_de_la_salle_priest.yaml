celebration:
  title: Saint Jean-Baptiste de la Salle
  subtitle: prêtre
  description: Jean-Baptiste de la Salle (1651-1719) fut un pionnier en ouvrant une école qui offrait aux enfants pauvres un enseignement populaire. Reims, Paris, Rouen virent les premières fondations de ce prêtre rémois autour duquel s’étaient groupés quelques enseignants, les Frères des Écoles chrétiennes (1684). Dans sa vieillesse, le fondateur eut à subir de lourdes épreuves de la part de ses frères.
  commons:
  - pastors
  - saints-male_educator
  color: white

oration:
- Dieu qui as choisi saint Jean-Baptiste de la Salle pour former les jeunes à la vie chrétienne, suscite enore dans ton Église des éducateurs qui se dévoueront tout entiers à cette œuvre de formation humaine et religieuse.

readings:
  patristicReading:
  - title: MÉDITATION DE SAINT JEAN-BAPTISTE DE LA SALLE POUR LE TEMPS DE LA RETRAITE
    content: |-
      Faites réflexion à ce que dit saint Paul que Dieu %a établi dans l’Église des Apôtres, des Prophètes et des Docteurs%, et vous serez persuadés que c’est lui aussi qui vous a établis dans votre emploi ; une des marques que vous en donne le même saint est qu’il y a divers ministères mais qu’il y a différentes opérations, et que le Saint-Esprit ne se manifeste en chacun de ces dons que pour l’utilité commune, c’est-à-dire pour l’utilité de l’Église. ~
      Vous ne devez pas douter que ce ne soit un grand don de Dieu, que la grâce qu’il vous fait de vous charger d’instruire les enfants, de leur annoncer l’Évangile, et de les élever dans l’esprit de religion, lui qui vous a appelés pour ce saint ministère. ~
      Faites donc connaître, dans toute votre conduite à l’égard des enfants qui vous sont confiés, que vous vous regardez %comme les ministres de Dieu%, en l’exerçant %avec une charité% et un zèle véritables.
      Ce qui vous doit encore engager à avoir un grand zèle dans votre état, c’est que non seulement vous êtes les ministres de Dieu, mais que vous l’êtes même de Jésus Christ et de l’Église. C’est ce que dit saint Paul qui veut que %chacun considère ceux qui annoncent l’Évangile comme les ministres de Jésus Christ, qui écrivent la lettre qu’il leur a dictée, non avec de l’encre, mais avec l’Esprit du Dieu vivant% ; non sur des tables de pierre, mais sur des tables de chair qui sont les cœurs des enfants.
      C’est pourquoi vous devez en cette qualité avoir uniquement pour fin, en les instruisant, l’amour et la gloire de Dieu ; %car l’amour de Dieu vous doit presser, parce que Jésus Christ est mort pour tous, afin que ceux qui vivent ne vivent plus pour eux-mêmes, mais pour celui qui est mort pour eux% ; c’est ce que votre zèle vous doit faire inspirer à vos disciples, %comme si Dieu même les exhortait par vous, puisque vous êtes les ambassadeurs de Jésus Christ%.
      Il faut aussi que vous fassiez voir à l’Église quelle charité vous avez pour elle, et que vous lui donniez des preuves de votre zèle, car c’est pour l’Église (comme étant le corps de Jésus Christ) que vous travaillez. ~
      Faites en sorte, par votre zèle, de donner des marques sensibles que vous aimez ceux que Dieu vous a confiés, comme %Jésus Christ a aimé son Église% ; faites-les entrer véritablement dans la structure de cet édifice et qu’ils soient en état de paraître un jour devant Jésus Christ pleins de gloire, sans tache, sans rides et sans souillures, %pour faire connaître aux siècles à venir les richesses abondantes de la grâce qu’il leur a faite% en leur procurant le secours de l’instruction ; et à vous de les instruire et de les élever, pour être un jour les %héritiers du royaume de Dieu et de Jésus Christ Notre Seigneur%.
    responsory: |-
      R/ Rendons grâce à Dieu :
      dans le Christ il nous donne part à son triomphe.

      Telle est notre assurance devant Dieu :
      il fait de nous les ministres de l’Alliance nouvelle.

      Vous êtes une lettre du Christ,
      écrite par l’Esprit de Dieu sur vos cœurs.

morning:
  evangelicAntiphon:
    common:
    - |-
      Heureux celui qui a donné sans compter : il recevra sans mesure.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Laissez venir à moi les petits enfants : le Royaume est à ceux qui leur ressemblent.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as choisi saint Jean-Baptiste de la Salle
    >pour former les jeunes à la vie chrétienne ; *
    >suscite encore dans ton Église
    >des éducateurs qui se dévoueront tout entiers
    >à la formation humaine et chrétienne des jeunes.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Tm 1, 13-14 ; 2, 1-3
      headline: « Garde le dépôt de la foi avec l’aide de l’Esprit Saint »
      content: |-
        Bien-aimé,
        tiens-toi au modèle donné par les paroles solides
        que tu m’as entendu prononcer dans la foi
        et dans l’amour qui est dans le Christ Jésus.
        Garde le dépôt de la foi dans toute sa beauté,
        avec l’aide de l’Esprit Saint qui habite en nous.
        Toi donc, mon enfant, trouve ta force
        dans la grâce qui est en Jésus Christ.
        Ce que tu m’as entendu dire en présence de nombreux témoins,
        confie-le à des hommes dignes de foi
        qui seront capables de l’enseigner aux autres, à leur tour.
        Prends ta part de souffrance
        comme un bon soldat du Christ Jésus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 1, 1-2, 3, 4.6
      refAbbr: 1, 2a
      chorus:
      - chorusRef: 1, 2a
        chorus: |-
          Heureux qui se plaît
          dans la loi du Seigneur !
      content: |-
        Heureux est l’homme
        qui n’entre pas au conseil des méchants,
        qui ne suit pas le chemin des pécheurs,
        ne siège pas avec ceux qui ricanent,
        mais se plaît dans la loi du Seigneur
        et murmure sa loi jour et nuit !

        Il est comme un arbre
        planté près d’un ruisseau,
        qui donne du fruit en son temps,
        et jamais son feuillage ne meurt ;
        tout ce qu’il entreprend réussira.

        Tel n’est pas le sort des méchants.
        Mais ils sont comme la paille
        balayée par le vent.

        Le Seigneur connaît le chemin des justes,
        mais le chemin des méchants se perdra.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 18, 1-5
      headline: « Si vous ne changez pas pour devenir comme les enfants, vous n’entrerez pas dans le royaume des Cieux »
      acclamationAntiphon: |-
        Le plus grand parmi vous sera votre serviteur, dit le Seigneur,
        qui s’abaissera sera élevé.
      content: |-
        À ce moment-là, les disciples s’approchèrent de Jésus et lui dirent :
        « Qui donc est le plus grand
        dans le royaume des Cieux ? »
        Alors Jésus appela un petit enfant ;
        il le plaça au milieu d’eux,
        et il déclara :
        « Amen, je vous le dis :
        si vous ne changez pas
        pour devenir comme les enfants,
        vous n’entrerez pas dans le royaume des Cieux.
        Mais celui qui se fera petit comme cet enfant,
        celui-là est le plus grand dans le royaume des Cieux.
        Et celui qui accueille un enfant comme celui-ci en mon nom,
        il m’accueille, moi. »
        Acclamons la Parole de Dieu.
