celebration:
  title: Saint Jean Chrysostome
  subtitle: évêque et docteur de l’Église
  description: Le patriarche de Constantinople Jean I^er (349-404), qui devait recevoir le nom de Chrysostome (« Bouche d’or ») en raison de ses dons exceptionnels d’orateur, avait été formé en Syrie à la rude discipline des moines. Il fut avant tout un témoin intrépide de l’Évangile, le défenseur des pauvres face au luxe insolent des riches. C’est pour cela qu’il mourut en exil.
  commons:
  - pastors_bishop
  - pastors_doctors
  color: white

oration:
  - Seigneur, force de ceux qui espèrent en toi, tu as donné à l’évêque saint Jean Chrysostome une merveilleuse éloquence et un grand courage dans les épreuves ; accorde-nous la grâce de suivre ses enseignements pour avoir la force d’imiter sa patience.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME AVANT SON DÉPART EN EXIL (404)
      content: |-
        Les vagues sont violentes, la houle est terrible, mais nous ne craignons pas d’être engloutis par la mer, car nous sommes debout sur le roc. Que la mer soit furieuse, elle ne peut briser ce roc ; que les flots se soulèvent, ils sont incapables d’engloutir la barque de Jésus. Que craindrions-nous ? Dites-le-moi. La mort ? %Pour moi, vivre, c’est le Christ, et mourir est un avantage%. L’exil ? %La terre appartient au Seigneur, avec tout ce qui la remplit%. La confiscation des biens ? %De même que nous n’avons rien apporté dans ce monde, nous ne pourrons rien emporter%. Les menaces du monde, je les méprise ; ses faveurs, je m’en moque. Je ne crains pas la pauvreté, je ne désire pas la richesse ; je ne crains pas la mort, je ne désire pas vivre, sinon pour vous faire progresser. C’est à cause de cela que je vous avertis de ce qui se passe, et j’exhorte votre charité à la confiance. ~
        N’entendez-vous pas cette parole du Seigneur : %Quand deux ou trois sont réunis en mon nom, je suis là, au milieu d’eux% ? Et là où un peuple aussi nombreux est uni par le lien de la charité, le Seigneur ne sera pas présent ? J’ai sa garantie : est-ce à ma propre force que je fais confiance ? Je possède sa parole : voilà mon appui, voilà ma sécurité, voilà mon havre de paix. Que l’univers se soulève, je possède cette parole, j’en lis le texte : voilà mon rempart, voilà ma sécurité. Quel texte ? %Je suis avec vous tous les jours jusqu’à la fin des temps%.
        Le Christ est avec moi : que vais-je craindre ? Même si les flots de la mer ou la colère des puissants s’élèvent contre moi, tout cela est aussi peu de chose pour moi qu’une toile d’araignée. Et sans l’amour que j’ai pour vous, je n’aurais pas refusé de partir aujourd’hui même. Car je ne cesse de dire : Seigneur, %que ta volonté soit faite%. Non pas ce que veut un tel ou un tel, mais ce que tu veux. C’est là ma citadelle, c’est là mon roc inébranlable, c’est là mon appui solide. Que la volonté de Dieu se fasse. S’il veut que je reste ici, je rends grâce. Quel que soit le lieu où il me veuille, je le bénis. ~
        En quelque lieu que je sois, vous y êtes aussi : le corps ne se sépare pas de la tête, ni la tête du corps. Si nous sommes éloignés par la distance, nous sommes unis par la charité et la mort elle-même ne pourra couper ce lien. Si mon corps vient à mourir, mon âme restera vivante et se souviendra de mon peuple. ~
        Vous êtes mes concitoyens, vous êtes mes pères, vous êtes mes frères, vous êtes mes enfants, vous êtes mes membres, vous êtes mon corps, vous êtes ma lumière, et même vous êtes plus doux pour moi que la lumière. En effet, la lumière du soleil ne m’apporte rien de comparable à ce que m’apporte votre charité. Le soleil m’est utile à présent, mais votre charité me prépare une couronne pour l’avenir.
      responsory: |-
        R/ Pour moi, vivre, c’est le Christ !

        Je suis en captivité pour le Christ,
        captif pour défendre l’Évangile.

        J’ai le désir de m’en aller
        et d’être avec lui.

        Je demeurerai près de vous tous
        pour la joie de votre foi.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Dn 12,3
    content: |-
      Ceux qui ont l’intelligence resplendiront
      >comme la splendeur du firmament,
      et ceux qui sont des maîtres de justice pour la multitude
      >brilleront comme les étoiles pour toujours et à jamais.
  collect:
  - |-
    Seigneur Dieu, force de ceux qui espèrent en toi, +
    >tu as fait briller le bienheureux évêque Jean Chrysostome
    >par une merveilleuse éloquence
    >et par les épreuves qu’il a endurées ; *
    accorde-nous la grâce de suivre ses enseignements /
    >pour avoir la force d’imiter sa patience inébranlable.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 4, 1-7.11-13
      headline: |-
        « Pour que les tâches du ministère soient accomplies et que se construise le corps du Christ »
      content: |-
        Frères,
        moi qui suis en prison à cause du Seigneur,
        je vous exhorte à vous conduire
        >d’une manière digne de votre vocation :
        ayez beaucoup d’humilité, de douceur et de patience,
        supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.
        Et les dons qu’il a faits,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf 39, 8a.9a
      chorus:
      - chorusRef: cf 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        « Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 4, 1-10.13-20
      headline: |-
        « Voici que le semeur sortit pour semer »
      acclamationAntiphon: |-
        La semence est la parole de Dieu ;
        le semeur est le Christ ;
        celui qui le trouve demeure pour toujours.
      content: |-
        En ce temps-là,
        Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
        Une foule très nombreuse se rassembla auprès de lui,
        >si bien qu’il monta dans une barque où il s’assit.
        Il était sur la mer,
        >et toute la foule était près de la mer, sur le rivage.
        Il leur enseignait beaucoup de choses en paraboles,
        et dans son enseignement il leur disait :
        >« Écoutez ! Voici que le semeur sortit pour semer.
        Comme il semait,
        >du grain est tombé au bord du chemin ;
        >les oiseaux sont venus et ils ont tout mangé.
        Du grain est tombé aussi sur du sol pierreux,
        >où il n’avait pas beaucoup de terre ;
        >il a levé aussitôt,
        >parce que la terre était peu profonde ;
        >et lorsque le soleil s’est levé, ce grain a brûlé
        >et, faute de racines, il a séché.
        Du grain est tombé aussi dans les ronces,
        >les ronces ont poussé, l’ont étouffé,
        >et il n’a pas donné de fruit.
        Mais d’autres grains sont tombés dans la bonne terre ;
        >ils ont donné du fruit
        >en poussant et en se développant,
        >et ils ont produit
        >trente, soixante, cent, pour un. »
        Et Jésus disait :
        >« Celui qui a des oreilles pour entendre,
        >qu’il entende ! »
        Quand il resta seul,
        ceux qui étaient autour de lui avec les Douze
        >l’interrogeaient sur les paraboles.
        Il leur dit encore :
        >« Vous ne saisissez pas cette parabole ?
        Alors, comment comprendrez-vous toutes les paraboles ?
        Le semeur sème la Parole.
        Il y a ceux qui sont au bord du chemin
        >où la Parole est semée :
        >quand ils l’entendent,
        >Satan vient aussitôt
        >et enlève la Parole semée en eux.
        Et de même, il y a ceux qui ont reçu la semence
        >dans les endroits pierreux :
        >ceux-là, quand ils entendent la Parole,
        >ils la reçoivent aussitôt avec joie ;
        >mais ils n’ont pas en eux de racine,
        >ce sont les gens d’un moment ;
        >que vienne la détresse ou la persécution à cause de la Parole,
        >ils trébuchent aussitôt.
        Et il y en a d’autres qui ont reçu la semence dans les ronces :
        >ceux-ci entendent la Parole,
        >mais les soucis du monde, la séduction de la richesse
        >et toutes les autres convoitises
        >les envahissent et étouffent la Parole,
        >qui ne donne pas de fruit.
        Et il y a ceux qui ont reçu la semence dans la bonne terre :
        >ceux-là entendent la Parole, ils l’accueillent,
        >et ils portent du fruit :
        >trente, soixante, cent, pour un. »
  offeringPrayer:
  - |-
    Daigne accepter, Seigneur Dieu,
    >ce sacrifice que nous t’offrons de grand cœur,
    >en faisant mémoire du bienheureux Jean Chrysostome : *
    >fidèles à son enseignement,
    >nous voulons nous offrir tout entiers /
    >en célébrant ta louange.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: 1Co 1,23-24
    content: |-
      Nous proclamons le Christ crucifié,
      >le Christ, puissance de Dieu et sagesse de Dieu.
  prayerAfterCommunion:
  - |-
    Dieu de miséricorde, +
    >que les mystères auxquels nous avons communié
    >en faisant mémoire du bienheureux Jean Chrysostome,
    >nous affermissent dans ton amour /
    >et fassent de nous les témoins fidèles de ta vérité.
    Par le Christ, notre Seigneur.