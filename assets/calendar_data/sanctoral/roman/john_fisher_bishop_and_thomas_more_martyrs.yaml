celebration:
  title: Saint Jean Fisher et saint Thomas More
  subtitle: martyrs
  description: Jean Fisher (1469-1535), évêque de Rochester, et Thomas More (1477-1535), chancelier d’Angleterre, furent condamnés à mort par Henry VIII pour avoir refusé de ratifier son divorce et de reconnaître la suprématie du roi sur l’Église d’Angleterre. L’un et l’autre étaient à la fois des hommes de haute culture et des chrétiens austères. L’évêque de Rochester était un controversiste vigoureux. Le chancelier More, marié et père de famille, écrivain de renom, avait des connaissances encyclopédiques. Ils accueillirent tous les deux le martyre comme une grâce merveilleuse du Seigneur Dieu.
  commons:
    - martyrs
  color: red

oration:
  - Tu as voulu, Seigneur, que le témoignage du martyre soit la plus belle expression de la foi ; accorde-nous, à la prière des saints Jean Fisher et Thomas More, la force de confirmer par toute notre vie la foi que nos lèvres proclament.

readings:
  patristicReading:
    - title: ENTRETIENS DE PRISON DE SAINT THOMAS MORE AVEC SA FILLE MARGARET
      content: |-
        Je sais, ma chère Margaret, toute l’indignité de ma vie passée : elle m’a bien mérité que Dieu me laisse trébucher. Cependant je ne puis que faire confiance à sa bonté miséricordieuse. En effet sa grâce m’a fortifié jusqu’ici ; c’est elle qui m’a donné le courage d’abandonner mes biens, mes propriétés et jusqu’à ma vie, plutôt que de jurer contre ma conscience. C’est elle aussi qui a suggéré au Roi de me traiter avec clémence, puisque jusqu’à ce jour il ne m’a pris que ma liberté. Par-là, grâce à Dieu, Sa Majesté m’a procuré un plus grand bien : le progrès spirituel que je suis sûr de trouver ici. Cela vaut mieux que tous les honneurs et les richesses dont il m’avait comblé auparavant. Je ne peux donc manquer de confiance en la grâce de Dieu : ou bien elle retiendra le cœur du roi pour qu’il ne me traite pas plus sévèrement ; ou bien elle me donnera toujours les forces nécessaires pour supporter n’importe quelles épreuves, patiemment, courageusement et même joyeusement.
        Ma patience, unie aux mérites de la cruelle passion du Christ, (qui certes surpasse de mille lieues en mérites et en qualité tout ce que je puis avoir à souffrir), ma patience atténuera les châtiments qui me sont dus au purgatoire et, par la générosité de la bonté divine, elle me vaudra même un petit surplus de récompense au ciel.
        Ma chère Meg, je ne veux pas manquer de confiance en Dieu ; pourtant je sens que la peur pourrait bien me submerger. Je me rappellerai que saint Pierre, à cause de son peu de toi, commençait à s’enfoncer sous un coup de vent, et je ferai comme lui : j’en appellerai au Christ et lui demanderai son secours. Ainsi j’espère qu’il me tendra la main, me saisira et ne me laissera pas m’enfoncer.
        Et s’il permet que je joue le rôle de Pierre dans sa conduite ultérieure, que je tombe tout à fait, en jurant et en abjurant (mais que notre Seigneur, par sa miséricordieuse Passion, m’en préserve, et qu’une telle chute me nuise plutôt que de me rapporter aucun bénéfice), ~ s’il permet que je tombe, j’espère pourtant qu’il jettera sur moi, comme sur Pierre, un regard plein de miséricorde, et qu’il me relèvera pour que je confesse de nouveau la vérité et que je libère ma conscience ; j’espère aussi qu’il me fera supporter courageusement le châtiment et la honte d’un tel reniement.
        Bref, ma chère Margot, je suis absolument certain que, sauf péché de ma part, Dieu ne m’abandonnera pas. En toute espérance et sécurité, je vais donc me confier totalement à lui. S’il me laisse périr à cause de mes fautes, je servirai au moins à glorifier sa justice. J’espère pourtant que sa tendre pitié gardera ma pauvre âme saine et sauve et fera que l’on verra en moi resplendir sa miséricorde plutôt que sa justice.
        Donc, ma chère fille, garde un bon moral, ne te laisse troubler par rien de ce qui peut m’arriver en ce monde.
        Rien ne peut arriver sans que Dieu le veuille. Et tout ce qu’il veut, si mauvais que cela nous paraisse, est vraiment le meilleur.

      responsory: |-
        R/ Heureux l’homme qui met sa foi dans le Seigneur !
        
        Sois fort et tiens bon,
        que le livre de la loi
        soit toujours sur tes lèvres.
        
        Sois sans crainte ni frayeur :
        le Seigneur ton Dieu
        est avec toi partout où tu iras !
        
        Vous tous, disciples du Seigneur,
        fortifiez-vous
        dans la grâce du Seigneur Jésus !

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    tu as voulu que la foi trouve dans le martyre
    son expression la plus parfaite ; *
    >à la prière des saints Jean Fisher et Thomas More,
    >accorde-nous, dans ta bonté, /
    >la force de confirmer par le témoignage de notre vie
    >la foi que nos lèvres proclament.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1P 4, 12-19
      headline: « Puisque vous communiez aux souffrances du Christ, réjouissez-vous ! »
      content: |-
        Bien-aimés,
        ne trouvez pas étrange le brasier allumé parmi vous
        pour vous mettre à l’épreuve ;
        ce qui vous arrive n’a rien d’étrange.
        Dans la mesure où vous communiez aux souffrances du Christ,
        réjouissez-vous,
        afin d’être dans la joie et l’allégresse
        quand sa gloire se révélera.
        Si l’on vous insulte pour le nom du Christ,
        heureux êtes-vous,
        parce que l’Esprit de gloire, l’Esprit de Dieu,
        repose sur vous.
        Que personne d’entre vous, en effet,
        n’ait à souffrir comme meurtrier, voleur, malfaiteur,
        ou comme agitateur.
        Mais si c’est comme chrétien,
        qu’il n’ait pas de honte,
        et qu’il rende gloire à Dieu pour ce nom-là.
        Car voici le temps du jugement :
        il commence par la famille de Dieu.
        Or, s’il vient d’abord sur nous,
        quelle sera la fin de ceux qui refusent d’obéir à l’Évangile de Dieu ?
        Et, si le juste est sauvé à grand-peine,
        l’impie, le pécheur, où va-t-il se montrer ?
        Ainsi, ceux qui souffrent
        en faisant la volonté de Dieu,
        qu’ils confient leurs âmes au Créateur fidèle,
        en faisant le bien.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 125 (126), 1-2ab, 2cd-3, 4-5, 6
      refAbbr: cf. 125, 5
      chorus:
      - chorusRef: cf. 125, 5
        chorus: |-
          Ceux qui sèment dans les larmes
          moissonnent dans la joie.
      content: |-
        Quand le Seigneur ramena les captifs à Sion,
        nous étions comme en rêve !
        Alors notre bouche était pleine de rires,
        nous poussions des cris de joie.

        Alors on disait parmi les nations :
        « Quelles merveilles fait pour eux le Seigneur ! »
        Quelles merveilles le Seigneur fit pour nous :
        nous étions en grande fête !

        Ramène, Seigneur, nos captifs,
        comme les torrents au désert.
        Qui sème dans les larmes
        moissonne dans la joie.

        Il s’en va, il s’en va en pleurant,
        il jette la semence ;
        il s’en vient, il s’en vient dans la joie,
        il rapporte les gerbes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 34-39
      headline: « Je ne suis pas venu apporter la paix, mais le glaive »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Ne pensez pas que je sois venu
        apporter la paix sur la terre :
        je ne suis pas venu apporter la paix, mais le glaive.
        Oui, je suis venu séparer
        l’homme de son père,
        la fille de sa mère,
        la belle-fille de sa belle-mère :
        on aura pour ennemis les gens de sa propre maison.
        Celui qui aime son père ou sa mère plus que moi
        n’est pas digne de moi ;
        celui qui aime son fils ou sa fille plus que moi
        n’est pas digne de moi ;
        celui qui ne prend pas sa croix et ne me suit pas
        n’est pas digne de moi.
        Qui a trouvé sa vie
        la perdra ;
        qui a perdu sa vie à cause de moi
        la trouvera. »
