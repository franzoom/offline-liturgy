celebration:
  title: Saint Jean d’Avila
  subtitle: prêtre et docteur de l’Église
  description: JJean d’Avila, ou plus précisément De Avila, est né vers 1500 à Almodovar del Campo, en Espagne. Ordonné prêtre, il parcourut toute l’Andalousie en prêchant le Christ. Par de nombreux écrits, il montra aux prêtres quelles étaient la nature et l’importance du concile de Trente ; par sa parole, il plaida de façon remarquable pour l’application de celui-ci ; Injustement soupçonné d’hérésie, il accepta d’être soumis à des interrogatoires et emprisonné. Mais cela ne l’empêcha pas d’enseigner, avec une ferveur plus grande encore, la doctrine catholique. Dans ses dernières années, il se retira à Montilla, dans le diocèse de Cordoue, où il s’endormit dans le Seigneur le 10 mai 1569.
  commons:
  - pastors
  - pastors_doctors
  color: white

oration:
  - |-
    Seigneur Dieu, tu as donné à tes ministres et à ton peuple saint Jean d’Avila comme un maître incomparable par la sainteté et la ferveur de sa vie , nous t’en prions : fais que de même, en notre temps, l’Église grandisse en sainteté, grâce à la ferveur renouvelée des ministres qui te servent.

