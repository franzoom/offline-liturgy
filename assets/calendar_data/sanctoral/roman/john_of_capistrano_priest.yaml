celebration:
  title: Saint Jean de Capistran
  subtitle: prêtre
  description: Jean de Capistran (1386-1456), franciscain plein de talent et prédicateur à la parole ardente, était un meneur de foules. n travailla d’abord à la réforme de son Ordre en France et en Italie, puis il parcourut toute l’Europe centrale pour lutter contre l’hérésie de Jean Hus. Il dut enfin prêcher la Croisade contre les Turcs qui menaient la Hongrie.
  commons:
  - pastors
  color: white

oration:
- |-
  Dieu qui as suscité saint Jean de Capistran pour fortifier ton peuple dans les épreuves, nous te le demandons avec confiance : mets-nous en sûreté sous ta protection, et garde ton Église dans une paix durable.

readings:
  patristicReading:
    - title: LE « MIROIR DES CLERCS » PAR SAINT JEAN DE CAPISTRAN
      content: |-
        Ceux qui sont appelés à la table du Seigneur doivent rayonner par toute une vie exemplaire et digne d’éloges, exempte de toute l’impureté des vices. Ils doivent vivre en étant comme le sel de la terre pour eux-mêmes et pour les autres, en éclairant les autres par une lumineuse sagesse, comme étant la lumière du monde. Ils doivent comprendre ce que le maître très-haut, Jésus Christ, a indiqué non seulement aux Apôtres et aux disciples, mais à tous les prêtres et les clercs, leurs successeurs, lorsqu’il a dit : %Vous êtes le sel de la terre. Si le sel se dénature, comment redeviendra-t-il du sel ? Il n’est plus bon à rien : on le jette dehors et les gens le piétinent%.
        Ce qui est vraiment piétiné par les gens, comme du fumier méprisable, c’est un clergé impur et sordide, imprégné par la saleté des vices et paralysé par les chaînes des péchés, si bien qu’il ne peut plus rien faire pour soi ni pour les autres car, comme dit saint Grégoire : « Celui dont la vie est décriée, aboutit à ce que sa prédication soit méprisée. »
        %Les prêtres qui exercent bien la présidence méritent double honneur, surtout ceux qui peinent au ministère de la parole et à l’enseignement%. Oui, les bons prêtres méritent double honneur : concernant les choses et leur personne, autrement dit temporel autant que spirituel, ou encore transitoire et éternel. Car, s’ils habitent sur terre avec des créatures mortelles en vertu des liens de la nature, ils se préoccupent ardemment de vivre au ciel avec les anges pour être bien vus du Roi, comme de sages ministres. C’est pourquoi, de même que le soleil se lève pour le monde dans les hauteurs de Dieu, que %la lumière% du clergé %brille devant les hommes afin qu’en voyant ce que font de bien% ces serviteurs de Dieu, les hommes %rendent gloire au Père qui est aux cieux%.
        %Vous êtes la lumière du monde%. Non seulement la lumière se manifeste elle-même, mais en répandant ses rayons tout autour d’elle, elle illumine les objets qu’elle touche ; de même la vie lumineuse des clercs irréprochables, par le rayonnement de leur sainteté, éclaire et apaise ceux qui les regardent. Chargé de s’occuper des autres, le clerc doit montrer en lui-même comment les autres doivent vivre dans la maison du Seigneur.

      responsory: |-
        R/ Lumière sur nos pas, Jésus Christ,
        dans les chemins de vérité !
        
        Celui qui fait la vérité
        vient à la lumière.
        
        Celui qui aime est né de Dieu
        et connaît Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as suscité saint Jean de Capistran
    >pour fortifier ton peuple dans les épreuves ; *
    nous te prions avec confiance :
    >garde-nous en sûreté sous ta protection, /
    >et assure à ton Église une paix durable.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Co 5, 14-20
      headline: « Dieu nous a donné le ministère de la réconciliation »
      content: |-
        Frères,
        l’amour du Christ nous saisit
        quand nous pensons qu’un seul est mort pour tous,
        et qu’ainsi tous ont passé par la mort.
        Car le Christ est mort pour tous,
        afin que les vivants n’aient plus leur vie centrée sur eux-mêmes,
        mais sur lui, qui est mort et ressuscité pour eux.
        Désormais nous ne regardons plus personne
        d’une manière simplement humaine :
        si nous avons connu le Christ de cette manière,
        maintenant nous ne le connaissons plus ainsi.
        Si donc quelqu’un est dans le Christ,
        il est une créature nouvelle.
        Le monde ancien s’en est allé,
        un monde nouveau est déjà né.
        Tout cela vient de Dieu :
        il nous a réconciliés avec lui par le Christ,
        et il nous a donné le ministère de la réconciliation.
        Car c’est bien Dieu
        qui, dans le Christ, réconciliait le monde avec lui :
        il n’a pas tenu compte des fautes,
        et il a déposé en nous la parole de la réconciliation.
        Nous sommes donc les ambassadeurs du Christ,
        et par nous c’est Dieu lui-même qui lance un appel :
        nous le demandons au nom du Christ,
        laissez-vous réconcilier avec Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        chorus: Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 9, 57-62
      headline: « Je te suivrai partout où tu iras »
      acclamationAntiphon: |-
        Moi, je suis la lumière du monde, dit le Seigneur.
        Celui qui me suit aura la lumière de la vie.
      content: |-
        En ce temps-là,
        en cours de route, un homme dit à Jésus :
        « Je te suivrai partout où tu iras. »
        Jésus lui déclara :
        « Les renards ont des terriers,
        les oiseaux du ciel ont des nids ;
        mais le Fils de l’homme n’a pas d’endroit où reposer la tête. »
        Il dit à un autre :
        « Suis-moi. »
        L’homme répondit :
        « Seigneur, permets-moi d’aller d’abord enterrer mon père. »
        Mais Jésus répliqua :
        « Laisse les morts enterrer leurs morts.
        Toi, pars, et annonce le règne de Dieu. »
        Un autre encore lui dit :
        « Je te suivrai, Seigneur ;
        mais laisse-moi d’abord faire mes adieux
        aux gens de ma maison. »
        Jésus lui répondit :
        « Quiconque met la main à la charrue,
        puis regarde en arrière,
        n’est pas fait pour le royaume de Dieu. »
        .
