celebration:
  title: Saint jean de Dieu
  subtitle: religieux
  description: Jean de Dieu (1495‑1550), qui était d’origine portugaise, se fixa à Grenade (Espagne) après une jeunesse aventureuse. Bouleversé à la vue du dénuement des hôpitaux, il se mit à recueillir les malades chez lui et à les soigner, mendiant leur nourriture quotidienne. Ainsi naquit l’Ordre des Frères de saint Jean de Dieu, qui perpétue encore de nos jours son action.
  commons:
  - saints-male_religious
  color: white

oration:
- |-
  Toi qui as mis au cœur de saint Jean de Dieu un esprit de tendre compassion, Seigneur, nous te prions: donne-nous de servir nos frères avec charité, et de pouvoir ainsi trouver place en ton Royaume.

readings:
  patristicReading:
  - title: LETTRE SAINT JEAN DE DIEU
    content: |-
      Si nous considérions la miséricorde de Dieu, jamais nous ne cesserions de faire le bien, tant que nous en avons le pouvoir. Car lorsque nous transmettons aux pauvres, par amour pour Dieu, ce que lui-même nous a donné, il nous promet le centuple dans la béatitude éternelle. Quel intérêt avantageux! quel bienheureux bénéfice! Qui ne donnera pas à cet excellent négociant tout ce qu’il possède, alors qu’il va prendre soin de nos affaires et nous suppliera de nous tourner vers lui, de pleurer nos péchés et de nous adonner à la charité, d’abord envers nous-même, et ensuite envers nos proches. Car, ainsi que l’eau éteint le feu, la charité efface les péchés.
      Tant de pauvres viennent ici que je me demande souvent moi-même comment on pourra les secourir; mais Jésus Christ pourvoit à tout et nourrit tout le monde. Beaucoup de pauvres viennent à la maison de Dieu, parce que Grenade est une grande ville où il fait très froid, surtout en hiver. Actuellement, cette maison loge plus de cent dix personnes: malades, bien portants, domestiques, pèlerins. En effet, comme c’est une maison générale, elle reçoit des malades de tout genre et de toute situation: infirmes, mutilés, lépreux, muets, fous, paralytiques, teigneux, de grands vieillards, beaucoup d’enfants, et surtout d’innombrables pèlerins et voyageurs. Ils viennent ici et on leur donne le feu, l’eau et le sel, ainsi que des récipients pour y faire cuire leur nourriture. Pour tout cela, on ne demande aucun paiement à personne, mais le Christ pourvoit.
      C’est pourquoi je suis en ce moment accablé de dettes, et je suis prisonnier pour Jésus Christ. Parce que je suis écrasé de dettes, je n’ose guère sortir de la maison à cause de tout cet arriéré qui me ligote. Mais lorsque je vois tant de pauvres, mes frères et mon prochain, souffrir au-delà de leurs forces, subir tant de peines dans leur âme et dans leur corps, et que je ne peux les soulager, je suis bien triste. Mais je mets ma confiance dans le Christ, car il connaît mon cœur. C’est pourquoi je dis: %Malheureux homme qui met sa confiance dans l’homme% et non pas dans le Christ seul. Car les hommes, tu en seras séparé, que tu le veuilles ou non. Mais le Christ est fidèle, il est toujours la, car le Christ prévoit tout. A tout instant, rendons-lui grâce. Amen.
    responsory: |-
      R/ Partager son pain avec l’affamé,
      voilà le jeûne qui plaît à Dieu.

      Ouvre ton cœur au pauvre: c’est ton frère,
      et si tu cries, le Seigneur répondra;
      à tes appels, il dira: Me voici!

      Ouvre ton cœur au pauvre: c’est ton frère,
      et quand le Fils de l’homme viendra, il te dira :
      J’avais faim et tu m’as donné à manger.

morning:
  evangelicAntiphon:
    common:
    - À l’amour que vous aurez les uns pour les autres, on reconnaîtra que vous êtes mes disciples.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Recevez le Royaume préparé pour vous: ce que vous avez tait à l’un de ces petits, c’est à moi que vous l’avez fait.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Toi qui as répandu un esprit de compassion
    >sur saint Jean de Dieu,
    >nous te prions, Seigneur : *
    donne-nous de mettre en œuvre ta charité, /
    >et ainsi de trouver place parmi les élus dans ton Royaume.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 1 Jn 3, 14-18
      headline: « Nous aussi, nous devons donner notre vie pour nos frères »
      content: |-
        Bien-aimés,
        nous savons que nous sommes passés de la mort à la vie,
        >parce que nous aimons nos frères.
        Celui qui n’aime pas
        >demeure dans la mort.
        Quiconque a de la haine contre son frère
        >est un meurtrier,
        et vous savez que pas un meurtrier
        >n’a la vie éternelle demeurant en lui.
        Voici comment nous avons reconnu l’amour :
        >lui, Jésus, a donné sa vie pour nous.
        Nous aussi, nous devons donner notre vie pour nos frères.
        Celui qui a de quoi vivre en ce monde,
        >s’il voit son frère dans le besoin
        >sans faire preuve de compassion,
        comment l’amour de Dieu pourrait-il demeurer en lui ?
        Petits enfants,
        >n’aimons pas en paroles ni par des discours,
        >mais par des actes et en vérité.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8a, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: Heureux qui craint le Seigneur.
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 25, 31-40
      headline: « Chaque fois que vous l’avez fait à l’un de ces plus petits de mes frères, c’est à moi que vous l’avez fait »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Quand le Fils de l’homme viendra dans sa gloire,
        et tous les anges avec lui,
        alors il siégera sur son trône de gloire.
        Toutes les nations seront rassemblées devant lui ;
        il séparera les hommes les uns des autres,
        comme le berger sépare les brebis des boucs :
        il placera les brebis à sa droite, et les boucs à gauche.
        Alors le Roi dira à ceux qui seront à sa droite :
        "Venez, les bénis de mon Père,
        recevez en héritage le Royaume
        préparé pour vous depuis la fondation du monde.
        Car j’avais faim, et vous m’avez donné à manger ;
        j’avais soif, et vous m’avez donné à boire ;
        j’étais un étranger, et vous m’avez accueilli ;
        j’étais nu, et vous m’avez habillé ;
        j’étais malade, et vous m’avez visité ;
        j’étais en prison, et vous êtes venus jusqu’à moi !"
        Alors les justes lui répondront :
        "Seigneur,
        quand est-ce que nous t’avons vu :
        tu avais donc faim, et nous t’avons nourri ?
        tu avais soif, et nous t’avons donné à boire ?
        tu étais un étranger, et nous t’avons accueilli ?
        tu étais nu, et nous t’avons habillé ?
        tu étais malade ou en prison...
        Quand sommes-nous venus jusqu’à toi ?"
        Et le Roi leur répondra :
        "Amen, je vous le dis :
        chaque fois que vous l’avez fait
        à l’un de ces plus petits de mes frères,
        c’est à moi que vous l’avez fait." »
        
