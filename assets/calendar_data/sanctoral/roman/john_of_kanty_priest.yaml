celebration:
  title: Saint Jean de Kenty
  subtitle: prêtre
  description: Jean de Kenty (1390-1473), prêtre polonais, enseigna la philosophie et la théologie à l’université de Cracovie. Le professeur rayonnait par son savoir, mais plus encore par sa charité pour les pauvres et son esprit de pénitence. Persuadé de la valeur spirituelle du pèlerinage, il alla vénérer le tombeau du Christ à Jérusalem et se rendit quatre fois à Rome.
  commons:
  - pastors
  color: white

oration:
  - Accorde-nous, Dieu tout-puissant, de progresser dans l’intelligence de ton mystère, à l’exemple de saint Jean de Kenty, et de trouver auprès de toi le pardon, pour avoir pratiqué la charité envers tous.

readings:
  patristicReading:
    - title: BULLE DU PAPE CLÉMENT XIII, POUR LA CANONISATION DE SAINT JEAN DE KENTY
      subtitle: 2 février 1767
      content: |-
        Parmi les hommes éminents par la doctrine et la sainteté, capables d’agir et d’enseigner et de défendre la foi orthodoxe attaquée par ses adversaires, personne n’hésite à compter le bienheureux Jean de Kenty. Il suffit de l’avoir entendu, à l’université de Cracovie, enseigner une science puisée à la source la plus pure. Or, à cette époque, dans des régions guère éloignées, sévissaient les schismes et les hérésies. Il travaillait à expliquer au peuple, dans sa prédication, la morale la plus sainte ; et il confirmait cet enseignement par son humilité, sa chasteté, sa miséricorde, ses pénitences corporelles, toutes les vertus d’un prêtre irréprochable et d’un vaillant ouvrier.
        C’est pourquoi il ne se contenta pas d’apporter aux professeurs de cette université un surcroît de prestige, mais il laissa aussi un merveilleux exemple à tous ceux qui exercent cette charge. Qu’ils s’efforcent énergiquement d’être de parfaits enseignants et qu’ils travaillent de toutes leurs forces à unir la science des saints à leurs autres compétences, pour la louange et la gloire de Dieu seul.
        Il ajoutait l’humilité au respect avec lequel il traitait des choses divines. Ayant une modeste opinion de lui-même, malgré sa supériorité scientifique incontestable, il ne se mettait jamais au-dessus des autres ; il souhaitait même être dédaigné et méprisé par tous ; rien ne lui était plus étranger que de montrer de l’impatience envers ceux qui le contredisaient ou le méprisaient.
        Son humilité s’accompagnait d’une rare simplicité, digne d’un enfant ; aussi, dans ses actions et ses paroles, il n’y avait aucun artifice, aucun faux semblant ; ce qu’il avait au fond du cœur venait facilement sur ses lèvres. S’il soupçonnait, en ayant dit la vérité, avoir blessé quelqu’un par ses paroles, avant de monter à l’autel il demandait humblement pardon, non pas tant pour son erreur que pour celle de l’autre. Dans la journée, après avoir accompli sa tâche, il se rendait directement de l’école à l’église. Et là, devant le Christ caché dans l’Eucharistie, il prolongeait sa contemplation et sa prière. Dieu seul occupait tout son cœur, Dieu seul était sur ses lèvres.

      responsory: |-
        R/ Partager son pain avec l’affamé,
        voilà le jeûne qui plaît à Dieu.
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et si tu cries, le Seigneur répondra ;
        à tes appels, il dira : Me voici !
        
        Ouvre ton cœur au pauvre : c’est ton frère.
        Et quand le Fils de l’homme viendra, il te dira :
        J’avais faim et tu m’as donné à manger.

morning:
  evangelicAntiphon:
    common: À l’amour que vous aurez les uns pour les autres, on reconnaîtra que vous êtes mes disciples.

vespers:
  evangelicAntiphon:
    common: |-
      Venez les bénis de mon Père : ce que vous avez fait à l’un de ces petits, c’est à moi que vous l’avez fait.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Accorde-nous, Dieu tout-puissant,
    >de progresser dans l’intelligence de ton mystère,
    >à l’exemple du prêtre saint Jean de Kenty, *
    et de trouver auprès de toi le pardon /
    >après avoir fait preuve de miséricorde envers tous.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Jc 2, 14-17
      headline: « La foi, si elle n’est pas mise en œuvre, est bel et bien morte »
      content: |-
        Mes frères,
        si quelqu’un prétend avoir la foi,
        sans la mettre en œuvre,
        à quoi cela sert-il ?
        Sa foi peut-elle le sauver ?
        Supposons qu’un frère ou une sœur
        n’ait pas de quoi s’habiller,
        ni de quoi manger tous les jours ;
        si l’un de vous leur dit :
        « Allez en paix !
        Mettez-vous au chaud,
        et mangez à votre faim ! »
        sans leur donner le nécessaire pour vivre,
        à quoi cela sert-il ?
        Ainsi donc, la foi, si elle n’est pas mise en œuvre,
        est bel et bien morte.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8a, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: Heureux qui craint le Seigneur !
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 6, 27-38
      headline: « Donne à quiconque te demande »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        Jésus déclarait à ses disciples :
        « Je vous le dis, à vous qui m’écoutez :
        Aimez vos ennemis,
        faites du bien à ceux qui vous haïssent.
        Souhaitez du bien à ceux qui vous maudissent,
        priez pour ceux qui vous calomnient.
        À celui qui te frappe sur une joue,
        présente l’autre joue.
        À celui qui te prend ton manteau,
        ne refuse pas ta tunique.
        Donne à quiconque te demande,
        et à qui prend ton bien, ne le réclame pas.
        Ce que vous voulez que les autres fassent pour vous,
        faites-le aussi pour eux.
        Si vous aimez ceux qui vous aiment,
        quelle reconnaissance méritez-vous ?
        Même les pécheurs aiment ceux qui les aiment.
        Si vous faites du bien à ceux qui vous en font,
        quelle reconnaissance méritez-vous ?
        Même les pécheurs en font autant.
        Si vous prêtez à ceux dont vous espérez recevoir en retour,
        quelle reconnaissance méritez-vous ?
        Même les pécheurs prêtent aux pécheurs
        pour qu’on leur rende l’équivalent.
        Au contraire, aimez vos ennemis,
        faites du bien et prêtez sans rien espérer en retour.
        Alors votre récompense sera grande,
        et vous serez les fils du Très-Haut,
        car lui, il est bon pour les ingrats et les méchants.
        Soyez miséricordieux comme votre Père est miséricordieux.
        Ne jugez pas, et vous ne serez pas jugés ;
        ne condamnez pas, et vous ne serez pas condamnés.
        Pardonnez, et vous serez pardonnés.
        Donnez, et l’on vous donnera :
        c’est une mesure bien pleine, tassée, secouée, débordante,
        qui sera versée dans le pan de votre vêtement ;
        car la mesure dont vous vous servez pour les autres
        servira de mesure aussi pour vous. »
        Acclamons la Parole de Dieu.
