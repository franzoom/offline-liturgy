celebration:
  title: Saint Jean de la Croix
  subtitle: prêtre et docteur de l’Église
  description: Jean de la Croix (1542-1591), religieux carme espagnol, rencontra à vingt-cinq ans Thérèse d’Avila, la réformatrice du Carmel. Il voulut adopter, lui aussi, l’observance primitive, mais ses supérieurs s’y opposèrent violemment. La persécution ne fit qu’aider à son union avec Dieu sur les sommets de la vie mystique, dont ses écrits ont gardé la brûlure.
  commons:
  - pastors_doctors
  color: white

oration:
  - Dieu qui inspiras à ton prêtre saint Jean un extraordinaire amour de la croix et le renoncement total à lui-même, fais qu’en nous attachant à le suivre, nous parvenions à la contemplation éternelle de ta gloire.

readings:
  patristicReading:
    - title: LE CANTIQUE SPIRITUEL (1584) DE SAINT JEAN DE LA CROIX
      content: |-
        Malgré tous les mystères et toutes les merveilles que les saints docteurs ont découverts ou que les saintes âmes ont pu contempler ici-bas, la plus grande partie en reste encore à dire et même à concevoir. Ce qui est dans le Christ est inépuisable ! C’est comme une mine abondante remplie d’une infinité de filons avec des richesses sans nombre ; on a beau y puiser, on n’en voit jamais le terme ; bien plus, chaque repli renferme ici et là de nouveaux filons à richesses nouvelles ; ce qui faisait dire à saint Paul du Christ : %Dans le Christ se trouvent cachés tous les trésors de la sagesse et de la connaissance de Dieu%. Mais l’âme ne peut y pénétrer ni les atteindre, si, comme nous l’avons dit, elle ne passe pas d’abord et n’entre pas dans la profondeur des souffrances extérieures et intérieures ; il faut, de plus, qu’elle ait reçu de Dieu une foule de faveurs intellectuelles et sensibles, et qu’elle se soit exercée longtemps dans la spiritualité ; ces faveurs sont en effet d’un ordre inférieur : ce sont des dispositions pour arriver aux cavernes élevées de la connaissance des mystères du Christ, la plus haute sagesse à laquelle on puisse parvenir ici-bas.
        Oh ! si l’on finissait enfin par comprendre qu’il est impossible de parvenir à la profondeur de la sagesse et des richesses de Dieu sans pénétrer dans la profondeur de la souffrance de mille manières, l’âme y mettant sa joie et ses désirs (%afin de comprendre avec tous les saints quelle en est la largeur et la longueur, la hauteur et la profondeur%) ! L’âme qui désire vraiment la sagesse désire aussi vraiment entrer plus avant dans les profondeurs de la Croix qui est le chemin de la vie ; mais peu y entrent. Tous veulent entrer dans les profondeurs de la sagesse, des richesses et des délices de Dieu, mais peu désirent entrer dans la profondeur des souffrances et des douleurs endurées par le Fils de Dieu : on dirait que beaucoup voudraient être déjà parvenus au terme sans prendre le chemin et le moyen qui y conduit.
      responsory: |-
        R/ Qui nous fera comprendre pourquoi
        l’homme peine à chercher
        sans jamais atteindre ?

        Ce que l’œil n’a pas vu, ni l’oreille entendu,
        ce qui n’est pas monté au cœur de l’homme,
        voilà ce que Dieu a préparé pour ceux qui l’aiment.

        À nous, Dieu l’a révélé par l’Esprit,
        car l’Esprit sonde tout,
        jusqu’aux profondeurs de Dieu.

morning:
  hymn: 
  - toute-forme-evanouie

vespers:
  hymn: 
  - toute-forme-evanouie

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ga 6,14
    content: |-
      Que la croix de notre Seigneur Jésus Christ
      >soit ma seule fierté.
      Par elle, le monde est crucifié pour moi,
      >et moi pour le monde.
  collect:
  - |-
    Seigneur Dieu, +
    >tu inspiras au prêtre saint Jean
    >le renoncement total à lui-même
    >et un extraordinaire amour de la croix ; *
    accorde-nous de suivre fidèlement son exemple, /
    >et de parvenir ainsi à la contemplation éternelle de ta gloire.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 2, 1-10a
      headline: « Nous proclamons la sagesse du mystère de Dieu »
      content: |-
        Frères,
        quand je suis venu chez vous,
        >je ne suis pas venu vous annoncer le mystère de Dieu
        >avec le prestige du langage ou de la sagesse.
        Parmi vous, je n’ai rien voulu connaître d’autre que Jésus Christ,
        >ce Messie crucifié.
        Et c’est dans la faiblesse, craintif et tout tremblant,
        >que je me suis présenté à vous.
        Mon langage, ma proclamation de l’Évangile,
        >n’avaient rien d’un langage de sagesse qui veut convaincre ;
        mais c’est l’Esprit et sa puissance qui se manifestaient,
        >pour que votre foi repose, non pas sur la sagesse des hommes,
        >mais sur la puissance de Dieu.
        Pourtant, c’est bien de sagesse que nous parlons
        >devant ceux qui sont adultes dans la foi,
        mais ce n’est pas la sagesse de ce monde,
        >la sagesse de ceux qui dirigent ce monde
        >et qui vont à leur destruction.
        Au contraire, ce dont nous parlons,
        >c’est de la sagesse du mystère de Dieu,
        >sagesse tenue cachée, établie par lui dès avant les siècles,
        >pour nous donner la gloire.
        Aucun de ceux qui dirigent ce monde ne l’a connue,
        >car, s’ils l’avaient connue,
        >ils n’auraient jamais crucifié le Seigneur de gloire.
        Mais ce que nous proclamons, c’est, comme dit l’Écriture :
        >ce que l’œil n’a pas vu, ce que l’oreille n’a pas entendu,
        >ce qui n’est pas venu à l’esprit de l’homme,
        >ce que Dieu a préparé pour ceux dont il est aimé.
        Et c’est à nous que Dieu, par l’Esprit, en a fait la révélation.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 36 (37), 3-4, 5-6, 30-31
      refAbbr: 36, 30a
      chorus:
      - chorusRef: 36, 30a
        chorus: Les lèvres du juste redisent la sagesse.
      content: |-
        Fais confiance au Seigneur, agis bien,
        habite la terre et reste fidèle ;
        mets ta joie dans le Seigneur :
        il comblera les désirs de ton cœur.

        Dirige ton chemin vers le Seigneur,
        fais-lui confiance, et lui, il agira.
        Il fera lever comme le jour ta justice,
        et ton droit comme le plein midi.

        Les lèvres du juste redisent la sagesse
        et sa bouche énonce le droit.
        La loi de son Dieu est dans son cœur ;
        il va, sans craindre les faux pas.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 14, 25-33 (pour les religieux)
      headline: « Celui qui ne renonce pas à tout ce qui lui appartient ne peut pas être mon disciple »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        de grandes foules faisaient route avec Jésus ;
        il se retourna et leur dit :
        « Si quelqu’un vient à moi
        sans me préférer à son père, sa mère, sa femme,
        ses enfants, ses frères et sœurs,
        et même à sa propre vie,
        il ne peut pas être mon disciple.
        Celui qui ne porte pas sa croix
        pour marcher à ma suite
        ne peut pas être mon disciple.
        Quel est celui d’entre vous
        qui, voulant bâtir une tour,
        ne commence par s’asseoir
        pour calculer la dépense
        et voir s’il a de quoi aller jusqu’au bout ?
        Car, si jamais il pose les fondations
        et n’est pas capable d’achever,
        tous ceux qui le verront vont se moquer de lui :
        "Voilà un homme qui a commencé à bâtir
        et n’a pas été capable d’achever !"
        Et quel est le roi
        qui, partant en guerre contre un autre roi,
        ne commence par s’asseoir
        pour voir s’il peut, avec dix mille hommes,
        affronter l’autre qui marche contre lui avec vingt mille ?
        S’il ne le peut pas,
        il envoie, pendant que l’autre est encore loin,
        une délégation pour demander les conditions de paix.
        Ainsi donc, celui d’entre vous qui ne renonce pas
        à tout ce qui lui appartient
        ne peut pas être mon disciple. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Dieu tout-puissant, +
    >regarde le sacrifice que nous offrons
    >en faisant mémoire de saint Jean de la Croix : *
    donne-nous d’imiter dans notre vie /
    >les mystères de la passion du Seigneur que nous célébrons.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: cf. Mt 16,24
    content: |-
      Si quelqu’un veut marcher à ma suite, dit le Seigneur,
      qu’il renonce à lui-même, qu’il prenne sa croix,
      >et qu’il me suive.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >en saint Jean tu as fait resplendir de manière admirable
    >le mystère de la croix ; *
    puisque nous sommes fortifiés par ce sacrifice,
    >accorde-nous de rester fidèlement unis au Christ, /
    et de travailler dans l’Église au salut de tous.
    Par le Christ, notre Seigneur.