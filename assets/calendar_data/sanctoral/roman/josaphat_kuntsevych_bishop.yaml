celebration:
  title: Saint Josaphat
  subtitle: évêque et martyr
  description: Né dans l’Orthodoxie (1580), Josaphat Kuncewycz adhéra de bonne heure à l’Église ukrainienne unie à Rome. En 1617, il devint archevêque de Polotz et se consacra sans compter au service de son peuple. Le succès de son action apostolique suscita l’hostilité des adversaires de l’Église catholique. Il fut massacré à Vitebsk au cours d’une visite pastorale (1623).
  commons: 
  - pastors_bishop
  - martyr
  color: red

oration:
  - |-
    Réveille en ton Église, Seigneur, l’esprit d’amour dont fut rempli l’évêque saint Josaphat qui donna sa vie pour son peuple : permets qu’avec l’appui de sa prière, et fortifiés par le même esprit, nous n’hésitions pas à livrer notre vie pour nos frères.

readings:
  patristicReading:
    - title: LETTRE ENCYCLIQUE DU PAPE PIE XI POUR LE III^ème CENTENAIRE DE LA MORT DE SAINT JOSAPHAT
      content: |-
        L’Église, par un admirable dessein de Dieu, a été constituée pour être à la plénitude des temps, comme une immense famille embrassant l’universalité du genre humain et nous savons aussi que, parmi d’autres notes caractéristiques, elle est reconnaissable à son unité oecuménique.
        En effet, le Christ Seigneur a dit : %Tout pouvoir m’a été donné au ciel et sur la terre. Allez donc ! De toutes les nations faites des disciples.% Par ces paroles, il a confié aux seuls Apôtres la charge que lui-même avait reçue de son Père ; et en outre, il a voulu que le collège des Apôtres fût parfaitement un, rendu solidaire par un double lien très étroit : intérieurement, par une même foi et par cet amour %qui a été répandu dans nos cœurs par l’Esprit Saint% ; extérieurement, par l’autorité exercée sur tous par un seul, puisqu’il avait conféré la primauté sur les autres Apôtres à Pierre comme au principe constant et au fondement visible de l’unité. ~
        Pour assurer le maintien perpétuel de cette unité et de cette harmonie, la Providence de Dieu les a consacrées comme par le sceau de la sainteté et du martyre. Cette grande gloire fut accordée à Josaphat, archevêque de Polotz, du rite slave oriental, en qui nous reconnaissons à juste titre le plus illustre et le plus noble soutien de l’Orient slave. Certes, on trouvera difficilement quelqu’un qui ait fait plus d’honneur à cette dénomination et qui ait contribué davantage au salut de ces peuples que celui qui en fut le pasteur et l’apôtre, du fait surtout qu’il a versé son sang pour l’unité de la sainte Église. ~
        Il se sentit poussé par un mouvement venu du ciel à restaurer l’unité chrétienne dans le monde entier ; et il comprit qu’il pourrait y contribuer dans la plus large mesure s’il maintenait dans l’unité de l’Église universelle le rite slave oriental et l’ordre des moines basiliens. ~
        Préoccupé avant tout de l’union de ses compatriotes avec la chaire de saint Pierre, il rassemblait de toutes parts les arguments capables de promouvoir ou de consolider cette union ; en particulier, il étudiait assidûment les livres liturgiques dont usaient les Orientaux, y compris les dissidents, selon les prescriptions des Pères.
        Après s’être préparé avec un si grand soin, il entreprit la restauration de l’unité ; et il y travailla avec tant de force et de douceur tout ensemble, et avec tant de succès, que ses adversaires eux-mêmes le surnommèrent « le voleur des âmes ».
      responsory: |-
        R/ Un seul troupeau, un seul berger !

        Le Seigneur va rassembler ses enfants dispersés,
        il en fera une seule nation,
        et un seul roi régnera sur eux.

        Le Christ, notre paix, a détruit les séparations :
        en un seul corps,
        il nous rassemble par la croix.

mass: 
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Fidèles à l’alliance du Seigneur et aux lois de leurs pères,
      les saints de Dieu ont persévéré dans l’amour fraternel
      >car ils avaient toujours un même esprit et une même foi.
  collect:
  - |-
    Réveille en ton Église, Seigneur,
    >l’Esprit dont fut rempli saint Josaphat,
    >vrai berger qui donna sa vie pour ses brebis ; *
    permets qu’avec l’appui de sa prière,
    >et fortifiés par le même Esprit, /
    >nous n’ayons pas peur de donner notre vie pour nos frères.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 4, 1-7.11-13
      headline: « Pour que les tâches du ministère soient accomplies et que se construise le corps du Christ »
      content: |-
        Frères,
        moi qui suis en prison à cause du Seigneur,
        >je vous exhorte à vous conduire
        >d’une manière digne de votre vocation :
        ayez beaucoup d’humilité, de douceur et de patience,
        >supportez-vous les uns les autres avec amour ;
        ayez soin de garder l’unité dans l’Esprit
        >par le lien de la paix.
        Comme votre vocation vous a tous appelés à une seule espérance,
        >de même il y a un seul Corps et un seul Esprit.
        Il y a un seul Seigneur, une seule foi, un seul baptême,
        un seul Dieu et Père de tous,
        >au-dessus de tous,
        >par tous, et en tous.
        À chacun d’entre nous, la grâce a été donnée
        >selon la mesure du don fait par le Christ.
        Et les dons qu’il a faits,
        >ce sont les Apôtres,
        >et aussi les prophètes, les évangélisateurs,
        >les pasteurs et ceux qui enseignent.
        De cette manière, les fidèles sont organisés
        >pour que les tâches du ministère soient accomplies
        >et que se construise le corps du Christ,
        jusqu’à ce que nous parvenions tous ensemble
        >à l’unité dans la foi et la pleine connaissance du Fils de Dieu,
        >à l’état de l’Homme parfait,
        >à la stature du Christ dans sa plénitude.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 1, 1-2, 3, 4.6
      refAbbr: 1, 2a
      chorus:
      - chorusRef: 1, 2a
        chorus: |-
          Heureux qui se plaît
          dans la loi du Seigneur.
      content: |-
        Heureux est l’homme
        qui n’entre pas au conseil des méchants,
        qui ne suit pas le chemin des pécheurs,
        ne siège pas avec ceux qui ricanent,
        mais se plaît dans la loi du Seigneur
        et murmure sa loi jour et nuit !

        Il est comme un arbre
        planté près d’un ruisseau,
        qui donne du fruit en son temps,
        et jamais son feuillage ne meurt ;
        tout ce qu’il entreprend réussira.

        Tel n’est pas le sort des méchants.
        Mais ils sont comme la paille
        balayée par le vent.
        Le Seigneur connaît le chemin des justes,
        mais le chemin des méchants se perdra.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 17, 20-26
      headline: « Je veux que là où je suis, ils soient eux aussi avec moi »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là,
        les yeux levés au ciel, Jésus priait ainsi :
        « Père saint,
        je ne prie pas seulement pour ceux qui sont là,
        mais encore pour ceux qui, grâce à leur parole, croiront en moi.
        Que tous soient un,
        comme toi, Père, tu es en moi, et moi en toi.
        Qu’ils soient un en nous, eux aussi,
        pour que le monde croie que tu m’as envoyé.
        Et moi, je leur ai donné la gloire que tu m’as donnée,
        pour qu’ils soient un comme nous sommes UN :
        moi en eux, et toi en moi.
        Qu’ils deviennent ainsi parfaitement un,
        afin que le monde sache que tu m’as envoyé,
        et que tu les as aimés comme tu m’as aimé.
        Père,
        ceux que tu m’as donnés,
        je veux que là où je suis,
        ils soient eux aussi avec moi,
        et qu’ils contemplent ma gloire,
        celle que tu m’as donnée
        parce que tu m’as aimé avant la fondation du monde.
        Père juste,
        le monde ne t’a pas connu,
        mais moi, je t’ai connu,
        et ceux-ci ont reconnu
        que tu m’as envoyé,
        Je leur ai fait connaître ton nom,
        et je le ferai connaître,
        afin que l’amour dont tu m’as aimé soit en eux,
        et moi en eux. »
  offeringPrayer:
  - |-
    Dieu de toute clémence, +
    >répands ta bénédiction sur ces offrandes, *
    rends-nous fermes dans la foi /
    >que saint Josaphat défendit
    >jusqu’à répandre son sang pour toi.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Mt 10,39
    content: |-
      Qui aura perdu sa vie à cause de moi, dit le Seigneur,
      >la gardera pour toujours.
  prayerAfterCommunion:
  - |-
    Puissions-nous trouver, Seigneur, à la table du ciel
    >un esprit de force et de paix : *
    qu’à l’exemple de saint Josaphat,
    >nous donnions notre vie sans réserve /
    >pour l’honneur de l’Église et pour son unité.
    Par le Christ, notre Seigneur.