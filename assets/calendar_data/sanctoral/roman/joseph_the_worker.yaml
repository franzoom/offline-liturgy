celebration:
  title: Saint Joseph travailleur
  description: |-
    Joseph, l’artisan-paysan d’un petit village de Galilée, est pour le chrétien le modèle à suivre dans l’accomplissement de ses activités professionnelles, parce qu’il a travaillé dans l’intimité quotidienne de Jésus. Le travail est joie et souffrance, il est service de la communauté et approche de Dieu : voilà ce qu’on apprend à l’école de Nazareth.
  color: white
  commons:
  - saints

oration:
- Dieu, créateur de l’univers, tu veux que l’homme, par son travail, te rende gloire en continuant ton œuvre ; permets, en ta bonté, qu’à l’exemple de saint Joseph et sous sa protection, nous accomplissions les tâches que tu nous donnes et recevions la joie promise au bon serviteur.

invitatory:
  antiphon:
  - Venez, adorons le Christ ; adorons Jésus, le fils du charpentier, alléluia.

readings:
  patristicReading:
  - title: ACTES DU II^ème CONCILE DU VATICAN
    subtitle: « L’Église dans le monde de son temps »
    content: |-
      Par son travail et son génie créateur, l’homme s’est toujours efforcé de donner un plus large développement à sa vie. Mais aujourd’hui, aidé surtout par la science et la technique, il a étendu sa maîtrise sur presque toute la nature et il ne cesse de l’étendre ; grâce notamment à la multiplication des moyens d’échange de toutes sortes entre les nations, la famille humaine prend conscience d’elle-même et se constitue peu à peu comme formant une seule communauté au sein de l’univers. Il en résulte que l’homme se procure désormais par sa propre industrie des biens qu’autrefois il attendait avant tout de forces supérieures.
      Devant cette immense entreprise qui englobe maintenant tout le genre humain, de nombreuses interrogations s’élèvent parmi les hommes. Quels sont le sens et la valeur de toute cette activité ? Comment faut-il employer toutes ces richesses ? À quel but tendent ces efforts individuels et collectifs ?
      L’Église garde le dépôt de la parole divine, où elle puise les principes de l’ordre religieux et social. Elle n’a pas toujours, pour autant, une réponse immédiate à chacune de ces questions. Mais elle désire joindre la lumière de la Révélation à l’expérience de tous pour éclairer le chemin où l’humanité vient de s’engager.
      Pour les croyants, une chose est certaine : considérée en elle-même, l’activité humaine, individuelle et collective, ce gigantesque effort par lequel les hommes, tout au long des siècles, s’évertuent à améliorer leurs conditions de vie, cet effort répond au dessein de Dieu.
      L’homme, en effet, créé à l’image de Dieu, a reçu l’ordre de soumettre la terre et tout ce qu’elle contient, de gouverner l’univers avec sainteté et justice. En reconnaissant Dieu comme le Créateur de toutes choses, il doit rapporter à Lui son être et l’univers entier, afin que, par la soumission de toutes choses à l’homme, le nom de Dieu soit glorifié par toute la terre.
      Cela concerne aussi les activités les plus quotidiennes. Car ces hommes et ces femmes qui, en gagnant leur vie et celle de leur famille, exercent leurs activités de manière à bien servir la société, ont le droit de considérer que leur travail développe l’œuvre du Créateur, qu’il contribue au bienêtre de leurs frères, et que leur savoir-faire personnel collabore à l’accomplissement du plan divin dans l’histoire.
      Par conséquent, les chrétiens ne doivent pas penser que les résultats du génie et du courage de l’homme contredisent la puissance de Dieu, et que la créature raisonnable se pose en rivale du Créateur. Au contraire, ils sont persuadés que les victoires de l’humanité sont un signe de la grandeur divine et l’aboutissement de son mystérieux dessein.
      Mais plus le pouvoir de l’homme progresse, Plus sa responsabilité, individuelle et collective, s’élargit.
      On voit par là que le message chrétien ne détourne pas les hommes de la construction du monde et ne les incite pas à se désintéresser du bonheur de leurs semblables ; il les oblige beaucoup plus étroitement au devoir d’y travailler.

    responsory: |-
      [rubric](Stance)[/rubric]
      Qui pourrait t’affaiblir ?
      Le Seigneur est ton roc !
      Rien ne peut te décevoir,
      puisqu’il est ton regard.
      Rien ne peut te dérouter,
      toi qui as découvert la trace de ses pas
      sur les chemins des hommes.

      R/ Le juste vit de la foi 
      au Dieu fidèle.

      Le juste jamais ne chancelle ;
      le cœur ferme, il se fie au Seigneur.

      Sa justice demeure à jamais,
      son front s’élève en gloire.

      Heureux qui craint le Seigneur
      et se plaît grandement à ses préceptes.

      Son cœur est assuré, il ne craint pas ;
      il se lève, lumière des cœurs droits.

morning:
  reading:
    biblicalReference: 2Sm 7, 28-29
    content: |-
      Seigneur, c’est toi qui es Dieu, tes paroles sont vérité, et tu as fait cette magnifique promesse à ton serviteur. Daigne bénir la maison de ton serviteur, afin qu’elle soit pour toujours en ta présence. Car toi, Seigneur Dieu, tu as parlé, et par ta bénédiction la maison de ton serviteur sera bénie pour toujours.
  responsory: |-
    R/ Le Seigneur a fait de Joseph le chef de sa maison
    * Alléluia, alléluia.
    V/ Le maître de tous ses bien. * Alléluia.
    Gloire au Père. R/ Le Seigneur ;
  evangelicAntiphon:
    common:
    - |-
      Béni soit le créateur de l’univers : il bénit le travail de nos mains, alléluia.
vespers:
  reading:
    biblicalReference: Col 3, 23-24
    content: |-
      Quel que soit votre travail, faites-le de bon cœur, pour le Seigneur et non pour plaire aux hommes : vous savez bien qu’en retour le Seigneur fera de vous ses héritiers. Le maître, c’est le Christ ; vous êtes à son service.
  responsory: |-
    R/ Tes œuvres me comblent de joie :
    * Le juste grandira dans ta maison.
    V/ Tous ses chemins te sont familiers. * Le juste.
    Gloire au Père. R/ Tes œuvres.
  evangelicAntiphon:
    common:
    - Reconnaissons la Sagesse de Dieu en Jésus, le fils du charpentier, alléluia.

mass:
- massType: DAY_MASS
  note: Mémoire facultative ; si on la célèbre, l’évangile indiqué ici est obligatoire.
  entranceAntiphon:
  - biblicalReference: Ps 127,1-2
    content: |-
      Heureux qui craint le Seigneur :
      >et marche selon ses voies.
      Tu te nourriras du travail de tes mains :
      >Heureux es-tu ! A toi, le bonheur ! Alléluia !
  collect:
  - |-
    Dieu, créateur de l’univers, +
    >tu as donné au genre humain la loi du travail ; *
    >en ta bonté, accorde-nous d’accomplir,
    >à l’exemple du bienheureux Joseph et sous sa protection,
    >les tâches que tu nous confies, /
    >et de recevoir la récompense que tu promets.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Gn 1, 26 – 2, 3
      headline: « Remplissez la terre et soumettez-la »
      content: |-
        Au commencement,
        Dieu dit :
        « Faisons l’homme à notre image,
        selon notre ressemblance.
        Qu’il soit le maître des poissons de la mer, des oiseaux du ciel,
        des bestiaux, de toutes les bêtes sauvages,
        et de toutes les bestioles
        qui vont et viennent sur la terre. »
        Dieu créa l’homme à son image,
        à l’image de Dieu il le créa,
        il les créa homme et femme.
        Dieu les bénit et leur dit :
        « Soyez féconds et multipliez-vous,
        remplissez la terre et soumettez-la.
        Soyez les maîtres des poissons de la mer, des oiseaux du ciel,
        et de tous les animaux qui vont et viennent sur la terre. »
        Dieu dit encore :
        « Je vous donne toute plante qui porte sa semence
        sur toute la surface de la terre,
        et tout arbre dont le fruit porte sa semence :
        telle sera votre nourriture.
        À tous les animaux de la terre,
        à tous les oiseaux du ciel,
        à tout ce qui va et vient sur la terre
        et qui a souffle de vie,
        je donne comme nourriture toute herbe verte. »
        Et ce fut ainsi.
        Et Dieu vit tout ce qu’il avait fait ;
        et voici : cela était très bon.
        Il y eut un soir, il y eut un matin :
        sixième jour.
        Ainsi furent achevés le ciel et la terre,
        et tout leur déploiement.
        Le septième jour,
        Dieu avait achevé l’œuvre qu’il avait faite.
        Il se reposa, le septième jour,
        de toute l’œuvre qu’il avait faite.
        Et Dieu bénit le septième jour :
        il le sanctifia
        puisque, ce jour-là, il se reposa
        de toute l’œuvre de création qu’il avait faite.
    - biblicalRef: Col 3, 14-15.17.23-24
      headline: « Quel que soit votre travail, faites-le de bon cœur, comme pour le Seigneur et non pour plaire à des hommes »
      content: |-
        Frères,
        par-dessus tout, ayez l’amour,
        qui est le lien le plus parfait.
        Et que, dans vos cœurs, règne la paix du Christ
        à laquelle vous avez été appelés,
        vous qui formez un seul corps.
        Vivez dans l’action de grâce.
        Et tout ce que vous dites, tout ce que vous faites,
        que ce soit toujours au nom du Seigneur Jésus,
        en offrant par lui votre action de grâce à Dieu le Père.
        Quel que soit votre travail, faites-le de bon cœur,
        comme pour le Seigneur et non pour plaire à des hommes :
        vous savez bien qu’en retour
        vous recevrez du Seigneur votre héritage.
        C’est le Christ, le Seigneur, que vous servez.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 89 (90), 2, 3-4, 12-13, 14.16
      refAbbr: 89, 17c
      chorus:
      - chorusRef: 89, 17c
        chorus: |-
          Consolide, Seigneur,
          l’ouvrage de nos mains.
      - chorusRef: null
        chorus: |-
          ou : Alléluia !
      content: |-
        Avant que naissent les montagnes,
        que tu enfantes la terre et le monde,
        de toujours à toujours,
        toi, tu es Dieu.

        Tu fais retourner l’homme à la poussière ;
        tu as dit : « Retournez, fils d’Adam ! »
        À tes yeux, mille ans sont comme hier,
        c’est un jour qui s’en va, une heure dans la nuit.

        Apprends-nous la vraie mesure de nos jours :
        que nos cœurs pénètrent la sagesse.
        Reviens, Seigneur, pourquoi tarder ?
        Ravise-toi par égard pour tes serviteurs.

        Rassasie-nous de ton amour au matin,
        que nous passions nos jours dans la joie et les chants.
        Fais connaître ton œuvre à tes serviteurs
        et ta splendeur à leurs fils.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 13, 54-58
      headline: « N’est-il pas le fils du charpentier ? »
      acclamationAntiphon: |-
        Que le Seigneur soit béni !
        Jour après jour, ce Dieu nous accorde la victoire.
      content: |-
        En ce temps-là,
        Jésus se rendit dans son lieu d’origine,
        et il enseignait les gens dans leur synagogue,
        de telle manière qu’ils étaient frappés d’étonnement
        et disaient :
        « D’où lui viennent cette sagesse
        et ces miracles ?
        N’est-il pas le fils du charpentier ?
        Sa mère ne s’appelle-t-elle pas Marie,
        et ses frères : Jacques, Joseph, Simon et Jude ?
        Et ses sœurs ne sont-elles pas toutes chez nous ?
        Alors, d’où lui vient tout cela ? »
        Et ils étaient profondément choqués à son sujet.
        Jésus leur dit :
        « Un prophète n’est méprisé que dans son pays
        et dans sa propre maison. »
        Et il ne fit pas beaucoup de miracles à cet endroit-là,
        à cause de leur manque de foi.
        
  offeringPrayer:
  - |-
    Dieu, source de toute miséricorde, +
    >regarde les présents que nous déposons devant toi
    >en faisant mémoire du bienheureux Joseph : *
    >dans ta bonté, permets que ces offrandes /
    >deviennent le secours de ceux qui te supplient.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Col 3,17
    content: |-
      Tout ce que vous dites, tout ce que vous faites,
      >que ce soit toujours au nom du Seigneur Jésus,
      >en offrant par lui votre action de grâce à Dieu le Père, alléluia.
  prayerAfterCommunion:
  - |-
    Tu nous as rassasiés, Seigneur, des joies du ciel,
    >et nous te supplions encore : *
    >fais-nous témoigner, comme le bienheureux Joseph,
    >de la charité que tu as répandue dans nos cœurs, /
    et nous goûterons pour toujours
    >le fruit de la paix.
    Par le Christ, notre Seigneur.