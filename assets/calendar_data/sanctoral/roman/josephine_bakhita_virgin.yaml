celebration:
  title: Sainte Joséphine Bakita
  subtitle: vierge
  description: Née au Soudan en 1869, Joséphine Bakhita ne tarde pas à connaître les angoisses de l’enlèvement et de l’esclavage. Vendue cinq fois, elle demande à son nouveau maître, consul italien, de l’amener en Italie. Elle découvre Dieu au contact des religieuses canossiennes et chosit la vie consacrée en 1896. Le 1^er octobre 2000, elle devient la première sainte soudanaise.
  commons:
    - virgins
  color: white

  oration:
  - Dieu notre Père, tu as conduit sainte Joséphine de l’abaissement de l’esclavage à l’honneur d’être ta fille et de devenir l’épouse du Christ ; accorde-nous, à son exemple, de suivre d’un amour fidèle le Seigneur Jésus crucifié et de répandre la miséricorde avec une inlassable charité.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu notre Père, +
    >tu as conduit sainte Joséphine
    >de l’abaissement de l’esclavage
    >à l’honneur d’être ta fille
    >et de devenir l’épouse du Christ ; *
    accorde-nous, à son exemple,
    >de suivre d’un amour fidèle le Seigneur Jésus crucifié /
    >et de répandre la miséricorde avec une inlassable charité.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 7, 25-35
      headline: « La femme qui reste vierge a le souci des affaires du Seigneur »
      content: |-
        Frères,
        au sujet du célibat, je n’ai pas un ordre du Seigneur,
        >mais je donne mon avis,
        >moi qui suis devenu digne de confiance
        >grâce à la miséricorde du Seigneur.
        Je pense que le célibat est une chose bonne,
        >étant donné les nécessités présentes ;
        >oui, c’est une chose bonne de vivre ainsi.
        Tu es marié ?
        ne cherche pas à te séparer de ta femme.
        Tu n’as pas de femme ?
        ne cherche pas à te marier.
        Si cependant tu te maries, ce n’est pas un péché ;
        >et si une jeune fille se marie, ce n’est pas un péché.
        Mais ceux qui font ce choix y trouveront les épreuves correspondantes,
        >et c’est cela que moi, je voudrais vous éviter.
        Frères,
        >je dois vous le dire : le temps est limité.
        Dès lors,
        >que ceux qui ont une femme
        >soient comme s’ils n’avaient pas de femme,
        ceux qui pleurent,
        >comme s’ils ne pleuraient pas,
        ceux qui ont de la joie,
        >comme s’ils n’en avaient pas,
        ceux qui font des achats,
        >comme s’ils ne possédaient rien,
        ceux qui profitent de ce monde,
        >comme s’ils n’en profitaient pas vraiment.
        Car il passe,
        >ce monde tel que nous le voyons.
        J’aimerais vous voir libres de tout souci.
        Celui qui n’est pas marié a le souci des affaires du Seigneur,
        >il cherche comment plaire au Seigneur.
        Celui qui est marié a le souci des affaires de ce monde,
        >il cherche comment plaire à sa femme,
        >et il se trouve divisé.
        La femme sans mari,
        >ou celle qui reste vierge,
        a le souci des affaires du Seigneur,
        >afin d’être sanctifiée dans son corps et son esprit.
        Celle qui est mariée a le souci des affaires de ce monde,
        >elle cherche comment plaire à son mari.
        C’est dans votre intérêt que je dis cela ;
        >ce n’est pas pour vous tendre un piège,
        >mais pour vous proposer ce qui est bien,
        >afin que vous soyez attachés au Seigneur sans partage.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 44 (45), 11-12, 14-15, 16-17
      refAbbr: 44, 11a
      chorus:
      - chorusRef: 44, 11a
        chorus: Écoute, ma fille, regarde et tends l’oreille.
      content: |-
        Écoute, ma fille, regarde et tends l’oreille ;
        oublie ton peuple et la maison de ton père :
        le roi sera séduit par ta beauté.
        Il est ton Seigneur : prosterne-toi devant lui.

        Fille de roi, elle est là, dans sa gloire,
        vêtue d’étoffes d’or ;
        on la conduit, toute parée, vers le roi.
        Des jeunes filles, ses compagnes, lui font cortège.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 25, 1-13
      headline: « Voici l’époux ! Sortez à sa rencontre »
      acclamationAntiphon: |-
        Voici la jeune fille prévoyante,
        que le Seigneur a trouvée en train de veiller.
        Quand le Seigneur arriva, elle entra avec lui pour les noces.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples cette parabole :
        « C’est comme un homme qui partait en voyage :
        il appela ses serviteurs et leur confia ses biens.
        À l’un il remit une somme de cinq talents,
        à un autre deux talents,
        au troisième un seul talent,
        à chacun selon ses capacités.
        Puis il partit.
        Le royaume des Cieux sera comparable
        à dix jeunes filles invitées à des noces,
        qui prirent leur lampe
        pour sortir à la rencontre de l’époux.
        Cinq d’entre elles étaient insouciantes,
        et cinq étaient prévoyantes :
        les insouciantes avaient pris leur lampe sans emporter d’huile,
        tandis que les prévoyantes avaient pris, avec leurs lampes,
        des flacons d’huile.
        Comme l’époux tardait,
        elles s’assoupirent toutes et s’endormirent.
        Au milieu de la nuit, il y eut un cri :
        "Voici l’époux ! Sortez à sa rencontre."
        Alors toutes ces jeunes filles se réveillèrent
        et se mirent à préparer leur lampe.
        Les insouciantes demandèrent aux prévoyantes :
        "Donnez-nous de votre huile,
        car nos lampes s’éteignent."
        Les prévoyantes leur répondirent :
        "Jamais cela ne suffira pour nous et pour vous,
        allez plutôt chez les marchands vous en acheter."
        Pendant qu’elles allaient en acheter,
        l’époux arriva.
        Celles qui étaient prêtes entrèrent avec lui dans la salle des noces,
        et la porte fut fermée.
        Plus tard, les autres jeunes filles arrivèrent à leur tour et dirent :
        "Seigneur, Seigneur, ouvre-nous !"
        Il leur répondit :
        "Amen, je vous le dis :
        je ne vous connais pas."
        Veillez donc,
        car vous ne savez ni le jour ni l’heure. »
        Acclamons la Parole de Dieu.
