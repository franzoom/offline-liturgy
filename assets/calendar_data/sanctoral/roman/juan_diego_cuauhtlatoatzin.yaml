celebration:
  title: Saint Juan Diego Cuauhtlatoatzin
  description: Juan Diego, simple et humble indien d’Amérique, fut baptisé avec son épouse à l’âge adulte. Il vécut dans la bonté et la ferveur qu’une foi très pure lui commandait. En 1531, la Mère de Dieu se manifesta à lui, près de la ville de Mexico. Il fit construire une église à sa demande et en son honneur. Demeurant dans la pauvreté, il ne cessa d’y accueillir les pèlerins jusqu’à sa mort en 1548.
  color: white
  commons:
    - saints-male

oration:
  - |-
    Seigneur Dieu, par saint Juan Diego tu as montré la tendresse de la très sainte Vierge Marie à l’égard de ton peuple ; accorde-nous, par son intercession, d’accomplir toujours ta volonté en suivant les exhortations de notre Mère du ciel.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >par saint Juan Diego
    tu as montré la tendresse de la très sainte Vierge Marie
    >à l’égard de ton peuple ; *
    accorde-nous, par son intercession,
    >d’accomplir toujours ta volonté /
    >en suivant les exhortations de notre Mère du ciel.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 26-31
      headline: « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        voilà ce que Dieu a choisi,
        pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        voilà ce que Dieu a choisi,
        pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        lui qui est devenu pour nous sagesse venant de Dieu,
        justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        Celui qui veut être fier,
        qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      refAbbr: null
      chorus:
      - chorusRef: null
        chorus: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      headline: « Ce que tu as caché aux sages et aux savants, tu l’as révélé aux tout-petits »
      acclamationAntiphon: |-
        Tu es béni, Père,
        Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits les mystères du Royaume !
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        « Père, Seigneur du ciel et de la terre,
        je proclame ta louange :
        ce que tu as caché aux sages et aux savants,
        tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        personne ne connaît le Fils, sinon le Père,
        et personne ne connaît le Père, sinon le Fils,
        et celui à qui le Fils veut le révéler.
        Venez à moi,
        vous tous qui peinez sous le poids du fardeau,
        et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        devenez mes disciples,
        car je suis doux et humble de cœur,
        et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        et mon fardeau, léger. »
        Acclamons la Parole de Dieu.
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null