celebration:
  title: Saint Laurent de Brindisi
  subtitle: prêtre et docteur de l’Église
  description: Laurent de Brindisi (1559-1619), capucin de Vérone, était un homme de grande culture, éminemment doué pour l’action, mais plus encore un vrai fils de saint François, simple et accueillant. Il travailla ardemment à la Réforme catholique à travers toute l’Europe centrale et il fut l’âme de la croisade contre les Turcs en Hongrie (1601).
  commons:
    - pastors
    - pastors_doctors
  color: white

oration:
  - |-
    Pour la gloire de ton nom, Seigneur, et le salut des hommes, tu as donné à saint Laurent de Brindisi un esprit de sagesse et de force ; accorde-nous ce même esprit pour voir ce que nous devons faire, et accomplir ce que nous aurons vu.

readings:
  patristicReading:
    - title: SERMON DE SAINT LAURENT
      content: |-
        Pour mener la vie spirituelle, qui nous est commune avec les anges et les esprits célestes, créés comme nous à l’image et ressemblance de Dieu, il faut nécessairement le pain de la grâce du Saint-Esprit et de l’amour de Dieu. La grâce et l’amour ne sont rien sans la foi, car %sans la foi il est impossible de plaire à Dieu%. Et la foi ne peut naître sans la Prédication de la parole de Dieu : %La foi naît de ce qu’on entend ; et ce qu’on entend, c’est l’annonce de la parole du Christ%. La prédication de la parole de Dieu est donc nécessaire à la vie spirituelle, de même que les semailles à la vie corporelle.
        Aussi le Christ a-t-il dit : %Le semeur est sorti pour semer%. Celui qui est sorti pour semer, c’est le héraut de la justice, et ce héraut, nous savons par l’Écriture que ce fut Dieu lorsqu’il donna de vive voix, du haut du ciel, la loi de justice à tout le peuple dans le désert. Parfois ce fut l’Ange du Seigneur qui reprocha au peuple sa transgression de la loi divine, au lieu des Pleurs (cf. Jg 2, 1-5); si bien que tous les fils d’Israël, en entendant le discours de l’Ange, eurent le cœur transpercé et pleurèrent avec de grands cris. Moïse aussi prêcha la loi du Seigneur à tout le peuple, dans les champs de Moab, comme le rapporte le Deutéronome. Enfin le Christ, Dieu et homme, est venu prêcher la parole du Seigneur et envoya les Apôtres faire de même, comme auparavant il avait envoyé les prophètes.
        La prédication est donc une fonction apostolique, angélique, chrétienne, divine. Car la parole de Dieu est pourvue d’une valeur infinie, puisqu’elle est comme le trésor de tous les biens. C’est d’elle que viennent la foi, l’espérance, la charité, toutes les vertus, tous les dons de l’Esprit Saint, toutes les béatitudes évangéliques, toutes les bonnes œuvres, tous les mérites de la vie, toute la gloire du paradis : %Accueillez la parole semée en vous, car elle peut sauver vos âmes%.
        La parole de Dieu est une lumière pour l’intelligence, un feu pour la volonté, afin que l’homme puisse connaître Dieu et l’aimer. Et pour l’homme intérieur, qui vit du Saint-Esprit par la grâce, elle est du pain et de l’eau. Mais du pain plus doux que le miel et le rayon, de l’eau meilleure que le vin et le lait. Elle est, pour l’âme spirituelle, un trésor de mérites, c’est pourquoi elle est appelée or et pierre très précieuse. Contre le cœur obstiné dans ses vices, elle est comme un marteau ; contre la chair, le monde et le démon, elle est une épée qui met à mort tout péché.

      responsory: |-
        R/ Ceux qui sèment dans les larmes,
        moissonnent en chantant.
        
        Qui sème dans sa chair,
        moissonnera de sa chair la destruction.
        
        Qui sème dans l’Esprit,
        moissonnera de l’Esprit la vie éternelle.
        
        La chair ne sert de rien,
        c’est l’Esprit qui vivifie.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >pour la gloire de ton nom et le salut des âmes,
    >tu as donné au prêtre saint Laurent de Brindisi
    >un esprit de conseil et de force ; *
    par son intercession, accorde-nous ce même esprit
    >pour voir ce que nous devons faire, /
    >et accomplir ce que nous aurons vu.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Co 4, 1-2.5-7
      headline: « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
      content: |-
        Frères,
        nous, les Apôtres,
        ayant reçu ce ministère par la miséricorde de Dieu,
        nous ne perdons pas courage :
        nous avons rejeté toute dissimulation honteuse,
        nous n’agissons pas avec ruse,
        et nous ne falsifions pas la parole de Dieu.
        Au contraire, nous manifestons la vérité,
        et ainsi nous nous recommandons nous-mêmes
        à toute conscience humaine devant Dieu.
        Ce que nous proclamons,
        ce n’est pas nous-mêmes ;
        c’est ceci : Jésus Christ est le Seigneur ;
        et nous sommes vos serviteurs, à cause de Jésus.
        Car Dieu qui a dit :
        Du milieu des ténèbres brillera la lumière,
        a lui-même brillé dans nos cœurs
        pour faire resplendir la connaissance de sa gloire
        qui rayonne sur le visage du Christ.
        Mais ce trésor, nous le portons
        comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        appartient à Dieu et ne vient pas de nous.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mc 4, 1-10.13-20
      headline: « Voici que le semeur sortit pour semer »
      acclamationAntiphon: |-
        La semence est la parole de Dieu,
        le semeur est le Christ ;
        celui qui le trouve demeure pour toujours.
      content: |-
        En ce temps-là,
        Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
        Une foule très nombreuse se rassembla auprès de lui,
        si bien qu’il monta dans une barque où il s’assit.
        Il était sur la mer,
        et toute la foule était près de la mer, sur le rivage.
        Il leur enseignait beaucoup de choses en paraboles,
        et dans son enseignement il leur disait :
        « Écoutez ! Voici que le semeur sortit pour semer.
        Comme il semait,
        du grain est tombé au bord du chemin ;
        les oiseaux sont venus et ils ont tout mangé.
        Du grain est tombé aussi sur du sol pierreux,
        où il n’avait pas beaucoup de terre ;
        il a levé aussitôt,
        parce que la terre était peu profonde ;
        et lorsque le soleil s’est levé, ce grain a brûlé
        et, faute de racines, il a séché.
        Du grain est tombé aussi dans les ronces,
        les ronces ont poussé, l’ont étouffé,
        et il n’a pas donné de fruit.
        Mais d’autres grains sont tombés dans la bonne terre ;
        ils ont donné du fruit
        en poussant et en se développant,
        et ils ont produit
        trente, soixante, cent, pour un. »
        Et Jésus disait :
        « Celui qui a des oreilles pour entendre,
        qu’il entende ! »
        Quand il resta seul,
        ceux qui étaient autour de lui avec les Douze
        l’interrogeaient sur les paraboles.
        Il leur dit encore :
        « Vous ne saisissez pas cette parabole ?
        Alors, comment comprendrez-vous toutes les paraboles ?
        Le semeur sème la Parole.
        Il y a ceux qui sont au bord du chemin
        où la Parole est semée :
        quand ils l’entendent,
        Satan vient aussitôt
        et enlève la Parole semée en eux.
        Et de même, il y a ceux qui ont reçu la semence
        dans les endroits pierreux :
        ceux-là, quand ils entendent la Parole,
        ils la reçoivent aussitôt avec joie ;
        mais ils n’ont pas en eux de racine,
        ce sont les gens d’un moment ;
        que vienne la détresse ou la persécution à cause de la Parole,
        ils trébuchent aussitôt.
        Et il y en a d’autres qui ont reçu la semence dans les ronces :
        ceux-ci entendent la Parole,
        mais les soucis du monde, la séduction de la richesse
        et toutes les autres convoitises
        les envahissent et étouffent la Parole,
        qui ne donne pas de fruit.
        Et il y a ceux qui ont reçu la semence dans la bonne terre :
        ceux-là entendent la Parole, ils l’accueillent,
        et ils portent du fruit :
        trente, soixante, cent, pour un. »
        
