- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    En la fête des saints martyrs
    >Laurent Ruiz et ses compagnons, +
    >accorde-nous, Seigneur notre Dieu,
    >la même endurance à ton service
    >et au service du prochain, /
    >car ceux qui souffrent persécution pour la justice
    >sont bienheureux dans ton Royaume.
    Par Jésus Christ, ton Fils, notre Seigneur, +
