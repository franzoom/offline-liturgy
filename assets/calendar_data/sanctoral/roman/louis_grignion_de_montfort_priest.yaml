celebration:
  title: Saint Louis-Marie Grignon de Montfort
  subtitle: prêtre
  description: Combattu pour ses idées neuves, le prêtre Louis-Marie Grignion (1673-1716) en appelle à Rome pour partir en mission lointaine. Le pape le nommera prédicateur de missions paroissiales. Dans l’ouest de la France, il conduit avec zèle les foules à Jésus par Marie. II fonde les Filles de la Sagesse et une société de prêtres. Il est également remarquable par ses écrits spirituels.
  color: white
  commons:
    - pastors

oration:
  - Dieu éternel et tout-puissant, tu as fait du prêtre saint Louis-Marie un témoin et un maître admirable de la parfaite consécration à ton Fils Jésus Christ par les mains de sa Mère bienheureuse ; accorde-nous de suivre le même chemin spirituel pour travailler sans relâche à étendre ton royaume.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    >tu as fait du prêtre saint Louis-Marie
    >un témoin et un maître admirable
    >de la parfaite consécration à ton Fils Jésus Christ
    >par les mains de sa Mère bienheureuse ; *
    accorde-nous de suivre le même chemin spirituel /
    >pour travailler sans relâche à étendre ton Royaume.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 18-25
      headline: Sagesse de Dieu et folie du monde
      content: |-
        Frères, le langage de la croix est folie pour ceux qui vont à leur perte,
        mais pour ceux qui vont vers leur salut, pour nous, il est puissance de Dieu.
        L’Écriture dit en effet :
        je mènerai à sa perte la sagesse des sages,
        et l’intelligence des intelligents, je la rejetterai.
        Où est-il, le sage ?
        Où est-il, le scribe ?
        Où est-il, le raisonneur d’ici-bas ?
        La sagesse du monde, Dieu ne l’a-t-il pas rendue folle ?
        Puisque, en effet, par une disposition de la sagesse de Dieu,
        le monde, avec toute sa sagesse, n’a pas su reconnaître Dieu,
        il a plu à Dieu de sauver les croyants
        par cette folie qu’est la proclamation de l’Évangile.
        Alors que les Juifs réclament des signes miraculeux,
        et que les Grecs recherchent une sagesse,
        nous, nous proclamons un Messie crucifié,
        scandale pour les Juifs, folie pour les nations païennes.
        Mais pour ceux que Dieu appelle, qu’ils soient juifs ou grecs,
        ce Messie, ce Christ, est puissance de Dieu et sagesse de Dieu.
        Car ce qui est folie de Dieu est plus sage que les hommes,
        et ce qui est faiblesse de Dieu est plus fort que les hommes.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 28, 16-20
      headline: « De toutes les nations faites des disciples »
      acclamationAntiphon: |-
        Le Seigneur m’a envoyé
        porter la Bonne Nouvelle aux pauvres,
        annoncer aux captifs leur libération.
      content: |-
        En ce temps-là,
        les onze disciples s’en allèrent en Galilée,
        à la montagne où Jésus leur avait ordonné de se rendre.
        Quand ils le virent, ils se prosternèrent,
        mais certains eurent des doutes.
        Jésus s’approcha d’eux et leur adressa ces paroles :
        « Tout pouvoir m’a été donné au ciel et sur la terre.
        Allez ! De toutes les nations faites des disciples :
        baptisez-les au nom du Père, et du Fils, et du Saint-Esprit,
        apprenez-leur à observer
        tout ce que je vous ai commandé.
        Et moi, je suis avec vous
        tous les jours jusqu’à la fin du monde. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null