celebration:
  title: Sainte Marguerite d'Écosse
  description: Princesse anglaise, Marguerite naquit en Hongrie (vers 1046). En 1070, elle épousa le roi d’Écosse Malcom III, à qui elle donna huit enfants. Par sa culture, son sens politique et surtout sa charité rayonnante, elle exerça une influence profonde sur son mari et contribua au renouveau religieux de son peuple. Les deux époux moururent à quelques jours de distance (1093).
  commons:
    - saints-female_caritative
  color: white

oration:
  - Dieu qui rendis admirable sainte Marguerite d’Ecosse par son exquise charité envers les pauvres, accorde-nous, à son exemple et par son intercession, d’être au milieu des hommes un reflet de ta bonté.

readings:
  patristicReading:
    - title: ACTES DU 2^ème CONCILE DU VATICAN
      subtitle: L’Église dans le monde de ce temps
      content: |-
        L’homme et la femme qui, par l’alliance conjugale, %ne sont plus deux mais ne font qu’un%, se procurent aide et service mutuels par l’union intime de leurs personnes et de leurs activités ; ils prennent ainsi conscience de leur unité et la réalisent chaque jour plus complètement. Cette union intime, donation réciproque de deux personnes, de même que le bien des enfants, exige l’entière fidélité des conjoints et requiert leur indissoluble unité. ~
        L’authentique amour conjugal est élevé au rang d’amour divin ; la puissance rédemptrice du Christ et l’action salvatrice de l’Église dirigent et enrichissent cet amour pour conduire efficacement les époux jusqu’à Dieu, pour les aider et les fortifier dans leur mission sublime de père et de mère.
        C’est pour cela que les époux chrétiens sont fortifiés et comme consacrés par un sacrement spécial approprié aux devoirs et à la dignité de leur état. Par sa vertu, en accomplissant leur mission conjugale et familiale, en étant pénétrés par l’esprit du Christ qui imprègne toute leur vie de foi, d’espérance et de charité, ils s’approchent de plus en plus de leur propre perfection et de leur sanctification mutuelle ; par là, ils réussissent de plus en plus à rendre gloire à Dieu.
        Du fait que leurs parents leur montrent la route par l’exemple et la prière familiale, les enfants, et même tous ceux qui vivent dans le cercle de la famille, trouveront plus aisément le chemin de l’affection, du salut et de la sainteté. Quant aux époux, ennoblis par la dignité de leur rôle de père et de mère, ils accompliront consciencieusement le devoir d’éducation, surtout d’éducation religieuse, qui leur revient au premier chef.
        Les enfants, comme les membres vivants de la famille, contribuent, de la manière qui leur appartient, à la sanctification des parents. Ils répondront à leurs bienfaits par leur gratitude, leur piété filiale et leur confiance ; ils les assisteront filialement dans leurs difficultés et dans la solitude de leur vieillesse. Le veuvage, accepté courageusement dans le prolongement de la vocation au mariage, sera honoré par tous. Chaque famille communiquera généreusement aux autres familles aussi ses richesses spirituelles. La famille chrétienne, parce qu’elle découle du mariage, qui est image et participation de l’alliance d’amour qui unit le Christ et l’Église, manifestera donc à tous les hommes la présence vivante du Sauveur dans le monde et la véritable nature de l’Église. Elle le fera par l’amour des époux, leur fécondité généreuse, leur unité et leur fidélité, l’accord harmonieux de tous ses membres.

      responsory: |-
        R/ Ses fils se lèvent
        pour la proclamer bienheureuse,
        et son mari pour faire son éloge.

        Elle fait le bonheur des siens
        tous les jours de sa vie.

        Elle étend ses mains sur le pauvre
        et tend les bras à l’indigent.

        Force et dignité la revêtent,
        elle rit au jour qui vient.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu rendis sainte Marguerite d’Écosse
    >admirable par sa charité rayonnante envers les pauvres ; *
    accorde-nous, à son exemple et par son intercession, /
    d’être au milieu des hommes un reflet de ta bonté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Is 58, 6-11
      headline: « Partage ton pain avec celui qui a faim »
      content: |-
        Ainsi parle le Seigneur :
        Le jeûne qui me plaît, n’est-ce pas ceci :
        faire tomber les chaînes injustes,
        délier les attaches du joug,
        rendre la liberté aux opprimés,
        briser tous les jougs ?
        N’est-ce pas partager ton pain avec celui qui a faim,
        accueillir chez toi les pauvres sans abri,
        couvrir celui que tu verras sans vêtement,
        ne pas te dérober à ton semblable ?
        Alors ta lumière jaillira comme l’aurore,
        et tes forces reviendront vite.
        Devant toi marchera ta justice,
        et la gloire du Seigneur fermera la marche.
        Alors, si tu appelles, le Seigneur répondra ;
        si tu cries, il dira : « Me voici. »
        Si tu fais disparaître de chez toi
        le joug, le geste accusateur, la parole malfaisante,
        si tu donnes à celui qui a faim ce que toi, tu désires,
        et si tu combles les désirs du malheureux,
        ta lumière se lèvera dans les ténèbres
        et ton obscurité sera lumière de midi.
        Le Seigneur sera toujours ton guide.
        En plein désert, il comblera tes désirs
        et te rendra vigueur.
        Tu seras comme un jardin bien irrigué,
        comme une source où les eaux ne manquent jamais.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: Heureux qui craint le Seigneur !
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: « Vous êtes mes amis si vous faites ce que je vous commande »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres. »
