celebration:
  title: Saint Martin de Porrès
  description: Martin de Porrès (1579-1639) était un « homme de couleur », fils naturel d’un chevalier espagnol. Religieux laïc au couvent des Dominicains de Lima, il y exerçait les fonctions d’infirmier, mais il puisait dans la prière, spécialement la prière nocturne, des lumières qui firent aussi de lui un merveilleux catéchiste.
  commons:
  - saints-male_religious
  color: white

oration:
- Dieu qui as conduit saint Martin de Porrès jusqu’à la gloire du ciel par les chemins de l’humilité, donne-nous de suivre son exemple, pour être admis avec lui près de toi.

readings:
  patristicReading:
  - title: HOMÉLIE DE SAINT JEAN XXIII À LA CANONISATION DE SAINT MARTIN DE PORRÈS
    subtitle: (1962)
    content: |-
      Martin de Porrès nous montre par les exemples de sa vie que nous pouvons obtenir le salut et la sainteté par le chemin que le Christ Jésus nous a montré ; cela à condition que d’abord nous aimions Dieu de toute notre âme et de tout notre esprit, et ensuite que nous aimions nos proches comme nous-mêmes. ~
      Il était convaincu que le Christ Jésus %a souffert pour nous ~ et qu’il a porté nos péchés dans son corps sur la croix%. Aussi a-t-il eu un amour tout spécial pour le crucifié. Quand il contemplait ses douloureuses blessures, il ne pouvait s’empêcher de pleurer abondamment. Il avait également un amour très particulier pour le Saint Sacrement de l’Eucharistie ; très souvent, caché dans la sacristie de l’église, il l’adorait pendant des heures ; et il désirait s’en nourrir le plus fréquemment possible. ~
      Dans une obéissance parfaite aux invitations du divin Maître, il entourait ses frères d’une extrême charité, jaillie d’une foi sans mélange et d’un cœur très humble. Il aimait les hommes parce qu’il les considérait vraiment comme les fils de Dieu et comme ses frères ; mieux encore, il les aimait plus que lui-même parce que, dans son humilité, il les estimait tous plus justes et meilleurs que lui. ~
      Il excusait les fautes des autres ; il pardonnait les plus violentes injures parce qu’il avait la conviction de mériter, à cause de ses péchés, les châtiments les plus sévères. Il faisait tous ses efforts pour ramener les coupables à une vie honnête. Il assistait les malades avec bonté. Aux plus pauvres il fournissait nourriture, vêtements, remèdes. Aux paysans et aux hommes de couleur, noirs ou métis, considérés alors comme une masse d’esclaves méprisables, il apportait le réconfort de tous les secours et de toutes les attentions dont il était capable. C’est au point qu’il mérita d’être appelé couramment « Martin de la charité ».
      Ce saint qui, par ses paroles, ses exemples et ses vertus, a tellement attiré les hommes vers la vie chrétienne, peut encore aujourd’hui, d’une manière admirable, élever nos âmes vers le ciel. Tous, hélas, ne comprennent et n’apprécient pas ces valeurs surnaturelles comme il faudrait. Mais il y a plus grave ; beaucoup inclinant vers les charmes du vice, méprisent ces valeurs surnaturelles, s’en dégoûtent, ou les négligent totalement. Puisse l’exemple de saint Martin enseigner à un grand nombre, pour leur salut, quelle douceur et quel bonheur on trouve à suivre les traces de Jésus Christ et à obéir à ses commandements.

    responsory: |-
      R/ Dieu nous a tant aimés :
      nous aussi, aimons-nous les uns les autres.
      
      Aimer son prochain comme soi-même
      vaut mieux que tous les sacrifices.
      
      Agir avec amour, c’est présenter une oblation,
      fuir l’injustice, c’est offrir un sacrifice.

morning:
  evangelicAntiphon:
    common:
    - |-
      Béni soit le Seigneur : il sauve tous les peuples et les appelle des ténèbres à sa lumière.
vespers:
  evangelicAntiphon:
    common:
    - |-
      Magnifions le Seigneur : il exalte dans la gloire son humble serviteur.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as conduit saint Martin de Porrès
    >jusqu’à la gloire du ciel
    >par un chemin d’humilité ; *
    donne-nous de suivre son exemple, /
    >pour mériter d’être élevés avec lui dans les cieux.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ph 4, 4-9
      headline: « Ce qui est juste et pur, prenez-le à votre compte »
      content: |-
        Frères,
        soyez toujours dans la joie du Seigneur ;
        >je le redis : soyez dans la joie.
        Que votre bienveillance soit connue de tous les hommes.
        Le Seigneur est proche.
        Ne soyez inquiets de rien,
        mais, en toute circonstance,
        >priez et suppliez, tout en rendant grâce,
        >pour faire connaître à Dieu vos demandes.
        Et la paix de Dieu,
        >qui dépasse tout ce qu’on peut concevoir,
        gardera vos cœurs et vos pensées dans le Christ Jésus.
        Enfin, mes frères, tout ce qui est vrai et noble,
        tout ce qui est juste et pur,
        tout ce qui est digne d’être aimé et honoré,
        tout ce qui s’appelle vertu
        >et qui mérite des éloges,
        tout cela, prenez-le en compte.
        Ce que vous avez appris et reçu,
        ce que vous avez vu et entendu de moi,
        >mettez-le en pratique.
        Et le Dieu de la paix sera avec vous.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      refAbbr: null
      chorus:
      - chorusRef: null
        chorus: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 22, 34-40
      headline: « Tu aimeras le Seigneur ton Dieu, et ton prochain comme toi-même »
      acclamationAntiphon: |-
        Je vous donne un commandement nouveau, dit le Seigneur :
        « Aimez-vous les uns les autres,
        comme je vous ai aimés. »
      content: |-
        En ce temps-là,
        les pharisiens,
        >apprenant que Jésus avait fermé la bouche aux sadducéens,
        >se réunirent,
        et l’un d’entre eux, un docteur de la Loi, posa une question à Jésus
        >pour le mettre à l’épreuve :
        >« Maître, dans la Loi,
        >quel est le grand commandement ? »
        Jésus lui répondit :
        >« Tu aimeras le Seigneur ton Dieu
        >de tout ton cœur,
        >de toute ton âme et de tout ton esprit.
        Voilà le grand, le premier commandement.
        Et le second lui est semblable :
        >Tu aimeras ton prochain comme toi-même.
        De ces deux commandements
        >dépend toute la Loi, ainsi que les Prophètes. »
        
