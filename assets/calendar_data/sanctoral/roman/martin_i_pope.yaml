celebration:
  title: Saint Martin I^er
  subtitle: pape
  description: Martin I^er est le dernier des papes martyrs (649-654). Arrêté par ordre impérial pour avoir défendu la foi sur les deux volontés divine et humaine du Christ, vrai Dieu et vrai homme, il fut transféré à Constantinople (653), emprisonné, condamné à mort, dégradé publiquement, et finalement déporté à Cherson (Sébastopol), où il mourut de misère (656).
  commons:
  - martyr
  - pastors_pope
  color: red

oration:
- Accorde-nous, Dieu tout-puissant, une force d’âme invincible pour soutenir les combats de ce monde, toi qui as voulu que le pape saint Martin résiste aux menaces et aux tortures.

readings:
  patristicReading:
    title: LETTRE DE SAINT MARTIN I^er À UN CORRESPONDANT DE CONSTANTINOPLE
    subtitle: (septembre 655)
    content: |-
      Nous avons toujours un grand désir de vous écrire pour réconforter votre charité et pour alléger le souci que nous vous donnons, à vous et aussi à tous les saints nos frères qui se préoccupent de nous au nom du Seigneur. Je vous écris donc maintenant ce qui fait notre tourment. Je dis la vérité, au nom du Christ notre Dieu.
      En effet, nous avons beau être éloignés de toute agitation mondaine et dépouillés de nos péchés, nous manquons de ce qui est essentiel à la vie. Les habitants de cette région sont tous païens, et tous ceux qu’on y rencontre ont adopté les mœurs païennes ; ils n’ont absolument aucune charité, même pas celle que la nature humaine fait voir habituellement chez les barbares eux-mêmes, qui montrent souvent de la compassion.
      J’ai été étonné, et je le suis encore, de l’indifférence et de l’insensibilité de tous ceux qui jadis étaient en relation avec moi, de mes amis et de mes proches : ils ont complètement oublié mon malheur et ne veulent même pas savoir où je me trouve, Si je suis encore sur terre ou si je n’y suis plus.
      Avec quelle conscience, à votre avis, pourrons-nous nous présenter au tribunal du Christ, alors que tous les hommes seront accusateurs et devront rendre des comptes, car ils sont tous tirés du même limon et de la même masse ?
      Quelle est cette terreur qui est tombée sur les hommes, pour les empêcher d’accomplir les commandements de Dieu ? Quelle est cette crainte, là où il n’y a rien à craindre ? Sommes-nous abandonnés au point que les esprits mauvais nous dominent ? Suis-je donc apparu comme nuisant à l’Église entière, et comme un adversaire pour eux ?
      Puisse Dieu, qui veut que tous les hommes soient sauvés et parviennent à la connaissance de la vérité, puisse-t-il, par l’intercession de saint Pierre, établir leurs cœurs dans la foi orthodoxe, les fortifier contre tout hérétique et tout personnage qui s’oppose à notre Église ; qu’il les garde inébranlables, surtout le pasteur qui maintenant se montre leur chef ; qu’ils ne se permettent aucune déchéance, aucune déviation, aucun abandon, même pas sur le plus petit point, à l’égard de ce qu’ils ont professé par écrit en présence du Seigneur et des saints anges. Avec le pauvre homme que je suis, qu’ils reçoivent de la main de notre Seigneur et Sauveur Jésus Christ la couronne de justice qui récompensera la foi orthodoxe.on
      De ce pauvre corps qui est le mien, le Seigneur lui-même prendra soin, comme il lui plaira d’en disposer, soit que mes épreuves ne cessent pas, soit qu’il m’accorde un peu de soulagement. Le Seigneur est proche : de quoi puis-je me tourmenter ? J’espère en ses miséricordes, et qu’il ne tardera pas à ordonner la fin de ma course.
      Saluez les vôtres, au nom du Seigneur, et tous ceux qui pour l’amour de Dieu ont pitié de ma captivité. Que Dieu vous protège de sa main puissante contre toute tentation, et vous sauve en vous prenant dans son royaume.

    responsory: |-
      R/ Pour aller à Jésus, sortons hors du camp
      en portant son opprobre.

      Jésus, pour sanctifier le peuple par son sang
      a souffert hors de la ville.

      Ils sauront que le Seigneur les a dispersés
      dans les pays étrangers.

      Nous n’avons pas sur la terre de cité permanente,
      mais nous cherchons celle de l’avenir.

morning:
  evangelicAntiphon:
    common:
    - Celui qui perd sa vie en ce monde la trouve pour l’éternité.

vespers:
  evangelicAntiphon:
    common:
    - Heureux le vainqueur entré dans la lumière et dans la paix de son Seigneur !

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Accorde-nous, Dieu tout-puissant,
    >une force d’âme invincible
    >pour supporter les épreuves qui viennent du monde, *
    toi qui as permis au bienheureux Martin, pape et martyr,
    >d’être sans peur devant les menaces /
    >et victorieux sous la torture.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Tm 2, 8-13 ; 3, 10-12
      headline: « Tous ceux qui veulent vivre en hommes religieux dans le Christ Jésus subiront la persécution »
      content: |-
        Bien-aimé,
        souviens-toi de Jésus Christ,
        ressuscité d’entre les morts,
        le descendant de David :
        voilà mon évangile.
        C’est pour lui que j’endure la souffrance,
        jusqu’à être enchaîné comme un malfaiteur.
        Mais on n’enchaîne pas la parole de Dieu !
        C’est pourquoi je supporte tout
        pour ceux que Dieu a choisis,
        afin qu’ils obtiennent, eux aussi,
        le salut qui est dans le Christ Jésus,
        avec la gloire éternelle.
        Voici une parole digne de foi :
        Si nous sommes morts avec lui,
        avec lui nous vivrons.
        Si nous supportons l’épreuve,
        avec lui nous régnerons.
        Si nous le rejetons,
        lui aussi nous rejettera.
        Si nous manquons de foi,
        lui reste fidèle à sa parole,
        car il ne peut se rejeter lui-même.
        Toi, tu m’as suivi pas à pas
        dans l’enseignement, la manière de diriger et les projets,
        dans la foi, la patience, la charité et la persévérance,
        dans les persécutions et les souffrances,
        celles qui me sont arrivées à Antioche, à Iconium et à Lystres,
        toutes les persécutions que j’ai subies.
        Et de tout cela le Seigneur m’a délivré.
        D’ailleurs, tous ceux qui veulent vivre
        en hommes religieux dans le Christ Jésus
        subiront la persécution.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 125 (126), 1-2ab, 2cd-3, 4-5, 6
      refAbbr: 125, 1…
      chorus:
      - chorusRef: cf. 125, 5
        chorus: |-
          Ceux qui sèment dans les larmes
          moissonnent dans la joie.
      content: |-
        Quand le Seigneur ramena les captifs à Sion,
        nous étions comme en rêve !
        Alors notre bouche était pleine de rires,
        nous poussions des cris de joie.

        Alors on disait parmi les nations :
        « Quelles merveilles fait pour eux le Seigneur ! »
        Quelles merveilles le Seigneur fit pour nous :
        nous étions en grande fête !

        Ramène, Seigneur, nos captifs,
        comme les torrents au désert.
        Qui sème dans les larmes
        moissonne dans la joie.

        Il s’en va, il s’en va en pleurant,
        il jette la semence ;
        il s’en vient, il s’en vient dans la joie,
        il rapporte les gerbes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 18-21
      headline: « Si l’on m’a persécuté, on vous persécutera, vous aussi »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi, dont témoignent les martyrs,
        nous t’acclamons : tu es Seigneur !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Si le monde a de la haine contre vous,
        sachez qu’il en a eu d’abord contre moi.
        Si vous apparteniez au monde,
        le monde aimerait ce qui est à lui.
        Mais vous n’appartenez pas au monde,
        puisque je vous ai choisis en vous prenant dans le monde ;
        voilà pourquoi le monde a de la haine contre vous.
        Rappelez-vous la parole que je vous ai dite :
        un serviteur n’est pas plus grand que son maître.
        Si l’on m’a persécuté,
        on vous persécutera, vous aussi.
        Si l’on a gardé ma parole,
        on gardera aussi la vôtre.
        Les gens vous traiteront ainsi à cause de mon nom,
        parce qu’ils ne connaissent pas Celui qui m’a envoyé. »
