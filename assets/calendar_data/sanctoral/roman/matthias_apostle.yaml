celebration:
  title: Saint Matthias
  subtitle: apôtre
  description: Matthias avait « suivi Jésus de son baptême à son ascension ». C’est pourquoi Pierre proposa son nom lorsqu’il s’agit de compléter le collège des Douze, après la défection de Judas, et de choisir l’homme qui leur serait associé pour « devenir témoin de la résurrection » du Seigneur.
  commons:
  - apostles
  color: red

oration:
- Dieu qui as choisi saint Matthias pour compléter le collège des Apôtres, accorde-nous, à sa prière, puisque ton amour nous appelle, d’être un jour au nombre des élus.

readings:
  patristicReading:
    title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME SUR LES ACTES DES APÔTRES
    content: |-
      %En ces jours-là, Pierre se leva au milieu des disciples et parla%. Parce qu’il est fervent, lui à qui le troupeau avait été confié par le Christ, et parce qu’il est le premier du groupe, il est toujours le premier à prendre la parole.
      %Frères, il faut choisir parmi nous%. Il remet la décision à la foule, il rend les candidats dignes de respect, et il écarte toute animosité envers les autres. Car les décisions importantes engendrent toujours de pareils inconvénients.
      Quoi donc ? Est-ce que Pierre ne permettait pas au groupe de choisir ? Certes, mais pour qu’il ne paraisse pas avoir des préférences, il s’abstient. Autrement le Saint-Esprit aurait été laissé à l’écart.%On en présenta deux%, disent les Actes, %Joseph Barsabbas, surnommé Justus, et Matthias%. Ce n’est pas Pierre qui les a présentés, mais tous les assistants. Quant à lui, il a fait une proposition en montrant qu’elle ne venait pas de lui, mais qu’elle remontait à une prophétie. Il s’est conduit comme un interprète, non comme un maître.
      %Il faut donc%, dit-il, %choisir parmi les hommes qui nous ont accompagnés%. Remarquez comment il veut que ces nouveaux Apôtres soient des témoins oculaires. Sans doute le Saint-Esprit devait venir, mais Pierre attachait beaucoup d’importance à ce point.
      %Parmi les hommes qui nous ont accompagnés durant tout le temps où le Seigneur Jésus a vécu parmi nous%. Il leur indique qu’ils doivent avoir vécu avec lui et ne pas avoir été de simples disciples. En effet, au début, beaucoup de gens le suivaient. Voyez comment il est dit : %C’était l’un des deux disciples qui avaient entendu Jean Baptiste et qui avaient suivi Jésus%.
      %Durant tout le temps où le Seigneur Jésus a vécu parmi nous, depuis son baptême par Jean%. C’est exact, car aucun n’a connu ce qui a précédé, mais ils l’ont appris du Saint-Esprit.
      %Jusqu’au jour où il nous a été enlevé. Il faut donc que l’un d’entre eux devienne avec nous témoin de sa résurrection%. Pierre n’a pas dit : témoin de tout le reste, mais seulement%témoin de la résurrection%. Car il serait plus digne de foi, le disciple qui pourrait dire : Celui qui mangeait, qui buvait, qui a été crucifié, c’est celui-là qui est ressuscité. Par conséquent, il ne fallait pas qu’il soit témoin des époques précédentes, ni des suivantes, ni des miracles. Ce qu’on exigeait, c’était qu’il soit témoin de la résurrection. Tout le reste avait été manifesté et proclamé. Tandis que la résurrection s’était accomplie dans le secret, elle n’était manifeste que pour quelques-uns.
      Alors tous ensemble se mettent en prière et disent : %Toi, Seigneur, qui connais le cœur de tous les hommes, montre-nous%. Toi, et non pas nous. C’était bien le moment de l’invoquer comme celui qui connaît les cœurs, car c’était à lui de faire l’élection, pas à eux. Ils parlaient ainsi avec confiance car il fallait absolument en élire un. Et ils ne disent pas : Choisis, mais : %Montre-nous%l’élu et, selon le texte, %celui que tu as choisi%, car ils savent que Dieu a tout décidé à l’avance.%On tira au sort%. Ils ne se jugeaient pas encore dignes de choisir par eux-mêmes ; c’est pourquoi ils veulent être éclairés par un signe.,

    responsory: |-
      R/ Voyez quel grand amour nous est donné !

      Enfants de Dieu, nous le sommes,
      discernés par avance dans le Fils unique.

      Au prix du sang qu’il a versé,
      Jésus nous conduit vers le Père.
       
      Nos yeux sont fixés sur la cité de fête
      où nous verrons le visage de Dieu.

      Au-delà de toute souffrance,
      une joie éternelle nous attend.

morning:
  evangelicAntiphon:
    common:
    - Le Seigneur a choisi Matthias pour être au nombre des Apôtres et devenir témoin de la Résurrection.

vespers:
  evangelicAntiphon:
    common:
    - Ce n’est pas vous qui m’avez choisi, c’est moi qui vous ai choisis pour que vous alliez et portiez un fruit qui demeure.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: Jn 15,16
    content: |-
      Ce n’est pas vous qui m’avez choisi, dit le Seigneur,
      >c’est moi qui vous ai choisis,
      afin que vous alliez, que vous portiez du fruit,
      >et que votre fruit demeure (T.P. alléluia).
  collect:
  - |-
    Seigneur Dieu, +
    >tu as agrégé le bienheureux Matthias
    >au collège des Apôtres ; *
    accorde-nous, à sa prière,
    >de nous réjouir du choix de ton amour /
    >et d’être comptés parmi tes élus.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ac 1, 15-17.20-26
      headline: « Le sort tomba sur Matthias, qui fut donc associé par suffrage aux onze Apôtres »
      content: |-
        En ces jours-là,
        Pierre se leva au milieu des frères
        qui étaient réunis au nombre d’environ cent vingt personnes,
        et il déclara :
        « Frères, il fallait que l’Écriture s’accomplisse.
        En effet, par la bouche de David,
        l’Esprit Saint avait d’avance parlé de Judas,
        qui en est venu à servir de guide
        aux gens qui ont arrêté Jésus :
        ce Judas était l’un de nous
        et avait reçu sa part de notre ministère.
        Il est écrit au livre des Psaumes :
        Que son domaine devienne un désert,
        et que personne n’y habite,
        et encore :
        Qu’un autre prenne sa charge.
        Or, il y a des hommes qui nous ont accompagnés
        durant tout le temps où le Seigneur Jésus a vécu parmi nous,
        depuis le commencement, lors du baptême donné par Jean,
        jusqu’au jour où il fut enlevé d’auprès de nous.
        Il faut donc que l’un d’entre eux devienne, avec nous,
        témoin de sa résurrection. »
        On en présenta deux :
        Joseph appelé Barsabbas, puis surnommé Justus,
        et Matthias.
        Ensuite, on fit cette prière :
        « Toi, Seigneur, qui connais tous les cœurs,
        désigne lequel des deux tu as choisi
        pour qu’il prenne, dans le ministère apostolique,
        la place que Judas a désertée
        en allant à la place qui est désormais la sienne. »
        On tira au sort entre eux, et le sort tomba sur Matthias,
        qui fut donc associé par suffrage aux onze Apôtres.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 112 (113), 1-2, 3-4, 5-6, 7-8
      refAbbr: cf. 112, 8
      chorus:
      - chorusRef: cf. 112, 8
        chorus: |-
          Le Seigneur l’a placé
          parmi les princes de son peuple.
      - chorusRef: null
        chorus: 'ou : Alléluia !'
      content: |-
        Louez, serviteurs du Seigneur,
        louez le nom du Seigneur !
        Béni soit le nom du Seigneur,
        maintenant et pour les siècles des siècles !

        Du levant au couchant du soleil,
        loué soit le nom du Seigneur !
        Le Seigneur domine tous les peuples,
        sa gloire domine les cieux.

        Qui est semblable au Seigneur notre Dieu ?
        Lui, il siège là-haut.
        Mais il abaisse son regard
        vers le ciel et vers la terre.

        De la poussière il relève le faible,
        il retire le pauvre de la cendre
        pour qu’il siège parmi les princes,
        parmi les princes de son peuple.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 9-17
      headline: « Ce n’est pas vous qui m’avez choisi, c’est moi qui vous ai choisis »
      acclamationAntiphon: |-
        C’est moi qui vous ai choisis du milieu du monde,
        afin que vous alliez, que vous portiez du fruit,
        et que votre fruit demeure, dit le Seigneur.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Comme le Père m’a aimé,
        moi aussi je vous ai aimés.
        Demeurez dans mon amour.
        Si vous gardez mes commandements,
        vous demeurerez dans mon amour,
        comme moi, j’ai gardé les commandements de mon Père,
        et je demeure dans son amour.
        Je vous ai dit cela pour que ma joie soit en vous,
        et que votre joie soit parfaite.
        Mon commandement, le voici :
        Aimez-vous les uns les autres
        comme je vous ai aimés.
        Il n’y a pas de plus grand amour
        que de donner sa vie pour ceux qu’on aime.
        Vous êtes mes amis
        si vous faites ce que je vous commande.
        Je ne vous appelle plus serviteurs,
        car le serviteur ne sait pas ce que fait son maître ;
        je vous appelle mes amis,
        car tout ce que j’ai entendu de mon Père,
        je vous l’ai fait connaître.
        Ce n’est pas vous qui m’avez choisi,
        c’est moi qui vous ai choisis et établis
        afin que vous alliez,
        que vous portiez du fruit,
        et que votre fruit demeure.
        Alors, tout ce que vous demanderez au Père en mon nom,
        il vous le donnera.
        Voici ce que je vous commande :
        c’est de vous aimer les uns les autres. »
  offeringPrayer:
  - |-
    Reçois, Seigneur, l’offrande
    >que ton Église te présente avec respect
    >en la fête du bienheureux Matthias, *
    et donne-nous d’y trouver la force /
    >par la puissance de ta grâce.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 15,12
    content: |-
      Voici mon commandement, dit le Seigneur :
      aimez-vous les uns les autres
      >comme je vous ai aimés (T.P. alléluia).
  prayerAfterCommunion:
  - |-
    Ne cesse pas, Seigneur,
    >de combler ton peuple de tes bienfaits : *
    accorde-nous, à la prière du bienheureux Matthias, /
    >d’avoir part à l’héritage des saints dans la lumière.
    Par le Christ, notre Seigneur.