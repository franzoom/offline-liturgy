celebration:
  title: Sainte Monique
  description: Monique (331-387) est la mère de saint Augustin. Lorsque Augustin perdit la foi, les larmes de Monique montèrent vers Dieu comme une prière silencieuse. Sa conversion le remplit de joie. Elle n’avait plus rien désormais à attendre sur terre. Aussi le Seigneur l’appela-t-il à lui alors qu’à Ostie elle se préparait à regagner son Afrique natale.
  commons:
  - saints-female_married
  color: white

oration:
- Dieu très bon, réconfort de ceux qui pleurent, tu accueillais avec amour les larmes de sainte Monique pour la conversion de son fils Augustin ; accorde-nous, à la prière de la mère et du fils, de savoir pleurer nos péchés pour obtenir de toi le pardon.

readings:
  patristicReading:
  - title: DES CONFESSIONS DE SAINT AUGUSTIN
    content: |-
      À l’approche du jour où ma mère allait sortir de cette vie — tu connaissais ce jour, mon Dieu ; nous, nous l’ignorions - il arriva, par l’effet de tes arrangements mystérieux, à ce que je crois, qu’elle et moi, nous nous trouvions seuls, appuyés à une fenêtre d’où l’on voyait le jardin, dans la maison que nous habitions. C’était à Ostie, à l’embouchure du Tibre. Loin de la foule, après la fatigue d’un long voyage, nous reprenions nos forces en vue de la traversée. Nous causions donc, seuls, avec une grande douceur. %Oubliant le passé et tendus vers l’avenir%, nous cherchions ensemble, auprès de la Vérité, c’est-à-dire auprès de toi, ce que serait la vie éternelle des saints, %que l’œil n’a pas vue, que l’oreille n’a pas entendue, que le cœur n’a pu concevoir%. Nos cœurs s’ouvraient avidement aux flots célestes de ta source : la source de vie, qui est en toi. ~
      C’est de cela que nous parlions, quoique d’une manière et en des termes différents de ceux que j’ai rapportés. Mais, Seigneur, tu le sais, ce jour-là, comme nous causions ainsi, et que le monde, parmi ces propos, perdait pour nous toute valeur, ma mère me dit : « Mon fils, pour moi, il n’y a plus rien qui me donne du plaisir en cette vie. Qu’y ferais-je maintenant ? Pourquoi y suis-je encore ? Je ne le sais pas. Mon espérance en ce monde est maintenant épuisée. Une seule chose me faisait désirer de m’attarder dans cette vie quelque temps encore, c’était de te voir, avant ma mort, chrétien catholique. Dieu m’a plus que comblée sur ce point, puisque je vois que tu es son serviteur au point de mépriser les joies terrestres. Qu’est-ce que je fais ici ? »
      Je ne me rappelle guère ce que j’ai répondu à ces paroles. En tout cas, environ cinq jours après, ou un peu plus, elle se mit au lit avec la fièvre. Pendant sa maladie, il lui arriva un jour de perdre conscience et de ne plus reconnaître ceux qui l’entouraient. Nous sommes accourus, mais elle a vite repris ses sens ; elle nous vit debout près d’elle, mon frère et moi, et elle nous dit, avec l’air de chercher quelque chose : « Où étais-je ? »
      Puis, nous voyant accablés de tristesse, elle dit : « Vous enterrerez ici votre mère. » Je me taisais en retenant mes larmes. Quant à mon frère, il lui dit quelques mots : qu’elle ne devait pas souhaiter mourir à l’étranger mais, comme un sort plus heureux, dans sa patrie. En l’entendant, ma mère eut le visage anxieux et lui jeta un regard de reproche pour avoir eu cette pensée. Puis elle me regarda : « Vois ce qu’il dit. » Et, s’adressant à nous deux : « Enterrez mon corps n’importe où ; que cela ne vous donne aucun souci. Je vous demande seulement de vous souvenir de moi à l’autel du Seigneur, partout où vous serez ». Lorsqu’elle eut prononcé cette phrase en cherchant ses mots, elle garda le silence, car la maladie s’aggravait et la faisait souffrir.

    responsory: |-
      R/ Qui nous fera comprendre
      pourquoi l’homme peine à chercher
      sans jamais atteindre ?
      
      Ce que l’œil n’a pas vu, ni l’oreille entendu,
      ce qui n’est pas monté au cœur de l’homme,
      voilà ce que Dieu a préparé pour ceux qui l’aiment.
      
      À nous, Dieu l’a révélé par l’Esprit,
      car l’Esprit sonde tout,
      jusqu’aux profondeurs de Dieu.

morning:
  evangelicAntiphon:
    common:
    - |-
      Tu as écouté la prière de ta servante, tu n’as pas méprisé les larmes d’une mère.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Bienheureuse Monique, fortifiée par le Christ, jusqu’à la fin de ta vie tu as loué le nom de Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, réconfort des affligés, +
    >tu accueillais avec amour les larmes de la bienheureuse Monique pour la conversion de son fils Augustin ; *
    accorde-nous, à la prière de la mère et du fils,
    >de savoir pleurer nos péchés /
    >et d’obtenir la grâce de ton pardon.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 26, 1-4.13-16
      headline: |-
        « L’épouse parfaite, lumière de sa maison »
      content: |-
        Heureux l’homme qui a une bonne épouse :
        >le nombre de ses jours sera doublé.
        La femme courageuse fait la joie de son mari :
        >il possédera le bonheur tout au long de sa vie.
        Une femme de valeur, voilà le bon parti,
        >la part que le Seigneur donne à ceux qui le craignent ;
        riches ou pauvres, ils ont le cœur joyeux,
        >en toute circonstance leur visage est souriant.
        La grâce de la femme enchante son mari,
        >et ses talents lui donnent le bien-être.
        Une femme qui sait se taire est un don du Seigneur.
        Rien ne vaut une femme préparée à sa tâche.
        C’est la grâce des grâces qu’une femme discrète.
        Une âme qui se maîtrise est un trésor sans prix.
        Un lever de soleil sur les montagnes du Seigneur :
        >ainsi, la beauté d’une épouse parfaite est la lumière de sa maison.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      refAbbr: 130, 1…
      chorus:
      - chorusRef: null
        chorus: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 7, 11-17
      headline: |-
        « Elle le portait sur le brancard de sa pensée, pour que tu dises au fils de la veuve : jeune homme, je te l’ordonne, lève-toi » (S. Augustin, Confessions, liv. 6, n° 1)
      acclamationAntiphon: |-
        Moi, je suis la lumière du monde, dit le Seigneur.
        Celui qui me suit aura la lumière de la vie.
      content: |-
        En ce temps-là,
        Jésus se rendit dans une ville appelée Naïm.
        Ses disciples faisaient route avec lui,
        >ainsi qu’une grande foule.
        Il arriva près de la porte de la ville
        >au moment où l’on emportait un mort pour l’enterrer ;
        c’était un fils unique, et sa mère était veuve.
        Une foule importante de la ville accompagnait cette femme.
        Voyant celle-ci, le Seigneur fut saisi de compassion pour elle
        et lui dit :
        >« Ne pleure pas. »
        Il s’approcha et toucha le cercueil ;
        les porteurs s’arrêtèrent,
        et Jésus dit :
        >« Jeune homme, je te l’ordonne, lève-toi. »
        Alors le mort se redressa
        >et se mit à parler.
        Et Jésus le rendit à sa mère.
        La crainte s’empara de tous,
        et ils rendaient gloire à Dieu en disant :
        >« Un grand prophète s’est levé parmi nous,
        >et Dieu a visité son peuple. »
        Et cette parole sur Jésus se répandit
        >dans la Judée entière et dans toute la région.
