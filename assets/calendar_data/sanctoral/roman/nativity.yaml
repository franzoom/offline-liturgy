  readingParts:
  - partType: FIRST_READING
    partContents:
    - biblicalRef: Is 62, 11-12
      headline: « Voici ton Sauveur qui vient »
      content: |-
        Voici que le Seigneur se fait entendre
        jusqu’aux extrémités de la terre :
        Dites à la fille de Sion :
        Voici ton Sauveur qui vient ;
        avec lui, le fruit de son travail,
        et devant lui, son ouvrage.

        Eux seront appelés « Peuple-saint »,
        « Rachetés-par-le-Seigneur »,
        et toi, on t’appellera « La-Désirée »,
        « La-Ville-qui-n’est-plus-délaissée ».
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 96 (97), 1.6, 11-12
      refAbbr: Ps 96, 1…
      chorus:
      - chorus: |-
          La lumière aujourd’hui a resplendi sur nous :
          un Sauveur nous est né !
      content: |-
        Le Seigneur est roi ! Exulte la terre !
        Joie pour les îles sans nombre !
        Les cieux ont proclamé sa justice,
        et tous les peuples ont vu sa gloire.

        Une lumière est semée pour le juste,
        et pour le cœur simple, une joie.
        Que le Seigneur soit votre joie, hommes justes ;
        rendez grâce en rappelant son nom très saint.
  - partType: SECOND_READING
    partContents:
    - biblicalRef: Tt 3, 4-7
      headline: « Dieu nous a sauvés par sa miséricorde »
      content: |-
        Bien-aimé,
        >lorsque Dieu, notre Sauveur,
        a manifesté sa bonté et son amour pour les hommes,
        >il nous a sauvés,
        non pas à cause de la justice de nos propres actes,
        mais par sa miséricorde.
        Par le bain du baptême, il nous a fait renaître
        et nous a renouvelés dans l’Esprit Saint.
        >Cet Esprit, Dieu l’a répandu sur nous en abondance,
        par Jésus Christ notre Sauveur,
        >afin que, rendus justes par sa grâce,
        nous devenions en espérance
        héritiers de la vie éternelle.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 2, 15-20
      headline: « Les bergers découvrirent Marie et Joseph, avec le nouveau-né »
      acclamationAntiphonReference: Lc 2, 14
      acclamationAntiphon: |-
        Gloire à Dieu au plus haut des cieux,
        et paix sur la terre aux hommes, qu’il aime !
      content: |-
        Lorsque les anges eurent quitté les bergers pour le ciel,
        ceux-ci se disaient entre eux :
        « Allons jusqu’à Bethléem
        pour voir ce qui est arrivé,
        l’événement que le Seigneur nous a fait connaître. »
        >Ils se hâtèrent d’y aller,
        et ils découvrirent Marie et Joseph,
        avec le nouveau-né couché dans la mangeoire.
        >Après avoir vu,
        ils racontèrent ce qui leur avait été annoncé
        au sujet de cet enfant.
        >Et tous ceux qui entendirent s’étonnaient
        de ce que leur racontaient les bergers.
        >Marie, cependant, retenait tous ces événements
        et les méditait dans son cœur.
        >Les bergers repartirent ;
        ils glorifiaient et louaient Dieu
        pour tout ce qu’ils avaient entendu et vu,
        selon ce qui leur avait été annoncé.
  offeringPrayer:
  - |-
    Puissent nos offrandes, Seigneur,
    >s’accorder au mystère de la nativité
    >que nous célébrons en ce jour ; *
    >celui qui est né d’une naissance humaine
    >a resplendi aussi comme Dieu : /
    de même, fais que ces fruits de la terre
    >nous communiquent tes dons divins.
    Par le Christ, notre Seigneur.
  offeringPrayer: |-
    Reçois, Seigneur, nous t’en prions,
    >les offrandes de tes fidèles serviteurs ; *
    purifie-les quand ils célèbrent avec amour tes mystères,
    >par lesquels tu rends justes /
    >même ceux qui ne te connaissent pas.
    Par le Christ, notre Seigneur.
  prefaceList:
  - nativity_of_the_lord_1
