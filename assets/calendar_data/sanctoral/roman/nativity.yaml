    Seigneur, nous célébrons la nativité de ton Fils
    >avec une joyeuse ferveur, *
    accorde-nous d’approfondir la connaissance de ce mystère
    >par une foi sans réserve /
    >et de l’aimer d’un amour toujours plus ardent.
    Par le Christ, notre Seigneur.
