    Seigneur Dieu, +
    >tu as merveilleusement créé l’être humain dans sa dignité,
    >et tu l’as rétabli plus merveilleusement encore : *
    accorde-nous d’être unis à la divinité de ton Fils, /
    >qui a voulu prendre notre humanité.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: FIRST_READING
    partContents:
    - biblicalRef: Is 52, 7-10
      headline: « Tous les lointains de la terre ont vu le salut de notre Dieu »
      content: |-
        Comme ils sont beaux sur les montagnes,
        les pas du messager,
        celui qui annonce la paix,
        qui porte la bonne nouvelle,
        qui annonce le salut,
        et vient dire à Sion :
        « Il règne, ton Dieu ! »
        >Écoutez la voix des guetteurs :
        ils élèvent la voix,
        tous ensemble ils crient de joie
        car, de leurs propres yeux,
        ils voient le Seigneur qui revient à Sion.
        >Éclatez en cris de joie,
        vous, ruines de Jérusalem,
        car le Seigneur console son peuple,
        il rachète Jérusalem !
        >Le Seigneur a montré la sainteté de son bras
        aux yeux de toutes les nations.
        Tous les lointains de la terre
        ont vu le salut de notre Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 97 (98), 1, 2-3ab, 3cd-4, 5-6
      refAbbr: Ps 97, 1…
      chorus:
      - chorusRef: Ps 97, 3
        chorus: |-
          La terre tout entière a vu
          le salut que Dieu nous donne.
      content: |-
        Chantez au Seigneur un chant nouveau,
        car il a fait des merveilles ;
        par son bras très saint, par sa main puissante,
        il s’est assuré la victoire.

        Le Seigneur a fait connaître sa victoire
        et révélé sa justice aux nations ;
        il s’est rappelé sa fidélité, son amour,
        en faveur de la maison d’Israël.

        La terre tout entière a vu
        la victoire de notre Dieu.
        Acclamez le Seigneur, terre entière,
        sonnez, chantez, jouez !

        Jouez pour le Seigneur sur la cithare,
        sur la cithare et tous les instruments ;
        au son de la trompette et du cor,
        acclamez votre roi, le Seigneur !
  - partType: SECOND_READING
    partContents:
    - biblicalRef: He 1, 1-6
      headline: « Dieu nous a parlé par son Fils »
      content: |-
        À bien des reprises
        et de bien des manières,
        Dieu, dans le passé,
        a parlé à nos pères par les prophètes ;
        >mais à la fin, en ces jours où nous sommes,
        il nous a parlé par son Fils
        qu’il a établi héritier de toutes choses
        et par qui il a créé les mondes.
        >Rayonnement de la gloire de Dieu,
        expression parfaite de son être,
        le Fils, qui porte l’univers
        par sa parole puissante,
        après avoir accompli la purification des péchés,
        s’est assis à la droite de la Majesté divine
        dans les hauteurs des cieux ;
        >et il est devenu bien supérieur aux anges,
        dans la mesure même où il a reçu en héritage
        un nom si différent du leur.
        >En effet, Dieu déclara-t-il jamais à un ange :
        %Tu es mon Fils,
        moi, aujourd’hui, je t’ai engendré ?%
        Ou bien encore :
        %Moi, je serai pour lui un père,
        et lui sera pour moi un fils ?%
        >À l’inverse, au moment d’introduire le Premier-né
        dans le monde à venir,
        il dit :
        %Que se prosternent devant lui
        tous les anges de Dieu.%
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 1, 1-18
      headline: « Le Verbe s’est fait chair, il a habité parmi nous »
      acclamationAntiphon: |-
        Aujourd’hui la lumière a brillé sur la terre.
        Peuples de l’univers, entrez dans la clarté de Dieu.
        Venez tous adorer le Seigneur !
      content: |-
        Au commencement était le Verbe,
        et le Verbe était auprès de Dieu,
        et le Verbe était Dieu.
        >Il était au commencement auprès de Dieu.
        >C’est par lui que tout est venu à l’existence,
        et rien de ce qui s’est fait ne s’est fait sans lui.
        >En lui était la vie,
        et la vie était la lumière des hommes ;
        >la lumière brille dans les ténèbres,
        et les ténèbres ne l’ont pas arrêtée.

        Il y eut un homme envoyé par Dieu ;
        son nom était Jean.
        >Il est venu comme témoin,
        pour rendre témoignage à la Lumière,
        afin que tous croient par lui.
        >Cet homme n’était pas la Lumière,
        mais il était là pour rendre témoignage à la Lumière.

        Le Verbe était la vraie Lumière,
        qui éclaire tout homme
        en venant dans le monde.
        >Il était dans le monde,
        et le monde était venu par lui à l’existence,
        mais le monde ne l’a pas reconnu.

        Il est venu chez lui,
        et les siens ne l’ont pas reçu.
        >Mais à tous ceux qui l’ont reçu,
        il a donné de pouvoir devenir enfants de Dieu,
        eux qui croient en son nom.
        >Ils ne sont pas nés du sang,
        ni d’une volonté charnelle,
        ni d’une volonté d’homme :
        ils sont nés de Dieu.
        >Et le Verbe s’est fait chair,
        il a habité parmi nous,
        et nous avons vu sa gloire,
        la gloire qu’il tient de son Père
        comme Fils unique,
        plein de grâce et de vérité.

        Jean le Baptiste lui rend témoignage en proclamant :
        « C’est de lui que j’ai dit :
        Celui qui vient derrière moi
        est passé devant moi,
        car avant moi il était. »
        >Tous, nous avons eu part à sa plénitude,
        nous avons reçu grâce après grâce ;
        >car la Loi fut donnée par Moïse,
        la grâce et la vérité sont venues par Jésus Christ.

        Dieu, personne ne l’a jamais vu ;
        le Fils unique, lui qui est Dieu,
        lui qui est dans le sein du Père,
        c’est lui qui l’a fait connaître.
      shortBiblicalRef: Jn 1, 1-5.9-14
      shortContent: |-
        Au commencement était le Verbe,
        et le Verbe était auprès de Dieu,
        et le Verbe était Dieu.
        >Il était au commencement auprès de Dieu.
        >C’est par lui que tout est venu à l’existence,
        et rien de ce qui s’est fait ne s’est fait sans lui.
        >En lui était la vie,
        et la vie était la lumière des hommes ;
        >la lumière brille dans les ténèbres,
        et les ténèbres ne l’ont pas arrêtée.

        Le Verbe était la vraie Lumière,
        qui éclaire tout homme
        en venant dans le monde.
        >Il était dans le monde,
        et le monde était venu par lui à l’existence,
        mais le monde ne l’a pas reconnu.
        >Il est venu chez lui,
        et les siens ne l’ont pas reçu.
        >Mais à tous ceux qui l’ont reçu,
        il a donné de pouvoir devenir enfants de Dieu,
        eux qui croient en son nom.
        >Ils ne sont pas nés du sang,
        ni d’une volonté charnelle,
        ni d’une volonté d’homme :
        ils sont nés de Dieu.
        >Et le Verbe s’est fait chair,
        il a habité parmi nous,
        et nous avons vu sa gloire,
        la gloire qu’il tient de son Père
        comme Fils unique,
        plein de grâce et de vérité.
  offeringPrayer:
  - |-
    Que l’offrande présentée en ce jour de solennité
    te soit agréable, Seigneur, *
    car elle nous a réconciliés avec toi,
    >parfaitement rétablis dans ta paix, /
    >et introduits dans la plénitude de l’adoration véritable.
    Par le Christ, notre Seigneur.
  offeringPrayer: |-
    Reçois, Seigneur, nous t’en prions,
    >les offrandes de tes fidèles serviteurs ; *
    purifie-les quand ils célèbrent avec amour tes mystères,
    >par lesquels tu rends justes /
    >même ceux qui ne te connaissent pas.
    Par le Christ, notre Seigneur.
