celebration:
  title: Saint Norbert
  subtitle: évêque
  description: Norbert (1080-1134) fut d’abord chanoine de Xanten (Rhénanie), puis il voulut adopter une vie plus évangélique avec quelques compagnons. Ils se fixèrent en France près de Laon à Prémontré, où Norbert fonda une communauté de Chanoines réguliers (1120). Peu après il devait être nommé archevêque de Magdebourg et il travailla à la réforme de l’Église en Allemagne.
  commons:
    - pastors_bishop
  color: white

oration:
  - Pour le service de ton Église, Seigneur, tu as voulu que l’évêque saint Norbert soit un homme de prière et un vrai pasteur ; par son intercession, daigne assurer à ton peuple les hommes qui le guideront selon ta volonté et le conduiront jusqu’au salut.

readings:
  patristicReading:
    - title: VIE DE SAINT NORBERT PAR UN CONTEMPORAIN
      content: |-
        Norbert est compté à juste titre parmi ceux qui se sont dévoués avec le plus d’efficacité à la réforme grégorienne. En effet, il est le premier qui a voulu instituer un clergé qui serait consacré à la vie authentiquement évangélique et apostolique, qui serait chaste et pauvre, qui recevrait, « tout à la fois le vêtement et la parure de l’homme nouveau : le vêtement avec l’habit religieux, la parure avec la dignité sacerdotale » ; un clergé qui voudrait « suivre les saintes Écritures et avoir le Christ pour guide ». Norbert recommandait trois choses à ce clergé : « la pureté à l’égard de l’autel et du service divin ; la correction, au chapitre, des excès et des négligences ; le soin des pauvres et l’hospitalité ».
        Mais aux prêtres, qui tenaient dans le monastère la place des Apôtres, il adjoignit, comme dans l’Église primitive, une foule de fidèles, laïques et femmes ; c’est au point que, disait-on généralement, depuis l’époque des Apôtres, aucun fondateur n’a conquis au Christ en si peu de temps un si grand nombre d’imitateurs de la vie parfaite.
        Devenu archevêque de Magdebourg, Il appela ses confrères pour qu’ils amènent à la foi la région des Wendes. Il s’efforça d’amener à la réforme le clergé de son diocèse, en dépit de l’agitation et des troubles populaires.
        Enfin il consacra ses principaux efforts à préserver et à développer la bonne harmonie entre le Siège Apostolique et l’Empire, tout en sauvegardant la liberté des élections ecclésiastiques. Si bien que le pape Innocent II lui écrivit : « Le Siège Apostolique te remercie de tout cœur, comme son fils si dévoué », et que l’empereur le fit archichancelier de l’Empire.
        En tout cela, il montra une foi intrépide : « Norbert se distingue par la foi, disait-on, comme Bernard de Clairvaux par la charité. » Son commerce était plein de charme : « il se montrait grand avec les grands, modeste avec les petits, aimable pour tous. » Enfin, il avait une éloquence supérieure : « sa parole était enflammée, brûlant les vices, stimulant les vertus, enrichissant de sa sagesse les âmes bien disposées. » Contemplateur des mystères divins, il les méditait assidûment et les répandit hardiment.

      responsory: |-
        R/ C’est au prix de son sang
        que le Christ s’est acquis l’Église.
        
        Soyez donc attentifs au troupeau
        dont l’Esprit vous a confié la charge.
        
        Vous serez les intendants fidèles
        des mystères de sa grâce.
        
        Livrés en spectacle au monde,
        vous serez les modèles du troupeau.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >pour le service de ton Église,
    >tu as voulu que l’évêque saint Norbert
    >soit un homme de prière
    >et un vrai berger pour ton peuple ; *
    par son intercession, accorde toujours à tes fidèles
    >des pasteurs selon ton cœur /
    >qui leur donnent la nourriture du salut.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ez 34, 11-16
      headline: « Comme un berger veille sur son troupeau, ainsi je veillerai sur mes brebis »
      content: |-
        Ainsi parle le Seigneur Dieu :
        Voici que moi-même, je m’occuperai de mes brebis,
        et je veillerai sur elles.
        Comme un berger veille sur les brebis de son troupeau
        quand elles sont dispersées,
        ainsi je veillerai sur mes brebis,
        et j’irai les délivrer dans tous les endroits où elles ont été dispersées
        un jour de nuages et de sombres nuées.
        Je les ferai sortir d’entre les peuples,
        je les rassemblerai des différents pays
        et je les ramènerai sur leur terre ;
        je les ferai paître sur les montagnes d’Israël,
        dans les vallées, dans les endroits les meilleurs.
        Je les ferai paître dans un bon pâturage,
        et leurs prairies seront sur les hauteurs d’Israël.
        Là, mes brebis se reposeront dans de belles prairies,
        elles brouteront dans de gras pâturages, sur les monts d’Israël.
        C’est moi qui ferai paître mon troupeau,
        et c’est moi qui le ferai reposer
        - oracle du Seigneur Dieu.
        La brebis perdue, je la chercherai ;
        l’égarée, je la ramènerai.
        Celle qui est blessée, je la panserai.
        Celle qui est malade, je lui rendrai des forces.
        Celle qui est grasse et vigoureuse,
        je la garderai, je la ferai paître selon le droit.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      refAbbr: cf. 22, 1
      chorus:
      - chorusRef: cf. 22, 1
        chorus: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi :
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 14, 25-33
      headline: « Celui qui ne renonce pas à tout ce qui lui appartient ne peut pas être mon disciple »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        de grandes foules faisaient route avec Jésus ;
        il se retourna et leur dit :
        « Si quelqu’un vient à moi
        sans me préférer à son père, sa mère, sa femme,
        ses enfants, ses frères et sœurs,
        et même à sa propre vie,
        il ne peut pas être mon disciple.
        Celui qui ne porte pas sa croix
        pour marcher à ma suite
        ne peut pas être mon disciple.
        Quel est celui d’entre vous
        qui, voulant bâtir une tour,
        ne commence par s’asseoir,
        pour calculer la dépense
        et voir s’il a de quoi aller jusqu’au bout ?
        Car, si jamais il pose les fondations
        et n’est pas capable d’achever,
        tous ceux qui le verront vont se moquer de lui :
        "Voilà un homme qui a commencé à bâtir
        et n’a pas été capable d’achever !"
        Et quel est le roi
        qui, partant en guerre contre un autre roi,
        ne commence par s’asseoir
        pour voir s’il peut, avec dix mille hommes,
        affronter l’autre qui marche contre lui avec vingt mille ?
        S’il ne le peut pas,
        il envoie, pendant que l’autre est encore loin,
        une délégation pour demander les conditions de paix.
        Ainsi donc, celui d’entre vous qui ne renonce pas
        à tout ce qui lui appartient
        ne peut pas être mon disciple. »
        
