celebration:
  title: Notre-Dame du Rosaire
  commons:
    - virgin-mary
  color: white

oration:
  - |-
    Que ta grâce, Seigneur notre Père, se répande en nos cœurs : par le message de l’ange, tu nous as fait connaître l’incarnation de ton Fils bien-aimé, conduis-nous par sa passion et par sa croix, avec le secours de la Vierge Marie, jusqu’à la gloire de la résurrection.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT BERNARD « SUR L’AQUEDUC »
      content: |-
        L’ange dit à Marie : %L’enfant qui va naître de toi sera saint, et il sera appelé Fils de Dieu%. Lui, la source de la Sagesse, le Verbe du Père dans les lieux très hauts ! Ce Verbe, c’est par ton intermédiaire, Vierge sainte, qu’il se fera chair ; de la sorte, celui qui dit :  %Je suis dans le Père et le Père est en moi%, peut dire cependant : %C’est de Dieu que je suis sorti et que je viens%.
        %Au commencement était le Verbe%. Déjà la source jaillissait, mais ce n’était encore qu’à l’intérieur d’elle-même. %Et le Verbe était avec Dieu%, habitant une lumière vraiment inaccessible. Et le Seigneur disait dès le début : %Je forme des projets de paix, non de malheur%. Mais il est caché tout au fond de toi, ton projet, et son contenu, nous ne le connaissons pas. %Qui en effet a connu la pensée du Seigneur, ou qui a été son conseiller ?%
        C’est pourquoi le projet de paix est descendu dans une œuvre de paix : %Le Verbe s’est fait chair%, et il habite dès lors en nous. Il habite à coup sûr dans nos cœurs par la foi, il habite dans notre mémoire, il habite dans notre pensée, et il descend jusque dans notre imagination elle-même. Auparavant, en effet, quelle idée l’homme pouvait-il se faire de Dieu, sinon peut-être celle d’une idole qu’avait fabriquée son cœur ? C’est que Dieu était incompréhensible et inaccessible, invisible et parfaitement irreprésentable. Mais maintenant il a voulu qu’on puisse le comprendre, il a voulu qu’on puisse le voir, il a voulu qu’on puisse le saisir par la pensée.
        De quelle manière ? demandes-tu. Sans nul doute en étant couché dans une crèche, en reposant sur le sein de la Vierge, en prêchant sur la montagne, en passant la nuit à prier ; non moins qu’en étant cloué à la croix, en devenant livide dans la mort, libre parmi les morts et régnant sur l’enfer ; enfin en ressuscitant le troisième jour, en montrant aux Apôtres la marque des clous, signes de sa victoire, et pour finir en regagnant devant eux les secrets du ciel.
        De tous ces événements, en est-il un qui ne susciterait pas en nous une pensée vraie, fervente, sainte ? Que je pense à l’un d’entre eux, n’importe lequel, c’est à Dieu que je pense, et à travers tout cela, il est, lui, mon Dieu. Méditer ces événements, c’est la sagesse même, je l’ai dit, et j’estime que l’intelligence avisée consiste à faire remonter en soi le souvenir que l’on garde de leur douceur, une douceur comme celle des amandes que produisit avec abondance le bâton du prêtre Aaron, la douceur que Marie puisa largement dans les hauteurs, pour la reverser sur nous.
      responsory: |-
        R/ Réjouis-toi, Marie,
        tu donneras le Sauveur au monde !

        Il sera grand,
        on l’appellera Fils du Très-Haut !

        Il vient chercher
        ce qui était perdu.

        Il rassemblera
        les enfants de Dieu dispersés.

morning:
  hymn:
  - quand-l-esprit-dieu
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - De la Vierge Marie est né Jésus, celui que l’on appelle Christ.
    - psalm: OT_41
      antiphon:
        - |-
          Avec toi, Marie, nous bénissons le Seigneur : sur la croix il a fait de toi notre mère.
    - psalm: PSALM_149
      antiphon:
        - Tu demeures dans la gloire du ciel, Vierge Marie, couronnée de douze étoiles.
  reading:
    biblicalReference: cf. Is 61, 10
    content: Je tressaille de joie dans le Seigneur, mon âme exulte en mon Dieu. Car il m’a enveloppée du manteau de l’innocence, il m’a fait revêtir les vêtements du salut, comme une mariée met ses bijoux.
  responsory: |-
    R/ Réjouis-toi, comblée de grâce :
    * Le Seigneur est avec toi.
    V/ Tu es bénie entre toutes les femmes. * Le Seigneur.
    Gloire au Père. R/ Réjouis-toi.
  evangelicAntiphon:
    common: Ô Mère bienheureuse, Vierge très pure et Reine du monde intercède pour nous qui sommes tes enfants.

vespers:
  hymn:
  - pleine-de-grace-nous-te-louons
  psalmody:
    - psalm: PSALM_121
      antiphon:
        - L’ange du Seigneur annonce à Marie que l’Esprit la couvrira de son ombre.
    - psalm: PSALM_126
      antiphon:
        - Près de la croix de Jésus se tenait sa mère.
    - psalm: NT_4
      antiphon:
        - Réjouis-toi, Vierge Marie, le Christ est sorti du tombeau, alléluia.
  reading:
    biblicalReference: Ga 4, 4-5
    content: Lorsque les temps furent accomplis, Dieu a envoyé son Fils ; il est né d’une femme, il a été sujet de la Loi juive pour racheter ceux qui étaient sujets de la Loi et pour faire de nous des fils.
  responsory: |-
    R/ Réjouis-toi, comblée de grâce :
    * Le Seigneur est avec toi.
    V/ Tu es bénie entre toutes les femmes. * Le Seigneur.
    Gloire au Père. R/ Réjouis-toi.
  evangelicAntiphon:
    common: Marie retenait toutes ces paroles et les méditait dans son cœur.

mass:
- massType: day_mass
  entranceAntiphon:
  - biblicalReference: cf. Lc 1,28.42
    content: |-
      Je te salue, Marie, comblée de grâce,
      >le Seigneur est avec toi :
      tu es bénie entre toutes les femmes,
      >et le fruit de tes entrailles est béni.
  collect:
  - |-
    Nous te prions, Seigneur, de répandre ta grâce en nos cœurs ; +
    >par le message de l’Ange, tu nous as fait connaître
    >l’incarnation de ton Fils bien-aimé ; *
    conduis-nous par sa passion et par sa croix,
    >avec le secours de la bienheureuse Vierge Marie, /
    >jusqu’à la gloire de la résurrection.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ac 1, 12-14
      headline: « Tous, d’un même cœur, étaient assidus à la prière, avec Marie la mère de Jésus »
      content: |-
        Les Apôtres, après avoir vu Jésus s’en aller vers le ciel,
        retournèrent à Jérusalem
        >depuis le lieu-dit « mont des Oliviers » qui en est proche
        >- la distance de marche ne dépasse pas
        >ce qui est permis le jour du sabbat.
        À leur arrivée, ils montèrent dans la chambre haute
        >où ils se tenaient habituellement ;
        c’était Pierre, Jean, Jacques et André,
        >Philippe et Thomas, Barthélemy et Matthieu,
        >Jacques fils d’Alphée, Simon le Zélote, et Jude fils de Jacques.
        Tous, d’un même cœur, étaient assidus à la prière,
        >avec des femmes, avec Marie la mère de Jésus,
        >et avec ses frères.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Lc 1, 46b-47, 48-49, 50-51, 52-53, 54-55
      label: Cantique
      refAbbr: Lc 1, 49
      chorus:
      - chorusRef: Lc 1, 49
        chorus: |-
          Le Puissant fit pour moi des merveilles ;
          Saint est son nom !
      - chorusRef: null
        chorus: |-
          ou : Heureuse Vierge Marie,
          qui portas en toi le Fils du Père éternel !
      content: |-
        Mon âme exalte le Seigneur,
        exulte mon esprit en Dieu, mon Sauveur !

        Il s’est penché sur son humble servante ;
        désormais tous les âges me diront bienheureuse.
        Le Puissant fit pour moi des merveilles ;
        Saint est son nom !

        Sa miséricorde s’étend d’âge en âge
        sur ceux qui le craignent.
        Déployant la force de son bras,
        il disperse les superbes.

        Il renverse les puissants de leurs trônes,
        il élève les humbles.
        Il comble de biens les affamés,
        renvoie les riches les mains vides.

        Il relève Israël son serviteur,
        il se souvient de son amour,
        de la promesse faite à nos pères,
        en faveur d’Abraham et sa descendance à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 1, 26-38
      headline: « Voici que tu vas concevoir et enfanter un fils »
      acclamationAntiphon: |-
        Je te salue, Marie, Comblée-de-grâce :
        le Seigneur est avec toi,
        tu es bénie entre les femmes.
      content: |-
        En ce temps-là,
        l’ange Gabriel fut envoyé par Dieu
        dans une ville de Galilée, appelée Nazareth,
        à une jeune fille vierge,
        accordée en mariage à un homme de la maison de David,
        appelé Joseph ;
        et le nom de la jeune fille était Marie.
        L’ange entra chez elle et dit :
        « Je te salue, Comblée-de-grâce,
        le Seigneur est avec toi. »
        À cette parole, elle fut toute bouleversée,
        et elle se demandait ce que pouvait signifier cette salutation.
        L’ange lui dit alors :
        « Sois sans crainte, Marie,
        car tu as trouvé grâce auprès de Dieu.
        Voici que tu vas concevoir et enfanter un fils ;
        tu lui donneras le nom de Jésus.
        Il sera grand,
        il sera appelé Fils du Très-Haut ;
        le Seigneur Dieu
        lui donnera le trône de David son père ;
        il régnera pour toujours sur la maison de Jacob,
        et son règne n’aura pas de fin. »
        Marie dit à l’ange :
        « Comment cela va-t-il se faire,
        puisque je ne connais pas d’homme ? »
        L’ange lui répondit :
        « L’Esprit Saint viendra sur toi,
        et la puissance du Très-Haut
        te prendra sous son ombre ;
        c’est pourquoi celui qui va naître sera saint,
        il sera appelé Fils de Dieu.
        Or voici que, dans sa vieillesse, Élisabeth, ta parente,
        a conçu, elle aussi, un fils
        et en est à son sixième mois,
        alors qu’on l’appelait la femme stérile.
        Car rien n’est impossible à Dieu. »
        Marie dit alors :
        « Voici la servante du Seigneur ;
        que tout m’advienne selon ta parole. »
        Alors l’ange la quitta.
  offeringPrayer:
  - |-
    Nous te le demandons, Seigneur : +
    fais que nous soyons accordés à cette offrande, *
    >et qu’en célébrant les mystères de ton Fils unique, /
    >nous soyons rendus dignes de ses promesses.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: Lc 1,31
    content: |-
      Voici que tu vas concevoir et enfanter un fils ;
      >tu lui donneras le nom de Jésus.
  prayerAfterCommunion:
  - |-
    Nous t’en prions, Seigneur notre Dieu,
    >nous qui annonçons dans ce sacrement
    >la mort et la résurrection de ton Fils : *
    puisque nous prenons part à ses souffrances, /
    >donne-nous de trouver le réconfort
    >et de partager sa gloire.
    Lui qui vit et règne pour les siècles des siècles.