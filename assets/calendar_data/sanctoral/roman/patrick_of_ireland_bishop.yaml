celebration:
  title: Saint Patrick
  subtitle: évêque
  description: Patrick était né en Grande-Bretagne vers 385. Il décida de consacrer sa vie à l’évangélisation de l’Irlande. Homme de prière et d’une austérité étonnante, il avait aussi un sens pratique qui lui permit d’adapter son apostolat aux conditions sociales et politiques des Celtes, Ordonné évêque, il réussit à implanter solidement l’Église dans l’ensemble de l’île († vers 461).
  commons:
  - pastors_bishop
  color: white

oration:
- Pour te faire connaître, Seigneur, aux peuples d’Irlande tu as choisi l’évêque saint Patrice; à sa prière et par ses mérites, accorde à ceux qui ont la joie d’être chrétiens d’annoncer aux hommes les merveilles de ton amour.

readings:
  patristicReading:
  - title: CONFESSION DE FOI DE SAINT PATRICK
    content: |-
      Sans relâche, je rends grâce à mon Dieu, qui m’a gardé fidèle au jour de ma tentation, si bien qu’aujourd’hui je peux avec confiance offrir mon âme en sacrifice, comme une hostie vivante, au Christ mon Seigneur, qui m’a gardé dans tous les passages difficiles de ma vie. Et je dis: Qui suis-je, seigneur, ou quelle est ma vocation, pour que tu m’aies couvert de ta si grande divinité? Aussi, aujourd’hui, parmi les peuples, je ne cesse d’exulter et de magnifier ton nom, où que je puisse me trouver, et pas seulement quand tout va bien, mais aussi dans les difficultés. Quoi qu’il m’arrive, de bien ou de mal, je dois en conséquence l’accepter d’une âme égale, et toujours rendre grâce à Dieu qui m’a montré comment avoir en lui une foi indéfectible et sans limite; il aura aussi écouté ma prière, car mon désir, le voici: bien qu’incapable d’accomplir, dans ces temps qui sont les derniers, une œuvre si bonne et si admirable, je souhaite parvenir pourtant à imiter ces hommes dont le Seigneur, autrefois, avait prédit qu’ils annonceraient son Évangile %en témoignage pour toutes les nations%.
      D’où me vient cette sagesse, qui n’était pas en moi, car je ne connaissais pas le nombre de mes jours, et je n’avais pas le goût de Dieu? D’où m’est venu par la suite le don si grand et si salutaire de connaître Dieu et de l’aimer, au point de perdre patrie et famille, et de venir parmi les Irlandais prêcher l’Évangile ? Oui, d’où vient que j’aie pu supporter les outrages de la part des incroyants, endurer la peine de ma pérégrination, et de nombreuses persécutions, y compris l’emprisonnement, et renoncer à ma libération pour être utile aux autres?
      Et si j’en suis digne, me voilà prêt à donner jusqu’à ma Vie, sans hésitation et de très bon cœur, pour son nom; oui, je souhaite la mettre à son service jusqu’à la mort, si le Seigneur me le permet. Car je suis infiniment débiteur à l’égard de Dieu, lui qui m’a accordé cette grâce exceptionnelle de faire renaître en Dieu de nombreux peuples par mon intermédiaire, puis de les conduire à la plénitude de la foi; il m’a aussi permis d’ordonner en tout lieu des ministres pour ce peuple venu récemment à la toi, ce peuple que le Seigneur s’est acquis des extrémités de la terre comme il en avait fait autrefois la promesse par ses prophètes: %À toi viendront les nations des extrémités de la terre, en disant: Ainsi nos Pères se sont procuré de fausses idoles, qui sont sans utilité%. Et ailleurs: %Je t’ai placé comme une lumière pour les nations, afin que tu sois leur salut jusqu’au bout de la terre%.
      C’est là que je veux attendre la réalisation de sa promesse, car jamais il n’y faillit, ainsi qu’il s’engage dans l’Évangile: %Ils viendront d’Orient et d’Occident pour s’attabler avec Abraham, Isaac et Jacob%. Nous le croyons en effet: du monde entier viendront les croyants.
    responsory: |-
      R/ En Dieu notre confiance :
      il nous pourvoit de tout avec générosité.

      Combats le bon combat,
      conquiers la vie éternelle
      à laquelle tu as été appelé.

      N’amassez pas de trésors sur la terre
      mais dans le ciel,
      et débordez d’action de grâce.

morning:
  evangelicAntiphon:
    common:
    - Allez, enseignez tous les hommes, baptisez-les au nom du Père et du Fils et du Saint-Esprit.

vespers:
  evangelicAntiphon:
    common:
    - Beaucoup viendront d’orient et d’occident s’asseoir avec les fils d’Abraham au festin du Royaume.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as bien voulu donner l’évêque saint Patrick
    >aux peuples d’Irlande
    >pour qu’il leur proclame ta gloire ; *
    à sa prière et par ses mérites,
    >accorde à ceux qui portent avec fierté le nom de chrétiens /
    >d’annoncer sans relâche aux hommes tes merveilles.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 4, 7b-11
      headline: « Ce que chacun de vous a reçu comme don de la grâce, mettez-le au service des autres »
      content: |-
        Bien-aimés,
        soyez raisonnables et sobres
        en vue de la prière.
        Avant tout, ayez entre vous une charité intense,
        car la charité couvre une multitude de péchés.
        Pratiquez l’hospitalité les uns envers les autres
        sans récriminer.
        Ce que chacun de vous a reçu comme don de la grâce,
        mettez-le au service des autres,
        en bons gérants de la grâce de Dieu
        qui est si diverse :
        si quelqu’un parle,
        qu’il le fasse comme pour des paroles de Dieu ;
        celui qui assure le service,
        qu’il s’en acquitte comme avec la force procurée par Dieu.
        Ainsi, en tout, Dieu sera glorifié par Jésus Christ,
        à qui appartiennent la gloire et la souveraineté
        pour les siècles des siècles. Amen.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur, la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 5, 1-11
      headline: « Sur ta parole, je vais jeter les filets »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        En ce temps-là,
        la foule se pressait autour de Jésus
        pour écouter la parole de Dieu,
        tandis qu’il se tenait au bord du lac de Génésareth.
        Il vit deux barques qui se trouvaient au bord du lac ;
        les pêcheurs en étaient descendus
        et lavaient leurs filets.
        Jésus monta dans une des barques qui appartenait à Simon,
        et lui demanda de s’écarter un peu du rivage.
        Puis il s’assit et, de la barque, il enseignait les foules.
        Quand il eut fini de parler,
        il dit à Simon :
        « Avance au large,
        et jetez vos filets pour la pêche. »
        Simon lui répondit :
        « Maître, nous avons peiné toute la nuit sans rien prendre ;
        mais, sur ta parole, je vais jeter les filets. »
        Et l’ayant fait,
        ils capturèrent une telle quantité de poissons
        que leurs filets allaient se déchirer.
        Ils firent signe à leurs compagnons de l’autre barque
        de venir les aider.
        Ceux-ci vinrent,
        et ils remplirent les deux barques,
        à tel point qu’elles enfonçaient.
        À cette vue,
        Simon-Pierre tomba aux genoux de Jésus, en disant :
        « Éloigne-toi de moi, Seigneur,
        car je suis un homme pécheur. »
        En effet, un grand effroi l’avait saisi,
        lui et tous ceux qui étaient avec lui,
        devant la quantité de poissons qu’ils avaient pêchés ;
        et de même Jacques et Jean, fils de Zébédée,
        les associés de Simon.
        Jésus dit à Simon :
        « Sois sans crainte,
        désormais ce sont des hommes que tu prendras. »
        Alors ils ramenèrent les barques au rivage
        et, laissant tout, ils le suivirent.
