celebration:
  title: Saint Paulin de Nole
  subtitle: évêque
  description: Le consul Paulin (355-431) et sa femme Thérèse possédaient de vastes territoires en Aquitaine, en Espagne et en Italie méridionale. Devenus chrétiens (393), ils renoncèrent à leurs biens et se retirèrent à Nole (Campanie), où Paulin fut élu évêque (409). Il devait gouverner cette Église durant vingt-deux ans. « De tous mes biens terrestres, dit Paulin, je payai l’espérance du ciel ».
  commons:
    - pastors_bishop
  color: white

oration:
  - Tu nous as donné, Seigneur, dans l’évêque Paulin de Nole, un modèle de zèle pastoral et de tendresse pour les pauvres ; fais qu’en célébrant ses mérites, nous prenions exemple sur sa charité.

readings:
  patristicReading:
    - title: LETTRE DE PAULIN DE NOLE À ALYPIUS, ÉVÊQUE DE THAGASTE
      subtitle: (ami de Saint Augustin)
      content: |-
        C’est d’une vraie charité, d’une parfaite dilection que tu viens de faire preuve à l’égard de ma modeste personne, Seigneur Alypius, appelé à juste titre saint et bienheureux père, très cher ami. En effet, j’ai reçu par mon messager Julien, qui revenait de Carthage, une lettre qui m’apportait une si grande lumière venant de ta piété qu’il m’a semblé non pas y découvrir ta charité envers moi, mais la retrouver. Car cette charité a jailli de celui qui nous a destinés à lui dès l’origine du monde, et en qui nous avons été créés avant de naître, car %c’est lui qui nous a faits et non pas nous%, c’est lui qui a fait ce qui doit venir. Nous avons donc été formés par sa prescience et son œuvre créatrice, et nous avons été unis par une charité antérieure à toute connaissance, afin d’avoir des volontés semblables et de nous rejoindre dans l’unité de la foi, ou dans la foi en l’unité. C’est ainsi que nous nous sommes connus l’un l’autre avant de nous voir de nos yeux, par une révélation de l’esprit.
        Je me réjouis donc et me glorifie dans le Seigneur : étant seul et unique, c’est lui qui, à travers le monde entier, fait agir son amour en tous les siens par le Saint-Esprit. Il a répandu celui-ci sur tout homme : c’est %le fleuve dont le courant fait la joie de sa cité%. Dans cette cité, le Siège Apostolique, à juste titre, a fait de toi un évêque ; %il l’a établi parmi les princes de son peuple% ; et quant à moi, il m’a relevé de la poussière, il a honoré le pauvre que je suis, il a voulu que je partage ton sort. Mais ce qui me réjouit davantage, dans cette faveur de Dieu, c’est qu’il m’a installé dans la demeure de ton cœur, il a daigné m’introduire au plus profond de ton affection. C’est pourquoi je revendique une confiance toute particulière de ta charité, que doivent exciter nos fonctions et nos charges d’évêques, et il ne m’est pas permis de t’aimer de façon hésitante et superficielle. ~
        Pour que tu n’ignores rien de moi, sache qu’un pécheur aussi invétéré n’a pas été tiré jadis des ténèbres et de l’ombre de la mort pour aspirer le souffle de la vie ; qu’il n’a pas jadis mis la main à la charrue et pris sa croix avec assez de force pour aller jusqu’au bout, s’il n’a pas le secours de tes prières. Ce bienfait mettra le comble à tes mérites si, par ton intercession, tu allèges mes fardeaux.
        En effet, l’homme pieux qui aide l’homme accablé, car je n’ose dire : « le frère », %s’élèvera comme une grande cité%. ~
        J’ai envoyé à ta sainteté le pain unique en vue de l’unité, pain dans lequel se trouve aussi l’indivisible Trinité. Tu feras de ce pain une eulogie, si tu veux bien le recevoir.

      responsory: |-
        R/ Heureux ceux qui écoutent la Parole de Dieu
        et qui la gardent.
        
        Que le Seigneur vous fasse croître
        et abonder dans l’amour mutuel.
        
        Que le Seigneur affermisse vos cœurs
        dans une sainteté sans reproche devant lui.
        
        Que Dieu notre Père vous garde vigilants
        pour l’avènement de notre Seigneur Jésus Christ
        avec tous ses saints.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    tu as voulu que le bienheureux évêque Paulin,
    brille par son amour de la pauvreté
    et par son zèle pastoral ; *
    puisque nous célébrons ses mérites, /
    >accorde-nous de prendre exemple sur sa charité.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 2Co 8, 9-15
      headline: « Lui qui est riche, il s’est fait pauvre à cause de vous, pour que vous deveniez riches par sa pauvreté »
      content: |-
        Frères,
        vous connaissez le don généreux de notre Seigneur Jésus Christ :
        lui qui est riche, il s’est fait pauvre à cause de vous,
        pour que vous deveniez riches par sa pauvreté.
        Au sujet de la collecte pour les fidèles de Jérusalem,
        je donne mon avis, car cela vous est utile,
        à vous qui, dès l’année dernière,
        avez pris l’initiative non seulement de la réaliser,
        mais encore de la décider.
        Et maintenant, allez jusqu’au bout de la réalisation :
        comme vous avez mis votre ardeur à prendre cette décision,
        ainsi vous irez jusqu’au bout, selon vos moyens.
        Car s’il y a de l’ardeur,
        on est bien reçu avec ce que l’on a,
        peu importe ce que l’on n’a pas.
        Il ne s’agit pas de vous mettre dans la gêne
        en soulageant les autres,
        il s’agit d’égalité.
        Dans la circonstance présente,
        ce que vous avez en abondance comblera leurs besoins,
        afin que, réciproquement, ce qu’ils ont en abondance
        puisse combler vos besoins,
        et cela fera l’égalité,
        comme dit l’Écriture à propos de la manne :
        celui qui en avait ramassé beaucoup
        n’eut rien de trop,
        celui qui en avait ramassé peu
        ne manqua de rien.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 12, 32-34
      headline: « Votre Père a trouvé bon de vous donner le Royaume »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Sois sans crainte, petit troupeau :
        votre Père a trouvé bon de vous donner le Royaume.
        Vendez ce que vous possédez
        et donnez-le en aumône.
        Faites-vous des bourses qui ne s’usent pas,
        un trésor inépuisable dans les cieux,
        là où le voleur n’approche pas,
        où la mite ne détruit pas.
        Car là où est votre trésor,
        là aussi sera votre cœur. »
        
