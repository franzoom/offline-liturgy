celebration:
  title: Saintes Perpétue et Félicité
  subtitle: martyres
  description: Perpétue n’était que catéchumène quand elle fut arrêtée. Âgée de vingt‑deux ans, elle était mère d’un tout jeune enfant. Félicité était enceinte et elle accoucha d’une fille dans la prison. Mais ni l’une ni l’autre ne faiblit lorsque, le 7 mars 303, elles pénétrèrent dans l’amphithéâtre de Carthage. C’est la main dans la main qu’elles s’avancèrent vers la vache furieuse qui devait les immoler.
  commons:
  - martyrs_female
  color: red

oration:
- Dans leur amour pour toi, Seigneur, tes martyres Perpétue et Félicité ont trouvé la force de résister à leurs persécuteurs et de sur monter les tourments de la mort ; donne-nous, à leur prière la grâce de t’aimer toujours davantage.

readings:
  patristicReading:
  - title: ACTES DES MARTYRS DE CARTHAGE
    content: |-
      Le jour se leva, où les martyrs allaient remporter la victoire, et ils sortirent de la prison pour s’avancer vers l’amphithéâtre comme s’ils allaient au ciel. Ils avaient des visages gais et radieux, et s’ils tremblaient, c’était de joie, non de peur. ~
      Perpétue, la première, fut frappée par les cornes d’une vache furieuse et tomba à la renverse. ~ Puis elle se releva et voyant que Félicité avait été précipitée sur le sol, elle s’approcha, la prit par la main et l’aida à se redresser. Toutes deux demeurèrent debout. La cruauté du peuple s’apaisa et on les fit sortir par la porte des Vivants.
      Là, Perpétue fut accueillie par un certain Rustique, alors catéchumène qui était à son service et, comme si elle sortait du sommeil (tellement elle avait été ravie en extase), elle se mit à regarder autour d’elle et dit, à la surprise de tous : « Quand donc serons‑nous exposés à cette vache dont on parle ? » Et quand elle apprit que cela avait déjà eu lieu, elle ne le crut pas avant d’avoir reconnu sur son corps et sur ses vêtements les marques des coups. Alors, après avoir appelé son frère et ce catéchumène, elle les exhorta ainsi : « Demeurez fermes dans la foi, aimez vous tous les uns les autres, et ne soyez pas ébranlés par nos souffrances ».
      De même, Saturus, à une autre porte, s’adressait ainsi au soldat Pudens : « Finalement, comme je l’avais pensé et annoncé par avance, je n’ai vraiment rien souffert d’aucune bête jusqu’ici. Et maintenant, crois de tout ton cœur : voici que je vais au‑devant du léopard, et par une seule de ses morsures je parviens au but ». Et aussitôt, à la fin du spectacle, il fut livré à un léopard. À la première morsure, il fut tellement inondé de sang que le peuple, lorsqu’il revint, cria, comme si l’on était aux bains : « Baigne‑toi et bonne santé ! Baigne‑toi et bonne santé ! » Ce cri témoignait qu’il avait reçu le second baptême, celui du sang. Et, certes, après un tel bain, il avait trouvé le salut.
      Alors il dit au soldat Pudens : « Adieu, garde mon souvenir et garde la foi. Que tout cela, au lieu de t’ébranler, te fortifie ». En même temps il lui demanda l’anneau qu’il portait au doigt et, après l’avoir plongé dans sa blessure, il le lui remit en héritage, lui laissant cette relique, ce mémorial de son sang. Puis, comme il est inanimé, on le jette avec les autres dans le local où l’on devait les égorger.
      Mais, comme le peuple les réclamait au milieu de l’arène pour être témoin oculaire de leur mise à mort en voyant l’épée s’enfoncer dans leurs corps, ils se levèrent d’eux‑mêmes et se portèrent à l’endroit voulu par le peuple. Mais d’abord ils s’embrassèrent pour achever la célébration de leur martyre par le rite du baiser de paix.
      Tous reçurent le coup d’épée, immobiles et silencieux ; en particulier Saturus qui rendit l’esprit le premier, lui qui était monté le premier à l’échelle de la vision de Perpétue, pour attendre celle-ci. Perpétue, quant à elle, devait faire l’expérience de la douleur : frappée entre les côtes, elle poussa un grand cri ; puis, comme la main du gladiateur débutant hésitait, elle la poussa elle‑même sur sa gorge. Sans doute une telle femme ne pouvait‑elle être mise à mort autrement, elle qui faisait peur à l’esprit mauvais : il fallait qu’elle‑même le veuille.
      Martyrs héroïques et bienheureux ! Vraiment appelés et choisis pour entrer dans la gloire de notre Seigneur Jésus Christ !
    responsory: |-
      R/ C’est du ciel que vient la force !

      Ma grâce te suffit, dit le Seigneur,
      car ma puissance se déploie dans la faiblesse.

      Je me vante surtout de mes faiblesses,
      afin que repose sur moi la puissance du Christ.

      La folie de Dieu est plus sage que les hommes
      et la faiblesse de Dieu, plus forte que les hommes.

morning:
  evangelicAntiphon:
    common:
    - |-
      Heureux ceux qui sont persécutés pour la justice : le Royaume des cieux est à eux.

vespers:
  evangelicAntiphon:
    common:
    - |-
      Joie pour les saints qui ont suivit le Christ : ils ont versé leur sang pour lui, avec lui ils règnent à jamais.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Joie dans le ciel pour les âmes des saints
      >qui ont suivi les traces du Christ ;
      ils ont répandu leur sang par amour pour lui :
      >avec lui, ils exultent sans fin.
  collect:
  - |-
    Seigneur Dieu, +
    >les bienheureuses martyres Perpétue et Félicité,
    >saisies d’amour pour toi,
    >ont surmonté les tourments de la mort
    >au mépris de la persécution ; *
    donne-nous, à leur prière, /
    >de grandir sans cesse dans ton amour.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 8, 31b-39
      headline: « Ni la mort ni la vie ne pourra nous séparer de l’amour de Dieu »
      content: |-
        Frères,
        si Dieu est pour nous,
        qui sera contre nous ?
        Il n’a pas épargné son propre Fils,
        mais il l’a livré pour nous tous :
        comment pourrait-il, avec lui,
        ne pas nous donner tout ?
        Qui accusera ceux que Dieu a choisis ?
        Dieu est celui qui rend juste :
        alors, qui pourra condamner ?
        Le Christ Jésus est mort ;
        bien plus, il est ressuscité,
        il est à la droite de Dieu,
        il intercède pour nous :
        alors, qui pourra nous séparer de l’amour du Christ ?
        la détresse ? l’angoisse ? la persécution ?
        la faim ? le dénuement ? le danger ? le glaive ?
        En effet, il est écrit :
        C’est pour toi qu’on nous massacre sans arrêt,
        qu’on nous traite en brebis d’abattoir.
        Mais, en tout cela nous sommes les grands vainqueurs
        grâce à celui qui nous a aimés.
        J’en ai la certitude :
        ni la mort ni la vie,
        ni les anges ni les Principautés célestes,
        ni le présent ni l’avenir,
        ni les Puissances, ni les hauteurs, ni les abîmes,
        ni aucune autre créature,
        rien ne pourra nous séparer de l’amour de Dieu
        qui est dans le Christ Jésus notre Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 123 (124), 2-3, 4-5, 6a.7cd-8
      refAbbr: null
      content: |-
        Sans le Seigneur qui était pour nous
        quand des hommes nous assaillirent,
        alors ils nous avalaient tout vivants,
        dans le feu de leur colère.

        Alors le flot passait sur nous,
        le torrent nous submergeait ;
        alors nous étions submergés
        par les flots en furie.

        Béni soit le Seigneur
        qui n’a pas fait de nous
        la proie de leurs dents !
        Comme l’oiseau, nous avons échappé
        au filet de l’oiseleur.

        Le filet s’est rompu :
        nous avons échappé.
        Notre secours est dans le nom du Seigneur
        qui a fait le ciel et la terre.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 34-39
      headline: « Je ne suis pas venu apporter la paix, mais le glaive »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Ne pensez pas que je sois venu
        apporter la paix sur la terre :
        je ne suis pas venu apporter la paix, mais le glaive.
        Oui, je suis venu séparer
        l’homme de son père,
        la fille de sa mère,
        la belle-fille de sa belle-mère :
        on aura pour ennemis les gens de sa propre maison.
        Celui qui aime son père ou sa mère plus que moi
        n’est pas digne de moi ;
        celui qui aime son fils ou sa fille plus que moi
        n’est pas digne de moi ;
        celui qui ne prend pas sa croix et ne me suit pas
        n’est pas digne de moi.
        Qui a trouvé sa vie
        la perdra ;
        qui a perdu sa vie à cause de moi
        la trouvera. »
  offeringPrayer:
  - |-
    En rappelant la victoire qui ouvrit le ciel
    >aux bienheureuses Perpétue et Félicité,
    >nous t’offrons avec joie, Seigneur,
    >le sacrifice de ce jour ; *
    par lui, nous proclamons tes merveilles, /
    >heureux de pouvoir compter
    >sur leur intercession dans la gloire.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: 2Co 4,11
    content: |-
      Nous sommes livrés à la mort à cause de Jésus,
      afin que la vie de Jésus, elle aussi, soit manifestée
      >dans notre condition charnelle vouée à la mort.
  prayerAfterCommunion:
  - |-
    Alors que nous faisons mémoire
    >des bienheureuses Perpétue et Félicité,
    >nous te supplions humblement, Seigneur : /
    En prenant part à ce sacrement,
    >nous avons goûté aux joies éternelles ; *
    ce que nous accomplissons par ta grâce en serviteurs fidèles,
    >puissions-nous l’accueillir
    >dans un esprit accordé à tes propres dons.
    Par le Christ, notre Seigneur.