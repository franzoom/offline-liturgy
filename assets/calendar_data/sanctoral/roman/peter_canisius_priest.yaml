celebration:
  title: Saint Pierre Canisius
  subtitle: prêtre
  description: Pierre Canisius (1521-1597) naquit à Nimègue (Hollande), mais c’est en Allemagne qu’il se fit Jésuite et qu’il passa la majeure partie de sa vie. Professeur, prédicateur, catéchiste, écrivain, missionnaire, il lutta sur tous les terrains pour empêcher l’Allemagne de passer au Luthéranisme. Il vécut à Fribourg (Suisse) ses dernières années.
  commons:
    - pastors
    - pastors_doctors
  color: red

oration:
  - Seigneur, pour la défense de la foi catholique, tu armas de courage et de savoir saint Pierre Canisius ; par son intercession, accorde à ceux qui cherchent la vérité de te trouver dans la joie ; accorde au peuple des croyants de savoir toujours témoigner de toi.

readings:
  patristicReading:
    - title: ÉLOGE DE SAINT PIERRE CHANEL
      content: |-
        %Avant de partir pour l’Allemagne, dont il a mérité d’être appelé le second apôtre, saint Pierre Canisius, après avoir reçu la bénédiction apostolique, fit les plus hautes expériences spirituelles, qu’il a décrites dans ce texte : %
        Ton infinie bonté a voulu, Pontife éternel, que je confie avec empressement l’effet et la confirmation de cette bénédiction apostolique à tes Apôtres que l’on va visiter au Vatican et qui, sous ta conduite, accomplissent des merveilles. Là, j’ai ressenti une grande consolation, et la présence de ta grâce, qui m’était obtenue par de tels intercesseurs. Eux-mêmes, en effet, bénissaient et confirmaient la mission envoyée en Allemagne ; ils paraissaient promettre de m’accorder leur bienveillance comme à l’apôtre de l’Allemagne. Seigneur, tu sais à quel degré et combien de fois, en ce même jour, tu m’as confié l’Allemagne, dont j’ai continué ensuite à me préoccuper, pour laquelle je désire vivre et mourir.
        C’est toi, enfin, qui m’as ordonné de boire à la source de ton cœur ouvert, dans ton Corps sacré qu’il me semblait voir de mes yeux ; oui, tu m’invitais à puiser les eaux de mon salut à tes sources, ô mon Sauveur. Pour moi, je désirais intensément en voir jaillir vers moi des flots de foi, d’espérance, de charité. J’avais soif de pauvreté, de chasteté, d’obéissance ; je demandais à être tout entier lavé, vêtu, embelli par toi. Aussi, après que j’eus osé toucher ton Cœur très doux et y plonger ma soif, tu me promettais un vêtement tissé en trois parties qui pourraient recouvrir la nudité de mon âme, et qui se rattachaient tout à fait à mon engagement : c’était la paix, l’amour et la persévérance. Muni de ce vêtement pour mon salut, j’avais confiance que rien ne me manquerait, mais que tout me réussirait pour ta gloire.

      responsory: |-
        [rubric]Stance[/rubric]
        Apprenons du Maître
        à devenir disciples.
        Il n’est pas venu juger ses frères
        mais les sauver.
        Du trésor de son cœur
        a débordé la Parole de vie.
        
        R/ Le Seigneur est venu jusqu’à nous
        pour nous élever jusqu’à lui.
        
        Parfaite est la loi de l’amour,
        qui a fait du Fils de Dieu notre serviteur.
        
        Limpide est le regard de l’amour,
        qui, dans le frère, sert le Fils de Dieu.
        
        Véridique est le fruit de l’amour,
        qui nous rend fils de Dieu.

morning:
  evangelicAntiphon:
    common:
    - Qui enseigne aux hommes la justice resplendira aux siècles des siècles comme les étoiles dans le ciel.

vespers:
  evangelicAntiphon:
    common:
    - Ô bienheureux Pierre, maître de sagesse et lumière de l’Église, toi qui as cherché les volontés de Dieu, intercède pour nous auprès de lui.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >pour sauvegarder la foi catholique,
    >tu as soutenu le courage et la science
    >du prêtre saint Pierre Canisius ; *
    par son intercession, accorde à ceux qui cherchent la vérité
    >d’avoir le bonheur de te trouver, toi, le seul Dieu, /
    et donne au peuple des croyants
    >de persévérer dans le témoignage qu’ils te rendent.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: 2 Tm 4, 1-5
      headline: « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        je t’en conjure,
        au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        interviens à temps et à contretemps,
        dénonce le mal,
        fais des reproches, encourage,
        toujours avec patience et souci d’instruire.
        Un temps viendra
        où les gens ne supporteront plus l’enseignement de la saine doctrine ;
        mais, au gré de leurs caprices,
        ils iront se chercher une foule de maîtres
        pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        supporte la souffrance,
        fais ton travail d’évangélisateur,
        accomplis jusqu’au bout ton ministère.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 5, 13-19
      headline: « Vous êtes la lumière du monde »
      acclamationAntiphon: |-
        Que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Vous êtes le sel de la terre.
        Mais si le sel devient fade,
        comment lui rendre de la saveur ?
        Il ne vaut plus rien :
        on le jette dehors et il est piétiné par les gens.
        Vous êtes la lumière du monde.
        Une ville située sur une montagne
        ne peut être cachée.
        Et l’on n’allume pas une lampe
        pour la mettre sous le boisseau ;
        on la met sur le lampadaire,
        et elle brille pour tous ceux qui sont dans la maison.
        De même, que votre lumière brille devant les hommes :
        alors, voyant ce que vous faites de bien,
        ils rendront gloire à votre Père qui est aux cieux.
        Ne pensez pas que je sois venu abolir la Loi ou les Prophètes :
        je ne suis pas venu abolir, mais accomplir.
        Amen, je vous le dis :
        Avant que le ciel et la terre disparaissent,
        pas un seul iota, pas un seul trait ne disparaîtra de la Loi
        jusqu’à ce que tout se réalise.
        Donc, celui qui rejettera
        un seul de ces plus petits commandements,
        et qui enseignera aux hommes à faire ainsi,
        sera déclaré le plus petit dans le royaume des Cieux.
        Mais celui qui les observera et les enseignera,
        celui-là sera déclaré grand dans le royaume des Cieux. »
