celebration:
  title: Saint Pier Giorgio Frassati
  description: |-
    %(traduction non officielle)%
    Né à Turin le 6 avril 1901 dans une famille de la bourgeoisie piémontaise, il y mourut le 4 juillet 1925, à la veille de l’obtention son diplôme d’ingénieur des mines. Jeune homme épris de beauté, de montagne et de sport, ouvert aux relations humaines, il accueillit avec joie l’action de Dieu qui le conduisit à s’imprégner de foi, de charité et de prière. Activement présent comme laïc dans la communauté et dans les associations ecclésiales, mais aussi dans l’engagement social et politique, il se distingua par son dévouement attentionné envers les pauvres et les malades. Saint Jean-Paul II l’appela « l’homme des huit béatitudes » et le proclama bienheureux le 20 mai 1990. Léon XIV le canonisa le 7 septembre 2025.
  commons:
  - saints_male_educator
  color: white

oration:
  - |-
    %(traduction non officielle)%
    Père,
    toi qui as donné à saint Pier Giorgio Frassati
    >la joie de rencontrer le Christ
    >dans la foi et la charité,
    fais que, par son intercession,
    >nous puissions répandre dans notre monde
    >l’esprit des béatitudes évangéliques.

readings:
  patristicReading:
    - title: EXTRAIT DES « NOTES POUR UN DISCOURS SUR LA CHARITÉ » DE SAINT PIER GIORGIO FRASSATI
      subtitle: La charité est le fondement de notre religion
      content: |-
        %(traduction non officielle)%

        La charité est le fondement de notre religion ; sans elle, toute notre religion s’écroulerait, car nous ne serons vraiment catholiques que lorsque nous accomplirons, c’est-à-dire lorsque nous conformerons toute notre vie, aux deux commandements où réside l’essence de la foi catholique : aimer Dieu de toutes nos forces et aimer le prochain comme nous-mêmes. Voilà la démonstration explicite que la foi catholique repose sur le véritable Amour, et non pas, comme beaucoup voudraient le faire pour tranquilliser leur conscience, sur la violence donnée pour base à la religion du Christ. Par la violence, on sème la haine et l’on récolte ensuite les fruits funestes de cette semence ; par la charité, on sème parmi les hommes la paix, non pas la paix du monde, mais la vraie paix que seule la foi de Jésus Christ peut nous donner, en nous rendant frères les uns des autres. Je sais que cette voie est raide, difficile et pleine d’épines, tandis que l’autre paraîtrait, à première vue, plus belle, plus facile et plus satisfaisante. Mais si nous pouvions sonder l’intérieur de ceux qui suivent malheureusement les voies perverses du monde, nous verrions qu’il n’y a jamais en eux la sérénité qui vient de celui qui a affronté mille difficultés et renoncé à un plaisir matériel pour suivre la loi de Dieu.
        En nous approchant des pauvres, nous devenons peu à peu leurs confidents et leurs conseillers dans les moments les plus terribles de ce pèlerinage terrestre. Nous leur glissons ces paroles de réconfort que la foi nous inspire, et bien des fois, non par notre mérite, nous parvenons à ramener sur le droit chemin des gens qui s’en étaient éloignés sans méchanceté. Être témoins chaque jour de la foi avec laquelle les familles supportent souvent les douleurs les plus atroces, du sacrifice perpétuel qu’elles font, et du fait qu’elles font tout cela par amour de Dieu, nous amène souvent à nous poser cette question : moi qui ai reçu de Dieu tant de choses, je suis toujours resté si indolent, si mauvais, alors qu’eux, qui n’ont pas été aussi privilégiés que moi, sont infiniment meilleurs que moi. Alors nous prenons dans notre conscience la résolution de suivre désormais toujours davantage la voie de la croix, la seule voie qui nous conduise au Salut éternel. Chacun de vos sacrifices sera récompensé au Ciel, car Jésus Christ a promis que tout ce que nous ferons pour les pauvres par amour pour lui, il le considérera comme fait à lui-même. Ne refusez pas à Jésus cet amour, à lui qui, par amour infini pour l’humanité, a voulu être dans le sacrement de l’Eucharistie, comme notre consolateur et comme le Pain de l’âme.
      responsory: |-
        R. Soyez les imitateurs de Dieu,
        comme des enfants bien-aimés,
        et marchez dans la charité,
        
        * comme le Christ nous a aimés
        et s’est livré lui-même pour nous.
        
        V. N’aimons pas en paroles ni avec la langue,
        mais par des actes et dans la vérité. *

