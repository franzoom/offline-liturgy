celebration:
  title: Saint Polycarpe
  subtitle: évêque et martyr
  description: Disciple de saint Jean, l’évêque Polycarpe est le dernier témoin de l’age apostolique. Il mourut sur le bûcher, au milieu du théâtre de Smyrne, en présence de tout le peuple, rendant grâce au Seigneur « d’avoir été jugé digne d’être compté au nombre des martyrs et de participer au calice du Christ ». C’était le 23 février 155 ; il avait quatre‑vingt‑six ans.
  commons:
  - martyr
  - pastors_bishop
  color: red

oration:
- Dieu de toute la création, tu as voulu que l’évêque saint Polycarpe, soit au nombre de tes martyrs ; accorde-nous, à sa prière, de prendre part comme lui à la coupe du Christ, pour ressusciter à la vie éternelle.

readings:
  patristicReading:
  - title: LETTRE DE L’ÉGLISE DE SMYRNE SUR LE MARTYRE DE SAINT POLYCARPE
    content: |-
      Lorsque le bûcher fut prêt, Polycarpe enleva lui-même tous ses vêtements et détacha sa ceinture ; puis il voulut se déchausser lui-même. Il ne le faisait pas auparavant, parce que chacun des fidèles s’empressait toujours pour être le premier à toucher son corps : même avant son martyre, il était toujours entouré de vénération à cause de la sainteté de sa vie.
      Aussitôt donc on plaça autour de lui les matériaux préparés pour le bûcher. Comme on allait l’y clouer, il dit : « Laissez-moi ainsi. Celui qui me donne la force de supporter le feu me donnera aussi, même sans la garantie de vos clous, de rester immobile sur le bûcher. » On ne le cloua donc pas, mais on l’attacha.
      Ainsi ligoté, avec les mains ramenées derrière le dos, il était comme un bélier de choix pris dans un grand troupeau pour être offert en sacrifice, holocauste préparé pour être agréable à Dieu. Levant les yeux au ciel, il dit :
      « Seigneur, Dieu tout-puissant, Père de ton enfant bien-aimé et béni, Jésus Christ, par qui nous avons reçu la connaissance de ton nom. Dieu des anges, des puissances, de toute la création et de toute la race des justes qui vivent en ta présence : je te bénis parce que tu m’as jugé digne de ce jour et de cette heure, pour que je prenne part, dans la troupe des martyrs, à la coupe de ton Christ, en vue de la résurrection du corps et de l’âme à la vie éternelle, dans l’immortalité donnée par l’Esprit Saint. Je souhaite d’être admis aujourd’hui en ta présence avec eux, comme un sacrifice riche et agréable, ainsi que tu l’avais préparé et manifesté d’avance, ainsi que tu l’as réalisé, Dieu sincère et véritable.
      « Aussi je te loue pour toute chose, je te bénis, je te glorifie par le grand prêtre éternel et céleste, Jésus Christ, ton enfant bien-aimé. Par lui, gloire à toi, à lui et à l’Esprit Saint, maintenant et dans les siècles futurs. Amen. »
      Quand il eut fait monter cet%amen%et achevé sa prière, les hommes du feu allumèrent le brasier.
      Une grande flamme brilla, et nous avons vu une merveille, nous à qui il fut accordé de le voir et qui avions été gardés pour annoncer aux autres ces événements. Le feu présenta la forme d’une voûte, comme la voile d’un navire gonflée par le vent qui entourait comme d’un rempart le corps du martyr. Celui-ci était au milieu, non comme une chair qui brûle, mais comme un pain qui cuit, ou comme de l’or et de l’argent étincelant dans la fournaise. Et nous sentions un parfum pareil à celui d’une exhalaison d’encens ou d’un autre aromate précieux.
    responsory: |-
      R/ Sois fidèle jusqu’à la mort,
      le Seigneur combat pour toi !

      Ne craignez pas ceux qui tuent le corps
      et ne peuvent rien faire de plus.

      Le vainqueur, celui qui croit en moi,
      ne connaîtra pas la seconde mort.

      Espère en Dieu, prends cœur et prends courage,
      espère en Dieu !

morning:
  evangelicAntiphon:
    common:
    - Depuis si longtemps que je sers le Christ, il ne m’a fait aucun mal. Comment pourrais-je blasphémer mon Sauveur et mon Roi ?

vespers:
  evangelicAntiphon:
    common:
    - Je te bénis, Seigneur, toi qui me donnes part à la coupe du Christ.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu de toute la création, +
    >tu as accordé au bienheureux évêque Polycarpe
    >d’être au nombre de tes martyrs ; *
    puisque nous prenons part avec lui à la coupe du Christ, /
    donne-nous, à son intercession,
    >de ressusciter dans l’Esprit Saint à la vie éternelle.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ap 2, 8-11
      headline: « Je sais ta détresse et ta pauvreté »
      content: |-
        À l’ange de l’Église qui est à Smyrne, écris :
        Ainsi parle celui qui est le Premier et le Dernier,
        >celui qui était mort et qui est entré dans la vie :
        Je sais ta détresse et ta pauvreté ;
        >pourtant tu es riche !
        Je connais les propos blasphématoires
        >de ceux qui se disent juifs et ne le sont pas :
        >ils sont une synagogue de Satan.
        Sois sans aucune crainte pour ce que tu vas souffrir.
        Voici que le diable va jeter en prison certains des vôtres
        >pour vous mettre à l’épreuve,
        >et vous serez dans la détresse pendant dix jours.
        Sois fidèle jusqu’à la mort,
        >et je te donnerai la couronne de la vie.
        Celui qui a des oreilles,
        >qu’il entende ce que l’Esprit dit aux Églises.
        Le vainqueur ne pourra être atteint par la seconde mort.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 30 (31), 3bc-4, 6.8, 17-18
      refAbbr: 30, 6a
      chorus:
      - chorusRef: 30, 6a
        chorus: |-
          En tes mains, Seigneur,
          je remets mon esprit.
      content: |-
        Sois le rocher qui m’abrite,
        la maison fortifiée qui me sauve.
        Ma forteresse et mon roc, c’est toi :
        pour l’honneur de ton nom, tu me guides et me conduis.

        En tes mains je remets mon esprit ;
        tu me rachètes, Seigneur, Dieu de vérité.
        Ton amour me fait danser de joie :
        tu vois ma misère et tu sais ma détresse.

        Sur ton serviteur, que s’illumine ta face ;
        sauve-moi par ton amour.
        Seigneur, garde-moi d’être humilié,
        moi qui t’appelle.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 18-21
      headline: « Si l’on m’a persécuté, on vous persécutera, vous aussi »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi, dont témoignent les martyrs,
        nous t’acclamons : tu es Seigneur !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Si le monde a de la haine contre vous,
        sachez qu’il en a eu d’abord contre moi.
        Si vous apparteniez au monde,
        le monde aimerait ce qui est à lui.
        Mais vous n’appartenez pas au monde,
        puisque je vous ai choisis en vous prenant dans le monde ;
        voilà pourquoi le monde a de la haine contre vous.
        Rappelez-vous la parole que je vous ai dite :
        un serviteur n’est pas plus grand que son maître.
        Si l’on m’a persécuté,
        on vous persécutera, vous aussi.
        Si l’on a gardé ma parole,
        on gardera aussi la vôtre.
        Les gens vous traiteront ainsi à cause de mon nom,
        parce qu’ils ne connaissent pas Celui qui m’a envoyé. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null