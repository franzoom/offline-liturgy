celebration:
  title: La Vierge Marie, reine
  description: |-
    Transfigurée jusqu’en son corps, Marie nous apparaît dans la gloire de son assomption comme la réussite suprême de la Rédemption. Mais la toute belle est aussi la toute puissante, puisqu’elle est la Mère de Celui dont « le règne n’aura pas de fin ». C’est pourquoi, depuis des siècles, le peuple chrétien salue en elle sa Reine, souveraine médiatrice de grâce.
  color: white
  commons:
  - virgin-mary

oration:
- |-
  Dieu qui as voulu que la Mère de ton Fils soit notre Mère et notre Reine, fais que, soutenus par son intercession, nous obtenions dans le ciel la gloire promise à tes enfants.

readings:
  hymn:
  - femme-voulue-par-dieu
  patristicReading:
  - title: HOMÉLIE DE SAINT AMÉDÉE DE LAUSANNE POUR L’ASSOMPTION
    content: |-
      Considère combien il était normal que, dès avant son assomption, le nom de Marie ait brillé, admirable, sur toute la terre, et sa renommée très illustre se soit répandue en tous lieux, avant que sa magnificence ne se soit élevée au-dessus des cieux. Il convenait en effet que la Vierge Mère, pour l’honneur même de son Fils, régnât d’abord sur la terre, et pût enfin recevoir ainsi les cieux avec la gloire ; qu’elle fût comblée ici-bas pour pénétrer là-haut dans une sainte plénitude ; et comme elle avait été transportée de vertu en vertu, qu’elle le fût aussi %de clarté en clarté% par l’Esprit du Seigneur.
      Présente dans la chair, elle goûtait donc par avance les prémices du royaume à venir, tantôt s’élevant vers Dieu dans un élan impossible à dire, tantôt rejoignant le prochain en une indicible charité. D’une part, elle était entourée par les hommages des anges ; d’autre part, elle était vénérée par le service des hommes. ~ Gabriel l’assistait parmi les anges ; et Jean, heureux de s’être vu confier auprès de la croix, à lui vierge, la Vierge Mère, la servait ainsi que les autres Apôtres. Eux tous se réjouissaient de voir, les uns leur reine, les autres leur suzeraine, et ils s’empressaient dans un affectueux dévouement.
      Pour elle, établie dans la forteresse la plus élevée des vertus et débordant de l’océan des dons divins, elle épanchait sur le peuple croyant et altéré, dans un ruissellement surabondant, l’abîme des grâces par lequel elle surpassait toutes les créatures. Elle procurait en effet la santé aux corps, et aux âmes la guérison, dans le pouvoir qu’elle avait de réveiller de la mort du corps et de l’âme. Qui jamais est parti de chez elle malade ou triste, ou sans avoir été instruit des mystères célestes ? Qui donc est retourné chez lui sans être pleinement heureux d’avoir obtenu ce qu’il voulait de Marie, la mère du Seigneur ? ~
      Débordante de ces biens si grands, l’épouse, mère de l’unique Époux, douce et très aimée en ses délices, est comme %la source des jardins% spirituels et %le puits des eaux% vives et vivifiantes %qui jaillissent en torrent du Liban% divin. Aussi fait-elle couler, depuis le mont Sion jusqu’à toutes les nations qui l’entourent ou sont répandues au loin, des fleuves de paix et des ruisseaux de grâces débordant du ciel. ~
      Lors donc que la Vierge des vierges était conduite par son Dieu et Fils, le Roi des rois, dans l’allégresse des anges, la joie des archanges, parmi les acclamations du ciel, alors s’accomplit la prophétie de David disant au Seigneur : %La reine se tient à ta droite, dans un vêtement d’or et des ornements variés%.

    responsory: |-
      R/ Mon âme exalte le Seigneur :
      éternel est son amour !

      Chante et réjouis-toi, fille de Sion,
      voici que ton Dieu vient demeurer au milieu de toi.

      Dieu pour toi exulte de joie,
      il te renouvelle par son amour.

      Le Seigneur, comme au jour de fête,
      dansera pour toi avec des cris de joie.

invitatory:
  antiphon:
  - Le Christ, Roi des rois, a couronné sa mère. Venez, adorons-le.

morning:
  evangelicAntiphon:
    common:
    - |-
      Bénie sois-tu, Vierge Marie, Reine du monde, Mère du Christ, Mère du Sauveur.
vespers:
  evangelicAntiphon:
    common:
    - |-
      Heureuse es-tu, Vierge Marie, toi qui as cru ! En toi s’est accomplie la parole de Dieu : tu règnes avec le Christ pour l’éternité.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ps 44,10
    content: |-
      À ta droite, Seigneur, se tient la Reine, vêtue d’étoffes d’or.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as voulu que la Mère de ton Fils
    >soit notre Mère et notre Reine ; *
    fais que, soutenus par son intercession,
    >nous obtenions dans le royaume des Cieux /
    >la gloire promise à tes enfants.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Is 9, 1-6
      headline: |-
        « Un enfant nous est né »
      content: |-
        Le peuple qui marchait dans les ténèbres
        >a vu se lever une grande lumière ;
        et sur les habitants du pays de l’ombre,
        >une lumière a resplendi.
        Tu as prodigué la joie,
        tu as fait grandir l’allégresse :
        ils se réjouissent devant toi,
        comme on se réjouit de la moisson,
        comme on exulte au partage du butin.
        Car le joug qui pesait sur lui,
        la barre qui meurtrissait son épaule,
        >le bâton du tyran,
        tu les as brisés comme au jour de Madiane.
        Et les bottes qui frappaient le sol,
        et les manteaux couverts de sang,
        >les voilà tous brûlés :
        le feu les a dévorés.
        Oui, un enfant nous est né,
        un fils nous a été donné !
        Sur son épaule est le signe du pouvoir ;
        son nom est proclamé :
        >« Conseiller-merveilleux, Dieu-Fort,
        >Père-à-jamais, Prince-de-la-Paix. »
        Et le pouvoir s’étendra,
        et la paix sera sans fin
        pour le trône de David et pour son règne
        qu’il établira, qu’il affermira
        >sur le droit et la justice
        dès maintenant et pour toujours.
        Il fera cela, l’amour jaloux du Seigneur de l’univers !
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 112 (113), 1-2, 3-4, 5-6, 7-8
      refAbbr: 112, 2
      chorus:
      - chorusRef: 112, 2
        chorus: |-
          Béni soit le nom du Seigneur,
          maintenant et pour les siècles des siècles !
      - chorusRef: null
        chorus: |-
          ou : Alléluia !
      content: |-
        Louez, serviteurs du Seigneur,
        louez le nom du Seigneur !
        Béni soit le nom du Seigneur,
        maintenant et pour les siècles des siècles !

        Du levant au couchant du soleil,
        loué soit le nom du Seigneur !
        Le Seigneur domine tous les peuples,
        sa gloire domine les cieux.

        Qui est semblable au Seigneur notre Dieu ?
        Lui, il siège là-haut.
        Mais il abaisse son regard
        vers le ciel et vers la terre.

        De la poussière il relève le faible,
        il retire le pauvre de la cendre
        pour qu’il siège parmi les princes,
        parmi les princes de son peuple.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 1, 26-38
      headline: |-
        « Voici que tu vas concevoir et enfanter un fils »
      acclamationAntiphon: |-
        Je te salue, Marie, Comblée-de-grâce :
        le Seigneur est avec toi,
        tu es bénie entre les femmes.
      content: |-
        En ce temps-là,
        l’ange Gabriel fut envoyé par Dieu
        >dans une ville de Galilée, appelée Nazareth,
        à une jeune fille vierge,
        >accordée en mariage à un homme de la maison de David,
        >appelé Joseph ;
        et le nom de la jeune fille était Marie.
        L’ange entra chez elle et dit :
        >« Je te salue, Comblée-de-grâce,
        >le Seigneur est avec toi. »
        À cette parole, elle fut toute bouleversée,
        >et elle se demandait ce que pouvait signifier cette salutation.
        L’ange lui dit alors :
        >« Sois sans crainte, Marie,
        >car tu as trouvé grâce auprès de Dieu.
        Voici que tu vas concevoir et enfanter un fils ;
        >tu lui donneras le nom de Jésus.
        Il sera grand,
        >il sera appelé Fils du Très-Haut ;
        >le Seigneur Dieu
        >lui donnera le trône de David son père ;
        >il régnera pour toujours sur la maison de Jacob,
        >et son règne n’aura pas de fin. »
        Marie dit à l’ange :
        >« Comment cela va-t-il se faire,
        >puisque je ne connais pas d’homme ? »
        L’ange lui répondit :
        >« L’Esprit Saint viendra sur toi,
        >et la puissance du Très-Haut
        >te prendra sous son ombre ;
        >c’est pourquoi celui qui va naître sera saint,
        >il sera appelé Fils de Dieu.
        Or voici que, dans sa vieillesse, Élisabeth, ta parente,
        >a conçu, elle aussi, un fils
        >et en est à son sixième mois,
        >alors qu’on l’appelait la femme stérile.
        Car rien n’est impossible à Dieu. »
        Marie dit alors :
        >« Voici la servante du Seigneur ;
        >que tout m’advienne selon ta parole. »
        Alors l’ange la quitta.
  offeringPrayer:
  - |-
    En célébrant la mémoire de la bienheureuse Vierge Marie,
    >nous te présentons nos offrandes, Seigneur ; *
    >et nous t’en supplions :
    >que l’humanité de ton Fils vienne à notre secours, / puisqu’il s’est livré sur la croix comme une offrande pure.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: cf. Lc 1,45
    content: |-
      Bienheureuse, toi qui as cru à l’accomplissement des paroles qui te furent dites de la part du Seigneur.
  prayerAfterCommunion:
  - |-
    Nourris par le sacrement du ciel,
    >nous te supplions, Seigneur : *
    >donne à ceux qui vénèrent en ce jour
    >la bienheureuse Vierge Marie, /
    d’être jugés dignes de participer
    >au banquet de l’éternité.
    Par le Christ, notre Seigneur.