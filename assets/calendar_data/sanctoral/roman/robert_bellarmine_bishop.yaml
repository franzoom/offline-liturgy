celebration:
  title: Saint Robert Bellarmin
  subtitle: évêque et docteur de l’Église
  description: Le jésuite Robert Bellarmin (1542-1621), Toscan d’origine, enseigna à Louvain, puis à Rome, où il écrivit ses Controverses et forma le jeune Louis de Gonzague. Nommé cardinal archevêque de Bénévent, le professeur se révéla parfaitement doué pour l’action pastorale. Mais il dut revenir à Rome comme conseiller du pape.
  commons:
  - pastors_bishop
  - pastors_doctors
  color: white

oration:
  - Seigneur, tu as donné à saint Robert Bellarmin une science et une force étonnantes pour défendre la foi de l'Église ; par son intercession, accorde à ton peuple le bonheur de garder cette foi dans toute sa pureté.

readings:
  patristicReading:
    - title: LA MONTÉE DE L’ÂME VERS DIEU PAR SAINT ROBERT BELLARMIN
      content: |-
        %Seigneur, tu es doux et indulgent, plein de miséricorde% : qui donc refuserait de te servir de tout son cœur, s’il a commencé à goûter, si peu que ce soit, la douceur de ton autorité paternelle ? Qu’est-ce que tu ordonnes, Seigneur, à tes serviteurs ? %Prenez sur vous mon joug%, dis-tu. Et comment est-il, ton joug ? %Mon joug est facile à porter, dis-tu, et mon fardeau, léger%. Qui donc ne porterait bien volontiers un joug qui n’accable pas, mais qui encourage ; un fardeau qui n’écrase pas, mais qui réconforte ? Tu as donc ajouté à juste titre : %Et vous trouverez le repos%. Et quel est ton joug qui ne fatigue pas mais donne le repos ? Eh bien, c’est le premier et le plus grand des commandements : %Tu aimeras le Seigneur ton Dieu de tout ton cœur%. Qu’y a-t-il de plus facile, de plus agréable, de plus doux que d’aimer la bonté, la beauté, l’amour que tu es parfaitement, Seigneur mon Dieu ?
        En outre, est-ce que tu ne promets pas une récompense à ceux qui observent tes commandements %plus désirables que l’or et plus doux que le miel du rayon% ? Oui, parfaitement, tu promets une récompense et une récompense infinie, comme dit ton Apôtre saint Jacques : %Le Seigneur a préparé la couronne de vie pour ceux qu’il aime%. Et qu’est-ce que la couronne de vie ? Un bien plus grand que ce que nous pouvons concevoir ou désirer. C’est ainsi que parle saint Paul, s’inspirant d’Isaïe : %L’œil n’a pas vu, l’oreille n’a pas entendu, le cœur de l’homme n’a pas imaginé ce que Dieu a préparé pour ceux qui l’aiment%.
        Vraiment, %il y a grand profit à garder tes commandements%. Non seulement le premier et le plus grand des commandements est profitable à celui qui y obéit, non pas à Dieu qui le prescrit : les autres commandements perfectionnent l’homme obéissant, le fortifient, l’éduquent, le mettent en valeur, enfin le rendent bon et bienheureux. Si tu es sage, comprends que tu as été créé pour la gloire de Dieu et ton salut éternel, que là est ta fin, le centre de ton âme, le trésor de ton cœur. Si tu parviens à cette fin, tu seras heureux ; si tu y manques, tu seras malheureux.
        Estime donc que ton vrai bien, c’est ce qui te fait parvenir jusqu’à ta fin ; le vrai mal, ce qui te la fait manquer. Succès et échec, richesse et indigence, santé et maladie, honneurs et ignominie, vie et mort : le sage ne doit ni rechercher les choses pour elles-mêmes, ni les fuir pour elles-mêmes. Si elles contribuent à la gloire de Dieu et à ton éternelle télicité, elles sont bonnes et il faut les rechercher ; si elles y font obstacle, elles sont mauvaises et il faut les fuir.

      responsory: |-
        R/ J’ouvre mon cœur, Seigneur,
        à ta parole de lumière.
        
        Cantique pour moi que tes volontés
        en ma demeure d’étranger.
        
        Heureux les humbles, heureux les pauvres :
        tu leur découvres le secret du Royaume !

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné à l’évêque saint Robert Bellarmin
    >une science et une force admirables
    >pour défendre la foi de ton Église ; *
    par son intercession, accorde à ton peuple /
    >le bonheur de garder cette foi dans toute sa pureté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Sg 7, 7-10.15-16
      headline: |-
        « Plus que la santé et la beauté, j’ai aimé la sagesse »
      content: |-
        J’ai prié,
        >et le discernement m’a été donné.
        J’ai supplié,
        >et l’esprit de la Sagesse est venu en moi.
        Je l’ai préférée aux trônes et aux sceptres ;
        >à côté d’elle, j’ai tenu pour rien la richesse ;
        je ne l’ai pas comparée à la pierre la plus précieuse ;
        >tout l’or du monde auprès d’elle n’est qu’un peu de sable,
        et, en face d’elle, l’argent sera regardé comme de la boue.
        Plus que la santé et la beauté, je l’ai aimée ;
        je l’ai choisie de préférence à la lumière,
        >parce que sa clarté ne s’éteint pas.
        Que Dieu m’accorde de parler comme je comprends,
        >et de concevoir une pensée à la mesure de ses dons,
        puisque lui-même guide la Sagesse
        >et dirige les sages ;
        car nous sommes dans sa main :
        >nous-mêmes, nos paroles,
        >toute notre intelligence et notre savoir-faire.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 18B (19), 8, 9, 10, 11
      refAbbr: 18B, 10cd
      chorus:
      - chorusRef: 18B, 10cd
        chorus: |-
          Les décisions du Seigneur sont justes
          et vraiment équitables.
      - chorusRef: cf. Jn 6, 63c
        chorus: |-
          ou : Tes paroles, Seigneur, sont esprit
          et elles sont vie.
      content: |-
        La loi du Seigneur est parfaite,
        qui redonne vie ;
        la charte du Seigneur est sûre,
        qui rend sages les simples.

        Les préceptes du Seigneur sont droits,
        ils réjouissent le cœur ;
        le commandement du Seigneur est limpide,
        il clarifie le regard.

        La crainte qu’il inspire est pure,
        elle est là pour toujours ;
        les décisions du Seigneur sont justes
        et vraiment équitables :

        plus désirables que l’or,
        qu’une masse d’or fin,
        plus savoureuses que le miel
        qui coule des rayons.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 7, 21-29
      headline: |-
        « Jésus les enseignait en homme qui a autorité »
      acclamationAntiphon: |-
        Tes paroles, Seigneur,
        sont esprit et elles sont vie.
        Tu as les paroles de la vie éternelle.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Ce n’est pas en me disant : "Seigneur, Seigneur !"
        >qu’on entrera dans le royaume des Cieux,
        mais c’est en faisant la volonté de mon Père qui est aux cieux.
        Ce jour-là, beaucoup me diront :
        >"Seigneur, Seigneur,
        >n’est-ce pas en ton nom que nous avons prophétisé,
        >en ton nom que nous avons expulsé les démons,
        >en ton nom que nous avons fait beaucoup de miracles ?"
        Alors je leur déclarerai :
        >"Je ne vous ai jamais connus.
        Écartez-vous de moi, vous qui commettez le mal !"
        Ainsi, celui qui entend les paroles que je dis là
        >et les met en pratique
        est comparable à un homme prévoyant
        >qui a construit sa maison sur le roc.
        La pluie est tombée, les torrents ont dévalé,
        >les vents ont soufflé et se sont abattus sur cette maison ;
        la maison ne s’est pas écroulée,
        >car elle était fondée sur le roc.
        Et celui qui entend de moi ces paroles
        >sans les mettre en pratique
        est comparable à un homme insensé
        >qui a construit sa maison sur le sable.
        La pluie est tombée, les torrents ont dévalé,
        >les vents ont soufflé, ils sont venus battre cette maison ;
        >la maison s’est écroulée, et son écroulement a été complet. »
        Lorsque Jésus eut terminé ce discours,
        >les foules restèrent frappées de son enseignement,
        car il les enseignait en homme qui a autorité,
        >et non pas comme leurs scribes.
