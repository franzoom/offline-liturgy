celebration:
  title: Le Sacré Cœur de Jésus
  description: Le 3^e vendredi après la Pentecôte
  color: white

oration:
  - Seigneur notre Père, en vénérant le Cœur de ton Fils bien-aimé, nous disons les merveilles de ton amour pour nous ; fais que nous recevions de cette source divine une grâce plus abondante.

firstVespers:
  hymn:
    - j-ai-vu-l-eau-vive
  psalmody:
    - psalm: PSALM_112
      antiphon:
        - Dieu nous a tous aimés d’un amour éternel ; c’est pourquoi le Christ élevé de terre nous attire jusqu’à lui.
    - psalm: PSALM_145
      antiphon:
        - Devenez mes disciples, dit Jésus, car je suis doux et humble de cœur, et vous trouverez le repos de vos âmes.
    - psalm: NT_9
      antiphon:
        - Je suis le bon berger, je connais mes brebis ; pour elles, je donne ma vie.
  reading:
    biblicalReference: Ep 5, 25b-27
    content: Le Christ a aimé l’Église, il s’est livré pour elle ; il voulait la rendre sainte en la purifiant par le bain du baptême et la Parole de vie ; il voulait se la présenter à lui-même, cette Église, resplendissante, sans tache, ni ride, ni aucun défaut, il la voulait sainte et irréprochable.
  responsory: |-
    R/ Les projets de son cœur subsistent d’âge en âge :
    * Heureux le peuple dont le Seigneur est le Dieu !
    V/ Que ton amour, Seigneur, soit sur nous,
    comme notre espoir est en toi. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common:
    - |-
      Je suis venu apporter sur la terre un feu : comme je voudrais qu’il fût déjà allumé !
  intercession:
    content: |-
      Jésus crucifié, de ton côté ouvert ont coulé l’eau et le sang. Entends la prière de l’Église, ton Épouse :

      R/ Kyrie eleison.

      Jésus, temple saint de Dieu,
      demeure du Très-Haut, porte du ciel,
      — construis ton Église.

      Jésus, ami des hommes, frère des pauvres,
      maître de tous les cœurs,
      — souviens-toi de ton Alliance.

      Jésus, notre paix et notre réconciliation,
      soulagement de ceux qui peinent, repos de nos âmes,
      — attire vers toi les pécheurs.

      Jésus, chemin des brebis, Agneau vainqueur du péché,
      notre vie et notre résurrection,
      — donne-nous accès auprès du Père.

      Jésus, obéissant jusqu’à la mort, transpercé par la lance,
      enveloppé dans le suaire,
      — réveille ceux qui dorment dans la mort.

invitatory:
  antiphon:
    - Regardons celui que nous avons transpercé, approchons-nous du cœur de Dieu.

readings:
  hymn:
    - le-fils-bien-aime
  psalmody:
    - psalm: PSALM_35
      antiphon:
        - En toi est la source de vie, aux torrents du Paradis tu nous abreuves.
    - psalm: PSALM_60
      antiphon:
        - Père, je leur ai fait connaître ton nom, afin que l’amour dont tu m’as aimé soit en eux.
    - psalm: PSALM_97
      antiphon:
        - Tous les confins de la terre ont vu le salut de notre Dieu.
  verse: |-
    V/ Je me rappelle les hauts-faits du Seigneur,
    je me rappellle ses merveilles.
  biblicalReading:
    - title: LECTURE DE LA LETTRE AUX ROMAINS
      subtitle: L’amour de Dieu manifesté en Jésus Christ
      ref: Rm 8, 28-39
      content: |-
        Nous le savons, quand les hommes aiment Dieu, lui-même fait tout contribuer à leur bien, puisqu’ils sont appelés selon le dessein de son amour. Ceux que, d’avance, il connaissait, il les a aussi destinés d’avance à être configurés à l’image de son Fils, pour que ce Fils soit le premier-né d’une multitude de frères. Ceux qu’il avait destinés d’avance, il les a aussi appelés ; ceux qu’il a appelés, il en a fait des justes ; et ceux qu’il a rendus justes, il leur a donné sa gloire.
        Que dire de plus ? Si Dieu est pour nous, qui sera contre nous ? Il n’a pas épargné son propre Fils, mais il l’a livré pour nous tous : comment pourrait-il, avec lui, ne pas nous donner tout ? Qui accusera ceux que Dieu a choisis ? Dieu est celui qui rend juste : alors, qui pourra condamner ? Le Christ Jésus est mort ; bien plus, il est ressuscité, il est à la droite de Dieu, il intercède pour nous : alors, qui pourra nous séparer de l’amour du Christ ? la détresse ? l’angoisse ? la persécution ? la faim ? le dénuement ? le danger ? le glaive ? En effet, il est écrit : %C’est pour toi qu’on nous massacre sans arrêt, qu’on nous traite en brebis d’abattoir.%
        Mais, en tout cela nous sommes les grands vainqueurs grâce à celui qui nous a aimés. J’en ai la certitude : ni la mort ni la vie, ni les anges ni les Principautés célestes, ni le présent ni l’avenir, ni les Puissances, ni les hauteurs, ni les abîmes, ni aucune autre créature, rien ne pourra nous séparer de l’amour de Dieu qui est dans le Christ Jésus notre Seigneur.
      responsory: |-
        J’ai vu l’eau vive
        jaillissant du cœur du Christ, alléluia !
        Tous ceux que lave cette eau
        seront sauvés et chanteront : alléluia !

        R/ Alléluia ! Alléluia ! Alléluia !

        J’ai vu le Temple
        désormais s’ouvrir à tous, alléluia !
        Le Christ revient victorieux,
        montrant la plaie de son côté, alléluia !
  patristicReading:
    - title: L’ARBRE DE VIE, PAR SAINT BONAVENTURE
      subtitle: « En toi est la source de vie »
      content: |-
        Considère attentivement, toi qui as été racheté, quel est celui qui, pour toi, est suspendu à la Croix, quelle est sa grandeur, quelle est sa sainteté, lui dont la mort rend la vie à ceux qui sont morts, lui dont le trépas met en deuil le ciel et la terre, et fait se briser les pierres les plus dures.
        Pour que, du côté du Christ endormi sur la Croix, surgisse l’Église, et pour que soit accomplie la parole de l’Écriture : %Ils contempleront celui qu’ils ont transpercé%, la sagesse divine a bien voulu que la lance d’un soldat ouvre et transperce ce côté. Il en sortit du sang et de l’eau, et c’était le prix de notre salut qui s’écoulait ainsi. Jailli de sa source, c’est-à-dire du plus profond du cœur du Christ, il donne aux sacrements de l’Église le pouvoir de conférer la vie de la grâce et, à ceux qui ont déjà en eux la vie du Christ, il donne à boire de cette %eau vive qui jaillit jusque dans la vie éternelle%.
        Debout ! toi qui es aimé du Christ, sois donc comme la colombe %qui fait son nid sur le bord de l’abîme%. Et là, comme %l’oiseau qui a trouvé un nid%, ne te relâche pas de ta vigilance ; là, comme la tourterelle, viens cacher les enfants de ton amour chaste, et de cette plaie approche tes lèvres %pour puiser de l’eau à la source du Sauveur%. C’est là qu’on trouve %la source qui jaillissait au milieu du Paradis% et qui, %se partageant en quatre bras% puis répandue dans les cœurs aimants, arrose et féconde la terre tout entière.
        À cette source de vie et de lumière, accours donc, animé d’un brûlant désir, qui que tu sois, toi qui es donné à Dieu, et de toute ta force, du plus profond de ton cœur, crie vers lui : Ô beauté ineffable du Dieu très-haut, éclat très pur de l’éternelle lumière, vie qui communique la vie à tous les vivants, lumière qui donne son éclat à toute lumière, toi qui conserves dans leur immuable splendeur et leur diversité les astres qui brillent, depuis la première aurore, devant le trône de ta divinité !
        Ô jaillissement éternel et inaccessible, plein de lumière et de douceur, de cette source cachée à tous les regards humains ! profondeur sans fond, hauteur sans limite, grandeur incommensurable et pureté inviolable !
        C’est de toi que coule ce fleuve %qui réjouit la cité de Dieu% et c’est grâce à toi qu’%aux accents des acclamations et des actions de grâce%, nous pouvons te chanter le cantique de louange, car nous pouvons témoigner, par expérience, qu’%en toi est la source de la vie%, et que %par ta lumière, nous verrons la lumière%.
      responsory: |-
        J’ai vu la source
        devenir un fleuve immense, alléluia !
        Les fils de Dieu rassemblés
        chantaient leur joie d’être sauvés, alléluia !

        R/ Alléluia ! Alléluia ! Alléluia !

morning:
  hymn:
    - les-enfants-nes-de-ton-sang
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - Si quelqu’un a soif, dit le Seigneur, qu’il vienne à moi et qu’il boive !
    - psalm: OT_41
      antiphon:
        - Venez à moi, vous qui peinez sous le fardeau, et moi, je vous donnerai le repos.
    - psalm: PSALM_149
      antiphon:
        - Mon fils, ouvre-moi ton cœur, mes chemins s’ouvriront sous tes yeux.
  reading:
    biblicalReference: Jr 31, 33
    content: Voici quelle sera l’Alliance que je conclurai avec la maison d’Israël quand ces jours-là seront passés, déclare le Seigneur. Je mettrai ma Loi au plus profond d’eux-mêmes ; je l’inscrirai dans leur cœur. Je serai leur Dieu, et ils seront mon peuple.
  responsory: |-
    R/ Donne-nous, Seigneur, un cœur nouveau,
    mets en nous, Seigneur, un esprit nouveau.
    V/ Si quelqu’un a soif, qu’il vienne à moi et qu’il boive. R/
    V/ Je mettrai en vous mon Esprit et vous vivrez. R/
  evangelicAntiphon:
    common:
      - |-
        Dans son amour et sa tendresse, alléluia, Dieu nous a visités : il a racheté son peuple, alléluia !
  intercession:
    content: |-
      Regardons celui que nous avons transpercé et disons-lui avec amour :
      Béni sois-tu et prends pitié de nous.

      Jésus, en toi habite la divinité :
      — Béni sois-tu !
      Fais-nous vivre de ta vie,
      — Prends pitié de nous.

      Jésus, en toi le Père met tout son amour :
      — Béni sois-tu !
      Apprends-nous à écouter ta parole,
      — Prends pitié de nous.

      Jésus, en toi le Père nous manifeste sa tendresse :
      — Béni sois-tu !
      Révèle dans l’Église toute la sagesse de Dieu,
      — Prends pitié de nous.

      Jésus, de ta plénitude nous avons tout reçu :
      — Béni sois-tu !
      Accorde-nous surabondance de grâce,
      — Prends pitié de nous.

      Jésus, source de vie :
      — Béni sois-tu !
      Rends-nous saints et immaculés dans l’amour,
      — Prends pitié de nous.

middleOfDay:
  psalmody:
    - psalm: PSALM_117_1
    - psalm: PSALM_117_2
    - psalm: PSALM_117_3
  tierce:
    antiphon: Ô mon peuple, que t’ai-je fait ? En quoi t’ai-je contristé ? Réponds-moi.
    reading:
      biblicalReference: Jr 31, 2-4a
      content: |-
        Ainsi parle le Seigneur : Il a trouvé grâce dans le désert, le peuple qui a échappé au massacre ; Israël est en route vers son repos. Depuis des temps lointains, le Seigneur s’est montré à lui. Je t’ai aimée d’un amour éternel, aussi je te garde ma bienveillance, je vais te rétablir, et tu seras relevée, vierge d’Israël.
    responsory: |-
      V/ Exultant de joie, vous puiserez les eaux
      aux sources du salut.
  sexte:
    antiphon: Mon cœur en moi est brisé, je tremble de tous mes os.
    reading:
      biblicalReference: Jr 32, 40
      content: |-
        Je conclurai avec eux une Alliance éternelle : je ne cesserai de les poursuivre de mes bienfaits et je ferai qu’ils me respectent profondément, sans plus jamais s’écarter de moi.
    responsory: |-
      V/ J’espérai un secours mais en vain,
      des consolateurs, je n’en ai pas trouvé.
  none:
    antiphon: La lance du soldat ouvrit le côté de Jésus. Aussitôt il en sortit du sang et de l’eau.
    reading:
      biblicalReference: Rm 5, 8-9
      content: La preuve que Dieu nous aime, c’est que le Christ est mort pour nous, alors que nous étions encore pécheurs. À plus forte raison, maintenant que le sang du Christ nous a fait devenir des justes, nous serons sauvés par lui de la colère de Dieu.
    responsory: |-
      V/ À cause de nos fautes, il a été transpercé,
      par ses blessures, nous sommes guéris.

vespers:
  hymn:
    - nous-partageons-le-pain-nouveau
  psalmody:
    - psalm: PSALM_109
      antiphon:
        - Par la douceur de ton joug, Seigneur, domine jusqu’au cœur de l’ennemi.
    - psalm: PSALM_110
      antiphon:
        - Le Seigneur est tendresse et pitié, il a donné des vivres à ses fidèles.
    - psalm: NT_5
      antiphon:
        - Voici l’Agneau de Dieu, qui enlève le péché du monde.
  reading:
    biblicalReference: Ep 2, 4-7
    content: |-
      Dieu est riche en miséricorde ; à cause du grand amour dont il nous a aimés, nous qui étions des morts par suite de nos fautes, il nous a fait revivre avec le Christ : c’est bien par grâce que vous êtes sauvés. Avec lui, il nous a ressuscités ; avec lui, il nous a fait régner aux cieux, dans le Christ Jésus. Par sa bonté pour nous dans le Christ Jésus, il voulait montrer, au long des âges futurs, la richesse infinie de sa grâce.
  responsory: |-
    R/ Les projets de son cœur subsistent d’âge en âge :
    * Heureux le peuple dont le Seigneur est le Dieu !
    V/ Que ton amour, Seigneur, soit sur nous,
    comme notre espoir est en toi. *
    Gloire au Père et au Fils et au Saint-Esprit. R/
  evangelicAntiphon:
    common:
      - Le Seigneur nous porte dans ses bras, il nous tient sur son cœur, il se souvient de son amour, alléluia.
  intercession:
    content: |-
      Jésus crucifié, de ton côté ouvert ont coulé l’eau et le sang. Entends la prière de l’Église, ton Épouse :

      R/ Kyrie eleison.

      Jésus, temple saint de Dieu,
      demeure du Très-Haut, porte du ciel,
      — construis ton Église.

      Jésus, ami des hommes, frère des pauvres,
      maître de tous les cœurs,
      — souviens-toi de ton Alliance.

      Jésus, notre paix et notre réconciliation,
      soulagement de ceux qui peinent, repos de nos âmes,
      — attire vers toi les pécheurs.

      Jésus, chemin des brebis, Agneau vainqueur du péché,
      notre vie et notre résurrection,
      — donne-nous accès auprès du Père.

      Jésus, obéissant jusqu’à la mort, transpercé par la lance, enveloppé dans le suaire,
      — réveille ceux qui dorment dans la mort.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 32,11.18.19
    content: |-
      Les pensées de son Cœur subsistent d’âge en âge :
      >il veut délivrer de la mort les âmes de ceux qui le craignent,
      >et les nourrir aux jours de famine.
  collect:
  - |-
    Dieu tout-puissant, +
    >en trouvant notre gloire
    >dans le Cœur de ton Fils bien-aimé,
    >nous rappelons les admirables bienfaits de son amour pour nous ; *
    nous t’en prions, accorde-nous
    >de puiser à cette source divine /
    >une surabondance de grâce.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  - |-
    Seigneur notre Dieu, /
    >dans le Cœur de ton Fils meurtri par nos péchés,
    >tu nous prodigues avec miséricorde
    >les trésors infinis de ta tendresse ; *
    >nous t’en prions :
    >fais qu’en lui rendant l’hommage fervent de notre piété, /
    >nous lui rendions aussi les devoirs d’une juste réparation.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Regarde, nous t’en prions, Seigneur,
    >l’amour inexprimable du Cœur de ton Fils bien-aimé, *
    >pour que le don que nous t’offrons te soit agréable /
    >et contribue à l’expiation de nos péchés.
    Par le Christ, notre Seigneur.
  prefaceList:
  - sacred_heart
  communionAntiphon:
  - biblicalReference: Jn 7,37-38
    content: |-
      Si quelqu’un a soif, dit le Seigneur,
      >qu’il vienne à moi, et qu’il boive.
      Si quelqu’un croit en moi,
      >des fleuves d’eau vive couleront de son cœur.
  - biblicalReference: Jn 19,34
    content: |-
      Un des soldats avec sa lance lui perça le côté ;
      et aussitôt, il en sortit du sang et de l’eau.
  prayerAfterCommunion:
  - |-
    Par ce sacrement de ton amour, Seigneur, +
    >fais-nous brûler d’une charité
    >qui nous attire toujours vers ton Fils, /
    >et nous apprenne ainsi à le reconnaître en nos frères.
    Lui qui vit et règne pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Dt 7, 6-11
      cycle:
      - A
      headline: |-
        « Si le Seigneur vous a choisis, c’est par amour pour vous »
      content: |-
        Moïse disait au peuple :
        « Tu es un peuple consacré au Seigneur ton Dieu :
        c’est toi qu’il a choisi pour être son peuple,
        son domaine particulier parmi tous les peuples de la terre.
        Si le Seigneur s’est attaché à vous, s’il vous a choisis,
        ce n’est pas que vous soyez le plus nombreux de tous les peuples,
        car vous êtes le plus petit de tous.
        C’est par amour pour vous,
        et pour tenir le serment fait à vos pères,
        que le Seigneur vous a fait sortir par la force de sa main,
        et vous a rachetés de la maison d’esclavage
        et de la main de Pharaon, roi d’Égypte.
        Tu sauras donc que c’est le Seigneur ton Dieu qui est Dieu,
        le Dieu vrai qui garde son Alliance et sa fidélité
        pour mille générations
        à ceux qui l’aiment et gardent ses commandements.
        Mais il riposte à ses adversaires en les faisant périr,
        et sa riposte est immédiate.
        Tu garderas donc le commandement, les décrets et les ordonnances
        que je te prescris aujourd’hui de mettre en pratique. »
    - biblicalRef: Os 11, 1.3-4.8c-9
      cycle:
      - B
      headline: |-
        « Mon cœur se retourne contre moi »
      content: |-
        Ainsi parle le Seigneur :
        Oui, j’ai aimé Israël dès son enfance,
        et, pour le faire sortir d’Égypte, j’ai appelé mon fils.
        C’est moi qui lui apprenais à marcher,
        en le soutenant de mes bras,
        et il n’a pas compris que je venais à son secours.
        Je le guidais avec humanité,
        par des liens d’amour ;
        je le traitais comme un nourrisson
        qu’on soulève tout contre sa joue ;
        je me penchais vers lui pour le faire manger.
        Mais ils ont refusé de revenir à moi :
        vais-je les livrer au châtiment ?

        Non ! Mon cœur se retourne contre moi ;
        en même temps, mes entrailles frémissent.
        Je n’agirai pas selon l’ardeur de ma colère,
        je ne détruirai plus Israël,
        car moi, je suis Dieu, et non pas homme :
        au milieu de vous je suis le Dieu saint,
        et je ne viens pas pour exterminer.
    - biblicalRef: Ez 34, 11-16
      cycle:
      - C
      headline: |-
        « C’est moi qui ferai paître mon troupeau, et c’est moi qui le ferai reposer »
      content: |-
        Ainsi parle le Seigneur Dieu :
        Voici que moi-même, je m’occuperai de mes brebis,
        >et je veillerai sur elles.
        Comme un berger veille sur les brebis de son troupeau
        >quand elles sont dispersées,
        ainsi je veillerai sur mes brebis,
        et j’irai les délivrer dans tous les endroits où elles ont été dispersées
        >un jour de nuages et de sombres nuées.
        Je les ferai sortir d’entre les peuples,
        >je les rassemblerai des différents pays
        >et je les ramènerai sur leur terre ;
        je les ferai paître sur les montagnes d’Israël,
        >dans les vallées, dans les endroits les meilleurs.
        Je les ferai paître dans un bon pâturage,
        >et leurs prairies seront sur les hauteurs d’Israël.
        Là, mes brebis se reposeront dans de belles prairies,
        >elles brouteront dans de gras pâturages, sur les monts d’Israël.
        C’est moi qui ferai paître mon troupeau,
        >et c’est moi qui le ferai reposer,
        >- oracle du Seigneur Dieu.
        La brebis perdue, je la chercherai ;
        >l’égarée, je la ramènerai.
        Celle qui est blessée, je la panserai.
        Celle qui est malade, je lui rendrai des forces.
        Celle qui est grasse et vigoureuse,
        >je la garderai, je la ferai paître selon le droit.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 102 (103), 1-2, 3-4, 6-7, 8.10
      refAbbr: 102, 1…
      cycle:
      - A
      chorus:
      - chorusRef: 102, 17ab
        content: |-
          L’amour du Seigneur, sur ceux qui le craignent,
          est de toujours à toujours.
      content: |-
        Bénis le Seigneur, ô mon âme,
        bénis son nom très saint, tout mon être !
        Bénis le Seigneur, ô mon âme,
        n’oublie aucun de ses bienfaits !

        Car il pardonne toutes tes offenses
        et te guérit de toute maladie ;
        il réclame ta vie à la tombe
        et te couronne d’amour et de tendresse.

        Le Seigneur fait œuvre de justice,
        il défend le droit des opprimés.
        Il révèle ses desseins à Moïse,
        aux enfants d’Israël ses hauts faits.

        Le Seigneur est tendresse et pitié,
        lent à la colère et plein d’amour.
        Il n’agit pas envers nous selon nos fautes,
        ne nous rend pas selon nos offenses.
    - biblicalRef: Is 12, 2, 4bcd, 5-6
      refAbbr: 12, 2…
      cycle:
      - B
      chorus:
      - chorusRef: 12, 3
        content: |-
          Exultant de joie, vous puiserez les eaux
          aux sources du salut !
      content: |-
        Voici le Dieu qui me sauve :
        j’ai confiance, je n’ai plus de crainte.
        Ma force et mon chant, c’est le Seigneur ;
        il est pour moi le salut.

        Rendez grâce au Seigneur,
        proclamez son nom,
        annoncez parmi les peuples ses hauts faits !
        Redites-le : « Sublime est son nom ! »

        Jouez pour le Seigneur, il montre sa magnificence,
        et toute la terre le sait.
        Jubilez, criez de joie, habitants de Sion,
        car il est grand au milieu de toi, le Saint d’Israël !
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      refAbbr: 22, 1…
      cycle:
      - C
      chorus:
      - chorusRef: cf. 22, 1
        content: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi,
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
  - partType: READING_2
    partContents:
    - biblicalRef: 1Jn 4, 7-16
      cycle:
      - A
      headline: |-
        « Dieu nous a aimés »
      content: |-
        Bien-aimés,
        aimons-nous les uns les autres,
        >puisque l’amour vient de Dieu.
        Celui qui aime est né de Dieu
        >et connaît Dieu.
        Celui qui n’aime pas n’a pas connu Dieu,
        >car Dieu est amour.
        Voici comment l’amour de Dieu
        >s’est manifesté parmi nous :
        Dieu a envoyé son Fils unique dans le monde
        >pour que nous vivions par lui.
        Voici en quoi consiste l’amour :
        ce n’est pas nous qui avons aimé Dieu,
        >mais c’est lui qui nous a aimés,
        et il a envoyé son Fils
        >en sacrifice de pardon pour nos péchés.
        Bien-aimés,
        puisque Dieu nous a tellement aimés,
        >nous devons, nous aussi, nous aimer les uns les autres.
        Dieu, personne ne l’a jamais vu.
        Mais si nous nous aimons les uns les autres,
        Dieu demeure en nous,
        >et, en nous, son amour atteint la perfection.
        Voici comment nous reconnaissons
        >que nous demeurons en lui
        >et lui en nous :
        il nous a donné part à son Esprit.
        Quant à nous, nous avons vu et nous attestons
        >que le Père a envoyé son Fils
        >comme Sauveur du monde.
        Celui qui proclame que Jésus est le Fils de Dieu,
        >Dieu demeure en lui,
        >et lui en Dieu.
        Et nous, nous avons reconnu l’amour que Dieu a pour nous,
        >et nous y avons cru.
        Dieu est amour :
        qui demeure dans l’amour demeure en Dieu,
        >et Dieu demeure en lui.
    - biblicalRef: Ep 3, 8-12.14-19
      cycle:
      - B
      headline: |-
        « Vous connaîtrez ce qui surpasse toute connaissance : l’amour du Christ »
      content: |-
        Frères,
        à moi qui suis vraiment le plus petit de tous les fidèles,
        la grâce a été donnée d’annoncer aux nations
        l’insondable richesse du Christ,
        et de mettre en lumière pour tous le contenu du mystère
        qui était caché depuis toujours en Dieu,
        le créateur de toutes choses ;
        ainsi, désormais, les Puissances célestes elles-mêmes
        connaissent, grâce à l’Église,
        les multiples aspects de la Sagesse de Dieu.
        C’est le projet éternel que Dieu a réalisé
        dans le Christ Jésus notre Seigneur.
        Et notre foi au Christ nous donne l’assurance nécessaire
        pour accéder auprès de Dieu en toute confiance.
        C’est pourquoi je tombe à genoux devant le Père,
        de qui toute paternité au ciel et sur la terre tient son nom.
        Lui qui est si riche en gloire,
        qu’il vous donne la puissance de son Esprit,
        pour que se fortifie en vous l’homme intérieur.

        Que le Christ habite en vos cœurs par la foi ;
        restez enracinés dans l’amour, établis dans l’amour.
        Ainsi vous serez capables de comprendre avec tous les fidèles
        quelle est la largeur, la longueur, la hauteur, la profondeur…
        Vous connaîtrez ce qui surpasse toute connaissance :
        l’amour du Christ.
        Alors vous serez comblés
        jusqu’à entrer dans toute la plénitude de Dieu.
    - biblicalRef: Rm 5, 5b-11
      cycle:
      - C
      headline: |-
        « La preuve que Dieu nous aime »
      content: |-
        Frères,
        l’amour de Dieu a été répandu dans nos cœurs
        par l’Esprit Saint qui nous a été donné.
        Alors que nous n’étions encore capables de rien,
        le Christ, au temps fixé par Dieu,
        est mort pour les impies que nous étions.
        Accepter de mourir pour un homme juste,
        c’est déjà difficile ;
        peut-être quelqu’un s’exposerait-il à mourir
        pour un homme de bien.
        Or, la preuve que Dieu nous aime,
        c’est que le Christ est mort pour nous,
        alors que nous étions encore pécheurs.
        À plus forte raison, maintenant que le sang du Christ
        nous a fait devenir des justes,
        serons-nous sauvés par lui
        de la colère de Dieu.
        En effet, si nous avons été réconciliés avec Dieu
        par la mort de son Fils
        alors que nous étions ses ennemis,
        à plus forte raison,
        maintenant que nous sommes réconciliés,
        serons-nous sauvés en ayant part à sa vie.
        Bien plus, nous mettons notre fierté en Dieu,
        par notre Seigneur Jésus Christ,
        par qui, maintenant, nous avons reçu la réconciliation.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 11, 25-30
      cycle:
      - A
      headline: |-
        « Je suis doux et humble de cœur »
      acclamationAntiphon: |-
        Prenez sur vous mon joug,
        devenez mes disciples,
        car je suis doux et humble de cœur.
      content: |-
        En ce temps-là,
        Jésus prit la parole et dit :
        >« Père, Seigneur du ciel et de la terre,
        >je proclame ta louange :
        >ce que tu as caché aux sages et aux savants,
        >tu l’as révélé aux tout-petits.
        Oui, Père, tu l’as voulu ainsi dans ta bienveillance.
        Tout m’a été remis par mon Père ;
        >personne ne connaît le Fils, sinon le Père,
        >et personne ne connaît le Père, sinon le Fils,
        >et celui à qui le Fils veut le révéler.
        Venez à moi,
        >vous tous qui peinez sous le poids du fardeau,
        >et moi, je vous procurerai le repos.
        Prenez sur vous mon joug,
        >devenez mes disciples,
        >car je suis doux et humble de cœur,
        >et vous trouverez le repos pour votre âme.
        Oui, mon joug est facile à porter,
        >et mon fardeau, léger. »
    - biblicalRef: Jn 19, 31-37
      cycle:
      - B
      headline: |-
        « Un des soldats lui perça le côté, et il en sortit du sang et de l’eau »
      acclamationAntiphon: |-
        Prenez sur vous mon joug,
        devenez mes disciples,
        car je suis doux et humble de cœur.
      acclamationAntiphonReference: Mt 11, 29ab
      content: |-
        Jésus venait de mourir.
        Comme c’était le jour de la Préparation (c’est-à-dire le vendredi),
        il ne fallait pas laisser les corps en croix durant le sabbat,
        d’autant plus que ce sabbat était le grand jour de la Pâque.
        Aussi les Juifs demandèrent à Pilate qu’on enlève les corps
        après leur avoir brisé les jambes.
        Les soldats allèrent donc briser les jambes du premier,
        puis de l’autre homme crucifié avec Jésus.
        Quand ils arrivèrent à Jésus,
        voyant qu’il était déjà mort,
        ils ne lui brisèrent pas les jambes,
        mais un des soldats avec sa lance lui perça le côté ;
        et aussitôt, il en sortit du sang et de l’eau.

        Celui qui a vu rend témoignage,
        et son témoignage est véridique ;
        et celui-là sait qu’il dit vrai
        afin que vous aussi, vous croyiez.
        Cela, en effet, arriva
        pour que s’accomplisse l’Écriture :
        Aucun de ses os ne sera brisé.
        Un autre passage de l’Écriture dit encore :
        Ils lèveront les yeux vers celui qu’ils ont transpercé.
    - biblicalRef: Lc 15, 3-7
      cycle:
      - C
      headline: |-
        « Réjouissez-vous avec moi, car j’ai retrouvé ma brebis qui était perdue »
      acclamationAntiphon: |-
        Je suis le bon Pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        En ce temps-là,
        s’adressant aux pharisiens et aux scribes,
        Jésus disait cette parabole :
        « Si l’un de vous a cent brebis et qu’il en perd une,
        n’abandonne-t-il pas les 99 autres dans le désert
        pour aller chercher celle qui est perdue,
        jusqu’à ce qu’il la retrouve ?
        Quand il l’a retrouvée,
        il la prend sur ses épaules, tout joyeux,
        et, de retour chez lui, il rassemble ses amis et ses voisins
        pour leur dire :
        ‘Réjouissez-vous avec moi,
        car j’ai retrouvé ma brebis,
        celle qui était perdue !’
        Je vous le dis :
        C’est ainsi qu’il y aura de la joie dans le ciel
        pour un seul pécheur qui se convertit,
        plus que pour 99 justes
        qui n’ont pas besoin de conversion. »
