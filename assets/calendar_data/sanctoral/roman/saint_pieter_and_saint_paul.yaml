- massType: day_mass
  note: On peut employer une formule de bénédiction solennelle, p. 535.
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici les Apôtres qui, durant leur vie sur terre,
      >ont enraciné l’Église au prix de leur sang.
      Ils ont bu à la coupe du Seigneur
      >et sont devenus les amis de Dieu.
  collect:
