celebration:
  title: Sainte Scholastique, vierge
  subtitle: vierge
  description: Scholastique était la sœur de saint Benoît, le législateur des moines d’Occident. Elle mena la vie consacrée au pied du Mont Cassin, où Benoît avait fondé son célèbre monastère, et elle précéda de peu son frère dans la mort († 547). C’est pourquoi les moniales bénédictines honorent Scholastique comme leur Mère spirituelle.
  commons:
  - virgins
  color: white

oration:
- |-
  En célébrant la mémoire de sainte Scholastique, Seigneur, nous te prions : fais que nous sachions, nous aussi, te servir avec une charité sans défaut et goûter la douceur de ton amour.

readings:
  patristicReading:
  - title: DIALOGUES DE SAINT GRÉGOIRE LE GRAND
    content: |-
      Scholastique, sœur de saint Benoît, consacrée à Dieu tout-puissant dès son enfance, venait voir son frère une fois par an. L’homme de Dieu se rendait vers elle dans le domaine du monastère, sans dépasser beaucoup la porte.
      Un jour, elle vint comme d’habitude, et son vénérable frère se rendit vers elle avec ses disciples. Ils passèrent toute la journée dans les louanges de Dieu et de saints entretiens. Quand la nuit tomba, ils mangèrent ensemble. Comme il se faisait tard, avec ces saints entretiens, la moniale lui fit cette demande : «Je t’en prie, ne me quitte pas cette nuit ; parlons jusqu’au matin des joies de la vie céleste. » Il lui répondit : « Que dis-tu là, ma sœur ? Je ne puis aucunement demeurer hors du monastère.»
      La moniale, lorsqu’elle entendit le refus de son frère, posa ses mains, les doigts joints, sur la table, et inclina la tête sur ses mains pour prier Dieu, le Tout-Puissant. Quand elle releva la tête au-dessus de la table, les éclairs et le tonnerre éclatèrent avec une telle force, un tel déluge se mit à tomber, que ni le vénérable Benoît ni les frères qui l’accompagnaient ne purent faire un pas hors de l’endroit où ils étaient réunis.
      Alors l’homme de Dieu, tout triste, se mit à se plaindre : « Que Dieu tout-puissant te pardonne, ma sœur. Qu’est-ce que tu as fait ? » Elle lui répondit : « Je t’ai prié, et tu n’as pas voulu m’entendre; j’ai prié mon Dieu, et il m’a entendue. Maintenant, sors, si tu peux, quitte-moi et retourne au monastère. »
      Lui, qui n’avait pas voulu rester, demeura là malgré lui, et c’est ainsi qu’ils passèrent toute la nuit à veiller, et ils se rassasièrent de leurs entretiens et de leurs échanges sur la vie spirituelle.
      Il n’est pas étonnant qu’une femme l’ait emporté sur lui car, selon la parole de saint Jean, %Dieu est amour%, et par un juste jugement, celle qui a aimé davantage a été la plus puissante.
      Trois jours après, l’homme de Dieu, qui se tenait dans le monastère, leva les yeux en l’air et vit l’âme de sa sœur, sortie de son corps, pénétrer dans le sanctuaire du ciel sous la forme d’une colombe. Se réjouissant qu’elle ait obtenu une si grande gloire, il rendit grâce par des hymnes et des chants de louange, et il envoya des frères rapporter le corps au monastère pour le déposer dans le tombeau qu’il avait préparé pour lui-même.
      Il arriva ainsi que la sépulture ne sépara pas les corps de ceux dont l’esprit, dans leur union à Dieu, n’avait jamais fait qu’un.
    responsory: |-
      [rubric](Stance)[/rubric]
      Pourquoi garder toute la nuit
      vos lampes allumées ?
      Pourquoi donner à votre vie
      le sens d’une attente infinie ?
      Quelle espérance vous tient éveillées,
      vierges sages,
      et quelle promesse de joie ?

      R/ Heureux les invités aux noces de l’Agneau !

      Vers la ténèbre lumineuse vos regards sont levés,
      et Dieu qui vous attend comblera seul votre quête.

      Pour une perle sans prix, vous avez tout quitté,
      les mains ouvertes et libres en offrande.

      À votre humble fierté, l’Église, joyeuse,
      reconnaît son visage, sa grâce de fiancée.

      À travers l’amour qui brûle en vous, servantes du Seigneur,
      le cœur de Dieu nous presse de l’aimer sans partage.

morning:
  evangelicAntiphon:
    common:
    - |-
      Vierge sage, elle a rejoint le Christ : parmi les saints du ciel, elle resplendit comme le soleil.

mass:
- massType: day_mass
  entranceAntiphon: null
  collect:
  - |-
    En célébrant la mémoire
    >de la bienheureuse vierge Scholastique,
    >Seigneur, nous te prions : *
    fais qu’à son exemple, nous te servions
    >avec une charité sans faille /
    et que nous goûtions avec bonheur
    >les bienfaits de ton amour.
    Par Jésus Christ, ton Fils, notre Seigneur,
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING
    partContents:
    - biblicalRef: Ct 8, 6-7
      headline: « L’amour est fort comme la Mort »
      content: |-
        Pose-moi comme un sceau sur ton cœur,
        comme un sceau sur ton bras.
        Car l’amour est fort comme la Mort,
        la passion, implacable comme l’Abîme :
        ses flammes sont des flammes de feu,
        fournaise divine.
        Les grandes eaux ne pourront éteindre l’amour,
        ni les fleuves l’emporter.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 148, 1-2, 7a.11a.12, 13-14a
      refAbbr: cf. 148, 12a.13a
      chorus:
      - chorusRef: cf. 148, 12a.13a
        chorus: |-
          Alléluia !
          ou : Jeunes gens et jeunes filles,
          louez le nom du Seigneur.
      content: |-
        Louez le Seigneur du haut des cieux,
        louez-le dans les hauteurs.
        Vous, tous ses anges, louez-le,
        louez-le, tous les univers.

        Louez le Seigneur depuis la terre,
        les rois de la terre et tous les peuples,
        tous les jeunes gens et jeunes filles,
        les vieillards comme les enfants.

        Qu’ils louent le nom du Seigneur,
        le seul au-dessus de tout nom ;
        sur le ciel et sur la terre, sa splendeur :
        il accroît la vigueur de son peuple.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 38-42
      headline: « Marthe le reçut. Marie a choisi la meilleure part »
      acclamationAntiphon: |-
        Si quelqu’un m’aime, il gardera ma parole, dit le Seigneur ;
        mon Père l’aimera, et nous viendrons vers lui.
      content: |-
        En ce temps-là,
        Jésus entra dans un village.
        Une femme nommée Marthe le reçut.
        Elle avait une sœur appelée Marie
        qui, s’étant assise aux pieds du Seigneur,
        écoutait sa parole.
        Quant à Marthe, elle était accaparée
        par les multiples occupations du service.
        Elle intervint et dit :
        « Seigneur, cela ne te fait rien
        que ma sœur m’ait laissé faire seule le service ?
        Dis-lui donc de m’aider. »
        Le Seigneur lui répondit :
        « Marthe, Marthe, tu te donnes du souci
        et tu t’agites pour bien des choses.
        Une seule est nécessaire.
        Marie a choisi la meilleure part,
        elle ne lui sera pas enlevée. »
        
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null