celebration:
  title: Saint Sébastien
  subtitle: martyr
  description: Sébastien, dont la tradition fait un soldat originaire de Milan, périt à Rome au début de la persécution de Dioclétien, qui commença par une épuration de l’armée (300). Invoqué contre la peste dès le 6e siècle, il est demeuré populaire jusqu’à nos jours.
  commons:
    - martyrs
  color: red

oration:
  - Seigneur, accorde-nous l’esprit de force, pour qu’à l’exemple de saint Sébastien, ton martyr, nous préférions t’obéir, à toi plutôt qu’aux hommes.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AMBROISE POUR LA FÊTE DE SAINT SÉBASTIEN
      subtitle: 20 janvier 390
      content: |-
        %Il nous faut passer par beaucoup de détresses pour entrer dans le Royaume de Dieu%. S’il y a beaucoup de persécutions, ce sont autant de mises à l’épreuve; là où il y a beaucoup de couronnes, il y a eu beaucoup de combats. C’est ton avantage qu’il y ait beaucoup de persécuteurs, si bien que, parmi beaucoup de persécutions, tu trouveras le moyen d’être couronné.
        Prenons l’exemple du martyr saint Sébastien, dont c’est aujourd’hui l’anniversaire. Par son origine, c’est un Mila-nais. Peut-être le persécuteur était-il déjà parti, ou au contraire n’était-il pas encore arrivé dans cette région, ou encore était-il débonnaire? Sébastien constata qu’il n’y avait aucun combat ici, ou un combat languissant.
        Il partit pour Rome où, à cause de l’intensité de la foi, les persécutions bouillonnaient avec violence; c’est là qu’il a souffert, c’est-à-dire qu’il a été couronné. C’est donc là, où il est venu en étranger, qu’il a établi le domicile de son immortalité définitive.
        S’il n’y avait eu qu’un seul persécuteur, ce martyr n’aurait certes pas été couronné. Mais le pire, c’est que les persécuteurs ne sont pas seulement ceux qui se voient, mais encore ceux qui ne se voient pas; et ceux-là sont de beaucoup les plus nombreux.
        Car de même qu’un seul persécuteur en chef envoyait de nombreux ordres de persécution, et qu’il y avait des persécuteurs dans chaque cité ou chaque province, de même le diable dirige ses nombreux ministres qui soulèvent des persécutions non pas seulement au-dehors, mais aussi intérieurement, dans le cœur de chacun.
        C’est de ces persécutions-là que saint Paul a dit: %Tous ceux qui veulent vivre avec piété dans le Christ Jésus seront persécutés%. Il a dit %tous%, il n’a excepté personne. Qui peut être excepté, en effet, quand le Seigneur lui-même a subi les épreuves des persécutions?
        Combien y a-t-il chaque jour de martyrs secrets du Christ, et qui confessent le Seigneur Jésus! L’Apôtre connaissait ce martyre et le témoignage de foi au Christ, lui qui a dit : %C’est là notre fierté, et le témoignage de notre conscience%.
      reponsory: |-
        R/ Pour moi, vivre, c’est le Christ !

        Je suis en captivité pour le Christ,
        captif pour défendre l’Évangile.

        J’ai le désir de m’en aller
        et d’être avec lui.

        Je demeurerai près de vous tous
        pour la joie de votre foi.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Accorde-nous, Seigneur, l’esprit de force, *
    >pour que l’exemple de ton bienheureux martyr Sébastien
    nous apprenne à t’obéir, /
    à toi plutôt qu’aux hommes.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 P 3, 14-17
      headline: « N’ayez aucune crainte de ces gens-là, ne vous laissez pas troubler »
      content: |-
        Bien-aimés,
        s’il vous arrivait de souffrir pour la justice,
        heureux seriez-vous !
        Comme dit l’Écriture :
        N’ayez aucune crainte de ces gens-là,
        ne vous laissez pas troubler.
        Honorez dans vos cœurs
        la sainteté du Seigneur, le Christ.
        Soyez prêts à tout moment à présenter une défense
        devant quiconque vous demande de rendre raison
        de l’espérance qui est en vous ;
        mais faites-le avec douceur et respect.
        Ayez une conscience droite,
        afin que vos adversaires soient pris de honte
        sur le point même où ils disent du mal de vous
        pour la bonne conduite que vous avez dans le Christ.
        Car mieux vaudrait souffrir en faisant le bien,
        si c’était la volonté de Dieu,
        plutôt qu’en faisant le mal.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6-7, 8-9
      refAbbr: cf. 33, 5b
      chorus:
      - chorusRef: cf. 33, 5b
        chorus: |-
          De toutes mes frayeurs,
          le Seigneur me délivre.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 28-33
      headline: « Ne craignez pas ceux qui tuent le corps »
      acclamationAntiphon: |-
        Heureux l’homme
        qui supporte l’épreuve avec persévérance,
        car, sa valeur une fois vérifiée, il recevra la couronne de la vie.
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Ne craignez pas ceux qui tuent le corps
        sans pouvoir tuer l’âme ;
        craignez plutôt celui qui peut faire périr dans la géhenne
        l’âme aussi bien que le corps.
        Deux moineaux ne sont-ils pas vendus pour un sou ?
        Or, pas un seul ne tombe à terre
        sans que votre Père le veuille.
        Quant à vous, même les cheveux de votre tête sont tous comptés.
        Soyez donc sans crainte :
        vous valez bien plus qu’une multitude de moineaux.
        Quiconque se déclarera pour moi devant les hommes,
        moi aussi je me déclarerai pour lui
        devant mon Père qui est aux cieux. »
