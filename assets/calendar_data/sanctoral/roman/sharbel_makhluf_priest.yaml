celebration:
  title: Saint Charbel Makhlouf
  subtitle: prêtre
  description: Moine de l’Ordre Libanais maronite, Charbel Makhlouf (1828-1898) est l’un des saints les plus populaires du Liban. Sa vie de prêtre et d’ermite, marquée par l’eucharistie, le jeûne et la pénitence, est un modèle de simplicité et de transparence. Il opérait de nombreuses guérisons de l’âme et du corps, si bien que sa renommée s’est rapidement répandue, même chez les non-chrétiens.
  commons:
    - pastors
    - saints-male_religious
  color: white

oration:
- |-
  Seigneur Dieu, tu as appelé le prêtre saint Charbel au combat singulier du désert, et tu l’as comblé de multiples dons spirituels ; nous t’en supplions : donne-nous d’imiter le Seigneur en sa Passion et d’avoir part à son Royaume.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as appelé le prêtre saint Charbel
    >au combat singulier du désert,
    >et tu l’as comblé de multiples dons spirituels ; *
    >nous t’en supplions :
    >donne-nous d’imiter le Seigneur en sa Passion /
    >et d’avoir part à son Royaume.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Si 3, 17-24
      headline: |-
        « Il faut t’abaisser : tu trouveras grâce devant le Seigneur »
      content: |-
        Mon fils, accomplis toute chose dans l’humilité,
        >et tu seras aimé plus qu’un bienfaiteur.
        Plus tu es grand, plus il faut t’abaisser :
        >tu trouveras grâce devant le Seigneur.
        Beaucoup sont haut placés et glorieux,
        >mais c’est aux humbles que le Seigneur révèle ses secrets.
        Grande est la puissance du Seigneur,
        >et les humbles lui rendent gloire.
        Ne cherche pas ce qui est trop difficile pour toi,
        >ne scrute pas ce qui est au-dessus de tes forces.
        Médite ce qu’on t’a prescrit :
        >tu n’as pas à t’occuper des choses cachées.
        Ne sois pas curieux de ce qui te dépasse :
        >déjà ce qu’on t’a enseigné est au-delà de l’esprit humain.
        Leur présomption a égaré bien des gens,
        >leur manque de jugement a fait dévier leurs pensées.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 14 (15), 2, 3, 4bcd, 5
      refAbbr: 14, 2…
      chorus:
      - chorusRef: cf. 14, 1b
        chorus: |-
          Le juste habitera ta sainte montagne,
          Seigneur.
      content: |-
        Celui qui se conduit parfaitement,
        qui agit avec justice
        et dit la vérité selon son cœur.

        Il met un frein à sa langue,
        ne fait pas de tort à son frère
        et n’outrage pas son prochain.

        Il honore les fidèles du Seigneur.
        S’il a juré à ses dépens,
        il ne reprend pas sa parole.

        Il prête son argent sans intérêt,
        n’accepte rien qui nuise à l’innocent.
        Qui fait ainsi demeure inébranlable.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 27-29
      headline: |-
        « Vous qui m’avez suivi, vous recevrez le centuple »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Pierre prit la parole et dit à Jésus :
        >« Voici que nous avons tout quitté pour te suivre :
        >quelle sera donc notre part ? »
        Jésus leur déclara :
        >« Amen, je vous le dis :
        >lors du renouvellement du monde,
        >lorsque le Fils de l’homme siégera sur son trône de gloire,
        >vous qui m’avez suivi,
        >vous siégerez vous aussi sur douze trônes
        >pour juger les douze tribus d’Israël.
        Et celui qui aura quitté, à cause de mon nom,
        >des maisons, des frères, des sœurs,
        >un père, une mère, des enfants,
        >ou une terre,
        >recevra le centuple,
        >et il aura en héritage la vie éternelle. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null