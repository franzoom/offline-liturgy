celebration:
  title: Saint Simon et saint Jude
  subtitle: apôtres
  description: |-
    L’apôtre Simon était surnommé le Zélote, sans doute pour avoir appartenu au parti extrémiste qui menait la guérilla contre les Romains. Quant à Jude, appelé aussi Thaddée, il posa à Jésus, lors de la dernière Cène, une question qui lui valut la promesse : « Si quelqu’un m’aime, mon Père l’aimera, nous viendrons chez lui et nous y ferons notre demeure » (Jn 14, 23).
  commons:
    - apostles
  color: red


oration:
  - Dieu qui nous as conduits à la connaissance de ton nom par la prédication des Apôtres, fais qu’à la prière des saints Simon et Jude, ton Église ne cesse de grandir en accueillant toujours de nouveaux croyants.

readings:
  patristicReading:
    - title: COMMENTAIRE DE SAINT CYRILLE D’ALEXANDRIE SUR L’ÉVANGILE DE JEAN
      content: |-
        Notre Seigneur Jésus Christ a institué des guides et des enseignants pour le monde entier, et des%intendants de ses mystères divins.%Il leur a prescrit de briller et d’éclairer comme des flambeaux non seulement dans le pays des Juifs, ~ mais partout sous le soleil, pour les hommes habitant sur toute la surface de la terre. Elle est donc vraie, cette parole de saint Paul : %On ne s’attribue pas cet honneur à soi-même, on le reçoit par appel de Dieu%. Notre Seigneur Jésus Christ, en effet, a appelé à ce très glorieux apostolat ses disciples avant tous les autres. ~
        Les saints disciples ont donc été comme %les colonnes et le soutien de la vérité%. Le Seigneur dit qu’il les a envoyés comme le Père l’avait envoyé lui-même. Il montre ainsi quelle est la dignité de l’apostolat et la gloire incomparable du pouvoir qu’il leur a donné. En même temps, semble-t-il, il fait entrevoir la route de la fonction apostolique.
        Car, s’il estimait devoir envoyer ainsi ses propres disciples comme le Père l’avait envoyé lui-même, comment n’était-il pas nécessaire que ceux-ci, destinés à être ses imitateurs, découvrent pour quelle tâche le Père avait envoyé son Fils ? Celui-ci nous a donc expliqué de diverses manières le caractère de sa mission. Il a dit un jour : %Je ne suis pas venu appeler les justes, mais les pécheurs pour qu’ils se convertissent.% Et encore : %Je suis descendu du ciel non pas pour faire ma volonté, mais la volonté de celui qui m’a envoyé%. Et une autre fois : %Dieu n’a pas envoyé son Fils dans le monde pour juger le monde, mais pour que le monde soit sauvé par lui%.
        Il résumait en quelques paroles la fonction des Apôtres en disant qu’il les a envoyés comme le Père l’avait envoyé lui-même : ils sauraient par là qu’il leur incombe d’appeler les pécheurs à se convertir, de soigner les malades, corporellement et spirituellement ; dans leurs fonctions d’intendants, de ne chercher aucunement à faire leur propre volonté, mais la volonté de celui qui les a envoyés ; enfin de sauver le monde dans la mesure où il recevra les enseignements du Seigneur.
        Nous pourrons facilement voir comment les saints disciples ont excellé dans toutes ces tâches ~ nous lisons les Actes des Apôtres et les écrits de saint Paul.
      responsory: |-
        [rubric](Stance)[/rubric]
        Tu révèles ta présence :
        devant son pur éclat
        notre vide nous saisit ;
        nous confessons notre péché.
        Mais toi, Dieu fort,
        tu apaises la crainte
        et nous envoies porter aux hommes
        la confiance des sauvés.

        R/ Sur ton ordre, Seigneur,
        nous dirons ta parole.

        Avance au large et ne crains pas ;
        je suis avec vous tous les jours
        jusqu’à la fin du monde.

        Je vous donne ma paix :
        comme mon Père m’a envoyé,
        moi aussi je vous envoie.

        Je vous baptiserai dans l’Esprit et le feu ;
        vous serez mes témoins
        jusqu’aux limites du monde.

        Dans le monde vous aurez à souffrir,
        mais gardez courage,
        j’ai vaincu le monde.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: null
    content: |-
      Voici les saints Simon et Jude :
      le Seigneur les a vraiment aimés
      >il les a choisis et leur a donné une gloire éternelle.
  collect:
  - |-
    Seigneur Dieu, +
    >tu nous as conduits à la connaissance de ton nom par la prédication des bienheureux Apôtres ; *
    fais qu’à l’intercession des saints Simon et Jude,
    >ton Église ne cesse de grandir /
    >en accueillant toujours de nouveaux peuples de croyants.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ep 2, 19-22
      headline: « Intégrés dans la construction qui a pour fondations les Apôtres »
      content: |-
        Frères,
        vous n’êtes plus des étrangers ni des gens de passage,
        vous êtes concitoyens des saints,
        vous êtes membres de la famille de Dieu,
        car vous avez été intégrés dans la construction
        qui a pour fondations les Apôtres et les prophètes ;
        et la pierre angulaire, c’est le Christ Jésus lui-même.
        En lui, toute la construction s’élève harmonieusement
        pour devenir un temple saint dans le Seigneur.
        En lui, vous êtes, vous aussi, les éléments d’une même construction
        pour devenir une demeure de Dieu par l’Esprit Saint.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 18A (19), 2-3, 4-5ab
      refAbbr: cf. 18, 5a
      chorus:
      - chorusRef: cf. 18, 5a
        chorus: Par toute la terre s’en va leur message.
      content: |-
        Les cieux proclament la gloire de Dieu,
        le firmament raconte l’ouvrage de ses mains.
        Le jour au jour en livre le récit
        et la nuit à la nuit en donne connaissance.

        Pas de paroles dans ce récit,
        pas de voix qui s’entende ;
        mais sur toute la terre en paraît le message
        et la nouvelle, aux limites du monde.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 6, 12-19
      headline: « Il en choisit douze auxquels il donna le nom d’Apôtres »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi, le Seigneur, nous t’acclamons.
        C’est toi que les Apôtres glorifient.
      content: |-
        En ces jours-là,
        Jésus s’en alla dans la montagne pour prier,
        et il passa toute la nuit à prier Dieu.
        Le jour venu,
        il appela ses disciples et en choisit douze
        auxquels il donna le nom d’Apôtres :
        Simon, auquel il donna le nom de Pierre,
        André son frère,
        Jacques, Jean, Philippe, Barthélemy,
        Matthieu, Thomas,
        Jacques fils d’Alphée,
        Simon appelé le Zélote,
        Jude fils de Jacques,
        et Judas Iscariote, qui devint un traître.
        Jésus descendit de la montagne avec eux
        et s’arrêta sur un terrain plat.
        Il y avait là un grand nombre de ses disciples
        et une grande multitude de gens
        venus de toute la Judée, de Jérusalem,
        et du littoral de Tyr et de Sidon.
        Ils étaient venus l’entendre
        et se faire guérir de leurs maladies ;
        ceux qui étaient tourmentés par des esprits impurs
        retrouvaient la santé.
        Et toute la foule cherchait à le toucher,
        parce qu’une force sortait de lui
        et les guérissait tous.
        .
  offeringPrayer:
  - |-
    En vénérant la gloire éternelle
    >des saints Apôtres Simon et Jude
    >nous te supplions, Seigneur : *
    accueille nos prières /
    >et fais-nous participer dignement
    >aux mystères que nous célébrons.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Jn 14,23
    content: |-
      Si quelqu’un m’aime, il gardera ma parole, dit le Seigneur ;
      >mon Père l’aimera, nous viendrons vers lui
      >et, chez lui, nous nous ferons une demeure.
  prayerAfterCommunion:
  - |-
    Après avoir reçu ton sacrement, Seigneur,
    >nous te supplions dans l’Esprit Saint : *
    >que le sacrifice offert aujourd’hui
    >pour célébrer la passion des Apôtres Simon et Jude /
    >nous garde dans ton amour.
    Par le Christ, notre Seigneur.