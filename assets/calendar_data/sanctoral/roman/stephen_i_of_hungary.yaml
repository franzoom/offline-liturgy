celebration:
  title: Saint Étienne de Hongrie
  description: Étienne (970-1038) fut le premier « roi apostolique de Hongrie ». Le jour de Noël de l’an mil, il ceignit la couronne royale que lui avait envoyée le pape Sylvestre II. Ce souverain de grande classe fut un chrétien soucieux d’implanter l’Église en son pays. Il fonda des diocèses et bâtit des sanctuaires qui sont restés les plus aimés du peuple hongrois.
  commons:
    - saints-male
  color: white

oration: 
  - |-
    Seigneur, ton Église avait en saint Étienne de Hongrie un propagateur de l’Évangile, quand il était roi sur la terre ; permets qu’elle trouve en lui un défenseur, maintenant qu’il est dans la gloire du ciel.

readings:
  patristicReading:
    title: CONSEILS DE SAINT ÉTIENNE À SON FILS
    content: |-
      Avant tout, mon très cher fils, je te l’ordonne, je te le conseille et je t’y invite : si tu veux faire honneur à la couronne royale, tu garderas la foi catholique et apostolique avec tant de zèle et d’exactitude que tu donnes l’exemple à tous ceux que Dieu a soumis à ton autorité ; c’est alors que tous les hommes d’Église reconnaîtront en toi, à juste titre, cette profession de véritable christianisme sans laquelle, sache-le bien, on ne t’appellera pas chrétien ou fils de l’Église. ~ Dans notre palais royal, après la foi, c’est l’Église qui occupe la seconde place, elle qui a été semée d’abord par son chef, le Christ. Ensuite, ses membres, c’est-à-dire les Apôtres et les saints Pères, Tont transplantée, solidement bâtie et répandue dans tout l’univers. Et bien qu’elle engendre toujours de nouveaux enfants, il y a des lieux précis où son antiquité est tenue pour certaine.
      Cette Église, mon très cher fils, dans notre royaume est encore qualifiée de jeune et de toute nouvelle ; et c’est pourquoi elle a particulièrement besoin de protecteurs attentifs et clairvoyants. Sans cela, le bienfait que la bonté divine nous a accordé sans aucun mérite de notre part sera détruit et anéanti par ton inertie, ta paresse et ta négligence. ~
      Mon fils très aimable, douceur de mon cœur, espoir de ma descendance future, je t’en prie et je te l’ordonne : par tous les moyens et en toutes choses, pratique la bonté en étant bienveillant non seulement envers tes parents et tes alliés, envers les princes, les chefs, les riches, les voisins et les compatriotes, mais aussi envers les étrangers et tous ceux qui s’adressent à toi. Car une vie de bonté te conduit au sommet de la béatitude. Sois miséricordieux envers tous ceux qui souffrent violence, gardant toujours au fond de toi l’exemple du Seigneur : %C’est la miséricorde que je désire et non les sacrifices%. Sois patient envers tous, non seulement envers les puissants, mais aussi envers ceux qui sont dépourvus de puissance.
      Sois fort, enfin, pour que la prospérité ne te rende pas trop fier, ni l’adversité trop abattu. Sois humble aussi, pour que ce soit Dieu qui t’élève, ici-bas et dans le monde futur. Sois modéré et ne châtie ni ne condamne personne outre mesure. Sois doux, pour ne jamais violer la justice. Aie le cœur noble ; n’inflige jamais de honte à qui que ce soit, par un premier mouvement. Sois chaste, pour éviter toutes les corruptions de la volupté comme un aiguillon de mort.
      Toutes les vertus que je viens de rappeler composent la couronne d’un roi : sans elles, personne ne peut régner ici-bas, ni parvenir au royaume éternel.

    responsory: |-
      R/ Seigneur, qui habitera sur ta montagne sainte ?
      
      Celui qui juge avec justice
      en écoutant le petit comme le grand.
      
      Celui qui ne craint pas l’homme,
      sachant que le jugement relève de Dieu.
      
      Celui qui refuse d’être acheté
      pour accabler un innocent. (pas de R/)

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné à saint Étienne de Hongrie
    >de travailler à l’extension de ton Église
    >quand il était roi sur la terre ; *
    fais qu’il soit pour elle un défenseur, /
    >maintenant qu’il est dans la gloire du ciel.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Dt 6, 3-9
      headline: |-
        « Tu aimeras le Seigneur ton Dieu de tout ton cœur »
      content: |-
        Moïse disait au peuple :
        « Israël, tu écouteras,
        >tu veilleras à mettre en pratique
        ce qui t’apportera bonheur et fécondité,
        >dans un pays ruisselant de lait et de miel,
        comme te l’a dit le Seigneur, le Dieu de tes pères.
        Écoute, Israël :
        >le Seigneur notre Dieu est l’Unique.
        Tu aimeras le Seigneur ton Dieu de tout ton cœur,
        >de toute ton âme et de toute ta force.
        Ces paroles que je te donne aujourd’hui
        >resteront dans ton cœur.
        Tu les rediras à tes fils,
        >tu les répéteras sans cesse,
        >à la maison ou en voyage,
        >que tu sois couché ou que tu sois levé ;
        tu les attacheras à ton poignet comme un signe,
        >elles seront un bandeau sur ton front,
        tu les inscriras à l’entrée de ta maison
        >et aux portes de ta ville. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: |-
          Heureux qui craint le Seigneur.
      - chorusRef: null
        chorus: |-
          ou : Alléluia !
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira, et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 25, 14-30
      headline: |-
        « Tu as été fidèle pour peu de choses, je t’en confierai beaucoup »
      acclamationAntiphon: |-
        Si quelqu’un m’aime, il gardera ma parole, dit le Seigneur ;
        mon Père l’aimera, et nous viendrons vers lui.
      content: |-
        Jésus disait à ses disciples cette parabole :
        >« C’est comme un homme qui partait en voyage :
        >il appela ses serviteurs et leur confia ses biens.
        À l’un il remit une somme de cinq talents,
        >à un autre deux talents,
        >au troisième un seul talent,
        >à chacun selon ses capacités.
        Puis il partit.
        Aussitôt, celui qui avait reçu les cinq talents
        >s’en alla pour les faire valoir
        >et en gagna cinq autres.
        De même, celui qui avait reçu deux talents
        >en gagna deux autres.
        Mais celui qui n’en avait reçu qu’un
        >alla creuser la terre et cacha l’argent de son maître.
        Longtemps après, le maître de ces serviteurs revint
        >et il leur demanda des comptes.
        Celui qui avait reçu cinq talents s’approcha,
        présenta cinq autres talents
        et dit :
        >"Seigneur,
        >tu m’as confié cinq talents ;
        >voilà, j’en ai gagné cinq autres."
        Son maître lui déclara :
        >"Très bien, serviteur bon et fidèle,
        >tu as été fidèle pour peu de choses,
        >je t’en confierai beaucoup ;
        >entre dans la joie de ton seigneur."
        Celui qui avait reçu deux talents s’approcha aussi
        et dit :
        >"Seigneur,
        >tu m’as confié deux talents ;
        >voilà, j’en ai gagné deux autres."
        Son maître lui déclara :
        >"Très bien, serviteur bon et fidèle,
        >tu as été fidèle pour peu de choses,
        >je t’en confierai beaucoup ;
        >entre dans la joie de ton seigneur."
        >Celui qui avait reçu un seul talent s’approcha aussi
        >et dit :
        >"Seigneur,
        >je savais que tu es un homme dur :
        >tu moissonnes là où tu n’as pas semé,
        >tu ramasses là où tu n’as pas répandu le grain.
        J’ai eu peur, et je suis allé cacher ton talent dans la terre.
        Le voici. Tu as ce qui t’appartient."
        >Son maître lui répliqua :
        >"Serviteur mauvais et paresseux,
        >tu savais que je moissonne là où je n’ai pas semé,
        >que je ramasse le grain là où je ne l’ai pas répandu.
        Alors, il fallait placer mon argent à la banque ;
        >et, à mon retour, je l’aurais retrouvé avec les intérêts.
        Enlevez-lui donc son talent
        >et donnez-le à celui qui en a dix.
        À celui qui a, on donnera encore,
        >et il sera dans l’abondance ;
        >mais celui qui n’a rien
        >se verra enlever même ce qu’il a.
        Quant à ce serviteur bon à rien,
        >jetez-le dans les ténèbres extérieures ;
        >là, il y aura des pleurs et des grincements de dents !" »
