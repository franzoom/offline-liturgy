celebration:
  title: Saint Sylvestre I^er
  subtitle: pape
  description: Sylvestre, élu pape au lendemain de la Paix constantinienne, gouverna l’Église romaine durant vingt et un ans (314-335). Il vit la foi chrétienne pénétrer toutes les classes de la société, mais il assista aussi, impuissant, à la crise que déclencha le prêtre alexandrin Arius en niant la divinité du Christ. Il fut présent par ses légats au concile de Nicée, le premier concile œcuménique (325).
  commons:
  - pastors_pope
  color: white

oration:
  - |-
    Viens secourir ton peuple, Seigneur ; à la prière du pape saint Sylvestre, soutiens-le : conduis-le au long de cette vie qui passe pour qu’il arrive un jour à la vie qui ne finit pas.

readings:
  patristicReading:
    - title: DE L’HISTOIRE ECCLÉSIASTIQUE D’EUSÈBE DE CÉSARÉE
      content: |-
        En toute chose, rendons grâce à Dieu tout-puissant, roi de l’univers ; rendons grâce abondamment aussi au Sauveur et Rédempteur de nos âmes, Jésus Christ ; par lui, nous prions pour avoir une paix ferme et inébranlable, loin des troubles qui viennent soit de l’extérieur, soit de nos pensées. ~
        Désormais, un jour brillant et limpide, que n’assombrissait aucun nuage, éclairait par les rayons d’une lumière céleste les Églises du Christ sur toute la terre. Ceux qui étaient en dehors de notre communauté ne pouvaient pas jouir de l’égalité avec nous ; mais ils recevaient indirectement une participation aux biens qui nous étaient accordés par Dieu. ~
        Pour nous surtout, qui avions placé nos espérances dans le Christ, une joie inexprimable, un bonheur divin s’épanouissaient chez tous : tous ces lieux que l’impiété des tyrans avait ravagés peu auparavant, nous pouvions les voir revivre après une longue et mortelle dévastation. Ils se relevaient de leurs ruines jusqu’à une hauteur infinie et recevaient une splendeur bien plus grande qu’avant la persécution. ~
        Nous avons pu assister à un spectacle attendu et désiré par tous : des fêtes de dédicace dans chaque ville, des consécrations d’églises récemment construites.
        Pour cela, des évêques se réunissaient, des fidèles accouraient de loin, les peuples manifestaient leur amitié réciproque, car les membres du corps du Christ s’unissaient dans l’harmonie d’une seule assemblée.
        Selon l’oracle prophétique qui préfigurait mystiquement l’avenir, c’est ainsi que les ossements %se rapprochaient les uns des autres et de même les jointures%, et que l’oracle mystérieux du prophète s’accomplissait véritablement.
        Une même force de l’Esprit divin circulait à travers tous les membres ; c’était une seule âme pour tous, la même et unique ardeur dans la foi, un seul hymne pour glorifier Dieu.
        Oui, c’étaient vraiment un culte parfait de la part des magistrats, des sacrifices de la part des prêtres, et, dans l’église, des liturgies dignes de Dieu, comportant soit le chant des psaumes et l’audition de la parole de Dieu, soit l’accomplissement de rites mystiques et divins, symboles inexprimables de la passion du Sauveur.
        Une foule où se mêlaient hommes et femmes de tout âge se livrait de tout son cœur et de toute sa force à la prière et à l’action de grâce, et avec la plus grande allégresse, honorait Dieu, auteur de tout bien.

      responsory: |-
        R/ Que règne en nos cœurs la paix du Christ !
        
        Puisque vous êtes élus, sanctifiés, aimés par Dieu,
        revêtez donc des sentiments de compassion.
        
        Pardonnez-vous mutuellement,
        comme le Seigneur vous a pardonné.
        
        Aimez-vous les uns les autres,
        comme il vous a aimés.
        
        Vous n’êtes qu’un en Jésus Christ,
        revêtez l’amour ; c’est le lien parfait.

morning:
  evangelicAntiphon:
    common: |- 
      Ce n’est pas vous qui parlerez : mais l’Esprit de votre Père parlera en vous.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur, viens au secours de ton peuple,
    >soutenu par la prière du bienheureux pape Sylvestre ; *
    conduis-le tout au long de cette vie qui passe /
    >pour qu’il mérite la joie d’entrer dans la vie sans fin.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ez 34, 11-16
      headline: « Comme un berger veille sur son troupeau, ainsi je veillerai sur mes brebis »
      content: |-
        Ainsi parle le Seigneur Dieu :
        Voici que moi-même, je m’occuperai de mes brebis,
        et je veillerai sur elles.
        Comme un berger veille sur les brebis de son troupeau
        quand elles sont dispersées,
        ainsi je veillerai sur mes brebis,
        et j’irai les délivrer dans tous les endroits où elles ont été dispersées
        un jour de nuages et de sombres nuées.
        Je les ferai sortir d’entre les peuples,
        je les rassemblerai des différents pays
        et je les ramènerai sur leur terre ;
        je les ferai paître sur les montagnes d’Israël,
        dans les vallées, dans les endroits les meilleurs.
        Je les ferai paître dans un bon pâturage,
        et leurs prairies seront sur les hauteurs d’Israël.
        Là, mes brebis se reposeront dans de belles prairies,
        elles brouteront dans de gras pâturages, sur les monts d’Israël.
        C’est moi qui ferai paître mon troupeau,
        et c’est moi qui le ferai reposer,
        - oracle du Seigneur Dieu.
        La brebis perdue, je la chercherai ;
        l’égarée, je la ramènerai.
        Celle qui est blessée, je la panserai.
        Celle qui est malade, je lui rendrai des forces.
        Celle qui est grasse et vigoureuse,
        je la garderai, je la ferai paître selon le droit.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 22 (23), 1-2ab, 2c-3, 4, 5, 6
      refAbbr: cf. 22, 1
      chorus:
      - chorusRef: cf. 22, 1
        chorus: |-
          Le Seigneur est mon berger :
          rien ne saurait me manquer.
      content: |-
        Le Seigneur est mon berger :
        je ne manque de rien.
        Sur des prés d’herbe fraîche,
        il me fait reposer.

        Il me mène vers les eaux tranquilles
        et me fait revivre ;
        il me conduit par le juste chemin
        pour l’honneur de son nom.

        Si je traverse les ravins de la mort,
        je ne crains aucun mal,
        car tu es avec moi :
        ton bâton me guide et me rassure.

        Tu prépares la table pour moi
        devant mes ennemis ;
        tu répands le parfum sur ma tête,
        ma coupe est débordante.

        Grâce et bonheur m’accompagnent
        tous les jours de ma vie ;
        j’habiterai la maison du Seigneur
        pour la durée de mes jours.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 16, 13-19 (pour un pape)
      headline: « Tu es Pierre, et sur cette pierre je bâtirai mon Église »
      acclamationAntiphon: |-
        Venez à ma suite, dit le Seigneur.
        Je vous ferai devenir pêcheurs d’hommes.
      content: |-
        En ce temps-là,
        Jésus, arrivé dans la région de Césarée-de-Philippe,
        demandait à ses disciples :
        « Au dire des gens,
        qui est le Fils de l’homme ? »
        Ils répondirent :
        « Pour les uns, Jean le Baptiste ;
        pour d’autres, Élie ;
        pour d’autres encore, Jérémie ou l’un des prophètes. »
        Jésus leur demanda :
        « Et vous, que dites-vous ? Pour vous, qui suis-je ? »
        Alors Simon-Pierre prit la parole et dit :
        « Tu es le Christ,
        le Fils du Dieu vivant ! »
        Prenant la parole à son tour, Jésus lui dit :
        « Heureux es-tu, Simon fils de Yonas :
        ce n’est pas la chair et le sang qui t’ont révélé cela,
        mais mon Père qui est aux cieux.
        Et moi, je te le déclare :
        Tu es Pierre,
        et sur cette pierre je bâtirai mon Église ;
        et la puissance de la Mort ne l’emportera pas sur elle.
        Je te donnerai les clés du royaume des Cieux :
        tout ce que tu auras lié sur la terre
        sera lié dans les cieux,
        et tout ce que tu auras délié sur la terre
        sera délié dans les cieux. »
