celebration:
  title: Sainte Thérèse-Bénédicte de la Croix
  subtitle: vierge et martyre
  description: |-
    Née le 12 octobre 1891 dans le judaïsme, Edith Stein était professeur d’université à Wroclaw (Breslau) et elle se tourna progressivement vers le Christ, malgré les difficultés nées de l’incompréhension de sa famille. Au temps de l’invasion nazie et de la persécution anti-juive, elle devint carmélite à Cologne traduisant dans sa vie les "sept demeures" de sainte Thérèse d’Avila et s’unissant, par la Croix, aux souffrances de son peuple. Réfugiée aux Pays-Bas, elle y fut arrêtée au carmel d’Echt, et elle meurt à Oswiecin (Auschwitz) huit jours plus tard, le 9 août 1942. Elle avait partagé la persécution de son peuple, portant le don de soi jusqu’au martyre pour le Christ.
    Canonisée à Rome le 11 octobre 1998, proclamée co-patronne de l’Europe le 1^er octobre 1999.
  color: red
  commons: 
    - martyr_female_virgin
    - saints-female_religious
    
oration:
  - Dieu de nos pères, tu as conduit la bienheureuse martyre Thérèse-Bénédicte à connaître ton Fils crucifié et à l’imiter jusque dans la mort ; par son intercession, accorde à tous de reconnaître dans le Christ leur Sauveur et, grâce à lui, de parvenir à te contempler pour l’éternité. Lui qui règne.

readings:
  patristicReading:
    - title: DU LIVRE « LA SCIENCE DE LA CROIX » DE SAINTE THÉRÈSE-BÉNÉDICTE DE LA CROIX, VIERGE ET MARTYRE
      content: |-
        Le Christ a pris sur lui le joug de la Loi puisqu’il l’a parfaitement accomplie et qu’il est mort pour la Loi et par elle. C’est même ainsi qu’il a délivré de la Loi ceux qui désiraient recevoir de lui la vie. Cependant ils ne pourront la recevoir que s’ils offrent leur propre vie. En effet, %ceux qui par le baptême ont été unis au Christ, c’est à sa mort qu’ils ont été unis par le baptême.%Ils se plongent dans sa vie pour devenir membres de son Corps, afin, comme tels, de souffrir avec lui, (mais aussi afin de ressusciter avec lui à la vie éternelle, à la vie divine.)
        Pour nous, cette vie n’atteindra sa plénitude qu’au jour de la Gloire. Nous y participons cependant, dès maintenant — « dans la chair » —, dans la mesure où nous %croyons% : il s’agit de croire que le Christ est mort pour nous, afin de nous donner la vie. Cette foi nous permet de devenir un avec lui, comme les membres avec la tête, et elle nous ouvre à l’effusion de sa vie. Ainsi la foi au Crucifié — la foi vive, celle qui s’accompagne du don aimant de soi —, cette foi est pour nous l’accès à la vie et le début de la gloire future ; c’est pourquoi la croix est notre unique titre de fierté : %Pour moi, que la croix de notre Seigneur Jésus Christ reste ma seule fierté. Par elle, le monde est crucifié pour moi, et moi pour le monde.%
        Celui qui a opté pour le Christ est mort au monde, et le monde est mort pour lui. Il%porte dans son corps les marques de souffrances%du Seigneur, il est faible et méprisé devant les hommes, mais précisément en cela, il est fort, car %la puissance% de Dieu %donne toute sa mesure dans la faiblesse%. Sachant cela, le disciple de Jésus n’accepte pas seulement la croix qui lui est imposée, mais il se crucifie lui-même : %Ceux qui sont au Christ Jésus ont crucifié en eux la chair, avec ses passions et ses convoitises%. Ils ont soutenu un dur combat contre leur nature, afin que meure en eux la vie du péché, et qu’advienne un espace pour la vie de l’Esprit. Seule importe cette dernière. La croix n’est pas un but en soi. Elle élève et elle dirige le regard vers le haut. Cependant, elle n’est pas seulement un signe, elle est l’arme puissante du Christ, le bâton du berger, avec lequel le David divin part affronter le Goliath infernal, avec lequel, aussi, le Christ frappe fortement à la porte du ciel et la pousse. Alors se répandent les flots de la lumière divine qui enveloppent tous ceux qui marchent à la suite du Crucifié.
      responsory: |-
        R/ Le Christ m’a aimé, il s’est livré pour moi.

        Avec le Christ, j’ai été fixé à la croix.
        Je vis, mais ce n’est plus moi,
        c’est le Christ qui vit en moi.

        Ma vie aujourd’hui dans la condition humaine,
        je la vis dans la foi au Fils de Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ga 6,14
    content: |-
      Que la croix de notre Seigneur Jésus Christ soit ma seule fierté.
      Par elle, le monde est crucifié pour moi, et moi pour le monde.
  collect:
  - |-
    Dieu de nos pères, +
    >tu as conduit la sainte martyre Thérèse-Bénédicte
    >à connaître ton Fils crucifié
    >et à l’imiter jusque dans la mort ; *
    >par son intercession,
    >accorde à tous de reconnaître dans le Christ leur Sauveur /
    >et, grâce à lui, de parvenir à te contempler pour l’éternité.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Os 2, 16b.17b.21-22
      headline: |-
        « Je ferai de toi mon épouse pour toujours »
      content: |-
        Ainsi parle le Seigneur :
        Mon épouse infidèle,
        je vais l’entraîner jusqu’au désert,
        >et je lui parlerai cœur à cœur.
        Là, elle me répondra
        >comme au temps de sa jeunesse,
        >au jour où elle est sortie du pays d’Égypte.
        Je ferai de toi mon épouse pour toujours,
        >je ferai de toi mon épouse
        dans la justice et le droit,
        >dans la fidélité et la tendresse ;
        je ferai de toi mon épouse dans la loyauté,
        >et tu connaîtras le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 44 (45), 11-12, 14-15a, 15b-16, 17
      refAbbr: 44, 11a
      chorus:
      - chorusRef: 44, 11a
        chorus: |-
          Écoute, ma fille, regarde et tends l’oreille.
      content: |-
        Écoute, ma fille, regarde et tends l’oreille :
        oublie ton peuple et la maison de ton père :
        le roi sera séduit par ta beauté.
        Il est ton Seigneur : prosterne-toi devant lui.

        Fille de roi, elle est là, dans sa gloire,
        vêtue d’étoffes d’or ;
        on la conduit, toute parée, vers le roi.
        Des jeunes filles, ses compagnes, lui font cortège.

        On les conduit parmi les chants de fête :
        elles entrent au palais du roi.
        À la place de tes pères se lèveront tes fils ;
        sur toute la terre tu feras d’eux des princes.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 25, 1-13
      headline: |-
        « Voici l’époux ! Sortez à sa rencontre »
      acclamationAntiphon: |-
        Viens, épouse du Christ, reçois la couronne
        que le Seigneur t’a préparée pour l’éternité.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples cette parabole :
        >« Le royaume des Cieux sera comparable
        >à dix jeunes filles invitées à des noces,
        >qui prirent leur lampe
        >pour sortir à la rencontre de l’époux.
        Cinq d’entre elles étaient insouciantes,
        >et cinq étaient prévoyantes :
        >les insouciantes avaient pris leur lampe sans emporter d’huile,
        >tandis que les prévoyantes avaient pris, avec leurs lampes,
        >des flacons d’huile.
        Comme l’époux tardait,
        >elles s’assoupirent toutes et s’endormirent.
        Au milieu de la nuit, il y eut un cri :
        >« Voici l’époux, sortez à sa rencontre ! »
        >Alors toutes ces jeunes filles se réveillèrent
        >et se mirent à préparer leur lampe.
        Les insouciantes demandèrent aux prévoyantes :
        >"Donnez-nous de votre huile,
        >car nos lampes s’éteignent."
        >Les prévoyantes leur répondirent :
        >"Jamais cela ne suffira pour nous et pour vous,
        >allez plutôt chez les marchands vous en acheter."
        >Pendant qu’elles allaient en acheter,
        >l’époux arriva.
        Celles qui étaient prêtes entrèrent avec lui dans la salle des noces,
        >et la porte fut fermée.
        Plus tard, les autres jeunes filles arrivèrent à leur tour et dirent :
        >"Seigneur, Seigneur, ouvre-nous !"
        >Il leur répondit :
        >"Amen, je vous le dis :
        >je ne vous connais pas."
        >Veillez donc,
        >car vous ne savez ni le jour ni l’heure. »
  offeringPrayer:
  - |-
    Dans ta bonté, Seigneur, +
    accepte les présents que nous voulons te consacrer,
    en mémoire de la sainte martyre Thérèse-Bénédicte,
    et rends-les parfaits, *
    toi qui as mené à leur perfection
    les multiples sacrifices de l’ancienne Alliance /
    dans l’unique sacrifice
    >offert par ton Fils en son propre sang.
    Lui qui vit et règne pour les siècles des siècles.
  communionAntiphon:
  - biblicalReference: Ps 22,4
    content: |-
      Si je traverse les ravins de la mort,
      je ne crains aucun mal, car tu es avec moi, Seigneur.
  prayerAfterCommunion:
  - |-
    En ce jour où nous honorons sainte Thérèse-Bénédicte,
    >Dieu de grande bonté, nous te prions : *
    >que les fruits de l’arbre de la croix
    >donnent force à nos cœurs ;
    >fidèlement attachés au Christ en ce monde,
    >nous pourrons, au paradis, manger de l’arbre de la vie.
    Par le Christ, notre Seigneur.