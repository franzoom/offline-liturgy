celebration:
  title: Sainte Thérèse d’Avila,
  subtitle: vierge et docteur de l’Église
  description: Thérèse d’Avila (1515 1583), la réformatrice du Carmel, est une contemplative et une femme d’action. La contemplative a livré le secret de sa montée vers Dieu dans des livres qui ont fait d’elle un maître de vie spirituelle. La fondatrice a parcouru l’Espagne pour y implanter ses monastères. L’âme de Thérèse était unifiée dans sa soif de vivre « seule avec le Seul ».
  commons:
  - virgins
  - saints_doctors
  color: white

oration:
  - Dieu qui as suscité par ton Esprit sainte Thérèse d’Avila pour montrer à l’Église le chemin de la perfection, fais-nous trouver notre nourriture dans sa doctrine spirituelle et brûler du désir de la véritable sainteté.

readings:
  hymn:
  - celui-qui-ne-change-pas
  patristicReading:
    - title: DE L’AUTOBIOGRAPHIE DE SAINTE THÉRÈSE
      content: |-
        En présence de Jésus Christ, si bon ami et si bon capitaine qui s’exposa le premier à la douleur, on peut tout souffrir. Il nous vient en aide et nous donne des forces jamais il ne nous fait défaut ; c’est un véritable ami. Et je vois clairement, je l’ai toujours vu depuis, que pour contenter Dieu en obtenant de lui de grandes faveurs, il veut que nous tenions tout de cette humanité sacrée, en qui sa Majesté a dit mettre toutes ses complaisances.
        Je l’ai vu très souvent par expérience : le Seigneur me l’a dit. J’ai vu clairement que nous devions entrer par cette porte, si nous voulons que la Majesté souveraine nous révèle de grands secrets.
        Que Votre grâce ne cherche donc pas un autre chemin, même si vous êtes aux sommets de la contemplation ; car ici vous êtes en sûreté. Tous les biens nous viennent de ce Seigneur, le nôtre. Il vous instruira ; considérez sa vie, c’est le meilleur modèle.
        Que voulons-nous avoir de mieux à nos côtés qu’un si bon ami qui ne nous abandonnera pas dans les peines et les tribulations, comme le font ceux du monde ? Bienheureux celui qui l’aime et le garde toujours auprès de lui. Regardons le glorieux saint Paul, on eût dit que Jésus lui sortait toujours par la bouche, tant il le gardait présent dans son cœur. Depuis que j’ai compris cela, j’ai considéré avec attention quelques saints, grands contemplatifs, et ils ne suivaient pas d’autre voie. Saint François le montre par les stigmates, saint Antoine de Padoue par l’Enfant, saint Bernard faisait ses délices de l’humanité de Jésus, sainte Catherine de Sienne, et tant d’autres. ~
        Nous devons marcher librement sur ce chemin, et nous abandonner dans les mains de Dieu ; si sa Majesté veut nous élever au rang de ses camériers et nous communiquer ses secrets, y aller de bon cœur. ~
        Chaque fois que nous pensons au Christ, rappelons-nous avec quel amour il nous a fait tant de faveurs, et la grandeur de celui que Dieu nous a témoigné en nous donnant ce gage de son amour pour nous : car amour obtient amour. Et même si nous en sommes tout à fait à nos débuts, et fort misérables, tâchons de toujours considérer cela pour éveiller l’amour en nous ; car si le Seigneur nous accorde un jour la grâce de graver cet amour dans notre cœur, tout nous sera facile, nous agirons très vite et sans le moindre effort.
      responsory: |-
        R/ Voyez quel grand amour nous est donné !

        Enfants de Dieu, nous le sommes,
        discernés par avance dans le Fils unique.

        Au prix du sang qu’il a versé,
        Jésus nous conduit vers le Père.

        Nos yeux sont fixés sur la cité de fête
        où nous verrons le visage de Dieu.

        Au-delà de toute souffrance,
        une joie éternelle nous attend.

morning:
  evangelicAntiphon:
    common: |-
      Qu’il soit béni, Celui qui nous donne tout :
      grâce à lui, nous pouvons tout.

vespers:
  evangelicAntiphon:
    common: |-
      Qu’il soit béni, Celui qui nous donne tout :
      grâce à lui, nous pouvons tout.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Ps 41,2-3
    content: |-
      Comme un cerf altéré cherche l’eau vive,
      >ainsi mon âme te cherche, toi, mon Dieu.
      Mon âme a soif de Dieu, le Dieu vivant.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as suscité par ton Esprit sainte Thérèse d’Avila
    >pour montrer à l’Église
    >le chemin de la perfection qu’elle doit rechercher ; *
    fais-nous trouver notre nourriture dans sa doctrine spirituelle /
    >et brûler du désir d’une vraie sainteté.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Rm 8, 22-27
      headline: « L’Esprit intercède par des gémissements inexprimables »
      content: |-
        Frères,
        nous le savons bien,
        >la création tout entière gémit,
        >elle passe par les douleurs d’un enfantement qui dure encore.
        Et elle n’est pas seule.
        Nous aussi, en nous-mêmes, nous gémissons ;
        >nous avons commencé à recevoir l’Esprit Saint,
        mais nous attendons notre adoption
        >et la rédemption de notre corps.
        Car nous avons été sauvés, mais c’est en espérance ;
        >voir ce qu’on espère, ce n’est plus espérer :
        >ce que l’on voit,
        >comment peut-on l’espérer encore ?
        Mais nous, qui espérons ce que nous ne voyons pas,
        >nous l’attendons avec persévérance.
        Bien plus, l’Esprit Saint vient au secours de notre faiblesse,
        >car nous ne savons pas prier comme il faut.
        L’Esprit lui-même intercède pour nous
        >par des gémissements inexprimables.
        Et Dieu, qui scrute les cœurs,
        >connaît les intentions de l’Esprit
        puisque c’est selon Dieu
        >que l’Esprit intercède pour les fidèles.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 18B (19), 8, 9, 10, 11
      refAbbr: 18B, 10cd
      chorus:
      - chorusRef: 18B, 10cd
        chorus: |-
          Les décisions du Seigneur sont justes
          et vraiment équitables.
      - chorusRef: cf. Jn 6, 63c
        chorus: |-
          ou : Tes paroles, Seigneur, sont esprit
          et elles sont vie.
      content: |-
        La loi du Seigneur est parfaite,
        qui redonne vie ;
        la charte du Seigneur est sûre,
        qui rend sages les simples.

        Les préceptes du Seigneur sont droits,
        ils réjouissent le cœur ;
        le commandement du Seigneur est limpide,
        il clarifie le regard.

        La crainte qu’il inspire est pure,
        elle est là pour toujours ;
        les décisions du Seigneur sont justes
        et vraiment équitables :

        plus désirables que l’or,
        qu’une masse d’or fin,
        plus savoureuses que le miel
        qui coule des rayons.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Jn 15, 1-8
      headline: « Celui qui demeure en moi et en qui je demeure, celui-là porte beaucoup de fruit »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Moi, je suis la vraie vigne,
        et mon Père est le vigneron.
        Tout sarment qui est en moi,
        mais qui ne porte pas de fruit,
        mon Père l’enlève ;
        tout sarment qui porte du fruit,
        il le purifie en le taillant,
        pour qu’il en porte davantage.
        Mais vous, déjà vous voici purifiés
        grâce à la parole que je vous ai dite.
        Demeurez en moi, comme moi en vous.
        De même que le sarment
        ne peut pas porter de fruit par lui-même
        s’il ne demeure pas sur la vigne,
        de même vous non plus,
        si vous ne demeurez pas en moi.
        Moi, je suis la vigne,
        et vous, les sarments.
        Celui qui demeure en moi
        et en qui je demeure,
        celui-là porte beaucoup de fruit,
        car, en dehors de moi, vous ne pouvez rien faire.
        Si quelqu’un ne demeure pas en moi,
        il est, comme le sarment, jeté dehors,
        et il se dessèche.
        Les sarments secs, on les ramasse,
        on les jette au feu, et ils brûlent.
        Si vous demeurez en moi,
        et que mes paroles demeurent en vous,
        demandez tout ce que vous voulez,
        et cela se réalisera pour vous.
        Ce qui fait la gloire de mon Père,
        c’est que vous portiez beaucoup de fruit
        et que vous soyez pour moi des disciples. »
        Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Que nos offrandes puissent te plaire, Dieu de majesté,
    >toi qui acceptas si volontiers
    >l’hommage de l’amour empressé /
    >de sainte Thérèse.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Ps 88,2
    content: |-
      L’amour du Seigneur, sans fin je le chante ;
      >ta fidélité, je l’annonce d’âge en âge.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >donne à la famille de ceux qui te servent,
    >déjà rassasiée par le pain du ciel,
    de connaître, comme sainte Thérèse, /
    >la joie de chanter ta miséricorde pour l’éternité.
    Par le Christ, notre Seigneur.