celebration:
  title: Sainte Thérèse de l’Enfant-Jésus,
  subtitle: vierge et docteur de l’Église
  description: Thérèse Martin (1873-1897), devenue au carmel de Lisieux Thérèse de l’Enfant Jésus et de la Sainte Face, a réalisé dans sa courte vie le programme que lui traçait son nom de religieuse. Elle a voulu entrer dans l’esprit d’enfance de Jésus de Nazareth, en suivant sa « petite voie », et elle a rencontré le Christ de la Passion, qui devait l’introduire dans sa Pâque.
  commons:
  - virgins
  - saints_doctors
  color: white

oration:
  - Dieu qui ouvres ton Royaume aux petits et aux humbles, donne-nous de marcher avec confiance sur les pas de sainte Thérèse de l’Enfant-Jésus, pour obtenir ainsi la révélation de ta gloire.

readings:
  hymn:
  - therese-de-l-enfant-jesus

  patristicReading:
    - title: LETTRE DE STE THÉRÈSE À SŒUR MARIE DU SACRÉ-CŒUR
      subtitle: 8 septembre 1896
      content: |-
        À l’oraison, mes désirs me faisant souffrir un véritable martyre, j’ouvris les épîtres de Saint Paul afin de chercher quelque réponse. Les chapitres XII et XIII de la première épître aux Corinthiens me tombèrent sous les yeux… J’y lus, dans le premier, que tous ne peuvent être apôtres, prophètes, docteurs ;.. que l’Église est composée de différents membres et que l’œil ne saurait être en même temps la main… La réponse était claire mais ne comblait pas mes désirs, elle ne me donnait pas la paix… ~
        Sans me décourager je continuai ma lecture et cette phrase me soulagea : « %Recherchez avec ardeur les dons les plus parfaits, mais je vais encore vous montrer une voie plus excellente% ». Et l’Apôtre explique comment tous les dons les plus parfaits ne sont rien sans l’Amour… Que la Charité est la voie excellente qui conduit sûrement à Dieu. Enfin j’avais trouvé le repos…
        Considérant le corps mystique de l’Église, je ne m’étais reconnue dans aucun des membres décrits par Saint Paul, ou plutôt je voulais me reconnaître en tous… La charité me donna la clé de ma vocation. Je compris que si l’Église avait un corps, composé de différents membres, le plus nécessaire, le plus noble de tous ne lui manquait pas ; je compris que l’Église avait un Cœur, et que ce Cœur était brûlant d’amour. Je compris que l’Amour seul faisait agir les membres de l’Église, que si l’Amour venait à s’éteindre, les Apôtres n’annonceraient plus l’Évangile, les Martyrs refuseraient de verser leur sang… Je compris que l’amour renfermait toutes les vocations, que l’amour était tout, qu’il embrassait tous les temps et tous les lieux… ; en un mot, qu’il est éternel !…
        Alors, dans l’excès de ma joie délirante, je me suis écriée : Ô Jésus, mon Amour… ma vocation, enfin je l’ai trouvée, ma vocation, c’est l’amour !…
        Oui, j’ai trouvé ma place dans l’Église et cette place, ô mon Dieu, c’est vous qui me l’avez donnée… dans le Cœur de l’Église, ma Mère, je serai l’Amour… ainsi, je serai tout… ainsi mon rêve sera réalisé ! ! !…
      responsory: |-
        R/ Voyez quel grand amour nous est donné !

        Enfants de Dieu, nous le sommes,
        discernés par avance dans le Fils unique.

        Au prix du sang qu’il a versé,
        Jésus nous conduit vers le Père.

        Nos yeux sont fixés sur la cité de fête
        où nous verrons le visage de Dieu.

        Au-delà de toute souffrance,
        une joie éternelle nous attend.

morning:
  evangelicAntiphon:
    common: Changez vos cœurs, devenez comme des enfants, et vous entrerez dans le Royaume.

vespers:
  evangelicAntiphon:
    common: |-
      Réjouissez-vous, exultez : vos noms sont inscrits dans le ciel.

mass:
- massType: DAY_MASS
  note: En France, on peut choisir comme première lecture le second texte proposé ci-dessous (Rm 8, 14-17) à la place du premier (Is 66, 10-14c).
  entranceAntiphon:
  - biblicalReference: cf. Dt 32,10-12
    content: |-
      Le Seigneur a entouré sainte Thérèse,
      >il l’a instruite, il l’a gardée comme la prunelle de l’œil.
      Comme l’aigle qui déploie ses ailes et emporte ses petits,
      >le Seigneur seul l’a conduite.
  collect:
  - |-
    Seigneur Dieu, +
    >tu ouvres ton Royaume aux humbles et aux petits ; *
    >donne-nous de marcher avec confiance
    >sur la voie tracée par sainte Thérèse de l’Enfant-Jésus, /
    >afin que, par son intercession,
    >ta gloire éternelle nous soit révélée.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit,
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Is 66, 10-14c
      headline: « Comme une mère console son enfant »
      content: |-
        Réjouissez-vous avec Jérusalem !
        Exultez en elle, vous tous qui l’aimez !
        Avec elle, soyez pleins d’allégresse,
        >vous tous qui la pleuriez !
        Alors, vous serez nourris de son lait,
        >rassasiés de ses consolations ;
        alors, vous goûterez avec délices
        >à l’abondance de sa gloire.
        Car le Seigneur le déclare :
        >« Voici que je dirige vers elle
        >la paix comme un fleuve
        >et, comme un torrent qui déborde,
        >la gloire des nations. »
        Vous serez nourris, portés sur la hanche ;
        >vous serez choyés sur ses genoux.
        Comme un enfant que sa mère console,
        >ainsi, je vous consolerai.
        Oui, dans Jérusalem, vous serez consolés.
        Vous verrez, votre cœur sera dans l’allégresse ;
        >et vos os revivront comme l’herbe reverdit.
        Le Seigneur fera connaître sa puissance à ses serviteurs.
        
    - biblicalRef: Rm 8, 14-17
      headline: « Nous sommes enfants de Dieu »
      content: |-
        Frères,
        tous ceux qui se laissent conduire par l’Esprit de Dieu,
        >ceux-là sont fils de Dieu.
        Vous n’avez pas reçu un esprit qui fait de vous des esclaves
        >et vous ramène à la peur ;
        mais vous avez reçu un Esprit qui fait de vous des fils ;
        >et c’est en lui que nous crions « Abba ! »,
        >c’est-à-dire : Père !
        C’est donc l’Esprit Saint lui-même qui atteste à notre esprit
        >que nous sommes enfants de Dieu.
        Puisque nous sommes ses enfants,
        >nous sommes aussi ses héritiers :
        >héritiers de Dieu,
        >héritiers avec le Christ,
        si du moins nous souffrons avec lui
        >pour être avec lui dans la gloire.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 130 (131), 1, 2, 3
      refAbbr: null
      chorus:
      - chorusRef: null
        chorus: |-
          Garde mon âme dans la paix
          près de toi, Seigneur.
      content: |-
        Seigneur, je n’ai pas le cœur fier
        ni le regard ambitieux ;
        je ne poursuis ni grands desseins,
        ni merveilles qui me dépassent.

        Non, mais je tiens mon âme
        égale et silencieuse ;
        mon âme est en moi comme un enfant,
        comme un petit enfant contre sa mère.

        Attends le Seigneur, Israël,
        maintenant et à jamais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 18, 1-5
      headline: « Si vous ne changez pas pour devenir comme les enfants, vous n’entrerez pas dans le royaume des Cieux »
      acclamationAntiphon: |-
        Tu es béni, Père,
        Seigneur du ciel et de la terre,
        tu as révélé aux tout-petits les mystères du Royaume !
      content: |-
        À ce moment-là, les disciples s’approchèrent de Jésus et lui dirent :
        >« Qui donc est le plus grand
        >dans le royaume des Cieux ? »
        Alors Jésus appela un petit enfant ;
        >il le plaça au milieu d’eux,
        et il déclara :
        >« Amen, je vous le dis :
        >si vous ne changez pas
        >pour devenir comme les enfants,
        >vous n’entrerez pas dans le royaume des Cieux.
        Mais celui qui se fera petit comme cet enfant,
        >celui-là est le plus grand dans le royaume des Cieux.
        Et celui qui accueille un enfant comme celui-ci en mon nom,
        >il m’accueille, moi. »
        >Acclamons la Parole de Dieu.
  offeringPrayer:
  - |-
    Nous proclamons tes merveilles,
    >accomplies en sainte Thérèse,
    >Seigneur, Dieu de majesté’,
    >et nous te supplions humblement ; *
    >toi qui appréciais les mérites de sa vie : /
    >accepte l’hommage de notre service.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Mt 18,3
    content: |-
      Si vous ne changez pas,
      >pour devenir comme des enfants, dit le Seigneur,
      vous n’entrerez pas dans le royaume des Cieux.
  prayerAfterCommunion:
  - |-
    Par le sacrement que tu nous as donné, Seigneur, +
    >allume en nous cet amour ardent
    >qui incitait sainte Thérèse à s’attacher à toi /
    >et à désirer obtenir ta miséricorde pour tous.
    Par le Christ, notre Seigneur.