celebration:
  title: Saint Thomas d’Aquin
  subtitle: prêtre et docteur de l’Église
  description: |-
    Thomas d’Aquin (1225-1274) a réalisé en plénitude l’idéal dominicain : contempler et transmettre aux autres le fruit de sa contemplation. Philosophe et théologien, professeur, Thomas a beaucoup réfléchi, beaucoup enseigné, beaucoup écrit. Mais, contemplatif avant tout, il a surtout beaucoup prié et il s’est soumis à une rude discipline pour accéder à la pure Lumière.
  commons:
  - pastors
  - pastors_doctors
  - saints_doctors
  color: white

oration:
- Dieu qui as fait de saint Thomas d’Aquin un modèle admirable par sa recherche d’une vie sainte et son amour de la science sacrée, accorde-nous de comprendre ses enseignements et de suivre ses exemples.

readings:
  patristicReading:
  - title: CONFÉRENCE DE SAINT THOMAS D’AQUIN À SES ÉTUDIANTS SUR LE CREDO
    content: |-
      Quelle nécessité y avait-il à ce que le Fils de Dieu souffrît pour nous ? Une grande nécessité, que l’on peut résumer en deux points : nécessité de remède à l’égard de nos péchés, nécessité d’exemple pour notre conduite.
      Pour ce qui est du remède contre tous les maux que nous inflige le péché, nous trouvons un remède grâce à la passion du Christ. ~
      Mais son utilité n’est pas moindre à l’égard de l’exemple. Car la passion du Christ nous fournit un modèle valable pour toute notre vie. En effet, celui qui veut mener la vie parfaite n’a rien d’autre à faire qu’à mépriser ce que le Christ a méprisé sur la croix et à désirer ce que le Christ a désiré. Car aucun exemple de vertu n’est absent de la croix.
      Si tu cherches un exemple de charité : %Il n’y a pas de plus grand amour que de donner sa vie pour ses amis%. C’est ce que le Christ a fait sur la croix. Et par conséquent, s’il a donné sa vie pour nous, il ne doit pas être trop dur de supporter n’importe quel mal pour lui. ~
      Si tu cherches la patience, c’est sur la croix qu’on la trouve au maximum. En effet la patience est grande pour deux motifs : ou bien lorsqu’on souffre patiemment de grands maux, ou bien lorsqu’on souffre des maux qu’on aurait pu éviter, et que l’on n’évite pas. Or le Christ a souffert de grands maux sur la croix, et avec patience, puisque%couvert d’insultes il ne menaçait pas ; comme une brebis conduite à l’abattoir, il n’ouvrait pas la bouche%. ~ Elle est donc grande, la patience du Christ sur la croix : %Par la patience, courons au combat qui nous est proposé, les yeux fixés sur Jésus, qui est à l’origine et au terme de la foi. Renonçant à la joie qui lui était proposée, il a enduré, sans avoir de honte, l’humiliation de la croix%.
      Si tu cherches un exemple d’humilité, regarde le crucifié. Car un Dieu a voulu être jugé sous Ponce Pilate, et mourir. ~
      Si tu cherches un exemple d’obéissance, tu n’as qu’à suivre celui qui s’est fait obéissant au Père jusqu’à la mort : %De même que la faute commise par un seul, %c’est-à-dire Adam, %a rendu tous les hommes pécheurs, de même tous deviendront justes par l’obéissance d’un seul.%
      Si tu cherches un exemple de mépris pour les biens terrestres, tu n’as qu’à suivre celui qui est%le Roi des rois et le Seigneur des seigneurs, en qui sont cachés tous les trésors de la sagesse et de la connaissance% ; sur la croix, il est nu, tourné en dérision, couvert de crachats, frappé, couronné d’épines, enfin abreuvé de fiel et de vinaigre.
      Ne sois donc pas attaché aux vêtements et aux richesses, car%ils se sont partagé mes habits% ; ni aux honneurs, car j’ai subi les moqueries et les coups ; ni aux dignités car, %tressant une couronne d’épines, ils l’ont enfoncée sur ma tête% ; ni aux plaisirs car, %dans ma soif, ils m’ont abreuvé de vinaigre%.
    responsory: |-
      [rubric](Stance)[/rubric]
      Ta mort est vaine aux yeux de chair :
      mais, pour celui qui croit,
      elle est vie éternelle.
      Jésus, tu es vainqueur
      chaque fois que dans l’homme,
      l’Esprit peut s’écrier :
      « Tu es le Christ,
      le Fils du Dieu vivant » !

      R/ Tu es le Fils du Dieu vivant,
      Tu es le Seigneur !

      Comme un surgeon, tu as grandit devant nous,
      racine vive sur notre terre aride,
      et nous te méprisons.

      Tu as donné ta vie, tu as été comblé.
      Après l’épreuve, tu as vu la lumière :
      maintenant nos yeux s’ouvrent.

      Tous nos regards se tournet vers toi :
      tu es le Messie, le Saint d’Israël ;
      pour toi chantent nos cœurs.

morning:
  evangelicAntiphon:
    common:

    - Bénis soit le Seigneur ! Thomas l’a aimé dans la prière, le travail et la recherche de la vérité.
vespers:
  evangelicAntiphon:
    common:
    - À ceux qui la désirent la Sagesse est donnée ; ceux qui la possèdent deviennent amis de Dieu.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as fait de saint Thomas d’Aquin
    >un modèle admirable par son désir ardent de sainteté
    >et l’étude de la science sacrée ; *
    accorde-nous de contempler par l’intelligence ce qu’il a enseigné  /
    >et d’accomplir ce qu’il a lui-même pratiqué.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Sg 7, 7-10.15-16
      headline: « Plus que la santé et la beauté, j’ai aimé la sagesse »
      content: |-
        J’ai prié,
        >et le discernement m’a été donné.
        J’ai supplié,
        >et l’esprit de la Sagesse est venu en moi.
        Je l’ai préférée aux trônes et aux sceptres ;
        >à côté d’elle, j’ai tenu pour rien la richesse ;
        je ne l’ai pas comparée à la pierre la plus précieuse ;
        tout l’or du monde auprès d’elle n’est qu’un peu de sable,
        >et, en face d’elle, l’argent sera regardé comme de la boue.
        Plus que la santé et la beauté, je l’ai aimée ;
        je l’ai choisie de préférence à la lumière,
        >parce que sa clarté ne s’éteint pas.
        Que Dieu m’accorde de parler comme je comprends,
        >et de concevoir une pensée à la mesure de ses dons,
        puisque lui-même guide la Sagesse
        >et dirige les sages ;
        car nous sommes dans sa main :
        >nous-mêmes, nos paroles,
        >toute notre intelligence et notre savoir-faire.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 118 (119), 9-10, 11-12, 13-14
      refAbbr: 118, 12b
      chorus:
      - chorusRef: 118, 12b
        chorus: Apprends-moi, Seigneur, tes commandements.
      content: |-
        Comment, jeune, garder pur son chemin ?
        En observant ta parole.
        De tout mon cœur, je te cherche ;
        garde-moi de fuir tes volontés.

        Dans mon cœur, je conserve tes promesses
        pour ne pas faillir envers toi.
        Toi, Seigneur, tu es béni :
        apprends-moi tes commandements.

        Je fais repasser sur mes lèvres
        chaque décision de ta bouche.
        Je trouve dans la voie de tes exigences
        plus de joie que dans toutes les richesses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 23, 8-12
      headline: « Ne vous faites pas donner le titre de maîtres, car vous n’avez qu’un seul maître, le Christ »
      acclamationAntiphon: |-
        Vous n’avez qu’un seul Père,
        celui qui est aux cieux ;
        vous n’avez qu’un seul maître, le Christ.
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        « Ne vous faites pas donner le titre de Rabbi,
        car vous n’avez qu’un seul maître pour vous enseigner,
        et vous êtes tous frères.
        Ne donnez à personne sur terre le nom de père,
        car vous n’avez qu’un seul Père, celui qui est aux cieux.
        Ne vous faites pas non plus donner le titre de maîtres,
        car vous n’avez qu’un seul maître, le Christ.
        Le plus grand parmi vous sera votre serviteur.
        Qui s’élèvera sera abaissé,
        qui s’abaissera sera élevé. »
