celebration:
  title: Saint Timothée et Saint Tite
  subtitle: évêques
  description: Timothée et Tite furent, avec Luc, les fidèles collaborateurs de saint Paul. Le premier, élevé par une mère juive, avait été baptisé par Paul, et il le suivit dans ses missions avant d’être établi par lui la tête de l’Église d’Éphèse. Quant à Tite, Paul se l’adjoignit à Antioche dès le début de son apostolat. Il lui confia ensuite l’évangélisation de la Crète.
  commons:
  - pastors_multiple
  color: white

oration:
- Dieu qui as donné à Tite et à Timothée une vertu digne des Apôtres, fais que soutenus par leurs prières, vivant avec justice et piété dans ce monde, nous parvenions au ciel, notre patrie.

readings:
  patristicReading:
  - title: HOMÉLIE DE SAINT JEAN CHRYSOSTOME À LA LOUANGE DE PAUL
    content: |-
      La prison où demeurait saint Paul était pour lui comme le ciel même, et il accueillait les blessures des fouets avec plus de plaisir qu’on ne saisit le prix remporté à la course ; il n’aimait pas moins ses épreuves que des récompenses, car il les considérait comme des récompenses, et c’est pour cela qu’il les appelait une grâce. Remarquons-le c’était une récompense que%s’en aller pour être avec le Christ%; tandis que%demeurer dans ce monde%, c’était le combat ; et pourtant, il dit qu’il préfère à la récompense le combat, qui est%plus nécessaire. Être maudit, séparé du Christ%, c’était cela le combat et l’épreuve, c’était même bien davantage ; être avec lui, c’était la récompense. Mais, à cause du Christ, Paul a choisi le combat plutôt que la récompense.
      On dira peut-être que tout cela lui était doux, à cause du Christ. Je le reconnais aussi, car ce qui est pour nous cause de tristesse produisait en lui un grand plaisir. Mais peu importent les dangers et les autres misères. Il se trouvait dans cette tristesse continuelle qui lui fait dire : %Qui est faible sans que je sois faible ? Qui vient à tomber sans qu’un feu me brûle ?%~
      Je vous exhorte à ne pas admirer seulement, mais aussi à imiter ce modèle de vertu, car c’est ainsi que nous pourrons participer à sa victoire.
      Si tu es étonné d’entendre dire qu’il suffit de suivre le même chemin pour obtenir le même succès, écoute-le parler de lui-même : %Je me suis bien battu, j’ai tenu jusqu’au bout de la course, je suis resté fidèle. Je n’ai plus qu’à recevoir la récompense du vainqueur ; dans sa justice, le Seigneur, le juge impartial, me la remettra en ce jour-là. Non pas seulement à moi, mais aussi à ceux qui désirent sa venue%. Tu vois comment il nous appelle tous à partager son sort. Et puisque cela est offert à tous, nous devons tous nous efforcer de mériter ces biens qui nous sont promis.
      Ne regardons pas seulement en saint Paul l’éminence et l’ampleur de ses hauts faits, mais aussi la vigueur de son désir qui l’a fait parvenir à une telle grâce, alors qu’il est de la même nature que nous, partageant avec nous toutes ses ressources. Ainsi les exploits les plus ardus nous paraîtront faciles et doux et en peinant pendant cette vie brève, nous parviendrons à remporter la couronne impérissable et immortelle par la grâce et la bonté de Jésus Christ notre Seigneur, à qui appartiennent gloire et puissance, maintenant et toujours et pour les siècles des siècles. Amen.
    responsory: |-
      R/ En Dieu notre confiance :
      il nous pourvoit de tout avec générosité.

      Combats le bon combat,
      conquiers la vie éternelle
      à laquelle tu as été appelé.

      N’amassez pas de trésors sur la terrasse
      mais dans le ciel,
      et débordez d’action de grâce.

morning:
  evangelicAntiphon:
    common:

    - Proclame la parole à temps et à contre-temps, toujours avec patience et souci d’enseigner.
vespers:
  evangelicAntiphon:
    common:
    - Vivons avec justice et droiture, attendons la venue du Seigneur.

mass:
- massType: DAY_MASS
  note: La première lecture (l’un des deux textes au choix) est obligatoire.
  entranceAntiphon:
  - biblicalReference: Ps 95,3-4
    content: |-
      Annoncez parmi les nations la gloire du Seigneur,
      >chez tous les peuples ses merveilles,
      car il est grand, le Seigneur, hautement loué !
  collect:
  - |-
    Seigneur Dieu, /
    >dans les bienheureux Timothée et Tite
    >tu as fait rayonner les vertus des Apôtres ; *
    accorde-nous, par leur intercession,
    >de vivre dans ce monde avec justice et piété /
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - number: 1
      biblicalRef: 2 Tm 1, 1-8
      headline: « J’ai souvenir de la foi sincère qui est en toi »
      content: |-
        Paul, apôtre du Christ Jésus
        >par la volonté de Dieu,
        >selon la promesse de la vie
        >que nous avons dans le Christ Jésus,
        à Timothée,
        >mon enfant bien-aimé.
        À toi, la grâce, la miséricorde et la paix
        de la part de Dieu le Père
        >et du Christ Jésus notre Seigneur.
        Je suis plein de gratitude envers Dieu,
        >à qui je rends un culte avec une conscience pure,
        >à la suite de mes ancêtres,
        je lui rends grâce en me souvenant continuellement de toi
        >dans mes prières, nuit et jour.
        Me rappelant tes larmes,
        >j’ai un très vif désir de te revoir
        >pour être rempli de joie.
        J’ai souvenir de la foi sincère qui est en toi :
        c’était celle qui habitait d’abord Loïs, ta grand-mère,
        >et celle d’Eunice, ta mère,
        >et j’ai la conviction que c’est aussi la tienne.
        Voilà pourquoi, je te le rappelle, ravive le don gratuit de Dieu,
        >ce don qui est en toi depuis que je t’ai imposé les mains.
        Car ce n’est pas un esprit de peur que Dieu nous a donné,
        >mais un esprit de force, d’amour et de pondération.
        N’aie donc pas honte de rendre témoignage à notre Seigneur,
        >et n’aie pas honte de moi, qui suis son prisonnier ;
        mais, avec la force de Dieu, prends ta part des souffrances
        >liées à l’annonce de l’Évangile.
        Parole du Seigneur.
    - number: 2
      biblicalRef: Tt 1, 1-5
      headline: « Tite, mon enfant selon la foi qui nous est commune »
      content: |-
        Paul, serviteur de Dieu,
        apôtre de Jésus Christ
        >au service de la foi de ceux que Dieu a choisis
        >et de la pleine connaissance de la vérité
        >qui est en accord avec la piété.
        Nous avons l’espérance de la vie éternelle,
        >promise depuis toujours par Dieu qui ne ment pas.
        Aux temps fixés, il a manifesté sa parole
        >dans la proclamation de l’Évangile
        >qui m’a été confiée par ordre de Dieu notre Sauveur.
        Je m’adresse à toi, Tite, mon véritable enfant
        >selon la foi qui nous est commune :
        à toi, la grâce et la paix
        >de la part de Dieu le Père
        >et du Christ Jésus notre Sauveur.
        Si je t’ai laissé en Crète,
        >c’est pour que tu finisses de tout organiser
        et que, dans chaque ville, tu établisses des Anciens
        >comme je te l’ai commandé moi-même.
        
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 95 (96), 1-2a, 2b-3, 7-8a, 9-10a
      refAbbr: cf. 95, 3
      chorus:
      - chorusRef: cf. 95, 3
        chorus: |-
          Racontez à tous les peuples
          les merveilles du Seigneur !
      content: |-
        Chantez au Seigneur un chant nouveau,
        chantez au Seigneur, terre entière,
        chantez au Seigneur et bénissez son nom !

        De jour en jour, proclamez son salut,
        racontez à tous les peuples sa gloire,
        à toutes les nations ses merveilles !

        Rendez au Seigneur, familles des peuples,
        rendez au Seigneur, la gloire et la puissance,
        rendez au Seigneur la gloire de son nom.

        Adorez le Seigneur, éblouissant de sainteté :
        tremblez devant lui, terre entière.
        Allez dire aux nations : « Le Seigneur est roi ! »
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 10, 1-9
      headline: « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Le Seigneur m’a envoyé
        porter la Bonne Nouvelle aux pauvres,
        annoncer aux captifs leur libération.
      content: |-
        En ce temps-là,
        parmi les disciples,
        le Seigneur en désigna encore 72,
        et il les envoya deux par deux, en avant de lui,
        en toute ville et localité où lui-même allait se rendre.
        Il leur dit :
        « La moisson est abondante,
        mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        d’envoyer des ouvriers pour sa moisson.
        Allez ! Voici que je vous envoie
        comme des agneaux au milieu des loups.
        Ne portez ni bourse, ni sac, ni sandales,
        et ne saluez personne en chemin.
        Mais dans toute maison où vous entrerez,
        dites d’abord :
        "Paix à cette maison."
        S’il y a là un ami de la paix,
        votre paix ira reposer sur lui ;
        sinon, elle reviendra sur vous.
        Restez dans cette maison,
        mangeant et buvant ce que l’on vous sert ;
        car l’ouvrier mérite son salaire.
        Ne passez pas de maison en maison.
        Dans toute ville où vous entrerez
        et où vous serez accueillis,
        mangez ce qui vous est présenté.
        Guérissez les malades qui s’y trouvent
        et dites-leur :
        "Le règne de Dieu s’est approché de vous." »
        
  offeringPrayer:
  - |-
    Nous t’en prions, Seigneur : +
    >accueille les offrandes que ton peuple te présente
    >en la fête des bienheureux Timothée et Tite ; *
    et, dans ta bonté, donne-nous un cœur pur /
    >qui te soit agréable.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Mc 16,15; Mt 28,20
    content: |-
      Allez dans le monde entier, proclamez l’Évangile :
      >moi, je suis avec vous tous les jours, dit le Seigneur.
  prayerAfterCommunion:
  - |-
    Seigneur notre Dieu, +
    >que le sacrement reçu nourrisse en nous la foi
    >enseignée par la prédication des Apôtres /
    et gardée avec sollicitude
    >par les bienheureux Timothée et Tite.
    Par le Christ, notre Seigneur.