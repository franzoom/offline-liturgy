celebration:
  title: Saint Vincent de Paul
  subtitle: prêtre
  description: Vincent de Paul (1581-1660), le fondateur des Prêtres de la Mission et des Filles de la Charité, est l’un des maîtres de la spiritualité française du 17e siècle. Mais il est surtout le type achevé de la charité chrétienne, qui va au devant de toutes les misères pour les secourir, car elle découvre dans le visage de tout être souffrant les traits de son Seigneur.
  commons:
  - pastors
  - saints-male_caritative
  color: white

oration:
  - Seigneur, tu as donné à saint Vincent de Paul toutes les qualités d’un apôtre pour secourir les pauvres et former les prêtres ; accorde-nous une pareille ardeur pour aimer ce qu’il a aimé et pratiquer ce qu’il a enseigné.

readings:
  patristicReading:
    - title: ENTRETIENS DE SAINT VINCENT AVEC LES FILLES DE LA CHARITÉ
      content: |-
        Nous ne devons pas considérer un pauvre paysan ou une pauvre femme selon leur extérieur, ni selon ce qui paraît de la portée de leur esprit ; d’autant que bien souvent ils n’ont presque pas la figure ni l’esprit de personnes raisonnables. ~ Mais tournez la médaille, et vous verrez par les lumières de la foi que le Fils de Dieu, qui a voulu être pauvre, nous est représenté par ces pauvres ; qu’il n’avait presque pas la figure d’un homme en sa Passion, et qu’il passait pour fou dans l’esprit des Gentils, et pour pierre de scandale dans celui des Juifs ; et avec tout cela, il se qualifie l’évangéliste des pauvres : %Il m’a envoyé porté la Bonne Nouvelle aux pauvres.%
        Ô Dieu ! qu’il fait beau voir les pauvres, si nous les considérons en Dieu et dans l’estime que Jésus Christ en a faite ! Mais, si nous les regardons selon les sentiments de la chair et de l’esprit mondain, ils paraîtront méprisables. ~
        Dieu aime les pauvres, et par conséquent il aime ceux qui aiment les pauvres ; car, lorsqu’on aime bien quelqu’un, on a de l’affection pour ses amis et pour ses serviteurs. Or la petite Compagnie de la Mission tâche de s’appliquer avec affection à servir les pauvres, qui sont les bien-aimés de Dieu ; et aussi nous avons sujet d’espérer que, pour l’amour d’eux, Dieu nous aimera. ~
        Il ne faut pas de retardement en ce qui est du service des pauvres. Si, à l’heure de votre oraison, le matin, vous devez allez porter une médecine, oh ! allez-y en repos ; offrez à Dieu votre action, unissez votre intention à l’oraison qui se fait à la maison, ou ailleurs, et allez-vous-en sans inquiétude.
        Si, quand vous serez de retour, votre commodité vous permet de faire quelque peu d’oraison ou de lecture spirituelle, à la bonne heure ! Mais il ne vous faut point inquiéter, ni croire avoir manqué, quand vous la perdrez ; car on ne la perd pas quand on la quitte pour un sujet légitime. Et s’il y a sujet légitime, mes chères filles, c’est le service du prochain.
        Ce n’est point quitter Dieu que quitter Dieu pour Dieu, c’est-à-dire une œuvre de Dieu pour en faire une autre, ou de plus grande obligation, ou de plus grand mérite. Vous quittez l’oraison ou la lecture, ou vous perdez le silence pour assister un pauvre, oh ! sachez, mes filles, que faire tout cela, c’est le servir. ~
        Car, voyez-vous, la charité est par-dessus toutes les règles, et il faut que toutes se rapportent à celle-là. C’est une grande dame. Il faut faire ce qu’elle commande. ~
        Allons donc, et nous employons avec un nouvel amour à servir les pauvres, et même cherchons les plus pauvres et les plus abandonnés ; reconnaissons devant Dieu que ce sont nos seigneurs et nos maîtres, et que nous sommes indignes de leur rendre nos petits services.
      responsory: |-
        R/ Seigneur Jésus, tu t’es fait pauvre,
        afin de nous enrichir par ta pauvreté.

        Heureux les pauvres de cœur :
        le royaume des Cieux est à eux.

        Donne à celui qui te demande,
        ne tourne pas le dos à qui veut t’emprunter.

morning:
  evangelicAntiphon:
    common: Vincent était le consolateur des affligés, le défenseur des enfants et des veuves.

vespers:
  evangelicAntiphon:
    common: Ce que vous avez fait à l’un de ces petits, c’est à moi que vous l’avez fait.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: Lc 4,18 Vg (Is 61,1)
    content: |-
      L’Esprit du Seigneur est sur moi,
      >parce que le Seigneur m’a consacré par l’onction.
      Il m’a envoyé porter la Bonne Nouvelle aux pauvres,
      >guérir les cœurs brisés.
  collect:
  - |-
    Seigneur Dieu, +
    >tu as donné au prêtre saint Vincent de Paul
    >toutes les qualités d’un apôtre
    >afin de secourir les pauvres et de former les prêtres ; *
    >accorde-nous la même ferveur
    >pour aimer ce qu’il a aimé /
    >et pratiquer ce qu’il a enseigné.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 1 Co 1, 26-31
      headline: |-
        « Ce qu’il y a de faible dans le monde, voilà ce que Dieu a choisi »
      content: |-
        Frères,
        vous qui avez été appelés par Dieu, regardez bien :
        parmi vous, il n’y a pas beaucoup de sages aux yeux des hommes,
        >ni de gens puissants ou de haute naissance.
        Au contraire, ce qu’il y a de fou dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion les sages ;
        ce qu’il y a de faible dans le monde,
        >voilà ce que Dieu a choisi,
        >pour couvrir de confusion ce qui est fort ;
        ce qui est d’origine modeste, méprisé dans le monde,
        ce qui n’est pas,
        >voilà ce que Dieu a choisi,
        >pour réduire à rien ce qui est ;
        ainsi aucun être de chair ne pourra s’enorgueillir devant Dieu.
        C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus,
        >lui qui est devenu pour nous sagesse venant de Dieu,
        >justice, sanctification, rédemption.
        Ainsi, comme il est écrit :
        >Celui qui veut être fier,
        >qu’il mette sa fierté dans le Seigneur.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 111 (112), 1-2, 3-4, 5-6, 7-8, 9
      refAbbr: 111, 1a
      chorus:
      - chorusRef: 111, 1a
        chorus: |-
          Heureux qui craint le Seigneur.
      - chorusRef: null
        chorus: |-
          ou : Alléluia !
      content: |-
        Heureux qui craint le Seigneur,
        qui aime entièrement sa volonté !
        Sa lignée sera puissante sur la terre ;
        la race des justes est bénie.

        Les richesses affluent dans sa maison :
        à jamais se maintiendra sa justice.
        Lumière des cœurs droits, il s’est levé dans les ténèbres,
        homme de justice, de tendresse et de pitié.

        L’homme de bien a pitié, il partage ;
        il mène ses affaires avec droiture.
        Cet homme jamais ne tombera ;
        toujours on fera mémoire du juste.

        Il ne craint pas l’annonce d’un malheur :
        le cœur ferme, il s’appuie sur le Seigneur.
        Son cœur est confiant, il ne craint pas :
        il verra ce que valaient ses oppresseurs.

        À pleines mains, il donne au pauvre ;
        à jamais se maintiendra sa justice,
        sa puissance grandira, et sa gloire !
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 9, 35-38
      headline: |-
        « La moisson est abondante, mais les ouvriers sont peu nombreux »
      acclamationAntiphon: |-
        Je suis le bon pasteur, dit le Seigneur ;
        je connais mes brebis
        et mes brebis me connaissent.
      content: |-
        En ce temps-là,
        Jésus parcourait toutes les villes et tous les villages,
        >enseignant dans leurs synagogues,
        >proclamant l’Évangile du Royaume
        >et guérissant toute maladie et toute infirmité.
        Voyant les foules, Jésus fut saisi de compassion envers elles
        >parce qu’elles étaient désemparées et abattues
        >comme des brebis sans berger.
        Il dit alors à ses disciples :
        >« La moisson est abondante,
        >mais les ouvriers sont peu nombreux.
        Priez donc le maître de la moisson
        >d’envoyer des ouvriers pour sa moisson. »
  offeringPrayer:
  - |-
    Seigneur Dieu, +
    >tu as donné à saint Vincent,
    >de conformer toute sa vie
    >aux saints mystères qu’il célébrait ; *
    >fais que nous devenions nous-mêmes,
    >par la puissance de ce sacrifice, /
    >une offrande agréable à tes yeux.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: cf. Ps 106,8-9
    content: |-
      Qu’ils rendent grâce au Seigneur de son amour,
      >de ses merveilles pour les hommes :
      car il étanche leur soif,
      >il comble de biens les affamés !
  prayerAfterCommunion:
  - |-
    Tu as refait nos forces par le sacrement du ciel,
    >et nous te supplions, Seigneur : +
    >accorde-nous d’imiter ton Fils
    >annonçant l’Évangile aux pauvres ; *
    >que les exemples de saint Vincent nous y encouragent /
    >et que sa protection nous soutienne.
    Par le Christ, notre Seigneur.