celebration:
  title: Saint Vincent Ferrier
  subtitle: prêtre
  description: En vrai fils de saint Dominique, Vincent Ferrier fut avant tout un prêcheur. De Valence (Espagne) où il naquit (1350) à Vannes où il mourut (1419), il chemina sans cesse à travers la France, L’Italie, la Suisse, exhortant les foules à la conversion, dans l’attente du retour du Christ que semblaient annoncer les calamités de son temps, la guerre et le schisme.
  commons:
  - pastors
  color: white

oration:
- Dieu qui as choisi saint Vincent Ferrier pour la prédication de l’Évangile, donne-nous le bonheur de voir un jour dans le Royaume des cieux celui dont il annonçait ici-bas la venue comme juge, Jésus, le Christ, notre Seigneur.

readings:
  patristicReading:
  - title: TRAITÉ DE LA VIE SPIRITUELLE DE SAINT VINCENT FERRIER
    content: |-
      Dans les prédications et les exhortations, emploie un langage simple, celui d’un entretien familier, pour expliquer en détail ce qu’il faut faire. Autant que possible, donne des exemples, afin que le pécheur, chargé de tel péché, se sente atteint comme si tu prêchais pour lui seul. Mais parle de telle sorte que tes paroles apparaissent bien comme ne venant pas d’un esprit orgueilleux ou irrité, mais plutôt de la tendresse d’une charité et d’une bonté paternelle. Sois pareil à un père qui s’afflige de voir ses enfants coupables, ou gravement malades, jetés dans un fossé profond : il essaie de les ramener, de les délivrer, il veut les caresser comme une mère, comme quelqu’un qui se réjouit de voir leur progrès et de pouvoir espérer pour eux la gloire du paradis.
      C’est ainsi qu’on fait ordinairement du bien à ses auditeurs. Car un exposé général sur les vertus et les vices ne les touche guère.
      De même dans les confessions : que tu encourages aimablement les timides, ou que tu menaces sévèrement les endurcis, montre toujours la tendresse de la charité. Que le pécheur comprenne toujours que tes paroles sont inspirées par la charité pure. C’est pourquoi les paroles charitables et douces doivent toujours précéder les paroles mordantes.
      Toi qui désires être utile aux âmes qui t’approchent, commence par recourir à Dieu de tout ton cœur. Fais-lui simplement cette demande : qu’il daigne répandre en toi cette charité qui est l’essentiel des vertus et qui te permettra d’accomplir ce que tu souhaites.
    responsory: |-
      R/ Seigneur, qui habitera sur ta montagne sainte ?

      Celui qui juge avec justice
      en écoutant le petit comme le grand.

      Celui qui ne craint pas l’homme,
      sachant que le jugement relève de Dieu.

      Celui qui refuse d’être acheté
      pour accabler un innocent. (Pas de R/).

morning:
  evangelicAntiphon:
    common:
    - |-
      Ce n’est pas vous qui parlerez : mais l’Esprit de votre Père parlera en vous.

vespers:
  evangelicAntiphon:
    common:
    - Libre à l’égard de tous, je me suis fait l’esclave de tous pour que chacun puisse être sauvé.

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Seigneur Dieu, +
    >tu as appelé le prêtre saint Vincent Ferrier
    >comme prédicateur de l’Évangile ; *
    donne-nous le bonheur de voir un jour
    >dans le royaume des Cieux /
    celui dont il annonçait ici-bas
    >la venue comme juge,
    >le Christ Jésus, notre Seigneur.
    Lui qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Tm 4, 1-5
      headline: « Fais ton travail d’évangélisateur, accomplis jusqu’au bout ton ministère »
      content: |-
        Bien-aimé,
        devant Dieu,
        et devant le Christ Jésus qui va juger les vivants et les morts,
        je t’en conjure,
        au nom de sa Manifestation et de son Règne :
        proclame la Parole,
        interviens à temps et à contretemps,
        dénonce le mal,
        fais des reproches, encourage,
        toujours avec patience et souci d’instruire.
        Un temps viendra
        où les gens ne supporteront plus l’enseignement de la saine doctrine ;
        mais, au gré de leurs caprices,
        ils iront se chercher une foule de maîtres
        pour calmer leur démangeaison d’entendre du nouveau.
        Ils refuseront d’entendre la vérité
        pour se tourner vers des récits mythologiques.
        Mais toi, en toute chose garde la mesure,
        supporte la souffrance,
        fais ton travail d’évangélisateur,
        accomplis jusqu’au bout ton ministère.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
      refAbbr: cf. 39, 8a.9a
      chorus:
      - chorusRef: cf. 39, 8a.9a
        chorus: |-
          Me voici, Seigneur,
          je viens faire ta volonté.
      content: |-
        D’un grand espoir j’espérais le Seigneur :
        il s’est penché vers moi pour entendre mon cri.
        Dans ma bouche il a mis un chant nouveau,
        une louange à notre Dieu.

        Tu ne voulais ni offrande ni sacrifice,
        tu as ouvert mes oreilles ;
        tu ne demandais ni holocauste ni victime,
        alors j’ai dit : « Voici, je viens.

        Dans le livre, est écrit pour moi
        ce que tu veux que je fasse.
        Mon Dieu, voilà ce que j’aime :
        ta loi me tient aux entrailles. »

        J’annonce la justice
        dans la grande assemblée ;
        vois, je ne retiens pas mes lèvres,
        Seigneur, tu le sais.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Lc 12, 35-40
      headline: « Vous aussi, tenez-vous prêts »
      acclamationAntiphon: |-
        Restez éveillés et priez en tout temps :
        ainsi vous serez jugés dignes
        de vous tenir debout devant le Fils de l’homme.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        « Restez en tenue de service,
        votre ceinture autour des reins,
        et vos lampes allumées.
        Soyez comme des gens qui attendent leur maître
        à son retour des noces,
        pour lui ouvrir dès qu’il arrivera et frappera à la porte.
        Heureux ces serviteurs-là que le maître, à son arrivée,
        trouvera en train de veiller.
        Amen, je vous le dis :
        c’est lui qui, la ceinture autour des reins,
        les fera prendre place à table
        et passera pour les servir.
        S’il revient vers minuit ou vers trois heures du matin
        et qu’il les trouve ainsi,
        heureux sont-ils !
        Vous le savez bien :
        si le maître de maison avait su à quelle heure le voleur viendrait,
        il n’aurait pas laissé percer le mur de sa maison.
        Vous aussi, tenez-vous prêts :
        c’est à l’heure où vous n’y penserez pas
        que le Fils de l’homme viendra. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null