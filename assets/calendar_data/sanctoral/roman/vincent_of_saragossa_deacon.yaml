celebration:
  title: Saint Vincent
  subtitle: diacre et martyr
  description: |-
    Vincent, diacre de Saragosse, fut mis à mort à Valence (Espagne) avec son évêque Valère en 304 ou 305, après avoir subi la torture. Comme Laurent de Rome, Vincent offre le modèle accompli du service dans l’Église : ministre de l’évêque pour l’offrande du sacrifice et le gouvernement de la communauté, le diacre doit l’accompagner aussi à l’heure suprême du témoignage.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Dieu éternel et tout-puissant, daigne répandre en nous ton Esprit : que nos cœurs soient fortifiés par cet amour qui aidait saint Vincent à tenir sous la torture.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AUGUSTIN POUR LA FÊTE DE SAINT VINCENT
      content: |-
        %Dieu vous fait la grâce à l’égard du Christ%, dit Saint Paul, %non seulement de croire en lui, mais encore de souffrir pour lui%.
        Le diacre Vincent avait reçu l’un et l’autre. Car s’il ne les avait pas reçus, qu’aurait-il gardé ? Il gardait confiance en parlant, il gardait patience en souffrant.
        Que nul ne présume donc de son cœur, quand il prononce la parole ; que nul ne se confie à ses forces quand il subit l’épreuve. En effet, lorsque nous disons sagement de bonnes choses, notre sagesse vient de Dieu, et lorsque nous souffrons courageusement de mauvaises choses, notre patience vient de lui.
        Rappelez-vous le Christ Seigneur avertissant ses disciples dans l’Évangile ; rappelez-vous le Roi des martyrs munissant ses cohortes d’armes spirituelles, leur annonçant la guerre, leur fournissant des secours, leur promettant des récompenses. Après avoir dit à ses disciples: %En ce monde, vous serez opprimés%, il ajoute aussitôt pour calmer leur terreur: %Mais ayez confiance, j’ai vaincu le monde%.
        Pourquoi donc nous étonner, mes très chers, si Vincent a été vainqueur en celui par qui le monde fut vaincu ? %En ce monde, vous serez opprimés%. Le monde opprime, mais ne supprime pas ; il peut combattre, mais non abattre.
        Le monde lance deux armées contre les soldats du Christ. Il flatte pour tromper, il terrorise pour briser. Que notre propre plaisir ne nous paralyse pas, que la cruauté d’autrui ne nous terrorise pas, et le monde est vaincu.
        Dans les deux cas le Christ se présente, et le chrétien n’est pas vaincu. Si l’on considère, dans ce martyre, la persévérance de l’homme, on le trouve d’abord incroyable ; si l’on y reconnaît la puissance de Dieu, il n’est plus invraisemblable.
        Une telle cruauté s’acharnait sur le corps du martyr et une telle tranquillité s’exprimait dans sa voix, un tel raffinement de supplices s’attaquait à ses membres et un tel apaisement résonnait dans ses paroles que nous pensions : chose étonnante, c’est Vincent qui est la victime, et on en torture un autre qui ne parle pas.
        Et vraiment, mes frères, c’était cela, c’était tout à fait cela : c’est un autre qui parlait. Car Jésus en a fait la promesse à ses témoins qu’il préparait à de tels combats. Il leur dit, selon l’Évangile: %Ne vous tourmentez pas pour savoir ce que vous direz ni comment vous le direz. Car ce n’est pas vous qui parlerez, c’est l’Esprit de votre Père qui parlera en vous%.
        La chair souffrait, l’Esprit parlait, et la parole de l’Esprit non seulement condamnait l’incroyance, mais encore soutenait l’impuissance.
      responsory: |-
        R/ Connaître le Christ,
        la puissance de sa résurrection,
        et la communion à ses souffrances.

        Pour lui, j’ai tout perdu,
        et je cours vers le seul but :

        Lui, le premier, m’a saisi,
        de tout mon élan, je veux le saisir :

mass:
- massType: DAY_MASS
  entranceAntiphon: null
  collect:
  - |-
    Dieu éternel et tout-puissant, +
    dans ta miséricorde répands sur nous ton Esprit : *
    afin que nos cœurs soient forts de cet amour
    >qui permit à saint Vincent, ton martyr, /
    >d’être vainqueur dans tous les supplices infligés à son corps.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2 Co 4, 7-15
      headline: « Nous portons, dans notre corps, la mort de Jésus »
      content: |-
        Frères,
        nous portons un trésor comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        appartient à Dieu et ne vient pas de nous.
        En toute circonstance, nous sommes dans la détresse,
        mais sans être angoissés ;
        nous sommes déconcertés,
        mais non désemparés ;
        nous sommes pourchassés,
        mais non pas abandonnés ;
        terrassés,
        mais non pas anéantis.
        Toujours nous portons, dans notre corps, la mort de Jésus,
        afin que la vie de Jésus, elle aussi,
        soit manifestée dans notre corps.
        En effet, nous, les vivants,
        nous sommes continuellement livrés à la mort à cause de Jésus,
        afin que la vie de Jésus, elle aussi,
        soit manifestée dans notre condition charnelle vouée à la mort.
        Ainsi la mort fait son œuvre en nous,
        et la vie en vous.
        L’Écriture dit :
        J’ai cru, c’est pourquoi j’ai parlé.
        Et nous aussi, qui avons le même esprit de foi, nous croyons,
        et c’est pourquoi nous parlons.
        Car, nous le savons, celui qui a ressuscité le Seigneur Jésus
        nous ressuscitera, nous aussi, avec Jésus,
        et il nous placera près de lui avec vous.
        Et tout cela, c’est pour vous,
        afin que la grâce,
        plus largement répandue dans un plus grand nombre,
        fasse abonder l’action de grâce
        pour la gloire de Dieu.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 33 (34), 2-3, 4-5, 6-7, 8-9
      refAbbr: cf. 33, 5b
      chorus:
      - chorusRef: cf. 33, 5b
        chorus: |-
          De toutes mes frayeurs,
          le Seigneur me délivre.
      content: |-
        Je bénirai le Seigneur en tout temps,
        sa louange sans cesse à mes lèvres.
        Je me glorifierai dans le Seigneur :
        que les pauvres m’entendent et soient en fête !

        Magnifiez avec moi le Seigneur,
        exaltons tous ensemble son nom.
        Je cherche le Seigneur, il me répond :
        de toutes mes frayeurs, il me délivre.

        Qui regarde vers lui resplendira,
        sans ombre ni trouble au visage.
        Un pauvre crie ; le Seigneur entend :
        il le sauve de toutes ses angoisses.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 17-22
      headline: « Vous serez conduits devant des gouverneurs et des rois à cause de moi »
      acclamationAntiphon: |-
        Heureux ceux qui sont persécutés pour la justice,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        « Méfiez-vous des hommes :
        ils vous livreront aux tribunaux
        et vous flagelleront dans leurs synagogues.
        Vous serez conduits devant des gouverneurs et des rois
        à cause de moi :
        il y aura là un témoignage pour eux et pour les païens.
        Quand on vous livrera,
        ne vous inquiétez pas
        de savoir ce que vous direz ni comment vous le direz :
        ce que vous aurez à dire
        vous sera donné à cette heure-là.
        Car ce n’est pas vous qui parlerez,
        c’est l’Esprit de votre Père qui parlera en vous.
        Le frère livrera son frère à la mort,
        et le père, son enfant ;
        les enfants se dresseront contre leurs parents
        et les feront mettre à mort.
        Vous serez détestés de tous à cause de mon nom ;
        mais celui qui aura persévéré jusqu’à la fin,
        celui-là sera sauvé. »
  offeringPrayer: null
  communionAntiphon: null
  prayerAfterCommunion: null