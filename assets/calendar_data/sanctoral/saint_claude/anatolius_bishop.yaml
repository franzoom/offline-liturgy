celebration:
  title: Saint Anatoile
  subtitle: évêque
  description: |-
    Une vie anonyme, produite sous l’épiscopat bisontin de Hugues de Salins (1031-1066), a voulu suppléer à l’ignorance totale qui entourait ce saint. Elle en a fait un Scot, peut-être évêque, réalisant la pratique familière aux Irlandais, le pèlerinage pour Dieu. Rentrant de Rome, et remarquant le site de Salins, il s’y serait retiré auprès d’un oratoire dédié à saint Symphorien ; peu après, il y rendait son âme à Dieu. Hugues développa ce culte, notamment par la construction de l’église qui précédait l’actuelle.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu qui, depuis des siècles, as sanctifié notre région grâce à l’influence de Saint Anatoile, accorde-nous, par son intercession, de continuer fidèlement à vivre notre foi et de parvenir, comme lui, à la joie de ton Royaume.

readings:
  patristicReading:
    - title: Commentaire de Saint Augustin sur l’Évangile de Jean
      subtitle: Jésus, Lumière et Chemin
      content: |-
        Le Seigneur a dit brièvement : %Moi, je suis la lumière du monde ; celui qui me suit ne marchera pas dans les ténèbres, il aura la lumière de la vie%. Ces paroles contiennent d’une part un ordre, d’autre part une promesse. Faisons donc ce qu’il a ordonné pour ne pas désirer avec imprudence ce qu’il a promis. Qu’il ne nous dise pas, au jugement : « As-tu fait ce que j’ai commandé, pour que tu réclames ce que j’ai promis ? » — Qu’as-tu donc ordonné, Seigneur, notre Dieu ? Il te le dit : « Suis-moi. » Tu as demandé un conseil de vie. De quelle vie, sinon celle dont il est dit : %En toi est la source de vie% ? ~
        Obéissons donc maintenant, suivons le Seigneur ; brisons les entraves qui nous empêchent de le suivre. Et qui est capable de défaire de tels nœuds sans être aidé par Celui dont il est dit : %Tu as brisé mes chaînes% ? Celui dont un autre psaume dit : %Le Seigneur délie les enchaînés, le Seigneur redresse les accablés%.
        Ces hommes délivrés et redressés, que vont-ils suivre, sinon cette lumière qui leur dit : %Moi, je suis la lumière du monde ; celui qui me suit ne marchera pas dans les ténèbres%. Car le Seigneur éclaire les aveugles. Soyons donc éclairés, mes frères, en recevant un remède pour les yeux, celui de la foi. Car Jésus a commencé par oindre l’aveugle de naissance avec de la terre et sa salive. Nous-mêmes, du fait d’Adam, nous sommes des aveugles de naissance et nous avons besoin du Christ pour voir clair. Il a mélangé de la salive et de la terre : %Le Verbe s’est fait chair et il a établi sa demeure parmi nous%. Il a mélangé la salive et la terre, de là cette prophétie : La vérité germera de la terre ; et lui-même a dit : %Moi, je suis le Chemin, la Vérité et la Vie%.
        Nous jouirons pleinement de la Vérité, lorsque nous verrons face à face, car nous en avons la promesse. Qui oserait espérer ce que Dieu n’aurait pas daigné promettre ou donner ?
        Nous verrons face à face. L’Apôtre dit : %Notre connaissance est partielle. Nous voyons actuellement une image obscure dans un miroir ; alors nous verrons face à face%. Et saint Jean, dans sa lettre : %Bien-aimés, dès maintenant nous sommes enfants de Dieu mais ce que nous serons ne paraît pas encore clairement. Nous le savons : lorsque le Fils de Dieu paraîtra, nous serons semblables à lui parce que nous le verrons tel qu’il est%. Voilà la grande promesse !
        Si tu aimes, tu dois suivre. « J’aime, dis-tu, mais par où dois-je suivre ? » Suppose que le Seigneur ton Dieu ait dit : %Moi, je suis la vérité et la vie%. Parce que tu désires la vérité, parce que tu convoites la vie, tu chercherais le chemin pour y parvenir, et tu te dirais : « C’est une belle chose que la vérité, une grande chose que la vie, si je savais comment y parvenir ! » Tu cherches par où ? Tu l’as entendu qui disait en premier lieu : %Moi, je suis le Chemin%. Avant de te dire « pour où », il a commencé par te dire « par où ». %Moi, je suis le Chemin%. Le Chemin pour où ? — La Vérité et la Vie. Il t’a dit d’abord par où aller, il t’a dit ensuite où aller. Moi, je suis le Chemin, moi, je suis la Vérité, moi, je suis la Vie. Lui qui demeure auprès du Père, il est la Vérité et la Vie ; en revêtant notre chair, il est devenu le Chemin.
        On ne te dit pas : « Donne-toi du mal, cherche le chemin pour parvenir à la vérité et à la vie. » On ne te dit pas cela. Lève-toi, paresseux ; le Chemin en personne vient vers toi, et il t’a éveillé de ton sommeil, si du moins il t’a éveillé : Lève-toi et marche !
        Peut-être essaies-tu de marcher, et tu ne peux pas parce que tu as les pieds malades. Pourquoi as-tu les pieds malades ? Peut-être que la cupidité les a forcés à courir dans des terrains accidentés. Mais le Verbe de Dieu a guéri aussi les boiteux. « Eh bien, dis-tu, j’ai les pieds en bon état, mais c’est le chemin que je ne vois pas. » Il a éclairé aussi les aveugles.
      responsory: |-
        [rubric]Stance[/rubric]
        Aujourd’hui le Seigneur nous appelle,
        il cherche son disciple,
        une voix crie : « Écoute, fils,
        prête l’oreille de ton cœur,
        l’heure est venue de marcher vers la vie. »

        R/ Dieu nous attend, pressons le pas
        sur les chemins de l’Évangile.

        Rude est la montée vers la lumière,
        étroite la porte du Royaume.
        
        Humblement, par la patience, 
        tu entreras dans le mystère de la Pâque.
        
        Dans la douceur de l’amour,
        tu avanceras, le cœur libéré.

mass:
  - massType: DAY_MASS
    readingParts:
    - partType: READING_1
      partContents:
      - biblicalRef: 1Co 4, 1-5
        headline: |-
          « Auxiliaires du Christ et intendants des mystères de Dieu »
        content: |-
          Frères,
          que l’on nous regarde
          >comme des auxiliaires du Christ
          >et des intendants des mystères de Dieu.
          Or, tout ce que l’on demande aux intendants,
          >c’est d’être trouvés dignes de confiance.
          Pour ma part, je me soucie fort peu d’être soumis à votre jugement,
          >ou à celui d’une autorité humaine ;
          d’ailleurs, je ne me juge même pas moi-même.
          Ma conscience ne me reproche rien,
          >mais ce n’est pas pour cela que je suis juste :
          celui qui me soumet au jugement,
          c’est le Seigneur.
          Ainsi, ne portez pas de jugement prématuré,
          >mais attendez la venue du Seigneur,
          car il mettra en lumière ce qui est caché dans les ténèbres,
          >et il rendra manifestes les intentions des cœurs.
          Alors, la louange qui revient à chacun
          >lui sera donnée par Dieu.
      - biblicalRef: Col 1, 24-29
        headline: |-
          « De cette Église, je suis devenu ministre, et Dieu m’a confié une mission »
        content: |-
          Frères,
          maintenant je trouve la joie dans les souffrances
          >que je supporte pour vous ;
          ce qui reste à souffrir des épreuves du Christ
          >dans ma propre chair,
          je l’accomplis pour son corps qui est l’Église.
          De cette Église, je suis devenu ministre,
          et la mission que Dieu m’a confiée,
          >c’est de mener à bien pour vous l’annonce de sa parole,
          le mystère qui était caché depuis toujours
          >à toutes les générations,
          mais qui maintenant a été manifesté
          >à ceux qu’il a sanctifiés.
          Car Dieu a bien voulu leur faire connaître
          >en quoi consiste la gloire sans prix de ce mystère
          >parmi toutes les nations :
          le Christ est parmi vous,
          >lui, l’espérance de la gloire !
          Ce Christ, nous l’annonçons :
          >nous avertissons tout homme,
          >nous instruisons chacun en toute sagesse,
          >afin de l’amener à sa perfection dans le Christ.
          C’est pour cela que je m’épuise à combattre,
          >avec la force du Christ
          >dont la puissance agit en moi.
    - partType: PSALM
      partContents:
      - biblicalRef: Ps 39 (40), 2.4ab, 7-8a, 8b-9, 10
        label: null
        refAbbr: cf. 39, 8a.9a
        chorus:
        - chorusRef: cf. 39, 8a.9a
          content: |-
            Me voici, Seigneur,
            je viens faire ta volonté.
        content: |-
          D’un grand espoir j’espérais le Seigneur :
          il s’est penché vers moi pour entendre mon cri.
          Dans ma bouche il a mis un chant nouveau,
          une louange à notre Dieu.

          Tu ne voulais ni offrande ni sacrifice,
          tu as ouvert mes oreilles ;
          tu ne demandais ni holocauste ni victime,
          alors j’ai dit : « Voici, je viens.

          « Dans le livre, est écrit pour moi
          ce que tu veux que je fasse.
          Mon Dieu, voilà ce que j’aime :
          ta loi me tient aux entrailles. »

          J’annonce la justice
          dans la grande assemblée ;
          vois, je ne retiens pas mes lèvres,
          Seigneur, tu le sais.
      - biblicalRef: Ps 88 (89), 2-3, 4-5, 21-22, 25.27
        label: null
        refAbbr: cf. 88, 2a
        chorus:
        - chorusRef: cf. 88, 2a
          content: |-
            Ton amour, Seigneur,
            sans fin je le chante !
        content: |-
          L’amour du Seigneur, sans fin je le chante ;
          ta fidélité, je l’annonce d’âge en âge.
          Je le dis : C’est un amour bâti pour toujours ;
          ta fidélité est plus stable que les cieux.

          « Avec mon élu, j’ai fait une alliance,
          j’ai juré à David, mon serviteur :
          j’établirai ta dynastie pour toujours,
          je te bâtis un trône pour la suite des âges.

          « J’ai trouvé David, mon serviteur,
          je l’ai sacré avec mon huile sainte ;
          et ma main sera pour toujours avec lui,
          mon bras fortifiera son courage.

          « Mon amour et ma fidélité sont avec lui,
          mon nom accroît sa vigueur ;
          il me dira : “Tu es mon Père,
          mon Dieu, mon roc et mon salut !” »
    - partType: GOSPEL
      partContents:
      - biblicalRef: Mt 9, 35-38
        headline: |-
          « La moisson est abondante, mais les ouvriers sont peu nombreux »
        acclamationAntiphon: |-
          Je suis le bon pasteur, dit le Seigneur ;
          je connais mes brebis
          et mes brebis me connaissent.
        content: |-
          En ce temps-là,
          Jésus parcourait toutes les villes et tous les villages,
          >enseignant dans leurs synagogues,
          >proclamant l’Évangile du Royaume
          >et guérissant toute maladie et toute infirmité.
          Voyant les foules, Jésus fut saisi de compassion envers elles
          >parce qu’elles étaient désemparées et abattues
          >comme des brebis sans berger.
          Il dit alors à ses disciples :
          >« La moisson est abondante,
          >mais les ouvriers sont peu nombreux.
          Priez donc le maître de la moisson
          >d’envoyer des ouvriers pour sa moisson. »
      - biblicalRef: Jn 15, 9-17
        headline: |-
          « Je ne vous appelle plus serviteurs, je vous appelle mes amis »
        acclamationAntiphon: |-
          Vous n’avez qu’un seul Père,
          >celui qui est aux cieux ;
          vous n’avez qu’un seul maître, le Christ.
        content: |-
          En ce temps-là, Jésus disait à ses disciples :
          >« Comme le Père m’a aimé,
          >moi aussi je vous ai aimés.
          Demeurez dans mon amour.
          Si vous gardez mes commandements,
          >vous demeurerez dans mon amour,
          >comme moi, j’ai gardé les commandements de mon Père,
          >et je demeure dans son amour.
          Je vous ai dit cela pour que ma joie soit en vous,
          >et que votre joie soit parfaite.
          Mon commandement, le voici :
          >Aimez-vous les uns les autres
          >comme je vous ai aimés.
          Il n’y a pas de plus grand amour
          >que de donner sa vie pour ceux qu’on aime.
          Vous êtes mes amis
          >si vous faites ce que je vous commande.
          Je ne vous appelle plus serviteurs,
          >car le serviteur ne sait pas ce que fait son maître ;
          >je vous appelle mes amis,
          >car tout ce que j’ai entendu de mon Père,
          >je vous l’ai fait connaître.
          Ce n’est pas vous qui m’avez choisi,
          >c’est moi qui vous ai choisis et établis
          >afin que vous alliez,
          >que vous portiez du fruit,
          >et que votre fruit demeure.
          Alors, tout ce que vous demanderez au Père en mon nom,
          >il vous le donnera.
          Voici ce que je vous commande :
          >c’est de vous aimer les uns les autres. »
    collect:
      - |-
        Dieu qui, depuis des siècles,
        >as sanctifié notre région
        >grâce à l’influence de Saint Anatoile,
