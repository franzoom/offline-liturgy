celebration:
  title: Anniversaire de la dédicace de l’église cathédrale
  subtitle: fête dans le diocèse (solennité à la cathédrale)
  description: |-
    Notre cathédrale est dédiée aux trois Apôtres Pierre, Paul et André ; ce culte typique remonte au temps de saint Oyend, dont la Vie raconte comment des reliques de ces apôtres ont été rapportées de Rome et placées sous l’autel du monastère. L’église ancienne fut remplacée par l’actuelle à partir de 1390 environ. La façade fut achevée seulement vers 1740, lorsque l’abbatiale devint la cathédrale du nouveau diocèse.
  commons:
    - dedicace_outside
    - dedicace_inside
  color: white

readings:
  biblicalReading:
    - title: DE LA PREMIÈRE LETTRE DE SAINT PIERRE
      subtitle: La pierre vivante et la nation sainte
      ref: 1 P 2,1-17
      content: |-
        Rejetez toute méchanceté et toute ruse, toute forme d’hypocrisie, d’envie et de médisance. Comme des enfants nouveau-nés, désirez le lait pur de la parole, si vous avez goûté que le Seigneur est bon. C’est en vous approchant de lui, pierre vivante, rejetée par les hommes mais choisie et précieuse devant Dieu, que vous êtes vous-mêmes, comme des pierres vivantes, les pierres d’une demeure spirituelle, pour constituer une sainte communauté sacerdotale, pour offrir des sacrifices spirituels, agréables à Dieu par Jésus Christ. Voici, je pose en Sion une pierre angulaire, choisie et précieuse, et celui qui met en elle sa confiance ne sera pas confondu. À vous donc, les croyants, l’honneur ; mais pour les incrédules, la pierre qu’ont rejetée les bâtisseurs est devenue la pierre d’angle, pierre d’achoppement, un roc qui fait tomber ; ils s’y heurtent, parce qu’ils refusent de croire à la Parole : c’est à cela qu’ils étaient destinés.
        Mais vous, vous êtes la race élue, le sacerdoce royal, la nation sainte, le peuple que Dieu s’est acquis, pour annoncer les merveilles de celui qui vous a appelés des ténèbres à son admirable lumière. Vous qui autrefois n’étiez pas un peuple, vous êtes maintenant le peuple de Dieu ; vous qui n’aviez pas obtenu miséricorde, vous avez obtenu miséricorde.
        Bien-aimés, je vous exhorte, comme des étrangers et des voyageurs, à vous abstenir des convoitises charnelles, qui font la guerre à l’âme. Ayez au milieu des nations une bonne conduite, afin que, là même où ils vous calomnient comme malfaiteurs, ils arrivent, en considérant vos bonnes œuvres, à glorifier Dieu au jour de sa visite.
        Soyez soumis à toute institution humaine, à cause du Seigneur : soit au roi, en sa qualité de souverain, soit aux gouverneurs délégués par lui pour punir les malfaiteurs et pour louer les gens de bien. Car c’est la volonté de Dieu qu’en faisant le bien vous réduisiez au silence l’ignorance des insensés. Comportez-vous en hommes libres, sans utiliser la liberté comme un voile pour couvrir votre méchanceté, mais agissez en serviteurs de Dieu. Honorez tous les hommes, aimez vos frères, craignez Dieu, honorez le roi.
      responsory: |-
        R/ De ta demeure de sainteté, Seigneur,
        vous êtes un peuple acquis
        pour annoncer les louanges de celui
        qui vous a appelés des ténèbres à son admirable lumière.

        Jadis vous n’étiez pas un peuple,
        vous êtes maintenant le peuple de Dieu ; R/

        Vous n’aviez pas obtenu miséricorde,
        mais maintenant vous avez obtenu miséricorde. R/
  patristicReading:
    - title: De la « Vie des Pères du Jura »
      subtitle: Les Apôtres, pierres de fondation de l’Église
      content: |-
        Depuis les années 480, l’autel majeur de Saint-Claude est dédié aux trois « frères » par le sang ou l’apostolat, Pierre, Paul et André.
        Un jour d’été, alors que saint Oyend ne portait pas encore le fardeau du gouvernement du monastère, il dormait au-delà, sous un arbre qui lui était familier, tout près du chemin qui, franchissant les monts, conduit à Genève : soudain, pendant son profond sommeil, trois hommes s’approchent et se présentent à lui. Après l’oraison et le baiser de paix, Oyend contemple, stupéfait, leur aspect étrange, leur air, leur vêtement, puis leur demande qui ils sont, ces hommes vénérables, dont il a mérité, comme une bénédiction, la visite. Alors l’un d’eux : « Je suis Pierre, dit-il : quant à celui-ci, c’est mon propre frère André ; celui-là, c’est notre frère Paul. » Oyend, aussitôt, se prosterne en esprit à leurs pieds et poursuit : « Comment se fait-il, messeigneurs, que je vous voie dans ces campagnes, au milieu des forêts, vous dont les corps, lisons-nous, sont ensevelis depuis votre saint martyre, dans les grandes villes de Rome et de Patras ? – C’est vrai, répondent-ils, nous sommes bien là-bas comme tu l’affirmes, et en même temps nous voulons séjourner ici : tel est le motif de notre venue. » Sur ces mots, sa vision prend fin avec son sommeil.
        S’étant frotté le visage pour en chasser l’engourdissement du réveil, il aperçoit au loin deux frères qui étaient partis de Condat depuis environ deux ans : ils approchaient par ce même chemin par où il avait vu arriver les saints apôtres durant sa vision. Il s’élance aussitôt à leur rencontre, et, après les salutations d’usage, s’informe d’où viennent ces frères chéris qui rentrent au monastère après un si long voyage. « Entre autres démarches, répondent-ils, nous sommes allés jusqu’à la ville de Rome, et non seulement nous y avons obtenu la protection des Saints, mais nous revenons sous une triple garantie, tardivement accordée, il est vrai, mais sûre : la garantie de trois martyrs. Car c’est avec le riche trésor des reliques de nos seigneurs les apôtres Pierre, Paul et André que nous rentrons aujourd’hui à notre ancien bercail. » Tandis que les deux voyageurs restent au lieu même de la rencontre, selon la coutume, saint Oyend court au monastère, et celui-là même qui venait de contempler les saints dans une vision se fait, auprès du père et des frères, le messager de leur arrivée. On s’élance aussitôt à leur rencontre ; on salue les frères ; on baise avec effusion les reliquaires ; on les expose au milieu des transports d’une joie débordante et au son des psaumes ; on les enferme enfin sous l’autel ; et maintenant, ils accordent à ceux qui les prient leur infatigable et puissante protection, eux dont la gloire et les mérites ne sauraient être contenus dans les limites d’un lieu quelconque.
      responsory: |-
        R/ Approchons-nous de la pierre vivante,
        rejetée par les hommes, mais choisie par Dieu.

        Montez à la montagne et rebâtissez ma maison, dit le Seigneur,
        j’y trouverai ma joie et ma gloire. R/

        La gloire future de ce temple dépassera l’ancienne
        et dans ce lieu je donnerai la paix. R/
        
        Vous-mêmes, comme pierres vivantes,
        entrez dans la construction de l’édifice spirituel. R/
