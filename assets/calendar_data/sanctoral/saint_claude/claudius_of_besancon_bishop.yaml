celebration:
  title: Saint Claude
  subtitle: évêque et abbé, patron du diocèse
  description: |-
    Abbé de Saint-Oyan de Joux pendant 55 ans (environ 648-703), il fut en outre pendant sept ans revêtu de la dignité épiscopale ; à cette double certitude, fondée sur le catalogue abbatial, se limite notre connaissance. Mais lorsqu'au XII^e siècle se développera le culte du saint trouvé intact dans son tombeau, une si brève mention paraîtra insuffisante ; et personne n'imaginera plus la réalité disparue d'évêque claustral, moine exerçant les fonctions épiscopales nécessaires à la communauté. En vue de la liturgie et du pèlerinage paraîtront alors deux Vies qui feront de Claude un archevêque bisontin, quittant son siège après sept années, puis régissant pendant 55 ans l'abbaye jurassienne. Il est superflu d'insister sur le rayonnement de ce culte, qui vaudra à la ville son nom actuel, avec une bonne part de son orientation artisanale, pour satisfaire aux requêtes populaires d'un des grands pèlerinages européens.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu qui ne cesses d'appeler ton peuple à la sainteté, tu as choisi Saint Claude pour qu'il mène dans notre région une vie de contemplation et y répande les bienfaits de ton amour. Puisqu'il est le patron de notre diocèse, accorde-nous, à sa prière, de maintenir fermement en nous le souci de te connaître, la joie de te célébrer et la force d'être les témoins de tes merveilles. Par Jésus Christ.

readings:
  hymn:
    - imite-la-saintete-de-claude

morning:
  psalmody:
    - antiphon:
        - |-
          Saint Claude, chercheur de Dieu, tu bois, dans le silence, l'eau vive de la grâce, et tu la fais jaillir jusqu'à nous.
    - antiphon:
        - |-
          Saint Claude, semeur de Dieu, tu plantes l'Espérance où germe la Parole et tu la fais grandir jusqu'à nous.
  evangelicAntiphon:
    common:
      - |-
        Saint Claude, témoin de Dieu, tu vis pour une Alliance qui fonde notre Église et nous la porterons devant nous.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Quand des frères sont unis et rendent grâce au Seigneur, Dieu lui-même les bénit, alléluia.

mass:
  - massType: DAY_MASS
    prefaceList:
      - claudius_of_besancon
