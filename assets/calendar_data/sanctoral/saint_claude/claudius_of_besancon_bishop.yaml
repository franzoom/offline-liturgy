celebration:
  title: Saint Claude
  subtitle: évêque et abbé, patron du diocèse
  description: |-
    Abbé de Saint-Oyan de Joux pendant 55 ans (environ 648-703), il fut en outre pendant sept ans revêtu de la dignité épiscopale ; à cette double certitude, fondée sur le catalogue abbatial, se limite notre connaissance. Mais lorsqu’au XII^e siècle se développera le culte du saint trouvé intact dans son tombeau, une si brève mention paraîtra insuffisante ; et personne n’imaginera plus la réalité disparue d’évêque claustral, moine exerçant les fonctions épiscopales nécessaires à la communauté. En vue de la liturgie et du pèlerinage paraîtront alors deux Vies qui feront de Claude un archevêque bisontin, quittant son siège après sept années, puis régissant pendant 55 ans l’abbaye jurassienne. Il est superflu d’insister sur le rayonnement de ce culte, qui vaudra à la ville son nom actuel, avec une bonne part de son orientation artisanale, pour satisfaire aux requêtes populaires d’un des grands pèlerinages européens.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu qui ne cesses d’appeler ton peuple à la sainteté, tu as choisi Saint Claude pour qu’il mène dans notre région une vie de contemplation et y répande les bienfaits de ton amour. Puisqu’il est le patron de notre diocèse, accorde-nous, à sa prière, de maintenir fermement en nous le souci de te connaître, la joie de te célébrer et la force d’être les témoins de tes merveilles.

readings:
  hymn:
    - claudii-sanctos-imitare-mores
  biblicalReading:
    - title: De la lettre de saint Paul aux Romains (12, 1-21)
      subtitle: Le culte spirituel
      ref: Rm 12, 1-21
      responsory: |-
        R/ Fais grandir entre nous, Seigneur,
        l’accord et l’harmonie d’un même amour.
        V/ – Menez une vie digne de l’Évangile,
        fermes dans un même esprit,
        luttant d’un cœur unanime.
        – Sans vous soucier de vos propres affaires,
        ayez à cœur celles de vos frères,
        à l’exemple du Christ Jésus.
  patristicReading:
    - title: De la « Règle de saint Benoît »
      subtitle: La Règle bénédictine n’était pas encore en usage à Condat au temps de l’abbé Claude ; pourtant, elle met en forme l’idéal qui, de tout temps, a orienté la vie monastique.
      content: |-
        L’abbé du monastère songera toujours à la charge qu’il a reçue et à celui auquel il devra rendre compte de sa gestion. Il saura qu’il doit plutôt servir que régir. Il doit donc être savant dans la loi divine, pour savoir et avoir d’où tirer le neuf et l’ancien, chaste, sobre, miséricordieux. Et que la miséricorde l’emporte toujours sur le jugement, afin qu’il obtienne pour lui le même traitement. Qu’il haïsse les vices et qu’il aime les frères. Dans ses réprimandes mêmes, qu’il agisse prudemment et sans rien de trop, de peur qu’en voulant trop gratter la rouille, il ne brise le vase. Il ne perdra jamais de vue sa propre fragilité, et il se souviendra qu’il ne faut pas écraser le roseau cassé. Nous ne voulons pas dire par là qu’il permettra aux vices de se développer, mais qu’il les retranchera prudemment et avec charité, suivant qu’il lui semblera opportun pour chaque individu, comme nous l’avons déjà dit. Et il s’efforcera d’être plus aimé que redouté.
        Il ne sera pas agité et inquiet, il ne sera pas excessif et obstiné, il ne sera pas jaloux et soupçonneux à l’excès, car il ne serait jamais en repos. Dans les ordres qu’il donne, il sera prévoyant et réfléchi, et que l’œuvre qu’il commande soit selon Dieu ou selon le siècle, il usera de discrétion et de mesure, en songeant à la discrétion du saint patriarche Jacob, qui disait : %Si je fais peiner davantage mes troupeaux à marcher, ils mourront tous en un jour.% Prenant garde à ce texte et aux autres sur la discrétion, mère des vertus, il mettra de la mesure en tout, en sorte que les forts aient à désirer et que les faibles n’aient pas à prendre la fuite.
        Et surtout, qu’il garde en tous ses points la présente règle, afin qu’après avoir bien servi, il entende le Seigneur lui dire, comme au bon serviteur qui distribua en son temps le froment à ses compagnons de service : %En vérité, je vous le dis, il l’établira sur tous ses biens.%
      responsory: |-
        [rubric]Stance[/rubric]
        Dans un lieu perdu,
        ils ont cherché la source
        où renaît la soif ;
        dans un lieu caché,
        ils suivaient en pauvres
        le Christ pauvre.
        Avec une humble patience,
        ils attendaient l’heure
        où d’autres viendraient
        se joindre à leur quête.

        R/ Tes amis te cherchaient, Seigneur :
        Ils nous guident vers toi.

        À nous maintenant de les suivre
        vers cette obscurité
        où nous guettons le reflet de ta gloire.

        Ils ont maintenant rejoint ton visage :
        leur chemin demeure
        celui que tu nous traces.
    - title: Homélie de saint Fulgence sur le serviteur fidèle
      subtitle: Les intendants des mystères de Dieu
      content: |-
        Le Seigneur a dit, voulant montrer le devoir spécial des serviteurs qu’il a mis à la tête de son peuple : %Quel est donc l’intendant fidèle et sensé à qui le maître de maison a confié la charge de sa famille pour lui donner en temps voulu la mesure de froment ? Heureux serviteur, que son maître, en arrivant, trouvera occupé à ce travail !%
        Qui est ce maître de maison, mes frères ? Le Christ, sans aucun doute, puisqu’il a dit à ses disciples : %Vous m’appelez Maître et Seigneur, et vous avez raison, car vraiment je le suis.%
        Et quelle est cette famille du maître ? C’est évidemment celle que le Seigneur lui-même a rachetée du pouvoir de l’ennemi et a transférée dans son royaume. Cette famille sainte est l’Église catholique qui se répand dans le monde entier par sa grande fécondité, et qui se glorifie d’avoir été rachetée par la rançon du sang de son Seigneur. Comme lui-même l’a dit : %Le Fils de l’homme n’est pas venu pour être servi, mais pour servir et donner sa vie en rançon pour la multitude.%
        Il est aussi le bon Pasteur, qui a donné sa vie pour ses brebis. Le troupeau du bon pasteur, c’est donc la famille du Rédempteur.
        Mais quel est cet intendant, qui doit être en même temps fidèle et sensé ? L’Apôtre Paul nous le montre, lorsqu’il dit, à propos de lui-même et de ses compagnons : %Que l’on nous regarde comme les serviteurs du Christ et les intendants des mystères de Dieu.% Et ce que l’on demande aux intendants, c’est de se montrer fidèles.
        Mais personne d’entre nous ne doit penser que les Apôtres sont les seuls à avoir reçu la charge d’intendants ; et le serviteur paresseux, négligeant le devoir du combat spirituel, ne doit pas somnoler, ce qui serait infidèle et insensé. C’est pourquoi le saint Apôtre montre que les évêques eux aussi sont des intendants, lorsqu’il dit : %Il faut que l’évêque soit irréprochable, en sa qualité d’intendant de Dieu.%
        Nous sommes donc les serviteurs du père de famille, nous sommes les intendants du Seigneur, nous avons reçu la mesure de froment que nous devons vous distribuer. Si nous cherchons ce que signifie cette mesure de froment, c’est encore le saint Apôtre qui nous l’explique, lorsqu’il dit : %Chacun selon la mesure de foi que Dieu lui a donnée en partage.% Ce partage que le Christ appelle mesure de froment, Paul l’appelle mesure de foi, pour nous faire comprendre que le froment spirituel n’est autre que le mystère adorable de la foi chrétienne. Nous vous distribuons la mesure de ce froment, au nom du Seigneur, chaque fois que, éclairés par le don de la grâce qui vient de l’Esprit, nous exposons la doctrine selon la règle de la vraie foi. Et vous recevrez cette mesure de froment, par l’intermédiaire des intendants du Seigneur, lorsque vous entendez chaque jour, grâce aux serviteurs de Dieu, la parole de vérité.
      responsory: |-
        R/ Heureux le serviteur fidèle,
        il entre dans la joie de son maître.
        
        Je rends grâce au Seigneur Jésus :
        il m’a jugé assez fidèle
        pour m’appeler à son service.

        En moi la grâce du Seigneur a surabondé,
        avec la foi et la charité
        qui est dans le Christ Jésus.

morning:
  hymn:
    - nous-te-chantons-o-pere-des-hommes
  evangelicAntiphon:
    - |-
      Qui fait la volonté de mon Père, dit le Seigneur, est mon frère, ma sœur et ma mère, alleluia.
  intercession:
    content: |-
      En ce jour où l’Église de Saint-Claude célèbre son saint patron, louons et bénissons le Christ, notre Seigneur, et supplions-le :

      R/ Béni sois-tu, Seigneur ! Prends pitié de nous !

      Nous te prions pour notre Évêque, les prêtres, les diacres et tous ceux qui exercent une charge pastorale dans ce diocèse :
      – envoie sur eux ton esprit de fidélité et de courage.

      Nous te prions pour les moines, les moniales, les religieux, les religieuses, et tous les baptisés qui vivent dans ce diocèse :
      – fortifie leur communion avec toi.

      Nous te prions pour tous ceux qui ont une responsabilité dans la bonne marche sociale et économique du département :
      – inspire-leur le souci de la vérité et la recherche de la justice.

      Nous te prions pour tous ceux qui vivent en notre région, quelles que soient leur race, leur religion ou leurs opinions :
      – accorde à tous la paix, et à chacun la dignité.

vespers:
  hymn:
    - nous-te-chantons-o-pere-des-hommes
  evangelicAntiphon:
    - |-
      Quand des frères sont unis et rendent grâce au Seigneur, Dieu lui-même les bénit, alleluia.
  intercession:
    content: |-
      En ce jour où nous fêtons saint Claude, adressons nos supplications au Christ, notre Sauveur :

      R/ Sauve ton peuple, bénis ton héritage.

      Toi qui es la Tête, nous te prions pour l’Église, ton Corps :
      – répands dans notre diocèse la Bonne Nouvelle du Salut, et donne à chaque chrétien une foi vivante pour l’annoncer.

      Toi qui es l’image du Père,
      – offre à chaque habitant de ce territoire la liberté de vivre et la joie de connaître Celui qui t’a envoyé.

      Toi qui n’as cessé de faire le bien autour de toi,
      – prends soin des malades, des infirmes, des handicapés et des démunis qui nous entourent, et donne-nous d’en avoir souci comme toi.

      Toi, le premier-né d’entre les morts,
      – fais entrer nos frères et sœurs défunts dans le Royaume de vie.

mass:
- massType: DAY_MASS
  collect:
    - |-
      Dieu qui ne cesses d’appeler ton peuple à la sainteté,
      tu as choisi Saint Claude
      >pour qu’il mène dans notre région (en ce lieu)
      >une vie de contemplation
      >et y répande les bienfaits de ton amour.
      Puisqu’il est le patron de notre diocèse,
      >accorde-nous, à sa prière,
      >de maintenir fermement en nous
      >le souci de te connaître,
      >la joie de te célébrer
      >et la force d’être les témoins de tes merveilles.
      Par Jésus Christ, ton Fils, notre Seigneur, +
      >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
      >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: 2Co 4, 1-2.5-7
      headline: |-
        « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
      content: |-
        Frères,
        nous, les Apôtres,
        ayant reçu ce ministère par la miséricorde de Dieu,
        >nous ne perdons pas courage :
        nous avons rejeté toute dissimulation honteuse,
        >nous n’agissons pas avec ruse,
        >et nous ne falsifions pas la parole de Dieu.
        Au contraire, nous manifestons la vérité,
        >et ainsi nous nous recommandons nous-mêmes
        >à toute conscience humaine devant Dieu.
        Ce que nous proclamons,
        >ce n’est pas nous-mêmes ;
        c’est ceci : Jésus Christ est le Seigneur ;
        >et nous sommes vos serviteurs, à cause de Jésus.
        Car Dieu qui a dit :
        >Du milieu des ténèbres brillera la lumière,
        a lui-même brillé dans nos cœurs
        >pour faire resplendir la connaissance de sa gloire
        >qui rayonne sur le visage du Christ.
        Mais ce trésor, nous le portons
        >comme dans des vases d’argile ;
        ainsi, on voit bien que cette puissance extraordinaire
        >appartient à Dieu et ne vient pas de nous.
    - biblicalRef: Ep 3, 14-19
      headline: |-
        « Vous connaîtrez ce qui dépasse toute connaissance : l’amour du Christ »
      content: |-
        Frères,
        je tombe à genoux devant le Père,
        >de qui toute paternité au ciel et sur la terre tient son nom.
        Lui qui est si riche en gloire,
        qu’il vous donne la puissance de son Esprit,
        >pour que se fortifie en vous l’homme intérieur.
        Que le Christ habite en vos cœurs par la foi ;
        >restez enracinés dans l’amour, établis dans l’amour.
        Ainsi vous serez capables de comprendre avec tous les fidèles
        >quelle est la largeur, la longueur, la hauteur, la profondeur...
        Vous connaîtrez ce qui dépasse toute connaissance :
        >l’amour du Christ.
        Alors vous serez comblés
        >jusqu’à entrer dans toute la plénitude de Dieu.
    - biblicalRef: Ph 3, 8-14
      headline: |-
        « Je cours vers le but en vue du prix auquel Dieu nous appelle là-haut dans le Christ Jésus »
      content: |-
        Frères,
        tous les avantages que j’avais autrefois,
        je les considère comme une perte
        à cause de ce bien qui dépasse tout :
        >la connaissance du Christ Jésus, mon Seigneur.
        À cause de lui, j’ai tout perdu ;
        je considère tout comme des ordures,
        >afin de gagner un seul avantage, le Christ,
        et, en lui, d’être reconnu juste,
        >non pas de la justice venant de la loi de Moïse
        mais de celle qui vient de la foi au Christ,
        >la justice venant de Dieu, qui est fondée sur la foi.
        Il s’agit pour moi de connaître le Christ,
        >d’éprouver la puissance de sa résurrection
        et de communier aux souffrances de sa Passion,
        >en devenant semblable à lui dans sa mort,
        avec l’espoir de parvenir
        >à la résurrection d’entre les morts.
        Certes, je n’ai pas encore obtenu cela,
        >je n’ai pas encore atteint la perfection,
        mais je poursuis ma course pour tâcher de saisir,
        >puisque j’ai moi-même été saisi par le Christ Jésus.
        Frères, quant à moi, je ne pense pas avoir déjà saisi cela.
        Une seule chose compte :
        >oubliant ce qui est en arrière, et lancé vers l’avant,
        je cours vers le but en vue du prix
        >auquel Dieu nous appelle là-haut dans le Christ Jésus.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 15 (16), 1-2, 7-8, 5a.11
      label: null
      refAbbr: 15, 5a
      chorus:
      - chorusRef: 15, 5a
        content: |-
          Seigneur, mon partage et ma coupe !
      content: |-
        Garde-moi, mon Dieu :
        j’ai fait de toi mon refuge.
        J’ai dit au Seigneur : « Tu es mon Dieu !
        Je n’ai pas d’autre bonheur que toi. »

        Je bénis le Seigneur qui me conseille :
        même la nuit mon cœur m’avertit.
        Je garde le Seigneur devant moi sans relâche ;
        il est à ma droite : je suis inébranlable.

        Seigneur, mon partage et ma coupe !
        Tu m’apprends le chemin de la vie :
        devant ta face, débordement de joie !
        À ta droite, éternité de délices !
    - biblicalRef: Ps 109 (110), 1, 2, 3, 4
      label: null
      refAbbr: Ps 109
      chorus:
      - chorusRef: cf. 109, 4
        content: |-
          Tu es prêtre à jamais
          selon l’ordre de Melkisédek.
      content: |-
        Oracle du Seigneur à mon seigneur :
        « Siège à ma droite,
        et je ferai de tes ennemis
        le marchepied de ton trône. »

        De Sion, le Seigneur te présente
        le sceptre de ta force :
        « Domine jusqu’au cœur de l’ennemi. »

        Le jour où paraît ta puissance,
        tu es prince, éblouissant de sainteté :
        « Comme la rosée qui naît de l’aurore,
        je t’ai engendré. »

        Le Seigneur l’a juré
        dans un serment irrévocable :
        « Tu es prêtre à jamais
        selon l’ordre du roi Melkisédek. »

    - partType: GOSPEL
      partContents:
      - biblicalRef: Mc 4, 1-10.13-20
        headline: |-
          « Voici que le semeur sortit pour semer »
        acclamationAntiphon: |-
          La semence est la parole de Dieu ;
          le semeur est le Christ ;
          celui qui le trouve demeure pour toujours.
        content: |-
          En ce temps-là,
          Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
          Une foule très nombreuse se rassembla auprès de lui,
          >si bien qu’il monta dans une barque où il s’assit.
          Il était sur la mer,
          >et toute la foule était près de la mer, sur le rivage.
          Il leur enseignait beaucoup de choses en paraboles,
          et dans son enseignement il leur disait :
          >« Écoutez ! Voici que le semeur sortit pour semer.
          Comme il semait,
          >du grain est tombé au bord du chemin ;
          >les oiseaux sont venus et ils ont tout mangé.
          Du grain est tombé aussi sur du sol pierreux,
          >où il n’avait pas beaucoup de terre ;
          >il a levé aussitôt,
          >parce que la terre était peu profonde ;
          >et lorsque le soleil s’est levé, ce grain a brûlé
          >et, faute de racines, il a séché.
          Du grain est tombé aussi dans les ronces,
          >les ronces ont poussé, l’ont étouffé,
          >et il n’a pas donné de fruit.
          Mais d’autres grains sont tombés dans la bonne terre ;
          >ils ont donné du fruit
          >en poussant et en se développant,
          >et ils ont produit
          >trente, soixante, cent, pour un. »
          Et Jésus disait :
          >« Celui qui a des oreilles pour entendre,
          >qu’il entende ! »
          Quand il resta seul,
          ceux qui étaient autour de lui avec les Douze
          >l’interrogeaient sur les paraboles.
          Il leur dit encore :
          >« Vous ne saisissez pas cette parabole ?
          Alors, comment comprendrez-vous toutes les paraboles ?
          Le semeur sème la Parole.
          Il y a ceux qui sont au bord du chemin
          >où la Parole est semée :
          >quand ils l’entendent,
          >Satan vient aussitôt
          >et enlève la Parole semée en eux.
          Et de même, il y a ceux qui ont reçu la semence
          >dans les endroits pierreux :
          >ceux-là, quand ils entendent la Parole,
          >ils la reçoivent aussitôt avec joie ;
          >mais ils n’ont pas en eux de racine,
          >ce sont les gens d’un moment ;
          >que vienne la détresse ou la persécution à cause de la Parole,
          >ils trébuchent aussitôt.
          Et il y en a d’autres qui ont reçu la semence dans les ronces :
          >ceux-ci entendent la Parole,
          >mais les soucis du monde, la séduction de la richesse
          >et toutes les autres convoitises
          >les envahissent et étouffent la Parole,
          >qui ne donne pas de fruit.
          Et il y a ceux qui ont reçu la semence dans la bonne terre :
          >ceux-là entendent la Parole, ils l’accueillent,
          >et ils portent du fruit :
          >trente, soixante, cent, pour un. »
      shortBiblicalRef: Mc 4, 1-9
      shortContent: |-
        En ce temps-là,
        Jésus se mit de nouveau à enseigner au bord de la mer de Galilée.
        Une foule très nombreuse se rassembla auprès de lui,
        >si bien qu’il monta dans une barque où il s’assit.
        Il était sur la mer,
        >et toute la foule était près de la mer, sur le rivage.
        Il leur enseignait beaucoup de choses en paraboles,
        et dans son enseignement il leur disait :
        >« Écoutez ! Voici que le semeur sortit pour semer.
        Comme il semait,
        >du grain est tombé au bord du chemin ;
        >les oiseaux sont venus et ils ont tout mangé.
        Du grain est tombé aussi sur du sol pierreux,
        >où il n’avait pas beaucoup de terre ;
        >il a levé aussitôt,
        >parce que la terre était peu profonde ;
        >et lorsque le soleil s’est levé, ce grain a brûlé
        >et, faute de racines, il a séché.
        Du grain est tombé aussi dans les ronces,
        >les ronces ont poussé, l’ont étouffé,
        >et il n’a pas donné de fruit.
        Mais d’autres grains sont tombés dans la bonne terre ;
        >ils ont donné du fruit
        >en poussant et en se développant,
        >et ils ont produit
        >trente, soixante, cent, pour un. »
    - biblicalRef: Lc 12, 32-34
      headline: |-
        « Votre Père a trouvé bon de vous donner le Royaume »
      acclamationAntiphon: |-
        Heureux les pauvres de cœur,
        car le royaume des Cieux est à eux !
      content: |-
        En ce temps-là,
        Jésus disait à ses disciples :
        >« Sois sans crainte, petit troupeau :
        >votre Père a trouvé bon de vous donner le Royaume.
        Vendez ce que vous possédez
        >et donnez-le en aumône.
        Faites-vous des bourses qui ne s’usent pas,
        >un trésor inépuisable dans les cieux,
        >là où le voleur n’approche pas,
        >où la mite ne détruit pas.
        Car là où est votre trésor,
        >là aussi sera votre cœur. »
        
    - biblicalRef: Jn 15, 1-8
      headline: |-
        « Celui qui demeure en moi et en qui je demeure, celui-là porte beaucoup de fruit »
      acclamationAntiphon: |-
        Demeurez dans mon amour, dit le Seigneur.
        Celui qui demeure en moi et en qui je demeure,
        celui-là porte beaucoup de fruit.
      content: |-
        En ce temps-là, Jésus disait à ses disciples :
        >« Moi, je suis la vraie vigne,
        >et mon Père est le vigneron.
        Tout sarment qui est en moi,
        >mais qui ne porte pas de fruit,
        >mon Père l’enlève ;
        tout sarment qui porte du fruit,
        >il le purifie en le taillant,
        >pour qu’il en porte davantage.
        Mais vous, déjà vous voici purifiés
        >grâce à la parole que je vous ai dite.
        Demeurez en moi, comme moi en vous.
        De même que le sarment
        ne peut pas porter de fruit par lui-même
        >s’il ne demeure pas sur la vigne,
        de même vous non plus,
        >si vous ne demeurez pas en moi.
        Moi, je suis la vigne,
        >et vous, les sarments.
        Celui qui demeure en moi
        >et en qui je demeure,
        celui-là porte beaucoup de fruit,
        >car, en dehors de moi, vous ne pouvez rien faire.
        Si quelqu’un ne demeure pas en moi,
        >il est, comme le sarment, jeté dehors,
        >et il se dessèche.
        Les sarments secs, on les ramasse,
        >on les jette au feu, et ils brûlent.
        Si vous demeurez en moi,
        >et que mes paroles demeurent en vous,
        demandez tout ce que vous voulez,
        >et cela se réalisera pour vous.
        Ce qui fait la gloire de mon Père,
        c’est que vous portiez beaucoup de fruit
        >et que vous soyez pour moi des disciples. »
    offeringPrayer:
      - |-
        Accepte les offrandes que nous te présentons, Seigneur,
        >en la fête de Saint Claude ;
        Puisqu’il a consacré sa vie à te louer,
        >fais de nos existences
        >une continuelle Action de Grâce.
        Par le Christ, notre Seigneur.
    prefaceList:
      - claudius_of_besancon
    prayerAfterCommunion:
      - |-
        Seigneur notre Dieu,
        >tu nous permets, par cette Eucharistie,
        de continuer la foi et la louange
        >qui ont rempli la vie de l’évêque Saint Claude.
        Accorde-nous de rester fidèles à son exemple
        >et de recevoir son aide,
        >afin que notre diocèse
        >demeure une terre accueillante
        >à la semence de ton Royaume.
        Par le Christ notre Seigneur.