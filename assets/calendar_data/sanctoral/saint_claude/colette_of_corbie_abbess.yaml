celebration:
  title: Sainte Colette
  subtitle: vierge
  description: |-
    Une des saintes anciennes sur qui nous sommes le mieux renseignés. Née à Corbie en 1381, elle cherche sa voie avec une ténacité tâtonnante, jusqu'à vivre en recluse pendant trois ans. Quand elle a découvert sa vocation — réformer l'ordre franciscain parfois attiédi —, elle obtient du pape d'Avignon, Benoît XIII, le mandat indispensable. Elle groupe ses premières compagnes, sans doute au château de Frontenay ; puis réforme les clarisses de Besançon, fonde Auxonne, Poligny en 1415, institue ou remet en ordre vingt couvents de moniales et sept de Cordeliers, dont celui de Dole. Voyageuse et mystique, énergique et pauvre, elle rayonne sur les grands, les religieux et les humbles. Elle meurt à Gand le 6 mars 1447 ; le couvent de Poligny, son préféré, conserve pieusement son corps depuis 1783.
  commons:
    - virgins
  color: white

oration:
  - |-
    Dieu qui te révèles aux petits et aux pauvres, tu as choisi Sainte Colette pour rappeler à ton Église le message de l'Évangile, et tu nous donnes la joie de conserver le vivant souvenir de son action dans notre région. Accorde-nous, à son exemple, de te consacrer notre vie par la prière et le service des pauvres, et de chercher inlassablement à nous convertir selon l'Évangile de ton Fils. Lui qui.
