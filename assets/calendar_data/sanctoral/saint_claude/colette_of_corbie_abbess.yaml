celebration:
  title: Sainte Colette
  subtitle: vierge
  description: |-
    Une des saintes anciennes sur qui nous sommes le mieux renseignés. Née à Corbie en 1381, elle cherche sa voie avec une ténacité tâtonnante, jusqu’à vivre en recluse pendant trois ans. Quand elle a découvert sa vocation — réformer l’ordre franciscain parfois attiédi —, elle obtient du pape d’Avignon, Benoît XIII, le mandat indispensable. Elle groupe ses premières compagnes, sans doute au château de Frontenay ; puis réforme les clarisses de Besançon, fonde Auxonne, Poligny en 1415, institue ou remet en ordre vingt couvents de moniales et sept de Cordeliers, dont celui de Dole. Voyageuse et mystique, énergique et pauvre, elle rayonne sur les grands, les religieux et les humbles. Elle meurt à Gand le 6 mars 1447 ; le couvent de Poligny, son préféré, conserve pieusement son corps depuis 1783.
  commons:
    - virgins
    - saints-female_religious
  color: white

oration:
  - |-
    Dieu qui te révèles aux petits et aux pauvres, tu as choisi Sainte Colette pour rappeler à ton Église le message de l’Évangile, et tu nous donnes la joie de conserver le vivant souvenir de son action dans notre région. Accorde-nous, à son exemple, de te consacrer notre vie par la prière et le service des pauvres, et de chercher inlassablement à nous convertir selon l’Évangile de ton Fils.

readings:
  hymn:
    - soeur-colette-dieu-t-a-saisie
    - dieu-ma-joie
  patristicReading:
    - title: DERNIERS AVIS DE SAINTE COLETTE
      subtitle: Le chemin de toute perfection et de toute sainteté
      content: |-
        C’est du Tout-Puissant et de lui seul qu’il faut tout attendre. Croyez qu’il achèvera ce qu’il a commencé ; croyez en même temps, mes bien-aimées Sœurs, qu’il consommera l’œuvre de votre sanctification ; mais c’est à une condition, c’est que vous répondiez fidèlement à toute l’étendue de votre vocation et que par vos bonnes œuvres, vous travailliez à rendre certaine votre élection.
        En quoi consistent ces bonnes œuvres ? Pour vous, mes chères Sœurs, elles consistent toutes dans l’accomplissement de la Règle ; observez-la à la lettre et vous aurez trouvé le chemin de toute perfection et de toute sainteté.
        Aimez la pauvreté comme votre Mère ; gardez-la comme le plus précieux des trésors : c’est le plus riche héritage que notre Père saint François nous ait légué !
        Soyons généreuses envers Dieu. Mais qu’est-ce qu’être généreux ? C’est donner plus qu’on ne doit. Il nous est donc impossible à la rigueur d’être généreuses envers Dieu puisqu’en lui donnant tout, nous ne lui donnons que ce qui lui est dû ; cependant, il est assez bon pour regarder comme une marque de générosité, d’abord tout ce que nous faisons avec ferveur et allégresse ; deuxièmement, l’exactitude que nous mettons à remplir les plus légères observances ; troisièmement, le désir que nous avons d’en faire plus encore, si nous le pouvions. Surtout, oublions-nous nous-mêmes et n’ayons en vue que le bon plaisir et la gloire de Dieu : c’est alors qu’il verra dans nos œuvres la générosité dont notre faiblesse est capable.
        Est-il nécessaire que je vous recommande la dévotion et la confiance envers la très sainte Vierge ? Elle est trop profondément gravée dans vos cœurs pour qu’elle puisse jamais s’effacer ou même s’altérer. Marie est la Mère de Dieu et la nôtre : elle est la gardienne de la réforme ; servez-la donc constamment. Elle vous soutiendra dans vos faiblesses ; elle vous défendra contre les assauts de l’enfer ; elle entretiendra dans vos cœurs ce feu sacré de l’amour divin qui doit faire la vie d’une Clarisse.
        Je sens que cette demeure terrestre dans laquelle mon âme est renfermée va bientôt se dissoudre et rentrer dans la poussière d’où elle est sortie… Qu’il retourne donc en terre, ce misérable corps ! Qu’il soit détruit afin de rendre gloire à Dieu par sa destruction, qu’il y retourne jusqu’à ce jour où il sortira du tombeau pour se réunir à mon âme et ne plus s’en séparer !…
        Ce jour vous attend aussi, mes chères Sœurs, ce jour de félicité pour les élus, jour que le Seigneur a fait et qui n’aura jamais de fin. Alors nous nous retrouverons réunies dans le sein de Dieu, océan de paix et de joie. Vivez de manière que vos noms ne soient jamais effacés du Livre de vie.
        Adieu donc, mes chères et bien-aimées Sœurs ! Non, je ne vous oublierai pas plus au ciel que je ne vous ai oubliées sur la terre. Que l’amour et la grâce de notre Seigneur remplissent vos esprits et vos cœurs ! Que ses bénédictions descendent sur vous et vous conservent jusqu’à la fin.
      responsory: |-
        R/ Aujourd’hui comme au premier jour,
        le Royaume est promis aux pauvres.

        Que le souvenir de ton appel
        ne quitte jamais ta mémoire !
        
        C’est le Père qui t’a attirée,
        et le Fils de Dieu s’est fait ton Chemin.
        
        Claire et François te précèdent ;
        avec tes sœurs, poursuis ta course de joie.

morning:
  hymn:
    - soeur-colette-dieu-t-a-saisie
  evangelicAntiphon:
    - |-
      Lancée sur des chemins inconnus, Colette fait lever pour tout un peuple une espérance neuve.
  intercession:
    content: |-
      Bénissons le Seigneur pour l’œuvre accomplie par l’Esprit en sainte Colette :

      R/ Béni sois-tu, Seigneur !

      Pour sainte Colette, qui a consacré sa vie à travailler pour l’Église, en vraie disciple de François.

      Pour son exemple rayonnant qui a fait refleurir paix et silence, prière et joyeuse pénitence, parmi les filles de Claire.

      Pour son amour de « Dame Pauvreté », qui a renouvelé dans l’Église l’esprit des Béatitudes.

      Pour sa prière incessante et sa charité toujours en éveil, qui ont fait d’elle une messagère de paix et d’unité.

vespers:
  hymn:
    - dieu-ma-joie
  evangelicAntiphon:
    - |-
      Avec la Vierge Marie, dans l’assurance de l’Esprit, sainte Colette a parcouru le chemin de l’Évangile.
  intercession:
    content: |-
      Rendons grâce au Seigneur, auteur de tout bien, et prions-le dans la joie.

      R/ En ta grande tendresse, exauce-nous, Seigneur.

      Nous te rendons grâce, Seigneur, pour le don de l’Esprit qui a puissamment agi en sainte Colette, afin de l’aider à accomplir sa mission ;
      – nous te prions pour la fidélité de tous les baptisés à leur vocation d’apôtres.

      Nous te rendons grâce pour la force de son intercession ;
      – que son aide demeure efficace pour ceux qui sont accablés par la misère et la souffrance.

      Nous te rendons grâce pour le don de contemplation qui ne l’a pas quittée, même au plus fort de ses activités ;
      – à travers nos tâches temporelles, garde nos cœurs fixés là où se trouvent les vrais biens.

      Nous te rendons grâce pour sa vie, pleine et féconde, de servante du Seigneur, pour sa mort douce et sereine ;
      – que la paix de ton amour accompagne ceux qui vont mourir.

mass:
  - massType: DAY_MASS
    collect:
      - |-
        Dieu qui te révèles aux petits et aux pauvres,
        >tu as choisi Sainte Colette
        >pour rappeler à ton Église le message de l’Évangile,
        et tu nous donnes la joie
        >de conserver le vivant souvenir
        >de son action dans notre région.
        Accorde-nous, à son exemple,
        >de te consacrer notre vie par la prière
        >et le service des pauvres,
        et de chercher inlassablement à nous convertir
        >selon l’Évangile de ton Fils.
        Lui qui règne avec dans l’unité du Saint Esprit,
        >Dieu, pour les siècles des siècles.
    readingParts:
    - partType: READING_1
      partContents:
      - biblicalRef: Os 2, 16.17b-18.21-22
        headline: |-
          « Je ferai de toi mon épouse pour toujours »
        content: |-
          Ainsi parle le Seigneur :
          Mon épouse infidèle,
          je vais la séduire,
          je vais l’entraîner jusqu’au désert,
          et je lui parlerai cœur à cœur.
          Là, elle me répondra
          comme au temps de sa jeunesse,
          au jour où elle est sortie du pays d’Égypte.
          En ce jour-là – oracle du Seigneur –,
          voici ce qui arrivera :
          Tu m’appelleras : « Mon époux »
          et non plus : « Mon Baal » (c’est-à-dire « mon maître »).
          Je ferai de toi mon épouse pour toujours,
          je ferai de toi mon épouse
          dans la justice et le droit,
          dans la fidélité et la tendresse ;
          je ferai de toi mon épouse dans la loyauté,
          et tu connaîtras le Seigneur.
    - partType: PSALM
      partContents:
      - biblicalRef: Ps 44 (45), 11-12, 14-15, 16-17
        label: null
        refAbbr: 44, 11a
        chorus:
        - chorusRef: cf. Mt 25, 6
          content: |-
            ou : Voici l’Époux qui vient,
            allez à la rencontre du Christ, le Seigneur !
        content: |-
          Écoute, ma fille, regarde et tends l’oreille ;
          oublie ton peuple et la maison de ton père :
          le roi sera séduit par ta beauté.
          Il est ton Seigneur : prosterne-toi devant lui.

          Fille de roi, elle est là, dans sa gloire,
          vêtue d’étoffes d’or ;
          on la conduit, toute parée, vers le roi.
          Des jeunes filles, ses compagnes, lui font cortège.

          On les conduit parmi les chants de fête :
          elles entrent au palais du roi.
          À la place de tes pères se lèveront tes fils ;
          sur toute la terre tu feras d’eux des princes.

    - partType: GOSPEL
      partContents:
      - biblicalRef: Lc 14, 25-33
        headline: |-
          « Celui qui ne renonce pas à tout ce qui lui appartient ne peut pas être mon disciple »
        acclamationAntiphon: |-
          Soyez dans la joie pour l’Alliance nouvelle :
          heureux les invités aux noces de l’Agneau !
        content: |-
          En ce temps-là,
          de grandes foules faisaient route avec Jésus ;
          il se retourna et leur dit :
          >« Si quelqu’un vient à moi
          >sans me préférer à son père, sa mère, sa femme,
          >ses enfants, ses frères et sœurs,
          >et même à sa propre vie,
          >il ne peut pas être mon disciple.
          Celui qui ne porte pas sa croix
          >pour marcher à ma suite
          ne peut pas être mon disciple.
          Quel est celui d’entre vous
          qui, voulant bâtir une tour,
          ne commence par s’asseoir
          >pour calculer la dépense
          >et voir s’il a de quoi aller jusqu’au bout ?
          Car, si jamais il pose les fondations
          >et n’est pas capable d’achever,
          tous ceux qui le verront vont se moquer de lui :
          >“Voilà un homme qui a commencé à bâtir
          >et n’a pas été capable d’achever !”
          Et quel est le roi
          qui, partant en guerre contre un autre roi,
          ne commence par s’asseoir
          >pour voir s’il peut, avec dix mille hommes,
          >affronter l’autre qui marche contre lui avec vingt mille ?
          S’il ne le peut pas,
          il envoie, pendant que l’autre est encore loin,
          une délégation pour demander les conditions de paix.
          Ainsi donc, celui d’entre vous qui ne renonce pas
          à tout ce qui lui appartient
          >ne peut pas être mon disciple. »
    offeringPrayer:
      - |-
        Aujourd’hui, Seigneur Dieu,
        nous honorons l’œuvre accomplie
        par Sainte Colette en ton Église ;
        change nos cœurs pour qu’ils te plaisent
        et rends-nous dignes de célébrer cette Eucharistie.
        Par le Christ notre Seigneur.
    prayerAfterCommunion:
      - |-
        Nous te rendons grâce, Dieu notre Père :
        en nous livrant son corps et son sang,
        ton Fils Jésus nous a prouvé ton amour.
        Que cette communion transforme nos vies
        en les mettant au service de ta gloire et des hommes,
        à l’exemple de ta servante Sainte Colette.
        Par le Christ notre Seigneur.