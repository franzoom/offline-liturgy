celebration:
  title: Saint Désiré
  subtitle: évêque
  description: |-
    Son culte a toujours été attesté à Lons le 27 juillet : ces certitudes de date et de lieu sont les deux « coordonnées » essentielles qui enracinent un saint dans la communauté ecclésiale. En outre, une précision le caractérise dans le catalogue des évêques de Besançon, qui pour cette date mérite confiance : « il acheva sa sainte vie à Lons, et c’est là qu’il repose ». Sa place dans cette liste épiscopale permet de situer l’événement, vers 415. Même profané en 1794, le sarcophage existe toujours, dans la crypte construite au XI^e siècle mais réemployant des éléments plus anciens.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur notre Dieu, c’est toi qui mets au cœur de tout homme le désir de te connaître et de te louer. En ce jour où nous fêtons l’évêque Saint Désiré, le premier témoin de l’Évangile en notre région, nous te prions : que ton nom demeure vivant dans nos cœurs et présent sur nos lèvres, pour que tu continues, chez nous, d’être annoncé et célébré. Par Jésus Christ.

readings:
  patristicReading:
    - title: SERMON DE SAINT LÉON LE GRAND
      subtitle: Pour le jour anniversaire de sa consécration épiscopale

      content: |-
        %La fête qui célèbre le pasteur est celle de tout le troupeau, dans l’unité du corps mystique.%

        
      responsory: |-
        R/ De ta demeure de sainteté, Seigneur,
        regarde et bénis ton peuple.

        ous êtes un peuple acquis
        pour annoncer les louanges de celui
        qui vous a appelés des ténèbres à son admirable lumière. R/``

        Jadis vous n’étiez pas un peuple,
        vous êtes maintenant le peuple de Dieu. R/

morning:
  intercession:
    content: |-
      Par le Christ, notre Seigneur, louons et bénissons Dieu, notre Père de qui vient toute grâce et tout bien :

      R/ Béni sois-tu, Dieu et Père de Jésus Christ !

      Par ton Fils, tu nous as transmis le dessein bienveillant de ton amour,
      – ouvre nos oreilles et nos cœurs à la Bonne Nouvelle du Salut.

      Par ton Fils, tu nous as scellé avec nous une alliance éternelle,
      – rends-nous fidèles à te servir dans la foi.

      Par ton Fils, tu as racheté le monde, au prix de son sang,
      – fais de nos vies une continuelle offrande à ta gloire.

vespers:
  intercession:
    content: |-
      Avec les témoins du Christ ressuscité sur qui nous appuyons notre foi, rendons grâce à Dieu le Père :

      R/ Loué sois-tu, Dieu de gloire, Dieu notre Père.

      Pour toutes les communautés chrétiennes de cette région,
      – prions Dieu de les affermir dans la foi et la charité.

      Pour tous les habitants de cette région,
      – prions Dieu de les combler de ses bénédictions.

      Pour ceux qui souffrent autour de nous,
      – prions Dieu de leur apporter le soutien de sa grâce.

      Pour nous-mêmes qui menons ici notre vie chrétienne,
      – prions Dieu de nous inspirer dans nos actions.
