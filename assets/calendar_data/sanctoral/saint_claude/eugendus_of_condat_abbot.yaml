celebration:
  title: Saint Oyend
  subtitle: abbé
  description: |-
    Ce quatrième abbé de Condat (vers 490-512), le troisième des « Pères du Jura », était né à Izernore où son père devint prêtre ; lui-même fut offert au monastère à l'âge de six ans. Organisateur, il donne à la communauté une forme de vie pleinement cénobitique, notamment en remplaçant par des bâtiments adaptés les premières constructions détruites par un incendie. Mystique et cultivé, familier des longues oraisons voire des visions prophétiques, il portait sur son visage une grande allégresse. À sa mort, son nom s'imposera pour longtemps au monastère et à la ville, Saint-Oyan de Joux.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu, notre Père et notre joie, c'est pour te glorifier que nous faisons mémoire de Saint Oyend : Tu as illuminé son visage du rayonnement de ta présence et fait progresser la vie communautaire par son action. Nous t'en prions : que la force de ton amour soit notre lumière et nous fasse vivre en frères avec tout homme. Par Jésus.
