celebration:
  title: Saint Oyend
  subtitle: abbé
  description: |-
    Ce quatrième abbé de Condat (vers 490-512), le troisième des « Pères du Jura », était né à Izernore où son père devint prêtre ; lui-même fut offert au monastère à l’âge de six ans. Organisateur, il donne à la communauté une forme de vie pleinement cénobitique, notamment en remplaçant par des bâtiments adaptés les premières constructions détruites par un incendie. Mystique et cultivé, familier des longues oraisons voire des visions prophétiques, il portait sur son visage une grande allégresse. À sa mort, son nom s’imposera pour longtemps au monastère et à la ville, Saint-Oyan de Joux.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu, notre Père et notre joie, c’est pour te glorifier que nous faisons mémoire de Saint Oyend : Tu as illuminé son visage du rayonnement de ta présence et fait progresser la vie communautaire par son action. Nous t’en prions : que la force de ton amour soit notre lumière et nous fasse vivre en frères avec tout homme. Par Jésus Christ, ton Fils, notre Seigneur, qui vit et règne avec toi dans l’unité du Saint-Esprit, Dieu, pour les siècles des siècles.

readings:
  hymn:
    - ouvrez-vos-coeurs
  patristicReading:
    - title: De la « Vie des Pères du Jura »
      content: |-
        %La finesse psychologique de saint Oyend est attentive à chacun ; ses réformes pratiques accentuent la vie communautaire.%

        L’abbé Oyend mettait tous ses soins à assigner à chaque moine les fonctions ou les tâches pour lesquelles il le devinait plus particulièrement doué par les dons du Saint-Esprit. Ainsi un frère paisible et doux se voyait attribuer un service et un poste où les avantages de sa mansuétude et de sa patience ne fussent en aucune manière altérés par l’ardeur d’un compagnon agité. D’autres se trouvaient-ils au contraire marqués par la tache de l’orgueil ou de la vanité ? Il ne leur permettait pas de vivre à l’écart, de peur que, gonflés du sentiment malsain de leur supériorité personnelle, ils ne tombassent plus bas, dans les fautes plus graves, ne reconnaissant même plus leurs péchés et leurs vices, malgré des blâmes publics renouvelés. Apprenait-il entre temps que certains frères, subissant la condition de la fragilité humaine, étaient en proie aux morsures d’une tristesse dévorante ? Il survenait à l’improviste, montrait à dessein tant de gentillesse et de joie surnaturelles, réchauffait le cœur des malheureux par des paroles si saintes et si douces, que ceux-ci, purifiés du venin très pernicieux de la tristesse, se trouvaient, comme par l’onction d’une huile salutaire, guéris de leur âpre pessimisme. Mais les moines dont la conduite était trop libre, les moines frivoles trouvèrent toujours chez l’Abbé plus de rudesse et de sévérité. ~
        Illuminé, assurément, par l’Hôte qui demeurait en lui, il portait jusque sur son visage une grande allégresse ; ainsi on ne le vit jamais triste, jamais non plus on ne le vit rire. Les belles actions et la conduite des bienheureux Antoine et Martin ne sortaient pas de son esprit. ~
        La lecture lui procurait un tel réconfort, qu’il lui arrivait très souvent, pendant qu’on lisait au réfectoire, d’être subjugué par l’amour des biens futurs et d’entrer dans une sorte d’extase, au point d’en oublier la nourriture placée devant lui ; une joie profonde s’emparait de lui : méprisant la pérégrination de la vie présente, il aspirait ardemment au droit de cité préparé dans la patrie céleste. C’est lui d’ailleurs qui prit l’initiative, à la suite des anciens Pères, d’introduire l’usage de la lecture au réfectoire.
        C’est lui aussi qui, refusant de suivre sur ce point l’exemple des archimandrites orientaux, fit œuvre plus utile en soumettant tous les moines à la vie commune. Après la destruction des petites cellules individuelles, il décida que tous prendraient avec lui leur repos dans un asile unique : ceux qu’une salle commune réunissait déjà pour un commun repas, il voulut les réunir aussi dans un dortoir commun, les lits seuls étant séparés ; il y eut là, comme à l’oratoire, une lampe à huile, qui donnait toute la nuit sa lumière. Le saint Abbé, lui, n’eut jamais sa petite table particulière, comme le font certains ; jamais il ne prit une nourriture différente de celle des frères ; tout, en tout, appartenait à tous. ~
        De cellule, d’armoire, de cassette, personne en ce lieu n’en eut jamais d’aucune sorte. À personne l’occasion n’était donnée de travailler en vue de satisfaire la moindre nécessité personnelle. Car jusqu’à une simple aiguille, jusqu’aux fils de laine nécessaires à la couture et au raccommodage, tout était mis à la disposition commune.
      responsory: |-
        R/ Dieu nous a appelés des ténèbres
        à sa merveilleuse lumière.
        
        Demeurez en moi,
        comme je demeure en vous.

        Que tous soient un comme toi, Père,
        tu es en moi et que je suis en toi.

        Qu’ils soient en nous eux aussi,
        afin que le monde croie que tu m’as envoyé.

morning:
  hymn:
    - ouvrez-vos-coeurs
  evangelicAntiphon:
    - |-
      Tu es bienheureux, Oyend : tout jeune tu fus offert au saint Père Romain comme autrefois Samuel, et tu es devenu le temple du Christ.
  intercession:
    content: |-
      Unanimes dans la prière, adressons nos supplications au Seigneur.

      R/ Toi seul es Saint, toi seul, Seigneur !

      Tu veux faire de nous ta demeure,
      – ouvre nos cœurs à ta présence.

      Tu pries pour que notre unité soit parfaite,
      – renforce en nous les liens de communion avec toi et avec nos frères.

      Tu es la lumière pour tout homme venant en ce monde,
      – illumine-nous de ton visage.

      Tu vis dans la gloire du Père,
      – porte-lui nos prières et nos vies.

vespers:
  hymn:
    - ouvrez-vos-coeurs
  evangelicAntiphon:
    - |-
      Béni sois-tu, saint Oyend : sans perdre de temps dans tes journées, tu as été assidu à la lecture qui nourrit la foi et la prière.
  intercession:
    content: |-
      Que l’Esprit-Saint vienne en nous susciter notre prière :

      R/ Père saint, montre-nous ta miséricorde !

      Père saint, toi qui régis le ciel et la terre,
      – remplis tout vivant de tes bénédictions.

      Père saint, toi qui nous envoies ton Fils,
      – rassemble-nous tous en son corps.

      Père saint, toi qui veux que chaque homme soit sauvé,
      – envoie-nous annoncer l’Évangile du Christ.

      Père saint, toi qui nous appelles à ta gloire,
      – ouvre ton Royaume à nos défunts.

mass:
  - massType: DAY_MASS
    collect:
      - |-
        Dieu, notre Père et notre joie,
        c’est pour te glorifier que nous faisons mémoire de Saint Oyend :
        Tu as illuminé son visage
        du rayonnement de ta présence
        et fait progresser la vie communautaire par son action.
        Nous t’en prions :
        que la force de ton amour soit notre lumière
        et nous fasse vivre en frères avec tout homme.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    offeringPrayer:
      - |-
        Accepte, Seigneur, les offrandes de tes serviteurs.
        Que cette Eucharistie rende nos vies,
        comme celle de Saint Oyend,
        plus rayonnantes de foi et d’action de grâce.
        Par le Christ, notre Seigneur.
    prayerAfterCommunion:
      - |-
        Que la nourriture de vie que tu nous donnes,
        Seigneur, transforme nos existences
        pour qu’à l’exemple de Saint Oyend,
        nous ne cessions de travailler à la construction
        de ton Royaume d’Amour et de Vérité.
        Par le Christ, notre Seigneur.
