celebration:
  title: Bienheureux Jean Henry Gruyer et ses compagnons
  subtitle: martyrs
  description: |-
    L'accueil, dans la liturgie de notre diocèse, d'un religieux martyr du temps de la Révolution française nous provoque à faire mémoire de ces visages de sainteté manifestés en ces temps difficiles. Dans la foule des victimes des massacres de Septembre 1792 à Paris, l'Église a retenu les noms de trois évêques, de cent quatre-vingts prêtres et de deux diacres, dont elle a reconnu en 1926 qu'ils étaient morts en raison de leur fidélité au Siège apostolique. Jean Henry Gruyer est né et baptisé le 13 juin 1734 à Dole, actuellement du diocèse de Saint-Claude. Ordonné prêtre en 1764, il exerce son ministère à Angers puis surtout à Versailles. Il ne prête pas le serment et quitte Versailles en avril 1791 ; le 12 août 1792, il rentre à Paris et loge au séminaire Saint-Firmin, transformé en prison, où il est incarcéré le 13 août avec ses compagnons. Il y est massacré le 3 septembre 1792 à 5 heures du matin. Il est béatifié le 17 octobre 1926.
  commons:
    - martyrs
  color: red

oration:
  - |-
    En appelant, Seigneur, en ce jour Jean Henry Gruyer et ses compagnons au témoignage suprême du martyre, tu as manifesté que tu n'aimes rien tant que la liberté de ton Église ; par leur intercession, accorde à tous les baptisés de témoigner de toi sans entraves devant les hommes. Par Jésus Christ.
