celebration:
  title: Saint Lothain
  subtitle: abbé
  description: |-
    Né aux environs d'Autun dans la seconde moitié du V^e siècle, il s'y forme d'abord à la vie monastique. Aspirant à la solitude érémitique, il se retire ensuite dans le lieu nommé Silèze ; puis d'autres hommes se joignent à lui, et leur nombre croissant oblige à créer une seconde communauté, Maximiacum. Lothain est ordonné prêtre. Il meurt à 70 ans, un 1^er novembre, vers 540 ; la localité conserve son sarcophage et prendra son nom. Ses deux monastères, chronologiquement, doivent se placer juste après les premières fondations réalisées autour de Condat par les Pères du Jura.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu qui as conduit Saint Lothain dans notre région pour qu'il te consacre sa vie par la prière et la pénitence, accorde-nous, à son exemple, d'entendre ton appel à nous convertir et à vivre pour toi. Par Jésus Christ.
