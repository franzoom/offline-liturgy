celebration:
  title: Saint Lothain
  subtitle: abbé
  description: |-
    Né aux environs d'Autun dans la seconde moitié du V^e siècle, il s'y forme d'abord à la vie monastique. Aspirant à la solitude érémitique, il se retire ensuite dans le lieu nommé Silèze ; puis d'autres hommes se joignent à lui, et leur nombre croissant oblige à créer une seconde communauté, Maximiacum. Lothain est ordonné prêtre. Il meurt à 70 ans, un 1^er novembre, vers 540 ; la localité conserve son sarcophage et prendra son nom. Ses deux monastères, chronologiquement, doivent se placer juste après les premières fondations réalisées autour de Condat par les Pères du Jura.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu qui as conduit Saint Lothain dans notre région pour qu'il te consacre sa vie par la prière et la pénitence, accorde-nous, à son exemple, d'entendre ton appel à nous convertir et à vivre pour toi. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE LA VIE DE SAINT LAUTEIN
      subtitle: Un des premiers fondateurs au pays jurassien

      content: |-
        %Le chercheur de Dieu dans la vie de l'ermite devient le maître d'autres hommes attirés par sa spiritualité ; il transmet ainsi ce qu'il a d'abord appris d'un autre, puis vécu lui-même.%

        Il y eut un homme à la vie vénérable, nommé Lautein, du pays des Eduens, issu d'une famille distinguée. Même au temps de sa jeunesse, il ne s'adonna pas à la dissipation ; suivant au contraire les traces des vénérables pères, il disposait son cœur à écouter leurs recommandations. Il montra dans sa conduite ce qu'il serait dans son activité. Il brillait en effet par sa chasteté, non seulement celle du corps, aux yeux des hommes, mais celle de l'âme, au regard de Dieu ; surtout il aimait le Christ avec une pieuse crainte, et il le craignait avec amour.
        Bien entendu, selon la règle des divines Écritures, ne voulant pas devenir maître avant d'avoir été disciple, il se soumit aux directives d'un homme saint et religieux, l'abbé Laurent. Placé sous sa direction, il cultiva l'âme et le corps, sans perdre de temps, dans le seul soutien de Dieu.
        Entre-temps le renom de sa sainteté commença de se répandre partout, à retentir en tous lieux ; et beaucoup se mirent à quitter le siècle et à se soumettre à sa direction. De la sorte, on vit 70 moines rassemblés à Silèze pour le service du Seigneur. Il construisit encore un autre monastère, au lieu dit Maximiacus, où vécurent environ 40 moines. Tous pratiquaient avec rigueur l'abstinence, les veilles, l'obéissance, et toutes autres bonnes actions.
        Alors que son âge dépassait déjà largement la cinquantaine, par la volonté de Dieu et en considération des frères, il fut ordonné prêtre par le saint évêque de Maximiacus ; mais, voulant mener un genre de vie plus strict, il retournait à Silèze.
      responsory: |-
        Apprenons du Maître à devenir disciples.
        Il n'est pas venu juger ses frères
        mais les sauver.

        R/ Vivante est la Parole de Dieu,
        plus pénétrante qu'un glaive.

        V/ – Fils d'homme, je t'ai fait sentinelle :
        de ma part, tu avertiras mon peuple.
        – Fils d'homme, porte-leur mes paroles,
        qu'ils écoutent ou qu'ils n'écoutent pas.
    - title: DE LA RÈGLE DE SAINT BENOÎT
      subtitle: Ce que doit être l'abbé
      content: |-
        %À quelques années près, saint Lothain est contemporain de saint Benoît. Un passage de la Règle bénédictine montre le rôle éducateur du monachisme, face à des hommes parfois difficiles.%

        Dans son enseignement, l'abbé doit toujours observer la norme de l'Apôtre ainsi exprimée : Reprends, supplie, réprimande, c'est-à-dire qu'il doit diriger ses disciples par un double enseignement, montrant tout ce qui est bon et saint plus par ses actes que par ses paroles ; aux disciples doués d'intelligence, il exposera les préceptes du Seigneur en paroles, mais aux durs de cœur et aux plus simples, il montrera les préceptes divins par ses actes.
        Dans ses attitudes diverses, il se montrera toujours comme un maître farouche et tendre comme un père, c'est-à-dire qu'il doit se montrer plus dur envers les indisciplinés et les turbulents, et plus doux envers les obéissants, les doux et les patients.
        Quant aux négligents et aux méprisants, nous l'avertissons qu'il doit réprimander et corriger. Et qu'il ne ferme pas les yeux sur les péchés de ceux qui faillissent ; mais qu'il les retranche dès qu'ils commencent à se montrer, se souvenant du péril d'Héli, le prêtre de Silo. Les âmes bien nées et intelligentes, il les corrigera par des admonestations verbales une ou deux fois ; mais les insolents, les durs, les orgueilleux, les désobéissants, il les reprendra dès le début de leur faute, par le fouet et les coups du châtiment corporel, sachant qu'il est écrit : On ne corrige pas un sot avec des mots, et encore : Frappe ton fils de la verge et tu délivreras son âme de la mort.
      responsory: |-
        Venez, montons à la montagne du Seigneur
        pour qu'il nous enseigne ses voies.

        V/ – Moi, le Seigneur, je t'enseigne ce qui est salutaire,
        je te fais cheminer sur les sentiers où tu marches.

        R/ Le Seigneur est venu jusqu'à nous
        pour nous élever jusqu'à lui.
