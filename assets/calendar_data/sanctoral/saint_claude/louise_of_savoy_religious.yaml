celebration:
  title: Bienheureuse Louise de Savoie
  subtitle: religieuse
  description: |-
    Fille du bienheureux Amédée IX, duc de Savoie, et de Yolande de France, sœur de Louis XI, elle naît en 1462. À 17 ans, elle épouse Hugues de Chalon, et vit avec lui au château de Nozeroy, où rayonnent sa piété, sa charité pour les pauvres et les malades. Veuve en 1490, elle entre chez les Clarisses d’Orbe, l’un des couvents fondés par sainte Colette, où se trouve déjà la sœur de son mari. Elle y meurt le 24 juillet 1503 ; son corps est rapporté à Nozeroy en 1531 par suite de la Réforme protestante, et son culte est approuvé en 1839 par Grégoire XVI.
  commons:
    - saints-female_religious
  color: white

oration:
  - |-
    Tu nous invites, Seigneur, à compter pour rien les biens de ce monde en regard des richesses de ton Royaume ; accorde-nous de suivre l’exemple de la bienheureuse Louise de Savoie, pour que nous ayons la force de choisir la croix de ton Fils, et d’en faire la source de notre amour pour toi et pour nos frères. Par Jésus Christ.

readings:
  patristicReading:
    - title: États de vie différents, charité identique
      subtitle: |-
        Sa « Vie » a été écrite par une de ses proches à Nozeroy, devenue avec elle Clarisse à Orbe, Catherine de Saulx ; elle commence ainsi : « Pour avoir un peu de souvenance de la tant vertueuse et bénite Vie de notre très révérende mère et très excellente Dame… sœur Louise de Savoie…, sera ci récité quelque peu de sa perfection et de ses vertus ». Vient ensuite un aperçu du culte spontané qui lui fut rendu dès après sa mort.
      content: |-
        Nous lui avons ouï dire que jamais elle ne désira d’être mariée, mais bien d’être religieuse. Pourtant elle était de nature si craintive qu’elle n’osa pas manifester son désir, par peur d’offenser sa mère et ses autres nobles parents… Quand elle fut établie avec son mari, ils ordonnèrent si bien leur maison qu’il n’y avait rien à redire. Dieu lui donna bien le mari qu’il lui fallait : messire Hugues de Chalon, seigneur de Châtelguyon. ~
        Elle aimait surtout les pauvres ; c’est bien montré par les grandes aumônes qu’elle faisait – et volontiers les faisait secrètement. Elle avait grande compassion des lépreux, des veuves et des orphelins, des femmes enceintes. ~ Jamais on ne pouvait l’entendre dire du mal de qui que ce soit. Aussitôt qu’elle entendait parler de cette sorte, elle disait : je vous en prie, ne murmurez pas ; ce n’est peut-être pas comme on dit. Et toujours elle excusait autrui, sans jamais faire mauvais profit de rien. ~
        Touchant son manger, il ne fallait pas lui apprêter des viandes délicates ; les plus pauvres qu’elle pouvait avoir étaient celles qu’elle trouvait les meilleures. ~ Quand elle avait mal, elle le supportait avec tant de patience que ses femmes en étaient tout ébahies : elle disait toujours que c’était peu de chose.
        Quand trépassa le seigneur son mari, ce lui fut une douleur et une angoisse indicibles : car ils s’aimaient autant que des créatures peuvent le faire. Son affliction fut si profonde que chacun en avait compassion : il n’y avait cœur si dur qui, la voyant ainsi, ne fut enclin à pleurer. Mais elle fit de telle façon que cette tribulation tourne en profit pour son âme, et finalement en grande louange de Dieu et des hommes. ~
        Au monastère, les plus vils services à rendre aux malades, qui en auraient rebuté d’autres, furent sa grande joie. Quand elle visitait les sœurs malades, elle voulait les servir… et de ses propres mains, leur administrer ce qui leur était nécessaire. Voyant sa douceur, lesdites sœurs lui disaient : « ma sœur Louise, donnez moi donc telle chose ». Il semblait qu’elle leur fit grande allégresse tant par sa présence, ses saintes paroles, que par les gestes humains qu’elle était si prompte à réaliser pour elles. ~
        Les dernières paroles qu’elle prononça furent : « Maria mater gratiae » – Marie mère de grâce. Quand arrivèrent ces mots : « et hora mortis suscipe » – à l’heure de la mort accueille nous – la parole lui manqua ; elle « rendit, à ce point, sa bénite et sainte âme à Dieu joyeusement et moult doucement. Et oncques ne fut si belle ne plus plaisante qu’elle était en tirant à la mort ».
        A peine eut-elle expiré, en l’an 1503, que tout le peuple des villes voisines se porta à son ensevelissement. Les pauvres et les veuves montraient les habits qu’ils avaient reçus de Loyse ; les prêtres, les moines rappelaient les édifices religieux qu’elle avait fait rebâtir, les ornements sacrés, les secours qu’elle avait fournis ; la foule des pauvres s’écriait qu’ils avaient perdu leur mère et celle qui les nourrissait. La pâleur de la mort ne changea point son visage, et, même, son lit, sa cellule, ses habits et tout ce qui avait servi à son usage répandait une odeur céleste.
        Ces prodiges, et d’autres encore, qui ne furent pas rares à son ensevelissement, ne confirmèrent pas seulement d’une manière très positive, mais répandirent encore partout la croyance générale de sa grande sainteté. Par ce motif, elle fut placée dans un tombeau honorable et commença à être appelée par tout le monde « la Bienheureuse », mais surtout parce que plusieurs personnes avaient obtenu auprès de sa tombe soulagement et guérison.
      responsory: |-
        St. Porte du ciel, Jésus-Christ,
        Heureux qui s’avance vers toi
        et persévère dans l’amour.
        Il entrevoit déjà un reflet de ta gloire ;
        chaque jour augmente son désir
        jusqu’à l’heure voulue par le Père.

        R/ Tu combles l’attente des justes, Seigneur,
        Tu les reçois dans ta lumière.

        V/ – Tu leur enlèves toute richesse
        pour leur donner une vie sans mesure.
        – Tu leur apprends la folie de la croix
        pour leur découvrir les abîmes de la sagesse.
        – Tu les engages vers l’invisible
        pour leur montrer un jour la face du Père.

mass:
  - massType: DAY_MASS
    collect:
      - |-
        Tu nous invites, Seigneur, à compter pour rien les biens de ce monde en regard des richesses de ton Royaume ; accorde-nous de suivre l’exemple de la bienheureuse Louise de Savoie, pour que nous ayons la force de choisir la croix de ton Fils, et d’en faire la source de notre amour pour toi et pour nos frères. Par Jésus Christ.
    note: |-
      Pas de lecture propre : le Missel renvoie au Commun des saints (VII ou VIII pour les religieux, ou XI-XII pour les saintes femmes), avec en exemple : 1re lecture Ph 3, 8-14 (« Tout perdre pour gagner le Christ », Saints et Saintes 28) ; psaume 130 ; Évangile Mt 13, 44-46 (« Il va vendre tout ce qu’il possède, et il achète la perle », Saints et Saintes 5).
