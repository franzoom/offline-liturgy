celebration:
  title: Bienheureuse Louise de Savoie
  subtitle: religieuse
  description: |-
    Fille du bienheureux Amédée IX, duc de Savoie, et de Yolande de France, sœur de Louis XI, elle naît en 1462. À 17 ans, elle épouse Hugues de Chalon, et vit avec lui au château de Nozeroy, où rayonnent sa piété, sa charité pour les pauvres et les malades. Veuve en 1490, elle entre chez les Clarisses d'Orbe, l'un des couvents fondés par sainte Colette, où se trouve déjà la sœur de son mari. Elle y meurt le 24 juillet 1503 ; son corps est rapporté à Nozeroy en 1531 par suite de la Réforme protestante, et son culte est approuvé en 1839 par Grégoire XVI.
  commons:
    - saints-female_religious
  color: white

oration:
  - |-
    Tu nous invites, Seigneur, à compter pour rien les biens de ce monde en regard des richesses de ton Royaume ; accorde-nous de suivre l'exemple de la bienheureuse Louise de Savoie, pour que nous ayons la force de choisir la croix de ton Fils, et d'en faire la source de notre amour pour toi et pour nos frères. Par Jésus Christ.

readings:
  patristicReading:
    - title: ÉTATS DE VIE DIFFÉRENTS, CHARITÉ IDENTIQUE
      subtitle: null
      content: null
      responsory: |-
        Porte du ciel, Jésus-Christ,
        Heureux qui s'avance vers toi
        et persévère dans l'amour.
        Il entrevoit déjà un reflet de ta gloire ;
        chaque jour augmente son désir
        jusqu'à l'heure voulue par le Père.

        R/ Tu combles l'attente des justes, Seigneur,
        Tu les reçois dans ta lumière.

        V/ – Tu leur enlèves toute richesse
        pour leur donner une vie sans mesure.
        – Tu leur apprends la folie de la croix
        pour leur découvrir les abîmes de la sagesse.
        – Tu les engages vers l'invisible
        pour leur montrer un jour la face du Père.
