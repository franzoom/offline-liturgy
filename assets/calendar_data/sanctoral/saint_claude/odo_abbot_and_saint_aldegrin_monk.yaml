celebration:
  title: Saints Odon et Aldegrin
  subtitle: abbé et moine
  description: |-
    Odon, né vers 879 dans le Maine, d’abord orienté vers le métier des armes, se tourne ensuite vers l’état religieux et devient chanoine de Saint-Martin de Tours ; il s’y adonne aux études, qu’il perfectionne à Paris. Aspirant à une vie plus austère, il arrive vers 909 à Baume où l’a précédé Aldegrin ; muni de cent livres, il y dirige l’école monastique. L’œuvre réformatrice de Bernon et d’Odon n’est pourtant pas sans provoquer des remous dans la communauté. Après la mort de Bernon (927), Odon lui succède à la tête de Cluny, qui déjà s’agrandit. Il meurt en 942 ; il mérite de figurer parmi les grands moines d’Occident. Aldegrin, d’abord soldat, partage les aspirations d’Odon vers la vie monastique ; sa recherche le conduit à Baume, où l’accueille l’abbé Bernon. Il y fait venir Odon, puis se retire dans un ermitage à quelque distance du monastère ; un lieu-dit de Baume conserve son souvenir.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Seigneur notre Dieu, tu as appelé Saint Odon et Saint Aldegrin à se retirer du monde pour te consacrer leur vie, et tu as mis en leur cœur le désir d’accroître le rayonnement de la vocation monastique ; que ton Esprit nous consacre davantage aux affaires de ton Royaume en soutenant notre vie de prière et de témoignage.

readings:
  patristicReading:
    - title: CONFÉRENCE DE SAINT ODON, ABBÉ
      subtitle: Sur la méditation des Écritures (1,1)
      content: |-
        %Le texte de la Sainte Écriture est à la fois lumière et force, car il est Parole de Dieu.%

        Dieu, le créateur et le juge des hommes, bien qu’il ait en toute justice chassé notre race du bonheur du paradis, s’est cependant souvenu de sa bonté et, pour que l’homme n’encoure pas la condamnation qu’il méritait, il adoucit, par une foule de bienfaits, les difficultés de son pèlerinage ici-bas… Par une grâce plus grande encore, il envoya au monde la sainte Ecriture, qui ne peut être détruite ; combien, dans l’obscurité de cette vie, elle éclaire nos pas et notre conduite, comme le dit Pierre ! Combien, selon le mot de Paul, elle procure patience et consolation au milieu des adversités de toutes sortes ! S’il existe une chose qui puisse garder le sage dans la tranquillité de l’esprit, au sein des tourbillons du monde, c’est bien, j’en suis persuadé, la méditation des Ecritures ; car la seule méthode pour connaître Dieu et nous connaître nous-mêmes, c’est celle que contiennent les livres saints. En cela, nous dépassons de loin non seulement tous les autres êtres vivants, mais aussi les sots de toute espèce. Comme le dit Salomon, nous marchons vers le lieu où est la vie, ce qui veut dire vers la connaissance des Ecritures, car c’est en elles qu’est la vie, selon le témoignage du Seigneur lui-même : %les paroles que je vous ai dites%, proclame-t-il, %sont esprit et vie% (Jn 6, 64). Elles sont aussi un miroir dans lequel nous voyons l’image encore obscure des mystères divins et qui nous permet de savoir ce que nous sommes, au point de faire apparaître nos progrès dans le bien et nos égarements. Là est révélé ce qui démolit, là est raconté tout ce qui se construit. Et malgré cela, la plupart des hommes préfèrent écouter des bouffonneries, plutôt que cet enseignement de Dieu. Négliger la lecture de la parole sacrée, c’est pourtant se conduire comme celui qui rejetterait la lumière, alors qu’il est plongé dans les ténèbres, ou l’ombre, alors qu’il suffoque en plein soleil, ou les remèdes, alors qu’il est malade. Là, je l’affirme, est la voix de Dieu rappelant ceux qui l’ont délaissé en disant, par la bouche du prophète : %Revenez, mes fils infidèles% (Jr 3, 14), ou encore, contrairement à l’habitude des hommes, rappelant l’épouse déshonorée : %Ecoute, toi qui t’es prostituée, la parole du Seigneur%, etc… (Ez 16, 35). Mais pour signifier que les mortels, en s’écartant du Seigneur, sont allés bien loin, non certes dans l’espace, mais par leur conduite, il ne s’adresse plus à eux de vive voix, comme il l’a fait jadis pour leurs pères, mais par la Sainte Ecriture ; elle est comme une lettre adressée à des gens qui sont loin, pour les faire revenir, à ceux qui se sont écartés, pour les persuader de se souvenir d’une vieille amitié.
        Si j’écris cela, c’est pour vous faire retrouver le goût de cette lecture, car – je voudrais le dire pour votre paix – nous n’avons pas assez faim de cette nourriture qu’est la parole de Dieu.
      responsory: |-
        R/ À toi, Seigneur notre Dieu, les choses cachées ;
        à nous, celles que tu nous as révélées
        pour que nous vivions de ta Parole.

        Le Seigneur vous a donné un cœur pour connaître,
        des yeux pour voir, des oreilles pour entendre.

        Voici l’alliance jurée par le Seigneur :
        Il fera de toi un grand peuple, et lui sera ton Dieu.

        Que nul d’entre vous
        ne détourne son cœur du Seigneur
        en allant servir les dieux des nations.

