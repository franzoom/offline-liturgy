celebration:
  title: Saints Odon et Aldegrin
  subtitle: abbé et moine
  description: |-
    Odon, né vers 879 dans le Maine, d'abord orienté vers le métier des armes, se tourne ensuite vers l'état religieux et devient chanoine de Saint-Martin de Tours ; il s'y adonne aux études, qu'il perfectionne à Paris. Aspirant à une vie plus austère, il arrive vers 909 à Baume où l'a précédé Aldegrin ; muni de cent livres, il y dirige l'école monastique. L'œuvre réformatrice de Bernon et d'Odon n'est pourtant pas sans provoquer des remous dans la communauté. Après la mort de Bernon (927), Odon lui succède à la tête de Cluny, qui déjà s'agrandit. Il meurt en 942 ; il mérite de figurer parmi les grands moines d'Occident. Aldegrin, d'abord soldat, partage les aspirations d'Odon vers la vie monastique ; sa recherche le conduit à Baume, où l'accueille l'abbé Bernon. Il y fait venir Odon, puis se retire dans un ermitage à quelque distance du monastère ; un lieu-dit de Baume conserve son souvenir.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Seigneur notre Dieu, tu as appelé Saint Odon et Saint Aldegrin à se retirer du monde pour te consacrer leur vie, et tu as mis en leur cœur le désir d'accroître le rayonnement de la vocation monastique ; que ton Esprit nous consacre davantage aux affaires de ton Royaume en soutenant notre vie de prière et de témoignage. Par Jésus Christ.

readings:
  patristicReading:
    - title: CONFÉRENCE DE SAINT ODON, ABBÉ
      subtitle: |-
        Sur la méditation des Écritures (1,1)

        Le texte de la Sainte Écriture est à la fois lumière et force, car il est Parole de Dieu.
      responsory: |-
        R/ A toi, Seigneur notre Dieu, les choses cachées ;
        à nous, celles que tu nous as révélées
        pour que nous vivions de ta Parole.
