celebration:
  title: Saint Pierre de Tarentaise
  subtitle: évêque
  description: |-
    Né en 1102, il entre vers ses vingt ans, avec son frère, au monastère de Bonnevaux en Dauphiné ; en 1132, il est envoyé fonder Tamié dont il fut le premier abbé ; c’est le printemps cistercien. Dix ans plus tard, il doit accepter l’archevêché de Tarentaise. Sa réputation le fait appeler au loin pour pacifier des querelles, par exemple pour arbitrer des procès de l’abbaye de Saint-Oyan, dès 1157 ; sa venue y attire la grande foule, qui raconte ses miracles. Il soutient encore la résistance cistercienne au schisme de Frédéric Barberousse, spécialement dans notre province dont cet empereur est aussi le comte influent. Au cours d’un voyage, après une halte à Dammartin, il meurt en 1174 à Bellevaux, premier monastère cistercien comtois.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Tu as voulu, Seigneur, que la vie et la prédication de l’évêque Saint Pierre de Tarentaise soient la fierté de ton Église ; accorde-nous de pouvoir toujours, avec l’aide de sa prière, suivre ce magnifique exemple de sainteté. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE LA VIE DE SAINT PIERRE DE TARENTAISE, PAR GEOFFROY D’HAUTECOMBE
      subtitle: Le rayonnement d’un saint en Franche-Comté
      content: |-
        %Le contemplatif rayonne, attire le peuple qui aspire au salut corporel et spirituel ; mais il rend grâce de son action à Dieu, par l’intercession des saints – par exemple, de saint Oyend.%
        
        Alors que de partout commençait à affluer près du tombeau de saint Oyend une foule innombrable et étouffante de personnes qui recherchaient la guérison de leur âme et de leur corps, demandaient un contact, imploraient une bénédiction, survint une affaire, qui fit séjourner l’évêque Pierre de Tarentaise plus de deux mois au monastère de Saint-Oyend, au pays jurassien. Toute cette région eut connaissance des remarquables guérisons qu’il accomplissait. Il en résulta un incroyable concours de peuple ; comme si ces gens avaient juré sa mort, non seulement ils comprimaient mais écrasaient cet homme sans protection.
        À grand-peine trouva-t-on enfin un lieu adapté : la tour de l’église de Saint-Oyend, à laquelle on accédait par deux escaliers, de part et d’autre. On y installa donc son siège, entouré d’une forte barrière de bois ; de la sorte, ceux qui montaient l’un après l’autre par un escalier recevaient seulement une imposition de la main, ou entendaient une bonne parole et les réponses à leurs questions. Ils redescendaient de l’autre côté, et ainsi ne pouvait se produire aucune bousculade, ni entre eux ni à son préjudice.
        Grâce à lui, en cette occasion, c’est en grand nombre que des aveugles retrouvaient la vue, des sourds l’audition, des muets la parole, des boiteux une bonne marche, des affligés par divers maux la guérison désirée ; à tel point que quelqu’un aurait du mal à compter, ou à garder par écrit, les miracles prodigieux par lesquels Dieu fut glorifié dans son serviteur. Mais lui renvoyait tout le monde à la mémoire bénie de saint Oyend, pour qu’ils rendent grâce à Dieu et à son vénérable confesseur Oyend. ~
        Ce saint homme achevait sa 33^e année d’épiscopat (le même nombre d’années que le Sauveur, selon la tradition, a passées dans sa chair). Il approchait donc du monastère de Bellevaux, situé dans le diocèse de Besançon, quand une fièvre brûlante le saisit ; il se reposa un peu près d’un village voisin, nommé Dammartin. ~
        Quand le saint évêque parvint enfin au monastère, toute la communauté exulta de joie ; la nouvelle marquante et très heureuse de son arrivée se répandit aussi dans les lieux voisins. Mais quand fut connue la maladie de celui qui par ses prières avait remis sur pied tant de malades, survinrent une crainte et une tristesse profondes, atteignant également chacun, dans son cœur et dans son attitude extérieure. Lui, dominant son pauvre corps qui peu à peu perdait ses forces, mais gardant son âme inébranlable, les consolait, offrant à chacun la faveur de sa bonté et sa gaieté habituelles, cachant ses propres tourments… lui dont tous les actes, tous les sentiments, toute la vie, bref : tout l’homme, furent humilité, dévouement, charité et compassion.
        Alors arriva la fête de l’Exaltation de la sainte Croix, au cours de laquelle le Seigneur avait décidé d’exalter celui qui mit toute son ardeur à célébrer cette Croix avec une très fidèle adoration et un très fervent amour. Il avait prévu pour son dernier passage de se prémunir des sacrements du Seigneur, dont il avait toujours été un ministre très zélé. Alors, toutes choses étant parfaitement en règle, entouré de ses fils – eux à qui il avait laissé le riche héritage de sa bénédiction paternelle – qui chantaient des psaumes et priaient, il rejoignit ses pères.
        De nombreuses personnes, des ecclésiastiques et même des laïques, gens modestes aussi bien que distingués, étaient venus de la région même ; mais c’est pour ses obsèques surtout qu’accourut une foule encore plus nombreuse – si toutefois elle était dénombrable. Deux jours et deux nuits, auprès du saint corps, fut montée une garde vigilante, avec des psaumes et des cantiques spirituels. Enfin le troisième jour eut lieu son enterrement, célébré par l’archevêque de Besançon – demeuré catholique grâce à l’action efficace du défunt – en présence de très nombreux abbés. On ensevelit son corps devant le saint autel, dédié à la bienheureuse Marie toujours vierge ; mais son influence prouve qu’il reste vivant.
        Il avait bien vingt ans lorsqu’il fit son entrée au monastère de Bonnevaux, où il vécut quelque dix ans ; il en passa autant à Tamié. Ajoutons les 33 années complètes de son épiscopat ; sa vie atteint donc l’âge de 73 ans. Son décès eut lieu l’an 1175 de l’Incarnation de notre Seigneur, qui avec le Père et l’Esprit Saint, un seul Dieu au-dessus de tout, est béni pour les siècles. Amen.
      responsory: |-
        R/ Ô Christ, tu es venu dans le monde
        pour sauver les pécheurs.

        V/ – Je rends grâce au Seigneur Jésus :
        il m’a jugé assez fidèle
        pour m’appeler à son service.
        – En moi la grâce du Seigneur a surabondé,
        avec la foi et la charité
        qui est dans le Christ Jésus.
