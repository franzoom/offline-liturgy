mass:
  - massType: DAY_MASS
    collect:
      - |-
        Dieu qui veux que tous les hommes soient sauvés, tu as choisi Pierre-François Néron pour aller porter aux peuples d’Orient la connaissance de ton nom. À l’exemple de celui qui t’a donné sa vie jusqu’au martyre, suscite encore parmi nous des vocations de chrétiens passionnés par l’annonce de l’Évangile ; aide-nous à donner notre temps sans compter pour que ceux qui sont loin de toi puissent te connaître. Par Jésus Christ.
    note: |-
      Le Missel ne donne pas de lecture fixe propre, seulement des suggestions au Commun des martyrs : 1ère lecture « Martyrs », par exemple « Malheur à moi si je n’annonçais pas l’Évangile » (1 Co 9, 16-19.22-23) ou « Si nous sommes morts avec lui, avec lui nous vivrons » (2 Tm 2, 8-13 ; 3, 10-12) ; psaume 95 ; évangile « Martyrs », par exemple « De toutes les nations faites des disciples » (Mt 28, 16-20) ou « Si le grain meurt, il donne beaucoup de fruit » (Jn 12, 24-26).
    offeringPrayer:
      - |-
        Que nos offrandes puissent te plaire, Seigneur, comme a su te plaire la vie dont le bienheureux Pierre-François Néron t’a fait le don, à l’exemple du Christ. Lui qui.
    prayerAfterCommunion:
      - |-
        Seigneur notre Dieu, puisque ton Fils nous a donné son corps en nourriture, augmente en nous les forces de charité et de témoignage qui ont conduit le bienheureux Pierre-François Néron à s’engager au service de la mission de l’Église jusqu’au martyre. Par Jésus.
