celebration:
  title: Bienheureux Pierre-François Néron
  subtitle: martyr
  description: |-
    Né en 1818 à Bornay, il y mène d’abord une vie insouciante. À 19 ans, empêché par son père d’aller danser, il passe la nuit à une lecture qui provoque sa conversion. Aidé par son curé, il se met alors à l’étude, entre en 1839 au séminaire de Nozeroy, fait sa philosophie à celui de Vaux, et passe une année au Grand Séminaire de Lons. En 1846 il part aux Missions étrangères de Paris ; ordonné prêtre en juin 1848 par Mgr Affre, il est envoyé au Tonkin occidental. Lors de la persécution de Tu-Duc, il est arrêté par suite d’une trahison, durement torturé, et finalement décapité le 3 novembre 1860. Béatifié en 1909, il est le seul martyr du Jura.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Dieu qui veux que tous les hommes soient sauvés, tu as choisi Pierre-François Néron pour aller porter aux peuples d’Orient la connaissance de ton nom. À l’exemple de celui qui t’a donné sa vie jusqu’au martyre, suscite encore parmi nous des vocations de chrétiens passionnés par l’annonce de l’Évangile ; aide-nous à donner notre temps sans compter pour que ceux qui sont loin de toi puissent te connaître. Par Jésus Christ.

readings:
  patristicReading:
    - title: Lettre de Mgr Theurel sur le martyre de Pierre-François Néron (10 janvier 1861)
      subtitle: Le martyr donne sa vie pour le Christ, mais aussi à son image.
      content: |-
        Dans la nuit du 5 au 6 août [1860], le maire chrétien du village de Ta-Xa – suivi du chef de canton qui avait arrêté M. Néron deux ans auparavant – maire qui avait longtemps donné asile à notre confrère, aujourd’hui converti en Judas, vient se présenter à la porte de la maison de refuge, et l’appelle par son nom. M. Néron, reconnaissant la voix de son ancien ami, sort sans défiance ; mais à peine a-t-il franchi le seuil que le traître lui décharge sur les jarrets un grand coup de bâton qui le fait tomber à la renverse. La troupe du chef de canton, composée d’environ vingt hommes, se jette alors sur cette proie facile, garrotte fortement son prisonnier, l’entraîne dans une barque amenée à ce dessein, et s’éloigne à la hâte. ~
        Le 2 septembre, M. Néron fut amené solennellement devant le tribunal composé du mandarin préfet, du mandarin des tributs et du mandarin de la justice. Interrogé sur l’époque de son arrivée en ce pays, sur les lieux qu’il avait habités, sur l’expédition franco-espagnole en Cochinchine, il répondit en peu de paroles et avec une prudence parfaite : ce dont les juges n’étant pas satisfaits, ils le menacèrent du rotin. M. Néron répondit que le rotin ne l’effrayait pas, que l’ange de Dieu saurait bien le guérir des blessures qu’on lui ferait. Il fut donc étendu par terre et allongé violemment selon l’usage, puis on fit jouer le bâton. De temps en temps les mandarins interrompaient la série des coups pour adresser au patient quelques questions. Mais celui qui auparavant parlait peu, garda alors un silence absolu, se contentant de souffrir pour Dieu, aussi longtemps qu’il plairait aux hommes de le frapper. Après quarante coups qui n’arrachèrent pas à M. Néron le plus léger soupir, ordre fut donné au bourreau de s’arrêter. Le confesseur, dégagé de ses liens, se releva tranquillement et rentra dans sa cage ; la séance était levée. ~
        Le 3 novembre, M. Néron fut conduit au supplice. Le lieu était éloigné de la ville d’environ une demi-heure : il y alla à pied, marchant les yeux baissés, et récitant des prières. Son diacre et le prêtre de la paroisse étaient mêlés à la foule, et, au moment même de l’exécution, se tenaient en face de lui, à une distance de cinq à six mètres. Il ne les aperçut point, absorbé qu’il était en Dieu. ~
        Le bourreau chercha un remplaçant, offrant trois ligatures [monnaie du pays] à qui donnerait à sa place le fatal coup de sabre, et publiant hautement la répugnance qu’il avait, cette fois, à remplir son office ; mais il ne trouva personne qui consentît à le suppléer.
        Au premier coup de sabre, M. Néron demeura fixe sur ses genoux ; au second coup, la tête tomba. On remarqua que ni avant, ni pendant, ni après l’exécution, le corps et la tête du missionnaire n’avaient éprouvé la moindre convulsion, comme s’il eût été insensible à la douleur.
        A peine la tête fut-elle séparée du tronc, que bourreau, capitaines et soldats se précipitèrent sur ces restes sanglants, pour en emporter des reliques, les uns déchirant par lambeaux les habits du martyr, les autres imbibant de son sang des étoffes apportées à ce dessein.
        Par les soins du curé de la paroisse, un païen de la ville – à défaut de chrétien, dont aucun n’osa paraître en cette occasion – se présenta au nom de l’humanité, et dit que, le prêtre étranger n’ayant personne pour lui rendre les derniers devoirs, il demandait au mandarin la permission d’ensevelir son corps. Cette autorisation fut accordée, et le corps du martyr put reposer dans un cercueil, au lieu même du supplice.
        [Quant à la tête, après avoir été exposée trois jours, elle fut jetée au fleuve et ne put être retrouvée].
      responsory: |-
        St. De la détresse des prisons
        monte le cri des fils de Dieu
        persécutés ;
        mais le Royaume est proche :
        bientôt se lèvera
        le Fils de l’Homme qu’ils acclament.

        R/ Dieu vivant, Seigneur ressuscité,
        nous croyons en toi.

        V/ – Un moment vous souffrirez,
        mais j’ai vaincu le monde,
        gardez courage.
        – En vérité, je vous le dis,
        si quelqu’un garde ma parole,
        il ne verra jamais la mort.
        – Je suis la résurrection ;
        celui qui me donne sa foi,
        vivra même dans la mort.

