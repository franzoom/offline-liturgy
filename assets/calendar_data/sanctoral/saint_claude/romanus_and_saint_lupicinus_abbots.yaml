celebration:
  title: Saints Romain et Lupicin
  subtitle: abbés fondateurs
  description: |-
    Ces deux frères, premiers « Pères du Jura », sont assez bien connus grâce à la remarquable Vie rédigée par un moine contemporain de Saint Oyend. Originaire de la région, formé dans un monastère lyonnais, Romain se retire à 35 ans, vers 435, dans un « désert » au confluent de deux rivières, pour y vivre en ermite. Il est bientôt rejoint par Lupicin, puis par d’autres ; une vie commune s’esquisse, dans ce lieu nommé Condadisco, puis dans un autre appelé Lauconne qui comptera bientôt 150 moines, enfin à Romainmôtier. Tandis que Romain semble trop indulgent, son frère manifeste un caractère intransigeant d’ascète et de chef. Le premier — le seul à devenir prêtre — meurt vers 460, transporté au monastère de 105 moniales que sa sœur dirigeait à La Balme, et qui deviendra Saint-Romain de Roche ; Lupicin de même laissera son nom à la localité qui vers 480 recevra son corps.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu de nos pères dans la foi, tu as voulu que Saint Romain et Saint Lupicin soient les premiers à réaliser la vie monastique dans notre région. Accorde-nous de poursuivre leur œuvre en maintenant dans nos pays une vie de foi, de prière et de travail qui honore ton nom et serve nos frères.

readings:
  patristicReading:
    - title: De la « Vie des Pères du Jura »
      content: |-
        %Les pionniers de la vie monastique dans notre région sont aussi des continuateurs : ils transposent dans le Jura l’idéal réalisé par les Pères du désert.%

        A. Romain, le premier des trois Pères et dès les origines, reçut le titre d’abbé. Il était d’une assez bonne famille, à en juger par la lignée des descendants issus de celle-ci, et originaire, comme on nous l’apprend, de la Gaule Séquanaise. Avant lui, dans cette province, aucune sorte de moine ne s’était voué, pour faire profession religieuse, à la solitude ou aux observances communautaires.
        Il n’était pas, certes, particulièrement instruit, mais, mérite plus rare, il était doté d’une pureté, d’une charité sans égales, au point qu’on ne le vit ni, dans son enfance, s’adonner aux folâtreries puériles, ni, dans la force de l’âge, s’asservir aux passions humaines et aux liens du mariage. C’est dans sa trente-cinquième année environ qu’attiré par les retraites du désert, après avoir quitté sa mère, sa sœur et son frère, il pénétra dans les forêts du Jura proches de son domaine. Parcourant en tous sens ces forêts appropriées et favorables à son idéal de vie, il finit par trouver, au-delà, parmi des vallées bordées de rochers, un endroit découvert propice à la culture : là, les escarpements de trois montagnes s’écartent un peu l’un de l’autre, laissant entre eux un replat de quelque étendue. Comme en ce lieu se rejoignent les lits de deux cours d’eau, le site où se « constitue » une rivière unique ne tarda pas à être appelé couramment Condadisco.
        Le nouvel hôte, cherchant une demeure répondant à ses vœux, trouva du côté de l’orient, au pied d’une montagne rocheuse, un sapin très épais, écartant en cercle sa ramure et qui, déployant sa large chevelure, couvrit le disciple de Paul comme autrefois le palmier avait couvert Paul lui-même. En dehors du périmètre couvert par l’arbre, une source s’épanchait et offrait ses ondes glacées. ~
        Ayant donc apporté des semences et une pioche, le bienheureux commença, en ce lieu, tout en pratiquant assidûment la prière et la lecture, à satisfaire par le travail manuel, selon l’institution monastique, aux besoins d’une modeste existence. ~
        Avant d’embrasser la vie religieuse, il avait connu le vénérable Sabin, abbé du Confluent lyonnais, sa règle laborieuse et la vie de ses moines ; puis, comme une abeille butineuse, après avoir recueilli en chacun d’eux les fleurs de leurs perfections, il était rentré chez lui. De ce monastère aussi, sans rien manifester de ses très saintes ambitions, il emportait le livre de la « Vie des saints Pères » et les remarquables « Institutions des Abbés ».

        B. Lupicin, cadet de Romain par la naissance, mais bientôt, par la sainteté, son égal, averti de nuit par son frère dans une vision, quitta pour l’amour du Christ celles que le bienheureux Romain avait déjà laissées, sa sœur et sa mère, et, avec ardeur, gagna la cabane de son frère et adopta son état de vie. ~
        Pour contenir le nombre accru des disciples, ils s’établirent non loin de l’arbre, sur une sorte de petite colline en pente douce où se trouve maintenant, en souvenir, l’oratoire réservé à la prière privée ; après avoir dégrossi à la doloire et poli avec le plus grand soin des pièces de bois, ils se construisirent des huttes et en préparèrent d’autres pour ceux qui arriveraient.
        Les deux Pères se surpassaient mutuellement par des qualités complémentaires et indispensables dans l’art de diriger et de gouverner. Car si le bienheureux Romain était très miséricordieux envers tous, d’un calme parfait, son frère était plus sévère, et pour corriger et diriger les autres, et d’abord envers lui-même. Romain, tout espoir de pardon fût-il perdu, usait spontanément d’indulgence envers les coupables ; l’autre, craignant que des peccadilles répétées n’aboutissent à la faute, blâmait avec beaucoup de vigueur. Romain n’imposait pas aux frères plus de privations que leur propre volonté ne pouvait en accepter ; Lupicin, lui, offrant son exemple à tous, ne permettait à personne de se soustraire à ce que l’aide de Dieu rend possible. ~
        Les très saints Pères, dans les forêts voisines, nullement dépourvues d’endroits moins en pente et plus fertiles, coupèrent les sapins, arrachèrent les souches ; avec la serpe, ils défrichèrent et firent des prés unis ; avec la charrue, ils égalisèrent le sol et firent des champs, de sorte que ces terrains propices aux cultures adoucirent l’indigence des habitants de Condat. Pourtant, chacun des deux monastères était soumis à l’autorité des deux Abbés. Toutefois, le Père Lupicin vivait plus particulièrement, et plus librement, à Laucone — c’est le nom que porte ce lieu —, à tel point que, à la mort du bienheureux Romain, il n’y laissa pas moins de cent cinquante frères, qu’il avait formés suivant sa propre discipline.
        En outre, non loin de là, sur une falaise élevée, dominée par un rocher naturel et bordée par un arc rocheux recélant dans ses flancs de vastes cavernes, les saints, d’après la tradition, établirent, guidés dans leur choix par l’affection familiale, une Mère pour une communauté de vierges, et assumèrent en ce lieu le gouvernement de cent cinq moniales.
      responsory: |-
        R/ Tout est néant,
        Rien n’est vrai que l’amour.

        N’attache pas ton cœur à ce qui passe…

        Ne dis pas : j’ai réussi, je suis payé de ma peine…

        Ne te repose pas dans tes œuvres : elles vont te juger…
        
        Garde en ton cœur la Parole : voilà ton trésor…

morning:
  evangelicAntiphon:
    - |-
      Le peuple chantera tes louanges, Romain : tu as remis ta communauté à la charité pastorale de Lupicin : et, pur de toute faute, tu as remis ta vie à Dieu.
  intercession:
    content: |-
      Prions avec foi le Christ Jésus, notre Seigneur : élevé dans la gloire du Père, il intercède pour nous :

      R/ Ô Seigneur, écoute et prends pitié.

      Pour l’Église qui unit chaque jour son sacrifice à celui que tu ne cesses d’offrir à ton Père.

      Pour les moines et les moniales, pour les religieux et les religieuses, qui consacrent leur vie à la louange et à la supplication.

      Pour ceux qui ne croient pas en toi mais qui marchent vers toi dans la droiture de leur conscience.

      Pour nous-mêmes et pour ceux qui nous sont proches, que tu as choisis pour servir en présence de ton Père.

vespers:
  evangelicAntiphon:
    - |-
      La terre que Romain et Lupicin ont sanctifiée, le peuple qu’ils protègent et l’Église qu’ils entraînent à leur suite te chantent, Seigneur, leur action de grâce.
  intercession:
    content: |-
      Adressons notre prière au Christ, le Fils du Père :

      R/ Sauveur du monde, sauve-nous !

      Tu t’es retiré dans la solitude pour prier ton Père,
      – soutiens la prière quotidienne de tes fidèles et présente-la à Dieu.

      Tu as pris soin des pauvres et des malades,
      – renforce en nous le souci fraternel de tous les démunis.

      Tu as rendu grâce à ton Père en nous livrant le Pain de Vie,
      – fais de nos vies une action de grâce permanente.

      Tu nous as donné ta vie sur la croix,
      – reçois celle de ceux qui meurent en ce moment.

mass:
  - massType: DAY_MASS
    note: Commun des saints et saintes (VII ou VIII pour les religieux) ; le Missel ne fixe aucune lecture propre, seulement des suggestions dans ce Commun.
    collect:
      - |-
        Dieu de nos pères dans la foi,
        tu as voulu que Saint Romain et Saint Lupicin
        >soient les premiers à réaliser
        >la vie monastique dans notre région.
        Accorde-nous de poursuivre leur œuvre
        >en maintenant dans nos pays une vie de foi,
        >de prière et de travail
        qui honore ton nom et serve nos frères.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    offeringPrayer:
      - |-
        Seigneur,
        fais que nous présentions avec un cœur pur
        >l’offrande de ce pain et de ce vin
        >où les Saints Romain et Lupicin ont trouvé,
        >pour ta gloire,
        >l’aliment de leur vie chrétienne.
        Par le Christ, notre Seigneur.
    prayerAfterCommunion:
      - |-
        Père plein de tendresse,
        maintiens notre communion avec toi
        >par ce pain de vie que nous venons de manger ensemble.
        Et puisque tu as uni dans la sainteté
        >Romain et Lupicin qui étaient déjà frères par le sang,
        fortifie nos liens de famille et d’amitié
        >pour qu’ils servent à la construction de ton Royaume.
        Par le Christ, notre Seigneur.
