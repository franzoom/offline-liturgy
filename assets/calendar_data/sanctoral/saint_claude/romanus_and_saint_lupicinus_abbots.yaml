celebration:
  title: Saints Romain et Lupicin
  subtitle: abbés fondateurs
  description: |-
    Ces deux frères, premiers « Pères du Jura », sont assez bien connus grâce à la remarquable Vie rédigée par un moine contemporain de Saint Oyend. Originaire de la région, formé dans un monastère lyonnais, Romain se retire à 35 ans, vers 435, dans un « désert » au confluent de deux rivières, pour y vivre en ermite. Il est bientôt rejoint par Lupicin, puis par d'autres ; une vie commune s'esquisse, dans ce lieu nommé Condadisco, puis dans un autre appelé Lauconne qui comptera bientôt 150 moines, enfin à Romainmôtier. Tandis que Romain semble trop indulgent, son frère manifeste un caractère intransigeant d'ascète et de chef. Le premier — le seul à devenir prêtre — meurt vers 460, transporté au monastère de 105 moniales que sa sœur dirigeait à La Balme, et qui deviendra Saint-Romain de Roche ; Lupicin de même laissera son nom à la localité qui vers 480 recevra son corps.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu de nos pères dans la foi, tu as voulu que Saint Romain et Saint Lupicin soient les premiers à réaliser la vie monastique dans notre région. Accorde-nous de poursuivre leur œuvre en maintenant dans nos pays une vie de foi, de prière et de travail qui honore ton nom et serve nos frères. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE LA « VIE DES PÈRES DU JURA »
      subtitle: |-
        Les pionniers de la vie monastique dans notre région sont aussi des continuateurs : ils transposent dans le Jura l'idéal réalisé par les Pères du désert.
      content: |-
        Romain, le premier des trois Pères et dès les origines, reçut le titre d'abbé. Il était d'une assez bonne famille, à en juger par la lignée des descendants issus de celle-ci, et originaire, comme on nous l'apprend, de la Gaule Séquanaise. Avant lui, dans cette province, aucune sorte de moine ne s'était voué, pour faire profession religieuse, à la solitude ou aux observances communautaires.
        Il n'était pas, certes, particulièrement instruit, mais, mérite plus rare, il était doté d'une pureté, d'une charité sans égales, au point qu'on ne le vit ni, dans son enfance, s'adonner aux folâtreries puériles, ni, dans la force de l'âge, s'asservir aux passions humaines et aux liens du mariage. C'est dans sa trente-cinquième année environ qu'attiré par les retraites du désert, après avoir quitté sa mère, sa sœur et son frère, il pénétra dans les forêts du Jura proches de son domaine. Parcourant en tous sens ces forêts appropriées et favorables à son idéal de vie, il finit par trouver, au-delà, parmi des vallées bordées de rochers, un endroit découvert propice à la culture : là, les escarpements de trois montagnes s'écartent un peu l'un de l'autre, laissant entre eux un replat de quelque étendue.
      responsory: |-
        [rubric]Stance[/rubric]
        Va, pèlerin, poursuis ta quête ;
        va ton chemin, que rien ne t'arrête.
        Prends ta part de soleil
        et ta part de poussière ;
        le cœur en éveil
        oublie l'éphémère :

        R/ Tout est néant,
        Rien n'est vrai que l'amour.

        N'attache pas ton cœur à ce qui passe…
        
        Ne dis pas : j'ai réussi, je suis payé de ma peine…
        
        Ne te repose pas dans tes œuvres : elles vont te juger…
        
        Garde en ton cœur la Parole : voilà ton trésor…
morning:
  psalmody:
    - antiphon:
        - |-
          Romain et Lupicin ont porté du fruit : la sainte communauté, fondée par eux, se développait dans l'unité de la foi et de la charité.
    - antiphon:
        - |-
          Romain était lumière en son monastère, modèle de perfection et de charité : tous les frères étaient entraînés par son exemple.
    - antiphon:
        - |-
          Toute sa vie, Romain a gardé la paix du Christ ; à l'heure de sa mort, il l'a donnée et confiée à Lupicin son frère, et à la foule de ses héritiers.
  evangelicAntiphon:
    - |-
      Le peuple chantera tes louanges, Romain : tu as remis ta communauté à la charité pastorale de Lupicin : et, pur de toute faute, tu as remis ta vie à Dieu.
  intercession:
    content: |-
      Prions avec foi le Christ Jésus, notre Seigneur : élevé dans la gloire du Père, il intercède pour nous :

      R/ O Seigneur, écoute et prends pitié.

      Pour l'Église qui unit chaque jour son sacrifice à celui que tu ne cesses d'offrir à ton Père.

      Pour les moines et les moniales, pour les religieux et les religieuses, qui consacrent leur vie à la louange et à la supplication.

      Pour ceux qui ne croient pas en toi mais qui marchent vers toi dans la droiture de leur conscience.

      Pour nous-mêmes et pour ceux qui nous sont proches, que tu as choisis pour servir en présence de ton Père.

vespers:
  psalmody:
    - antiphon:
        - |-
          Alors que ses frères allaient dormir, Lupicin prolongeait le temps de la méditation : Dans la nuit, je me rappelle ton nom.
    - antiphon:
        - Attentifs au troupeau de Dieu qui leur était confié, ils ont soigné la brebis malade, pansé celle qui était blessée.
    - antiphon:
        - |-
          Romain et Lupicin ont répandu la bonne odeur du Christ en leur communauté : tous n'étaient qu'un, parce que tous appartenaient à l'Unique.
  evangelicAntiphon:
    - |-
      La terre que Romain et Lupicin ont sanctifiée, le peuple qu'ils protègent et l'Église qu'ils entraînent à leur suite te chantent, Seigneur, leur action de grâce.
  intercession:
    content: |-
      Adressons notre prière au Christ, le Fils du Père :

      R/ Sauveur du monde, sauve-nous !

      Tu t'es retiré dans la solitude pour prier ton Père,
      – soutiens la prière quotidienne de tes fidèles et présente-la à Dieu.

      Tu as pris soin des pauvres et des malades,
      – renforce en nous le souci fraternel de tous les démunis.

      Tu as rendu grâce à ton Père en nous livrant le Pain de Vie,
      – fais de nos vies une action de grâce permanente.

      Tu nous as donné ta vie sur la croix,
      – reçois celle de ceux qui meurent en ce moment.