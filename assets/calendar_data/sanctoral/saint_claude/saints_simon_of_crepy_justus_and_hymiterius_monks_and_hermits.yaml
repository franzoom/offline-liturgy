celebration:
  title: Saints Simon de Crépy, Just et Hymetière
  subtitle: moines et ermites
  description: |-
    Simon naît vers 1048 à Crépy, dans la famille comtale de Valois ; il devient lui-même comte de cette terre illustre et convoitée. Dédaignant les beaux partis qui s'offrent à lui, il comble de largesses les pauvres et les monastères, puis en 1077 se fait moine à Saint-Oyend. Attiré vers un « désert » plus profond, il se retire près de la source du Doubs, au lieu qui deviendra Mouthe. Mais sa qualité le fait employer, même par le pape Grégoire VII, pour des missions de paix, ce qui explique qu'il meurt à Rome vers 1082. De saint Hymetière, nous ne savons pratiquement rien, sinon qu'il était mentionné au 31 juillet par le martyrologe de Condat. Sur saint Just, nous sommes encore moins renseignés ; il figurait au 7 juillet dans un martyrologe, l'un des simples moines d'une époque ancienne dont Condat ait gardé le souvenir.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    À ceux qui nous ont précédés, Seigneur, tu as donné les Saints Simon, Just et Hymetière, comme modèles de vie évangélique et soutiens de leur foi. Grâce aux prières de tes amis, conduis-nous encore aujourd'hui sur la voie de la conversion et maintiens en nous la foi que nous avons reçue. Par Jésus Christ.
