celebration:
  title: Saints Simon de Crépy, Just et Hymetière
  subtitle: moines et ermites
  description: |-
    Simon naît vers 1048 à Crépy, dans la famille comtale de Valois ; il devient lui-même comte de cette terre illustre et convoitée. Dédaignant les beaux partis qui s’offrent à lui, il comble de largesses les pauvres et les monastères, puis en 1077 se fait moine à Saint-Oyend. Attiré vers un « désert » plus profond, il se retire près de la source du Doubs, au lieu qui deviendra Mouthe. Mais sa qualité le fait employer, même par le pape Grégoire VII, pour des missions de paix, ce qui explique qu’il meurt à Rome vers 1082. De saint Hymetière, nous ne savons pratiquement rien, sinon qu’il était mentionné au 31 juillet par le martyrologe de Condat. Sur saint Just, nous sommes encore moins renseignés ; il figurait au 7 juillet dans un martyrologe, l’un des simples moines d’une époque ancienne dont Condat ait gardé le souvenir.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    À ceux qui nous ont précédés, Seigneur, tu as donné les Saints Simon, Just et Hymetière, comme modèles de vie évangélique et soutiens de leur foi. Grâce aux prières de tes amis, conduis-nous encore aujourd’hui sur la voie de la conversion et maintiens en nous la foi que nous avons reçue.

mass:
  - massType: DAY_MASS
    note: |-
      Commun des saints (VII ou VIII pour les religieux). Lectures au choix, non fixées par le Missel propre : 1ère lecture « La vraie sagesse engendre la justice et la paix » (Jc 3, 13-18 — Saints et Saintes / Paix et Justice 6) ou « Je prendrai mon repas avec lui, et lui avec moi » (Ap 3, 14b.20-22 — Saints et Saintes 38 / Paix et Justice) ; psaume 84 ou 26 ; Évangile « Prendre sa croix à la suite de Jésus » (Mt 16, 24-27 — Saints et Saintes) ou « Si tu veux être parfait » (Mt 19, 16-21 — Saints et Saintes 6, 17 janvier).
    collect:
      - |-
        À ceux qui nous ont précédés, Seigneur, tu as donné les Saints Simon, Just et Hymetière, comme modèles de vie évangélique et soutiens de leur foi. Grâce aux prières de tes amis, conduis-nous encore aujourd’hui sur la voie de la conversion et maintiens en nous la foi que nous avons reçue. Par Jésus Christ.

readings:
  patristicReading:
    - title: De la vie de saint Simon de Crépy par un contemporain
      subtitle: Un prince devient moine, puis ermite
      content: |-
        %Très grand et riche dans le monde, il opte pour l’obéissance et le détachement, au monastère de Saint-Oyend ; aspirant même à un style plus exigeant, il se retire dans un désert pour y vivre dans une extrême abnégation.%

        Simon quitta sa maison, et dit adieu aux raffinements et aux biens ; il en avait une telle abondance que dans toute la contrée on ne voyait pour ainsi dire personne – sauf le roi – qui fût plus riche ni plus opulent. Alors qu’il aurait dû aller à Rome, se vouant à la vie monastique, il résolut de gagner Saint-Oyend. Quand il y fut arrivé, avec quelques hommes de haute noblesse appartenant à sa famille qui s’étaient joints à lui, tous ensemble, dans la joie de la Sainte Trinité, reçurent l’habit religieux.
        Un jour en effet, quand il était encore dans le siècle, il avait été saisi d’une fièvre violente et favorisé d’une apparition : Le bienheureux Arnoul, saint Oyend lui-même, et un autre dont il ignorait le nom et le visage, alors que lui dormait dans un verger, l’avaient engagé à se rendre en ce haut-lieu pour y devenir soldat de Dieu, s’y faire et y demeurer moine pour toujours sous l’autorité de l’abbé. Aussitôt levé de sa couche, il se trouva rétabli, et s’écria d’une voix forte : « Je suis guéri ; mais ceux qui se tenaient ici, ces trois seigneurs, où sont-ils, où sont-ils partis » ? Ceux de sa famille qui étaient présents, ignorant ce qu’il disait, assurèrent qu’ils n’en savaient rien.
        Voilà donc Simon devenu obéissant, et non plus au premier rang. Bien qu’il fût l’héritier d’un tel nom, jamais, selon la tradition, il ne s’est regimbé dans la désobéissance. Au contraire ; lorsqu’il eût pris l’habit monastique, il apportait son lit dans la sacristie de l’église ; se levant dans le silence nocturne, seul dans l’oratoire, il s’adonnait à l’oraison. En matière de jeûne, il avait une force souveraine ; à tel point qu’une disette ayant alors durement affecté ce pays, et le blé nécessaire au pain étant même venu à manquer, il prenait comme nourriture, dans la joie et l’action de grâce, du pain sec d’avoine. ~
        Considérant alors l’honneur que lui accordaient les frères, et craignant que la mortification de ses jeûnes, ou quelques autres pratiques nécessaires à son âme, soient ressenties par quelqu’un du couvent comme une gêne et un désagrément, il aspira vers la solitude du désert. Allant donc trouver l’abbé du monastère, il implora de façon suppliante la permission d’y aller et l’obtînt. L’ayant reçue, il prit avec lui un petit nombre de frères dont la vie brillait par l’idéal religieux, et se retira humblement. Ce qu’il accomplit à son arrivée comme travail, combien il endura pour le nom du Christ, il faut le publier, pour le faire servir d’exemple à ceux qui l’entendront. En effet, pour vivre du travail de ses mains, il commença par défricher avec la hache un espace où croîtraient de nouvelles cultures. Sa nourriture était des plus réduites : pain et eau, légumes, fruits des bois recueillis à grand-peine ; le tout une seule fois par jour, à part les dimanches et fêtes. Les pommes qu’il avait rapportées à sa demeure, avec aussi l’eau transportée à son cou, il les faisait cuire lui-même dans sa pitance. Était-il sorti pour quelque travail, si un pauvre survenait en demandant l’aumône, il avait prescrit à l’économe de ne jamais le laisser repartir les mains vides.
      responsory: |-
        [rubric]Stance[/rubric]
        Va, pèlerin,
        poursuis ta quête ;
        Va ton chemin,
        que rien ne t’arrête.
        Prends ta part de soleil
        et ta part de poussière ;
        le cœur en éveil
        oublie l’éphémère :

        R/ Tout est néant,
        rien n’est vrai que l’amour.

        N’attache pas ton cœur
        à ce qui passe…

        Ne dis pas : j’ai réussi,
        je suis payé de ma peine…

        Ne te repose pas dans tes œuvres :
        elles vont te juger…

        Garde en ton cœur la Parole :
        voilà ton trésor…
