celebration:
  title: Saints Viventiole et Hippolyte
  subtitle: moines et évêques
  description: |-
    Viventiole est d'abord moine à Condat, où il pourrait bien être le confident de saint Oyend, puis le rédacteur de la Vie des Pères du Jura. Soucieux de culture littéraire, il sait aussi travailler de ses mains. Il devient ensuite évêque de Lyon (environ 514-524), et se trouve en contact avec les hommes et les événements religieux de l'éphémère royaume burgonde. Hippolyte est le troisième successeur de saint Claude à la tête de Condat (environ 755-772) et comme lui, évêque claustral.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Pour le service de ton Église, Seigneur, tu as choisi les saints moines Viventiole et Hippolyte comme pasteurs de ton peuple. Maintiens en nous le goût de te prier et la force d'être apôtres ; donne à l'Église d'aujourd'hui les bons et fidèles serviteurs qui le guideront jusqu'à toi. Par Jésus Christ.

readings:
  patristicReading:
    - title: LETTRE DE VIVENTIOLE AUX ÉVÊQUES DE LA PROVINCE DE LYON
      subtitle: |-
        Convoquant les évêques de son ressort au concile provincial d'Épaone (517), Viventiole y invite aussi les clercs et les laïcs.
      responsory: |-
        Toi qui cherches le Royaume,
        écoute :

        R/ Sur nous, Seigneur, envoie ton esprit,
        ta force d'amour !

        V/ – Comment reconnaître un frère
        dans l'homme blessé, à l'écart de la route,
        si tu ne viens éclairer notre regard ?
        – Comment prendre en charge notre frère,
        si tu ne viens panser nos blessures ?
