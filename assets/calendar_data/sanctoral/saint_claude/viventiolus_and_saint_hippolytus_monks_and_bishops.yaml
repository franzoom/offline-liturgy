celebration:
  title: Saints Viventiole et Hippolyte
  subtitle: moines et évêques
  description: |-
    Viventiole est d’abord moine à Condat, où il pourrait bien être le confident de saint Oyend, puis le rédacteur de la Vie des Pères du Jura. Soucieux de culture littéraire, il sait aussi travailler de ses mains. Il devient ensuite évêque de Lyon (environ 514-524), et se trouve en contact avec les hommes et les événements religieux de l’éphémère royaume burgonde. Hippolyte est le troisième successeur de saint Claude à la tête de Condat (environ 755-772) et comme lui, évêque claustral.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Pour le service de ton Église, Seigneur, tu as choisi les saints moines Viventiole et Hippolyte comme pasteurs de ton peuple. Maintiens en nous le goût de te prier et la force d’être apôtres ; donne à l’Église d’aujourd’hui les bons et fidèles serviteurs qui le guideront jusqu’à toi.

readings:
  patristicReading:
    - title: Lettre de Viventiole aux évêques de la province de Lyon
      subtitle: Convoquant les évêques de son ressort au concile provincial d’Epaone (517), Viventiole y invite aussi les clercs et les laïcs. Il précise bien le rôle de chacun, et définit les attitudes pour un climat de franchise et de vérité, de respect mutuel, d’écoute entre frères et fils.
      content: |-
        A mes seigneurs très pieux, mes frères évêques, à tous les clercs, dignes d’honneur, en fonction dans notre territoire, Viventiole, évêque, salut.
        Il faut que la règle imposée à nos frères et fils soit également choisie par tous les prêtres. Au cas où des clercs qui sont plus à l’honneur commettent une action considérée comme passible d’un blâme public, mieux vaut la reprendre par le châtiment que de l’entretenir par le silence. Autant la réprimande est simple et juste, autant nous sommes blessés par des propos sournois et la plainte inavouée d’une récrimination.
        Aussi, pour que nul ne pense que nous cédons quelque peu à la faiblesse ou à la négligence dans notre rôle, je fais savoir, par la présente annonce, que le synode prochain de tous les évêques de notre ressort se tiendra vers le début du mois de septembre, dans la paroisse d’Epaone [Saint-Rambert d’Albon ?]. Comme il convient, nous pressons les clercs de s’y réunir, et nous permettons aux laïcs d’y assister : de la sorte, ce qui sera réglé par les seuls évêques, le peuple aussi pourra le connaître. Et comme il est juste que tous les catholiques désirent avoir des clercs irréprochables dans leur vie, nous accordons à tous la faculté de blâmer ce que chacun connaît. Qu’il soit permis à quiconque de s’exprimer contre qui il veut ; le pouvoir de contester devenant libre, que cesse le murmure occulte de désirs pervers.
        Toutefois l’accusateur s’efforcera de prouver ce qu’il aura allégué ; que nul ne compte pouvoir, sans risque, salir par de vains mensonges ceux qui vivent correctement. Personne ne doit rien avancer sans avoir le moyen de le démontrer ; l’injurieux recueillera la honte, que la vertu devra craindre ; étant présupposées, pour chacune des parties en cause, la patience dans l’écoute et l’équité dans le jugement.
        Que le Seigneur daigne vous garder, frères et fils qui serez reçus dans le Christ.
      responsory: |-
        [rubric]Stance[/rubric]
        Toi qui cherches le Royaume, écoute :
        l’amour : voilà le Royaume ;
        il est promesse de vie,
        appel de liberté,
        il est présence de l’éternité
        au cœur du temps.

        R/ Sur nous, Seigneur, envoie ton esprit,
        ta force d’amour !

        Comment reconnaître un frère
        dans l’homme blessé, à l’écart de la route,
        si tu ne viens éclairer notre regard ?

        Comment prendre en charge notre frère,
        si d’abord tu ne viens
        panser nos blessures ?

