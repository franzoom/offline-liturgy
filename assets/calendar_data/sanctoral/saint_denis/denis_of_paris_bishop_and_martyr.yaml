celebration:
  title: Saint Denis
  subtitle: évêque et martyr, patron du diocèse et de la ville de Saint-Denis
  description: |-
    L’évêque Denis vint annoncer l’Évangile à Lutèce vers le milieu du IIIe siècle. Condamné à mort, il fut exécuté au nord de la cité ; son corps fut déposé là où s’élève, depuis le temps de sainte Geneviève, la basilique-cathédrale Saint-Denis, qui devint, sous l’abbé Suger, l’une des plus importantes de France.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Dieu de miséricorde, par la prédication de l’évêque saint Denis tu as appelé nos pères à la foi ; accorde-nous, à sa prière, de marcher dans la vérité de l’évangile afin de parvenir jusqu’à la splendeur de ta gloire.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - content: |-
          Fêtons aujourd’hui dans l’action de grâce l’évêque saint Denis, qui planta l’Église de Paris dans son sang. Par lui le peuple qui marchait dans les ténèbres a vu se lever une grande lumière.
    collect:
      - |-
        Dieu de miséricorde, par la prédication de l’évêque saint Denis tu as appelé nos pères à la foi ; accorde-nous, à sa prière, de marcher dans la vérité de l’évangile afin de parvenir jusqu’à la splendeur de ta gloire.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Is 52, 7-10
            headline: |-
              « Tous les lointains de la terre ont vu le salut de notre Dieu »
            content: |-
              Comme ils sont beaux sur les montagnes,
              les pas du messager,
              celui qui annonce la paix,
              qui porte la bonne nouvelle,
              qui annonce le salut,
              et vient dire à Sion :
              « Il règne, ton Dieu ! »
              Écoutez la voix des guetteurs :
              ils élèvent la voix,
              tous ensemble ils crient de joie
              car, de leurs propres yeux,
              ils voient le Seigneur qui revient à Sion.
              Éclatez en cris de joie,
              vous, ruines de Jérusalem,
              car le Seigneur console son peuple,
              il rachète Jérusalem !
              Le Seigneur a montré la sainteté de son bras
              aux yeux de toutes les nations.
              Tous les lointains de la terre
              ont vu le salut de notre Dieu.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 95 (96), 1-3.7-8a.9-10a
      - partType: GOSPEL
        partContents:
          - biblicalRef: Jn 10, 11-15
    offeringPrayer:
      - |-
        Accepte, Seigneur, nous t’en prions, le sacrifice d’action de grâce que ton peuple te présente en la fête du martyr saint Denis ; car c’est toi que nous glorifions quand nous célébrons le fondateur de notre Église.
    communionAntiphon:
      - content: |-
          L’évêque saint Denis a livré son corps aux tourments et versé son sang pour le Christ ; en mémoire de lui nous communions au Corps et au Sang du Seigneur.
    prayerAfterCommunion:
      - |-
        Permets, Dieu notre Père, que le sacrement reçu à ton autel rassemble ton peuple dans l’unité et le consacre dans la vérité ; qu’il nous donne de croire plus fermement à la bonne nouvelle que saint Denis nous a transmise.
