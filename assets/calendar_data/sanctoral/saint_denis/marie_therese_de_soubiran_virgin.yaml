celebration:
  title: Bienheureuse Marie-Thérèse de Soubiran
  subtitle: vierge
  description: |-
    Née à Castelnaudary en 1834, Marie-Thérèse de Soubiran y fonda l’Institut de Marie Auxiliatrice. Chassée de sa congrégation par une intrigante, elle fut recueillie à Paris au couvent de Notre-Dame-de-Charité-du-Refuge, où elle vécut dans l’obscurité les quinze dernières années de sa vie. Elle mourut en 1889 ; son corps repose à Villepinte, dans le diocèse de Saint-Denis.
  commons:
    - virgins
  color: white

oration:
  - |-
    Tu as donné, Seigneur, à la bienheureuse Marie-Thérèse de demeurer douce et humble de cœur dans la direction de ses sœurs comme dans sa mise à l’écart ; par son intercession, accorde-nous de rester fidèles à l’esprit de l’Évangile à travers les réussites et les échecs de notre vie.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - content: |-
          Marie-Thérèse de Soubiran comptait sur le Seigneur, le Seigneur ne l’a pas abandonnée ; il fut son refuge dans l’épreuve, au ciel il est sa lumière et sa paix.
    collect:
      - |-
        Tu as donné, Seigneur, à la bienheureuse Marie-Thérèse de demeurer douce et humble de cœur dans la direction de ses sœurs comme dans sa mise à l’écart ; par son intercession, accorde-nous de rester fidèles à l’esprit de l’Évangile à travers les réussites et les échecs de notre vie.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Jc 1, 2-4.12
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 26 (27), 1-3.5
      - partType: GOSPEL
        partContents:
          - biblicalRef: Jn 16, 20-22
    offeringPrayer:
      - |-
        Sanctifie, Seigneur, les biens que nous te présentons : en les acceptant comme une offrande spirituelle, rends-nous capables d’aimer tous les hommes de l’amour dont tu les aimes.
    prayerAfterCommunion:
      - |-
        Ceux que tu nourris d’un même pain, Seigneur, tiens-les dans le souffle de ton Esprit : qu’un parfait amour de charité les saisisse et les renouvelle.
