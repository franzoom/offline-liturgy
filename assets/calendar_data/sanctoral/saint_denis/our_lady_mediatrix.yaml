celebration:
  title: Sainte Marie Médiatrice
  description: |-
    Le culte de la Vierge Marie Médiatrice de toutes grâces prit son essor au lendemain de la Première Guerre mondiale, en 1921. Le deuxième concile du Vatican en a reconnu la légitimité, entendue de telle sorte que nulle dérogation, nulle addition, n’en résulte quant à la dignité et à l’efficacité de l’unique Médiateur, le Christ.
  commons:
    - virgin-mary
  color: white
