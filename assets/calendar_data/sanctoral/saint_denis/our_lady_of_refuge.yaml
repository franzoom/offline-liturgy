celebration:
  title: Sainte Marie, Refuge des pécheurs
  description: |-
    Le 3 décembre 1836, l’abbé Desgenettes, curé de Notre-Dame-des-Victoires, consacra sa paroisse au Cœur immaculé de Marie afin d’obtenir le retour à Dieu de ceux qui s’en étaient éloignés. La dévotion à Marie, Refuge des pécheurs, dont ce sanctuaire devint le centre, obtint rapidement de nombreuses grâces de conversion.
  commons:
    - virgin-mary
  color: white

oration:
  - |-
    Seigneur, toi qui aimes les hommes, viens au secours de notre faiblesse quand nous célébrons la sainte Vierge Marie, Refuge des pécheurs : fais que, par son intercession, nous soyons guéris de toutes nos fautes.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - biblicalReference: cf. He 4, 16
        content: |-
          Marie a enfanté le Christ, qui nous sauve de nos péchés. Approchons par elle des sources du pardon.
    collect:
      - |-
        Seigneur, toi qui aimes les hommes, viens au secours de notre faiblesse quand nous célébrons la sainte Vierge Marie, Refuge des pécheurs : fais que, par son intercession, nous soyons guéris de toutes nos fautes.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: Rom 5, 12.17-19
      - partType: PSALM
        partContents:
          - biblicalRef: 1 S 2, 1.4-5ab.6-7.8abcd
      - partType: GOSPEL
        partContents:
          - biblicalRef: Mt 1, 18-23
            headline: |-
              « L’enfant qui est engendré en elle vient de l’Esprit Saint »
            content: |-
              En ce temps-là,
              avant que Marie et Joseph aient habité ensemble,
              elle fut enceinte
              par l’action de l’Esprit Saint.
              Joseph, son époux,
              qui était un homme juste,
              et ne voulait pas la dénoncer publiquement,
              décida de la renvoyer en secret.
              Comme il avait formé ce projet,
              voici que l’ange du Seigneur
              lui apparut en songe et lui dit :
              « Joseph, fils de David,
              ne crains pas de prendre chez toi Marie, ton épouse,
              puisque l’enfant qui est engendré en elle
              vient de l’Esprit Saint ;
              elle enfantera un fils,
              et tu lui donneras le nom de Jésus
              (c’est-à-dire : Le-Seigneur-sauve),
              car c’est lui qui sauvera son peuple de ses péchés. »
              Tout cela est arrivé
              pour que soit accomplie
              la parole du Seigneur prononcée par le prophète :
              Voici que la Vierge concevra,
              et elle enfantera un fils ;
              on lui donnera le nom d’Emmanuel
              qui se traduit : « Dieu-avec-nous ».
    offeringPrayer:
      - |-
        Exauce notre prière, Seigneur : permets qu’au jour où nous célébrons Marie, Refuge des pécheurs, ce sacrifice nous apporte le salut, puisque, dans cette immolation, tu as voulu que soient remis les péchés du monde entier.
    communionAntiphon:
      - content: |-
          Jésus, le Fils de Marie, est l’Agneau de Dieu, qui enlève le péché du monde.
    prayerAfterCommunion:
      - |-
        Nous t’en prions, Seigneur notre Dieu, toi qui nous as nourris à la table de ton Fils pour affermir notre relèvement : par cette communion fais de nous des vivants maintenant et pour l’éternité.
