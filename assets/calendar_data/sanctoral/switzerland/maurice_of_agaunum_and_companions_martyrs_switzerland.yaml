celebration:
  title: Saint Maurice et ses compagnons
  subtitle: martyrs
  description: |-
    Lors de la persécution de Dioclétien (début du IVᵉ siècle), des soldats chrétiens furent mis à mort pour leur foi, à Agaune, dans le Valais. Une première chapelle fut érigée vers 380 en leur honneur. Par la suite, ce sanctuaire fut agrandi et des églises plus vastes furent construites. En 515, saint Sigismond, roi des Burgondes, fonda un monastère pour garder le souvenir du martyre de Maurice et de ses compagnons. L’évêque de Lyon Eucher rédigea d’après des traditions orales le récit de la passion des martyrs d’Agaune vers le milieu du Vᵉ siècle.
  commons:
    - martyrs
  color: red

oration:
  - Seigneur Dieu, la gloire de tes élus est un reflet de ta splendeur, et tu as consacré ce jour par le martyre de saint Maurice et de ses compagnons ; accorde à ton Église, qui fête avec joie leur entrée dans le ciel, de trouver, à leur exemple et par leur prière, le chemin de ta miséricorde.

mass:
- massType: DAY_MASS
  collect:
  - |-
    Seigneur Dieu, +
    >la gloire de tes élus est un reflet de ta splendeur,
    et tu as consacré ce jour
    >par le martyre de saint Maurice et de ses compagnons ; *
    accorde à ton Église, qui fête avec joie leur entrée dans le ciel, /
    >de trouver, à leur exemple et par leur prière,
    >le chemin de ta miséricorde.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Ap 7, 13-17
      headline: |-
        « Ils ont lavé leurs robes dans le sang de l’Agneau »
      content: |-
        Moi, Jean,
        >j’ai vu une foule immense devant le trône de Dieu.
        L’un des Anciens prit la parole et me dit :
        >« Ces gens vêtus de robes blanches,
        qui sont-ils, et d’où viennent-ils ? »
        Je lui répondis :
        >« Mon seigneur, toi, tu le sais. »
        Il me dit :
        >« Ceux-là viennent de la grande épreuve ;
        ils ont lavé leurs robes,
        >ils les ont blanchies par le sang de l’Agneau.
        C’est pourquoi ils sont devant le trône de Dieu,
        >et le servent, jour et nuit, dans son sanctuaire.
        Celui qui siège sur le Trône
        >établira sa demeure chez eux.
        Ils n’auront plus faim, ils n’auront plus soif,
        >ni le soleil ni la chaleur ne les accablera,
        puisque l’Agneau qui se tient au milieu du Trône
        >sera leur pasteur
        >pour les conduire aux sources des eaux de la vie.
        Et Dieu essuiera toute larme de leurs yeux. »
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 26 (27), 1, 2, 3
      chorus:
      - chorusRef: null
        content: |-
          Le Seigneur est ma force et mon salut,
          il est ma délivrance.
      content: |-
        Le Seigneur est ma lumière et mon salut ;
        de qui aurais-je crainte ?
        Le Seigneur est le rempart de ma vie ;
        devant qui tremblerais-je ?

        Si des méchants s’avancent contre moi
        pour me déchirer,
        ce sont eux, mes ennemis, mes adversaires,
        qui perdent pied et succombent.

        Qu’une armée se déploie devant moi,
        mon cœur est sans crainte ;
        que la bataille s’engage contre moi,
        je garde confiance.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 10, 28-33
      headline: |-
        « Ne craignez pas ceux qui tuent le corps »
      acclamationAntiphon: |-
        À toi, Dieu, notre louange !
        Toi, dont témoignent les martyrs,
        nous t’acclamons : tu es Seigneur !
      content: |-
        En ce temps-là,
        Jésus disait à ses Apôtres :
        >« Ne craignez pas ceux qui tuent le corps
        >sans pouvoir tuer l’âme ;
        >craignez plutôt celui qui peut faire périr dans la géhenne
        >l’âme aussi bien que le corps.
        Deux moineaux ne sont-ils pas vendus pour un sou ?
        Or, pas un seul ne tombe à terre
        >sans que votre Père le veuille.
        Quant à vous, même les cheveux de votre tête sont tous comptés.
        Soyez donc sans crainte :
        >vous valez bien plus qu’une multitude de moineaux.
        Quiconque se déclarera pour moi devant les hommes,
        >moi aussi je me déclarerai pour lui
        >devant mon Père qui est aux cieux.
        Mais celui qui me reniera devant les hommes,
        >moi aussi je le renierai
        >devant mon Père qui est aux cieux. »
