celebration:
  title: Saint Nicolas de Flüe
  subtitle: patron principal de la Confédération helvétique
  description: Nicolas de Flüe (1417-1487), l’ermite de Sachseln du canton d’Unterwald, était père de dix enfants. Avec le consentement de sa femme, il se retira dans la solitude, où il passa les dix-neuf dernières années de sa vie. Il n’en sortit que pour rétablir la paix entre les cantons helvétiques, qui étaient sur le point de sombrer dans la guerre civile.
  commons:
    - saints-male_religious
  color: white

oration:
  - Seigneur, soutenus par la prière de saint Nicolas de Flüe, nous te supplions humblement : garde sous ta constante protection ceux qui nous dirigent, et donne-nous la lumière de ta grâce.
  - Par la vie de saint Nicolas de Flüe, tu nous as révélé, Seigneur, combien ton amour pouvait combler un cœur humain dans la solitude et le rendre solidaire de tous ; donne-nous de te préférer en toutes circonstances.

mass:
- massType: DAY_MASS
  entranceAntiphon:
  - biblicalReference: cf. Ps 54, 8.10
    content: |-
      Très loin, je me suis enfui,
      pour chercher asile au désert,
      >car je voyais dans la ville discorde et violence.
  collect:
  - |-
    Seigneur, +
    >soutenus par la prière de saint Nicolas de Flüe,
    nous te supplions humblement : *
    garde sous ta constante protection
    >ceux qui nous dirigent, /
    et donne-nous la lumière de ta grâce.
    Par Jésus Christ, ton Fils, notre Seigneur, +
    >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
    >Dieu, pour les siècles des siècles.
  offeringPrayer:
  - |-
    Sanctifie, Seigneur,
    >les offrandes qui te sont destinées : *
    qu’elles attirent sur nous
    >ton regard de bonté et de paix, /
    afin qu’ayant servi sur cette terre
    >nous connaissions la gloire du ciel.
    Par le Christ, notre Seigneur.
  communionAntiphon:
  - biblicalReference: Ga 2, 19-20
    content: |-
      Avec le Christ, je suis fixé à la croix :
      je vis, mais ce n’est plus moi,
      >c’est le Christ qui vit en moi.
  prayerAfterCommunion:
  - |-
    Seigneur Dieu, +
    >de même que tu as miraculeusement nourri ton peuple au désert,
    tu as soutenu saint Nicolas de Flüe par l’Eucharistie : *
    fais que ce même pain reçu en communion /
    >nous accompagne toujours jusqu’à ta montagne sainte.
    Par le Christ, notre Seigneur.
  readingParts:
  - partType: READING_1
    partContents:
    - biblicalRef: Sg 7, 27c-8, 2a.3-7.9
      headline: |-
        « La Sagesse se transmet à des âmes saintes »
      content: |-
        D’âge en âge, la Sagesse se transmet à des âmes saintes,
        >pour en faire des prophètes et des amis de Dieu.
        Car Dieu n’aime que celui qui vit avec la Sagesse.
        Elle est plus belle que le soleil,
        >elle surpasse toutes les constellations ;
        si on la compare à la lumière du jour,
        >on la trouve bien supérieure,
        car le jour s’efface devant la nuit,
        >mais contre la Sagesse le mal ne peut rien.
        Elle déploie sa vigueur d’un bout du monde à l’autre,
        >elle gouverne l’univers avec bonté.
        C’est elle que j’ai aimée et recherchée
        >depuis ma jeunesse.
        Elle manifeste la gloire de sa propre naissance
        >puisqu’elle partage la vie de Dieu,
        et que le maître de l’univers lui a donné son amour.
        Elle est initiée aux mystères de la science de Dieu,
        >c’est elle qui décide de ses œuvres.
        Si la richesse est un bien désirable en cette vie,
        qu’y a-t-il de plus riche que la Sagesse,
        >elle qui met en œuvre toutes choses ?
        Si l’intelligence humaine peut accomplir une œuvre,
        >qui, plus que la Sagesse, est l’artisan de l’univers ?
        Veut-on devenir juste ?
        Les labeurs de la Sagesse produisent les vertus :
        elle enseigne la tempérance et la prudence,
        >la justice et la force d’âme,
        et rien n’est plus utile aux hommes dans l’existence.
        J’ai donc résolu d’amener la Sagesse à partager ma vie,
        >car je savais qu’elle serait ma conseillère pour bien agir,
        >mon réconfort dans les soucis et la tristesse.
  - partType: PSALM
    partContents:
    - biblicalRef: Ps 89 (90), 12-13, 14-15, 16-17ab
      refAbbr: cf. 89, 14
      chorus:
      - chorusRef: cf. 89, 14
        content: |-
          Rassasie-nous de ton amour, Seigneur :
          nous serons dans la joie.
      content: |-
        Apprends-nous la vraie mesure de nos jours :
        que nos cœurs pénètrent la sagesse.
        Reviens, Seigneur, pourquoi tarder ?
        Ravise-toi par égard pour tes serviteurs.

        Rassasie-nous de ton amour au matin,
        que nous passions nos jours dans la joie et les chants.
        Rends-nous en joies tes jours de châtiment
        et les années où nous connaissions le malheur.

        Fais connaître ton œuvre à tes serviteurs
        et ta splendeur à leurs fils.
        Que vienne sur nous
        la douceur du Seigneur notre Dieu !
  - partType: READING_2
    partContents:
    - biblicalRef: Rm 14, 17-19
      headline: |-
        « Le royaume de Dieu est justice, paix et joie »
      content: |-
        Frères,
        le royaume de Dieu ne consiste pas
        >en des questions de nourriture ou de boisson ;
        >il est justice, paix et joie dans l’Esprit Saint.
        Celui qui sert le Christ de cette manière-là plaît à Dieu,
        >et il est approuvé par les hommes.
        Recherchons donc ce qui contribue à la paix,
        >et ce qui construit les relations mutuelles.
  - partType: GOSPEL
    partContents:
    - biblicalRef: Mt 19, 27-29
      headline: |-
        « Vous qui m’avez suivi, vous recevrez le centuple »
      acclamationAntiphon: |-
        Heureux les habitants de ta maison, Seigneur,
        heureux les hommes dont tu es la force :
        des chemins s’ouvrent dans leur cœur.
      acclamationAntiphonReference: cf. Ps 83, 5a.6
      content: |-
        En ce temps-là,
        Pierre prit la parole et dit à Jésus :
        >« Voici que nous avons tout quitté pour te suivre :
        quelle sera donc notre part ? »
        Jésus leur déclara :
        >« Amen, je vous le dis :
        lors du renouvellement du monde,
        >lorsque le Fils de l’homme siégera sur son trône de gloire,
        vous qui m’avez suivi,
        >vous siégerez vous aussi sur douze trônes
        >pour juger les douze tribus d’Israël.
        Et celui qui aura quitté, à cause de mon nom,
        >des maisons, des frères, des sœurs,
        >un père, une mère, des enfants,
        >ou une terre,
        recevra le centuple,
        >et il aura en héritage la vie éternelle. »
