celebration:
  title: Saint Adérald
  subtitle: prêtre
  description: |-
    Chanoine de la cathédrale Saint-Pierre, Adérald entreprit d’en réformer le Chapitre. Il fut soutenu dans cette tâche par l’évêque, le bienheureux Manassès, qui le nomma archidiacre, et ne faisait rien sans le consulter. Il mourut au début du XI^e siècle et fut inhumé dans le monastère qu’il avait fondé à Villacerf. Plus tard, ses reliques furent transférées dans l’église paroissiale de ce village.
  commons:
    - pastors
  color: white

oration:
  - |-
    Tu as donné à saint Adérald, Seigneur, un esprit de ferveur et de fidélité à ton service : puisque nous célébrons aujourd’hui sa fête, accorde-nous de progresser en l’imitant, et de trouver un soutien dans sa prière. Par Jésus-Christ.
