celebration:
  title: Tous les Saints du diocèse
  description: |-
    Dans le monastère d'Isle-Aumont vécut au IV^e siècle saint Ursion ; au VI^e siècle, saint Phal, ancien prisonnier devenu moine, puis abbé. À la même époque eut lieu la déposition de saint Maurèle, prêtre. Au VI^e siècle saint Pouange termina sa vie dans la pénitence, et saint Boin vécut dans la piété à Saint-Mards-en-Othe. De même, au siècle suivant, saint Flavit près de Marcilly. Saint Simon, originaire de Bar-sur-Aube, entra dans un monastère et mourut à Rome où l'avait appelé Grégoire VII. En même temps, il est bon d'honorer aujourd'hui tous les hommes et toutes les femmes qui ont vécu dans la sainteté.
  commons:
    - saints
  color: white
