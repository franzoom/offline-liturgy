celebration:
  title: Saint Aventin
  subtitle: abbé
  description: |-
    Né à Bourges, il fut d'abord disciple de saint Loup. Plus tard, il fut nommé par saint Camélien, économe de l'Église de Troyes. Mais, fuyant la considération humaine, il se retira d'abord dans une île près de la ville et y réunit quelques compagnons sous sa direction. Puis, pour mener une vie plus solitaire, il se réfugia dans une cabane isolée près de Verrières. C'est là qu'il termina ses jours vers 537.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Dieu éternel et tout-puissant, toutes choses te sont soumises : sois favorable à notre prière et apprends-nous, par l'intercession de saint Aventin, à accomplir parfaitement ce que tu nous demandes. Par Jésus-Christ.
