celebration:
  title: Saint Balsème
  subtitle: martyr
  description: |-
    Originaire de Limoges, il vint en Champagne, près d'Arcis-sur-Aube. Les Vandales qu'il essayait sans succès de convertir se saisirent de lui et le décapitèrent. Ce martyre eut lieu au V^e siècle. Dans la suite, son corps fut porté à Ramerupt.
  commons:
    - martyr
  color: red

oration:
  - |-
    Par l'intercession de saint Balsème, ton martyr, accorde-nous, Seigneur notre Dieu, une foi droite et ferme : pour que nous soyons établis dans la charité et que nulle tentation ne nous en écarte. Par Jésus-Christ.
