celebration:
  title: Saint Camélien
  subtitle: évêque
  description: |-
    Disciple de saint Loup, il lui succéda en 479 et fut évêque plus de 50 ans. Il se distingua surtout par sa grande charité envers les pauvres, que secourait en son nom saint Aventin. On dit qu'il accompagna le roi Clovis lorsque celui-ci s'avança jusqu'à Villery à la rencontre de sainte Clotilde. Il accueillit sainte Geneviève venue quêter pour les Parisiens affamés. Sidoine Apollinaire a fait son éloge sous le nom d'Himérius.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Accorde-nous, Dieu tout-puissant, de célébrer dignement la fête de l'évêque saint Camélien ; puisque tu lui as donné de se dévouer, par la parole et par l'exemple, à ceux dont il avait reçu la charge, fais que nous ressentions toujours l'appui de sa prière auprès de toi. Par Jésus-Christ.
