celebration:
  title: Bienheureux Claude, Eustache, Louis-Joseph et Pierre-Nicolas
  subtitle: martyrs
  description: |-
    À Paris, au séminaire Saint-Firmin, le supérieur, Louis-Joseph François, qui avait dirigé pendant six ans le Grand Séminaire de Troyes, fut massacré le 3 septembre 1792 avec beaucoup d'autres prêtres, parmi lesquels Claude Bochot et Eustache Félix, qui avaient tous deux reçu le baptême à Troyes dans l'église Saint-Jean. La veille, au couvent des Carmes, avait subi le martyre Pierre-Nicolas Psalmon, vicaire général de Troyes pendant onze ans.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Aux bienheureux prêtres Claude, Eustache, Louis-Joseph et Pierre-Nicolas, qui ont vaillamment défendu la foi catholique et les droits de l'Église, tu as donné, Seigneur Dieu, la victoire du martyre : à leur prière, que la force d'en-haut nous garde fidèles à te servir jusqu'à la mort. Par Jésus-Christ.
