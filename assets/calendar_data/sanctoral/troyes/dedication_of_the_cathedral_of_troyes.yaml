celebration:
  title: Dédicace de la Cathédrale
  subtitle: |-
    fête dans le diocèse (solennité à la cathédrale)
  description: |-
    Sur l’emplacement de plusieurs édifices antérieurs, la cathédrale actuelle fut commencée au début du XIII^e siècle. En 1430, Jean Léguisé en fit la dédicace solennelle en l’honneur des saints Apôtres Pierre et Paul. Ses successeurs terminèrent encore inachevée ; et, en 1866, après la restauration du chœur, un nouvel autel majeur fut consacré. Dans cette magnifique église ont prié sainte Jeanne d’Arc, saint Vincent de Paul, la bienheureuse Marguerite Bourgeoys, saint Jean-Baptiste de la Salle, le Pape Pie VII au retour du couronnement de Napoléon.
  commons:
    - dedicace_outside
    - dedicace_inside
  color: white
