celebration:
  title: Saint Frobert
  subtitle: abbé
  description: |-
    Né à Troyes, Frobert appartenait au clergé de cette ville. Après un séjour à Luxeuil, il gagna dans la banlieue de Troyes un endroit marécageux, appelé l’Île Germaine. L’affluence des disciples l’amena à y fonder le monastère renommé de Montier-la-Celle. Il mourut vers la fin du VII^e siècle et la translation de son corps eut lieu le 8 janvier 873.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Accorde-nous, Seigneur, au milieu des changements de ce monde, un amour passionné pour les choses du ciel, toi qui nous as donné dans le bienheureux abbé Frobert un modèle de perfection évangélique. Par Jésus-Christ.
