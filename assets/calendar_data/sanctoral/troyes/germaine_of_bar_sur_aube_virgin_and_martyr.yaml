celebration:
  title: Sainte Germaine
  subtitle: vierge et martyre
  description: |-
    Au service du prêtre attaché à l’église St-Étienne sur une colline dominant Bar-sur-Aube, elle résista victorieusement aux Vandales qui essayaient de la faire renoncer à la chasteté. Dans sa colère, leur chef la fit décapiter au lieu même qui, par la suite, fut appelé colline Sainte-Germaine.
  commons:
    - martyr_female_virgin
  color: red

oration:
  - |-
    Du glorieux témoignage que t’a rendu sainte Germaine, tu fais, Seigneur, notre rempart et notre protection : que son exemple nous entraîne et que sa prière nous soit un appui. Par Jésus-Christ.
