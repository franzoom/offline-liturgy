celebration:
  title: Les Saints Évêques de Troyes
  description: |-
    Le premier de la liste des évêques de Troyes est saint Amateur vers le milieu du IV^e siècle. Saint Mélain lui succéda peu après ; puis, au VI^e siècle, saint Vincent et saint Leuçon. En 766 mourut saint Bobin, précédemment moine de Montier-la-Celle. Vers la fin du X^e siècle, le bienheureux Manassès d'Arcis travailla à rétablir la discipline dans le clergé.
    D'autres prélats sont honorés dans le diocèse de Troyes, tels saint Urse, septième évêque de Troyes, qui décéda en grand renom de sainteté l'année même de son élévation à l'épiscopat en 426 ; saint Epvre, de Trancault, qui gouverna l'Église de Toul au V^e siècle ; saint Romain, fondateur du monastère de Mantenay, puis successeur de saint Remy ; saint Malachie, archevêque d'Armagh, en Irlande, ami de saint Bernard, qui mourut à Clairvaux.
  commons:
    - pastors_multiple
  color: white

oration:
  - |-
    Seigneur Dieu, tu veilles sur ton peuple avec miséricorde, et tu le conduis avec amour ; par l'intercession de nos saints Évêques, accorde l'Esprit de sagesse à ceux qui ont reçu de toi la charge pastorale, pour que le progrès des brebis fasse la joie des pasteurs dans l'éternité. Par Jésus-Christ.
