celebration:
  title: Le Saint Suaire de Notre-Seigneur
  subtitle: messe votive
  description: |-
    Geoffroy de Charny rapporta des croisades la relique du Saint Suaire de Notre Seigneur. Il en confia la garde au Chapitre de la collégiale de Lirey qu'il avait fondée en 1353. Cette précieuse relique fut visitée par des foules de pèlerins. Par crainte des pillards, les chanoines confièrent le Saint Suaire à Humbert de Villersexel en 1418. En dépit de leurs réclamations, cette relique resta en possession de la Maison de Savoie et fut transportée à Turin, où elle est encore vénérée.
  color: red

oration:
  - |-
    Dieu qui as racheté tous les hommes par le sang de ton Fils unique, poursuis en nous l'œuvre de ton amour : nous sommes ici pour célébrer le mystère de notre salut, rends-nous capables d'en recueillir les fruits. Par Jésus-Christ.
