celebration:
  title: Sainte Jule, et saint Claude et ses compagnons
  subtitle: vierge ; martyrs
  description: |-
    La tradition rapporte que ces martyrs périrent décapités là où s’élevait jadis une chapelle sous le vocable de sainte Jule, à Troyes, dans le quartier de Saint-Martin.
  commons:
    - martyrs
  color: red
