celebration:
  title: Saint Loup
  subtitle: évêque
  description: |-
    Il fut l'un des plus glorieux évêques de Troyes. Né à Toul, il quitta sa femme pour se consacrer à Dieu dans le monastère de Lérins. Élu évêque de Troyes en 426, il fut envoyé deux ans plus tard, par les évêques de Gaule, avec saint Germain d'Auxerre, en Grande-Bretagne pour combattre l'hérésie pélagienne. Lorsque les Huns se répandirent en Gaule, Loup sauva de la destruction la ville de Troyes et força l'admiration de leur chef Attila. Assidu à la prière, aux veilles et au jeûne, il se montrait affable pour tous. Il mourut en 479. Une relique insigne de son crâne est conservée à la cathédrale de Troyes.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur Dieu, tu as fait de l'évêque saint Loup le défenseur de la foi chrétienne : ayant égard à ses mérites, fais briller sur nous la lumière de l'Esprit Saint. Par Jésus-Christ.
