celebration:
  title: Saint Lyé
  subtitle: abbé
  description: |-
    Saint Romain ayant été promu au siège épiscopal de Reims après la mort de saint Remy, le choix unanime des moines appela Lyé à lui succéder comme abbé de Mantenay, sur les bords de la Seine. Après avoir brillé par son admirable sainteté, il s'endormit dans le Seigneur vers 550 et son corps fut transféré dans l'église paroissiale du village, aujourd'hui Saint-Lyé.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Seigneur Dieu, tu as comblé saint Lyé de vertus éclatantes : à sa prière, fais-nous avancer le cœur libre sur la voie de tes commandements afin que nous remportions la victoire éternelle. Par Jésus.
