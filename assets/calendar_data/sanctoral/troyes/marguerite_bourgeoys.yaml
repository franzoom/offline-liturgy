celebration:
  title: Bienheureuse Marguerite Bourgeoys
  subtitle: vierge
  description: |-
    Baptisée dans l'église Saint-Jean-au-Marché, à Troyes, en 1620, et adonnée dès l'enfance à la prière et aux œuvres de charité, elle voulut entrer au Carmel. Mais Dieu en disposa autrement. À la demande du gouverneur de la ville de Montréal, récemment fondée au Canada, elle y organisa des écoles et institua la Congrégation des Sœurs de Notre-Dame qu'elle dirigea longtemps avec succès, au milieu des pires difficultés. Après avoir abandonné sa charge de supérieure, elle s'endormit dans le Seigneur le 12 janvier 1700.
  commons:
    - virgins
  color: white

oration:
  - |-
    Seigneur, tu as choisi la bienheureuse Marguerite Bourgeoys pour former la jeunesse à la vie chrétienne ; permets qu'à son exemple et à sa prière, nous puissions, par nos paroles et notre conduite, parvenir aux biens d'éternité. Par Jésus-Christ.
