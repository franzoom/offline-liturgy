celebration:
  title: Bienheureuse Marie de l'Incarnation
  subtitle: religieuse
  description: |-
    Barbe Avrillot ayant épousé Pierre Acarie mena dans le mariage une vie religieuse, tout en se montrant un modèle des vertus familiales. À plusieurs reprises, elle résida à Villemaur. Elle seconda Pierre de Bérulle dans l'installation de l'Ordre des Carmélites en France. Après la mort de son mari, elle entra au Carmel comme sœur converse sous le nom de Marie de l'Incarnation. Elle mourut en 1618.
  commons:
    - saints-female_religious
  color: white

oration:
  - |-
    Seigneur, tout au long de sa vie, tu as donné à la bienheureuse Marie une constance remarquable pour traverser courageusement les épreuves ; accorde-nous de supporter toutes les difficultés avec patience et de rester jusqu'au bout fidèles à ton amour. Par Jésus-Christ.
