celebration:
  title: Saintes Mathie, Hélène, Exupérance, Syre et Evronie
  subtitle: vierges
  description: |-
    Le tombeau de sainte Mathie, à la cathédrale, fut pendant des siècles entouré d’un tel culte que cette sainte reçut le titre de Patronne secondaire de la ville de Troyes, en même temps que sainte Hélène, originaire de Grèce, dont le transfert de la dépouille à Troyes, vers 1209, donna lieu à de grandes démonstrations de piété. Dans l’église de Sainte-Savine, sont conservées les reliques de sainte Exupérance, qui serait née à Troyes vers la fin du IV^e siècle. Au village de Rilly-Sainte-Syre, à l’endroit où fut inhumé saint Savinien, sainte Syre retrouva la vue. Elle s’adonna à la contemplation, menant une vie très austère jusqu’à sa mort au V^e siècle. À la même époque, la vierge Evronie, née à Trancault, mourut à Troyes après le décès de son frère Epvre, évêque de Toul.
  commons:
    - virgins_multiple
  color: white

oration:
  - |-
    Seigneur qui aimes les cœurs purs, tu as inspiré aux saintes Mathie, Hélène, Exupérance, Syre et Evronie de garder pour toi la virginité : donne-nous, par leur intercession, de vivre selon ta grâce ; alors, tu pourras venir en nous pour y faire ta demeure. Par Jésus-Christ.
