celebration:
  title: Sainte Maure
  subtitle: vierge
  description: |-
    Partageant son temps entre la prière et l'entretien des églises, sainte Maure mourut vers 850, à l'âge de 23 ans. Deux fois par semaine, elle allait en pèlerinage au monastère de Mantenay, près du village actuel de Saint-Lyé. L'évêque saint Prudence l'assista à ses derniers moments et prononça son éloge funèbre.
  commons:
    - virgins
  color: white

oration:
  - |-
    Seigneur Dieu, tu as rendu sainte Maure admirable par une exquise piété et par le don de la contemplation : accorde-nous de suivre son exemple et d'imiter sa charité. Par Jésus-Christ.
