celebration:
  title: Saint Mesmin et ses compagnons
  subtitle: martyrs
  description: |-
    Le diacre Mesmin fut envoyé par saint Loup avec sept clercs à la rencontre d'Attila qui approchait. Ils furent mis à mort près de la Seine, à l'emplacement du village actuel de Saint-Mesmin.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Seigneur Jésus, tu nous apprends à nous détacher des biens qui passent pour chercher avec empressement ceux qui demeurent : que la prière de tes saints martyrs Mesmin et ses compagnons nous soit une force pour parcourir le chemin que tu nous as enseigné. Toi qui vis.
