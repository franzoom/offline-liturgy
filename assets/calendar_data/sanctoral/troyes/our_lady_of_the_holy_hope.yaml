celebration:
  title: Notre-Dame de la Sainte-Espérance
  description: |-
    Le 5 juillet 1852, le pape Pie IX concéda à l'église paroissiale du Mesnil-Saint-Loup, la célébration du culte de la Bienheureuse Vierge Marie sous le titre de « Notre-Dame de la Sainte-Espérance ». De nombreuses grâces de conversion furent obtenues par ceux qui l'avaient invoquée.
    Ce même jour, on commémore également tous les vocables sous lesquels la Vierge Marie est honorée dans le diocèse de Troyes.
  commons:
    - virgin-mary
  color: white

oration:
  - |-
    Heureux de la protection efficace de la Vierge Marie, Mère de la sainte Espérance, nous te prions, Dieu tout-puissant : fais que sa maternelle intercession nous délivre de tout mal sur la terre et nous conduise aux joies éternelles dans le ciel. Par Jésus-Christ.
