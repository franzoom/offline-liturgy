celebration:
  title: Saint Parre
  subtitle: martyr
  description: |-
    Ce martyr — le premier du diocèse — fut mis à mort vers l’année 275. Né à Troyes, d’une riche famille, il se fit surtout remarquer par sa bonté pour les pauvres. Il se retira près de la ville pour mieux vaquer à la prière. Cité devant Aurélien, il fut décapité sur la rive de la Seine, à un mille de Troyes. L’Évêque Anségise fit don à Brunon, archevêque de Cologne, d’une partie de ses reliques, qui sont actuellement conservées avec honneur à Soest en Allemagne.
  commons:
    - martyr
  color: red

oration:
  - |-
    Par toi, Seigneur, la foi trouve sa fermeté et la faiblesse devient force : que ta miséricorde nous aide à suivre saint Parre dans son témoignage et à l’imiter dans sa foi. Par Jésus-Christ.
