celebration:
  title: Saints Potentien et Sérotin
  subtitle: évêque et diacre, martyrs
  description: |-
    La tradition rapporte que Potentien fut, au III^e siècle, le premier apôtre de l’Église de Troyes. Avec le diacre Sérotin, il fut envoyé par l’évêque de Sens, Savinien. Tous deux, expulsés de la ville, et retournés à Sens, y reçurent la couronne du martyre.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Seigneur notre Dieu, splendeur admirable de tes bienheureux, tu as consacré ce jour par le martyre des saints Potentien et Sérotin, dont l’enseignement et l’exemple ont conduit nos pères à la connaissance de la vraie foi : par leur intercession, accorde à tes serviteurs de parvenir aux joies de l’éternité. Par Jésus-Christ.
