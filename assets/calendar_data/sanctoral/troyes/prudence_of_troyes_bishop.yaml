celebration:
  title: Saint Prudence
  subtitle: évêque
  description: |-
    Chassé d’Espagne par les Sarrasins, il trouva refuge en Gaule. Évêque de Troyes en 846, il se distingua par son zèle pour la discipline religieuse. Des erreurs commençaient alors à se répandre au sujet de la prédestination. Il les dénonça, les attaqua énergiquement et les réfuta en basant ses arguments sur le témoignage des Pères. Il consacra le monastère de Montiéramey et rédigea de pieux poèmes. Ce fut un des évêques éminents de son temps. Il mourut en 861.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Lumière des fidèles et pasteur des âmes, Dieu qui a mis saint Prudence à la tête de ton peuple, pour le nourrir de sa parole et le guider par son exemple, accorde-nous, par son intercession, de garder la foi qu’il sut transmettre et de suivre le chemin qu’il a tracé. Par Jésus-Christ.
