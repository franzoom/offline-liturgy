celebration:
  title: Les Saintes Reliques conservées dans le diocèse
  description: |-
    Malgré la dispersion des reliques sous la Révolution française, le diocèse de Troyes en a conservé un grand nombre, dont certaines très importantes. À la cathédrale, celles de saint Loup et une partie de la tête de saint Bernard et de saint Malachie. Dans l’église de Saint-André ont été déposées beaucoup de reliques venant du monastère de Montier-la-Celle. L’église de Ville-sous-La-Ferté garde les ossements des saints de Clairvaux. Par ailleurs, de nombreuses autres reliques sont conservées en divers endroits du diocèse.
  color: white

oration:
  - |-
    Seigneur Dieu, tu as réalisé des merveilles dans tes bienheureux dont nous vénérons aujourd’hui les reliques : augmente notre foi en la résurrection, et fais-nous participer à la gloire de l’immortalité. Par Jésus-Christ.
