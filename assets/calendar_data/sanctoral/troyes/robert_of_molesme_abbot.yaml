celebration:
  title: Saint Robert
  subtitle: abbé
  description: |-
    Né en Champagne, il entra tout jeune au monastère de Montier-la-Celle dont il devint prieur. Bientôt après, il fut nommé abbé de St-Michel-de-Tonnerre. Comme les moines ne se soumettaient pas à son autorité, il fonda le monastère de Molesmes qu'il dut quitter deux fois, devant la mauvaise volonté de certains religieux. S'étant rendu à Cîteaux, il y établit le monastère, célèbre entre tous, qui devait prendre la tête de l'Ordre cistercien. Sur l'ordre du Pape, il retourna auprès des moines de Molesmes revenus à de meilleurs sentiments et mourut peu après, en 1110.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Seigneur, tu as donné à saint Robert de répondre avec persévérance à tes appels : donne-nous de prendre généreusement le chemin resserré qui conduit à la vie, et de le suivre fidèlement jusqu'au terme pour obtenir le salut éternel. Par Jésus-Christ.
