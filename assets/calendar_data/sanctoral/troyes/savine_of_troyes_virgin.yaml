celebration:
  title: Sainte Savine
  subtitle: vierge
  description: |-
    On rapporte qu'elle était la sœur de saint Savinien. Elle quitta son pays pour venir à Troyes où elle mourut en apprenant la fin glorieuse de son frère. Ses reliques sont conservées dans l'église qui porte son nom, dans la banlieue de Troyes.
  commons:
    - virgins
  color: white

oration:
  - |-
    À ton appel, Seigneur Dieu, sainte Savine a tout quitté pour passer des ténèbres à ton admirable lumière. À sa prière, accorde-nous de résister aux attraits de ce monde pour suivre fidèlement le Christ Jésus. Lui qui vit.
