celebration:
  title: Saint Savinien
  subtitle: martyr
  description: |-
    Selon la tradition, Savinien, originaire de l’île de Samos en Grèce, catéchumène fuyant la colère de son père resté païen, arriva à Troyes où il reçut le baptême et prêcha l’Évangile. Au temps d’Aurélien, il fut arrêté et subit toutes sortes de tortures avant d’être décapité vers 275. Son corps aurait été retrouvé au village de Rilly-Sainte-Syre.
  commons:
    - martyr
  color: red

oration:
  - |-
    Dieu de puissance et de miséricorde, toi qui as donné à saint Savinien, ton martyr, de triompher dans la souffrance, accorde-nous, en ce jour où nous célébrons sa victoire, d’être toujours, avec ta grâce, plus forts que l’ennemi. Par Jésus-Christ.
