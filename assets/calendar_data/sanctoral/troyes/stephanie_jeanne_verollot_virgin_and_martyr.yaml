celebration:
  title: Bienheureuse Stéphanie-Jeanne Verollot
  subtitle: vierge et martyre
  description: |-
    Elisabeth Vérollot, née à Lignières le 13 janvier 1764, entra au Carmel sous le nom de Sœur Stéphanie-Jeanne de Saint-François-Xavier. Lors de la Révolution française, toutes les sœurs s'offrirent à Dieu en victimes. Arrêtées et transférées à Paris, elles furent condamnées à la guillotine. C'est en chantant des psaumes et des hymnes qu'elles obtinrent, le 17 juillet 1794, la gloire du martyre.
  commons:
    - martyr_female_virgin
  color: red

oration:
  - |-
    Seigneur Dieu, tu as appelé la bienheureuse Stéphanie-Jeanne à demeurer inébranlable en ton amour du sommet du Carmel à la gloire du martyre : accorde-nous la fidélité dans l'épreuve pour être ainsi conduits jusqu'à la claire vision de ta splendeur. Par Jésus-Christ.
