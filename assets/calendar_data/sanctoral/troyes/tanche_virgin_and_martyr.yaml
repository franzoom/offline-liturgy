celebration:
  title: Sainte Tanche
  subtitle: vierge et martyre
  description: |-
    Jeune fille noble des environs de Ramerupt, Tanche faisait route vers Arcis en compagnie d'un serviteur. Non loin de Lhuître, ce dernier lui fit des propositions déshonnêtes. Mettant sa confiance dans la force d'En-Haut, elle préféra mourir plutôt que de consentir au péché.
  commons:
    - martyr_female_virgin
  color: red

oration:
  - |-
    Par ta grâce, Seigneur Dieu, sainte Tanche n'a pas craint de répandre son sang pour défendre sa virginité : à sa prière, accorde-nous de garder la pureté de l'âme et du corps, pour ne jamais succomber aux attraits de la chair, ni à la crainte devant les périls. Par Jésus-Christ.
