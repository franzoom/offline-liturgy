celebration:
  title: Saint Thibaud
  subtitle: prêtre et ermite
  description: |-
    Il naquit à Provins, de l'illustre famille des Comtes de Champagne. Jeune encore, il quitta tout pour se retirer dans la solitude, d'abord dans une forêt au-delà du Rhin, puis près de Vicence, où il reçut le sacerdoce et s'adjoignit des compagnons. Il supporta avec beaucoup de patience des souffrances atroces et mourut le 30 juin 1066.
  commons:
    - pastors
  color: white

oration:
  - |-
    Pour te suivre, Seigneur Jésus, saint Thibaud a renoncé à la gloire et à la fortune : par son intercession, donne à ton peuple de s'attacher aux biens qui demeurent. Toi qui vis.
