celebration:
  title: Saint Victor
  subtitle: prêtre et ermite
  description: |-
    Dès l’enfance, il s’adonna entièrement à la lecture et à la méditation de la Sainte Écriture. Prêtre par obéissance, le goût de la solitude l’amena à se retirer près de Plancy où il eut une vie si austère qu’il semblait déjà délivré de son corps. Entre autres miracles, on dit qu’en faveur d’un roi de France, il changea en vin l’eau d’une fontaine. Parvenu à une extrême vieillesse, il entra dans son éternité vers le milieu du VII^e siècle.
  commons:
    - pastors
  color: white

oration:
  - |-
    Par ta grâce, Dieu tout-puissant, saint Victor a manifesté une admirable pénitence et a été favorisé du don des miracles : puissions-nous rompre avec le péché sur cette terre, pour que nos renoncements nous obtiennent la récompense dans le ciel. Par Jésus-Christ.
