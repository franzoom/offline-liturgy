celebration:
  title: Saint Vinebaud
  subtitle: abbé
  description: |-
    Né à Nogent-sur-Seine, il se retira, après avoir reçu le sacerdoce, en un lieu désert, sans doute Saint-Martin-de-Bossenay. Sur l'ordre de son évêque, il se fixa à Troyes au monastère de Saint-Loup, appelé plus tard Saint-Martin-ès-Aires, dont il devint abbé. Il mourut vers 620.
  commons:
    - saints-male_religious_abbot
  color: white

oration:
  - |-
    Seigneur Dieu, tu as comblé sur cette terre le bienheureux Vinebaud d'une admirable sainteté, et tu l'as élevé à la gloire éternelle du ciel : que ses mérites nous recommandent auprès de toi. Par Jésus.
