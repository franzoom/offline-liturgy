celebration:
  title: Saint Amédée d’Hauterives
  subtitle: évêque de Lausanne
  description: |-
    Saint Amédée naquit vers 1110, dans la famille des Seigneurs d’Hauterives. Tout jeune encore, il accompagne son père, Amédée l’ancien, à l’abbaye de Bonnevaux, fondée et dirigée par Jean qui sera bientôt évêque de Valence. Il sera lui aussi cistercien, mais à Clairvaux sous la direction de saint Bernard.
    Abbé d’Hautecombe en 1139, il est élu évêque de Lausanne en 1145. Souvent impliqué dans les affaires de son temps, il fut, par amour de la paix, l’arbitre de nombreux conflits. Pasteur tout dévoué à son Église, il fut aussi un prédicateur apprécié. On lui doit huit homélies en l’honneur de la Vierge Marie. Pie XII a cité Amédée dans la bulle qui définissait, en 1950, le dogme de l’Assomption.
    Saint Amédée est mort le 27 août 1159. Son tombeau et ses restes ont été découverts dans la cathédrale de Lausanne en 1911.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur notre Dieu, sous l’inspiration de ta grâce, l’évêque saint Amédée s’est fait le chantre de l’Assomption de la Vierge Marie ; permets qu’à sa prière, Notre-Dame douce et clémente vienne à notre aide dans la tendresse de son cœur maternel. Par Jésus Christ.

readings:
  patristicReading:
    - title: HOMÉLIE DE SAINT AMÉDÉE
      content: |-
        Honorons par un hommage assidu la reine du ciel, la mère de la vie, la source de la miséricorde, débordante de délices et appuyée sur son Bien-Aimé, et louons-la, si insuffisante que soit notre louange. Élevons-nous en esprit dans les hauteurs, considérant très attentivement que la très gracieuse tige sortie de la racine de Jessé s’est étendue partout sur la terre par un admirable développement de ses rameaux afin de protéger d’une ombre désirable, contre la chaleur, les vents et la pluie, les fils d’Adam dispersés et de les nourrir, dans leur faim, d’un fruit très salutaire. Élevée au-dessus de tous les arbres du paradis et exaltée au-dessus des cimes extrêmes des plus hautes montagnes, elle pénétra donc dans les cieux mêmes avec une incroyable majesté, soutenue par les chœurs des hiérarchies célestes et entourée par les danses des vierges.
        La toute bienheureuse (Vierge), remarquable par son mérite sans égal, se tient donc en présence du Créateur, interpellant toujours en notre faveur par sa prière très puissante. Instruite en effet par cette lumière pour qui tout est à nu et à découvert, elle voit tous nos périls et, douce et clémente souveraine, elle a pitié de nous d’un cœur très maternel. Mais il faut noter et considérer avec soin de quel amour et de quelle bonté elle embrasse et elle aime ceux qui lui sont unis par la pureté de l’âme, elle dont l’intervention délivre sans cesse, comme on l’a répété, les hommes mauvais et scélérats de la mort du péché et des souffrances éternelles. Elle resplendit et se distingue par sa double charité : d’une part, elle est très ardemment fixée en Dieu à qui elle adhère, faisant un seul esprit avec lui ; d’autre part, elle attire et console doucement les cœurs de ses élus et leur partage les dons excellents venus de la libéralité de son Fils. Surpassant donc en rapidité les six ailes du séraphin, tantôt dans la source de vie elle jouit de l’amour de la divinité, tantôt illuminant la terre de signes et de miracles, elle accourt partout vers les siens comme une mère pleine de joie et de munificence.
        Sa présence rend les uns vainqueurs en les faisant triompher des vices ; son intercession maternelle assure à d’autres la possession des plus hautes vertus ; à certains, elle ouvre le secret de la contemplation intérieure ; à d’autres, elle donne, au terme de leur vie, une route sûre, si bien que nulle force de l’ennemi ne saurait effrayer ceux que guide vers le Christ la mère du Fils unique de Dieu.
        Qu’il nous soit donné d’être de leur nombre et de leur société, ô clémente, ô tendre, ô douce Marie, pour qu’au jour de la colère, de la tribulation et de l’angoisse nous ne soyons pas punis selon nos crimes, mais que par toi, Notre-Dame, nous soyons trouvés dignes de la miséricorde de celui qui est remonté au Père pour préparer une place à ses serviteurs. Qu’il les place parmi les pierres de feu qui scintillent, dans le pays tout aimable du ciel, aux demeures resplendissantes du Paradis : Notre-Seigneur Jésus-Christ, à qui est la splendeur, l’honneur, la puissance, la gloire et la majesté avec le Père et l’Esprit-Saint dans les siècles des siècles sans fin. Amen.
      responsory: |-
        R/ Où est votre trésor, là aussi sera votre cœur.

        Ressuscités avec le Christ,
        recherchez ce qui est en haut.

        Vous êtes morts,
        Et votre vie est cachée avec le Christ en Dieu.

        Quand le Christ, votre vie, paraîtra,
        vous paraîtrez avec lui en pleine gloire.

morning:
  evangelicAntiphon:
    common:
      - |-
        Par sa prière de moine et dans le service de ses frères, saint Amédée est devenu le bon pasteur qui intercède pour son peuple et le nourrit de sa vie.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Avec saint Amédée, exaltons le Seigneur qui a glorifié la Mère de Jésus.
