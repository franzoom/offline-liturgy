celebration:
  title: Saint Andéol
  subtitle: martyr
  description: |-
    Saint Andéol est vénéré comme le premier apôtre du Vivarais. Sa légende en fait un sous-diacre et un disciple de saint Polycarpe et de saint Irénée. Il aurait été martyrisé sur le territoire actuel de Pierrelatte, mais il reçut la sépulture sur l’autre rive du Rhône, là où s’élève la cité qui porte son nom : Bourg-Saint-Andéol. On voit encore, dans l’église de cette petite ville, le sarcophage gallo-romain qui aurait abrité le corps du martyr.
  commons:
    - martyr
  color: red

oration:
  - |-
    Regarde, Seigneur, ton Église de Valence : par le travail apostolique de saint Andéol, ton martyr, tu lui as apporté les prémices de la foi ; par sa prière, accorde à ton peuple de rester toujours fidèle à l’Évangile qu’il nous a prêché. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE LA LETTRE DE SAINT POLYCARPE AUX PHILIPPIENS
      subtitle: |-
        Le martyr : image de la véritable charité
      content: |-
        J’ai pris grande part à votre joie en notre Seigneur Jésus-Christ, quand vous avez reçu les images de la véritable charité, et que vous avez escorté, comme il vous convenait de le faire, ceux qui étaient enchaînés de ces liens dignes des saints, qui sont les diadèmes de ceux qui ont été vraiment choisis par Dieu et notre Seigneur. Et je me réjouis de ce que la racine vigou-reuse de votre foi, dont on parle depuis les temps anciens, subsiste jusqu’à maintenant et porte des fruits en notre Seigneur Jésus-Christ, qui a accepté pour nos péchés d’aller au devant de la mort ; « Dieu l’a ressuscité en le délivrant des douleurs de l’enfer » ; %sans le voir, vous croyez en lui, avec une joie, ineffable et glorieuse% à laquelle beaucoup désirent parvenir, et vous savez que %c’est par grâce que vous êtes sauvés, non par vos œuvres, mais par le bon vouloir de Dieu par Jésus-Christ.%
        %Aussi ceignez vos reins et servez Dieu dans la crainte% et la vérité, laissant de côté les bavardages vides, et l’erreur de la foule, %croyant en celui qui a ressuscité notre Seigneur Jésus- Christ d’entre les morts, et lui a donné la gloire% et un trône à sa droite. %A lui tout est soumis, au ciel et sur la terre% ; à lui obéit tout ce qui respire, il viendra %juger les vivants et les morts% , et Dieu demandera compte de son sang à ceux qui refusent de croire en lui. %Celui qui l’a ressuscité d’entre les morts, nous ressuscitera aussi,% si nous faisons sa volonté et si nous marchons selon ses commandements, et si nous aimons ce qu’il a aimé, nous abstenant de toute injustice, cupidité, amour de l’argent, médisance, faux témoignage, %ne rendant pas mal pour mal, injure pour injure,% coup pour coup, malédiction pour malédiction, nous souvenant des enseignements du Seigneur qui dit : %Ne jugez pas, pour ne pas être jugés ; pardonnez, et l’on vous pardonnera ; faites miséricorde pour recevoir miséricorde ; la mesure avec laquelle vous mesurerez servira aussi pour vous, et bienheureux les pauvres et ceux qui sont persécutés pour la justice, car le royaume de Dieu est à eux% ; soyons zélés pour le bien, évitons les scandales, les faux frères, et ceux qui portent hypocritement le nom du Seigneur et qui égarent les têtes vides.
        %Quiconque en effet ne confesse pas que Jésus-Christ est venu dans la chair, est un antéchrist,% et celui qui ne confesse pas le témoignage de la croix est du diable, et celui qui détourne les dits du Seigneur selon ses propres désirs, et qui nie la résurrection et le jugement, est le premier-né de Satan. C’est pourquoi abandonnons les vains discours de la foule et les fausses doctrines, et revenons à l’enseignement qui nous a été transmis dès le commencement ; restons sobres pour pouvoir prier, persévérons dans les jeûnes, suppliant dans nos prières le Dieu qui voit tout de ne pas nous soumettre à la tentation car, le Seigneur l’a dit, %l’esprit est prompt, mais la chair est faible.%
        Soyons donc sans cesse fermement attachés à notre espérance et au gage de notre justice, le Christ Jésus, %qui a porté nos fautes en son corps sur le bois, qui n’a pas commis de péché et on n’a pas trouvé de fausseté en sa bouche% ; mais pour nous, pour que nous vivions en lui, il a tout supporté.
        Soyons donc les imitateurs de sa patience, et si nous souffrons pour son nom, rendons-lui gloire. C’est ce modèle qu’il nous a présenté en lui-même, et c’est cela que nous avons cru.
      responsory: |-
        R/ Sois fidèle jusqu’à la mort,
        le Seigneur combat pour toi.

        Ne craignez pas ceux qui tuent le corps
        et ne peuvent rien faire de plus.

        Le vainqueur, celui qui croit en moi,
        ne connaîtra pas la seconde mort.

        Espère en Dieu, prends cœur et prends courage,
        espère en Dieu.

morning:
  evangelicAntiphon:
    common:
      - |-
        Le cri de sa souffrance est monté vers Dieu : le Seigneur l’a sauvé de toutes ses angoisses.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Comme un fleuve aux eaux fertiles, son sang fait lever la moisson attendue.
