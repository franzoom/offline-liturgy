vespers:
  hymn:
    - unique-berger-o-jesus
  psalmody:
    - psalm: PSALM_14
      antiphon:
        - Dieu est juste et quiconque vit selon la justice est né de Dieu.
    - psalm: PSALM_111
      antiphon:
        - Celui qui agit selon la vérité vient à la lumière.
    - psalm: NT_11
      antiphon:
        - Père, je t’ai glorifié sur la terre en accomplissant l’œuvre que tu m’avais confiée.
  reading:
    biblicalReference: 1 Jn 4,16-17
    content: |-
      Nous avons reconnu et nous avons cru que l’amour de Dieu est parmi nous. Dieu est amour : celui qui demeure dans l’amour demeure en Dieu et Dieu demeure en lui. Voici comment l’amour, parmi nous, atteint sa perfection : il nous donne de l’assurance pour le jour du jugement. Car ce que nous sommes dans ce monde est à l’image de ce que Jésus est lui-même.
  responsory: |-
    R/ Vous avez appris de nous
    comment vous devez vous conduire pour plaire à Dieu.

    La volonté de Dieu,
    c’est que vous viviez dans la sainteté.

    Tenez bon et gardez fermement
    les traditions que nous vous avons enseignées.

    La volonté de Dieu,
    c’est que vous viviez dans la sainteté.
  evangelicAntiphon:
    common:
      - |-
        Le Seigneur a porté son regard sur saint Apollinaire pour accomplir les promesses faites à nos pères et nous manifester son amour.
  intercession:
    content: |-
      Prions le Seigneur qui couronne de gloire aujourd’hui saint Apollinaire et qui nous appelle tous à la sainteté :

      R/ Jésus, Bon Pasteur, entends notre prière.

      Toi qui nous as fait naître dans une Église riche de tout un passé de sainteté,
      – ranime en nous la fierté d’être chrétiens.

      Toi qui nous as donné saint Apollinaire comme modèle et protecteur,
      – accorde à son successeur, notre évêque, au clergé et aux fidèles du diocèse d’être attentifs à ses exemples et pleins de confiance en son intercession.

      Toi qui as montré en saint Apollinaire une sainteté vraiment apostolique,
      – suscite des vocations sacerdotales et religieuses nombreuses et fidèles.

      Toi qui as établi saint Apollinaire gardien de Valence en des temps difficiles,
      – donne-nous de travailler sans relâche à l’avènement de ton Règne de justice et de paix.

      Toi qui as béni le travail apostolique de saint Apollinaire,
      – bénis le labeur des travailleurs, donne à tous les hommes le pain quotidien et la faim de ta Parole.

      Toi que saint Apollinaire a retrouvé souvent dans la prière,
      – écoute son appel en faveur de nos défunts.
