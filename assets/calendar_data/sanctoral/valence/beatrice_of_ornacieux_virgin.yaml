celebration:
  title: Bienheureuse Béatrice d’Ornacieux
  subtitle: vierge
  description: |-
    Entrée, dès l’âge de treize ans, à la chartreuse de Parménie qu’on apercevait du château d’Ornacieu où elle était née vers 1260, Béatrice fut envoyée en 1301 à la fondation d’Eymeux. Elle devait y mourir de misère le 25 novembre 1303. Sa vie a été écrite pat-Marguerite d’Oingt, qui fut sa maîtresse des novices. Elle révèle l’ardent amour de Béatrice pour Jésus crucifié et les nombreuses grâces mystiques qui marquèrent sa vie généreuse.
    Ses reliques sont conservées à Parménie. Les frères des Écoles chrétiennes ont fait de cette ancienne chartreuse un centre de retraites.
    Eymeux conserve le souvenir de Béatrice et la chapelle bâtie par les Pères chartreux est un lieu de pèlerinage.
  commons:
    - virgins
    - saints-female_religious
  color: white

oration:
  - |-
    Ravive en nous, Seigneur, en ce jour où nous vénérons la bienheureuse Béatrice, le désir de communier à la passion de ton Fils ; que sa prière et son exemple nous aident à porter la croix de l’épreuve en disciples de Jésus crucifié. Lui qui.

readings:
  patristicReading:
    - title: TRAITÉ DE GUIGUES LE CHARTREUX SUR LA VIE SOLITAIRE
      content: |-
        La vie pauvre et solitaire, austère au début, facile en cours de route, devient à la fin céleste. Elle est ferme dans les épreuves, confiante dans les incertitudes, modeste dans le succès, sobre dans le vivre, simple dans le vêtement, réservée dans son langage, chaste dans ses mœurs, digne des plus grands désirs, car elle ne désire rien. Elle ressent souvent l’aiguillon du repentir pour ses fautes passées ; elle les évite dans le présent et les prévient pour l’avenir. Elle espère en la miséricorde et ne compte pas sur ses mérites ; affamée des biens célestes, elle dédaigne ceux d’ici-bas ; elle s’efforce d’acquérir des habitudes vertueuses, de s’y tenir avec persévérance, de les garder pour toujours. Elle s’adonne aux jeûnes par fidélité à la croix, elle consent aux repas par nécessité corporelle, réglant les uns et les autres avec la plus parfaite mesure, car elle maîtrise la gourmandise quand elle a décidé de se nourrir et l’orgueil, quand elle a jeûné. Elle s’applique à la lecture, mais préfère les livres religieux et d’autorité reconnue, et elle est bien plus attentive à la moelle du sens qu’à l’écume des mots. Mais voici plus étonnant et plus admirable : elle persévère dans le repos tout en n’étant jamais oisive. Elle s’assigne, en effet, des tâches assez nombreuses pour se trouver plus fréquemment à court de temps que d’occupations variées, pour se plaindre plus souvent de l’heure qui la trompe que de l’ennui du travail.
        Pourquoi insister ? Exhorter au repos est certes un beau sujet. Mais pareille invitation requiert un esprit maître de soi qui, attentif à son propre bien, dédaigne de se mêler des affaires des autres ou de la chose publique ; un esprit qui, servant sous le Christ dans la paix, ne veut être à la fois soldat de Dieu et du monde, et tient pour assurer qu’on ne peut jouir de ce siècle et régner dans l’autre avec le Seigneur.
        Mais ces renoncements et d’autres semblables sont bien peu de chose, si tu te souviens quel calice a bu sur le gibet celui qui t’invite à partager sa royauté. Bon gré mal gré, il te faut suivre l’exemple du Christ pauvre, si tu veux avoir part à ses richesses. Si nous partageons ses souffrances, dit l’apôtre, nous régnerons aussi avec lui, si nous mourrons avec le Christ, nous vivrons aussi avec lui. Notre Médiateur lui-même répondit aux disciples qui lui demandaient d’être admis à siéger, l’un à sa droite et l’autre à sa gauche : Pouvez-vous boire le calice que je vais boire ? Il nous montrait là que, pour obtenir, selon la promesse, de partager le festin des patriarches et de goûter au nectar des coupes célestes, il faut boire le calice des amertumes terrestres.
      responsory: |-
        R/ Souviens-toi de Jésus Christ,
        ressuscité d’entre les morts :
        il est notre salut, notre gloire éternelle.

        Si nous mourons avec lui
        avec lui nous vivrons ;
        Si nous souffrons avec lui,
        avec lui nous régnerons.

        En lui sont nos peines,
        en lui sont nos joies,
        en lui l’espérance,
        en lui notre amour.

morning:
  evangelicAntiphon:
    common:
      - |-
        Comme la colombe au creux du rocher, Béatrice a vécu cachée dans les plaies du Sauveur.

vespers:
  evangelicAntiphon:
    common:
      - |-
        L’ombre de la croix a illuminé sa vie et la Passion de Jésus attiré son cœur.
