celebration:
  title: Bienheureux Bertrand de Garrigue
  subtitle: prêtre
  description: |-
    Originaire de Garrigue, au diocèse de Nîmes, Bertrand fut l’un des seize premiers compagnons de saint Dominique à Toulouse en 1216. Premier prieur du couvent de Toulouse, il participe à la fondation de Paris et devient enfin le premier provincial de la province de Provence. Il héritera de la sollicitude de Dominique pour les moniales de Prouille.
    De passage chez les cisterciennes de Bouchet, il y meurt en avril 1230. On voit encore dans l’église du monastère, devenue paroissiale, la pierre tombale du bienheureux Bertrand. Son corps, enlevé par les dominicains d’Orange en 1414 et placé dans l’église de leur couvent devait disparaître dans les flammes, en 1561, du fait des calvinistes.
  commons:
    - pastors
  color: white

oration:
  - |-
    Dieu qui as donné le Bienheureux Bertrand comme disciple et compagnon à saint Dominique ; accorde-nous, à sa prière et à son exemple, de travailler à établir partout l’unité des esprits et des cœurs. Par Jésus Christ.

readings:
  patristicReading:
    - title: PORTRAIT DU BIENHEUREUX BERTRAND PAR JOURDAIN DE SAXE
      content: |-
        Lorsque Maître Dominique dispersa les frères, furent envoyés à Paris frère Matthieu qu’on avait élu comme abbé, et frère Bertrand qui fut plus tard Provincial de Provence. C’était un homme de grande sainteté et d’une inexorable rigueur à son propre sujet, qui mortifiait très durement sa chair. Il s’était imprégné sur de nombreux points de l’attitude exemplaire de Maître Dominique, dont il avait été parfois le compagnon de route.
        Deux ans plus tard, en se rendant de Toulouse à Paris, le bienheureux Père vint à Rocamadour et passa la nuit en prière dans l’église de la bienheureuse Marie. Frère Bertrand était son compagnon de route, de sainteté, de ferveur. Le lendemain, ils rejoignirent sur la route quelques pèlerins allemands, qui s’adjoignirent à eux par dévotion lorsqu’ils les entendirent réciter leurs psaumes et leurs litanies. Arrivés à l’étape, les Allemands les invitèrent et, selon leur coutume, leur partagèrent une chère plantureuse. Ainsi firent-ils durant quatre jours. Dominique, un beau jour, dit en soupirant à son compagnon : « Frère Bertrand, vraiment j’ai mauvaise conscience ; nous moissonnons les biens de chair de ces pèlerins, sans semer en eux les biens de l’esprit. Aussi, s’il te plaît, prions à genoux le Seigneur qu’il nous donne à la fois de comprendre et de parler leur langue, pour que nous puissions leur annoncer le Seigneur Jésus ». Ce qu’ayant fait, ils parlèrent l’allemand d’une manière intelligible, à la stupéfaction de tous. Ils marchèrent avec eux derechef pendant quatre jours et leur parlèrent du Seigneur Jésus. Ils arrivèrent enfin à Orléans. Les Allemands, qui voulaient aller à Chartres, les abandonnèrent sur la route de Paris en se recommandant humblement à leurs prières. Le lendemain le bienheureux Père dit au frère Bertrand : « Frère, nous entrons à Paris ; si les frères savaient le miracle que le Seigneur a fait pour nous, ils nous croiraient des saints, alors que nous sommes pécheurs ; et si ce bruit parvenait jusqu’aux séculiers, nous serions gravement exposés à la vanité. Je te défends donc, au nom de l’obéissance, de le dire à quiconque avant ma mort ». On respecta son désir. Mais après la mort du Bienheureux Père, frère Bertrand le raconta à quelques frères.
        Ayant remarqué que frère Bertrand s’affligeait trop de ses propres péchés, Maître Dominique lui avait dit de ne plus pleurer les siens mais ceux des autres. Telle fut l’efficacité de ses paroles que dès lors frère Bertrand pleura abondamment pour les autres, sans pouvoir pleurer pour lui-même, même quand il le voulait. Frère Bertrand célébrait, presque tous les jours, la messe en rémission des péchés.
      responsory: |-
        R/ Menez une vie digne de l’Évangile du Christ,
        luttant d’un cœur unanime pour la foi.

        Ne recherchez pas votre propre intérêt,
        mais plutôt celui des autres.

        Ayez entre vous les mêmes sentiments
        qui furent dans le Christ Jésus.

morning:
  evangelicAntiphon:
    common:
      - |-
        Le Seigneur lui a donné une âme de disciple pour faire connaître sa Parole et servir la Vérité.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Par sa parole, par sa vie pauvre et pure, il a fait resplendir la Vérité du Christ et rendu à l’Église ses traits évangéliques.
