celebration:
  title: Dédicace de l’église-cathédrale de Valence
  subtitle: |-
    fête (à la cathédrale : solennité)
  description: |-
    Notre église-cathédrale a été consacrée, le 5 août 1095, par le bienheureux Urbain II, assisté de douze évêques, dont saint Hugues de Grenoble et saint Bruno de Segni. Le pape se rendait à Clermont pour y prêcher la première croisade.
    Le nouvel édifice serait, pense-t-on, la troisième cathédrale de Valence ; la première était dédiée à saint jean l’Évangéliste et ce fait conforte la filiation irénéenne de notre Église, la seconde à saint Étienne, bâtie peut-être à l’époque où la « découverte » du corps du protomartyr (vers 415) suscita une grande dévotion envers le premier témoin de la foi chrétienne.
    La cathédrale actuelle a été consacrée en l’honneur de la Vierge Marie, comme tant d’églises au moyen-âge, et des saints Corneille et Cyprien. Des reliques de ce dernier auraient été données à Valence par Charlemagne, ou l’un de ses successeurs immédiats, et comme la liturgie ne sépare pas les deux martyrs, le pape et l’évêque, saint Corneille est aussi le titulaire de notre cathédrale. Ainsi, notre Église de Valence se rattache-t-elle à deux illustres métropoles chrétiennes : Rome et Carthage.
    En 1567 la cathédrale fut presque entièrement ruinée par les calvinistes ; sa restauration s’achèvera seulement en 1619. La foudre ébranle le clocher pour la troisième fois, en 1837 ; on le démolit. L’actuel est de 1862, construit au même endroit que l’ancien, mais dans un style différent.
    Temple de la raison, puis de l’Être Suprême, pendant la Révolution, la cathédrale retrouvera sa destination avec la prise de possession de son siège par le premier évêque du nouveau diocèse de Valence, Mgr Bécherel, le 12 septembre 1802.
    Le 4 mai 1847, Pie IX érige la cathédrale de Valence en basilique mineure, en souvenir du pape Pie VI mort non loin de ses murs, prisonnier du Directoire, le 29 août 1799. Son corps a été ramené à Rome, mais nous gardons son cœur et ses entrailles, enfermés dans une stèle surmontée de son buste.
    Comme son nom l’indique, la cathédrale est l’église de l’évêque, son siège. Elle nous renvoie au premier pasteur du diocèse. Célébrer la dédicace de la cathédrale, c’est aussi reconnaître la mission que Jésus a confiée à ses apôtres et que les évêques continuent : gouverner, rassembler, instruire, sanctifier.
  commons:
    - dedicace_outside
    - dedicace_inside
  color: white

oration:
  - |-
    Au jour où notre église-cathédrale a été consacrée, écoute, Seigneur, la prière de ton peuple ; donne-lui de ne faire qu’un avec son évêque dans le service du Christ et de son Église, sous la protection de Notre Dame et des saints Corneille et Cyprien. Par Jésus Christ.

readings:
  patristicReading:
    - title: |-
        SAINT BRUNO DE SEGNI : HOMÉLIE POUR LA DÉDICACE D’UNE ÉGLISE
      subtitle: Le symbolisme des rites
      content: |-
        Vous savez, mes Frères, rassemblés pour la Dédicace de cette basilique, que cette maison est appelée église parce qu’elle est le signe de la Sainte Église. Une telle maison, en effet, grande ou petite, est le signe de la Sainte Église tout autant que le très célèbre temple de Salomon ou que Jérusalem, la cité sainte, ou que la tente du témoignage.
        Église est un mot grec qui veut dire rassemblement du peuple, mais d’un peuple qui craint le Seigneur et qui sert le Seigneur. Comme, en effet, des pierres nombreuses, que disposent un ordre et un plan, réalisent une seule maison, ainsi des hommes nombreux, que groupe un amour de charité et de fraternité, constituent une seule Église.
        Mais les pierres qui ont élevé les murs désignent la multitude entière du peuple. De même que celles-là croulent facilement et ne peuvent rester en place si la chaux ou le fer ne les réunissent, de même ceux-ci aussi, si l’accord de la charité et le lien de la paix ne les assemblent et ne les unissent, l’édifice entier de l’Église s’effondre sans tarder et ne peut plus longtemps rester debout. Aussi, entre tous et à bon droit, sont maudits et détestés par Dieu, ceux qui sèment la discorde parmi les frères. Ces pierres-là en effet, seules la paix et la charité les relient, et de même, seule la discorde les disjoint.
        Mais approchons-nous maintenant de l’autel et regardons ce que l’évêque y accomplit. L’autel est dans l’église ce que notre cœur est dans notre corps. Car nous aussi nous sommes le temple de Dieu et nous devons absolument avoir en nous un autel. Ton autel, ô chrétien, c’est donc ton cœur. Aussi qu’il reçoive l’onction, qu’il soit consacré, qu’y soient déposées les reliques des saints, qu’y monte le parfum agréable, qu’y soit offert le sacrifice de louange.
        L’huile, c’est la miséricorde : qui n’en est pas oint est tout entier desséché et sans force. Que nos cœurs baignent donc dans cette huile de sorte que nous n’oublions pas la miséricorde. Aussi que notre pontife s’approche de l’autel de notre cœur ; Jésus-Christ est ce grand pontife dont il est écrit : %Tu es prêtre pour l’éternité selon l’ordre de Melchisédech% . Qu’il approche, dis-je, qu’il répande l’huile et dise : %Soyez miséricordieux, comme votre Père est miséricordieux.% De cette huile, lui-même était plein quand il priait pour ceux qui le crucifiaient en disant : Père, pardonne-leur, car ils ne savent pas ce qu’ils font. Cette huile, donc, c’est non seulement l’autel de notre cœur mais tous nos membres qu’elle doit oindre. Une main desséchée ne s’ouvre pas pour le pauvre et, parce qu’elle n’a pas été ointe, elle ne sait pas faire miséricorde.
        Sur cette onction, sur l’huile de la miséricorde on peut faire bien des considérations puisque « la terre est pleine de la miséricorde du Seigneur ».
        Mais que sont les reliques des saints qui reposent dans ces autels ? À mon avis, les reliques des saints, ce sont leur enseignement et leurs paroles. Nous pouvons donc avoir dans l’autel de notre cœur les reliques des saints mais aussi celles de notre Sauveur lui-même. C’est pourquoi il dit encore : %Celui qui garde mes commandements et les observe, celui-là m’aime.%
        Il avait placé ces reliques dans son cœur, celui qui disait : %J’ai caché tes paroles dans mon cœur, afin de ne pas pécher contre toi.% Bienheureux les autels où de telles reliques ont été déposées. Bienheureux les cœurs qui ont mérité de recevoir de telles reliques. Grandes sont ces reliques, et fort nombreuses, et c’est merveille qu’elles puissent être enfermées dans un si petit réceptacle.
      responsory: |-
        R/ La splendeur brille dans la maison du Seigneur,
        La puissance et la beauté dans son sanctuaire.

        Salut, Marie, pleine de grâce,
        Tu es la demeure du Très-Haut.

        C’est ici la maison de la prière,
        ouverte à tous les peuples.

        Salut, Marie, pleine de grâce,
        Tu es la demeure du Très-Haut.
