celebration:
  title: Saint Émilien
  subtitle: évêque de Valence
  description: |-
    Saint Émilien est le premier évêque connu de Valence. Vers 360, il sacre, avec son ami saint Eusèbe de Verceil, le premier évêque d’Embrun, Marcellin.
    Le 22 juillet 374, il accueille à Valence les évêques des diocèses de Viennoise et des Gaules pour un concile qui traitera de la discipline ecclésiastique, non sans avoir consulté, semble-t-il, « l’autorité du Siège apostolique », le pape saint Damase.
    Un Émilien a signé les actes du concile de Sardique (Sofia) en 343-344, qui prenait la défense de saint Athanase ; mais est-ce bien notre évêque ?
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    En l’évêque saint Émilien, tu as donné, Seigneur, à ton Église de Valence, un vrai pasteur, à l’image de celui de l’Évangile ; accorde à ses successeurs de marcher sur ses traces et à ton peuple la fidélité à leurs enseignements. Par Jésus Christ.

readings:
  patristicReading:
    - title: |-
        SAINT AVIT : HOMÉLIE POUR L’ORDINATION D’UN ÉVÊQUE
      subtitle: La mission et les devoirs de l’évêque
      content: |-
        L’évêque doit toujours se souvenir de la leçon qui vient d’être lue spécialement pour lui. L’Apôtre le déclare, le peuple y applaudit, le jugement y souscrit : Qui désire l’épiscopat désire une belle tâche.
        Beaucoup, il est vrai, ont coutume de refroidir pour ainsi dire l’ardeur de leur ambition personnelle sur cet encouragement de l’Apôtre, quand déjà il est permis de rechercher librement une belle tâche.
        Mais pareil désir disparaîtrait bien vite si l’on méditait la suite : Il faut, y est-il dit, que l’évêque soit irréprochable. Alors, n’est-ce pas, se détruiraient d’elles-mêmes, les intrigues pour s’élever et la passion des honneurs. Alors les mérites s’éprouveraient eux-mêmes et apprécieraient la valeur du désir qu’on s’autorise. Garde-t-on intacte et pure de toute souillure et de toute faute l’image divine ? L’esprit, dans son élan, n’a-t-il pas dépassé parfois le seuil de la mesure ? Une main avare n’a-t-elle pas refusé aux pauvres le superflu ? Une conversation sans retenue n’a-t-elle jamais brisé un silence vertueux et plus salutaire ? Le soleil couchant apaise-t-il les violentes colères d’une chaude journée ? Le cœur, dans sa duplicité, n’oppose-t-il jamais ce qui est exprimé et ce qui est pensé, les mots proférés et les souhaits ? Enfin est-ce avec une crainte respectueuse que sont redoutés - pour ne rien dire des jurements - à tout le moins les parjures ? Ce n’est pas que nous puissions tous échapper à tous ces défauts, mais il serait redoutable de ne pas examiner chacun ses mérites, car seuls ceux qui sont irréprochables doivent être candidats.
        Que dire maintenant de ceux qui achètent à vil prix une grâce précieuse, y consacrant de l’argent après avoir sacrifié leur honneur, qui paient une campagne bruyante et mensongère, qui excitent et rebattent les oreilles des gens avec des propagandistes à leur solde, et qui oubliant que le Magicien Simon voulut acheter l’exercice du ministère divin, se vouent avec leur argent non au sacerdoce mais à leur perte. Tout cela donc, je le déplorerais librement en face de qui serait élu et promu par ambition : il ne peut aucunement plaire à Dieu, lui qui s’est complu en lui-même ; il souffre dommage quand autrui se perd.
        Parlons plutôt des devoirs d’un évêque vertueux. C’est qu’elle n’est pas légère la charge qui sera celle du pontife, tenu à la foi de parler en docteur de son peuple et de se conduire en disciple du Christ. Il dirigera son troupeau avec amour tout autant qu’avec rigueur. Il convient qu’il craigne pour ses propres manques ; il ne convient pas qu’il se fasse complice des péchés d’autrui ; il charge autrui quand il témoigne lui-même ; il souffre dommage quand autrui se perd.
        Quand il entend l’Apôtre dire que l’évêque ne doit pas être avide d’un gain honteux, il dirigera son « avidité » vers un gain, certes, mais certes pas vers un « gain honteux » : c’est dire qu’il s’appliquera à perfectionner, pour un enseignement assidu, les talents qui lui furent confiés et à doubler, en sauvant son troupeau, les multiples mérites qu’il s’est acquis.
        Il doit être bien orné, ce qui ne doit pas s’entendre matériellement : l’ornement d’un évêque, pourvu de la beauté qu’apporte le mérite, n’est pas la pompe extérieure mais la grâce.
        Puisse donc l’évêque, sur le chemin étroit et rude où il entraîne son peuple à sa suite, au milieu des difficultés, se gardant à sa droite, prudent sur sa gauche, craindre le danger de choir d’un côté et de l’autre.
        Que sa méditation apprécie, dans son équilibre, l’enseignement de l’apôtre s’il veut être maître de soi et non batailleur ; raisonnable et non buveur ; sobre sans être avare ; soumis en restant digne, humble et non aveuglé par l’orgueil ; miséricordieux, sans être indifférent ; redoutable, sans cruauté ; gouvernant bien sa maison, dans un ordre parfait, sans rien négliger, sachant acquérir, mais davantage encore partager.
        C’est donc à celui qui a géré sa maison d’une manière juste et remarquable qu’est confié à la banque du changeur évangélique beaucoup d’argent : cet argent à rendre avec un intérêt multiple, ce sera vous.
      responsory: |-
        R/ J’établirai sur eux de vrais pasteurs,
        j’accomplirai pour eux mes promesses.

        Prenez soin de tout le troupeau
        dont l’Esprit Saint vous a établis les gardiens.

        Veillez sur le troupeau que Dieu vous a confié,
        non par cupidité, mais par dévouement.

        Je suis le bon Pasteur :
        le bon Pasteur donne sa vie pour ses brebis.

morning:
  evangelicAntiphon:
    common:
      - |-
        Berger du peuple de Dieu, saint Émilien l’a conduit à l’exemple de Jésus, le vrai pasteur.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Par saint Émilien, la tradition vivante des apôtres est venue jusqu’à nous.
