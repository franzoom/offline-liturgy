celebration:
  title: Saints Félix, Fortunat et Achillée
  subtitle: prêtre et diacres, martyrs
  description: |-
    Les saints martyrs Félix, prêtre, Fortunat, et Achillée, diacres, sont considérés comme les fondateurs de l’Église de Valence, à l’initiative de saint Irénée de Lyon, vers les années 180. L’histoire ne peut en donner la preuve et la passion des martyrs, (vie siècle), est sans doute sans autorité. Mais si nous ignorons tout des origines chrétiennes de notre diocèse, la fête d’aujourd’hui nous permet de célébrer et d’invoquer nos pères dans la foi. Ils nous ont apporté le message du Christ et ils demeurent nos protecteurs auprès de Dieu.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Seigneur notre Dieu, le martyre des saints Félix, Fortunat et Achillée a été, pour ton Église de Valence, le grain qui meurt et porte du fruit. Puisque nous tenons d’eux le nom de chrétiens fais que nous conformions toute notre vie à l’Évangile qu’ils nous ont apporté. Par Jésus Christ.

readings:
  patristicReading:
    - title: DU TRAITÉ DE SAINT IRÉNÉE CONTRE LES HÉRÉSIES
      subtitle: Les témoins de celui qui s’est fait « passible »
      content: |-
        Après qu’il eut demandé à ses disciples : %Qui dit-on que je suis, moi, le Fils de l’Homme ?% et que Pierre lui eut répondu : %Tu es le Christ, le Fils du Dieu vivant% , le Seigneur le loua de ce que ce n’était pas la chair et le sang qui le lui avaient révélé, mais le Père qui est dans les deux : il faisait bien voir par là que le Fils de l’Homme en personne était le Christ, le Fils du Dieu vivant. Or, est-il dit, c’est à partir de ce moment-là qu’il commença à exposer à ses disciples qu’il lui fallait se rendre à Jérusalem, beaucoup souffrir de la part’ des prêtres, être rejeté, être crucifié et ressusciter le troisième jour. Ainsi Celui qui venait d’être reconnu par Pierre comme le Christ, qui venait de déclarer Pierre bienheureux parce que le Père lui avait révélé le Fils du Dieu vivant, celui-là même annonçait qu’il lui faudrait beaucoup souffrir et être crucifié.
        Et c’est alors qu’il réprimanda Pierre, parce que celui-ci partageait l’idée que les hommes se faisaient du Christ et repoussait sa Passion, et qu’il dit à ses disciples : %Si quelqu’un veut venir après moi, qu’il se renonce à lui-même, qu’il prenne sa croix et qu’il me suive. Car celui qui voudra sauver sa vie la perdra, et celui qui la perdra à cause de moi la sauvera.% Voilà ce que le Christ disait ouvertement, lui, le Sauveur de ceux qui, pour l’avoir confessé, seraient livrés à la mort et perdraient leur vie. Par contre, s’il s’agissait d’un Christ qui ne devait pas souffrir, mais s’envoler de Jésus, de quel droit exhortait-il ses disciples à porter leur croix et à le suivre, alors que lui-même, d’après les hérétiques, n’allait pas porter cette croix, mais déserter l’« économie » de la Passion ? Car ce qui prouve bien que le Christ ne parlait pas de la connaissance d’une prétendue Croix d’en haut, comme certains ont l’audace de l’expliquer, mais de la Passion qu’il allait devoir souffrir et que ses disciples souffriraient eux aussi, ce sont les paroles qu’il ajoutait : %Car quiconque sauvera sa vie la perdra, et quiconque la perdra la trouvera.% Et que ses disciples auraient à souffrir à cause de lui, c’est ce qu’il disait aux Juifs : %Voici que je vous envoie des prophètes, des sages et des docteurs, et vous en tuerez et en crucifierez.% Et à ses disciples il disait : %Vous comparaîtrez devant les gouverneurs et les rois à cause de moi et, parmi vous, ils en flagelleront, ils en tueront et ils en pourchasseront de ville en ville.% Il connaissait donc ceux qui souffriraient la persécution, il connaissait ceux qui allaient être flagellés et mis à mort à cause de lui, et il ne parlait pas d’une autre croix, mais de la Passion qu’il allait souffrir, lui, le premier, et ses disciples après lui. Aussi bien sa parole était-elle celle de quelqu’un qui voulait aussi les encourager : %Ne craignez pas ceux qui tuent le corps, mais ne peuvent pas tuer l’âme ; craignez plutôt celui qui a le pouvoir d’envoyer le corps et l’âme dans la géhenne.% Il les engageait à persévérer dans la confession de sa personne, car il promettait de confesser devant son Père ceux qui confesseraient son nom devant les hommes, mais aussi de renier ceux qui le renieraient et de rougir de ceux qui rougiraient de le confesser. Malgré cela, certains en sont venus à ce point de témérité qu’ils vont jusqu’à compter pour rien les martyrs et blâmer ceux qui sont mis à mort pour avoir confessé le Seigneur, qui supportent tout ce qui a été prédit par le Seigneur et qui s’efforcent en cela de suivre les traces de la Passion du Seigneur, en étant les « témoins » de Celui qui s’est fait passible. Ces gens-là nous les remettons aux martyrs eux-mêmes, car, lorsqu’il sera demandé compte de leur sang et qu’ils recevront la gloire, alors le Christ confondra tous ceux qui auront méprisé leur martyre.
      responsory: |-
        R/ À toi seul, Fils du vrai Dieu,
        la gloire et la louange.

        Qui se déclarera pour moi devant les hommes,
        je me déclarerai pour lui devant mon Père.

        Qui aura tenu bon jusqu’à la fin,
        je lui donnerai la vie éternelle.

morning:
  evangelicAntiphon:
    common:
      - |-
        Suivant jusqu’au bout l’Agneau immolé, ils ont blanchi leurs robes dans son sang et revêtu de lumière notre Église naissante.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Pareil au grain qui tombe en terre, leur martyre a été pour notre Église une semence féconde.
