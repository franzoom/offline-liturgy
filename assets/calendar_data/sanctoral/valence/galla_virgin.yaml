celebration:
  title: Sainte Galle
  subtitle: vierge
  description: |-
    La bibliothèque du Vatican possède un manuscrit du XI^e siècle qui reproduit la vie de sainte Galle. Elle aurait reçu le voile des vierges à Valence, en présence de sept évêques. Par la suite, l’Église de saint Apollinaire l’invoquera dans ses litanies et se réclamera de son patronage.
    Revenue dans son pays, le Pagus Baginensis, une vallée des environs de Nyons, elle en devient la bienfaitrice grâce à sa continuelle intercession. Elle aurait sauvé la population assiégée par les barbares, comme l’avait fait à Paris sainte Geneviève.
    Galle fut ensevelie à Bagenum, dans une église dédiée à saint Étienne mais qui portera un jour, comme le village lui-même, le nom de Sainte-Jalle. Le contexte religieux et social invite à placer la vie de sainte Galle, à la fin du VI^e siècle.
  commons:
    - virgins
  color: white

oration:
  - |-
    Tu nous fais admirer, Seigneur, dans la vie de sainte Galle, sa pureté, son amour de la prière et sa sollicitude pour la détresse des hommes ; que son exemple et son intercession nous aident à te servir fidèlement et à secourir tous ceux que nous pouvons aider. Par Jésus Christ.

readings:
  patristicReading:
    - title: SERMON DE SAINT CÉSAIRE D’ARLES
      subtitle: Entre dans la joie de ton Maître
      content: |-
        %Le royaume des cieux est semblable à dix vierges, qui prirent leurs lampes, et s’en allèrent au devant de l’époux et de l’épouse.%
        À la prendre à la lettre, cette parabole semble bien dure et pénible. Mais puisqu’aussi bien le Seigneur lui-même nous dit qu’il s’agit d’une image, voyons pourquoi il a été question de cinq vierges folles et de cinq vierges sages. Les cinq vierges sages symbolisent tous les saints qui doivent régner avec le Christ ; au contraire, les cinq vierges folles figurent les mauvais chrétiens, qui, sans pratiquer les bonnes œuvres, se glorifient du seul nom de chrétiens. D’autre part, s’il est question de cinq folles et de cinq sages, c’est que tous les hommes, comme on le sait, ont cinq sens : la vue, l’ouïe, le goût, l’odorat et le toucher. Par les cinq sens, comme par des portes ou des fenêtres en quelque sorte, la vie ou la mort pénètre jusqu’à notre âme, et le prophète dit à leur sujet : %La mort est entrée par vos fenêtres.% C’est pourquoi ici sont appelées sages les cinq vierges qui ont bien usé des cinq sens ; et folles, celle qui ont accueilli la mort plutôt que la vie, grâce à ces mêmes sens.
        Quand les âmes saintes savent tenir en laisse, à l’égard des choses défendues, nos cinq sens, quand elles leur permettent sobrement et modérément ce qui est licite et légitime, alors elles gardent la virginité des sens.
        En réalité, frères bien-aimés, à quoi sert à l’homme ou à la femme, au clerc au moine ou à la religieuse, de garder sa virginité physique, si les mauvais désirs violent son intégrité morale ? À quoi sert de vanter dans un seul organe sa chasteté, si l’on a dans tous les autres la corruption ? Car ces vierges qui suivent l’Agneau, si vous y faites bien attention, ne le suivent pas pour avoir gardé seulement la virginité du corps. C’est pourquoi, après ces paroles %ceux qui ne sont point souillés avec des femmes% , le texte ajoute : %On n’a pas trouvé sur leurs lèvres le mensonge, ils sont sans tache% . Celui qui s’enorgueillit de sa seule virginité physique, comprenez bien que, s’il aime le mensonge, il ne pourra suivre le Christ avec ses vierges saintes. Qu’aucune vierge donc ne se prévale de sa seule virginité corporelle : car, si elle est désobéissante ou médisante, qu’elle sache qu’elle sera exclue des noces de l’époux céleste.
        Si le bienheureux apôtre a appelé vierge toute l’Église catholique, c’est qu’il ne considérait pas en elle seulement les vierges de corps, mais désignait l’intégrité de toutes les âmes, en disant : %Je vous ai fiancés à un époux unique, comme une vierge pure à présenter au Christ ;% pour cette raison, ce ne sont pas seulement les âmes des moniales qui peuvent se dire avec confiance les épouses du Christ, mais aussi les âmes de tous les hommes et de toutes les femmes, à condition qu’ils gardent la chasteté du corps et la virginité de l’âme, en ce qui concerne les cinq sens dont j’ai parlé. Époux, non des corps, mais des âmes, voilà comment il faut comprendre le Christ.
        Aussi, frères bien-aimés, les hommes aussi bien que les femmes, les garçons aussi bien que les filles, s’ils gardent leur virginité jusqu’au mariage, si, faisant bon usage des cinq sens, ils ne laissent pas leurs âmes se corrompre par eux, alors au jour du jugement, par les portes ouvertes toutes grandes, ils mériteront d’entrer pour leur bonheur dans la chambre nuptiale de l’éternité. Si nous pensons à tout ceci avec une foi attentive, nous tous, mes frères, que l’on soit clerc, laïque, moine ou moniale ou dans l’état de mariage, si nous gardons, avec l’aide de Dieu, la pureté du cœur en même temps que la chasteté du corps, nous ne serons pas rejetés avec les vierges folles dans les ténèbres extérieures, où il y aura des pleurs et des grincements de dents mais, avec les vierges sages, nous serons admis aux noces spirituelles et nous mériterons d’entendre : C’est bien, bon et fidèle serviteur, entre dans la joie de ton maître. Que lui-même daigne nous accorder cette grâce.
      responsory: |-
        R/ Joie pour qui cherche en Dieu son refuge,
        éternels cris de joie.

        Dès le matin je suis tendu vers toi
        et je reste en éveil.

        Oui tu bénis le juste, Seigneur,
        tu l’entoures du rempart de ta grâce.

        Ouvre mes lèvres
        et ma bouche annoncera ta louange.

morning:
  evangelicAntiphon:
    common:
      - |-
        Fragile comme une enfant, sainte Galle a reçu la force des prophètes pour annoncer le salut de Dieu.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Le Seigneur l’a revêtue de sa force pour manifester au monde la puissance de sa grâce et son amour des humbles.
