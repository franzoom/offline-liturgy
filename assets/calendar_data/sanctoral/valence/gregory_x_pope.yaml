celebration:
  title: Bienheureux Grégoire X
  subtitle: pape
  description: |-
    Le pape Grégoire X s’est dit lui-même un fils de l’Église de Valence : « Nous sommes d’autant mieux disposé à la favoriser que nous l’aimons d’un amour plus tendre. Nous ne pouvons, en effet, l’ignorer et même bien des fois ce souvenir se présente à notre mémoire, cette Église nous a autrefois réchauffé sur son sein ; elle a eu pour nous, enfant , des entrailles de mère et nous a nourri de son lait. Voilà pourquoi maintenant quelle reconnaît pour père celui que naguère elle appelait son enfant, nous nous sentons pour elle rempli de dévouement et pénétré d’une affection vraiment paternelle. » Le pape écrivait cela dans la bulle qui nommait Amédée de Roussillon évêque de Valence. Mais nous ignorons les circonstances qui ont amené chez nous le jeune Visconti, né à Plaisance en 1210. Il deviendra chanoine de Lyon, et, à ce titre participera au premier concile tenu dans cette ville. Il sera ensuite archidiacre de Liège, au service de Guillaume de Savoie, un ancien administrateur du diocèse de Valence. Il n’était pas encore prêtre et il était parti à la croisade, quand il fut élu pape le 1^er septembre 1271, après un conclave qui dura près de trois ans. En 1274 Grégoire X convoque à Lyon un concile où sera proclamée une union des grecs et des latins qui sera malheureusement sans lendemain.
    Alors qu’il regagnait Rome, il meurt à Arezzo le 10 janvier 1276. La cathédrale de cette ville conserve encore sa tombe. Son culte a été reconnu en 1713.
    C’est Grégoire X qui décida, en 1275, l’union des diocèses de Valence et de Die qui devait durer jusqu’en 1687.
  commons:
    - pastors_pope
  color: white

oration:
  - |-
    Seigneur, ravive en nos cœurs l’amour filial que manifestait le Bienheureux Grégoire X pour l’Église de Valence ; puissions-nous travailler comme il l’a fait, à l’union des chrétiens dans la vérité et l’amour. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE LA LETTRE DU BIENHEUREUX PAPE GRÉGOIRE X A HENRI, ÉVÊQUE DE LIÈGE
      subtitle: Que l’évêque soit le modèle du troupeau et le salut de son peuple
      content: |-
        Quiconque se voit confier le troupeau du Seigneur et imposer la charge des âmes doit veiller sur ce troupeau face aux esprits malins.
        Est-il un art, un métier, un office ou une charge qui se perfectionne ou s’acquiert sans une vie de veilles ? Si d’aussi longues veilles sont requises lorsqu’il s’agit d’intérêts temporels et éphémères, il est bien clair que la sollicitude doit garder les yeux ouverts lorsque le profit cherché est celui des âmes mêmes.
        Tout prélat est donc tenu de veiller avec toute diligence à la garde du troupeau, pourvu que ce soit avec la ceinture aux reins. Il lui est en effet commandé de mettre tout son soin à se ceindre les reins. Toute la loi que lui prescrit le Fils de Dieu consiste à ceinturer ses reins. Il doit y joindre toutefois le secours des lampes, sans lesquelles ni l’obscurité de la nuit ne s’entrouvre, ni la vue du jour qui vient ne reluit.
        Mais pourquoi mentionne-t-il plus spécialement les reins ? C’est pour que le prélat, sa chair ainsi ceinte, ait plus libre accès auprès du Seigneur dans l’intérêt de ses sujets. Car alors, n’étant alourdi ni par la dépravation de la chair ni par le poids du corps, il peut, suivant l’étymologie de son nom de pontife, se faire lui-même un pont entre Dieu et ses sujets.
        En effet, il offre à Dieu lui-même, comme un médiateur, les prières et les vœux légitimes du peuple, et par lui, comme par le moyen d’un pont, est transmise en retour la bénédiction et la grâce de Dieu. Aux ingrats, en effet, il reproche l’oubli des bienfaits de la bonté de Dieu ; aux négligents, il inculque la sévérité de sa puissance ; en faveur des uns et des autres, il s’emploie à apaiser le feu de son courroux, en mettant en avant tantôt la faiblesse des hommes, tantôt la grandeur de la divine pitié. D’ailleurs il n’est pas suffisant, pour un pasteur, de réfréner les instincts de la chair, « d’écraser les petits (c’est-à-dire les concupiscences naissantes) contre la pierre », et, ce qui est plus encore, d’avoir une conscience pure. Mieux que cela, il faut qu’en outre il tienne des lampes en ses mains, car autant les ténèbres sont amies des vices, autant les lampes sont ennemies des crimes.
        Et cela encore ne suffit pas chez un prélat, mais il faut qu’il porte ces lampes allumées, car s’il est vrai que luire est vain, que brûler est peu de chose, de ces deux propriétés résulte cependant un état valable et parfait.
        Qu’est-ce en effet que des lampes allumées, sinon chez le prélat lui-même les exemples éclatants d’une vie sainte ? Quand le feu de ces lampes est entretenu par les œuvres, par l’huile de la miséricorde et par la flamme de la charité, elles rendent et font paraître tel le prélat qu’il peut être appelé à bon droit le modèle du troupeau et le salut de son peuple.
      responsory: |-
        Pour toi, homme de Dieu,
        recherche la justice, la piété, la foi,
        l’amour ; la persévérance, la douceur.

        R/ Combats le beau combat de la foi,
        conquiers la vie éternelle
        à laquelle tu as été appelé.

        Les anciens qui exercent bien la présidence
        méritent double honneur,
        surtout ceux qui peinent au ministère
        de la parole et à l’enseignement.

morning:
  evangelicAntiphon:
    common:
      - |-
        Placé à la tête des Églises, le bienheureux Grégoire X les a guidées sur les chemins de l’unité et de la paix.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Témoin des promesses faites par Jésus à son Église, pour le salut du monde, le bienheureux Grégoire X a travaillé sans relâche à les mettre en lumière.
