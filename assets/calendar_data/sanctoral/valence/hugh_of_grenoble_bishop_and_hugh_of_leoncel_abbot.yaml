celebration:
  title: Saint Hugues de Grenoble et saint Hugues de Léoncel
  subtitle: évêque, et abbé
  description: |-
    L’évêque de Grenoble est né vers 1053, à Châteauneuf-sur-Isère, dans la famille des seigneurs du lieu. Chanoine de l’Église de Valence, il fut associé de bonne heure à la réforme grégorienne que conduisait, chez nous, Hugues, évêque de Die et légat du pape : Élu évêque de Grenoble, jeune encore, il accueillera dans son diocèse celui qui fut son maître à Reims et qui sera le fondateur des chartreux : saint Bruno. Lui-même aurait voulu embrasser la vie monastique à la Chaise-Dieu. Il meurt, après plus de cinquante ans d’épiscopat, le 1^er avril 1132. Guigues, né lui aussi dans le diocèse de Valence et cinquième prieur de la Chartreuse a écrit sa vie.
    Le père de saint Hugues a voulu finir ses jours à la Chartreuse ainsi que son frère, le père ou le grand-père de Hugues de Léoncel, à Saint-Ruf. On doit à cette famille la fondation du monastère des cisterciennes de Vernaison qui viendront s’installer à Valence en 1616.
    Hugues de Léoncel, neveu ou petit neveu de l’évêque de Grenoble, a d’abord été moine cistercien au Miroir, dans l’ancien diocèse de Lyon, avant de venir à Léoncel dont il sera abbé vers 1162. Il est abbé de Bonnevaux, quand il meurt en 1194. On lui doit la fondation de Valcroissant, près de Die, en 1188.
  commons:
    - pastors_multiple
  color: white

oration:
  - |-
    Dieu de force et de tendresse, tu as donné aux deux saints Hugues, l’évêque de Grenoble et l’abbé de Léoncel d’être plus unis dans ton amour et le service de l’Église que par leurs liens de famille. Accorde-nous, à leur exemple et par leur prière, de t’aimer par-dessus tout et d’avoir pour tous les hommes une vraie charité. Par Jésus Christ.

readings:
  patristicReading:
    - title: LA VIE DE SAINT HUGUES DE GRENOBLE, PAR GUIGUES LE CHARTREUX
      content: |-
        Le bienheureux Hugues, né dans le Valentinois, dans une localité proche de l’Isère qu’on appelle Chateauneuf, eut des parents qui ne manquaient pas d’importance selon l’échelle des dignités du monde, mais remarquables, qui plus est, par le privilège de la sainteté. Il aima beaucoup les études. Parti pour ce motif à l’étranger, il y rencontra bien des difficultés, car il avait d’instinct - et cela jusqu’à son extrême vieillesse - une modération timide qui le poussait à supporter même le manque du nécessaire, et même parmi les siens. S’il avait quelque tourment particulier, dominé par la timidité, il ne pouvait l’avouer même à ses amis. Cette espèce de frein l’éloignait de bien des actions interdites. Revenu des écoles, il séjourna à Valence où il était chanoine de la cathédrale, vivant malgré sa jeunesse dans la réserve et la modération, parmi les gens du siècle, car il avait décidé, comme il le disait lui-même, de se garder, avec l’aide de Dieu, indemne de toute corruption. Il arriva que le Seigneur Hugues, légat de toutes les Gaules par ordre de Grégoire VII de bienheureuse mémoire, vint dans cette ville. C’était un homme très actif dans les affaires de l’Église, et fort connu ; il était à ce moment-là à la tête de l’Église de Die et fut par la suite archevêque de Lyon. Il vit ce jeune homme, au visage distingué, de haute taille, modéré dans sa parole, réservé dans sa conduite. Instruit de sa science et de sa noblesse par ceux qui le connaissaient, cet évêque, qui avait une intelligence très vive tant dans des affaires humaines que divines, reconnut en lui pour l’avenir de grands signes d’intégrité et de sainteté. Il l’embrassa avec joie, aimablement, et lui demanda de venir chez lui pour devenir le compagnon qui partagerait ses combats. Au bout de quelque temps, le légat tint à Avignon, un important concile. À cette assemblée vinrent les chanoines de Grenoble, qui n’avaient plus d’évêque et en cherchaient un. Quand ils eurent découvert que le jeune homme, dont nous racontons l’histoire, participait à la réunion, avec l’appui de l’assemblée, ils supplièrent son respectable protecteur, dont il était le compagnon précieux, de le leur donner sans tarder pour évêque. Le légat tout joyeux, accepta sur-le-champ. Mais le jeune homme, frappé jusqu’au tréfonds d’une crainte soudaine, résistait de toutes ses forces : son âge, ses connaissances, sa conduite enfin et sa vie - disait-il - n’étaient pas à la hauteur de si grands mystères ; il ne pouvait absolument pas supporter de souiller des charges si respectables par sa bassesse personnelle, au péril de son propre salut. Jusqu’à sa mort, il ne se déprit pas de ce jugement de lui-même, empreint d’une si profonde humilité. Toujours, malgré ses progrès dans les bonnes œuvres et la sainteté, il affirma, sans rougir, être un serviteur inutile, indigne d’exercer le pontificat, et il resta toujours prêt à abandonner cette fonction. Or voici ce qu’il advint : méprisant la chair, il poursuivait avec un zèle brûlant les réalités spirituelles ; à cause de l’abus des veilles, des jeûnes, des lectures, des prières et des méditations, il tomba très gravement malade de la tête et de l’estomac. Les malaises et les tourments de cette maladie, vraiment très violents et très fréquents, ne cessèrent pas pendant quarante ans au moins, tant qu’il vécut. Comme l’or chauffé se purifie dans le creuset, sous l’effet de ces deux tourments, la tentation et la maladie, il fit de grands progrès dans l’amour spirituel de Dieu. Par la grâce de Dieu, il avait concentré en sa personne l’ornement d’innombrables vertus qui, réparties entre d’innombrables personnes, pourraient suffire à les rendre, chacune, illustres et connues. Mais lui ne pensait qu’à son imperfection. Quoiqu’appesanti par les maladies et l’âge, fortifié par l’espoir de se reposer un jour, Hugues se mit en devoir d’aller trouver le pontife romain ; il ne put obtenir la permission de ne s’occuper que de Dieu. On crut en effet que tout faible et malade qu’il fut, sa seule autorité, la sainteté de sa vie donnée en exemple, pouvaient être plus utiles au peuple qu’il gouvernait que la présence de n’importe quel autre, solide et en bonne santé. Il avait toujours été évident par ses paroles et ses actions que Dieu habitait sa sainte âme, mais c’est alors surtout, dans l’affliction suprême de la maladie, qu’on ne put ignorer l’homme qu’il était, la grandeur de son mérite, la sincérité avec laquelle il adorait Dieu, l’amour véritable dont il avait, durant sa longue vie, défendu la justice et la charité.
      responsory: |-
        R/ Fais grandir en nous, Seigneur
        l’accord et l’harmonie d’un même amour.

        Menez une vie digne de l’Évangile,
        fermes dans un même esprit,
        luttant d’un cœur unanime.

        Sans vous soucier de vos propres affaires,
        ayez à cœur celles de vos frères,
        à l’exemple du Christ Jésus.
    - title: LETTRE DE SAINT BERNARD A HUGUES, FUTUR ABBÉ DE LÉONCEL
      content: |-
        À mon cher fils dans le Christ, Hugues nouvelle créature dans le Christ, frère Bernard que l’on appelle abbé de Clairvaux.
        Nous avons bondi de joie en apprenant ton changement de vie. Comment les hommes n’applaudiraient-ils pas à ce qui réjouit les anges ? Oui, un jour de fête se célèbre ; oui, l’action de grâce et la voix de la louange retentissent dans les deux. Un jeune homme, noble et élevé dans le luxe, a triomphé du démon, a méprisé le monde. Il fait bon marché de son corps, renonce à l’affection de ses proches, saute par-dessus les pièges tendus de la richesse, car il a des ailes. D’où te vient cette sagesse, mon fils ? Nous n’en avons pas trouvé tant chez les vieillards de Babylone. Ceux-ci, selon l’apôtre ou plutôt contre lui, veulent être riches en ce monde, ce qui les fait tomber en tentation et dans les pièges du diable. Je te rends gloire, Père, parce que tu as caché ces choses à des savants et les as révélées à un petit. Et toi aussi, mon fils, rends grâces pour ce bienfait de ton Rédempteur. Mais dépose ton âme d’enfant : sois tout petit par l’innocence, plutôt que par l’inconscience. Que l’âpreté de l’Ordre n’épouvante pas ton âge tendre. N’oublie pas que plus la carde est dure, plus douce en sort l’étoffe, et que plus âpre est notre genre de vie, plus pure est notre conscience. La douceur du Christ sera là. Et la petite poudre du prophète assaisonnera le plat immangeable. Si tu sens les piqûres de la tentation, regarde le serpent d’airain élevé sur la croix, et bois, non tant aux blessures du Christ qu’à ses mamelles : il sera pour toi une mère, tu seras pour lui un fils. Les clous ne pourront pas blesser le crucifié sans atteindre, à travers ses pieds et ses mains, tes pieds et tes mains à toi.
        Mais les ennemis de l’homme sont les gens de sa maison. Je parle de ceux qui ne t’aiment pas, mais aiment leur joie en toi. Je voudrais qu’ils entendent notre enfant leur dire : Si vous m’aimiez, vous vous réjouiriez, parce que je vais vers le Père. Si ton propre père se couche sur le seuil, dit saint Jérôme, si ta mère découvre son sein et montre les mamelles qui t’ont allaité, si un petit enfant se pend à ton cou, foule aux pieds ta mère et va, vole, les yeux secs, vers l’étendard de la croix. Quand l’amour du Christ est en cause, c’est le summum de la piété filiale que de se montrer cruel. Ne te laisse pas émouvoir par les larmes de gens qui ont perdu le sens : fils de l’enfer, tu es devenu fils de Dieu, et ils te pleurent. Hélas, qu’est-ce que cette convoitise impitoyable aux malheureux ? Qu’est-ce que cet amour cruel, et cette perverse manière d’aimer ? Les mauvaises conversations corrompent la bonne conduite. Donc autant que possible mon fils, évite les bavardages des hôtes, car ils remplissent l’oreille et vident l’esprit. Apprends à prier Dieu, apprends à élever ton cœur comme tu élèves tes mains. Apprends à diriger vers le ciel tes regards suppliants, et à présenter dans toutes tes nécessités au Père des miséricordes un visage qui attire la miséricorde. Il est impie de croire que Dieu peut rester insensible à tes sanglots, détourner son oreille de ton cri. Pour le reste, rap-pelle-toi qu’il te faut obéir en toutes choses aux conseils des Pères spirituels, comme s’ils étaient les ordres de la Divine Majesté. Fais cela, et tu vivras. Fais cela et la bénédiction viendra sur toi, et pour tout ce que tu as abandonné, tu recevras le centuple, même en cette vie. Ne crois pas l’esprit qui te persuaderait que tu te presses trop, et qu’il vaudrait mieux attendre un âge plus mûr. Crois plutôt celui qui a dit : « Il est bon pour l’homme de porter le joug dès sa jeunesse ; que solitaire et silencieux il se courbe quand le Seigneur l’impose sur lui ». Porte-toi bien, et tâche de persévérer, car seule la persévérance reçoit la couronne.
      responsory: |-
        R/ Fais grandir en nous, Seigneur
        l’accord et l’harmonie d’un même amour.

        Menez une vie digne de l’Évangile,
        fermes dans un même esprit,
        luttant d’un cœur unanime.

        Sans vous soucier de vos propres affaires,
        ayez à cœur celles de vos frères,
        à l’exemple du Christ Jésus.

morning:
  evangelicAntiphon:
    common:
      - |-
        Grâce à eux le désert a fleuri ; à leur appel, la solitude a retenti de la louange de Dieu.

vespers:
  evangelicAntiphon:
    common:
      - |-
        À l’exemple du Christ, ils se retiraient dans la montagne pour y prier Dieu.
