celebration:
  title: Saint Ismidon
  subtitle: évêque de Die
  description: |-
    Fils du Seigneur de Sassenage, Ismidon fit une partie de ses études à l’ombre de la cathédrale de Valence. Il devint ensuite chanoine de l’Église de Lyon. Élu évêque de Die vers 1097, il y meurt un 30 septembre, probablement en 1115. Sa famille donnera plus tard une compagne à la bienheureuse Béatrice d’Ornacieux et elle sera une des fondatrices de la chartreuse d’Eymeux.
    Très lié avec Hugues, archevêque de Lyon et légat du pape, autrefois évêque de Die, il le représente en plusieurs occasions et l’accompagne en Terre Sainte.
    Ismidon a laissé le souvenir d’un pacificateur adroit et désintéressé, d’un pasteur tout entier engagé dans la réforme grégorienne.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur, tu as donné à saint Ismidon, ton évêque, une grâce merveilleuse pour réconcilier les hommes désunis ; à sa prière, rassemble dans la vérité ceux que disperse l’errement et donne à tous un même cœur pour te servir. Par Jésus Christ.

readings:
  patristicReading:
    - title: |-
        DOM GRÉA : L’ÉGLISE ET SA DIVINE CONSTITUTION
      subtitle: Le ministère de l’évêque
      content: |-
        Comme Jésus Christ, en donnant la vie à son Église, se l’est acquise, et possède sur elle, à ce titre, la plus légitime et la plus auguste des souverainetés, ainsi, faisant de l’évêque le ministre et le coopérateur de son sacerdoce et l’associant à son action vivifiante, il lui donne encore part à son autorité et à tous ses droits.
        L’évêque a donc l’empire sur son Église ; et, comme Jésus-Christ conserve principalement l’Église universelle par le soin qu’il prend de la régir et par l’assistance qu’il donne à son vicaire pour la gouverner en son nom, c’est aussi en exerçant sur son peuple son empire spirituel que l’évêque lui donne continuellement ses soins les plus utiles et pourvoit à son salut et à ses progrès.
        Cet empire de l’évêque comprend le pouvoir de faire des lois et d’établir des règlements stables ; il comprend en second lieu le pouvoir de juger et de maintenir la paix et le bon ordre par les sentences qui terminent les différents ou frappent les coupables ; enfin il contient encore le pouvoir d’exécuter ses décisions et d’appliquer des peines, jusqu’à retrancher de l’Église les prévaricateurs et les rebelles.
        Ce triple pouvoir rend le gouvernement de l’évêque tutélaire et redoutable tout ensemble. La santé et la vie de ses sujets, et non pas la vie temporelle, mais la vie éternelle, dépendent de l’exercice qu’il en fait. Quelle crainte ne doit pas inspirer aux chrétiens l’autorité du prince et du juge déposée entre ses mains ! Quelle doit être leur obéissance ! Mais cette crainte est tempérée par l’amour ; cette obéissance est filiale. Car tout ce grand pouvoir repose sur le bienfait de la régénération et sur le don de la vie nouvelle. C’est le pouvoir paternel de Dieu même sur les fils d’adoption qu’il s’est donnés en Jésus Christ, l’unique et le premier-né. L’évêque en porte la vénérable image ; car, dit saint Ignace « celui que le maître de maison envoie pour administrer sa maison, il faut que nous le recevions comme celui-là même qui l’a envoyé ».
        Dans l’exercice de cette autorité, l’évêque entrera dans un contact plus immédiat avec l’élément variable des choses humaines. Il devra soutenir et diriger son peuple au milieu de périls sans cesse nouveaux et de circonstances diverses. Chaque siècle et chaque contrée apportent à Jésus Christ, avec les générations humaines qu’il est venu sauver, les exigences changeantes de leurs faiblesses et de leurs progrès, du bien et du mal qui est en elles, de leur civilisation ou de leur barbarie.
        Chaque siècle a ses temps de paix et ses temps de persécution ; le milieu social où l’homme est jeté par sa naissance et où l’Église vient le chercher pour le régénérer est une atmosphère formée d’éléments multiples et contraires, lentement préparée par les révolutions humaines, et qui ne cesse de se modifier d’âge en âge. Les influences malsaines et les courants salubres y passent tour à tour. L’Église, qui ne respire que le ciel, doit traverser dans son pèlerinage cette atmosphère incertaine. Le chrétien n’est pas du monde et il est dans le monde. Pour le guider parmi tant d’obstacles et de périls, quel art délicat, quelle prudence, quelle force, quelle suite ne faut-il pas dans l’autorité du pontife chargé de ce soin. « L’art des arts est le gouvernement des âmes. » L’ évêque, tout en gardant une fidélité inébranlable aux principes immuables, devra, dans ce gouvernement, observer les temps et les circonstances et faire la part de l’inconstance des choses humaines.
        Mais ce gouvernement de l’Église, pour sembler plus rapproché des vicissitudes d’ici-bas, n’en est pas moins sacré dans son origine et dans son essence, et l’autorité de l’évêque est toujours cette auguste paternité que lui donne son pontificat. Les fidèles reçoivent de lui la vie divine et l’aliment de cette vie, et ils lui appartiennent à ce titre.
      responsory: |-
        R/ Nous n’avons qu’un seul Maître, le Christ
        devenons ses disciples.

        Je vous confie à Dieu et à sa parole de grâce,
        c’est lui qui construira sa propre maison.

        Nous sommes les collaborateurs de Dieu,
        c’est lui qui donne la croissance.

        Nous sommes les intendants des mystères de Dieu,
        c’est lui qui rend à chacun ce qui lui revient.

morning:
  evangelicAntiphon:
    common:
      - |-
        Témoin du don de Dieu aux hommes, saint Ismidon a été un bâtisseur de cette paix que le monde ne peut donner.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Ismidon s’est fait pauvre pour annoncer au monde la richesse du Christ et sa paix.
