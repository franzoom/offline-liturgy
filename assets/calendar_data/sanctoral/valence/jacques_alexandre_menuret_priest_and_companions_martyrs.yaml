celebration:
  title: Bienheureux Jacques-Alexandre Menuret et ses compagnons
  subtitle: prêtre et martyrs
  description: |-
    Parmi les victimes des massacres qui ont ensanglanté Paris, les deux et trois septembre 1792, cent quatre-vingt-onze ont été béatifiés en 1926 par le pape Pie XI. Sur ce nombre on compte trois évêques, un frères des Écoles chrétiennes, quatre laïcs. Tous les autres martyrs étaient des prêtres, réguliers ou diocésains. Parmi ces derniers, un grand-oncle du père de Foucauld et Jacques-Alexandre Menuret, né à Montélimar le 2 avril 1734. Jacques-Alexandre Menuret était entré à 15 ans au séminaire parisien de Saint-Nicolas-de-Chardonnet. En 1767 il est curé de sa ville natale.
    En 1781, il est sous-économe de la communauté des prêtres de Saint-François-de-Sales, fondée, un siècle plus tôt, pour accueillir les prêtres âgés ou infirmes du diocèse de Paris et établie à Issy. Il en est le supérieur, en 1786. La Révolution le trouvera à ce poste et l’en chassera pour le mettre à mort dans le jardin des Carmes.
    L’ancien couvent, devenu le siège de l’Institut Catholique, garde dans la crypte de sa chapelle les ossements mêlés des martyrs et reste le témoin émouvant du sang versé par fidélité au Christ et pour la liberté de son Église.
  commons:
    - martyrs
  color: red

oration:
  - |-
    En appelant, Seigneur, ton prêtre Jacques-Alexandre Menuret et ses compagnons au témoignage suprême du martyre, tu as manifesté que tu n’aimes rien tant que la liberté et l’unité de ton Église ; par leur intercession, accorde à tous les baptisés de témoigner de toi sans entraves devant les hommes. Par Jésus Christ.

readings:
  patristicReading:
    - title: RÉCIT DE LA PASSION DES MARTYRS
      subtitle: Le récit d’un témoin
      content: |-
        En prière dans l’église (du couvent des Carmes), les prêtres (qui avaient été arrêtés) entendaient les cris de mort. Le ciel ne permit pas que leur constance en fut ébranlée. Aussitôt que leur tour arrivait, ces prêtres appelés à la mort se levaient : les uns avec cette sérénité à travers laquelle on perce la joie d’une âme assurée de l’instant qui va la mettre dans le sein de son Dieu ; les autres avec l’empressement, avec tous les transports de l’innocence invitée par les anges aux noces de l’Agneau.
        Celui-là, dédaignant d’interrompre le cours de ses prières, avait les yeux fixés sur son bréviaire, et jusque sous le glaive des assassins, payait à Dieu le tribut de ses louanges. Celui-là avançait, les promesses divines, les Écritures saintes à la main, et dans ses oracles sacrés puisait toute la force des martyrs dans leur dernier combat. Quelques-uns au front noble, majestueux, jetaient sur leurs bourreaux un œil de pitié et couraient affronter leurs piques et leurs haches.
        Plusieurs de ces illustres confesseurs avaient, dans les chaires publiques, dans de savants écrits, consacrés leur génie à défendre la religion, soit contre les sophismes des impies, soit contre les erreurs de la prétendue Constitution civile du Clergé ; ils se levaient en bénissant leur Dieu d’avoir à sceller de leur sang cette foi qu’ils avaient soutenue par leurs écrits. D’autres enfin, au moment où on les appelait, jetaient un dernier regard sur l’image de Dieu crucifié, lui disant ce qu’il avait lui-même fait entendre à son Père : Seigneur, pardonnez-leur, car ils ne savent ce qu’ils font.
        Supérieurs des vénérables prêtres retirés dans la maison de Saint-François de Sales, M. Menuret, ancien curé de Montélimar, n’avait pas moins de titres aux persécutions de la Terreur. Un esprit ferme et un cœur ennemi de toute dissimulation, une logique rigoureuse, pressante, unie à toutes les connaissances de son état, l’avaient rendu bien précieux. Appelé, comme supérieur d’une maison ecclésiastique, pour faire le serment en présence de la municipalité et des paroissiens, il répondit : « Messieurs, je sais ce que je puis vous accorder, et ce que ma conscience m’oblige de vous refuser. Puisque vous le voulez, et qu’on ne peut être patriote auprès de vous qu’en jurant le maintien de la nouvelle Constitution, je ferai ce serment ; mais à condition que vous insérerez et que je signerai dans vos registres la double restriction que j’y mets, en exceptant formellement tout ce qui blesse dans ce serment la justice et la religion. »
        Il s’éleva des réclamations. M. Menuret tint ferme, on ne put obtenir de lui d’autre serment. Les brigands le menacèrent, le pillèrent, le calomnièrent mais ne l’ébranlèrent pas. Conduit à la maison des Carmes, on eut dit qu’il était au comble de ses vœux. Le plaisir de se voir prisonnier pour la foi réveillait sa gaieté naturelle ; il la communiquait à tous ses confrères, il avait en effet trop bien prévu le terme de ses persécutions pour s’en affliger. Il avait fait son testament peu de temps avant la mort dont il se tenait assuré, car depuis ce temps-là, il n’était plus sur la terre que comme un homme prêt à partir pour les cieux. C’est à lui bien spécialement que l’on peut appliquer ce témoignage de l’homme le moins suspect d’avoir cherché à relever la gloire des martyrs, de ce M. Violette, de ce commissaire qui présidait à leur massacre. Ce M. Violette même, parlant deux jours après à ceux des prêtres qu’on avait arrachés à leurs bourreaux, mais qui étaient détenus à la section, leur disait dans un enthousiasme involontaire : « Je me perds, je m’abîme d’étonnement, je n’y conçois rien, et tous ceux qui auraient pu les voir n’en seraient pas moins surpris que moi. Vos prêtres allaient à la mort avec la même joie et la même allégresse que s’ils fussent allés aux noces. »
      responsory: |-
        R/ Le Christ Jésus est à la droite de Dieu,
        Il intercède pour nous.

        Qui pourra nous séparer de l’amour du Christ ?
        la détresse ? le danger ? le supplice ?

        En tout cela nous sommes les grands vainqueurs
        grâce à celui qui nous a aimés.

morning:
  evangelicAntiphon:
    common:
      - |-
        Ils sont morts par amour de l’Église, pour qu’elle vive libre, au service du Christ, messagère de sa justice et de sa paix.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Mis à mort près de l’autel du Christ, les martyrs communient à sa résurrection et partagent sa gloire.
