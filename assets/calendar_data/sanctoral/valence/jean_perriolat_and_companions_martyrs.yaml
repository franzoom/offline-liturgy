celebration:
  title: Bienheureux Jean Perriolat et ses compagnons
  subtitle: martyrs
  description: |-
    Avec cinquante de ses compagnons, jocistes, scouts, prêtres, séminaristes morts pour l’annonce de l’Évangile aux déportés du travail en Allemagne, Jean Perriolat est un témoin de la résistance chrétienne au nazisme. Il est né à Romans le 12 juin 1920. Après des études primaires à l’Institution Saint-Maurice et au collège des Maristes, à seize ans, il rejoint le monde du travail dans un commerce en gros puis comme coupeur en usine de cuir pour « rejoindre la masse ». En 1937 il adhère à la JOC où il exercera très vite des responsabilités importantes avant de revenir volontairement à la base. Il se fiance en 1942 avec Jeannette Deschamps. Il est un des organisateurs de la grève du 10 mars 1943 contre le STO. Il choisit cependant de partir lorsqu’il est appelé : « on ne peut pas laisser tomber les copains ». Affecté à une usine de produits chimiques à Breslau, il organise un réseau missionnaire malgré l’interdiction de l’Action catholique par le régime nazi. Responsable de l’AC en Basse-Silésie, il crée des Cercles d’Études clandestins abrités par des religieuses allemandes. Il réunit des travailleurs du STO, des prisonniers de guerre et des prêtres. Trahi par un volontaire STO, il est arrêté le 26 novembre 1944. Il est déporté à Gross-Rosen. Devant l’avance de l’Armée rouge il est emporté dans les « convois tombeaux » vers Mauthausen où il meurt le 14 avril 1945.
  commons:
    - martyrs
  color: red

oration:
  - |-
    Dans ta miséricorde, nous t’en prions Seigneur, augmente en nous la foi. Elle fit la gloire des bienheureux martyrs, Jean Perriolat et ses compagnons. Que cette même foi, vécue en vérité, fasse de nous des justes. Par Jésus Christ.

readings:
  patristicReading:
    - title: DES LETTRES DE JEAN PERRIOLAT À SA FIANCÉE
      content: |-
        Le rôle du Chrétien, Lumière du monde, c’est notre rôle providentiel, surtout ici. C’est le cas d’appliquer la phrase de Tobie : %« Au milieu des nations je témoignerai du Seigneur »%. Avec moi, sur 30 ou 35 mécanos, il y a des Polonais, des Tchèques, des Belges, des Italiens, des Juifs, des Allemands, un Espagnol et enfin 7 ou 8 Français. C’est la Société des Nations…
        Il faut faire scandale, montrer un christianisme positif, tout de Vie et d’Amour, car la masse est tellement habituée à une religion fade, triste et surtout d’éteignoir… Remercions Dieu de nous avoir donné cette tâche magnifique, ce rôle missionnaire de l’intérieur. À nous d’être toujours « sous pression » d’amour, pour pouvoir en user à tout moment… Le gars qui sait se poser, se donner, se dévouer… arrive vite à avoir la confiance de tous et faire jouer la Charité. C’est le rôle du Chrétien, sel de la terre, lumière du monde, levain dans la pâte…
        Chaque soir je lis et médite un petit passage de l’Évangile, chose qui avait subi des éclipses mais je vais y tenir dur… Nous avons pris la résolution de « prendre » (et vous ne sauriez croire à quel point c’est le terme exact), nous avons décidé de prendre chaque jour un moment, c’est-à-dire 5 ou 10 minutes ou, si possible, ¼ d’heure pour faire une courte méditation. Je sais que c’est dur pour demander cela ici, avec les conditions de vie que nous avons. Mais vous savez autant que moi que c’est là le seul moyen pour nous aider à monter vers le Christ…
        À des moments j’ai peur de ne pas vivre assez du Christ, de ne pas être assez le Christ et ainsi donner un reflet faussé, inexact… J’ai eu quelques crises d’attiédissement, de platitude. Encore une fois, que le Seigneur soit remercié pour ces épreuves qui m’aident à me détacher, à m’accrocher complètement au Christ… j’ai offert tout cela au Christ et j’y ai trouvé une réelle joie. Rien de tel, ma chère Jeannette que les difficultés pour nous rapprocher encore du Christ et nous le faire trouver plus proche et plus humain. Quelle source d’épanouissement si nous savons ne pas être dépassés et baigner, noyer tout cela dans l’amour du Christ… Que c’est bon de se faire petit, bien petit, entre les mains du Seigneur et de Lui dire de tout mener, de compter sur Lui. Le plus dur, bien sûr, c’est d’abdiquer son « moi personnel » et pour ajuster chaque pensée, chaque action, chaque geste avec ce qu’aurait été les siens…
        Vois-tu c’est là mon rêve, ce que j’entrevois pour notre foyer. Un foyer, une famille comme les autres, c’est-à-dire populaire, pas renfermée, gai, moderne, mais pas comme les autres parce que chaque détail sera imprégné de christianisme ; ce sera un îlot de christianisme au milieu de la masse neutre. Ma Jeannette chérie, c’est de cela que le monde souffre. La pâte est là, immense, énorme, sillonnée en tous sens de courants puissants mais nocifs… et le levain est là aussi, mais à côté, combien de fois. Et c’est là notre tâche d’y plonger à bloc, mais combien emballante cette tâche !
        Merci pour les photos… Tu sais qu’il ne se passe pas de journée sans que je me penche sur ton visage, chérie, comme pour y trouver plus de force. Mais laisse-moi te dire tout de suite que voici trois dimanches consécutifs que j’ai de libres, tu penses avec quelle joie j’ai pu me rendre à la petite chapelle et y communier notre Christ. Comme tu as raison de dire qu’il faut tout Lui donner car, d’abord on est si peu, si fragile, et puis il est la Vérité, la Voie, la Vie. Chaque matin, et chaque vendredi plus spécialement, mon offrande s’envole vers Lui en même temps que ma pensée va vers toi.
      responsory: |-
        R/ Souviens-toi de Jésus Christ,
        ressuscité d’entre les morts :
        il est notre salut, notre gloire éternelle.

        Si nous mourons avec lui
        avec lui nous vivrons ;
        Si nous souffrons avec lui,
        avec lui nous régnerons.

        En lui sont nos peines,
        en lui sont nos joies,
        en lui l’espérance,
        en lui notre amour.
