celebration:
  title: Saint Jean-François Régis
  subtitle: prêtre
  description: |-
    Né à Fontcouverte, à mi-chemin entre Narbonne et Carcassonne, le 31 janvier 1597, Jean-François Régis entre à 19 ans dans la Compagnie de Jésus. Pendant trois ans (1622-1625) il étudie la philosophie an collège de Tournon, ville qui faisait partie du diocèse de Valence à cette époque. Ordonné prêtre le 16 juin 1630, il consacre les trois premiers mois de 1636 aux paroisses de ce diocèse, sises dans la vallée du Doux. Nommé à la résidence du Puy, il devient l’apôtre réputé du Velay, du Vivarais et du Forez. Épuisé par un apostolat intense, il meurt à La Louvesc le 31 décembre 1640. Béatifié le 8 mai 1716, il sera canonisé le 16 juin 1737, en même temps que Vincent de Paul. Son tombeau attire toujours à La Louvesc de nombreux pèlerins.
  commons:
    - saints-male_religious
    - pastors
  color: white

oration:
  - |-
    Dieu, notre Père, tu as fait grandir en saint Jean-François Régis une intense vie de prière où se renouvelait constamment son souci d’annoncer l’Évangile ; fortifiés par son exemple, nous te demandons de nous rendre semblables au Christ qui, avant de rejoindre les foules, veillait auprès de toi sur la montagne. Lui qui.

readings:
  patristicReading:
    - title: |-
        YVES DE MONTCHEUIL : PROBLÈMES DE VIE SPIRITUELLE
      subtitle: Le véritable apostolat
      content: |-
        Le désir de l’apostolat véritable est, comme du reste tout désir chrétien, non le fruit de l’expansion ou de l’exaltation de quelque chose de naturel, mais le résultat d’une possession, d’une invasion transformées du divin en nous. Si l’apostolat ne trouve pas là sa vraie source, il aura toujours une tare originelle qui en compromettra les effets et qui se fera sentir dans les méthodes employées, dans les procédés auxquels on aura recours.
        Notre désir d’apostolat n’est donc pas une petite chose individuelle, née en nous, venant de nous, et qui se développerait entre nous et celui ou ceux que nous voudrions atteindre. Tant qu’il n’est que cela, il n’est pas le désir d’un apostolat spirituel. Il doit être l’écho, la participation en nous de cette immense aspiration de l’Église à devenir pleinement catholique, à réaliser son essence, à égaler son action à la puissance de vie dont elle se sent animée. C’est pourquoi le désir de l’apostolat est inséparable de la vie chrétienne, il n’est pas un luxe pour quelques uns. Il est l’expression nécessaire de la vie chrétienne, et on l’éprouve dans la mesure même où on possède cette vie.
        Nous pouvons rappeler ici, pour le transposer, ce que saint Augustin, dans un de ses plus beaux sermons sur l’Évangile de saint Jean, dit à ceux qui veulent vivre de la vie du Christ : « Aucun membre ne vit de la vie du Christ s’il est détaché de la vie du Corps, si tu veux vivre de la vie du Christ, reste dans le corps du Christ qui est l’Église. » Nous pourrions dire : « Si tu vis dans le Corps du Christ, tu participeras à la vie du Corps. Si tu veux vraiment être dans l’Église, il faut participer à ce désir de croissance qui l’anime toute entière. » Il n’est pas possible d’y demeurer comme quelqu’un qui veut y puiser la vie pour lui, mais ne s’intéresse pas à son développement. Il n’est pas possible d’y chercher un abri et comme un confort spirituel en le considérant comme un temple clos et achevé où l’on se réfugie.
        L’Église, Corps du Christ, vit de la vie du Christ. Tout ce qui en elle est spirituel, surnaturel, est écho du Christ, prolongation du Christ. Cela est vrai de son désir de croissance. Ce n’est pas une volonté qui lui soit propre, ce n’est pas comme une ambition personnelle qui l’anime, mais l’obéissance à une volonté du Christ : Allez, enseignez toutes les nations. Mais cet ordre n’est que l’expression extérieure et particulièrement solennelle d’un des plus chers désirs du cœur du Christ. Quand notre Seigneur définit en quelque sorte sa mission, nous trouvons des paroles comme celles-ci : Je suis venu pour que les hommes aient la vie, pour qu’ils l’aient en abondance. Voilà le sens de son passage sur la terre : donner la vie et toujours plus abondamment. Il possède la vie en plénitude. Il est la source d’eau vive qui désaltère pour la vie éternelle et il ne demande qu’une chose, c’est que tous y viennent boire. Ce désir du Christ se traduit encore dans ce mot si expressif : Je suis venu apporter un feu sur la terre, et comme je voudrais qu’il soit déjà allumé ! C’est un feu dévorant, un feu conquérant qu’il est venu apporter sur la terre. Pour le feu, il n’y a pas d’autre moyen d’être et de se conserver que de se propager. Enfin ce désir du Christ se révèle encore avec un de ses traits essentiels dans ces mots qu’il faudrait longuement méditer : J’ai encore d’autres brebis qui ne sont pas de cette bergerie : celles-là aussi, il faut que je les conduise. Elles écouteront ma voix : il y aura un seul troupeau et un seul pasteur. C’est quelque chose d’essentiel au christianisme que la grâce qui produit la transformation individuelle soit en même temps celle qui unit, celle qui fond en un, qui de tous ceux qu’elle touche fait un être un, le Corps du Christ, l’Église.
      responsory: |-
        R/ Ouvriers de la paix,
        la moisson vous attend :
        pour réconcilier le monde
        n’emportez que l’amour.

        À ceux qui vous accueillent
        comme à ceux qui vous chassent,
        annoncez la nouvelle :
        Le Royaume de Dieu est là, tout près de vous.

        Alors vous serez mes témoins
        jusqu’aux extrémités de la terre.

morning:
  evangelicAntiphon:
    common:
      - |-
        Toute sa vie a fait écho au sermon sur la montagne et montré le signe, planté sur les hauteurs, qui nous rassemble en Jésus Christ.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Il a toujours agi pour la plus grande gloire de Dieu. Son souvenir nous fait encore aimer le nom de Jésus et désirer sa compagnie.
