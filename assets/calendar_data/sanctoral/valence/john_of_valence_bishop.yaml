celebration:
  title: Saint Jean
  subtitle: évêque de Valence
  description: |-
    Né à Lyon vers 1079, le futur évêque de Valence appartint au clergé de sa ville natale, dont Hugues de Die était alors le pasteur. Après un pèlerinage à Saint-Jacques-de-Compostelle, il entre à Citeaux où il sera le condisciple de saint Bernard et, comme lui, placé très vite à la tête d’une fondation : Bonnevaux, près de Vienne (1117). Il en fera « une pépinière de saints ». Il y reçut Amédée de Clermont, Seigneur d’Hauterives, avec son fils, le futur Amédée de Lausanne et seize de ses vassaux. Plusieurs monastères doivent leur existence à saint Jean : Tamié en Savoie, Mazan dans le Haut-Vivarais, d’où sortiront les fondateurs de Sénanque, Léoncel en 1137.
    Élu évêque de Valence en 1141, Jean succédait à Eustache, de la famille des comtes de Valentinois, que saint Bernard avait vainement essayé de ramener à ses devoirs, comme deux de ses lettres en témoignent, et que le pape Innocent II finit par déposer.
    Saint Jean devait mourir dès 1145 en la fête de saint Benoît. Sa vie a été écrite par un contemporain et sa mémoire est célébrée le 26 avril, date qui pourrait être celle de son ordination épiscopale. On voit encore les vestiges de son tombeau, profané par les huguenots, près de la porte nord de sa cathédrale.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Réveille en ton Église, Seigneur, l’esprit d’amour dont fut animé l’évêque de Valence, saint Jean ; fais que remplis du même esprit, nous aimions ardemment ce qu’il a aimé et pratiquions ce qu’il a enseigné. Par Jésus Christ.

readings:
  patristicReading:
    - title: SERMON DE SAINT BERNARD SUR LE CANTIQUE DES CANTIQUES
      subtitle: L’évêque est un « veilleur »
      content: |-
        Les gardes m’ont trouvée, dit l’épouse du Cantique, eux qui veillent sur la ville. Qui sont ces gardes ? Ceux que le Seigneur, dans l’évangile, déclare bienheureux s’il les trouve vigilants lors de sa venue. Qu’ils sont bons, ces veilleurs qui, durant notre sommeil, restent à veiller, comme devant rendre compte de nos âmes ! Qu’ils sont bons, ces gardiens qui veillent spirituellement et passent la nuit en prière ! Ils surprennent de la sorte les ruses ennemies, préviennent les complots des méchants ; ils déjouent leurs pièges, évantent leurs chausse-trapes, dispersent leurs filets, réduisent à rien leurs machinations.
        Les voilà, les hommes qui aiment vraiment leurs frères et le peuple chrétien : ils prient beaucoup pour le peuple, et pour l’ensemble de la sainte cité. Les voilà, les hommes qui, par souci des brebis du Seigneur qui leur sont confiées, engagent tout leur cœur pour veiller dès l’aube devant le Seigneur qui les a établis, et se tiennent en prière devant le Très-Haut. S’ils veillent et prient ainsi, c’est qu’ils connaissent leurs limites dans cette tâche de garder la ville ; ils savent que, si le Seigneur ne garde la ville, en vain la garde veille.
        Par ailleurs, le Seigneur a donné ce commandement : Veillez et priez pour ne pas entrer en tentation. Et il est évident que sans cette double attitude des fidèles, la vigilance et la prière, jointe à l’attention des veilleurs, la cité ne peut être en sécurité - la cité, ou l’épouse, ou les brebis. Entre ces trois titres, tu cherches une différence ? Ils désignent la même réalité. Le terme de cité évoque un rassemblement ; celui d’épouse, un amour ; celui de brebis, une douceur.
        Veux-tu la preuve que l’épouse ne signifie rien d’autre que la cité ? J’ai vu, dit l’auteur de l’Apocalypse, %j’ai vu la cité sainte, la Jérusalem nouvelle, descendant du ciel, d’auprès de Dieu, parée comme une épouse qui s’est faite belle pour son époux.% De même il apparaîtra clairement que les brebis désignent la même réalité que l’épouse, si tu te souviens à quel point le premier veilleur - je parle de Pierre -, lorsqu’il reçut pour la première fois la charge des brebis, a été invité à les aimer. Celui qui les lui confiait n’aurait pas manifesté tant de souci, s’il n’avait pas eu conscience, jusqu’au plus intime de lui-même, d’être l’Époux.
        Écoutez cela, amis de l’Époux, si vraiment vous êtes ses amis. Encore est-ce trop peu de dire « amis », c’est amis intimes qu’il faut dire, puisqu’ils bénéficient d’une confiance si grande. Ce n’est pas pour rien que la question : Pierre, m’aimes-tu ? lui est répétée à trois reprises, au moment où il reçoit la charge des brebis. Pour ma part, voici ce qui me semble signifié dans ce fait : c’est comme si Jésus lui disait : « Si ta conscience n’atteste pas en toi-même que tu m’aimes, et que tu m’aimes avec force et en perfection, c’est-à-dire plus que tes biens, plus que ta famille, et même plus que toi-même (ce qui correspond à ma question trois fois posée), alors il ne faut certainement pas assumer cette charge ni t’occuper de mes brebis pour lesquelles j’ai versé mon sang ».
        C’est pourquoi prenez garde à vous-mêmes, vous tous qui avez part à la responsabilité de ce ministère. Oui, dis-je, prenez garde à vous-mêmes et au dépôt précieux qui vous est confié. Ce dépôt, c’est la cité, veillez sur sa sécurité et sur sa concorde. Ce dépôt, c’est l’épouse : prenez soin de sa parure. Ce dépôt, ce sont les brebis : préoccupez-vous de leur nourriture.
      responsory: |-
        R/ Vivante est la Parole de Dieu,
        Plus pénétrante qu’un glaive.

        Fils d’homme, je t’ai fait sentinelle :
        de ma part, tu avertiras mon peuple.

        Fils d’homme, porte-leur ma parole,
        qu’elle habite en eux avec toute sa richesse.

morning:
  evangelicAntiphon:
    common:
      - |-
        Saint Jean est venu du désert pour rendre témoignage à la vérité et préparer les chemins du Seigneur.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Son nom était Jean et il a été en toute vérité une grâce de Dieu pour notre Église de Valence.
