celebration:
  title: Saint Marcellin Champagnat
  subtitle: prêtre
  description: |-
    Marcellin Champagnat est né en 1789 à Marlhes, dans l’actuel département de la Loire. Dès le séminaire il souhaite fonder, au sein de la Société de Marie dont il est l’un des premiers membres, une congrégation de Frères pour l’enseignement des enfants des campagnes et leur évangélisation. Le 2 janvier 1817 il réunit les premiers Petits Frères de Marie ou Frères maristes. Il se lie avec l’abbé François Mazelier, supérieur des Frères de l’Instruction chrétienne de Saint-Paul-Trois-Chateaux qui s’uniront définitivement aux Frères Maristes en 1842, après dix ans de collaborations. Le Père Champagnat, lui, était mort le 6 juin 1840.
  commons:
    - pastors
  color: white

oration:
  - |-
    Père Saint, par ton Fils unique tu nous as révélé le commandement de la loi nouvelle. Et tu nous as donné en saint Marcellin un exemple de la manière de le vivre. Accorde-nous la grâce, en suivant ses enseignements, d’aimer nos frères de tout notre cœur et de conduire le monde à la connaissance de la vérité du Christ. Lui qui.

readings:
  patristicReading:
    - title: DU TESTAMENT SPIRITUEL DE SAINT MARCELLIN CHAMPAGNAT
      content: |-
        Je demande encore au bon Dieu et je souhaite de toute l’affection de mon âme que vous persévériez fidèlement dans le saint exercice de la présence de Dieu, l’âme de la prière, de l’oraison et de toutes les vertus. Que l’humilité et la simplicité soient toujours le caractère des petits Frères de Marie. Qu’une dévotion tendre et filiale vous anime dans tous les temps et dans toutes les circonstances pour notre Bonne Mère. Faites-la aimer partout, autant qu’il vous sera possible. C’est elle qui est la première Supérieure de toute la Société. Joignez à la dévotion à Marie la dévotion au glorieux saint Joseph, son très digne époux ; vous savez qu’il est un de nos premiers patrons.
        Vous faites office d’anges gardiens auprès des enfants qui vous sont confiés ; rendez à ces purs esprits un culte particulier d’amour, de respect et de confiance.
        Mes très chers Frères, soyez fidèles à votre vocation, aimez-la et persévérez-y avec courage. Conservez-vous dans un grand esprit de pauvreté et de détachement. Que l’observance journalière de vos saintes Règles vous préserve de manquer jamais au vœu sacré qui vous lie à la plus belle et la plus délicate des vertus.
        Il y a des peines pour vivre en bon Religieux mais la grâce adoucit tout ; Jésus et Marie vous aideront ; d’ailleurs la vie est bien courte et l’éternité ne finira jamais. Ah ! qu’il est consolant, au moment de paraître devant Dieu, de se rappeler qu’on a vécu sous les auspices de Marie et dans sa Société ! Daigne cette Bonne Mère vous conserver, vous multiplier et vous sanctifier. Que la grâce de Notre Seigneur Jésus-Christ, l’amour de Dieu et la communication du Saint-Esprit soient toujours avec vous. Je vous laisse en confiance dans les Sacrés Cœurs de Jésus et de Marie, en attendant que nous puissions nous réunir tous ensemble dans la bienheureuse éternité. Telle est ma volonté dernière et expresse pour la gloire de Jésus et de Marie.
      responsory: |-
        R/ Tous vous ne faites plus qu’un dans le Christ.

        Vous tous qui avez été baptisés dans le Christ,
        Vous avez revêtu le Christ.

        Revêtez l’homme nouveau, créé saint et juste dans la vérité,
        À l’image de Dieu.

morning:
  evangelicAntiphon:
    common:
      - |-
        Si quelqu’un est dans le Christ, il est une créature nouvelle ; ce qui est ancien est passé, voici la réalité nouvelle. Telle est l’œuvre de Dieu (Alléluia !)

vespers:
  evangelicAntiphon:
    common:
      - |-
        Mon fils, écoute la parole de ton père ; souviens-toi des enseignements de ta mère, garde-les fidèlement dans ton cœur (Alléluia !).
