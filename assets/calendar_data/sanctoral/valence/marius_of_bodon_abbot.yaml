celebration:
  title: Saint Marius
  subtitle: abbé de Bodon
  description: |-
    La vie de saint Marius a été écrite peu après sa mort, vers la fin du VI^e siècle. Elle le fait naître à Orléans. Elle ne nous dit pas comment il est devenu l’abbé du lointain monastère de Bodon, aux confins des diocèses de Gap, Die, Vaison et Sisteron. Monastère probablement fondé par Lérins et peut-être à l’initiative de saint Césaire d’Arles.
    Saint Marius eut parmi ses disciples Lucrèce, qui devint évêque de Die et qui présida à sa sépulture. Les reliques du saint abbé furent transportées plus tard dans l’église de Forcalquier dont il devint le titulaire.
    Le village de Saint-May, près de Rémuzat, maintient le nom et le culte de saint Marius.
  commons:
    - saints-male_religious_abbot
    - pastors
  color: white

oration:
  - |-
    Tu as consacré, Seigneur, saint Marius de Bodon à l’office de la prière, dans la solitude et l’austérité de la vie monastique ; tandis qu’il intercède pour nous, fais que notre vie s’enracine profondément dans la contemplation de ton Fils, Jésus Christ, notre Seigneur. Lui qui.

readings:
  patristicReading:
    - title: LETTRE DE SAINT EUCHER A SAINT HILAIRE DE LÉRINS
      subtitle: La louange du désert
      content: |-
        J’appellerais volontiers le désert le temple sans limite de notre Dieu, car celui que nous savons avec certitude, habiter dans le silence, nous devons croire qu’il se réjouit de la solitude. C’est là qu’il s’est montré le plus souvent à ses saints, et, le lieu s’y prêtant, il n’a pas dédaigné d’y rencontrer l’homme.
        C’est au désert que Moïse, le visage illuminé, voit Dieu. Bien que Dieu ne soit absent de nulle part, il est permis toutefois de penser qu’il daigne plus spécialement visiter la solitude du désert. Où est Dieu ? On peut bien dire qu’il est plus particulièrement aux lieux où on le trouve plus aisément.
        Le possesseur du Paradis, habitant un lieu plein de charmes, se montra incapable d’observer la loi que Dieu lui avait fixée. Plus son séjour était agréable, plus il fut enclin à la chute. L’habitant du Paradis y a rencontré la mort. En sens inverse, qu’il aille au désert celui qui aime la vie.
        Le Seigneur lui-même, notre Sauveur, à peine baptisé, est conduit au désert par l’Esprit. Mais justement, puisque c’est le Saint-Esprit qui l’entraîne au désert, le désert devient le fruit des inspirations de l’Esprit-Saint. C’est là que le Seigneur, nouvel Adam, a repoussé celui qui avait triomphé du premier Adam. O gloire magnifique du désert : le démon vainqueur au Paradis, est vaincu au désert.
        C’est encore au désert que Jésus nourrit les siens. À l’aide de cinq pains et de deux poissons, il nourrit, rassasie, assouvit cinq mille hommes. Comme jadis la manne fut le signe de la bonté divine, c’est toujours au désert que Jésus nourrit les siens.
        Et voici que Jésus notre Seigneur monte sur les sommets les plus reculés d’une montagne. Il n’emmène que trois témoins avec lui. Et là, son visage se met à briller d’un éclat inaccoutumé. Et c’est alors que le plus grand des Apôtres, contemplant l’humanité de Jésus publiquement transfiguré crut pouvoir proclamer la majesté du désert, en s’écriant : « Il nous est bon d’être ici ». Le même Jésus, notre Seigneur, comme il est écrit, se retirait en un lieu désert pour y prier. On doit donc désormais appeler « lieu de la prière » le désert qu’un Dieu en priant Dieu a proclamé destiné à cela. De cet endroit caché, la prière se faisant humble pénètre mieux les Cieux.
        Par une disposition spéciale, Dieu veut que l’habitant du désert soit caché au monde mais ne soit pas caché comme exemple. Le désert est cette cité bâtie sur la montagne qui ne peut être cachée, mais resplendit à travers l’univers entier. Si donc on est dans les ténèbres, on doit s’approcher de cette lumière afin d’y voir clair ; si l’on est en péril, il faut se diriger vers cette cité, pour être à l’abri.
        C’est en vain que frémit l’adversaire, car on est gardé là par le Christ combattant avec nous. En effet c’est bien là que l’époux repose au milieu du jour. Les habitants du désert le contemplent en s’écriant : « Nous avons trouvé celui que notre cœur aime et nous ne le laisserons plus s’éloigner. »
        Nulle terre ne peut se glorifier de sa fertilité en comparaison du désert. Là, les germes se multiplient et produisent au laboureur cent pour un. Là, on trouve le pain vivant descendu du ciel. Là, jaillissent des fontaines, non seulement propres à étancher la soif, mais encore à sauver. Là, se trouve la prairie de l’homme intérieur : c’est uni désert pour le corps, mais un paradis pour l’esprit. Là, se trouve le vin qui donne la vraie joie au cœur de l’homme. Là, brillent la fleur des champs et le lis des vallées.
      responsory: |-
        Dans un lieu perdu,
        ils ont cherché la source où renaît la soif ;
        dans un lieu caché,
        ils suivaient en pauvres le Christ pauvre.

        R/ Tes amis te cherchaient, Seigneur :
        ils nous guident vers toi.

        À nous maintenant de les suivre
        vers cette obscurité
        où nous guettons le reflet de ta gloire.

        Ils ont maintenant rejoint ton visage :
        leur chemin demeure celui que tu nous traces.

morning:
  evangelicAntiphon:
    common:
      - |-
        Il a marché dans la solitude vers la Cité des cieux et la Parole de Dieu était pour lui une manne.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Il a tracé, dans le désert, un chemin sans détour et beaucoup l’ont suivi, pour aller à Dieu dans la simplicité du cœur.
