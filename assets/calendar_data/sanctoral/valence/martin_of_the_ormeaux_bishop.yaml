celebration:
  title: Saint Martin des Ormeaux
  subtitle: évêque du Tricastin
  description: |-
    Évêque du Tricastin à une date inconnue, Martin, devenu lépreux, se serait retiré près de Taulignan dans une solitude qui porte son nom et où l’on voit les restes d’une chapelle qui lui fut dédiée. Les reliques de saint Martin furent transférées d’abord à Alançon, près de la Roche-Saint-Secret, puis en 1398 à Valréas, dans la chapelle des Cordeliers. Elles se trouvent maintenant sur un autel de l’église paroissiale.
    Les fils de Dom Gréa, le théologien de l’Église particulière, dont l’évêque est l’âme et le pivot, ont eu, un temps, leur maison principale à Taulignan. Les filles de saint Dominique, ont pris leur relève et assurent la louange divine, non loin du lieu que saint Martin a sanctifié par son épreuve et sa prière. Mais Taulignan était depuis longtemps « terre canoniale ». Saint Ismidon, évêque de Die l’avait cédée, vers 1105, aux chanoines de Saint-Ruf.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur, notre refuge et notre force, tu as fait resplendir en ton évêque saint Martin la grâce d’une admirable patience dans l’épreuve ; accorde-nous de l’imiter ici-bas et de partager sa gloire dans le ciel. Par Jésus Christ.

readings:
  patristicReading:
    - title: HOMÉLIE DE DOM GRÉA
      content: |-
        Le lierre est une plante rampante ; laissé à lui-même il se traîne à terre, il n’a pas dans son tronc l’énergie de se dresser ; il se traîne jusqu’à ce qu’il trouve une tige ; quand il l’a trouvée il s’y attache, l’entoure, se dresse et s’élève parfois à des hauteurs extraordinaires. On voit quelquefois dans les forêts de vieux arbres tout entourés de lierre jusqu’à leur sommet. Nous sommes comme cela ; notre tige c’est la croix, attachés à la croix nous montons jusqu’au sommet ; notre feuillage verdit au soleil ; si on se détache de la croix c’est fini, on retombe, on ne monte plus, comme le lierre que l’on détache de l’arbre ; il ne peut plus remonter. Tous les petits crampons par lesquels il tenait n’ont plus de force ; il périt. Dieu nous a donné à chacun une croix, la sienne ; non pas celle du prochain ; il n’a pas donné au missionnaire la croix du chartreux, il a donné à chacun la sienne ; si nous nous détachons de cette croix on ne peut plus croître. Rappelez-vous cela et quand le démon vient vous proposer quelque bien, faites attention prenez garde aux illusions.
        Un bon arbre ne peut porter de mauvais fruits et un mauvais arbre ne peut en porter de bons ; on ne cueille pas de raisins sur des épines, ni des figues sur des ronces. Au delà du jardin que vous cultivez, vous ne trouvez pas d’autre jardin, mais le désert avec ses ronces et ses épines. Si vous quittez votre vigne et votre figuier, vous trouvez les ronces et les épines du monde de la nature et du vieil homme.
        Tout arbre qui ne porte pas de fruits sera coupé et jeté au feu. Entre le bon arbre et le mauvais, il y a l’arbre stérile. Notre Seigneur ne parle pas du mauvais, son sort est manifeste. L’arbre stérile sera coupé et jeté au feu, c’est le feu de l’enfer. On l’abattra c’est de la place perdue, il ne produit rien. C’est dommage. On voit quelquefois dans un jardin un bel arbre couvert de belles feuilles mais qui ne produit pas de fruits. Le jardinier compatissant supplie le maître d’attendre encore un peu : je creuserai autour, j’y mettrai du fumier, peut-être donnera-t-il du fruit. Ne faisons pas trop attendre avant de donner du fruit, car on lassera la patience de Dieu. Ne soyons pas des arbres qui fleurissent en automne, le fruit ne mûrira pas. N’attendez pas l’automne de votre vie pour produire des fruits, on voit quelquefois des arbres qui se chargent de fruits à l’approche de l’hiver, le fruit ne peut mûrir, car la saison est trop avancée.
        Creusons autour, mettons du fumier, c’est-à-dire accumulons nos iniquités, devenons humbles, et alors cet arbre qui dans son orgueil ne produisait que des feuilles, humilié de la sorte, produira des fruits. Abattons aussi les branches superflues, taillons, faisons souffrir cet arbre afin de le rendre fructueux ; traitons ainsi notre âme, alors nous porterons du fruit, nous ne serons pas jetés au feu, dans lequel brûlent non seulement ceux qui ont mal fait, mais aussi ceux qui n’auront pas fait le bien. Que Dieu nous garde dans son petit jardin. Dieu a plusieurs jardins dans le grand jardin de l’Église ou de la communion des saints, qui n’est qu’une même chose avec l’Église. Nous avons notre petit jardin, restons-y, ne méritons pas d’en être retranchés ; pour cela soyons humbles. Alors nous porterons du fruit, nous serons l’ornement du jardin et un jour le divin jardinier viendra nous cueillir pour jouir de nous pendant l’éternité.
      responsory: |-
        R/ Maître, nous te suivrons partout, alléluia.

        Pour vous, Christ a souffert,
        vous laissant un exemple
        afin que vous suiviez ses traces.

        Devant vous s’est élancé
        celui qui marche à votre tête.
        Sortez, vous aussi, et portez sa souffrance.

morning:
  evangelicAntiphon:
    common:
      - |-
        Saint Martin a porté dans sa chair la souffrance du Christ, pour son corps qui est l’Église.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Marqué par l’épreuve, saint Martin a trouvé dans la croix de Jésus, l’arbre qui donne la vie véritable.
