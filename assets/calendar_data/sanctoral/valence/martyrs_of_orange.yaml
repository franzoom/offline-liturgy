celebration:
  title: Bienheureuses martyres d’Orange
  description: |-
    Si c’est à Orange que furent martyrisées, entre le 6 et le 26 juillet 1794 les trente-deux religieuses béatifiées par Pie XI le 10 mai 1925, dix-sept d’entre elles étaient nées à Bollène, au diocèse de Saint-Paul-Trois-Châteaux et vingt-trois y étaient religieuses. Parmi elles : Marie-Anne Lambert, de Pierrelatte, ursuline ; Rosalie-Clotilde Bès, de Baume-de-Transit ; Marie-Anne Béguin et sa nièce Marie Cluse, l’une et l’autre de Bouvante, étaient des sacramentines. Anne Cartier, de Livron et Anne-Marie Depeyre, de Tulette étaient des ursulines, la première à Pont-Saint-Esprit, la seconde à Carpentras.
    Treize des futures martyres étaient des sacramentines du couvent de Bollène ; seize, des ursulines, neuf à Bollène, quatre à Pont-Saint-Esprit et trois autres, venues de Pernes, Carpentras et Sisteron. Enfin deux cisterciennes d’Avignon et une bénédictine de Caderousse, elle sera la première immolée.
    Chassées de leurs couvents, vingt-neuf de ces religieuses réussirent à se regrouper à Bollène et, pendant dix-huit mois, partagèrent une vie de prière et de totale pauvreté. Ayant refusé le serment de liberté-égalité, elles furent déclarées en état d’arrestation le Jeudi-Saint, 17 avril. Le 1^er mai elles étaient emprisonnées à Orange. Deux sacramentines, une ursuline, Marie-Anne Lambert et la bénédictine de Caderousse vinrent partager leur détention. Le 19 juin le tribunal révolutionnaire se mit en place ; à sa suppression, le 5 août suivant, trois cent trente-deux personnes avaient été guillotinées dont trente-six prêtres et nos trente-deux religieuses.
    Les corps des martyres, mêlés à d’autres, furent jetés dans des fosses communes, creusées sur les bords de l’Aygues, à quatre kilomètres de la ville. Sur leur emplacement on a élevé, en 1832, une chapelle qui est un lieu de pèlerinage.
  commons:
    - martyrs_female_virgin
    - virgins_multiple
  color: red

oration:
  - |-
    Seigneur, tu as couronné par la victoire du martyre la fidélité de tes servantes, les bienheureuses martyres d’Orange ; accorde-nous, à leur exemple et à leur prière, de garder jusqu’à la mort les promesses de notre baptême. Par Jésus Christ.

readings:
  patristicReading:
    - title: RÉCIT DE LA PASSION DES MARTYRES PAR UN TÉMOIN
      content: |-
        Le 2 mai 1794, quarante-deux religieuses de Bollène ayant été transférées à Orange, pour y être incarcérées, commencèrent à se préparer à leur grand sacrifice, par l’exercice de toutes les vertus religieuses, par une prière continuelle et un profond silence, ne prenant que peu de nourriture et de repos. Leur conduite édifiante, était digne de servir de modèle, nous devons en conserver avec respect la mémoire.
        Leurs exercices de piété commençaient à 5 heures précises du matin ; savoir : une heure d’oraison en communauté, l’office et la récitation de l’exercice de la sainte messe. À 8 heures, on se rassemblait encore, et l’on récitait les litanies des saints, la préparation à la mort, les prières pour la confession en général, la communion spirituelle en viatique, et l’extrême onction. On renouvelait les vœux du baptême, de la confirmation et de la sainte religion. Quelques-unes, dans les transports de la ferveur, s’écriaient : Oui, je suis religieuse, et j’ai une grande consolation de l’être ; je vous remercie, Seigneur, de m’avoir accordé cette grâce.
        À 9 heures, c’était le moment de l’appel, et chacune se préparait à marcher au tribunal avec joie. Celles qui restaient se mettaient en prière pour obtenir les lumières de l’Esprit-Saint au moment du combat. On implorait le secours de la sainte Vierge par la récitation de mille Ave Maria ; on répétait des litanies sans nombre ; on faisait des prières sur les paroles de Jésus-Christ en croix ; enfin il n’y avait presque point d’interruption jusqu’à 5 heures du soir, temps où l’on disait l’office. Lorsque le tambour annonçait que les victimes étaient conduites au supplice, on récitait les prières de la recommandation de l’âme. Après 6 heures, on se félicitait réciproquement, celles surtout qui étaient de la communauté dont les sœurs venaient de monter au ciel, et on récitait le Laudate avec une jouissance toute céleste. Chacune des victimes de ce troupeau d’élite tâchait de se préparer à son sacrifice par la plus grande pureté de conscience. Quoique de différentes communautés, elles vivaient en commun comme les premiers chrétiens. Elles avaient mêlé leur linge, leurs provisions, leurs assignats. Parmi les quarante-deux religieuses qui s’étaient vouées volontairement à la mort, par le refus de prêter le serment de la liberté et de l’égalité, le divin Époux en choisit trente-deux. Les dix qui sont restées gémissent de n’avoir pu suivre leurs compagnes à la salle des noces. Les juges en ont absous cinq pour contenter le peuple ; et le tribunal ayant été cassé, les cinq dernières n’ont point été jugées.
        L’allégresse que l’on voyait peinte sur le visage de ces saintes filles après leur jugement, encourageait les autres condamnés, et leur faisait désirer la mort. Elles ont une fois passé une demi-heure en oraison, les bras en croix, pour obtenir les forces au père d’une famille nombreuse, qui se livrait au désespoir ; et elles eurent la consolation de l’accompagner au supplice dans les sentiments les plus chrétiens.
        « Nous n’avons pu dire nos vêpres, observèrent quelques-unes, nous les chanterons au ciel » ; « oh, c’est trop beau, s’écriait la sœur des Anges Rocher, peut-être que ceci ne sera pas vrai ». La sœur Marie-Rose Laye, tomba la veille de sa mort dans une grande tristesse : « Je crains que Dieu ne me juge pas digne du martyre ». Deux sœurs avaient prié la Sainte Vierge pour mourir le samedi, ou un jour consacré par une de ses fêtes ; elles furent immolées le jour de Notre-Dame du Mont-Carmel. L’une d’elle disait : « Nous avons plus d’obligations à nos juges, qu’à nos pères et mères ; puisque ceux-ci ne nous ont donné qu’une vie temporelle, au lieu que nos juges nous procurent une vie éternelle. L’amour divin dont son cœur était embrasé, la faisait s’écrier : « O quel bonheur. Je suis bientôt au ciel, je ne puis soutenir les sentiments de ma joie. » La sœur sainte Françoise (de Tulette) disait la veille de son martyre : « Quel bonheur, nous allons voir notre Époux. » La sœur sainte Pélagie (de la Baume-de-Transit), après son jugement, sortit de sa poche une boîte de dragées, qu’elle distribua à toutes les condamnées comme elle : « Ce sont les bonbons de mes noces » ; et chacune les mangeait avec la joie la plus pure.
      responsory: |-
        R/ Heureux les invités aux noces de l’Agneau.

        Vers la ténèbre lumineuse vos regards sont levés,
        et Dieu qui vous attend comblera seul votre quête.

        Pour une perle sans prix, vous avez tout quitté,
        les mains ouvertes et libres en offrande.

        À votre humble fierté, l’Église, joyeuse,
        reconnaît son visage, sa grâce de fiancée.

        À travers l’amour qui brûle en vous,
        servantes du Seigneur,
        Le cœur de Dieu nous presse
        de l’aimer sans partage.

morning:
  evangelicAntiphon:
    common:
      - |-
        Réunies par le même martyre, elles ont tressé pour Dieu une même couronne de fleurs variées, aux multiples couleurs.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Elles sont allées avec joie vers la mort comme à la rencontre du Christ, comme une fiancée à l’heure de ses noces.
