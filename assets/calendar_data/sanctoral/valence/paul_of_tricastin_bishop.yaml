celebration:
  title: Saint Paul
  subtitle: évêque du Tricastin
  description: |-
    Le fait pour l’évêque Paul, à défaut de documents historiques certains, d’avoir donné son nom à la cité épiscopale du Tricastin et d’être devenu le patron de ce diocèse, implique la certitude d’un épiscopat important. Sans doute a-t-il été « le défenseur de la cité », comme tant d’autres évêques, à une époque où les invasions semaient la terreur parmi la population.
    Selon la %Vita sancti Pauli% il serait mort en Avignon un 1^er février mais l’année demeure incertaine : 412 ou, peut-être au VI^e siècle.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Tu as voulu, Seigneur, que l’évêque saint Paul sanctifie l’Église du Tricastin et lui donne son nom ; fais qu’elle soit toujours plus digne de ce patronage par une vie chrétienne fidèle et généreuse. Par Jésus Christ.

readings:
  patristicReading:
    - title: INSTRUCTION DU BIENHEUREUX MARCELLIN CHAMPAGNAT
      subtitle: Les trois demeures du Seigneur
      content: |-
        Soyez les assidus de Jésus dans sa crèche, sur le Calvaire et à l’autel. Parce que ces trois lieux sont les trois grandes fontaines de la grâce et que c’est là surtout que le Seigneur la répand abondamment sur ses élus. Écoutez le prophète Isaïe nous crier : « Allez puiser aux fontaines du Sauveur ; là vous trouverez toutes les grâces. »
        Oui, à ces fontaines salutaires, vous trouverez la grâce de la miséricorde, dans laquelle vous pourrez laver toutes les souillures de vos péchés ; vous trouverez la grâce de la paix de l’âme, des consolations divines, de la sainte joie, de la bonne volonté, de la force et du saint courage pour vous vaincre, éviter le péché et combattre vos défauts ; vous trouverez la grâce des lumières divines qui vous feront connaître la grandeur de Dieu, ses souverains droits à votre service, l’excellence de votre vocation, le prix de votre âme, l’estime que vous devez faire des choses saintes ; vous trouverez aussi la grâce de la dévotion et de la solide piété.
        Là vous trouverez surtout l’amour de Jésus Christ, qui est la plus grande de toutes les grâces. Dieu est charité, dit saint Jean. Oui, Dieu est charité partout, mais particulièrement à la crèche, à la croix et à l’autel ; c’est-à-dire que c’est surtout dans ces endroits que paraît et se manifeste son amour infini ; c’est surtout dans ces trois endroits qu’il embrase de sa charité le cœur des saints ; c’est dans ces endroits que notre pauvre cœur peut mieux comprendre et sentir combien il nous aime. Je suis venu apporter le feu sur la terre, dit Jésus-Christ, et mon plus grand désir n’est-il pas qu’il s’allume et flambe dans le cœur de tous ?
        Les riches de ce monde, les grands de la terre, ont plusieurs maisons, villas ou châteaux, qu’ils habitent successivement, selon les saisons de l’année et pour les satisfactions naturelles. Les saints, les amis de Jésus-Christ ont aussi plusieurs demeures, mais ils affectionnent particulièrement trois logis : celui de l’étable de Bethléem, dans lequel ils se renferment pour méditer l’ineffable mystère de l’Incarnation et pour contempler l’Enfant-Jésus ; celui du Calvaire, où ils passent le carême et les vendredis, s’entretenant avec le Crucifié, méditant ses souffrances, ses opprobres, et plus encore l’amour immense de son cœur. « Oh, qu’il fait bon ici, s’écriait saint Bonaventure, lorsque son esprit et son cœur se retiraient au Calvaire, tout près de la croix du Sauveur ; je vais établir en Jésus crucifié trois demeures : une dans ses mains, l’autre dans ses pieds et la troisième en son cœur adorable ; là n’obtiendrais-je pas ce que je voudrais ? »
        Enfin le plus fréquenté des logis des saints est l’autel, où ils se retirent tous les jours pour aimer et adorer le Seigneur, lui tenir compagnie, lui exposer leurs besoins. Saint Elzéar écrivait à sainte Delphine, son épouse : « Si vous me cherchez, si vous désirez me rencontrer, vous me trouverez dans le cœur du Sauveur, au Saint-Sacrement ; c’est là que je demeure habituellement. »
        Ces trois cellules se transforment pour les saints en trois foyers où leur âme se consume dans les feux de la divine charité ; c’est dans ces brasiers qu’ils deviennent comme des anges sur terre, recevant force et secours pour s’avancer continuellement de vertu en vertu jusqu’aux sommets.
      responsory: |-
        R/ Dans la maison du Père,
        il y a beaucoup de demeures,
        là où je suis, vous serez, vous aussi.

        Seigneur, j’aime la maison que tu habites,
        le lieu où demeure ta gloire.

        Heureux les habitants de ta maison,
        ils pourront te chanter encore.

morning:
  evangelicAntiphon:
    common:
      - |-
        Saint Paul a fleuri dans la maison de Dieu pour la joie de son peuple et la bénédiction de la cité.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Sa prière a été le rempart de son peuple, et son Église, à l’image de la Maison du Père, aux multiples demeures.
