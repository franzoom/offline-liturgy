celebration:
  title: Saints Pétrone et Marcel
  subtitle: évêques de Die
  description: |-
    La tradition fait naître en Avignon, dans une famille noble, les deux frères Pétrone et Marcel. L’aîné, Pétrone, d’abord moine à Lérins, devint évêque de Die vers 453 et serait mort dix ans plus tard, un dix janvier. Son frère Marcel, dont il avait dirigé l’éducation et qui était devenu son diacre, sera son successeur comme évêque de Die. Ce choix déplut à certains et de même son sacre par saint Mamert de Vienne, en dépit des droits de l’évêque d’Arles, le métropolitain de Die. Marcel connut aussi l’exil, imposé sans doute par les tenants de l’arianisme. On place sa mort en 510 à Barjols (Var) où il était de passage pour avoir entrepris un pèlerinage à Rome. Mais son corps fut enseveli à Die. Dans son livre %À la gloire des confesseurs%, saint Grégoire de Tours écrit : « Marcel, évêque de Die, fut encore d’une sainteté éminente ; la lampe, placée devant son tombeau, brûle longtemps et l’huile qu’elle contient a reçu de Dieu une merveilleuse puissance pour guérir les malades. » Dans la vie de saint Robert, abbé de la Chaise-Dieu, saint Marcel est cité parmi les saints que le démon redoute le plus.
    Saint Ulphin, évêque de Die au IX^e siècle, a écrit la vie de saint Marcel et une porte de la ville a reçu son nom, ce qui témoigne de sa popularité.
  commons:
    - pastors_multiple
  color: white

oration:
  - |-
    Tu as donné, Seigneur, aux deux frères Pétrone et Marcel de te servir avec une égale ferveur comme évêques de Die ; puisqu’ils ont gardé ton Église dans l’unité de la foi et de la charité : que leur intercession nous obtienne la fidélité que tu aimes. Par Jésus Christ.

readings:
  patristicReading:
    - title: DU COMMONITORIUM DE SAINT VINCENT DE LÉRINS
      subtitle: Garder intact le talent de la foi
      content: |-
        Le vrai et authentique catholique est celui qui aime la vérité de Dieu, l’Église, le corps du Christ ; celui qui ne met rien au-dessus de la religion ni de la foi catholique, ni l’autorité d’un homme, ni l’amour, ni le génie, ni l’éloquence, ni la philosophie ; celui qui, méprisant ces choses, se fixe solidement dans une foi et y demeure stable, ne voulant retenir et croire que ce que l’Église a toujours et universellement admis. Il sait, en effet, que toute doctrine nouvelle, jamais encore entendue, professée par un seul homme contre l’avis de tous les saints et de tous les chrétiens orthodoxes, n’a rien à voir avec la vraie foi ; elle n’est qu’une tentation, comme le dit nettement l’apôtre Paul : Il faut bien qu’il y ait des hérésies afin que se manifestent les hommes de vertu éprouvée ; ce qui veut dire : les fauteurs d’hérésie ne sont pas immédiatement extirpés par Dieu, afin que les chrétiens solides se révèlent parmi vous et que l’on voie si chacun est constant, fidèle et ferme dans son attachement à la foi catholique.
        De fait, dès que quelque nouveauté bouillonne, aussitôt les grains les plus lourds se séparent de la paille légère ; tous ceux que leur poids ne retient pas sont projetés hors de l’aire ; les uns s’envolent aussitôt, les autres, bouleversés, craignant de périr, n’osent plus revenir. Ils sont blessés et plus morts que vifs, car ils ont bu une dose de ce poison qu’on ne peut plus éliminer et qui, s’il ne tue pas sur le coup, ne permet cependant plus de vivre. Quelle pitoyable situation ! Quelles passions brûlantes, quels tourbillons les assaillent. Tantôt le vent les pousse ; ils se laissent emporter par l’erreur. Tantôt ils se replient sur eux-mêmes, comme des corps recroquevillés que les vagues rejettent sur le rivage. Parfois, avec une audace bien téméraire, ils semblent approuver l’incertain ; mais à d’autres moments sous l’effet d’une peur irraisonnée, ils s’épouvantent des vérités les plus sûres. Ils ne savent plus ou aller, d’où revenir, ce qu’ils souhaitent ni ce qu’ils évitent ; ce qu’ils affirment ni ce qu’ils refusent. Ah, s’ils savaient au moins que ces doutes et que cette douleur d’un cœur hésitant sont les remèdes que leur réserve la pitié de Dieu. Loin du port si tranquille de la foi catholique, s’ils sont secoués, frappés, presque noyés par les tourments de leurs pensées, c’est pour qu’ils serrent et abaissent les voiles tendues au vent du large, tendues au vent de la nouveauté malsaine, et qu’ils reviennent et demeurent dans le hâvre sûr de leur mère tranquille et bonne ; c’est pour que, arrivés à bon port, ils rejettent les flots troubles de l’erreur et qu’ils boivent à la source d’eau vive et jaillissante. Qu’ils oublient vite ce qu’ils ont appris de mauvais ; qu’ils retiennent de tout le dogme catholique ce que l’intelligence peut comprendre, et qu’ils croient ce qu’ils ne peuvent comprendre.
        Conserve donc inviolé et intact ce talent de la foi catholique. Ce qui t’a été confié, garde-le chez toi et transmets-le. Tu as reçu de l’or, c’est de l’or qu’il faut rendre. Je n’admets pas que tu substitues impudemment une chose à une autre, du plomb ou du bronze à de l’or. Je ne veux ni simili ni plaqué, mais de l’or pur. O Timothée, ô prêtre, interprète des Écritures, docteur, puisque la grâce de Dieu t’a donné le talent, l’expérience et la doctrine, taille les pierres précieuses du dogme divin, groupe-les fidèlement, orne-les avec sagesse ; ajoutes-y de la splendeur, de la grâce et de la beauté. Par tes explications rend plus clair ce que l’on croyait obscur. Grâce à toi les générations futures se réjouiront de saisir ce que leurs pères vénéraient sans comprendre. Mais attention. Enseigne seulement ce que tu as appris ; fais-le d’une manière nouvelle, mais garde-toi d’y introduire des nouveautés.
      responsory: |-
        R/ Dieu nous a donné la vie avec le Christ,

        Poursuivez votre route dans le Christ,
        Jésus, le Seigneur, tel que vous l’avez reçu.

        Soyez enracinés et fondés en lui,
        affermis dans la foi, débordants d’action de grâce.

        En lui habite toute la plénitude de la divinité,
        en lui vous vous trouvez pleinement comblés.

morning:
  evangelicAntiphon:
    common:
      - |-
        Pareils aux deux flambeaux qui brillaient dans le Temple, leur lumière a éclairé l’Église et guide encore nos pas au chemin de la paix.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Comme deux oliviers plantés dans les parvis du Seigneur, ils ont répandu la bonne odeur du Christ et donné un fruit qui demeure.
