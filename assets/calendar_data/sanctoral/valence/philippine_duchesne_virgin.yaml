celebration:
  title: Sainte Philippine Duchesne
  subtitle: vierge
  description: |-
    Philippine Duchesne est née à Grenoble en 1769 d’une famille implantée à Romans et à Grane. La Révolution - où son père tient une place importante - l’arrache au couvent de la Visitation. C’est à Grane quelle affermit sa vocation. En pleine Terreur elle fonde une petite communauté qui visite les prisonniers et les pauvres. En 1804 elle entre dans la Société du Sacré-Cœur de Madeleine-Sophie Barat. En 1817 elle part en mission en Floride et en Louisiane. Elle fonde une école où enfants noirs, blancs et métis sont éduqués ensemble, en plein Sud esclavagiste. D’autres fondations suivent. Son tempérament assez fort lui vaut d’être relevée du supériorat. À 72 ans elle part en mission chez les Indiens Potowatomies que le gouvernement fédéral vient de déporter. C’était le but de sa vie. Trop âgée pour apprendre la langue c’est par la prière qu’elle témoigne. Les Indiens l’appellent : « la-femme-qui-prie-toujours ». Sa santé donnant des inquiétudes on la rappelle en Louisiane. Elle vivra encore dix ans n’oubliant jamais « ses » Indiens. Elle meurt le 18 novembre 1852.
  commons:
    - virgins
  color: white

oration:
  - |-
    Seigneur Dieu, tu as rempli de charité et d’ardeur missionnaire le cœur de sainte Philippine Duchesne, et tu lui as communiqué le désir de te faire connaître parmi tous les peuples ; accorde-nous de suivre ses traces et d’être remplis du même amour et du même zèle pour étendre ton Royaume jusqu’aux extrémités de la terre. Par Jésus Christ.

readings:
  patristicReading:
    - title: EXTRAITS DE DEUX LETTRES DE SAINTE PHILIPPINE DUCHESNE
      content: |-
        Il m’est donc permis de me livrer à la plus douce des espérances. Mes vœux s’accompliront un jour. Dès maintenant je puis tendre par mes désirs et mes prières vers des contrées où je pourrai enfin rendre quelque service à Notre-Seigneur, et n’être riche que de lui. Quel aiguillon puissant pour m’exciter à me réformer, que la crainte de me rendre indigne de ma haute destinée. Avec quel respect mêlé d’attendrissement entendrais-je ces paroles de la bouche de ma tendre mère : je vous envoie parmi les loups. Oh ! Si vous pouviez ajouter comme un agneau ! Avec quel transport prendrais-je sa vénérable main et la porterais-je sur ma tête pour être bénie de cette sorte : Ab illo benedicaris in cujus honore cremaberis !
        Je suis souvent en esprit au moment de la décision, et plus souvent encore dans les lieux où elle me permettrait d’aller. Qu’il me tarde de savoir ce que vous aurez à me dire ! Je me précipite à genoux pour l’entendre.
        Quel plaisir et quel bien m’a fait votre lettre, il la fallait pour amollir mon âme plus insensible qu’un rocher depuis trois semaines. Elle s’est fondue comme la cire auprès du feu en me nourrissant des aliments que vous lui présentiez ; mes yeux n’ont plus été arides et mon cœur s’est livré à une douce joie, il l’a savourée toute la nuit, car la lettre est arrivée avant la veillée du Jeudi-Saint. O bénite nuit ! où j’ai cru une seconde fois être exaucée. Je le crois, ma bonne Mère, à la joie pure que je goûte et à la ferme espérance que je conçois ; O si c’était avant la fin de l’année ; je m’en suis presque flattée.
        Toute la nuit j’ai été dans le nouveau continent, mais j’ai voyagé en bonne compagnie. D’abord j’avais précieusement recueilli au jardin, au prétoire, au calvaire tout le sang de Jésus. Je m’étais emparée de lui au Saint-Sacrement, je le serrais étroitement et je portais partout mon trésor pour le répandre sans crainte de l’épuiser. Saint François-Xavier s’intéressait encore à faire fructifier cette précieuse semence et il se tenait au pied du trône de Dieu pour demander l’ouverture de nouvelles terres à éclairer. Saint François-Régis était le pilote des voyageurs, et bien d’autres saints encore, jaloux de la gloire de Dieu. Enfin tout allait au mieux ; je n’ai pu insinuer dans mon cœur aucune tristesse même sainte, parce qu’il me semblait qu’une nouvelle application allait se faire des mérites de Jésus.
        Les douze heures de la nuit sont bien vite passées sans fatigue quoiqu’à genoux et la veille je ne croyais pas pouvoir tenir une heure. J’avais bien à faire aussi avec tous mes sacrifices à offrir : une mère... et quelle mère ! des sœurs, des parents, une montagne, Sainte-Marie-d’en-Haut, et puis je me trouvais seule avec Jésus seul ou avec des enfants tout noirs, tout grossiers et j’étais plus contente au milieu de ma petite cour que tous les potentats du monde. Bonne Mère, quand vous me direz : ecce ego mitto te, je vous répondrai vite : vadam...
        Je vais tâcher de me rendre triste le reste du Vendredi-Saint ; mais j’y ai peu de disposition ; je suis montée à l’espérance.
      responsory: |-
        R/ Mon âme attend plus sûrement le Seigneur
        qu’un veilleur n’attend l’aurore.

        Priez en tout temps dans l’Esprit,
        dans une vigilance inlassable.

        En tout temps offrez à Dieu
        un sacrifice de louange.

morning:
  evangelicAntiphon:
    common:
      - |-
        À l’école du Christ, doux et humble de cœur, elle a été, à la face du monde, le témoin de la tendresse de Dieu.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Servante fidèle du Seigneur, elle a porté au loin la lumière de sa parole et l’appel de son amour.
