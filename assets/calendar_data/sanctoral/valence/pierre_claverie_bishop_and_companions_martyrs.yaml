celebration:
  title: Bienheureux Pierre Claverie et ses compagnons
  subtitle: évêque, religieux et martyrs
  description: |-
    La date de la commémoration des Martyrs d’Algérie est celle de l’assassinat des deux premiers d’entre eux : le Frère Henri Vergès, Frère mariste, et la Sœur Paul-Hélène Saint-Raymond, le 8 mai 1994. Le Frère Henri avait dirigé l’Institution des Maristes à Bourg-de-Péage en 1968. Sont liés à notre diocèse, les sept moines de la Trappe de Thibirine, fille d’Aiguebelle, parmi eux le Frère Luc Dochier, né à Bourg-de-Péage et le Frère Christophe Lebreton dont l’église d’Ancône honore la mémoire. De 1994 à 1996, six religieuses et treize religieux tomberont, témoins du Christ et de la fidélité au peuple algérien. Le dernier tombé étant l’évêque d’Oran, Pierre Claverie, dominicain, assassiné avec le jeune musulman Mohamed Boucheki.
  commons:
    - martyrs
    - saints-male_religious
  color: red

oration:
  - |-
    Seigneur notre Dieu, qui as donné au bienheureux évêque Pierre et à ses compagnons martyrs la grâce de communier à la passion du Christ en étant fidèles à l’Évangile jusqu’à la mort, accorde-nous par leur intercession, d’être d’ardents témoins du pardon et de la paix. Par Jésus Christ.

readings:
  patristicReading:
    - title: DE L’HOMÉLIE DU BIENHEUREUX PIERRE CLAVERIE, ÉVÊQUE ET MARTYR
      content: |-
        Depuis le drame algérien, on m’a souvent demandé : « Que faites-vous là-bas ? Pourquoi est-ce que vous restez ? Secouez la poussière de vos sandales ! Rentrez chez vous§ ». 3Chez nous… » Où sommes-nous chez nous ? … Nous sommes là-bas à cause de ce Messie crucifié. À cause de rien d’autre et de personne d’autre ! Nous n’avons pas d’intérêt à sauver, aucune influence à maintenir. Nous ne sommes pas poussés par je ne sais quelle perversion masochiste ou suicidaire. Nous n’avons aucun pouvoir, mais nous sommes là au chevet d’un ami, d’un frère malade, en silence, en lui serrant la main, en lui épongeant le front. À cause de Jésus, parce que c’est lui qui souffre là, dans cette violence qui n’épargne personne, crucifié à nouveau dans la chair de milliers d’innocents. Comme Marie, comme saint Jean, nous sommes là, au pied de la Croix où Jésus meurt, abandonné des siens, raillé par la foule. Est-ce que ce n’est pas l’essentiel pour un chrétien d’être là, dans un lieu de souffrances, dans les lieux de déréliction et d’abandon ?
        Où serait l’Église de Jésus-Christ, elle-même Corps du Christ, si elle n’était pas là d’abord ? Je crois qu’elle meurt de n’être pas assez proche de la Croix de Jésus. Si paradoxal que cela puisse vous paraître, et saint Paul le montre bien, la force, la vitalité, l’espérance, la fécondité chrétienne, la fécondité de l’Église viennent de là. Pas d’ailleurs ni autrement. Tout, tout le reste, n’est que poudre aux yeux, illusion mondaine. Elle se trompe, l’Église, elle trompe le monde lorsqu’elle se situe comme une puissance parmi d’autres, comme une organisation, même humanitaire ou comme un mouvement évangélique à grand spectacle. Elle peut briller, elle ne brûle pas du feu de l’amour de Dieu, %fort comme la mort% dit le Cantique des Cantiques. Car il s’agit bien d’amour ici, d’amour d’abord, d’amour seul. Une passion dont Jésus nous a donné le goût et tracé le chemin : %Il n’y a pas de plus grand amour que de donner sa vie pour ceux qu’on aime% . Donner sa vie. Cela n’est pas réservé aux martyrs ou du moins, nous sommes peut-être appelés à devenir des martyrs témoins du don gratuit de l’amour, du don gratuit de sa vie. Ce don nous vient de la grâce de Dieu donnée en Jésus-Christ. Donner sa vie c’est cela et rien d’autre ! Dans chaque décision, dans chaque acte, donner concrètement quelque chose de soi-même : son temps, son sourire, son amitié, son savoir-faire, sa présence, même silencieuse, même impuissante, son attention, son soutien matériel, moral et spirituel, sa main tendue… sans calcul, sans réserve, sans peur de se perdre.
      responsory: |-
        R/ À toi seul, Fils du vrai Dieu,
        la gloire et la louange.

        Qui se déclarera pour moi devant les hommes,
        je me déclarerai pour lui devant mon Père.

        Qui aura tenu bon jusqu’à la fin,
        je lui donnerai la vie éternelle.
    - title: TESTAMENT SPIRITUEL DU BIENHEUREUX CHRISTIAN DE CHERGE, PRÊTRE ET MARTYR
      content: |-
        Quand un « A - Dieu » s’envisage… S’il m’arrivait un jour – et ça pourrait être aujourd’hui-d’être victime du terrorisme qui semble vouloir englober maintenant tous les étrangers vivant en Algérie, j’aimerais que ma communauté, mon Église, ma famille, se souviennent que ma vie était « donnée » à Dieu et à ce pays. Qu’ils acceptent que le Maître Unique de toute vie ne saurait être étranger à ce départ brutal. Qu’ils prient pour moi : comment serais-je trouvé digne d’une telle offrande, Qu’ils sachent associer cette mort à tant d’autres morts violentes, laissées dans l’indifférence et l’anonymat.
        Ma vie n’a pas plus de prix qu’une autre. Elle n’en a pas moins non plus. En tout cas, elle n’a pas l’innocence de l’enfance. J’ai suffisamment vécu pour me savoir complice du mal qui semble, hélas, prévaloir dans le monde et même de celui-là qui me frapperait aveuglément. J’aimerais, le moment venu avoir ce laps de lucidité qui me permettrait de solliciter le pardon de Dieu et celui de mes frères en humanité, en même temps que pardonner de tout cœur à qui m’aurait atteint. Je ne saurais souhaiter une telle mort. Il me paraît important de le professer. Je ne vois pas, en effet, comment je pourrai me réjouir que ce peuple que j’aime soit indistinctement accusé de mon meurtre. C’est trop cher payer ce qu’on appellera, peut-être, la « grâce du martyre » que de la devoir à un Algérien quel qu’il soit, surtout s’il dit agir en fidélité à ce qu’il croit être l’Islam. Je sais le mépris dont on a pu entourer les Algériens pris globalement. Je sais aussi les caricatures de l’Islam qu’encourage un certain islamisme. Il est trop facile de se donner bonne conscience en identifiant cette voie religieuse avec les intégrismes de ses extrémistes. L’Algérie et l’Islam, pour moi, c’est autre chose, c’est un corps et une âme. Je l’ai assez proclamé, je crois, au vu et au su de ce que j’en ai reçu, y trouvant si souvent ce droit fil conducteur de l’Évangile, appris aux genoux de ma mère, ma toute première Église. Précisément en Algérie, et, déjà, dans le respect des croyants musulmans. Ma mort, évidemment, paraîtra donner raison à ceux qui m’ont rapidement traité de naïf, ou d’idéaliste : « Qu’il dise maintenant ce qu’il pense ! ». Mais ceux-là doivent savoir que sera enfin libérée ma plus lancinante curiosité. Voici que je pourrai, s’il plaît à Dieu, plonger mon regard dans celui du Père pour contempler avec lui ses enfants de l’Islam tels qu’il les voit, tout illuminés de la gloire du Christ, fruits de sa Passion, investis par le Don de l’Esprit dont la joie secrète sera toujours d’établir la communion et de rétablir la ressemblance en jouant avec les différences.
        Cette vie perdue, totalement mienne et totalement leur, je rends grâce à Dieu qui semble l’avoir voulue tout entière pour cette « joie-là », envers et malgré tout. Dans ce « merci » où tout est dit, désormais de ma vie, je vous inclus bien sûr, amis d’hier et d’aujourd’hui, et vous ô mes amis d’ici, aux côté de ma mère et de mon père, de mes sœurs et de mes frères et des leurs, centuple accordé comme il était promis ! Et toi aussi, l’ami de la dernière minute, qui n’aura pas su ce que tu faisais. Oui, pour toi aussi je le veux ce « merci », et cet « A – Dieu » envisagé de toi. Et qu’il nous soit donné de nous retrouver, larrons heureux, en paradis, s’il plaît à Dieu, notre Père à tous deux. Amen !
      responsory: |-
        R/ À toi seul, Fils du vrai Dieu,
        la gloire et la louange.

        Qui se déclarera pour moi devant les hommes,
        je me déclarerai pour lui devant mon Père.

        Qui aura tenu bon jusqu’à la fin,
        je lui donnerai la vie éternelle.
    - title: DES CARNETS DU FRÈRE HENRI VERGES
      content: |-
        Ma présence en tel lieu, en tel temps, n’est nécessaire que dans la mesure où Dieu l’a voulue pour moi et pour mes frères. Comme Jésus, être totalement disponible à la volonté du Père. Être la petite fleur qui s’épanouit où Dieu l’a plantée, transplantée sur la terre des hommes, mais toujours irriguée par l’eau vive de l’Esprit. En tout et toujours être oui et dans le OUI de Jésus, comme la Vierge Marie…
        Pourquoi ici ?
        Parce que Dieu m’y a envoyé.
        Parce qu’il y a un dessein mystérieux de Dieu sur le peuple de l’Islam, un temple de sa présence où il m’invite à entrer, une ouverture réciproque à favoriser, un dialogue entre croyants à promouvoir, à développer. Nos cheminements en Dieu ne peuvent que converger.
        Parce que Dieu envoie son Église à tous les peuples de l’univers : simple présence qui se purifie, qui purifie, qui se laisse interpeller par la Parole et qui interpelle par la Parole, qui se libère et qui libère, qui chemine avec, qui laisse à Dieu le choix des moments pour une révélation plus explicite de l’Évangile de son Fils cheminant avec tout homme en ce monde.
        Pour permettre à Jésus Eucharistie d’être présent en ce point du globe. Je me dois d’être adoration, présence auprès de Lui au nom de ce peuple, point de convergence de tout ce qui se vit autour de moi ici et maintenant.
        Parce que ma vocation mariste est particulièrement adaptée à cette présence enfouie, d’humble service, d’ancrage des fondations sur quoi va reposer l’avenir, dans ce pays jeune – nous qui sommes pour les jeunes – avec Marie, elle aussi présente au cœur de l’Islam.
      responsory: |-
        R/ À toi seul, Fils du vrai Dieu,
        la gloire et la louange.

        Qui se déclarera pour moi devant les hommes,
        je me déclarerai pour lui devant mon Père.

        Qui aura tenu bon jusqu’à la fin,
