celebration:
  title: Bienheureux Pierre Vigne
  subtitle: prêtre
  description: |-
    Né à Privas le 20 août 1670, Pierre Vigne est ordonné prêtre en 1694. Il décide de se consacrer à l’évangélisation des campagnes délaissées. Après un temps dans la Compagnie de la Mission (Lazaristes), il en sort, refuse la cure de Privas en 1707 pour rester fidèle à sa vocation missionnaire. En 1723 il se lie à l’Institut des Prêtres missionnaires du Saint-Sacrement de Valence dont il est proche depuis douze ans. En 1745 il a fondé la Congrégation des Sœurs du Saint-Sacrement, à Boucieu-le-Roi, alors du diocèse de Valence. Il mène plusieurs missions dans l’actuel territoire drômois. Il meurt le 8 juillet 1740 tandis qu’il est en mission à Rencurel dans le Vercors.
  commons:
    - pastors
  color: white

oration:
  - |-
    Seigneur, tu as fait du bienheureux Pierre Vigne, prêtre-missionnaire, un ardent prédicateur de l’amour du Christ souffrant sur la croix et présent dans le sacrement de l’Eucharistie. Accorde-nous par son intercession, à nous qui contemplons ces mystères, d’annoncer aux pauvres la Bonne Nouvelle du salut. Par Jésus Christ.

readings:
  patristicReading:
    - title: EXTRAIT DES « HEURES NOUVELLES » DE PIERRE VIGNE
      content: |-
        Anges des cieux, venez tous admirer la Bonté de votre Souverain, de notre adorable Soleil et du grand Médiateur entre >Dieu et les hommes. Venez l’adorer pour nous sur cet Autel où il vient. Le voilà tout grand et soudainement parfait qu’il soit, qui vient come s’anéantir afin d’adorer Dieu son Père. Voici donc le beau mémorial de son sacrifice sur le Calvaire ! Voici qu’on nous annonce cette passion si douloureuse, ce Corps sacré dans cette Hostie et son Sang dans le Calice inséparablement uni à son Corps. Ô Jésus, jamais je n’oublierai ta passion et ta présence sur cet Autel, je t’aurai toujours gravé dans ma mémoire : %Faites ceci en mémoire de moi% …
        Ne dois-je pas aimer ton abaissement, Jésus, dans cette Hostie et la grande obéissance que tu as montrée jusqu’à la mort de la Croix. Mon esprit et mon cœur te sont bien unis, je veux toujours t’imiter.
        Père Eternel, voilà ton propre Fils élevé vers toi. Quand cette Hostie sacrée est élevée, élève aussi nos esprits et nos cœurs vers toi. Fais que toutes nos affections soient vers le lieu où est notre trésor qui n’est autre que toi-même.
        Ô Jésus que l’Amour pour notre salut a élevé sur la Croix, demande au Père les grâces qui nous sont nécessaires et que tu connais. C’est maintenant que nous t’adorons, prosternés devant toi. Nos esprits sont plus dans l’humilité que nos corps qui s’abaissent. Ô Ame de mon Rédempteur, viens et anime la mienne. Ô Sang précieux, viens me sanctifier. Ô Aimable Offrande, accepte que je m’unisse à toi afin que ton Père puisse me regarder favorablement.
        Avec le secours de ta grâce, Jésus mon Sauveur, jamais je n’oublierai ta bienheureuse Passion, qui est la cause de mon bonheur. Jamais je n’oublierai ta glorieuse Résurrection qui me fortifie dans ma foi et dans l’espérance de ressusciter comme toi. Jamais je n’oublierai ton Ascension qui m’a tracé le chemin de mon bonheur. Ton Sacrement me propose ces trois mystères que j’y adore.
        De grâce, achève en nous ton grand ouvrage, afin que nous puissions te louer éternellement des dons que tu nous as faits et que nous t’offrons.
      responsory: |-
        R/ Goûtez et voyez comme est bon le Seigneur.
        Il nous a aimés d’un immense amour.

        Le Christ a donné aux hommes le pain des anges.
        Il nous a aimés d’un immense amour.
