celebration:
  title: Saint Restitut et les premiers évêques du Tricastin
  description: |-
    La tradition fait de Restitut le premier évêque du Tricastin. Au VI^e siècle, on prétend vénérer sa tombe, dans une église qui est à l’origine du village de Saint-Restitut et qui, reconstruite au XII^e siècle, est un édifice remarquable.
    Sulpice, Boniface, Maximin, Castorin, Michel seraient les noms des premiers évêques de cette Église du Tricastin dont les origines nous échappent. Ces évêques ont eu un culte liturgique jusqu’à nos jours. Il en a été de même pour saint Amant qui a donné son nom à une des plus anciennes fondations monastiques de notre région, près de Montségur, et pour saint Torquat, prédécesseur de saint Paul selon la Vie de celui-ci, qui a donné le sien à un prieuré dont la chapelle subsiste dans un hameau de Suze-la-Rousse. L’histoire ne sait rien de ces évêques, mais nous connaissons leurs noms ; c’est une invitation à les « nommer », c’est-à-dire à les invoquer, à les prier et c’est bien l’essentiel.
  commons:
    - pastors_multiple
  color: white

oration:
  - |-
    En ce jour où nous fêtons saint Restitut et les saints évêques du Tricastin, nous te prions, Seigneur ; ouvre nos yeux h la lumière de la foi, que ta grâce nous transforme à ton image et nous pourrons montrer au monde la splendeur de ton salut. Par Jésus Christ.

morning:
  evangelicAntiphon:
    common:
      - |-
        Témoins de la lumière, apprenez-nous à marcher vers les splendeurs de Dieu.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Successeurs des apôtres, vous avez voulu tout restaurer dans le Christ à la louange de la gloire du Père.
