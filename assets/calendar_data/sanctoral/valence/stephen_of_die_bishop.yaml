celebration:
  title: Saint Étienne
  subtitle: évêque de Die
  description: |-
    Vers 1143, Ulric, évêque de Die, se retirait à la Chartreuse. Plus tard, trois chartreux prendront place dans la lignée de ses successeurs : Bernard, prieur de Portes, vers 1176 ; Étienne, de Portes lui aussi, en 1208 ; Didier de Lans, prieur de Durbon, dès 1214. Tous sont considérés comme des saints, mais seul Étienne jouit d’un culte liturgique. Les nombreux miracles accomplis à son tombeau lui ont valu cette reconnaissance. Il était né à Cha-tillon, un village des Dombes qui aura quelque temps saint Vincent de Paul pour curé.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Seigneur, tu as appelé saint Étienne du désert de la Chartreuse au service de ton Église de Die ; accorde-nous, par son intercession, un grand amour de la prière et une sincère charité pour tous les hommes nos frères. Par Jésus Christ.

readings:
  patristicReading:
    - title: LETTRE DE GUIGUES LE CHARTREUX AU CARDINAL AIMERIC
      subtitle: Le zèle de la maison de Dieu
      content: |-
        De ce seul bien suprême et bienfaisant, à savoir la société et la vision de Dieu, les espaces de temps et de lieu ne peuvent nous séparer, car il est toujours et partout, et %c’est en lui que nous avons la vie, le mouvement et l’être ;% mais les conséquences du péché peuvent nous en écarter car il est écrit : %Voici : la main du Seigneur n’est pas trop courte pour sauver, ni son oreille trop dure pour entendre. Mais vos iniquités ont creusé un abîme entre vous et votre Dieu.%
        Et puisque presque tous nos péchés viennent de l’orgueil qui nous est commun avec les anges - j’entends les apostats - ou de la volupté de la chair qui nous est commune avec les bêtes, nous devons travailler de toutes nos forces à réprimer l’orgueil de l’esprit par l’humilité, et la luxure de la chair par la sobriété. C’est pourquoi notre Seigneur dit : %Veillez à ce que vos cœurs ne s’appesantissent pas dans la débauche, l’ivrognerie et les soucis de la vie.% Et de même : %Apprenez de moi que je suis doux et humble de cœur.% Quel que soit l’objet extérieur pour lequel s’enflamme notre désir, c’est toujours pour le service de la sensualité et de la superbe. Si nous nous apercevons que notre effort est insuffisant contre elles, implorons le secours divin ; mais implorons-le humblement, implorons-le avec piété, de cœur et de bouche, par nos actes et notre train de vie.
        Ne regardons pas d’un cœur insensible et d’un œil sec la sanglante division du corps du Seigneur, qui est l’Église, car nous devons croire que ce malheur n’a pu arriver que par nos fautes. Autrement si nous demeurons vêtus d’habits précieux, confortablement réchauffés dans des pelisses d’hermine et de zibeline, repus dans des banquets nombreux et exquis, plongés plutôt que reposant dans des lits de mollesse à l’instar de Sardanapale, comment pensons-nous apaiser la colère divine par nos prières ?
        Nous voudrions faire entendre ces plaintes, non point avec l’autorité d’un docteur ou d’un censeur, mais dans la douleur et dans les larmes ; car notre cœur se sent rongé par le zèle de la maison de Dieu, dont nous aimons la beauté. Nous vous le demandons en suppliant : si ces paroles ne portent pas de fruit dans les autres, qu’elles en produisent au moins un peu en vous. Si, dis-je, ceux avec lesquels vous vivez n’ont aucun souci de leur salut, ou s’en occupent petitement et de façon insuffisante, vous du moins, ne vous oubliez pas au point de négliger votre âme. Car il est écrit : %Garde-toi et garde ton âme avec soin et aussi Aie pitié de ton âme, si tu veux plaire à Dieu ;% ou encore : %En toute diligence, veille sur ton cœur% . Et notre Seigneur a dit : %Que sert à l’homme de gagner l’univers, s’il porte dommage à son âme ?% Que rien ne vous enlève donc le soin de votre âme : ni la faveur des princes, ni l’éclat des ornements, ni la multitude des affaires, ni la gloire des cérémonies solennelles, ni les délices des banquets, ni les présents les plus considérables. Méditez toujours et partout dans votre esprit que vous ne savez pas avec qui vous vous trouverez au jour du jugement terrible du Christ : ou avec ceux à qui il est dit : %Allez-vous en maudits% , ou avec avec ceux qui entendront cette parole : %Venez, vous les bénis.%
        Que Dieu le Père qui a ramené des morts celui qui est devenu le grand Pasteur des brebis dans le sang de l’Alliance éternelle, notre Seigneur Jésus Christ, vous rende apte à accomplir sa volonté en toute sorte de biens produisant en vous ce qui lui est agréable, par Jésus Christ, à qui soit la gloire pour les siècles des siècles. Amen.
      responsory: |-
        R/ Heureux le serviteur
        que son maître trouve occupé à veiller.

        L’Esprit Saint vous a établis comme veilleurs :
        prenez garde à vous-mêmes et à tout le troupeau.

        Conduisez et nourrissez l’Église de Dieu,
        acquise par le sang de son Fils.

        Quand se manifestera le pasteur suprême,
        vous remporterez la couronne de gloire.

morning:
  evangelicAntiphon:
    common:
      - |-
        Saint Étienne a bien mérité son nom : il est la couronne et la fierté de son Église.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Témoin de la croix inébranlable au-dessus d’un monde qui passe, Étienne a affermi la foi de son peuple.
