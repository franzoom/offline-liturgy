celebration:
  title: Bienheureux Urbain II
  subtitle: pape
  description: |-
    Moine de Cluny puis évêque d’Ostie, Eudes de Chatillon (diocèse actuel de Reims) fut élu pape le 72 mars 1088. Il se voulut l’héritier du grand réformateur que fut saint Grégoire VII. Il s’appliqua à réduire le schisme de l’antipape Guibert, à dénoncer les abus des investitures laïques et à mettre fin au scandale de la simonie. Mais son nom reste attaché à la première croisade qu’il lança depuis Clermont, le 27 novembre 1095. Adhémar de Monteil, évêque du Puy et ancien chanoine de la cathédrale de Valence, en prit la tête, assisté du Comte de Toulouse. Mais Urbain II fut appelé à la Jérusalem céleste le 29 juillet 1099. Le pape ne savait pas que les croisés s’étaient rendu maîtres de Jérusalem quelques jours plus tôt.
    Le 5 août 1095, alors qu’il était en route vers Le Puy et Clermont, Urbain II consacrait notre église-cathédrale que venait de construire l’évêque Gontard.
  commons:
    - pastors_pope
  color: white

oration:
  - |-
    Tandis que nous célébrons, Seigneur, le Bienheureux Urbain II qui dépensa ses forces pour réformer l’Église et libérer les lieux saints ; accorde-nous d’assumer, avec la même vigueur, nos responsabilités dans le monde d’aujourd’hui pour que vienne ton Royaume. Par Jésus Christ.

readings:
  patristicReading:
    - title: DES SERMONS DU BIENHEUREUX PAPE URBAIN II
      subtitle: Ce qui fait la gloire de la patrie du Christ
      content: |-
        Vous savez, Frères bien aimés, et il est utile que votre charité le sache, comment le Rédempteur du genre humain, en s’incarnant pour notre salut à tous, en se faisant homme pour vivre parmi les hommes, a illustré par sa présence personnelle le pays de la Promesse, la terre qu’il avait jadis promise aux patriarches ; quel insigne éclat il lui a conféré en y réalisant les œuvres que prévoyait le plan divin et y accomplissant au grand jour de nombreux miracles : c’est ce que nous apprennent presque toutes les lignes, tous les mots des deux Testaments, l’Ancien et le Nouveau. Il est certain que ce pays-là, Dieu l’a aimé d’un amour privilégié, au point de daigner appeler « son héritage » cette partie du monde, disons plutôt cette parcelle, alors que %la terre entière est à lui avec toutes ses richesses% . Aussi dit-il par la bouche d’Isaïe Israël, mon héritage. Et encore : %La vigne du Seigneur Sabaoth, c’est la maison d’Israël.%
        Et, bien qu’il ait voulu, dès le début, se la consacrer tout entière à un titre spécial, c’est plus particulièrement la Ville sainte qu’il a adoptée et faite sienne, comme l’atteste le prophète : %Le Seigneur chérit les portes de Sion ; il les préfère à toutes les tentes de Jacob. On raconte sur elle des choses glorieuses% : sans doute, que le Sauveur y a enseigné, qu’il y a souffert et ressuscité, et qu’il a ainsi %opéré le salut au milieu du pays% . Elle était choisie d’avance et depuis les siècles, pour être la confidente et le sanctuaire familial de si grands mystères. Choisie, assurément, puisque celui qui a fait le choix d’elle l’atteste en disant : %De Jérusalem, la cité que j’ai choisie, vous viendra un Sauveur.%
        Bien que le Seigneur ait permis, par un juste jugement, qu’en punition des péchés de ses habitants cette ville fût à plusieurs reprises livrée aux mains de ses ennemis et qu’elle ait eu à supporter quelque temps le joug d’une rude servitude, il ne faudrait pourtant pas croire que Dieu l’ait rejetée, l’ait répudiée pour ainsi dire. Il est écrit en effet : %Le Seigneur châtie tout fils qu’il accueille% ; par contre il amasse un trésor de colère, celui que cette parole vise : %Ma jalousie s’est détournée de toi ; je ne me mettrai plus en colère contre toi% . Elle reste donc l’objet de son affection, dont l’ardeur ne s’est nullement refroidie à son égard, celle à qui Dieu parle ainsi : %Tu seras une couronne de gloire dans la main du Seigneur, un diadème royal dans la main de ton Dieu ; on ne t’appellera plus « La Désolée » mais ton nom sera « Ma Complaisance en elle », car le Seigneur s’est complu en toi.%
      responsory: |-
        R/ Glorifie le Seigneur, Jérusalem ;
        célèbre ton Dieu, ô Sion.

        C’est lui qui veille sur la paix à tes frontières.

        Ô ma joie quand on m’a dit :
        Allons à la maison du Seigneur.

        C’est lui qui veille sur la paix à tes frontières.

morning:
  evangelicAntiphon:
    common:
      - |-
        Par des croix d’huile sainte, le pape Urbain II a consacré les murs de notre église, maison de Dieu et porte du ciel.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Il a dressé l’étendard de la croix pour raviver la ferveur de l’Église et entraîner son peuple sur les chemins du Christ, vers la Jérusalem d’en haut.
