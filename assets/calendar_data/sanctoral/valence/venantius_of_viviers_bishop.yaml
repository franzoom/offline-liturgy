celebration:
  title: Saint Venant
  subtitle: évêque de Viviers
  description: |-
    Saint Venant fut évêque de Viviers au début du VI^e siècle. Il participa à plusieurs conciles provinciaux, notamment à celui d’Epaone en 517. Saint Avit le présidait et saint Apollinaire y était présent lui aussi.
    Les reliques de saint Venant, confiées aux bénédictines de Soyons, sur le territoire de l’ancien diocèse de Valence, furent amenées par les moniales dans la cité épiscopale, quand elles vinrent s’y établir et furent l’objet d’un culte très populaire. L’église Saint-jean les a recueillies, comme elle garde les restes de Mgr d’Authier de Sisgau, fondateur des missionnaires du Saint-Sacrement et supérieur du Séminaire de Valence, à l’époque où la translation des reliques de saint Venant donnait à la ville un nouveau protecteur.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    En confiant les reliques de saint Venant à l’Église de Valence, tu lui as donné, Seigneur, un protecteur auprès de toi ; accorde-nous d’en ressentir le bienfait en ce jour où nous célébrons la mémoire du saint évêque de Viviers. Par Jésus Christ.

readings:
  patristicReading:
    - title: DU TRAITÉ DE LA VERTU D’OBÉISSANCE PAR MGR D’AUTHIER DE SISGAU
      subtitle: La force de la grâce dans un cœur généreux
      content: |-
        Le serviteur de Dieu, qui a une fois pris le divin vouloir pour maître absolu de son âme, doit l’embrasser très étroitement dans les vertus où il le trouve infailliblement. Il faut que le bon plaisir de Dieu, déclaré par les vertus, lui serve de raison et de loi. Qu’il s’abandonne sans réserve à sa conduite, qu’il le suive à l’aveugle. C’est l’unique moyen pour ne point se tromper et pour résister aux tentations, qui sont les armes dont la chair, le monde et l’enfer, unis ensemble, le combattent par le moyen de cette folle sagesse. C’est ainsi qu’on vit selon l’esprit soumis aux vérités de la foi, c’est ainsi qu’on fait la volonté de Dieu.
        Quand toutes les puissances qui sont en l’homme seraient révoltées par des sentiments et des mouvements contraires à la loi de l’Esprit, je veux dire au divin vouloir signifié par les vertus, pourvu que la volonté où la liberté réside, lui demeure étroitement unie, il ne lui en arrivera point de mal.
        C’est ici où paraît dans son lustre la force de la grâce, quand l’homme combat tout nu, s’il faut ainsi parler, sans autres armes que le secours de la grâce et des vertus ; bien loin de recevoir du dommage de ces attaques, il en sort chargé de palmes et de lauriers. Les grâces que Dieu lui communique en ces nécessités si pressantes sont les plus précieuses dont il favorise ses serviteurs. Elles n’éclatent pas au dehors, elles sont toutefois les plus illustres ; elles ne se font pas sentir, mais elles opèrent les plus admirables effets que la grâce produise dans une âme. Elles forment l’homme intérieur, elles l’accoutument à la guerre, elles le font saint et parfait.
        Quand Dieu envoie de grandes tentations avec le réconfort de ses grâces victorieuses, c’est comme s’il faisait présent à l’homme de grandes couronnes. Si on le considère dans l’étrange et misérable état dans lequel il paraît au-dehors, il semble que Dieu l’ait abandonné à la merci des tentations qui le travaillent de toutes parts. Lui-même est presque de ce sentiment, car les grâces que la bonté divine lui fait, pour être toutes spirituelles, ne se font pas sentir. Il ne les peut connaître que par la grandeur de la tentation et de la fermeté de la volonté que toute leur violence n’est pas capable de séparer en la moindre chose de celle de son Dieu. L’homme, qui est en cet état, vit véritablement selon l’esprit soumis aux vérités de la foi et accomplit parfaitement la volonté divine sans aucun mélange de ses propres intérêts et du respect humain.
        Ce n’est pas mal à propos qu’on donne le nom de spirituels aux serviteurs de Dieu, car ils ne peuvent l’un qu’ils ne soient l’autre ; parce que, dans un monde plein de monstres et de péchés et dans un corps de chair, ils mènent une vie purement spirituelle et vivent comme des anges, observant exactement les ordres du bon plaisir de Dieu.
        N’est-ce pas mener une vie spirituelle lorsque dans la chair on n’accomplit pas les désirs de la chair et qu’on fait le contraire de ce qu’elle suggère ?
        Qu’il fait beau voir l’esprit de l’homme, dans la masse d’un corps corruptible, toujours aux aguets d’y faire régner la volonté de son Dieu et que, cependant que la chair se rebelle, que les passions suscitent des tempêtes et les diables enragent, il triomphe de toutes leurs violences, sous la possession et l’emprise de la volonté souveraine. Certainement c’est une chose admirable de voir ce pauvre petit esprit faire si bien parmi tant d’occasions de mal, faire et correspondre avec tant de fidélité aux lumières que Dieu lui communique pour éclairer les ténèbres de la prison mortelle de son corps.
      responsory: |-
        R/ Le juste par la foi vivra.

        Approchons-nous de Dieu avec un cœur droit,
        dans la plénitude de la foi.

        Ne soyons pas hommes à faire défection,
        mais des hommes de foi
        pour le salut de notre âme.

        Qui persévère jusqu’à la fin,
        celui-là sera sauvé.

morning:
  evangelicAntiphon:
    common:
      - |-
        Saint Venant exulte dans la gloire, son corps repose dans la paix et notre Église se réjouit de sa protection.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Précieuse aux yeux du Seigneur, la mort de saint Venant a été un trésor pour notre Église ; elle lui a donné un intercesseur auprès de Dieu.
