celebration:
  title: Saint Denis
  subtitle: évêque et martyr, patron secondaire du diocèse
  description: |-
    L’évêque Denis vint apporter l’Évangile à Lutèce vers le milieu du iiie siècle. Condamné à tort, il fut exécuté au nord de la cité et on déposa son corps là où s’élève, depuis le temps de sainte Geneviève, la basilique-cathédrale Saint-Denis. Il fit donc partie du groupe d’évêques envoyés par le Pape pour évangéliser la Gaule : Gatien à Tours, Trophime à Arles, Martial à Limoges. Le diocèse de Versailles, issu en grande partie de l’ancien et vaste diocèse de Paris, a tout naturellement reconnu le patronage du premier évêque missionnaire et de ses compagnons, le prêtre Éleuthère et le diacre Rustique.
  commons:
    - martyrs
  color: red

readings:
  biblicalReading:
    - title: LECTURE DES ACTES DES APÔTRES
      ref: Ac 17, 15-34
      content: |-
        Ceux qui escortaient Paul le conduisirent jusqu’à Athènes. Puis ils s’en retournèrent, porteurs d’un message, avec l’ordre, pour Silas et Timothée, de rejoindre Paul le plus tôt possible. Pendant que Paul les attendait à Athènes, il avait l’esprit exaspéré en observant la ville livrée aux idoles. Il discutait donc à la synagogue avec les Juifs et ceux qui adorent Dieu, ainsi qu’avec ceux qu’il rencontrait chaque jour sur l’Agora. Il y avait même des philosophes épicuriens et stoïciens qui venaient s’entretenir avec lui. Certains disaient : « Que peut-il bien vouloir dire, ce radoteur ? » Et d’autres : « On dirait un prêcheur de divinités étrangères. » Ils disaient cela parce que Paul se faisait le messager de « Jésus » et de « Résurrection ». Ils vinrent le prendre pour le conduire à l’Aréopage. Ils lui disaient : « Pouvons-nous savoir quel est cet enseignement nouveau que tu proposes ? Tu nous rebats les oreilles de choses étranges. Nous voulons donc savoir ce que cela signifie. » Tous les Athéniens, en effet, ainsi que les étrangers de passage, ne consacraient leur temps à rien d’autre que dire ou écouter la dernière nouveauté.
        Alors Paul, debout au milieu de l’Aréopage, fit ce discours : « Athéniens, je peux observer que vous êtes, en toutes choses, des hommes particulièrement religieux. En effet, en me promenant et en observant vos monuments sacrés, j’ai même trouvé un autel avec cette inscription : “Au dieu inconnu.” Or, ce que vous vénérez sans le connaître, voilà ce que, moi, je viens vous annoncer. Le Dieu qui a fait le monde et tout ce qu’il contient, lui qui est Seigneur du ciel et de la terre, n’habite pas des sanctuaires faits de main d’homme ; il n’est pas non plus servi par des mains humaines, comme s’il avait besoin de quoi que ce soit, lui qui donne à tous la vie, le souffle et tout le nécessaire. À partir d’un seul homme, il a fait tous les peuples pour qu’ils habitent sur toute la surface de la terre, fixant les moments de leur histoire et les limites de leur habitat ; Dieu les a faits pour qu’ils le cherchent et, si possible, l’atteignent et le trouvent, lui qui, en fait, n’est pas loin de chacun de nous. Car c’est en lui que nous avons la vie, le mouvement et l’être. Ainsi l’ont également dit certains de vos poètes : Nous sommes de sa descendance. Si donc nous sommes de la descendance de Dieu, nous ne devons pas penser que la divinité est pareille à une statue d’or, d’argent ou de pierre sculptée par l’art et l’imagination de l’homme. Et voici que Dieu, sans tenir compte des temps où les hommes l’ont ignoré, leur enjoint maintenant de se convertir, tous et partout. En effet, il a fixé le jour où il va juger la terre avec justice, par un homme qu’il a établi pour cela, quand il l’a accrédité auprès de tous en le ressuscitant d’entre les morts. »
        Quand ils entendirent parler de résurrection des morts, les uns se moquaient, et les autres déclarèrent : « Là-dessus nous t’écouterons une autre fois. » C’est ainsi que Paul, se retirant du milieu d’eux, s’en alla. Cependant quelques hommes s’attachèrent à lui et devinrent croyants. Parmi eux, il y avait Denys, membre de l’Aréopage, et une femme nommée Damaris, ainsi que d’autres avec eux.
  patristicReading:
    - title: HOMÉLIE DE SAINT AMBROISE SUR LE PSAUME 118
      content: |-
        Lorsqu’il y a beaucoup de persécutions, il y a beaucoup de martyrs. Chaque jour tu es témoin du Christ. Tu étais tenté par l’esprit d’impureté ; mais, par crainte du jugement futur, tu as jugé qu’il ne fallait pas souiller la chasteté de l’esprit et du corps : tu es martyr du Christ. Tu étais tenté par l’esprit de lucre pour saisir la propriété d’un pauvre ou violer les droits d’une veuve sans défense ; mais, par la contemplation des préceptes divins, tu as jugé qu’il valait mieux porter secours que commettre une injustice : tu es témoin du Christ. En effet, le Christ veut avoir de tels témoins, selon cette parole de l’Écriture : %Soyez justes pour l’orphelin, défendez la veuve, venez donc et discutons, dit le Seigneur%. Tu étais tenté par l’esprit d’orgueil ; mais en voyant le pauvre et l’indigent, tu as été saisi d’une tendre compassion, tu as préféré l’humilité à l’arrogance : tu es témoin du Christ. Mieux que cela : tu n’as pas donné ton témoignage en parole seulement mais aussi en action.
        Quel est le témoin le plus sûr ? %Celui qui confesse que le Seigneur Jésus est venu parmi nous dans la chair% et qui observe les préceptes de l’Évangile. Car celui qui écoute et n’agit pas nie le Christ ; il a beau le proclamer en parole, il le nie par ses actions. Combien de gens disent : %Seigneur, Seigneur, n’est-ce pas en ton nom que nous avons été prophètes, que nous avons chassé les démons et fait beaucoup de miracles ?% Au jour du jugement, le Christ leur répondra : %Écartez-vous de moi, vous qui faites le mal !% Celui-là est témoin qui, avec la garantie des faits, rend témoignage aux préceptes du Seigneur Jésus.
        Combien y en a-t-il chaque jour, de ces martyrs cachés du Christ, qui confessent le Seigneur Jésus ! L’Apôtre a connu ce martyre-là et le témoignage de foi rendu au Christ, lui qui a dit : %Notre sujet de fierté, c’est le témoignage de notre conscience%. Combien ont confessé la foi extérieurement, et l’ont niée intérieurement ! ~ %Ne croyez pas n’importe quel prophète : c’est à leurs fruits que vous saurez% lesquels vous devez croire. ~ Sois donc fidèle et courageux dans les persécutions intérieures pour triompher aussi dans les persécutions extérieures. Dans les persécutions du dedans également, il y a %des rois et des gouverneurs%, des juges au pouvoir redoutable. Tu en as un exemple dans la tentation subie par le Seigneur.
        On lit encore ailleurs : %Que le péché ne règne pas dans votre corps mortel%. Tu vois devant quels rois tu vas comparaître, ô homme, devant quels gouverneurs de péchés, si c’est le péché qui règne. Il y a autant de rois que de péchés et de vices ; et c’est devant eux que nous sommes amenés, devant eux que nous comparaissons. Ces rois-là ont encore leur tribunal dans l’esprit d’un grand nombre. Mais celui qui confesse le Christ paralyse aussitôt le pouvoir de ce roi, il le détrône de son esprit. Comment le tribunal du diable pourrait-il subsister chez celui en qui est érigé le tribunal du Christ ?
      responsory: |-
        [rubric]Stance[/rubric]
        De la détresse des prisons
        monte le cri des fils de Dieu persécutés ;
        mais le Royaume est proche :
        bientôt se lèvera
        le Fils de l’homme qu’ils acclament :

        R/ Dieu vivant, Seigneur ressuscité,
        nous croyons en toi.

        Un moment vous souffrirez,
        mais j’ai vaincu le monde,
        gardez courage.

        En vérité, je vous le dis,
        si quelqu’un garde ma parole,
        il ne verra jamais la mort.

        Je suis la résurrection ;
        celui qui me donne sa foi
        vivra même dans la mort.

morning:
  evangelicAntiphon:
    common:
      - |-
        C’est aujourd’hui la fête de saint Denis, le jour où il triompha dans le combat et mérita de recevoir de la main du Seigneur la couronne de la victoire.
  intercession:
    content: |-
      Béni sois-tu, Seigneur, qui as voulu rendre témoignage au Père dans les souffrances et la mort de l’évêque saint Denis.

      R/ Béni sois-tu, Seigneur.

      Béni sois-tu, Seigneur, qui as fait du sang de saint Denis et de ses compagnons une semence de chrétiens.

      Béni sois-tu, Seigneur, pour toutes les générations qui depuis lors nous ont transmis la foi en vivant de ton Évangile.

      Béni sois-tu, Seigneur, pour les témoins que tu as suscités dans notre Église : messagers de ta Parole et serviteurs de leurs frères, chrétiens engagés dans le combat pour la justice et la vérité.

vespers:
  evangelicAntiphon:
    common:
      - |-
        Aujourd’hui l’évêque Denis a couronné sa vie par le martyre ; il possède désormais pour l’éternité le Dieu qu’il aima de tout son cœur.
  intercession:
    content: |-
      Présentons au Seigneur la prière de l’Église que saint Denis a plantée dans son sang :

      R/ Kyrie eleison.

      Pour le peuple qui chemine en Île-de-France…

      Pour notre évêque, les prêtres et les diacres, pour tous ceux qui se consacrent au service de leurs frères…

      Pour les pères et les mères de famille, pour les jeunes…

      Pour les malades et tous ceux qui souffrent…

oration:
  - |-
    Dieu de miséricorde, par la prédication de l’évêque saint Denis tu as transmis la foi à nos pères ; accorde-nous, à sa prière, de marcher dans la vérité de l’Évangile afin de parvenir jusqu’à la splendeur de ta gloire.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - content: |-
          Fêtons aujourd’hui dans l’action de grâce l’évêque saint Denis,
          qui planta l’Église de Paris dans son sang :
          >par lui le peuple qui marchait dans les ténèbres a vu se lever une grande lumière.
    collect:
      - |-
        Dieu de miséricorde, par la prédication de l’évêque saint Denis
        tu as transmis la foi à nos pères :
        >accorde-nous, à sa prière, de marcher dans la vérité de l’Évangile
        >afin de parvenir jusqu’à la splendeur de ta gloire.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: 1 Th 2, 2b-8
            headline: |-
              « Nous aurions voulu vous donner non seulement l’Évangile de Dieu, mais jusqu’à nos propres vies »
            content: |-
              Frères,
              nous avons trouvé en notre Dieu pleine assurance
              >pour vous annoncer, au prix de grandes luttes,
              >l’Évangile de Dieu.
              Et quand nous vous exhortions,
              ce n’était pas avec des doctrines fausses,
              >ni des motifs impurs, ni par ruse.
              En effet, pour nous confier l’Évangile,
              >Dieu a éprouvé notre valeur,
              de sorte que nous parlons,
              >non pas pour plaire aux hommes, mais à Dieu,
              >lui qui met nos cœurs à l’épreuve.
              Jamais, nous n’avons eu un mot de flatterie, vous le savez,
              >jamais de motifs intéressés, Dieu en est témoin ;
              jamais nous n’avons recherché la gloire qui vient des hommes,
              >ni auprès de vous ni auprès d’autres personnes.
              Alors que nous aurions pu nous imposer
              >en qualité d’apôtres du Christ,
              au contraire, nous avons été pleins de douceur avec vous,
              >comme une mère qui entoure de soins ses nourrissons.
              Ayant pour vous une telle affection,
              nous aurions voulu vous donner non seulement l’Évangile de Dieu,
              >mais jusqu’à nos propres vies,
              car vous nous étiez devenus très chers.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 26 (27), 1-4.8-9ab.13-14
      - partType: GOSPEL
        partContents:
          - biblicalRef: Jn 10, 11-16
            headline: |-
              « Le bon pasteur donne sa vie pour ses brebis »
            acclamationAntiphon: |-
              Je suis le bon Pasteur, dit le Seigneur ;
              je connais mes brebis
              et mes brebis me connaissent.
            content: |-
              En ce temps-là, Jésus disait :
              >« Moi, je suis le bon pasteur, le vrai berger,
              >qui donne sa vie pour ses brebis.
              Le berger mercenaire n’est pas le pasteur,
              >les brebis ne sont pas à lui :
              >s’il voit venir le loup,
              >il abandonne les brebis et s’enfuit ;
              >le loup s’en empare et les disperse.
              Ce berger n’est qu’un mercenaire,
              >et les brebis ne comptent pas vraiment pour lui.
              Moi, je suis le bon pasteur ;
              >je connais mes brebis,
              >et mes brebis me connaissent,
              >comme le Père me connaît,
              >et que je connais le Père ;
              >et je donne ma vie pour mes brebis.
              J’ai encore d’autres brebis,
              >qui ne sont pas de cet enclos :
              >celles-là aussi, il faut que je les conduise.
              Elles écouteront ma voix :
              >il y aura un seul troupeau
              >et un seul pasteur. »
    offeringPrayer:
      - |-
        Accepte, Seigneur, nous t’en prions, le sacrifice d’action de grâce
        que ton peuple te présente en la fête du martyr saint Denis ;
        >car c’est toi que nous glorifions
        >quand nous célébrons le fondateur de notre Église.
        Par le Christ, notre Seigneur.
    communionAntiphon:
      - content: |-
          Le Fils de l’homme est venu pour servir
          et donner sa vie en rançon pour la multitude.
    prayerAfterCommunion:
      - |-
        Permets, Dieu notre Père,
        que le sacrement reçu à ton autel rassemble ton peuple dans l’unité
        >et le consacre dans la vérité ;
        qu’il nous donne de croire plus fermement à la Bonne Nouvelle
        >que saint Denis nous a transmise.
        Par le Christ, notre Seigneur.
