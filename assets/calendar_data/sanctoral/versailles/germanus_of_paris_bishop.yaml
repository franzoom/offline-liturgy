celebration:
  title: Saint Germain de Paris
  subtitle: évêque
  description: |-
    Saint Germain, vingtième évêque de Paris, est le plus célèbre d’entre eux. Né à Autun, il occupa le siège de Paris en 567 après avoir mené la vie monastique sous la règle de saint Basile. Durant tout son épiscopat, il fut étroitement engagé dans la vie de la cité. À sa mort en 576, on l’ensevelit près de la basilique Saint-Vincent, qui allait devenir Saint-Germain-des-Prés. Le rayonnement de ce bon pasteur s’est étendu autour de Paris : beaucoup de villages en ont bénéficié, et son nom s’est perpétué dans ce qui est devenu la ville de Saint-Germain-en-Laye, où son culte est demeuré constant.
  commons:
    - pastors_bishop
  color: white

oration:
  - |-
    Dieu notre Père, splendeur et gloire de tes élus, tu as sanctifié ce jour par la mort de l’évêque saint Germain : accorde à ton Église l’appui de ses exemples et de ses mérites, pour qu’elle trouve miséricorde auprès de toi et qu’elle puisse annoncer à tous les hommes les merveilles de ton amour.

mass:
  - massType: DAY_MASS
    entranceAntiphon:
      - content: |-
          En choisissant saint Germain comme évêque,
          >le Seigneur a pris soin de son peuple,
          >il lui a donné pour le conduire un berger selon son cœur.
    collect:
      - |-
        Dieu notre Père, splendeur et gloire de tes élus,
        tu as sanctifié ce jour par la mort de l’évêque saint Germain :
        >accorde à ton Église l’appui de ses exemples et de ses mérites,
        pour qu’elle trouve miséricorde auprès de toi
        >et qu’elle puisse annoncer à tous les hommes les merveilles de ton amour.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: 2 Co 4, 1-2.5-7
            headline: |-
              « Ce que nous proclamons, c’est Jésus Christ le Seigneur ; et nous sommes vos serviteurs, à cause de Jésus »
            content: |-
              Frères,
              nous, les Apôtres,
              ayant reçu ce ministère par la miséricorde de Dieu,
              >nous ne perdons pas courage :
              nous avons rejeté toute dissimulation honteuse,
              >nous n’agissons pas avec ruse,
              >et nous ne falsifions pas la parole de Dieu.
              Au contraire, nous manifestons la vérité,
              >et ainsi nous nous recommandons nous-mêmes
              >à toute conscience humaine devant Dieu.
              Ce que nous proclamons,
              >ce n’est pas nous-mêmes ;
              c’est ceci : Jésus Christ est le Seigneur ;
              >et nous sommes vos serviteurs, à cause de Jésus.
              Car Dieu qui a dit :
              >Du milieu des ténèbres brillera la lumière,
              a lui-même brillé dans nos cœurs
              >pour faire resplendir la connaissance de sa gloire
              >qui rayonne sur le visage du Christ.
              Mais ce trésor, nous le portons
              >comme dans des vases d’argile ;
              ainsi, on voit bien que cette puissance extraordinaire
              >appartient à Dieu et ne vient pas de nous.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 95 (96), 1-3.7-8a.10
            refAbbr: cf. 95, 3
            chorus:
              - chorusRef: cf. 95, 3
                content: |-
                  Racontez à tous les peuples
                  les merveilles du Seigneur !
            content: |-
              Chantez au Seigneur un chant nouveau,
              chantez au Seigneur, terre entière,
              chantez au Seigneur et bénissez son nom !

              De jour en jour, proclamez son salut,
              racontez à tous les peuples sa gloire,
              à toutes les nations ses merveilles !

              Rendez au Seigneur, familles des peuples,
              rendez au Seigneur la gloire et la puissance,
              rendez au Seigneur la gloire de son nom.

              Adorez le Seigneur, éblouissant de sainteté :
              tremblez devant lui, terre entière.
              Allez dire aux nations : « Le Seigneur est roi ! »
      - partType: GOSPEL
        partContents:
          - biblicalRef: Mt 13, 1-9
            headline: |-
              « Ils ont donné du fruit à raison de cent pour un »
            acclamationAntiphon: |-
              La semence est la parole de Dieu, le semeur est le Christ ;
              celui qui le trouve demeure pour toujours.
            content: |-
              Ce jour-là, Jésus était sorti de la maison,
              et il était assis au bord de la mer.
              Auprès de lui se rassemblèrent des foules si grandes
              qu’il monta dans une barque où il s’assit ;
              toute la foule se tenait sur le rivage.
              Il leur dit beaucoup de choses en paraboles :
              « Voici que le semeur sortit pour semer.
              Comme il semait,
              des grains sont tombés au bord du chemin,
              et les oiseaux sont venus tout manger.
              D’autres sont tombés sur le sol pierreux,
              où ils n’avaient pas beaucoup de terre ;
              ils ont levé aussitôt,
              parce que la terre était peu profonde.
              Le soleil s’étant levé, ils ont brûlé
              et, faute de racines, ils ont séché.
              D’autres sont tombés dans les ronces ;
              les ronces ont poussé et les ont étouffés.
              D’autres sont tombés dans la bonne terre,
              et ils ont donné du fruit
              à raison de cent, ou soixante, ou trente pour un.
              Celui qui a des oreilles,
              qu’il entende ! »
    offeringPrayer:
      - |-
        Regarde avec bonté, Seigneur,
        l’offrande que nous apportons à ton autel
        >au jour où nous fêtons saint Germain ;
        en nous procurant ton pardon,
        >qu’elle serve ta gloire.
        Par le Christ, notre Seigneur.
    communionAntiphon:
      - biblicalReference: cf. Jn 15, 16
        content: |-
          Ce n’est pas vous qui m’avez choisi, dit le Seigneur,
          c’est moi qui vous ai choisis ;
          je vous ai mis à cette place afin que vous partiez,
          que vous donniez du fruit, et que votre fruit demeure.
    prayerAfterCommunion:
      - |-
        Déjà rénovés par cette Eucharistie,
        nous te supplions humblement, Seigneur :
        >puissions-nous, en prenant exemple sur saint Germain,
        >professer ce qu’il a cru et pratiquer ce qu’il a enseigné.
        Par le Christ, notre Seigneur.
