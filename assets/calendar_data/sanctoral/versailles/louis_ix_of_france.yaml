mass:
  - massType: DAY_MASS
    note: À Versailles, on dit le Credo.
    entranceAntiphon:
      - content: |-
          J’entre dans ta maison, Seigneur :
          j’adore dans ton temple saint
          et je rends grâce à ton nom.
    collect:
      - |-
        Seigneur, tu as appelé saint Louis de la charge d’un royaume terrestre
        >à la gloire du Royaume des cieux :
        accorde-nous, par son intercession, de travailler à la venue de ton règne
        >en accomplissant nos tâches temporelles.
        Par Jésus Christ, ton Fils, notre Seigneur, +
        >qui vit et règne avec toi dans l’unité du Saint-Esprit, /
        >Dieu, pour les siècles des siècles.
    readingParts:
      - partType: READING_1
        partContents:
          - biblicalRef: 1 R 3, 11-14
            headline: |-
              « Je te donne un cœur intelligent et sage »
            content: |-
              En ces jours-là,
              le Seigneur répondit ainsi à la prière de Salomon :
              >« Puisque tu ne m’as pas demandé de longs jours,
              >ni la richesse,
              >ni la mort de tes ennemis,
              >mais puisque tu as demandé le discernement,
              >l’art d’être attentif et de gouverner,
              >je fais ce que tu as demandé :
              >je te donne un cœur intelligent et sage,
              >tel que personne n’en a eu avant toi
              >et que personne n’en aura après toi.
              De plus, je te donne même ce que tu n’as pas demandé,
              >la richesse et la gloire,
              >si bien que pendant toute ta vie
              >tu n’auras pas d’égal parmi les rois.
      - partType: PSALM
        partContents:
          - biblicalRef: Ps 36 (37), 3-6.30-31
      - partType: READING_2
        partContents:
          - biblicalRef: Ga 2, 19-20
            headline: |-
              « Je vis, mais ce n’est plus moi, c’est le Christ qui vit en moi »
            content: |-
              Frères,
              par la Loi, je suis mort à la Loi
              >afin de vivre pour Dieu ;
              avec le Christ, je suis crucifié.
              Je vis, mais ce n’est plus moi,
              >c’est le Christ qui vit en moi.
              Ce que je vis aujourd’hui dans la chair,
              >je le vis dans la foi au Fils de Dieu
              >qui m’a aimé et s’est livré lui-même pour moi.
      - partType: GOSPEL
        partContents:
          - biblicalRef: Mt 5, 38-48
            headline: |-
              « Aimez vos ennemis »
            acclamationAntiphon: |-
              En celui qui garde la parole du Christ
              l’amour de Dieu atteint vraiment sa perfection.
            content: |-
              En ce temps-là,
              Jésus disait à ses disciples :
              « Vous avez appris qu’il a été dit :
              Œil pour œil, et dent pour dent.
              Eh bien ! moi, je vous dis de ne pas riposter au méchant ;
              mais si quelqu’un te gifle sur la joue droite,
              >tends-lui encore l’autre.
              Et si quelqu’un veut te poursuivre en justice
              >et prendre ta tunique,
              >laisse-lui encore ton manteau.
              Et si quelqu’un te réquisitionne pour faire mille pas,
              >fais-en deux mille avec lui.
              À qui te demande, donne ;
              >à qui veut t’emprunter, ne tourne pas le dos !
              Vous avez appris qu’il a été dit :
              Tu aimeras ton prochain
              >et tu haïras ton ennemi.
              Eh bien ! moi, je vous dis :
              Aimez vos ennemis,
              >et priez pour ceux qui vous persécutent,
              afin d’être vraiment les fils de votre Père qui est aux cieux ;
              >car il fait lever son soleil sur les méchants et sur les bons,
              >il fait tomber la pluie sur les justes et sur les injustes.
              En effet, si vous aimez ceux qui vous aiment,
              >quelle récompense méritez-vous ?
              Les publicains eux-mêmes n’en font-ils pas autant ?
              Et si vous ne saluez que vos frères,
              >que faites-vous d’extraordinaire ?
              Les païens eux-mêmes n’en font-ils pas autant ?
              Vous donc, vous serez parfaits
              >comme votre Père céleste est parfait. »
    prefaceList:
      - saint_louis
    offeringPrayer:
      - |-
        Dieu qui as rendu saint Louis admirable sur la terre
        et l’as glorifié dans le ciel,
        >fais que nous brûlions comme lui de ton amour
        >quand nous prenons place autour de l’autel
        >pour t’offrir le sacrifice rédempteur.
        Par le Christ, notre Seigneur.
    communionAntiphon:
      - biblicalReference: Ps 40, 2
        content: |-
          Heureux qui pense au pauvre et au faible :
          le Seigneur le sauve au jour du malheur.
    prayerAfterCommunion:
      - |-
        Dieu plein de bonté,
        tu as donné à saint Louis un amour exemplaire pour les pauvres ;
        >permets que, rénovés à la table eucharistique,
        >nous sachions comme lui reconnaître et servir le Christ
        >dans les plus déshérités de nos frères.
        Par le Christ, notre Seigneur.
