celebration:
  title: Saint Louis, roi de France
  subtitle: patron principal du diocèse de Versailles
  description: |-
    Né et baptisé en 1214 à Poissy, Louis devient roi à douze ans. Il aimait signer « Louis de Poissy » en souvenir de son baptême. C’est dans l’exercice de ses tâches temporelles qu’il parvint à la sainteté. Durant son règne, la France connut seize années de paix. Il participa à trois croisades pour délivrer les lieux saints de Palestine et rendit son âme à Dieu le 25 août 1270, sous les remparts de Carthage. La cathédrale de Versailles a reçu en 2011 des reliques insignes du saint patron du diocèse et titulaire de la cathédrale.
  commons:
    - saints-male_married
  color: white

oration:
  - |-
    Seigneur, tu as appelé saint Louis de la charge d’un royaume terrestre à la gloire du Royaume des cieux ; accorde-nous, par son intercession, de travailler à la venue de ton règne en accomplissant nos tâches temporelles.

invitatory:
  antiphon:
    - |-
      Le Seigneur, le roi immortel des siècles, venez, adorons-le.

readings:
  biblicalReading:
    - title: DU LIVRE DE LA SAGESSE
      subtitle: Un roi sage fait la prospérité du peuple
      ref: Sg 6, 1-27
      content: |-
        Écoutez donc, ô rois, et comprenez ; instruisez-vous, juges de toute la terre. Soyez attentifs, vous qui dominez les foules, qui vous vantez de la multitude de vos peuples. Car la domination vous a été donnée par le Seigneur, et le pouvoir, par le Très-Haut, lui qui examinera votre conduite et scrutera vos intentions. En effet, vous êtes les ministres de sa royauté ; si donc vous n’avez pas rendu la justice avec droiture, ni observé la Loi, ni vécu selon les intentions de Dieu, il fondra sur vous, terrifiant et rapide, car un jugement implacable s’exerce sur les grands.
        Au petit, par pitié, on pardonne, mais les puissants seront jugés avec puissance. Le Maître de l’univers ne reculera devant personne, la grandeur ne lui en impose pas ; car les petits comme les grands, c’est lui qui les a faits : il prend soin de tous pareillement. Les puissants seront soumis à une enquête rigoureuse.
        C’est donc pour vous, souverains, que je parle, afin que vous appreniez la sagesse et que vous évitiez la chute, car ceux qui observent saintement les lois saintes seront reconnus saints, et ceux qui s’en instruisent y trouveront leur défense. Recherchez mes paroles, désirez-les ; elles feront votre éducation.
        La Sagesse est resplendissante, elle ne se flétrit pas. Elle se laisse aisément contempler par ceux qui l’aiment, elle se laisse trouver par ceux qui la cherchent. Elle devance leurs désirs en se faisant connaître la première. Celui qui la cherche dès l’aurore ne se fatiguera pas : il la trouvera assise à sa porte. Penser à elle est la perfection du discernement, et celui qui veille à cause d’elle sera bientôt délivré du souci. Elle va et vient à la recherche de ceux qui sont dignes d’elle ; au détour des sentiers, elle leur apparaît avec un visage souriant ; dans chacune de leurs pensées, elle vient à leur rencontre.
        Le commencement de la Sagesse, c’est le désir vrai d’être instruit ; le souci de l’instruction, c’est l’amour ; l’amour, c’est de garder ses lois ; observer les lois, c’est l’assurance de l’incorruptibilité, et l’incorruptibilité rend proche de Dieu. Ainsi le désir de la Sagesse élève à la royauté. Si donc vous, souverains des peuples, vous prenez plaisir aux trônes et aux sceptres, rendez hommage à la Sagesse afin de régner pour toujours.
        Mais qu’est-ce que la Sagesse et comment est-elle née ? Je vais l’exposer ; loin de vous en cacher les mystères, je suivrai ses traces depuis le principe de son origine et je mettrai en lumière ce que l’on connaît d’elle ; je n’écarterai pas mon chemin de la vérité, et ne marcherai jamais avec l’esprit de jalousie, car cela n’a rien de commun avec la sagesse.
        Au contraire, une multitude de sages est salut pour le monde, et un roi qui gouverne avec discernement, c’est le bien-être du peuple. Aussi laissez-vous instruire par mes paroles : vous en tirerez profit.
      responsory: |-
        R/ Esprit de vérité, tu nous conduis
        dans la vérité tout entière.

        La sagesse est brillante et ne se ternit pas ;
        elle se laisse trouver par ceux qui la cherchent.

        La sagesse prévient ceux qui la désirent,
        elle marche à leur rencontre.

        Le désir de la sagesse conduit à la royauté,
        et la fidélité donne place auprès de Dieu.
  patristicReading:
    - title: ENSEIGNEMENTS DE SAINT LOUIS À SON FILS AÎNÉ PHILIPPE
      content: |-
        Cher fils, je t’enseigne premièrement que tu aimes Dieu de tout ton cœur et de tout ton pouvoir, car sans cela personne ne peut rien valoir.
        Tu dois te garder de toutes choses que tu penseras devoir lui déplaire et qui sont en ton pouvoir, et spécialement tu dois avoir cette volonté que tu ne fasses un péché mortel pour nulle chose qui puisse arriver, et qu’avant de faire un péché mortel avec connaissance, tu souffrirais que l’on te coupe les jambes et les bras et que l’on t’enlève la vie par le plus cruel martyre.
        Si Notre Seigneur t’envoie persécution, maladie ou autre souffrance, tu dois la supporter débonnairement, et tu dois l’en remercier et lui savoir bon gré, car il faut comprendre qu’il l’a fait pour ton bien. De plus, tu dois penser que tu as mérité ceci — et encore plus s’il le voulait — parce que tu l’as peu aimé et peu servi, et parce que tu as fait beaucoup de choses contre sa volonté.
        Si Notre Seigneur t’envoie prospérité, santé du corps ou autre chose, tu dois l’en remercier humblement, et puis prendre garde qu’à cause de cela il ne t’arrive pas de malheur causé par orgueil ou par une autre faute, car c’est un très grand péché de guerroyer Notre Seigneur de ses dons.
        Cher fils, je t’enseigne que tu entendes volontiers le service de la sainte Église, et quand tu seras à l’église, garde-toi de perdre ton temps et de parler vaines paroles. Dis tes oraisons avec recueillement ou par bouche ou de pensée, et spécialement sois plus recueilli et plus attentif à l’oraison pendant que le corps de Notre Seigneur Jésus Christ sera présent à la messe, et puis aussi pendant un petit moment avant.
        Cher fils, je t’enseigne que tu aies le cœur compatissant envers les pauvres et envers tous ceux que tu considéreras comme souffrants ou de cœur ou de corps ; et selon ton pouvoir soulage-les volontiers ou de soutien moral ou d’aumônes. ~
        Prends garde que tu sois si bon en toutes choses qu’il soit évident que tu reconnaisses les générosités et les honneurs que Notre Seigneur t’a faits de sorte que, s’il plaisait à Notre Seigneur que tu aies l’honneur de gouverner le royaume, tu sois digne de recevoir l’onction avec laquelle les rois de France sont sacrés.
        Cher fils, s’il advient que tu deviennes roi, prends soin d’avoir les qualités qui appartiennent aux rois, c’est-à-dire que tu sois si juste que, quoi qu’il arrive, tu ne t’écartes de la justice. Et s’il advient qu’il y ait querelle entre un pauvre et un riche, soutiens de préférence le pauvre contre le riche jusqu’à ce que tu saches la vérité, et quand tu la connaîtras, fais justice. ~
        Sois bien diligent de protéger dans tes domaines toutes sortes de gens, surtout les gens de sainte Église ; défends qu’on ne leur fasse tort ni violence en leurs personnes ou en leurs biens. ~
        Chers fils, je t’enseigne que tu sois toujours dévoué à l’Église de Rome et à notre saint-père le Pape, et lui portes respect et honneur comme tu le dois à ton père spirituel. ~
        Mets grande peine à ce que les péchés soient supprimés en ta terre, c’est-à-dire les vilains serments et toute chose qui se fait ou se dit contre Dieu ou Notre-Dame ou les saints : péchés de corps, jeux de dés, tavernes ou autres péchés. Fais abattre tout ceci en ta terre sagement et en bonne manière. ~
        Cher fils, je te donne toute la bénédiction qu’un père peut et doit donner à son fils, et je prie Notre Seigneur Dieu Jésus Christ que, par sa grande miséricorde et par les prières et par les mérites de sa bienheureuse mère, la Vierge Marie, et des anges et des archanges, de tous les saints et de toutes les saintes, il te garde et te défende que tu ne fasses chose qui soit contre sa volonté, et qu’il te donne grâce de faire sa volonté afin qu’il soit servi et honoré par toi ; et puisse-t-il accorder à toi et à moi, par sa grande générosité, qu’après cette mortelle vie nous puissions venir à lui pour la vie éternelle afin de le voir, aimer et louer sans fin. Amen.
      responsory: |-
        R/ Heureux les miséricordieux,
        car ils obtiendront miséricorde.

        Sans miséricorde est le jugement,
        pour qui n’a pas eu pitié.

        La miséricorde se rit du jugement,
        elle rend fils du Père qui est dans les cieux.

morning:
  hymn:
    - roi-des-rois-jesus-seigneur
  psalmody:
    - psalm: PSALM_62
      antiphon:
        - |-
          Dieu leur a donné une gloire sans fin, leur nom ne sera jamais oublié.
    - psalm: OT_41
      antiphon:
        - |-
          Serviteur du Seigneur, bénissez le Seigneur, éternellement.
    - psalm: PSALM_149
      antiphon:
        - |-
          Ils exulteront glorieux, criant leur joie au jour du triomphe.
  reading:
    biblicalReference: Rm 12, 1-2
    content: |-
      Je vous exhorte, mes frères, par la tendresse de Dieu, à lui offrir votre personne et votre vie en sacrifice saint, capable de plaire à Dieu : c’est là pour vous l’adoration véritable. Ne prenez pas pour modèle le monde présent, mais transformez-vous en renouvelant votre façon de penser pour savoir reconnaître quelle est la volonté de Dieu : ce qui est bon, ce qui est capable de lui plaire, ce qui est parfait.
  responsory: |-
    R/ Que notre sacrifice en ce jour trouve grâce devant toi.
    V/ Nous te suivons et nous cherchons ta face. R/
    V/ À toi, louange et gloire éternellement. R/
  evangelicAntiphon:
    common:
      - |-
        Dieu s’est choisi en saint Louis un homme selon son cœur : il l’a désigné comme chef sur son peuple.
  intercession:
    content: |-
      Béni sois-tu, Seigneur, pour le témoignage de vie évangélique porté par saint Louis dans l’accomplissement de sa charge.

      R/ Béni sois-tu, Seigneur.

      Pour l’amour avec lequel saint Louis a répondu à sa vocation d’époux et de père,

      Pour la ferveur avec laquelle il t’a honoré dans ton sacrement et dans tes membres souffrants,

      Pour le zèle avec lequel il a rempli sa mission de justicier et de pacificateur,

      Pour la foi avec laquelle il a pris la croix pour arracher aux infidèles la terre que tu as illuminée de ta présence,

firstVespers:
  hymn:
    - roi-des-rois-jesus-seigneur
  psalmody:
    - psalm: PSALM_111
      antiphon:
        - |-
          À pleines mains il donnait aux pauvres ; sa justice demeure à jamais.
    - psalm: PSALM_136
      antiphon:
        - |-
          Que ma langue s’attache à mon palais, si je t’oublie, Jérusalem.
    - psalm: NT_11
      antiphon:
        - |-
          Honneur et gloire au roi des siècles, au Dieu unique et immortel.
  reading:
    biblicalReference: Pr 29, 4a.14
    content: |-
      Par l’équité, un roi fait prospérer le pays. Le roi qui juge les faibles avec justice voit son trône affermi pour toujours.
  responsory: |-
    R/ Tu mets sur sa tête une couronne d’or,
    * Tu le revêts de splendeur et de gloire.
    V/ Tu mets en lui ta bénédiction pour toujours. * Tu le revêts.
    Gloire au Père. R/ Tu mets sur sa tête.
  evangelicAntiphon:
    common:
      - |-
        Plus précieuse aux yeux du roi Louis qu’une couronne d’or la couronne d’épines ; et plus que son royaume le Royaume de Dieu.
  intercession:
    content: |-
      Prions le Père des miséricordes pour tous les hommes et spécialement pour ceux qui assument la charge de guider leurs frères.

      R/ Seigneur, exauce-nous.

      Pour les chrétiens : qu’ils aient conscience de la grandeur dont les a revêtus le baptême.

      Pour les époux : qu’ils se consacrent dans la tendresse mutuelle à l’éducation de leurs enfants.

      Pour les responsables des peuples : qu’ils soient d’authentiques serviteurs de la justice et de la paix.

      Pour ceux qui meurent loin de leur famille : qu’ils soient reçus près de toi dans la sainte Jérusalem.

