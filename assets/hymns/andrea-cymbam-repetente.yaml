title: Andrea cymbam repetente laeto
author: null
context: Fête de Saint-André à Bordeaux, 1res vêpres
content: |-
    Andrea cymbam repetente laeto,
    Petrus occurit. Mihi plaude, clamat ;
    Ecce Messiae pia tecta, frater,
        Oraque vidi.

    Quid moras nectis ? properemus una ;
    Aemulis ilium pedibus sequamur,
    Quem Prophetarum chorus appetenti
        Nuntiat orbi.

    Andreae Petrus cornes it ; magistrum
    Cernit admirans, veneratur, aestu
    Suppari fervet, fierique Christi
        Ardet alumnus.

    Vix erant ambo reduces, propinquam
    Transmeat Christus maris ecce ripam :
    Audiunt fratres gemini benigna
        Voce vocantem.

    Nave dimissa, rete derelicto,
    Hi statim fiunt comités vocantis :
    Una lux ambos et in omne Christo
        Consecrat aevum.

    Patris, ac Nali, pariterque Sancti
    Spiritus numen veneretur orbis :
    Et datos terris hilari magistros
        Carmine laudet.
        
    Amen.