title: Christi multa iugo
author: null
context: Fête de Saint-André à Bordeaux, vêpres
content: |-
  Christi multa iugo dum loca subicis,
  Proconsul minitans, et rabie fremens,
  Eiurare fidem si renuas, tibi
      Spondet vincula, carceres.

  Ambis vincla, rogos ; non metuis cruces ;
  Hoc unum metuis carnificum gregi
  Ne quis te rapiat. Supplicii moram
      Partem supplicii putas.

  Vix erecta procul ligna vides crucis,
  O crux ! O bona crux ! o mihi crux, ais
  Exoptata diu ! dulce decus meum
      Cordis delicium mei !

  Per te discipulum suscipiat suum.
  Per te qui maculas criminis eluit,
  Et salvum proprii pignore sanguinis
      Humanum voluit genus.

  Christo commoriens sic pius Andreas
  Indulgere sacris pergit amoribus,
  Donec corporeo libera carcere
      Mens ad sidera demigret.

  Qui dat Martyribus vincere, laus Patri ;
  Qui dat ferre crucem, laus quoque Filio ;
  Qui das mille neccs in cruce perpeti,
      Par sit laus tibi, Spiritus.
      
  Amen.