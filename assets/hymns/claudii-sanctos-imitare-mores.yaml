title: Claudii sanctos imitare mores
content: |-
  Claudii sanctos imitare mores,
  Qui cupis vero celebrare cultu ;
  Ipse nam grato solet hos honores
       Cernere vultu.

  > %Imite la sainteté de Claude,
  > Toi qui désires le célébrer en vérité,
  > Car il a coutume de jeter sur ces honneurs
  > Un regard bienveillant.%

  Dotibus claris meritisque plenis
  Jam senes vincit, juvenis modestus,
  castus, et strictis cohibens habenis
       Corporis aestus.

  > %Par ses dons brillants et ses nombreux mérites,
  > Il surpasse déjà les vieillards,
  > ce jeune homme modeste, chaste,
  > Et qui sait maîtriser fermement les élans de la chair.%

  Pergit in silvas, fugiens tumultum,
  Factus est praestans ibi forma fratrum,
  Pastor est cura, pater est amore,
       Voce magister.

  > %Pour fuir le bruit, il s’enfonce dans les forêts ;
  > Là il devient pour ses frères un exemple incomparable,
  > Pasteur par sa sollicitude, père par son amour,
  > maître par sa parole.%

  Caelites vivens imitatus ille
  Scandit in caelum, manet illibatum
  Corpus ; hunc reddunt sibi parta mille
       Dona beatum.

  > %Lui qui, durant sa vie, a imité les saints,
  > Il monte au ciel ; son corps demeure intact ;
  > Mais ce sont les mille bienfaits qu’il prodigue,
  > qui le rendent heureux.%

  Plurimae turbae veniunt, ovantes
  Praesuli sancto pia vota reddunt,
  Cum datis multis, referunt in aedes
       Gaudia summa.

  > %Des foules, en très grand nombre, viennent dans l’acclamation,
  > Elles adressent des prières au saint protecteur,
  > Dans l’église elles joignent leurs nombreuses offrandes
  > à leur joie extrême.%

  Sed cremaverunt scelerata monstra
  Claudii corpus ! Vigiles fideles
  Brachium sanctum manibus nefandis
       Eripuerunt !

  > %Mais des criminels abominables brûlèrent
  > Le corps de Claude ; des fidèles vigilants
  > sauvèrent des mains des méchants
  > un bras du saint.%

  Sint tibi plausus, tibi sint honores,
  Dona qui servo tribuis fideli
  Et beas sanctos hominum labores
       Munere caeli.
       Amen.

  > %Pour Toi les applaudissements, à Toi les honneurs
  > O Dieu qui accordes de pareils dons à ton serviteur fidèle,
  > Et qui récompenses les saintes fatigues des hommes
  > en leur faisant cadeau du ciel.%
