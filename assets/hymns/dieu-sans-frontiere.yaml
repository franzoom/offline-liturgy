title: Dieu sans frontière
content: |-
  Dieu sans frontière,
  Soleil des nations,
  Que la terre entière
  Connaisse ton nom !
  Dieu sans frontière,
  Soleil des nations,
  Que la terre entière
  Bénisse ton nom !

  Quand l’arbre de la croix s’est dressé :
  Ton Fils a tracé parmi nous
  Le signe de l’amour jusqu’au bout,
  Afin que les hommes soient sauvés.

  La pierre du tombeau a roulé :
  La mort fut vaincue parmi nous.
  Ton Fils a remis l’homme debout
  Ainsi qu’il avait été créé.

  Un vent de création s’est levé :
  L’Esprit a soufflé parmi nous.
  L’Église a pris naissance partout :
  Ta vie sur la terre était semée.

  Le blé de nos sillons a germé :
  Saint Pierre-François parmi nous.
  Il part en Orient, donne tout,
  Afin que ton nom soit annoncé.

  Pour mettre le bon grain dans ton champ,
  Il prend l’Evangile chez nous.
  Il place le Royaume avant tout
  Et s’offre jusqu’à verser son sang.

  L’amour de ta mission porte fruit
  Chacun est témoin parmi nous.
  Le monde prend en toi l’avant-goût
  D’une autre moisson que tu mûris.
