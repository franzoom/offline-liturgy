title: Hostis tartarei victor
author: null
context: Fête de Saint-André à Bordeaux, laudes
content: |-
  Hostis tartarei victor, ab horridae,
  Vix mortis gremio, Christe, recesseras,
  In Patris gremium, discipulos reples,
      Sacri flamine Spiritus.

  Haustu munifici Numinis ebrius,
  Gentes in varias gressibus, Andrea,
  Festinas rapidis ; quo magis est ferox
      Hoc fit gens tibi carior.

  Pernix in Scythiam protinus evolas,
  Et concreta gelu pectora frigido
  Torres igne sacro. Maxima decoquit
      Ardens frigora caritas.

  Te suadente, deos Thracia fictiles
  Epirusque fugant ; et dominae Crucis
  Vexillum, quod amans undique praedicas,
      Gratis figitur arcibus.

  Sanctae mox fidei lumen Achaicis
  Caelestis tua fax inferet urbibus ;
  Exstinctamque tibi conspicient prius
      Vitam quam fidei facem.

  Supremae Triadi gloria, laus, honor,
  Quae nos christiadas lampadis illius,
  Caecis quam populis praetulit Andreas
      Puro lumine dirigit.

  Amen.