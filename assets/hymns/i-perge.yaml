title: I, perge
author: null
context: Fête de Saint-André à Bordeaux, office des lectures
content: |-
    I, perge, Christi fide cornes, vola
    Quocumque tendit : sub duce milita
    Tutus potenti. Castra miles
    Nemo sequi meliora possit.

    Petri iacentem sive levet socrum,
    Seu multa parvo millia nutriat,
    Miraculorum te suorum
    Participem iubet esse Christus.

    Mundi ruinam signaque praevia
    Tuis amanter credidit auribus ;
    Praenuntiavii destinatas
    Discipulis Dominoque mortes.

    Proh ! quantus arsit corde tuo crucis
    Amor, paratam quando sibi Ciucem
    Dixit magister ! Tune inesse
    Delicias crucibus putasti.

    Non una voto crux dabitur tuo ;
    Tibi ferendam disce prius crucem
    Duri laboris, te priusquam
    Lignea crux ferat immolandum.

    Laus summa Patri, summaque Filio,
    Sanctoque summum Spiritui decus,
    Dignes amanti per ministros
    E tenebris revocare gentes.
    Amen.