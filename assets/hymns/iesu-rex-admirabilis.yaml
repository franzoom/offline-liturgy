title: Iesu, rex admirabilis
author: null
context: Solennité du Christ-Roi
content: |-
    Iesu, rex admirabilis,
    et triumphátor nóbilis,
    dulcédo ineffábilis,
    totus desiderábilis :

    >%Jésus, le roi très admirable
    >Et le noble triomphateur,
    >La douceur que nul mot ne dit,
    >Le totalement désirable :%

    Rex virtutum, rex gloriæ,
    rex insígnis victóriæ,
    lesu, largítor grátiæ,
    honor cæléstis cúriæ :

    >%Roi des puissances, roi de gloire,
    >Roi de victoire sans égal,
    >Jésus, donateur de tout bien,
    >Honneur de l'assemblée des anges :%

    Te cæli chorus prædicat
    et tuas laudes réplicat.
    lesus orbem lætíficat
    et nos Deo pacíficat.

    >%Toi que les chœurs du ciel proclament,
    >Qu'ils ne se lassent d'acclamer,
    >Tu nous mets en paix avec Dieu,
    >Tu es, Jésus, la joie du monde.%

    lesus in pace ímperat,
    quæ omnem sensum súperat,
    hanc semper mens desíderat
    et illo frui próperat.

    >%C'est dans la paix que Jésus règne,
    >D'une paix qui passe nos sens,
    >Celle que cherchent tant les cœurs,
    >En avant-goût de la rencontre.%

    lam prosequámur láudibus
    lesum, hymnis et précibus,
    ut nos donet cæléstibus
    cum ipso frui sédibus.

    >%Dès maintenant, chantons des hymnes,
    >Louons Jésus, supplions-le
    >Pour qu'il nous donne de goûter
    >Avec lui les joies du Royaume.%

    lesu, flos matris vírginis,
    amor nostræ dulcédinis,
    laus tibi sine términis,
    regnum beatitúdinis. Amen.
    
    >%Jésus, fleur d'une vierge mère,
    >Amour pour nous plein de douceur,
    >À toi, les louanges sans fin
    >Et la royauté bienheureuse!%
