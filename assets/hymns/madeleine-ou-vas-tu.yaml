title: Madeleine, où vas-tu ?
content: |-
  Madeleine, où vas-tu ?
  Laisse-là tes parfums,
  ne vas pas au tombeau,
  car la mort est vaincue !
  Ne vas pas au tombeau,
  si Jésus n’y est plus.

  1. Ce matin le soleil
  s’est levé plus heureux.
  Sur le toit, tout à coup,
  deux oiseaux ont chanté.
  Les cyprès, fous de joie,
  ont claqué dans le vent :
  Les épées des soldats
  vont servir aux moissons.

  2. Les puissants et les rois
  sont muets de stupeur.
  Les cachots des prisons
  n’ont plus rien à cacher.
  Les mendiants et les gueux
  vont manger à leur faim.
  En riant, les boiteux
  danseront par les rues.

  3. Le gardien du jardin
  n’a pas pris ton Seigneur.
  C’est au cœur de ton cœur
  qu’il te faut le chercher,
  ne crains rien de la mort
  où son corps à dormi.
  C’est au cœur de con cœur
  que ton nom est gravé.
