title: Nous te chantons, ô Père des hommes
content: |-
  R/ Nous te chantons, ô Père des hommes,
  Tu as choisi pour ton Royaume
  Saint Claude, cet homme de foi,
  Comme un sapin, fidèle et droit.

  1. Saint Claude, ami de Dieu,
  Tu mets dans sa présence
  Ton âme de prière
  Et tu la fais chanter
  Jusqu'à nous.

  2. Saint Claude, chercheur de Dieu,
  Tu bois, dans le silence,
  L'eau vive de la grâce
  Et tu la fais jaillir
  Jusqu'à nous.

  3. Saint Claude, semeur de Dieu,
  Tu plantes l'Espérance
  Où germe la Parole
  Et tu la fais grandir
  Jusqu'à nous.

  4. Saint Claude, témoin de Dieu,
  Tu vis pour une Alliance
  Qui fonde notre Église
  Et nous la porterons
  Devant nous.
