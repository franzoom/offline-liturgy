title: Sœur Colette, Dieu t’a saisie
content: |-
  Sœur Colette, Dieu t’a saisie dans le secret de ce monde
  Sœur Colette, Dieu t’a choisie pour le royaume qu’il fonde.

  Ta vie comme un long voyage
  Dessine le chemin
  Que Dieu prend à chaque âge
  Pour nous tendre la main.

  L’esprit que tu fais revivre
  De Claire et de François
  Maintient la source vive
  D’où jaillit la foi.

  Ta voix prêche l’Évangile
  Aux pauvres comme aux rois.
  Tu te dis inutile,
  Mais Dieu parle par toi.

  De Dieu, chanter louange,
  Servir à tout instant,
  Prier pour que l’homme change
  Rien de plus important.

  A Dieu plaise notre Église
  Marchant le cœur brûlant
  Jusqu’à la table mise
  Où Jésus nous attend.
