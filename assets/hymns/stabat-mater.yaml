title: Stabat Mater dolorosa
author: Jacopone da Todi (1236-1306)
content: |-
  Stabat Mater dolorosa
  Iuxta crucem lacrimosa
  dum pendebat Filius.
  >%Debout, la Mère des douleurs,
  >se tenait en larmes au pied de la croix,
  >où son Fils était suspendu.%

  Cuius animam gementem,
  contristatam et dolentem,
  pertransivit gladius.
  >%Son âme gémissante,
  >broyée par la tristesse et la souffrance,
  >fut alors transpercée d’un glaive.%

  O quam tristis et afflicta
  fuit illa benedicta
  Mater Unigeniti.
  >%Ah! Quelle en fut pas la tristesse
  >et l’affliction de cette mère bénie
  >du Fils unique de Dieu!%

  Quæ mœrebat et dolebat,
  Pia Mater cum videbat
  Nati pœnas incliti.
  >%Quelle ne fut pas l’amertume
  >et la désolation de cette tendre mère,
  >à la vue des tortures de son auguste Fils!%

  Quis est homo qui non fleret,
  Matrem Christi si videret
  in tanto supplicio ?
  >%Quel est celui qui ne verserait des larmes,
  >en voyant la mère du Christ
  >en un tel supplice?%

  Quis non posset contristari,
  Christi Matrem contemplari
  dolentem cum Filio ?
  >%Qui pourrait, sans être ému de pitié
  >contempler la Mère du Christ
  >souffrant avec son Fils ?%

  Pro peccatis suæ gentis
  vidit Iesum in tormentis
  et flagellis subditum.
  >%Pour les péchés de son peuple
  >elle vit Jésus dans les tourments,
  >et livré au fouet.%

  Vidit suum dulcem natum
  morientem desolatum,
  dum emisit spiritum.
  >%Elle vit son doux enfant
  >mourant, abandonné
  >alors qu’il rendait l’esprit.%

  Eia Mater, fons amoris,
  me sentire vim doloris
  fac, ut tecum lugeam.
  >%Ô Mère, fontaine d’amour,
  >faites-moi sentir la violence de votre douleur
  >afin que je pleure avec vous.%

  Fac ut ardeat cor meum
  in amando Christum Deum,
  ut sibi complaceam.
  >%Faites que mon cœur brûle d’amour
  >pour le Christ, mon Dieu,
  >afin que je lui sois agréable.%

  Sancta Mater, istud agas,
  Crucifixi fige plagas
  cordi meo valide.
  >%Ô sainte Mère,
  >gravez profondément en mon cœur
  >les plaies du Crucifié.%

  Tui nati vulnerati,
  tam dignati pro me pati,
  pœnas mecum divide.
  >%De votre Fils blessé,
  >qui a daigné tant souffrir pour moi;
  >faites moi partager les peines.%

  Fac me tecum pie flere,
  Crucifixo condolere,
  donec ego vixero.
  >%Faites-moi tendrement pleurer avec vous,
  >et compatir au Crucifié
  >tant que je vivrai.%

  Iuxta crucem tecum stare,
  et me tibi sociare
  in planctu desidero.
  >%Me tenir debout tout près de la croix avec vous,
  >et m’associer à vos pleurs :
  >c’est là mon désir.%

  Virgo virginum præclara,
  mihi iam non sis amara :
  fac me tecum plangere.
  >%Ô Vierge illustre entre toutes les vierges,
  >ne me soyez pas amère,
  >faites-moi me lamenter avec vous.%

  Fac ut portem Christi mortem,
  passionis fac consortem,
  et plagas recolere.
  >%Faites que je porte la mort du Christ,
  >faites que je partage sa Passion,
  >que je garde le souvenir de ses plaies.%

  Fac me plagis vulnerari,
  fac me cruce inebriari,
  et cruore Filii.
  >%Faites que je sois blessé des ses blessures,
  >que je sois enivré de la Croix
  >et du sang répandu de votre Fils.%

  Flammis ne urar succensus
  per te Virgo, sim defensus
  in die judicii.
  >%Pour que je ne sois pas consumé par les flammes,
  >Puissé-je être défendu par vous,
  >ô Vierge au jour du jugement.%

  Christe, cum sit hinc exire,
  da per Matrem me venire
  ad palmam victoriae.
  >%Ô Christ, au sortir de cette vie,
  >donnez-moi, par votre mère,
  >de parvenir à la palme de la victoire.%

  Quando corpus morietur,
  fac ut animæ donetur
  Paradisi gloria.
  >%Quand mon corps mourra,
  >Faites qu’à mon âme soit accordée
  >la gloire du Paradis.%

  Amen