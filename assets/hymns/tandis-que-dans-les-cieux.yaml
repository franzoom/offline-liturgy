title: Tandis que dans les cieux
subtitle: paraphrase de l’ancienne « Hymnis dum resonat »
content: |-
  Tandis que dans les cieux tout n’est que chant de fête,
  Nous souffrons ici-bas encore loin du port :
  Vienne pour nous le Jour où le Christ notre Tête
  Lumière nous sera par-delà la mort.

  Les ombres d’ici-bas feront place à l’aurore :
  Succédant à la foi, plus merveilleuse encore,
  La vision du Seigneur comblera nos désirs,
  Au centuple rendant le prix de nos soupirs.

  Vous, saints élus de Dieu, qui voyez nos combats,
  Souvenez-vous de nous qui marchons sur vos pas.
  Priez le Dieu d’amour qui pour nous fut livré :
  Que nous portions du fruit jusqu’en l’éternité.

  Louange immense au Père : il nous a tout donné.
  Louange immense au Fils : il a tout restauré.
  Louange à l’Esprit-Saint, Source de sainteté.
  À Dieu soit toute gloire, et pour l’éternité.
