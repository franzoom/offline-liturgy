title: Bénédiction solennelle de la Dédicace
content: |-
  Dieu, le Seigneur du ciel et de la terre,
  vous a rassemblés aujourd’hui
  pour fêter la dédicace de cette maison de Dieu :
  qu’il multiplie sur vous la bénédiction du ciel.
  R/ Amen.

  Il a voulu rassembler en son Fils
  tous ses enfants dispersés :
  qu’il fasse de vous son temple et la demeure de l’Esprit Saint.
  R/ Amen.

  Dans la joie d’un cœur purifié,
  laissez Dieu habiter en vous,
  afin de posséder, avec tous les saints,
  l’héritage de la béatitude éternelle.
  R/ Amen.

  Et que la bénédiction de Dieu tout-puissant,
  le Père, le Fils ✠ et le Saint-Esprit,
  descende sur vous et y demeure toujours.
  R/ Amen.
