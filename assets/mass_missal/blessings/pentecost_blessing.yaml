title: Bénédiction solennelle de la Pentecôte
content: |-
  Aujourd’hui, Dieu le Père de toute lumière a envoyé l’Esprit Saint
  au cœur des disciples du Christ, il les a illuminés :
  Que ce même Esprit vous pénètre et sanctifie en vous ses dons.
  R/ Amen

  Que le feu d’en haut venu sur les disciples consume tout mal au fond de vos cœurs
  et vous fasse porter au monde sa lumière.
  R/ Amen

  C’est l’Esprit qui a rassemblé des hommes de toutes langues,
  dans la profession de la même foi :
  qu’il vous garde fidèles à cette foi, et dans l’espérance du jour de Dieu.
  R/ Amen

  Et que Dieu tout-puissant vous bénisse,
  le Père, le Fils ✠ et le Saint-Esprit
  R/ Amen.