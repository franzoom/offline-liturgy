"PE réconciliation": |-
  [rubric]Étendant les mains, le prêtre dit:[/rubric]
  Le Seigneur soit avec vous. R/ Et avec votre esprit.
  Élevons notre cœur. R/ Nous le tournons vers le Seigneur.
  Rendons grâce au Seigneur notre Dieu. R/ Cela est juste et bon.>

  Vraiment il est juste et bon
  >de toujours te rendre grâce,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Car tu ne cesses de nous appeler
  >à une vie plus belle;
  toi qui est riche en miséricorde,
  >sans te lasser tu offres ton pardon
  et tu invites les péchers
  >à s’en remettre à ta seule bonté.

  Bien loin de te détourner de nous,
  >aqui avons si souvent rompu ton Alliance,
  tu as noué avec la famille humain
  >par ton Fils Jésus notre Rédempteur
  un nouveau lien de charité,
  >si fort que rien ne pourra le défaire.

  Et maintenant que tu accordes à ton peuple
  >un temps de grâ ce et de réconciliation,
  tu lui donnes, par la conversion du coeur,
  >de mettre son espérance dans le Christ Jésus
  et de se dévouer au service de tous les hommes
  >en se livrant davantage à l’Esprit Saint.

  C’est pourquoi,
  >remplis d’admiration,
  >nous voulons joindre nos voix
  >aux voix innombrables du cciel,
  pour magnifier la puissance de ton amour
  >dans la joie de notre salut,
  et sans fin nous proclamons:

  Saint! Saint! Saint, le Seigneur, Dieu de l’univers!
  Le ciel et la terre sont remplis de ta gloire.
  >Hosanna au plus haut des cieux.
  Béni soit celui qui vient au nom du Seigneur.
  >Hosanna au plus haut des cieux.

  [rubric]Le prêtre dit, les mains étendues:[/rubric]
  Toi, Seigneur, tu es vraiment Saint,
  >tu es toujours à l’œuvre,
  >depuis les origines du monde,
  pour que l’homme devienne saint
  >comme toi-même es Saint.

  [rubric]Il joint les mains puis, les tenant étendues sur les offrandes, il dit :[/rubric]
  Regarde, nous t’en prions, les offrandes de ton peuple,
  >et répands sur elles la puissance de ton Esprit:
  [rubric]>Il joint les mains puis il fait le signe de croix sur le pain et le calice, en disant:[/rubric]
  qu’elles deviennent le Corps [rubric]✚[/rubric] et le Sang
  [rubric]>Il joint les mains.[/rubric]
  de ton Fils bien-aimé, Jésus, le Christ,
  en qui, nous aussi, nous sommes tes fils.

  Nous qui étions perdus,
  >incapables de nous rapprocher de toi,
  >tu nous as aimés du plus grand amour>:
  ton Fils, le seul Juste,
  >s’est livré lui-même à la mort
  >et n’a pas refusé d’être cloué pour nous
  >sur le bois de la croix.
  Mais avant que ses bras étendus
  >dessinent entre ciel et terre
  >le signe indélébile de ton Alliance,
  il voulut célébrer la Pâque
  >au milieu de ses disciples.

  [rubric]Dans les formules qui suivent, les paroles du Seigneur seront prononcées distinctement et clairement, comme le requiert la nature de ces paroles.[/rubric]
  Au cours du repas,
  [rubric]Il prend le pain et, le tenant un peu au-dessus de l’autel, il continue:[/rubric]
  >il prit le pain,
  en te rendant grâce il dit la bénédiction,
  >il rompit le pain,
  >et le donna à ses disciples, en disant:

  [rubric]Il s’incline un peu.[/rubric]

  [center]« PRENEZ, ET MANGEZ-EN TOUS:
  CECI EST MON CORPS
  LIVRÉ POUR VOUS. »[/center]

  [rubric]Il montre au peuple l’hostie consacrée, la repose sur la patène, et adore en faisant la génuflexion.[/rubric]

  [rubric]Ensuite, il continue:[/rubric]
  De même, après le repas,
  >sachant qu’il allait tout réconcilier en lui
  >par son sang répandu sur la croix,
  [rubric]Il prend le calice et, le tenant un peu au-dessus de l’autel, il continue:[/rubric]
  il prit la coupe remplie de vin,
  >et, te rendant grâce à nouveau,
  >il la fit passer à ses disciples, en disant:

  [rubric]Il s’incline un peu.[/rubric]

  [center]« PRENEZ, ET BUVEZ-EN TOUS,
  CAR CECI EST LA COUPE DE MON SANG,
  LE SANG DE L’ALLIANCE NOUVELLE ET ÉTERNELLE,
  QUI SERA VERSÉ POUR VOUS ET POUR LA MULTITUDE
  EN RÉMISSION DES PÉCHÉS.
  VOUS FEREZ CELA EN MÉMOIRE DE MOI.»[/center]

  [rubric]Il montre le calice au peuple, le dépose sur le corporal, et adore en faisant la génuflexion.[/rubric]

  [rubric]Puis il introduit une des acclamations suivantes:[/rubric]
  Il est grand, le mystère de la foi.
  R/ Nous annonçons ta mort, Seigneur Jésus,
  >nous proclamons ta résurrection,
  >nous attendons ta venue dans la gloire.

  [section]

  [rubric]ou bien:[/rubric]
  Acclamons le mystère de la foi:
  R/ Quand nous mangeons ce pain
  >et buvons à cette coupe,
  >nous annonçons ta mort, Seigneur ressuscité,
  >et nous attendons que tu viennes.

  [section]

  [rubric]ou bien:[/rubric]
  Qu’il soit loué, le mystère de la foi:
  R/ Sauveur du monde, sauve-nous!
  >Par ta croix et ta résurrection, tu nous as libérés.

  [section]

  [rubric]ou bien:[/rubric]
  Proclamons le mystère de la foi:
  R/ Gloire à toi qui étais mort,
  >gloire à toi qui es vivant,
  >notre Sauveur et notre Dieu:
  >viens, Seigneur Jésus.

  [section]

  [rubric]Ensuite, les mains étendues, le prêtre dit:[/rubric]
  En faisant mémoire de ton Fils Jésus, le Christ,
  >notre Pâque et notre paix définitive,
  nous célébrons sa mort
  >et sa résurrection du séjour des morts,
  et, en appelant le jour béni de sa venue
  nous te présentons, Dieu de fidélité et de miséricorde,
  >Celui qui s’est offert lui-même en sacrifice
  >pour réconcilier l’humanité avec toi.

  Regarde avec bonté, Père très aimant,
  >ceux que tu attires à toi,
  >par le sacrifice de ton propre Fils:
  accorde à ceux qui ont part à un seul pain
  >et une seule coupe
  d’être rassemblés, par la force de l’Esprit Saint,
  >en un seul corps dans le Christ
  >par qui est abolie toute division.

  Daigne nous garder toujours
  >en communion d’esprit et de cœur
  >avec notre Pape [rubric]N.[/rubric] et notre Évêque [rubric]N.[/rubric]

  Aide-nous à préparer ensemble la venue de ton règne
  >jusqu’à l’heure où nous nous tiendrons devant toi,
  >saints parmi les saints dans le ciel,
  avec la bienheureuse Vierge Marie, Mère de Dieu,
  >les bienheureux Apôtres et tous les saints,
  avec nos frères et sœurs défunts,
  >que nous confions humblement à ta miséricorde.

  Alors, enfin libérés de la corruption qui nous blesse,
  >nous deviendrons une création nouvelle,
  et, avec joie, nous te chanterons l’action de grâce
  [rubric]Il joint les mains.[/rubric]
  du Christ à jamais vivant.

  [rubric]Il prend la patène avec l’hostie, ainsi que le calice, et les élevant ensemble, il dit:[/rubric]
  Par lui, avec lui et en lui,
  >à toi, Dieu le Père tout-puissant,
  >dans l’unité du Saint-Esprit,
  tout honneur et toute gloire,
  >pour les siècles des siècles. [rubric]℞[/rubric]>Amen.
