section1: |-
  [rubric]Le prêtre dit, les mains étendues :[/rubric]
  Toi, Père très aimant,
  >nous te prions et te supplions
  par Jésus Christ, ton Fils, notre Seigneur,
  [rubric]Il joint les mains et dit :[/rubric]
  d’accepter
  [rubric]Puis il fait un signe de croix sur le pain et le calice, et dit :[/rubric]
  >et de bénir [rubric]✚[/rubric] ces dons, ces offrandes,
  sacrifice pur et saint,
  [rubric]Il étend les mains et continue :[/rubric]
  >que nous te présentons
  >avant tout pour ta sainte Église catholique :
  accorde-lui la paix et protège-la,
  >daigne la rassembler dans l’unité
  >et la gouverner par toute la terre ;
  nous les présentons
  >en union avec ton serviteur notre pape [rubric]N.[/rubric],
  >notre évêque [rubric]N.[/rubric]
  et tous ceux qui gardent fidèlement
  >la foi catholique reçue des Apôtres.

  [rubric]COMMÉMORATION DES VIVANTS[/rubric]
  Souviens-toi, Seigneur,
  de tes serviteurs et de tes servantes [rubric]([/rubric]de [rubric]N.[/rubric] et de [rubric]N.)[/rubric],
  [rubric]Il joint les mains, prie en silence. Puis il reprend, les mains étendues :[/rubric]
  et de tous ceux qui sont ici réunis,
  >dont tu connais la foi et l’attachement.
  Nous t’offrons pour eux,
  >ou ils t’offrent pour eux-mêmes et tous les leurs
  >ce sacrifice de louange,
  pour leur propre rédemption,
  >pour la paix, et le salut qu’ils espèrent ;
  ils te rendent cet hommage,
  >à toi, Dieu éternel, vivant et vrai.

  [rubric]DURANT L’ACTION[/rubric]
section2: |-
  et celle de saint Joseph, son époux,
  >des bienheureux Apôtres et martyrs
  >Pierre et Paul, André,
  >[rubric]([/rubric]%Jacques et Jean, Thomas, Jacques et Philippe, %
  % >Barthélemy et Matthieu, Simon et Jude, %
  % >Lin, Clet, Clément, Sixte, Corneille et Cyprien, %
  % >Laurent, Chrysogone, Jean et Paul, Côme et Damien%[rubric]) [/rubric]
  >et de tous les saints,
  nous t’en supplions :
  >accorde-nous, par leur prière et leurs mérites,
  >d’être toujours et partout,
  >forts de ton secours et de ta protection.
  >[rubric]([/rubric]Par le Christ, notre Seigneur. Amen.[rubric])[/rubric]

  [rubric]Les mains étendues il continue :[/rubric]
  Voici donc l’offrande que nous présentons devant toi,
  >nous, tes serviteurs, et ta famille entière :
  >Seigneur, dans ta bienveillance, accepte-la.
  Assure toi-même la paix de notre vie,
  >arrache-nous à la damnation éternelle
  >et veuille nous admettre au nombre de tes élus.
  >[rubric]Il joint les mains.[/rubric]
  [rubric]([/rubric]Par le Christ, notre Seigneur. Amen.[rubric])[/rubric]

  [section]

  [rubric]De la Vigile pascale jusqu’au 2[/rubric][rubric]e[/rubric][rubric] dimanche de Pâques inclus :[/rubric]
  Voici donc l’offrande que nous présentons devant toi,
  >nous, tes serviteurs, et ta famille entière,
  particulièrement pour les baptisés de Pâques
  >que tu as fait renaître de l’eau et de l’Esprit Saint,
  >en pardonnant tous leurs péchés.
  Nous t’en prions, Seigneur,
  >dans ta bienveillance, accepte cette offrande.
  Assure toi-même la paix de notre vie,
  >arrache-nous à la damnation éternelle
  >et veuille nous admettre au nombre de tes élus.
  [rubric]Il joint les mains.[/rubric]
  [rubric]([/rubric]Par le Christ, notre Seigneur. Amen.[rubric])[/rubric]

  [section]

  [rubric]Tenant les mains étendues sur les offrandes, il dit :[/rubric]
  Seigneur Dieu, nous t’en prions,
  >daigne bénir et accueillir cette offrande,
  accepte-la pleinement,
  >rends-la parfaite et digne de toi :
  qu’elle devienne pour nous
  le corps et le sang de ton Fils bien-aimé,
  >Jésus, le Christ, notre Seigneur.
  [rubric]Il joint les mains.[/rubric]

  [rubric]Dans les formules qui suivent, les paroles du Seigneur seront prononcées ou chantées de façon distincte et claire, comme le requiert la nature de ces paroles.[/rubric]

  La veille de sa passion,
  [rubric]Il prend le pain et, le tenant un peu au-dessus de l’autel, il continue :[/rubric]
  il prit le pain dans ses mains très saintes
  [rubric]Il élève les yeux. [/rubric]
  et, les yeux levés au ciel,
  >vers toi, Dieu, son Père tout-puissant,
  en te rendant grâce il dit la bénédiction,
  >il rompit le pain,
  et le donna à ses disciples, en disant :
  [rubric]Il s’incline un peu.[/rubric]

  [center]>« PRENEZ, ET MANGEZ-EN TOUS :
  CECI EST MON CORPS
  LIVRÉ POUR VOUS. »[/center]

  [rubric]Il montre au peuple l’hostie consacrée, la repose sur la patène, et adore en faisant la génuflexion.[/rubric]

  [rubric]Ensuite, il continue :[/rubric]
  De même, après le repas,
  [rubric]Il prend le calice et, le tenant un peu au-dessus de l’autel, il continue :[/rubric]
  il prit cette coupe incomparable dans ses mains très saintes ;
  et, te rendant grâce à nouveau, il dit la bénédiction,
  et donna la coupe à ses disciples, en disant :
  [rubric]Il s’incline un peu.[/rubric]

  « PRENEZ, ET BUVEZ-EN TOUS,
  CAR CECI EST LA COUPE DE MON SANG,
  LE SANG DE L’ALLIANCE NOUVELLE ET ÉTERNELLE,
  QUI SERA VERSÉ POUR VOUS ET POUR LA MULTITUDE
  EN RÉMISSION DES PÉCHÉS,
  VOUS FEREZ CELA EN MÉMOIRE DE MOI. »

  [rubric]Il montre le calice au peuple, le dépose sur le corporal, et adore en faisant la génuflexion.[/rubric]

  [rubric]Puis il introduit une des acclamations suivantes :[/rubric]
  Il est grand, le mystère de la foi.
  R/ Nous annonçons ta mort, Seigneur Jésus,
  nous proclamons ta résurrection,
  nous attendons ta venue dans la gloire.

  [rubric]ou bien :[/rubric]
  Acclamons le mystère de la foi :
  R/ Quand nous mangeons ce pain
  >et buvons à cette coupe,
  >nous annonçons ta mort, Seigneur ressuscité,
  >et nous attendons que tu viennes.

  [rubric]ou bien :[/rubric]
  Qu’il soit loué, le mystère de la foi :
  R/ Sauveur du monde, sauve-nous !
  >Par ta croix et ta résurrection, tu nous as libérés.

  [rubric]ou bien :[/rubric]
  Proclamons le mystère de la foi :
  R/ Gloire à toi qui étais mort,
  >gloire à toi qui es vivant,
  >notre Sauveur et notre Dieu :
  >viens, Seigneur Jésus.

  [section]

  [rubric]Ensuite, les mains étendues, le prêtre dit :[/rubric]
  Voilà pourquoi nous, tes serviteurs,
  >et ton peuple saint avec nous,
  faisant mémoire
  >de la passion bienheureuse de ton Fils,
  >Jésus, le Christ, notre Seigneur,
  >de sa résurrection du séjour des morts
  >et de sa glorieuse ascension dans le ciel,
  nous te présentons, Dieu de gloire et de majesté,
  >cette offrande
  >prélevée sur les biens que tu nous donnes,
  le sacrifice pur et saint, le sacrifice parfait,
  >pain de la vie éternelle et coupe du salut.

  [rubric]Il continue :[/rubric]
  Et comme il t’a plu d’accueillir
  >les présents de ton serviteur Abel le juste,
  >le sacrifice d’Abraham, notre Père dans la foi,
  et celui que t’offrit Melkisédek, ton grand prêtre,
  >oblation sainte et immaculée,
  regarde ces offrandes avec amour
  >et, dans ta bienveillance, accepte-les.

  [rubric]Incliné, les mains jointes, il continue :[/rubric]
  Nous t’en supplions, Dieu tout-puissant :
  qu’elles soient portées
  >par les mains de ton saint Ange
  en présence de ta gloire,
  >sur ton autel céleste,
  afin qu’en recevant ici,
  >par notre communion à l’autel,
  >le Corps et le Sang très saints de ton Fils,
  [rubric]Il se redresse et se signe en disant :[/rubric]
  nous soyons comblés de la grâce
  >et de toute bénédiction du ciel.
  [rubric]([/rubric]Par le Christ, notre Seigneur. Amen.[rubric])[/rubric]

  [rubric]COMMÉMORATION DES FIDÈLES DÉFUNTS[/rubric]

  [rubric]Les mains étendues, il dit :[/rubric]
  Souviens-toi aussi, Seigneur,
  de tes serviteurs et de tes servantes [rubric]([/rubric]de [rubric]N.[/rubric] et de [rubric]N.)[/rubric],
  qui nous ont précédés,
  >marqués du signe de la foi,
  et qui dorment dans la paix.
  [rubric]Il joint les mains et prie en silence quelques instants pour les défunts>dont il porte l’intention.[/rubric]

  [rubric]Puis il reprend, les mains étendues :[/rubric]
  Pour eux et pour tous ceux qui reposent dans le Christ,
  >nous implorons ta bonté, Seigneur :
  qu’ils demeurent dans la joie,
  >la lumière et la paix.
  [rubric]Il joint les mains.[/rubric]
  [rubric]([/rubric]Par le Christ, notre Seigneur. Amen.[rubric])[/rubric]

  [rubric] ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿[/rubric]
  [rubric]Il se frappe la poitrine avec la main droite, en disant :[/rubric]
  Et nous pécheurs, tes serviteurs,
  [rubric]Il étend les mains et continue :[/rubric]
  >qui mettons notre espérance
  >en ta miséricorde inépuisable,
  admets-nous dans la communauté
  >des saints apôtres et martyrs,
  >avec Jean Baptiste, Étienne, Matthias et Barnabé,
  >[rubric]([/rubric]%Ignace, Alexandre, Marcellin et Pierre,%
  %>Félicité et Perpétue, Agathe, Lucie,%
  %>Agnès, Cécile, Anastasie,%[rubric])[/rubric]
  >et tous les saints ;
  nous t’en prions, accueille-nous dans leur compagnie,
  >sans nous juger sur le mérite
  >mais en accordant largement ton pardon.
  [rubric]Il joint les mains.[/rubric]
  Par le Christ, notre Seigneur.>

  [rubric]Il continue :[/rubric]
  Par lui, tu ne cesses de créer tous ces biens,
  >tu les sanctifies, leur donnes la vie,
  >les bénis, et nous en fais le don.

  [rubric]>Il prend la patène avec l’hostie, ainsi que le calice, et, les élevant ensemble, il dit :[/rubric]
  Par lui, avec lui et en lui,
  >à toi, Dieu le Père tout-puissant,
  >dans l’unité du Saint-Esprit,
  tout honneur et toute gloire,
  >pour les siècles des siècles.>

  [rubric]Le peuple acclame :[/rubric]
  R/ Amen.>