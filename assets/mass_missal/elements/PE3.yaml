section1: |-
  [rubric]Le prêtre dit, les mains étendues :[/rubric]
  Tu es vraiment saint, Dieu de l’univers,
  >et il est juste que toute la création proclame ta louange,
  car c’est toi qui donnes la vie,
  >c’est toi qui sanctifies toutes choses,
  >par ton Fils, Jésus Christ, notre Seigneur,
  >avec la puissance de l’Esprit Saint ;
  et tu ne cesses de rassembler ton peuple,
  >afin que, du levant au couchant du soleil,
  >une offrande pure soit présentée à ton nom.

  [rubric]Il rapproche les mains, et en les tenant étendues sur les offrandes, il dit :[/rubric]
section2: |-
  Sanctifie-les par ton Esprit
  pour qu’elles deviennent
  le Corps [rubric]✚[/rubric] et le Sang de ton Fils,
  Jésus Christ, notre Seigneur,
  qui nous a dit de célébrer ce mystère.

  [rubric]Dans les formules qui suivent, les paroles du Seigneur seront prononcées distinctement et clairement.[/rubric]
  La nuit même où il fut livré, il prit le pain,
  en te rendant grâce il dit la bénédiction,
  il rompit le pain,
  et le donna à ses disciples, en disant :

  [center]« PRENEZ, ET MANGEZ-EN TOUS :
  CECI EST MON CORPS
  LIVRÉ>POUR VOUS. »[/center]

  [rubric]Il montre au peuple l’hostie consacrée, la repose sur la patène, et adore en faisant la génuflexion.
  Ensuite il continue :[/rubric]

  De même, après le repas,
  >il prit la coupe ;
  en te rendant grâce dit la bénédiction,
  et donna la coupe à ses disciples, en disant :

  [center]« PRENEZ, ET BUVEZ-EN TOUS,
  CAR CECI EST LA COUPE DE MON SANG,
  LE SANG DE L’ALLIANCE NOUVELLE ET>ÉTERNELLE,
  QUI SERA VERSÉ>POUR VOUS ET POUR LA MULTITUDE
  EN RÉMISSION DES PÉCHÉS,
  VOUS FEREZ CELA EN MÉMOIRE DE MOI. »[/center]

  [rubric]Il montre la calice au peuple, le dépose sur le corporal et adore en faisant la génuflexion.[/rubric]
  [rubric]Puis il introduit une des acclamations suivantes :[/rubric]
  Il est grand, le mystère de la foi.
  R/ Nous annonçons ta mort, Seigneur Jésus,
  nous proclamons ta résurrection,
  nous attendons ta venue dans la gloire.

  [rubric]ou bien :[/rubric]
  Acclamons le mystère de la foi :
  R/ Quand nous mangeons ce pain
  >et buvons à cette coupe,
  >nous annonçons ta mort, Seigneur ressuscité,
  >et nous attendons que tu viennes.

  [rubric]ou bien :[/rubric]
  Qu’il soit loué, le mystère de la foi :
  R/ Sauveur du monde, sauve-nous !
  >Par ta croix et ta résurrection, tu nous as libérés.

  [rubric]ou bien :[/rubric]
  Proclamons le mystère de la foi :
  R/ Gloire à toi qui étais mort,
  >gloire à toi qui es vivant,
  >notre Sauveur et notre Dieu :
  >viens, Seigneur Jésus.

  [rubric]Ensuite, les mains étendues, le prêtre dit :[/rubric]
  En faisant ainsi mémoire de ton Fils,
  de sa passion qui nous sauve,
  de sa glorieuse résurrection
  et de son ascension dans le ciel,
  >alors que nous attendons son dernier avènement,
  nous t’offrons, Seigneur, en action de grâce,
  >ce sacrifice vivant et saint.

  Regarde, nous t’en prions,
  >l’oblation de ton Église,
  et daigne y reconnaître ton Fils qui, selon ta volonté,
  >s’est offert en sacrifice pour nous réconcilier avec toi.
  Quand nous serons nourris de son Corps et de son Sang,
  >et remplis de l’Esprit Saint,
  accorde-nous d’être un seul corps et un seul esprit
  >dans le Christ.

  Que l’Esprit Saint fasse de nous
  >une éternelle offrande à ta gloire,
  pour que nous obtenions un jour l’héritage promis,
  >avec tes élus :
  en premier lieu la bienheureuse Vierge Marie,
  >Mère de Dieu,
  avec saint Joseph, son époux,
  les bienheureux Apôtres, les glorieux martyrs,
  (saint [rubric]N.[/rubric]) et tous les saints,
  >qui ne cessent d’intercéder auprès de toi
  >et nous assurent de ton secours.

  Et maintenant nous te supplions, Seigneur :
  >par le sacrifice qui nous réconcilie avec toi,
  >étends au monde entier le salut et la paix.
  Affermis ton Église, en pèlerinage sur la terre,
  >dans la foi et la charité,
  en union avec ton serviteur notre pape [rubric]N.[/rubric],
  >et notre évêque [rubric]N.[/rubric],
  l’ensemble des évêques, les prêtres, les diacres,
  >et tout le peuple que tu as racheté.

  [section]

  [rubric]De Veillée pascale jusqu’au 2e dimanche de Pâques inclus, on peut ajouter :[/rubric]
  ►>Souviens-toi des baptisés de Pâques
  >que tu as fait renaître de l’eau et de l’Esprit Saint
  pour une vie nouvelle dans le Christ.>

  [section]

  Écoute, en ta bonté, les prières de ta famille,
  >que tu as voulu rassembler devant toi.
  Dans ta miséricorde, ramène à toi, Père très aimant,
  >tous tes enfants dispersés.

  [rubric]► >Aux messes pour des défunts, intercession prope.[/rubric]

  Pour nos frères et sœurs défunts,
  >et pour tous ceux qui ont quitté ce monde
  >et trouvent grâce devant toi,
  >nous te prions :
  en ta bienveillance,
  >accueille-les dans ton royaume,
  où nous espérons être comblés de ta gloire,
  >tous ensemble et pour l’éternité,
  par le Christ, notre Seigneur,
  >par qui tu donnes au monde
  >toute grâce et tout bien.

  [section]

  [center]>INTERCESSION PROPRE AUX MESSES DES DÉFUNTS>[/center]

  ►>Souviens-toi de [rubric]N.[/rubric] ou celui [rubric]([/rubric]celle[rubric])[/rubric]
  >qui a quitté ce monde [rubric]([/rubric]aujourd’hui[rubric])[/rubric]
  >et que tu appelles auprès de toi.
  Puisqu’il [rubric]([/rubric]elle[rubric])[/rubric] a été unie[rubric]([/rubric]e[rubric])[/rubric] à la mort de ton Fils,
  accorde-lui de participer à sa résurrection
  >le jour où le Christ ressuscitera dans la chair
  >ceux qui sont morts,
  et transformera nos pauvres corps
  >à l’image de son corps glorieux.

  Souviens-toi aussi de nos frères et sœurs défunts,
  >souviens-toi de tous ceux qui ont quitté ce monde
  >et trouvent grâce devant toi :
  en ta bienveillance, reçois-les dans ton Royaume,
  >où nous espérons être comblés de ta gloire,
  >tous ensemble et pour l’éternité,
  >quand tu essuieras toute larme de nos yeux ;
  en te voyant, toi notre Dieu, tel que tu es,
  >nous te serons semblables éternellement
  >et, sans fin, nous chanterons ta louange,
  par le Christ, notre Seigneur,
  >par qui tu donnes au monde
  >toute grâce et tout bien.

  [section]

  [rubric]Il prend la patène avec l’hostie, ainsi que le calice, et, les élevant ensemble, il dit :[/rubric]
  Par lui, avec lui et en lui,
  >à toi, Dieu le Père tout-puissant,
  >dans l’unité du Saint Esprit,
  tout honneur et toute gloire,
  >pour les siècles des siècles.
  R/ Amen.
