communion: |-
  [rubric]Lorsqu’il a déposé le calice et la patène, le prêtre, les mains jointes, introduit la prière du Seigneur en disant, par exemple:[/rubric]
  Comme nous l’avons appris du Sauveur
  et selon son commandement, nous osons dire:

  [section]

  [rubric]ou bien:[/rubric]
  Unis dans le même Esprit,
  nous pouvons dire avec confiance
  la prière que nous avons reçue du Sauveur:

  [section]

  [rubric]Il étend les mains, et, avec le peuple, il continue:[/rubric]
  Notre Père, qui es aux cieux,
  que ton nom soit sanctifié;
  que ton règne vienne,
  que ta volonté soit faite sur la terre comme au ciel.
  Donne-nous aujourd’hui notre pain de ce jour.
  Pardonne-nous nos offenses,
  comme nous pardonnons aussi à ceux qui nous ont offensés.
  Et ne nous laisse pas entrer en tentation,
  mais délivre-nous du Mal.

  [rubric]Les mains étendues, le prêtre, seul, continue:[/rubric]
  Délivre-nous de tout mal, Seigneur,
  et donne la paix à notre temps:
  soutenus par ta miséricorde,
  nous serons libérés de tout péché,
  >à l’abri de toute épreuve,
  nous qui attendons que se réalise
  >cette bienheureuse espérance:
  >l’avènement de Jésus-Christ, notre Sauveur.

  [rubric]Il joint les mains. Le peuple>conclut la prière par l’acclamation:[/rubric]
  Car c’est à toi qu’appartiennent le règne,
  la puissance et la gloire, pour les siècles des siècles.

  [rubric]Ensuite, les mains étendues, le prêtre dit à voix haute:[/rubric]
  Seigneur Jésus Christ,
  tu as dit à tes Apôtres:
  « Je vous laisse la paix,
  >je vous donne ma paix »;
  ne regarde pas nos péchés>mais la foi de ton Église;
  pour que ta volonté s’accomplisse,
  >donne-lui toujours cette paix,
  et conduis-la vers l’unité parfaite,
  [rubric]Il joint les mains.[/rubric]
  toi qui vis et règnes pour les siècles des siècles.

  [rubric]Le peuple répond:[/rubric]
  ℞>Amen.

  [rubric]Le prêtre, étendant les mains, ajoute:[/rubric]
  Que la paix du Seigneur soit toujours avec vous.
  [rubric]Il joint les mains. Le peuple répond:[/rubric]
  ℞>Et avec votre esprit.

  [rubric]Ensuite, si cela convient, le diacre ou le prêtre ajoute, par example:[/rubric]
  Dans la charité du Christ,>donnez-vous la paix.
  [rubric]Et tous se manifestent la paix et la charité mutuelles selon les coutumes locales.
  Le prêtre donne la paix au diacre ou au ministre.[/rubric]

  [rubric]Puis il prend le pain consacré, le rompt au-dessus de la patène, et en met un fragment dans le calice, en disant à voix basse:>[/rubric]
  %Que le Corps et le Sang de notre Seigneur Jésus Christ,
  réunis en cette coupe,
  nourrissent en nous la vie éternelle.%

  [rubric]Pendant ce temps on chante ou on dit:[/rubric]
  Agneau de Dieu, qui enlèves les péchés du monde,
  prends pitié de nous.

  Agneau de Dieu, qui enlèves les péchés du monde,>
  prends pitié de nous.

  Agneau de Dieu, qui enlèves les péchés du monde,
  donne-nous la paix.

  [rubric]Cette invocation peut être répétée plusieurs fois si la fraction du pain se prolonge. La dernière fois on dit:[/rubric]>donne-nous la paix [rubric]([/rubric]donna nobis pacem[rubric]).[/rubric]

  [rubric]Puis, les mains jointes, le prêtre dit ensuite à voix basse l’une des deux prières suivantes:[/rubric]
  %Seigneur Jésus Christ, Fils du Dieu vivant,
  selon la volonté du Père et avec la puissance du Saint-Esprit,
  >tu as donné, par ta mort, la vie au monde;
  que ton Corps et ton Sang très saints
  >me délivrent de mes péchés et de tout mal;
  fais que je demeure fidèle à tes commandements
  >et que jamais je ne sois séparé de toi.%

  [rubric]ou bien:[/rubric]
  %Seigneur Jésus Christ,
  que cette communion à ton Corps et à ton Sang
  >n’entraîne pour moi ni jugement ni condamnation;
  mais que, par ta bonté, elle soutienne mon esprit et mon corps
  >et me donne la guérison.%

  [rubric]Le prêtre fait la génuflexion, prend l’hostie et, la tenant un peu élevée au-dessus de la patène ou du calice, tourné vers le peuple, dit à voix haute:[/rubric]
  Voici l’Agneau de Dieu,
  voici celui qui enlève les péchés du monde.
  Heureux les invités au repas des noces de l’Agneau!

  [rubric]Et il ajoute, avec le peuple, une seule fois:[/rubric]
  Seigneur,>je ne suis pas digne de te recevoir;
  mais dis seulement une parole,>et je serai guéri.

  [rubric]Puis le prêtre, tourné vers l’autel, dit tout bas:[/rubric]
  %Que le Corps du Christ me garde pour la vie éternelle.%
  [rubric]Et il consomme avec respect le Corps du Christ.[/rubric]

  [rubric]Ensuite, il prend le calice, et dit tout bas:[/rubric]
  %Que le Sang du Christ me garde pour la vie éternelle.%
  [rubric]Et il boit avec respect le Sang du Christ.[/rubric]

  [rubric]Il prend alors la patène ou le ciboire, s’approche des communiants; il montre à chacun le pain consacré en l’élevant légèrement, et dit:[/rubric]
  Le Corps du Christ.
  [rubric]Le communiant répond:[/rubric]
  Amen
  [rubric]et il communie.[/rubric]

  [rubric]Si le diacre distribue la communion, il agit de la même manière.[/rubric]

  [rubric]Pour la communion sous les deux espèces, on observera le rite prévu.[/rubric]

  [rubric]Pendant que le prêtre communie au Corps du Christ, on commence le chant de communion.[/rubric]

  [rubric]Lorsque la distribution de la communion est achevée, le prêtre, le diacre ou l’acolyte purifie la patène au-dessus du calice, et le calice lui-même.[/rubric]

  [rubric]Au moment où le prêtre fait la purification, il dit tout bas:[/rubric]
  %Puissions-nous accueillir d’un cœur pur, Seigneur,
  >ce que notre bouche a reçu,
  et trouver dans cette communion d’ici-bas
  >la guérison pour la vie éternelle.%

  [rubric]Le prêtre peut alors retourner à son siège. On peut rester en silence un certain temps. On peut chanter un psaume ou un cantique de louange ou une hymne.[/rubric]

  [center][rubric]PRIÈRE APRÈS LA COMMUNION[/rubric][/center]

  [rubric]Ensuite, debout à l’autel ou au siège, le prêtre dit:[/rubric]

  Prions ensemble
  [rubric]ou[/rubric]
  Prions
  [rubric]ou[/rubric]
  Prions le Seigneur.

  [rubric]Et tous en silence avec le prêtre pendant quelque temps, à moins qu’on ait gardé le silence précédemment. Puis le prêtre, les mains étendues, dit la prière après la communion.[/rubric]

  [rubric]Habituellement elle se termine ainsi:[/rubric]
  Par le Christ, notre Seigneur.

  [rubric]Si elle s’adresse au Père, avec mention du Fils à la fin:[/rubric]
  Lui qui vit et règne>pour les siècles des siècles.

  [rubric]Si elle s’adresse au Fils:[/rubric]
  Toi qui vis et règnes pour les siècles des siècles.

  [rubric]À la fin de la prière, le peuple dit l’acclamation:[/rubric]
  Amen.
