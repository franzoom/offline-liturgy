conclusion: |-
  [rubric]Si c’est nécessaire, on fait alors brièvement les annonces pour la communauté présente.[/rubric]

  [rubric]On fait ensuite le renvoi. Le prêtre, tourné vers le peuple, dit en étendant les mains:[/rubric]
  Le Seigneur soit avec vous.
  [rubric]Le peuple répond:[/rubric]
  R/ Et avec votre esprit.

  [rubric]Le prêtre bénit le peuple, en disant:[/rubric]
  Que Dieu tout-puissant vous bénisse,
  le Père,
  le Fils
  [rubric]✚[/rubric]>et le Saint-Esprit.
  [rubric]Le peuple répond:[/rubric]
  R/ Amen.

  [rubric]Certains jours et à certaines occasions, on pourra, selon les rubriques, faire précéder cette bénédiction par une formule plus solennelle ou par une prière sur le peuple.[/rubric]

  [rubric]Puis le diacre, ou le prêtre lui-même, dit:[/rubric]
  Allez, dans la paix du Christ.
  [rubric]ou bien:[/rubric]
  Allez porter l’Évangile du Seigneur.
  [rubric]ou bien:[/rubric]
  Allez en paix, glorifiez le Seigneur par votre vie.
  [rubric]ou bien:[/rubric]
  Allez en paix.

  [rubric]Le peuple répond:[/rubric]
  R/ Nous rendons grâce à Dieu.

  [rubric]Ensuite, selon l’usage, le prêtre vénère l’autel par un baiser, comme au commencement. Après une inclination profonde, faite en même que les ministres, il se retire.[/rubric]

  [rubric]Si la messe est suivie par une autre action liturgique, on omet les rites de renvoi.[/rubric]
