offertoire: |-
  [rubric]Lorsque la prière universelle est achevée, on peut commencer le chant d’offertoire. Pendant ce temps, les ministres placent sur l’autel le corporal, le purificatoire, le calice et le missel.[/rubric]

  [rubric]Il est bien que les fidèles manifestent leur participation en apportant soit le pain et le vin pour la célébration de l’Eucharistie, soit d’autres dons destinés à subvenir aux besoins de l’Église et des pauvres.[/rubric]

  [rubric]Le prêtre, à l’autel, reçoit la patène avec le pain, et il la tient un peu élevée au-dessus de l’autel, en disant à voix basse :[/rubric]
  Tu es béni, Seigneur, Dieu de l’univers :
  nous avons reçu de ta bonté
  le pain que nous te présentons,
  fruit de la terre et du travail des hommes ;
  >il deviendra pour nous le pain de la vie.

  [rubric]Ensuite, il dépose la patène avec le pain sur le corporal.
  S’il n’y a pas de chant d’offertoire, le prêtre peut dire ces paroles à haute voix ; à la fin, le peuple peut dire l’acclamation :[/rubric]
  R/ Béni soit Dieu, maintenant et toujours !

  [rubric]Le diacre ou le prêtre verse le vin et un peu d’eau dans le calice, en disant tout bas :[/rubric]
  %Comme cette eau se mêle au vin%
  %pour le sacrement de l’Alliance,%
  %puissions-nous être unis à la divinité%
  %de celui qui a voulu prendre notre humanité.>%

  [rubric]Ensuite, le prêtre prend le calice et le tient à deux mains, un peu élevé au-dessus de l’autel, en disant, à voix basse :[/rubric]
  Tu es béni, Seigneur, Dieu de l’univers :
  nous avons reçu de ta bonté
  le vin que nous te présentons,
  fruit de la vigne et du travail des hommes ;
  >il deviendra pour nous le vin du royaume éternel.

  [rubric]Puis il dépose le calice sur le corporal.
  S’il n’y a pas de chant d’offertoire, le prêtre peut dire ces paroles à haute voix ; à la fin, le peuple peut dire l’acclamation :[/rubric]
  R/ Béni soit Dieu, maintenant et toujours !

  [rubric]Ensuite, le prêtre, profondément incliné, dit tout bas :[/rubric]
  %Le cœur humble et contrit, nous te supplions, Seigneur,%
  %>accueille-nous :%
  %que notre sacrifice, en ce jour, trouve grâce devant toi,%
  %>Seigneur notre Dieu.%

  [rubric]Si cela convient, le prêtre encense les offrandes, la croix et l’autel ; puis, le diacre ou un autre ministre encense le prêtre et le peuple.
  Ensuite, le prêtre, sur le côté de l’autel, se lave les mains, en disant tout bas :[/rubric]
  %Lave-moi de mes fautes, Seigneur,%
  %et purifie-moi de mon péché.%

  [center][title][rubric]PRIÈRE SUR LES OFFRANDES[/rubric][/title][/center]

  [rubric]Revenu au milieu de l’autel, tourné vers le peuple, étendant puis joignant les mains, il dit :[/rubric]
  Priez, frères et sœurs :
  que mon sacrifice, qui est aussi le vôtre,
  soit agréable à Dieu le Père tout-puissant.

  R/ Que le Seigneur reçoive de vos mains ce sacrifice
  >à la louange et à la gloire de son nom,
  >pour notre bien et celui de toute l’Église.>

  [section]

  [rubric]Ou bien :[/rubric]
  Prions ensemble, au moment d’offrir
  le sacrifice de toute l’Église.

  R/ Pour la gloire de Dieu>et le salut du monde.

  [section]

  [rubric]Puis, les mains étendues, le prêtre dit la prière sur les offrandes.
  Habituellement, elle se termine ainsi :[/rubric]
  Par le Christ, notre Seigneur. R/ Amen.

  [rubric]Ou, si elle s’adresse au Père, mais avec mention du Fils à la fin :[/rubric]
  Lui qui vit et règne pour les siècles des siècles. R/ Amen.

  [rubric]Ou, si elle s’adresse au Fils :[/rubric]
  Toi qui vis et règnes pour les siècles des siècles. R/ Amen.
