ouverture: |-
  [center][title][rubric]OUVERTURE DE LA CÉLÉBRATION[/rubric][/title][/center]

  [rubric]Lorsque le peuple est rassemblé, le prêtre s’avance vers l’autel avec les ministres, pendant le chant d’entrée.
  Quand il est parvenu à l’autel, il fait une inclination profonde avec les ministres, puis il vénère l’autel par un baiser et, si cela convient, il encense la croix et l’autel. Ensuite, il gagne son siège avec les ministres.[/rubric]

  [rubric]Le chant d’entrée achevé, le prêtre et les fidèles, debout, font le signe de la croix, tandis que le prêtre, tourné vers le peuple dit:[/rubric]
  Au nom du Père, et du Fils, et du Saint-Esprit.
  R/ Amen.

  [center][title][rubric]SALUTATION[/rubric][/title][/center]

  [rubric]Puis, les mains étendues, le prêtre salue le peuple en utilisant l’une des trois formules suivantes:[/rubric]

  La grâce de Jésus, le Christ, notre Seigneur,
  l’amour de Dieu le Père,
  et la communion de l’Esprit Saint,
  >soient toujours avec vous.
  R/ Et avec votre esprit.

  [rubric]ou bien:[/rubric]
  Le Seigneur soit avec vous.
  R/ Et avec votre esprit.

  [rubric]ou bien:[/rubric]
  Que la grâce et la paix
  >de Dieu notre Père
  >et du Seigneur Jésus, le Christ,
  >soient tous avec vous.
  R/ Et avec votre esprit.

  [section]

  [rubric]Le Prêtre, le diacre ou un autre ministre peut introduire très brièvement les fidèles à la messe du jour.[/rubric]

  [center][title][rubric]PRÉPARATION PÉNITENTIELLE[/rubric][/title][/center]

  [rubric]Le dimanche, et surtout au Temps pascal, au lieu de l’acte pénitentiel habituel, on peut aussi faire la bénédiction et l’aspersion de l’eau en mémoire du baptême, comme dans l’annexe II.[/rubric]

  [center][rubric]PREMIÈRE FORMULE[/rubric][/center]

  Frères et sœurs,
  préparons-nous à célébrer le mystère de l’Eucharistie
  en reconnaissant que nous avons péché.

  [rubric]On fait une brève pause en silence.
  [/rubric][rubric]Tous disent ensemble la formule de confession générale:[/rubric]
  Je confesse à Dieu tout-puissant,
  >je reconnais devant vous, frères et sœurs,
  que j’ai péché
  >en pensée, en parole,
  >par action et par omission;
  [rubric]On se frappe la poitrine en disant:[/rubric]
  oui, j’ai vraiment péché.
  [rubric]On continue:[/rubric]
  C’est pourquoi je supplie
  >la bienheureuse Vierge Marie,
  les anges et tous les saints,
  et vous aussi, frères>et sœurs,
  de prier pour moi le Seigneur notre Dieu.

  [rubric]Puis le prêtre prononce l’absolution:[/rubric]
  Que Dieu tout-puissant
  >nous fasse miséricorde;
  qu’il nous pardonne nos péchés
  >et nous conduise à la vie éternelle.
  R/ Amen.

  [section]

  [center][rubric]DEUXIÈME FORMULE[/rubric][/center]

  [rubric]Le prêtre invite les fidèles à faire l’acte pénitentiel:[/rubric]
  Frères et sœurs,
  préparons-nous à célébrer le mystère>de l’Eucharistie,
  en reconnaissant que nous avons péché.

  [rubric]On fait une brève pause en silence. Puis le prêtre dit>:[/rubric]
  Prends pitié de nous, Seigneur.
  R/ Nous avons péché contre toi.

  Montre-nous, Seigneur, ta miséricorde.
  ℞>Et donne-nous ton salut.

  [rubric]Puis le prêtre prononce l’absolution:[/rubric]
  Que Dieu tout-puissant
  >nous fasse miséricorde;
  qu’il nous pardonne nos péchés
  >et nous conduise à la vie éternelle.
  R/ Amen.

  [section]

  [center][rubric]TROISIÈME FORMULE[/rubric][/center]

  [rubric]Le prêtre invite les fidèles à faire l’acte pénitentiel:[/rubric]
  Frères et sœurs,
  préparons-nous à célébrer le mystère>de l’Eucharistie,
  en reconnaissant que nous avons péché.

  [rubric]On fait une brève pause en silence.
  Puis le prêtre, le diacre ou un autre ministre chante ou dit les invocations suivantes ou d’autres semblables, en particulier pour les messes des défunts, incluant Kýrie eléison:[/rubric]
  Seigneur Jésus, envoyé pour guérir
  les cœurs qui reviennent vers toi:
  >Seigneur, prends pitié.
  ℞>Seigneur, prends pitié.

  Ô Christ, venu appeler les pécheurs:
  >ô Christ, prends pitié.
  R/ Ô Christ, prends pitié.

  Seigneur, qui sièges à la droite du Père
  où tu intercèdes pour nous:
  >Seigneur, prends pitié.
  ℞>Seigneur, prends pitié.

  [rubric]Puis le prêtre prononce l’absolution:[/rubric]
  Que Dieu tout-puissant
  >nous fasse miséricorde;
  qu’il nous pardonne nos péchés
  >et nous conduise à la vie éternelle.
  R/ Amen.

  [section]

  [rubric]Ensuite, on chante ou on dit le Kýrie eléison, à moins qu’il n’ait été déjà employé dans une formule de l’acte pénitentiel (c’est le cas de la précédente).[/rubric]
  Kýrie, eléison. R/ Kýrie, eléison.
  Christe, eléison. R/ Christe, eléison.
  Kýrie, eléison. R/ Kýrie, eléison.

  [rubric]ou bien:[/rubric]
  Seigneur, prends pitié. R/ Seigneur, prends pitié.
  Ô Christ, prends pitié. R/ Ô Christ, prends pitié.
  Seigneur, prends pitié. R/ Seigneur, prends pitié.

  [center][title][rubric]GLOIRE À DIEU[/rubric][/title][/center]

  [rubric]Quand elle est prescrite, on chante ou on dit l’hymne qui suit:[/rubric]
  Gloire à Dieu, au plus haut des cieux,
  >et paix sur la terre aux hommes qu’il aime.
  Nous te louons, nous te bénissons,
  >nous t’adorons, nous te glorifions,
  >nous te rendons grâce, pour ton immense gloire,
  Seigneur Dieu, Roi du ciel,
  >Dieu le Père tout-puissant.
  Seigneur, Fils unique, Jésus Christ,
  >Seigneur Dieu, Agneau de Dieu, le Fils du Père;
  toi qui enlèves les péchés du monde, prends pitié de nous;
  toi qui enlèves les péchés du monde, reçois notre prière;
  toi qui es assis à la droite du Père, prends pitié de nous.
  Car toi seul es Saint,
  >toi seul es Seigneur,
  >toi seul es le Très-Haut:
  Jésus Christ, avec le Saint-Esprit
  >dans la gloire de Dieu le Père.
  Amen.
