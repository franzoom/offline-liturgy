- description: Communicantes for Presentation in the Temple
- PE1: |-
    Unis dans une même communion,
    >nous célébrons le jour très saint
    >où la Vierge Marie te présenta dans le Temple
    >ton Fils unique, son enfant nouveau-né ;
    et nous vénérons en premier lieu la mémoire 
    >de cette vierge bienheureuse,
    >la Mère de notre Dieu et Seigneur, Jésus Christ ; 
- PE2: |-
    Toi qui es vraiment saint,
    >toi qui es la source de toute sainteté, Dieu notre Père,
    >nous voici rassemblés devant toi,
    et, dans la communion de toute l’Église,
    >nous célébrons le jour très saint
    >où la Vierge Marie te présenta dans le Temple
    >son enfant nouveau-né, ton Fils unique, notre Seigneur.
    Par lui, lumière née de ta lumière,
    >nous te prions : 
- PE3: |-
    C’est pourquoi nous voici rassemblés devant toi, Dieu notre Père,
    et, dans la communion de toute l’Église,
    >nous célébrons le jour
    >où la Vierge Marie te présenta dans le Temple
    >son enfant nouveau-né,
    >ton Fils unique, notre Seigneur.
    Par lui, lumière née de ta lumière,
    >nous te supplions de consacrer toi-même
    >les offrandes que nous apportons : 