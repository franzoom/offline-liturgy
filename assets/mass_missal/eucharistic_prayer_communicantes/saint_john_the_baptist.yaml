- description: Communicantes for Nativity of John the Baptist
- PE1: |-
    Unis dans une même communion,
    >nous célébrons le jour de la naissance
    >de saint Jean, le Précurseur,
    >qui a préparé le chemin au Sauveur des hommes ;
    et vénérant d’abord la mémoire
    >de la bienheureuse Marie toujours Vierge,
    >Mère de notre Dieu et Seigneur, Jésus Christ,
- PE2: |-
    Toi qui es vraiment saint,
    >toi qui es la source de toute sainteté, Dieu notre Père,
    nous voici rassemblés devant toi,
    >et, dans la communion de toute l’Église,
    >nous célébrons le jour de la naissance
    >de saint Jean le Précurseur,
    qui a préparé le chemin
    >au Sauveur des hommes, le Christ Jésus,
    lui qui est venu après Jean,
    >mais qui existait avant lui ; 
    >et maintenant, nous te prions : 
- PE3: |-
    C’est pourquoi nous voici rassemblés devant toi, Dieu notre Père,
    >et, dans la communion de toute l’Église,
    >nous célébrons le jour de la naissance
    >de saint Jean, le Précurseur,
    qui a préparé le chemin
    >au Sauveur des hommes, le Christ Jésus,
    >lui qui est venu après Jean,
    >mais qui existait avant lui ;
    nous te supplions de consacrer toi-même
    >les offrandes que nous apportons : 