- description: Communicantes for Christmas (night)
- PE1: |-
    Unis dans une même communion,
    >nous célébrons la nuit très sainte
    >où Marie, dans la gloire de sa virginité,
    >enfanta le Sauveur du monde;
    et, vénérant d'abord la mémoire
    >de cette Vierge bienheureuse,
    >la Mère de notre Dieu et Seigneur, Jésus Christ,
- PE2: |-
    Toi qui es vraiment saint,
    >toi qui es la source de toute sainteté, Dieu notre Père,
    >nous voici rassemblés devant toi,
    et, dans la communion de toute l’Église,
    >nous célébrons la nuit très sainte
    où Marie, dans la gloire de sa virginité,
    >enfant le Sauveur du Monde.
    Par lui, notre Rédemtpeur et notre Seigneur,
    >nous te prions:
- PE3: |-
    C’est pourquoi nous voici rassemblés devant toi, Dieu notre Père,
    et, dans la communion de toute l’Église,
    >nous célébrons la nuit très sainte
    où Marie, dans la gloire de sa virginité,
    >enfanta le Sauveur du monde.
    Par lui, notre Rédempteur et notre Seigneur,
    >nous te supplions de consacrer toi-même
    >les offrandes que nous apportons :