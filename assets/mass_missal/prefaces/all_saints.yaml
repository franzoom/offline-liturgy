title: Préface de la Toussaint
subtitle: La gloire de Jérusalem, notre mère
note: Cette préface se dit à la messe de la Toussaint.
content: |-
  Vraiment, il est juste et bon, 
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint, Dieu éternel et tout-puissant.

  Car tu nous donnes de célébrer aujourd’hui la cité du ciel, 
  >notre mère la Jérusalem d’en haut ;
  c’est là que nos frères les saints, déjà rassemblés,
  >chantent sans fin ta louange.
  Et nous qui marchons vers elle par le chemin de la foi, 
  >nous hâtons le pas,
  joyeux de voir glorifiés ces enfants de l’Église
  >dont tu fais non seulement un exemple
  >mais aussi un secours pour notre faiblesse.

  C’est pourquoi, avec la foule immense des saints et des anges, 
  >d’une seule voix, nous célébrons ta louange en proclamant :
