title: Préface de l’Annonciation du Seigneur
subtitle: Le mystère de l’Incarnation
note: Cette préface se dit à la messe de l’Annonciation du Seigneur.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  C’est lui qui pour sauver les hommes
  >devait naître parmi les hommes,
  >par la puissance de l’Esprit Saint
  >qui couvrit Marie de son ombre ;
  c’est lui que le messager annonça à la Vierge,
  >lui qu’elle accueillit dans la foi,
  >lui qu’elle porta avec amour
  >dans son corps immaculé.
  Il venait accomplir en vérité
  >les promesses faites aux enfants d’Israël ;
  >combler, et même dépasser, l’espérance des nations.

  Par lui, les anges adorent ta majesté
  >et se réjouissent en ta présence à jamais.
  À leur hymne de louange,
  >laisse-nous joindre nos voix
  >pour chanter et proclamer :
