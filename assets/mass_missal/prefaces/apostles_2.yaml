title: 2ème préface des Apôtres
subtitle: Les Apôtres, fondations de l’Église et témoins de Dieu
note: Cette préface se dit aux messes des Apôtres et des Évangélistes.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Car tu as fondé ton Église sur les Apôtres, 
  pour qu’elle soit à jamais dans le monde 
  >le signe de ta sainteté,
  et qu’elle enseigne à tous les hommes
  >l’Évangile du royaume des Cieux.

  C’est pourquoi, 
  >dès maintenant et pour l’éternité, 
  nous pouvons te chanter avec tous les anges 
  >et, d’un cœur fervent, proclamer :
