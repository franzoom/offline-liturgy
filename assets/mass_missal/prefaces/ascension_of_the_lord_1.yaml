title: 1ère préface de l'Ascension du Seigneur
subtitle: Le mystère de l’Ascension
note: |-
  Cette préface se dit : le jour de l’Ascension
  et, au choix avec les préfaces du Temps pascal, aux jours qui précèdent la Pentecôte.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Car le Seigneur Jésus, le Roi de gloire,
  >vainqueur du péché et de la mort,
  s’élève aujourd’hui au plus haut des cieux
  >devant les anges émerveillés,
  lui, le Médiateur entre Dieu et les hommes,
  >Juge du monde et Seigneur de l’univers.

  Sans quitter notre condition humaine,
  le premier, il entre au ciel,
  >tête de l’Église et commencement de tout ce qui existe,
  et il donne aux membres de son Corps
  >l’espérance de le rejoindre un jour.

  C’est pourquoi
  >la joie pascale rayonne par tout l’univers,
  >la terre entière exulte,
  les puissances d’en haut et les anges dans le ciel
  >chantent sans fin l’hymne de ta gloire :
