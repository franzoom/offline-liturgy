title: Préface de saint Augustin
subtitle: null
content: |-
  Vraiment, il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.
  Dans ta miséricorde infinie,
  >tu as appelé saint Augustin
  >des ténèbres de l’erreur et du péché
  >à ton admirable lumière.
  Tu as fait de lui, sur la terre d’Afrique,
  >le modèle des pasteurs, le témoin de la foi catholique,
  >le docteur de la charité, de l’unité et de la paix.
  Dans notre soif de vérité et d’amour,
  >nous trouvons en lui
  >un guide et un exemple pour monter vers ta lumière.
  C’est pourquoi, avec les anges et tous les saints
  >qui exultent dans la contemplation de ta gloire,
  >nous tournons nos cœurs vers toi,
  >notre bien suprême, notre joie, notre paix éternelle,
  et sans fin nous te chantons :
