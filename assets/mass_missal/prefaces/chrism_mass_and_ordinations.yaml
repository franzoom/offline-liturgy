title: Préface de la messe chrismale et des ordinations
subtitle: Le sacerdoce du Christ et le ministère des prêtres
note: |-
  Cette préface se dit :
    • à la messe chrismale,
    • à la messe d’ordination d’un ou plusieurs évêques,
    • à la messe d’ordination d’un ou plusieurs prêtres.

content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Par l’onction de l’Esprit Saint,
  >tu as établi ton Fils unique
  >grand prêtre de l’Alliance nouvelle et éternelle ;
  et, dans ton admirable providence,
  >tu as voulu que son unique sacerdoce
  >demeure à jamais dans l’Église.

  C’est lui, le Christ, qui donne au peuple racheté
  >la dignité du sacerdoce royal ;
  et, dans son amour fraternel,
  >il choisit aussi des hommes
  >qui, en recevant l’imposition des mains,
  >auront part à son ministère.

  En son nom, ils renouvellent le sacrifice rédempteur,
  >ils dressent pour tes fils la table du banquet pascal ;
  par la charité, ils montrent la voie à ton peuple saint,
  >par la parole, ils le nourrissent,
  >et par les sacrements, ils le fortifient.

  En livrant leur vie pour toi et pour le salut de leurs frères,
  >ils s’efforceront d’être conformes à l’image du Christ,
  >et te donneront avec constance
  >la preuve de leur foi et de leur amour.

  C’est pourquoi,
  >avec les anges et tous les saints,
  nous te louons, Seigneur,
  >et nous exultons de joie en proclamant :
