title: Préface du Christ Roi
subtitle: Le Christ, Roi de l'univers
note: Cette préface se dit à la messe du Christ Roi de l'univers.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant.

  Tu as consacré d’une onction d’allégresse 
  >ton Fils unique, Jésus Christ, notre Seigneur, 
  >comme Prêtre éternel et Roi de l’univers.

  Pour accomplir les mystères de notre rédemption, 
  >il s’est offert lui-même sur l’autel de la croix 
  >en victime pure et pacifique.
  Quand toutes les créatures auront été soumises à son pouvoir, 
  >il remettra aux mains de ta souveraine puissance 
  >le règne éternel et universel : 
  règne de vie et de vérité, 
  >règne de grâce et de sainteté, 
  >règne de justice, d’amour et de paix.

  C’est pourquoi, avec les anges et les archanges, 
  >avec les puissances d’en haut et tous les esprit bienheureux, 
  nous chantons l’hymne de ta gloire 
  >et sans fin nous proclamons: