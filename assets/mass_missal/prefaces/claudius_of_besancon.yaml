title: Préface pour la fête de Saint Claude
subtitle: null
content: |-
  Vraiment, Père très saint,
  >il est juste et bon
  de te rendre grâce en ce jour de fête,
  >par Jésus le Christ notre Seigneur.
  Pour faire grandir ton Église,
  >tu as placé Saint Claude en notre région
  et tu l’as donné comme patron
  >à notre diocèse.
  Par sa vie de foi et de prière,
  >tu as manifesté ta présence au milieu de ses frères,
  et par son rayonnement,
  >tu fortifies encore notre engagement à ton service.
  C’est pourquoi, unis à lui,
  >ainsi qu’aux anges et à tous les saints,
  nous te célébrons en proclamant :
