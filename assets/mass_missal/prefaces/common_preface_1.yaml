title: Préface commune n°1
subtitle: Récapitulation de toutes choses dans le Christ
note: Cette préface se dit aux messes qui n’ont pas de préface propre et qui ne doivent pas prendre une préface du Temps.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  En lui tu as voulu récapituler toutes choses,
  >et tu nous as fait partager
  >la vie qu’il possède en plénitude.
  Lui qui est de condition divine,
  >il s’est anéanti
  >pour donner au monde la paix
  >par le sang de sa croix ;
  élevé au-dessus de toute créature,
  >il est devenu pour tous ceux qui lui obéissent
  >la cause du salut éternel.

  C’est pourquoi, avec les anges et les archanges,
  >avec les puissances d’en haut et tous les esprit bienheureux,
  >nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons :
