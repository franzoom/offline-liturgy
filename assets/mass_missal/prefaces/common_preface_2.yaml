title: Préface commune n°2
subtitle: Le salut par le Christ
note: Cette préface se dit aux messes qui n’ont pas de préface propre et qui ne doivent pas prendre une préface du Temps.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Dans ta bonté, tu as créé l’homme ;
  >et, comme il avait mérité la condamnation,
  >tu l’as racheté dans ta miséricorde,
  >par le Christ, notre Seigneur.

  Par lui, les anges célèbrent ta grandeur,
  >et les esprits bienheureux adorent ta gloire ;
  par lui s’inclinent devant toi les puissances d’en haut
  >et tressaillent d’une même allégresse
  >les innombrables créatures des cieux.

  À leur hymne de louange,
  >laisse-nous joindre nos voix
  >pour chanter et proclamer :
