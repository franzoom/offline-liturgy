title: Préface commune n°3
subtitle: Louange à Dieu pour la création et la régénération de l’homme
note: Cette préface se dit aux messes qui n’ont pas de préface propre et qui ne doivent pas prendre une préface du Temps.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  C’est par ton Fils bien-aimé
  >que tu as formé le genre humain ;
  et c’est encore par lui
  >que, dans ta grande bonté, tu le renouvelles.

  Voilà pourquoi toutes les créatures te servent,
  >le peuple que tu as racheté célèbre ta louange,
  >les saints te bénissent d’un seul cœur.
  Et déjà nous pouvons te louer avec tous les anges,
  >et, dans la joie, nous ne cessons de proclamer :
