title: Préface commune n°4
subtitle: La louange, don de Dieu
note: Cette préface se dit aux messes qui n’ont pas de préface propre et qui ne doivent pas prendre une préface du Temps.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Tu n’as pas besoin de notre louange,
  et pourtant c’est toi
  >qui nous donnes de répondre à tes bienfaits
  >en te rendant grâce :
  nos chants n’ajoutent rien à ce que tu es,
  >mais nous font progresser vers le salut,
  >par le Christ, notre Seigneur.

  C’est pourquoi,
  >unissant nos voix à celles des anges,
  >nous te louons dans la joie en proclamant :
