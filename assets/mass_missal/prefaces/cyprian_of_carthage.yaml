title: Préface de saint Cyprien
subtitle: null
content: |-
  Vraiment, il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.
  À son exemple, saint Cyprien a veillé avec sollicitude
  >sur le troupeau qui lui était confié :
  il l’a formé par ses enseignements,
  >secouru dans l’épreuve,
  >encouragé et fortifié dans la persécution.
  Quand l’heure fut venue,
  >loin de se dérober au martyre,
  >il s’est livré lui-même,
  >suivant jusqu’au bout le Bon Pasteur
  >qui donne sa vie pour ses brebis.
  C’est pourquoi, en proclamant la puissance de ta grâce
  >à l’œuvre dans les saints,
  >nous unissons nos voix à celles des anges
  >pour chanter sans fin l’hymne de ta gloire :
