title: Préface n°1 de de la Dédicace
subtitle: Le mystère du temple de Dieu, qu’est l’Église

content: |-
  Vraiment, il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  par le Christ, notre Seigneur.

  Dans la maison visible que tu nous as donné de construire,
  en ce lieu où tu ne cesses d’accueillir
  >ta famille dans son pèlerinage vers toi,
  tu nous offres le signe et la réalité admirables
  >du mystère de ta communion avec nous :
  ici, tu construis pour toi le temple vivant que nous sommes,
  >et tu fais grandir l’Église, répandue dans le monde,
  >à la mesure du Corps du Seigneur,
  pour qu’elle devienne, en plénitude,
  >vision de paix, cité céleste, Jérusalem.

  C’est pourquoi, avec la multitude des bienheureux,
  >nous te louons, nous te bénissons et nous te glorifions
  >dans le temple de ta gloire, en proclamant :
