title: Préface de Pâques n°1
subtitle: Le mystère pascal
note: |-
  Cette préface se dit au Temps pascal.
    • À la messe de la Veillée pascale, on dit : _en cette nuit_ ;
    • depuis le jour de Pâques et pendant toute l’octave, on dit : _aujourd’hui_ ;
    • après l’octave, on dit : _en ces jours_.

content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  >de te louer, Seigneur, en tout temps,
  mais plus encore de te glorifier
  >• en cette nuit _(la nuit de Pâques)_
  >• aujourd’hui _(le jour de Pâques et pendant l’octave)_
  >• en ces jours _(après l’octave)_
  où le Christ, notre Pâque, a été immolé.

  Car il est l’Agneau véritable
  >qui a enlevé les péchés du monde :
  en mourant, il a détruit notre mort ;
  >en ressuscitant, il nous a rendu la vie.

  C’est pourquoi
  >la joie pascale rayonne par tout l’univers,
  >la terre entière exulte,
  les puissances d’en haut et les anges dans le ciel
  >chantent sans fin l’hymne de ta gloire :
