title: Préface de Pâques n°5
subtitle: Le Christ, prêtre et victime
note: Cette préface se dit pendant le Temps pascal.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de te louer, Seigneur, en tout temps,
  mais plus encore de te glorifier en ces jours
  >où le Christ, notre Pâque, a été immolé.

  Par l’offrande de son corps,
  >il mène à leur achèvement, dans la vérité de la croix,
  >les sacrifices de l’ancienne Alliance,
  et quand il te remet son esprit pour notre salut,
  >il est à lui seul
  >le prêtre, l’autel et l’agneau du sacrifice.

  C’est pourquoi
  >la joie pascale rayonne par tout l’univers,
  >la terre entière exulte,
  les puissances d’en haut et les anges dans le ciel
  >chantent sans fin l’hymne de ta gloire :
