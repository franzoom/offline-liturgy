title: Préface de l'Épiphanie du Seigneur
subtitle: Le Christ, lumière des nations
note: |-
  Cette préface se dit aux messes de la solennité de l’Épiphanie.
  On peut la dire, tout comme l’une des préfaces de la Nativité, aux féries du temps de Noël qui suivent la solennité de l’Épiphanie jusqu’au samedi qui précède le Baptême du Seigneur.

content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Aujourd’hui tu as dévoilé dans le Christ
  >le mystère de notre salut
  >pour que tous les peuples en soient illuminés ;
  et quand le Christ s’est manifesté
  >dans notre nature mortelle,
  tu nous as renouvelés par la gloire de son immortalité.

  C’est pourquoi, avec les anges et les archanges,
  >avec les puissances d’en haut et tous les esprit bienheureux,
  nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons :
