title: Pour la fête du Canada
subtitle: null
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Par ton Verbe et par ton Esprit,
  >tu fais exister toutes choses
  afin que ton amour se reflète dans l’immensité de l’univers,
  >la générosité de la terre et de la mer,
  >et la diversité des peuples qui portent ton image.
  Les dons que tu prodigues dans la création
  >n’ont pas épuisé ta bonté ;
  car tu as révélé la plénitude de ton amour
  >lorsque tu as envoyé ton Fils unique pour notre salut
  >et répandu ton Esprit pour nous rassembler dans l’unité.
  
  C’est pourquoi, avec les anges et tous les saints,
  nous te louons et sans fin nous proclamons :