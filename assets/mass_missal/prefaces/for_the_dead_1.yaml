title: 1ère préface des Défunts
subtitle: L'espérance de la résurrection dans le Christ
note: Cette préface se dit aux messes des défunts.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  C’est en lui qu’a resplendi pour nous
  >l’espérance de la résurrection bienheureuse;
  et si la loi de la mort nous afflige,
  >la promesse de l’immortalité nous apporte la consolation.

  Car pour tous ceux qui croient en toi, Seigneur,
  >la vie est transformée, elle n’est pas enlevée;
  et lorsque prend fin leur séjour sur la terre,
  >ils ont déjà une demeure éternelle dans les cieux.

  C’est pourquoi, 
  >avec les anges et les archanges,
  >avec les puissances d’en haut et tous les esprits bienheureux,
  nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons:
