title: 2ème préface des Défunts
subtitle: Le Christ est mort pour que nous vivions
note: Cette préface se dit aux messes des défunts.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Lui seul accepta la mort
  >afin de nous arracher tous à la mort;
  lui seul a bien voulu mourir
  >afin que tous, nous vivions à jamis pour toi.

  C'est pourquoi,
  >unissant nos voix à celles de anges,
  >nous te louons dans la joie en proclamant:
