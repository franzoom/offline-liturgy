title: 5ème préface des Défunts
subtitle: Grâce à la victoire du Christ, nous ressusciterons avec lui
note: Cette préface se dit aux messes des défunts.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Même si nous sommes destinés à mourir,
  >quand la mort nous atteint à cause du péché,
  ta tendresse et ta grâce nous donnent
  >d’être rachetés par la victoire du Christ
  >et nous appellent à revivre avec lui.

  C’est pourquoi, 
  >avec les puissances des cieux
  nous pouvons te bénir sur la terre
  >et t’adorer sans fin en proclamant: