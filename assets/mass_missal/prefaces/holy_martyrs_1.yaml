title: 1ère préface des martyrs
subtitle: Signification et valeur du martyre
note: |-
  Cette préface se dit aux solennités et fêtes des saints martyrs. 
  On peut la dire aux mémoires des martyrs.
content: |-
  Vraiment il est juste et bon, 
  pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant.

  Nous reconnaissons un signe éclatant de ta grâce 
  >dans le martyre de saint (de sainte, des saints, des saintes) N. ; 
  en donnant son (leur) propre sang comme le Christ, 
  >il a (elle a, ils ont, elles ont) glorifié ton nom. 
  C’est ta puissance qui se déploie dans la faiblesse 
  >quand tu donnes à des êtres fragiles 
  >de te rendre témoignage 
  >par le Christ, notre Seigneur.

  C’est pourquoi, 
  >avec les puissances des cieux, 
  nous pouvons te bénir sur la terre 
  >et t’adorer sans fin en proclamant :
