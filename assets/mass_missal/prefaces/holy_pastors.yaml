title: Préface des saints Pasteurs
headline: La présence des saints pasteurs dans l’Église
note: |-
  Cette préface se dit aux solennités et fêtes des saints pasteurs.
  On peut la dire aux mémoires des pasteurs.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Tu donnes à ton Église de se réjouir 
  >en la fête de saint (des saints) N. : 
  par l’exemple qu’il a (qu’ils ont) donné, tu nous encourages, 
  >par son (leur) enseignement, tu nous éclaires, 
  >à sa (leur) prière, tu veilles sur nous.

  C’est pourquoi, 
  >  avec la multitude des anges et des saints, 
  nous chantons l’hymne de ta gloire 
  >  et sans fin nous proclamons :
