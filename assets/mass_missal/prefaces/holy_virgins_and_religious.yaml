title: Préface des vierges et religieux
subtitle: Signification de la vie consacrée
note: |-
  Cette préface se dit aux solennités et fêtes des saintes vierges, et des saints religieux ou religieuses.
  On peut la dire aux mémoires de ces saints.
content: |-
  Vraiment il est juste et bon,
  pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  >Seigneur, Père très saint, Dieu éternel et tout-puissant.

  Nous célébrons les prévenances de ton amour
  >pour tant d’hommes et de femmes
  >parvenus à la sainteté
  >en se donnant au Christ à cause du royaume des Cieux.
  Par ce mystère d’alliance,
  >tu veux que notre condition humaine
  >retrouve sa splendeur première,
  et que, dès ici-bas, nous ayons un avant-goût
  >des biens que tu nous donneras dans le monde à venir.

  C’est pourquoi, avec les saints et tous les anges,
  >nous te louons et sans fin nous proclamons:
