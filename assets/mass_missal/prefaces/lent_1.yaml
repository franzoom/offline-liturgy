title: 1ère préface du Carême
subtitle: La signification spirituelle du Carême
note: Cette préface se dit pendant le Carême, en particulier le dimanche lorsqu’il n’y a pas lieu de dire la préface propre à chacun des dimanches de Carême.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Car chaque année, tu accordes à tes fidèles
  >de se préparer aux fêtes pascales
  >dans la joie d’un cœur purifié ;
  de sorte qu’en s’adonnant à une prière plus fervente
  >et à une charité plus active,
  >fidèles aux sacrements qui les ont fait renaître,
  ils soient comblés de la grâce
  >que tu réserves à tes enfants.

  C’est pourquoi, avec les anges et les archanges,
  >avec les puissances d’en haut et tous les esprit bienheureux,
  nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons :
