title: 2ème préface du Carême
subtitle: L’esprit de pénitence
note: Cette préface se dit pendant le Carême, en particulier le dimanche lorsqu’il n’y a pas lieu de dire la préface propre à chacun des dimanches de Carême.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Tu offres à tes enfants ce temps de grâce
  >pour qu’ils retrouvent la pureté du cœur,
  afin que, l’esprit libéré des passions mauvaises,
  >ils travaillent à ce monde qui passe,
  >en s’attachant surtout aux réalités qui demeurent.

  C’est pourquoi, avec les saints et tous les anges,
  >nous te louons et sans fin nous proclamons :
