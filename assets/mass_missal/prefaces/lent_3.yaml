title: 3ème préface du Carême
subtitle: Les bienfaits de l’abstinence
note: Cette préface se dit aux messes des féries de Carême, et aux jours de jeûne.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Tu as voulu que nous te rendions grâce par nos privations :
  >elles rabaissent notre orgueil de pécheurs
  >et nous invitent à suivre l’exemple de ta bonté
  >en nous faisant partager avec ceux qui ont faim.

  C’est pourquoi,
  >avec les anges innombrables,
  d’une seule voix nous célébrons ta louange en proclamant :
