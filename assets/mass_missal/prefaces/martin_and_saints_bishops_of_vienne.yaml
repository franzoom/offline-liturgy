title: Préface des saints évêques
subtitle: Les pasteurs envoyés par Dieu à son Église
content: |-
  Vraiment il est juste et bon de te rendre gloire,
  de t’offrir notre action de grâce, toujours et en tout lieu,
  à toi, Père très saint, Dieu éternel et tout-puissant,
  par le Christ, notre Seigneur.
  Tu es toi-même la vie de ton Église
  et tu lui donnes, dans ta bonté,
  les pasteurs dont elle a besoin.
  Par la grâce de l’Esprit Saint,
  tu as envoyé des saints évêques à nos pères
  pour les appeler à la foi et en faire ton peuple ;
  ils l’ont nourri de ta parole,
  ils l’ont vivifié par tes sacrements,
  ils l’ont guidé sur le chemin du salut.
  Maintenant qu’ils sont entrés dans ta gloire,
  ils continuent de veiller sur nous
  et ils intercèdent pour nous auprès de toi.
  C’est pourquoi, tandis que nous vénérons leur mémoire,
  nous t’acclamons avec les anges
  en chantant (disant) d’une seule voix :
