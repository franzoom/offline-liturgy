title: Préface de Sainte Marie-Madeleine
subtitle: Elle fut l’apôtre des Apôtres
note: Cette préface se dit à la messe de saint Marie-Madeleine.
content: |-
  Vraiment il est juste et bon, 
  pour ta gloire et notre salut, 
  de te célébrer en toute chose,
  >toi, le Père tout-puissant,
  >dont la puissance n’a d’égale que la miséricorde,
  par le Christ, notre Seigneur.

  Au jardin, il s’est manifesté à Marie Madeleine, 
  il est apparu à celle qui l’avait aimé en cette vie 
  >et vu mourir sur la croix, 
  elle qui le chercha 
  >quand il gisait dans le tombeau, 
  et, la première, l’adora 
  >quand il ressuscita d’entre les morts.
  Il lui confia la charge et l’honneur 
  >d’être l’apôtre des Apôtres, 
  pour que la joyeuse annonce de la vie nouvelle 
  >parvienne aux limites du monde.

  C’est pourquoi nous aussi, 
  >avec les anges et tous les saints, 
  nous te louons, Seigneur, 
  >et, dans l’allégresse, nous proclamons: