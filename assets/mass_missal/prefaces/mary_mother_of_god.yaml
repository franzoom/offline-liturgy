title: Préface de Marie, mère de Dieu
subtitle: La maternité de la bienheureuse Vierge Marie
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  En ce jour où nous célébrons la maternité de la bienheureuse Vierge Marie, 
  >nous voulons te chanter, te bénir et te glorifier.

  Car elle a conçu ton Fils unique 
  >lorsque le Saint Esprit la couvrit de son ombre, 
  et, gardant pour toujours la gloire de sa virginité, 
  >elle a donné au monde la lumière éternelle, 
  >Jésus, le Christ, notre Seigneur.

  Par lui, les anges célèbrent ta grandeur, 
  >et les esprits bienheureux adorent ta gloire; 
  ar lui s’inclinent devant toi les puissances d’en haut 
  >et tressaillent d’une même allégresse 
  >les innombrables créatures des cieux.

  À leur hymne de louange, laisse-nous joindre nos voix 
  >pour chanter et proclamer:
