title: 1ère préface de Noël
subtitle: Le Christ Lumière
note: |-
  Cette préface se dit aux messes de la Nativité du Seigneur, ainsi que :
    • pendant l’octave de la Nativité (sauf si la célébration comporte une préface propre concernant les Personnes divines ou leurs mystères) ;
    • aux féries du temps de Noël (jusqu’au samedi précédant le Baptême du Seigneur).
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Car la révélation de ta gloire
  >s’est éclairée pour nous d’une lumière nouvelle
  >dans le mystère du Verbe incarné.
  Maintenant, nous connaissons en lui
  >Dieu qui s’est rendu visible à nos yeux,
  et nous sommes entraînés par lui
  >à aimer ce qui demeure invisible.

  C’est pourquoi, avec les anges et les archanges,
   avec les puissances d’en haut et tous les esprit bienheureux,
  nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons :
