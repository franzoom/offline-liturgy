title: 3ème préface de Noël
subtitle: L’échange entre Dieu et les hommes dans l’Incarnation du Verbe
note: |-
  Cette préface se dit aux messes de la Nativité du Seigneur, ainsi que :
    • pendant l’octave de la Nativité (sauf si la célébration comporte une préface propre concernant les Personnes divines ou leurs mystères) ;
    • aux féries du temps de Noël (jusqu’au samedi précédant le Baptême du Seigneur).
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Par lui resplendit en ce jour
  >l’échange merveilleux où nous sommes régénérés :
  lorsque ton Verbe prend sur lui la fragilité humaine,
  >notre condition mortelle en reçoit une infinie noblesse ;
  il devient tellement l’un de nous
  >que nous devenons éternels.

  C’est pourquoi,
  >unis au chœur des anges,
  >nous te louons dans la joie en proclamant :
