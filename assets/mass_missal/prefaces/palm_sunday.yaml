title: Préface du dimanche de la Passion
note: Cette préface se dit le dimanche des Rameaux et de la Passion.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Alors qu’il était innocent,
  >il a voulu souffrir pour les coupables,
  et, sans avoir commis le mal,
  >il s’est laissé condamner pour les criminels ;
  sa mort a effacé nos fautes
  >et sa résurrection a fait de nous des justes.

  C’est pourquoi nous te louons avec tous les anges
  >et, dans la joie, nous te célébrons en proclamant :
