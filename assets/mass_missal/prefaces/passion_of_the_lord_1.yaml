title: 1ère préface de la Passion
subtitle: La puissance de la Croix
note: |-
  Cette préface se dit :
    • pendant la cinquième semaine de Carême ;
    • aux messes célébrant les mystères de la Croix et de la Passion du Seigneur.

content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Oui, l’univers entier, sauvé par la passion de ton Fils,
  >peut désormais proclamer ta grandeur :
  par la puissance incomparable de la Croix,
  >apparaît en pleine lumière
  >le jugement du monde,
  >la victoire du Crucifié.

  C’est pourquoi,
  >avec les anges et tous les saints,
  nous te louons, Seigneur,
  >et nous exultons de joie en proclamant :
