title: Préface pour la fête de Saint Pothin
subtitle: null
content: |-
  Vraiment, il est juste et bon de te rendre gloire,
  >de t’offrir notre action de grâce, toujours et en tout lieu,
  à toi, Père très saint, Dieu éternel et tout-puissant.
  Car tu as voulu, dans ta grande miséricorde,
  >nous appeler des ténèbres à la lumière
  >et nous adopter comme tes fils.
  Grâce à ta seule bonté, Seigneur,
  >par les souffrances et les peines de saint Pothin,
  >de sainte Blandine et de leurs compagnons martyrs,
  la parole de la foi fut semée dans nos cœurs
  >et fécondée par leur sang.
  Maintenant, Père très saint,
  >affermis l’œuvre que tu as faite en nous
  et garde, par l’action de ton Esprit Saint,
  >le troupeau que tu as donné à ton Fils.
  Consacre-le dans la vérité,
  >parachève son unité,
  et daigne l’admettre enfin dans la gloire,
  >par le Christ notre Seigneur.
  Lui que la terre et le ciel,
  >avec les anges et tous les saints,
  >ne cessent d’acclamer en chantant : 