title: Préface de la Présentation du Seigneur
subtitle: Le mystère de la Présentation du Seigneur
note: Cette préface se dit à la messe de la Présentation du Seigneur.
content: |-
  Vraiment, il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  >Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Aujourd’hui, ton Fils éternel
  >est présenté dans le Temple,
  et l’Esprit Saint le désigne
  >comme la gloire d’Israël ton peuple
  >et la lumière des nations.

  Joyeux, nous aussi,
  >d’aller à la rencontre du Sauveur,
  >nous te chantons avec les anges et tous les saints,
  >et sans fin nous proclamons :