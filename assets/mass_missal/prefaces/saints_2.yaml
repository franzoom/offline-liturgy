title: 2ème préface des Saints
subtitle: Le rôle des saints
note: |–
  Cette préface se dit aux messes « de tous les saints », ainsi que :
    • aux messes des saints patrons et titulaires d’église ;
    • aux solennités et fêtes des saints, si elles n’ont pas de préface propre.
  On peut la dire aux mémoires des saints.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Tu ne cesses de fortifier ton Église, 
  >et tu lui donnes une fécondité nouvelle 
  >par la foi admirable dont témoignent les saints; 
  tu nous présentes en eux 
  >des signes très sûrs de ton amour.
  Et pour que s’accomplissent les mystères du salut, 
  >le rayonnement de leur exemple nous stimule, 
  >et leur intercession fervente nous assure un appui.

  C’est pourquoi, 
  >avec les anges et tous les saints, 
  nous te louons, Seigneur, 
  >et nous exultons de joie en proclamant: