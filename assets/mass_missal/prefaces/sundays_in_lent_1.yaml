title: 1ère préface des dimanches de Carême
subtitle: La tentation du Seigneur
note: Cette préface se dit le 1er dimanche du Carême.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  En jeûnant quarante jours au désert,
  >il consacrait le temps du Carême ;
  lorsqu’il déjouait les pièges du Tentateur des origines,
  >il nous apprenait à écarter le ferment du mal ;
  ainsi pourrons-nous célébrer dignement le mystère pascal
  >et enfin passer à la Pâques nouvelle.

  C’est pourquoi,
  >avec la multitude des anges et des saints,
  nous chantons l’hymne de ta gloire
  >et sans fin nous proclamons :
