title: 2ème préface des dimanches de Carême
subtitle: La Transfiguration du Seigneur
note: Cette préface se dit le 2e dimanche du Carême.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Après avoir prédit sa mort à ses disciples,
  >il leur a manifesté sa splendeur sur la montagne sainte
  >en présence de Moïse et d’Élie.
  >Ainsi la Loi et les Prophètes
  >témoignaient qu’il parviendrait par la passion
  >jusqu’à la gloire de la résurrection.

  C’est pourquoi,
  >avec les puissances des cieux,
  nous pouvons te bénir sur la terre
  >et t’adorer sans fin en proclamant :
