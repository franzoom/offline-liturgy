title: 3ème préface des dimanches de Carême
subtitle: La Samaritaine
note: Lorsque l’évangile de la Samaritaine a été lu, on dit la Préface ci-dessous. Après un autre évangile, on emploie la Préface du Carême n°1 ou 2.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Quand il demandait à la Samaritaine
  >de lui donner à boire,
  >il lui faisait déjà le don de la foi ;
  de cette foi, il manifesta une telle soif
  >qu’il fait naître en elle
  >le feu de l’amour de Dieu.

  C’est pourquoi nous te rendons grâce
  >et, avec les anges, nous chantons tes merveilles
  >en proclamant :
