title: 4ème préface des dimanches de Carême
subtitle: L’aveugle-né
note: Lorsque l’évangile de l’aveugle-né a été lu, on dit la Préface ci-dessous. Après un autre évangile, on emploie la Préface du Carême n°1 ou 2.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Par le mystère de son Incarnation,
  >il a guidé vers la clarté de la foi
  >l’humanité qui marchait dans les ténèbres ;
  et par le bain qui fait renaître,
  >il a élevé à la dignité de fils, en les adoptant,
  >ceux qui étaient nés esclaves du péché.

  C’est pourquoi le ciel et la terre t’adorent ;
  >ils te chantent le cantique nouveau,
  et nous-mêmes,
  >unissant notre voix à celle des anges,
  >nous t’acclamons :
