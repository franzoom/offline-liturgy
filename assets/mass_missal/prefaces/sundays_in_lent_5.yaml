title: 5ème préface des dimanches de Carême
subtitle: Lazare
note: Lorsque l’évangile de la résurrection de Lazare a été lu, on dit la Préface ci-dessous. Si on a lu un autre évangile, on emploie la Préface du Carême n°1 ou 2.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant,
  >par le Christ, notre Seigneur.

  Lui-même, homme véritable,
  >il a pleuré son ami Lazare ;
  Dieu éternel,
  >il le releva du tombeau ;
  ainsi, dans sa compassion pour le genre humain,
  >il nous conduit par les sacrements de Pâques
  >jusqu’à la vie nouvelle.

  Par lui, les anges adorent ta majesté
  >et se réjouissent en ta présence à jamais.
  À leur hymne de louange,
  >laisse-nous joindre nos voix
  >pour chanter et proclamer :
