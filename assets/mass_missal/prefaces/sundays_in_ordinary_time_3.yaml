title: 3ème préface des dimanches du Temps Ordinaire
subtitle: Notre humanité sauvée par l’humanité du Christ
note: Cette préface se dit les dimanches du Temps ordinaire.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Nous reconnaissons le signe de ton immense gloire,
  >quand tu portes secours à la faiblesse humaine
  >par ta puissance divine,
  mais plus encore
  >quand ton Fils prend notre condition humaine
  >pour nous guérir de la mort :
  ainsi, tu fais de notre existence périssable
  >un passage vers le salut,
  >par le Christ, notre Seigneur.

  Par lui, les anges adorent ta majesté
  >et se réjouissent en ta présence à jamais.
  À leur hymne de louange,
  >laisse-nous joindre nos voix
  >pour chanter et proclamer :
