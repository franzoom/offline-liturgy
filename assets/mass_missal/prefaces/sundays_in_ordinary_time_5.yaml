title: 5ème préface des dimanches du Temps Ordinaire
subtitle: La création
note: Cette préface se dit les dimanches du Temps ordinaire.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Toi, le Créateur de tous les éléments du monde,
  >Maître des temps et de l’histoire,
  tu as formé l’homme à ton image
  >et tu lui as soumis l’univers et ses merveilles ;
  tu lui as confié ta création
  >afin qu’il en soit le gardien
  et qu’en admirant ton œuvre
  >il ne cesse de te rendre grâce,
  >par le Christ, notre Seigneur.

  C’est pourquoi nous te louons avec tous les anges
  >et, dans la joie, nous te célébrons en proclamant :
