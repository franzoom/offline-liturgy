title: 6ème préface des dimanches du Temps Ordinaire
subtitle: Les arrhes de la Pâque éternelle
note: Cette préface se dit les dimanches du Temps ordinaire.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  C’est en toi que nous sont donnés
  >la vie, le mouvement et l’être ;
  dans notre corps, nous éprouvons chaque jour
  >les effets de ta tendresse,
  >et nous avons déjà la promesse de la vie éternelle :
  nous avons reçu les premiers dons de l’Esprit
  >par qui tu as ressuscité Jésus d’entre les morts,
  et nous tenons cette espérance
  >que vive à jamais en nous le mystère de Pâques.

  C’est pourquoi nous te louons avec tous les anges
  >et, dans la joie, nous te célébrons en proclamant :
