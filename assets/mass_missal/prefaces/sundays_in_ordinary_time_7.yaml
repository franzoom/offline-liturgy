title: 7ème préface des dimanches du Temps Ordinaire
subtitle: Sauvés par l’obéissance du Christ
note: Cette préface se dit les dimanches du Temps ordinaire.
content: |-
  Vraiment il est juste et bon,
  >pour ta gloire et notre salut,
  de t’offrir notre action de grâce,
  >toujours et en tout lieu,
  Seigneur, Père très saint,
  >Dieu éternel et tout-puissant.

  Dans ta miséricorde, tu as tellement aimé le monde
  >que tu nous as envoyé le Rédempteur ;
  tu l’as voulu à notre ressemblance
  >en toute chose à l’exception du péché,
  afin d’aimer en nous
  >ce que tu aimais en lui ;
  tes dons que nous avions perdus
  >par la désobéissance du péché,
  nous les retrouvons par l’obéissance de ton Fils.

  C’est pourquoi,
  >avec les anges et tous les saints,
  nous te louons, Seigneur,
  >et nous exultons de joie en proclamant :
