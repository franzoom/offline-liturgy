title: 2ème préface de la Vierge Marie
subtitle: L'Église loue Dieu avec les paroles de Marie
note: Cette préface se dit aux messes de la bienheureuse Vierge Marie.
content: |-
  Vraiment, Père très saint,
  >il est juste et bon, 
  >pour ta gloire et notre salut, 
  de te proclamer admirable 
  >dans le triomphe de tous les saints, 
  et, plus encore, de dire la grandeur de ta bonté 
  >pour fêter la bienheureuse Vierge Marie,
  >en reprenant son cantique d’action de grâce.

  Oui, tu as fait des merveilles pour la terre entière
  >et tu as étendu ta miséricorde à tous les âges,
  en choisissant ton humble servante 
  >pour donner au monde le Sauveur, 
  >ton Fils, le Seigneur Jésus Christ.

  Par lui, les anges adorent ta majesté 
  >et se réjouissent en ta présence à jamais. 
  À leur hymne de louange, 
  >laisse-nous joindre nos voix 
  >pour chanter et proclamer:
