title: 2ème préface du Saint Sacrement
subtitle: Les fruits de la Sainte Eucharistie
note: Cette préface se dit à la solennité du Corps et du Sang du Christ, et aux messes votives de la Sainte Eucharistie.
content: |-
  Vraiment il est juste et bon, 
  >pour ta gloire et notre salut, 
  de t’offrir notre action de grâce, 
  >toujours et en tout lieu, 
  Seigneur, Père très saint, 
  >Dieu éternel et tout-puissant, 
  >par le Christ, notre Seigneur.

  Lors du dernier repas qu’il partageait avec ses Apôtres, 
  >voulant perpétuer la mémoire du salut par la croix, 
  il s’est offert à toi, comme l’Agneau sans tache, 
  >et tu as accueillir son sacrifice de parfaite louange.

  Quand tes fidèles communient à ce mystère incomparable,
  >tu les sanctifies, 
  pour que la famille humaine, habitant un même univers,
  >soit éclairée par une même foi 
  >et réunie dans une même charité.

  Nous venons à la table de cet admirable sacrement, 
  >pour être imprégnés de la douceur de ta grâce
  >et transformés à l’image de ce nous serons au ciel.

  C’est pourquoi le ciel et la terre t’adorent ; 
  >ils te chantent le cantique nouveau, 
  et nous-mêmes, 
  >unissant notre voix à celle des anges, 
  >nous t’acclamons :
