title: Préface pour la fête de saint Vincent
subtitle: Le courage du diacre et martyr dans l’épreuve
content: |-
  Vraiment il est juste et bon de te rendre gloire,
  de t’offrir notre action de grâce, toujours et en tout lieu,
  à toi, Père très saint, Dieu éternel et tout-puissant.
  En ce jour où nous fêtons le martyre de saint Vincent,
  nous voulons te chanter et te glorifier.
  Car, dans sa faiblesse d’homme,
  il n’aurait pu triompher des supplices
  si tu ne l’avais rendu inébranlable dans la foi
  par la force de ta grâce.
  Ainsi, pour confesser le nom du Christ,
  et pour marcher jusqu’au bout à sa suite,
  il n’a pas craint d’affronter la mort ;
  Maintenant, dans la joie éternelle,
  il a reçu la couronne de la victoire.
  C’est pourquoi, avec les anges dans le ciel,
  nous pouvons te bénir sur la terre
  et t’adorer en chantant (disant) :
