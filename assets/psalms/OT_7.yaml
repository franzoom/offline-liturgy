title: Cantique de Judith
subtitle: Au Dieu créateur, protecteur de son peuple
commentary: Heureuse celle qui a cru. (Lc 1, 45)
biblicalReference: Jdt 16,2-9
shortReference: AT 7
content: |-
  {1}Chantez pour mon Die_u_ sur les tambourins.
  Jouez pour le Seigne_u_r sur les cymbales !
  Joignez pour lui l'hymne à la louange.
  
  Exaltez-le ! Invoqu_e_z son nom !
  {2}Le Seigneur est un Die_u_ briseur de guerres ;
  son nom est « L_e_ Seigneur ».
  
  {13}Je chanterai pour mon Die_u_ un chant nouveau.
  Seigneur, tu es glorie_u_x, tu es grand,
  admirable de f_o_rce, invincible.
  
  {14}Que ta création, tout enti_è_re, te serve !
  Tu dis, et elle existe. *
  Tu envoies ton so_u_ffle : elle est créée.
  >Nul ne rés_i_ste à ta voix.
  
  {15}Si les bases des montagnes cro_u_lent dans les eaux,
  si les rochers, devant ta face, f_o_ndent comme cire,
  tu feras grâce à ce_u_x qui te craignent.