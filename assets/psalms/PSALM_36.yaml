title: Psaume 36-I
subtitle: Vrai et faux bonheur
commentary: "Heureux les doux : ils obtiendront la terre promise. (Mt 5, 4)"
biblicalReference: Ps 36
shortReference: Ps 36
content: |-
  {1}Ne t’indigne pas à la v_u_e des méchants,
  n’envie pas les g_e_ns malhonnêtes ;
  {2}aussi vite que l’h_e_rbe, ils se fanent ;
  comme la verd_u_re, ils se flétrissent.

  {3}Fais confiance au Seigne_u_r, agis bien,
  habite la terre et r_e_ste fidèle ;
  {4}mets ta j_o_ie dans le Seigneur :
  il comblera les dés_i_rs de ton cœur.

  {5}Dirige ton chem_i_n vers le Seigneur,
  fais-lui confiance, et lu_i_, il agira.
  {6}Il fera lever comme le jo_u_r ta justice,
  et ton droit comme le pl_e_in midi.

  {7}Repose-t_o_i sur le Seigneur
  et c_o_mpte sur lui.
  Ne t’indigne pas devant celu_i_ qui réussit,
  devant l’homme qui _u_se d’intrigues.

  {8}Laisse ta colère, c_a_lme ta fièvre,
  ne t’indigne pas : il n’en viendr_a_it que du mal ;
  {9}les méchants ser_o_nt déracinés,
  mais qui espère le Seigneur posséder_a_ la terre.

  {10}Encore un peu de t_e_mps : plus d’impie ;
  tu pénètres chez lu_i_ : il n’y est plus.
  {11}Les doux posséder_o_nt la terre
  et jouiront d’une abond_a_nte paix.

  {12}L’impie peut intrigu_e_r contre le juste
  et grincer des d_e_nts contre lui,
  {13}le Seigneur se m_o_que du méchant
  car il voit son jo_u_r qui arrive.

  {14}L’impie a tiré son épée, il a tend_u_ son arc *
  pour abattre le pauvre et le faible,
  >pour tu_e_r l’homme droit.
  {15}Mais l’épée lui entrer_a_ dans le cœur,
  et son _a_rc se brisera.

  {16}Pour le juste, avoir pe_u_ de biens
  vaut mieux que la fort_u_ne des impies.
  {17}Car le bras de l’imp_i_e sera brisé,
  mais le Seigneur souti_e_nt les justes.

  {18}Il connaît les jo_u_rs de l’homme intègre
  qui recevra un hérit_a_ge impérissable.
  {19}Pas de honte pour lu_i_ aux mauvais jours ;
  aux temps de famine, il ser_a_ rassasié.

  {20}Mais oui, les imp_i_es disparaîtront
  comme la par_u_re des prés ;
  c’en est fini des ennem_i_s du Seigneur :
  ils s’en v_o_nt en fumée.

  {21}L’impie empr_u_nte et ne rend pas ;
  le juste a piti_é_ : il donne.
  {22}Ceux qu’il bénit posséder_o_nt la terre,
  ceux qu’il maudit ser_o_nt déracinés.

  {23}Quand le Seigneur condu_i_t les pas de l’homme,
  ils sont fermes et sa m_a_rche lui plaît.
  {24}S’il trébuche, il ne t_o_mbe pas
  car le Seigneur le souti_e_nt de sa main.

  {25}Jamais, de ma jeun_e_sse à mes vieux jours, *
  je n’ai vu le juste abandonné
  >ni ses enfants mendi_e_r leur pain.
  {26}Chaque jour il a piti_é_, il prête ;
  ses descend_a_nts seront bénis.

  {27}Évite le mal, f_a_is ce qui est bien,
  et tu auras une habitati_o_n pour toujours,
  {28}car le Seigneur _a_ime le bon droit,
  il n’abandonne p_a_s ses amis.

  Ceux-là seront préserv_é_s à jamais,
  les descendants de l’impie ser_o_nt déracinés.
  {29}Les justes posséder_o_nt la terre
  et toujo_u_rs l’habiteront.

  {30}Les lèvres du juste red_i_sent la sagesse
  et sa bouche én_o_nce le droit.
  {31}La loi de son Die_u_ est dans son cœur ;
  il va, sans cr_a_indre les faux pas.

  {32}Les impies gu_e_ttent le juste,
  ils cherchent à le f_a_ire mourir.
  {33}Mais le Seigneur ne saur_a_it l’abandonner
  ni le laisser condamn_e_r par ses juges.

  {34}Esp_è_re le Seigneur,
  et g_a_rde son chemin :
  il t’élèvera jusqu’à posséd_e_r la terre ;
  tu verras les imp_i_es déracinés.

  {35}J’ai vu l’imp_i_e dans sa puissance
  se déployer comme un c_è_dre vigoureux.
  {36}Il a passé, voic_i_ qu’il n’est plus ;
  je l’ai cherché, il _e_st introuvable.

  {37}Considère l’homme droit, v_o_is l’homme intègre :
  un avenir est prom_i_s aux pacifiques.
  {38}Les pécheurs seront to_u_s déracinés,
  et l’avenir des imp_i_es, anéanti.

  {39}Le Seigneur est le sal_u_t pour les justes,
  leur abri au t_e_mps de la détresse.
  {40}Le Seigneur les _a_ide et les délivre, *
  il les délivre de l’impie, il les sauve,
  >car ils cherchent en lu_i_ leur refuge.