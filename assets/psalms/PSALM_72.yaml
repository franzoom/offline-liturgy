title: Psaume 72
subtitle: Paradoxe de la prospérité des impies
commentary: Heureux celui qui ne tombera pas à cause de moi. (Mt 11, 6)
biblicalReference: Ps 72, 1-23
shortReference: Ps 72
content: |-
  {1}Vraiment, Dieu est b_o_n pour Israël,
  pour les h_o_mmes au cœur pur.

  {2}Un rien, et je p_e_rdais pied,
  un peu plus, et je fais_a_is un faux pas ;
  {3}car j’étais jalo_u_x des superbes,
  je voyais le succ_è_s des impies.

  {4}Jusqu’à leur mort, ils ne m_a_nquent de rien,
  ils jouissent d’une sant_é_ parfaite ;
  {5}ils échappent aux souffr_a_nces des hommes,
  aux coups qui fr_a_ppent les mortels.

  {6}Ainsi, l’orgu_e_il est leur collier,
  la violence, l’hab_i_t qui les couvre ;
  {7}leurs yeux qui br_i_llent de bien-être
  trahissent les env_i_es de leur cœur.

  {8}Ils ricanent, ils pr_ô_nent le mal,
  de très haut, ils pr_ô_nent la force ;
  {9}leur bouche accap_a_re le ciel,
  et leur langue parco_u_rt la terre.

  {10}Ainsi, le peuple se déto_u_rne
  vers la source d’une t_e_lle abondance.
  {11}Ils disent : « Comment Die_u_ saurait-il ?
  le Très-Haut, qu_e_ peut-il savoir ? »

  {12}Voyez comme s_o_nt les impies :
  tranquilles, ils am_a_ssent des fortunes.

  {13}Vraiment, c’est en vain que j’ai gard_é_ mon cœur pur,
  lavé mes mains en s_i_gne d’innocence !
  {14}Me voici frapp_é_ chaque jour,
  châti_é_ dès le matin.

  {15}Si j’avais dit : « Je vais parl_e_r comme eux »,
  j’aurais trahi la r_a_ce de tes fils.
  {16}Longtemps, j’ai cherch_é_ à savoir,
  je me suis donn_é_ de la peine.

  {17}Mais quand j’entrai dans la deme_u_re de Dieu,
  je compris quel ser_a_it leur avenir.
  {18}Vraiment, tu les as m_i_s sur la pente :
  déjà tu les entr_a_înes vers la ruine.

  {19}Comment vont-ils soud_a_in au désastre,
  anéantis, achev_é_s par la terreur ?
  {20}À ton réveil, Seigneur, tu ch_a_sses leur image,
  comme un songe au sort_i_r du sommeil.

  {21}Oui, mon cœ_u_r s’aigrissait,
  j’avais les r_e_ins transpercés.
  {22}Moi, stup_i_de, comme une bête,
  je ne savais pas, mais j’ét_a_is avec toi.

  {23}Moi, je suis toujo_u_rs avec toi,
  avec toi qui as sais_i_ ma main droite.
  {24}Tu me conduis sel_o_n tes desseins ;
  puis tu me prendr_a_s dans la gloire.

  {25}Qui donc est pour m_o_i dans le ciel
  si je n’ai, même avec toi, aucune j_o_ie sur la terre ?
  {26}Ma chair et mon cœ_u_r sont usés :
  ma part, le roc de mon cœur, c’est Die_u_ pour toujours.

  {27}Qui s’éloigne de t_o_i périra :
  tu détruis ce_u_x qui te délaissent.
  {28}Pour moi, il est bon d’être pr_o_che de Dieu ;
  j’ai pris refuge aupr_è_s de mon Dieu
  pour annoncer les œ_u_vres du Seigneur
  aux p_o_rtes de Sion.
