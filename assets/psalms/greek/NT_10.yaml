title: Cantique de l’Apocalypse
subtitle: null
commentary: null
biblicalReference: Ap 11,17-18.12,10-12
shortReference: NT 10
content: |-
  {11.17}Εὐχαριστοῦμέν σοι, +
  κύριε, ὁ θεός, ὁ παντοκράτωρ, *
  ὁ ὢν καὶ ὁ ἦν,
  
  ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  καὶ ἐβασίλευσας.

  {18}καὶ τὰ ἔθνη ὠργίσθησαν, +
  καὶ ἦλθεν ἡ ὀργή σου *
  καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι
  
  καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου
  >τοῖς προφήταις καὶ τοῖς ἁγίοις *
  καὶ τοῖς φοβουμένοις τὸ ὄνομά σου,
  >τοὺς μικροὺς καὶ τοὺς μεγάλους.

  {12.10}Ἄρτι ἐγένετο ἡ σωτηρία +
  >καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν *
  καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ,
  
  ὅτι ἐβλήθη ὁ κατήγωρ τῶν ἀδελφῶν ἡμῶν,
  ὁ κατηγορῶν αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν
  >ἡμέρας καὶ νυκτός.

  {11}καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου +
  καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, *
  καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·

  {12}διὰ τοῦτο εὐφραίνεσθε, οἱ οὐρανοὶ *
  καὶ οἱ ἐν αὐτοῖς σκηνοῦντες.
