title: Cantique de l’Apocalypse
subtitle: null
commentary: null
biblicalReference: Ap 15,3-4
shortReference: NT 11
content: |-
  {3}Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου,
  κύριε, ὁ θεός, ὁ παντοκράτωρ·
  
  δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου,
  ὁ βασιλεὺς τῶν αἰώνων·

  {4}τίς οὐ μὴ φοβηθῇ, κύριε,
  καὶ δοξάσει τὸ ὄνομά σου,
  
  ὅτι μόνος ὅσιος; +
  ὅτι πάντα τὰ ἔθνη ἥξουσιν
  >καὶ προσκυνήσουσιν ἐνώπιόν σου, *
  ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
