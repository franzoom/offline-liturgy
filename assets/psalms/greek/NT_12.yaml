title: Cantique de l’Apocalypse
subtitle: null
commentary: null
biblicalReference: Ap 19, 1-2.5-7
shortReference: NT 12
content: |-
  {1}Ἁλληλουϊά·
  
  ἡ σωτηρία καὶ ἡ δόξα καὶ ἡ δύναμις
  >τοῦ θεοῦ ἡμῶν,
  {2}ὅτι ἀληθιναὶ καὶ δίκαιαι
  >αἱ κρίσεις αὐτοῦ·

  {5}Αἰνεῖτε τῷ θεῷ ἡμῶν,
  >πάντες οἱ δοῦλοι αὐτοῦ,
  καὶ οἱ φοβούμενοι αὐτόν,
  >οἱ μικροὶ καὶ οἱ μεγάλοι.

  {6}Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος,
  >ὁ θεός, ὁ παντοκράτωρ.
  {7}χαίρωμεν καὶ ἀγαλλιῶμεν,
  >καὶ δώσομεν τὴν δόξαν αὐτῷ,
  
   ὅτι ἦλθεν ὁ γάμος
   >τοῦ ἀρνίου,
   καὶ ἡ γυνὴ αὐτοῦ
   >ἡτοίμασεν ἑαυτήν
