title: Cantique de l’Apocalypse
subtitle: null
commentary: null
biblicalReference: Ap 4,11.5,9-10.12
shortReference: NT 9
content: |-
  {4.11}Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ἡμῶν, *
  λαβεῖν τὴν δόξαν
  >καὶ τὴν τιμὴν καὶ τὴν δύναμιν,
  
  ὅτι σὺ ἔκτισας τὰ πάντα, *
  καὶ διὰ τὸ θέλημά σου ἦσαν
  >καὶ ἐκτίσθησαν.

  {5.9}Ἄξιος εἶ λαβεῖν τὸ βιβλίον *
  καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ,
  
  ὅτι ἐσφάγης +
  καὶ ἠγόρασας τῷ θεῷ ἐν τῷ αἵματί σου *
  ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,

  {10}καὶ ἐποίησας αὐτοὺς τῷ θεῷ
  >ἡμῶν βασιλείαν καὶ ἱερεῖς, *
  καὶ βασιλεύουσιν ἐπὶ τῆς γῆς.

  {12}Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον +
  λαβεῖν τὴν δύναμιν καὶ πλοῦτον καὶ σοφίαν *
  καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
