title: Cantique d’Azarias
subtitle: null
commentary: null
biblicalReference: Dn 3, 26-29.34-41
shortReference: AT 39
content: |-
  {26}Εὐλογητὸς εἶ, Κύριε ὁ θεὸς τῶν πατέρων ἡμῶν, καὶ αἰνετός, καὶ δεδοξασμένον τὸ ὄνομά σου εἰς τοὺς αἰῶνας.

  {27}ὅτι δίκαιος εἶ ἐπὶ πᾶσιν οἷς ἐποίησας, καὶ πάντα τὰ ἔργα σου ἀληθινά, καὶ εὐθεῖαι αἱ ὁδοί σου, καὶ πᾶσαι αἱ κρίσεις σου ἀλήθεια.

  {29}ὅτι ἡμάρτομεν καὶ ἠνομήσαμεν ἀποστῆναι ἀπὸ σοῦ, καὶ ἐξημάρτομεν ἐν πᾶσιν·

  {34}μὴ δὴ παραδοῖς ἡμᾶς εἰς τέλος διὰ τὸ ὄνομά σου, καὶ μὴ διασκεδάσῃς τὴν διαθήκην σου,

  {35}καὶ μὴ ἀποστήσῃς τὸ ἔλεός σου ἀφʼ ἡμῶν, διὰ Ἀβραὰμ τὸν ἠγαπημένον ὑπὸ σοῦ καὶ διὰ Ἰσαὰκ τὸν δοῦλόν σου καὶ Ἰσραὴλ τὸν ἅγιόν σου,

  {36}οἶς ἐλάλησας πληθῦναι τὸ σπέρμα αὐτῶν ὡς τὰ ἄστρα τοῦ οὐρανοῦ καὶ ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης.

  {37}ὅτι, δέσποτα, ἐσμικρύνθημεν παρὰ πάντα τὰ ἔθνη, καί ἐσμεν ταπεινοὶ ἐν πάσῃ τῇ γῇ σήμερον διὰ τὰς ἁμαρτίας ἡμῶν.

  {38}καὶ οὐκ ἔστιν ἐν τῷ καιρῷ τούτῳ ἄρχων καὶ προφήτης καὶ ἡγούμενος, οὐδὲ ὁλοκαύτωσις οὐδὲ θυσία οὐδὲ προσφορὰ οὐδὲ θυμίαμα, οὐ τόπος τοῦ καρπῶσαι ἐναντίον σου καὶ εὑρεῖν ἔλεος.

  {39}ἀλλʼ ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι ταπεινώσεως προσδεχθείημεν·

  {40}ὡς ἐν ὁλοκαυτώσει κριῶν καὶ ταύρων καὶ ἐν μυριάσιν ἀρνῶν πιόνων, οὕτως γενέσθω θυσία ἡμῶν ἐνώπιόν σου σήμερον καὶ ἐκτελέσαι ὄπισθέν σου, ὅτι οὐκ ἔσται αἰσχύνη τοῖς πεποιθόσιν ἐπὶ σοί.

  {41}καὶ νῦν ἐξακολουθοῦμεν ἐν ὅλῃ καρδίᾳ, καὶ φοβούμεθά σε καὶ ζητοῦμεν τὸ πρόσωπόν σου.
