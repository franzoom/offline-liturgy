title: Cantique des trois enfants
subtitle: null
commentary: null
biblicalReference: Dn 3, 52-57
shortReference: AT 40
content: |-
  {52}Εὐλογητὸς εἶ, Κύριε ὁ θεὸς τῶν πατέρων ἡμῶν,
  καὶ αἰνετὸς καὶ ὑπερυψούμενος εἰς τοὺς αἰῶνας·
  καὶ εὐλογημένον τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον,
  καὶ ὑπεραινετὸν καὶ ὑπερυψούμενον εἰς πάντας τοὺς αἰῶνας.

  {53}εὐλογημένος εἶ ἐν τῷ ναῷ τῆς ἁγίας δόξης σου,
  καὶ ὑπερυμνητὸς καὶ ὑπερένδοξος εἰς τοὺς αἰῶνας.

  {54}εὐλογημένος εἶ ὁ ἐπιβλέπων ἀβύσσους,
  >καθήμενος ἐπὶ χερουβείν,
  καὶ αἰνετὸς καὶ ὑπερυψωμένος εἰς τοὺς αἰῶνας.

  {55}εὐλογημένος εἶ ἐπὶ θρόνου τῆς βασιλείας σου,
  καὶ ὑπερυμνητὸς καὶ ὑπερυψωμένος εἰς τοὺς αἰῶνας.

  {56}εὐλογητὸς εἶ ἐν τῷ στερεώματι τοῦ οὐρανοῦ,
  καὶ ὑμνητὸς καὶ δεδοξασμένος εἰς τοὺς αἰῶνας.

  {57}εὐλογεῖτε, πάντα τὰ ἔργα Κυρίου, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.
