title: Cantique des trois enfants
subtitle: null
commentary: null
biblicalReference: Dn 3, 57-88.56
shortReference: AT 41
content: |-
  {57}εὐλογεῖτε, πάντα τὰ ἔργα Κυρίου, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {58}εὐλογεῖτε, οὐρανοί, τὸν κύριον ὑμνεῖτε
  καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {59}εὐλογεῖτε, ἄγγελοι Κυρίου, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {60}εὐλογεῖτε, ὕδατα καὶ πάντα τὰ ἐπάνω τοῦ οὐρανοῦ,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {61}εὐλογείτω πᾶσα ἡ δύναμις τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {62}εὐλογεῖτε, ἥλιος καὶ σελήνη, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {63}εὐλογεῖτε, ἄστρα τοῦ οὐρανοῦ, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {64}εὐλογείτω πᾶς ὄμβρος καὶ δρόσος τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {65}εὐλογεῖτε, πάντα τὰ πνεύματα, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {66}εὐλογεῖτε, πῦρ καὶ καῦμα, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {67}εὐλογεῖτε, νύκτες καὶ ἡμέραι, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {68}εὐλογεῖτε, φῶς καὶ σκότος, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {69}εὐλογεῖτε, ψῦχος καὶ καῦμα, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {70}εὐλογεῖτε, πάχνη καὶ χιόνες, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {71}εὐλογεῖτε, νύκτες καὶ ἡμέραι, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {72}εὐλογεῖτε, φῶς καὶ σκότος, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {73}εὐλογεῖτε, ἀστραπαὶ καὶ νεφέλαι, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {74}εὐλογείτω ἡ γῆ τὸν κύριον· 
  μνείτω καὶ ὑπερυψούτω αὐτὸν εἰς τοὺς αἰῶνας.

  {75}εὐλογεῖτε, ὄρη καὶ βουνοί, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {76}εὐλογεῖτε, πάντα τὰ φυόμενα ἐν τῇ γῇ, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {77}εὐλογεῖτε, αἱ πηγαί, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {78}εὐλογεῖτε, θάλασσαι καὶ ποταμοί, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {79}εὐλογεῖτε, κήτη καὶ πάντα τὰ κινούμενα ἐν ὕδασιν,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {80}εὐλογεῖτε, πάντα τὰ πετεινὰ τοῦ οὐρανοῦ,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {81}εὐλογεῖτε, πάντα τὰ θηρία καὶ τὰ κτήνη,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {82}εὐλογεῖτε, οἱ υἱοὶ τῶν ἀνθρώπων, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {83}εὐλογεῖτε, Ἰσραήλ, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {84}εὐλογεῖτε, ἱερεῖς, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {85}εὐλογεῖτε, δοῦλοι, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {86}εὐλογεῖτε, πνεύματα καὶ ψυχαὶ δικαίων,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {87}εὐλογεῖτε, ὅσιοι καὶ ταπεινοὶ τῇ καρδίᾳ,
  >τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.

  {88}εὐλογεῖτε, Ἀνανία, Ἀζαρία, Μεισαήλ, τὸν κύριον·
  ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας·
  
  {56}εὐλογητὸς εἶ ἐν τῷ στερεώματι τοῦ οὐρανοῦ,
  καὶ ὑμνητὸς καὶ δεδοξασμένος εἰς τοὺς αἰῶνας.
