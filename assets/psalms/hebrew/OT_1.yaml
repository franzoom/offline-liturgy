title: Cantique de Moïse
subtitle: null
commentary: null
biblicalReference: Ex 15, 1-4.7-18
shortReference: AT 1
content: |-
  {1}אָ֣ז יָשִֽׁיר־מֹשֶׁה֩ וּבְנֵ֨י יִשְׂרָאֵ֜ל אֶת־הַשִּׁירָ֤ה הַזֹּאת֙ לַֽיהוָ֔ה וַיֹּאמְר֖וּ לֵאמֹ֑ר
  אָשִׁ֤ירָה לַֽיהוָה֙ כִּֽי־גָאֹ֣ה גָּאָ֔ה ס֥וּס וְרֹכְב֖וֹ רָמָ֥ה בַיָּֽם׃

  {2}עָזִּ֤י וְזִמְרָת֙ יָ֔הּ וַֽיְהִי־לִ֖י
  לִֽישׁוּעָ֑ה
  זֶ֤ה אֵלִי֙ וְאַנְוֵ֔הוּ
  אֱלֹהֵ֥י אָבִ֖י וַאֲרֹמְמֶֽנְהוּ׃

  {3}יְהוָ֖ה אִ֣ישׁ מִלְחָמָ֑ה
  יְהוָ֖ה שְׁמֽוֹ׃

  {4}מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְחֵיל֖וֹ יָרָ֣ה בַיָּ֑ם
  וּמִבְחַ֥ר שָֽׁלִשָׁ֖יו
  טֻבְּע֥וּ בְיַם־סֽוּף׃

  {7}וּבְרֹ֥ב גְּאוֹנְךָ֖ תַּהֲרֹ֣ס קָמֶ֑יךָ
  תְּשַׁלַּח֙ חֲרֹ֣נְךָ֔ יֹאכְלֵ֖מוֹ כַּקַּֽשׁ׃

  {8}וּבְר֤וּחַ אַפֶּ֨יךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ־נֵ֖ד
  נֹזְלִ֑ים
  קָֽפְא֥וּ תְהֹמֹ֖ת בְּלֶב־יָֽם׃

  {9}אָמַ֥ר אוֹיֵ֛ב אֶרְדֹּ֥ף אַשִּׂ֖יג אֲחַלֵּ֣ק שָׁלָ֑ל
  תִּמְלָאֵ֣מוֹ נַפְשִׁ֔י
  אָרִ֣יק חַרְבִּ֔י תּוֹרִישֵׁ֖מוֹ יָדִֽי׃

  {10}נָשַׁ֥פְתָּ בְרוּחֲךָ֖ כִּסָּ֣מוֹ יָ֑ם
  צָֽלֲלוּ֙ כַּֽעוֹפֶ֔רֶת
  בְּמַ֖יִם אַדִּירִֽים׃

  {11}מִֽי־כָמֹ֤כָה בָּֽאֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖כָה נֶאְדָּ֣ר בַּקֹּ֑דֶשׁ
  נוֹרָ֥א תְהִלֹּ֖ת
  עֹ֥שֵׂה פֶֽלֶא׃

  {12}נָטִ֨יתָ֙ יְמִ֣ינְךָ֔ תִּבְלָעֵ֖מוֹ אָֽרֶץ׃

  {13}נָחִ֥יתָ בְחַסְדְּךָ֖ עַם־ז֣וּ גָּאָ֑לְתָּ
  נֵהַ֥לְתָּ בְעָזְּךָ֖ אֶל־נְוֵ֥ה קָדְשֶֽׁךָ׃

  [{14}שָֽׁמְע֥וּ עַמִּ֖ים יִרְגָּז֑וּן
  חִ֣יל אָחַ֔ז יֹשְׁבֵ֖י פְּלָֽשֶׁת׃

  {15}אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃

  {16}תִּפֹּ֨ל עֲלֵיהֶ֤ם אֵימָ֨תָה֙ וָפַ֔חַד בִּגְדֹ֥ל זְרוֹעֲךָ֖ יִדְּמ֣וּ כָּאָ֑בֶן עַד־יַעֲבֹ֤ר עַמְּךָ֙ יְהוָ֔ה עַֽד־יַעֲבֹ֖ר עַם־ז֥וּ קָנִֽיתָ׃]

  {17}תְּבִאֵ֗מוֹ וְתִטָּעֵ֨מוֹ֙ בְּהַ֣ר נַחֲלָֽתְךָ֔
  מָכ֧וֹן לְשִׁבְתְּךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה
  מִקְּדָ֕שׁ
  אֲדֹנָ֖י כּוֹנְנ֥וּ יָדֶֽיךָ׃

  {18}יְהוָ֥ה ׀ יִמְלֹ֖ךְ לְעֹלָ֥ם וָעֶֽד׃
