title: Cantique de Moïse
subtitle: null
commentary: null
biblicalReference: Dt 32, 1-12
shortReference: AT 2
content: |-
  {1}הַאֲזִ֥ינוּ הַשָּׁמַ֖יִם וַאֲדַבֵּ֑רָה
  וְתִשְׁמַ֥ע הָאָ֖רֶץ אִמְרֵי־פִֽי׃

  {2}יַעֲרֹ֤ף כַּמָּטָר֙ לִקְחִ֔י תִּזַּ֥ל כַּטַּ֖ל
  אִמְרָתִ֑י
  כִּשְׂעִירִ֣ם עֲלֵי־דֶ֔שֶׁא
  וְכִרְבִיבִ֖ים עֲלֵי־עֵֽשֶׂב׃

  {3}כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א
  הָב֥וּ גֹ֖דֶל לֵאלֹהֵֽינוּ׃

  {4}הַצּוּר֙ תָּמִ֣ים פָּעֳל֔וֹ כִּ֥י כָל־דְּרָכָ֖יו
  מִשְׁפָּ֑ט
  אֵ֤ל אֱמוּנָה֙ וְאֵ֣ין עָ֔וֶל
  צַדִּ֥יק וְיָשָׁ֖ר הֽוּא׃

  {5}שִׁחֵ֥ת ל֛וֹ לֹ֖א בָּנָ֣יו מוּמָ֑ם
  דּ֥וֹר עִקֵּ֖שׁ וּפְתַלְתֹּֽל׃

  {6}הֲ־לַיְהוָה֙ תִּגְמְלוּ־זֹ֔את עַ֥ם נָבָ֖ל
  וְלֹ֣א חָכָ֑ם
  הֲלוֹא־הוּא֙ אָבִ֣יךָ קָּנֶ֔ךָ
  ה֥וּא עָֽשְׂךָ֖ וַֽיְכֹנְנֶֽךָ׃

  {7}זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ
  שְׁנ֣וֹת דּוֹר־וָד֑וֹר
  שְׁאַ֤ל אָבִ֨יךָ֙ וְיַגֵּ֔דְךָ
  זְקֵנֶ֖יךָ וְיֹ֥אמְרוּ לָֽךְ׃

  {8}בְּהַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּהַפְרִיד֖וֹ
  בְּנֵ֣י אָדָ֑ם
  יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים
  לְמִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃

  {9}כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑וֹ
  יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽוֹ׃

  {10}יִמְצָאֵ֨הוּ֙ בְּאֶ֣רֶץ מִדְבָּ֔ר וּבְתֹ֖הוּ
  יְלֵ֣ל יְשִׁמֹ֑ן
  יְסֹֽבְבֶ֨נְהוּ֙ יְב֣וֹנְנֵ֔הוּ
  יִצְּרֶ֖נְהוּ כְּאִישׁ֥וֹן עֵינֽוֹ׃

  {11}כְּנֶ֨שֶׁר֙ יָעִ֣יר קִנּ֔וֹ עַל־גּוֹזָלָ֖יו
  יְרַחֵ֑ף
  יִפְרֹ֤שׂ כְּנָפָיו֙ יִקָּחֵ֔הוּ
  יִשָּׂאֵ֖הוּ עַל־אֶבְרָתֽוֹ׃

  {12}יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑נּוּ
  וְאֵ֥ין עִמּ֖וֹ אֵ֥ל נֵכָֽר׃
