title: Cantique d’Isaïe
subtitle: null
commentary: null
biblicalReference: Is 26,1-4.7-9.12
shortReference: AT 20
content: |-
  {1}בַּיּ֣וֹם הַה֔וּא יוּשַׁ֥ר הַשִּׁיר־הַזֶּ֖ה בְּאֶ֣רֶץ יְהוּדָ֑ה
  עִ֣יר עָז־לָ֔נוּ
  יְשׁוּעָ֥ה יָשִׁ֖ית חוֹמ֥וֹת וָחֵֽל׃

  {2}פִּתְח֖וּ שְׁעָרִ֑ים
  וְיָבֹ֥א גוֹי־צַדִּ֖יק
  שֹׁמֵ֥ר אֱמֻנִֽים׃

  {3}יֵ֣צֶר סָמ֔וּךְ תִּצֹּ֖ר שָׁל֣וֹם ׀ שָׁל֑וֹם
  כִּ֥י בְךָ֖ בָּטֽוּחַ׃

  {4}בִּטְח֥וּ בַֽיהוָ֖ה עֲדֵי־עַ֑ד
  כִּ֚י בְּיָ֣הּ יְהוָ֔ה צ֖וּר עוֹלָמִֽים׃

  {7}אֹ֥רַח לַצַּדִּ֖יק מֵֽישָׁרִ֑ים
  יָשָׁ֕ר מַעְגַּ֥ל צַדִּ֖יק תְּפַלֵּֽס׃

  {8}אַ֣ף אֹ֧רַח מִשְׁפָּטֶ֛יךָ יְהוָ֖ה קִוִּינ֑וּךָ
  לְשִׁמְךָ֥ וּֽלְזִכְרְךָ֖ תַּאֲוַת־נָֽפֶשׁ׃

  {9}נַפְשִׁ֤י אִוִּיתִ֨יךָ֙ בַּלַּ֔יְלָה אַף־רוּחִ֥י בְקִרְבִּ֖י אֲשַֽׁחֲרֶ֑ךָּ
  כִּ֞י כַּאֲשֶׁ֤ר מִשְׁפָּטֶ֨יךָ֙ לָאָ֔רֶץ צֶ֥דֶק לָמְד֖וּ יֹשְׁבֵ֥י תֵבֵֽל׃

  {12}יְהוָ֕ה תִּשְׁפֹּ֥ת שָׁל֖וֹם לָ֑נוּ
  כִּ֛י גַּ֥ם כָּֽל־מַעֲשֵׂ֖ינוּ פָּעַ֥לְתָּ לָּֽנוּ׃
