title: Cantique d’Isaïe
subtitle: null
commentary: null
biblicalReference: Is 33, 13-16
shortReference: AT 22
content: |-
  {13}שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי
  וּדְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽי׃

  {14}פָּחֲד֤וּ בְצִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים
  מִ֣י ׀ יָג֣וּר לָ֗נוּ
  אֵ֚שׁ אוֹכֵלָ֔ה
  מִי־יָג֥וּר לָ֖נוּ מוֹקְדֵ֥י עוֹלָֽם׃

  {15}הֹלֵ֣ךְ צְדָק֔וֹת וְדֹבֵ֖ר מֵֽישָׁרִ֑ים
  מֹאֵ֞ס בְּבֶ֣צַע מַעֲשַׁקּ֗וֹת
  נֹעֵ֤ר כַּפָּיו֙ מִתְּמֹ֣ךְ בַּשֹּׁ֔חַד
  אֹטֵ֤ם אָזְנוֹ֙ מִשְּׁמֹ֣עַ דָּמִ֔ים
  וְעֹצֵ֥ם עֵינָ֖יו מֵרְא֥וֹת בְּרָֽע׃

  {16}ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים
  מִשְׂגַּבּ֑וֹ
  לַחְמ֣וֹ נִתָּ֔ן
  מֵימָ֖יו נֶאֱמָנִֽים׃
