title: Cantique d’Isaïe
subtitle: null
commentary: null
biblicalReference: Is 40, 9-17
shortReference: AT 25
content: |-
  {9}עַ֣ל הַר־גָּבֹ֤הַ עֲלִי־לָךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַכֹּ֨חַ֙ קוֹלֵ֔ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל־תִּירָ֔אִי אִמְרִי֙ לְעָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵיכֶֽם׃

  {10}הִנֵּ֨ה אֲדֹנָ֤י יְהוִה֙ בְּחָזָ֣ק יָב֔וֹא וּזְרֹע֖וֹ מֹ֣שְׁלָה ל֑וֹ הִנֵּ֤ה שְׂכָרוֹ֙ אִתּ֔וֹ וּפְעֻלָּת֖וֹ לְפָנָֽיו׃

  {11}כְּרֹעֶה֙ עֶדְר֣וֹ יִרְעֶ֔ה בִּזְרֹעוֹ֙ יְקַבֵּ֣ץ טְלָאִ֔ים
  וּבְחֵיק֖וֹ
  יִשָּׂ֑א
  עָל֖וֹת יְנַהֵֽל׃ ס

  {12}מִֽי־מָדַ֨ד בְּשָׁעֳל֜וֹ מַ֗יִם וְשָׁמַ֨יִם֙ בַּזֶּ֣רֶת תִּכֵּ֔ן
  וְכָ֥ל בַּשָּׁלִ֖שׁ
  עֲפַ֣ר הָאָ֑רֶץ
  וְשָׁקַ֤ל בַּפֶּ֨לֶס֙ הָרִ֔ים
  וּגְבָע֖וֹת בְּמֹאזְנָֽיִם׃

  {13}מִֽי־תִכֵּ֥ן אֶת־ר֖וּחַ יְהוָ֑ה
  וְאִ֥ישׁ עֲצָת֖וֹ יוֹדִיעֶֽנּוּ׃

  {14}אֶת־מִ֤י נוֹעָץ֙ וַיְבִינֵ֔הוּ וַֽיְלַמְּדֵ֖הוּ
  בְּאֹ֣רַח מִשְׁפָּ֑ט
  וַיְלַמְּדֵ֣הוּ דַ֔עַת
  וְדֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽנּוּ׃

  {15}הֵ֤ן גּוֹיִם֙ כְּמַ֣ר מִדְּלִ֔י
  וּכְשַׁ֥חַק מֹאזְנַ֖יִם
  נֶחְשָׁ֑בוּ
  הֵ֥ן אִיִּ֖ים
  כַּדַּ֥ק יִטּֽוֹל׃

  {16}וּלְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר
  וְחַיָּת֔וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ ס

  {17}כָּל־הַגּוֹיִ֖ם כְּאַ֣יִן נֶגְדּ֑וֹ
  מֵאֶ֥פֶס וָתֹ֖הוּ נֶחְשְׁבוּ־לֽוֹ׃
