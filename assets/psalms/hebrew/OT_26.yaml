title: Cantique d’Isaïe
subtitle: null
commentary: null
biblicalReference: Is 42, 10-16
shortReference: AT 26
content: |-
  {10}שִׁ֤ירוּ לַֽיהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖וֹ
  מִקְצֵ֣ה הָאָ֑רֶץ
  יוֹרְדֵ֤י הַיָּם֙ וּמְלֹא֔וֹ
  אִיִּ֖ים וְיֹשְׁבֵיהֶֽם׃

  {11}יִשְׂא֤וּ מִדְבָּר֙ וְעָרָ֔יו חֲצֵרִ֖ים
  תֵּשֵׁ֣ב קֵדָ֑ר
  יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע
  מֵרֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃

  {12}יָשִׂ֥ימוּ לַֽיהוָ֖ה כָּב֑וֹד
  וּתְהִלָּת֖וֹ בָּאִיִּ֥ים יַגִּֽידוּ׃

  {13}יְהוָה֙ כַּגִּבּ֣וֹר יֵצֵ֔א כְּאִ֥ישׁ מִלְחָמ֖וֹת
  יָעִ֣יר קִנְאָ֑ה
  יָרִ֨יעַ֙ אַף־יַצְרִ֔יחַ
  עַל־אֹיְבָ֖יו יִתְגַּבָּֽר׃ ס

  {14}הֶחֱשֵׁ֨יתִי֙ מֵֽעוֹלָ֔ם אַחֲרִ֖ישׁ
  אֶתְאַפָּ֑ק
  כַּיּוֹלֵדָ֣ה אֶפְעֶ֔ה
  אֶשֹּׁ֥ם וְאֶשְׁאַ֖ף יָֽחַד׃

  {15}אַחֲרִ֤יב הָרִים֙ וּגְבָע֔וֹת וְכָל־עֶשְׂבָּ֖ם
  אוֹבִ֑ישׁ
  וְשַׂמְתִּ֤י נְהָרוֹת֙ לָֽאִיִּ֔ים
  וַאֲגַמִּ֖ים אוֹבִֽישׁ׃

  {16}וְהוֹלַכְתִּ֣י עִוְרִ֗ים בְּדֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּנְתִיב֥וֹת לֹֽא־יָדְע֖וּ
  אַדְרִיכֵ֑ם
  אָשִׂים֩ מַחְשָׁ֨ךְ לִפְנֵיהֶ֜ם לָא֗וֹר
  וּמַֽעֲקַשִּׁים֙ לְמִישׁ֔וֹר
  אֵ֚לֶּה הַדְּבָרִ֔ים עֲשִׂיתִ֖ם וְלֹ֥א עֲזַבְתִּֽים׃
