title: Cantique d’Isaïe
subtitle: null
commentary: null
biblicalReference: Is 61,10-62,5
shortReference: AT 30
content: |-
  {61,10}שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽיהוָ֗ה תָּגֵ֤ל נַפְשִׁי֙ בֵּֽאלֹהַ֔י כִּ֤י הִלְבִּישַׁ֨נִי֙ בִּגְדֵי־יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑נִי
  כֶּֽחָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְכַכַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽיהָ׃

  {11}כִּ֤י כָאָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔הּ וּכְגַנָּ֖ה זֵרוּעֶ֣יהָ תַצְמִ֑יחַ
  כֵּ֣ן ׀ אֲדֹנָ֣י יְהוִ֗ה
  יַצְמִ֤יחַ צְדָקָה֙ וּתְהִלָּ֔ה
  נֶ֖גֶד כָּל־הַגּוֹיִֽם׃

  {62,1}לְמַ֤עַן צִיּוֹן֙ לֹ֣א אֶחֱשֶׁ֔ה וּלְמַ֥עַן יְרוּשָׁלִַ֖ם
  לֹ֣א אֶשְׁק֑וֹט
  עַד־יֵצֵ֤א כַנֹּ֨גַהּ֙ צִדְקָ֔הּ
  וִישׁוּעָתָ֖הּ כְּלַפִּ֥יד יִבְעָֽר׃

  {2}וְרָא֤וּ גוֹיִם֙ צִדְקֵ֔ךְ וְכָל־מְלָכִ֖ים
  כְּבוֹדֵ֑ךְ
  וְקֹ֤רָא לָךְ֙ שֵׁ֣ם חָדָ֔שׁ
  אֲשֶׁ֛ר פִּ֥י יְהוָ֖ה יִקֳּבֶֽנּוּ׃

  {3}וְהָיִ֛יתְ עֲטֶ֥רֶת תִּפְאֶ֖רֶת
  בְּיַד־יְהוָ֑ה
  וּצְנִ֥יף מְלוּכָ֖ה
  בְּכַף־אֱלֹהָֽיִךְ׃

  {4}לֹֽא־יֵאָמֵר֩ לָ֨ךְ ע֜וֹד עֲזוּבָ֗ה וּלְאַרְצֵךְ֙ לֹא־יֵאָמֵ֥ר עוֹד֙ שְׁמָמָ֔ה כִּ֣י לָ֗ךְ יִקָּרֵא֙ חֶפְצִי־בָ֔הּ וּלְאַרְצֵ֖ךְ בְּעוּלָ֑ה
  כִּֽי־חָפֵ֤ץ יְהוָה֙ בָּ֔ךְ וְאַרְצֵ֖ךְ תִּבָּעֵֽל׃

  {5}כִּֽי־יִבְעַ֤ל בָּחוּר֙ בְּתוּלָ֔ה יִבְעָל֖וּךְ
  בָּנָ֑יִךְ
  וּמְשׂ֤וֹשׂ חָתָן֙ עַל־כַּלָּ֔ה
  יָשִׂ֥ישׂ עָלַ֖יִךְ אֱלֹהָֽיִךְ׃
