title: Cantique de Jérémie
subtitle: null
commentary: null
biblicalReference: Jr 14, 17-21
shortReference: AT 34
content: |-
  {17}וְאָמַרְתָּ֤ אֲלֵיהֶם֙ אֶת־הַדָּבָ֣ר הַזֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥י דִּמְעָ֛ה לַ֥יְלָה וְיוֹמָ֖ם וְאַל־תִּדְמֶ֑ינָה
  כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת־עַמִּ֔י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד׃

  {18}אִם־יָצָ֣אתִי הַשָּׂדֶ֗ה וְהִנֵּה֙ חַלְלֵי־חֶ֔רֶב וְאִם֙ בָּ֣אתִי הָעִ֔יר וְהִנֵּ֖ה
  תַּחֲלוּאֵ֣י רָעָ֑ב
  כִּֽי־גַם־נָבִ֧יא גַם־כֹּהֵ֛ן סָחֲר֥וּ אֶל־אֶ֖רֶץ
  וְלֹ֥א יָדָֽעוּ׃ ס

  {19}הֲמָאֹ֨ס מָאַ֜סְתָּ אֶת־יְהוּדָ֗ה אִם־בְּצִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔נוּ וְאֵ֥ין לָ֖נוּ
  מַרְפֵּ֑א
  קַוֵּ֤ה לְשָׁלוֹם֙ וְאֵ֣ין ט֔וֹב וּלְעֵ֥ת מַרְפֵּ֖א וְהִנֵּ֥ה בְעָתָֽה׃

  {20}יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖נוּ
  עֲוֺ֣ן אֲבוֹתֵ֑ינוּ
  כִּ֥י חָטָ֖אנוּ לָֽךְ׃

  {21}אַל־תִּנְאַץ֙ לְמַ֣עַן שִׁמְךָ֔ אַל־תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑ךָ
  זְכֹ֕ר
  אַל־תָּפֵ֥ר בְּרִֽיתְךָ֖ אִתָּֽנוּ׃
