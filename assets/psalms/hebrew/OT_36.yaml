title: Cantique de Jérémie
subtitle: null
commentary: null
biblicalReference: Jr 31, 10-14
shortReference: AT 36
content: |-
  {10}שִׁמְע֤וּ דְבַר־יְהוָה֙ גּוֹיִ֔ם וְהַגִּ֥ידוּ בָאִיִּ֖ים מִמֶּרְחָ֑ק
  וְאִמְר֗וּ
  מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔נּוּ
  וּשְׁמָר֖וֹ כְּרֹעֶ֥ה עֶדְרֽוֹ׃

  {11}כִּֽי־פָדָ֥ה יְהוָ֖ה אֶֽת־יַעֲקֹ֑ב
  וּגְאָל֕וֹ מִיַּ֖ד חָזָ֥ק מִמֶּֽנּוּ׃

  {12}וּבָאוּ֮ וְרִנְּנ֣וּ בִמְרוֹם־צִיּוֹן֒ וְנָהֲר֞וּ אֶל־ט֣וּב יְהוָ֗ה
  עַל־דָּגָן֙ וְעַל־תִּירֹ֣שׁ וְעַל־יִצְהָ֔ר
  וְעַל־בְּנֵי־צֹ֖אן
  וּבָקָ֑ר
  וְהָיְתָ֤ה נַפְשָׁם֙ כְּגַ֣ן רָוֶ֔ה
  וְלֹא־יוֹסִ֥יפוּ לְדַאֲבָ֖ה עֽוֹד׃

  {13}אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּמָח֔וֹל וּבַחֻרִ֥ים וּזְקֵנִ֖ים
  יַחְדָּ֑ו
  וְהָפַכְתִּ֨י אֶבְלָ֤ם לְשָׂשׂוֹן֙ וְנִ֣חַמְתִּ֔ים
  וְשִׂמַּחְתִּ֖ים מִיגוֹנָֽם׃

  {14}וְרִוֵּיתִ֛י נֶ֥פֶשׁ הַכֹּהֲנִ֖ים דָּ֑שֶׁן
  וְעַמִּ֛י אֶת־טוּבִ֥י יִשְׂבָּ֖עוּ
  נְאֻם־יְהוָֽה׃ ס
