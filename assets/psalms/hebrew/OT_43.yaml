title: Cantique d’Habaquq
subtitle: null
commentary: null
biblicalReference: Ha 3, 2-4.13.15-18
shortReference: AT 43
content: |-
  {2}יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְךָ֙ בְּקֶ֤רֶב שָׁנִים֙ חַיֵּ֔יהוּ
  בְּקֶ֥רֶב שָׁנִ֖ים
  תּוֹדִ֑יעַ
  בְּרֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃

  {3}אֱל֨וֹהַ֙ מִתֵּימָ֣ן יָב֔וֹא וְקָד֥וֹשׁ מֵֽהַר־פָּארָ֖ן
  סֶ֑לָה
  כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔וֹ
  וּתְהִלָּת֖וֹ מָלְאָ֥ה הָאָֽרֶץ׃

  {4}וְנֹ֨גַהּ֙ כָּא֣וֹר תִּֽהְיֶ֔ה קַרְנַ֥יִם מִיָּד֖וֹ
  ל֑וֹ
  וְשָׁ֖ם חֶבְי֥וֹן עֻזֹּֽה׃

  {13}יָצָ֨אתָ֙ לְיֵ֣שַׁע עַמֶּ֔ךָ לְיֵ֖שַׁע אֶת־מְשִׁיחֶ֑ךָ
  מָחַ֤צְתָּ רֹּאשׁ֙ מִבֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד־צַוָּ֖אר סֶֽלָה׃ פ

  {15}דָּרַ֥כְתָּ בַיָּ֖ם סוּסֶ֑יךָ
  חֹ֖מֶר מַ֥יִם רַבִּֽים׃

  {16}שָׁמַ֣עְתִּי ׀ וַתִּרְגַּ֣ז בִּטְנִ֗י לְקוֹל֙ צָלֲל֣וּ שְׂפָתַ֔י יָב֥וֹא רָקָ֛ב בַּעֲצָמַ֖י
  וְתַחְתַּ֣י אֶרְגָּ֑ז
  אֲשֶׁ֤ר אָנ֨וּחַ֙ לְי֣וֹם צָרָ֔ה לַעֲל֖וֹת לְעַ֥ם יְגוּדֶֽנּוּ׃

  {17}כִּֽי־תְאֵנָ֣ה לֹֽא־תִפְרָ֗ח וְאֵ֤ין יְבוּל֙ בַּגְּפָנִ֔ים
  כִּחֵשׁ֙ מַעֲשֵׂה־זַ֔יִת
  וּשְׁדֵמ֖וֹת
  לֹא־עָ֣שָׂה אֹ֑כֶל
  גָּזַ֤ר מִמִּכְלָה֙ צֹ֔אן
  וְאֵ֥ין בָּקָ֖ר בָּרְפָתִֽים׃

  {18}וַאֲנִ֖י
  בַּיהוָ֣ה אֶעְל֑וֹזָה
  אָגִ֖ילָה
  בֵּאלֹהֵ֥י
  יִשְׁעִֽי׃
