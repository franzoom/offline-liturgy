title: Psaume 101-I
subtitle: null
commentary: null
biblicalReference: Ps 101(102), 2-12
shortReference: Ps 101
content: |-
  {2}יְ֭הוָה שִׁמְעָ֣ה תְפִלָּתִ֑י
  וְ֝שַׁוְעָתִ֗י אֵלֶ֥יךָ תָבֽוֹא׃

  {3}אַל־תַּסְתֵּ֬ר פָּנֶ֨יךָ ׀ מִמֶּנִּי֮ בְּי֪וֹם צַ֫ר לִ֥י הַטֵּֽה־אֵלַ֥י אָזְנֶ֑ךָ
  בְּי֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽנִי׃

  {4}כִּֽי־כָל֣וּ בְעָשָׁ֣ן יָמָ֑י
  וְ֝עַצְמוֹתַ֗י כְּמוֹ־קֵ֥ד נִחָֽרוּ׃

  {5}הוּכָּֽה־כָ֭עֵשֶׂב וַיִּבַ֣שׁ לִבִּ֑י
  כִּֽי־שָׁ֝כַ֗חְתִּי מֵאֲכֹ֥ל לַחְמִֽי׃

  {6}מִקּ֥וֹל אַנְחָתִ֑י
  דָּבְקָ֥ה עַ֝צְמִ֗י לִבְשָׂרִֽי׃

  {7}דָּ֭מִיתִי לִקְאַ֣ת מִדְבָּ֑ר
  הָ֝יִ֗יתִי כְּכ֣וֹס חֳרָבֽוֹת׃

  {8}שָׁקַ֥דְתִּי וָאֶֽהְיֶ֑ה
  כְּ֝צִפּ֗וֹר בּוֹדֵ֥ד עַל־גָּֽג׃

  {9}כָּל־הַ֭יּוֹם חֵרְפ֣וּנִי אוֹיְבָ֑י
  מְ֝הוֹלָלַ֗י בִּ֣י נִשְׁבָּֽעוּ׃

  {10}כִּי־אֵ֭פֶר כַּלֶּ֣חֶם אָכָ֑לְתִּי
  וְ֝שִׁקֻּוַ֗י בִּבְכִ֥י מָסָֽכְתִּי׃

  {11}מִפְּנֵֽי־זַֽעַמְךָ֥ וְקִצְפֶּ֑ךָ
  כִּ֥י נְ֝שָׂאתַ֗נִי וַתַּשְׁלִיכֵֽנִי׃

  {12}יָ֭מַי כְּצֵ֣ל נָט֑וּי
  וַ֝אֲנִ֗י כָּעֵ֥שֶׂב אִיבָֽשׁ׃
