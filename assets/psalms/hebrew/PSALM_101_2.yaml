title: Psaume 101_2
subtitle: null
commentary: null
biblicalReference: Ps 101(102), 13-23
shortReference: Ps 101
content: |-
  {13}וְאַתָּ֣ה יְ֭הוָה לְעוֹלָ֣ם תֵּשֵׁ֑ב
  וְ֝זִכְרְךָ֗ לְדֹ֣ר וָדֹֽר׃

  {14}אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן
  כִּי־עֵ֥ת לְ֝חֶֽנְנָ֗הּ כִּי־בָ֥א מוֹעֵֽד׃

  {15}כִּֽי־רָצ֣וּ עֲ֭בָדֶיךָ אֶת־אֲבָנֶ֑יהָ
  וְֽאֶת־עֲפָרָ֥הּ יְחֹנֵֽנוּ׃

  {16}וְיִֽירְא֣וּ ג֭וֹיִם אֶת־שֵׁ֣ם יְהוָ֑ה
  וְֽכָל־מַלְכֵ֥י הָ֝אָ֗רֶץ אֶת־כְּבוֹדֶֽךָ׃

  {17}כִּֽי־בָנָ֣ה יְהוָ֣ה צִיּ֑וֹן
  נִ֝רְאָ֗ה בִּכְבוֹדֽוֹ׃

  {18}פָּ֭נָה אֶל־תְּפִלַּ֣ת הָעַרְעָ֑ר
  וְלֹֽא־בָ֝זָ֗ה אֶת־תְּפִלָּתָֽם׃

  {19}תִּכָּ֣תֶב זֹ֭את לְד֣וֹר אַחֲר֑וֹן
  וְעַ֥ם נִ֝בְרָ֗א יְהַלֶּל־יָֽהּ׃

  {20}כִּֽי־הִ֭שְׁקִיף מִמְּר֣וֹם קָדְשׁ֑וֹ
  יְ֝הוָ֗ה מִשָּׁמַ֤יִם ׀ אֶל־אֶ֬רֶץ הִבִּֽיט׃

  {21}לִ֭שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר
  לְ֝פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃

  {22}לְסַפֵּ֣ר בְּ֭צִיּוֹן שֵׁ֣ם יְהוָ֑ה
  וּ֝תְהִלָּת֗וֹ בִּירוּשָׁלִָֽם׃

  {23}בְּהִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו
  וּ֝מַמְלָכ֗וֹת לַעֲבֹ֥ד אֶת־יְהוָֽה׃
