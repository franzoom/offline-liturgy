title: Psaume 101-III
subtitle: null
commentary: null
biblicalReference: Ps 101(102), 24-29
shortReference: Ps 101
content: |-
  {24}עִנָּ֖ה בַדֶּ֥רֶךְ כֹּחִ֗י קִצַּ֥ר יָמָֽי׃

  {25}אֹמַ֗ר אֵלִ֗י
  אַֽל־תַּ֭עֲלֵנִי בַּחֲצִ֣י יָמָ֑י
  בְּד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽיךָ׃

  {26}לְ֭פָנִים הָאָ֣רֶץ יָסַ֑דְתָּ
  וּֽמַעֲשֵׂ֖ה יָדֶ֣יךָ שָׁמָֽיִם׃

  {27}הֵ֤מָּה ׀ יֹאבֵדוּ֮ וְאַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭כֻלָּם כַּבֶּ֣גֶד יִבְל֑וּ
  כַּלְּב֖וּשׁ תַּחֲלִיפֵ֣ם וְֽיַחֲלֹֽפוּ׃

  {28}וְאַתָּה־ה֑וּא
  וּ֝שְׁנוֹתֶ֗יךָ לֹ֣א יִתָּֽמּוּ׃

  {29}בְּנֵֽי־עֲבָדֶ֥יךָ יִשְׁכּ֑וֹנוּ
  וְ֝זַרְעָ֗ם לְפָנֶ֥יךָ יִכּֽוֹן׃
