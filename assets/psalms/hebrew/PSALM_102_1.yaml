title: Psaume 102-I
subtitle: null
commentary: null
biblicalReference: Ps 102(103), 1-7
shortReference: Ps 102
content: |-
  {1}׀ בָּרֲכִ֣י נַ֭פְשִׁי אֶת־יְהוָ֑ה
  וְכָל־קְ֝רָבַ֗י אֶת־שֵׁ֥ם קָדְשֽׁוֹ׃

  {2}בָּרֲכִ֣י נַ֭פְשִׁי אֶת־יְהוָ֑ה
  וְאַל־תִּ֝שְׁכְּחִ֗י כָּל־גְּמוּלָֽיו׃

  {3}הַסֹּלֵ֥חַ לְכָל־עֲוֺנֵ֑כִי
  הָ֝רֹפֵ֗א לְכָל־תַּחֲלֻאָֽיְכִי׃

  {4}הַגּוֹאֵ֣ל מִשַּׁ֣חַת חַיָּ֑יְכִי
  הַֽ֝מְעַטְּרֵ֗כִי חֶ֣סֶד וְרַחֲמִֽים׃

  {5}הַמַּשְׂבִּ֣יַע בַּטּ֣וֹב עֶדְיֵ֑ךְ
  תִּתְחַדֵּ֖שׁ כַּנֶּ֣שֶׁר נְעוּרָֽיְכִי׃

  {6}עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה
  וּ֝מִשְׁפָּטִ֗ים לְכָל־עֲשׁוּקִֽים׃

  {7}יוֹדִ֣יעַ דְּרָכָ֣יו לְמֹשֶׁ֑ה
  לִבְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָיו׃
