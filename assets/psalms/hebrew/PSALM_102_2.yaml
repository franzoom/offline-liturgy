title: Psaume 102_2
subtitle: null
commentary: null
biblicalReference: Ps 102(103), 8-16
shortReference: Ps 102
content: |-
  {8}רַח֣וּם וְחַנּ֣וּן יְהוָ֑ה
  אֶ֖רֶךְ אַפַּ֣יִם וְרַב־חָֽסֶד׃

  {9}לֹֽא־לָנֶ֥צַח יָרִ֑יב
  וְלֹ֖א לְעוֹלָ֣ם יִטּֽוֹר׃

  {10}לֹ֣א כַ֭חֲטָאֵינוּ עָ֣שָׂה לָ֑נוּ
  וְלֹ֥א כַ֝עֲוֺנֹתֵ֗ינוּ גָּמַ֥ל עָלֵֽינוּ׃

  {11}כִּ֤י כִגְבֹ֣הַּ שָׁ֭מַיִם עַל־הָאָ֑רֶץ
  גָּבַ֥ר חַ֝סְדּ֗וֹ עַל־יְרֵאָֽיו׃

  {12}כִּרְחֹ֣ק מִ֭זְרָח מִֽמַּֽעֲרָ֑ב
  הִֽרְחִ֥יק מִ֝מֶּ֗נּוּ אֶת־פְּשָׁעֵֽינוּ׃

  {13}כְּרַחֵ֣ם אָ֭ב עַל־בָּנִ֑ים
  רִחַ֥ם יְ֝הוָ֗ה עַל־יְרֵאָֽיו׃

  {14}כִּי־ה֖וּא יָדַ֣ע יִצְרֵ֑נוּ
  זָ֝כ֗וּר כִּי־עָפָ֥ר אֲנָֽחְנוּ׃

  {15}אֱ֭נוֹשׁ כֶּחָצִ֣יר יָמָ֑יו
  כְּצִ֥יץ הַ֝שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃

  {16}כִּ֤י ר֣וּחַ עָֽבְרָה־בּ֣וֹ וְאֵינֶ֑נּוּ
  וְלֹא־יַכִּירֶ֖נּוּ ע֣וֹד מְקוֹמֽוֹ׃
