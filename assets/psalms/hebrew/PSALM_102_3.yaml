title: Psaume 102-III
subtitle: null
commentary: null
biblicalReference: Ps 102(103), 17-22
shortReference: Ps 102
content: |-
  {17}וְחֶ֤סֶד יְהוָ֨ה ׀ מֵעוֹלָ֣ם וְעַד־ע֭וֹלָם עַל־יְרֵאָ֑יו
  וְ֝צִדְקָת֗וֹ לִבְנֵ֥י בָנִֽים׃

  {18}לְשֹׁמְרֵ֥י בְרִית֑וֹ
  וּלְזֹכְרֵ֥י פִ֝קֻּדָ֗יו לַעֲשׂוֹתָֽם׃

  {19}יְֽהוָ֗ה בַּ֭שָּׁמַיִם הֵכִ֣ין כִּסְא֑וֹ
  וּ֝מַלְכוּת֗וֹ בַּכֹּ֥ל מָשָֽׁלָה׃

  {20}בָּרֲכ֥וּ יְהוָ֗ה
  מַלְאָ֫כָ֥יו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑וֹ
  לִ֝שְׁמֹ֗עַ בְּק֣וֹל דְּבָרֽוֹ׃

  {21}בָּרֲכ֣וּ יְ֭הוָה כָּל־צְבָאָ֑יו
  מְ֝שָׁרְתָ֗יו עֹשֵׂ֥י רְצוֹנֽוֹ׃

  {22}בָּרֲכ֤וּ יְהוָ֨ה ׀ כָּֽל־מַעֲשָׂ֗יו
  בְּכָל־מְקֹמ֥וֹת מֶמְשַׁלְתּ֑וֹ
  בָּרֲכִ֥י נַ֝פְשִׁ֗י אֶת־יְהוָֽה׃
