title: Psaume 103_1
subtitle: null
commentary: null
biblicalReference: Ps 103(104), 1-12
shortReference: Ps 103
content: |-
  {1}בָּרֲכִ֥י נַפְשִׁ֗י
  אֶת־יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַי גָּדַ֣לְתָּ מְּאֹ֑ד
  ה֭וֹד וְהָדָ֣ר לָבָֽשְׁתָּ׃

  {2}עֹֽטֶה־א֭וֹר כַּשַּׂלְמָ֑ה
  נוֹטֶ֥ה שָׁ֝מַ֗יִם כַּיְרִיעָֽה׃

  {3}הַ֥מְקָרֶֽה בַמַּ֗יִם
  עֲֽלִיּ֫וֹתָ֥יו הַשָּׂם־עָבִ֥ים רְכוּב֑וֹ
  הַֽ֝מְהַלֵּ֗ךְ עַל־כַּנְפֵי־רֽוּחַ׃

  {4}עֹשֶׂ֣ה מַלְאָכָ֣יו רוּח֑וֹת
  מְ֝שָׁרְתָ֗יו אֵ֣שׁ לֹהֵֽט׃

  {5}יָֽסַד־אֶ֭רֶץ עַל־מְכוֹנֶ֑יהָ
  בַּל־תִּ֝מּ֗וֹט עוֹלָ֥ם וָעֶֽד׃

  {6}תְּ֭הוֹם כַּלְּב֣וּשׁ כִּסִּית֑וֹ
  עַל־הָ֝רִ֗ים יַֽעַמְדוּ־מָֽיִם׃

  {7}מִן־גַּעֲרָ֣תְךָ֣ יְנוּס֑וּן
  מִן־ק֥וֹל רַֽ֝עַמְךָ֗ יֵחָפֵזֽוּן׃

  {8}יַעֲל֣וּ הָ֭רִים יֵרְד֣וּ בְקָע֑וֹת
  אֶל־מְ֝ק֗וֹם זֶ֤ה ׀ יָסַ֬דְתָּ לָהֶֽם׃

  {9}גְּֽבוּל־שַׂ֭מְתָּ בַּל־יַֽעֲבֹר֑וּן
  בַּל־יְ֝שׁוּב֗וּן לְכַסּ֥וֹת הָאָֽרֶץ׃

  {10}הַֽמְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּנְּחָלִ֑ים
  בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּן׃

  {11}יַ֭שְׁקוּ כָּל־חַיְת֣וֹ שָׂדָ֑י
  יִשְׁבְּר֖וּ פְרָאִ֣ים צְמָאָֽם׃

  {12}עֲ֭לֵיהֶם עוֹף־הַשָּׁמַ֣יִם יִשְׁכּ֑וֹן
  מִבֵּ֥ין עֳ֝פָאיִ֗ם יִתְּנוּ־קֽוֹל׃
