title: Psaume 103_2
subtitle: null
commentary: null
biblicalReference: Ps 103(104), 13-23
shortReference: Ps 103
content: |-
  {13}מַשְׁקֶ֣ה הָ֭רִים מֵעֲלִיּוֹתָ֑יו
  מִפְּרִ֥י מַ֝עֲשֶׂ֗יךָ תִּשְׂבַּ֥ע הָאָֽרֶץ׃

  {14}מַצְמִ֤יחַ חָצִ֨יר ׀ לַבְּהֵמָ֗ה
  וְ֭עֵשֶׂב לַעֲבֹדַ֣ת הָאָדָ֑ם
  לְה֥וֹצִיא לֶ֝֗חֶם מִן־הָאָֽרֶץ׃

  {15}וְיַ֤יִן ׀ יְשַׂמַּ֬ח לְֽבַב־אֱנ֗וֹשׁ
  לְהַצְהִ֣יל פָּנִ֣ים מִשָּׁ֑מֶן
  וְ֝לֶ֗חֶם לְֽבַב־אֱנ֥וֹשׁ יִסְעָֽד׃

  {16}יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה
  אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃

  {17}אֲשֶׁר־שָׁ֭ם צִפֳּרִ֣ים יְקַנֵּ֑נוּ
  חֲ֝סִידָ֗ה בְּרוֹשִׁ֥ים בֵּיתָֽהּ׃

  {18}הָרִ֣ים הַ֭גְּבֹהִים לַיְּעֵלִ֑ים
  סְ֝לָעִ֗ים מַחְסֶ֥ה לַֽשְׁפַנִּֽים׃

  {19}עָשָׂ֣ה יָ֭רֵחַ לְמוֹעֲדִ֑ים
  שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽוֹ׃

  {20}תָּֽשֶׁת־חֹ֭שֶׁךְ וִ֣יהִי לָ֑יְלָה
  בּֽוֹ־תִ֝רְמֹ֗שׂ כָּל־חַיְתוֹ־יָֽעַר׃

  {21}הַ֭כְּפִירִים שֹׁאֲגִ֣ים לַטָּ֑רֶף
  וּלְבַקֵּ֖שׁ מֵאֵ֣ל אָכְלָֽם׃

  {22}תִּזְרַ֣ח הַ֭שֶּׁמֶשׁ יֵאָסֵפ֑וּן
  וְאֶל־מְ֝עוֹנֹתָ֗ם יִרְבָּצֽוּן׃

  {23}יֵצֵ֣א אָדָ֣ם לְפָעֳל֑וֹ
  וְֽלַעֲבֹ֖דָת֣וֹ עֲדֵי־עָֽרֶב׃
