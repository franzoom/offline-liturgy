title: Psaume 103-III
subtitle: null
commentary: null
biblicalReference: Ps 103(104), 24-35
shortReference: Ps 103
content: |-
  {24}מָֽה־רַבּ֬וּ מַעֲשֶׂ֨יךָ ׀ יְֽהוָ֗ה
  כֻּ֭לָּם בְּחָכְמָ֣ה עָשִׂ֑יתָ
  מָלְאָ֥ה הָ֝אָ֗רֶץ קִנְיָנֶֽךָ׃

  {25}זֶ֤ה ׀ הַיָּ֥ם גָּדוֹל֮ וּרְחַ֪ב יָ֫דָ֥יִם שָֽׁם־רֶ֭מֶשׂ וְאֵ֣ין מִסְפָּ֑ר
  חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם־גְּדֹלֽוֹת׃

  {26}שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּן
  לִ֝וְיָתָ֗ן זֶֽה־יָצַ֥רְתָּ לְשַֽׂחֶק־בּֽוֹ׃

  {27}כֻּ֭לָּם אֵלֶ֣יךָ יְשַׂבֵּר֑וּן
  לָתֵ֖ת אָכְלָ֣ם בְּעִתּֽוֹ׃

  {28}תִּתֵּ֣ן לָ֭הֶם יִלְקֹט֑וּן
  תִּפְתַּ֥ח יָֽ֝דְךָ֗ יִשְׂבְּע֥וּן טֽוֹב׃

  {29}תַּסְתִּ֥יר פָּנֶיךָ֮ יִֽבָּהֵ֫ל֥וּן תֹּסֵ֣ף ר֭וּחָם יִגְוָע֑וּן
  וְֽאֶל־עֲפָרָ֥ם יְשׁוּבֽוּן׃

  {30}תְּשַׁלַּ֣ח ר֭וּחֲךָ יִבָּרֵא֑וּן
  וּ֝תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃

  {31}יְהִ֤י כְב֣וֹד יְהוָ֣ה לְעוֹלָ֑ם
  יִשְׂמַ֖ח יְהוָ֣ה בְּמַעֲשָֽׂיו׃

  {32}הַמַּבִּ֣יט לָ֭אָרֶץ וַתִּרְעָ֑ד
  יִגַּ֖ע בֶּהָרִ֣ים וְֽיֶעֱשָֽׁנוּ׃

  {33}אָשִׁ֣ירָה לַיהוָ֣ה בְּחַיָּ֑י
  אֲזַמְּרָ֖ה לֵאלֹהַ֣י בְּעוֹדִֽי׃

  {34}יֶעֱרַ֣ב עָלָ֣יו שִׂיחִ֑י
  אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּיהוָֽה׃

  {35}יִתַּ֤מּוּ חַטָּאִ֨ים ׀ מִן־הָאָ֡רֶץ וּרְשָׁעִ֤ים ׀ ע֤וֹד אֵינָ֗ם
  בָּרֲכִ֣י נַ֭פְשִׁי אֶת־יְהוָ֗ה הַֽלְלוּ־יָֽהּ׃
