title: Psaume 104_1
subtitle: null
commentary: null
biblicalReference: Ps 104(105), 1-11
shortReference: Ps 104
content: |-
  {1}הוֹד֣וּ לַ֭יהוָה קִרְא֣וּ בִּשְׁמ֑וֹ
  הוֹדִ֥יעוּ בָ֝עַמִּ֗ים עֲלִילוֹתָֽיו׃

  {2}שִֽׁירוּ־ל֭וֹ זַמְּרוּ־ל֑וֹ
  שִׂ֝֗יחוּ בְּכָל־נִפְלְאוֹתָֽיו׃

  {3}הִֽ֭תְהַלְלוּ בְּשֵׁ֣ם קָדְשׁ֑וֹ
  יִ֝שְׂמַ֗ח לֵ֤ב ׀ מְבַקְשֵׁ֬י יְהוָֽה׃

  {4}דִּרְשׁ֣וּ יְהוָ֣ה וְעֻזּ֑וֹ
  בַּקְּשׁ֖וּ פָנָ֣יו תָּמִֽיד׃

  {5}זִכְר֗וּ נִפְלְאוֹתָ֥יו אֲשֶׁר־עָשָׂ֑ה
  מֹ֝פְתָ֗יו וּמִשְׁפְּטֵי־פִֽיו׃

  {6}זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑וֹ
  בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽיו׃

  {7}ה֭וּא יְהוָ֣ה אֱלֹהֵ֑ינוּ
  בְּכָל־הָ֝אָ֗רֶץ מִשְׁפָּטָֽיו׃

  {8}זָכַ֣ר לְעוֹלָ֣ם בְּרִית֑וֹ
  דָּבָ֥ר צִ֝וָּ֗ה לְאֶ֣לֶף דּֽוֹר׃

  {9}אֲשֶׁ֣ר כָּ֭רַת אֶת־אַבְרָהָ֑ם
  וּשְׁב֖וּעָת֣וֹ לְיִשְׂחָֽק׃

  {10}וַיַּֽעֲמִידֶ֣הָ לְיַעֲקֹ֣ב לְחֹ֑ק
  לְ֝יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃

  {11}לֵאמֹ֗ר לְךָ֗ אֶתֵּ֥ן אֶת־אֶֽרֶץ־כְּנָ֑עַן
  חֶ֝֗בֶל נַחֲלַתְכֶֽם׃
