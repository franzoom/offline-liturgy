title: Psaume 104-II
subtitle: null
commentary: null
biblicalReference: Ps 104(105), 12-22
shortReference: Ps 104
content: |-
  {12}בִּֽ֭הְיוֹתָם מְתֵ֣י מִסְפָּ֑ר
  כִּ֝מְעַ֗ט וְגָרִ֥ים בָּֽהּ׃

  {13}וַֽ֭יִּתְהַלְּכוּ מִגּ֣וֹי אֶל־גּ֑וֹי
  מִ֝מַּמְלָכָ֗ה אֶל־עַ֥ם אַחֵֽר׃

  {14}לֹֽא־הִנִּ֣יחַ אָדָ֣ם לְעָשְׁקָ֑ם
  וַיּ֖וֹכַח עֲלֵיהֶ֣ם מְלָכִֽים׃

  {15}אַֽל־תִּגְּע֥וּ בִמְשִׁיחָ֑י
  וְ֝לִנְבִיאַי אַל־תָּרֵֽעוּ׃

  {16}וַיִּקְרָ֣א רָ֭עָב עַל־הָאָ֑רֶץ
  כָּֽל־מַטֵּה־לֶ֥חֶם שָׁבָֽר׃

  {17}שָׁלַ֣ח לִפְנֵיהֶ֣ם אִ֑ישׁ
  לְ֝עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃

  {18}עִנּ֣וּ בַכֶּ֣בֶל רַגְל֑וֹ
  בַּ֝רְזֶ֗ל בָּ֣אָה נַפְשֽׁוֹ׃

  {19}עַד־עֵ֥ת בֹּֽא־דְבָר֑וֹ
  אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְהוּ׃

  {20}שָׁ֣לַח מֶ֭לֶךְ וַיַּתִּירֵ֑הוּ
  מֹשֵׁ֥ל עַ֝מִּ֗ים וַֽיְפַתְּחֵֽהוּ׃

  {21}שָׂמ֣וֹ אָד֣וֹן לְבֵית֑וֹ
  וּ֝מֹשֵׁ֗ל בְּכָל־קִנְיָנֽוֹ׃

  {22}לֶאְסֹ֣ר שָׂרָ֣יו בְּנַפְשׁ֑וֹ
  וּזְקֵנָ֥יו יְחַכֵּֽם׃
