title: Psaume 104_3
subtitle: null
commentary: null
biblicalReference: Ps 104(105), 23-45
shortReference: Ps 104
content: |-
  {23}וַיָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם
  וְ֝יַעֲקֹ֗ב גָּ֣ר בְּאֶֽרֶץ־חָֽם׃

  {24}וַיֶּ֣פֶר אֶת־עַמּ֣וֹ מְאֹ֑ד
  וַ֝יַּֽעֲצִמֵהוּ מִצָּרָֽיו׃

  {25}הָפַ֣ךְ לִ֭בָּם לִשְׂנֹ֣א עַמּ֑וֹ
  לְ֝הִתְנַכֵּ֗ל בַּעֲבָדָֽיו׃

  {26}שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑וֹ
  אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר־בּֽוֹ׃

  {27}שָֽׂמוּ־בָ֭ם דִּבְרֵ֣י אֹתוֹתָ֑יו
  וּ֝מֹפְתִ֗ים בְּאֶ֣רֶץ חָֽם׃

  {28}שָׁ֣לַֽח חֹ֭שֶׁךְ וַיַּחְשִׁ֑ךְ
  וְלֹֽא־מָ֝ר֗וּ אֶת־דְּבָרֽוֹ׃

  {29}הָפַ֣ךְ אֶת־מֵימֵיהֶ֣ם לְדָ֑ם
  וַ֝יָּ֗מֶת אֶת־דְּגָתָֽם׃

  {30}שָׁרַ֣ץ אַרְצָ֣ם צְפַרְדְּעִ֑ים
  בְּ֝חַדְרֵ֗י מַלְכֵיהֶֽם׃

  {31}אָ֭מַר וַיָּבֹ֣א עָרֹ֑ב
  כִּ֝נִּ֗ים בְּכָל־גְּבוּלָֽם׃

  {32}נָתַ֣ן גִּשְׁמֵיהֶ֣ם בָּרָ֑ד
  אֵ֖שׁ לֶהָב֣וֹת בְּאַרְצָֽם׃

  {33}וַיַּ֣ךְ גַּ֭פְנָם וּתְאֵנָתָ֑ם
  וַ֝יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽם׃

  {34}אָ֭מַר וַיָּבֹ֣א אַרְבֶּ֑ה
  וְ֝יֶ֗לֶק וְאֵ֣ין מִסְפָּֽר׃

  {35}וַיֹּ֣אכַל כָּל־עֵ֣שֶׂב בְּאַרְצָ֑ם
  וַ֝יֹּ֗אכַל פְּרִ֣י אַדְמָתָֽם׃

  {36}וַיַּ֣ךְ כָּל־בְּכ֣וֹר בְּאַרְצָ֑ם
  רֵ֝אשִׁ֗ית לְכָל־אוֹנָֽם׃

  {37}וַֽ֭יּוֹצִיאֵם בְּכֶ֣סֶף וְזָהָ֑ב
  וְאֵ֖ין בִּשְׁבָטָ֣יו כּוֹשֵֽׁל׃

  {38}שָׂמַ֣ח מִצְרַ֣יִם בְּצֵאתָ֑ם
  כִּֽי־נָפַ֖ל פַּחְדָּ֣ם עֲלֵיהֶֽם׃

  {39}פָּרַ֣שׂ עָנָ֣ן לְמָסָ֑ךְ
  וְ֝אֵ֗שׁ לְהָאִ֥יר לָֽיְלָה׃

  {40}שָׁאַ֣ל וַיָּבֵ֣א שְׂלָ֑ו
  וְלֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽם׃

  {41}פָּ֣תַח צ֭וּר וַיָּז֣וּבוּ מָ֑יִם
  הָ֝לְכ֗וּ בַּצִּיּ֥וֹת נָהָֽר׃

  {42}כִּֽי־זָ֭כַר אֶת־דְּבַ֣ר קָדְשׁ֑וֹ
  אֶֽת־אַבְרָהָ֥ם עַבְדּֽוֹ׃

  {43}וַיּוֹצִ֣א עַמּ֣וֹ בְשָׂשׂ֑וֹן
  בְּ֝רִנָּ֗ה אֶת־בְּחִירָֽיו׃

  {44}וַיִּתֵּ֣ן לָ֭הֶם אַרְצ֣וֹת גּוֹיִ֑ם
  וַעֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃

  {45}בַּעֲב֤וּר ׀ יִשְׁמְר֣וּ חֻ֭קָּיו וְתוֹרֹתָ֥יו יִנְצֹ֗רוּ הַֽלְלוּ־יָֽהּ׃
