title: Psaume 105_1
subtitle: null
commentary: null
biblicalReference: Ps 105(106), 1-12
shortReference: Ps 105
content: |-
  {1}הַֽלְלוּ יָ֨הּ ׀ הוֹד֣וּ לַיהוָ֣ה כִּי־ט֑וֹב
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {2}מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה
  יַ֝שְׁמִ֗יעַ כָּל־תְּהִלָּתֽוֹ׃

  {3}אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט
  עֹשֵׂ֖ה צְדָקָ֣ה בְכָל־עֵֽת׃

  {4}זָכְרֵ֣נִי יְ֭הוָה בִּרְצ֣וֹן עַמֶּ֑ךָ
  פָּ֝קְדֵ֗נִי בִּישׁוּעָתֶֽךָ׃

  {5}לִרְא֤וֹת ׀ בְּט֘וֹבַ֤ת בְּחִירֶ֗יךָ
  לִ֭שְׂמֹחַ בְּשִׂמְחַ֣ת גּוֹיֶ֑ךָ
  לְ֝הִתְהַלֵּ֗ל עִם־נַחֲלָתֶֽךָ׃

  {6}חָטָ֥אנוּ עִם־אֲבוֹתֵ֗ינוּ
  הֶעֱוִ֥ינוּ הִרְשָֽׁעְנוּ׃

  {7}אֲב֘וֹתֵ֤ינוּ בְמִצְרַ֨יִם ׀ לֹא־הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗יךָ
  לֹ֣א זָ֭כְרוּ אֶת־רֹ֣ב חֲסָדֶ֑יךָ
  וַיַּמְר֖וּ עַל־יָ֣ם בְּיַם־סֽוּף׃

  {8}וַֽ֭יּוֹשִׁיעֵם לְמַ֣עַן שְׁמ֑וֹ
  לְ֝הוֹדִ֗יעַ אֶת־גְּבוּרָתֽוֹ׃

  {9}וַיִּגְעַ֣ר בְּיַם־ס֭וּף וַֽיֶּחֱרָ֑ב
  וַיּוֹלִיכֵ֥ם בַּ֝תְּהֹמ֗וֹת כַּמִּדְבָּֽר׃

  {10}וַֽ֭יּוֹשִׁיעֵם מִיַּ֣ד שׂוֹנֵ֑א
  וַ֝יִּגְאָלֵ֗ם מִיַּ֥ד אוֹיֵֽב׃

  {11}וַיְכַסּוּ־מַ֥יִם צָרֵיהֶ֑ם
  אֶחָ֥ד מֵ֝הֶ֗ם לֹ֣א נוֹתָֽר׃

  {12}וַיַּאֲמִ֥ינוּ בִדְבָרָ֑יו
  יָ֝שִׁ֗ירוּ תְּהִלָּתֽוֹ׃
