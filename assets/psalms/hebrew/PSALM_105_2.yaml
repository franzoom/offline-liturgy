title: Psaume 105-II
subtitle: null
commentary: null
biblicalReference: Ps 105(106), 13-33
shortReference: Ps 105
content: |-
  {13}מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑יו
  לֹֽא־חִ֝כּ֗וּ לַעֲצָתֽוֹ׃

  {14}וַיִּתְאַוּ֣וּ תַ֭אֲוָה בַּמִּדְבָּ֑ר
  וַיְנַסּוּ־אֵ֝֗ל בִּֽישִׁימֽוֹן׃

  {15}וַיִּתֵּ֣ן לָ֭הֶם שֶׁאֱלָתָ֑ם
  וַיְשַׁלַּ֖ח רָז֣וֹן בְּנַפְשָֽׁם׃

  {16}וַיְקַנְא֣וּ לְ֭מֹשֶׁה בַּֽמַּחֲנֶ֑ה
  לְ֝אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃

  {17}תִּפְתַּח־אֶ֭רֶץ וַתִּבְלַ֣ע דָּתָ֑ן
  וַ֝תְּכַ֗ס עַל־עֲדַ֥ת אֲבִירָֽם׃

  {18}וַתִּבְעַר־אֵ֥שׁ בַּעֲדָתָ֑ם
  לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים׃

  {19}יַעֲשׂוּ־עֵ֥גֶל בְּחֹרֵ֑ב
  וַ֝יִּשְׁתַּחֲו֗וּ לְמַסֵּכָֽה׃

  {20}וַיָּמִ֥ירוּ אֶת־כְּבוֹדָ֑ם
  בְּתַבְנִ֥ית שׁ֝֗וֹר אֹכֵ֥ל עֵֽשֶׂב׃

  {21}שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑ם
  עֹשֶׂ֖ה גְדֹל֣וֹת בְּמִצְרָֽיִם׃

  {22}נִ֭פְלָאוֹת בְּאֶ֣רֶץ חָ֑ם
  נ֝וֹרָא֗וֹת עַל־יַם־סֽוּף׃

  {23}וַיֹּ֗אמֶר לְֽהַשְׁמִ֫ידָ֥ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗וֹ
  עָמַ֣ד בַּפֶּ֣רֶץ לְפָנָ֑יו
  לְהָשִׁ֥יב חֲ֝מָת֗וֹ מֵֽהַשְׁחִֽית׃

  {24}וַֽ֭יִּמְאֲסוּ בְּאֶ֣רֶץ חֶמְדָּ֑ה
  לֹֽא־הֶ֝אֱמִ֗ינוּ לִדְבָרֽוֹ׃

  {25}וַיֵּרָגְנ֥וּ בְאָהֳלֵיהֶ֑ם
  לֹ֥א שָׁ֝מְע֗וּ בְּק֣וֹל יְהוָֽה׃

  {26}וַיִּשָּׂ֣א יָד֣וֹ לָהֶ֑ם
  לְהַפִּ֥יל א֝וֹתָ֗ם בַּמִּדְבָּֽר׃

  {27}וּלְהַפִּ֣יל זַ֭רְעָם בַּגּוֹיִ֑ם
  וּ֝לְזָרוֹתָ֗ם בָּאֲרָצֽוֹת׃

  {28}וַ֭יִּצָּ֣מְדוּ לְבַ֣עַל פְּע֑וֹר
  וַ֝יֹּאכְל֗וּ זִבְחֵ֥י מֵתִֽים׃

  {29}וַ֭יַּכְעִיסוּ בְּמַֽעַלְלֵיהֶ֑ם
  וַתִּפְרָץ־בָּ֝֗ם מַגֵּפָֽה׃

  {30}וַיַּעֲמֹ֣ד פִּֽ֭ינְחָס וַיְפַלֵּ֑ל
  וַ֝תֵּעָצַ֗ר הַמַּגֵּפָֽה׃

  {31}וַתֵּחָ֣שֶׁב ל֭וֹ לִצְדָקָ֑ה
  לְדֹ֥ר וָ֝דֹ֗ר עַד־עוֹלָֽם׃

  {32}וַ֭יַּקְצִיפוּ עַל־מֵ֥י מְרִיבָ֑ה
  וַיֵּ֥רַע לְ֝מֹשֶׁ֗ה בַּעֲבוּרָֽם׃

  {33}כִּֽי־הִמְר֥וּ אֶת־רוּח֑וֹ
  וַ֝יְבַטֵּ֗א בִּשְׂפָתָֽיו׃
