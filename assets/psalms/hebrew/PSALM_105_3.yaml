title: Psaume 105_3
subtitle: null
commentary: null
biblicalReference: Ps 105(106), 34-48
shortReference: Ps 105
content: |-
  {34}לֹֽא־הִ֭שְׁמִידוּ אֶת־הָֽעַמִּ֑ים
  אֲשֶׁ֤ר אָמַ֖ר יְהוָ֣ה לָהֶֽם׃

  {35}וַיִּתְעָרְב֥וּ בַגּוֹיִ֑ם
  וַֽ֝יִּלְמְד֗וּ מַֽעֲשֵׂיהֶֽם׃

  {36}וַיַּעַבְד֥וּ אֶת־עֲצַבֵּיהֶ֑ם
  וַיִּהְי֖וּ לָהֶ֣ם לְמוֹקֵֽשׁ׃

  {37}וַיִּזְבְּח֣וּ אֶת־בְּ֭נֵיהֶם וְאֶת־בְּנֽוֹתֵיהֶ֗ם לַשֵּֽׁדִים׃

  {38}וַיִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם־בְּנֵ֘יהֶ֤ם וּֽבְנוֹתֵיהֶ֗ם
  אֲשֶׁ֣ר זִ֭בְּחוּ לַעֲצַבֵּ֣י כְנָ֑עַן
  וַתֶּחֱנַ֥ף הָ֝אָ֗רֶץ בַּדָּמִֽים׃

  {39}וַיִּטְמְא֥וּ בְמַעֲשֵׂיהֶ֑ם
  וַ֝יִּזְנוּ֗ בְּמַֽעַלְלֵיהֶֽם׃

  {40}וַיִּֽחַר־אַ֣ף יְהוָ֣ה בְּעַמּ֑וֹ
  וַ֝יְתָעֵ֗ב אֶת־נַחֲלָתֽוֹ׃

  {41}וַיִּתְּנֵ֥ם בְּיַד־גּוֹיִ֑ם
  וַֽיִּמְשְׁל֥וּ בָ֝הֶ֗ם שֹׂנְאֵיהֶֽם׃

  {42}וַיִּלְחָצ֥וּם אוֹיְבֵיהֶ֑ם
  וַ֝יִּכָּנְע֗וּ תַּ֣חַת יָדָֽם׃

  {43}פְּעָמִ֥ים רַבּ֗וֹת
  יַצִּ֫ילֵ֥ם וְ֭הֵמָּה יַמְר֣וּ בַעֲצָתָ֑ם
  וַ֝יָּמֹ֗כּוּ בַּעֲוֺנָֽם׃

  {44}וַ֭יַּרְא בַּצַּ֣ר לָהֶ֑ם
  בְּ֝שָׁמְע֗וֹ אֶת־רִנָּתָֽם׃

  {45}וַיִּזְכֹּ֣ר לָהֶ֣ם בְּרִית֑וֹ
  וַ֝יִּנָּחֵ֗ם כְּרֹ֣ב חֲסָדָֽיו׃

  {46}וַיִּתֵּ֣ן אוֹתָ֣ם לְרַחֲמִ֑ים
  לִ֝פְנֵ֗י כָּל־שׁוֹבֵיהֶֽם׃

  {47}הוֹשִׁיעֵ֨נוּ ׀ יְה֘וָ֤ה אֱלֹהֵ֗ינוּ
  וְקַבְּצֵנוּ֮ מִֽן־הַגּ֫וֹיִ֥ם לְ֭הֹדוֹת לְשֵׁ֣ם קָדְשֶׁ֑ךָ
  לְ֝הִשְׁתַּבֵּ֗חַ בִּתְהִלָּתֶֽךָ׃

  {48}בָּר֤וּךְ־יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן־הָ֤עוֹלָ֨ם ׀ וְעַ֬ד הָעוֹלָ֗ם
  וְאָמַ֖ר כָּל־הָעָ֥ם אָמֵ֗ן הַֽלְלוּ־יָֽהּ׃
