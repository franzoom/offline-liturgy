title: Psaume 106_1
subtitle: null
commentary: null
biblicalReference: Ps 106(107), 1-16
shortReference: Ps 106
content: |-
  {1}הֹד֣וּ לַיהוָ֣ה כִּי־ט֑וֹב
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {2}יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה
  אֲשֶׁ֥ר גְּ֝אָלָ֗ם מִיַּד־צָֽר׃

  {3}וּֽמֵאֲרָצ֗וֹת
  קִ֫בְּצָ֥ם מִמִּזְרָ֥ח וּמִֽמַּעֲרָ֑ב
  מִצָּפ֥וֹן וּמִיָּֽם׃

  {4}תָּע֣וּ בַ֭מִּדְבָּר בִּישִׁימ֣וֹן דָּ֑רֶךְ
  עִ֥יר מ֝וֹשָׁ֗ב לֹ֣א מָצָֽאוּ׃

  {5}רְעֵבִ֥ים גַּם־צְמֵאִ֑ים
  נַ֝פְשָׁ֗ם בָּהֶ֥ם תִּתְעַטָּֽף׃

  {6}וַיִּצְעֲק֣וּ אֶל־יְ֭הוָה בַּצַּ֣ר לָהֶ֑ם
  מִ֝מְּצֽוּקוֹתֵיהֶ֗ם יַצִּילֵֽם׃

  {7}וַ֭יַּֽדְרִיכֵם בְּדֶ֣רֶךְ יְשָׁרָ֑ה
  לָ֝לֶ֗כֶת אֶל־עִ֥יר מוֹשָֽׁב׃

  {8}יוֹד֣וּ לַיהוָ֣ה חַסְדּ֑וֹ
  וְ֝נִפְלְאוֹתָ֗יו לִבְנֵ֥י אָדָֽם׃

  {9}כִּי־הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה
  וְנֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא־טֽוֹב׃

  {10}יֹ֭שְׁבֵי חֹ֣שֶׁךְ וְצַלְמָ֑וֶת
  אֲסִירֵ֖י עֳנִ֣י וּבַרְזֶֽל׃

  {11}כִּֽי־הִמְר֥וּ אִמְרֵי־אֵ֑ל
  וַעֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ׃

  {12}וַיַּכְנַ֣ע בֶּעָמָ֣ל לִבָּ֑ם
  כָּ֝שְׁל֗וּ וְאֵ֣ין עֹזֵֽר׃

  {13}וַיִּזְעֲק֣וּ אֶל־יְ֭הוָה בַּצַּ֣ר לָהֶ֑ם
  מִ֝מְּצֻֽקוֹתֵיהֶ֗ם יוֹשִׁיעֵֽם׃

  {14}יֽ֭וֹצִיאֵם מֵחֹ֣שֶׁךְ וְצַלְמָ֑וֶת
  וּמוֹסְר֖וֹתֵיהֶ֣ם יְנַתֵּֽק׃

  {15}יוֹד֣וּ לַיהוָ֣ה חַסְדּ֑וֹ
  וְ֝נִפְלְאוֹתָ֗יו לִבְנֵ֥י אָדָֽם׃

  {16}כִּֽי־שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת
  וּבְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ׃
