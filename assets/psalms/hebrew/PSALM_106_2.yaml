title: Psaume 106_2
subtitle: null
commentary: null
biblicalReference: Ps 106(107), 17-32
shortReference: Ps 106
content: |-
  {17}אֱ֭וִלִים מִדֶּ֣רֶךְ פִּשְׁעָ֑ם
  וּֽ֝מֵעֲוֺֽנֹתֵיהֶ֗ם יִתְעַנּֽוּ׃

  {18}כָּל־אֹ֭כֶל תְּתַעֵ֣ב נַפְשָׁ֑ם
  וַ֝יַּגִּ֗יעוּ עַד־שַׁ֥עֲרֵי מָֽוֶת׃

  {19}וַיִּזְעֲק֣וּ אֶל־יְ֭הוָה בַּצַּ֣ר לָהֶ֑ם
  מִ֝מְּצֻֽקוֹתֵיהֶ֗ם יוֹשִׁיעֵֽם׃

  {20}יִשְׁלַ֣ח דְּ֭בָרוֹ וְיִרְפָּאֵ֑ם
  וִֽ֝ימַלֵּ֗ט מִשְּׁחִיתוֹתָֽם׃ ׆

  {21}יוֹד֣וּ לַיהוָ֣ה חַסְדּ֑וֹ
  וְ֝נִפְלְאוֹתָ֗יו לִבְנֵ֥י אָדָֽם׃ ׆

  {22}וְ֭יִזְבְּחוּ זִבְחֵ֣י תוֹדָ֑ה
  וִֽיסַפְּר֖וּ מַעֲשָׂ֣יו בְּרִנָּֽה׃ ׆

  {23}יוֹרְדֵ֣י הַ֭יָּם בָּאֳנִיּ֑וֹת
  עֹשֵׂ֥י מְ֝לָאכָ֗ה בְּמַ֣יִם רַבִּֽים׃ ׆

  {24}הֵ֣מָּה רָ֭אוּ מַעֲשֵׂ֣י יְהוָ֑ה
  וְ֝נִפְלְאוֹתָ֗יו בִּמְצוּלָֽה׃ ׆

  {25}וַיֹּ֗אמֶר וַֽ֭יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה
  וַתְּרוֹמֵ֥ם גַּלָּֽיו׃ ׆

  {26}יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת
  נַ֝פְשָׁ֗ם בְּרָעָ֥ה תִתְמוֹגָֽג׃

  {27}יָח֣וֹגּוּ וְ֭יָנוּעוּ כַּשִּׁכּ֑וֹר
  וְכָל־חָ֝כְמָתָ֗ם תִּתְבַּלָּֽע׃

  {28}וַיִּצְעֲק֣וּ אֶל־יְ֭הוָה בַּצַּ֣ר לָהֶ֑ם
  וּֽ֝מִמְּצֽוּקֹתֵיהֶ֗ם יוֹצִיאֵֽם׃

  {29}יָקֵ֣ם סְ֭עָרָה לִדְמָמָ֑ה
  וַ֝יֶּחֱשׁ֗וּ גַּלֵּיהֶֽם׃

  {30}וַיִּשְׂמְח֥וּ כִֽי־יִשְׁתֹּ֑קוּ
  וַ֝יַּנְחֵ֗ם אֶל־מְח֥וֹז חֶפְצָֽם׃

  {31}יוֹד֣וּ לַיהוָ֣ה חַסְדּ֑וֹ
  וְ֝נִפְלְאוֹתָ֗יו לִבְנֵ֥י אָדָֽם׃

  {32}וִֽ֭ירֹמְמוּהוּ בִּקְהַל־עָ֑ם
  וּבְמוֹשַׁ֖ב זְקֵנִ֣ים יְהַלְלֽוּהוּ׃
