title: Psaume 106_3
subtitle: null
commentary: null
biblicalReference: Ps 106(107), 33-43
shortReference: Ps 106
content: |-
  {33}יָשֵׂ֣ם נְהָר֣וֹת לְמִדְבָּ֑ר
  וּמֹצָ֥אֵי מַ֝֗יִם לְצִמָּאֽוֹן׃

  {34}אֶ֣רֶץ פְּ֭רִי לִמְלֵחָ֑ה
  מֵ֝רָעַ֗ת יֹ֣שְׁבֵי בָֽהּ׃

  {35}יָשֵׂ֣ם מִ֭דְבָּר לַֽאֲגַם־מַ֑יִם
  וְאֶ֥רֶץ צִ֝יָּ֗ה לְמֹצָ֥אֵי מָֽיִם׃

  {36}וַיּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים
  וַ֝יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃

  {37}וַיִּזְרְע֣וּ שָׂ֭דוֹת וַיִּטְּע֣וּ כְרָמִ֑ים
  וַ֝יַּעֲשׂ֗וּ פְּרִ֣י תְבֽוּאָה׃

  {38}וַיְבָרֲכֵ֣ם וַיִּרְבּ֣וּ מְאֹ֑ד
  וּ֝בְהֶמְתָּ֗ם לֹ֣א יַמְעִֽיט׃

  {39}וַיִּמְעֲט֥וּ וַיָּשֹׁ֑חוּ
  מֵעֹ֖צֶר רָעָ֣ה וְיָגֽוֹן׃ ׆

  {40}שֹׁפֵ֣ךְ בּ֭וּז עַל־נְדִיבִ֑ים
  וַ֝יַּתְעֵ֗ם בְּתֹ֣הוּ לֹא־דָֽרֶךְ׃

  {41}וַיְשַׂגֵּ֣ב אֶבְי֣וֹן מֵע֑וֹנִי
  וַיָּ֥שֶׂם כַּ֝צֹּ֗אן מִשְׁפָּחֽוֹת׃

  {42}יִרְא֣וּ יְשָׁרִ֣ים וְיִשְׂמָ֑חוּ
  וְכָל־עַ֝וְלָ֗ה קָ֣פְצָה פִּֽיהָ׃

  {43}מִי־חָכָ֥ם וְיִשְׁמָר־אֵ֑לֶּה
  וְ֝יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה׃
