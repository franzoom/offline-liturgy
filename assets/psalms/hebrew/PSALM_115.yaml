title: Psaume 115
subtitle: null
commentary: null
biblicalReference: Ps 115(116), 10-19
shortReference: Ps 115
content: |-
  {10}הֶ֭אֱמַנְתִּי כִּ֣י אֲדַבֵּ֑ר
  אֲ֝נִ֗י עָנִ֥יתִי מְאֹֽד׃

  {11}אֲ֭נִי אָמַ֣רְתִּי בְחָפְזִ֑י
  כָּֽל־הָאָדָ֥ם כֹּזֵֽב׃

  {12}מָֽה־אָשִׁ֥יב לַיהוָ֑ה
  כָּֽל־תַּגְמוּל֥וֹהִי עָלָֽי׃

  {13}כּוֹס־יְשׁוּע֥וֹת אֶשָּׂ֑א
  וּבְשֵׁ֖ם יְהוָ֣ה אֶקְרָֽא׃

  {14}נְ֭דָרַי לַיהוָ֣ה אֲשַׁלֵּ֑ם
  נֶגְדָה־נָּ֝֗א לְכָל־עַמּֽוֹ׃

  {15}יָ֭קָר בְּעֵינֵ֣י יְהוָ֑ה
  הַ֝מָּ֗וְתָה לַחֲסִידָֽיו׃

  {16}אָֽנָּ֣ה יְהוָה֮ כִּֽי־אֲנִ֪י עַ֫בְדֶּ֥ךָ אֲֽנִי־עַ֭בְדְּךָ בֶּן־אֲמָתֶ֑ךָ
  פִּ֝תַּ֗חְתָּ לְמוֹסֵרָֽי׃

  {17}לְֽךָ־אֶ֭זְבַּח זֶ֣בַח תּוֹדָ֑ה
  וּבְשֵׁ֖ם יְהוָ֣ה אֶקְרָֽא׃

  {18}נְ֭דָרַי לַיהוָ֣ה אֲשַׁלֵּ֑ם
  נֶגְדָה־נָּ֝֗א לְכָל־עַמּֽוֹ׃

  {19}בְּחַצְר֤וֹת ׀ בֵּ֤ית יְהוָ֗ה
  בְּֽת֘וֹכֵ֤כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ־יָֽהּ׃
