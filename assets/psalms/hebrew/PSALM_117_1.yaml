title: Psaume 117_1
subtitle: null
commentary: null
biblicalReference: Ps 117(118), 1-4
shortReference: Ps 117
content: |-
  {1}הוֹד֣וּ לַיהוָ֣ה כִּי־ט֑וֹב
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {2}יֹֽאמַר־נָ֥א יִשְׂרָאֵ֑ל
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {3}יֹֽאמְרוּ־נָ֥א בֵֽית־אַהֲרֹ֑ן
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {4}יֹֽאמְרוּ־נָ֭א יִרְאֵ֣י יְהוָ֑ה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃
