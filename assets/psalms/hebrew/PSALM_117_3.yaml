title: Psaume 117_3
subtitle: null
commentary: null
biblicalReference: Ps 117(118), 25-29
shortReference: Ps 117
content: |-
  {25}אָנָּ֣א יְ֭הוָה הוֹשִׁ֘יעָ֥ה נָּ֑א
  אָֽנָּ֥א יְ֝הוָ֗ה הַצְלִ֘יחָ֥ה נָּֽא׃

  {26}בָּר֣וּךְ הַ֭בָּא בְּשֵׁ֣ם יְהוָ֑ה
  בֵּ֝רַֽכְנוּכֶ֗ם מִבֵּ֥ית יְהוָֽה׃

  {27}אֵ֤ל ׀ יְהוָה֮ וַיָּ֪אֶר לָ֥נוּ אִסְרוּ־חַ֥ג בַּעֲבֹתִ֑ים
  עַד־קַ֝רְנ֗וֹת הַמִּזְבֵּֽחַ׃

  {28}אֵלִ֣י אַתָּ֣ה וְאוֹדֶ֑ךָּ
  אֱ֝לֹהַ֗י אֲרוֹמְמֶֽךָּ׃

  {29}הוֹד֣וּ לַיהוָ֣ה כִּי־ט֑וֹב
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃
