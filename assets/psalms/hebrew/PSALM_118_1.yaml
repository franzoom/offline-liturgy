title: Psaume 118_1
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 1-8
shortReference: Ps 118
content: |-
  {1}אַשְׁרֵ֥י תְמִֽימֵי־דָ֑רֶךְ
  הַֽ֝הֹלְכִ֗ים בְּתוֹרַ֥ת יְהוָֽה׃

  {2}אַ֭שְׁרֵי נֹצְרֵ֥י עֵדֹתָ֗יו
  בְּכָל־לֵ֥ב יִדְרְשֽׁוּהוּ׃

  {3}אַ֭ף לֹֽא־פָעֲל֣וּ עַוְלָ֑ה
  בִּדְרָכָ֥יו הָלָֽכוּ׃

  {4}אַ֭תָּה צִוִּ֥יתָה פִקֻּדֶ֗יךָ
  לִשְׁמֹ֥ר מְאֹֽד׃

  {5}אַ֭חֲלַי יִכֹּ֥נוּ דְרָכָ֗י
  לִשְׁמֹ֥ר חֻקֶּֽיךָ׃

  {6}אָ֥ז לֹא־אֵב֑וֹשׁ
  בְּ֝הַבִּיטִ֗י אֶל־כָּל־מִצְוֺתֶֽיךָ׃

  {7}א֭וֹדְךָ בְּיֹ֣שֶׁר לֵבָ֑ב
  בְּ֝לָמְדִ֗י מִשְׁפְּטֵ֥י צִדְקֶֽךָ׃

  {8}אֶת־חֻקֶּ֥יךָ אֶשְׁמֹ֑ר
  אַֽל־תַּעַזְבֵ֥נִי עַד־מְאֹֽד׃
