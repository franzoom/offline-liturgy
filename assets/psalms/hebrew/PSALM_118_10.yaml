title: Psaume 118-X
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 73-80
shortReference: Ps 118
content: |-
  {73}יָדֶ֣יךָ עָ֭שׂוּנִי וַֽיְכוֹנְנ֑וּנִי
  הֲ֝בִינֵ֗נִי וְאֶלְמְדָ֥ה מִצְוֺתֶֽיךָ׃

  {74}יְ֭רֵאֶיךָ יִרְא֣וּנִי וְיִשְׂמָ֑חוּ
  כִּ֖י לִדְבָרְךָ֣ יִחָֽלְתִּי׃

  {75}יָדַ֣עְתִּי יְ֭הוָה כִּי־צֶ֣דֶק מִשְׁפָּטֶ֑יךָ
  וֶ֝אֱמוּנָ֗ה עִנִּיתָֽנִי׃

  {76}יְהִי־נָ֣א חַסְדְּךָ֣ לְנַחֲמֵ֑נִי
  כְּאִמְרָתְךָ֥ לְעַבְדֶּֽךָ׃

  {77}יְבֹא֣וּנִי רַחֲמֶ֣יךָ וְאֶֽחְיֶ֑ה
  כִּי־תֽ֝וֹרָתְךָ֗ שַֽׁעֲשֻׁעָֽי׃

  {78}יֵבֹ֣שׁוּ זֵ֭דִים כִּי־שֶׁ֣קֶר עִוְּת֑וּנִי
  אֲ֝נִ֗י אָשִׂ֥יחַ בְּפִקּוּדֶֽיךָ׃

  {79}יָשׁ֣וּבוּ לִ֣י יְרֵאֶ֑יךָ
  וְ֝יֹדְעֵ֗י עֵדֹתֶֽיךָ׃

  {80}יְהִֽי־לִבִּ֣י תָמִ֣ים בְּחֻקֶּ֑יךָ
  לְ֝מַ֗עַן לֹ֣א אֵבֽוֹשׁ׃
