title: Psaume 118-XI
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 81-88
shortReference: Ps 118
content: |-
  {81}כָּלְתָ֣ה לִתְשׁוּעָתְךָ֣ נַפְשִׁ֑י
  לִדְבָרְךָ֥ יִחָֽלְתִּי׃

  {82}כָּל֣וּ עֵ֭ינַי לְאִמְרָתֶ֑ךָ
  לֵ֝אמֹ֗ר מָתַ֥י תְּֽנַחֲמֵֽנִי׃

  {83}כִּֽי־הָ֭יִיתִי כְּנֹ֣אד בְּקִיט֑וֹר
  חֻ֝קֶּ֗יךָ לֹ֣א שָׁכָֽחְתִּי׃

  {84}כַּמָּ֥ה יְמֵֽי־עַבְדֶּ֑ךָ
  מָתַ֬י תַּעֲשֶׂ֖ה בְרֹדְפַ֣י מִשְׁפָּֽט׃

  {85}כָּֽרוּ־לִ֣י זֵדִ֣ים שִׁיח֑וֹת
  אֲ֝שֶׁ֗ר לֹ֣א כְתוֹרָתֶֽךָ׃

  {86}כָּל־מִצְוֺתֶ֥יךָ אֱמוּנָ֑ה
  שֶׁ֖קֶר רְדָפ֣וּנִי עָזְרֵֽנִי׃

  {87}כִּ֭מְעַט כִּלּ֣וּנִי בָאָ֑רֶץ
  וַ֝אֲנִ֗י לֹא־עָזַ֥בְתִּי פִקֻּודֶֽיךָ׃

  {88}כְּחַסְדְּךָ֥ חַיֵּ֑נִי
  וְ֝אֶשְׁמְרָ֗ה עֵד֥וּת פִּֽיךָ׃
