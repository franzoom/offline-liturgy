title: Psaume 118-XII
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 89-96
shortReference: Ps 118
content: |-
  {89}לְעוֹלָ֥ם יְהוָ֑ה
  דְּ֝בָרְךָ֗ נִצָּ֥ב בַּשָּׁמָֽיִם׃

  {90}לְדֹ֣ר וָ֭דֹר אֱמֽוּנָתֶ֑ךָ
  כּוֹנַ֥נְתָּ אֶ֝֗רֶץ וַֽתַּעֲמֹֽד׃

  {91}לְֽ֭מִשְׁפָּטֶיךָ עָמְד֣וּ הַיּ֑וֹם
  כִּ֖י הַכֹּ֣ל עֲבָדֶֽיךָ׃

  {92}לוּלֵ֣י ת֭וֹרָתְךָ שַׁעֲשֻׁעָ֑י
  אָ֝֗ז אָבַ֥דְתִּי בְעָנְיִֽי׃

  {93}לְ֭עוֹלָם לֹא־אֶשְׁכַּ֣ח פִּקּוּדֶ֑יךָ
  כִּ֥י בָ֝֗ם חִיִּיתָֽנִי׃

  {94}לְֽךָ־אֲ֭נִי הוֹשִׁיעֵ֑נִי
  כִּ֖י פִקּוּדֶ֣יךָ דָרָֽשְׁתִּי׃

  {95}לִ֤י קִוּ֣וּ רְשָׁעִ֣ים לְאַבְּדֵ֑נִי
  עֵ֝דֹתֶ֗יךָ אֶתְבּוֹנָֽן׃

  {96}לְֽכָל תִּ֭כְלָה רָאִ֣יתִי קֵ֑ץ
  רְחָבָ֖ה מִצְוָתְךָ֣ מְאֹֽד׃
