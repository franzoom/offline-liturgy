title: Psaume 118_14
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 105-112
shortReference: Ps 118
content: |-
  {105}נֵר־לְרַגְלִ֥י דְבָרֶ֑ךָ
  וְ֝א֗וֹר לִנְתִיבָתִֽי׃

  {106}נִשְׁבַּ֥עְתִּי וָאֲקַיֵּ֑מָה
  לִ֝שְׁמֹ֗ר מִשְׁפְּטֵ֥י צִדְקֶֽךָ׃

  {107}נַעֲנֵ֥יתִי עַד־מְאֹ֑ד
  יְ֝הוָ֗ה חַיֵּ֥נִי כִדְבָרֶֽךָ׃

  {108}נִדְב֣וֹת פִּ֭י רְצֵה־נָ֣א יְהוָ֑ה
  וּֽמִשְׁפָּטֶ֥יךָ לַמְּדֵֽנִי׃

  {109}נַפְשִׁ֣י בְכַפִּ֣י תָמִ֑יד
  וְ֝תֽוֹרָתְךָ֗ לֹ֣א שָׁכָֽחְתִּי׃

  {110}נָתְנ֬וּ רְשָׁעִ֣ים פַּ֣ח לִ֑י
  וּ֝מִפִּקּוּדֶ֗יךָ לֹ֣א תָעִֽיתִי׃

  {111}נָחַ֣לְתִּי עֵדְוֺתֶ֣יךָ לְעוֹלָ֑ם
  כִּֽי־שְׂשׂ֖וֹן לִבִּ֣י הֵֽמָּה׃

  {112}נָטִ֣יתִי לִ֭בִּי לַעֲשׂ֥וֹת חֻקֶּ֗יךָ
  לְעוֹלָ֥ם עֵֽקֶב׃
