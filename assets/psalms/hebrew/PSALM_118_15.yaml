title: Psaume 118_15
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 113-120
shortReference: Ps 118
content: |-
  {113}סֵעֲפִ֥ים שָׂנֵ֑אתִי
  וְֽתוֹרָתְךָ֥ אָהָֽבְתִּי׃

  {114}סִתְרִ֣י וּמָגִנִּ֣י אָ֑תָּה
  לִדְבָרְךָ֥ יִחָֽלְתִּי׃

  {115}סֽוּרוּ־מִמֶּ֥נִּי מְרֵעִ֑ים
  וְ֝אֶצְּרָ֗ה מִצְוֺ֥ת אֱלֹהָֽי׃

  {116}סָמְכֵ֣נִי כְאִמְרָתְךָ֣ וְאֶֽחְיֶ֑ה
  וְאַל־תְּ֝בִישֵׁ֗נִי מִשִּׂבְרִֽי׃

  {117}סְעָדֵ֥נִי וְאִוָּשֵׁ֑עָה
  וְאֶשְׁעָ֖ה בְחֻקֶּ֣יךָ תָמִֽיד׃

  {118}סָ֭לִיתָ כָּל־שׁוֹגִ֣ים מֵחֻקֶּ֑יךָ
  כִּי־שֶׁ֝֗קֶר תַּרְמִיתָֽם׃

  {119}סִגִ֗ים הִשְׁבַּ֥תָּ כָל־רִשְׁעֵי־אָ֑רֶץ
  לָ֝כֵ֗ן אָהַ֥בְתִּי עֵדֹתֶֽיךָ׃

  {120}סָמַ֣ר מִפַּחְדְּךָ֣ בְשָׂרִ֑י
  וּֽמִמִּשְׁפָּטֶ֥יךָ יָרֵֽאתִי׃
