title: Psaume 118-XVI
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 121-128
shortReference: Ps 118
content: |-
  {121}עָ֭שִׂיתִי מִשְׁפָּ֣ט וָצֶ֑דֶק
  בַּל־תַּ֝נִּיחֵ֗נִי לְעֹֽשְׁקָֽי׃

  {122}עֲרֹ֣ב עַבְדְּךָ֣ לְט֑וֹב
  אַֽל־יַעַשְׁקֻ֥נִי זֵדִֽים׃

  {123}עֵ֭ינַי כָּל֣וּ לִֽישׁוּעָתֶ֑ךָ
  וּלְאִמְרַ֥ת צִדְקֶֽךָ׃

  {124}עֲשֵׂ֖ה עִם־עַבְדְּךָ֥ כְחַסְדֶּ֗ךָ
  וְחֻקֶּ֥יךָ לַמְּדֵֽנִי׃

  {125}עַבְדְּךָ־אָ֥נִי הֲבִינֵ֑נִי
  וְ֝אֵדְעָ֗ה עֵדֹתֶֽיךָ׃

  {126}עֵ֭ת לַעֲשׂ֣וֹת לַיהוָ֑ה
  הֵ֝פֵ֗רוּ תּוֹרָתֶֽךָ׃

  {127}עַל־כֵּ֭ן אָהַ֣בְתִּי מִצְוֺתֶ֑יךָ
  מִזָּהָ֥ב וּמִפָּֽז׃

  {128}עַל־כֵּ֤ן ׀ כָּל־פִּקּ֣וּדֵי כֹ֣ל יִשָּׁ֑רְתִּי
  כָּל־אֹ֖רַח שֶׁ֣קֶר שָׂנֵֽאתִי׃
