title: Psaume 118-XVII
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 129-136
shortReference: Ps 118
content: |-
  {129}פְּלָא֥וֹת עֵדְוֺתֶ֑יךָ
  עַל־כֵּ֝֗ן נְצָרָ֥תַם נַפְשִֽׁי׃

  {130}פֵּ֖תַח דְּבָרֶ֥יךָ יָאִ֗יר
  מֵבִ֥ין פְּתָיִֽים׃

  {131}פִּֽי־פָ֭עַרְתִּי וָאֶשְׁאָ֑פָה
  כִּ֖י לְמִצְוֺתֶ֣יךָ יָאָֽבְתִּי׃

  {132}פְּנֵה־אֵלַ֥י וְחָנֵּ֑נִי
  כְּ֝מִשְׁפָּ֗ט לְאֹהֲבֵ֥י שְׁמֶֽךָ׃

  {133}פְּ֭עָמַי הָכֵ֣ן בְּאִמְרָתֶ֑ךָ
  וְֽאַל־תַּשְׁלֶט־בִּ֥י כָל־אָֽוֶן׃

  {134}פְּ֭דֵנִי מֵעֹ֣שֶׁק אָדָ֑ם
  וְ֝אֶשְׁמְרָ֗ה פִּקּוּדֶֽיךָ׃

  {135}פָּ֭נֶיךָ הָאֵ֣ר בְּעַבְדֶּ֑ךָ
  וְ֝לַמְּדֵ֗נִי אֶת־חֻקֶּֽיךָ׃

  {136}פַּלְגֵי־מַ֭יִם יָרְד֣וּ עֵינָ֑י
  עַ֝֗ל לֹא־שָׁמְר֥וּ תוֹרָתֶֽךָ׃
