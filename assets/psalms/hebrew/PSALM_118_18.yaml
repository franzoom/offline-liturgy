title: Psaume 118_18
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 137-144
shortReference: Ps 118
content: |-
  {137}צַדִּ֣יק אַתָּ֣ה יְהוָ֑ה
  וְ֝יָשָׁ֗ר מִשְׁפָּטֶֽיךָ׃

  {138}צִ֭וִּיתָ צֶ֣דֶק עֵדֹתֶ֑יךָ
  וֶֽאֱמוּנָ֥ה מְאֹֽד׃

  {139}צִמְּתַ֥תְנִי קִנְאָתִ֑י
  כִּֽי־שָׁכְח֖וּ דְבָרֶ֣יךָ צָרָֽי׃

  {140}צְרוּפָ֖ה אִמְרָתְךָ֥ מְאֹ֗ד
  וְֽעַבְדְּךָ֥ אֲהֵבָֽהּ׃

  {141}צָעִ֣יר אָנֹכִ֣י וְנִבְזֶ֑ה
  פִּ֝קֻּדֶ֗יךָ לֹ֣א שָׁכָֽחְתִּי׃

  {142}צִדְקָתְךָ֣ צֶ֣דֶק לְעוֹלָ֑ם
  וְֽתוֹרָתְךָ֥ אֱמֶֽת׃

  {143}צַר־וּמָצ֥וֹק מְצָא֑וּנִי
  מִ֝צְוֺתֶ֗יךָ שַׁעֲשֻׁעָֽי׃

  {144}צֶ֖דֶק עֵדְוֺתֶ֥יךָ לְעוֹלָ֗ם
  הֲבִינֵ֥נִי וְאֶחְיֶֽה׃
