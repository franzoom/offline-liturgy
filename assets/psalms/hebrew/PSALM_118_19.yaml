title: Psaume 118_19
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 145-152
shortReference: Ps 118
content: |-
  {145}קָרָ֣אתִי בְכָל־לֵ֭ב עֲנֵ֥נִי יְהוָ֗ה
  חֻקֶּ֥יךָ אֶצֹּֽרָה׃

  {146}קְרָאתִ֥יךָ הוֹשִׁיעֵ֑נִי
  וְ֝אֶשְׁמְרָ֗ה עֵדֹתֶֽיךָ׃

  {147}קִדַּ֣מְתִּי בַ֭נֶּשֶׁף וָאֲשַׁוֵּ֑עָה
  לִדְבָרְךָ֥ יִחָֽלְתִּי׃

  {148}קִדְּמ֣וּ עֵ֭ינַי אַשְׁמֻר֑וֹת
  לָ֝שִׂ֗יחַ בְּאִמְרָתֶֽךָ׃

  {149}ק֭וֹלִי שִׁמְעָ֣ה כְחַסְדֶּ֑ךָ
  יְ֝הוָ֗ה כְּֽמִשְׁפָּטֶ֥ךָ חַיֵּֽנִי׃

  {150}קָ֭רְבוּ רֹדְפֵ֣י זִמָּ֑ה
  מִתּוֹרָתְךָ֥ רָחָֽקוּ׃

  {151}קָר֣וֹב אַתָּ֣ה יְהוָ֑ה
  וְֽכָל־מִצְוֺתֶ֥יךָ אֱמֶֽת׃

  {152}קֶ֣דֶם יָ֭דַעְתִּי מֵעֵדֹתֶ֑יךָ
  כִּ֖י לְעוֹלָ֣ם יְסַדְתָּֽם׃
