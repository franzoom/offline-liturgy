title: Psaume 118-II
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 9-16
shortReference: Ps 118
content: |-
  {9}בַּמֶּ֣ה יְזַכֶּה־נַּ֭עַר אֶת־אָרְח֑וֹ
  לִ֝שְׁמֹ֗ר כִּדְבָרֶֽךָ׃

  {10}בְּכָל־לִבִּ֥י דְרַשְׁתִּ֑יךָ
  אַל־תַּ֝שְׁגֵּ֗נִי מִמִּצְוֺתֶֽיךָ׃

  {11}בְּ֭לִבִּי צָפַ֣נְתִּי אִמְרָתֶ֑ךָ
  לְ֝מַ֗עַן לֹ֣א אֶֽחֱטָא־לָֽךְ׃

  {12}בָּר֖וּךְ אַתָּ֥ה יְהוָ֗ה
  לַמְּדֵ֥נִי חֻקֶּֽיךָ׃

  {13}בִּשְׂפָתַ֥י סִפַּ֑רְתִּי
  כֹּ֝֗ל מִשְׁפְּטֵי־פִֽיךָ׃

  {14}בְּדֶ֖רֶךְ עֵדְוֺתֶ֥יךָ שַׂ֗שְׂתִּי
  כְּעַ֣ל כָּל־הֽוֹן׃

  {15}בְּפִקֻּדֶ֥יךָ אָשִׂ֑יחָה
  וְ֝אַבִּ֗יטָה אֹרְחֹתֶֽיךָ׃

  {16}בְּחֻקֹּתֶ֥יךָ אֶֽשְׁתַּעֲשָׁ֑ע
  לֹ֭א אֶשְׁכַּ֣ח דְּבָרֶֽךָ׃
