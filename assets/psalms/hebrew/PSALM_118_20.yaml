title: Psaume 118-XX
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 153-160
shortReference: Ps 118
content: |-
  {153}רְאֵֽה־עָנְיִ֥י וְחַלְּצֵ֑נִי
  כִּי־תֽ֝וֹרָתְךָ֗ לֹ֣א שָׁכָֽחְתִּי׃

  {154}רִיבָ֣ה רִ֭יבִי וּגְאָלֵ֑נִי
  לְאִמְרָתְךָ֥ חַיֵּֽנִי׃

  {155}רָח֣וֹק מֵרְשָׁעִ֣ים יְשׁוּעָ֑ה
  כִּֽי־חֻ֝קֶּיךָ לֹ֣א דָרָֽשׁוּ׃

  {156}רַחֲמֶ֖יךָ רַבִּ֥ים ׀ יְהוָ֑ה
  כְּֽמִשְׁפָּטֶ֥יךָ חַיֵּֽנִי׃

  {157}רַ֭בִּים רֹדְפַ֣י וְצָרָ֑י
  מֵ֝עֵדְוֺתֶ֗יךָ לֹ֣א נָטִֽיתִי׃

  {158}רָאִ֣יתִי בֹ֭גְדִים וָֽאֶתְקוֹטָ֑טָה
  אֲשֶׁ֥ר אִ֝מְרָתְךָ֗ לֹ֣א שָׁמָֽרוּ׃

  {159}רְ֭אֵה כִּי־פִקּוּדֶ֣יךָ אָהָ֑בְתִּי
  יְ֝הוָ֗ה כְּֽחַסְדְּךָ֥ חַיֵּֽנִי׃

  {160}רֹאשׁ־דְּבָרְךָ֥ אֱמֶ֑ת
  וּ֝לְעוֹלָ֗ם כָּל־מִשְׁפַּ֥ט צִדְקֶֽךָ׃
