title: Psaume 118-XXI
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 161-168
shortReference: Ps 118
content: |-
  {161}שָׂ֭רִים רְדָפ֣וּנִי חִנָּ֑ם
  וּ֝מִדְּבָרְךָ֗ פָּחַ֥ד לִבִּֽי׃

  {162}שָׂ֣שׂ אָ֭נֹכִֽי עַל־אִמְרָתֶ֑ךָ
  כְּ֝מוֹצֵ֗א שָׁלָ֥ל רָֽב׃

  {163}שֶׁ֣קֶר שָׂ֭נֵאתִי וַאֲתַעֵ֑בָה
  תּוֹרָתְךָ֥ אָהָֽבְתִּי׃

  {164}שֶׁ֣בַע בַּ֭יּוֹם הִלַּלְתִּ֑יךָ
  עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽךָ׃

  {165}שָׁל֣וֹם רָ֭ב לְאֹהֲבֵ֣י תוֹרָתֶ֑ךָ
  וְאֵֽין־לָ֥מוֹ מִכְשֽׁוֹל׃

  {166}שִׂבַּ֣רְתִּי לִֽישׁוּעָתְךָ֣ יְהוָ֑ה
  וּֽמִצְוֺתֶ֥יךָ עָשִֽׂיתִי׃

  {167}שָֽׁמְרָ֣ה נַ֭פְשִׁי עֵדֹתֶ֑יךָ
  וָאֹהֲבֵ֥ם מְאֹֽד׃

  {168}שָׁמַ֣רְתִּי פִ֭קּוּדֶיךָ וְעֵדֹתֶ֑יךָ
  כִּ֖י כָל־דְּרָכַ֣י נֶגְדֶּֽךָ׃
