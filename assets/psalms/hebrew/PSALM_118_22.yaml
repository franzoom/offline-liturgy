title: Psaume 118_22
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 169-176
shortReference: Ps 118
content: |-
  {169}תִּקְרַ֤ב רִנָּתִ֣י לְפָנֶ֣יךָ יְהוָ֑ה
  כִּדְבָרְךָ֥ הֲבִינֵֽנִי׃

  {170}תָּב֣וֹא תְּחִנָּתִ֣י לְפָנֶ֑יךָ
  כְּ֝אִמְרָתְךָ֗ הַצִּילֵֽנִי׃

  {171}תַּבַּ֣עְנָה שְׂפָתַ֣י תְּהִלָּ֑ה
  כִּ֖י תְלַמְּדֵ֣נִי חֻקֶּֽיךָ׃

  {172}תַּ֣עַן לְ֭שׁוֹנִי אִמְרָתֶ֑ךָ
  כִּ֖י כָל־מִצְוֺתֶ֣יךָ צֶּֽדֶק׃

  {173}תְּהִֽי־יָדְךָ֥ לְעָזְרֵ֑נִי
  כִּ֖י פִקּוּדֶ֣יךָ בָחָֽרְתִּי׃

  {174}תָּאַ֣בְתִּי לִֽישׁוּעָתְךָ֣ יְהוָ֑ה
  וְ֝תֽוֹרָתְךָ֗ שַׁעֲשֻׁעָֽי׃

  {175}תְּֽחִי־נַ֭פְשִׁי וּֽתְהַֽלְלֶ֑ךָּ
  וּֽמִשְׁפָּטֶ֥ךָ יַעֲזְרֻֽנִי׃

  {176}תָּעִ֗יתִי כְּשֶׂ֣ה אֹ֭בֵד בַּקֵּ֣שׁ עַבְדֶּ֑ךָ
  כִּ֥י מִ֝צְוֺתֶ֗יךָ לֹ֣א שָׁכָֽחְתִּי׃
