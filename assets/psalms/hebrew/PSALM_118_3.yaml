title: Psaume 118_3
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 17-24
shortReference: Ps 118
content: |-
  {17}גְּמֹ֖ל עַֽל־עַבְדְּךָ֥ אֶֽחְיֶ֗ה
  וְאֶשְׁמְרָ֥ה דְבָרֶֽךָ׃

  {18}גַּל־עֵינַ֥י וְאַבִּ֑יטָה
  נִ֝פְלָא֗וֹת מִתּוֹרָתֶֽךָ׃

  {19}גֵּ֣ר אָנֹכִ֣י בָאָ֑רֶץ
  אַל־תַּסְתֵּ֥ר מִ֝מֶּ֗נִּי מִצְוֺתֶֽיךָ׃

  {20}גָּרְסָ֣ה נַפְשִׁ֣י לְתַאֲבָ֑ה
  אֶֽל־מִשְׁפָּטֶ֥יךָ בְכָל־עֵֽת׃

  {21}גָּ֭עַרְתָּ זֵדִ֣ים אֲרוּרִ֑ים
  הַ֝שֹּׁגִים מִמִּצְוֺתֶֽיךָ׃

  {22}גַּ֣ל מֵֽ֭עָלַי חֶרְפָּ֣ה וָב֑וּז
  כִּ֖י עֵדֹתֶ֣יךָ נָצָֽרְתִּי׃

  {23}גַּ֤ם יָֽשְׁב֣וּ שָׂ֭רִים בִּ֣י נִדְבָּ֑רוּ
  עַ֝בְדְּךָ֗ יָשִׂ֥יחַ בְּחֻקֶּֽיךָ׃

  {24}גַּֽם־עֵ֭דֹתֶיךָ שַׁעֲשֻׁעָ֗י
  אַנְשֵׁ֥י עֲצָתִֽי׃
