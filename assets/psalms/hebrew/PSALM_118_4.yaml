title: Psaume 118_4
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 25-32
shortReference: Ps 118
content: |-
  {25}דָּֽבְקָ֣ה לֶעָפָ֣ר נַפְשִׁ֑י
  חַ֝יֵּ֗נִי כִּדְבָרֶֽךָ׃

  {26}דְּרָכַ֣י סִ֭פַּרְתִּי וַֽתַּעֲנֵ֗נִי
  לַמְּדֵ֥נִי חֻקֶּֽיךָ׃

  {27}דֶּֽרֶךְ־פִּקּוּדֶ֥יךָ הֲבִינֵ֑נִי
  וְ֝אָשִׂ֗יחָה בְּנִפְלְאוֹתֶֽיךָ׃

  {28}דָּלְפָ֣ה נַ֭פְשִׁי מִתּוּגָ֑ה
  קַ֝יְּמֵ֗נִי כִּדְבָרֶֽךָ׃

  {29}דֶּֽרֶךְ־שֶׁ֭קֶר הָסֵ֣ר מִמֶּ֑נִּי
  וְֽתוֹרָתְךָ֥ חָנֵּֽנִי׃

  {30}דֶּֽרֶךְ־אֱמוּנָ֥ה בָחָ֑רְתִּי
  מִשְׁפָּטֶ֥יךָ שִׁוִּֽיתִי׃

  {31}דָּבַ֥קְתִּי בְעֵֽדְוֺתֶ֑יךָ
  יְ֝הוָ֗ה אַל־תְּבִישֵֽׁנִי׃

  {32}דֶּֽרֶךְ־מִצְוֺתֶ֥יךָ אָר֑וּץ
  כִּ֖י תַרְחִ֣יב לִבִּֽי׃
