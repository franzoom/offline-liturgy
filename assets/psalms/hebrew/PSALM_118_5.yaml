title: Psaume 118-V
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 33-40
shortReference: Ps 118
content: |-
  {33}הוֹרֵ֣נִי יְ֭הוָה דֶּ֥רֶךְ חֻקֶּ֗יךָ
  וְאֶצְּרֶ֥נָּה עֵֽקֶב׃

  {34}הֲ֭בִינֵנִי וְאֶצְּרָ֥ה תֽוֹרָתֶ֗ךָ
  וְאֶשְׁמְרֶ֥נָּה בְכָל־לֵֽב׃

  {35}הַ֭דְרִיכֵנִי בִּנְתִ֣יב מִצְוֺתֶ֑יךָ
  כִּי־ב֥וֹ חָפָֽצְתִּי׃

  {36}הַט־לִ֭בִּי אֶל־עֵדְוֺתֶ֗יךָ
  וְאַ֣ל אֶל־בָּֽצַע׃

  {37}הַעֲבֵ֣ר עֵ֭ינַי מֵרְא֣וֹת שָׁ֑וְא
  בִּדְרָכֶ֥ךָ חַיֵּֽנִי׃

  {38}הָקֵ֣ם לְ֭עַבְדְּךָ אִמְרָתֶ֑ךָ
  אֲ֝שֶׁ֗ר לְיִרְאָתֶֽךָ׃

  {39}הַעֲבֵ֣ר חֶ֭רְפָּתִי אֲשֶׁ֣ר יָגֹ֑רְתִּי
  כִּ֖י מִשְׁפָּטֶ֣יךָ טוֹבִֽים׃

  {40}הִ֭נֵּה תָּאַ֣בְתִּי לְפִקֻּדֶ֑יךָ
  בְּצִדְקָתְךָ֥ חַיֵּֽנִי׃
