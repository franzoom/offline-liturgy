title: Psaume 118-VI
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 41-48
shortReference: Ps 118
content: |-
  {41}וִֽיבֹאֻ֣נִי חֲסָדֶ֣ךָ יְהוָ֑ה
  תְּ֝שֽׁוּעָתְךָ֗ כְּאִמְרָתֶֽךָ׃

  {42}וְאֶֽעֱנֶ֣ה חֹרְפִ֣י דָבָ֑ר
  כִּֽי־בָ֝טַחְתִּי בִּדְבָרֶֽךָ׃

  {43}וְֽאַל־תַּצֵּ֬ל מִפִּ֣י דְבַר־אֱמֶ֣ת עַד־מְאֹ֑ד
  כִּ֖י לְמִשְׁפָּטֶ֣ךָ יִחָֽלְתִּי׃

  {44}וְאֶשְׁמְרָ֖ה תוֹרָתְךָ֥ תָמִ֗יד
  לְעוֹלָ֥ם וָעֶֽד׃

  {45}וְאֶתְהַלְּכָ֥ה בָרְחָבָ֑ה
  כִּ֖י פִקֻּדֶ֣יךָ דָרָֽשְׁתִּי׃

  {46}וַאֲדַבְּרָ֣ה בְ֭עֵדֹתֶיךָ נֶ֥גֶד מְלָכִ֗ים
  וְלֹ֣א אֵבֽוֹשׁ׃

  {47}וְאֶשְׁתַּֽעֲשַׁ֥ע בְּמִצְוֺתֶ֗יךָ
  אֲשֶׁ֣ר אָהָֽבְתִּי׃

  {48}וְאֶשָּֽׂא־כַפַּ֗י אֶֽל־מִ֭צְוֺתֶיךָ אֲשֶׁ֥ר אָהָ֗בְתִּי
  וְאָשִׂ֥יחָה בְחֻקֶּֽיךָ׃
