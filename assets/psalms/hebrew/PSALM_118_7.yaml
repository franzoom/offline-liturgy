title: Psaume 118-VII
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 49-56
shortReference: Ps 118
content: |-
  {49}זְכֹר־דָּבָ֥ר לְעַבְדֶּ֑ךָ
  עַ֝֗ל אֲשֶׁ֣ר יִֽחַלְתָּֽנִי׃

  {50}זֹ֣את נֶחָמָתִ֣י בְעָנְיִ֑י
  כִּ֖י אִמְרָתְךָ֣ חִיָּֽתְנִי׃

  {51}זֵ֭דִים הֱלִיצֻ֣נִי עַד־מְאֹ֑ד
  מִ֝תּֽוֹרָתְךָ֗ לֹ֣א נָטִֽיתִי׃

  {52}זָ֘כַ֤רְתִּי מִשְׁפָּטֶ֖יךָ
  מֵעוֹלָ֥ם ׀ יְהוָ֗ה וָֽאֶתְנֶחָֽם׃

  {53}זַלְעָפָ֣ה אֲ֭חָזַתְנִי מֵרְשָׁעִ֑ים
  עֹ֝זְבֵ֗י תּוֹרָתֶֽךָ׃

  {54}זְ֭מִרוֹת הָֽיוּ־לִ֥י חֻקֶּ֗יךָ
  בְּבֵ֣ית מְגוּרָֽי׃

  {55}זָ֘כַ֤רְתִּי בַלַּ֣יְלָה שִׁמְךָ֣ יְהוָ֑ה
  וָֽ֝אֶשְׁמְרָ֗ה תּוֹרָתֶֽךָ׃

  {56}זֹ֥את הָֽיְתָה־לִּ֑י
  כִּ֖י פִקֻּדֶ֣יךָ נָצָֽרְתִּי׃
