title: Psaume 118-VIII
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 57-64
shortReference: Ps 118
content: |-
  {57}חֶלְקִ֖י יְהוָ֥ה אָמַ֗רְתִּי
  לִשְׁמֹ֥ר דְּבָרֶֽיךָ׃

  {58}חִלִּ֣יתִי פָנֶ֣יךָ בְכָל־לֵ֑ב
  חָ֝נֵּ֗נִי כְּאִמְרָתֶֽךָ׃

  {59}חִשַּׁ֥בְתִּי דְרָכָ֑י
  וָאָשִׁ֥יבָה רַ֝גְלַ֗י אֶל־עֵדֹתֶֽיךָ׃

  {60}חַ֭שְׁתִּי וְלֹ֣א הִתְמַהְמָ֑הְתִּי
  לִ֝שְׁמֹ֗ר מִצְוֺתֶֽיךָ׃

  {61}חֶבְלֵ֣י רְשָׁעִ֣ים עִוְּדֻ֑נִי
  תּֽ֝וֹרָתְךָ֗ לֹ֣א שָׁכָֽחְתִּי׃

  {62}חֲצֽוֹת־לַ֗יְלָה אָ֭קוּם לְהוֹד֣וֹת לָ֑ךְ
  עַ֝֗ל מִשְׁפְּטֵ֥י צִדְקֶֽךָ׃

  {63}חָבֵ֣ר אָ֭נִי לְכָל־אֲשֶׁ֣ר יְרֵא֑וּךָ
  וּ֝לְשֹׁמְרֵ֗י פִּקּוּדֶֽיךָ׃

  {64}חַסְדְּךָ֣ יְ֭הוָה מָלְאָ֥ה הָאָ֗רֶץ
  חֻקֶּ֥יךָ לַמְּדֵֽנִי׃
