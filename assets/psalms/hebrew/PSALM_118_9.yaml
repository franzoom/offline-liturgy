title: Psaume 118-IX
subtitle: null
commentary: null
biblicalReference: Ps 118(119), 65-72
shortReference: Ps 118
content: |-
  {65}ט֭וֹב עָשִׂ֣יתָ עִֽם־עַבְדְּךָ֑
  יְ֝הוָ֗ה כִּדְבָרֶֽךָ׃

  {66}ט֤וּב טַ֣עַם וָדַ֣עַת לַמְּדֵ֑נִי
  כִּ֖י בְמִצְוֺתֶ֣יךָ הֶאֱמָֽנְתִּי׃

  {67}טֶ֣רֶם אֶ֭עֱנֶה אֲנִ֣י שֹׁגֵ֑ג
  וְ֝עַתָּ֗ה אִמְרָתְךָ֥ שָׁמָֽרְתִּי׃

  {68}טוֹב־אַתָּ֥ה וּמֵטִ֗יב לַמְּדֵ֥נִי חֻקֶּֽיךָ׃

  {69}טָפְל֬וּ עָלַ֣י שֶׁ֣קֶר זֵדִ֑ים
  אֲ֝נִ֗י בְּכָל־לֵ֤ב ׀ אֱצֹּ֬ר פִּקּוּדֶֽיךָ׃

  {70}טָפַ֣שׁ כַּחֵ֣לֶב לִבָּ֑ם
  אֲ֝נִ֗י תּוֹרָתְךָ֥ שִֽׁעֲשָֽׁעְתִּי׃

  {71}טֽוֹב־לִ֥י כִֽי־עֻנֵּ֑יתִי
  לְ֝מַ֗עַן אֶלְמַ֥ד חֻקֶּֽיךָ׃

  {72}טֽוֹב־לִ֥י תֽוֹרַת־פִּ֑יךָ
  מֵ֝אַלְפֵ֗י זָהָ֥ב וָכָֽסֶף׃
