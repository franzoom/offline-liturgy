title: Psaume 119
subtitle: null
commentary: null
biblicalReference: Ps 119(120), 1-7
shortReference: Ps 119
content: |-
  {1}אֶל־יְ֭הוָה בַּצָּרָ֣תָה לִּ֑י
  קָ֝רָ֗אתִי וַֽיַּעֲנֵֽנִי׃

  {2}יְֽהוָ֗ה הַצִּ֣ילָה נַ֭פְשִׁי מִשְּׂפַת־שֶׁ֑קֶר
  מִלָּשׁ֥וֹן רְמִיָּֽה׃

  {3}מַה־יִּתֵּ֣ן לְ֭ךָ וּמַה־יֹּסִ֥יף לָ֗ךְ
  לָשׁ֥וֹן רְמִיָּֽה׃

  {4}חִצֵּ֣י גִבּ֣וֹר שְׁנוּנִ֑ים
  עִ֝֗ם גַּחֲלֵ֥י רְתָמִֽים׃

  {5}אֽוֹיָה־לִ֭י כִּי־גַ֣רְתִּי מֶ֑שֶׁךְ
  שָׁ֝כַ֗נְתִּי עִֽם־אָהֳלֵ֥י קֵדָֽר׃

  {6}רַ֭בַּת שָֽׁכְנָה־לָּ֣הּ נַפְשִׁ֑י
  עִ֝֗ם שׂוֹנֵ֥א שָׁלֽוֹם׃

  {7}אֲֽנִי־שָׁ֭לוֹם וְכִ֣י אֲדַבֵּ֑ר
  הֵ֝֗מָּה לַמִּלְחָמָֽה׃
