title: Psaume 130
subtitle: null
commentary: null
biblicalReference: Ps 130(131), 1-3
shortReference: Ps 130
content: |-
  {1}יְהוָ֤ה ׀ לֹא־גָבַ֣הּ לִ֭בִּי וְלֹא־רָמ֣וּ עֵינַ֑י
  וְלֹֽא־הִלַּ֓כְתִּי ׀ בִּגְדֹל֖וֹת
  וּבְנִפְלָא֣וֹת מִמֶּֽנִּי׃

  {2}אִם־לֹ֤א שִׁוִּ֨יתִי ׀ וְדוֹמַ֗מְתִּי
  נַ֫פְשִׁ֥י כְּ֭גָמֻל עֲלֵ֣י אִמּ֑וֹ
  כַּגָּמֻ֖ל עָלַ֣י נַפְשִֽׁי׃

  {3}יַחֵ֣ל יִ֭שְׂרָאֵל אֶל־יְהוָ֑ה
  מֵֽ֝עַתָּ֗ה וְעַד־עוֹלָֽם׃
