title: Psaume 131-I
subtitle: null
commentary: null
biblicalReference: Ps 131(132), 1-10
shortReference: Ps 131
content: |-
  {1}זְכוֹר־יְהוָ֥ה לְדָוִ֑ד
  אֵ֝ת כָּל־עֻנּוֹתֽוֹ׃

  {2}אֲשֶׁ֣ר נִ֭שְׁבַּע לַיהוָ֑ה
  נָ֝דַ֗ר לַאֲבִ֥יר יַעֲקֹֽב׃

  {3}אִם־אָ֭בֹא בְּאֹ֣הֶל בֵּיתִ֑י
  אִם־אֶ֝עֱלֶ֗ה עַל־עֶ֥רֶשׂ יְצוּעָֽי׃

  {4}אִם־אֶתֵּ֣ן שְׁנַ֣ת לְעֵינָ֑י
  לְֽעַפְעַפַּ֥י תְּנוּמָֽה׃

  {5}עַד־אֶמְצָ֣א מָ֭קוֹם לַיהוָ֑ה
  מִ֝שְׁכָּנ֗וֹת לַאֲבִ֥יר יַעֲקֹֽב׃

  {6}הִנֵּֽה־שְׁמַֽעֲנ֥וּהָ בְאֶפְרָ֑תָה
  מְ֝צָאנ֗וּהָ בִּשְׂדֵי־יָֽעַר׃

  {7}נָב֥וֹאָה לְמִשְׁכְּנוֹתָ֑יו
  נִ֝שְׁתַּחֲוֶ֗ה לַהֲדֹ֥ם רַגְלָֽיו׃

  {8}קוּמָ֣ה יְ֭הוָה לִמְנוּחָתֶ֑ךָ
  אַ֝תָּ֗ה וַאֲר֥וֹן עֻזֶּֽךָ׃

  {9}כֹּהֲנֶ֥יךָ יִלְבְּשׁוּ־צֶ֑דֶק
  וַחֲסִידֶ֥יךָ יְרַנֵּֽנוּ׃

  {10}בַּ֭עֲבוּר דָּוִ֣ד עַבְדֶּ֑ךָ
  אַל־תָּ֝שֵׁ֗ב פְּנֵ֣י מְשִׁיחֶֽךָ׃
