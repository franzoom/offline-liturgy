title: Psaume 132
subtitle: null
commentary: null
biblicalReference: Ps 132(133), 1-3
shortReference: Ps 132
content: |-
  {1}הִנֵּ֣ה מַה־טּ֭וֹב וּמַה־נָּעִ֑ים
  שֶׁ֖בֶת אַחִ֣ים גַּם־יָֽחַד׃

  {2}כַּשֶּׁ֤מֶן הַטּ֨וֹב ׀ עַל־הָרֹ֗אשׁ
  יֹרֵ֗ד עַֽל־הַזָּקָ֥ן זְקַֽן־אַהֲרֹ֑ן
  שֶׁ֝יֹּרֵ֗ד עַל־פִּ֥י מִדּוֹתָֽיו׃

  {3}כְּטַל־חֶרְמ֗וֹן שֶׁיֹּרֵד֮ עַל־הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם ׀ צִוָּ֣ה יְ֭הוָה אֶת־הַבְּרָכָ֑ה
  חַ֝יִּ֗ים עַד־הָעוֹלָֽם׃
