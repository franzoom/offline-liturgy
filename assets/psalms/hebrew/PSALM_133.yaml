title: Psaume 133
subtitle: null
commentary: null
biblicalReference: Ps 133(134), 1-3
shortReference: Ps 133
content: |-
  {1}הִנֵּ֤ה ׀ בָּרֲכ֣וּ אֶת־יְ֭הוָה כָּל־עַבְדֵ֣י יְהוָ֑ה
  הָעֹמְדִ֥ים בְּבֵית־יְ֝הוָ֗ה בַּלֵּילֽוֹת׃

  {2}שְׂאֽוּ־יְדֵכֶ֥ם קֹ֑דֶשׁ
  וּ֝בָרֲכוּ אֶת־יְהוָֽה׃

  {3}יְבָרֶכְךָ֣ יְ֭הוָה מִצִּיּ֑וֹן
  עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָאָֽרֶץ׃
