title: Psaume 134_2
subtitle: null
commentary: null
biblicalReference: Ps 134(135), 13-21
shortReference: Ps 134
content: |-
  {13}יְ֭הוָה שִׁמְךָ֣ לְעוֹלָ֑ם
  יְ֝הוָ֗ה זִכְרְךָ֥ לְדֹר־וָדֹֽר׃

  {14}כִּֽי־יָדִ֣ין יְהוָ֣ה עַמּ֑וֹ
  וְעַל־עֲ֝בָדָ֗יו יִתְנֶחָֽם׃

  {15}עֲצַבֵּ֣י הַ֭גּוֹיִם כֶּ֣סֶף וְזָהָ֑ב
  מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃

  {16}פֶּֽה־לָ֭הֶם וְלֹ֣א יְדַבֵּ֑רוּ
  עֵינַ֥יִם לָ֝הֶ֗ם וְלֹ֣א יִרְאֽוּ׃

  {17}אָזְנַ֣יִם לָ֭הֶם וְלֹ֣א יַאֲזִ֑ינוּ
  אַ֝֗ף אֵין־יֶשׁ־ר֥וּחַ בְּפִיהֶֽם׃

  {18}כְּ֭מוֹהֶם יִהְי֣וּ עֹשֵׂיהֶ֑ם
  כֹּ֭ל אֲשֶׁר־בֹּטֵ֣חַ בָּהֶֽם׃

  {19}בֵּ֣ית יִ֭שְׂרָאֵל בָּרֲכ֣וּ אֶת־יְהוָ֑ה
  בֵּ֥ית אַ֝הֲרֹ֗ן בָּרֲכ֥וּ אֶת־יְהוָֽה׃

  {20}בֵּ֣ית הַ֭לֵּוִי בָּרֲכ֣וּ אֶת־יְהוָ֑ה
  יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת־יְהוָֽה׃

  {21}בָּ֘ר֤וּךְ יְהוָ֨ה ׀ מִצִּיּ֗וֹן
  שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ־יָֽהּ׃
