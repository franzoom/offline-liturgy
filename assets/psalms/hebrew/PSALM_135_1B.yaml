title: Psaume 135_1B
subtitle: null
commentary: null
biblicalReference: Ps 135(136), 1-12
shortReference: Ps 135
content: |-
  {1}הוֹד֣וּ לַיהוָ֣ה כִּי־ט֑וֹב
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {2}ה֭וֹדוּ לֵֽאלֹהֵ֣י הָאֱלֹהִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {3}ה֭וֹדוּ לַאֲדֹנֵ֣י הָאֲדֹנִ֑ים
  כִּ֖י לְעֹלָ֣ם חַסְדּֽוֹ׃

  {4}לְעֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְבַדּ֑וֹ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {5}לְעֹשֵׂ֣ה הַ֭שָּׁמַיִם בִּתְבוּנָ֑ה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {6}לְרֹקַ֣ע הָ֭אָרֶץ עַל־הַמָּ֑יִם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {7}לְ֭עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {8}אֶת־הַ֭שֶּׁמֶשׁ לְמֶמְשֶׁ֣לֶת בַּיּ֑וֹם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {9}אֶת־הַיָּרֵ֣חַ וְ֭כוֹכָבִים לְמֶמְשְׁל֣וֹת בַּלָּ֑יְלָה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {10}לְמַכֵּ֣ה מִ֭צְרַיִם בִּבְכוֹרֵיהֶ֑ם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {11}וַיּוֹצֵ֣א יִ֭שְׂרָאֵל מִתּוֹכָ֑ם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {12}בְּיָ֣ד חֲ֭זָקָה וּבִזְר֣וֹעַ נְטוּיָ֑ה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃
