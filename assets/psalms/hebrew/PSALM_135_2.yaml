title: Psaume 135_2
subtitle: null
commentary: null
biblicalReference: Ps 135(136), 10-15
shortReference: Ps 135
content: |-
  {10}לְמַכֵּ֣ה מִ֭צְרַיִם בִּבְכוֹרֵיהֶ֑ם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {11}וַיּוֹצֵ֣א יִ֭שְׂרָאֵל מִתּוֹכָ֑ם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {12}בְּיָ֣ד חֲ֭זָקָה וּבִזְר֣וֹעַ נְטוּיָ֑ה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {13}לְגֹזֵ֣ר יַם־ס֭וּף לִגְזָרִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {14}וְהֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּתוֹכ֑וֹ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {15}וְנִ֘עֵ֤ר פַּרְעֹ֣ה וְחֵיל֣וֹ בְיַם־ס֑וּף
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃
