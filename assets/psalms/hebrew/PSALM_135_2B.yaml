title: Psaume 135-II
subtitle: null
commentary: null
biblicalReference: Ps 135(136), 13-26
shortReference: Ps 135
content: |-
  {13}לְגֹזֵ֣ר יַם־ס֭וּף לִגְזָרִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {14}וְהֶעֱבִ֣יר יִשְׂרָאֵ֣ל בְּתוֹכ֑וֹ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {15}וְנִ֘עֵ֤ר פַּרְעֹ֣ה וְחֵיל֣וֹ בְיַם־ס֑וּף
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {16}לְמוֹלִ֣יךְ עַ֭מּוֹ בַּמִּדְבָּ֑ר
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {17}לְ֭מַכֵּה מְלָכִ֣ים גְּדֹלִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {18}וַֽ֭יַּהֲרֹג מְלָכִ֣ים אַדִּירִ֑ים
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {19}לְ֭סִיחוֹן מֶ֣לֶךְ הָאֱמֹרִ֑י
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {20}וּ֭לְעוֹג מֶ֣לֶךְ הַבָּשָׁ֑ן
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {21}וְנָתַ֣ן אַרְצָ֣ם לְנַחֲלָ֑ה
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {22}נַ֭חֲלָה לְיִשְׂרָאֵ֣ל עַבְדּ֑וֹ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {23}שֶׁ֭בְּשִׁפְלֵנוּ זָ֣כַר לָ֑נוּ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {24}וַיִּפְרְקֵ֥נוּ מִצָּרֵ֑ינוּ
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {25}נֹתֵ֣ן לֶ֭חֶם לְכָל־בָּשָׂ֑ר
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃

  {26}ה֭וֹדוּ לְאֵ֣ל הַשָּׁמָ֑יִם
  כִּ֖י לְעוֹלָ֣ם חַסְדּֽוֹ׃
