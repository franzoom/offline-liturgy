title: Psaume 138_1
subtitle: null
commentary: null
biblicalReference: Ps 138(139), 1-10
shortReference: Ps 138
content: |-
  {1}יְהוָ֥ה חֲ֝קַרְתַּ֗נִי וַתֵּדָֽע׃

  {2}אַתָּ֣ה יָ֭דַעְתָּ שִׁבְתִּ֣י וְקוּמִ֑י
  בַּ֥נְתָּה לְ֝רֵעִ֗י מֵרָחֽוֹק׃

  {3}אָרְחִ֣י וְרִבְעִ֣י זֵרִ֑יתָ
  וְֽכָל־דְּרָכַ֥י הִסְכַּֽנְתָּה׃

  {4}כִּ֤י אֵ֣ין מִ֭לָּה בִּלְשׁוֹנִ֑י
  הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽהּ׃

  {5}אָח֣וֹר וָקֶ֣דֶם צַרְתָּ֑נִי
  וַתָּ֖שֶׁת עָלַ֣י כַּפֶּֽכָה׃

  {6}פְּלִ֣יאָֽה דַ֣עַת מִמֶּ֑נִּי
  נִ֝שְׂגְּבָ֗ה לֹא־א֥וּכַֽל לָֽהּ׃

  {7}אָ֭נָ֥ה אֵלֵ֣ךְ מֵרוּחֶ֑ךָ
  וְ֝אָ֗נָה מִפָּנֶ֥יךָ אֶבְרָֽח׃

  {8}אִם־אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה
  וְאַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽךָּ׃

  {9}אֶשָּׂ֥א כַנְפֵי־שָׁ֑חַר
  אֶ֝שְׁכְּנָ֗ה בְּאַחֲרִ֥ית יָֽם׃

  {10}גַּם־שָׁ֭ם יָדְךָ֣ תַנְחֵ֑נִי
  וְֽתֹאחֲזֵ֥נִי יְמִינֶֽךָ׃
