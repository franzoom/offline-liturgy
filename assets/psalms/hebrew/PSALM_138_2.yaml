title: Psaume 138_2
subtitle: null
commentary: null
biblicalReference: Ps 138(139), 11-24
shortReference: Ps 138
content: |-
  {11}וָ֭אֹמַר אַךְ־חֹ֣שֶׁךְ יְשׁוּפֵ֑נִי
  וְ֝לַ֗יְלָה א֣וֹר בַּעֲדֵֽנִי׃

  {12}גַּם־חֹשֶׁךְ֮ לֹֽא־יַחְשִׁ֪יךְ מִ֫מֶּ֥ךָ וְ֭לַיְלָה כַּיּ֣וֹם יָאִ֑יר
  כַּ֝חֲשֵׁיכָ֗ה כָּאוֹרָֽה׃

  {13}כִּֽי־אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑י
  תְּ֝סֻכֵּ֗נִי בְּבֶ֣טֶן אִמִּֽי׃

  {14}אֽוֹדְךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת
  נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑יךָ
  וְ֝נַפְשִׁ֗י יֹדַ֥עַת מְאֹֽד׃

  {15}לֹא־נִכְחַ֥ד עָצְמִ֗י
  מִ֫מֶּ֥ךָּ אֲשֶׁר־עֻשֵּׂ֥יתִי בַסֵּ֑תֶר
  רֻ֝קַּ֗מְתִּי בְּֽתַחְתִּיּ֥וֹת אָֽרֶץ׃

  {16}גָּלְמִ֤י ׀ רָ֘א֤וּ עֵינֶ֗יךָ
  וְעַֽל־סִפְרְךָ֮ כֻּלָּ֪ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ
  וְל֖וֹ אֶחָ֣ד בָּהֶֽם׃

  {17}וְלִ֗י מַה־יָּקְר֣וּ רֵעֶ֣יךָ אֵ֑ל
  מֶ֥ה עָ֝צְמוּ רָאשֵׁיהֶֽם׃

  {18}אֶ֭סְפְּרֵם מֵח֣וֹל יִרְבּ֑וּן
  הֱ֝קִיצֹ֗תִי וְעוֹדִ֥י עִמָּֽךְ׃

  [{19}אִם־תִּקְטֹ֖ל אֱל֥וֹהַּ ׀ רָשָׁ֑ע
  וְאַנְשֵׁ֥י דָ֝מִ֗ים ס֣וּרוּ מֶֽנִּי׃

  {20}אֲשֶׁ֣ר יֹ֭אמְרֻךָ לִמְזִמָּ֑ה
  נָשֻׂ֖א לַשָּׁ֣וְא עָרֶֽיךָ׃

  {21}הֲלֽוֹא־מְשַׂנְאֶ֖יךָ יְהוָ֥ה ׀ אֶשְׂנָ֑א
  וּ֝בִתְקוֹמְמֶ֗יךָ אֶתְקוֹטָֽט׃

  {22}תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑ים
  לְ֝אוֹיְבִ֗ים הָ֣יוּ לִֽי׃]

  {23}חָקְרֵ֣נִי אֵ֭ל וְדַ֣ע לְבָבִ֑י
  בְּ֝חָנֵ֗נִי וְדַ֣ע שַׂרְעַפָּֽי׃

  {24}וּרְאֵ֗ה אִם־דֶּֽרֶךְ־עֹ֥צֶב בִּ֑י
  וּ֝נְחֵ֗נִי בְּדֶ֣רֶךְ עוֹלָֽם׃
