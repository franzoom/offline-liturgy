title: Psaume 141
subtitle: null
commentary: null
biblicalReference: Ps 141(142), 2-8
shortReference: Ps 141
content: |-
  {2}ק֭וֹלִי אֶל־יְהוָ֣ה אֶזְעָ֑ק
  ק֝וֹלִ֗י אֶל־יְהוָ֥ה אֶתְחַנָּֽן׃

  {3}אֶשְׁפֹּ֣ךְ לְפָנָ֣יו שִׂיחִ֑י
  צָ֝רָתִ֗י לְפָנָ֥יו אַגִּֽיד׃

  {4}בְּהִתְעַטֵּ֬ף עָלַ֨י ׀ רוּחִ֗י
  וְאַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥י בְּאֹֽרַח־ז֥וּ אֲהַלֵּ֑ךְ
  טָמְנ֖וּ פַ֣ח לִֽי׃

  {5}הַבֵּ֤יט יָמִ֨ין ׀ וּרְאֵה֮ וְאֵֽין־לִ֪י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑נִּי
  אֵ֖ין דּוֹרֵ֣שׁ לְנַפְשִֽׁי׃

  {6}זָעַ֥קְתִּי אֵלֶ֗יךָ
  יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑י
  חֶ֝לְקִ֗י בְּאֶ֣רֶץ הַֽחַיִּים׃

  {7}הַקְשִׁ֤יבָה ׀ אֶֽל־רִנָּתִי֮ כִּֽי־דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥נִי מֵרֹדְפַ֑י
  כִּ֖י אָמְצ֣וּ מִמֶּֽנִּי׃

  {8}ה֘וֹצִ֤יאָה מִמַּסְגֵּ֨ר ׀ נַפְשִׁי֮ לְהוֹד֪וֹת אֶת־שְׁ֫מֶ֥ךָ בִּ֭י יַכְתִּ֣רוּ צַדִּיקִ֑ים
  כִּ֖י תִגְמֹ֣ל עָלָֽי׃
