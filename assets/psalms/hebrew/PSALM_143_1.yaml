title: Psaume 143-I
subtitle: null
commentary: null
biblicalReference: Ps 143(144), 1-8
shortReference: Ps 143
content: |-
  {1}׀ בָּ֘ר֤וּךְ יְהוָ֨ה ׀ צוּרִ֗י
  הַֽמְלַמֵּ֣ד יָדַ֣י לַקְרָ֑ב
  אֶ֝צְבְּעוֹתַ֗י לַמִּלְחָמָֽה׃

  {2}חַסְדִּ֥י וּמְצוּדָתִי֮ מִשְׂגַּבִּ֪י וּֽמְפַלְטִ֫י לִ֥י מָ֭גִנִּי וּב֣וֹ חָסִ֑יתִי
  הָרוֹדֵ֖ד עַמִּ֣י תַחְתָּֽי׃

  {3}יְֽהוָ֗ה מָה־אָ֭דָם וַתֵּדָעֵ֑הוּ
  בֶּן־אֱ֝נ֗וֹשׁ וַֽתְּחַשְּׁבֵֽהוּ׃

  {4}אָ֭דָם לַהֶ֣בֶל דָּמָ֑ה
  יָ֝מָ֗יו כְּצֵ֣ל עוֹבֵֽר׃

  {5}יְ֭הוָה הַט־שָׁמֶ֣יךָ וְתֵרֵ֑ד
  גַּ֖ע בֶּהָרִ֣ים וְֽיֶעֱשָֽׁנוּ׃

  {6}בְּר֣וֹק בָּ֭רָק וּתְפִיצֵ֑ם
  שְׁלַ֥ח חִ֝צֶּ֗יךָ וּתְהֻמֵּֽם׃

  {7}שְׁלַ֥ח יָדֶ֗יךָ מִמָּ֫ר֥וֹם פְּצֵ֣נִי וְ֭הַצִּילֵנִי מִמַּ֣יִם רַבִּ֑ים
  מִ֝יַּ֗ד בְּנֵ֣י נֵכָֽר׃

  {8}אֲשֶׁ֣ר פִּ֭יהֶם דִּבֶּר־שָׁ֑וְא
  וִֽ֝ימִינָ֗ם יְמִ֣ין שָֽׁקֶר׃
