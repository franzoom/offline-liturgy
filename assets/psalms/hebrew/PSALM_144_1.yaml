title: Psaume 144-I
subtitle: null
commentary: null
biblicalReference: Ps 144(145), 1-9
shortReference: Ps 144
content: |-
  {1}אֲרוֹמִמְךָ֣ אֱלוֹהַ֣י הַמֶּ֑לֶךְ
  וַאֲבָרֲכָ֥ה שִׁ֝מְךָ֗ לְעוֹלָ֥ם וָעֶֽד׃

  {2}בְּכָל־י֥וֹם אֲבָרֲכֶ֑ךָּ
  וַאֲהַלְלָ֥ה שִׁ֝מְךָ֗ לְעוֹלָ֥ם וָעֶֽד׃

  {3}גָּ֘ד֤וֹל יְהוָ֣ה וּמְהֻלָּ֣ל מְאֹ֑ד
  וְ֝לִגְדֻלָּת֗וֹ אֵ֣ין חֵֽקֶר׃

  {4}דּ֣וֹר לְ֭דוֹר יְשַׁבַּ֣ח מַעֲשֶׂ֑יךָ
  וּגְב֖וּרֹתֶ֣יךָ יַגִּֽידוּ׃

  {5}הֲ֭דַר כְּב֣וֹד הוֹדֶ֑ךָ
  וְדִבְרֵ֖י נִפְלְאוֹתֶ֣יךָ אָשִֽׂיחָה׃

  {6}וֶעֱז֣וּז נוֹרְאֹתֶ֣יךָ יֹאמֵ֑רוּ
  וּגְדוּלָּתְךָ֥ אֲסַפְּרֶֽנָּה׃

  {7}זֵ֣כֶר רַב־טוּבְךָ֣ יַבִּ֑יעוּ
  וְצִדְקָתְךָ֥ יְרַנֵּֽנוּ׃

  {8}חַנּ֣וּן וְרַח֣וּם יְהוָ֑ה
  אֶ֥רֶךְ אַ֝פַּ֗יִם וּגְדָל־חָֽסֶד׃

  {9}טוֹב־יְהוָ֥ה לַכֹּ֑ל
  וְ֝רַחֲמָ֗יו עַל־כָּל־מַעֲשָֽׂיו׃
