title: Psaume 144-IIa
subtitle: null
commentary: null
biblicalReference: Ps 144(145), 10-21
shortReference: Ps 144
content: |-
  {10}יוֹד֣וּךָ יְ֭הוָה כָּל־מַעֲשֶׂ֑יךָ
  וַ֝חֲסִידֶ֗יךָ יְבָרֲכֽוּכָה׃

  {11}כְּב֣וֹד מַלְכוּתְךָ֣ יֹאמֵ֑רוּ
  וּגְבוּרָתְךָ֥ יְדַבֵּֽרוּ׃

  {12}לְהוֹדִ֤יעַ ׀ לִבְנֵ֣י הָ֭אָדָם גְּבוּרֹתָ֑יו
  וּ֝כְב֗וֹד הֲדַ֣ר מַלְכוּתֽוֹ׃

  {13}מַֽלְכוּתְךָ֗ מַלְכ֥וּת כָּל־עֹֽלָמִ֑ים
  וּ֝מֶֽמְשֶׁלְתְּךָ֗ בְּכָל־דּ֥וֹר וָדֽוֹר׃

  {14}סוֹמֵ֣ךְ יְ֭הוָה לְכָל־הַנֹּפְלִ֑ים
  וְ֝זוֹקֵ֗ף לְכָל־הַכְּפוּפִֽים׃

  {15}עֵֽינֵי־כֹ֭ל אֵלֶ֣יךָ יְשַׂבֵּ֑רוּ
  וְאַתָּ֤ה נֽוֹתֵן־לָהֶ֖ם
  אֶת־אָכְלָ֣ם בְּעִתּֽוֹ׃

  {16}פּוֹתֵ֥חַ אֶת־יָדֶ֑ךָ
  וּמַשְׂבִּ֖יעַ לְכָל־חַ֣י רָצֽוֹן׃

  {17}צַדִּ֣יק יְ֭הוָה בְּכָל־דְּרָכָ֑יו
  וְ֝חָסִ֗יד בְּכָל־מַעֲשָֽׂיו׃

  {18}קָר֣וֹב יְ֭הוָה לְכָל־קֹרְאָ֑יו
  לְכֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣הוּ בֶאֱמֶֽת׃

  {19}רְצוֹן־יְרֵאָ֥יו יַעֲשֶׂ֑ה
  וְֽאֶת־שַׁוְעָתָ֥ם יִ֝שְׁמַ֗ע וְיוֹשִׁיעֵֽם׃

  {20}שׁוֹמֵ֣ר יְ֭הוָה אֶת־כָּל־אֹהֲבָ֑יו
  וְאֵ֖ת כָּל־הָרְשָׁעִ֣ים יַשְׁמִֽיד׃

  {21}תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר־פִּ֥י וִיבָרֵ֣ךְ כָּל־בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗וֹ לְעוֹלָ֥ם וָעֶֽד׃
