title: Psaume 16_1
subtitle: null
commentary: null
biblicalReference: Ps 16(17), 1-7
shortReference: Ps 16
content: |-
  {1}שִׁמְעָ֤ה יְהוָ֨ה ׀ צֶ֗דֶק
  הַקְשִׁ֥יבָה רִנָּתִ֗י הַאֲזִ֥ינָה תְפִלָּתִ֑י
  בְּ֝לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׃

  {2}מִ֭לְּפָנֶיךָ מִשְׁפָּטִ֣י יֵצֵ֑א
  עֵ֝ינֶ֗יךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃

  {3}בָּ֘חַ֤נְתָּ לִבִּ֨י ׀ פָּ֘קַ֤דְתָּ לַּ֗יְלָה
  צְרַפְתַּ֥נִי בַל־תִּמְצָ֑א
  זַ֝מֹּתִ֗י בַּל־יַעֲבָר־פִּֽי׃

  {4}לִפְעֻלּ֣וֹת אָ֭דָם בִּדְבַ֣ר שְׂפָתֶ֑יךָ
  אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃

  {5}תָּמֹ֣ךְ אֲ֭שֻׁרַי בְּמַעְגְּלוֹתֶ֑יךָ
  בַּל־נָמ֥וֹטּוּ פְעָמָֽי׃

  {6}אֲנִֽי־קְרָאתִ֣יךָ כִֽי־תַעֲנֵ֣נִי אֵ֑ל
  הַֽט־אָזְנְךָ֥ לִ֝֗י שְׁמַ֣ע אִמְרָתִֽי׃

  {7}הַפְלֵ֣ה חֲ֭סָדֶיךָ מוֹשִׁ֣יעַ חוֹסִ֑ים
  מִ֝מִּתְקוֹמְמִ֗ים בִּֽימִינֶֽךָ׃
