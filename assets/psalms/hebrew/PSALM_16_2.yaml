title: Psaume 16-II
subtitle: null
commentary: null
biblicalReference: Ps 16(17), 8-15
shortReference: Ps 16
content: |-
  {8}שָׁ֭מְרֵנִי כְּאִישׁ֣וֹן בַּת־עָ֑יִן
  בְּצֵ֥ל כְּ֝נָפֶ֗יךָ תַּסְתִּירֵֽנִי׃

  {9}מִפְּנֵ֣י רְ֭שָׁעִים ז֣וּ שַׁדּ֑וּנִי
  אֹיְבַ֥י בְּ֝נֶ֗פֶשׁ יַקִּ֥יפוּ עָלָֽי׃

  {10}חֶלְבָּ֥מוֹ סָּגְר֑וּ
  פִּ֝֗ימוֹ דִּבְּר֥וּ בְגֵאֽוּת׃

  {11}אַ֭שֻּׁרֵינוּ עַתָּ֣ה סְבָב֑וּנוּ
  עֵינֵיהֶ֥ם יָ֝שִׁ֗יתוּ לִנְט֥וֹת בָּאָֽרֶץ׃

  {12}דִּמְיֹנ֗וֹ כְּ֭אַרְיֵה יִכְס֣וֹף לִטְר֑וֹף
  וְ֝כִכְפִ֗יר יֹשֵׁ֥ב בְּמִסְתָּרִֽים׃

  {13}קוּמָ֤ה יְהוָ֗ה
  קַדְּמָ֣ה פָ֭נָיו הַכְרִיעֵ֑הוּ
  פַּלְּטָ֥ה נַ֝פְשִׁ֗י מֵרָשָׁ֥ע חַרְבֶּֽךָ׃

  {14}מִֽמְתִ֥ים יָדְךָ֨ ׀ יְהוָ֡ה מִֽמְתִ֬ים מֵחֶ֗לֶד
  חֶלְקָ֥ם בַּֽחַיִּים֮ וּֽצְפוּנְךָ֮ תְּמַלֵּ֪א בִ֫טְנָ֥ם יִשְׂבְּע֥וּ בָנִ֑ים
  וְהִנִּ֥יחוּ יִ֝תְרָ֗ם לְעוֹלְלֵיהֶֽם׃

  {15}אֲנִ֗י בְּ֭צֶדֶק אֶחֱזֶ֣ה פָנֶ֑יךָ
  אֶשְׂבְּעָ֥ה בְ֝הָקִ֗יץ תְּמוּנָתֶֽךָ׃
