title: Psaume 17-I
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 2-11
shortReference: Ps 17
content: |-
  {2}וַיֹּאמַ֡ר אֶרְחָמְךָ֖ יְהוָ֣ה חִזְקִֽי׃

  {3}יְהוָ֤ה ׀ סַֽלְעִ֥י וּמְצוּדָתִ֗י
  וּמְפַ֫לְטִ֥י אֵלִ֣י צ֭וּרִי אֶֽחֱסֶה־בּ֑וֹ
  מָֽגִנִּ֥י וְקֶֽרֶן־יִ֝שְׁעִ֗י
  מִשְׂגַּבִּֽי׃

  {4}מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה
  וּמִן־אֹ֝יְבַ֗י אִוָּשֵֽׁעַ׃

  {5}אֲפָפ֥וּנִי חֶבְלֵי־מָ֑וֶת
  וְֽנַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּנִי׃

  {6}חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּנִי
  קִ֝דְּמ֗וּנִי מ֣וֹקְשֵׁי מָֽוֶת׃

  {7}בַּצַּר־לִ֤י ׀ אֶֽקְרָ֣א יְהוָה֮ וְאֶל־אֱלֹהַ֪י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵהֵיכָל֣וֹ קוֹלִ֑י
  וְ֝שַׁוְעָתִ֗י
  לְפָנָ֤יו ׀ תָּב֬וֹא בְאָזְנָֽיו׃

  {8}וַתִּגְעַ֬שׁ וַתִּרְעַ֨שׁ ׀ הָאָ֗רֶץ
  וּמוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ
  וַ֝יִּתְגָּֽעֲשׁ֗וּ כִּי־חָ֥רָה לֽוֹ׃

  {9}עָ֘לָ֤ה עָשָׁ֨ן ׀ בְּאַפּ֗וֹ
  וְאֵשׁ־מִפִּ֥יו תֹּאכֵ֑ל
  גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽנּוּ׃

  {10}וַיֵּ֣ט שָׁ֭מַיִם וַיֵּרַ֑ד
  וַ֝עֲרָפֶ֗ל תַּ֣חַת רַגְלָֽיו׃

  {11}וַיִּרְכַּ֣ב עַל־כְּ֭רוּב וַיָּעֹ֑ף
  וַ֝יֵּ֗דֶא עַל־כַּנְפֵי־רֽוּחַ׃
