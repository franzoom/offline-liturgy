title: Psaume 17-II
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 12-20
shortReference: Ps 17
content: |-
  {12}יָ֤שֶׁת חֹ֨שֶׁךְ ׀ סִתְר֗וֹ
  סְבִֽיבוֹתָ֥יו סֻכָּת֑וֹ
  חֶשְׁכַת־מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׃

  {13}מִנֹּ֗גַהּ נֶ֫גְדּ֥וֹ עָבָ֥יו עָבְר֑וּ
  בָּ֝רָ֗ד וְגַֽחֲלֵי־אֵֽשׁ׃

  {14}וַיַּרְעֵ֬ם בַּשָּׁמַ֨יִם ׀ יְֽהוָ֗ה
  וְ֭עֶלְיוֹן יִתֵּ֣ן קֹל֑וֹ
  בָּ֝רָ֗ד וְגַֽחֲלֵי־אֵֽשׁ׃

  {15}וַיִּשְׁלַ֣ח חִ֭צָּיו וַיְפִיצֵ֑ם
  וּבְרָקִ֥ים רָ֝ב וַיְהֻמֵּֽם׃

  {16}וַיֵּ֤רָא֨וּ ׀ אֲפִ֥יקֵי מַ֗יִם
  וַֽיִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִגַּעֲרָ֣תְךָ֣ יְהוָ֑ה
  מִ֝נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽךָ׃

  {17}יִשְׁלַ֣ח מִ֭מָּרוֹם יִקָּחֵ֑נִי
  יַֽ֝מְשֵׁ֗נִי מִמַּ֥יִם רַבִּֽים׃

  {18}יַצִּילֵ֗נִי מֵאֹיְבִ֥י עָ֑ז
  וּ֝מִשֹּׂנְאַ֗י כִּֽי־אָמְצ֥וּ מִמֶּֽנִּי׃

  {19}יְקַדְּמ֥וּנִי בְיוֹם־אֵידִ֑י
  וַֽיְהִי־יְהוָ֖ה לְמִשְׁעָ֣ן לִֽי׃

  {20}וַיּוֹצִיאֵ֥נִי לַמֶּרְחָ֑ב
  יְ֝חַלְּצֵ֗נִי כִּ֘י חָ֥פֵֽץ בִּֽי׃
