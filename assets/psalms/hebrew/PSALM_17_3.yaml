title: Psaume 17-III
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 21-30
shortReference: Ps 17
content: |-
  {21}יִגְמְלֵ֣נִי יְהוָ֣ה כְּצִדְקִ֑י
  כְּבֹ֥ר יָ֝דַ֗י יָשִׁ֥יב לִֽי׃

  {22}כִּֽי־שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה
  וְלֹֽא־רָ֝שַׁ֗עְתִּי מֵאֱלֹהָֽי׃

  {23}כִּ֣י כָל־מִשְׁפָּטָ֣יו לְנֶגְדִּ֑י
  וְ֝חֻקֹּתָ֗יו לֹא־אָסִ֥יר מֶֽנִּי׃

  {24}וָאֱהִ֣י תָמִ֣ים עִמּ֑וֹ
  וָ֝אֶשְׁתַּמֵּ֗ר מֵעֲוֺנִֽי׃

  {25}וַיָּֽשֶׁב־יְהוָ֣ה לִ֣י כְצִדְקִ֑י
  כְּבֹ֥ר יָ֝דַ֗י לְנֶ֣גֶד עֵינָֽיו׃

  {26}עִם־חָסִ֥יד תִּתְחַסָּ֑ד
  עִם־גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם׃

  {27}עִם־נָבָ֥ר תִּתְבָּרָ֑ר
  וְעִם־עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל׃

  {28}כִּֽי־אַ֭תָּה עַם־עָנִ֣י תוֹשִׁ֑יעַ
  וְעֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל׃

  {29}כִּֽי־אַ֭תָּה תָּאִ֣יר נֵרִ֑י
  יְהוָ֥ה אֱ֝לֹהַ֗י יַגִּ֥יהַּ חָשְׁכִּֽי׃

  {30}כִּֽי־בְ֭ךָ אָרֻ֣ץ גְּד֑וּד
  וּ֝בֵֽאלֹהַ֗י אֲדַלֶּג־שֽׁוּר׃
