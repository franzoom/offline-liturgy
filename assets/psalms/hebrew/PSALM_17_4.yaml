title: Psaume 17_4
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 31-35
shortReference: Ps 17
content: |-
  {31}הָאֵל֮ תָּמִ֪ים דַּ֫רְכּ֥וֹ אִמְרַֽת־יְהוָ֥ה צְרוּפָ֑ה
  מָגֵ֥ן ה֝֗וּא לְכֹ֤ל ׀ הַחֹסִ֬ים בּֽוֹ׃

  {32}כִּ֤י מִ֣י אֱ֭לוֹהַּ מִבַּלְעֲדֵ֣י יְהוָ֑ה
  וּמִ֥י צ֝֗וּר זוּלָתִ֥י אֱלֹהֵֽינוּ׃

  {33}הָ֭אֵל הַמְאַזְּרֵ֣נִי חָ֑יִל
  וַיִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽי׃

  {34}מְשַׁוֶּ֣ה רַ֭גְלַי כָּאַיָּל֑וֹת
  וְעַ֥ל בָּ֝מֹתַ֗י יַעֲמִידֵֽנִי׃

  {35}מְלַמֵּ֣ד יָ֭דַי לַמִּלְחָמָ֑ה
  וְֽנִחֲתָ֥ה קֶֽשֶׁת־נְ֝חוּשָׁ֗ה זְרוֹעֹתָֽי׃
