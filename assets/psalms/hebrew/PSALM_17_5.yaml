title: Psaume 17-V
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 36-46
shortReference: Ps 17
content: |-
  {36}וַתִּתֶּן־לִי֮ מָגֵ֪ן יִ֫שְׁעֶ֥ךָ וִֽימִינְךָ֥ תִסְעָדֵ֑נִי
  וְֽעַנְוַתְךָ֥ תַרְבֵּֽנִי׃

  {37}תַּרְחִ֣יב צַעֲדִ֣י תַחְתָּ֑י
  וְלֹ֥א מָ֝עֲד֗וּ קַרְסֻלָּֽי׃

  {38}אֶרְדּ֣וֹף א֭וֹיְבַי וְאַשִּׂיגֵ֑ם
  וְלֹֽא־אָ֝שׁוּב עַד־כַּלּוֹתָֽם׃

  {39}אֶ֭מְחָצֵם וְלֹא־יֻ֣כְלוּ ק֑וּם
  יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽי׃

  {40}וַתְּאַזְּרֵ֣נִי חַ֭יִל לַמִּלְחָמָ֑ה
  תַּכְרִ֖יעַ קָמַ֣י תַּחְתָּֽי׃

  {41}וְֽאֹיְבַ֗י נָתַ֣תָּה לִּ֣י עֹ֑רֶף
  וּ֝מְשַׂנְאַ֗י אַצְמִיתֵֽם׃

  {42}יְשַׁוְּע֥וּ וְאֵין־מוֹשִׁ֑יעַ
  עַל־יְ֝הוָ֗ה וְלֹ֣א עָנָֽם׃

  {43}וְֽאֶשְׁחָקֵ֗ם כְּעָפָ֥ר עַל־פְּנֵי־ר֑וּחַ
  כְּטִ֖יט חוּצ֣וֹת אֲרִיקֵֽם׃

  {44}תְּפַלְּטֵנִי֮ מֵרִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵנִי לְרֹ֣אשׁ גּוֹיִ֑ם
  עַ֖ם לֹא־יָדַ֣עְתִּי יַֽעַבְדֽוּנִי׃

  {45}לְשֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑י
  בְּנֵֽי־נֵ֝כָ֗ר יְכַחֲשׁוּ־לִֽי׃

  {46}בְּנֵי־נֵכָ֥ר יִבֹּ֑לוּ
  וְ֝יַחְרְג֗וּ מִֽמִּסְגְּרֽוֹתֵיהֶֽם׃
