title: Psaume 17_6
subtitle: null
commentary: null
biblicalReference: Ps 17(18), 47-51
shortReference: Ps 17
content: |-
  {47}חַי־יְ֭הוָה וּבָר֣וּךְ צוּרִ֑י
  וְ֝יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽי׃

  {48}הָאֵ֗ל הַנּוֹתֵ֣ן נְקָמ֣וֹת לִ֑י
  וַיַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽי׃

  {49}מְפַלְּטִ֗י מֵאֹ֫יְבָ֥י אַ֣ף מִן־קָ֭מַי תְּרוֹמְמֵ֑נִי
  מֵאִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽנִי׃

  {50}עַל־כֵּ֤ן ׀ אוֹדְךָ֖ בַגּוֹיִ֥ם ׀ יְהוָ֑ה
  וּלְשִׁמְךָ֥ אֲזַמֵּֽרָה׃

  {51}מַגְדִּיל֮ יְשׁוּע֪וֹת מַ֫לְכּ֥וֹ וְעֹ֤שֶׂה חֶ֨סֶד ׀ לִמְשִׁיח֗וֹ
  לְדָוִ֥ד וּלְזַרְע֗וֹ עַד־עוֹלָֽם׃
