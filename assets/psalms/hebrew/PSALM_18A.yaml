title: Psaume 18a
subtitle: null
commentary: null
biblicalReference: Ps 18A(19), 2-7
shortReference: Ps 18A
content: |-
  {2}הַשָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד־אֵ֑ל
  וּֽמַעֲשֵׂ֥ה יָ֝דָ֗יו מַגִּ֥יד הָרָקִֽיעַ׃

  {3}י֣וֹם לְ֭יוֹם יַבִּ֣יעַֽ אֹ֑מֶר
  וְלַ֥יְלָה לְּ֝לַ֗יְלָה יְחַוֶּה־דָּֽעַת׃

  {4}אֵֽין־אֹ֭מֶר וְאֵ֣ין דְּבָרִ֑ים
  בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽם׃

  {5}בְּכָל־הָאָ֨רֶץ ׀ יָ֘צָ֤א קַוָּ֗ם
  וּבִקְצֵ֣ה תֵ֭בֵל מִלֵּיהֶ֑ם
  לַ֝שֶּׁ֗מֶשׁ שָֽׂם־אֹ֥הֶל בָּהֶֽם׃

  {6}וְה֗וּא כְּ֭חָתָן יֹצֵ֣א מֵחֻפָּת֑וֹ
  יָשִׂ֥ישׂ כְּ֝גִבּ֗וֹר לָר֥וּץ אֹֽרַח׃

  {7}מִקְצֵ֤ה הַשָּׁמַ֨יִם ׀ מֽוֹצָא֗וֹ
  וּתְקוּפָת֥וֹ עַל־קְצוֹתָ֑ם
  וְאֵ֥ין נִ֝סְתָּ֗ר מֵֽחַמָּתוֹ׃
