title: Psaume 18b
subtitle: null
commentary: null
biblicalReference: Ps 18B(19), 8-15
shortReference: Ps 18B
content: |-
  {8}תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ
  עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה
  מַחְכִּ֥ימַת פֶּֽתִי׃

  {9}פִּקּ֘וּדֵ֤י
  יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי־לֵ֑ב
  מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם׃

  {10}יִרְאַ֤ת יְהוָ֨ה ׀ טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫עַ֥ד מִֽשְׁפְּטֵי־יְהוָ֥ה אֱמֶ֑ת
  צָֽדְק֥וּ יַחְדָּֽו׃

  {11}הַֽנֶּחֱמָדִ֗ים מִ֭זָּהָב וּמִפַּ֣ז רָ֑ב
  וּמְתוּקִ֥ים מִ֝דְּבַ֗שׁ וְנֹ֣פֶת צוּפִֽים׃

  {12}גַּֽם־עַ֭בְדְּךָ נִזְהָ֣ר בָּהֶ֑ם
  בְּ֝שָׁמְרָ֗ם עֵ֣קֶב רָֽב׃

  {13}שְׁגִיא֥וֹת מִֽי־יָבִ֑ין
  מִֽנִּסְתָּר֥וֹת נַקֵּֽנִי׃

  {14}גַּ֤ם מִזֵּדִ֨ים ׀ חֲשֹׂ֬ךְ עַבְדֶּ֗ךָ
  אַֽל־יִמְשְׁלוּ־בִ֣י אָ֣ז אֵיתָ֑ם
  וְ֝נִקֵּ֗יתִי מִפֶּ֥שַֽׁע רָֽב׃

  {15}יִֽהְי֥וּ לְרָצ֨וֹן ׀ אִמְרֵי־פִ֡י
  וְהֶגְי֣וֹן לִבִּ֣י לְפָנֶ֑יךָ
  יְ֝הוָ֗ה צוּרִ֥י וְגֹאֲלִֽי׃
