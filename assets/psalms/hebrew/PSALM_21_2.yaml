title: Psaume 21_2
subtitle: null
commentary: null
biblicalReference: Ps 21(22), 12-22
shortReference: Ps 21
content: |-
  {12}אַל־תִּרְחַ֣ק מִ֭מֶּנִּי כִּי־צָרָ֣ה קְרוֹבָ֑ה
  כִּי־אֵ֥ין עוֹזֵֽר׃

  {13}סְ֭בָבוּנִי פָּרִ֣ים רַבִּ֑ים
  אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּנִי׃

  {14}פָּצ֣וּ עָלַ֣י פִּיהֶ֑ם
  אַ֝רְיֵ֗ה טֹרֵ֥ף וְשֹׁאֵֽג׃

  {15}כַּמַּ֥יִם נִשְׁפַּכְתִּי֮ וְהִתְפָּֽרְד֗וּ
  כָּֽל־עַצְמ֫וֹתָ֥י הָיָ֣ה לִ֭בִּי כַּדּוֹנָ֑ג
  נָ֝מֵ֗ס בְּת֣וֹךְ מֵעָֽי׃

  {16}יָ֘בֵ֤שׁ כַּחֶ֨רֶשׂ ׀ כֹּחִ֗י
  וּ֭לְשׁוֹנִי מֻדְבָּ֣ק מַלְקוֹחָ֑י
  וְֽלַעֲפַר־מָ֥וֶת תִּשְׁפְּתֵֽנִי׃

  {17}כִּ֥י סְבָב֗וּנִי
  כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּנִי
  כָּ֝אֲרִ֗י יָדַ֥י וְרַגְלָֽי׃

  {18}אֲסַפֵּ֥ר כָּל־עַצְמוֹתָ֑י
  הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ־בִֽי׃

  {19}יְחַלְּק֣וּ בְגָדַ֣י לָהֶ֑ם
  וְעַל־לְ֝בוּשִׁ֗י יַפִּ֥ילוּ גוֹרָֽל׃

  {20}וְאַתָּ֣ה יְ֭הוָה אַל־תִּרְחָ֑ק
  אֱ֝יָלוּתִ֗י לְעֶזְרָ֥תִי חֽוּשָׁה׃

  {21}הַצִּ֣ילָה מֵחֶ֣רֶב נַפְשִׁ֑י
  מִיַּד־כֶּ֝֗לֶב יְחִידָתִֽי׃

  {22}ה֭וֹשִׁיעֵנִי מִפִּ֣י אַרְיֵ֑ה
  וּמִקַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽנִי׃
