title: Psaume 21_3
subtitle: null
commentary: null
biblicalReference: Ps 21(22), 23-32
shortReference: Ps 21
content: |-
  {23}אֲסַפְּרָ֣ה שִׁמְךָ֣ לְאֶחָ֑י
  בְּת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽךָּ׃

  {24}יִרְאֵ֤י יְהוָ֨ה ׀ הַֽלְל֗וּהוּ
  כָּל־זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּהוּ
  וְג֥וּרוּ מִ֝מֶּ֗נּוּ
  כָּל־זֶ֥רַע יִשְׂרָאֵֽל׃

  {25}כִּ֤י לֹֽא־בָזָ֨ה וְלֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י
  וְלֹא־הִסְתִּ֣יר פָּנָ֣יו מִמֶּ֑נּוּ
  וּֽבְשַׁוְּע֖וֹ אֵלָ֣יו שָׁמֵֽעַ׃

  {26}מֵ֥אִתְּךָ֗ תְֽהִלָּ֫תִ֥י בְּקָהָ֥ל רָ֑ב
  נְדָרַ֥י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽיו׃

  {27}יֹאכְל֬וּ עֲנָוִ֨ים ׀ וְיִשְׂבָּ֗עוּ
  יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑יו
  יְחִ֖י לְבַבְכֶ֣ם לָעַֽד׃

  {28}יִזְכְּר֤וּ ׀ וְיָשֻׁ֣בוּ אֶל־יְ֭הוָה כָּל־אַפְסֵי־אָ֑רֶץ
  וְיִֽשְׁתַּחֲו֥וּ לְ֝פָנֶ֗יךָ
  כָּֽל־מִשְׁפְּח֥וֹת גּוֹיִֽם׃

  {29}כִּ֣י לַ֭יהוָה הַמְּלוּכָ֑ה
  וּ֝מֹשֵׁ֗ל בַּגּוֹיִֽם׃

  {30}אָכְל֬וּ וַיִּֽשְׁתַּחֲוּ֨וּ ׀ כָּֽל־דִּשְׁנֵי־אֶ֗רֶץ
  לְפָנָ֣יו יִ֭כְרְעוּ כָּל־יוֹרְדֵ֣י עָפָ֑ר
  וְ֝נַפְשׁ֗וֹ לֹ֣א חִיָּֽה׃

  {31}זֶ֥רַע יַֽעַבְדֶ֑נּוּ
  יְסֻפַּ֖ר לַֽאדֹנָ֣י לַדּֽוֹר׃

  {32}יָ֭בֹאוּ וְיַגִּ֣ידוּ צִדְקָת֑וֹ
  לְעַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
