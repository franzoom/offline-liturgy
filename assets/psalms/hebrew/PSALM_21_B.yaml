title: Psaume 21
subtitle: null
commentary: null
biblicalReference: Ps 21(22), 2-23
shortReference: Ps 21
content: |-
  {2}אֵלִ֣י אֵ֭לִי לָמָ֣ה עֲזַבְתָּ֑נִי
  רָח֥וֹק מִֽ֝ישׁוּעָתִ֗י
  דִּבְרֵ֥י שַׁאֲגָתִֽי׃

  {3}אֱֽלֹהַ֗י אֶקְרָ֣א י֭וֹמָם וְלֹ֣א תַעֲנֶ֑ה
  וְ֝לַ֗יְלָה וְֽלֹא־דֽוּמִיָּ֥ה לִֽי׃

  {4}וְאַתָּ֥ה קָד֑וֹשׁ
  י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃

  {5}בְּ֭ךָ בָּטְח֣וּ אֲבֹתֵ֑ינוּ
  בָּ֝טְח֗וּ וַֽתְּפַלְּטֵֽמוֹ׃

  {6}אֵלֶ֣יךָ זָעֲק֣וּ וְנִמְלָ֑טוּ
  בְּךָ֖ בָטְח֣וּ וְלֹא־בֽוֹשׁוּ׃

  {7}וְאָנֹכִ֣י תוֹלַ֣עַת וְלֹא־אִ֑ישׁ
  חֶרְפַּ֥ת אָ֝דָ֗ם וּבְז֥וּי עָֽם׃

  {8}כָּל־רֹ֭אַי יַלְעִ֣גוּ לִ֑י
  יַפְטִ֥ירוּ בְ֝שָׂפָ֗ה יָנִ֥יעוּ רֹֽאשׁ׃

  {9}גֹּ֣ל אֶל־יְהוָ֣ה יְפַלְּטֵ֑הוּ
  יַ֝צִּילֵ֗הוּ כִּ֘י חָ֥פֵֽץ בּֽוֹ׃

  {10}כִּֽי־אַתָּ֣ה גֹחִ֣י מִבָּ֑טֶן
  מַ֝בְטִיחִ֗י עַל־שְׁדֵ֥י אִמִּֽי׃

  {11}עָ֭לֶיךָ הָשְׁלַ֣כְתִּי מֵרָ֑חֶם
  מִבֶּ֥טֶן אִ֝מִּ֗י אֵ֣לִי אָֽתָּה׃

  {12}אַל־תִּרְחַ֣ק מִ֭מֶּנִּי כִּי־צָרָ֣ה קְרוֹבָ֑ה
  כִּי־אֵ֥ין עוֹזֵֽר׃

  {13}סְ֭בָבוּנִי פָּרִ֣ים רַבִּ֑ים
  אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּנִי׃

  {14}פָּצ֣וּ עָלַ֣י פִּיהֶ֑ם
  אַ֝רְיֵ֗ה טֹרֵ֥ף וְשֹׁאֵֽג׃

  {15}כַּמַּ֥יִם נִשְׁפַּכְתִּי֮ וְהִתְפָּֽרְד֗וּ
  כָּֽל־עַצְמ֫וֹתָ֥י הָיָ֣ה לִ֭בִּי כַּדּוֹנָ֑ג
  נָ֝מֵ֗ס בְּת֣וֹךְ מֵעָֽי׃

  {16}יָ֘בֵ֤שׁ כַּחֶ֨רֶשׂ ׀ כֹּחִ֗י
  וּ֭לְשׁוֹנִי מֻדְבָּ֣ק מַלְקוֹחָ֑י
  וְֽלַעֲפַר־מָ֥וֶת תִּשְׁפְּתֵֽנִי׃

  {17}כִּ֥י סְבָב֗וּנִי
  כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּנִי
  כָּ֝אֲרִ֗י יָדַ֥י וְרַגְלָֽי׃

  {18}אֲסַפֵּ֥ר כָּל־עַצְמוֹתָ֑י
  הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ־בִֽי׃

  {19}יְחַלְּק֣וּ בְגָדַ֣י לָהֶ֑ם
  וְעַל־לְ֝בוּשִׁ֗י יַפִּ֥ילוּ גוֹרָֽל׃

  {20}וְאַתָּ֣ה יְ֭הוָה אַל־תִּרְחָ֑ק
  אֱ֝יָלוּתִ֗י לְעֶזְרָ֥תִי חֽוּשָׁה׃

  {21}הַצִּ֣ילָה מֵחֶ֣רֶב נַפְשִׁ֑י
  מִיַּד־כֶּ֝֗לֶב יְחִידָתִֽי׃

  {22}ה֭וֹשִׁיעֵנִי מִפִּ֣י אַרְיֵ֑ה
  וּמִקַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽנִי׃

  {23}אֲסַפְּרָ֣ה שִׁמְךָ֣ לְאֶחָ֑י
  בְּת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽךָּ׃
