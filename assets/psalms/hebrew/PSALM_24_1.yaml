title: Psaume 24-I
subtitle: null
commentary: null
biblicalReference: Ps 24(25), 1-14
shortReference: Ps 24
content: |-
  {1}אֵלֶ֥יךָ יְ֝הוָ֗ה נַפְשִׁ֥י אֶשָּֽׂא׃

  {2}אֱֽלֹהַ֗י בְּךָ֣ בָ֭טַחְתִּי אַל־אֵב֑וֹשָׁה
  אַל־יַֽעַלְצ֖וּ אֹיְבַ֣י לִֽי׃

  {3}גַּ֣ם כָּל־קֹ֭וֶיךָ לֹ֣א יֵבֹ֑שׁוּ
  יֵ֝בֹ֗שׁוּ הַבּוֹגְדִ֥ים רֵיקָֽם׃

  {4}דְּרָכֶ֣יךָ יְ֭הוָה הוֹדִיעֵ֑נִי
  אֹ֖רְחוֹתֶ֣יךָ לַמְּדֵֽנִי׃

  {5}הַדְרִ֘יכֵ֤נִי בַאֲמִתֶּ֨ךָ ׀ וְֽלַמְּדֵ֗נִי
  כִּֽי־אַ֭תָּה אֱלֹהֵ֣י יִשְׁעִ֑י
  אוֹתְךָ֥ קִ֝וִּ֗יתִי כָּל־הַיּֽוֹם׃

  {6}זְכֹר־רַחֲמֶ֣יךָ יְ֭הוָה וַחֲסָדֶ֑יךָ
  כִּ֖י מֵעוֹלָ֣ם הֵֽמָּה׃

  {7}חַטֹּ֤אות נְעוּרַ֨י ׀ וּפְשָׁעַ֗י
  אַל־תִּ֫זְכֹּ֥ר כְּחַסְדְּךָ֥ זְכָר־לִי־אַ֑תָּה
  לְמַ֖עַן טוּבְךָ֣ יְהוָֽה׃

  {8}טוֹב־וְיָשָׁ֥ר יְהוָ֑ה
  עַל־כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּדָּֽרֶךְ׃

  {9}יַדְרֵ֣ךְ עֲ֭נָוִים בַּמִּשְׁפָּ֑ט
  וִֽילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽוֹ׃

  {10}כָּל־אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶאֱמֶ֑ת
  לְנֹצְרֵ֥י בְ֝רִית֗וֹ וְעֵדֹתָֽיו׃

  {11}לְמַֽעַן־שִׁמְךָ֥ יְהוָ֑ה
  וְֽסָלַחְתָּ֥ לַ֝עֲוֺנִ֗י כִּ֣י רַב־הֽוּא׃

  {12}מִי־זֶ֣ה הָ֭אִישׁ יְרֵ֣א יְהוָ֑ה
  י֝וֹרֶ֗נּוּ בְּדֶ֣רֶךְ יִבְחָֽר׃

  {13}נַ֭פְשׁוֹ בְּט֣וֹב תָּלִ֑ין
  וְ֝זַרְע֗וֹ יִ֣ירַשׁ אָֽרֶץ׃

  {14}ס֣וֹד יְ֭הוָה לִירֵאָ֑יו
  וּ֝בְרִית֗וֹ לְהוֹדִיעָֽם׃
