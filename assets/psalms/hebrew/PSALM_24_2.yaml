title: Psaume 24-II
subtitle: null
commentary: null
biblicalReference: Ps 24(25), 15-22
shortReference: Ps 24
content: |-
  {15}עֵינַ֣י תָּ֭מִיד אֶל־יְהוָ֑ה
  כִּ֤י הֽוּא־יוֹצִ֖יא מֵרֶ֣שֶׁת רַגְלָֽי׃

  {16}פְּנֵה־אֵלַ֥י וְחָנֵּ֑נִי
  כִּֽי־יָחִ֖יד וְעָנִ֣י אָֽנִי׃

  {17}צָר֣וֹת לְבָבִ֣י הִרְחִ֑יבוּ
  מִ֝מְּצֽוּקוֹתַ֗י הוֹצִיאֵֽנִי׃

  {18}רְאֵ֣ה עָ֭נְיִי וַעֲמָלִ֑י
  וְ֝שָׂ֗א לְכָל־חַטֹּאותָֽי׃

  {19}רְאֵֽה־אוֹיְבַ֥י כִּי־רָ֑בּוּ
  וְשִׂנְאַ֖ת חָמָ֣ס שְׂנֵאֽוּנִי׃

  {20}שָׁמְרָ֣ה נַ֭פְשִׁי וְהַצִּילֵ֑נִי
  אַל־אֵ֝ב֗וֹשׁ כִּֽי־חָסִ֥יתִי בָֽךְ׃

  {21}תֹּם־וָיֹ֥שֶׁר יִצְּר֑וּנִי
  כִּ֝֗י קִוִּיתִֽיךָ׃

  {22}פְּדֵ֣ה אֱ֭לֹהִים אֶת־יִשְׂרָאֵ֑ל
  מִ֝כֹּ֗ל צָֽרוֹתָיו׃
