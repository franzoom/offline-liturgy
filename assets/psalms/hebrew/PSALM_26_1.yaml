title: Psaume 26-I
subtitle: null
commentary: null
biblicalReference: Ps 26(27), 1-6
shortReference: Ps 26
content: |-
  {1}׀ יְהוָ֤ה ׀ אוֹרִ֣י וְ֭יִשְׁעִי מִמִּ֣י אִירָ֑א
  יְהוָ֥ה מָֽעוֹז־חַ֝יַּ֗י מִמִּ֥י אֶפְחָֽד׃

  {2}בִּקְרֹ֤ב עָלַ֨י ׀ מְרֵעִים֮ לֶאֱכֹ֪ל אֶת־בְּשָׂ֫רִ֥י צָרַ֣י וְאֹיְבַ֣י לִ֑י
  הֵ֖מָּה כָשְׁל֣וּ וְנָפָֽלוּ׃

  {3}אִם־תַּחֲנֶ֬ה עָלַ֨י ׀ מַחֲנֶה֮ לֹֽא־יִירָ֪א לִ֫בִּ֥י אִם־תָּק֣וּם עָ֭לַי מִלְחָמָ֑ה
  בְּ֝זֹ֗את אֲנִ֣י בוֹטֵֽחַ׃

  {4}אַחַ֤ת ׀ שָׁאַ֣לְתִּי מֵֽאֵת־יְהוָה֮ אוֹתָ֪הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣י בְּבֵית־יְ֭הוָה כָּל־יְמֵ֣י חַיַּ֑י
  לַחֲז֥וֹת בְּנֹֽעַם־יְ֝הוָ֗ה
  וּלְבַקֵּ֥ר בְּהֵיכָלֽוֹ׃

  {5}כִּ֤י יִצְפְּנֵ֨נִי ׀ בְּסֻכֹּה֮ בְּי֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵנִי בְּסֵ֣תֶר אָהֳל֑וֹ
  בְּ֝צ֗וּר יְרוֹמְמֵֽנִי׃

  {6}וְעַתָּ֨ה יָר֪וּם רֹאשִׁ֡י עַ֤ל אֹֽיְבַ֬י סְֽבִיבוֹתַ֗י
  וְאֶזְבְּחָ֣ה בְ֭אָהֳלוֹ זִבְחֵ֣י תְרוּעָ֑ה
  אָשִׁ֥ירָה וַ֝אֲזַמְּרָ֗ה לַיהוָֽה׃
