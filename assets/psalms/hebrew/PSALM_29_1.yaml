title: Psaume 29_1
subtitle: null
commentary: null
biblicalReference: Ps 29(30), 2-6
shortReference: Ps 29
content: |-
  {2}אֲרוֹמִמְךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑נִי
  וְלֹא־שִׂמַּ֖חְתָּ אֹיְבַ֣י לִֽי׃

  {3}יְהוָ֥ה אֱלֹהָ֑י
  שִׁוַּ֥עְתִּי אֵ֝לֶ֗יךָ וַתִּרְפָּאֵֽנִי׃

  {4}יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן־שְׁא֣וֹל נַפְשִׁ֑י
  חִ֝יִּיתַ֗נִי מִיָּֽרְדִי־בֽוֹר׃

  {5}זַמְּר֣וּ לַיהוָ֣ה חֲסִידָ֑יו
  וְ֝הוֹד֗וּ לְזֵ֣כֶר קָדְשֽׁוֹ׃

  {6}כִּ֤י רֶ֨גַע ׀ בְּאַפּוֹ֮ חַיִּ֪ים בִּרְצ֫וֹנ֥וֹ בָּ֭עֶרֶב יָלִ֥ין בֶּ֗כִי וְלַבֹּ֥קֶר רִנָּֽה׃
