title: Psaume 29_2
subtitle: null
commentary: null
biblicalReference: Ps 29(30), 7-13
shortReference: Ps 29
content: |-
  {7}וַ֭אֲנִי אָמַ֣רְתִּי בְשַׁלְוִ֑י
  בַּל־אֶמּ֥וֹט לְעוֹלָֽם׃

  {8}יְֽהוָ֗ה בִּרְצוֹנְךָ֮ הֶעֱמַ֪דְתָּה לְֽהַרְרִ֫י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗יךָ הָיִ֥יתִי נִבְהָֽל׃

  {9}אֵלֶ֣יךָ יְהוָ֣ה אֶקְרָ֑א
  וְאֶל־אֲ֝דֹנָ֗י אֶתְחַנָּֽן׃

  {10}מַה־בֶּ֥צַע בְּדָמִי֮ בְּרִדְתִּ֪י אֶ֫ל־שָׁ֥חַת הֲיוֹדְךָ֥ עָפָ֑ר
  הֲיַגִּ֥יד אֲמִתֶּֽךָ׃

  {11}שְׁמַע־יְהוָ֥ה וְחָנֵּ֑נִי
  יְ֝הוָה הֱֽיֵה־עֹזֵ֥ר לִֽי׃

  {12}הָפַ֣כְתָּ מִסְפְּדִי֮ לְמָח֪וֹל לִ֥י פִּתַּ֥חְתָּ שַׂקִּ֑י
  וַֽתְּאַזְּרֵ֥נִי שִׂמְחָֽה׃

  {13}לְמַ֤עַן ׀ יְזַמֶּרְךָ֣ כָ֭בוֹד וְלֹ֣א יִדֹּ֑ם
  יְהוָ֥ה אֱ֝לֹהַ֗י לְעוֹלָ֥ם אוֹדֶֽךָּ׃
