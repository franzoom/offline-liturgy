title: Psaume 3
subtitle: null
commentary: null
biblicalReference: Ps 3, 2-9
shortReference: Ps 3
content: |-
  {2}יְ֭הוָה מָֽה־רַבּ֣וּ צָרָ֑י
  רַ֝בִּ֗ים קָמִ֥ים עָלָֽי׃

  {3}רַבִּים֮ אֹמְרִ֪ים לְנַ֫פְשִׁ֥י אֵ֤ין יְֽשׁוּעָ֓תָה לּ֬וֹ בֵֽאלֹהִ֬ים סֶֽלָה׃

  {4}וְאַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑י
  כְּ֝בוֹדִ֗י וּמֵרִ֥ים רֹאשִֽׁי׃

  {5}ק֭וֹלִי אֶל־יְהוָ֣ה אֶקְרָ֑א
  וַיַּֽעֲנֵ֨נִי מֵהַ֖ר קָדְשׁ֣וֹ סֶֽלָה׃

  {6}אֲנִ֥י שָׁכַ֗בְתִּי
  וָֽאִ֫ישָׁ֥נָה הֱקִיצ֑וֹתִי
  כִּ֖י יְהוָ֣ה יִסְמְכֵֽנִי׃

  {7}לֹֽא־אִ֭ירָא מֵרִבְב֥וֹת עָ֑ם
  אֲשֶׁ֥ר סָ֝בִ֗יב שָׁ֣תוּ עָלָֽי׃

  {8}ק֘וּמָ֤ה יְהוָ֨ה ׀ הוֹשִׁ֘יעֵ֤נִי אֱלֹהַ֗י
  כִּֽי־הִכִּ֣יתָ אֶת־כָּל־אֹיְבַ֣י לֶ֑חִי
  שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׃

  {9}לַיהוָ֥ה הַיְשׁוּעָ֑ה
  עַֽל־עַמְּךָ֖ בִרְכָתֶ֣ךָ סֶּֽלָה׃
