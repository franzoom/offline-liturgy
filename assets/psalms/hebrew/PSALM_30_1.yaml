title: Psaume 30-I
subtitle: null
commentary: null
biblicalReference: Ps 30(31), 2-9
shortReference: Ps 30
content: |-
  {2}בְּךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל־אֵב֣וֹשָׁה לְעוֹלָ֑ם
  בְּצִדְקָתְךָ֥ פַלְּטֵֽנִי׃

  {3}הַטֵּ֤ה אֵלַ֨י ׀ אָזְנְךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥נִי הֱיֵ֤ה לִ֨י ׀ לְֽצוּר־מָ֭עוֹז לְבֵ֥ית מְצוּד֗וֹת לְהוֹשִׁיעֵֽנִי׃

  {4}כִּֽי־סַלְעִ֣י וּמְצוּדָתִ֣י אָ֑תָּה
  וּלְמַ֥עַן שִׁ֝מְךָ֗
  תַּֽנְחֵ֥נִי וּֽתְנַהֲלֵֽנִי׃

  {5}תּוֹצִיאֵ֗נִי מֵרֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑י
  כִּֽי־אַ֝תָּה מָֽעוּזִּֽי׃

  {6}בְּיָדְךָ֮ אַפְקִ֪יד ר֫וּחִ֥י פָּדִ֖יתָה
  אוֹתִ֥י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃

  {7}שָׂנֵ֗אתִי הַשֹּׁמְרִ֥ים הַבְלֵי־שָׁ֑וְא
  וַ֝אֲנִ֗י אֶל־יְהוָ֥ה בָּטָֽחְתִּי׃

  {8}אָגִ֥ילָה וְאֶשְׂמְחָ֗ה
  בְּחַ֫סְדֶּ֥ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת־עָנְיִ֑י
  יָ֝דַ֗עְתָּ בְּצָר֥וֹת נַפְשִֽׁי׃

  {9}וְלֹ֣א הִ֭סְגַּרְתַּנִי בְּיַד־אוֹיֵ֑ב
  הֶֽעֱמַ֖דְתָּ בַמֶּרְחָ֣ב רַגְלָֽי׃
