title: Psaume 30_2
subtitle: null
commentary: null
biblicalReference: Ps 30(31), 10-19
shortReference: Ps 30
content: |-
  {10}חָנֵּ֥נִי יְהוָה֮ כִּ֤י צַ֫ר־לִ֥י עָשְׁשָׁ֖ה
  בְכַ֥עַס עֵינִ֗י נַפְשִׁ֥י וּבִטְנִֽי׃

  {11}כִּ֤י כָל֪וּ בְיָג֡וֹן
  חַיַּי֮ וּשְׁנוֹתַ֪י בַּאֲנָ֫חָ֥ה כָּשַׁ֣ל בַּעֲוֺנִ֣י כֹחִ֑י
  וַעֲצָמַ֥י עָשֵֽׁשׁוּ׃

  {12}מִכָּל־צֹרְרַ֨י הָיִ֪יתִי חֶרְפָּ֡ה
  וְלִשֲׁכֵנַ֨י ׀ מְאֹד֮ וּפַ֪חַד לִֽמְיֻדָּ֫עָ֥י רֹאַ֥י בַּח֑וּץ
  נָדְד֥וּ מִמֶּֽנִּי׃

  {13}נִ֭שְׁכַּחְתִּי כְּמֵ֣ת מִלֵּ֑ב
  הָ֝יִ֗יתִי כִּכְלִ֥י אֹבֵֽד׃

  {14}כִּ֤י שָׁמַ֨עְתִּי ׀ דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִסָּ֫בִ֥יב בְּהִוָּסְדָ֣ם יַ֣חַד עָלַ֑י
  לָקַ֖חַת נַפְשִׁ֣י זָמָֽמוּ׃

  {15}וַאֲנִ֤י ׀ עָלֶ֣יךָ בָטַ֣חְתִּי יְהוָ֑ה
  אָ֝מַ֗רְתִּי אֱלֹהַ֥י אָֽתָּה׃

  {16}בְּיָדְךָ֥ עִתֹּתָ֑י
  הַצִּ֘ילֵ֤נִי מִיַּד־א֝וֹיְבַ֗י
  וּמֵרֹדְפָֽי׃

  {17}הָאִ֣ירָה פָ֭נֶיךָ עַל־עַבְדֶּ֑ךָ
  ה֖וֹשִׁיעֵ֣נִי בְחַסְדֶּֽךָ׃

  {18}יְֽהוָ֗ה אַל־אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑יךָ
  יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִשְׁאֽוֹל׃

  [{19}תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַדֹּבְר֖וֹת
  עַל־צַדִּ֥יק עָתָ֗ק בְּגַאֲוָ֥ה וָבֽוּז׃]
