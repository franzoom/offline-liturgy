title: Psaume 30-III
subtitle: null
commentary: null
biblicalReference: Ps 30(31), 20-25
shortReference: Ps 30
content: |-
  {20}מָ֤ה רַֽב־טוּבְךָ֮ אֲשֶׁר־צָפַ֪נְתָּ לִּֽירֵ֫אֶ֥יךָ פָּ֭עַלְתָּ לַחֹסִ֣ים בָּ֑ךְ
  נֶ֝֗גֶד בְּנֵ֣י אָדָם׃

  {21}תַּסְתִּירֵ֤ם ׀ בְּסֵ֥תֶר פָּנֶיךָ֮ מֵֽרֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥ם בְּסֻכָּ֗ה מֵרִ֥יב לְשֹׁנֽוֹת׃

  {22}בָּר֥וּךְ יְהוָ֑ה
  כִּ֥י הִפְלִ֘יא חַסְדּ֥וֹ לִ֝֗י
  בְּעִ֣יר מָצֽוֹר׃

  {23}וַאֲנִ֤י ׀ אָ֘מַ֤רְתִּי בְחָפְזִ֗י נִגְרַזְתִּי֮ מִנֶּ֪גֶד עֵ֫ינֶ֥יךָ אָכֵ֗ן
  שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗י בְּשַׁוְּעִ֥י אֵלֶֽיךָ׃

  {24}אֶֽהֱב֥וּ אֶת־יְהוָ֗ה
  כָּֽל־חֲסִ֫ידָ֥יו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה
  וּמְשַׁלֵּ֥ם עַל־יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה׃

  {25}חִ֭זְקוּ וְיַאֲמֵ֣ץ לְבַבְכֶ֑ם
  כָּל־הַ֝מְיַחֲלִ֗ים לַיהוָֽה׃
