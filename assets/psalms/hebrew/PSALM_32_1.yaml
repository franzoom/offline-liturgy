title: Psaume 32_1
subtitle: null
commentary: null
biblicalReference: Ps 32(33), 1-11
shortReference: Ps 32
content: |-
  {1}רַנְּנ֣וּ צַ֭דִּיקִים בַּֽיהוָ֑ה
  לַ֝יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃

  {2}הוֹד֣וּ לַיהוָ֣ה בְּכִנּ֑וֹר
  בְּנֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ־לֽוֹ׃

  {3}שִֽׁירוּ־ל֭וֹ שִׁ֣יר חָדָ֑שׁ
  הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּתְרוּעָֽה׃

  {4}כִּֽי־יָשָׁ֥ר דְּבַר־יְהוָ֑ה
  וְכָל־מַ֝עֲשֵׂ֗הוּ בֶּאֱמוּנָֽה׃

  {5}אֹ֭הֵב צְדָקָ֣ה וּמִשְׁפָּ֑ט
  חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָאָֽרֶץ׃

  {6}בִּדְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ
  וּבְר֥וּחַ פִּ֝֗יו כָּל־צְבָאָֽם׃

  {7}כֹּנֵ֣ס כַּ֭נֵּד מֵ֣י הַיָּ֑ם
  נֹתֵ֖ן בְּאֹצָר֣וֹת תְּהוֹמֽוֹת׃

  {8}יִֽירְא֣וּ מֵ֭יְהוָה כָּל־הָאָ֑רֶץ
  מִמֶּ֥נּוּ יָ֝ג֗וּרוּ כָּל־יֹשְׁבֵ֥י תֵבֵֽל׃

  {9}כִּ֤י ה֣וּא אָמַ֣ר וַיֶּ֑הִי
  הֽוּא־צִ֝וָּ֗ה וַֽיַּעֲמֹֽד׃

  {10}יְֽהוָ֗ה הֵפִ֥יר עֲצַת־גּוֹיִ֑ם
  הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים׃

  {11}עֲצַ֣ת יְ֭הוָה לְעוֹלָ֣ם תַּעֲמֹ֑ד
  מַחְשְׁב֥וֹת לִ֝בּ֗וֹ לְדֹ֣ר וָדֹֽר׃
