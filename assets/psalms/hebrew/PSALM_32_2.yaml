title: Psaume 32-II
subtitle: null
commentary: null
biblicalReference: Ps 32(33), 12-22
shortReference: Ps 32
content: |-
  {12}אַשְׁרֵ֣י הַ֭גּוֹי אֲשֶׁר־יְהוָ֣ה אֱלֹהָ֑יו
  הָעָ֓ם ׀ בָּחַ֖ר לְנַחֲלָ֣ה לֽוֹ׃

  {13}מִ֭שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה
  רָ֝אָ֗ה אֶֽת־כָּל־בְּנֵ֥י הָאָדָֽם׃

  {14}מִֽמְּכוֹן־שִׁבְתּ֥וֹ הִשְׁגִּ֑יחַ
  אֶ֖ל כָּל־יֹשְׁבֵ֣י הָאָֽרֶץ׃

  {15}הַיֹּצֵ֣ר יַ֣חַד לִבָּ֑ם
  הַ֝מֵּבִ֗ין אֶל־כָּל־מַעֲשֵׂיהֶֽם׃

  {16}אֵֽין־הַ֭מֶּלֶךְ נוֹשָׁ֣ע בְּרָב־חָ֑יִל
  גִּ֝בּ֗וֹר לֹֽא־יִנָּצֵ֥ל בְּרָב־כֹּֽחַ׃

  {17}שֶׁ֣קֶר הַ֭סּוּס לִתְשׁוּעָ֑ה
  וּבְרֹ֥ב חֵ֝יל֗וֹ לֹ֣א יְמַלֵּֽט׃

  {18}הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל־יְרֵאָ֑יו
  לַֽמְיַחֲלִ֥ים לְחַסְדּֽוֹ׃

  {19}לְהַצִּ֣יל מִמָּ֣וֶת נַפְשָׁ֑ם
  וּ֝לְחַיּוֹתָ֗ם בָּרָעָֽב׃

  {20}נַ֭פְשֵׁנוּ חִכְּתָ֣ה לַֽיהוָ֑ה
  עֶזְרֵ֖נוּ וּמָגִנֵּ֣נוּ הֽוּא׃

  {21}כִּי־ב֭וֹ יִשְׂמַ֣ח לִבֵּ֑נוּ
  כִּ֤י בְשֵׁ֖ם קָדְשׁ֣וֹ בָטָֽחְנוּ׃

  {22}יְהִֽי־חַסְדְּךָ֣ יְהוָ֣ה עָלֵ֑ינוּ
  כַּ֝אֲשֶׁ֗ר יִחַ֥לְנוּ לָֽךְ׃
