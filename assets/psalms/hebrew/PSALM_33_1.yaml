title: Psaume 33-I
subtitle: null
commentary: null
biblicalReference: Ps 33(34), 2-11
shortReference: Ps 33
content: |-
  {2}אֲבָרֲכָ֣ה אֶת־יְהוָ֣ה בְּכָל־עֵ֑ת
  תָּ֝מִ֗יד תְּֽהִלָּת֥וֹ בְּפִֽי׃

  {3}בַּ֭יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑י
  יִשְׁמְע֖וּ עֲנָוִ֣ים וְיִשְׂמָֽחוּ׃

  {4}גַּדְּל֣וּ לַיהוָ֣ה אִתִּ֑י
  וּנְרוֹמְמָ֖ה שְׁמ֣וֹ יַחְדָּֽו׃

  {5}דָּרַ֣שְׁתִּי אֶת־יְהוָ֣ה וְעָנָ֑נִי
  וּמִכָּל־מְ֝גוּרוֹתַ֗י הִצִּילָֽנִי׃

  {6}הִבִּ֣יטוּ אֵלָ֣יו וְנָהָ֑רוּ
  וּ֝פְנֵיהֶ֗ם אַל־יֶחְפָּֽרוּ׃

  {7}זֶ֤ה עָנִ֣י קָ֭רָא וַיהוָ֣ה שָׁמֵ֑עַ
  וּמִכָּל־צָ֝רוֹתָ֗יו הוֹשִׁיעֽוֹ׃

  {8}חֹנֶ֤ה מַלְאַךְ־יְהוָ֓ה סָ֘בִ֤יב לִֽירֵאָ֗יו
  וַֽיְחַלְּצֵֽם׃

  {9}טַעֲמ֣וּ וּ֭רְאוּ כִּי־ט֣וֹב יְהוָ֑ה
  אַֽשְׁרֵ֥י הַ֝גֶּ֗בֶר יֶחֱסֶה־בּֽוֹ׃

  {10}יְר֣אוּ אֶת־יְהוָ֣ה קְדֹשָׁ֑יו
  כִּי־אֵ֥ין מַ֝חְס֗וֹר לִירֵאָֽיו׃

  {11}כְּ֭פִירִים רָשׁ֣וּ וְרָעֵ֑בוּ
  וְדֹרְשֵׁ֥י יְ֝הוָ֗ה
  לֹא־יַחְסְר֥וּ כָל־טֽוֹב׃
