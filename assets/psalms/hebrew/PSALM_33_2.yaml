title: Psaume 33-II
subtitle: null
commentary: null
biblicalReference: Ps 33(34), 12-23
shortReference: Ps 33
content: |-
  {12}לְֽכוּ־בָ֭נִים שִׁמְעוּ־לִ֑י
  יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְכֶֽם׃

  {13}מִֽי־הָ֭אִישׁ הֶחָפֵ֣ץ חַיִּ֑ים
  אֹהֵ֥ב יָ֝מִ֗ים לִרְא֥וֹת טֽוֹב׃

  {14}נְצֹ֣ר לְשׁוֹנְךָ֣ מֵרָ֑ע
  וּ֝שְׂפָתֶ֗יךָ מִדַּבֵּ֥ר מִרְמָֽה׃

  {15}ס֣וּר מֵ֭רָע וַעֲשֵׂה־ט֑וֹב
  בַּקֵּ֖שׁ שָׁל֣וֹם וְרָדְפֵֽהוּ׃

  {16}עֵינֵ֣י יְ֭הוָה אֶל־צַדִּיקִ֑ים
  וְ֝אָזְנָ֗יו אֶל־שַׁוְעָתָֽם׃

  {17}פְּנֵ֣י יְ֭הוָה בְּעֹ֣שֵׂי רָ֑ע
  לְהַכְרִ֖ית מֵאֶ֣רֶץ זִכְרָֽם׃

  {18}צָעֲק֣וּ וַיהוָ֣ה שָׁמֵ֑עַ
  וּמִכָּל־צָ֝רוֹתָ֗ם הִצִּילָֽם׃

  {19}קָר֣וֹב יְ֭הוָה לְנִשְׁבְּרֵי־לֵ֑ב
  וְֽאֶת־דַּכְּאֵי־ר֥וּחַ יוֹשִֽׁיעַ׃

  {20}רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק
  וּ֝מִכֻּלָּ֗ם יַצִּילֶ֥נּוּ יְהוָֽה׃

  {21}שֹׁמֵ֥ר כָּל־עַצְמוֹתָ֑יו
  אַחַ֥ת מֵ֝הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה׃

  {22}תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה
  וְשֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃

  {23}פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑יו
  וְלֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל־הַחֹסִ֥ים בּֽוֹ׃
