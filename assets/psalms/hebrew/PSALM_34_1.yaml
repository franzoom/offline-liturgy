title: Psaume 34_1
subtitle: null
commentary: null
biblicalReference: Ps 34(35), 1-10
shortReference: Ps 34
content: |-
  {1}׀ רִיבָ֣ה יְ֭הוָה אֶת־יְרִיבַ֑י
  לְ֝חַ֗ם אֶת־לֹֽחֲמָֽי׃

  {2}הַחֲזֵ֣ק מָגֵ֣ן וְצִנָּ֑ה
  וְ֝ק֗וּמָה בְּעֶזְרָתִֽי׃

  [{3}וְהָ֘רֵ֤ק חֲנִ֣ית וּ֭סְגֹר לִקְרַ֣את רֹדְפָ֑י
  אֱמֹ֥ר לְ֝נַפְשִׁ֗י יְֽשֻׁעָתֵ֥ךְ אָֽנִי׃

  {4}יֵבֹ֣שׁוּ וְיִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥י יִסֹּ֣גוּ אָח֣וֹר וְיַחְפְּר֑וּ
  חֹ֝שְׁבֵ֗י רָעָתִֽי׃

  {5}יִֽהְי֗וּ כְּמֹ֥ץ לִפְנֵי־ר֑וּחַ
  וּמַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה׃

  {6}יְֽהִי־דַרְכָּ֗ם חֹ֥שֶׁךְ וַחֲלַקְלַקּ֑וֹת
  וּמַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽם׃

  {7}כִּֽי־חִנָּ֣ם טָֽמְנוּ־לִ֭י שַׁ֣חַת רִשְׁתָּ֑ם
  חִ֝נָּ֗ם חָפְר֥וּ לְנַפְשִֽׁי׃

  {8}תְּבוֹאֵ֣הוּ שׁוֹאָה֮ לֹֽא־יֵ֫דָ֥ע וְרִשְׁתּ֣וֹ אֲשֶׁר־טָמַ֣ן תִּלְכְּד֑וֹ
  בְּ֝שׁוֹאָ֗ה יִפָּל־בָּֽהּ׃]

  {9}וְ֭נַפְשִׁי תָּגִ֣יל בַּיהוָ֑ה
  תָּ֝שִׂישׂ בִּישׁוּעָתֽוֹ׃

  {10}כָּ֥ל עַצְמוֹתַ֨י ׀ תֹּאמַרְנָה֮ יְהוָ֗ה
  מִ֥י כָ֫מ֥וֹךָ מַצִּ֣יל עָ֭נִי מֵחָזָ֣ק מִמֶּ֑נּוּ
  וְעָנִ֥י וְ֝אֶבְי֗וֹן מִגֹּזְלֽוֹ׃
