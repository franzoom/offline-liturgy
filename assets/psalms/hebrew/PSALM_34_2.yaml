title: Psaume 34-II
subtitle: null
commentary: null
biblicalReference: Ps 34(35), 11-16
shortReference: Ps 34
content: |-
  {11}יְ֭קוּמוּן עֵדֵ֣י חָמָ֑ס
  אֲשֶׁ֥ר לֹא־יָ֝דַ֗עְתִּי יִשְׁאָלֽוּנִי׃

  {12}יְשַׁלְּמ֣וּנִי רָ֭עָה תַּ֥חַת טוֹבָ֗ה
  שְׁכ֣וֹל לְנַפְשִֽׁי׃

  {13}וַאֲנִ֤י ׀ בַּחֲלוֹתָ֡ם לְב֬וּשִׁי שָׂ֗ק
  עִנֵּ֣יתִי בַצּ֣וֹם נַפְשִׁ֑י
  וּ֝תְפִלָּתִ֗י עַל־חֵיקִ֥י תָשֽׁוּב׃

  {14}כְּרֵֽעַ־כְּאָ֣ח לִ֭י הִתְהַלָּ֑כְתִּי
  כַּאֲבֶל־אֵ֝֗ם קֹדֵ֥ר שַׁחֽוֹתִי׃

  {15}וּבְצַלְעִי֮ שָׂמְח֪וּ וְֽנֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣י נֵ֭כִים וְלֹ֣א יָדַ֑עְתִּי
  קָֽרְע֥וּ וְלֹא־דָֽמּוּ׃

  {16}בְּ֭חַנְפֵי לַעֲגֵ֣י מָע֑וֹג
  חָרֹ֖ק עָלַ֣י שִׁנֵּֽימוֹ׃
