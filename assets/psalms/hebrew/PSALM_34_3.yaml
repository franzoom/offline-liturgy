title: Psaume 34-III
subtitle: null
commentary: null
biblicalReference: Ps 34(35), 17-28
shortReference: Ps 34
content: |-
  {17}אֲדֹנָי֮ כַּמָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָה נַ֭פְשִׁי מִשֹּׁאֵיהֶ֑ם
  מִ֝כְּפִירִ֗ים יְחִידָתִֽי׃

  {18}א֭וֹדְךָ בְּקָהָ֣ל רָ֑ב
  בְּעַ֖ם עָצ֣וּם אֲהַֽלְלֶֽךָּ׃

  {19}אַֽל־יִשְׂמְחוּ־לִ֣י אֹיְבַ֣י שֶׁ֑קֶר
  שֹׂנְאַ֥י חִ֝נָּ֗ם יִקְרְצוּ־עָֽיִן׃

  [{20}כִּ֤י לֹ֥א שָׁל֗וֹם
  יְדַ֫בֵּ֥רוּ וְעַ֥ל רִגְעֵי־אֶ֑רֶץ
  דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּן׃

  {21}וַיַּרְחִ֥יבוּ עָלַ֗י
  פִּ֫יהֶ֥ם אָ֭מְרוּ הֶאָ֣ח ׀ הֶאָ֑ח
  רָאֲתָ֥ה עֵינֵֽינוּ׃]

  {22}רָאִ֣יתָה יְ֭הוָה אַֽל־תֶּחֱרַ֑שׁ
  אֲ֝דֹנָ֗י אֲל־תִּרְחַ֥ק מִמֶּֽנִּי׃

  {23}הָעִ֣ירָה וְ֭הָקִיצָה לְמִשְׁפָּטִ֑י
  אֱלֹהַ֖י וַֽאדֹנָ֣י לְרִיבִֽי׃

  [{24}שָׁפְטֵ֣נִי כְ֭צִדְקְךָ יְהוָ֥ה אֱלֹהָ֗י
  וְאַל־יִשְׂמְחוּ־לִֽי׃

  {25}אַל־יֹאמְר֣וּ בְ֭לִבָּם הֶאָ֣ח נַפְשֵׁ֑נוּ
  אַל־יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּהוּ׃

  {26}יֵ֘בֹ֤שׁוּ וְיַחְפְּר֨וּ ׀ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥י יִֽלְבְּשׁוּ־בֹ֥שֶׁת וּכְלִמָּ֑ה
  הַֽמַּגְדִּילִ֥ים עָלָֽי׃]

  {27}יָרֹ֣נּוּ וְיִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥י וְיֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה
  הֶ֝חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽוֹ׃

  {28}וּ֭לְשׁוֹנִי תֶּהְגֶּ֣ה צִדְקֶ֑ךָ
  כָּל־הַ֝יּוֹם תְּהִלָּתֶֽךָ׃
