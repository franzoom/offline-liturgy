title: Psaume 36-I
subtitle: null
commentary: null
biblicalReference: Ps 36(37), 1-11
shortReference: Ps 36
content: |-
  {1}׀ אַל־תִּתְחַ֥ר בַּמְּרֵעִ֑ים
  אַל־תְּ֝קַנֵּ֗א בְּעֹשֵׂ֥י עַוְלָֽה׃

  {2}כִּ֣י כֶ֭חָצִיר מְהֵרָ֣ה יִמָּ֑לוּ
  וּכְיֶ֥רֶק דֶּ֝֗שֶׁא יִבּוֹלֽוּן׃

  {3}בְּטַ֣ח בַּֽ֭יהוָה וַעֲשֵׂה־ט֑וֹב
  שְׁכָן־אֶ֝֗רֶץ וּרְעֵ֥ה אֱמוּנָֽה׃

  {4}וְהִתְעַנַּ֥ג עַל־יְהוָ֑ה
  וְיִֽתֶּן־לְ֝ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽךָ׃

  {5}גּ֣וֹל עַל־יְהוָ֣ה דַּרְכֶּ֑ךָ
  וּבְטַ֥ח עָ֝לָ֗יו וְה֣וּא יַעֲשֶֽׂה׃

  {6}וְהוֹצִ֣יא כָא֣וֹר צִדְקֶ֑ךָ
  וּ֝מִשְׁפָּטֶ֗ךָ כַּֽצָּהֳרָֽיִם׃

  {7}דּ֤וֹם ׀ לַיהוָה֮ וְהִתְח֪וֹלֵ֫ל ל֥וֹ אַל־תִּ֭תְחַר בְּמַצְלִ֣יחַ דַּרְכּ֑וֹ
  בְּ֝אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׃

  {8}הֶ֣רֶף מֵ֭אַף וַעֲזֹ֣ב חֵמָ֑ה
  אַל־תִּ֝תְחַ֗ר אַךְ־לְהָרֵֽעַ׃

  {9}כִּֽי־מְ֭רֵעִים יִכָּרֵת֑וּן
  וְקֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ־אָֽרֶץ׃

  {10}וְע֣וֹד מְ֭עַט וְאֵ֣ין רָשָׁ֑ע
  וְהִתְבּוֹנַ֖נְתָּ
  עַל־מְקוֹמ֣וֹ וְאֵינֶֽנּוּ׃

  {11}וַעֲנָוִ֥ים יִֽירְשׁוּ־אָ֑רֶץ
  וְ֝הִתְעַנְּג֗וּ עַל־רֹ֥ב שָׁלֽוֹם׃
