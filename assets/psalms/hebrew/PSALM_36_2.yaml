title: Psaume 36_2
subtitle: null
commentary: null
biblicalReference: Ps 36(37), 12-29
shortReference: Ps 36
content: |-
  {12}זֹמֵ֣ם רָ֭שָׁע לַצַּדִּ֑יק
  וְחֹרֵ֖ק עָלָ֣יו שִׁנָּֽיו׃

  {13}אֲדֹנָ֥י יִשְׂחַק־ל֑וֹ
  כִּֽי־רָ֝אָ֗ה כִּֽי־יָבֹ֥א יוֹמֽוֹ׃

  {14}חֶ֤רֶב ׀ פָּֽתְח֣וּ רְשָׁעִים֮ וְדָרְכ֪וּ קַ֫שְׁתָּ֥ם לְ֭הַפִּיל עָנִ֣י וְאֶבְי֑וֹן
  לִ֝טְב֗וֹחַ יִשְׁרֵי־דָֽרֶךְ׃

  {15}חַ֭רְבָּם תָּב֣וֹא בְלִבָּ֑ם
  וְ֝קַשְּׁתוֹתָ֗ם תִּשָּׁבַֽרְנָה׃

  {16}טוֹב־מְ֭עַט לַצַּדִּ֑יק
  מֵ֝הֲמ֗וֹן רְשָׁעִ֥ים רַבִּֽים׃

  {17}כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה
  וְסוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃

  {18}יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם
  וְ֝נַחֲלָתָ֗ם לְעוֹלָ֥ם תִּהְיֶֽה׃

  {19}לֹֽא־יֵ֭בֹשׁוּ בְּעֵ֣ת רָעָ֑ה
  וּבִימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ׃

  {20}כִּ֤י רְשָׁעִ֨ים ׀ יֹאבֵ֗דוּ
  וְאֹיְבֵ֣י יְ֭הוָה כִּיקַ֣ר כָּרִ֑ים
  כָּל֖וּ בֶעָשָׁ֣ן כָּֽלוּ׃

  {21}לֹוֶ֣ה רָ֭שָׁע וְלֹ֣א יְשַׁלֵּ֑ם
  וְ֝צַדִּ֗יק חוֹנֵ֥ן וְנוֹתֵֽן׃

  {22}כִּ֣י מְ֭בֹרָכָיו יִ֣ירְשׁוּ אָ֑רֶץ
  וּ֝מְקֻלָּלָ֗יו יִכָּרֵֽתוּ׃

  {23}מֵ֭יְהוָה מִֽצְעֲדֵי־גֶ֥בֶר כּוֹנָ֗נוּ
  וְדַרְכּ֥וֹ יֶחְפָּֽץ׃

  {24}כִּֽי־יִפֹּ֥ל לֹֽא־יוּטָ֑ל
  כִּֽי־יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽוֹ׃

  {25}נַ֤עַר ׀ הָיִ֗יתִי גַּם־זָ֫קַ֥נְתִּי וְֽלֹא־רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב
  וְ֝זַרְע֗וֹ מְבַקֶּשׁ־לָֽחֶם׃

  {26}כָּל־הַ֭יּוֹם חוֹנֵ֣ן וּמַלְוֶ֑ה
  וְ֝זַרְע֗וֹ לִבְרָכָֽה׃

  {27}ס֣וּר מֵ֭רָע וַעֲשֵׂה־ט֗וֹב
  וּשְׁכֹ֥ן לְעוֹלָֽם׃

  {28}כִּ֤י יְהוָ֨ה ׀ אֹ֘הֵ֤ב מִשְׁפָּ֗ט
  וְלֹא־יַעֲזֹ֣ב אֶת־חֲ֭סִידָיו לְעוֹלָ֣ם נִשְׁמָ֑רוּ
  וְזֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׃

  {29}צַדִּיקִ֥ים יִֽירְשׁוּ־אָ֑רֶץ
  וְיִשְׁכְּנ֖וּ לָעַ֣ד עָלֶֽיהָ׃
