title: Psaume 36-III
subtitle: null
commentary: null
biblicalReference: Ps 36(37), 30-40
shortReference: Ps 36
content: |-
  {30}פִּֽי־צַ֭דִּיק יֶהְגֶּ֣ה חָכְמָ֑ה
  וּ֝לְשׁוֹנ֗וֹ תְּדַבֵּ֥ר מִשְׁפָּֽט׃

  {31}תּוֹרַ֣ת אֱלֹהָ֣יו בְּלִבּ֑וֹ
  לֹ֖א תִמְעַ֣ד אֲשֻׁרָיו׃

  {32}צוֹפֶ֣ה רָ֭שָׁע לַצַּדִּ֑יק
  וּ֝מְבַקֵּ֗שׁ לַהֲמִיתוֹ׃

  {33}יְ֭הוָה לֹא־יַעַזְבֶ֣נּוּ בְיָד֑וֹ
  וְלֹ֥א יַ֝רְשִׁיעֶ֗נּוּ בְּהִשָּׁפְטֽוֹ׃

  {34}קַוֵּ֤ה אֶל־יְהוָ֨ה ׀ וּשְׁמֹ֬ר דַּרְכּ֗וֹ
  וִֽ֭ירוֹמִמְךָ לָרֶ֣שֶׁת אָ֑רֶץ
  בְּהִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה׃

  {35}רָ֭אִיתִי רָשָׁ֣ע עָרִ֑יץ
  וּ֝מִתְעָרֶ֗ה כְּאֶזְרָ֥ח רַעֲנָֽן׃

  {36}וַ֭יַּֽעֲבֹר וְהִנֵּ֣ה אֵינֶ֑נּוּ
  וָֽ֝אֲבַקְשֵׁ֗הוּ וְלֹ֣א נִמְצָֽא׃

  {37}שְׁמָר־תָּ֭ם וּרְאֵ֣ה יָשָׁ֑ר
  כִּֽי־אַחֲרִ֖ית לְאִ֣ישׁ שָׁלֽוֹם׃

  {38}וּֽ֭פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו
  אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃

  {39}וּתְשׁוּעַ֣ת צַ֭דִּיקִים מֵיְהוָ֑ה
  מָֽ֝עוּזָּ֗ם בְּעֵ֣ת צָרָֽה׃

  {40}וַֽיַּעְזְרֵ֥ם יְהוָ֗ה
  וַֽיְפַ֫לְּטֵ֥ם יְפַלְּטֵ֣ם מֵ֭רְשָׁעִים וְיוֹשִׁיעֵ֑ם
  כִּי־חָ֥סוּ בֽוֹ׃
