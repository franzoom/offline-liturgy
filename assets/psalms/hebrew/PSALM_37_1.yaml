title: Psaume 37-I
subtitle: null
commentary: null
biblicalReference: Ps 37(38), 2-8
shortReference: Ps 37
content: |-
  {2}יְֽהוָ֗ה אַל־בְּקֶצְפְּךָ֥ תוֹכִיחֵ֑נִי
  וּֽבַחֲמָתְךָ֥ תְיַסְּרֵֽנִי׃

  {3}כִּֽי־חִ֭צֶּיךָ נִ֣חֲתוּ בִ֑י
  וַתִּנְחַ֖ת עָלַ֣י יָדֶֽךָ׃

  {4}אֵין־מְתֹ֣ם בִּ֭בְשָׂרִי מִפְּנֵ֣י זַעְמֶ֑ךָ
  אֵין־שָׁל֥וֹם בַּ֝עֲצָמַ֗י
  מִפְּנֵ֥י חַטָּאתִֽי׃

  {5}כִּ֣י עֲ֭וֺנֹתַי עָבְר֣וּ רֹאשִׁ֑י
  כְּמַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽנִּי׃

  {6}הִבְאִ֣ישׁוּ נָ֭מַקּוּ חַבּוּרֹתָ֑י
  מִ֝פְּנֵ֗י אִוַּלְתִּֽי׃

  {7}נַעֲוֵ֣יתִי שַׁחֹ֣תִי עַד־מְאֹ֑ד
  כָּל־הַ֝יּ֗וֹם קֹדֵ֥ר הִלָּֽכְתִּי׃

  {8}כִּֽי־כְ֭סָלַי מָלְא֣וּ נִקְלֶ֑ה
  וְאֵ֥ין מְ֝תֹ֗ם בִּבְשָׂרִֽי׃
