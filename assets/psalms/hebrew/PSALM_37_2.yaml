title: Psaume 37_2
subtitle: null
commentary: null
biblicalReference: Ps 37(38), 9-13
shortReference: Ps 37
content: |-
  {9}נְפוּג֣וֹתִי וְנִדְכֵּ֣יתִי עַד־מְאֹ֑ד
  שָׁ֝אַ֗גְתִּי מִֽנַּהֲמַ֥ת לִבִּֽי׃

  {10}אֲֽדֹנָי נֶגְדְּךָ֥ כָל־תַּאֲוָתִ֑י
  וְ֝אַנְחָתִ֗י מִמְּךָ֥ לֹא־נִסְתָּֽרָה׃

  {11}לִבִּ֣י סְ֭חַרְחַר עֲזָבַ֣נִי כֹחִ֑י
  וְֽאוֹר־עֵינַ֥י גַּם־הֵ֝֗ם אֵ֣ין אִתִּֽי׃

  {12}אֹֽהֲבַ֨י ׀ וְרֵעַ֗י
  מִנֶּ֣גֶד נִגְעִ֣י יַעֲמֹ֑דוּ
  וּ֝קְרוֹבַ֗י מֵרָחֹ֥ק עָמָֽדוּ׃

  {13}וַיְנַקְשׁ֤וּ ׀ מְבַקְשֵׁ֬י נַפְשִׁ֗י
  וְדֹרְשֵׁ֣י רָ֭עָתִי דִּבְּר֣וּ הַוּ֑וֹת
  וּ֝מִרְמ֗וֹת כָּל־הַיּ֥וֹם יֶהְגּֽוּ׃
