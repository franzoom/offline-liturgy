title: Psaume 37_3
subtitle: null
commentary: null
biblicalReference: Ps 37(38), 14-23
shortReference: Ps 37
content: |-
  {14}וַאֲנִ֣י כְ֭חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע
  וּ֝כְאִלֵּ֗ם לֹ֣א יִפְתַּח־פִּֽיו׃

  {15}וָאֱהִ֗י כְּ֭אִישׁ אֲשֶׁ֣ר לֹא־שֹׁמֵ֑עַ
  וְאֵ֥ין בְּ֝פִ֗יו תּוֹכָחֽוֹת׃

  {16}כִּֽי־לְךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי
  אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥י אֱלֹהָֽי׃

  {17}כִּֽי־אָ֭מַרְתִּי פֶּן־יִשְׂמְחוּ־לִ֑י
  בְּמ֥וֹט רַ֝גְלִ֗י עָלַ֥י הִגְדִּֽילוּ׃

  {18}כִּֽי־אֲ֭נִי לְצֶ֣לַע נָכ֑וֹן
  וּמַכְאוֹבִ֖י נֶגְדִּ֣י תָמִֽיד׃

  {19}כִּֽי־עֲוֺנִ֥י אַגִּ֑יד
  אֶ֝דְאַ֗ג מֵֽחַטָּאתִֽי׃

  {20}וְֽ֭אֹיְבַי חַיִּ֣ים עָצֵ֑מוּ
  וְרַבּ֖וּ שֹׂנְאַ֣י שָֽׁקֶר׃

  {21}וּמְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה
  יִ֝שְׂטְנ֗וּנִי תַּ֣חַת רָֽדְפִי־טֽוֹב׃

  {22}אַל־תַּֽעַזְבֵ֥נִי יְהוָ֑ה
  אֱ֝לֹהַ֗י אַל־תִּרְחַ֥ק מִמֶּֽנִּי׃

  {23}ח֥וּשָׁה לְעֶזְרָתִ֑י
  אֲ֝דֹנָ֗י תְּשׁוּעָתִֽי׃
