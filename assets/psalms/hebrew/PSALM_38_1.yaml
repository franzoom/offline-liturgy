title: Psaume 38_1
subtitle: null
commentary: null
biblicalReference: Ps 38(39), 2-7
shortReference: Ps 38
content: |-
  {2}אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַי֮ מֵחֲט֪וֹא בִלְשׁ֫וֹנִ֥י אֶשְׁמְרָ֥ה לְפִ֥י מַחְס֑וֹם
  בְּעֹ֖ד רָשָׁ֣ע לְנֶגְדִּֽי׃

  {3}נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִטּ֑וֹב
  וּכְאֵבִ֥י נֶעְכָּֽר׃

  {4}חַם־לִבִּ֨י ׀ בְּקִרְבִּ֗י
  בַּהֲגִיגִ֥י תִבְעַר־אֵ֑שׁ
  דִּ֝בַּ֗רְתִּי בִּלְשֽׁוֹנִי׃

  {5}הוֹדִ֘יעֵ֤נִי יְהוָ֨ה ׀ קִצִּ֗י
  וּמִדַּ֣ת יָמַ֣י מַה־הִ֑יא
  אֵ֝דְעָ֗ה מֶה־חָדֵ֥ל אָֽנִי׃

  {6}הִנֵּ֤ה טְפָח֨וֹת ׀ נָ֘תַ֤תָּה יָמַ֗י
  וְחֶלְדִּ֣י כְאַ֣יִן נֶגְדֶּ֑ךָ
  אַ֥ךְ כָּֽל־הֶ֥בֶל כָּל־אָ֝דָ֗ם
  נִצָּ֥ב סֶֽלָה׃

  {7}אַךְ־בְּצֶ֤לֶם ׀ יִֽתְהַלֶּךְ־אִ֗ישׁ
  אַךְ־הֶ֥בֶל יֶהֱמָי֑וּן
  יִ֝צְבֹּ֗ר וְֽלֹא־יֵדַ֥ע מִי־אֹסְפָֽם׃
