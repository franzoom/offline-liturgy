title: Psaume 38-II
subtitle: null
commentary: null
biblicalReference: Ps 38(39), 8-14
shortReference: Ps 38
content: |-
  {8}וְעַתָּ֣ה מַה־קִּוִּ֣יתִי אֲדֹנָ֑י
  תּ֝וֹחַלְתִּ֗י לְךָ֣ הִֽיא׃

  {9}מִכָּל־פְּשָׁעַ֥י הַצִּילֵ֑נִי
  חֶרְפַּ֥ת נָ֝בָ֗ל אַל־תְּשִׂימֵֽנִי׃

  {10}נֶ֭אֱלַמְתִּי לֹ֣א אֶפְתַּח־פִּ֑י
  כִּ֖י אַתָּ֣ה עָשִֽׂיתָ׃

  {11}הָסֵ֣ר מֵעָלַ֣י נִגְעֶ֑ךָ
  מִתִּגְרַ֥ת יָ֝דְךָ֗ אֲנִ֣י כָלִֽיתִי׃

  {12}בְּֽתוֹכָ֘ח֤וֹת עַל־עָוֺ֨ן ׀ יִסַּ֬רְתָּ אִ֗ישׁ
  וַתֶּ֣מֶס כָּעָ֣שׁ חֲמוּד֑וֹ
  אַ֤ךְ הֶ֖בֶל כָּל־אָדָ֣ם סֶֽלָה׃

  {13}שִֽׁמְעָ֥ה־תְפִלָּתִ֨י ׀ יְהוָ֡ה וְשַׁוְעָתִ֨י ׀ הַאֲזִינָה֮ אֶֽל־דִּמְעָתִ֗י
  אַֽל־תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑ךְ
  תּ֝וֹשָׁ֗ב כְּכָל־אֲבוֹתָֽי׃

  {14}הָשַׁ֣ע מִמֶּ֣נִּי וְאַבְלִ֑יגָה
  בְּטֶ֖רֶם אֵלֵ֣ךְ וְאֵינֶֽנִּי׃
