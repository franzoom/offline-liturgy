title: Psaume 39-I
subtitle: null
commentary: null
biblicalReference: Ps 39(40), 2-9
shortReference: Ps 39
content: |-
  {2}קַוֺּ֣ה קִוִּ֣יתִי יְהוָ֑ה
  וַיֵּ֥ט אֵ֝לַ֗י וַיִּשְׁמַ֥ע שַׁוְעָתִֽי׃

  {3}וַיַּעֲלֵ֤נִי ׀ מִבּ֥וֹר שָׁאוֹן֮ מִטִּ֪יט הַיָּ֫וֵ֥ן וַיָּ֖קֶם
  עַל־סֶ֥לַע רַגְלַ֗י כּוֹנֵ֥ן אֲשֻׁרָֽי׃

  {4}וַיִּתֵּ֬ן בְּפִ֨י ׀ שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽאלֹ֫הֵ֥ינוּ יִרְא֣וּ רַבִּ֣ים וְיִירָ֑אוּ
  וְ֝יִבְטְח֗וּ בַּיהוָֽה׃

  {5}אַ֥שְֽׁרֵי הַגֶּ֗בֶר
  אֲשֶׁר־שָׂ֣ם יְ֭הֹוָה מִבְטַח֑וֹ
  וְֽלֹא־פָנָ֥ה אֶל־רְ֝הָבִ֗ים
  וְשָׂטֵ֥י כָזָֽב׃

  {6}רַבּ֤וֹת עָשִׂ֨יתָ ׀ אַתָּ֤ה ׀ יְהוָ֣ה אֱלֹהַי֮ נִֽפְלְאֹתֶ֥יךָ וּמַחְשְׁבֹתֶ֗יךָ
  אֵ֫לֵ֥ינוּ אֵ֤ין ׀ עֲרֹ֬ךְ אֵלֶ֗יךָ אַגִּ֥ידָה וַאֲדַבֵּ֑רָה
  עָ֝צְמ֗וּ מִסַּפֵּֽר׃

  {7}זֶ֤בַח וּמִנְחָ֨ה ׀ לֹֽא־חָפַ֗צְתָּ
  אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑י
  עוֹלָ֥ה וַ֝חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׃

  {8}אָ֣ז אָ֭מַרְתִּי הִנֵּה־בָ֑אתִי
  בִּמְגִלַּת־סֵ֝֗פֶר כָּת֥וּב עָלָֽי׃

  {9}לַֽעֲשֽׂוֹת־רְצוֹנְךָ֣ אֱלֹהַ֣י חָפָ֑צְתִּי
  וְ֝ת֥וֹרָתְךָ֗ בְּת֣וֹךְ מֵעָֽי׃
