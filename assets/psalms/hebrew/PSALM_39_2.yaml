title: Psaume 39_2
subtitle: null
commentary: null
biblicalReference: Ps 39(40), 10-18
shortReference: Ps 39
content: |-
  {10}בִּשַּׂ֤רְתִּי צֶ֨דֶק ׀ בְּקָ֘הָ֤ל רָ֗ב
  הִנֵּ֣ה שְׂ֭פָתַי לֹ֣א אֶכְלָ֑א
  יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׃

  {11}צִדְקָתְךָ֬ לֹא־כִסִּ֨יתִי ׀ בְּת֬וֹךְ לִבִּ֗י
  אֱמוּנָתְךָ֣ וּתְשׁוּעָתְךָ֣ אָמָ֑רְתִּי
  לֹא־כִחַ֥דְתִּי חַסְדְּךָ֥ וַ֝אֲמִתְּךָ֗
  לְקָהָ֥ל רָֽב׃

  {12}אַתָּ֤ה יְהוָ֗ה
  לֹא־תִכְלָ֣א רַחֲמֶ֣יךָ מִמֶּ֑נִּי
  חַסְדְּךָ֥ וַ֝אֲמִתְּךָ֗
  תָּמִ֥יד יִצְּרֽוּנִי׃

  {13}כִּ֤י אָפְפ֥וּ־עָלַ֨י ׀ רָע֡וֹת עַד־אֵ֬ין מִסְפָּ֗ר
  הִשִּׂיג֣וּנִי עֲ֭וֺנֹתַי וְלֹא־יָכֹ֣לְתִּי לִרְא֑וֹת
  עָצְמ֥וּ מִשַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗י
  וְלִבִּ֥י עֲזָבָֽנִי׃

  {14}רְצֵ֣ה יְ֭הוָה לְהַצִּילֵ֑נִי
  יְ֝הוָ֗ה לְעֶזְרָ֥תִי חֽוּשָׁה׃

  [{15}יֵ֘בֹ֤שׁוּ וְיַחְפְּר֨וּ ׀ יַחַד֮ מְבַקְשֵׁ֥י נַפְשִׁ֗י
  לִסְפּ֫וֹתָ֥הּ יִסֹּ֣גוּ אָ֭חוֹר וְיִכָּלְמ֑וּ
  חֲ֝פֵצֵ֗י רָעָתִֽי׃

  {16}יָ֭שֹׁמּוּ עַל־עֵ֣קֶב בָּשְׁתָּ֑ם
  הָאֹמְרִ֥ים לִ֝֗י הֶ֘אָ֥ח ׀ הֶאָֽח׃]

  {17}יָ֘שִׂ֤ישׂוּ וְיִשְׂמְח֨וּ ׀ בְּךָ֗
  כָּֽל־מְבַ֫קְשֶׁ֥יךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה
  אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽךָ׃

  {18}וַאֲנִ֤י ׀ עָנִ֣י וְאֶבְיוֹן֮ אֲדֹנָ֪י יַחֲשָׁ֫ב לִ֥י עֶזְרָתִ֣י וּמְפַלְטִ֣י אַ֑תָּה
  אֱ֝לֹהַ֗י אַל־תְּאַחַֽר׃
