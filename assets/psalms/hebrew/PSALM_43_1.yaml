title: Psaume 43-I
subtitle: null
commentary: null
biblicalReference: Ps 43(44), 2-9
shortReference: Ps 43
content: |-
  {2}אֱלֹהִ֤ים ׀ בְּאָזְנֵ֬ינוּ שָׁמַ֗עְנוּ
  אֲבוֹתֵ֥ינוּ סִפְּרוּ־לָ֑נוּ
  פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝ימֵיהֶ֗ם
  בִּ֣ימֵי קֶֽדֶם׃

  {3}אַתָּ֤ה ׀ יָדְךָ֡
  גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַתִּטָּעֵ֑ם
  תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽתְּשַׁלְּחֵֽם׃

  {4}כִּ֤י לֹ֪א בְחַרְבָּ֡ם יָ֥רְשׁוּ אָ֗רֶץ
  וּזְרוֹעָם֮ לֹא־הוֹשִׁ֪יעָ֫ה לָּ֥מוֹ כִּֽי־יְמִֽינְךָ֣ וּ֭זְרוֹעֲךָ וְא֥וֹר פָּנֶ֗יךָ כִּ֣י רְצִיתָֽם׃

  {5}אַתָּה־ה֣וּא מַלְכִּ֣י אֱלֹהִ֑ים
  צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב׃

  {6}בְּ֭ךָ צָרֵ֣ינוּ נְנַגֵּ֑חַ
  בְּ֝שִׁמְךָ֗ נָב֥וּס קָמֵֽינוּ׃

  {7}כִּ֤י לֹ֣א בְקַשְׁתִּ֣י אֶבְטָ֑ח
  וְ֝חַרְבִּ֗י לֹ֣א תוֹשִׁיעֵֽנִי׃

  {8}כִּ֣י ה֭וֹשַׁעְתָּנוּ מִצָּרֵ֑ינוּ
  וּמְשַׂנְאֵ֥ינוּ הֱבִישֽׁוֹתָ׃

  {9}בֵּֽ֭אלֹהִים הִלַּלְ֣נוּ כָל־הַיּ֑וֹם
  וְשִׁמְךָ֓ ׀ לְעוֹלָ֖ם נוֹדֶ֣ה סֶֽלָה׃
