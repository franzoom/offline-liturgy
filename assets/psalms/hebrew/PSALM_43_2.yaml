title: Psaume 43_2
subtitle: null
commentary: null
biblicalReference: Ps 43(44), 10-17
shortReference: Ps 43
content: |-
  {10}אַף־זָ֭נַחְתָּ וַתַּכְלִימֵ֑נוּ
  וְלֹא־תֵ֝צֵ֗א בְּצִבְאוֹתֵֽינוּ׃

  {11}תְּשִׁיבֵ֣נוּ אָ֭חוֹר מִנִּי־צָ֑ר
  וּ֝מְשַׂנְאֵ֗ינוּ שָׁ֣סוּ לָֽמוֹ׃

  {12}תִּ֭תְּנֵנוּ כְּצֹ֣אן מַאֲכָ֑ל
  וּ֝בַגּוֹיִ֗ם זֵרִיתָֽנוּ׃

  {13}תִּמְכֹּֽר־עַמְּךָ֥ בְלֹא־ה֑וֹן
  וְלֹ֥א־רִ֝בִּ֗יתָ בִּמְחִירֵיהֶֽם׃

  {14}תְּשִׂימֵ֣נוּ חֶ֭רְפָּה לִשְׁכֵנֵ֑ינוּ
  לַ֥עַג וָ֝קֶ֗לֶס לִסְבִיבוֹתֵֽינוּ׃

  {15}תְּשִׂימֵ֣נוּ מָ֭שָׁל בַּגּוֹיִ֑ם
  מְנֽוֹד־רֹ֝֗אשׁ בַּל־אֻמִּֽים׃

  {16}כָּל־הַ֭יּוֹם כְּלִמָּתִ֣י נֶגְדִּ֑י
  וּבֹ֖שֶׁת פָּנַ֣י כִּסָּֽתְנִי׃

  {17}מִ֭קּוֹל מְחָרֵ֣ף וּמְגַדֵּ֑ף
  מִפְּנֵ֥י א֝וֹיֵ֗ב וּמִתְנַקֵּֽם׃
