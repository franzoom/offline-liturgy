title: Psaume 43-III
subtitle: null
commentary: null
biblicalReference: Ps 43(44), 18-27
shortReference: Ps 43
content: |-
  {18}כָּל־זֹ֣את בָּ֭אַתְנוּ וְלֹ֣א שְׁכַחֲנ֑וּךָ
  וְלֹֽא־שִׁ֝קַּ֗רְנוּ בִּבְרִיתֶֽךָ׃

  {19}לֹא־נָס֣וֹג אָח֣וֹר לִבֵּ֑נוּ
  וַתֵּ֥ט אֲשֻׁרֵ֗ינוּ מִנִּ֥י אָרְחֶֽךָ׃

  {20}כִּ֣י דִ֭כִּיתָנוּ בִּמְק֣וֹם תַּנִּ֑ים
  וַתְּכַ֖ס עָלֵ֣ינוּ בְצַלְמָֽוֶת׃

  {21}אִם־שָׁ֭כַחְנוּ שֵׁ֣ם אֱלֹהֵ֑ינוּ
  וַנִּפְרֹ֥שׂ כַּ֝פֵּ֗ינוּ לְאֵ֣ל זָֽר׃

  {22}הֲלֹ֣א אֱ֭לֹהִים יַֽחֲקָר־זֹ֑את
  כִּֽי־ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב׃

  {23}כִּֽי־עָ֭לֶיךָ הֹרַ֣גְנוּ כָל־הַיּ֑וֹם
  נֶ֝חְשַׁ֗בְנוּ כְּצֹ֣אן טִבְחָֽה׃

  {24}ע֤וּרָה ׀ לָ֖מָּה תִישַׁ֥ן ׀ אֲדֹנָ֑י
  הָ֝קִ֗יצָה אַל־תִּזְנַ֥ח לָנֶֽצַח׃

  {25}לָֽמָּה־פָנֶ֥יךָ תַסְתִּ֑יר
  תִּשְׁכַּ֖ח עָנְיֵ֣נוּ וְֽלַחֲצֵֽנוּ׃

  {26}כִּ֤י שָׁ֣חָה לֶעָפָ֣ר נַפְשֵׁ֑נוּ
  דָּבְקָ֖ה לָאָ֣רֶץ בִּטְנֵֽנוּ׃

  {27}ק֭וּמָֽה עֶזְרָ֣תָה לָּ֑נוּ
  וּ֝פְדֵ֗נוּ לְמַ֣עַן חַסְדֶּֽךָ׃
