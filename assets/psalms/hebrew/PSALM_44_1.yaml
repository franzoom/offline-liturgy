title: Psaume 44-I
subtitle: null
commentary: null
biblicalReference: Ps 44(45), 2-10
shortReference: Ps 44
content: |-
  {2}רָ֘חַ֤שׁ לִבִּ֨י ׀ דָּ֘בָ֤ר ט֗וֹב
  אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣י לְמֶ֑לֶךְ
  לְ֝שׁוֹנִ֗י עֵ֤ט ׀ סוֹפֵ֬ר מָהִֽיר׃

  {3}יָפְיָפִ֡יתָ מִבְּנֵ֬י אָדָ֗ם
  ה֣וּצַק חֵ֭ן בְּשְׂפְתוֹתֶ֑יךָ
  עַל־כֵּ֤ן בֵּֽרַכְךָ֖ אֱלֹהִ֣ים לְעוֹלָֽם׃

  {4}חֲגֽוֹר־חַרְבְּךָ֣ עַל־יָרֵ֣ךְ גִּבּ֑וֹר
  ה֝וֹדְךָ֗ וַהֲדָרֶֽךָ׃

  {5}וַהֲדָ֬רְךָ֨ ׀ צְלַ֬ח רְכַ֗ב
  עַֽל־דְּבַר־אֱ֭מֶת וְעַנְוָה־צֶ֑דֶק
  וְתוֹרְךָ֖ נוֹרָא֣וֹת יְמִינֶֽךָ׃

  {6}חִצֶּ֗יךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣יךָ יִפְּל֑וּ
  בְּ֝לֵ֗ב אוֹיְבֵ֥י הַמֶּֽלֶךְ׃

  {7}כִּסְאֲךָ֣ אֱ֭לֹהִים עוֹלָ֣ם וָעֶ֑ד
  שֵׁ֥בֶט מִ֝ישֹׁ֗ר שֵׁ֣בֶט מַלְכוּתֶֽךָ׃

  {8}אָהַ֣בְתָּ צֶּדֶק֮ וַתִּשְׂנָ֫א רֶ֥שַׁע עַל־כֵּ֤ן ׀ מְשָׁחֲךָ֡
  אֱלֹהִ֣ים אֱ֭לֹהֶיךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽחֲבֵרֶֽיךָ׃

  {9}מֹר־וַאֲהָל֣וֹת קְ֭צִיעוֹת כָּל־בִּגְדֹתֶ֑יךָ
  מִֽן־הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּךָ׃

  {10}בְּנ֣וֹת מְ֭לָכִים בְּיִקְּרוֹתֶ֑יךָ
  נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝ימִינְךָ֗
  בְּכֶ֣תֶם אוֹפִֽיר׃
