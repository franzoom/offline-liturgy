title: Psaume 44_2
subtitle: null
commentary: null
biblicalReference: Ps 44(45), 11-18
shortReference: Ps 44
content: |-
  {11}שִׁמְעִי־בַ֣ת וּ֭רְאִי וְהַטִּ֣י אָזְנֵ֑ךְ
  וְשִׁכְחִ֥י עַ֝מֵּ֗ךְ וּבֵ֥ית אָבִֽיךְ׃

  {12}וְיִתְאָ֣ו הַמֶּ֣לֶךְ יָפְיֵ֑ךְ
  כִּי־ה֥וּא אֲ֝דֹנַ֗יִךְ
  וְהִשְׁתַּֽחֲוִי־לֽוֹ׃

  {13}וּבַֽת־צֹ֨ר ׀ בְּ֭מִנְחָה פָּנַ֥יִךְ יְחַלּ֗וּ
  עֲשִׁ֣ירֵי עָֽם׃

  {14}כָּל־כְּבוּדָּ֣ה בַת־מֶ֣לֶךְ פְּנִ֑ימָה
  מִֽמִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁהּ׃

  {15}לִרְקָמוֹת֮ תּוּבַ֪ל לַ֫מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶיהָ רֵעוֹתֶ֑יהָ
  מ֖וּבָא֣וֹת לָֽךְ׃

  {16}תּ֭וּבַלְנָה בִּשְׂמָחֹ֣ת וָגִ֑יל
  תְּ֝בֹאֶ֗ינָה בְּהֵ֣יכַל מֶֽלֶךְ׃

  {17}תַּ֣חַת אֲ֭בֹתֶיךָ יִהְי֣וּ בָנֶ֑יךָ
  תְּשִׁיתֵ֥מוֹ לְ֝שָׂרִ֗ים בְּכָל־הָאָֽרֶץ׃

  {18}אַזְכִּ֣ירָה שִׁ֭מְךָ בְּכָל־דֹּ֣ר וָדֹ֑ר
  עַל־כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗ךָ
  לְעֹלָ֥ם וָעֶֽד׃
