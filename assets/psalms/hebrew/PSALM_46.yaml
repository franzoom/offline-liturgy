title: Psaume 46
subtitle: null
commentary: null
biblicalReference: Ps 46(47), 2-10
shortReference: Ps 46
content: |-
  {2}כָּֽל־הָ֭עַמִּים תִּקְעוּ־כָ֑ף
  הָרִ֥יעוּ לֵ֝אלֹהִ֗ים בְּק֣וֹל רִנָּֽה׃

  {3}כִּֽי־יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א
  מֶ֥לֶךְ גָּ֝דוֹל עַל־כָּל־הָאָֽרֶץ׃

  {4}יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑ינוּ
  וּ֝לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽינוּ׃

  {5}יִבְחַר־לָ֥נוּ אֶת־נַחֲלָתֵ֑נוּ
  אֶ֥ת גְּא֨וֹן יַעֲקֹ֖ב אֲשֶׁר־אָהֵ֣ב סֶֽלָה׃

  {6}עָלָ֣ה אֱ֭לֹהִים בִּתְרוּעָ֑ה
  יְ֝הֹוָ֗ה בְּק֣וֹל שׁוֹפָֽר׃

  {7}זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ
  זַמְּר֖וּ לְמַלְכֵּ֣נוּ זַמֵּֽרוּ׃

  {8}כִּ֤י מֶ֖לֶךְ כָּל־הָאָ֥רֶץ אֱלֹהִ֗ים
  זַמְּר֥וּ מַשְׂכִּֽיל׃

  {9}מָלַ֣ךְ אֱ֭לֹהִים עַל־גּוֹיִ֑ם
  אֱ֝לֹהִ֗ים יָשַׁ֤ב ׀ עַל־כִּסֵּ֬א קָדְשֽׁוֹ׃

  {10}נְדִ֘יבֵ֤י עַמִּ֨ים ׀ נֶאֱסָ֗פוּ
  עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭אלֹהִים מָֽגִנֵּי־אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׃
