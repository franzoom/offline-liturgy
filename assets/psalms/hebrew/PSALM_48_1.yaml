title: Psaume 48-I
subtitle: null
commentary: null
biblicalReference: Ps 48(49), 2-13
shortReference: Ps 48
content: |-
  {2}שִׁמְעוּ־זֹ֭את כָּל־הָֽעַמִּ֑ים
  הַ֝אֲזִ֗ינוּ כָּל־יֹ֥שְׁבֵי חָֽלֶד׃

  {3}גַּם־בְּנֵ֣י אָ֭דָם גַּם־בְּנֵי־אִ֑ישׁ
  יַ֝֗חַד עָשִׁ֥יר וְאֶבְיֽוֹן׃

  {4}פִּ֭י יְדַבֵּ֣ר חָכְמ֑וֹת
  וְהָג֖וּת לִבִּ֣י תְבוּנֽוֹת׃

  {5}אַטֶּ֣ה לְמָשָׁ֣ל אָזְנִ֑י
  אֶפְתַּ֥ח בְּ֝כִנּ֗וֹר חִידָתִֽי׃

  {6}לָ֣מָּה אִ֭ירָא בִּ֣ימֵי רָ֑ע
  עֲוֺ֖ן עֲקֵבַ֣י יְסוּבֵּֽנִי׃

  {7}הַבֹּטְחִ֥ים עַל־חֵילָ֑ם
  וּבְרֹ֥ב עָ֝שְׁרָ֗ם יִתְהַלָּֽלוּ׃

  {8}אָ֗ח לֹא־פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ
  לֹא־יִתֵּ֖ן לֵאלֹהִ֣ים כָּפְרֽוֹ׃

  {9}וְ֭יֵקַר פִּדְי֥וֹן נַפְשָׁ֗ם
  וְחָדַ֥ל לְעוֹלָֽם׃

  {10}וִֽיחִי־ע֥וֹד לָנֶ֑צַח
  לֹ֖א יִרְאֶ֣ה הַשָּֽׁחַת׃

  {11}כִּ֤י יִרְאֶ֨ה ׀ חֲכָ֘מִ֤ים יָמ֗וּתוּ
  יַ֤חַד כְּסִ֣יל וָבַ֣עַר יֹאבֵ֑דוּ
  וְעָזְב֖וּ לַאֲחֵרִ֣ים חֵילָֽם׃

  {12}קִרְבָּ֤ם בָּתֵּ֨ימוֹ ׀ לְֽעוֹלָ֗ם
  מִ֭שְׁכְּנֹתָם לְדֹ֣ר וָדֹ֑ר
  קָֽרְא֥וּ בִ֝שְׁמוֹתָ֗ם עֲלֵ֣י אֲדָמֽוֹת׃

  {13}וְאָדָ֣ם בִּ֭יקָר בַּל־יָלִ֑ין
  נִמְשַׁ֖ל כַּבְּהֵמ֣וֹת נִדְמֽוּ׃
