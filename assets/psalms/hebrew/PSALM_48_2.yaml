title: Psaume 48_2
subtitle: null
commentary: null
biblicalReference: Ps 48(49), 14-21
shortReference: Ps 48
content: |-
  {14}זֶ֣ה דַ֭רְכָּם כֵּ֣סֶל לָ֑מוֹ
  וְאַחֲרֵיהֶ֓ם ׀ בְּפִיהֶ֖ם יִרְצ֣וּ סֶֽלָה׃

  {15}כַּצֹּ֤אן ׀ לִֽשְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥ם וַיִּרְדּ֘וּ בָ֤ם יְשָׁרִ֨ים ׀ לַבֹּ֗קֶר
  וְ֭צוּרָם לְבַלּ֥וֹת שְׁא֗וֹל מִזְּבֻ֥ל לֽוֹ׃

  {16}אַךְ־אֱלֹהִ֗ים
  יִפְדֶּ֣ה נַ֭פְשִׁי מִֽיַּד־שְׁא֑וֹל
  כִּ֖י יִקָּחֵ֣נִי סֶֽלָה׃

  {17}אַל־תִּ֭ירָא כִּֽי־יַעֲשִׁ֣ר אִ֑ישׁ
  כִּֽי־יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽוֹ׃

  {18}כִּ֤י לֹ֣א בְ֭מוֹתוֹ יִקַּ֣ח הַכֹּ֑ל
  לֹא־יֵרֵ֖ד אַחֲרָ֣יו כְּבוֹדֽוֹ׃

  {19}כִּֽי־נַ֭פְשׁוֹ בְּחַיָּ֣יו יְבָרֵ֑ךְ
  וְ֝יוֹדֻ֗ךָ כִּי־תֵיטִ֥יב לָֽךְ׃

  {20}תָּ֭בוֹא עַד־דּ֣וֹר אֲבוֹתָ֑יו
  עַד־נֵ֝֗צַח לֹ֣א יִרְאוּ־אֽוֹר׃

  {21}אָדָ֣ם בִּ֭יקָר וְלֹ֣א יָבִ֑ין
  נִמְשַׁ֖ל כַּבְּהֵמ֣וֹת נִדְמֽוּ׃
