title: Psaume 49_1
subtitle: null
commentary: null
biblicalReference: Ps 49(50), 1-6
shortReference: Ps 49
content: |-
  {1}אֵ֤ל ׀ אֱֽלֹהִ֡ים יְֽהוָ֗ה
  דִּבֶּ֥ר וַיִּקְרָא־אָ֑רֶץ
  מִמִּזְרַח־שֶׁ֝֗מֶשׁ עַד־מְבֹאֽוֹ׃

  {2}מִצִּיּ֥וֹן מִכְלַל־יֹ֗פִי
  אֱלֹהִ֥ים הוֹפִֽיעַ׃

  {3}יָ֤בֹ֥א אֱלֹהֵ֗ינוּ
  וְֽאַל־יֶ֫חֱרַ֥שׁ אֵשׁ־לְפָנָ֥יו תֹּאכֵ֑ל
  וּ֝סְבִיבָ֗יו נִשְׂעֲרָ֥ה מְאֹֽד׃

  {4}יִקְרָ֣א אֶל־הַשָּׁמַ֣יִם מֵעָ֑ל
  וְאֶל־הָ֝אָ֗רֶץ לָדִ֥ין עַמּֽוֹ׃

  {5}אִסְפוּ־לִ֥י חֲסִידָ֑י
  כֹּרְתֵ֖י בְרִיתִ֣י עֲלֵי־זָֽבַח׃

  {6}וַיַּגִּ֣ידוּ שָׁמַ֣יִם צִדְק֑וֹ
  כִּֽי־אֱלֹהִ֓ים ׀ שֹׁפֵ֖ט ה֣וּא סֶֽלָה׃
