title: Psaume 49-II
subtitle: null
commentary: null
biblicalReference: Ps 49(50), 7-15
shortReference: Ps 49
content: |-
  {7}שִׁמְעָ֤ה עַמִּ֨י ׀ וַאֲדַבֵּ֗רָה
  יִ֭שְׂרָאֵל וְאָעִ֣ידָה בָּ֑ךְ
  אֱלֹהִ֖ים אֱלֹהֶ֣יךָ אָנֹֽכִי׃

  {8}לֹ֣א עַל־זְ֭בָחֶיךָ אוֹכִיחֶ֑ךָ
  וְעוֹלֹתֶ֖יךָ לְנֶגְדִּ֣י תָמִֽיד׃

  {9}לֹא־אֶקַּ֣ח מִבֵּיתְךָ֣ פָ֑ר
  מִ֝מִּכְלְאֹתֶ֗יךָ עַתּוּדִֽים׃

  {10}כִּי־לִ֥י כָל־חַיְתוֹ־יָ֑עַר
  בְּ֝הֵמ֗וֹת בְּהַרְרֵי־אָֽלֶף׃

  {11}יָ֭דַעְתִּי כָּל־ע֣וֹף הָרִ֑ים
  וְזִ֥יז שָׂ֝דַ֗י עִמָּדִֽי׃

  {12}אִם־אֶ֭רְעַב לֹא־אֹ֣מַר לָ֑ךְ
  כִּי־לִ֥י תֵ֝בֵ֗ל וּמְלֹאָֽהּ׃

  {13}הַֽ֭אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים
  וְדַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃

  {14}זְבַ֣ח לֵאלֹהִ֣ים תּוֹדָ֑ה
  וְשַׁלֵּ֖ם לְעֶלְי֣וֹן נְדָרֶֽיךָ׃

  {15}וּ֭קְרָאֵנִי בְּי֣וֹם צָרָ֑ה
  אֲ֝חַלֶּצְךָ֗ וּֽתְכַבְּדֵֽנִי׃
