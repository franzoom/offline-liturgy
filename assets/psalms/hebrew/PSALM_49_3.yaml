title: Psaume 49-III
subtitle: null
commentary: null
biblicalReference: Ps 49(50), 16-23
shortReference: Ps 49
content: |-
  {16}וְלָ֤רָשָׁ֨ע ׀ אָ֘מַ֤ר אֱלֹהִ֗ים
  מַה־לְּ֭ךָ לְסַפֵּ֣ר חֻקָּ֑י
  וַתִּשָּׂ֖א בְרִיתִ֣י עֲלֵי־פִֽיךָ׃

  {17}וְ֭אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר
  וַתַּשְׁלֵ֖ךְ דְּבָרַ֣י אַחֲרֶֽיךָ׃

  {18}אִם־רָאִ֣יתָ גַ֭נָּב וַתִּ֣רֶץ עִמּ֑וֹ
  וְעִ֖ם מְנָאֲפִ֣ים חֶלְקֶֽךָ׃

  {19}פִּ֭יךָ שָׁלַ֣חְתָּ בְרָעָ֑ה
  וּ֝לְשׁוֹנְךָ֗ תַּצְמִ֥יד מִרְמָֽה׃

  {20}תֵּ֭שֵׁב בְּאָחִ֣יךָ תְדַבֵּ֑ר
  בְּבֶֽן־אִ֝מְּךָ֗ תִּתֶּן־דֹּֽפִי׃

  {21}אֵ֤לֶּה עָשִׂ֨יתָ ׀ וְֽהֶחֱרַ֗שְׁתִּי
  דִּמִּ֗יתָ הֱֽיוֹת־אֶֽהְיֶ֥ה כָמ֑וֹךָ
  אוֹכִיחֲךָ֖ וְאֶֽעֶרְכָ֣ה לְעֵינֶֽיךָ׃

  {22}בִּֽינוּ־נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ
  פֶּן־אֶ֝טְרֹ֗ף וְאֵ֣ין מַצִּֽיל׃

  {23}זֹבֵ֥חַ תּוֹדָ֗ה
  יְֽכַ֫בְּדָ֥נְנִי וְשָׂ֥ם דֶּ֑רֶךְ
  אַ֝רְאֶ֗נּוּ בְּיֵ֣שַׁע אֱלֹהִֽים׃
