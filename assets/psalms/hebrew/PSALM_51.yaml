title: Psaume 51
subtitle: null
commentary: null
biblicalReference: Ps 51(52), 3-11
shortReference: Ps 51
content: |-
  {3}מַה־תִּתְהַלֵּ֣ל בְּ֭רָעָה הַגִּבּ֑וֹר
  חֶ֥סֶד אֵ֝֗ל כָּל־הַיּֽוֹם׃

  {4}הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑ךָ
  כְּתַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃

  {5}אָהַ֣בְתָּ רָּ֣ע מִטּ֑וֹב
  שֶׁ֓קֶר ׀ מִדַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׃

  {6}אָהַ֥בְתָּ כָֽל־דִּבְרֵי־בָ֗לַע
  לְשׁ֣וֹן מִרְמָֽה׃

  {7}גַּם־אֵל֮ יִתָּצְךָ֪ לָ֫נֶ֥צַח יַחְתְּךָ֣ וְיִסָּחֲךָ֣ מֵאֹ֑הֶל
  וְשֵֽׁרֶשְׁךָ֨ מֵאֶ֖רֶץ חַיִּ֣ים סֶֽלָה׃

  {8}וְיִרְא֖וּ צַדִּיקִ֥ים וְיִירָ֗אוּ
  וְעָלָ֥יו יִשְׂחָֽקוּ׃

  {9}הִנֵּ֤ה הַגֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים
  מָֽע֫וּזּ֥וֹ וַ֭יִּבְטַח בְּרֹ֣ב עָשְׁר֑וֹ
  יָ֝עֹ֗ז בְּהַוָּתֽוֹ׃

  {10}וַאֲנִ֤י ׀ כְּזַ֣יִת רַ֭עֲנָן בְּבֵ֣ית אֱלֹהִ֑ים
  בָּטַ֥חְתִּי בְחֶֽסֶד־אֱ֝לֹהִ֗ים
  עוֹלָ֥ם וָעֶֽד׃

  {11}אוֹדְךָ֣ לְ֭עוֹלָם כִּ֣י עָשִׂ֑יתָ
  וַאֲקַוֶּ֖ה שִׁמְךָ֥ כִֽי־ט֝֗וֹב
  נֶ֣גֶד חֲסִידֶֽיךָ׃
