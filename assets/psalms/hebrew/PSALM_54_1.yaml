title: Psaume 54_1
subtitle: null
commentary: null
biblicalReference: Ps 54(55), 2-10
shortReference: Ps 54
content: |-
  {2}הַאֲזִ֣ינָה אֱ֭לֹהִים תְּפִלָּתִ֑י
  וְאַל־תִּ֝תְעַלַּ֗ם מִתְּחִנָּתִֽי׃

  {3}הַקְשִׁ֣יבָה לִּ֣י וַעֲנֵ֑נִי
  אָרִ֖יד בְּשִׂיחִ֣י וְאָהִֽימָה׃

  {4}מִקּ֤וֹל אוֹיֵ֗ב מִפְּנֵ֣י עָקַ֣ת רָשָׁ֑ע
  כִּי־יָמִ֥יטוּ עָלַ֥י אָ֝֗וֶן
  וּבְאַ֥ף יִשְׂטְמֽוּנִי׃

  {5}לִ֭בִּי יָחִ֣יל בְּקִרְבִּ֑י
  וְאֵימ֥וֹת מָ֝֗וֶת נָפְל֥וּ עָלָֽי׃

  {6}יִרְאָ֣ה וָ֭רַעַד יָ֣בֹא בִ֑י
  וַ֝תְּכַסֵּ֗נִי פַּלָּצֽוּת׃

  {7}וָאֹמַ֗ר מִֽי־יִתֶּן־לִּ֣י אֵ֭בֶר כַּיּוֹנָ֗ה
  אָע֥וּפָה וְאֶשְׁכֹּֽנָה׃

  {8}הִ֭נֵּה אַרְחִ֣יק נְדֹ֑ד
  אָלִ֖ין בַּמִּדְבָּ֣ר סֶֽלָה׃

  {9}אָחִ֣ישָׁה מִפְלָ֣ט לִ֑י
  מֵר֖וּחַ סֹעָ֣ה מִסָּֽעַר׃

  {10}בַּלַּ֣ע אֲ֭דֹנָי פַּלַּ֣ג לְשׁוֹנָ֑ם
  כִּֽי־רָאִ֨יתִי חָמָ֖ס וְרִ֣יב בָּעִֽיר׃
