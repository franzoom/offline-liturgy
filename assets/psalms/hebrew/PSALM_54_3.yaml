title: Psaume 54_3
subtitle: null
commentary: null
biblicalReference: Ps 54(55), 17-24
shortReference: Ps 54
content: |-
  {17}אֲ֭נִי אֶל־אֱלֹהִ֣ים אֶקְרָ֑א
  וַ֝יהוָ֗ה יוֹשִׁיעֵֽנִי׃

  {18}עֶ֤רֶב וָבֹ֣קֶר וְ֭צָהֳרַיִם אָשִׂ֣יחָה וְאֶהֱמֶ֑ה
  וַיִּשְׁמַ֥ע קוֹלִֽי׃

  {19}פָּ֘דָ֤ה בְשָׁל֣וֹם נַ֭פְשִׁי מִקֲּרָב־לִ֑י
  כִּֽי־בְ֝רַבִּ֗ים הָי֥וּ עִמָּדִֽי׃

  {20}יִשְׁמַ֤ע ׀ אֵ֨ל ׀ וְֽיַעֲנֵם֮ וְיֹ֤שֵׁ֥ב קֶ֗דֶם
  סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑מוֹ
  וְלֹ֖א יָרְא֣וּ אֱלֹהִֽים׃

  {21}שָׁלַ֣ח יָ֭דָיו בִּשְׁלֹמָ֗יו
  חִלֵּ֥ל בְּרִיתֽוֹ׃

  {22}חָלְק֤וּ ׀ מַחְמָאֹ֣ת פִּיו֮ וּֽקֲרָב־לִ֫בּ֥וֹ רַכּ֖וּ
  דְבָרָ֥יו מִשֶּׁ֗מֶן וְהֵ֣מָּה פְתִחֽוֹת׃

  {23}הַשְׁלֵ֤ךְ עַל־יְהוָ֨ה ׀ יְהָבְךָ֮ וְה֪וּא יְכַ֫לְכְּלֶ֥ךָ לֹא־יִתֵּ֖ן
  לְעוֹלָ֥ם מ֗וֹט לַצַּדִּֽיק׃

  {24}וְאַתָּ֤ה אֱלֹהִ֨ים ׀ תּוֹרִדֵ֬ם ׀ לִבְאֵ֬ר שַׁ֗חַת
  אַנְשֵׁ֤י דָמִ֣ים וּ֭מִרְמָה לֹא־יֶחֱצ֣וּ יְמֵיהֶ֑ם
  וַ֝אֲנִ֗י אֶבְטַח־בָּֽךְ׃
