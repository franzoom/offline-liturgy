title: Psaume 65_1
subtitle: null
commentary: null
biblicalReference: Ps 65(66), 1-12
shortReference: Ps 65
content: |-
  {1}הָרִ֥יעוּ לֵ֝אלֹהִים כָּל־הָאָֽרֶץ׃

  {2}זַמְּר֥וּ כְבֽוֹד־שְׁמ֑וֹ
  שִׂ֥ימוּ כָ֝ב֗וֹד תְּהִלָּתֽוֹ׃

  {3}אִמְר֣וּ לֵ֭אלֹהִים מַה־נּוֹרָ֣א מַעֲשֶׂ֑יךָ
  בְּרֹ֥ב עֻ֝זְּךָ֗
  יְֽכַחֲשׁ֖וּ לְךָ֣ אֹיְבֶֽיךָ׃

  {4}כָּל־הָאָ֤רֶץ ׀ יִשְׁתַּחֲו֣וּ לְ֭ךָ וִֽיזַמְּרוּ־לָ֑ךְ
  יְזַמְּר֖וּ שִׁמְךָ֣ סֶֽלָה׃

  {5}לְכ֣וּ וּ֭רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים
  נוֹרָ֥א עֲ֝לִילָ֗ה עַל־בְּנֵ֥י אָדָֽם׃

  {6}הָ֤פַךְ יָ֨ם ׀ לְֽיַבָּשָׁ֗ה
  בַּ֭נָּהָר יַֽעַבְר֣וּ בְרָ֑גֶל
  שָׁ֝֗ם נִשְׂמְחָה־בּֽוֹ׃

  {7}מֹ֘שֵׁ֤ל בִּגְבוּרָת֨וֹ ׀ עוֹלָ֗ם
  עֵ֭ינָיו בַּגּוֹיִ֣ם תִּצְפֶּ֑ינָה
  הַסּוֹרְרִ֓ים ׀ אַל־יָר֖וּמוּ לָ֣מוֹ סֶֽלָה׃

  {8}בָּרְכ֖וּ עַמִּ֥ים ׀ אֱלֹהֵ֑ינוּ
  וְ֝הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽוֹ׃

  {9}הַשָּׂ֣ם נַ֭פְשֵׁנוּ בַּֽחַיִּ֑ים
  וְלֹֽא־נָתַ֖ן לַמּ֣וֹט רַגְלֵֽנוּ׃

  {10}כִּֽי־בְחַנְתָּ֥נוּ אֱלֹהִ֑ים
  צְ֝רַפְתָּ֗נוּ כִּצְרָף־כָּֽסֶף׃

  {11}הֲבֵאתָ֥נוּ בַמְּצוּדָ֑ה
  שַׂ֖מְתָּ מוּעָקָ֣ה בְמָתְנֵֽינוּ׃

  {12}הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ
  לְרֹ֫אשֵׁ֥נוּ בָּֽאנוּ־בָאֵ֥שׁ וּבַמַּ֑יִם
  וַ֝תּוֹצִיאֵ֗נוּ לָֽרְוָיָֽה׃
