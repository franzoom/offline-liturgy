title: Psaume 66
subtitle: null
commentary: null
biblicalReference: Ps 66(67), 2-8
shortReference: Ps 66
content: |-
  {2}אֱלֹהִ֗ים יְחָנֵּ֥נוּ וִֽיבָרְכֵ֑נוּ
  יָ֤אֵ֥ר פָּנָ֖יו אִתָּ֣נוּ סֶֽלָה׃

  {3}לָדַ֣עַת בָּאָ֣רֶץ דַּרְכֶּ֑ךָ
  בְּכָל־גּ֝וֹיִ֗ם יְשׁוּעָתֶֽךָ׃

  {4}יוֹד֖וּךָ עַמִּ֥ים ׀ אֱלֹהִ֑ים
  י֝וֹד֗וּךָ עַמִּ֥ים כֻּלָּֽם׃

  {5}יִֽשְׂמְח֥וּ וִֽירַנְּנ֗וּ
  לְאֻ֫מִּ֥ים כִּֽי־תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר
  וּלְאֻמִּ֓ים ׀ בָּאָ֖רֶץ תַּנְחֵ֣ם סֶֽלָה׃

  {6}יוֹד֖וּךָ עַמִּ֥ים ׀ אֱלֹהִ֑ים
  י֝וֹד֗וּךָ עַמִּ֥ים כֻּלָּֽם׃

  {7}אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑הּ
  יְ֝בָרְכֵ֗נוּ אֱלֹהִ֥ים אֱלֹהֵֽינוּ׃

  {8}יְבָרְכֵ֥נוּ אֱלֹהִ֑ים
  וְיִֽירְא֥וּ אֹ֝ת֗וֹ כָּל־אַפְסֵי־אָֽרֶץ׃
