title: Psaume 67_1
subtitle: null
commentary: null
biblicalReference: Ps 67(68), 2-11
shortReference: Ps 67
content: |-
  {2}יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑יו
  וְיָנ֥וּסוּ מְ֝שַׂנְאָ֗יו מִפָּנָֽיו׃

  {3}כְּהִנְדֹּ֥ף עָשָׁ֗ן
  תִּ֫נְדֹּ֥ף כְּהִמֵּ֣ס דּ֭וֹנַג מִפְּנֵי־אֵ֑שׁ
  יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִפְּנֵ֥י אֱלֹהִֽים׃

  {4}וְֽצַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִפְנֵ֥י אֱלֹהִ֗ים
  וְיָשִׂ֥ישׂוּ בְשִׂמְחָֽה׃

  {5}שִׁ֤ירוּ ׀ לֵֽאלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥וֹ סֹ֡לּוּ
  לָרֹכֵ֣ב בָּ֭עֲרָבוֹת בְּיָ֥הּ שְׁמ֗וֹ וְעִלְז֥וּ לְפָנָֽיו׃

  {6}אֲבִ֣י יְ֭תוֹמִים וְדַיַּ֣ן אַלְמָנ֑וֹת
  אֱ֝לֹהִ֗ים בִּמְע֥וֹן קָדְשֽׁוֹ׃

  {7}אֱלֹהִ֤ים ׀ מ֘וֹשִׁ֤יב יְחִידִ֨ים ׀ בַּ֗יְתָה
  מוֹצִ֣יא אֲ֭סִירִים בַּכּוֹשָׁר֑וֹת
  אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׃

  {8}אֱֽלֹהִ֗ים בְּ֭צֵאתְךָ לִפְנֵ֣י עַמֶּ֑ךָ
  בְּצַעְדְּךָ֖ בִֽישִׁימ֣וֹן סֶֽלָה׃

  {9}אֶ֤רֶץ רָעָ֨שָׁה ׀ אַף־שָׁמַ֣יִם נָטְפוּ֮ מִפְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י
  מִפְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׃

  {10}גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים
  נַחֲלָתְךָ֥ וְ֝נִלְאָ֗ה
  אַתָּ֥ה כֽוֹנַנְתָּֽהּ׃

  {11}חַיָּתְךָ֥ יָֽשְׁבוּ־בָ֑הּ
  תָּ֤כִ֥ין בְּטוֹבָתְךָ֖ לֶעָנִ֣י אֱלֹהִֽים׃
