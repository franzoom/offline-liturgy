title: Psaume 67_2
subtitle: null
commentary: null
biblicalReference: Ps 67(68), 12-24
shortReference: Ps 67
content: |-
  {12}אֲדֹנָ֥י יִתֶּן־אֹ֑מֶר
  הַֽ֝מְבַשְּׂר֗וֹת צָבָ֥א רָֽב׃

  {13}מַלְכֵ֣י צְ֭בָאוֹת יִדֹּד֣וּן יִדֹּד֑וּן
  וּנְוַת בַּ֝֗יִת תְּחַלֵּ֥ק שָׁלָֽל׃

  {14}אִֽם־תִּשְׁכְּבוּן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַכֶּ֑סֶף
  וְ֝אֶבְרוֹתֶ֗יהָ בִּֽירַקְרַ֥ק חָרֽוּץ׃

  {15}בְּפָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗הּ
  תַּשְׁלֵ֥ג בְּצַלְמֽוֹן׃

  {16}הַר־אֱ֭לֹהִים הַר־בָּשָׁ֑ן
  הַ֥ר גַּ֝בְנֻנִּ֗ים הַר־בָּשָֽׁן׃

  {17}לָ֤מָּה ׀ תְּֽרַצְּדוּן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָהָ֗ר
  חָמַ֣ד אֱלֹהִ֣ים לְשִׁבְתּ֑וֹ
  אַף־יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָנֶֽצַח׃

  {18}רֶ֤כֶב אֱלֹהִ֗ים
  רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן
  אֲדֹנָ֥י בָ֝֗ם סִינַ֥י בַּקֹּֽדֶשׁ׃

  {19}עָ֘לִ֤יתָ לַמָּר֨וֹם ׀ שָׁ֘בִ֤יתָ שֶּׁ֗בִי
  לָקַ֣חְתָּ מַ֭תָּנוֹת בָּאָדָ֑ם
  וְאַ֥ף ס֝וֹרְרִ֗ים
  לִשְׁכֹּ֤ן ׀ יָ֬הּ אֱלֹהִֽים׃

  {20}בָּ֤ר֣וּךְ אֲדֹנָי֮ י֤וֹם ׀ י֥וֹם יַֽעֲמָס־לָ֗נוּ
  הָ֘אֵ֤ל יְֽשׁוּעָתֵ֬נוּ סֶֽלָה׃

  {21}הָ֤אֵ֣ל ׀ לָנוּ֮ אֵ֤ל לְֽמוֹשָׁ֫ע֥וֹת וְלֵיהוִ֥ה אֲדֹנָ֑י
  לַ֝מָּ֗וֶת תּוֹצָאֽוֹת׃

  {22}אַךְ־אֱלֹהִ֗ים
  יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥יו קָדְקֹ֥ד שֵׂעָ֑ר
  מִ֝תְהַלֵּ֗ךְ בַּאֲשָׁמָֽיו׃

  {23}אָמַ֣ר אֲ֭דֹנָי מִבָּשָׁ֣ן אָשִׁ֑יב
  אָ֝שִׁ֗יב מִֽמְּצֻל֥וֹת יָֽם׃

  {24}לְמַ֤עַן ׀ תִּֽמְחַ֥ץ רַגְלְךָ֗
  בְּ֫דָ֥ם לְשׁ֥וֹן כְּלָבֶ֑יךָ
  מֵאֹיְבִ֥ים מִנֵּֽהוּ׃
