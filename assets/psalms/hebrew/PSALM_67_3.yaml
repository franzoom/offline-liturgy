title: Psaume 67-III
subtitle: null
commentary: null
biblicalReference: Ps 67(68), 25-36
shortReference: Ps 67
content: |-
  {25}רָא֣וּ הֲלִיכוֹתֶ֣יךָ אֱלֹהִ֑ים
  הֲלִ֘יכ֤וֹת אֵלִ֖י מַלְכִּ֣י בַקֹּֽדֶשׁ׃

  {26}קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים
  בְּת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃

  {27}בְּֽ֭מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים
  יְ֝הוָ֗ה מִמְּק֥וֹר יִשְׂרָאֵֽל׃

  {28}שָׁ֤ם בִּנְיָמִ֨ן ׀ צָעִ֡יר רֹדֵ֗ם
  שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑ם
  שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׃

  {29}צִוָּ֥ה אֱלֹהֶ֗יךָ
  עֻ֫זֶּ֥ךָ עוּזָּ֥ה אֱלֹהִ֑ים
  ז֝֗וּ פָּעַ֥לְתָּ לָּֽנוּ׃

  {30}מֵֽ֭הֵיכָלֶךָ עַל־יְרוּשָׁלִָ֑ם
  לְךָ֤ יוֹבִ֖ילוּ מְלָכִ֣ים שָֽׁי׃

  {31}גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים ׀ בְּעֶגְלֵ֬י עַמִּ֗ים
  מִתְרַפֵּ֥ס בְּרַצֵּי־כָ֑סֶף
  בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׃

  {32}יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם
  כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗יו לֵאלֹהִֽים׃

  {33}מַמְלְכ֣וֹת הָ֭אָרֶץ שִׁ֣ירוּ לֵאלֹהִ֑ים
  זַמְּר֖וּ אֲדֹנָ֣י סֶֽלָה׃

  {34}לָ֭רֹכֵב בִּשְׁמֵ֣י שְׁמֵי־קֶ֑דֶם
  הֵ֥ן יִתֵּ֥ן בְּ֝קוֹלוֹ ק֣וֹל עֹֽז׃

  {35}תְּנ֥וּ עֹ֗ז לֵֽאלֹ֫הִ֥ים עַֽל־יִשְׂרָאֵ֥ל גַּאֲוָת֑וֹ
  וְ֝עֻזּ֗וֹ בַּשְּׁחָקִֽים׃

  {36}נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽמִּקְדָּ֫שֶׁ֥יךָ אֵ֤ל יִשְׂרָאֵ֗ל
  ה֤וּא נֹתֵ֨ן ׀ עֹ֖ז וְתַעֲצֻמ֥וֹת לָעָ֗ם בָּר֥וּךְ אֱלֹהִֽים׃
