title: Psaume 68-I
subtitle: null
commentary: null
biblicalReference: Ps 68(69), 2-13
shortReference: Ps 68
content: |-
  {2}הוֹשִׁיעֵ֥נִי אֱלֹהִ֑ים
  כִּ֤י בָ֖אוּ מַ֣יִם עַד־נָֽפֶשׁ׃

  {3}טָבַ֤עְתִּי ׀ בִּיוֵ֣ן מְ֭צוּלָה וְאֵ֣ין מָעֳמָ֑ד
  בָּ֥אתִי בְמַעֲמַקֵּי־מַ֝֗יִם
  וְשִׁבֹּ֥לֶת שְׁטָפָֽתְנִי׃

  {4}יָגַ֣עְתִּי בְקָרְאִי֮ נִחַ֪ר גְּר֫וֹנִ֥י כָּל֥וּ עֵינַ֑י
  מְ֝יַחֵ֗ל לֵאלֹהָֽי׃

  {5}רַבּ֤וּ ׀ מִשַּׂעֲר֣וֹת רֹאשִׁי֮ שֹׂנְאַ֪י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַי אֹיְבַ֣י שֶׁ֑קֶר
  אֲשֶׁ֥ר לֹא־גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׃

  {6}אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְאִוַּלְתִּ֑י
  וְ֝אַשְׁמוֹתַ֗י מִמְּךָ֥ לֹא־נִכְחָֽדוּ׃

  {7}אַל־יֵ֘בֹ֤שׁוּ בִ֨י ׀ קֹוֶיךָ֮ אֲדֹנָ֥י יְהוִ֗ה
  צְבָ֫א֥וֹת אַל־יִכָּ֣לְמוּ בִ֣י מְבַקְשֶׁ֑יךָ
  אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל׃

  {8}כִּֽי־עָ֭לֶיךָ נָשָׂ֣אתִי חֶרְפָּ֑ה
  כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽי׃

  {9}מ֭וּזָר הָיִ֣יתִי לְאֶחָ֑י
  וְ֝נָכְרִ֗י לִבְנֵ֥י אִמִּֽי׃

  {10}כִּֽי־קִנְאַ֣ת בֵּיתְךָ֣ אֲכָלָ֑תְנִי
  וְחֶרְפּ֥וֹת ח֝וֹרְפֶ֗יךָ נָפְל֥וּ עָלָֽי׃

  {11}וָאֶבְכֶּ֣ה בַצּ֣וֹם נַפְשִׁ֑י
  וַתְּהִ֖י לַחֲרָפ֣וֹת לִֽי׃

  {12}וָאֶתְּנָ֣ה לְבוּשִׁ֣י שָׂ֑ק
  וָאֱהִ֖י לָהֶ֣ם לְמָשָֽׁל׃

  {13}יָשִׂ֣יחוּ בִ֭י יֹ֣שְׁבֵי שָׁ֑עַר
  וּ֝נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
