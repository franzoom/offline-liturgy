title: Psaume 68-II
subtitle: null
commentary: null
biblicalReference: Ps 68(69), 14-29
shortReference: Ps 68
content: |-
  {14}וַאֲנִ֤י תְפִלָּתִֽי־לְךָ֨ ׀ יְהוָ֡ה עֵ֤ת רָצ֗וֹן
  אֱלֹהִ֥ים בְּרָב־חַסְדֶּ֑ךָ
  עֲ֝נֵ֗נִי בֶּאֱמֶ֥ת יִשְׁעֶֽךָ׃

  {15}הַצִּילֵ֣נִי מִ֭טִּיט וְאַל־אֶטְבָּ֑עָה
  אִנָּצְלָ֥ה מִ֝שֹּֽׂנְאַ֗י
  וּמִמַּֽעֲמַקֵּי־מָֽיִם׃

  {16}אַל־תִּשְׁטְפֵ֤נִי ׀ שִׁבֹּ֣לֶת מַ֭יִם וְאַל־תִּבְלָעֵ֣נִי מְצוּלָ֑ה
  וְאַל־תֶּאְטַר־עָלַ֖י בְּאֵ֣ר פִּֽיהָ׃

  {17}עֲנֵ֣נִי יְ֭הוָה כִּי־ט֣וֹב חַסְדֶּ֑ךָ
  כְּרֹ֥ב רַ֝חֲמֶ֗יךָ פְּנֵ֣ה אֵלָֽי׃

  {18}וְאַל־תַּסְתֵּ֣ר פָּ֭נֶיךָ מֵֽעַבְדֶּ֑ךָ
  כִּֽי־צַר־לִ֝֗י מַהֵ֥ר עֲנֵֽנִי׃

  {19}קָרְבָ֣ה אֶל־נַפְשִׁ֣י גְאָלָ֑הּ
  לְמַ֖עַן אֹיְבַ֣י פְּדֵֽנִי׃

  {20}אַתָּ֤ה יָדַ֗עְתָּ
  חֶרְפָּתִ֣י וּ֭בָשְׁתִּי וּכְלִמָּתִ֑י
  נֶ֝גְדְּךָ֗ כָּל־צוֹרְרָֽי׃

  {21}חֶרְפָּ֤ה ׀ שָֽׁבְרָ֥ה לִבִּ֗י
  וָֽאָ֫נ֥וּשָׁה וָאֲקַוֶּ֣ה לָנ֣וּד וָאַ֑יִן
  וְ֝לַמְנַחֲמִ֗ים וְלֹ֣א מָצָֽאתִי׃

  {22}וַיִּתְּנ֣וּ בְּבָרוּתִ֣י רֹ֑אשׁ
  וְ֝לִצְמָאִ֗י יַשְׁק֥וּנִי חֹֽמֶץ׃

  [{23}יְהִֽי־שֻׁלְחָנָ֣ם לִפְנֵיהֶ֣ם לְפָ֑ח
  וְלִשְׁלוֹמִ֥ים לְמוֹקֵֽשׁ׃

  {24}תֶּחְשַׁ֣כְנָה עֵ֭ינֵיהֶם מֵרְא֑וֹת
  וּ֝מָתְנֵ֗יהֶם תָּמִ֥יד הַמְעַֽד׃

  {25}שְׁפָךְ־עֲלֵיהֶ֥ם זַעְמֶ֑ךָ
  וַחֲר֥וֹן אַ֝פְּךָ֗ יַשִּׂיגֵֽם׃

  {26}תְּהִי־טִֽירָתָ֥ם נְשַׁמָּ֑ה
  בְּ֝אָהֳלֵיהֶ֗ם אַל־יְהִ֥י יֹשֵֽׁב׃

  {27}כִּֽי־אַתָּ֣ה אֲשֶׁר־הִכִּ֣יתָ רָדָ֑פוּ
  וְאֶל־מַכְא֖וֹב חֲלָלֶ֣יךָ יְסַפֵּֽרוּ׃

  {28}תְּֽנָה־עָ֭וֺן עַל־עֲוֺנָ֑ם
  וְאַל־יָ֝בֹ֗אוּ בְּצִדְקָתֶֽךָ׃

  {29}יִ֭מָּחֽוּ מִסֵּ֣פֶר חַיִּ֑ים
  וְעִ֥ם צַ֝דִּיקִ֗ים אַל־יִכָּתֵֽבוּ׃]
