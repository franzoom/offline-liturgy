title: Psaume 68_3
subtitle: null
commentary: null
biblicalReference: Ps 68(69), 30-37
shortReference: Ps 68
content: |-
  {30}וַ֭אֲנִי עָנִ֣י וְכוֹאֵ֑ב
  יְשׁוּעָתְךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽנִי׃

  {31}אֲהַֽלְלָ֣ה שֵׁם־אֱלֹהִ֣ים בְּשִׁ֑יר
  וַאֲגַדְּלֶ֥נּוּ בְתוֹדָֽה׃

  {32}וְתִיטַ֣ב לַֽ֭יהוָה מִשּׁ֥וֹר פָּ֗ר
  מַקְרִ֥ן מַפְרִֽיס׃

  {33}רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ
  דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִיחִ֥י לְבַבְכֶֽם׃

  {34}כִּֽי־שֹׁמֵ֣עַ אֶל־אֶבְיוֹנִ֣ים יְהוָ֑ה
  וְאֶת־אֲ֝סִירָ֗יו לֹ֣א בָזָֽה׃

  {35}יְֽ֭הַלְלוּהוּ שָׁמַ֣יִם וָאָ֑רֶץ
  יַ֝מִּ֗ים וְֽכָל־רֹמֵ֥שׂ בָּֽם׃

  {36}כִּ֤י אֱלֹהִ֨ים ׀ י֘וֹשִׁ֤יעַ צִיּ֗וֹן
  וְ֭יִבְנֶה עָרֵ֣י יְהוּדָ֑ה
  וְיָ֥שְׁבוּ שָׁ֝֗ם וִירֵשֽׁוּהָ׃

  {37}וְזֶ֣רַע עֲ֭בָדָיו יִנְחָל֑וּהָ
  וְאֹהֲבֵ֥י שְׁ֝מ֗וֹ יִשְׁכְּנוּ־בָֽהּ׃
