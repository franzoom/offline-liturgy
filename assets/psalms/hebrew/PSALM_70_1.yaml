title: Psaume 70-I
subtitle: null
commentary: null
biblicalReference: Ps 70(71), 1-13
shortReference: Ps 70
content: |-
  {1}בְּךָֽ־יְהוָ֥ה חָסִ֑יתִי
  אַל־אֵב֥וֹשָׁה לְעוֹלָֽם׃

  {2}בְּצִדְקָתְךָ֗
  תַּצִּילֵ֥נִי וּֽתְפַלְּטֵ֑נִי
  הַטֵּֽה־אֵלַ֥י אָ֝זְנְךָ֗ וְהוֹשִׁיעֵֽנִי׃

  {3}הֱיֵ֤ה לִ֨י ׀ לְצ֥וּר מָע֡וֹן לָב֗וֹא
  תָּמִ֗יד צִוִּ֥יתָ לְהוֹשִׁיעֵ֑נִי
  כִּֽי־סַלְעִ֖י וּמְצוּדָתִ֣י אָֽתָּה׃

  {4}אֱֽלֹהַ֗י פַּ֭לְּטֵנִי מִיַּ֣ד רָשָׁ֑ע
  מִכַּ֖ף מְעַוֵּ֣ל וְחוֹמֵץ׃

  {5}כִּֽי־אַתָּ֥ה תִקְוָתִ֑י
  אֲדֹנָ֥י יְ֝הוִ֗ה מִבְטַחִ֥י מִנְּעוּרָֽי׃

  {6}עָלֶ֤יךָ ׀ נִסְמַ֬כְתִּי מִבֶּ֗טֶן
  מִמְּעֵ֣י אִ֭מִּי אַתָּ֣ה גוֹזִ֑י
  בְּךָ֖ תְהִלָּתִ֣י תָמִֽיד׃

  {7}כְּ֭מוֹפֵת הָיִ֣יתִי לְרַבִּ֑ים
  וְ֝אַתָּ֗ה מַֽחֲסִי־עֹֽז׃

  {8}יִמָּ֣לֵא פִ֭י תְּהִלָּתֶ֑ךָ
  כָּל־הַ֝יּ֗וֹם תִּפְאַרְתֶּֽךָ׃

  {9}אַֽל־תַּ֭שְׁלִיכֵנִי לְעֵ֣ת זִקְנָ֑ה
  כִּכְל֥וֹת כֹּ֝חִ֗י אַֽל־תַּעַזְבֵֽנִי׃

  {10}כִּֽי־אָמְר֣וּ אוֹיְבַ֣י לִ֑י
  וְשֹׁמְרֵ֥י נַ֝פְשִׁ֗י נוֹעֲצ֥וּ יַחְדָּֽו׃

  {11}לֵ֭אמֹר אֱלֹהִ֣ים עֲזָב֑וֹ
  רִֽדְפ֥וּ וְ֝תִפְשׂ֗וּהוּ
  כִּי־אֵ֥ין מַצִּֽיל׃

  {12}אֱ֭לֹהִים אַל־תִּרְחַ֣ק מִמֶּ֑נִּי
  אֱ֝לֹהַ֗י לְעֶזְרָ֥תִי חֽוּשָׁה׃

  {13}יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥י יַֽעֲט֣וּ חֶ֭רְפָּה וּכְלִמָּ֑ה
  מְ֝בַקְשֵׁ֗י רָעָתִֽי׃
