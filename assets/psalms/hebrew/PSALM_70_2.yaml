title: Psaume 70_2
subtitle: null
commentary: null
biblicalReference: Ps 70(71), 14-24
shortReference: Ps 70
content: |-
  {14}וַ֭אֲנִי תָּמִ֣יד אֲיַחֵ֑ל
  וְ֝הוֹסַפְתִּ֗י עַל־כָּל־תְּהִלָּתֶֽךָ׃

  {15}פִּ֤י ׀ יְסַפֵּ֬ר צִדְקָתֶ֗ךָ
  כָּל־הַיּ֥וֹם תְּשׁוּעָתֶ֑ךָ
  כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׃

  {16}אָב֗וֹא בִּ֭גְבֻרוֹת אֲדֹנָ֣י יְהוִ֑ה
  אַזְכִּ֖יר צִדְקָתְךָ֣ לְבַדֶּֽךָ׃

  {17}אֱֽלֹהִ֗ים לִמַּדְתַּ֥נִי מִנְּעוּרָ֑י
  וְעַד־הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽיךָ׃

  {18}וְגַ֤ם עַד־זִקְנָ֨ה ׀ וְשֵׂיבָה֮ אֱלֹהִ֪ים אַֽל־תַּעַ֫זְבֵ֥נִי עַד־אַגִּ֣יד זְרוֹעֲךָ֣ לְד֑וֹר
  לְכָל־יָ֝ב֗וֹא גְּבוּרָתֶֽךָ׃

  {19}וְצִדְקָתְךָ֥ אֱלֹהִ֗ים
  עַד־מָ֫ר֥וֹם אֲשֶׁר־עָשִׂ֥יתָ גְדֹל֑וֹת
  אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹךָ׃

  {20}אֲשֶׁ֤ר הִרְאִיתַ֨נִי ׀ צָר֥וֹת רַבּ֗וֹת
  וְרָ֫ע֥וֹת תָּשׁ֥וּב תְּחַיֵּ֑ינִי
  וּֽמִתְּהֹמ֥וֹת הָ֝אָ֗רֶץ
  תָּשׁ֥וּב תַּעֲלֵֽנִי׃

  {21}תֶּ֤רֶב ׀ גְּֽדֻלָּתִ֗י
  וְתִסֹּ֥ב תְּֽנַחֲמֵֽנִי׃

  {22}גַּם־אֲנִ֤י ׀ אוֹדְךָ֣ בִכְלִי־נֶבֶל֮ אֲמִתְּךָ֪ אֱלֹ֫הָ֥י אֲזַמְּרָ֣ה לְךָ֣ בְכִנּ֑וֹר
  קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל׃

  {23}תְּרַנֵּ֣נָּ֣ה שְׂ֭פָתַי כִּ֣י אֲזַמְּרָה־לָּ֑ךְ
  וְ֝נַפְשִׁ֗י אֲשֶׁ֣ר פָּדִֽיתָ׃

  {24}גַּם־לְשׁוֹנִ֗י
  כָּל־הַ֭יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑ךָ
  כִּי־בֹ֥שׁוּ כִֽי־חָ֝פְר֗וּ
  מְבַקְשֵׁ֥י רָעָתִֽי׃
