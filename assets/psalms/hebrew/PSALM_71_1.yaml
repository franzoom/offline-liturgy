title: Psaume 71-I
subtitle: null
commentary: null
biblicalReference: Ps 71(72), 1-11
shortReference: Ps 71
content: |-
  {1}׀ אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶיךָ לְמֶ֣לֶךְ תֵּ֑ן
  וְצִדְקָתְךָ֥ לְבֶן־מֶֽלֶךְ׃

  {2}יָדִ֣ין עַמְּךָ֣ בְצֶ֑דֶק
  וַעֲנִיֶּ֥יךָ בְמִשְׁפָּֽט׃

  {3}יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָעָ֑ם
  וּ֝גְבָע֗וֹת בִּצְדָקָֽה׃

  {4}יִשְׁפֹּ֤ט ׀ עֲֽנִיֵּי־עָ֗ם
  י֭וֹשִׁיעַ לִבְנֵ֣י אֶבְי֑וֹן
  וִֽידַכֵּ֣א עוֹשֵֽׁק׃

  {5}יִֽירָא֥וּךָ עִם־שָׁ֑מֶשׁ
  וְלִפְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים׃

  {6}יֵ֭רֵד כְּמָטָ֣ר עַל־גֵּ֑ז
  כִּ֝רְבִיבִ֗ים זַרְזִ֥יף אָֽרֶץ׃

  {7}יִֽפְרַח־בְּיָמָ֥יו צַדִּ֑יק
  וְרֹ֥ב שָׁ֝ל֗וֹם עַד־בְּלִ֥י יָרֵֽחַ׃

  {8}וְ֭יֵרְדְּ מִיָּ֣ם עַד־יָ֑ם
  וּ֝מִנָּהָ֗ר עַד־אַפְסֵי־אָֽרֶץ׃

  {9}לְ֭פָנָיו יִכְרְע֣וּ צִיִּ֑ים
  וְ֝אֹיְבָ֗יו עָפָ֥ר יְלַחֵֽכוּ׃

  {10}מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ
  מַלְכֵ֥י שְׁבָ֥א וּ֝סְבָ֗א
  אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃

  {11}וְיִשְׁתַּחֲווּ־ל֥וֹ כָל־מְלָכִ֑ים
  כָּל־גּוֹיִ֥ם יַֽעַבְדֽוּהוּ׃
