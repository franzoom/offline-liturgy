title: Psaume 72_1
subtitle: null
commentary: null
biblicalReference: Ps 72(73), 1-12
shortReference: Ps 72
content: |-
  {1}אַ֤ךְ ט֭וֹב לְיִשְׂרָאֵ֥ל אֱלֹהִ֗ים
  לְבָרֵ֥י לֵבָֽב׃

  {2}וַאֲנִ֗י כִּ֭מְעַט נָטָ֣יוּ רַגְלָ֑י
  כְּ֝אַ֗יִן שֻׁפְּכ֥וּ אֲשֻׁרָֽי׃

  {3}כִּֽי־קִ֭נֵּאתִי בַּֽהוֹלְלִ֑ים
  שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה׃

  {4}כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְמוֹתָ֗ם
  וּבָרִ֥יא אוּלָֽם׃

  {5}בַּעֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑מוֹ
  וְעִם־אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ׃

  {6}לָ֭כֵן עֲנָקַ֣תְמוֹ גַאֲוָ֑ה
  יַעֲטָף־שִׁ֝֗ית חָמָ֥ס לָֽמוֹ׃

  {7}יָ֭צָא מֵחֵ֣לֶב עֵינֵ֑מוֹ
  עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃

  {8}יָמִ֤יקוּ ׀ וִידַבְּר֣וּ בְרָ֣ע עֹ֑שֶׁק
  מִמָּר֥וֹם יְדַבֵּֽרוּ׃

  {9}שַׁתּ֣וּ בַשָּׁמַ֣יִם פִּיהֶ֑ם
  וּ֝לְשׁוֹנָ֗ם תִּֽהֲלַ֥ךְ בָּאָֽרֶץ׃

  {10}לָכֵ֤ן ׀ יָשׁ֣וּב עַמּ֣וֹ הֲלֹ֑ם
  וּמֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽמוֹ׃

  {11}וְֽאָמְר֗וּ אֵיכָ֥ה יָדַֽע־אֵ֑ל
  וְיֵ֖שׁ דֵּעָ֣ה בְעֶלְיֽוֹן׃

  {12}הִנֵּה־אֵ֥לֶּה רְשָׁעִ֑ים
  וְשַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ־חָֽיִל׃
