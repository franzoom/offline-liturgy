title: Psaume 72-II
subtitle: null
commentary: null
biblicalReference: Ps 72(73), 13-20
shortReference: Ps 72
content: |-
  {13}אַךְ־רִ֭יק זִכִּ֣יתִי לְבָבִ֑י
  וָאֶרְחַ֖ץ בְּנִקָּי֣וֹן כַּפָּֽי׃

  {14}וָאֱהִ֣י נָ֭גוּעַ כָּל־הַיּ֑וֹם
  וְ֝תוֹכַחְתִּ֗י לַבְּקָרִֽים׃

  {15}אִם־אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ
  הִנֵּ֤ה ד֭וֹר בָּנֶ֣יךָ בָגָֽדְתִּי׃

  {16}וָֽ֭אֲחַשְּׁבָה לָדַ֣עַת זֹ֑את
  עָמָ֖ל ה֣וּא בְעֵינָֽי׃

  {17}עַד־אָ֭בוֹא אֶל־מִקְדְּשֵׁי־אֵ֑ל
  אָ֝בִ֗ינָה לְאַחֲרִיתָֽם׃

  {18}אַ֣ךְ בַּ֭חֲלָקוֹת תָּשִׁ֣ית לָ֑מוֹ
  הִ֝פַּלְתָּ֗ם לְמַשּׁוּאֽוֹת׃

  {19}אֵ֤יךְ הָי֣וּ לְשַׁמָּ֣ה כְרָ֑גַע
  סָ֥פוּ תַ֝֗מּוּ מִן־בַּלָּהֽוֹת׃

  {20}כַּחֲל֥וֹם מֵהָקִ֑יץ
  אֲ֝דֹנָי בָּעִ֤יר ׀ צַלְמָ֬ם תִּבְזֶֽה׃
