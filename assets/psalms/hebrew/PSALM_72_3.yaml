title: Psaume 72_3
subtitle: null
commentary: null
biblicalReference: Ps 72(73), 21-28
shortReference: Ps 72
content: |-
  {21}כִּ֭י יִתְחַמֵּ֣ץ לְבָבִ֑י
  וְ֝כִלְיוֹתַ֗י אֶשְׁתּוֹנָֽן׃

  {22}וַאֲנִי־בַ֭עַר וְלֹ֣א אֵדָ֑ע
  בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽךְ׃

  {23}וַאֲנִ֣י תָמִ֣יד עִמָּ֑ךְ
  אָ֝חַ֗זְתָּ בְּיַד־יְמִינִֽי׃

  {24}בַּעֲצָתְךָ֥ תַנְחֵ֑נִי
  וְ֝אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽנִי׃

  {25}מִי־לִ֥י בַשָּׁמָ֑יִם
  וְ֝עִמְּךָ֗ לֹא־חָפַ֥צְתִּי בָאָֽרֶץ׃

  {26}כָּלָ֥ה שְׁאֵרִ֗י וּלְבָ֫בִ֥י צוּר־לְבָבִ֥י וְחֶלְקִ֗י
  אֱלֹהִ֥ים לְעוֹלָֽם׃

  {27}כִּֽי־הִנֵּ֣ה רְחֵקֶ֣יךָ יֹאבֵ֑דוּ
  הִ֝צְמַ֗תָּה כָּל־זוֹנֶ֥ה מִמֶּֽךָּ׃

  {28}וַאֲנִ֤י ׀ קִֽרֲבַ֥ת אֱלֹהִ֗ים
  לִ֫י־ט֥וֹב שַׁתִּ֤י ׀ בַּאדֹנָ֣י יְהֹוִ֣ה מַחְסִ֑י
  לְ֝סַפֵּ֗ר כָּל־מַלְאֲכוֹתֶֽיךָ׃
