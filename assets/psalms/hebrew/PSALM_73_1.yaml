title: Psaume 73-I
subtitle: null
commentary: null
biblicalReference: Ps 73(74), 1-9
shortReference: Ps 73
content: |-
  {1}לָמָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָנֶ֑צַח
  יֶעְשַׁ֥ן אַ֝פְּךָ֗ בְּצֹ֣אן מַרְעִיתֶֽךָ׃

  {2}זְכֹ֤ר עֲדָתְךָ֨ ׀ קָ֘נִ֤יתָ קֶּ֗דֶם
  גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑ךָ
  הַר־צִ֝יּ֗וֹן זֶ֤ה ׀ שָׁכַ֬נְתָּ בּֽוֹ׃

  {3}הָרִ֣ימָה פְ֭עָמֶיךָ לְמַשֻּׁא֣וֹת נֶ֑צַח
  כָּל־הֵרַ֖ע אוֹיֵ֣ב בַּקֹּֽדֶשׁ׃

  {4}שָׁאֲג֣וּ צֹ֭רְרֶיךָ בְּקֶ֣רֶב מוֹעֲדֶ֑ךָ
  שָׂ֖מוּ אוֹתֹתָ֣ם אֹתֽוֹת׃

  {5}יִ֭וָּדַע כְּמֵבִ֣יא לְמָ֑עְלָה
  בִּֽסֲבָךְ־עֵ֝֗ץ קַרְדֻּמּֽוֹת׃

  {6}וְ֭עַתָּה פִּתּוּחֶ֣יהָ יָּ֑חַד
  בְּכַשִּׁ֥יל וְ֝כֵֽילַפֹּ֗ת יַהֲלֹמֽוּן׃

  {7}שִׁלְח֣וּ בָ֭אֵשׁ מִקְדָּשֶׁ֑ךָ
  לָ֝אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן־שְׁמֶֽךָ׃

  {8}אָמְר֣וּ בְ֭לִבָּם נִינָ֣ם יָ֑חַד
  שָׂרְפ֖וּ כָל־מוֹעֲדֵי־אֵ֣ל בָּאָֽרֶץ׃

  {9}אֽוֹתֹתֵ֗ינוּ
  לֹ֥א רָ֫אִ֥ינוּ אֵֽין־ע֥וֹד נָבִ֑יא
  וְלֹֽא־אִ֝תָּ֗נוּ יֹדֵ֥עַ עַד־מָֽה׃
