title: Psaume 73-II
subtitle: null
commentary: null
biblicalReference: Ps 73(74), 10-23
shortReference: Ps 73
content: |-
  {10}עַד־מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר
  יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְךָ֣ לָנֶֽצַח׃

  {11}לָ֤מָּה תָשִׁ֣יב יָ֭דְךָ וִֽימִינֶ֑ךָ
  מִקֶּ֖רֶב חֵֽיקְךָ֣ כַלֵּֽה׃

  {12}וֵ֭אלֹהִים מַלְכִּ֣י מִקֶּ֑דֶם
  פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּקֶ֣רֶב הָאָֽרֶץ׃

  {13}אַתָּ֤ה פוֹרַ֣רְתָּ בְעָזְּךָ֣ יָ֑ם
  שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים
  עַל־הַמָּֽיִם׃

  {14}אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן
  תִּתְּנֶ֥נּוּ מַ֝אֲכָ֗ל לְעָ֣ם לְצִיִּֽים׃

  {15}אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָנָ֑חַל
  אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃

  {16}לְךָ֣ י֭וֹם אַף־לְךָ֥ לָ֑יְלָה
  אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָשָֽׁמֶשׁ׃

  {17}אַתָּ֣ה הִ֭צַּבְתָּ כָּל־גְּבוּל֣וֹת אָ֑רֶץ
  קַ֥יִץ וָ֝חֹ֗רֶף אַתָּ֥ה יְצַרְתָּם׃

  {18}זְכָר־זֹ֗את א֭וֹיֵב חֵרֵ֣ף ׀ יְהוָ֑ה
  וְעַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽךָ׃

  {19}אַל־תִּתֵּ֣ן לְ֭חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑ךָ
  חַיַּ֥ת עֲ֝נִיֶּ֗יךָ
  אַל־תִּשְׁכַּ֥ח לָנֶֽצַח׃

  {20}הַבֵּ֥ט לַבְּרִ֑ית
  כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי־אֶ֝֗רֶץ
  נְא֣וֹת חָמָֽס׃

  {21}אַל־יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם
  עָנִ֥י וְ֝אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽךָ׃

  {22}קוּמָ֣ה אֱ֭לֹהִים רִיבָ֣ה רִיבֶ֑ךָ
  זְכֹ֥ר חֶרְפָּתְךָ֥ מִנִּי־נָ֝בָ֗ל
  כָּל־הַיּֽוֹם׃

  {23}אַל־תִּ֭שְׁכַּח ק֣וֹל צֹרְרֶ֑יךָ
  שְׁא֥וֹן קָ֝מֶ֗יךָ עֹלֶ֥ה תָמִֽיד׃
