title: Psaume 75_1
subtitle: null
commentary: null
biblicalReference: Ps 75(76), 2-7
shortReference: Ps 75
content: |-
  {2}נוֹדָ֣ע בִּֽיהוּדָ֣ה אֱלֹהִ֑ים
  בְּ֝יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽוֹ׃

  {3}וַיְהִ֣י בְשָׁלֵ֣ם סֻכּ֑וֹ
  וּמְע֖וֹנָת֣וֹ בְצִיּֽוֹן׃

  {4}שָׁ֭מָּה שִׁבַּ֣ר רִשְׁפֵי־קָ֑שֶׁת
  מָגֵ֬ן וְחֶ֖רֶב וּמִלְחָמָ֣ה סֶֽלָה׃

  {5}נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽהַרְרֵי־טָֽרֶף׃

  {6}אֶשְׁתּוֹלְל֨וּ ׀ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑ם
  וְלֹא־מָצְא֖וּ
  כָל־אַנְשֵׁי־חַ֣יִל יְדֵיהֶֽם׃

  {7}מִ֭גַּעֲרָ֣תְךָ אֱלֹהֵ֣י יַעֲקֹ֑ב
  נִ֝רְדָּ֗ם וְרֶ֣כֶב וָסֽוּס׃
