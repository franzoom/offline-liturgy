title: Psaume 75_2
subtitle: null
commentary: null
biblicalReference: Ps 75(76), 8-13
shortReference: Ps 75
content: |-
  {8}אַתָּ֤ה ׀ נ֥וֹרָא אַ֗תָּה
  וּמִֽי־יַעֲמֹ֥ד לְפָנֶ֗יךָ מֵאָ֥ז אַפֶּֽךָ׃

  {9}מִ֭שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין
  אֶ֖רֶץ יָֽרְאָ֣ה וְשָׁקָֽטָה׃

  {10}בְּקוּם־לַמִּשְׁפָּ֥ט אֱלֹהִ֑ים
  לְהוֹשִׁ֖יעַ כָּל־עַנְוֵי־אֶ֣רֶץ סֶֽלָה׃

  {11}כִּֽי־חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑ךָּ
  שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר׃

  {12}נִֽדֲר֣וּ וְשַׁלְּמוּ֮ לַיהוָ֪ה אֱֽלֹהֵ֫יכֶ֥ם כָּל־סְבִיבָ֑יו
  יוֹבִ֥ילוּ שַׁ֝֗י לַמּוֹרָֽא׃

  {13}יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים
  נ֝וֹרָ֗א לְמַלְכֵי־אָֽרֶץ׃
