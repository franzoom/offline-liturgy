title: Psaume 77-I
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 1-16
shortReference: Ps 77
content: |-
  {1}הַאֲזִ֣ינָה עַ֭מִּי תּוֹרָתִ֑י
  הַטּ֥וּ אָ֝זְנְכֶ֗ם לְאִמְרֵי־פִֽי׃

  {2}אֶפְתְּחָ֣ה בְמָשָׁ֣ל פִּ֑י
  אַבִּ֥יעָה חִ֝יד֗וֹת מִנִּי־קֶֽדֶם׃

  {3}אֲשֶׁ֣ר שָׁ֭מַעְנוּ וַנֵּדָעֵ֑ם
  וַ֝אֲבוֹתֵ֗ינוּ סִפְּרוּ־לָֽנוּ׃

  {4}לֹ֤א נְכַחֵ֨ד ׀ מִבְּנֵיהֶ֗ם לְד֥וֹר אַחֲר֗וֹן
  מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה
  וֶעֱזוּז֥וֹ וְ֝נִפְלְאוֹתָ֗יו
  אֲשֶׁ֣ר עָשָֽׂה׃

  {5}וַיָּ֤קֶם עֵד֨וּת ׀ בְּֽיַעֲקֹ֗ב
  וְתוֹרָה֮ שָׂ֤ם בְּיִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת־אֲבוֹתֵ֑ינוּ
  לְ֝הוֹדִיעָ֗ם לִבְנֵיהֶֽם׃

  {6}לְמַ֤עַן יֵדְע֨וּ ׀ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ
  יָ֝קֻ֗מוּ וִֽיסַפְּר֥וּ לִבְנֵיהֶֽם׃

  {7}וְיָשִׂ֥ימוּ בֵֽאלֹהִ֗ים
  כִּ֫סְלָ֥ם וְלֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי־אֵ֑ל
  וּמִצְוֺתָ֥יו יִנְצֹֽרוּ׃

  {8}וְלֹ֤א יִהְי֨וּ ׀ כַּאֲבוֹתָ֗ם
  דּוֹר֮ סוֹרֵ֪ר וּמֹ֫רֶ֥ה דּ֭וֹר לֹא־הֵכִ֣ין לִבּ֑וֹ
  וְלֹא־נֶאֶמְנָ֖ה אֶת־אֵ֣ל רוּחֽוֹ׃

  {9}בְּֽנֵי־אֶפְרַ֗יִם נוֹשְׁקֵ֥י רוֹמֵי־קָ֑שֶׁת
  הָ֝פְכ֗וּ בְּי֣וֹם קְרָֽב׃

  {10}לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים
  וּ֝בְתוֹרָת֗וֹ מֵאֲנ֥וּ לָלֶֽכֶת׃

  {11}וַיִּשְׁכְּח֥וּ עֲלִילוֹתָ֑יו
  וְ֝נִפְלְאוֹתָ֗יו אֲשֶׁ֣ר הֶרְאָֽם׃

  {12}נֶ֣גֶד אֲ֭בוֹתָם עָ֣שָׂה פֶ֑לֶא
  בְּאֶ֖רֶץ מִצְרַ֣יִם שְׂדֵה־צֹֽעַן׃

  {13}בָּ֣קַע יָ֭ם וַיַּֽעֲבִירֵ֑ם
  וַֽיַּצֶּב־מַ֥יִם כְּמוֹ־נֵֽד׃

  {14}וַיַּנְחֵ֣ם בֶּעָנָ֣ן יוֹמָ֑ם
  וְכָל־הַ֝לַּ֗יְלָה בְּא֣וֹר אֵֽשׁ׃

  {15}יְבַקַּ֣ע צֻ֭רִים בַּמִּדְבָּ֑ר
  וַ֝יַּ֗שְׁקְ כִּתְהֹמ֥וֹת רַבָּֽה׃

  {16}וַיּוֹצִ֣א נוֹזְלִ֣ים מִסָּ֑לַע
  וַיּ֖וֹרֶד כַּנְּהָר֣וֹת מָֽיִם׃
