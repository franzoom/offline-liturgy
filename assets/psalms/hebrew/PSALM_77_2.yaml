title: Psaume 77_2
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 17-31
shortReference: Ps 77
content: |-
  {17}וַיּוֹסִ֣יפוּ ע֭וֹד לַחֲטֹא־ל֑וֹ
  לַֽמְר֥וֹת עֶ֝לְי֗וֹן בַּצִּיָּֽה׃

  {18}וַיְנַסּוּ־אֵ֥ל בִּלְבָבָ֑ם
  לִֽשְׁאָל־אֹ֥כֶל לְנַפְשָֽׁם׃

  {19}וַֽיְדַבְּר֗וּ
  בֵּֽאלֹ֫הִ֥ים אָ֭מְרוּ הֲי֣וּכַל אֵ֑ל
  לַעֲרֹ֥ךְ שֻׁ֝לְחָ֗ן בַּמִּדְבָּֽר׃

  {20}הֵ֤ן הִכָּה־צ֨וּר ׀ וַיָּז֣וּבוּ מַיִם֮ וּנְחָלִ֪ים יִ֫שְׁטֹ֥פוּ הֲגַם־לֶ֭חֶם י֣וּכַל תֵּ֑ת
  אִם־יָכִ֖ין שְׁאֵ֣ר לְעַמּֽוֹ׃

  {21}לָכֵ֤ן ׀ שָׁמַ֥ע יְהוָ֗ה
  וַֽיִּתְעַבָּ֥ר וְ֭אֵשׁ נִשְּׂקָ֣ה בְיַעֲקֹ֑ב
  וְגַם־אַ֝֗ף עָלָ֥ה בְיִשְׂרָאֵֽל׃

  {22}כִּ֤י לֹ֣א הֶ֭אֱמִינוּ בֵּאלֹהִ֑ים
  וְלֹ֥א בָ֝טְח֗וּ בִּֽישׁוּעָתֽוֹ׃

  {23}וַיְצַ֣ו שְׁחָקִ֣ים מִמָּ֑עַל
  וְדַלְתֵ֖י שָׁמַ֣יִם פָּתָֽח׃

  {24}וַיַּמְטֵ֬ר עֲלֵיהֶ֣ם מָ֣ן לֶאֱכֹ֑ל
  וּדְגַן־שָׁ֝מַ֗יִם נָ֣תַן לָֽמוֹ׃

  {25}לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ
  צֵידָ֬ה שָׁלַ֖ח לָהֶ֣ם לָשֹֽׂבַע׃

  {26}יַסַּ֣ע קָ֭דִים בַּשָּׁמָ֑יִם
  וַיְנַהֵ֖ג בְּעֻזּ֣וֹ תֵימָֽן׃

  {27}וַיַּמְטֵ֬ר עֲלֵיהֶ֣ם כֶּעָפָ֣ר שְׁאֵ֑ר
  וּֽכְח֥וֹל יַ֝מִּ֗ים ע֣וֹף כָּנָֽף׃

  {28}וַ֭יַּפֵּל בְּקֶ֣רֶב מַחֲנֵ֑הוּ
  סָ֝בִ֗יב לְמִשְׁכְּנֹתָֽיו׃

  {29}וַיֹּאכְל֣וּ וַיִּשְׂבְּע֣וּ מְאֹ֑ד
  וְ֝תַֽאֲוָתָ֗ם יָבִ֥א לָהֶֽם׃

  {30}לֹא־זָר֥וּ מִתַּאֲוָתָ֑ם
  ע֝֗וֹד אָכְלָ֥ם בְּפִיהֶֽם׃

  {31}וְאַ֤ף אֱלֹהִ֨ים ׀ עָ֘לָ֤ה בָהֶ֗ם
  וַֽ֭יַּהֲרֹג בְּמִשְׁמַנֵּיהֶ֑ם
  וּבַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׃
