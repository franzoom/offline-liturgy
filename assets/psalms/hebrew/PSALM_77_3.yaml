title: Psaume 77-III
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 32-42
shortReference: Ps 77
content: |-
  {32}בְּכָל־זֹ֭את חָֽטְאוּ־ע֑וֹד
  וְלֹֽא־הֶ֝אֱמִ֗ינוּ בְּנִפְלְאוֹתָֽיו׃

  {33}וַיְכַל־בַּהֶ֥בֶל יְמֵיהֶ֑ם
  וּ֝שְׁנוֹתָ֗ם בַּבֶּהָלָֽה׃

  {34}אִם־הֲרָגָ֥ם וּדְרָשׁ֑וּהוּ
  וְ֝שָׁ֗בוּ וְשִֽׁחֲרוּ־אֵֽל׃

  {35}וַֽ֭יִּזְכְּרוּ כִּֽי־אֱלֹהִ֣ים צוּרָ֑ם
  וְאֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽם׃

  {36}וַיְפַתּ֥וּהוּ בְּפִיהֶ֑ם
  וּ֝בִלְשׁוֹנָ֗ם יְכַזְּבוּ־לֽוֹ׃

  {37}וְ֭לִבָּם לֹא־נָכ֣וֹן עִמּ֑וֹ
  וְלֹ֥א נֶ֝אֶמְנ֗וּ בִּבְרִיתֽוֹ׃

  {38}וְה֤וּא רַח֨וּם ׀ יְכַפֵּ֥ר עָוֺן֮ וְֽלֹא־יַ֫שְׁחִ֥ית וְ֭הִרְבָּה לְהָשִׁ֣יב אַפּ֑וֹ
  וְלֹֽא־יָ֝עִיר כָּל־חֲמָתֽוֹ׃

  {39}וַ֭יִּזְכֹּר כִּי־בָשָׂ֣ר הֵ֑מָּה
  ר֥וּחַ ה֝וֹלֵ֗ךְ וְלֹ֣א יָשֽׁוּב׃

  {40}כַּ֭מָּה יַמְר֣וּהוּ בַמִּדְבָּ֑ר
  יַ֝עֲצִיב֗וּהוּ בִּֽישִׁימֽוֹן׃

  {41}וַיָּשׁ֣וּבוּ וַיְנַסּ֣וּ אֵ֑ל
  וּקְד֖וֹשׁ יִשְׂרָאֵ֣ל הִתְווּ׃

  {42}לֹא־זָכְר֥וּ אֶת־יָד֑וֹ
  י֝֗וֹם אֲֽשֶׁר־פָּדָ֥ם מִנִּי־צָֽר׃
