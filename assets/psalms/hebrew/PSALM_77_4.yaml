title: Psaume 77-IV
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 43-51
shortReference: Ps 77
content: |-
  {43}אֲשֶׁר־שָׂ֣ם בְּ֭מִצְרַיִם אֹֽתוֹתָ֑יו
  וּ֝מוֹפְתָ֗יו בִּשְׂדֵה־צֹֽעַן׃

  {44}וַיַּהֲפֹ֣ךְ לְ֭דָם יְאֹרֵיהֶ֑ם
  וְ֝נֹזְלֵיהֶ֗ם בַּל־יִשְׁתָּיֽוּן׃

  {45}יְשַׁלַּ֬ח בָּהֶ֣ם עָ֭רֹב וַיֹּאכְלֵ֑ם
  וּ֝צְפַרְדֵּ֗עַ וַתַּשְׁחִיתֵֽם׃

  {46}וַיִּתֵּ֣ן לֶחָסִ֣יל יְבוּלָ֑ם
  וִֽ֝יגִיעָ֗ם לָאַרְבֶּֽה׃

  {47}יַהֲרֹ֣ג בַּבָּרָ֣ד גַּפְנָ֑ם
  וְ֝שִׁקְמוֹתָ֗ם בַּֽחֲנָמַֽל׃

  {48}וַיַּסְגֵּ֣ר לַבָּרָ֣ד בְּעִירָ֑ם
  וּ֝מִקְנֵיהֶ֗ם לָרְשָׁפִֽים׃

  {49}יְשַׁלַּח־בָּ֨ם ׀ חֲר֬וֹן אַפּ֗וֹ
  עֶבְרָ֣ה וָזַ֣עַם וְצָרָ֑ה
  מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים׃

  {50}יְפַלֵּ֥ס נָתִ֗יב
  לְאַ֫פּ֥וֹ לֹא־חָשַׂ֣ךְ מִמָּ֣וֶת נַפְשָׁ֑ם
  וְ֝חַיָּתָ֗ם לַדֶּ֥בֶר הִסְגִּֽיר׃

  {51}וַיַּ֣ךְ כָּל־בְּכ֣וֹר בְּמִצְרָ֑יִם
  רֵאשִׁ֥ית א֝וֹנִ֗ים בְּאָהֳלֵי־חָֽם׃
