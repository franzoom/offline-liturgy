title: Psaume 77-V
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 52-61
shortReference: Ps 77
content: |-
  {52}וַיַּסַּ֣ע כַּצֹּ֣אן עַמּ֑וֹ
  וַֽיְנַהֲגֵ֥ם כַּ֝עֵ֗דֶר בַּמִּדְבָּֽר׃

  {53}וַיַּנְחֵ֣ם לָ֭בֶטַח וְלֹ֣א פָחָ֑דוּ
  וְאֶת־א֝וֹיְבֵיהֶ֗ם כִּסָּ֥ה הַיָּֽם׃

  {54}וַ֭יְבִיאֵם אֶל־גְּב֣וּל קָדְשׁ֑וֹ
  הַר־זֶ֝֗ה קָנְתָ֥ה יְמִינֽוֹ׃

  {55}וַיְגָ֤רֶשׁ מִפְּנֵיהֶ֨ם ׀ גּוֹיִ֗ם
  וַֽ֭יַּפִּילֵם בְּחֶ֣בֶל נַחֲלָ֑ה
  וַיַּשְׁכֵּ֥ן בְּ֝אָהֳלֵיהֶ֗ם
  שִׁבְטֵ֥י יִשְׂרָאֵֽל׃

  {56}וַיְנַסּ֣וּ וַ֭יַּמְרוּ אֶת־אֱלֹהִ֣ים עֶלְי֑וֹן
  וְ֝עֵדוֹתָ֗יו לֹ֣א שָׁמָֽרוּ׃

  {57}וַיִּסֹּ֣גוּ וַֽ֭יִּבְגְּדוּ כַּאֲבוֹתָ֑ם
  נֶ֝הְפְּכ֗וּ כְּקֶ֣שֶׁת רְמִיָּֽה׃

  {58}וַיַּכְעִיס֥וּהוּ בְּבָמוֹתָ֑ם
  וּ֝בִפְסִילֵיהֶ֗ם יַקְנִיאֽוּהוּ׃

  {59}שָׁמַ֣ע אֱ֭לֹהִים וַֽיִּתְעַבָּ֑ר
  וַיִּמְאַ֥ס מְ֝אֹ֗ד בְּיִשְׂרָאֵֽל׃

  {60}וַ֭יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ
  אֹ֝֗הֶל שִׁכֵּ֥ן בָּאָדָֽם׃

  {61}וַיִּתֵּ֣ן לַשְּׁבִ֣י עֻזּ֑וֹ
  וְֽתִפְאַרְתּ֥וֹ בְיַד־צָֽר׃
