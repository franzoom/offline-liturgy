title: Psaume 77_6
subtitle: null
commentary: null
biblicalReference: Ps 77(78), 62-72
shortReference: Ps 77
content: |-
  {62}וַיַּסְגֵּ֣ר לַחֶ֣רֶב עַמּ֑וֹ
  וּ֝בְנַחֲלָת֗וֹ הִתְעַבָּֽר׃

  {63}בַּחוּרָ֥יו אָֽכְלָה־אֵ֑שׁ
  וּ֝בְתוּלֹתָ֗יו לֹ֣א הוּלָּֽלוּ׃

  {64}כֹּ֭הֲנָיו בַּחֶ֣רֶב נָפָ֑לוּ
  וְ֝אַלְמְנֹתָ֗יו לֹ֣א תִבְכֶּֽינָה׃

  {65}וַיִּקַ֖ץ כְּיָשֵׁ֥ן ׀ אֲדֹנָ֑י
  כְּ֝גִבּ֗וֹר מִתְרוֹנֵ֥ן מִיָּֽיִן׃

  {66}וַיַּךְ־צָרָ֥יו אָח֑וֹר
  חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽמוֹ׃

  {67}וַ֭יִּמְאַס בְּאֹ֣הֶל יוֹסֵ֑ף
  וּֽבְשֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃

  {68}וַ֭יִּבְחַר אֶת־שֵׁ֣בֶט יְהוּדָ֑ה
  אֶֽת־הַ֥ר צִ֝יּ֗וֹן אֲשֶׁ֣ר אָהֵֽב׃

  {69}וַיִּ֣בֶן כְּמוֹ־רָ֭מִים מִקְדָּשׁ֑וֹ
  כְּ֝אֶ֗רֶץ יְסָדָ֥הּ לְעוֹלָֽם׃

  {70}וַ֭יִּבְחַר בְּדָוִ֣ד עַבְדּ֑וֹ
  וַ֝יִּקָּחֵ֗הוּ מִֽמִּכְלְאֹ֥ת צֹֽאן׃

  {71}מֵאַחַ֥ר עָל֗וֹת
  הֱ֫בִיא֥וֹ לִ֭רְעוֹת בְּיַעֲקֹ֣ב עַמּ֑וֹ
  וּ֝בְיִשְׂרָאֵ֗ל נַחֲלָתֽוֹ׃

  {72}וַ֭יִּרְעֵם כְּתֹ֣ם לְבָב֑וֹ
  וּבִתְבוּנ֖וֹת כַּפָּ֣יו יַנְחֵֽם׃
