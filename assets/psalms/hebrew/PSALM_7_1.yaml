title: Psaume 7-I
subtitle: null
commentary: null
biblicalReference: Ps 7, 2-10
shortReference: Ps 7
content: |-
  {2}יְהוָ֣ה אֱ֭לֹהַי בְּךָ֣ חָסִ֑יתִי
  הוֹשִׁיעֵ֥נִי מִכָּל־רֹ֝דְפַ֗י
  וְהַצִּילֵֽנִי׃

  {3}פֶּן־יִטְרֹ֣ף כְּאַרְיֵ֣ה נַפְשִׁ֑י
  פֹּ֝רֵ֗ק וְאֵ֣ין מַצִּֽיל׃

  {4}יְהוָ֣ה אֱ֭לֹהַי אִם־עָשִׂ֣יתִי זֹ֑את
  אִֽם־יֶשׁ־עָ֥וֶל בְּכַפָּֽי׃

  {5}אִם־גָּ֭מַלְתִּי שֽׁוֹלְמִ֥י רָ֑ע
  וָאֲחַלְּצָ֖ה צוֹרְרִ֣י רֵיקָֽם׃

  {6}יִֽרַדֹּ֥ף אוֹיֵ֨ב ׀ נַפְשִׁ֡י וְיַשֵּׂ֗ג
  וְיִרְמֹ֣ס לָאָ֣רֶץ חַיָּ֑י
  וּכְבוֹדִ֓י ׀ לֶעָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׃

  {7}ק֘וּמָ֤ה יְהוָ֨ה ׀ בְּאַפֶּ֗ךָ
  הִ֭נָּשֵׂא בְּעַבְר֣וֹת צוֹרְרָ֑י
  וְע֥וּרָה אֵ֝לַ֗י מִשְׁפָּ֥ט צִוִּֽיתָ׃

  {8}וַעֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑ךָּ
  וְ֝עָלֶ֗יהָ לַמָּר֥וֹם שֽׁוּבָה׃

  {9}יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥נִי יְהוָ֑ה
  כְּצִדְקִ֖י וּכְתֻמִּ֣י עָלָֽי׃

  {10}יִגְמָר־נָ֬א רַ֨ע ׀ רְשָׁעִים֮ וּתְכוֹנֵ֪ן צַ֫דִּ֥יק וּבֹחֵ֣ן לִ֭בּ֗וֹת
  וּכְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק׃
