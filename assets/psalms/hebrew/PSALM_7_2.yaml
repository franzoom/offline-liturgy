title: Psaume 7-II
subtitle: null
commentary: null
biblicalReference: Ps 7, 11-18
shortReference: Ps 7
content: |-
  {11}מָֽגִנִּ֥י עַל־אֱלֹהִ֑ים
  מ֝וֹשִׁ֗יעַ יִשְׁרֵי־לֵֽב׃

  {12}אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק
  וְ֝אֵ֗ל זֹעֵ֥ם בְּכָל־יֽוֹם׃

  {13}אִם־לֹ֣א יָ֭שׁוּב חַרְבּ֣וֹ יִלְט֑וֹשׁ
  קַשְׁתּ֥וֹ דָ֝רַ֗ךְ וַֽיְכוֹנְנֶֽהָ׃

  {14}וְ֭לוֹ הֵכִ֣ין כְּלֵי־מָ֑וֶת
  חִ֝צָּ֗יו לְֽדֹלְקִ֥ים יִפְעָֽל׃

  {15}הִנֵּ֥ה יְחַבֶּל־אָ֑וֶן
  וְהָרָ֥ה עָ֝מָ֗ל וְיָ֣לַד שָֽׁקֶר׃

  {16}בּ֣וֹר כָּ֭רָֽה וַֽיַּחְפְּרֵ֑הוּ
  וַ֝יִּפֹּ֗ל בְּשַׁ֣חַת יִפְעָֽל׃

  {17}יָשׁ֣וּב עֲמָל֣וֹ בְרֹאשׁ֑וֹ
  וְעַ֥ל קָ֝דְקֳד֗וֹ חֲמָס֥וֹ יֵרֵֽד׃

  {18}אוֹדֶ֣ה יְהוָ֣ה כְּצִדְק֑וֹ
  וַ֝אֲזַמְּרָ֗ה שֵֽׁם־יְהוָ֥ה עֶלְיֽוֹן׃
