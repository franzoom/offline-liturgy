title: Psaume 85-I
subtitle: null
commentary: null
biblicalReference: Ps 85(86), 1-10
shortReference: Ps 85
content: |-
  {1}הַטֵּֽה־יְהוָ֣ה אָזְנְךָ֣ עֲנֵ֑נִי
  כִּֽי־עָנִ֖י וְאֶבְי֣וֹן אָֽנִי׃

  {2}שָֽׁמְרָ֣ה נַפְשִׁי֮ כִּֽי־חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּךָ אַתָּ֣ה אֱלֹהַ֑י
  הַבּוֹטֵ֥חַ אֵלֶֽיךָ׃

  {3}חָנֵּ֥נִי אֲדֹנָ֑י
  כִּ֥י אֵלֶ֥יךָ אֶ֝קְרָ֗א כָּל־הַיּֽוֹם׃

  {4}שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑ךָ
  כִּ֥י אֵלֶ֥יךָ אֲ֝דֹנָ֗י נַפְשִׁ֥י אֶשָּֽׂא׃

  {5}כִּֽי־אַתָּ֣ה אֲ֭דֹנָי ט֣וֹב וְסַלָּ֑ח
  וְרַב־חֶ֝֗סֶד לְכָל־קֹרְאֶֽיךָ׃

  {6}הַאֲזִ֣ינָה יְ֭הוָה תְּפִלָּתִ֑י
  וְ֝הַקְשִׁ֗יבָה בְּק֣וֹל תַּחֲנוּנוֹתָֽי׃

  {7}בְּי֣וֹם צָ֭רָתִ֥י אֶקְרָאֶ֗ךָּ
  כִּ֣י תַעֲנֵֽנִי׃

  {8}אֵין־כָּמ֖וֹךָ בָאֱלֹהִ֥ים ׀ אֲדֹנָ֗י
  וְאֵ֣ין כְּֽמַעֲשֶֽׂיךָ׃

  {9}כָּל־גּוֹיִ֤ם ׀ אֲשֶׁ֥ר עָשִׂ֗יתָ
  יָב֤וֹאוּ ׀ וְיִשְׁתַּחֲו֣וּ לְפָנֶ֣יךָ אֲדֹנָ֑י
  וִֽיכַבְּד֣וּ לִשְׁמֶֽךָ׃

  {10}כִּֽי־גָד֣וֹל אַ֭תָּה וְעֹשֵׂ֣ה נִפְלָא֑וֹת
  אַתָּ֖ה אֱלֹהִ֣ים לְבַדֶּֽךָ׃
