title: Psaume 85-II
subtitle: null
commentary: null
biblicalReference: Ps 85(86), 11-17
shortReference: Ps 85
content: |-
  {11}ה֘וֹרֵ֤נִי יְהוָ֨ה ׀ דַּרְכֶּ֗ךָ
  אֲהַלֵּ֥ךְ בַּאֲמִתֶּ֑ךָ
  יַחֵ֥ד לְ֝בָבִ֗י לְיִרְאָ֥ה שְׁמֶֽךָ׃

  {12}אוֹדְךָ֤ ׀ אֲדֹנָ֣י אֱ֭לֹהַי בְּכָל־לְבָבִ֑י
  וַאֲכַבְּדָ֖ה שִׁמְךָ֣ לְעוֹלָֽם׃

  {13}כִּֽי־חַ֭סְדְּךָ גָּד֣וֹל עָלָ֑י
  וְהִצַּ֥לְתָּ נַ֝פְשִׁ֗י
  מִשְּׁא֥וֹל תַּחְתִּיָּֽה׃

  {14}אֱלֹהִ֤ים ׀ זֵ֘דִ֤ים קָֽמוּ־עָלַ֗י
  וַעֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑י
  וְלֹ֖א שָׂמ֣וּךָ לְנֶגְדָּֽם׃

  {15}וְאַתָּ֣ה אֲ֭דֹנָי אֵל־רַח֣וּם וְחַנּ֑וּן
  אֶ֥רֶךְ אַ֝פַּ֗יִם וְרַב־חֶ֥סֶד וֶאֱמֶֽת׃

  {16}פְּנֵ֥ה אֵלַ֗י וְחָ֫נֵּ֥נִי תְּנָֽה־עֻזְּךָ֥ לְעַבְדֶּ֑ךָ
  וְ֝הוֹשִׁ֗יעָה לְבֶן־אֲמָתֶֽךָ׃

  {17}עֲשֵֽׂה־עִמִּ֥י א֗וֹת
  לְט֫וֹבָ֥ה וְיִרְא֣וּ שֹׂנְאַ֣י וְיֵבֹ֑שׁוּ
  כִּֽי־אַתָּ֥ה יְ֝הוָ֗ה
  עֲזַרְתַּ֥נִי וְנִחַמְתָּֽנִי׃
