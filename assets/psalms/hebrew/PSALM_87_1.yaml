title: Psaume 87-I
subtitle: null
commentary: null
biblicalReference: Ps 87(88), 2-10
shortReference: Ps 87
content: |-
  {2}יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑י
  יוֹם־צָעַ֖קְתִּי בַלַּ֣יְלָה נֶגְדֶּֽךָ׃

  {3}תָּב֣וֹא לְ֭פָנֶיךָ תְּפִלָּתִ֑י
  הַטֵּֽה־אָ֝זְנְךָ֗ לְרִנָּתִֽי׃

  {4}כִּֽי־שָֽׂבְעָ֣ה בְרָע֣וֹת נַפְשִׁ֑י
  וְחַיַּ֗י לִשְׁא֥וֹל הִגִּֽיעוּ׃

  {5}נֶ֭חְשַׁבְתִּי עִם־י֣וֹרְדֵי ב֑וֹר
  הָ֝יִ֗יתִי כְּגֶ֣בֶר אֵֽין־אֱיָֽל׃

  {6}בַּמֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים ׀ שֹׁ֥כְבֵי קֶ֗בֶר
  אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣ם ע֑וֹד
  וְ֝הֵ֗מָּה מִיָּדְךָ֥ נִגְזָֽרוּ׃

  {7}שַׁ֭תַּנִי בְּב֣וֹר תַּחְתִּיּ֑וֹת
  בְּ֝מַחֲשַׁכִּ֗ים בִּמְצֹלֽוֹת׃

  {8}עָ֭לַי סָמְכָ֣ה חֲמָתֶ֑ךָ
  וְכָל־מִ֝שְׁבָּרֶ֗יךָ עִנִּ֥יתָ סֶּֽלָה׃

  {9}הִרְחַ֥קְתָּ מְיֻדָּעַ֗י
  מִ֫מֶּ֥נִּי שַׁתַּ֣נִי תוֹעֵב֣וֹת לָ֑מוֹ
  כָּ֝לֻ֗א וְלֹ֣א אֵצֵֽא׃

  {10}עֵינִ֥י דָאֲבָ֗ה
  מִנִּ֫י עֹ֥נִי קְרָאתִ֣יךָ יְהוָ֣ה בְּכָל־י֑וֹם
  שִׁטַּ֖חְתִּי אֵלֶ֣יךָ כַפָּֽי׃
