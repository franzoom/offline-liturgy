title: Psaume 88_1
subtitle: null
commentary: null
biblicalReference: Ps 88(89), 2-19
shortReference: Ps 88
content: |-
  {2}חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה
  לְדֹ֥ר וָדֹ֓ר ׀ אוֹדִ֖יעַ אֱמוּנָתְךָ֣ בְּפִֽי׃

  {3}כִּֽי־אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה
  שָׁמַ֓יִם ׀ תָּכִ֖ן אֱמוּנָתְךָ֣ בָהֶֽם׃

  {4}כָּרַ֣תִּֽי בְ֭רִית לִבְחִירִ֑י
  נִ֝שְׁבַּ֗עְתִּי לְדָוִ֥ד עַבְדִּֽי׃

  {5}עַד־ע֭וֹלָם אָכִ֣ין זַרְעֶ֑ךָ
  וּבָנִ֨יתִי לְדֹר־וָד֖וֹר כִּסְאֲךָ֣ סֶֽלָה׃

  {6}וְי֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲךָ֣ יְהוָ֑ה
  אַף־אֱ֝מֽוּנָתְךָ֗ בִּקְהַ֥ל קְדֹשִֽׁים׃

  {7}כִּ֤י מִ֣י בַ֭שַּׁחַק יַעֲרֹ֣ךְ לַיהוָ֑ה
  יִדְמֶ֥ה לַ֝יהוָ֗ה בִּבְנֵ֥י אֵלִים׃

  {8}אֵ֣ל נַ֭עֲרָץ בְּסוֹד־קְדֹשִׁ֣ים רַבָּ֑ה
  וְ֝נוֹרָ֗א עַל־כָּל־סְבִיבָֽיו׃

  {9}יְהוָ֤ה ׀ אֱלֹ֘הֵ֤י צְבָא֗וֹת
  מִֽי־כָֽמ֖וֹךָ חֲסִ֥ין ׀ יָ֑הּ
  וֶ֝אֱמֽוּנָתְךָ֗ סְבִיבוֹתֶֽיךָ׃

  {10}אַתָּ֣ה מ֭וֹשֵׁל בְּגֵא֣וּת הַיָּ֑ם
  בְּשׂ֥וֹא גַ֝לָּ֗יו אַתָּ֥ה תְשַׁבְּחֵֽם׃

  {11}אַתָּ֤ה דִכִּ֣אתָ כֶחָלָ֣ל רָ֑הַב
  בִּזְר֥וֹעַ עֻ֝זְּךָ֗
  פִּזַּ֥רְתָּ אוֹיְבֶֽיךָ׃

  {12}לְךָ֣ שָׁ֭מַיִם אַף־לְךָ֥ אָ֑רֶץ
  תֵּבֵ֥ל וּ֝מְלֹאָ֗הּ אַתָּ֥ה יְסַדְתָּֽם׃

  {13}צָפ֣וֹן וְ֭יָמִין אַתָּ֣ה בְרָאתָ֑ם
  תָּב֥וֹר וְ֝חֶרְמ֗וֹן
  בְּשִׁמְךָ֥ יְרַנֵּֽנוּ׃

  {14}לְךָ֣ זְ֭רוֹעַ עִם־גְּבוּרָ֑ה
  תָּעֹ֥ז יָ֝דְךָ֗ תָּר֥וּם יְמִינֶֽךָ׃

  {15}צֶ֣דֶק וּ֭מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑ךָ
  חֶ֥סֶד וֶ֝אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽיךָ׃

  {16}אַשְׁרֵ֣י הָ֭עָם יוֹדְעֵ֣י תְרוּעָ֑ה
  יְ֝הוָ֗ה בְּֽאוֹר־פָּנֶ֥יךָ יְהַלֵּכֽוּן׃

  {17}בְּ֭שִׁמְךָ יְגִיל֣וּן כָּל־הַיּ֑וֹם
  וּבְצִדְקָתְךָ֥ יָרֽוּמוּ׃

  {18}כִּֽי־תִפְאֶ֣רֶת עֻזָּ֣מוֹ אָ֑תָּה
  וּ֝בִרְצֹנְךָ֗ תָּר֥וּם קַרְנֵֽנוּ׃

  {19}כִּ֣י לַֽ֭יהוָה מָֽגִנֵּ֑נוּ
  וְלִקְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽנוּ׃
