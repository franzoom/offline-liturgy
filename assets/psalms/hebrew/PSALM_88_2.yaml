title: Psaume 88-II
subtitle: null
commentary: null
biblicalReference: Ps 88(89), 20-30
shortReference: Ps 88
content: |-
  {20}אָ֤ז דִּבַּ֥רְתָּֽ־בְחָ֡זוֹן לַֽחֲסִידֶ֗יךָ
  וַתֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל־גִּבּ֑וֹר
  הֲרִימ֖וֹתִי בָח֣וּר מֵעָֽם׃

  {21}מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑י
  בְּשֶׁ֖מֶן קָדְשִׁ֣י מְשַׁחְתִּֽיו׃

  {22}אֲשֶׁ֣ר יָ֭דִי תִּכּ֣וֹן עִמּ֑וֹ
  אַף־זְרוֹעִ֥י תְאַמְּצֶֽנּוּ׃

  {23}לֹֽא־יַשִּׁ֣א אוֹיֵ֣ב בּ֑וֹ
  וּבֶן־עַ֝וְלָ֗ה לֹ֣א יְעַנֶּֽנּוּ׃

  {24}וְכַתּוֹתִ֣י מִפָּנָ֣יו צָרָ֑יו
  וּמְשַׂנְאָ֥יו אֶגּֽוֹף׃

  {25}וֶֽאֶֽמוּנָתִ֣י וְחַסְדִּ֣י עִמּ֑וֹ
  וּ֝בִשְׁמִ֗י תָּר֥וּם קַרְנֽוֹ׃

  {26}וְשַׂמְתִּ֣י בַיָּ֣ם יָד֑וֹ
  וּֽבַנְּהָר֥וֹת יְמִינֽוֹ׃

  {27}ה֣וּא יִ֭קְרָאֵנִי אָ֣בִי אָ֑תָּה
  אֵ֝לִ֗י וְצ֣וּר יְשׁוּעָתִֽי׃

  {28}אַף־אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑הוּ
  עֶ֝לְי֗וֹן לְמַלְכֵי־אָֽרֶץ׃

  {29}לְ֭עוֹלָ֗ם אֶשְׁמָר־ל֣וֹ חַסְדִּ֑י
  וּ֝בְרִיתִ֗י נֶאֱמֶ֥נֶת לֽוֹ׃

  {30}וְשַׂמְתִּ֣י לָעַ֣ד זַרְע֑וֹ
  וְ֝כִסְא֗וֹ כִּימֵ֥י שָׁמָֽיִם׃
