title: Psaume 88-III
subtitle: null
commentary: null
biblicalReference: Ps 88(89), 31-38
shortReference: Ps 88
content: |-
  {31}אִם־יַֽעַזְב֣וּ בָ֭נָיו תּוֹרָתִ֑י
  וּ֝בְמִשְׁפָּטַ֗י לֹ֣א יֵלֵכֽוּן׃

  {32}אִם־חֻקֹּתַ֥י יְחַלֵּ֑לוּ
  וּ֝מִצְוֺתַ֗י לֹ֣א יִשְׁמֹֽרוּ׃

  {33}וּפָקַדְתִּ֣י בְשֵׁ֣בֶט פִּשְׁעָ֑ם
  וּבִנְגָעִ֥ים עֲוֺנָֽם׃

  {34}וְ֭חַסְדִּי לֹֽא־אָפִ֣יר מֵֽעִמּ֑וֹ
  וְלֹֽא־אֲ֝שַׁקֵּ֗ר בֶּאֱמוּנָתִֽי׃

  {35}לֹא־אֲחַלֵּ֥ל בְּרִיתִ֑י
  וּמוֹצָ֥א שְׂ֝פָתַ֗י לֹ֣א אֲשַׁנֶּֽה׃

  {36}אַ֭חַת נִשְׁבַּ֣עְתִּי בְקָדְשִׁ֑י
  אִֽם־לְדָוִ֥ד אֲכַזֵּֽב׃

  {37}זַ֭רְעוֹ לְעוֹלָ֣ם יִהְיֶ֑ה
  וְכִסְא֖וֹ כַשֶּׁ֣מֶשׁ נֶגְדִּֽי׃

  {38}כְּ֭יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם
  וְעֵ֥ד בַּ֝שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
