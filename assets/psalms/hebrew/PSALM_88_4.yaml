title: Psaume 88-IV
subtitle: null
commentary: null
biblicalReference: Ps 88(89), 20-22,39-46
shortReference: Ps 88
content: |-
  {20}אָ֤ז דִּבַּ֥רְתָּֽ־בְחָ֡זוֹן לַֽחֲסִידֶ֗יךָ
  וַתֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל־גִּבּ֑וֹר
  הֲרִימ֖וֹתִי בָח֣וּר מֵעָֽם׃

  {21}מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑י
  בְּשֶׁ֖מֶן קָדְשִׁ֣י מְשַׁחְתִּֽיו׃

  {22}אֲשֶׁ֣ר יָ֭דִי תִּכּ֣וֹן עִמּ֑וֹ
  אַף־זְרוֹעִ֥י תְאַמְּצֶֽנּוּ׃

  {39}וְאַתָּ֣ה זָ֭נַחְתָּ וַתִּמְאָ֑ס
  הִ֝תְעַבַּ֗רְתָּ עִם־מְשִׁיחֶֽךָ׃

  {40}נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑ךָ
  חִלַּ֖לְתָּ לָאָ֣רֶץ נִזְרֽוֹ׃

  {41}פָּרַ֥צְתָּ כָל־גְּדֵרֹתָ֑יו
  שַׂ֖מְתָּ מִבְצָרָ֣יו מְחִתָּה׃

  {42}שַׁ֭סֻּהוּ כָּל־עֹ֣בְרֵי דָ֑רֶךְ
  הָיָ֥ה חֶ֝רְפָּ֗ה לִשְׁכֵנָֽיו׃

  {43}הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑יו
  הִ֝שְׂמַ֗חְתָּ כָּל־אוֹיְבָֽיו׃

  {44}אַף־תָּ֭שִׁיב צ֣וּר חַרְבּ֑וֹ
  וְלֹ֥א הֲ֝קֵימֹת֗וֹ בַּמִּלְחָמָֽה׃

  {45}הִשְׁבַּ֥תָּ מִטְּהָר֑וֹ
  וְ֝כִסְא֗וֹ לָאָ֥רֶץ מִגַּֽרְתָּה׃

  {46}הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑יו
  הֶֽעֱטִ֨יתָ עָלָ֖יו בּוּשָׁ֣ה סֶֽלָה׃
