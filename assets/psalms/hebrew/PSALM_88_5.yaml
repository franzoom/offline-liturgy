title: Psaume 88-V
subtitle: null
commentary: null
biblicalReference: Ps 88(89), 47-53
shortReference: Ps 88
content: |-
  {47}עַד־מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָנֶ֑צַח
  תִּבְעַ֖ר כְּמוֹ־אֵ֣שׁ חֲמָתֶֽךָ׃

  {48}זְכָר־אֲנִ֥י מֶה־חָ֑לֶד
  עַל־מַה־שָּׁ֝֗וְא
  בָּרָ֥אתָ כָל־בְּנֵי־אָדָֽם׃

  {49}מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְלֹ֣א יִרְאֶה־מָּ֑וֶת
  יְמַלֵּ֨ט נַפְשׁ֖וֹ מִיַּד־שְׁא֣וֹל סֶֽלָה׃

  {50}אַיֵּ֤ה ׀ חֲסָדֶ֖יךָ הָרִאשֹׁנִ֥ים ׀ אֲדֹנָ֑י
  נִשְׁבַּ֥עְתָּ לְ֝דָוִ֗ד בֶּאֱמוּנָתֶֽךָ׃

  {51}זְכֹ֣ר אֲ֭דֹנָי חֶרְפַּ֣ת עֲבָדֶ֑יךָ
  שְׂאֵתִ֥י בְ֝חֵיקִ֗י כָּל־רַבִּ֥ים עַמִּֽים׃

  {52}אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥יךָ ׀ יְהוָ֑ה
  אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽךָ׃

  {53}בָּר֖וּךְ יְהוָ֥ה לְ֝עוֹלָ֗ם
  אָ֘מֵ֥ן ׀ וְאָמֵֽן׃
