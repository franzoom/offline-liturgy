title: Psaume 91_1
subtitle: null
commentary: null
biblicalReference: Ps 91(92), 2-10
shortReference: Ps 91
content: |-
  {2}ט֗וֹב לְהֹד֥וֹת לַיהוָ֑ה
  וּלְזַמֵּ֖ר לְשִׁמְךָ֣ עֶלְיֽוֹן׃

  {3}לְהַגִּ֣יד בַּבֹּ֣קֶר חַסְֽדֶּ֑ךָ
  וֶ֝אֱמֽוּנָתְךָ֗ בַּלֵּילֽוֹת׃

  {4}עֲֽלֵי־עָ֭שׂוֹר וַעֲלֵי־נָ֑בֶל
  עֲלֵ֖י הִגָּי֣וֹן בְּכִנּֽוֹר׃

  {5}כִּ֤י שִׂמַּחְתַּ֣נִי יְהוָ֣ה בְּפָעֳלֶ֑ךָ
  בְּֽמַעֲשֵׂ֖י יָדֶ֣יךָ אֲרַנֵּֽן׃

  {6}מַה־גָּדְל֣וּ מַעֲשֶׂ֣יךָ יְהוָ֑ה
  מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽיךָ׃

  {7}אִֽישׁ־בַּ֭עַר לֹ֣א יֵדָ֑ע
  וּ֝כְסִ֗יל לֹא־יָבִ֥ין אֶת־זֹֽאת׃

  {8}בִּפְרֹ֤חַ רְשָׁעִ֨ים ׀ כְּמ֥וֹ עֵ֗שֶׂב
  וַ֭יָּצִיצוּ כָּל־פֹּ֣עֲלֵי אָ֑וֶן
  לְהִשָּֽׁמְדָ֥ם עֲדֵי־עַֽד׃

  {9}וְאַתָּ֥ה מָר֗וֹם לְעֹלָ֥ם יְהוָֽה׃

  {10}כִּ֤י הִנֵּ֪ה אֹיְבֶ֡יךָ ׀ יְֽהוָ֗ה
  כִּֽי־הִנֵּ֣ה אֹיְבֶ֣יךָ יֹאבֵ֑דוּ
  יִ֝תְפָּרְד֗וּ כָּל־פֹּ֥עֲלֵי אָֽוֶן׃
