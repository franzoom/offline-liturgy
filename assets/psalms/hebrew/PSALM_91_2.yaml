title: Psaume 91-II
subtitle: null
commentary: null
biblicalReference: Ps 91(92), 11-16
shortReference: Ps 91
content: |-
  {11}וַתָּ֣רֶם כִּרְאֵ֣ים קַרְנִ֑י
  בַּ֝לֹּתִ֗י בְּשֶׁ֣מֶן רַעֲנָֽן׃

  {12}וַתַּבֵּ֥ט עֵינִ֗י בְּשׁ֫וּרָ֥י בַּקָּמִ֖ים
  עָלַ֥י מְרֵעִ֗ים תִּשְׁמַ֥עְנָה אָזְנָֽי׃

  {13}צַ֭דִּיק כַּתָּמָ֣ר יִפְרָ֑ח
  כְּאֶ֖רֶז בַּלְּבָנ֣וֹן יִשְׂגֶּֽה׃

  {14}שְׁ֭תוּלִים בְּבֵ֣ית יְהוָ֑ה
  בְּחַצְר֖וֹת אֱלֹהֵ֣ינוּ יַפְרִֽיחוּ׃

  {15}ע֭וֹד יְנוּב֣וּן בְּשֵׂיבָ֑ה
  דְּשֵׁנִ֖ים וְרַֽעֲנַנִּ֣ים יִהְיֽוּ׃

  {16}לְ֭הַגִּיד כִּֽי־יָשָׁ֣ר יְהוָ֑ה
  צ֝וּרִ֗י וְֽלֹא־עַוְלָ֥תָה בּֽוֹ׃
