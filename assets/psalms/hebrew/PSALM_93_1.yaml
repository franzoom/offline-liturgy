title: Psaume 93-I
subtitle: null
commentary: null
biblicalReference: Ps 93(94), 1-11
shortReference: Ps 93
content: |-
  {1}אֵל־נְקָמ֥וֹת יְהוָ֑ה
  אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע׃

  {2}הִ֭נָּשֵׂא שֹׁפֵ֣ט הָאָ֑רֶץ
  הָשֵׁ֥ב גְּ֝מ֗וּל עַל־גֵּאִֽים׃

  {3}עַד־מָתַ֖י רְשָׁעִ֥ים ׀ יְהוָ֑ה
  עַד־מָ֝תַ֗י רְשָׁעִ֥ים יַעֲלֹֽזוּ׃

  {4}יַבִּ֣יעוּ יְדַבְּר֣וּ עָתָ֑ק
  יִֽ֝תְאַמְּר֗וּ כָּל־פֹּ֥עֲלֵי אָֽוֶן׃

  {5}עַמְּךָ֣ יְהוָ֣ה יְדַכְּא֑וּ
  וְֽנַחֲלָתְךָ֥ יְעַנּֽוּ׃

  {6}אַ֭לְמָנָה וְגֵ֣ר יַהֲרֹ֑גוּ
  וִֽיתוֹמִ֣ים יְרַצֵּֽחוּ׃

  {7}וַ֭יֹּ֣אמְרוּ לֹ֣א יִרְאֶה־יָּ֑הּ
  וְלֹא־יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב׃

  {8}בִּ֭ינוּ בֹּעֲרִ֣ים בָּעָ֑ם
  וּ֝כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃

  {9}הֲנֹ֣טַֽע אֹ֭זֶן הֲלֹ֣א יִשְׁמָ֑ע
  אִֽם־יֹ֥צֵֽר עַ֝֗יִן הֲלֹ֣א יַבִּֽיט׃

  {10}הֲיֹסֵ֣ר גּ֭וֹיִם הֲלֹ֣א יוֹכִ֑יחַ
  הַֽמְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃

  {11}יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם
  כִּי־הֵ֥מָּה הָֽבֶל׃
