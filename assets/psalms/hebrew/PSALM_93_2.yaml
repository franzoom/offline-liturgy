title: Psaume 93_2
subtitle: null
commentary: null
biblicalReference: Ps 93(94), 12-23
shortReference: Ps 93
content: |-
  {12}אַשְׁרֵ֤י ׀ הַגֶּ֣בֶר אֲשֶׁר־תְּיַסְּרֶ֣נּוּ יָּ֑הּ
  וּֽמִתּוֹרָתְךָ֥ תְלַמְּדֶֽנּוּ׃

  {13}לְהַשְׁקִ֣יט ל֭וֹ מִ֣ימֵי רָ֑ע
  עַ֤ד יִכָּרֶ֖ה לָרָשָׁ֣ע שָֽׁחַת׃

  {14}כִּ֤י ׀ לֹא־יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑וֹ
  וְ֝נַחֲלָת֗וֹ לֹ֣א יַעֲזֹֽב׃

  {15}כִּֽי־עַד־צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט
  וְ֝אַחֲרָ֗יו כָּל־יִשְׁרֵי־לֵֽב׃

  {16}מִֽי־יָק֣וּם לִ֭י עִם־מְרֵעִ֑ים
  מִֽי־יִתְיַצֵּ֥ב לִ֝י עִם־פֹּ֥עֲלֵי אָֽוֶן׃

  {17}לוּלֵ֣י יְ֭הוָה עֶזְרָ֣תָה לִּ֑י
  כִּמְעַ֓ט ׀ שָֽׁכְנָ֖ה דוּמָ֣ה נַפְשִֽׁי׃

  {18}אִם־אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑י
  חַסְדְּךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽנִי׃

  {19}בְּרֹ֣ב שַׂרְעַפַּ֣י בְּקִרְבִּ֑י
  תַּ֝נְחוּמֶ֗יךָ יְֽשַׁעַשְׁע֥וּ נַפְשִֽׁי׃

  {20}הַֽ֭יְחָבְרְךָ כִּסֵּ֣א הַוּ֑וֹת
  יֹצֵ֖ר עָמָ֣ל עֲלֵי־חֹֽק׃

  {21}יָ֭גוֹדּוּ עַל־נֶ֣פֶשׁ צַדִּ֑יק
  וְדָ֖ם נָקִ֣י יַרְשִֽׁיעוּ׃

  {22}וַיְהִ֬י יְהוָ֣ה לִ֣י לְמִשְׂגָּ֑ב
  וֵ֝אלֹהַ֗י לְצ֣וּר מַחְסִֽי׃

  {23}וַיָּ֤שֶׁב עֲלֵיהֶ֨ם ׀ אֶת־אוֹנָ֗ם
  וּבְרָעָתָ֥ם יַצְמִיתֵ֑ם
  יַ֝צְמִיתֵ֗ם יְהוָ֥ה אֱלֹהֵֽינוּ׃
