title: Psaume 95_1
subtitle: null
commentary: null
biblicalReference: Ps 95(96), 1-6
shortReference: Ps 95
content: |-
  {1}שִׁ֣ירוּ לַ֭יהוָה שִׁ֣יר חָדָ֑שׁ
  שִׁ֥ירוּ לַ֝יהוָ֗ה כָּל־הָאָֽרֶץ׃

  {2}שִׁ֣ירוּ לַ֭יהוָה בָּרֲכ֣וּ שְׁמ֑וֹ
  בַּשְּׂר֥וּ מִיּֽוֹם־לְ֝י֗וֹם יְשׁוּעָתֽוֹ׃

  {3}סַפְּר֣וּ בַגּוֹיִ֣ם כְּבוֹד֑וֹ
  בְּכָל־הָֽ֝עַמִּ֗ים נִפְלְאוֹתָֽיו׃

  {4}כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּמְהֻלָּ֣ל מְאֹ֑ד
  נוֹרָ֥א ה֝֗וּא עַל־כָּל־אֱלֹהִֽים׃

  {5}כִּ֤י ׀ כָּל־אֱלֹהֵ֣י הָעַמִּ֣ים אֱלִילִ֑ים
  וַֽ֝יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׃

  {6}הוֹד־וְהָדָ֥ר לְפָנָ֑יו
  עֹ֥ז וְ֝תִפְאֶ֗רֶת בְּמִקְדָּשֽׁוֹ׃
