title: Psaume 9a-I
subtitle: null
commentary: null
biblicalReference: Ps 9A(9), 2-13
shortReference: Ps 9A
content: |-
  {2}אוֹדֶ֣ה יְ֭הוָה בְּכָל־לִבִּ֑י
  אֲ֝סַפְּרָ֗ה כָּל־נִפְלְאוֹתֶֽיךָ׃

  {3}אֶשְׂמְחָ֣ה וְאֶעֶלְצָ֣ה בָ֑ךְ
  אֲזַמְּרָ֖ה שִׁמְךָ֣ עֶלְיֽוֹן׃

  {4}בְּשׁוּב־אוֹיְבַ֥י אָח֑וֹר
  יִכָּשְׁל֥וּ וְ֝יֹאבְד֗וּ מִפָּנֶֽיךָ׃

  {5}כִּֽי־עָ֭שִׂיתָ מִשְׁפָּטִ֣י וְדִינִ֑י
  יָשַׁ֥בְתָּ לְ֝כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק׃

  {6}גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע
  שְׁמָ֥ם מָ֝חִ֗יתָ לְעוֹלָ֥ם וָעֶֽד׃

  {7}הָֽאוֹיֵ֨ב ׀ תַּ֥מּוּ חֳרָב֗וֹת
  לָ֫נֶ֥צַח וְעָרִ֥ים נָתַ֑שְׁתָּ
  אָבַ֖ד זִכְרָ֣ם הֵֽמָּה׃

  {8}וַֽ֭יהוָה לְעוֹלָ֣ם יֵשֵׁ֑ב
  כּוֹנֵ֖ן לַמִּשְׁפָּ֣ט כִּסְאֽוֹ׃

  {9}וְה֗וּא יִשְׁפֹּֽט־תֵּבֵ֥ל בְּצֶ֑דֶק
  יָדִ֥ין לְ֝אֻמִּ֗ים בְּמֵישָׁרִֽים׃

  {10}וִ֘יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַדָּ֑ךְ
  מִ֝שְׂגָּ֗ב לְעִתּ֥וֹת בַּצָּרָֽה׃

  {11}וְיִבְטְח֣וּ בְ֭ךָ יוֹדְעֵ֣י שְׁמֶ֑ךָ
  כִּ֤י לֹֽא־עָזַ֖בְתָּ דֹרְשֶׁ֣יךָ יְהוָֽה׃

  {12}זַמְּר֗וּ לַ֭יהוָה יֹשֵׁ֣ב צִיּ֑וֹן
  הַגִּ֥ידוּ בָ֝עַמִּ֗ים עֲלִֽילוֹתָֽיו׃

  {13}כִּֽי־דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣ם זָכָ֑ר
  לֹֽא־שָׁ֝כַ֗ח צַעֲקַ֥ת עֲנָוִֽים׃
