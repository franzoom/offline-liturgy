title: Psaume 9A_2
subtitle: null
commentary: null
biblicalReference: Ps 9A(9), 14-21
shortReference: Ps 9A
content: |-
  {14}חָֽנְנֵ֬נִי יְהוָ֗ה
  רְאֵ֣ה עָ֭נְיִי מִשֹּׂנְאָ֑י
  מְ֝רוֹמְמִ֗י מִשַּׁ֥עֲרֵי מָֽוֶת׃

  {15}לְמַ֥עַן אֲסַפְּרָ֗ה
  כָּֽל־תְּהִלָּ֫תֶ֥יךָ בְּשַֽׁעֲרֵ֥י בַת־צִיּ֑וֹן
  אָ֝גִ֗ילָה בִּישׁוּעָתֶֽךָ׃

  {16}טָבְע֣וּ ג֭וֹיִם בְּשַׁ֣חַת עָשׂ֑וּ
  בְּרֶֽשֶׁת־ז֥וּ טָ֝מָ֗נוּ
  נִלְכְּדָ֥ה רַגְלָֽם׃

  {17}נ֤וֹדַ֨ע ׀ יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּפֹ֣עַל כַּ֭פָּיו נוֹקֵ֣שׁ רָשָׁ֑ע
  הִגָּי֥וֹן סֶֽלָה׃

  {18}יָשׁ֣וּבוּ רְשָׁעִ֣ים לִשְׁא֑וֹלָה
  כָּל־גּ֝וֹיִ֗ם שְׁכֵחֵ֥י אֱלֹהִֽים׃

  {19}כִּ֤י לֹ֣א לָ֭נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן
  תִּקְוַ֥ת עֲ֝נִיִּ֗ים תֹּאבַ֥ד לָעַֽד׃

  {20}קוּמָ֣ה יְ֭הוָה אַל־יָעֹ֣ז אֱנ֑וֹשׁ
  יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל־פָּנֶֽיךָ׃

  {21}שִׁ֘יתָ֤ה יְהוָ֨ה ׀ מוֹרָ֗ה
  לָ֫הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם
  אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׃
