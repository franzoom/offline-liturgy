title: Psaume 9b-I
subtitle: null
commentary: null
biblicalReference: Ps 9B(10), 1-11
shortReference: Ps 9B
content: |-
  {1}לָמָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּרָח֑וֹק
  תַּ֝עְלִ֗ים לְעִתּ֥וֹת בַּצָּרָֽה׃

  {2}בְּגַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י
  יִתָּפְשׂ֓וּ ׀ בִּמְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׃

  {3}כִּֽי־הִלֵּ֣ל רָ֭שָׁע עַל־תַּאֲוַ֣ת נַפְשׁ֑וֹ
  וּבֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ ׀ יְהוָֽה׃

  {4}רָשָׁ֗ע כְּגֹ֣בַהּ אַ֭פּוֹ בַּל־יִדְרֹ֑שׁ
  אֵ֥ין אֱ֝לֹהִ֗ים כָּל־מְזִמּוֹתָֽיו׃

  {5}יָ֘חִ֤ילוּ דְרָכָ֨יו ׀ בְּכָל־עֵ֗ת
  מָר֣וֹם מִ֭שְׁפָּטֶיךָ מִנֶּגְדּ֑וֹ
  כָּל־צ֝וֹרְרָ֗יו יָפִ֥יחַ בָּהֶֽם׃

  {6}אָמַ֣ר בְּ֭לִבּוֹ בַּל־אֶמּ֑וֹט
  לְדֹ֥ר וָ֝דֹ֗ר אֲשֶׁ֣ר לֹֽא־בְרָֽע׃

  {7}אָלָ֤ה פִּ֣יהוּ מָ֭לֵא וּמִרְמ֣וֹת וָתֹ֑ךְ
  תַּ֥חַת לְ֝שׁוֹנ֗וֹ עָמָ֥ל וָאָֽוֶן׃

  {8}יֵשֵׁ֤ב ׀ בְּמַאְרַ֬ב חֲצֵרִ֗ים
  בַּֽ֭מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י
  עֵ֝ינָ֗יו לְֽחֵלְכָ֥ה יִצְפֹּֽנוּ׃

  {9}יֶאֱרֹ֬ב בַּמִּסְתָּ֨ר ׀ כְּאַרְיֵ֬ה בְסֻכֹּ֗ה
  יֶ֭אֱרֹב לַחֲט֣וֹף עָנִ֑י
  יַחְטֹ֥ף עָ֝נִ֗י בְּמָשְׁכ֥וֹ בְרִשְׁתּֽוֹ׃

  {10}יִדְכֶּ֥ה יָשֹׁ֑חַ
  וְנָפַ֥ל בַּ֝עֲצוּמָ֗יו חֵ֣יל׃

  {11}אָמַ֣ר בְּ֭לִבּוֹ שָׁ֣כַֽח אֵ֑ל
  הִסְתִּ֥יר פָּ֝נָ֗יו בַּל־רָאָ֥ה לָנֶֽצַח׃
