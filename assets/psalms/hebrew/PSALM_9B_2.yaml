title: Psaume 9B_2
subtitle: null
commentary: null
biblicalReference: Ps 9B(10), 12-18
shortReference: Ps 9B
content: |-
  {12}קוּמָ֤ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑ךָ
  אַל־תִּשְׁכַּ֥ח עֲנָוִֽים׃

  {13}עַל־מֶ֤ה ׀ נִאֵ֖ץ רָשָׁ֥ע ׀ אֱלֹהִ֑ים
  אָמַ֥ר בְּ֝לִבּ֗וֹ לֹ֣א תִּדְרֹֽשׁ׃

  {14}רָאִ֡תָה כִּֽי־אַתָּ֤ה ׀ עָ֘מָ֤ל
  וָכַ֨עַס ׀ תַּבִּיט֮ לָתֵ֪ת בְּיָ֫דֶ֥ךָ עָ֭לֶיךָ יַעֲזֹ֣ב חֵלֶ֑כָה
  יָ֝ת֗וֹם אַתָּ֤ה ׀ הָיִ֬יתָ עוֹזֵֽר׃

  {15}שְׁ֭בֹר זְר֣וֹעַ רָשָׁ֑ע
  וָ֝רָ֗ע תִּֽדְרוֹשׁ־רִשְׁע֥וֹ בַל־תִּמְצָֽא׃

  {16}יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָעֶ֑ד
  אָבְד֥וּ ג֝וֹיִ֗ם מֵֽאַרְצֽוֹ׃

  {17}תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה
  תָּכִ֥ין לִ֝בָּ֗ם תַּקְשִׁ֥יב אָזְנֶֽךָ׃

  {18}לִשְׁפֹּ֥ט יָת֗וֹם
  וָ֫דָ֥ךְ בַּל־יוֹסִ֥יף ע֑וֹד
  לַעֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן־הָאָֽרֶץ׃
