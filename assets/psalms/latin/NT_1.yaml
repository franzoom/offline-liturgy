title: Cantique de Marie
subtitle: null
commentary: null
biblicalReference: Lc 1, 46-55
shortReference: NT 1
content: |-
  {47}Magníficat ánima méa Dóminum,
  et exsultávit spíritus méus in Déo salvatóre méo,

  {48}quia respéxit humilitátem ancíllae súae.
  Ecce enim ex hoc beátam me dícent ómnes generatiónes,

  {49}quia fécit míhi mágna, qui pótens est,
  et sánctum nómen éius,

  {50}et misericórdia éius in progénies et progénies
  timéntibus éum.

  {51}Fécit poténtiam in bráchio súo,
  dispérsit supérbos ménte córdis súi;

  {52}depósuit poténtes de séde
  et exaltávit húmiles;

  {53}esuriéntes implévit bónis
  et dívites dimísit inánes.

  {54}Suscépit Israel púerum súum,
  recordátus misericórdiae,

  {55}sicut locútus est ad pátres nóstros,
  Abraham et sémini éius in saécula.
