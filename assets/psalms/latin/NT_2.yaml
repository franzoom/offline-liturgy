title: Cantique de Zacharie
subtitle: null
commentary: null
biblicalReference: Lc 1, 68-79
shortReference: NT 2
content: |-
  {68}Benedíctus Dóminus, Déus Israel,
  quia visitávit et fécit redemptiónem plébi súae

  {69}et eréxit córnu sálutis nóbis
  in dómo David púeri súi,

  {70}sicut locútus est per os sánctorum,
  qui a saéculo sunt, prophetárum éius,

  {71}sálutem ex inímicis nóstris
  et de mánu ómnium, qui odérunt nos;

  {72}ad faciéndam misericórdiam cum pátribus nóstris
  et memorári testaménti súi sáncti,

  {73}iusiurándum, quod iurávit ad Abraham pátrem nóstrum,
  datúrum se nóbis,

  {74}ut síne timóre, de mánu inimicórum liberáti,
  serviámus ílli

  {75}in sanctitáte et iustítia córam ípso
  ómnibus diébus nóstris.

  {76}Et tu, púer, própheta Altíssimi vocáberis:
  práeibis enim ánte fáciem Dómini paráre vías éius,

  {77}ad dándam sciéntiam sálutis plébi éius
  in remissiónem peccatórum eórum,

  {78}per víscera misericórdiae Déi nóstri,
  in quíbus visitábit nos óriens ex álto,

  {79}illumináre his, qui in ténebris et in úmbra mórtis sédent,
  ad dirigéndos pédes nóstros in víam pácis.
