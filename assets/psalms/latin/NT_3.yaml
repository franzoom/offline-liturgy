title: Nunc dimittis
subtitle: null
commentary: null
biblicalReference: Lc 2, 29-32
shortReference: NT 3
content: |-
  {29}Nunc dimíttis sérvum túum, Dómine,
  secúndum vérbum túum in páce,

  {30}quia vidérunt óculi méi salutáre túum,

  {31}quod parásti ánte fáciem ómnium populórum,

  {32}lúmen ad revelatiónem géntium
  et glóriam plébis túae Israel.
